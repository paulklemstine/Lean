  <rect x="20" y="420" width="860" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>

  <text x="130" y="450" text-anchor="middle" fill="#3fb950" font-size="28" font-weight="bold">60+</text>
  <text x="130" y="475" text-anchor="middle" fill="#8b949e" font-size="11">Verified Theorems</text>

  <text x="310" y="450" text-anchor="middle" fill="#a78bfa" font-size="28" font-weight="bold">0</text>
  <text x="310" y="475" text-anchor="middle" fill="#8b949e" font-size="11">Remaining Sorries</text>

  <text x="490" y="450" text-anchor="middle" fill="#48dbfb" font-size="28" font-weight="bold">8</text>
  <text x="490" y="475" text-anchor="middle" fill="#8b949e" font-size="11">Questions Answered</text>

  <text x="670" y="450" text-anchor="middle" fill="#feca57" font-size="28" font-weight="bold">7</text>
  <text x="670" y="475" text-anchor="middle" fill="#8b949e" font-size="11">New Directions</text>

  <!-- New in v7 highlight -->
  <rect x="20" y="515" width="860" height="70" rx="10" fill="rgba(136,100,255,0.06)" stroke="rgba(136,100,255,0.2)"/>
  <text x="450" y="540" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">
    ★ v7 Breakthrough: Parent Existence Theorem Formally Verified
  </text>
  <text x="450" y="560" text-anchor="middle" fill="#8b949e" font-size="11">
    For every primitive Pythagorean triple (a,b,c) with gcd(a,b)=1, a,b,c &gt; 0, c &gt; 5:
  </text>
  <text x="450" y="575" text-anchor="middle" fill="#ccc" font-size="11">
    exactly one of invB₁, invB₂, invB₃ produces a triple with all positive components
  </text>
