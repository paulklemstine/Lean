    <text x="450" y="53" text-anchor="middle" fill="#8b949e" font-size="10">Unipotent power formula verified</text>

    <rect x="600" y="0" width="280" height="70" rx="5" fill="rgba(136,100,255,0.08)" stroke="rgba(136,100,255,0.2)"/>
    <text x="740" y="20" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">#42 Commutators</text>
    <text x="740" y="38" text-anchor="middle" fill="#8b949e" font-size="10">All pairs noncommutative</text>
    <text x="740" y="53" text-anchor="middle" fill="#8b949e" font-size="10">Products computed explicitly</text>
  </g>

