    <text x="105" y="38" text-anchor="middle" fill="#8b949e" font-size="9">B₃ = S·B₁·S conjugacy</text>

    <rect x="200" y="0" width="170" height="55" rx="5" fill="rgba(63,185,80,0.08)" stroke="rgba(63,185,80,0.2)"/>
