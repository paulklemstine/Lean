    <text x="780" y="20" text-anchor="middle" fill="#d2992a" font-size="11" font-weight="bold">#9 Zeta Function</text>
    <text x="780" y="38" text-anchor="middle" fill="#8b949e" font-size="9">Berggren tree zeta fn</text>
  </g>

