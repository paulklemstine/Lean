    <text x="635" y="38" text-anchor="middle" fill="#8b949e" font-size="9">h = log 3 exactly</text>

    <rect x="720" y="0" width="160" height="55" rx="5" fill="rgba(63,185,80,0.08)" stroke="rgba(63,185,80,0.2)"/>
    <text x="800" y="20" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">#39 Complexity</text>
    <text x="800" y="38" text-anchor="middle" fill="#8b949e" font-size="9">O(log c) optimal</text>
