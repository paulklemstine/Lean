<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1a4e;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#48dbfb"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#feca57"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">
    Conjugacy Symmetry: B₃ = S · B₁ · S
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#aab" font-size="12">
    The leg-swap permutation S reveals hidden symmetry in the Berggren tree
  </text>

  <!-- Left panel: Matrix equations -->
  <rect x="30" y="75" width="350" height="180" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
  <text x="205" y="100" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Matrix Identities</text>

  <text x="50" y="130" fill="#ff9999" font-size="13">S · B₁ · S = B₃</text>
  <text x="280" y="130" fill="#6f6" font-size="13">✓ verified</text>

  <text x="50" y="155" fill="#ff9999" font-size="13">S · B₃ · S = B₁</text>
  <text x="280" y="155" fill="#6f6" font-size="13">✓ verified</text>

  <text x="50" y="180" fill="#80e0ff" font-size="13">S · B₂ · S = B₂</text>
  <text x="280" y="180" fill="#6f6" font-size="13">✓ verified</text>

  <text x="50" y="205" fill="#ddd" font-size="13">S² = I, det(S) = −1</text>
  <text x="280" y="205" fill="#6f6" font-size="13">✓ verified</text>

  <text x="50" y="230" fill="#ddd" font-size="13">SᵀQS = Q (Lorentz)</text>
  <text x="280" y="230" fill="#6f6" font-size="13">✓ verified</text>

  <!-- Right panel: Geometric picture -->
  <rect x="420" y="75" width="350" height="180" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
  <text x="595" y="100" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Geometric Meaning</text>

  <!-- Unit circle quadrant -->
  <line x1="470" y1="230" x2="740" y2="230" stroke="#555" stroke-width="1"/>
  <line x1="470" y1="230" x2="470" y2="110" stroke="#555" stroke-width="1"/>
  <!-- 45° line -->
  <line x1="470" y1="230" x2="700" y2="110" stroke="#ff9" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="710" y="108" fill="#ff9" font-size="10">θ = 45°</text>

  <!-- A-branch region -->
  <path d="M470,230 L700,110 L740,180" fill="rgba(255,107,107,0.15)" stroke="none"/>
  <text x="650" y="175" fill="#ff9999" font-size="11">A (a > b)</text>

  <!-- C-branch region -->
  <path d="M470,230 L700,110 L540,110" fill="rgba(254,202,87,0.15)" stroke="none"/>
  <text x="560" y="140" fill="#ffdd77" font-size="11">C (b > a)</text>

  <!-- Mirror arrow -->
  <text x="595" y="165" fill="#ff9" font-size="16">⟷</text>
  <text x="595" y="180" text-anchor="middle" fill="#ff9" font-size="9">S: (a,b)↔(b,a)</text>

  <!-- B-branch near 45° -->
  <circle cx="620" cy="140" r="15" fill="rgba(72,219,251,0.2)" stroke="#48dbfb" stroke-width="1"/>
  <text x="620" y="130" text-anchor="middle" fill="#80e0ff" font-size="9">B</text>
  <text x="620" y="143" text-anchor="middle" fill="#80e0ff" font-size="9">(a≈b)</text>

  <!-- Bottom: Consequences -->
  <rect x="30" y="280" width="740" height="200" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <text x="400" y="310" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">
    Consequences of the Conjugacy
  </text>

  <!-- Three columns -->
  <text x="160" y="340" text-anchor="middle" fill="#ff9999" font-size="13" font-weight="bold">Spectral</text>
  <text x="160" y="360" fill="#ccc" font-size="11" text-anchor="middle">B₁ and B₃ share</text>
  <text x="160" y="375" fill="#ccc" font-size="11" text-anchor="middle">characteristic polynomial</text>
  <text x="160" y="390" fill="#ccc" font-size="11" text-anchor="middle">(x−1)³</text>
  <text x="160" y="410" fill="#aab" font-size="10" text-anchor="middle">Both parabolic (ρ = 1)</text>
  <text x="160" y="425" fill="#aab" font-size="10" text-anchor="middle">Same Lyapunov exponent</text>
  <text x="160" y="445" fill="#aab" font-size="10" text-anchor="middle">λ_A = λ_C ≈ 0.10</text>

  <line x1="290" y1="330" x2="290" y2="460" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="400" y="340" text-anchor="middle" fill="#80e0ff" font-size="13" font-weight="bold">Statistical</text>
  <text x="400" y="360" fill="#ccc" font-size="11" text-anchor="middle">Angle distribution</text>
  <text x="400" y="375" fill="#ccc" font-size="11" text-anchor="middle">symmetric about 45°</text>
  <text x="400" y="395" fill="#aab" font-size="10" text-anchor="middle">Mean angle = 45° exactly</text>
  <text x="400" y="410" fill="#aab" font-size="10" text-anchor="middle">#(A-triples at depth d)</text>
  <text x="400" y="425" fill="#aab" font-size="10" text-anchor="middle">= #(C-triples at depth d)</text>
  <text x="400" y="445" fill="#aab" font-size="10" text-anchor="middle">for all d</text>

  <line x1="530" y1="330" x2="530" y2="460" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="640" y="340" text-anchor="middle" fill="#ffdd77" font-size="13" font-weight="bold">Algebraic</text>
  <text x="640" y="360" fill="#ccc" font-size="11" text-anchor="middle">B₂ is self-conjugate:</text>
  <text x="640" y="375" fill="#ccc" font-size="11" text-anchor="middle">the "fixed point" of S</text>
  <text x="640" y="395" fill="#aab" font-size="10" text-anchor="middle">S·B₂ = B₂·S</text>
  <text x="640" y="410" fill="#aab" font-size="10" text-anchor="middle">B₂ generates balanced</text>
  <text x="640" y="425" fill="#aab" font-size="10" text-anchor="middle">triples (a ≈ b)</text>
  <text x="640" y="445" fill="#aab" font-size="10" text-anchor="middle">Eigenvector (1,-1,0)ᵀ</text>

  <text x="400" y="490" text-anchor="middle" fill="#7777aa" font-size="10">
    All identities machine-verified in Lean 4 with native_decide
  </text>
</svg>
