<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg3)"/>

  <text x="450" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">
    Growth Rate: Polynomial vs Exponential Branches
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#888" font-size="12">
    B₂-branch grows as (3+2√2)ⁿ ≈ 5.83ⁿ · A/C-branches grow as O(n²)
  </text>

  <!-- Chart area: x=100..850, y=90..520 -->
  <!-- Log scale for y-axis -->

  <!-- Grid -->
  <g stroke="#222" stroke-width="0.5">
    <line x1="100" y1="90" x2="100" y2="520"/>
    <line x1="100" y1="520" x2="850" y2="520"/>
    <!-- Horizontal grid lines (log scale: 10, 100, 1000, 10000) -->
    <line x1="100" y1="430" x2="850" y2="430" stroke-dasharray="3,3"/>
    <line x1="100" y1="340" x2="850" y2="340" stroke-dasharray="3,3"/>
    <line x1="100" y1="250" x2="850" y2="250" stroke-dasharray="3,3"/>
    <line x1="100" y1="160" x2="850" y2="160" stroke-dasharray="3,3"/>
  </g>

  <!-- Y-axis labels (log scale) -->
  <text x="90" y="524" fill="#888" font-size="11" text-anchor="end">1</text>
  <text x="90" y="434" fill="#888" font-size="11" text-anchor="end">10</text>
  <text x="90" y="344" fill="#888" font-size="11" text-anchor="end">100</text>
  <text x="90" y="254" fill="#888" font-size="11" text-anchor="end">1K</text>
  <text x="90" y="164" fill="#888" font-size="11" text-anchor="end">10K</text>
  <text x="50" y="305" fill="#888" font-size="12" text-anchor="middle" transform="rotate(-90, 50, 305)">Hypotenuse c</text>

  <!-- X-axis labels -->
  <text x="450" y="555" fill="#888" font-size="12" text-anchor="middle">Depth n</text>

  <!-- Data points: log10(c) maps to y position -->
  <!-- y = 520 - 90 * log10(c) -->
  <!-- A-branch: 5, 13, 25, 41, 61, 85, 113 -->
  <!-- B-branch: 5, 29, 169, 985, 5741 -->
  <!-- C-branch: 5, 17, 37, 65, 101, 145 -->

  <!-- X positions: 100, 200, 300, 400, 500, 600, 700, 800 for n=0..7 -->

  <!-- B-branch (exponential) - cyan -->
  <polyline points="100,457 200,388 300,320 400,251 500,182"
            fill="none" stroke="#48dbfb" stroke-width="3" opacity="0.9"/>
  <circle cx="100" cy="457" r="5" fill="#48dbfb"/>
  <circle cx="200" cy="388" r="5" fill="#48dbfb"/>
  <circle cx="300" cy="320" r="5" fill="#48dbfb"/>
  <circle cx="400" cy="251" r="5" fill="#48dbfb"/>
  <circle cx="500" cy="182" r="5" fill="#48dbfb"/>
  <text x="180" y="380" fill="#48dbfb" font-size="11">29</text>
  <text x="280" y="312" fill="#48dbfb" font-size="11">169</text>
  <text x="380" y="243" fill="#48dbfb" font-size="11">985</text>
  <text x="480" y="174" fill="#48dbfb" font-size="11">5741</text>

  <!-- A-branch (polynomial) - red -->
  <polyline points="100,457 200,420 300,394 400,375 500,360 600,347 700,335"
            fill="none" stroke="#ff6b6b" stroke-width="3" opacity="0.9"/>
  <circle cx="100" cy="457" r="5" fill="#ff6b6b"/>
  <circle cx="200" cy="420" r="5" fill="#ff6b6b"/>
  <circle cx="300" cy="394" r="5" fill="#ff6b6b"/>
  <circle cx="400" cy="375" r="5" fill="#ff6b6b"/>
  <circle cx="500" cy="360" r="5" fill="#ff6b6b"/>
  <circle cx="600" cy="347" r="5" fill="#ff6b6b"/>
  <circle cx="700" cy="335" r="5" fill="#ff6b6b"/>
  <text x="210" y="415" fill="#ff6b6b" font-size="11">13</text>
  <text x="310" y="389" fill="#ff6b6b" font-size="11">25</text>
  <text x="410" y="370" fill="#ff6b6b" font-size="11">41</text>
  <text x="510" y="355" fill="#ff6b6b" font-size="11">61</text>

  <!-- C-branch (polynomial) - yellow -->
  <polyline points="100,457 200,409 300,379 400,357 500,340 600,325 700,313"
            fill="none" stroke="#feca57" stroke-width="3" opacity="0.9"/>
  <circle cx="100" cy="457" r="4" fill="#feca57"/>
  <circle cx="200" cy="409" r="4" fill="#feca57"/>
  <circle cx="300" cy="379" r="4" fill="#feca57"/>
  <circle cx="400" cy="357" r="4" fill="#feca57"/>
  <circle cx="500" cy="340" r="4" fill="#feca57"/>
  <circle cx="600" cy="325" r="4" fill="#feca57"/>
  <circle cx="700" cy="313" r="4" fill="#feca57"/>
  <text x="210" y="404" fill="#feca57" font-size="11">17</text>
  <text x="310" y="374" fill="#feca57" font-size="11">37</text>
  <text x="410" y="352" fill="#feca57" font-size="11">65</text>

  <!-- Legend -->
  <rect x="580" y="100" width="250" height="140" rx="10" fill="#0d1117" stroke="#333" stroke-width="1"/>
  <text x="600" y="125" fill="#fff" font-size="14" font-weight="bold">Growth Rates</text>

  <line x1="600" y1="145" x2="640" y2="145" stroke="#ff6b6b" stroke-width="3"/>
  <text x="650" y="150" fill="#ff6b6b" font-size="12">A-branch: c ~ 2n² + 1</text>

  <line x1="600" y1="170" x2="640" y2="170" stroke="#48dbfb" stroke-width="3"/>
  <text x="650" y="175" fill="#48dbfb" font-size="12">B-branch: c ~ (3+2√2)ⁿ</text>

  <line x1="600" y1="195" x2="640" y2="195" stroke="#feca57" stroke-width="3"/>
  <text x="650" y="200" fill="#feca57" font-size="12">C-branch: c ~ 2n² + 1</text>

  <text x="600" y="225" fill="#888" font-size="11">Pell recurrence: cₙ₊₁ = 6cₙ − cₙ₋₁</text>

  <!-- Annotation about the asymmetry -->
  <text x="450" y="580" text-anchor="middle" fill="#666" font-size="11">
    The asymmetry arises from eigenvalue structure: B₁,B₃ are parabolic (all eigenvalues 1), B₂ is hyperbolic (eigenvalue 3+2√2)
  </text>
</svg>
