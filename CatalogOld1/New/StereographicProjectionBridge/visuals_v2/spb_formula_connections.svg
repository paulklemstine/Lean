<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0a0a2e"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bgc)"/>

  <!-- Central formula -->
  <text x="450" y="60" text-anchor="middle" fill="#FFD700" font-size="36" font-weight="bold" filter="url(#neon)">
    (x + y) / (1 − xy)
  </text>
  <text x="450" y="85" text-anchor="middle" fill="#888" font-size="14">The Stereographic Projection Bridge</text>

  <!-- Connection lines radiating from center -->
  <!-- Trigonometry -->
  <line x1="450" y1="100" x2="150" y2="200" stroke="#4FC3F7" stroke-width="2" opacity="0.6"/>
  <g transform="translate(150, 230)">
    <rect x="-120" y="-25" width="240" height="80" rx="10" fill="rgba(79,195,247,0.1)" stroke="#4FC3F7" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#4FC3F7" font-size="16" font-weight="bold">🔺 Trigonometry</text>
    <text x="0" y="18" text-anchor="middle" fill="#aaa" font-size="12">tan(α + β) = spb(tan α, tan β)</text>
    <text x="0" y="38" text-anchor="middle" fill="#777" font-size="11">Machin: π/4 = 4·atan(1/5) − atan(1/239)</text>
  </g>

  <!-- Group Theory -->
  <line x1="450" y1="100" x2="750" y2="200" stroke="#66BB6A" stroke-width="2" opacity="0.6"/>
  <g transform="translate(750, 230)">
    <rect x="-120" y="-25" width="240" height="80" rx="10" fill="rgba(102,187,106,0.1)" stroke="#66BB6A" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#66BB6A" font-size="16" font-weight="bold">⭕ Group Theory</text>
    <text x="0" y="18" text-anchor="middle" fill="#aaa" font-size="12">(ℝ, spb) ≅ (S¹, ·) via Cayley</text>
    <text x="0" y="38" text-anchor="middle" fill="#777" font-size="11">Identity: 0, Inverse: −x, Abelian</text>
  </g>

  <!-- Special Relativity -->
  <line x1="450" y1="100" x2="150" y2="400" stroke="#FF7043" stroke-width="2" opacity="0.6"/>
  <g transform="translate(150, 430)">
    <rect x="-120" y="-25" width="240" height="80" rx="10" fill="rgba(255,112,67,0.1)" stroke="#FF7043" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FF7043" font-size="16" font-weight="bold">🚀 Relativity</text>
    <text x="0" y="18" text-anchor="middle" fill="#aaa" font-size="12">(u+v)/(1+uv) = Einstein addition</text>
    <text x="0" y="38" text-anchor="middle" fill="#777" font-size="11">|u|,|v| &lt; c ⟹ |u⊕v| &lt; c</text>
  </g>

  <!-- Quaternions -->
  <line x1="450" y1="100" x2="750" y2="400" stroke="#E040FB" stroke-width="2" opacity="0.6"/>
  <g transform="translate(750, 430)">
    <rect x="-120" y="-25" width="240" height="80" rx="10" fill="rgba(224,64,251,0.1)" stroke="#E040FB" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#E040FB" font-size="16" font-weight="bold">🎲 Quaternions</text>
    <text x="0" y="18" text-anchor="middle" fill="#aaa" font-size="12">spb₃(u,v) = (u+v+u×v)/(1−u·v)</text>
    <text x="0" y="38" text-anchor="middle" fill="#777" font-size="11">Non-commutative, SO(3) rotations</text>
  </g>

  <!-- Neural Networks -->
  <line x1="450" y1="100" x2="450" y2="370" stroke="#FFD740" stroke-width="2" opacity="0.6"/>
  <g transform="translate(450, 400)">
    <rect x="-120" y="-25" width="240" height="80" rx="10" fill="rgba(255,215,64,0.1)" stroke="#FFD740" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FFD740" font-size="16" font-weight="bold">🧠 Neural Networks</text>
    <text x="0" y="18" text-anchor="middle" fill="#aaa" font-size="12">SPB neuron: Möbius activation</text>
    <text x="0" y="38" text-anchor="middle" fill="#777" font-size="11">O(log n) params for periodic funcs</text>
  </g>

  <!-- Finite Fields -->
  <line x1="450" y1="100" x2="300" y2="320" stroke="#26C6DA" stroke-width="2" opacity="0.6"/>
  <g transform="translate(300, 340)">
    <rect x="-90" y="-15" width="180" height="35" rx="8" fill="rgba(38,198,218,0.1)" stroke="#26C6DA" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#26C6DA" font-size="12">🔐 Crypto: |SPB(𝔽_p)| = p±1</text>
  </g>

  <!-- Approximation -->
  <line x1="450" y1="100" x2="600" y2="320" stroke="#AB47BC" stroke-width="2" opacity="0.6"/>
  <g transform="translate(600, 340)">
    <rect x="-90" y="-15" width="180" height="35" rx="8" fill="rgba(171,71,188,0.1)" stroke="#AB47BC" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#AB47BC" font-size="12">📐 T_n(x) = tan(n·arctan(x))</text>
  </g>

  <!-- Bottom: Verified badge -->
  <g transform="translate(450, 550)">
    <rect x="-250" y="-20" width="500" height="40" rx="20" fill="rgba(76,175,80,0.15)" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="0" y="7" text-anchor="middle" fill="#4CAF50" font-size="15" font-weight="bold">
      ✓ 28+ Theorems Machine-Verified in Lean 4 — Zero Sorry
    </text>
  </g>
</svg>
