<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="500" fill="#fff"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">
    SPB Group Over Finite Fields: The p±1 Law
  </text>

  <!-- p = 7 (p ≡ 3 mod 4, order p+1 = 8) -->
  <rect x="30" y="55" width="400" height="200" rx="10" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="230" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E7D32">
    𝔽₇: p ≡ 3 (mod 4), Group Order = p+1 = 8
  </text>

  <!-- Orbit diagram for p=7 -->
  <!-- Generator 3: orbit is 3 → 6 → 2 → 5 → 4 → 1 → ... → 0 -->
  <circle cx="150" cy="155" r="60" fill="none" stroke="#4CAF50" stroke-width="1" stroke-dasharray="3,3"/>

  <circle cx="210" cy="155" r="12" fill="#4CAF50" opacity="0.8"/>
  <text x="210" y="159" text-anchor="middle" font-size="10" fill="white" font-weight="bold">3</text>

  <circle cx="192" cy="103" r="12" fill="#66BB6A" opacity="0.8"/>
  <text x="192" y="107" text-anchor="middle" font-size="10" fill="white" font-weight="bold">6</text>

  <circle cx="150" cy="95" r="12" fill="#81C784" opacity="0.8"/>
  <text x="150" y="99" text-anchor="middle" font-size="10" fill="white" font-weight="bold">2</text>

  <circle cx="108" cy="103" r="12" fill="#A5D6A7" opacity="0.8"/>
  <text x="108" y="107" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>

  <circle cx="90" cy="155" r="12" fill="#C8E6C9" opacity="0.8"/>
  <text x="90" y="159" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <circle cx="108" cy="207" r="12" fill="#E8F5E9" opacity="0.8" stroke="#4CAF50"/>
  <text x="108" y="211" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <circle cx="150" cy="215" r="12" fill="#fff" stroke="#4CAF50" stroke-width="2"/>
  <text x="150" y="219" text-anchor="middle" font-size="10" fill="#4CAF50" font-weight="bold">0</text>

  <!-- Arrows between orbit elements (simplified) -->
  <text x="300" y="120" font-size="11" fill="#333">Generator: 3</text>
  <text x="300" y="138" font-size="11" fill="#333">Orbit: 3→6→2→5→4→1→∞→0</text>
  <text x="300" y="156" font-size="11" fill="#333">Order: 8 = p+1 ✓</text>
  <text x="300" y="180" font-size="11" fill="#2E7D32" font-weight="bold">−1 is NOT a square mod 7</text>
  <text x="300" y="198" font-size="11" fill="#555">→ Cayley maps to U(1, 𝔽₇)</text>
  <text x="300" y="216" font-size="11" fill="#555">→ Norm-1 in 𝔽₄₉</text>
  <text x="300" y="234" font-size="11" fill="#555">→ |U(1)| = p+1 = 8</text>

  <!-- p = 13 (p ≡ 1 mod 4, order p-1 = 12) -->
  <rect x="470" y="55" width="400" height="200" rx="10" fill="#e3f2fd" stroke="#1976D2" stroke-width="1.5"/>
  <text x="670" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">
    𝔽₁₃: p ≡ 1 (mod 4), Group Order = p−1 = 12
  </text>

  <!-- Orbit diagram for p=13 -->
  <circle cx="590" cy="165" r="65" fill="none" stroke="#1976D2" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 12 elements around circle -->
  <circle cx="655" cy="165" r="10" fill="#1976D2" opacity="0.8"/>
  <text x="655" y="169" text-anchor="middle" font-size="9" fill="white" font-weight="bold">2</text>

  <circle cx="646" cy="132" r="10" fill="#42A5F5" opacity="0.7"/>
  <text x="646" y="136" text-anchor="middle" font-size="9" fill="white">5</text>

  <circle cx="623" cy="105" r="10" fill="#64B5F6" opacity="0.7"/>
  <text x="623" y="109" text-anchor="middle" font-size="9" fill="white">12</text>

  <circle cx="590" cy="100" r="10" fill="#90CAF9" opacity="0.7"/>
  <text x="590" y="104" text-anchor="middle" font-size="9" fill="#333">4</text>

  <circle cx="557" cy="105" r="10" fill="#BBDEFB" opacity="0.7"/>
  <text x="557" y="109" text-anchor="middle" font-size="9" fill="#333">10</text>

  <circle cx="534" cy="132" r="10" fill="#E3F2FD" opacity="0.9" stroke="#1976D2"/>
  <text x="534" y="136" text-anchor="middle" font-size="9" fill="#333">7</text>

  <circle cx="525" cy="165" r="10" fill="#E3F2FD" opacity="0.9" stroke="#1976D2"/>
  <text x="525" y="169" text-anchor="middle" font-size="9" fill="#333">11</text>

  <circle cx="534" cy="198" r="10" fill="#BBDEFB" opacity="0.7"/>
  <text x="534" y="202" text-anchor="middle" font-size="9" fill="#333">8</text>

  <circle cx="557" cy="225" r="10" fill="#90CAF9" opacity="0.7"/>
  <text x="557" y="229" text-anchor="middle" font-size="9" fill="#333">1</text>

  <circle cx="590" cy="230" r="10" fill="#fff" stroke="#1976D2" stroke-width="2"/>
  <text x="590" y="234" text-anchor="middle" font-size="9" fill="#1976D2" font-weight="bold">0</text>

  <text x="740" y="120" font-size="11" fill="#333">Generator: 2</text>
  <text x="740" y="138" font-size="11" fill="#333">Order: 12 = p−1 ✓</text>
  <text x="740" y="162" font-size="11" fill="#1565C0" font-weight="bold">−1 IS a square mod 13</text>
  <text x="740" y="180" font-size="11" fill="#555">→ Cayley maps to 𝔽₁₃*</text>
  <text x="740" y="198" font-size="11" fill="#555">→ |𝔽₁₃*| = p−1 = 12</text>

  <!-- Summary table -->
  <rect x="50" y="280" width="800" height="200" rx="10" fill="#f8f9fa" stroke="#ddd"/>
  <text x="450" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">
    Computational Verification: All Primes p ≤ 97
  </text>

  <!-- Table header -->
  <text x="100" y="335" font-size="12" font-weight="bold" fill="#333">p</text>
  <text x="160" y="335" font-size="12" font-weight="bold" fill="#333">p mod 4</text>
  <text x="260" y="335" font-size="12" font-weight="bold" fill="#333">Expected</text>
  <text x="360" y="335" font-size="12" font-weight="bold" fill="#333">Actual</text>
  <text x="440" y="335" font-size="12" font-weight="bold" fill="#333">✓</text>

  <text x="530" y="335" font-size="12" font-weight="bold" fill="#333">p</text>
