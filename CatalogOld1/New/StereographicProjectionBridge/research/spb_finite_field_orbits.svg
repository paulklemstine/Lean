  <text x="680" y="335" font-size="12" font-weight="bold" fill="#333">Expected</text>
  <text x="770" y="335" font-size="12" font-weight="bold" fill="#333">Actual</text>
  <text x="830" y="335" font-size="12" font-weight="bold" fill="#333">✓</text>

