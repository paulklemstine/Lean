<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" fill="url(#bg3)"/>

  <text x="450" y="35" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">
    SPB over Finite Fields: The p±1 Law
  </text>
  <text x="450" y="58" text-anchor="middle" fill="#666" font-size="13">
    The SPB group over F_p has order p+1 when p ≡ 3 (mod 4), and p−1 when p ≡ 1 (mod 4)
  </text>

  <!-- p=7 orbit (p ≡ 3 mod 4, order = p+1 = 8) -->
  <text x="225" y="95" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold">
    F₇: p ≡ 3 (mod 4)
  </text>
  <text x="225" y="115" text-anchor="middle" fill="#555" font-size="12">
    SPB group order = p + 1 = 8
  </text>

  <!-- Circular orbit for p=7 -->
  <circle cx="225" cy="290" r="120" fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Orbit points for p=7: {0, 1, 2, 3, 4, 5, 6, ∞} -->
  <!-- 8 points equally spaced on circle -->
  <circle cx="345" cy="290" r="16" fill="#1565c0" opacity="0.9"/>
  <text x="345" y="295" text-anchor="middle" fill="white" font-size="13" font-weight="bold">0</text>

  <circle cx="310" cy="205" r="16" fill="#1976d2"/>
  <text x="310" y="210" text-anchor="middle" fill="white" font-size="13" font-weight="bold">1</text>

  <circle cx="225" cy="170" r="16" fill="#1e88e5"/>
  <text x="225" y="175" text-anchor="middle" fill="white" font-size="13" font-weight="bold">3</text>

  <circle cx="140" cy="205" r="16" fill="#2196f3"/>
  <text x="140" y="210" text-anchor="middle" fill="white" font-size="13" font-weight="bold">∞</text>

  <circle cx="105" cy="290" r="16" fill="#42a5f5"/>
  <text x="105" y="295" text-anchor="middle" fill="white" font-size="12" font-weight="bold">−1</text>

  <circle cx="140" cy="375" r="16" fill="#64b5f6"/>
  <text x="140" y="380" text-anchor="middle" fill="white" font-size="12" font-weight="bold">−3</text>

  <circle cx="225" cy="410" r="16" fill="#90caf9"/>
  <text x="225" y="415" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">4</text>

  <circle cx="310" cy="375" r="16" fill="#bbdefb"/>
  <text x="310" y="380" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">2</text>

  <!-- Arrows showing orbit -->
  <path d="M 338,275 Q 330,250 318,215" fill="none" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <path d="M 300,198 Q 270,178 238,172" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <path d="M 212,172 Q 180,178 152,198" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <path d="M 132,215 Q 118,250 110,275" fill="none" stroke="#1565c0" stroke-width="1.5"/>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="225" y="290" text-anchor="middle" fill="#1565c0" font-size="10">g = 1</text>

  <!-- p=5 orbit (p ≡ 1 mod 4, order = p-1 = 4) -->
  <text x="675" y="95" text-anchor="middle" fill="#c62828" font-size="16" font-weight="bold">
    F₅: p ≡ 1 (mod 4)
  </text>
  <text x="675" y="115" text-anchor="middle" fill="#555" font-size="12">
    SPB group order = p − 1 = 4
  </text>

  <!-- Circular orbit for p=5 -->
  <circle cx="675" cy="270" r="100" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Orbit points for p=5: {0, 1, 3, ∞} (4 elements) -->
  <circle cx="775" cy="270" r="18" fill="#c62828" opacity="0.9"/>
  <text x="775" y="275" text-anchor="middle" fill="white" font-size="14" font-weight="bold">0</text>

  <circle cx="675" cy="170" r="18" fill="#e53935"/>
  <text x="675" y="175" text-anchor="middle" fill="white" font-size="14" font-weight="bold">1</text>

  <circle cx="575" cy="270" r="18" fill="#ef5350"/>
  <text x="575" y="275" text-anchor="middle" fill="white" font-size="14" font-weight="bold">3</text>

  <circle cx="675" cy="370" r="18" fill="#e57373"/>
  <text x="675" y="375" text-anchor="middle" fill="white" font-size="13" font-weight="bold">∞</text>

  <!-- Arrows -->
  <path d="M 765,255 Q 730,210 690,178" fill="none" stroke="#c62828" stroke-width="2"/>
  <path d="M 660,178 Q 620,210 590,255" fill="none" stroke="#c62828" stroke-width="2"/>
  <path d="M 585,285 Q 620,340 660,362" fill="none" stroke="#c62828" stroke-width="2"/>
  <path d="M 690,362 Q 730,340 765,285" fill="none" stroke="#c62828" stroke-width="2"/>

  <text x="675" y="270" text-anchor="middle" fill="#c62828" font-size="10">g = 1</text>

  <!-- Remaining elements box for p=5 -->
  <rect x="620" y="410" width="110" height="35" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="675" y="432" text-anchor="middle" fill="#e65100" font-size="11">
    Excluded: 2, 4
  </text>
  <text x="675" y="455" text-anchor="middle" fill="#888" font-size="10">
    (xy = 1 mod 5)
  </text>

  <!-- Explanation -->
  <rect x="50" y="460" width="800" height="70" rx="10" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="450" y="485" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">
    Why p±1? The Cayley transform maps SPB elements to the norm-1 subgroup of F_{p²}*.
  </text>
  <text x="450" y="505" text-anchor="middle" fill="#555" font-size="12">
    When p ≡ 3 (mod 4): −1 is a non-residue → norm group has order p+1 (unitary group U(1, F_p))
  </text>
  <text x="450" y="522" text-anchor="middle" fill="#555" font-size="12">
    When p ≡ 1 (mod 4): −1 is a residue → Cayley maps into F_p* directly → order p−1
  </text>
</svg>
