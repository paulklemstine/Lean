<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="url(#goldGrad)" font-size="28" font-weight="bold" filter="url(#glow)">
    The Stereographic Projection Bridge
  </text>
  <text x="500" y="72" text-anchor="middle" fill="#aaa" font-size="14">
    One Formula Unifying Four Mathematical Worlds
  </text>

  <!-- Central formula -->
  <rect x="350" y="85" width="300" height="55" rx="12" fill="#1a1a3e" stroke="url(#goldGrad)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="118" text-anchor="middle" fill="url(#goldGrad)" font-size="22" font-weight="bold" font-family="'Times New Roman', serif">
    spb(x, y) = (x + y) / (1 − xy)
  </text>

  <!-- Four domain boxes -->
  <!-- Trigonometry (top-left) -->
  <rect x="40" y="180" width="210" height="160" rx="15" fill="#1a2a3e" stroke="url(#blueGrad)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="210" text-anchor="middle" fill="url(#blueGrad)" font-size="16" font-weight="bold">Trigonometry</text>
  <text x="145" y="235" text-anchor="middle" fill="#ccc" font-size="12">tan(α + β) = spb(tan α, tan β)</text>
  <text x="145" y="258" text-anchor="middle" fill="#aaa" font-size="11">Double: tan(2θ) = spb(t, t)</text>
  <text x="145" y="278" text-anchor="middle" fill="#aaa" font-size="11">Triple: tan(3θ) = spb(spb(t,t),t)</text>
  <text x="145" y="298" text-anchor="middle" fill="#aaa" font-size="11">n-fold: tan(nθ) = spb_iter(n, t)</text>
  <text x="145" y="325" text-anchor="middle" fill="#4fc3f7" font-size="11">🔵 Angle composition</text>

  <!-- Group Theory (top-right) -->
  <rect x="750" y="180" width="210" height="160" rx="15" fill="#2a1a2e" stroke="url(#purpleGrad)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="210" text-anchor="middle" fill="url(#purpleGrad)" font-size="16" font-weight="bold">Group Theory</text>
  <text x="855" y="235" text-anchor="middle" fill="#ccc" font-size="12">(ℝ, spb) ≅ (S¹, ·) via Cayley</text>
  <text x="855" y="258" text-anchor="middle" fill="#aaa" font-size="11">Identity: 0</text>
  <text x="855" y="278" text-anchor="middle" fill="#aaa" font-size="11">Inverse: −x</text>
  <text x="855" y="298" text-anchor="middle" fill="#aaa" font-size="11">Associative + Commutative</text>
  <text x="855" y="325" text-anchor="middle" fill="#ce93d8" font-size="11">🟣 Circle group structure</text>

  <!-- Physics (bottom-left) -->
  <rect x="40" y="420" width="210" height="160" rx="15" fill="#1a2e1a" stroke="url(#greenGrad)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="450" text-anchor="middle" fill="url(#greenGrad)" font-size="16" font-weight="bold">Special Relativity</text>
  <text x="145" y="475" text-anchor="middle" fill="#ccc" font-size="12">spbH(u,v) = (u+v)/(1+uv)</text>
  <text x="145" y="498" text-anchor="middle" fill="#aaa" font-size="11">Einstein velocity addition</text>
  <text x="145" y="518" text-anchor="middle" fill="#aaa" font-size="11">|u|,|v| &lt; c ⟹ |spbH| &lt; c</text>
  <text x="145" y="538" text-anchor="middle" fill="#aaa" font-size="11">Rapidity: tanh additivity</text>
  <text x="145" y="565" text-anchor="middle" fill="#81c784" font-size="11">🟢 Light speed barrier</text>

  <!-- Approximation Theory (bottom-right) -->
  <rect x="750" y="420" width="210" height="160" rx="15" fill="#2e1a1a" stroke="url(#redGrad)" stroke-width="2" filter="url(#shadow)"/>
  <text x="855" y="450" text-anchor="middle" fill="url(#redGrad)" font-size="16" font-weight="bold">Approximation</text>
  <text x="855" y="475" text-anchor="middle" fill="#ccc" font-size="12">SPB trees ↔ rational fns</text>
  <text x="855" y="498" text-anchor="middle" fill="#aaa" font-size="11">Chebyshev connection</text>
  <text x="855" y="518" text-anchor="middle" fill="#aaa" font-size="11">Binary exponentiation</text>
  <text x="855" y="538" text-anchor="middle" fill="#aaa" font-size="11">Exponential convergence</text>
  <text x="855" y="565" text-anchor="middle" fill="#ef5350" font-size="11">🔴 Optimal approximation</text>

  <!-- Connecting lines with glow -->
  <!-- Top-left to center -->
  <line x1="250" y1="260" x2="400" y2="112" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
  <!-- Top-right to center -->
  <line x1="750" y1="260" x2="600" y2="112" stroke="#ce93d8" stroke-width="2" opacity="0.6"/>
  <!-- Bottom-left to center -->
  <line x1="250" y1="500" x2="400" y2="112" stroke="#81c784" stroke-width="2" opacity="0.6" stroke-dasharray="5,5"/>
  <!-- Bottom-right to center -->
  <line x1="750" y1="500" x2="600" y2="112" stroke="#ef5350" stroke-width="2" opacity="0.6" stroke-dasharray="5,5"/>

  <!-- Cayley Transform Bridge (center) -->
  <rect x="350" y="290" width="300" height="110" rx="15" fill="#1e1e3e" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="320" text-anchor="middle" fill="url(#goldGrad)" font-size="15" font-weight="bold">Cayley Transform</text>
  <text x="500" y="345" text-anchor="middle" fill="#ddd" font-size="13" font-family="'Times New Roman', serif">
    cayley(x) = (1 + ix) / (1 − ix)
  </text>
  <text x="500" y="370" text-anchor="middle" fill="#aaa" font-size="12">
    cayley(spb(x,y)) = cayley(x) · cayley(y)
  </text>
  <text x="500" y="390" text-anchor="middle" fill="#aaa" font-size="11">
    |cayley(x)|² = 1  ∀x ∈ ℝ
  </text>

  <!-- Cross-domain connections -->
  <line x1="250" y1="340" x2="350" y2="345" stroke="#aaa" stroke-width="1" opacity="0.4"/>
  <line x1="650" y1="345" x2="750" y2="340" stroke="#aaa" stroke-width="1" opacity="0.4"/>
  <line x1="250" y1="420" x2="350" y2="370" stroke="#aaa" stroke-width="1" opacity="0.4"/>
  <line x1="650" y1="370" x2="750" y2="420" stroke="#aaa" stroke-width="1" opacity="0.4"/>

  <!-- New Research Directions (bottom) -->
  <rect x="280" y="440" width="440" height="130" rx="15" fill="#0e0e2e" stroke="#555" stroke-width="1" filter="url(#shadow)"/>
  <text x="500" y="465" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">Research Frontiers</text>

  <text x="360" y="490" text-anchor="middle" fill="#4fc3f7" font-size="11">Higher-Dim SPB</text>
  <text x="500" y="490" text-anchor="middle" fill="#ce93d8" font-size="11">Finite Fields</text>
  <text x="640" y="490" text-anchor="middle" fill="#81c784" font-size="11">Thomas Precession</text>

  <text x="360" y="512" text-anchor="middle" fill="#ef5350" font-size="11">Neural Networks</text>
  <text x="500" y="512" text-anchor="middle" fill="#4fc3f7" font-size="11">Quantum Gates</text>
  <text x="640" y="512" text-anchor="middle" fill="#ce93d8" font-size="11">Signal Processing</text>

  <text x="360" y="534" text-anchor="middle" fill="#81c784" font-size="11">p-adic Fields</text>
  <text x="500" y="534" text-anchor="middle" fill="#ef5350" font-size="11">Cryptography</text>
  <text x="640" y="534" text-anchor="middle" fill="#ffd700" font-size="11">Info Geometry</text>

  <text x="500" y="558" text-anchor="middle" fill="#888" font-size="10">35 directions · Machine-verified foundations · Cross-disciplinary</text>

  <!-- Verification badge -->
  <rect x="370" y="620" width="260" height="45" rx="10" fill="#1a3a1a" stroke="#4caf50" stroke-width="1.5"/>
  <text x="500" y="640" text-anchor="middle" fill="#4caf50" font-size="12" font-weight="bold">✓ MACHINE VERIFIED</text>
  <text x="500" y="656" text-anchor="middle" fill="#81c784" font-size="10">40+ theorems · Lean 4 + Mathlib · Zero sorry</text>

  <!-- Footer -->
  <text x="500" y="690" text-anchor="middle" fill="#555" font-size="10">
    Stereographic Projection Bridge Framework — Formally Verified Mathematics
  </text>
</svg>
