<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>

  <text x="400" y="35" text-anchor="middle" fill="#00ffcc" font-size="22" font-weight="bold" font-family="Arial">
    Sheffer Algebra: Closure Properties
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#88aacc" font-size="13" font-family="Arial">
    What the algebra IS and IS NOT closed under — formally verified
  </text>

  <!-- Closed operations (left column) -->
  <rect x="30" y="75" width="355" height="500" rx="12" fill="#0d1b2a" stroke="#00cc88" stroke-width="2"/>
  <text x="207" y="100" text-anchor="middle" fill="#00cc88" font-size="18" font-weight="bold">✓ Closed Under</text>

  <!-- Each operation -->
  <rect x="50" y="115" width="315" height="50" rx="6" fill="#0a2a1a" stroke="#00aa66" stroke-width="1"/>
  <text x="65" y="137" fill="#00ffcc" font-size="14" font-weight="bold">+ Addition</text>
  <text x="65" y="155" fill="#88ccaa" font-size="11">f, g ∈ Sheffer ⟹ f + g ∈ Sheffer</text>

  <rect x="50" y="175" width="315" height="50" rx="6" fill="#0a2a1a" stroke="#00aa66" stroke-width="1"/>
  <text x="65" y="197" fill="#00ffcc" font-size="14" font-weight="bold">- Subtraction</text>
  <text x="65" y="215" fill="#88ccaa" font-size="11">f, g ∈ Sheffer ⟹ f - g ∈ Sheffer</text>

  <rect x="50" y="235" width="315" height="50" rx="6" fill="#0a2a1a" stroke="#00aa66" stroke-width="1"/>
  <text x="65" y="257" fill="#00ffcc" font-size="14" font-weight="bold">c· Scalar Multiplication</text>
  <text x="65" y="275" fill="#88ccaa" font-size="11">f ∈ Sheffer, c ∈ ℝ ⟹ c·f ∈ Sheffer</text>

  <rect x="50" y="295" width="315" height="50" rx="6" fill="#0a2a1a" stroke="#00aa66" stroke-width="1"/>
  <text x="65" y="317" fill="#00ffcc" font-size="14" font-weight="bold">∘ Composition</text>
  <text x="65" y="335" fill="#88ccaa" font-size="11">f, g ∈ Sheffer ⟹ f ∘ g ∈ Sheffer</text>

  <rect x="50" y="355" width="315" height="50" rx="6" fill="#0a2a1a" stroke="#00aa66" stroke-width="1"/>
  <text x="65" y="377" fill="#00ffcc" font-size="14" font-weight="bold">Affine Pre-composition</text>
  <text x="65" y="395" fill="#88ccaa" font-size="11">f ∈ Sheffer ⟹ x ↦ f(ax+b) ∈ Sheffer</text>

  <rect x="50" y="415" width="315" height="50" rx="6" fill="#0a2a1a" stroke="#00aa66" stroke-width="1"/>
  <text x="65" y="437" fill="#00ffcc" font-size="14" font-weight="bold">- Negation</text>
  <text x="65" y="455" fill="#88ccaa" font-size="11">f ∈ Sheffer ⟹ -f ∈ Sheffer</text>

  <rect x="50" y="475" width="315" height="50" rx="6" fill="#0a2a1a" stroke="#00aa66" stroke-width="1"/>
  <text x="65" y="497" fill="#00ffcc" font-size="14" font-weight="bold">Contains id and constants</text>
  <text x="65" y="515" fill="#88ccaa" font-size="11">x = σ(x) - σ(-x), const c ∈ Sheffer</text>

  <!-- NOT closed operations (right column) -->
  <rect x="415" y="75" width="355" height="240" rx="12" fill="#1b0d0d" stroke="#ff4444" stroke-width="2"/>
  <text x="592" y="100" text-anchor="middle" fill="#ff4444" font-size="18" font-weight="bold">✗ NOT Closed Under</text>

  <rect x="435" y="115" width="315" height="80" rx="6" fill="#2a0a0a" stroke="#cc3333" stroke-width="1"/>
  <text x="450" y="140" fill="#ff6666" font-size="14" font-weight="bold">× Pointwise Multiplication</text>
  <text x="450" y="160" fill="#cc8888" font-size="11">x ∈ Sheffer, but x · x = x² ∉ Sheffer</text>
  <text x="450" y="180" fill="#cc8888" font-size="11">Proof: x² violates Lipschitz barrier</text>

  <rect x="435" y="205" width="315" height="80" rx="6" fill="#2a0a0a" stroke="#cc3333" stroke-width="1"/>
  <text x="450" y="230" fill="#ff6666" font-size="14" font-weight="bold">÷ Pointwise Division</text>
  <text x="450" y="250" fill="#cc8888" font-size="11">If × were closed, then ÷ might follow.</text>
  <text x="450" y="270" fill="#cc8888" font-size="11">Since × is not closed, ÷ is suspect too.</text>

  <!-- Key insight box -->
  <rect x="415" y="340" width="355" height="235" rx="12" fill="#0a1a2a" stroke="#4488ff" stroke-width="2"/>
  <text x="592" y="365" text-anchor="middle" fill="#4488ff" font-size="16" font-weight="bold">Key Structural Properties</text>

  <text x="435" y="395" fill="#88bbff" font-size="12">• The algebra is a vector space over ℝ</text>
  <text x="435" y="420" fill="#88bbff" font-size="12">• Closed under composition (monoid)</text>
  <text x="435" y="445" fill="#88bbff" font-size="12">• NOT a ring (no multiplication)</text>
  <text x="435" y="470" fill="#88bbff" font-size="12">• Every element is Lipschitz</text>
  <text x="435" y="495" fill="#88bbff" font-size="12">• Every element is differentiable</text>
  <text x="435" y="520" fill="#88bbff" font-size="12">• Contains all affine functions</text>
  <text x="435" y="545" fill="#88bbff" font-size="12">• Properly contained in Lip ∩ C∞(ℝ)</text>
</svg>
