<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <defs>
    <linearGradient id="bg_bd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
  </defs>

  <rect width="700" height="450" fill="url(#bg_bd)"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold" font-family="Georgia">
    Softplus Bounds — Formally Verified
  </text>

  <!-- Axes -->
  <line x1="80" y1="350" x2="650" y2="350" stroke="#555577" stroke-width="1"/>
  <line x1="350" y1="40" x2="350" y2="370" stroke="#555577" stroke-width="1"/>
  <text x="660" y="355" fill="#777799" font-size="12" font-family="monospace">x</text>
  <text x="355" y="50" fill="#777799" font-size="12" font-family="monospace">y</text>

  <!-- Scale markers -->
  <text x="170" y="368" fill="#555577" font-size="9" font-family="monospace">-4</text>
  <text x="260" y="368" fill="#555577" font-size="9" font-family="monospace">-2</text>
  <text x="345" y="368" fill="#555577" font-size="9" font-family="monospace">0</text>
  <text x="440" y="368" fill="#555577" font-size="9" font-family="monospace">2</text>
  <text x="530" y="368" fill="#555577" font-size="9" font-family="monospace">4</text>

  <!-- Upper bound: max(x,0) + log(2) -->
  <!-- For x<0: constant log(2) ≈ 0.693, for x≥0: x + 0.693 -->
  <path d="M 80,305 L 350,305 L 620,80"
        fill="none" stroke="#ff8844" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="600" y="70" fill="#ff8844" font-size="11" font-family="monospace">max(x,0)+log2</text>

  <!-- Softplus: σ(x) = log(1+eˣ) -->
  <path d="M 80,345 Q 130,342 170,335 Q 220,320 260,305 Q 300,285 340,255 Q 380,218 420,178 Q 470,130 530,95 Q 580,72 620,58"
        fill="none" stroke="#44bbff" stroke-width="3"/>
  <text x="625" y="55" fill="#44bbff" font-size="12" font-weight="bold" font-family="monospace">σ(x)</text>

  <!-- Lower bound for x≥0: x/2 + log(2)/2 -->
  <path d="M 350,315 L 620,202"
        fill="none" stroke="#44ff88" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="600" y="195" fill="#44ff88" font-size="11" font-family="monospace">x/2+log2/2</text>

  <!-- Lower bound for x≤0: eˣ/2 -->
  <path d="M 80,348 Q 170,345 220,340 Q 260,330 300,310 Q 330,290 350,265"
        fill="none" stroke="#aa88ff" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="140" y="328" fill="#aa88ff" font-size="11" font-family="monospace">eˣ/2 (x≤0)</text>

  <!-- Identity line y=x for reference -->
  <path d="M 170,350 L 620,125"
        fill="none" stroke="#444466" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="610" y="118" fill="#444466" font-size="9" font-family="monospace">y=x</text>

  <!-- Shaded region between bounds (approximate) -->

  <!-- Info box -->
  <rect x="85" y="55" width="230" height="100" rx="8" fill="rgba(0,0,0,0.6)" stroke="#555577" stroke-width="1"/>
  <text x="200" y="78" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" font-family="Georgia">Proved Bounds</text>
  <text x="95" y="98" fill="#ff8844" font-size="10" font-family="monospace">σ(x) ≤ max(x,0) + ln2 ✓</text>
  <text x="95" y="115" fill="#44ff88" font-size="10" font-family="monospace">σ(x) ≥ x/2 + ln2/2 (x≥0) ✓</text>
  <text x="95" y="132" fill="#aa88ff" font-size="10" font-family="monospace">σ(x) ≥ eˣ/2 (x≤0) ✓</text>
  <text x="95" y="149" fill="#44bbff" font-size="10" font-family="monospace">σ(x) > x (all x) ✓</text>

  <!-- Point at (0, log2) -->
  <circle cx="350" cy="305" r="4" fill="#ffffff"/>
  <text x="360" y="300" fill="#ffffff" font-size="10" font-family="monospace">σ(0)=ln2</text>
</svg>
