<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="700" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">Sheffer AI Research Roadmap</text>
  <text x="450" y="62" text-anchor="middle" fill="#8b949e" font-size="13">36-Month Program • 12 Research Directions</text>

  <!-- Timeline bar -->
  <rect x="50" y="85" width="800" height="8" rx="4" fill="#21262d"/>
  <rect x="50" y="85" width="220" height="8" rx="4" fill="#4ecdc4"/>
  <rect x="270" y="85" width="310" height="8" rx="4" fill="#ffa502"/>
  <rect x="580" y="85" width="270" height="8" rx="4" fill="#ff6b6b"/>
  <text x="160" y="80" text-anchor="middle" fill="#4ecdc4" font-size="11" font-weight="bold">Foundation (0-6 mo)</text>
  <text x="425" y="80" text-anchor="middle" fill="#ffa502" font-size="11" font-weight="bold">Applications (6-18 mo)</text>
  <text x="715" y="80" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="bold">Impact (18-36 mo)</text>

  <!-- Foundation Phase -->
  <g transform="translate(50, 115)">
    <rect width="260" height="260" rx="10" fill="rgba(78,205,196,0.08)" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="130" y="25" text-anchor="middle" fill="#4ecdc4" font-size="15" font-weight="bold">🔬 Foundation</text>

    <rect x="15" y="40" width="230" height="42" rx="6" fill="rgba(78,205,196,0.1)" stroke="#4ecdc4" stroke-width="0.5"/>
    <text x="25" y="57" fill="#ddd" font-size="11" font-weight="bold">Uniqueness Proof</text>
    <text x="25" y="73" fill="#8b949e" font-size="9">ODE characterization of softplus</text>

    <rect x="15" y="90" width="230" height="42" rx="6" fill="rgba(78,205,196,0.1)" stroke="#4ecdc4" stroke-width="0.5"/>
    <text x="25" y="107" fill="#ddd" font-size="11" font-weight="bold">Lean 4 Formalization</text>
    <text x="25" y="123" fill="#8b949e" font-size="9">33+ theorems, zero sorry</text>

    <rect x="15" y="140" width="230" height="42" rx="6" fill="rgba(78,205,196,0.1)" stroke="#4ecdc4" stroke-width="0.5"/>
    <text x="25" y="157" fill="#ddd" font-size="11" font-weight="bold">Transformer Experiments</text>
    <text x="25" y="173" fill="#8b949e" font-size="9">Softplus vs GELU vs ReLU at scale</text>

    <rect x="15" y="190" width="230" height="42" rx="6" fill="rgba(78,205,196,0.1)" stroke="#4ecdc4" stroke-width="0.5"/>
    <text x="25" y="207" fill="#ddd" font-size="11" font-weight="bold">Symbolic Extraction Toolkit</text>
    <text x="25" y="223" fill="#8b949e" font-size="9">Train → Extract → Simplify pipeline</text>
  </g>

  <!-- Applications Phase -->
  <g transform="translate(320, 115)">
    <rect width="260" height="260" rx="10" fill="rgba(255,165,2,0.08)" stroke="#ffa502" stroke-width="1.5"/>
    <text x="130" y="25" text-anchor="middle" fill="#ffa502" font-size="15" font-weight="bold">⚙️ Applications</text>

    <rect x="15" y="40" width="230" height="42" rx="6" fill="rgba(255,165,2,0.1)" stroke="#ffa502" stroke-width="0.5"/>
    <text x="25" y="57" fill="#ddd" font-size="11" font-weight="bold">Scientific Discovery</text>
    <text x="25" y="73" fill="#8b949e" font-size="9">Recover physical laws from data</text>

    <rect x="15" y="90" width="230" height="42" rx="6" fill="rgba(255,165,2,0.1)" stroke="#ffa502" stroke-width="0.5"/>
    <text x="25" y="107" fill="#ddd" font-size="11" font-weight="bold">Sheffer Cryptography</text>
    <text x="25" y="123" fill="#8b949e" font-size="9">One-way functions from decomposition</text>

    <rect x="15" y="140" width="230" height="42" rx="6" fill="rgba(255,165,2,0.1)" stroke="#ffa502" stroke-width="0.5"/>
    <text x="25" y="157" fill="#ddd" font-size="11" font-weight="bold">Analog VLSI Prototype</text>
    <text x="25" y="173" fill="#8b949e" font-size="9">Subthreshold MOSFET softplus circuits</text>

    <rect x="15" y="190" width="230" height="42" rx="6" fill="rgba(255,165,2,0.1)" stroke="#ffa502" stroke-width="0.5"/>
    <text x="25" y="207" fill="#ddd" font-size="11" font-weight="bold">Differentiable Physics</text>
    <text x="25" y="223" fill="#8b949e" font-size="9">Smooth contact forces for robotics</text>
  </g>

  <!-- Impact Phase -->
  <g transform="translate(590, 115)">
    <rect width="260" height="260" rx="10" fill="rgba(255,107,107,0.08)" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="130" y="25" text-anchor="middle" fill="#ff6b6b" font-size="15" font-weight="bold">🚀 Impact</text>

    <rect x="15" y="40" width="230" height="42" rx="6" fill="rgba(255,107,107,0.1)" stroke="#ff6b6b" stroke-width="0.5"/>
    <text x="25" y="57" fill="#ddd" font-size="11" font-weight="bold">Large-Scale LLM Experiments</text>
    <text x="25" y="73" fill="#8b949e" font-size="9">Softplus transformers at GPT scale</text>

    <rect x="15" y="90" width="230" height="42" rx="6" fill="rgba(255,107,107,0.1)" stroke="#ff6b6b" stroke-width="0.5"/>
    <text x="25" y="107" fill="#ddd" font-size="11" font-weight="bold">Drug Design Application</text>
    <text x="25" y="123" fill="#8b949e" font-size="9">Interpretable molecular property models</text>

    <rect x="15" y="140" width="230" height="42" rx="6" fill="rgba(255,107,107,0.1)" stroke="#ff6b6b" stroke-width="0.5"/>
    <text x="25" y="157" fill="#ddd" font-size="11" font-weight="bold">Complexity Theory</text>
    <text x="25" y="173" fill="#8b949e" font-size="9">Sheffer degree vs circuit complexity</text>

    <rect x="15" y="190" width="230" height="42" rx="6" fill="rgba(255,107,107,0.1)" stroke="#ff6b6b" stroke-width="0.5"/>
    <text x="25" y="207" fill="#ddd" font-size="11" font-weight="bold">Quantum Parameterization</text>
    <text x="25" y="223" fill="#8b949e" font-size="9">Sheffer gate families for QC</text>
  </g>

  <!-- Key Insights -->
  <g transform="translate(50, 400)">
    <rect width="800" height="280" rx="12" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1"/>
    <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">8 Key Insights</text>

    <!-- Row 1 -->
    <g transform="translate(20, 45)">
      <rect width="185" height="48" rx="6" fill="rgba(78,205,196,0.12)" stroke="#4ecdc4" stroke-width="0.5"/>
      <text x="10" y="20" fill="#4ecdc4" font-size="10" font-weight="bold">1. Every NN is a Formula</text>
      <text x="10" y="36" fill="#8b949e" font-size="9">Softplus networks = symbolic</text>
    </g>
    <g transform="translate(215, 45)">
      <rect width="185" height="48" rx="6" fill="rgba(78,205,196,0.12)" stroke="#4ecdc4" stroke-width="0.5"/>
      <text x="10" y="20" fill="#4ecdc4" font-size="10" font-weight="bold">2. Training = Regression</text>
      <text x="10" y="36" fill="#8b949e" font-size="9">SGD finds symbolic expressions</text>
    </g>
    <g transform="translate(410, 45)">
      <rect width="185" height="48" rx="6" fill="rgba(ffa502,0.12)" stroke="#ffa502" stroke-width="0.5"/>
      <text x="10" y="20" fill="#ffa502" font-size="10" font-weight="bold">3. Depth = Complexity</text>
      <text x="10" y="36" fill="#8b949e" font-size="9">Sheffer degree measures math</text>
    </g>
    <g transform="translate(605, 45)">
      <rect width="185" height="48" rx="6" fill="rgba(255,165,2,0.12)" stroke="#ffa502" stroke-width="0.5"/>
      <text x="10" y="20" fill="#ffa502" font-size="10" font-weight="bold">4. One Function = All</text>
      <text x="10" y="36" fill="#8b949e" font-size="9">Continuous NAND universality</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 103)">
      <rect width="185" height="48" rx="6" fill="rgba(255,165,2,0.12)" stroke="#ffa502" stroke-width="0.5"/>
      <text x="10" y="20" fill="#ffa502" font-size="10" font-weight="bold">5. Softplus is Canonical</text>
      <text x="10" y="36" fill="#8b949e" font-size="9">Unique smooth+convex Sheffer fn</text>
    </g>
    <g transform="translate(215, 103)">
      <rect width="185" height="48" rx="6" fill="rgba(255,107,107,0.12)" stroke="#ff6b6b" stroke-width="0.5"/>
      <text x="10" y="20" fill="#ff6b6b" font-size="10" font-weight="bold">6. Tropical Limit = ReLU</text>
      <text x="10" y="36" fill="#8b949e" font-size="9">β→∞ connects smooth ↔ tropical</text>
    </g>
    <g transform="translate(410, 103)">
      <rect width="185" height="48" rx="6" fill="rgba(255,107,107,0.12)" stroke="#ff6b6b" stroke-width="0.5"/>
      <text x="10" y="20" fill="#ff6b6b" font-size="10" font-weight="bold">7. Formal Group Structure</text>
      <text x="10" y="36" fill="#8b949e" font-size="9">Multiplicative FGL connection</text>
    </g>
    <g transform="translate(605, 103)">
      <rect width="185" height="48" rx="6" fill="rgba(255,107,107,0.12)" stroke="#ff6b6b" stroke-width="0.5"/>
      <text x="10" y="20" fill="#ff6b6b" font-size="10" font-weight="bold">8. Hardware = Softplus</text>
      <text x="10" y="36" fill="#8b949e" font-size="9">MOSFETs compute σ natively</text>
    </g>

    <!-- Stats bar -->
    <g transform="translate(20, 170)">
      <rect width="760" height="90" rx="8" fill="rgba(0,0,0,0.3)"/>
      <text x="380" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Formal Verification Status</text>

      <rect x="20" y="35" width="170" height="42" rx="5" fill="rgba(78,205,196,0.15)"/>
      <text x="105" y="53" text-anchor="middle" fill="#4ecdc4" font-size="22" font-weight="bold">33+</text>
      <text x="105" y="70" text-anchor="middle" fill="#8b949e" font-size="10">Theorems Proved</text>

      <rect x="210" y="35" width="170" height="42" rx="5" fill="rgba(68,189,100,0.15)"/>
      <text x="295" y="53" text-anchor="middle" fill="#44bd64" font-size="22" font-weight="bold">0</text>
      <text x="295" y="70" text-anchor="middle" fill="#8b949e" font-size="10">Sorry Statements</text>

      <rect x="400" y="35" width="170" height="42" rx="5" fill="rgba(255,165,2,0.15)"/>
      <text x="485" y="53" text-anchor="middle" fill="#ffa502" font-size="22" font-weight="bold">4</text>
      <text x="485" y="70" text-anchor="middle" fill="#8b949e" font-size="10">Lean 4 Files</text>

      <rect x="590" y="35" width="170" height="42" rx="5" fill="rgba(255,107,107,0.15)"/>
      <text x="675" y="53" text-anchor="middle" fill="#ff6b6b" font-size="22" font-weight="bold">8</text>
      <text x="675" y="70" text-anchor="middle" fill="#8b949e" font-size="10">Python Demos</text>
    </g>
  </g>
</svg>
