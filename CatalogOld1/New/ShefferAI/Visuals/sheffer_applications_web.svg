<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="bg_app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <filter id="glow_a">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="700" fill="url(#bg_app)"/>

  <!-- Central hub -->
  <circle cx="450" cy="350" r="65" fill="rgba(52,152,219,0.3)" stroke="#3498db" stroke-width="3" filter="url(#glow_a)"/>
  <text x="450" y="340" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" font-family="Georgia">Softplus</text>
  <text x="450" y="360" text-anchor="middle" fill="#aaddff" font-size="12" font-family="monospace">σ(x)=log(1+eˣ)</text>

  <!-- Application nodes -->
  <!-- 1. Scientific Discovery (top) -->
  <circle cx="450" cy="100" r="50" fill="rgba(46,204,113,0.2)" stroke="#2ecc71" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="bold" font-family="Georgia">Scientific</text>
  <text x="450" y="112" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="bold" font-family="Georgia">Discovery</text>
  <line x1="450" y1="150" x2="450" y2="285" stroke="#2ecc71" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 2. Neural Networks (top-right) -->
  <circle cx="700" cy="170" r="50" fill="rgba(155,89,182,0.2)" stroke="#9b59b6" stroke-width="2"/>
  <text x="700" y="165" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="bold" font-family="Georgia">Neural</text>
  <text x="700" y="182" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="bold" font-family="Georgia">Networks</text>
  <line x1="660" y1="205" x2="505" y2="315" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 3. Tropical Geometry (right) -->
  <circle cx="780" cy="380" r="50" fill="rgba(241,196,15,0.2)" stroke="#f1c40f" stroke-width="2"/>
  <text x="780" y="375" text-anchor="middle" fill="#f1c40f" font-size="11" font-weight="bold" font-family="Georgia">Tropical</text>
  <text x="780" y="392" text-anchor="middle" fill="#f1c40f" font-size="11" font-weight="bold" font-family="Georgia">Geometry</text>
  <line x1="730" y1="380" x2="515" y2="360" stroke="#f1c40f" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 4. Analog Computing (bottom-right) -->
  <circle cx="680" cy="570" r="50" fill="rgba(230,126,34,0.2)" stroke="#e67e22" stroke-width="2"/>
  <text x="680" y="565" text-anchor="middle" fill="#e67e22" font-size="11" font-weight="bold" font-family="Georgia">Analog</text>
  <text x="680" y="582" text-anchor="middle" fill="#e67e22" font-size="11" font-weight="bold" font-family="Georgia">Computing</text>
  <line x1="640" y1="535" x2="490" y2="400" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 5. Compression (bottom) -->
  <circle cx="450" cy="620" r="50" fill="rgba(231,76,60,0.2)" stroke="#e74c3c" stroke-width="2"/>
  <text x="450" y="615" text-anchor="middle" fill="#e74c3c" font-size="11" font-weight="bold" font-family="Georgia">Signal</text>
  <text x="450" y="632" text-anchor="middle" fill="#e74c3c" font-size="11" font-weight="bold" font-family="Georgia">Compression</text>
  <line x1="450" y1="570" x2="450" y2="415" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 6. Drug Design (bottom-left) -->
