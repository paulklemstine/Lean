  <text x="220" y="565" text-anchor="middle" fill="#1abc9c" font-size="11" font-weight="bold" font-family="Georgia">Drug</text>
  <text x="220" y="582" text-anchor="middle" fill="#1abc9c" font-size="11" font-weight="bold" font-family="Georgia">Design</text>
  <line x1="260" y1="535" x2="410" y2="400" stroke="#1abc9c" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 7. Formal Verification (left) -->
  <circle cx="120" cy="380" r="50" fill="rgba(52,73,94,0.4)" stroke="#2c3e50" stroke-width="2"/>
  <text x="120" y="375" text-anchor="middle" fill="#ecf0f1" font-size="11" font-weight="bold" font-family="Georgia">Formal</text>
  <text x="120" y="392" text-anchor="middle" fill="#ecf0f1" font-size="11" font-weight="bold" font-family="Georgia">Verification</text>
  <line x1="170" y1="380" x2="385" y2="360" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 8. Cryptography (top-left) -->
  <circle cx="200" cy="170" r="50" fill="rgba(192,57,43,0.2)" stroke="#c0392b" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold" font-family="Georgia">Sheffer</text>
  <text x="200" y="182" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold" font-family="Georgia">Cryptography</text>
  <line x1="240" y1="205" x2="395" y2="315" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" font-family="Georgia">
    Applications of the Sheffer Function Program
  </text>
  <text x="450" y="58" text-anchor="middle" fill="#8899bb" font-size="13" font-family="Georgia" font-style="italic">
    One function, countless connections
  </text>

  <!-- Bottom -->
  <text x="450" y="690" text-anchor="middle" fill="#555577" font-size="10" font-family="Georgia">
    Sheffer AI Research Program • 67+ formally verified theorems
  </text>
</svg>
