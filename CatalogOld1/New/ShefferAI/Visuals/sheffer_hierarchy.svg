<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bg_h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow_h">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg_h)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold" font-family="Georgia">
    The Sheffer Function Hierarchy
  </text>
  <text x="450" y="65" text-anchor="middle" fill="#8899aa" font-size="14" font-family="Georgia" font-style="italic">
    From One Function to All of Analysis
  </text>

  <!-- Level 0: Softplus -->
  <rect x="350" y="90" width="200" height="50" rx="10" fill="#1a5276" stroke="#3498db" stroke-width="2"/>
  <text x="450" y="120" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="monospace">
    σ(x) = log(1+eˣ)
  </text>

  <!-- Arrow down -->
  <line x1="450" y1="140" x2="450" y2="165" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 1: Direct Properties -->
  <rect x="100" y="170" width="700" height="70" rx="10" fill="rgba(46,204,113,0.1)" stroke="#2ecc71" stroke-width="1"/>
  <text x="450" y="190" text-anchor="middle" fill="#2ecc71" font-size="13" font-weight="bold" font-family="Georgia">
    Depth 1: Direct Properties (17 theorems)
  </text>
  <text x="200" y="215" text-anchor="middle" fill="#aaddbb" font-size="10" font-family="monospace">σ &gt; 0</text>
  <text x="310" y="215" text-anchor="middle" fill="#aaddbb" font-size="10" font-family="monospace">σ' = S ∈ (0,1)</text>
  <text x="440" y="215" text-anchor="middle" fill="#aaddbb" font-size="10" font-family="monospace">1-Lipschitz</text>
  <text x="560" y="215" text-anchor="middle" fill="#aaddbb" font-size="10" font-family="monospace">Convex</text>
  <text x="670" y="215" text-anchor="middle" fill="#aaddbb" font-size="10" font-family="monospace">Non-polynomial</text>

  <!-- Level 2: Algebra -->
  <rect x="100" y="260" width="700" height="70" rx="10" fill="rgba(241,196,15,0.1)" stroke="#f1c40f" stroke-width="1"/>
  <text x="450" y="280" text-anchor="middle" fill="#f1c40f" font-size="13" font-weight="bold" font-family="Georgia">
    Depth 2: Sheffer Algebra (8 theorems + closures)
  </text>
  <text x="200" y="305" text-anchor="middle" fill="#ddcc88" font-size="10" font-family="monospace">id ∈ Algebra</text>
  <text x="350" y="305" text-anchor="middle" fill="#ddcc88" font-size="10" font-family="monospace">const ∈ Algebra</text>
  <text x="520" y="305" text-anchor="middle" fill="#ddcc88" font-size="10" font-family="monospace">affine ∈ Algebra</text>
  <text x="680" y="305" text-anchor="middle" fill="#ddcc88" font-size="10" font-family="monospace">comp closed</text>

  <!-- Level 3: Advanced -->
  <rect x="100" y="350" width="700" height="70" rx="10" fill="rgba(155,89,182,0.1)" stroke="#9b59b6" stroke-width="1"/>
  <text x="450" y="370" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="bold" font-family="Georgia">
    Depth 3: Advanced Theory (18+ theorems)
  </text>
  <text x="180" y="395" text-anchor="middle" fill="#bb99dd" font-size="10" font-family="monospace">Composition bound</text>
  <text x="340" y="395" text-anchor="middle" fill="#bb99dd" font-size="10" font-family="monospace">Width/depth</text>
  <text x="480" y="395" text-anchor="middle" fill="#bb99dd" font-size="10" font-family="monospace">Temperature family</text>
  <text x="650" y="395" text-anchor="middle" fill="#bb99dd" font-size="10" font-family="monospace">Identities</text>

  <!-- Level 4: New Results -->
  <rect x="100" y="440" width="700" height="70" rx="10" fill="rgba(231,76,60,0.1)" stroke="#e74c3c" stroke-width="1"/>
  <text x="450" y="460" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold" font-family="Georgia">
    Depth 4: New Discoveries (20+ theorems)
  </text>
  <text x="170" y="485" text-anchor="middle" fill="#ee8888" font-size="10" font-family="monospace">Lipschitz barrier</text>
  <text x="320" y="485" text-anchor="middle" fill="#ee8888" font-size="10" font-family="monospace">exp ∉ Algebra</text>
  <text x="460" y="485" text-anchor="middle" fill="#ee8888" font-size="10" font-family="monospace">Iterated σⁿ</text>
  <text x="590" y="485" text-anchor="middle" fill="#ee8888" font-size="10" font-family="monospace">S'=S(1-S)</text>
  <text x="720" y="485" text-anchor="middle" fill="#ee8888" font-size="10" font-family="monospace">Jensen ineq</text>

  <!-- Connecting arrows -->
  <line x1="450" y1="240" x2="450" y2="260" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="450" y1="330" x2="450" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="450" y1="420" x2="450" y2="440" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Counter box -->
  <rect x="300" y="530" width="300" height="45" rx="8" fill="rgba(52,152,219,0.2)" stroke="#3498db" stroke-width="1"/>
  <text x="450" y="550" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="Georgia">
    67+ Theorems • 0 Sorries
  </text>
  <text x="450" y="567" text-anchor="middle" fill="#aabbcc" font-size="11" font-family="Georgia">
    Machine-verified in Lean 4 with Mathlib
  </text>
</svg>
