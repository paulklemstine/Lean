<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <defs>
    <linearGradient id="bg_ode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
  </defs>

  <rect width="700" height="450" fill="url(#bg_ode)"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold" font-family="Georgia">
    The Sigmoid ODE: S' = S(1 − S)
  </text>
  <text x="350" y="58" text-anchor="middle" fill="#aa88cc" font-size="13" font-family="Georgia" font-style="italic">
    Formally Proved: sigmoid_deriv_eq
  </text>

  <!-- Phase portrait axes -->
  <line x1="60" y1="380" x2="340" y2="380" stroke="#555577" stroke-width="1"/>
  <line x1="60" y1="380" x2="60" y2="100" stroke="#555577" stroke-width="1"/>
  <text x="340" y="400" fill="#777799" font-size="11" font-family="monospace">S</text>
  <text x="40" y="105" fill="#777799" font-size="11" font-family="monospace">S'</text>

  <!-- Parabola S' = S(1-S) -->
  <!-- S ranges from 0 to 1, S' = S(1-S) peaks at 0.25 when S=0.5 -->
  <path d="M 60,380 Q 100,370 130,340 Q 160,295 190,260 Q 210,240 230,250 Q 260,270 280,310 Q 300,350 320,380"
        fill="none" stroke="#ff6688" stroke-width="3"/>

  <!-- Labels on parabola -->
  <text x="65" y="395" fill="#888899" font-size="9" font-family="monospace">0</text>
  <text x="185" y="395" fill="#888899" font-size="9" font-family="monospace">0.5</text>
  <text x="310" y="395" fill="#888899" font-size="9" font-family="monospace">1</text>

  <!-- Peak annotation -->
  <line x1="190" y1="258" x2="190" y2="380" stroke="#ff6688" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="195" y="250" fill="#ff6688" font-size="10" font-family="monospace">max at S=½</text>
  <text x="195" y="265" fill="#ff6688" font-size="10" font-family="monospace">S'=¼</text>

  <!-- Solution curves (right side) -->
  <text x="530" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="Georgia">
    Solutions
  </text>

  <!-- Axes for solutions -->
  <line x1="380" y1="380" x2="680" y2="380" stroke="#555577" stroke-width="1"/>
  <line x1="530" y1="120" x2="530" y2="400" stroke="#555577" stroke-width="1"/>
  <text x="685" y="385" fill="#777799" font-size="11" font-family="monospace">x</text>
  <text x="535" y="125" fill="#777799" font-size="11" font-family="monospace">S(x)</text>

  <!-- Horizontal asymptotes -->
  <line x1="380" y1="140" x2="680" y2="140" stroke="#444466" stroke-width="0.5" stroke-dasharray="3,5"/>
  <text x="685" y="144" fill="#444466" font-size="9" font-family="monospace">1</text>
  <line x1="380" y1="370" x2="680" y2="370" stroke="#444466" stroke-width="0.5" stroke-dasharray="3,5"/>
  <text x="685" y="374" fill="#444466" font-size="9" font-family="monospace">0</text>

  <!-- Sigmoid S(x) = e^x/(1+e^x) — the standard one S(0) = 0.5 -->
  <path d="M 390,365 Q 420,360 450,340 Q 480,300 510,260 Q 530,230 550,200 Q 580,170 610,155 Q 640,148 670,143"
        fill="none" stroke="#44bbff" stroke-width="2.5"/>
  <text x="675" y="155" fill="#44bbff" font-size="10" font-family="monospace">S(x)</text>

  <!-- Shifted sigmoid S(x-2) -->
  <path d="M 390,368 Q 440,365 480,360 Q 510,340 540,300 Q 560,260 580,220 Q 610,180 640,160 Q 660,150 670,146"
        fill="none" stroke="#88dd44" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="675" y="168" fill="#88dd44" font-size="9" font-family="monospace">S(x-2)</text>

  <!-- Shifted sigmoid S(x+2) -->
  <path d="M 390,355 Q 410,330 430,290 Q 450,250 470,210 Q 490,180 510,165 Q 540,150 570,145 Q 620,142 670,141"
        fill="none" stroke="#ffaa44" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="675" y="138" fill="#ffaa44" font-size="9" font-family="monospace">S(x+2)</text>

  <!-- Key insight box -->
  <rect x="380" y="395" width="300" height="45" rx="6" fill="rgba(255,102,136,0.15)" stroke="#ff6688" stroke-width="1"/>
  <text x="530" y="413" text-anchor="middle" fill="#ffccdd" font-size="11" font-family="Georgia">
    All solutions are shifted sigmoids:
  </text>
  <text x="530" y="430" text-anchor="middle" fill="#ff6688" font-size="12" font-weight="bold" font-family="monospace">
    S(x) = eˣ/(1+eˣ) shifted by c
  </text>
</svg>
