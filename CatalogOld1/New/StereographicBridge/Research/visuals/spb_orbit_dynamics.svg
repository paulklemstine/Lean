<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#faf5ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="12" fill="url(#bg3)" stroke="#94a3b8"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1e293b" font-weight="bold">SPB Orbit Dynamics on S¹</text>
  <text x="400" y="50" text-anchor="middle" font-family="serif" font-size="13" fill="#64748b">x ↦ spb(x, a) is rotation by 2·arctan(a) on the circle</text>

  <!-- Left: Periodic orbit (a=1, period 4) -->
  <g transform="translate(200, 220)">
    <text x="0" y="-140" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1e293b" font-weight="bold">Periodic: a = 1</text>
    <text x="0" y="-122" text-anchor="middle" font-family="serif" font-size="12" fill="#64748b">arctan(1)/π = 1/4 → period 4</text>

    <!-- Circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Orbit points -->
    <!-- 0 → C(0) = -1 at angle π -->
    <circle cx="-100" cy="0" r="7" fill="#2563eb" stroke="white" stroke-width="2"/>
    <text x="-120" y="5" text-anchor="end" font-size="12" fill="#2563eb" font-weight="bold">0</text>

    <!-- 1 → C(1) = -i at angle -π/2 (bottom) -->
    <circle cx="0" cy="100" r="7" fill="#dc2626" stroke="white" stroke-width="2"/>
    <text x="15" y="108" font-size="12" fill="#dc2626" font-weight="bold">1</text>

    <!-- ∞ → C(∞) = 1 at angle 0 -->
    <circle cx="100" cy="0" r="7" fill="#16a34a" stroke="white" stroke-width="2"/>
    <text x="115" y="5" font-size="12" fill="#16a34a" font-weight="bold">∞</text>

    <!-- -1 → C(-1) = i at angle π/2 (top) -->
    <circle cx="0" cy="-100" r="7" fill="#f59e0b" stroke="white" stroke-width="2"/>
    <text x="15" y="-105" font-size="12" fill="#f59e0b" font-weight="bold">−1</text>

    <!-- Arrows showing rotation -->
    <path d="M -85 -50 A 100 100 0 0 1 -50 -85" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <path d="M 50 -85 A 100 100 0 0 1 85 -50" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <path d="M 85 50 A 100 100 0 0 1 50 85" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <path d="M -50 85 A 100 100 0 0 1 -85 50" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead)"/>

    <text x="0" y="135" text-anchor="middle" font-size="12" fill="#7c3aed">0 → 1 → ∞ → −1 → 0</text>
  </g>

  <!-- Right: Dense orbit (a=1/2, irrational rotation) -->
  <g transform="translate(600, 220)">
    <text x="0" y="-140" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1e293b" font-weight="bold">Dense: a = 1/2</text>
    <text x="0" y="-122" text-anchor="middle" font-family="serif" font-size="12" fill="#64748b">arctan(1/2)/π irrational → equidistributed</text>

    <!-- Circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Many orbit points (simulated positions for arctan(0.5)/π ≈ 0.14758) -->
    <!-- Angles: 2*arctan(0.5) ≈ 0.9273 rad, stepping by this amount -->
    <!-- Step 0: π (starting from C(0)=-1) -->
    <circle cx="-100" cy="0" r="4" fill="#2563eb" opacity="0.9"/>
    <!-- Step 1: π + 0.9273 ≈ 4.069 → angle 4.069 -->
    <circle cx="-42" cy="-91" r="3" fill="#3b82f6" opacity="0.7"/>
    <!-- Step 2: 4.069 + 0.927 ≈ 4.996 -->
    <circle cx="60" cy="-80" r="3" fill="#60a5fa" opacity="0.7"/>
    <!-- Step 3 -->
    <circle cx="98" cy="17" r="3" fill="#60a5fa" opacity="0.7"/>
    <!-- Step 4 -->
    <circle cx="50" cy="87" r="3" fill="#60a5fa" opacity="0.7"/>
    <!-- Step 5 -->
    <circle cx="-37" cy="93" r="3" fill="#60a5fa" opacity="0.7"/>
    <!-- Step 6 -->
    <circle cx="-93" cy="37" r="3" fill="#60a5fa" opacity="0.7"/>
    <!-- Step 7 -->
    <circle cx="-77" cy="-64" r="3" fill="#60a5fa" opacity="0.6"/>
    <!-- Step 8 -->
    <circle cx="7" cy="-100" r="3" fill="#60a5fa" opacity="0.6"/>
    <!-- Step 9 -->
    <circle cx="85" cy="-53" r="3" fill="#60a5fa" opacity="0.6"/>
    <!-- Step 10 -->
    <circle cx="90" cy="44" r="3" fill="#93c5fd" opacity="0.5"/>
    <!-- Step 11 -->
    <circle cx="18" cy="98" r="3" fill="#93c5fd" opacity="0.5"/>
    <!-- Step 12 -->
    <circle cx="-72" cy="70" r="3" fill="#93c5fd" opacity="0.5"/>
    <!-- Step 13 -->
    <circle cx="-99" cy="-12" r="3" fill="#93c5fd" opacity="0.5"/>
    <!-- Step 14 -->
    <circle cx="-56" cy="-83" r="3" fill="#93c5fd" opacity="0.5"/>
    <!-- Step 15 -->
    <circle cx="30" cy="-95" r="3" fill="#93c5fd" opacity="0.4"/>
    <!-- More points scattered -->
    <circle cx="76" cy="-65" r="2" fill="#bfdbfe" opacity="0.4"/>
    <circle cx="96" cy="28" r="2" fill="#bfdbfe" opacity="0.4"/>
    <circle cx="42" cy="91" r="2" fill="#bfdbfe" opacity="0.4"/>
    <circle cx="-52" cy="86" r="2" fill="#bfdbfe" opacity="0.4"/>

    <text x="0" y="135" text-anchor="middle" font-size="12" fill="#2563eb">Orbit fills S¹ uniformly</text>
  </g>

  <!-- Legend -->
  <text x="400" y="380" text-anchor="middle" font-family="serif" font-size="12" fill="#475569" font-style="italic">Weyl's theorem: orbit is equidistributed ⟺ arctan(a)/π is irrational</text>
</svg>
