<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdf2f8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bg5)" stroke="#94a3b8"/>

  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1e293b" font-weight="bold">The p±1 Law</text>
  <text x="400" y="58" text-anchor="middle" font-family="serif" font-size="14" fill="#64748b">Order of the SPB group over 𝔽_p depends on p mod 4</text>

  <!-- Table header -->
  <rect x="80" y="80" width="640" height="35" rx="6" fill="#1e40af"/>
  <text x="130" y="103" text-anchor="middle" font-family="serif" font-size="14" fill="white" font-weight="bold">p</text>
  <text x="220" y="103" text-anchor="middle" font-family="serif" font-size="14" fill="white" font-weight="bold">p mod 4</text>
  <text x="340" y="103" text-anchor="middle" font-family="serif" font-size="14" fill="white" font-weight="bold">√(−1) ∈ 𝔽_p?</text>
  <text x="480" y="103" text-anchor="middle" font-family="serif" font-size="14" fill="white" font-weight="bold">Predicted</text>
  <text x="600" y="103" text-anchor="middle" font-family="serif" font-size="14" fill="white" font-weight="bold">Actual</text>
  <text x="680" y="103" text-anchor="middle" font-family="serif" font-size="14" fill="white" font-weight="bold">✓</text>

  <!-- Data rows -->
  <!-- p=3 -->
  <rect x="80" y="115" width="640" height="28" fill="#fce7f3"/>
  <text x="130" y="134" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">3</text>
  <text x="220" y="134" text-anchor="middle" font-family="serif" font-size="13" fill="#be185d" font-weight="bold">3</text>
  <text x="340" y="134" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">No</text>
  <text x="480" y="134" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">p+1 = 4</text>
  <text x="600" y="134" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b" font-weight="bold">4</text>
  <text x="680" y="134" text-anchor="middle" font-family="serif" font-size="15" fill="#16a34a" font-weight="bold">✓</text>

  <!-- p=5 -->
  <rect x="80" y="143" width="640" height="28" fill="#dbeafe"/>
  <text x="130" y="162" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">5</text>
  <text x="220" y="162" text-anchor="middle" font-family="serif" font-size="13" fill="#1d4ed8" font-weight="bold">1</text>
  <text x="340" y="162" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">Yes (2²≡−1)</text>
  <text x="480" y="162" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">p−1 = 4</text>
  <text x="600" y="162" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b" font-weight="bold">4</text>
  <text x="680" y="162" text-anchor="middle" font-family="serif" font-size="15" fill="#16a34a" font-weight="bold">✓</text>

  <!-- p=7 -->
  <rect x="80" y="171" width="640" height="28" fill="#fce7f3"/>
  <text x="130" y="190" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">7</text>
  <text x="220" y="190" text-anchor="middle" font-family="serif" font-size="13" fill="#be185d" font-weight="bold">3</text>
  <text x="340" y="190" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">No</text>
  <text x="480" y="190" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">p+1 = 8</text>
  <text x="600" y="190" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b" font-weight="bold">8</text>
  <text x="680" y="190" text-anchor="middle" font-family="serif" font-size="15" fill="#16a34a" font-weight="bold">✓</text>

  <!-- p=11 -->
  <rect x="80" y="199" width="640" height="28" fill="#fce7f3"/>
  <text x="130" y="218" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">11</text>
  <text x="220" y="218" text-anchor="middle" font-family="serif" font-size="13" fill="#be185d" font-weight="bold">3</text>
  <text x="340" y="218" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">No</text>
  <text x="480" y="218" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">p+1 = 12</text>
  <text x="600" y="218" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b" font-weight="bold">12</text>
  <text x="680" y="218" text-anchor="middle" font-family="serif" font-size="15" fill="#16a34a" font-weight="bold">✓</text>

  <!-- p=13 -->
  <rect x="80" y="227" width="640" height="28" fill="#dbeafe"/>
  <text x="130" y="246" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">13</text>
  <text x="220" y="246" text-anchor="middle" font-family="serif" font-size="13" fill="#1d4ed8" font-weight="bold">1</text>
  <text x="340" y="246" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">Yes (5²≡−1)</text>
  <text x="480" y="246" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">p−1 = 12</text>
  <text x="600" y="246" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b" font-weight="bold">12</text>
  <text x="680" y="246" text-anchor="middle" font-family="serif" font-size="15" fill="#16a34a" font-weight="bold">✓</text>

  <!-- p=17,19,23,29 abbreviated -->
  <rect x="80" y="255" width="640" height="28" fill="#dbeafe"/>
  <text x="130" y="274" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">17</text>
  <text x="220" y="274" text-anchor="middle" font-family="serif" font-size="13" fill="#1d4ed8" font-weight="bold">1</text>
  <text x="340" y="274" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">Yes (4²≡−1)</text>
  <text x="480" y="274" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">p−1 = 16</text>
  <text x="600" y="274" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b" font-weight="bold">16</text>
  <text x="680" y="274" text-anchor="middle" font-family="serif" font-size="15" fill="#16a34a" font-weight="bold">✓</text>

  <rect x="80" y="283" width="640" height="28" fill="#fce7f3"/>
  <text x="130" y="302" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">19</text>
  <text x="220" y="302" text-anchor="middle" font-family="serif" font-size="13" fill="#be185d" font-weight="bold">3</text>
  <text x="340" y="302" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">No</text>
  <text x="480" y="302" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b">p+1 = 20</text>
  <text x="600" y="302" text-anchor="middle" font-family="serif" font-size="13" fill="#1e293b" font-weight="bold">20</text>
  <text x="680" y="302" text-anchor="middle" font-family="serif" font-size="15" fill="#16a34a" font-weight="bold">✓</text>

  <!-- Explanation boxes -->
  <rect x="80" y="330" width="310" height="70" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="235" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#831843" font-weight="bold">p ≡ 3 (mod 4): Order = p + 1</text>
  <text x="235" y="370" text-anchor="middle" font-family="serif" font-size="11" fill="#831843">√(−1) ∉ 𝔽_p → Cayley maps to 𝔽_{p²}</text>
  <text x="235" y="386" text-anchor="middle" font-family="serif" font-size="11" fill="#831843">Image = {z : N(z)=1} has order p+1</text>

  <rect x="410" y="330" width="310" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="565" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e3a8a" font-weight="bold">p ≡ 1 (mod 4): Order = p − 1</text>
  <text x="565" y="370" text-anchor="middle" font-family="serif" font-size="11" fill="#1e3a8a">√(−1) ∈ 𝔽_p → Cayley maps to 𝔽_p*</text>
  <text x="565" y="386" text-anchor="middle" font-family="serif" font-size="11" fill="#1e3a8a">Image = 𝔽_p* has order p−1</text>

  <!-- Bottom note -->
  <text x="400" y="430" text-anchor="middle" font-family="serif" font-size="13" fill="#475569" font-weight="bold">Computationally verified for all primes p &lt; 10,000</text>
  <text x="400" y="450" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">Formal proof via Cayley transform over finite fields</text>

  <!-- Key insight -->
  <rect x="150" y="462" width="500" height="30" rx="6" fill="#1e40af"/>
  <text x="400" y="482" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="white" font-weight="bold">The Cayley transform C(x) = (1+ix)/(1−ix) is the bridge between SPB and 𝔽_p*</text>
</svg>
