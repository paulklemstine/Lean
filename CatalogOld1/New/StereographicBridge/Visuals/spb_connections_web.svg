<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d30"/>
      <stop offset="100%" style="stop-color:#1a0d30"/>
    </linearGradient>
    <filter id="gl2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#FFD700" font-size="24" font-weight="bold" filter="url(#gl2)">
    The SPB Connection Web
  </text>
  <text x="500" y="70" text-anchor="middle" fill="#aaa" font-size="12">
    One Formula, Seven Mathematical Worlds
  </text>

  <!-- Central formula -->
  <rect x="380" y="360" width="240" height="60" rx="15" fill="#1a2a5a" stroke="#FFD700" stroke-width="2.5" filter="url(#gl2)"/>
  <text x="500" y="385" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">spb(x, y) = (x+y)/(1-xy)</text>
  <text x="500" y="407" text-anchor="middle" fill="#ddd" font-size="11">Stereographic Projection Bridge</text>

  <!-- Connection 1: Trigonometry -->
  <line x1="500" y1="360" x2="500" y2="180" stroke="#ff6666" stroke-width="2" opacity="0.7"/>
  <rect x="410" y="130" width="180" height="55" rx="10" fill="#2a1a1a" stroke="#ff6666" stroke-width="1.5"/>
  <text x="500" y="152" text-anchor="middle" fill="#ff6666" font-size="13" font-weight="bold">Trigonometry</text>
  <text x="500" y="170" text-anchor="middle" fill="#ffaaaa" font-size="10">tan(α+β) = spb(tan α, tan β)</text>

  <!-- Connection 2: Special Relativity -->
  <line x1="620" y1="380" x2="850" y2="250" stroke="#66ff66" stroke-width="2" opacity="0.7"/>
  <rect x="760" y="200" width="180" height="55" rx="10" fill="#1a2a1a" stroke="#66ff66" stroke-width="1.5"/>
  <text x="850" y="222" text-anchor="middle" fill="#66ff66" font-size="13" font-weight="bold">Special Relativity</text>
  <text x="850" y="240" text-anchor="middle" fill="#aaffaa" font-size="10">v₁⊕v₂ = spbH(v₁,v₂)</text>

  <!-- Connection 3: Circle Group -->
  <line x1="380" y1="380" x2="150" y2="250" stroke="#6666ff" stroke-width="2" opacity="0.7"/>
  <rect x="60" y="200" width="180" height="55" rx="10" fill="#1a1a2a" stroke="#6666ff" stroke-width="1.5"/>
  <text x="150" y="222" text-anchor="middle" fill="#6666ff" font-size="13" font-weight="bold">Circle Group S¹</text>
  <text x="150" y="240" text-anchor="middle" fill="#aaaaff" font-size="10">Cayley: C(spb)=C·C</text>

  <!-- Connection 4: Hyperbolic Geometry -->
  <line x1="380" y1="400" x2="130" y2="480" stroke="#ffff66" stroke-width="2" opacity="0.7"/>
  <rect x="35" y="450" width="190" height="55" rx="10" fill="#2a2a1a" stroke="#ffff66" stroke-width="1.5"/>
  <text x="130" y="472" text-anchor="middle" fill="#ffff66" font-size="13" font-weight="bold">Hyperbolic Geometry</text>
  <text x="130" y="490" text-anchor="middle" fill="#ffffaa" font-size="10">Poincaré disk translation</text>

  <!-- Connection 5: Finite Fields -->
  <line x1="620" y1="400" x2="870" y2="480" stroke="#ff66ff" stroke-width="2" opacity="0.7"/>
  <rect x="775" y="450" width="190" height="55" rx="10" fill="#2a1a2a" stroke="#ff66ff" stroke-width="1.5"/>
  <text x="870" y="472" text-anchor="middle" fill="#ff66ff" font-size="13" font-weight="bold">Finite Fields 𝔽_p</text>
  <text x="870" y="490" text-anchor="middle" fill="#ffaaff" font-size="10">Group order p±1 law</text>

  <!-- Connection 6: Möbius Transformations -->
  <line x1="500" y1="420" x2="500" y2="580" stroke="#66ffff" stroke-width="2" opacity="0.7"/>
  <rect x="400" y="575" width="200" height="55" rx="10" fill="#1a2a2a" stroke="#66ffff" stroke-width="1.5"/>
  <text x="500" y="597" text-anchor="middle" fill="#66ffff" font-size="13" font-weight="bold">Möbius Transforms</text>
  <text x="500" y="615" text-anchor="middle" fill="#aaffff" font-size="10">M(a)·M(b) = (1-ab)·M(spb)</text>

  <!-- Connection 7: Chebyshev Polynomials -->
  <line x1="440" y1="420" x2="250" y2="620" stroke="#ffaa44" stroke-width="2" opacity="0.7"/>
  <rect x="150" y="595" width="200" height="55" rx="10" fill="#2a1a0a" stroke="#ffaa44" stroke-width="1.5"/>
  <text x="250" y="617" text-anchor="middle" fill="#ffaa44" font-size="13" font-weight="bold">Chebyshev Polynomials</text>
  <text x="250" y="635" text-anchor="middle" fill="#ffcc88" font-size="10">spbⁿ(tan θ) = tan(nθ)</text>

  <!-- Connection 8: Matrix Groups -->
  <line x1="560" y1="420" x2="750" y2="620" stroke="#88ff44" stroke-width="2" opacity="0.7"/>
  <rect x="655" y="595" width="190" height="55" rx="10" fill="#1a2a0a" stroke="#88ff44" stroke-width="1.5"/>
  <text x="750" y="617" text-anchor="middle" fill="#88ff44" font-size="13" font-weight="bold">GL(2,ℝ) Matrices</text>
  <text x="750" y="635" text-anchor="middle" fill="#bbff88" font-size="10">det M(a) = 1+a² &gt; 0</text>

  <!-- Verified stamp -->
  <rect x="350" y="720" width="300" height="40" rx="8" fill="#0d200d" stroke="#44ff88" stroke-width="1.5"/>
  <text x="500" y="745" text-anchor="middle" fill="#44ff88" font-size="13" font-weight="bold">
    ✓ All Connections Machine-Verified in Lean 4
  </text>

  <!-- Cross-connections (dotted) -->
  <line x1="150" y1="255" x2="150" y2="450" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="850" y1="255" x2="870" y2="450" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="250" y1="595" x2="500" y2="575" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="750" y1="595" x2="500" y2="575" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
</svg>
