  <line x1="200" y1="135" x2="200" y2="100" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
  <text x="200" y="95" text-anchor="middle" fill="#6699ff" font-size="9">p-adic SPB</text>
  <line x1="200" y1="135" x2="300" y2="105" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
