<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d30"/>
      <stop offset="100%" style="stop-color:#1a0a3e"/>
    </linearGradient>
    <radialGradient id="sphere" cx="45%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:0.1"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="600" fill="url(#bg2)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold">
    SPB on the Bloch Sphere
  </text>
  <text x="450" y="57" text-anchor="middle" fill="#aaa" font-size="13">
    Quantum gates as Möbius transformations of stereographic coordinates
  </text>
  
  <!-- Bloch Sphere -->
  <g transform="translate(280, 300)">
    <!-- Sphere outline -->
    <ellipse cx="0" cy="0" rx="180" ry="180" fill="url(#sphere)" stroke="#4a90d9" stroke-width="1.5" opacity="0.8"/>
    <!-- Equator -->
    <ellipse cx="0" cy="0" rx="180" ry="50" fill="none" stroke="#4a90d9" stroke-width="0.8" stroke-dasharray="5,5"/>
    <!-- Meridian -->
    <ellipse cx="0" cy="0" rx="50" ry="180" fill="none" stroke="#4a90d9" stroke-width="0.8" stroke-dasharray="5,5"/>
    
    <!-- Axes -->
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#555" stroke-width="0.5"/>
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#555" stroke-width="0.5"/>
    
    <!-- North pole |0⟩ -->
    <circle cx="0" cy="-180" r="8" fill="#2ecc71" filter="url(#glow2)"/>
    <text x="15" y="-175" fill="#2ecc71" font-size="14" font-weight="bold">|0⟩</text>
    <text x="15" y="-160" fill="#888" font-size="11">ζ = 0</text>
    
    <!-- South pole |1⟩ -->
    <circle cx="0" cy="180" r="8" fill="#e74c3c" filter="url(#glow2)"/>
    <text x="15" y="185" fill="#e74c3c" font-size="14" font-weight="bold">|1⟩</text>
    <text x="15" y="200" fill="#888" font-size="11">ζ = ∞</text>
    
    <!-- |+⟩ state -->
    <circle cx="180" cy="0" r="7" fill="#FFD700" filter="url(#glow2)"/>
    <text x="190" y="5" fill="#FFD700" font-size="13" font-weight="bold">|+⟩</text>
    <text x="190" y="20" fill="#888" font-size="10">ζ = 1</text>
    
    <!-- |−⟩ state -->
    <circle cx="-180" cy="0" r="7" fill="#e67e22" filter="url(#glow2)"/>
    <text x="-215" y="5" fill="#e67e22" font-size="13" font-weight="bold">|−⟩</text>
    <text x="-215" y="20" fill="#888" font-size="10">ζ = −1</text>
    
    <!-- |+i⟩ state (into page) -->
    <circle cx="0" cy="-50" r="5" fill="#9b59b6" filter="url(#glow2)" opacity="0.7"/>
    
    <!-- Hadamard arrow: |0⟩ → |+⟩ -->
    <path d="M 15,-170 Q 120,-130 170,-10" fill="none" stroke="#FFD700" stroke-width="2" marker-end="url(#arrowGold)"/>
    <text x="110" y="-120" fill="#FFD700" font-size="12" transform="rotate(-30, 110, -120)">H = spb(·, −1)</text>
    
    <!-- S gate arrow: rotation around Z -->
    <path d="M 175,15 Q 130,60 50,50" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="130" y="65" fill="#9b59b6" font-size="11">S = iζ</text>
  </g>
  
  <!-- Stereographic Plane -->
  <g transform="translate(700, 300)">
    <text x="0" y="-200" text-anchor="middle" fill="#FFD700" font-size="15" font-weight="bold">
      Stereographic Plane
    </text>
    
    <!-- Axes -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#555" stroke-width="1"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#555" stroke-width="1"/>
    <text x="135" y="5" fill="#666" font-size="11">Re</text>
    <text x="5" y="-145" fill="#666" font-size="11">Im</text>
    
    <!-- Unit circle -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="60" y="-65" fill="#4a90d9" font-size="10">|ζ|=1</text>
    
    <!-- Points -->
    <circle cx="0" cy="0" r="6" fill="#2ecc71" filter="url(#glow2)"/>
    <text x="10" y="-8" fill="#2ecc71" font-size="11">0 (|0⟩)</text>
    
    <circle cx="80" cy="0" r="5" fill="#FFD700" filter="url(#glow2)"/>
    <text x="85" y="-8" fill="#FFD700" font-size="11">1 (|+⟩)</text>
    
    <circle cx="-80" cy="0" r="5" fill="#e67e22" filter="url(#glow2)"/>
    <text x="-120" y="-8" fill="#e67e22" font-size="11">−1 (|−⟩)</text>
    
    <circle cx="0" cy="-80" r="5" fill="#9b59b6" filter="url(#glow2)"/>
    <text x="10" y="-85" fill="#9b59b6" font-size="11">i (|+i⟩)</text>
    
    <!-- SPB gate action -->
    <path d="M 8,8 Q 50,40 75,8" fill="none" stroke="#FFD700" stroke-width="1.5" marker-end="url(#arrowGold)"/>
    <text x="40" y="50" fill="#FFD700" font-size="10">spb(ζ, −1)</text>
  </g>
  
  <!-- Connection arrow -->
  <path d="M 465,300 L 560,300" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)" stroke-dasharray="5,5"/>
  <text x="512" y="290" text-anchor="middle" fill="#888" font-size="11">stereographic</text>
  <text x="512" y="305" text-anchor="middle" fill="#888" font-size="11">projection</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFD700"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  
  <!-- Key formulas -->
  <rect x="30" y="490" width="840" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="#333"/>
  <text x="450" y="515" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
    Key Formulas
  </text>
  <text x="220" y="540" text-anchor="middle" fill="#ddd" font-size="12">
    Hadamard: H(ζ) = spb(ζ, −1) = (ζ−1)/(ζ+1)
  </text>
  <text x="220" y="558" text-anchor="middle" fill="#ddd" font-size="12">
    Phase: S(ζ) = iζ
  </text>
  <text x="620" y="540" text-anchor="middle" fill="#ddd" font-size="12">
    Gate composition: spb(spb(ζ, a), b) = spb(ζ, spb(a, b))
  </text>
  <text x="620" y="558" text-anchor="middle" fill="#ddd" font-size="12">
    SPB gate det: 1 + w² (always nonzero for real w)
  </text>
</svg>
