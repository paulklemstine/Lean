<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#0a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="700" fill="url(#bg3)"/>

  <text x="450" y="40" text-anchor="middle" fill="#ffd700" font-size="24" font-weight="bold">
    SPB Over Finite Fields: Fixed Points and Quadratic Residues
  </text>

  <!-- F_5 example -->
  <rect x="30" y="70" width="400" height="280" rx="12" fill="#0a1528" stroke="#4488ff" stroke-width="2"/>
  <text x="230" y="100" text-anchor="middle" fill="#4488ff" font-size="18" font-weight="bold">𝔽₅: p ≡ 1 (mod 4)</text>
  <text x="230" y="125" text-anchor="middle" fill="#6699bb" font-size="13">−1 = 4 IS a quadratic residue (2²≡4)</text>

  <!-- Cayley table for F_5 -->
  <text x="230" y="150" text-anchor="middle" fill="#88aacc" font-size="14">SPB Cayley Table (mod 5)</text>

  <!-- Table header -->
  <text x="100" y="175" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">spb</text>
  <text x="140" y="175" text-anchor="middle" fill="#aabbcc" font-size="12">0</text>
  <text x="180" y="175" text-anchor="middle" fill="#aabbcc" font-size="12">1</text>
  <text x="220" y="175" text-anchor="middle" fill="#aabbcc" font-size="12">2</text>
  <text x="260" y="175" text-anchor="middle" fill="#aabbcc" font-size="12">3</text>
  <text x="300" y="175" text-anchor="middle" fill="#aabbcc" font-size="12">4</text>

  <!-- Row 0 -->
  <text x="100" y="195" text-anchor="middle" fill="#aabbcc" font-size="12">0</text>
  <text x="140" y="195" text-anchor="middle" fill="#ccddee" font-size="12">0</text>
  <text x="180" y="195" text-anchor="middle" fill="#ccddee" font-size="12">1</text>
  <text x="220" y="195" text-anchor="middle" fill="#ff6644" font-size="12">2</text>
  <text x="260" y="195" text-anchor="middle" fill="#ff6644" font-size="12">3</text>
  <text x="300" y="195" text-anchor="middle" fill="#ccddee" font-size="12">4</text>

  <!-- Row 1 -->
  <text x="100" y="215" text-anchor="middle" fill="#aabbcc" font-size="12">1</text>
  <text x="140" y="215" text-anchor="middle" fill="#ccddee" font-size="12">1</text>
  <text x="180" y="215" text-anchor="middle" fill="#ccddee" font-size="12">∞</text>
  <text x="220" y="215" text-anchor="middle" fill="#ff6644" font-size="12">2</text>
  <text x="260" y="215" text-anchor="middle" fill="#ccddee" font-size="12">0</text>
  <text x="300" y="215" text-anchor="middle" fill="#ff6644" font-size="12">3</text>

  <!-- Row 2 (fixed point!) -->
  <text x="100" y="235" text-anchor="middle" fill="#ff6644" font-size="12" font-weight="bold">2</text>
  <text x="140" y="235" text-anchor="middle" fill="#ff6644" font-size="12">2</text>
  <text x="180" y="235" text-anchor="middle" fill="#ff6644" font-size="12">2</text>
  <text x="220" y="235" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">∞</text>
  <text x="260" y="235" text-anchor="middle" fill="#ccddee" font-size="12">1</text>
  <text x="300" y="235" text-anchor="middle" fill="#ccddee" font-size="12">4</text>

  <!-- Row 3 (fixed point!) -->
  <text x="100" y="255" text-anchor="middle" fill="#ff6644" font-size="12" font-weight="bold">3</text>
  <text x="140" y="255" text-anchor="middle" fill="#ff6644" font-size="12">3</text>
  <text x="180" y="255" text-anchor="middle" fill="#ccddee" font-size="12">0</text>
  <text x="220" y="255" text-anchor="middle" fill="#ccddee" font-size="12">1</text>
  <text x="260" y="255" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">∞</text>
  <text x="300" y="255" text-anchor="middle" fill="#ff6644" font-size="12">3</text>

  <!-- Row 4 -->
  <text x="100" y="275" text-anchor="middle" fill="#aabbcc" font-size="12">4</text>
  <text x="140" y="275" text-anchor="middle" fill="#ccddee" font-size="12">4</text>
  <text x="180" y="275" text-anchor="middle" fill="#ff6644" font-size="12">3</text>
  <text x="220" y="275" text-anchor="middle" fill="#ccddee" font-size="12">4</text>
  <text x="260" y="275" text-anchor="middle" fill="#ff6644" font-size="12">3</text>
  <text x="300" y="275" text-anchor="middle" fill="#ccddee" font-size="12">∞</text>

  <text x="230" y="305" text-anchor="middle" fill="#ffd700" font-size="13" font-style="italic">
    Fixed points: 2² ≡ 4 ≡ −1, 3² ≡ 9 ≡ 4 ≡ −1
  </text>
  <text x="230" y="325" text-anchor="middle" fill="#ff6644" font-size="13">
    √(−1) mod 5 = {2, 3} → SPB has 2 fixed points
  </text>

  <!-- F_7 example -->
  <rect x="470" y="70" width="400" height="280" rx="12" fill="#0a2818" stroke="#44ff88" stroke-width="2"/>
  <text x="670" y="100" text-anchor="middle" fill="#44ff88" font-size="18" font-weight="bold">𝔽₇: p ≡ 3 (mod 4)</text>
  <text x="670" y="125" text-anchor="middle" fill="#66bb88" font-size="13">−1 = 6 is NOT a quadratic residue</text>

  <text x="670" y="155" text-anchor="middle" fill="#88ccaa" font-size="14">Orbit of 1 under SPB iteration:</text>

  <!-- Orbit diagram -->
  <circle cx="670" cy="240" r="70" fill="none" stroke="#44ff88" stroke-width="1.5" stroke-dasharray="4,4"/>

  <circle cx="740" cy="240" r="12" fill="#1a3322" stroke="#44ff88" stroke-width="2"/>
  <text x="740" y="244" text-anchor="middle" fill="#44ff88" font-size="12">1</text>

  <circle cx="705" cy="179" r="12" fill="#1a3322" stroke="#44ff88" stroke-width="2"/>
  <text x="705" y="183" text-anchor="middle" fill="#44ff88" font-size="12">3</text>

  <circle cx="635" cy="179" r="12" fill="#1a3322" stroke="#44ff88" stroke-width="2"/>
  <text x="635" y="183" text-anchor="middle" fill="#44ff88" font-size="12">∞</text>

  <circle cx="600" cy="240" r="12" fill="#1a3322" stroke="#44ff88" stroke-width="2"/>
  <text x="600" y="244" text-anchor="middle" fill="#44ff88" font-size="12">6</text>

  <circle cx="635" cy="301" r="12" fill="#1a3322" stroke="#44ff88" stroke-width="2"/>
  <text x="635" y="305" text-anchor="middle" fill="#44ff88" font-size="12">4</text>

  <circle cx="705" cy="301" r="12" fill="#1a3322" stroke="#44ff88" stroke-width="2"/>
  <text x="705" y="305" text-anchor="middle" fill="#44ff88" font-size="12">∞</text>

  <!-- Arrows between orbit points -->
  <text x="723" y="205" text-anchor="middle" fill="#88ffaa" font-size="10">→</text>
  <text x="670" y="175" text-anchor="middle" fill="#88ffaa" font-size="10">→</text>
  <text x="615" y="205" text-anchor="middle" fill="#88ffaa" font-size="10">→</text>
  <text x="615" y="275" text-anchor="middle" fill="#88ffaa" font-size="10">→</text>
  <text x="670" y="305" text-anchor="middle" fill="#88ffaa" font-size="10">→</text>
  <text x="723" y="275" text-anchor="middle" fill="#88ffaa" font-size="10">→</text>

  <text x="670" y="335" text-anchor="middle" fill="#ffd700" font-size="13" font-style="italic">
    No fixed points: SPB acts freely!
  </text>

  <!-- Bottom: Theorem -->
  <rect x="50" y="380" width="800" height="130" rx="12" fill="#0a0a1e" stroke="#ffd700" stroke-width="2"/>
  <text x="450" y="410" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="bold">
    Theorem (SPB Fixed Points over Fields)
  </text>
  <text x="450" y="440" text-anchor="middle" fill="#ccddee" font-size="15">
    For a ≠ 0 and 1−xa ≠ 0: spb(x, a) = x  ⟺  x² = −1
  </text>
  <text x="450" y="470" text-anchor="middle" fill="#aabbcc" font-size="14">
    Over 𝔽_p: Fixed points exist ⟺ p ≡ 1 (mod 4) ⟺ −1 is a quadratic residue
  </text>
  <text x="450" y="495" text-anchor="middle" fill="#88aacc" font-size="13" font-style="italic">
    Formally verified in Lean 4 (spbField_fixed_point)
  </text>

  <!-- Connections -->
  <rect x="50" y="530" width="800" height="140" rx="12" fill="#0a0a1e" stroke="#aa66ff" stroke-width="1.5"/>
  <text x="450" y="560" text-anchor="middle" fill="#aa66ff" font-size="16" font-weight="bold">
    Implications for Cryptography
  </text>
  <text x="450" y="590" text-anchor="middle" fill="#cc88ff" font-size="13">
    • SPB defines a group operation on 𝔽_p → potential Diffie-Hellman key exchange
  </text>
  <text x="450" y="615" text-anchor="middle" fill="#cc88ff" font-size="13">
    • Discrete log problem: given spbⁿ(1, a) mod p, find n
  </text>
  <text x="450" y="640" text-anchor="middle" fill="#cc88ff" font-size="13">
    • Group structure connects to ℙ¹(𝔽_p) — security analysis via projective geometry
  </text>
  <text x="450" y="665" text-anchor="middle" fill="#886688" font-size="11" font-style="italic">
    Caution: SPB group may be isomorphic to known cyclic groups — further analysis needed
  </text>
</svg>
