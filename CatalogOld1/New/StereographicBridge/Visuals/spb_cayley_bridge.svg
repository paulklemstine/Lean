<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#9b59b6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa" rx="10"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">
    The Cayley Transform: Unitary Bridge ℝ → S¹
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="13" fill="#7f8c8d" font-style="italic">
    C(x) = (x − i)/(x + i) maps the real line onto the unit circle
  </text>
  
  <!-- Real line (left side) -->
  <rect x="30" y="120" width="300" height="300" fill="url(#grad1)" rx="15" stroke="#3498db" stroke-width="2"/>
  <text x="180" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">ℝ (Real Line)</text>
  
  <!-- Draw number line -->
  <line x1="60" y1="270" x2="300" y2="270" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="180" cy="270" r="5" fill="#e74c3c"/> <!-- 0 -->
  <text x="180" y="290" text-anchor="middle" font-size="12" fill="#e74c3c">0</text>
  <circle cx="230" cy="270" r="4" fill="#3498db"/> <!-- 1 -->
  <text x="230" y="290" text-anchor="middle" font-size="12" fill="#3498db">1</text>
  <circle cx="130" cy="270" r="4" fill="#27ae60"/> <!-- -1 -->
  <text x="130" y="290" text-anchor="middle" font-size="12" fill="#27ae60">−1</text>
  <circle cx="270" cy="270" r="3" fill="#9b59b6"/> <!-- 2 -->
  <text x="270" y="290" text-anchor="middle" font-size="12" fill="#9b59b6">2</text>
  
  <!-- SPB operation -->
  <text x="180" y="340" text-anchor="middle" font-size="14" fill="#2c3e50">Group operation:</text>
  <text x="180" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#8e44ad">
    spb(x,y) = (x+y)/(1−xy)
  </text>
  <text x="180" y="390" text-anchor="middle" font-size="12" fill="#7f8c8d" font-style="italic">
    = tan(α+β) when x=tan α, y=tan β
  </text>
  
  <!-- Unit circle (right side) -->
  <rect x="470" y="120" width="300" height="300" fill="url(#grad1)" rx="15" stroke="#e74c3c" stroke-width="2"/>
  <text x="620" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">S¹ (Unit Circle)</text>
  
  <!-- Draw circle -->
  <circle cx="620" cy="280" r="80" fill="none" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Points on circle corresponding to real points -->
  <circle cx="540" cy="280" r="5" fill="#e74c3c"/> <!-- C(0)=-1 -->
  <text x="525" y="275" font-size="11" fill="#e74c3c">C(0)=−1</text>
  <circle cx="620" cy="360" r="4" fill="#3498db"/> <!-- C(1)=-i -->
  <text x="645" y="370" font-size="11" fill="#3498db">C(1)=−i</text>
  <circle cx="620" cy="200" r="4" fill="#27ae60"/> <!-- C(-1)=i -->
  <text x="645" y="205" font-size="11" fill="#27ae60">C(−1)=i</text>
  <circle cx="668" cy="316" r="3" fill="#9b59b6"/> <!-- C(2) -->
  <text x="680" y="330" font-size="11" fill="#9b59b6">C(2)</text>
  
  <!-- Multiplication label -->
  <text x="620" y="400" text-anchor="middle" font-size="14" fill="#2c3e50">Group operation:</text>
  <text x="620" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">
    z · w (multiplication)
  </text>
  
  <!-- Cayley transform arrows -->
  <line x1="340" y1="220" x2="460" y2="220" stroke="#2980b9" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="400" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">C(x)</text>
  <text x="400" y="230" text-anchor="middle" font-size="11" fill="#2980b9">(x−i)/(x+i)</text>
  
  <line x1="460" y1="250" x2="340" y2="250" stroke="#2980b9" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="400" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">C⁻¹(w)</text>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#2980b9">i(1+w)/(1−w)</text>
  
  <!-- Key property -->
  <rect x="250" y="440" width="300" height="45" fill="#ecf0f1" rx="8" stroke="#bdc3c7"/>
  <text x="400" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    C(spb(x,y)) = C(x) · C(y)
  </text>
  <text x="400" y="478" text-anchor="middle" font-size="12" fill="#7f8c8d">
    |C(x)| = 1 for all x ∈ ℝ (Unitarity)
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="90" text-anchor="middle" font-size="13" fill="#2c3e50">
    The Stereographic Projection Bridge
  </text>
</svg>
