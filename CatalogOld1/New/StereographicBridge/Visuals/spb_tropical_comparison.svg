<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#0a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)"/>

  <text x="400" y="40" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold">
    Classical vs Tropical SPB
  </text>

  <!-- Classical SPB box -->
  <rect x="30" y="70" width="350" height="380" rx="15" fill="#0d1a2e" stroke="#4488ff" stroke-width="2"/>
  <text x="205" y="100" text-anchor="middle" fill="#4488ff" font-size="18" font-weight="bold">Classical SPB</text>

  <text x="205" y="135" text-anchor="middle" fill="#88aaff" font-size="15">spb(x,y) = (x+y)/(1-xy)</text>

  <text x="60" y="175" fill="#aaccff" font-size="12">Operations:</text>
  <text x="60" y="195" fill="#8899bb" font-size="11">+ = addition, × = multiplication</text>
  <text x="60" y="215" fill="#8899bb" font-size="11">÷ = division</text>

  <text x="60" y="250" fill="#aaccff" font-size="12">Properties:</text>
  <text x="60" y="270" fill="#8899bb" font-size="11">✓ Commutative</text>
  <text x="60" y="290" fill="#8899bb" font-size="11">✓ Associative</text>
  <text x="60" y="310" fill="#8899bb" font-size="11">✓ Identity: 0</text>
  <text x="60" y="330" fill="#8899bb" font-size="11">✓ Inverse: -x</text>
  <text x="60" y="350" fill="#88ff88" font-size="11" font-weight="bold">→ Abelian Group</text>

  <text x="60" y="390" fill="#aaccff" font-size="12">Key identity:</text>
  <text x="60" y="410" fill="#8899bb" font-size="11">arctan(spb(x,y)) = arctan(x)+arctan(y)</text>

  <!-- Tropical SPB box -->
  <rect x="420" y="70" width="350" height="380" rx="15" fill="#1a0d0d" stroke="#ff4444" stroke-width="2"/>
  <text x="595" y="100" text-anchor="middle" fill="#ff4444" font-size="18" font-weight="bold">Tropical SPB</text>

  <text x="595" y="135" text-anchor="middle" fill="#ffaaaa" font-size="15">tspb(x,y) = min(x,y) - max(0,x+y)</text>

  <text x="450" y="175" fill="#ffcccc" font-size="12">Operations:</text>
  <text x="450" y="195" fill="#bb8899" font-size="11">⊕ = min, ⊗ = addition</text>
  <text x="450" y="215" fill="#bb8899" font-size="11">⊘ = subtraction</text>

  <text x="450" y="250" fill="#ffcccc" font-size="12">Properties:</text>
  <text x="450" y="270" fill="#bb8899" font-size="11">✓ Commutative</text>
  <text x="450" y="290" fill="#bb8899" font-size="11">? Associative (open)</text>
  <text x="450" y="310" fill="#bb8899" font-size="11">✗ Identity: 0 fails for x≥0</text>
  <text x="450" y="330" fill="#bb8899" font-size="11">? Inverse (open)</text>
  <text x="450" y="350" fill="#ffaa44" font-size="11" font-weight="bold">→ Quasigroup? (Conjecture)</text>

  <text x="450" y="390" fill="#ffcccc" font-size="12">Key identity:</text>
  <text x="450" y="410" fill="#bb8899" font-size="11">For x,y &lt; 0: tspb(x,y) = min(x,y)</text>

  <!-- Arrow between -->
  <text x="400" y="260" text-anchor="middle" fill="#FFD700" font-size="30">⟷</text>
  <text x="400" y="285" text-anchor="middle" fill="#FFD700" font-size="10">Tropicalization</text>

  <!-- Bottom -->
  <text x="400" y="480" text-anchor="middle" fill="#888" font-size="11">
    Both are commutative. The tropical version loses the group structure — an open research question.
  </text>
</svg>
