<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <filter id="glowd">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8c00"/>
    </marker>
  </defs>
  
  <rect width="900" height="500" fill="url(#bgd)"/>
  
  <text x="450" y="40" text-anchor="middle" fill="#f0c040" font-size="24" font-weight="bold" filter="url(#glowd)">
    Diagonal Map Orbit Dynamics: d(z) = eᶻ − ln(z)
  </text>
  
  <!-- Axes -->
  <line x1="80" y1="400" x2="850" y2="400" stroke="#555" stroke-width="1"/>
  <line x1="80" y1="400" x2="80" y2="70" stroke="#555" stroke-width="1"/>
  <text x="450" y="440" text-anchor="middle" fill="#888" font-size="13">z</text>
  <text x="50" y="230" text-anchor="middle" fill="#888" font-size="13" transform="rotate(-90, 50, 230)">d(z)</text>
  
  <!-- d(z) = z line (reference) -->
  <line x1="80" y1="400" x2="400" y2="80" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="380" y="100" fill="#555" font-size="11">y = z</text>
  
  <!-- d(z) curve (schematic) -->
  <path d="M 80,120 Q 200,380 300,350 Q 400,320 500,200 Q 600,120 700,80" 
        fill="none" stroke="#00c8ff" stroke-width="2.5" filter="url(#glowd)"/>
  <text x="710" y="75" fill="#00c8ff" font-size="13" font-weight="bold">d(z) = eᶻ − ln(z)</text>
  
  <!-- d(z) > z region annotation -->
  <text x="350" y="280" fill="#4a8" font-size="12" opacity="0.8">d(z) &gt; z always!</text>
  <text x="350" y="296" fill="#4a8" font-size="11" opacity="0.6">(no fixed points)</text>
  
  <!-- Minimum at W(1) ≈ 0.567 -->
  <circle cx="260" cy="355" r="5" fill="#ff4040" filter="url(#glowd)"/>
  <text x="260" y="375" text-anchor="middle" fill="#ff8080" font-size="11">min at z = W(1) ≈ 0.567</text>
  <text x="260" y="390" text-anchor="middle" fill="#ff8080" font-size="10">d(W(1)) ≈ 2.33</text>
  
  <!-- Orbit arrows starting from z₀ = 0.5 -->
  <circle cx="230" cy="400" r="3" fill="#ff8c00"/>
  <text x="230" y="420" text-anchor="middle" fill="#ff8c00" font-size="10">z₀=0.5</text>
  
  <!-- d(z) ≥ 2 annotation -->
  <line x1="80" y1="360" x2="850" y2="360" stroke="#40c040" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="860" y="363" fill="#40c040" font-size="11" text-anchor="end">d(z) ≥ 2 for z &gt; 0</text>
  
  <!-- Orbit visualization box -->
  <rect x="500" y="280" width="370" height="160" rx="8" fill="#1a1a3e" stroke="#ff8c00" stroke-width="1"/>
  <text x="685" y="305" text-anchor="middle" fill="#ff8c00" font-size="14" font-weight="bold">Orbit from z₀ = 0.5</text>
  <text x="520" y="328" fill="#fda" font-size="12">d⁰(0.5) = 0.500</text>
  <text x="520" y="346" fill="#fda" font-size="12">d¹(0.5) = 2.341  (+1.841)</text>
  <text x="520" y="364" fill="#fda" font-size="12">d²(0.5) = 9.539  (+7.197)</text>
  <text x="520" y="382" fill="#fda" font-size="12">d³(0.5) = 13920  (+13911)</text>
  <text x="520" y="400" fill="#fda" font-size="12">d⁴(0.5) → ∞     (escape!)</text>
  <text x="685" y="426" text-anchor="middle" fill="#888" font-size="11">✓ Strictly increasing (V7)</text>
  
  <!-- Key theorems box -->
  <rect x="80" y="445" width="740" height="45" rx="8" fill="#1a2a1e" stroke="#40c040" stroke-width="1"/>
  <text x="450" y="468" text-anchor="middle" fill="#40c040" font-size="13">
    ✓ diag7_gt: d(z) &gt; z ∀z | ✓ diag7_ge_two: d(z) ≥ 2 for z &gt; 0 | ✓ diag7_orbit_increasing
  </text>
</svg>
