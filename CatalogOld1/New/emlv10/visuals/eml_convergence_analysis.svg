<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="cvbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1020"/>
      <stop offset="100%" style="stop-color:#101830"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#cvbg)"/>

  <text x="450" y="30" text-anchor="middle" fill="#ffd700" font-size="20" font-weight="bold">
    EML Convergence Analysis: Training Dynamics
  </text>

  <!-- Chart area -->
  <g transform="translate(80, 50)">
    <!-- Grid -->
    <line x1="0" y1="0" x2="0" y2="340" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="340" x2="750" y2="340" stroke="#333" stroke-width="1"/>

    <!-- Y-axis gridlines -->
    <line x1="0" y1="0" x2="750" y2="0" stroke="#222" stroke-width="0.5"/>
    <line x1="0" y1="68" x2="750" y2="68" stroke="#222" stroke-width="0.5"/>
    <line x1="0" y1="136" x2="750" y2="136" stroke="#222" stroke-width="0.5"/>
    <line x1="0" y1="204" x2="750" y2="204" stroke="#222" stroke-width="0.5"/>
    <line x1="0" y1="272" x2="750" y2="272" stroke="#222" stroke-width="0.5"/>

    <!-- Y-axis labels -->
    <text x="-10" y="5" text-anchor="end" fill="#888" font-size="10">1.0</text>
    <text x="-10" y="73" text-anchor="end" fill="#888" font-size="10">0.8</text>
    <text x="-10" y="141" text-anchor="end" fill="#888" font-size="10">0.6</text>
    <text x="-10" y="209" text-anchor="end" fill="#888" font-size="10">0.4</text>
    <text x="-10" y="277" text-anchor="end" fill="#888" font-size="10">0.2</text>
    <text x="-10" y="345" text-anchor="end" fill="#888" font-size="10">0.0</text>

    <!-- X-axis labels -->
    <text x="0" y="360" text-anchor="middle" fill="#888" font-size="10">0</text>
    <text x="150" y="360" text-anchor="middle" fill="#888" font-size="10">20</text>
    <text x="300" y="360" text-anchor="middle" fill="#888" font-size="10">40</text>
    <text x="450" y="360" text-anchor="middle" fill="#888" font-size="10">60</text>
    <text x="600" y="360" text-anchor="middle" fill="#888" font-size="10">80</text>
    <text x="750" y="360" text-anchor="middle" fill="#888" font-size="10">100</text>

    <!-- Axis titles -->
    <text x="375" y="385" text-anchor="middle" fill="#aaa" font-size="12">Training Steps</text>
    <text x="-50" y="170" text-anchor="middle" fill="#aaa" font-size="12" transform="rotate(-90, -50, 170)">Loss</text>

    <!-- SGD slow (r=0.01) - red -->
    <polyline points="0,0 7.5,3 15,7 22.5,10 30,13 37.5,16 45,20 52.5,23 60,26 67.5,29 75,32 112.5,48 150,63 225,92 300,119 375,144 450,167 525,189 600,209 675,228 750,245"
             fill="none" stroke="#ef9a9a" stroke-width="1.5" opacity="0.7"/>

    <!-- SGD medium (r=0.05) - orange -->
    <polyline points="0,0 7.5,13 15,25 22.5,37 30,48 37.5,59 45,69 52.5,79 60,89 67.5,98 75,107 112.5,148 150,182 225,234 300,268 375,290 450,304 525,312 600,318 675,321 750,324"
             fill="none" stroke="#ff9800" stroke-width="1.5" opacity="0.7"/>

    <!-- Adam (r=0.10) - yellow -->
    <polyline points="0,0 7.5,25 15,47 22.5,67 30,85 37.5,102 45,117 52.5,130 60,142 67.5,153 75,163 112.5,215 150,250 225,293 300,316 375,328 450,334 525,337 600,338 675,339 750,339"
             fill="none" stroke="#ffd700" stroke-width="2" opacity="0.8"/>

    <!-- EML-Adam (r=0.15) - green -->
    <polyline points="0,0 7.5,36 15,65 22.5,88 30,107 37.5,123 45,135 52.5,146 60,154 67.5,161 75,167 112.5,222 150,262 225,306 300,325 375,333 450,337 525,338 600,339 675,339 750,340"
             fill="none" stroke="#81c784" stroke-width="2.5"/>

    <!-- EML-Fast (r=0.20) - cyan -->
    <polyline points="0,0 7.5,46 15,80 22.5,105 30,124 37.5,138 45,149 52.5,157 60,164 67.5,169 75,173 112.5,230 150,272 225,314 300,330 375,336 450,338 525,339 600,340 675,340 750,340"
             fill="none" stroke="#4fc3f7" stroke-width="2.5"/>

    <!-- Legend -->
    <rect x="510" y="10" width="230" height="130" rx="5" fill="rgba(0,0,0,0.5)" stroke="#333"/>
    <text x="525" y="30" fill="#aaa" font-size="11" font-weight="bold">Convergence Rate:</text>

    <line x1="525" y1="48" x2="555" y2="48" stroke="#ef9a9a" stroke-width="1.5"/>
    <text x="565" y="52" fill="#ef9a9a" font-size="10">SGD (r=0.01)</text>

    <line x1="525" y1="68" x2="555" y2="68" stroke="#ff9800" stroke-width="1.5"/>
    <text x="565" y="72" fill="#ff9800" font-size="10">SGD (r=0.05)</text>

    <line x1="525" y1="88" x2="555" y2="88" stroke="#ffd700" stroke-width="2"/>
    <text x="565" y="92" fill="#ffd700" font-size="10">Adam (r=0.10)</text>

    <line x1="525" y1="108" x2="555" y2="108" stroke="#81c784" stroke-width="2.5"/>
    <text x="565" y="112" fill="#81c784" font-size="10">EML-Adam (r=0.15)</text>

    <line x1="525" y1="128" x2="555" y2="128" stroke="#4fc3f7" stroke-width="2.5"/>
    <text x="565" y="132" fill="#4fc3f7" font-size="10">EML-Fast (r=0.20)</text>
  </g>

  <!-- Formula box -->
  <rect x="100" y="440" width="700" height="45" rx="8" fill="rgba(255,215,0,0.05)" stroke="#ffd70044"/>
  <text x="450" y="460" text-anchor="middle" fill="#ffd700" font-size="13">
    L(t) = (1−r)ᵗ · L₀ → 0 as t → ∞  (formally verified: geom_decay_tendsto, adam_lr_pos, adam_lr_mono)
  </text>
  <text x="450" y="478" text-anchor="middle" fill="#aaa" font-size="11">
    EML achieves faster convergence through adaptive learning rates and natural gradient structure
  </text>
</svg>
