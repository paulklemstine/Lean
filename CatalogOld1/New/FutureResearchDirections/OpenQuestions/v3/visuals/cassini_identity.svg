<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Georgia', serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffd700" font-size="20" font-weight="bold">
    Cassini's Identity → Fibonacci Entry Point Theorem
  </text>

  <!-- Cassini Box -->
  <rect x="30" y="60" width="350" height="130" rx="10" fill="#1a1a3e" stroke="#4af" stroke-width="2"/>
  <text x="205" y="85" text-anchor="middle" fill="#4af" font-size="14" font-weight="bold">Cassini's Identity ✓</text>
  <text x="205" y="115" text-anchor="middle" fill="white" font-size="18">
    F(n+1)² − F(n)·F(n+2) = (−1)ⁿ
  </text>
  <text x="205" y="145" text-anchor="middle" fill="#8af" font-size="12">Proof: induction + linear_combination</text>
  <text x="205" y="170" text-anchor="middle" fill="#6a8" font-size="11">fib_cassini — Verified ✓</text>

  <!-- Arrow -->
  <line x1="380" y1="125" x2="420" y2="125" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#ffd700"/>
  </marker></defs>

  <!-- Cassini-Prime Box -->
  <rect x="420" y="60" width="350" height="130" rx="10" fill="#1a1a3e" stroke="#4af" stroke-width="2"/>
  <text x="595" y="85" text-anchor="middle" fill="#4af" font-size="14" font-weight="bold">For Odd Primes ✓</text>
  <text x="595" y="115" text-anchor="middle" fill="white" font-size="18">
    F(p−1)·F(p+1) = F(p)² − 1
  </text>
  <text x="595" y="145" text-anchor="middle" fill="#8af" font-size="12">Since (−1)^{p−1} = 1 for odd p</text>
  <text x="595" y="170" text-anchor="middle" fill="#6a8" font-size="11">fib_cassini_prime — Verified ✓</text>

  <!-- Key Lemma Box -->
  <rect x="220" y="210" width="360" height="70" rx="10" fill="#2a1a1a" stroke="#f84" stroke-width="2"/>
  <text x="400" y="235" text-anchor="middle" fill="#f84" font-size="14" font-weight="bold">Key Lemma (Remaining Sorry)</text>
  <text x="400" y="260" text-anchor="middle" fill="white" font-size="16">
    p | F(p)² − 1  for p ≠ 5
  </text>

  <!-- Arrow down -->
  <line x1="400" y1="190" x2="400" y2="210" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Entry Point Box -->
  <rect x="130" y="300" width="540" height="85" rx="10" fill="#1a3a1a" stroke="#4d4" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" fill="#6d6" font-size="14" font-weight="bold">
    Fibonacci Entry Point Theorem
  </text>
  <text x="400" y="350" text-anchor="middle" fill="white" font-size="18">
    For prime p ≠ 5: p | F(p−1) or p | F(p+1)
  </text>
  <text x="400" y="372" text-anchor="middle" fill="#8c8" font-size="11">
    fib_entry_point — Verified modulo fib_sq_mod_prime
  </text>

  <!-- Arrow up -->
  <line x1="400" y1="280" x2="400" y2="300" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Logic annotation -->
  <text x="455" y="298" fill="#aaa" font-size="10">p prime: p | ab ⟹ p|a or p|b</text>
</svg>
