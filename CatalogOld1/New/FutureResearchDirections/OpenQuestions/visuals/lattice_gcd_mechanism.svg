<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#141428"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4488ff"/>
    </marker>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg3)"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-size="22" font-weight="bold">
    Lattice-GCD Factor Extraction (Direction 2)
  </text>
  <text x="400" y="58" text-anchor="middle" fill="#8b949e" font-size="13">
    Can short lattice vectors reveal factors of N? (Potentially polynomial-time!)
  </text>
  
  <!-- Step 1: Lattice Construction -->
  <rect x="30" y="80" width="350" height="200" rx="10" fill="rgba(68,136,255,0.1)" stroke="#4488ff" stroke-width="2"/>
  <text x="205" y="105" text-anchor="middle" fill="#4488ff" font-size="16" font-weight="bold">Step 1: Construct Lattice</text>
  
  <!-- Lattice grid -->
  <g transform="translate(80, 120)">
    <!-- Grid dots -->
    <circle cx="0" cy="0" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="40" cy="0" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="80" cy="0" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="120" cy="0" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="160" cy="0" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="200" cy="0" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="0" cy="40" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="40" cy="40" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="80" cy="40" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="120" cy="40" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="160" cy="40" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="200" cy="40" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="0" cy="80" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="40" cy="80" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="80" cy="80" r="6" fill="#ffd700"/>
    <circle cx="120" cy="80" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="160" cy="80" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="200" cy="80" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="0" cy="120" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="40" cy="120" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="80" cy="120" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="120" cy="120" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="160" cy="120" r="3" fill="#4488ff" opacity="0.5"/>
    <circle cx="200" cy="120" r="3" fill="#4488ff" opacity="0.5"/>
    
    <!-- Short vector (highlighted) -->
    <line x1="80" y1="80" x2="120" y2="40" stroke="#ff6644" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="115" y="55" fill="#ff6644" font-size="11" font-weight="bold">b₁ (short)</text>
  </g>
  
  <text x="205" y="260" text-anchor="middle" fill="#aab" font-size="11">L = {v ∈ ℤⁿ : v·t ≡ 0 (mod N)}</text>
  <text x="205" y="275" text-anchor="middle" fill="#aab" font-size="11">det(L) = N</text>
  
  <!-- Step 2: LLL Reduction -->
  <rect x="420" y="80" width="350" height="200" rx="10" fill="rgba(68,221,136,0.1)" stroke="#44dd88" stroke-width="2"/>
  <text x="595" y="105" text-anchor="middle" fill="#44dd88" font-size="16" font-weight="bold">Step 2: LLL Reduction</text>
  
  <text x="595" y="135" text-anchor="middle" fill="#aab" font-size="12">LLL guarantee:</text>
  <text x="595" y="160" text-anchor="middle" fill="#66ee99" font-size="15" font-weight="bold">‖b₁‖ ≤ 2^{(n-1)/4} · N^{1/n}</text>
  
  <text x="595" y="195" text-anchor="middle" fill="#aab" font-size="12">For n = ⌈log₂ N⌉:</text>
  <text x="595" y="215" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">N^{1/n} = N^{1/log₂ N} = 2</text>
  <text x="595" y="240" text-anchor="middle" fill="#aab" font-size="12">⟹ entries have magnitude O(1)!</text>
  <text x="595" y="260" text-anchor="middle" fill="#aab" font-size="11">Runtime: O(n⁵ · (log B)³) = O((log N)⁸)</text>
  
  <!-- Step 3: Factor Extraction -->
  <rect x="30" y="310" width="740" height="120" rx="10" fill="rgba(255,215,0,0.1)" stroke="#ffd700" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold">Step 3: Factor Extraction</text>
  
  <text x="200" y="365" text-anchor="middle" fill="#aab" font-size="13">If v = (v₁, v₂, ..., vₙ) is short:</text>
  <text x="200" y="390" text-anchor="middle" fill="#66ee99" font-size="14" font-weight="bold">gcd(vᵢ, N) may be nontrivial</text>
  
  <text x="600" y="365" text-anchor="middle" fill="#aab" font-size="13">Formally verified (Lean 4):</text>
  <text x="600" y="390" text-anchor="middle" fill="#44dd88" font-size="13">lattice_factor_extraction ✓</text>
  <text x="600" y="410" text-anchor="middle" fill="#44dd88" font-size="13">lattice_gcd_invariant ✓</text>
  
  <!-- Complexity comparison -->
  <rect x="30" y="450" width="740" height="130" rx="10" fill="rgba(170,68,255,0.1)" stroke="#aa44ff" stroke-width="2"/>
  <text x="400" y="475" text-anchor="middle" fill="#aa44ff" font-size="16" font-weight="bold">Complexity Comparison</text>
  
  <text x="150" y="505" text-anchor="middle" fill="#ff6644" font-size="13">Trial Division</text>
  <text x="150" y="525" text-anchor="middle" fill="#ff8866" font-size="15" font-weight="bold">O(√N)</text>
  <text x="150" y="543" text-anchor="middle" fill="#888" font-size="11">Exponential</text>
  
  <text x="320" y="505" text-anchor="middle" fill="#4488ff" font-size="13">Quadratic Sieve</text>
  <text x="320" y="525" text-anchor="middle" fill="#6699ff" font-size="14" font-weight="bold">L(N)¹</text>
  <text x="320" y="543" text-anchor="middle" fill="#888" font-size="11">Subexponential</text>
  
  <text x="490" y="505" text-anchor="middle" fill="#44dd88" font-size="13">GNFS</text>
  <text x="490" y="525" text-anchor="middle" fill="#66ee99" font-size="14" font-weight="bold">L(N)^{2/3}</text>
  <text x="490" y="543" text-anchor="middle" fill="#888" font-size="11">Subexponential</text>
  
  <text x="660" y="505" text-anchor="middle" fill="#ffd700" font-size="13">Lattice-GCD?</text>
  <text x="660" y="525" text-anchor="middle" fill="#ffd700" font-size="15" font-weight="bold">O((log N)⁸)</text>
  <text x="660" y="543" text-anchor="middle" fill="#ffd700" font-size="11" font-weight="bold">POLYNOMIAL!</text>
  
  <text x="400" y="575" text-anchor="middle" fill="#ff4444" font-size="13" font-style="italic">
    ⚠ If the O((log N)⁸) bound holds, this would be a breakthrough in factoring complexity
  </text>
</svg>
