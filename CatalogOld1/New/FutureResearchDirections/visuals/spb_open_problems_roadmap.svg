    <rect x="80" y="770" width="1040" height="25" rx="2" fill="rgba(76,175,80,0.05)"/>
    <text x="130" y="787" fill="#ccc">H9</text>
    <text x="500" y="787" fill="#ccc">SPB-CORDIC faster than standard CORDIC</text>
    <text x="850" y="787" fill="#4CAF50">~25% ops reduction</text>
    <text x="1000" y="787" fill="#4CAF50">Proven</text>

    <rect x="80" y="797" width="1040" height="25" rx="2" fill="rgba(76,175,80,0.08)"/>
    <text x="130" y="814" fill="#ccc">H10</text>
