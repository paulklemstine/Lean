    <text x="0" y="-5" text-anchor="middle" fill="#00BCD4" font-size="13" font-weight="bold">EML Compiler</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="10">f(x) → EML expression tree</text>
    <text x="0" y="30" text-anchor="middle" fill="#888" font-size="9">Minimize exp/log evaluations</text>
    <text x="0" y="50" text-anchor="middle" fill="#4CAF50" font-size="10">Common subexpression elim.</text>
  </g>

  <g transform="translate(1050, 400)">
    <rect x="-120" y="-25" width="240" height="100" rx="8" fill="rgba(0,188,212,0.1)" stroke="#00BCD4" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#00BCD4" font-size="13" font-weight="bold">SPB Kalman Filter</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="10">x_{k} = spb(x_{k-1}, K·innov)</text>
    <text x="0" y="30" text-anchor="middle" fill="#888" font-size="9">No angle wrapping needed</text>
    <text x="0" y="50" text-anchor="middle" fill="#4CAF50" font-size="10">Robotics, IMU fusion</text>
  </g>

