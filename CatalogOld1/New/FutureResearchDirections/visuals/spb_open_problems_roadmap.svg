    <circle cx="400" cy="148" r="5" fill="#2196F3"/>
    <text x="415" y="152" fill="#ccc" font-size="11">H5: Approximation Theory</text>
    <text x="415" y="166" fill="#888" font-size="9">SPB trees ↔ trig polynomials</text>

    <circle cx="400" cy="185" r="5" fill="#2196F3"/>
    <text x="415" y="189" fill="#ccc" font-size="11">H4: 3D SPB = Quaternions</text>
    <text x="415" y="203" fill="#888" font-size="9">Thomas-Wigner rotation</text>

    <circle cx="400" cy="222" r="5" fill="#2196F3"/>
    <text x="415" y="226" fill="#ccc" font-size="11">H2: Random SPB → Cauchy</text>
    <text x="415" y="240" fill="#888" font-size="9">Lyapunov exponent λ</text>

    <circle cx="400" cy="259" r="5" fill="#2196F3"/>
    <text x="415" y="263" fill="#ccc" font-size="11">All-Pass Filter Design</text>
    <text x="415" y="277" fill="#888" font-size="9">SPB cascade parametrization</text>
  </g>

