    <text x="850" y="706" fill="#4CAF50">✓ Confirmed</text>
    <text x="1000" y="706" fill="#4CAF50">Partial</text>

    <rect x="80" y="716" width="1040" height="25" rx="2" fill="rgba(76,175,80,0.05)"/>
