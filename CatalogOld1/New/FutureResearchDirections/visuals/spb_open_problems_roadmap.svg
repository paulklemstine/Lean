    <text x="0" y="-5" text-anchor="middle" fill="#00BCD4" font-size="13" font-weight="bold">SPB Gradient Descent</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="10">t_{n+1} = spb(t_n, −η∇f/(1+t²))</text>
    <text x="0" y="30" text-anchor="middle" fill="#888" font-size="9">Intrinsic on S¹, no wrapping</text>
    <text x="0" y="50" text-anchor="middle" fill="#4CAF50" font-size="10">Phase estimation applications</text>
  </g>

  <g transform="translate(750, 400)">
