<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="g2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="1000" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#FFD700" font-size="24" font-weight="bold" filter="url(#g2)">
    SPB–EML Open Problems Research Roadmap
  </text>

  <!-- Timeline axis -->
  <line x1="100" y1="85" x2="1100" y2="85" stroke="#444" stroke-width="2"/>
  <text x="200" y="78" text-anchor="middle" fill="#888" font-size="11">IMMEDIATE</text>
  <text x="500" y="78" text-anchor="middle" fill="#888" font-size="11">3-6 MONTHS</text>
  <text x="800" y="78" text-anchor="middle" fill="#888" font-size="11">6-12 MONTHS</text>
  <text x="1050" y="78" text-anchor="middle" fill="#888" font-size="11">1+ YEARS</text>

  <!-- Priority 1 boxes -->
  <g>
    <rect x="50" y="100" width="300" height="160" rx="8" fill="rgba(76,175,80,0.1)" stroke="#4CAF50" stroke-width="2"/>
    <text x="200" y="125" text-anchor="middle" fill="#4CAF50" font-size="14" font-weight="bold">Priority 1: Immediate</text>

    <circle cx="80" cy="148" r="5" fill="#4CAF50"/>
    <text x="95" y="152" fill="#ccc" font-size="11">H1: SPB Neural Networks</text>
    <text x="95" y="166" fill="#888" font-size="9">10-30% gain on periodic data</text>

    <circle cx="80" cy="185" r="5" fill="#4CAF50"/>
    <text x="95" y="189" fill="#ccc" font-size="11">H6: EML Computation Engine</text>
    <text x="95" y="203" fill="#888" font-size="9">ALU from single primitive</text>

    <circle cx="80" cy="222" r="5" fill="#4CAF50"/>
    <text x="95" y="226" fill="#ccc" font-size="11">H3: Finite Field Crypto</text>
    <text x="95" y="240" fill="#888" font-size="9">DH over SPB(𝔽ₚ) for IoT</text>
  </g>

  <!-- Priority 2 boxes -->
  <g>
    <rect x="370" y="100" width="300" height="200" rx="8" fill="rgba(33,150,243,0.1)" stroke="#2196F3" stroke-width="2"/>
