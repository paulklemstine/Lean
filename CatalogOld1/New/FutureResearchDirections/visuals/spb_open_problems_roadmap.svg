    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="10">t_{n+1} = spb(t_n, d_n·2⁻ⁿ)</text>
    <text x="0" y="30" text-anchor="middle" fill="#888" font-size="9">Single scalar op vs two parallel</text>
    <text x="0" y="50" text-anchor="middle" fill="#4CAF50" font-size="10">Est. 25% op reduction</text>
  </g>

  <g transform="translate(450, 400)">
