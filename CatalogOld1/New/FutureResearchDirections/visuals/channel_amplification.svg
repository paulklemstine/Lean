<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <rect width="850" height="500" fill="url(#bg4)"/>

  <text x="425" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">
    Channel Amplification: Factoring Power vs. Dimension
  </text>
  <text x="425" y="55" text-anchor="middle" fill="#888" font-size="12">
    Total factoring channels = k (peel) + C(k,2) (cross-collision) = k(k+1)/2
  </text>

  <!-- Chart area -->
  <g transform="translate(100, 80)">
    <!-- Axes -->
    <line x1="0" y1="350" x2="650" y2="350" stroke="#555" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="350" stroke="#555" stroke-width="2"/>

    <!-- Y-axis labels -->
    <text x="-10" y="350" text-anchor="end" fill="#888" font-size="11">0</text>
    <text x="-10" y="280" text-anchor="end" fill="#888" font-size="11">100</text>
    <text x="-10" y="210" text-anchor="end" fill="#888" font-size="11">200</text>
    <text x="-10" y="140" text-anchor="end" fill="#888" font-size="11">300</text>
    <text x="-10" y="70" text-anchor="end" fill="#888" font-size="11">400</text>
    <text x="-10" y="0" text-anchor="end" fill="#888" font-size="11">500</text>

    <!-- Grid lines -->
    <g stroke="#222" stroke-width="1">
      <line x1="0" y1="280" x2="650" y2="280"/>
      <line x1="0" y1="210" x2="650" y2="210"/>
      <line x1="0" y1="140" x2="650" y2="140"/>
      <line x1="0" y1="70" x2="650" y2="70"/>
    </g>

    <!-- Bars: peel channels (bottom) + cross-collision channels (top) -->
    <!-- k=1: 1+0=1 -->
    <rect x="10" y="349.3" width="30" height="0.7" fill="#4a9eff"/>
    <text x="25" y="365" text-anchor="middle" fill="#888" font-size="10">1</text>

    <!-- k=2: 2+1=3 -->
    <rect x="55" y="347.9" width="30" height="1.4" fill="#4a9eff"/>
    <rect x="55" y="347.2" width="30" height="0.7" fill="#ff6b6b"/>
    <text x="70" y="365" text-anchor="middle" fill="#888" font-size="10">2</text>

    <!-- k=3: 3+3=6 -->
    <rect x="100" y="345.8" width="30" height="2.1" fill="#4a9eff"/>
    <rect x="100" y="343.7" width="30" height="2.1" fill="#ff6b6b"/>
    <text x="115" y="365" text-anchor="middle" fill="#888" font-size="10">3</text>

    <!-- k=4: 4+6=10 -->
    <rect x="145" y="347.2" width="30" height="2.8" fill="#4a9eff"/>
    <rect x="145" y="343.0" width="30" height="4.2" fill="#ff6b6b"/>
    <text x="160" y="365" text-anchor="middle" fill="#4a4" font-size="10" font-weight="bold">4</text>
    <text x="160" y="337" text-anchor="middle" fill="#aaa" font-size="9">ℍ</text>

    <!-- k=5: 5+10=15 -->
    <rect x="190" y="346.5" width="30" height="3.5" fill="#4a9eff"/>
    <rect x="190" y="339.5" width="30" height="7.0" fill="#ff6b6b"/>
    <text x="205" y="365" text-anchor="middle" fill="#888" font-size="10">5</text>

    <!-- k=8: 8+28=36 -->
    <rect x="280" y="344.4" width="30" height="5.6" fill="#4a9eff"/>
    <rect x="280" y="324.8" width="30" height="19.6" fill="#ff6b6b"/>
    <text x="295" y="365" text-anchor="middle" fill="#f64" font-size="10" font-weight="bold">8</text>
    <text x="295" y="318" text-anchor="middle" fill="#aaa" font-size="9">𝕆</text>

    <!-- k=16: 16+120=136 -->
    <rect x="415" y="338.8" width="30" height="11.2" fill="#4a9eff"/>
    <rect x="415" y="254.8" width="30" height="84.0" fill="#ff6b6b"/>
    <text x="430" y="365" text-anchor="middle" fill="#fc4" font-size="10" font-weight="bold">16</text>
    <text x="430" y="248" text-anchor="middle" fill="#aaa" font-size="9">𝕊</text>

    <!-- k=32: 32+496=528 -->
    <rect x="555" y="327.6" width="30" height="22.4" fill="#4a9eff"/>
    <rect x="555" y="-19.6" width="30" height="347.2" fill="#ff6b6b"/>
    <text x="570" y="365" text-anchor="middle" fill="#f4a" font-size="10" font-weight="bold">32</text>
    <text x="570" y="-25" text-anchor="middle" fill="#aaa" font-size="9">𝕋</text>

    <!-- Quadratic growth curve -->
    <path d="M 25,349 Q 70,348 115,346 Q 160,343 205,340 Q 295,325 430,255 Q 570,0 650,-200"
          fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>

    <!-- X-axis label -->
    <text x="325" y="390" text-anchor="middle" fill="#aaa" font-size="13">Dimension k</text>

    <!-- Y-axis label -->
    <text x="-45" y="175" text-anchor="middle" fill="#aaa" font-size="13" transform="rotate(-90, -45, 175)">
      Total Channels
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(520, 420)">
    <rect x="0" y="0" width="280" height="60" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
    <rect x="15" y="12" width="15" height="12" fill="#4a9eff"/>
    <text x="38" y="22" fill="#ccc" font-size="11">Peel channels (k)</text>
    <rect x="15" y="32" width="15" height="12" fill="#ff6b6b"/>
    <text x="38" y="42" fill="#ccc" font-size="11">Cross-collision channels (C(k,2))</text>
    <line x1="155" y1="18" x2="185" y2="18" stroke="#ffd700" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="193" y="22" fill="#ccc" font-size="11">k(k+1)/2 curve</text>
  </g>
</svg>
