<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="url(#gold)" font-size="24" font-weight="bold" filter="url(#glow)">
    The Cayley-Dickson Factoring Hierarchy
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#aaa" font-size="13">
    Division Algebras × Factoring Channels × Properties Lost at Each Level
  </text>

  <!-- Connecting lines -->
  <line x1="450" y1="140" x2="450" y2="680" stroke="#334" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Level 1: Reals (dim 1) -->
  <g transform="translate(450, 120)">
    <rect x="-160" y="-25" width="320" height="55" rx="12" fill="#1a3a1a" stroke="#4a4" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" fill="#8f8" font-size="16" font-weight="bold">ℝ — Reals (dim 1)</text>
    <text x="0" y="18" text-anchor="middle" fill="#6d6" font-size="12">1 channel • Ordered, commutative, associative, alternative</text>
    <circle cx="-180" cy="0" r="15" fill="#4a4" opacity="0.3"/>
    <text x="-180" y="5" text-anchor="middle" fill="#8f8" font-size="11" font-weight="bold">1</text>
  </g>

  <!-- Level 2: Complex (dim 2) -->
  <g transform="translate(450, 210)">
    <rect x="-180" y="-25" width="360" height="55" rx="12" fill="#1a2a3a" stroke="#48f" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" fill="#8af" font-size="16" font-weight="bold">ℂ — Complex Numbers (dim 2)</text>
    <text x="0" y="18" text-anchor="middle" fill="#68f" font-size="12">3 channels • Lost: ordering | Gain: Brahmagupta-Fibonacci</text>
    <circle cx="-200" cy="0" r="15" fill="#48f" opacity="0.3"/>
    <text x="-200" y="5" text-anchor="middle" fill="#8af" font-size="11" font-weight="bold">3</text>
    <text x="200" y="5" text-anchor="middle" fill="#f84" font-size="11">−ordering</text>
  </g>

  <!-- Level 3: Quaternions (dim 4) -->
  <g transform="translate(450, 300)">
    <rect x="-195" y="-25" width="390" height="55" rx="12" fill="#2a1a3a" stroke="#a4f" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" fill="#c8f" font-size="16" font-weight="bold">ℍ — Quaternions (dim 4)</text>
    <text x="0" y="18" text-anchor="middle" fill="#a6f" font-size="12">10 channels • Lost: commutativity | Gain: Euler 4-square identity</text>
    <circle cx="-215" cy="0" r="18" fill="#a4f" opacity="0.3"/>
    <text x="-215" y="5" text-anchor="middle" fill="#c8f" font-size="12" font-weight="bold">10</text>
    <text x="215" y="5" text-anchor="middle" fill="#f84" font-size="11">−commutativity</text>
  </g>

  <!-- Level 4: Octonions (dim 8) -->
  <g transform="translate(450, 390)">
    <rect x="-210" y="-25" width="420" height="55" rx="12" fill="#3a1a1a" stroke="#f64" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" fill="#fa8" font-size="16" font-weight="bold">𝕆 — Octonions (dim 8)</text>
    <text x="0" y="18" text-anchor="middle" fill="#f86" font-size="12">36 channels • Lost: associativity | Gain: Degen 8-square identity</text>
    <circle cx="-230" cy="0" r="20" fill="#f64" opacity="0.3"/>
    <text x="-230" y="5" text-anchor="middle" fill="#fa8" font-size="13" font-weight="bold">36</text>
    <text x="230" y="5" text-anchor="middle" fill="#f84" font-size="11">−associativity</text>
  </g>

  <!-- Level 5: Sedenions (dim 16) -->
  <g transform="translate(450, 480)">
    <rect x="-220" y="-25" width="440" height="55" rx="12" fill="#3a2a0a" stroke="#fc4" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" fill="#fe8" font-size="16" font-weight="bold">𝕊 — Sedenions (dim 16)</text>
    <text x="0" y="18" text-anchor="middle" fill="#fc6" font-size="12">136 channels • Lost: alternativity | Gain: ZERO DIVISORS for factoring</text>
    <circle cx="-240" cy="0" r="22" fill="#fc4" opacity="0.3"/>
    <text x="-240" y="6" text-anchor="middle" fill="#fe8" font-size="13" font-weight="bold">136</text>
    <text x="240" y="5" text-anchor="middle" fill="#f44" font-size="11">−alternativity</text>
  </g>

  <!-- Level 6: Trigintaduonions (dim 32) -->
  <g transform="translate(450, 570)">
    <rect x="-230" y="-25" width="460" height="55" rx="12" fill="#3a0a2a" stroke="#f4a" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" fill="#f8c" font-size="16" font-weight="bold">𝕋 — Trigintaduonions (dim 32)</text>
    <text x="0" y="18" text-anchor="middle" fill="#f6a" font-size="12">528 channels • Lost: power-associativity | Gain: richer zero-divisor structure</text>
    <circle cx="-250" cy="0" r="24" fill="#f4a" opacity="0.3"/>
    <text x="-250" y="6" text-anchor="middle" fill="#f8c" font-size="13" font-weight="bold">528</text>
    <text x="252" y="5" text-anchor="middle" fill="#f44" font-size="11">−power-assoc</text>
  </g>

  <!-- Channel growth annotation -->
  <g transform="translate(80, 350)">
    <text x="0" y="-20" fill="#888" font-size="11" transform="rotate(-90)">← Channels grow as k + C(k,2) = k(k+1)/2 →</text>
  </g>

  <!-- Properties lost annotation -->
  <g transform="translate(830, 350)">
    <text x="0" y="-20" fill="#f66" font-size="11" transform="rotate(90)">← Properties lost at each doubling →</text>
  </g>

  <!-- Key insight box -->
  <g transform="translate(450, 660)">
    <rect x="-350" y="-20" width="700" height="35" rx="8" fill="#1a1a2e" stroke="#666" stroke-width="1"/>
    <text x="0" y="2" text-anchor="middle" fill="#ddd" font-size="12">
      Key Insight: Each property loss creates NEW factoring channels — zero divisors in 𝕊₁₆ are a feature, not a bug
    </text>
  </g>
</svg>
