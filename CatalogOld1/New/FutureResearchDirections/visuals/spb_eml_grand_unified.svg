<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a0a3e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#2196F3"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#43A047"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CE93D8"/>
      <stop offset="100%" style="stop-color:#AB47BC"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF5350"/>
      <stop offset="100%" style="stop-color:#E53935"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="url(#gold)" font-size="28" font-weight="bold" filter="url(#glow)">
    The Grand Unified SPB–EML Framework
  </text>
  <text x="600" y="78" text-anchor="middle" fill="#ccc" font-size="14" font-style="italic">
    Two Universal Gates Bridging Arithmetic, Geometry, and Physics
  </text>

  <!-- Central diamond: SPB and EML -->
  <!-- SPB node -->
  <g transform="translate(400, 200)">
    <rect x="-120" y="-40" width="240" height="80" rx="15" fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold">SPB</text>
    <text x="0" y="18" text-anchor="middle" fill="#FFD700" font-size="14">(x+y)/(1−xy)</text>
  </g>

  <!-- EML node -->
  <g transform="translate(800, 200)">
    <rect x="-120" y="-40" width="240" height="80" rx="15" fill="none" stroke="url(#blue)" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="-8" text-anchor="middle" fill="#4FC3F7" font-size="22" font-weight="bold">EML</text>
    <text x="0" y="18" text-anchor="middle" fill="#4FC3F7" font-size="14">exp(x) − ln(y)</text>
  </g>

  <!-- Bridge between SPB and EML -->
  <line x1="520" y1="200" x2="680" y2="200" stroke="#fff" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="600" y="190" text-anchor="middle" fill="#fff" font-size="11" opacity="0.8">Cayley Transform</text>
  <text x="600" y="215" text-anchor="middle" fill="#fff" font-size="10" opacity="0.6">C(x) = (1+ix)/(1−ix)</text>

  <!-- ===== LEFT SIDE: SPB Applications ===== -->

  <!-- Trigonometry -->
  <g transform="translate(150, 340)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="url(#green)" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#66BB6A" font-size="14" font-weight="bold">Trigonometry</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">tan(α+β) = spb(tan α, tan β)</text>
  </g>
  <line x1="260" y1="320" x2="350" y2="240" stroke="#66BB6A" stroke-width="1.5" opacity="0.5"/>

  <!-- Relativity -->
  <g transform="translate(150, 440)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="url(#purple)" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#CE93D8" font-size="14" font-weight="bold">Special Relativity</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">v₁⊕v₂ = spbH(v₁,v₂)</text>
  </g>
  <line x1="260" y1="430" x2="350" y2="240" stroke="#CE93D8" stroke-width="1.5" opacity="0.5"/>

  <!-- Quantum Computing -->
  <g transform="translate(150, 540)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="url(#red)" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#EF5350" font-size="14" font-weight="bold">Quantum Computing</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">Bloch sphere rotations</text>
  </g>
  <line x1="260" y1="530" x2="350" y2="240" stroke="#EF5350" stroke-width="1.5" opacity="0.5"/>

  <!-- Finite Fields -->
  <g transform="translate(400, 440)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="#FF9800" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FF9800" font-size="14" font-weight="bold">Finite Fields</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">|SPB(𝔽ₚ)| = p ± 1</text>
  </g>
  <line x1="400" y1="410" x2="400" y2="240" stroke="#FF9800" stroke-width="1.5" opacity="0.5"/>

  <!-- 3D SPB -->
  <g transform="translate(400, 540)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="#00BCD4" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#00BCD4" font-size="14" font-weight="bold">3D SPB → Quaternions</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">(u+v+u×v)/(1−u·v)</text>
  </g>
  <line x1="400" y1="510" x2="400" y2="260" stroke="#00BCD4" stroke-width="1.5" opacity="0.5"/>

  <!-- ===== RIGHT SIDE: EML Applications ===== -->

  <!-- Arithmetic -->
  <g transform="translate(1050, 340)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="url(#green)" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#66BB6A" font-size="14" font-weight="bold">Universal Arithmetic</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">+, ×, ^, √ from one gate</text>
  </g>
  <line x1="940" y1="320" x2="850" y2="240" stroke="#66BB6A" stroke-width="1.5" opacity="0.5"/>

  <!-- Complexity -->
  <g transform="translate(1050, 440)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="url(#purple)" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#CE93D8" font-size="14" font-weight="bold">Depth Hierarchy</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">exp∘exp ∉ depth-1 EML</text>
  </g>
  <line x1="940" y1="430" x2="850" y2="240" stroke="#CE93D8" stroke-width="1.5" opacity="0.5"/>

  <!-- Signal Processing -->
  <g transform="translate(1050, 540)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="url(#red)" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#EF5350" font-size="14" font-weight="bold">All-Pass Filters</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">SPB-parametrized cascades</text>
  </g>
  <line x1="940" y1="530" x2="850" y2="240" stroke="#EF5350" stroke-width="1.5" opacity="0.5"/>

  <!-- Approximation Theory -->
  <g transform="translate(800, 440)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="#FF9800" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FF9800" font-size="14" font-weight="bold">Approximation Theory</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">SPB trees ↔ Chebyshev</text>
  </g>
  <line x1="800" y1="410" x2="800" y2="260" stroke="#FF9800" stroke-width="1.5" opacity="0.5"/>

  <!-- Cryptography -->
  <g transform="translate(800, 540)">
    <rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="#00BCD4" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#00BCD4" font-size="14" font-weight="bold">Lightweight Crypto</text>
    <text x="0" y="15" text-anchor="middle" fill="#aaa" font-size="11">DH over SPB(𝔽ₚ)</text>
  </g>
  <line x1="800" y1="510" x2="800" y2="260" stroke="#00BCD4" stroke-width="1.5" opacity="0.5"/>

  <!-- ===== BOTTOM: Connecting Themes ===== -->

  <!-- Cocycle/Cohomology -->
  <g transform="translate(300, 680)">
    <rect x="-130" y="-35" width="260" height="70" rx="12" fill="none" stroke="#E0E0E0" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="0" y="-8" text-anchor="middle" fill="#E0E0E0" font-size="13" font-weight="bold">Cocycle Cohomology</text>
    <text x="0" y="12" text-anchor="middle" fill="#999" font-size="10">c(x,y) = 1/(1−xy) is a coboundary</text>
    <text x="0" y="28" text-anchor="middle" fill="#999" font-size="10">f(x) = 1+x² → trivial in H²</text>
  </g>

  <!-- Cauchy Distribution -->
  <g transform="translate(600, 680)">
    <rect x="-130" y="-35" width="260" height="70" rx="12" fill="none" stroke="#E0E0E0" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="0" y="-8" text-anchor="middle" fill="#E0E0E0" font-size="13" font-weight="bold">Cauchy Invariance</text>
    <text x="0" y="12" text-anchor="middle" fill="#999" font-size="10">Random SPB → Cauchy measure</text>
    <text x="0" y="28" text-anchor="middle" fill="#999" font-size="10">λ = E[log(1+a²)]/2</text>
  </g>

  <!-- Tropical SPB -->
  <g transform="translate(900, 680)">
    <rect x="-130" y="-35" width="260" height="70" rx="12" fill="none" stroke="#E0E0E0" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="0" y="-8" text-anchor="middle" fill="#E0E0E0" font-size="13" font-weight="bold">Tropical SPB</text>
    <text x="0" y="12" text-anchor="middle" fill="#999" font-size="10">min(x,y) − min(0, x+y)</text>
    <text x="0" y="28" text-anchor="middle" fill="#999" font-size="10">Semigroup, not group</text>
  </g>

  <!-- Connecting lines to bottom -->
  <line x1="400" y1="570" x2="300" y2="645" stroke="#666" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="400" y1="570" x2="600" y2="645" stroke="#666" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="800" y1="570" x2="600" y2="645" stroke="#666" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="800" y1="570" x2="900" y2="645" stroke="#666" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>

  <!-- Key insight box -->
  <g transform="translate(600, 810)">
    <rect x="-350" y="-30" width="700" height="60" rx="10" fill="rgba(255,215,0,0.05)" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FFD700" font-size="13" font-weight="bold">
      Key Insight: SPB = Geometry's Universal Gate  |  EML = Arithmetic's Universal Gate
    </text>
    <text x="0" y="18" text-anchor="middle" fill="#ccc" font-size="11">
      Together they form a complete algebraic foundation: every elementary function, every rotation, every boost.
    </text>
  </g>
</svg>
