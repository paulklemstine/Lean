<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1e3e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" fill="url(#bg4)"/>

  <text x="450" y="35" text-anchor="middle" fill="#FFD700" font-size="20" font-weight="bold">
    EML Complexity Landscape
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#8888cc" font-size="12">
    Minimum leaf count to express each function via eml(x,y) = exp(x) − ln(y)
  </text>

  <!-- Axes -->
  <line x1="80" y1="470" x2="850" y2="470" stroke="#555588" stroke-width="2"/>
  <line x1="80" y1="470" x2="80" y2="80" stroke="#555588" stroke-width="2"/>

  <!-- Y axis label -->
  <text x="30" y="275" text-anchor="middle" fill="#8888cc" font-size="13" transform="rotate(-90 30 275)">
    EML Leaf Count (complexity)
  </text>

  <!-- X axis label -->
  <text x="465" y="510" text-anchor="middle" fill="#8888cc" font-size="13">Functions (ordered by complexity)</text>

  <!-- Grid lines -->
  <line x1="80" y1="440" x2="850" y2="440" stroke="#222244" stroke-width="0.5"/>
  <line x1="80" y1="390" x2="850" y2="390" stroke="#222244" stroke-width="0.5"/>
  <line x1="80" y1="340" x2="850" y2="340" stroke="#222244" stroke-width="0.5"/>
  <line x1="80" y1="290" x2="850" y2="290" stroke="#222244" stroke-width="0.5"/>
  <line x1="80" y1="240" x2="850" y2="240" stroke="#222244" stroke-width="0.5"/>
  <line x1="80" y1="190" x2="850" y2="190" stroke="#222244" stroke-width="0.5"/>
  <line x1="80" y1="140" x2="850" y2="140" stroke="#222244" stroke-width="0.5"/>

  <!-- Y axis ticks -->
  <text x="70" y="474" text-anchor="end" fill="#888888" font-size="10">0</text>
  <text x="70" y="444" text-anchor="end" fill="#888888" font-size="10">2</text>
  <text x="70" y="394" text-anchor="end" fill="#888888" font-size="10">5</text>
  <text x="70" y="344" text-anchor="end" fill="#888888" font-size="10">10</text>
  <text x="70" y="294" text-anchor="end" fill="#888888" font-size="10">17</text>
  <text x="70" y="194" text-anchor="end" fill="#888888" font-size="10">53</text>
  <text x="70" y="94" text-anchor="end" fill="#888888" font-size="10">193</text>

  <!-- Data points (bars) -->
  <!-- x = identity: 1 leaf -->
  <rect x="110" y="455" width="40" height="15" rx="3" fill="#44ff88" opacity="0.8"/>
  <text x="130" y="490" text-anchor="middle" fill="#88cc88" font-size="9" transform="rotate(-45 130 490)">x</text>
  <text x="130" y="450" text-anchor="middle" fill="#44ff88" font-size="10">1</text>

  <!-- 1 = constant: 1 leaf -->
  <rect x="170" y="455" width="40" height="15" rx="3" fill="#44ff88" opacity="0.8"/>
  <text x="190" y="490" text-anchor="middle" fill="#88cc88" font-size="9" transform="rotate(-45 190 490)">1</text>
  <text x="190" y="450" text-anchor="middle" fill="#44ff88" font-size="10">1</text>

  <!-- exp(x): 2 leaves -->
  <rect x="230" y="440" width="40" height="30" rx="3" fill="#44ccff" opacity="0.8"/>
  <text x="250" y="490" text-anchor="middle" fill="#88aadd" font-size="9" transform="rotate(-45 250 490)">exp(x)</text>
  <text x="250" y="435" text-anchor="middle" fill="#44ccff" font-size="10">2</text>

  <!-- e: 2 leaves -->
  <rect x="290" y="440" width="40" height="30" rx="3" fill="#44ccff" opacity="0.8"/>
  <text x="310" y="490" text-anchor="middle" fill="#88aadd" font-size="9" transform="rotate(-45 310 490)">e</text>
  <text x="310" y="435" text-anchor="middle" fill="#44ccff" font-size="10">2</text>

  <!-- e-1: 3 leaves -->
  <rect x="350" y="430" width="40" height="40" rx="3" fill="#4488ff" opacity="0.8"/>
  <text x="370" y="490" text-anchor="middle" fill="#88aadd" font-size="9" transform="rotate(-45 370 490)">e−1</text>
  <text x="370" y="425" text-anchor="middle" fill="#4488ff" font-size="10">3</text>

  <!-- exp(exp(x)): 3 leaves -->
  <rect x="410" y="430" width="40" height="40" rx="3" fill="#4488ff" opacity="0.8"/>
  <text x="430" y="490" text-anchor="middle" fill="#88aadd" font-size="9" transform="rotate(-45 430 490)">e^(e^x)</text>
  <text x="430" y="425" text-anchor="middle" fill="#4488ff" font-size="10">3</text>

  <!-- ln(x): ~5 leaves -->
  <rect x="470" y="395" width="40" height="75" rx="3" fill="#aa44ff" opacity="0.8"/>
  <text x="490" y="490" text-anchor="middle" fill="#9988cc" font-size="9" transform="rotate(-45 490 490)">ln(x)</text>
  <text x="490" y="390" text-anchor="middle" fill="#aa44ff" font-size="10">~5</text>

  <!-- x+y: ~7 leaves -->
  <rect x="530" y="370" width="40" height="100" rx="3" fill="#ff44aa" opacity="0.8"/>
  <text x="550" y="490" text-anchor="middle" fill="#ddaacc" font-size="9" transform="rotate(-45 550 490)">x+y</text>
  <text x="550" y="365" text-anchor="middle" fill="#ff44aa" font-size="10">~7</text>

  <!-- x*y: ≤17 leaves -->
  <rect x="590" y="295" width="40" height="175" rx="3" fill="#ff8844" opacity="0.8"/>
  <text x="610" y="490" text-anchor="middle" fill="#ccaa88" font-size="9" transform="rotate(-45 610 490)">x×y</text>
  <text x="610" y="290" text-anchor="middle" fill="#ff8844" font-size="10">≤17</text>

  <!-- sin(x): ~30 leaves -->
  <rect x="650" y="240" width="40" height="230" rx="3" fill="#ff4444" opacity="0.8"/>
  <text x="670" y="490" text-anchor="middle" fill="#cc8888" font-size="9" transform="rotate(-45 670 490)">sin(x)</text>
  <text x="670" y="235" text-anchor="middle" fill="#ff4444" font-size="10">~30</text>

  <!-- π: ≤53 leaves -->
  <rect x="710" y="195" width="40" height="275" rx="3" fill="#ff2222" opacity="0.8"/>
  <text x="730" y="490" text-anchor="middle" fill="#cc6666" font-size="9" transform="rotate(-45 730 490)">π</text>
  <text x="730" y="190" text-anchor="middle" fill="#ff2222" font-size="10">≤53</text>

  <!-- π (unoptimized): ≤193 -->
  <rect x="770" y="95" width="40" height="375" rx="3" fill="#cc1111" opacity="0.6"/>
  <text x="790" y="490" text-anchor="middle" fill="#aa4444" font-size="9" transform="rotate(-45 790 490)">π (naive)</text>
  <text x="790" y="90" text-anchor="middle" fill="#cc1111" font-size="10">≤193</text>

  <!-- Legend -->
  <rect x="100" y="75" width="200" height="55" rx="6" fill="#0d1133" stroke="#333355" stroke-width="1"/>
  <text x="200" y="93" text-anchor="middle" fill="#aaaacc" font-size="11" font-weight="bold">Legend</text>
  <rect x="110" y="100" width="12" height="8" fill="#44ff88"/>
  <text x="128" y="108" fill="#aaaacc" font-size="10">Exact (known optimal)</text>
  <rect x="110" y="114" width="12" height="8" fill="#ff4444"/>
  <text x="128" y="122" fill="#aaaacc" font-size="10">Upper bound (may be improvable)</text>
</svg>