<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg3)"/>
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Multi-Lens Search Space Reduction</text>
  <text x="450" y="55" text-anchor="middle" fill="#8899aa" font-size="12">Each independent lens halves the search space — formally verified</text>

  <!-- Axes -->
  <line x1="80" y1="420" x2="850" y2="420" stroke="#445566" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="420" stroke="#445566" stroke-width="1.5"/>
  <text x="450" y="465" text-anchor="middle" fill="#aabbcc" font-size="13">Number of Independent Lenses (k)</text>
  <text x="25" y="250" text-anchor="middle" fill="#aabbcc" font-size="13" transform="rotate(-90, 25, 250)">Search Space (N / 2^k)</text>

  <!-- Grid lines -->
  <line x1="80" y1="100" x2="850" y2="100" stroke="#223344" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="180" x2="850" y2="180" stroke="#223344" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="260" x2="850" y2="260" stroke="#223344" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="340" x2="850" y2="340" stroke="#223344" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Y-axis labels -->
  <text x="70" y="424" text-anchor="end" fill="#8899aa" font-size="10">0</text>
  <text x="70" y="344" text-anchor="end" fill="#8899aa" font-size="10">N/16</text>
  <text x="70" y="264" text-anchor="end" fill="#8899aa" font-size="10">N/4</text>
  <text x="70" y="184" text-anchor="end" fill="#8899aa" font-size="10">N/2</text>
  <text x="70" y="104" text-anchor="end" fill="#8899aa" font-size="10">N</text>

  <!-- X-axis labels -->
  <text x="160" y="440" text-anchor="middle" fill="#8899aa" font-size="10">0</text>
  <text x="240" y="440" text-anchor="middle" fill="#8899aa" font-size="10">1</text>
  <text x="320" y="440" text-anchor="middle" fill="#8899aa" font-size="10">2</text>
  <text x="400" y="440" text-anchor="middle" fill="#8899aa" font-size="10">3</text>
  <text x="480" y="440" text-anchor="middle" fill="#8899aa" font-size="10">4</text>
  <text x="560" y="440" text-anchor="middle" fill="#8899aa" font-size="10">5</text>
  <text x="640" y="440" text-anchor="middle" fill="#8899aa" font-size="10">6</text>
  <text x="720" y="440" text-anchor="middle" fill="#8899aa" font-size="10">7</text>
  <text x="800" y="440" text-anchor="middle" fill="#8899aa" font-size="10">8</text>

  <!-- Exponential decay curve (theoretical) -->
  <polyline points="160,100 240,260 320,340 400,380 480,400 560,410 640,415 720,417 800,418"
    fill="none" stroke="#00aaff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="160" cy="100" r="6" fill="#00aaff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="240" cy="260" r="6" fill="#00aaff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="320" cy="340" r="6" fill="#00aaff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="400" cy="380" r="6" fill="#00aaff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="480" cy="400" r="6" fill="#00aaff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="560" cy="410" r="6" fill="#00aaff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="640" cy="415" r="6" fill="#00aaff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="720" cy="417" r="6" fill="#00aaff" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="800" cy="418" r="6" fill="#00aaff" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Annotations -->
  <text x="170" y="90" fill="#00ddff" font-size="10">N (full)</text>
  <text x="250" y="255" fill="#00ddff" font-size="10">N/2</text>
  <text x="330" y="335" fill="#00ddff" font-size="10">N/4</text>
  <text x="570" y="405" fill="#00ddff" font-size="10">N/32</text>

  <!-- 9-lens annotation -->
  <rect x="600" y="120" width="250" height="120" rx="8" fill="#0d1a2d" stroke="#00aaff" stroke-width="1.5"/>
  <text x="725" y="145" text-anchor="middle" fill="#00ddff" font-size="13" font-weight="bold">Key Results</text>
  <text x="615" y="168" fill="#88ccff" font-size="11">• 9 lenses → 512× reduction</text>
  <text x="615" y="188" fill="#88ccff" font-size="11">• ⌈log₂ N⌉ + 1 lenses → collapse</text>
  <text x="615" y="208" fill="#88ccff" font-size="11">• Composition is associative</text>
  <text x="615" y="228" fill="#66ff66" font-size="11">• All formally verified ✓</text>

  <!-- Theorem box -->
  <rect x="100" y="455" width="700" height="35" rx="6" fill="#0a1420" stroke="#446688" stroke-width="1"/>
  <text x="450" y="477" text-anchor="middle" fill="#aabbcc" font-size="12" font-style="italic">
    Theorem (mlc_sufficient): N / 2^(⌈log₂ N⌉ + 1) = 0  —  formally proved in Lean 4
  </text>
</svg>
