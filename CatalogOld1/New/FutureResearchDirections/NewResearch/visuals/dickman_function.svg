<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff6644;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="35" fill="#ffffff" font-family="Georgia" font-size="22" text-anchor="middle" font-weight="bold">The Dickman Function ρ(u)</text>
  <text x="400" y="58" fill="#88aacc" font-family="Georgia" font-size="14" text-anchor="middle">Delay Differential Equation: u·ρ'(u) = −ρ(u−1)</text>
  
  <!-- Axes -->
  <line x1="80" y1="420" x2="750" y2="420" stroke="#446688" stroke-width="2"/>
  <line x1="80" y1="420" x2="80" y2="80" stroke="#446688" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="400" y="460" fill="#aaccee" font-family="monospace" font-size="14" text-anchor="middle">u</text>
  <text x="40" y="250" fill="#aaccee" font-family="monospace" font-size="14" text-anchor="middle" transform="rotate(-90,40,250)">ρ(u)</text>
  
  <!-- Grid lines -->
  <g stroke="#223344" stroke-width="0.5" stroke-dasharray="4,4">
    <line x1="80" y1="80" x2="750" y2="80"/>
    <line x1="80" y1="165" x2="750" y2="165"/>
    <line x1="80" y1="250" x2="750" y2="250"/>
    <line x1="80" y1="335" x2="750" y2="335"/>
    <line x1="214" y1="80" x2="214" y2="420"/>
    <line x1="348" y1="80" x2="348" y2="420"/>
    <line x1="482" y1="80" x2="482" y2="420"/>
    <line x1="616" y1="80" x2="616" y2="420"/>
  </g>
  
  <!-- Tick labels -->
  <text x="80" y="440" fill="#88aacc" font-family="monospace" font-size="11" text-anchor="middle">0</text>
  <text x="214" y="440" fill="#88aacc" font-family="monospace" font-size="11" text-anchor="middle">1</text>
  <text x="348" y="440" fill="#88aacc" font-family="monospace" font-size="11" text-anchor="middle">2</text>
  <text x="482" y="440" fill="#88aacc" font-family="monospace" font-size="11" text-anchor="middle">3</text>
  <text x="616" y="440" fill="#88aacc" font-family="monospace" font-size="11" text-anchor="middle">4</text>
  <text x="750" y="440" fill="#88aacc" font-family="monospace" font-size="11" text-anchor="middle">5</text>
  
  <text x="70" y="424" fill="#88aacc" font-family="monospace" font-size="11" text-anchor="end">0</text>
  <text x="70" y="84" fill="#88aacc" font-family="monospace" font-size="11" text-anchor="end">1.0</text>
  <text x="70" y="254" fill="#88aacc" font-family="monospace" font-size="11" text-anchor="end">0.5</text>
  
  <!-- Region shading: [0,1] where ρ = 1 -->
  <rect x="80" y="80" width="134" height="340" fill="#00ff88" opacity="0.05"/>
  <text x="147" y="100" fill="#00ff88" font-family="monospace" font-size="10" text-anchor="middle" opacity="0.7">ρ = 1</text>
  
  <!-- The Dickman curve -->
  <!-- [0, 1]: ρ = 1 (flat) -->
  <line x1="80" y1="80" x2="214" y2="80" stroke="#00ff88" stroke-width="3" filter="url(#glow)"/>
  
  <!-- [1, 2]: ρ = 1 - ln(u) -->
  <path d="M214,80 C240,100 280,155 310,190 Q330,215 348,234" 
        stroke="url(#curveGrad)" stroke-width="3" fill="none" filter="url(#glow)"/>
  
  <!-- [2, 5]: numerical approximation (exponential decay) -->
  <path d="M348,234 C380,280 420,330 460,365 Q500,390 540,400 Q580,410 620,413 Q660,416 700,417 L750,418" 
        stroke="#ff6644" stroke-width="3" fill="none" filter="url(#glow)"/>
  
  <!-- Key points -->
  <circle cx="214" cy="80" r="5" fill="#00ff88" filter="url(#glow)"/>
  <text x="224" y="72" fill="#00ff88" font-family="monospace" font-size="11">ρ(1) = 1</text>
  
  <circle cx="348" cy="234" r="5" fill="#ffaa33" filter="url(#glow)"/>
  <text x="358" y="226" fill="#ffaa33" font-family="monospace" font-size="11">ρ(2) ≈ 0.307</text>
  
  <circle cx="482" cy="365" r="5" fill="#ff6644" filter="url(#glow)"/>
  <text x="492" y="357" fill="#ff6644" font-family="monospace" font-size="11">ρ(3) ≈ 0.049</text>
  
  <!-- Equation box -->
  <rect x="500" y="90" width="230" height="110" rx="8" fill="#111133" stroke="#446688" stroke-width="1"/>
  <text x="615" y="115" fill="#ffffff" font-family="Georgia" font-size="13" text-anchor="middle" font-weight="bold">Key Properties</text>
  <text x="515" y="140" fill="#88ccff" font-family="monospace" font-size="11">ρ(u) = 1     for u ∈ (0,1]</text>
  <text x="515" y="158" fill="#88ccff" font-family="monospace" font-size="11">ρ(u) = 1-ln u for u ∈ (1,2]</text>
  <text x="515" y="176" fill="#88ccff" font-family="monospace" font-size="11">ρ(u) ~ u⁻ᵘ   as u → ∞</text>
  <text x="515" y="194" fill="#ffcc44" font-family="monospace" font-size="11">Ψ(x,y) ~ x·ρ(log x/log y)</text>

  <!-- Connection to factoring -->
  <rect x="80" y="470" width="670" height="24" rx="4" fill="#112233"/>
  <text x="415" y="487" fill="#88ddff" font-family="Georgia" font-size="12" text-anchor="middle">
    Significance: ρ(u) governs the density of smooth numbers — the key to GNFS and ECM complexity
  </text>
</svg>
