<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1a0d"/>
      <stop offset="100%" style="stop-color:#1a2e1a"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg5)"/>
  
  <text x="400" y="32" fill="#ffffff" font-family="Georgia" font-size="20" text-anchor="middle" font-weight="bold">Tropical Profile of a Semiprime</text>
  <text x="400" y="52" fill="#88ccaa" font-family="Georgia" font-size="12" text-anchor="middle">p-adic valuations reveal the prime structure: v_ℓ(pq) = v_ℓ(p) + v_ℓ(q)</text>
  
  <!-- Example: N = 143 = 11 × 13 -->
  <text x="400" y="85" fill="#ffcc44" font-family="monospace" font-size="16" text-anchor="middle">N = 143 = 11 × 13</text>
  
  <!-- Valuation bars -->
  <g transform="translate(80, 100)">
    <!-- Axis -->
    <line x1="0" y1="150" x2="640" y2="150" stroke="#446644" stroke-width="1.5"/>
    <text x="320" y="185" fill="#88ccaa" font-family="monospace" font-size="12" text-anchor="middle">Prime ℓ</text>
    
    <!-- v_2(143) = 0 -->
    <rect x="10" y="140" width="50" height="10" rx="2" fill="#334433" stroke="#446644"/>
    <text x="35" y="170" fill="#88ccaa" font-family="monospace" font-size="11" text-anchor="middle">2</text>
    <text x="35" y="135" fill="#666666" font-family="monospace" font-size="10" text-anchor="middle">0</text>
    
    <!-- v_3(143) = 0 -->
    <rect x="80" y="140" width="50" height="10" rx="2" fill="#334433" stroke="#446644"/>
    <text x="105" y="170" fill="#88ccaa" font-family="monospace" font-size="11" text-anchor="middle">3</text>
    <text x="105" y="135" fill="#666666" font-family="monospace" font-size="10" text-anchor="middle">0</text>
    
    <!-- v_5(143) = 0 -->
    <rect x="150" y="140" width="50" height="10" rx="2" fill="#334433" stroke="#446644"/>
    <text x="175" y="170" fill="#88ccaa" font-family="monospace" font-size="11" text-anchor="middle">5</text>
    <text x="175" y="135" fill="#666666" font-family="monospace" font-size="10" text-anchor="middle">0</text>
    
    <!-- v_7(143) = 0 -->
    <rect x="220" y="140" width="50" height="10" rx="2" fill="#334433" stroke="#446644"/>
    <text x="245" y="170" fill="#88ccaa" font-family="monospace" font-size="11" text-anchor="middle">7</text>
    <text x="245" y="135" fill="#666666" font-family="monospace" font-size="10" text-anchor="middle">0</text>
    
    <!-- v_11(143) = 1 ← SPIKE! -->
    <rect x="290" y="80" width="50" height="70" rx="2" fill="#00ff88" opacity="0.6" filter="url(#glow5)"/>
    <rect x="290" y="80" width="50" height="70" rx="2" fill="none" stroke="#00ff88" stroke-width="2"/>
    <text x="315" y="170" fill="#00ff88" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">11</text>
    <text x="315" y="75" fill="#00ff88" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">1</text>
    <text x="315" y="60" fill="#44ffaa" font-family="monospace" font-size="9" text-anchor="middle">← factor!</text>
    
    <!-- v_13(143) = 1 ← SPIKE! -->
    <rect x="360" y="80" width="50" height="70" rx="2" fill="#ffaa33" opacity="0.6" filter="url(#glow5)"/>
    <rect x="360" y="80" width="50" height="70" rx="2" fill="none" stroke="#ffaa33" stroke-width="2"/>
    <text x="385" y="170" fill="#ffaa33" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">13</text>
    <text x="385" y="75" fill="#ffaa33" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">1</text>
    <text x="385" y="60" fill="#ffcc44" font-family="monospace" font-size="9" text-anchor="middle">← factor!</text>
    
    <!-- v_17(143) = 0 -->
    <rect x="430" y="140" width="50" height="10" rx="2" fill="#334433" stroke="#446644"/>
    <text x="455" y="170" fill="#88ccaa" font-family="monospace" font-size="11" text-anchor="middle">17</text>
    
    <!-- v_19(143) = 0 -->
    <rect x="500" y="140" width="50" height="10" rx="2" fill="#334433" stroke="#446644"/>
    <text x="525" y="170" fill="#88ccaa" font-family="monospace" font-size="11" text-anchor="middle">19</text>
    
    <!-- v_23(143) = 0 -->
    <rect x="570" y="140" width="50" height="10" rx="2" fill="#334433" stroke="#446644"/>
    <text x="595" y="170" fill="#88ccaa" font-family="monospace" font-size="11" text-anchor="middle">23</text>
  </g>
  
  <!-- Theorem boxes -->
  <rect x="40" y="310" width="340" height="120" rx="8" fill="#112211" stroke="#44aa44" stroke-width="1"/>
  <text x="210" y="335" fill="#00ff88" font-family="Georgia" font-size="13" text-anchor="middle" font-weight="bold">Verified Theorems</text>
  <text x="55" y="358" fill="#88ccaa" font-family="monospace" font-size="10">• v_ℓ(pq) = v_ℓ(p) + v_ℓ(q)  [additivity]</text>
  <text x="55" y="378" fill="#88ccaa" font-family="monospace" font-size="10">• ℓ ∉ {p,q} ⟹ v_ℓ(N) = 0   [sparsity]</text>
  <text x="55" y="398" fill="#88ccaa" font-family="monospace" font-size="10">• v_p(N) = 1                  [unit spike]</text>
  <text x="55" y="418" fill="#88ccaa" font-family="monospace" font-size="10">• B-smooth ⟺ v_p = 0 ∀p &gt; B  [tropical]</text>
  
  <rect x="420" y="310" width="340" height="120" rx="8" fill="#221111" stroke="#ff6644" stroke-width="1"/>
  <text x="590" y="335" fill="#ff6644" font-family="Georgia" font-size="13" text-anchor="middle" font-weight="bold">Key Insight</text>
  <text x="435" y="358" fill="#ccaa88" font-family="monospace" font-size="10">The tropical profile of a semiprime</text>
  <text x="435" y="378" fill="#ccaa88" font-family="monospace" font-size="10">has exactly TWO spikes at height 1.</text>
  <text x="435" y="398" fill="#ccaa88" font-family="monospace" font-size="10">Finding either spike = factoring N.</text>
  <text x="435" y="418" fill="#ffcc44" font-family="monospace" font-size="10">Constraint orthogonal to all other lenses!</text>
</svg>
