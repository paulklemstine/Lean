<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f4e8"/>
      <stop offset="100%" style="stop-color:#eee8d8"/>
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#cc4420"/>
    </linearGradient>
    <linearGradient id="logGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3585ff"/>
      <stop offset="100%" style="stop-color:#2060cc"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#2a2a2a" font-size="28" font-weight="bold">
    Anatomy of the EML Operator
  </text>
  <text x="500" y="70" text-anchor="middle" fill="#666666" font-size="16" font-style="italic">
    How one operation encodes all of elementary mathematics
  </text>

  <!-- Central formula -->
  <rect x="300" y="90" width="400" height="60" rx="30" fill="#2a2a4a" stroke="#444" stroke-width="2"/>
  <text x="500" y="128" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold">
    eml(x, y) = eˣ − ln y
  </text>

  <!-- Decomposition arrows -->
  <line x1="420" y1="150" x2="250" y2="200" stroke="#cc4420" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="580" y1="150" x2="750" y2="200" stroke="#2060cc" stroke-width="3"/>

  <!-- Exp component -->
  <rect x="120" y="200" width="260" height="120" rx="15" fill="url(#expGrad)" opacity="0.9"/>
  <text x="250" y="235" text-anchor="middle" fill="white" font-size="22" font-weight="bold">eˣ</text>
  <text x="250" y="260" text-anchor="middle" fill="#ffddcc" font-size="13">Growth · Multiplication · Powers</text>
  <text x="250" y="280" text-anchor="middle" fill="#ffddcc" font-size="12">eˣ · eʸ = eˣ⁺ʸ    (eˣ)ⁿ = eⁿˣ</text>
  <text x="250" y="300" text-anchor="middle" fill="#ffddcc" font-size="12">Recovered: eml(x, 1) = eˣ</text>

  <!-- Minus sign -->
  <circle cx="500" cy="260" r="25" fill="#2a2a4a" stroke="#888" stroke-width="2"/>
  <text x="500" y="268" text-anchor="middle" fill="white" font-size="28" font-weight="bold">−</text>

  <!-- Log component -->
  <rect x="620" y="200" width="260" height="120" rx="15" fill="url(#logGrad)" opacity="0.9"/>
  <text x="750" y="235" text-anchor="middle" fill="white" font-size="22" font-weight="bold">ln y</text>
  <text x="750" y="260" text-anchor="middle" fill="#ccddf8" font-size="13">Decay · Division · Roots</text>
  <text x="750" y="280" text-anchor="middle" fill="#ccddf8" font-size="12">ln(ab) = ln a + ln b</text>
  <text x="750" y="300" text-anchor="middle" fill="#ccddf8" font-size="12">Recovered: eml(0, e⁻ˣ)−1 = ln?</text>

  <!-- What EML generates -->
  <text x="500" y="370" text-anchor="middle" fill="#2a2a2a" font-size="18" font-weight="bold">
    What EML Generates from {x, 1}
  </text>

  <!-- Generation chain -->
  <g transform="translate(50, 390)">
    <!-- Step 0 -->
    <rect width="130" height="60" rx="8" fill="#fff8e0" stroke="#cc9900" stroke-width="2"/>
    <text x="65" y="22" text-anchor="middle" fill="#886600" font-size="12" font-weight="bold">Atoms</text>
    <text x="65" y="42" text-anchor="middle" fill="#886600" font-size="14">x, 1</text>
  </g>

  <text x="200" y="425" fill="#888" font-size="20">→</text>

  <g transform="translate(215, 390)">
    <rect width="130" height="60" rx="8" fill="#ffe8e0" stroke="#cc4420" stroke-width="2"/>
    <text x="65" y="22" text-anchor="middle" fill="#884420" font-size="12" font-weight="bold">1 operation</text>
    <text x="65" y="42" text-anchor="middle" fill="#884420" font-size="13">eˣ, 1, e</text>
  </g>

  <text x="365" y="425" fill="#888" font-size="20">→</text>

  <g transform="translate(380, 390)">
    <rect width="160" height="60" rx="8" fill="#e0f0e0" stroke="#228844" stroke-width="2"/>
    <text x="80" y="22" text-anchor="middle" fill="#226644" font-size="12" font-weight="bold">2 operations</text>
    <text x="80" y="42" text-anchor="middle" fill="#226644" font-size="12">eᵉˣ, 1−x, e²</text>
  </g>

  <text x="560" y="425" fill="#888" font-size="20">→</text>

  <g transform="translate(575, 390)">
    <rect width="160" height="60" rx="8" fill="#e0e8f8" stroke="#2255cc" stroke-width="2"/>
    <text x="80" y="22" text-anchor="middle" fill="#224488" font-size="12" font-weight="bold">3 operations</text>
    <text x="80" y="42" text-anchor="middle" fill="#224488" font-size="12">eᵉᵉˣ, x, e−1, ...</text>
  </g>

  <text x="755" y="425" fill="#888" font-size="20">→</text>

  <g transform="translate(770, 390)">
    <rect width="180" height="60" rx="8" fill="#f0e0f8" stroke="#8844cc" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" fill="#664488" font-size="12" font-weight="bold">∞ operations</text>
    <text x="90" y="42" text-anchor="middle" fill="#664488" font-size="12">All elementary fn's</text>
  </g>

  <!-- Key properties grid -->
  <text x="500" y="500" text-anchor="middle" fill="#2a2a2a" font-size="18" font-weight="bold">
    Key Properties at a Glance
  </text>

  <g transform="translate(50, 520)">
    <rect width="200" height="50" rx="8" fill="#fff0f0" stroke="#cc3333" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" fill="#cc3333" font-size="12" font-weight="bold">✗ Not Commutative</text>
    <text x="100" y="40" text-anchor="middle" fill="#886666" font-size="10">eml(x,y) ≠ eml(y,x)</text>
  </g>
  <g transform="translate(270, 520)">
    <rect width="200" height="50" rx="8" fill="#fff0f0" stroke="#cc3333" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" fill="#cc3333" font-size="12" font-weight="bold">✗ Not Associative</text>
    <text x="100" y="40" text-anchor="middle" fill="#886666" font-size="10">eml(eml(x,y),z) ≠ eml(x,eml(y,z))</text>
  </g>
  <g transform="translate(490, 520)">
    <rect width="200" height="50" rx="8" fill="#fff0f0" stroke="#cc3333" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" fill="#cc3333" font-size="12" font-weight="bold">✗ No Identity</text>
    <text x="100" y="40" text-anchor="middle" fill="#886666" font-size="10">∄ e₀: eml(e₀,x) = x ∀x</text>
  </g>
  <g transform="translate(710, 520)">
    <rect width="240" height="50" rx="8" fill="#f0fff0" stroke="#33cc33" stroke-width="1"/>
    <text x="120" y="22" text-anchor="middle" fill="#33aa33" font-size="12" font-weight="bold">✓ Sheffer Complete</text>
    <text x="120" y="40" text-anchor="middle" fill="#668866" font-size="10">Generates ALL elementary functions</text>
  </g>

  <g transform="translate(50, 585)">
    <rect width="200" height="50" rx="8" fill="#f0fff0" stroke="#33cc33" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" fill="#33aa33" font-size="12" font-weight="bold">✓ Smooth (C∞)</text>
    <text x="100" y="40" text-anchor="middle" fill="#668866" font-size="10">∇eml never vanishes (y&gt;0)</text>
  </g>
  <g transform="translate(270, 585)">
    <rect width="200" height="50" rx="8" fill="#f0fff0" stroke="#33cc33" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" fill="#33aa33" font-size="12" font-weight="bold">✓ Monotone</text>
    <text x="100" y="40" text-anchor="middle" fill="#668866" font-size="10">↑ in x, ↓ in y</text>
  </g>
  <g transform="translate(490, 585)">
    <rect width="200" height="50" rx="8" fill="#f0fff0" stroke="#33cc33" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" fill="#33aa33" font-size="12" font-weight="bold">✓ Right Division</text>
    <text x="100" y="40" text-anchor="middle" fill="#668866" font-size="10">eml(a,x)=b always solvable</text>
  </g>
  <g transform="translate(710, 585)">
    <rect width="240" height="50" rx="8" fill="#f0f0ff" stroke="#6666cc" stroke-width="1"/>
    <text x="120" y="22" text-anchor="middle" fill="#6666cc" font-size="12" font-weight="bold">⟳ Hyperbolic Geometry</text>
    <text x="120" y="40" text-anchor="middle" fill="#666688" font-size="10">K = −eˣ/(4y²) &lt; 0</text>
  </g>

  <text x="500" y="680" text-anchor="middle" fill="#888888" font-size="11">
    The EML operator: one formula, two transcendental functions, infinite mathematical depth
  </text>
</svg>
