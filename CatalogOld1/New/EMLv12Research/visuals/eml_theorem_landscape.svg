<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1225"/>
      <stop offset="100%" style="stop-color:#1a2040"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="850" fill="url(#bg2)"/>

  <text x="600" y="45" text-anchor="middle" fill="#e8c040" font-size="28" font-weight="bold" filter="url(#glow2)">
    EML Theorem Landscape — From Foundations to Frontiers
  </text>

  <!-- Central definition -->
  <rect x="430" y="70" width="340" height="50" rx="25" fill="#2a1a40" stroke="#c080ff" stroke-width="2"/>
  <text x="600" y="100" text-anchor="middle" fill="#e0b0ff" font-size="18" font-weight="bold">
    eml(x, y) = eˣ − ln y
  </text>

  <!-- Layer 1: Core Identities -->
  <text x="60" y="155" fill="#f0c040" font-size="16" font-weight="bold">CORE IDENTITIES</text>
  <line x1="60" y1="162" x2="300" y2="162" stroke="#f0c040" stroke-width="1"/>

  <g transform="translate(60, 175)">
    <rect width="175" height="40" rx="6" fill="#1a2030" stroke="#667788" stroke-width="1"/>
    <text x="12" y="16" fill="#88ccff" font-size="11">eml(x, 1) = eˣ</text>
    <text x="12" y="30" fill="#66aa44" font-size="9">✓ recovers exp</text>
  </g>
  <g transform="translate(250, 175)">
    <rect width="175" height="40" rx="6" fill="#1a2030" stroke="#667788" stroke-width="1"/>
    <text x="12" y="16" fill="#88ccff" font-size="11">eml(0, eˣ) = 1 − x</text>
    <text x="12" y="30" fill="#66aa44" font-size="9">✓ negation</text>
  </g>
  <g transform="translate(440, 175)">
    <rect width="175" height="40" rx="6" fill="#1a2030" stroke="#667788" stroke-width="1"/>
    <text x="12" y="16" fill="#88ccff" font-size="11">eml(x, eʸ) = eˣ − y</text>
    <text x="12" y="30" fill="#66aa44" font-size="9">✓ Legendre transform</text>
  </g>
  <g transform="translate(630, 175)">
    <rect width="175" height="40" rx="6" fill="#1a2030" stroke="#667788" stroke-width="1"/>
    <text x="12" y="16" fill="#88ccff" font-size="11">eml(n·x, 1) = (eˣ)ⁿ</text>
    <text x="12" y="30" fill="#66aa44" font-size="9">✓ power identity</text>
  </g>
  <g transform="translate(820, 175)">
    <rect width="175" height="40" rx="6" fill="#1a2030" stroke="#667788" stroke-width="1"/>
    <text x="12" y="16" fill="#88ccff" font-size="11">eml(ln a, eᵇ) = a − b</text>
    <text x="12" y="30" fill="#66aa44" font-size="9">✓ subtraction (a&gt;0)</text>
  </g>
  <g transform="translate(1010, 175)">
    <rect width="175" height="40" rx="6" fill="#1a2030" stroke="#667788" stroke-width="1"/>
    <text x="12" y="16" fill="#88ccff" font-size="11">double neg = id</text>
    <text x="12" y="30" fill="#66aa44" font-size="9">✓ involution</text>
  </g>

  <!-- Layer 2: Algebraic Structure -->
  <text x="60" y="255" fill="#4090ff" font-size="16" font-weight="bold">ALGEBRAIC STRUCTURE</text>
  <line x1="60" y1="262" x2="350" y2="262" stroke="#4090ff" stroke-width="1"/>

  <g transform="translate(60, 275)">
    <rect width="160" height="55" rx="6" fill="#1a2030" stroke="#ff6666" stroke-width="1"/>
    <text x="12" y="16" fill="#ff8888" font-size="11">NOT commutative</text>
    <text x="12" y="30" fill="#ff8888" font-size="11">NOT associative</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ wild magma</text>
  </g>
  <g transform="translate(235, 275)">
    <rect width="160" height="55" rx="6" fill="#1a2030" stroke="#ff6666" stroke-width="1"/>
    <text x="12" y="16" fill="#ff8888" font-size="11">NO left identity</text>
    <text x="12" y="30" fill="#ff8888" font-size="11">NO right identity</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ proven in V8</text>
  </g>
  <g transform="translate(410, 275)">
    <rect width="160" height="55" rx="6" fill="#1a2030" stroke="#ff6666" stroke-width="1"/>
    <text x="12" y="16" fill="#ff8888" font-size="11">NOT medial</text>
    <text x="12" y="30" fill="#ff8888" font-size="11">NOT idempotent</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ all verified</text>
  </g>
  <g transform="translate(585, 275)">
    <rect width="185" height="55" rx="6" fill="#1a2030" stroke="#44cc66" stroke-width="1"/>
    <text x="12" y="16" fill="#88ffaa" font-size="11">Right quasi-division ✓</text>
    <text x="12" y="30" fill="#88ffaa" font-size="11">x = exp(eᵃ − b)</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ always solvable</text>
  </g>
  <g transform="translate(785, 275)">
    <rect width="185" height="55" rx="6" fill="#1a2030" stroke="#ffaa44" stroke-width="1"/>
    <text x="12" y="16" fill="#ffcc66" font-size="11">Left quasi-division ⚠</text>
    <text x="12" y="30" fill="#ffcc66" font-size="11">x = ln(b + ln a)</text>
    <text x="12" y="44" fill="#ffaa44" font-size="9">requires b+ln(a)&gt;0</text>
  </g>
  <g transform="translate(985, 275)">
    <rect width="185" height="55" rx="6" fill="#1a2030" stroke="#667788" stroke-width="1"/>
    <text x="12" y="16" fill="#88ccff" font-size="11">Trace identity</text>
    <text x="12" y="30" fill="#88ccff" font-size="11">eml(x,y)+eml(y,x)</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ symmetric formula</text>
  </g>

  <!-- Layer 3: Analysis -->
  <text x="60" y="370" fill="#40cc60" font-size="16" font-weight="bold">ANALYSIS &amp; DYNAMICS</text>
  <line x1="60" y1="377" x2="340" y2="377" stroke="#40cc60" stroke-width="1"/>

  <g transform="translate(60, 390)">
    <rect width="170" height="55" rx="6" fill="#1a2030" stroke="#44cc66" stroke-width="1"/>
    <text x="12" y="16" fill="#88ffaa" font-size="11">Strict ↑ in x</text>
    <text x="12" y="30" fill="#88ffaa" font-size="11">Strict ↓ in y (y&gt;0)</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ monotonicity</text>
  </g>
  <g transform="translate(245, 390)">
    <rect width="170" height="55" rx="6" fill="#1a2030" stroke="#44cc66" stroke-width="1"/>
    <text x="12" y="16" fill="#88ffaa" font-size="11">∇eml = (eˣ, −1/y)</text>
    <text x="12" y="30" fill="#88ffaa" font-size="11">Never vanishes (y&gt;0)</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ smooth level sets</text>
  </g>
  <g transform="translate(430, 390)">
    <rect width="170" height="55" rx="6" fill="#1a2030" stroke="#44cc66" stroke-width="1"/>
    <text x="12" y="16" fill="#88ffaa" font-size="11">d(z) &gt; z ∀z</text>
    <text x="12" y="30" fill="#88ffaa" font-size="11">dⁿ(z) ≥ z + n</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ orbit divergence</text>
  </g>
  <g transform="translate(615, 390)">
    <rect width="170" height="55" rx="6" fill="#1a2030" stroke="#44cc66" stroke-width="1"/>
    <text x="12" y="16" fill="#88ffaa" font-size="11">Strictly convex on (0,∞)</text>
    <text x="12" y="30" fill="#88ffaa" font-size="11">Unique minimum</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ diagonal map</text>
  </g>
  <g transform="translate(800, 390)">
    <rect width="170" height="55" rx="6" fill="#1a2030" stroke="#44cc66" stroke-width="1"/>
    <text x="12" y="16" fill="#88ffaa" font-size="11">g-map fixed point</text>
    <text x="12" y="30" fill="#88ffaa" font-size="11">z* ≈ 2.0175</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ |g'(z*)| &lt; 1</text>
  </g>
  <g transform="translate(985, 390)">
    <rect width="170" height="55" rx="6" fill="#1a2030" stroke="#44cc66" stroke-width="1"/>
    <text x="12" y="16" fill="#88ffaa" font-size="11">eml ≥ 1 + x − ln y</text>
    <text x="12" y="30" fill="#88ffaa" font-size="11">AM-GM bridge</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ lower bound</text>
  </g>

  <!-- Layer 4: Geometry -->
  <text x="60" y="485" fill="#cc60e0" font-size="16" font-weight="bold">GEOMETRY &amp; TOPOLOGY</text>
  <line x1="60" y1="492" x2="340" y2="492" stroke="#cc60e0" stroke-width="1"/>

  <g transform="translate(60, 505)">
    <rect width="200" height="55" rx="6" fill="#1a2030" stroke="#cc80ff" stroke-width="1"/>
    <text x="12" y="16" fill="#ddaaff" font-size="11">Hessian metric: diag(eˣ, 1/y²)</text>
    <text x="12" y="30" fill="#ddaaff" font-size="11">Positive definite for y &gt; 0</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ Riemannian structure</text>
  </g>
  <g transform="translate(275, 505)">
    <rect width="200" height="55" rx="6" fill="#1a2030" stroke="#cc80ff" stroke-width="1"/>
    <text x="12" y="16" fill="#ddaaff" font-size="11">K = −eˣ/(4y²) &lt; 0</text>
    <text x="12" y="30" fill="#ddaaff" font-size="11">Hyperbolic geometry</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ Gaussian curvature</text>
  </g>
  <g transform="translate(490, 505)">
    <rect width="200" height="55" rx="6" fill="#1a2030" stroke="#cc80ff" stroke-width="1"/>
    <text x="12" y="16" fill="#ddaaff" font-size="11">x-geodesic: x = 2ln(at+b)</text>
    <text x="12" y="30" fill="#ddaaff" font-size="11">y-geodesic: y = Ce^{kt}</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ explicit solutions</text>
  </g>
  <g transform="translate(705, 505)">
    <rect width="200" height="55" rx="6" fill="#1a2030" stroke="#ffaa44" stroke-width="1"/>
    <text x="12" y="16" fill="#ffcc66" font-size="11">Julia set of d(z)</text>
    <text x="12" y="30" fill="#ffcc66" font-size="11">Hausdorff dimension?</text>
    <text x="12" y="44" fill="#ffaa44" font-size="9">⟳ open problem</text>
  </g>
  <g transform="translate(920, 505)">
    <rect width="200" height="55" rx="6" fill="#1a2030" stroke="#ffaa44" stroke-width="1"/>
    <text x="12" y="16" fill="#ffcc66" font-size="11">O-minimal structure</text>
    <text x="12" y="30" fill="#ffcc66" font-size="11">Wilkie's theorem corollary</text>
    <text x="12" y="44" fill="#ffaa44" font-size="9">⟳ formalization target</text>
  </g>

  <!-- Layer 5: New V12 Results -->
  <text x="60" y="600" fill="#ff6080" font-size="16" font-weight="bold">NEW V12 RESULTS</text>
  <line x1="60" y1="607" x2="280" y2="607" stroke="#ff6080" stroke-width="1"/>

  <g transform="translate(60, 620)">
    <rect width="220" height="55" rx="6" fill="#2a1520" stroke="#ff6080" stroke-width="2"/>
    <text x="12" y="16" fill="#ff88aa" font-size="11" font-weight="bold">Right quasi-division</text>
    <text x="12" y="30" fill="#ff88aa" font-size="11">eml(a,x)=b → x=exp(eᵃ−b)</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ NEW: formally verified</text>
  </g>
  <g transform="translate(295, 620)">
    <rect width="220" height="55" rx="6" fill="#2a1520" stroke="#ff6080" stroke-width="2"/>
    <text x="12" y="16" fill="#ff88aa" font-size="11" font-weight="bold">Left division domain</text>
    <text x="12" y="30" fill="#ff88aa" font-size="11">eml(x,a)=b ↔ b+ln(a)&gt;0</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ NEW: domain characterization</text>
  </g>
  <g transform="translate(530, 620)">
    <rect width="220" height="55" rx="6" fill="#2a1520" stroke="#ff6080" stroke-width="2"/>
    <text x="12" y="16" fill="#ff88aa" font-size="11" font-weight="bold">Geodesic verification</text>
    <text x="12" y="30" fill="#ff88aa" font-size="11">x'' + ½(x')² = 0 ✓</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ NEW: ODE solutions</text>
  </g>
  <g transform="translate(765, 620)">
    <rect width="220" height="55" rx="6" fill="#2a1520" stroke="#ff6080" stroke-width="2"/>
    <text x="12" y="16" fill="#ff88aa" font-size="11" font-weight="bold">Tropical EML structure</text>
    <text x="12" y="30" fill="#ff88aa" font-size="11">Non-comm, averaging bound</text>
    <text x="12" y="44" fill="#66aa44" font-size="9">✓ NEW: algebraic properties</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 720)">
    <rect width="12" height="12" fill="#66aa44"/>
    <text x="18" y="11" fill="#aabbcc" font-size="11">✓ Formally verified in Lean 4</text>
  </g>
  <g transform="translate(260, 720)">
    <rect width="12" height="12" fill="#ffaa44"/>
    <text x="18" y="11" fill="#aabbcc" font-size="11">⟳ Open / in progress</text>
  </g>
  <g transform="translate(440, 720)">
    <rect width="12" height="12" fill="#ff6666"/>
    <text x="18" y="11" fill="#aabbcc" font-size="11">✗ Proven impossible</text>
  </g>
  <g transform="translate(620, 720)">
    <rect width="12" height="12" fill="#ff6080"/>
    <text x="18" y="11" fill="#aabbcc" font-size="11">★ New in V12</text>
  </g>

  <text x="600" y="810" text-anchor="middle" fill="#445566" font-size="11">
    EML Theorem Landscape V12 — 280+ verified theorems across algebra, analysis, geometry, and dynamics
  </text>
</svg>
