<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffd200"/>
    </marker>
  </defs>

  <rect width="1100" height="750" fill="url(#bg2)"/>

  <text x="550" y="45" text-anchor="middle" fill="#ffd200" font-size="32" font-weight="bold">
    EML Identity Network
  </text>
  <text x="550" y="70" text-anchor="middle" fill="#888" font-size="14">
    How the key identities connect — all formally verified in Lean 4
  </text>

  <!-- Central node -->
  <circle cx="550" cy="350" r="55" fill="rgba(79,195,247,0.15)" stroke="#4fc3f7" stroke-width="3"/>
  <text x="550" y="342" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">eml(x, y)</text>
  <text x="550" y="365" text-anchor="middle" fill="#4fc3f7" font-size="14">= eˣ − ln y</text>

  <!-- Node: Legendre -->
  <rect x="100" y="100" width="220" height="70" rx="10" fill="rgba(255,210,0,0.1)" stroke="#ffd200" stroke-width="2"/>
  <text x="210" y="130" text-anchor="middle" fill="#ffd200" font-size="14" font-weight="bold">Legendre Bridge</text>
  <text x="210" y="155" text-anchor="middle" fill="#fff" font-size="14">eml(x, eʸ) = eˣ − y</text>
  <line x1="320" y1="145" x2="500" y2="310" stroke="#ffd200" stroke-width="1.5" marker-end="url(#arrow-gold)" stroke-dasharray="5,3"/>

  <!-- Node: Power -->
  <rect x="780" y="100" width="220" height="70" rx="10" fill="rgba(126,87,194,0.1)" stroke="#7e57c2" stroke-width="2"/>
  <text x="890" y="130" text-anchor="middle" fill="#7e57c2" font-size="14" font-weight="bold">Power Identity</text>
  <text x="890" y="155" text-anchor="middle" fill="#fff" font-size="14">eml(nx, 1) = (eˣ)ⁿ</text>
  <line x1="780" y1="145" x2="605" y2="310" stroke="#7e57c2" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- Node: Self-Pairing -->
  <rect x="50" y="300" width="220" height="70" rx="10" fill="rgba(102,187,106,0.1)" stroke="#66bb6a" stroke-width="2"/>
  <text x="160" y="330" text-anchor="middle" fill="#66bb6a" font-size="14" font-weight="bold">Self-Pairing</text>
  <text x="160" y="355" text-anchor="middle" fill="#fff" font-size="14">eml(x, eˣ) = eˣ − x</text>
  <line x1="270" y1="340" x2="495" y2="345" stroke="#66bb6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node: Double Negation -->
  <rect x="830" y="300" width="230" height="70" rx="10" fill="rgba(239,83,80,0.1)" stroke="#ef5350" stroke-width="2"/>
  <text x="945" y="330" text-anchor="middle" fill="#ef5350" font-size="14" font-weight="bold">Negation Involution</text>
  <text x="945" y="355" text-anchor="middle" fill="#fff" font-size="13">N(N(x)) = x, N = eml(0,eˣ)</text>
  <line x1="830" y1="340" x2="605" y2="345" stroke="#ef5350" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node: Log-Split -->
  <rect x="50" y="480" width="230" height="70" rx="10" fill="rgba(38,198,218,0.1)" stroke="#26c6da" stroke-width="2"/>
  <text x="165" y="510" text-anchor="middle" fill="#26c6da" font-size="14" font-weight="bold">Log-Split</text>
  <text x="165" y="535" text-anchor="middle" fill="#fff" font-size="13">eml(x, yz) = eml(x,y) − ln z</text>
  <line x1="280" y1="510" x2="500" y2="390" stroke="#26c6da" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- Node: Trace/AM-GM -->
  <rect x="820" y="480" width="240" height="70" rx="10" fill="rgba(255,167,38,0.1)" stroke="#ffa726" stroke-width="2"/>
  <text x="940" y="510" text-anchor="middle" fill="#ffa726" font-size="14" font-weight="bold">AM-GM Trace</text>
  <text x="940" y="535" text-anchor="middle" fill="#fff" font-size="13">eml(x,y)+eml(y,x) ≥ 2</text>
  <line x1="820" y1="510" x2="605" y2="390" stroke="#ffa726" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- Node: Exp Recovery -->
  <rect x="330" y="550" width="200" height="60" rx="10" fill="rgba(79,195,247,0.1)" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="430" y="575" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">Exp Recovery</text>
  <text x="430" y="595" text-anchor="middle" fill="#fff" font-size="13">eml(x, 1) = eˣ</text>
  <line x1="450" y1="550" x2="530" y2="405" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node: Zero Generation -->
  <rect x="570" y="550" width="220" height="60" rx="10" fill="rgba(171,71,188,0.1)" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="680" y="575" text-anchor="middle" fill="#ab47bc" font-size="14" font-weight="bold">Zero Generation</text>
  <text x="680" y="595" text-anchor="middle" fill="#fff" font-size="13">eml(1, eᵉ) = 0</text>
  <line x1="660" y1="550" x2="570" y2="405" stroke="#ab47bc" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node: Subtraction -->
  <rect x="350" y="650" width="180" height="60" rx="10" fill="rgba(255,255,255,0.05)" stroke="#888" stroke-width="1.5"/>
  <text x="440" y="675" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">Subtraction</text>
  <text x="440" y="695" text-anchor="middle" fill="#ccc" font-size="12">eml(ln a, eᵇ) = a−b</text>

  <!-- Node: Addition -->
  <rect x="570" y="650" width="180" height="60" rx="10" fill="rgba(255,255,255,0.05)" stroke="#888" stroke-width="1.5"/>
  <text x="660" y="675" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">Addition</text>
  <text x="660" y="695" text-anchor="middle" fill="#ccc" font-size="12">eml(ln a, e⁻ᵇ) = a+b</text>

  <!-- Connection lines for arithmetic -->
  <line x1="440" y1="650" x2="440" y2="610" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="660" y1="650" x2="660" y2="610" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <text x="550" y="740" text-anchor="middle" fill="#666" font-size="12">
    All identities machine-verified in Lean 4 with Mathlib • Zero sorries
  </text>
</svg>
