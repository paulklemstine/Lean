<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#ffd700" font-size="22" font-weight="bold">EML Neural Network Architecture vs Standard NN</text>

  <!-- EML Network (left side) -->
  <rect x="30" y="60" width="450" height="580" rx="10" fill="rgba(79,195,247,0.05)" stroke="#4fc3f755" stroke-width="1"/>
  <text x="255" y="90" text-anchor="middle" fill="#4fc3f7" font-size="18" font-weight="bold">EML Network</text>
  <text x="255" y="108" text-anchor="middle" fill="#4fc3f7aa" font-size="12">4 params/neuron: (a, b, c, d)</text>

  <!-- EML Input Layer -->
  <text x="80" y="145" fill="#aaa" font-size="11">Input</text>
  <circle cx="100" cy="170" r="15" fill="none" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="100" y="174" text-anchor="middle" fill="#4fc3f7" font-size="10">x₁</text>
  <circle cx="100" cy="220" r="15" fill="none" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="100" y="224" text-anchor="middle" fill="#4fc3f7" font-size="10">x₂</text>
  <circle cx="100" cy="270" r="15" fill="none" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="100" y="274" text-anchor="middle" fill="#4fc3f7" font-size="10">x₃</text>

  <!-- EML Hidden Layer 1 -->
  <text x="200" y="145" fill="#aaa" font-size="11">EML Layer 1</text>
  <!-- EML neurons shown as exp-log boxes -->
  <rect x="195" y="155" width="60" height="40" rx="5" fill="rgba(255,152,0,0.2)" stroke="#ff9800" stroke-width="1.5"/>
  <text x="225" y="172" text-anchor="middle" fill="#ff9800" font-size="9">d·exp(</text>
  <text x="225" y="185" text-anchor="middle" fill="#ff9800" font-size="9">a·log+b)+c</text>

  <rect x="195" y="205" width="60" height="40" rx="5" fill="rgba(255,152,0,0.2)" stroke="#ff9800" stroke-width="1.5"/>
  <text x="225" y="222" text-anchor="middle" fill="#ff9800" font-size="9">d·exp(</text>
  <text x="225" y="235" text-anchor="middle" fill="#ff9800" font-size="9">a·log+b)+c</text>

  <rect x="195" y="255" width="60" height="40" rx="5" fill="rgba(255,152,0,0.2)" stroke="#ff9800" stroke-width="1.5"/>
  <text x="225" y="272" text-anchor="middle" fill="#ff9800" font-size="9">d·exp(</text>
  <text x="225" y="285" text-anchor="middle" fill="#ff9800" font-size="9">a·log+b)+c</text>

  <!-- Connections input → hidden1 -->
  <line x1="115" y1="170" x2="195" y2="175" stroke="#4fc3f744" stroke-width="1"/>
  <line x1="115" y1="220" x2="195" y2="225" stroke="#4fc3f744" stroke-width="1"/>
  <line x1="115" y1="270" x2="195" y2="275" stroke="#4fc3f744" stroke-width="1"/>

  <!-- EML Hidden Layer 2 -->
  <text x="310" y="145" fill="#aaa" font-size="11">EML Layer 2</text>
  <rect x="305" y="185" width="60" height="40" rx="5" fill="rgba(76,175,80,0.2)" stroke="#4caf50" stroke-width="1.5"/>
  <text x="335" y="202" text-anchor="middle" fill="#4caf50" font-size="9">d·exp(</text>
  <text x="335" y="215" text-anchor="middle" fill="#4caf50" font-size="9">a·log+b)+c</text>

  <rect x="305" y="235" width="60" height="40" rx="5" fill="rgba(76,175,80,0.2)" stroke="#4caf50" stroke-width="1.5"/>
  <text x="335" y="252" text-anchor="middle" fill="#4caf50" font-size="9">d·exp(</text>
  <text x="335" y="265" text-anchor="middle" fill="#4caf50" font-size="9">a·log+b)+c</text>

  <!-- Connections hidden1 → hidden2 -->
  <line x1="255" y1="175" x2="305" y2="205" stroke="#ff980044" stroke-width="1"/>
  <line x1="255" y1="225" x2="305" y2="205" stroke="#ff980044" stroke-width="1"/>
  <line x1="255" y1="225" x2="305" y2="255" stroke="#ff980044" stroke-width="1"/>
  <line x1="255" y1="275" x2="305" y2="255" stroke="#ff980044" stroke-width="1"/>

  <!-- EML Output -->
  <text x="410" y="205" fill="#aaa" font-size="11">Output</text>
  <circle cx="430" cy="230" r="15" fill="none" stroke="#ffd700" stroke-width="2"/>
  <text x="430" y="234" text-anchor="middle" fill="#ffd700" font-size="10">ŷ</text>
  <line x1="365" y1="205" x2="415" y2="225" stroke="#4caf5044" stroke-width="1"/>
  <line x1="365" y1="255" x2="415" y2="235" stroke="#4caf5044" stroke-width="1"/>

  <!-- EML Stats -->
  <rect x="60" y="330" width="380" height="130" rx="8" fill="rgba(79,195,247,0.08)" stroke="#4fc3f733" stroke-width="1"/>
  <text x="250" y="355" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">EML Advantages (Proven)</text>
  <text x="80" y="378" fill="#b3e5fc" font-size="12">• Parameters: 4 × depth × width = 4dw</text>
  <text x="80" y="398" fill="#b3e5fc" font-size="12">• Lipschitz: naturally bounded (exp(-x²))</text>
  <text x="80" y="418" fill="#b3e5fc" font-size="12">• Interpretable: read symbolic formula</text>
  <text x="80" y="438" fill="#b3e5fc" font-size="12">• Constant-time: zero branch operations</text>

  <!-- ReLU Network (right side) -->
  <rect x="520" y="60" width="450" height="580" rx="10" fill="rgba(239,154,154,0.05)" stroke="#ef9a9a55" stroke-width="1"/>
  <text x="745" y="90" text-anchor="middle" fill="#ef9a9a" font-size="18" font-weight="bold">Standard ReLU Network</text>
  <text x="745" y="108" text-anchor="middle" fill="#ef9a9aaa" font-size="12">w(w+1) params/layer</text>

  <!-- ReLU Input -->
  <circle cx="590" cy="170" r="15" fill="none" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="590" y="174" text-anchor="middle" fill="#ef9a9a" font-size="10">x₁</text>
  <circle cx="590" cy="220" r="15" fill="none" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="590" y="224" text-anchor="middle" fill="#ef9a9a" font-size="10">x₂</text>
  <circle cx="590" cy="270" r="15" fill="none" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="590" y="274" text-anchor="middle" fill="#ef9a9a" font-size="10">x₃</text>

  <!-- ReLU Hidden 1 - fully connected -->
  <text x="680" y="145" fill="#aaa" font-size="11">Dense + ReLU</text>
  <circle cx="700" cy="170" r="12" fill="rgba(239,154,154,0.2)" stroke="#ef9a9a" stroke-width="1"/>
  <circle cx="700" cy="200" r="12" fill="rgba(239,154,154,0.2)" stroke="#ef9a9a" stroke-width="1"/>
  <circle cx="700" cy="230" r="12" fill="rgba(239,154,154,0.2)" stroke="#ef9a9a" stroke-width="1"/>
  <circle cx="700" cy="260" r="12" fill="rgba(239,154,154,0.2)" stroke="#ef9a9a" stroke-width="1"/>
  <circle cx="700" cy="290" r="12" fill="rgba(239,154,154,0.2)" stroke="#ef9a9a" stroke-width="1"/>

  <!-- Full connections input → hidden1 (9 connections shown) -->
  <line x1="605" y1="170" x2="688" y2="170" stroke="#ef9a9a22" stroke-width="1"/>
  <line x1="605" y1="170" x2="688" y2="200" stroke="#ef9a9a22" stroke-width="1"/>
  <line x1="605" y1="170" x2="688" y2="230" stroke="#ef9a9a22" stroke-width="1"/>
  <line x1="605" y1="220" x2="688" y2="200" stroke="#ef9a9a22" stroke-width="1"/>
  <line x1="605" y1="220" x2="688" y2="230" stroke="#ef9a9a22" stroke-width="1"/>
  <line x1="605" y1="220" x2="688" y2="260" stroke="#ef9a9a22" stroke-width="1"/>
  <line x1="605" y1="270" x2="688" y2="230" stroke="#ef9a9a22" stroke-width="1"/>
  <line x1="605" y1="270" x2="688" y2="260" stroke="#ef9a9a22" stroke-width="1"/>
  <line x1="605" y1="270" x2="688" y2="290" stroke="#ef9a9a22" stroke-width="1"/>

  <!-- ReLU Hidden 2 -->
  <text x="790" y="145" fill="#aaa" font-size="11">Dense + ReLU</text>
  <circle cx="810" cy="200" r="12" fill="rgba(239,154,154,0.2)" stroke="#ef9a9a" stroke-width="1"/>
  <circle cx="810" cy="230" r="12" fill="rgba(239,154,154,0.2)" stroke="#ef9a9a" stroke-width="1"/>
  <circle cx="810" cy="260" r="12" fill="rgba(239,154,154,0.2)" stroke="#ef9a9a" stroke-width="1"/>

  <!-- ReLU Output -->
  <circle cx="900" cy="230" r="15" fill="none" stroke="#ef9a9a" stroke-width="2"/>
  <text x="900" y="234" text-anchor="middle" fill="#ef9a9a" font-size="10">ŷ</text>

  <!-- ReLU Stats -->
  <rect x="550" y="330" width="380" height="130" rx="8" fill="rgba(239,154,154,0.08)" stroke="#ef9a9a33" stroke-width="1"/>
  <text x="740" y="355" text-anchor="middle" fill="#ef9a9a" font-size="14" font-weight="bold">Standard NN Disadvantages</text>
  <text x="570" y="378" fill="#ffcdd2" font-size="12">• Parameters: d × w × (w+1) ≫ 4dw</text>
  <text x="570" y="398" fill="#ffcdd2" font-size="12">• Lipschitz: grows exponentially with depth</text>
  <text x="570" y="418" fill="#ffcdd2" font-size="12">• Black box: no symbolic interpretation</text>
  <text x="570" y="438" fill="#ffcdd2" font-size="12">• Branching: w branches per ReLU layer</text>

  <!-- Comparison Table -->
  <rect x="100" y="490" width="800" height="160" rx="10" fill="rgba(255,215,0,0.05)" stroke="#ffd70055" stroke-width="1"/>
  <text x="500" y="515" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold">Parameter Comparison (Formally Verified)</text>

  <text x="150" y="545" fill="#aaa" font-size="12" font-weight="bold">Width</text>
  <text x="280" y="545" fill="#4fc3f7" font-size="12" font-weight="bold">EML (4dw)</text>
  <text x="450" y="545" fill="#ef9a9a" font-size="12" font-weight="bold">ReLU (dw(w+1))</text>
  <text x="650" y="545" fill="#ffd700" font-size="12" font-weight="bold">Compression</text>

  <line x1="130" y1="552" x2="870" y2="552" stroke="#555" stroke-width="0.5"/>

  <text x="150" y="572" fill="#ddd" font-size="12">w = 10</text>
  <text x="280" y="572" fill="#b3e5fc" font-size="12">40</text>
  <text x="450" y="572" fill="#ffcdd2" font-size="12">110</text>
  <text x="650" y="572" fill="#ffd700" font-size="12">2.75×</text>

  <text x="150" y="594" fill="#ddd" font-size="12">w = 50</text>
  <text x="280" y="594" fill="#b3e5fc" font-size="12">200</text>
  <text x="450" y="594" fill="#ffcdd2" font-size="12">2,550</text>
  <text x="650" y="594" fill="#ffd700" font-size="12">12.75×</text>

  <text x="150" y="616" fill="#ddd" font-size="12">w = 100</text>
  <text x="280" y="616" fill="#b3e5fc" font-size="12">400</text>
  <text x="450" y="616" fill="#ffcdd2" font-size="12">10,100</text>
  <text x="650" y="616" fill="#ffd700" font-size="12" font-weight="bold">25.25×  ✓</text>

  <text x="150" y="638" fill="#ddd" font-size="12">w = 1000</text>
  <text x="280" y="638" fill="#b3e5fc" font-size="12">4,000</text>
  <text x="450" y="638" fill="#ffcdd2" font-size="12">1,001,000</text>
  <text x="650" y="638" fill="#ffd700" font-size="12">250.25×</text>

  <!-- Footer -->
  <text x="500" y="680" text-anchor="middle" fill="#888" font-size="11">
    All comparisons formally verified in Lean 4 + Mathlib · EML × AI &amp; ML v10
  </text>
</svg>
