    <text x="810" y="490" fill="#94a3b8">v11 New Theorems</text>
    <text x="1100" y="490" text-anchor="end" fill="#22c55e" font-weight="bold">69</text>

    <text x="810" y="520" fill="#94a3b8">Cumulative Theorems</text>
    <text x="1100" y="520" text-anchor="end" fill="#22c55e" font-weight="bold">350+</text>

    <text x="810" y="550" fill="#94a3b8">Remaining Sorries</text>
    <text x="1100" y="550" text-anchor="end" fill="#22c55e" font-weight="bold">0</text>

    <text x="810" y="580" fill="#94a3b8">New Lean Files</text>
    <text x="1100" y="580" text-anchor="end" fill="#22c55e" font-weight="bold">5</text>

    <text x="810" y="610" fill="#94a3b8">Python Demos</text>
    <text x="1100" y="610" text-anchor="end" fill="#60a5fa" font-weight="bold">6</text>

    <text x="810" y="640" fill="#94a3b8">SVG Visualizations</text>
    <text x="1100" y="640" text-anchor="end" fill="#a78bfa" font-weight="bold">5</text>

    <text x="810" y="670" fill="#94a3b8">Research Papers</text>
    <text x="1100" y="670" text-anchor="end" fill="#fbbf24" font-weight="bold">3</text>

    <text x="810" y="700" fill="#94a3b8">Research Directions</text>
    <text x="1100" y="700" text-anchor="end" fill="#f87171" font-weight="bold">150</text>

    <text x="810" y="730" fill="#94a3b8">Questions Answered</text>
    <text x="1100" y="730" text-anchor="end" fill="#22c55e" font-weight="bold">10 new</text>
  </g>

  <!-- Footer -->
  <text x="600" y="790" text-anchor="middle" fill="#475569" font-size="11">
    Lean 4 v4.28.0 + Mathlib · All proofs machine-checked · EML Research v11
