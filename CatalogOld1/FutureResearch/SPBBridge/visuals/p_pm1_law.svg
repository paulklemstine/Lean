<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#fafafa" rx="10"/>

  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">
    The p±1 Law: SPB Group Orders over Finite Fields
  </text>

  <!-- Chart area -->
  <g transform="translate(80, 60)">
    <!-- Axes -->
    <line x1="0" y1="350" x2="680" y2="350" stroke="#2c3e50" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="350" stroke="#2c3e50" stroke-width="2"/>

    <!-- Y-axis label -->
    <text x="-45" y="175" text-anchor="middle" font-size="13" fill="#2c3e50"
          transform="rotate(-90, -45, 175)">Group Order</text>

    <!-- X-axis label -->
    <text x="340" y="390" text-anchor="middle" font-size="13" fill="#2c3e50">Prime p</text>

    <!-- Grid lines and Y labels -->
    <line x1="0" y1="0" x2="680" y2="0" stroke="#ecf0f1" stroke-width="1"/>
    <text x="-10" y="5" text-anchor="end" font-size="10" fill="#7f8c8d">100</text>
    <line x1="0" y1="87.5" x2="680" y2="87.5" stroke="#ecf0f1" stroke-width="1"/>
    <text x="-10" y="92" text-anchor="end" font-size="10" fill="#7f8c8d">75</text>
    <line x1="0" y1="175" x2="680" y2="175" stroke="#ecf0f1" stroke-width="1"/>
    <text x="-10" y="180" text-anchor="end" font-size="10" fill="#7f8c8d">50</text>
    <line x1="0" y1="262.5" x2="680" y2="262.5" stroke="#ecf0f1" stroke-width="1"/>
    <text x="-10" y="267" text-anchor="end" font-size="10" fill="#7f8c8d">25</text>
    <text x="-10" y="355" text-anchor="end" font-size="10" fill="#7f8c8d">0</text>

    <!-- Reference lines: y = p+1 and y = p-1 -->
    <!-- p+1 line (for p ≡ 3 mod 4) -->
    <line x1="0" y1="336" x2="660" y2="3" stroke="#3498db" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
    <text x="665" y="8" font-size="10" fill="#3498db">p+1</text>

    <!-- p-1 line (for p ≡ 1 mod 4) -->
    <line x1="0" y1="343" x2="660" y2="10" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
    <text x="665" y="18" font-size="10" fill="#e74c3c">p−1</text>

    <!-- Data points -->
    <!-- p=3 (mod4=3): order=4 -->
    <circle cx="14" cy="336" r="5" fill="#3498db"/>
    <text x="14" y="365" text-anchor="middle" font-size="8" fill="#7f8c8d">3</text>

    <!-- p=5 (mod4=1): order=4 -->
    <circle cx="28" cy="336" r="5" fill="#e74c3c"/>
    <text x="28" y="365" text-anchor="middle" font-size="8" fill="#7f8c8d">5</text>

    <!-- p=7 (mod4=3): order=8 -->
    <circle cx="42" cy="322" r="5" fill="#3498db"/>
    <text x="42" y="365" text-anchor="middle" font-size="8" fill="#7f8c8d">7</text>

    <!-- p=11 (mod4=3): order=12 -->
    <circle cx="70" cy="308" r="5" fill="#3498db"/>
    <text x="70" y="365" text-anchor="middle" font-size="8" fill="#7f8c8d">11</text>

    <!-- p=13 (mod4=1): order=12 -->
    <circle cx="84" cy="308" r="5" fill="#e74c3c"/>
    <text x="84" y="365" text-anchor="middle" font-size="8" fill="#7f8c8d">13</text>

    <!-- p=17 (mod4=1): order=16 -->
    <circle cx="112" cy="294" r="5" fill="#e74c3c"/>

    <!-- p=19 (mod4=3): order=20 -->
    <circle cx="126" cy="280" r="5" fill="#3498db"/>

    <!-- p=23 (mod4=3): order=24 -->
    <circle cx="154" cy="266" r="5" fill="#3498db"/>

    <!-- p=29 (mod4=1): order=28 -->
    <circle cx="196" cy="252" r="5" fill="#e74c3c"/>

    <!-- p=31 (mod4=3): order=32 -->
    <circle cx="210" cy="238" r="5" fill="#3498db"/>

    <!-- p=37 (mod4=1): order=36 -->
    <circle cx="252" cy="224" r="5" fill="#e74c3c"/>

    <!-- p=41 (mod4=1): order=40 -->
    <circle cx="280" cy="210" r="5" fill="#e74c3c"/>

    <!-- p=43 (mod4=3): order=44 -->
    <circle cx="294" cy="196" r="5" fill="#3498db"/>

    <!-- p=47 (mod4=3): order=48 -->
    <circle cx="322" cy="182" r="5" fill="#3498db"/>

    <!-- p=53 (mod4=1): order=52 -->
    <circle cx="364" cy="168" r="5" fill="#e74c3c"/>

    <!-- p=59 (mod4=3): order=60 -->
    <circle cx="406" cy="140" r="5" fill="#3498db"/>

    <!-- p=61 (mod4=1): order=60 -->
    <circle cx="420" cy="140" r="5" fill="#e74c3c"/>

    <!-- p=67 (mod4=3): order=68 -->
    <circle cx="462" cy="112" r="5" fill="#3498db"/>

    <!-- p=71 (mod4=3): order=72 -->
    <circle cx="490" cy="98" r="5" fill="#3498db"/>

    <!-- p=73 (mod4=1): order=72 -->
    <circle cx="504" cy="98" r="5" fill="#e74c3c"/>

    <!-- p=79 (mod4=3): order=80 -->
    <circle cx="546" cy="70" r="5" fill="#3498db"/>

    <!-- p=83 (mod4=3): order=84 -->
    <circle cx="574" cy="56" r="5" fill="#3498db"/>

    <!-- p=89 (mod4=1): order=88 -->
    <circle cx="616" cy="42" r="5" fill="#e74c3c"/>

    <!-- p=97 (mod4=1): order=96 -->
    <circle cx="672" cy="14" r="5" fill="#e74c3c"/>
  </g>

  <!-- Legend -->
  <rect x="520" y="420" width="250" height="70" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <circle cx="540" cy="442" r="6" fill="#3498db"/>
  <text x="555" y="447" font-size="12" fill="#2c3e50">p ≡ 3 (mod 4): order = p + 1</text>
  <circle cx="540" cy="468" r="6" fill="#e74c3c"/>
  <text x="555" y="473" font-size="12" fill="#2c3e50">p ≡ 1 (mod 4): order = p − 1</text>

  <!-- Insight box -->
  <rect x="30" y="420" width="460" height="70" rx="8" fill="#2c3e50" opacity="0.9"/>
  <text x="260" y="447" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    |SPB(𝔽_p)| = p − χ₋₄(p) = p − (−1)^((p−1)/2)
  </text>
  <text x="260" y="472" text-anchor="middle" font-size="12" fill="#bdc3c7">
    Determined by whether √(−1) exists in 𝔽_p
  </text>
</svg>
