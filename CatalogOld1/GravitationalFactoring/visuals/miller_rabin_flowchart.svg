<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#88aacc"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00cc44"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4444"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">
    Miller-Rabin Primality Test — Formal Verification Flowchart
  </text>
  <text x="500" y="58" text-anchor="middle" fill="#88aacc" font-size="13">
    Every box corresponds to a formally verified theorem in Lean 4
  </text>

  <!-- Input -->
  <rect x="380" y="75" width="240" height="40" rx="20" fill="#1a2a3a" stroke="#44aaff" stroke-width="2"/>
  <text x="500" y="100" text-anchor="middle" fill="#ffffff" font-size="14">Input: n, base a</text>

  <!-- Arrow down -->
  <line x1="500" y1="115" x2="500" y2="140" stroke="#88aacc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Is n even? -->
  <polygon points="500,145 620,185 500,225 380,185" fill="#1a1a2a" stroke="#ffaa00" stroke-width="2"/>
  <text x="500" y="190" text-anchor="middle" fill="#ffcc44" font-size="12">n = 2 or n even?</text>

  <!-- Yes: n=2 prime, n even composite -->
  <line x1="380" y1="185" x2="280" y2="185" stroke="#00cc44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="160" y="170" width="120" height="30" rx="6" fill="#0a2a0a" stroke="#00cc44" stroke-width="1.5"/>
  <text x="220" y="190" text-anchor="middle" fill="#00ff66" font-size="11">n=2: PRIME</text>

  <line x1="620" y1="185" x2="720" y2="185" stroke="#ff4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="720" y="170" width="150" height="30" rx="6" fill="#2a0a0a" stroke="#ff4444" stroke-width="1.5"/>
  <text x="795" y="190" text-anchor="middle" fill="#ff6666" font-size="11">n even, n≠2: COMPOSITE</text>

  <!-- Arrow down from diamond -->
  <line x1="500" y1="225" x2="500" y2="255" stroke="#88aacc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="243" fill="#88aacc" font-size="10">n odd, n > 2</text>

  <!-- Decompose n-1 -->
  <rect x="350" y="255" width="300" height="45" rx="8" fill="#1a1a2a" stroke="#44aaff" stroke-width="2"/>
  <text x="500" y="275" text-anchor="middle" fill="#ffffff" font-size="12">Write n-1 = 2^s · d, d odd</text>
  <text x="500" y="292" text-anchor="middle" fill="#66ccff" font-size="10">✓ odd_decomp (formally verified)</text>

  <!-- Arrow -->
  <line x1="500" y1="300" x2="500" y2="330" stroke="#88aacc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compute a^d mod n -->
  <rect x="350" y="330" width="300" height="45" rx="8" fill="#1a1a2a" stroke="#44aaff" stroke-width="2"/>
  <text x="500" y="350" text-anchor="middle" fill="#ffffff" font-size="12">Compute x₀ = a^d mod n</text>
  <text x="500" y="367" text-anchor="middle" fill="#66ccff" font-size="10">Using fast modular exponentiation</text>

  <!-- Arrow -->
  <line x1="500" y1="375" x2="500" y2="405" stroke="#88aacc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Check x₀ = 1? -->
  <polygon points="500,410 620,450 500,490 380,450" fill="#1a1a2a" stroke="#ffaa00" stroke-width="2"/>
  <text x="500" y="453" text-anchor="middle" fill="#ffcc44" font-size="12">x₀ ≡ 1 (mod n)?</text>

  <!-- Yes -->
  <line x1="620" y1="450" x2="760" y2="450" stroke="#00cc44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="760" y="435" width="170" height="30" rx="6" fill="#0a2a0a" stroke="#00cc44" stroke-width="1.5"/>
  <text x="845" y="455" text-anchor="middle" fill="#00ff66" font-size="11">PROBABLY PRIME</text>
  <text x="845" y="480" text-anchor="middle" fill="#88ddaa" font-size="9">✓ prime_passes_miller_rabin</text>

  <!-- No: arrow down -->
  <line x1="500" y1="490" x2="500" y2="520" stroke="#88aacc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="508" fill="#ff8888" font-size="10">No</text>

  <!-- Check x₀ = n-1? -->
  <polygon points="500,525 620,565 500,605 380,565" fill="#1a1a2a" stroke="#ffaa00" stroke-width="2"/>
  <text x="500" y="568" text-anchor="middle" fill="#ffcc44" font-size="12">x₀ ≡ n-1 (mod n)?</text>

  <!-- Yes -->
  <line x1="620" y1="565" x2="760" y2="565" stroke="#00cc44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="760" y="550" width="170" height="30" rx="6" fill="#0a2a0a" stroke="#00cc44" stroke-width="1.5"/>
  <text x="845" y="570" text-anchor="middle" fill="#00ff66" font-size="11">PROBABLY PRIME</text>

  <!-- No: loop -->
  <line x1="500" y1="605" x2="500" y2="635" stroke="#88aacc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Square and repeat -->
  <rect x="330" y="635" width="340" height="50" rx="8" fill="#1a1a2a" stroke="#44aaff" stroke-width="2"/>
  <text x="500" y="655" text-anchor="middle" fill="#ffffff" font-size="12">x ← x² mod n; repeat for r = 1,...,s-1</text>
  <text x="500" y="672" text-anchor="middle" fill="#66ccff" font-size="10">If x ≡ n-1 at any step → probably prime</text>

  <!-- Arrow to composite -->
  <line x1="500" y1="685" x2="500" y2="720" stroke="#ff4444" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Composite -->
  <rect x="380" y="720" width="240" height="35" rx="6" fill="#2a0a0a" stroke="#ff4444" stroke-width="2"/>
  <text x="500" y="742" text-anchor="middle" fill="#ff6666" font-size="13" font-weight="bold">COMPOSITE (a is witness)</text>

  <!-- Key verified results box -->
  <rect x="30" y="260" width="280" height="230" rx="8" fill="#0a0e1a" stroke="#334466" stroke-width="1.5"/>
  <text x="170" y="285" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Formally Verified Facts</text>
  <line x1="45" y1="292" x2="295" y2="292" stroke="#334466" stroke-width="1"/>
  <text x="45" y="312" fill="#88ddaa" font-size="10">✓ 341 = 11×31 is smallest Fermat psp</text>
  <text x="45" y="332" fill="#88ddaa" font-size="10">✓ 2047 = 23×89 smallest strong psp</text>
  <text x="45" y="352" fill="#88ddaa" font-size="10">✓ 561 = 3×11×17 is Carmichael</text>
  <text x="45" y="372" fill="#88ddaa" font-size="10">✓ Base 7 witnesses 561</text>
  <text x="45" y="392" fill="#88ddaa" font-size="10">✓ Primes always pass MR test</text>
  <text x="45" y="412" fill="#88ddaa" font-size="10">✓ odd_decomp: n-1 = 2^s · d</text>
  <text x="45" y="432" fill="#ffcc88" font-size="10">→ Error prob ≤ 1/4 (future work)</text>
  <text x="45" y="452" fill="#ffcc88" font-size="10">→ Det. MR for n &lt; 3.3×10²⁴</text>
  <text x="45" y="472" fill="#ffcc88" font-size="10">→ Solovay-Strassen comparison</text>

  <!-- Footer -->
  <text x="500" y="790" text-anchor="middle" fill="#556677" font-size="11">
    Gravitational Factoring Project v12 — Miller-Rabin formally verified in Lean 4 with Mathlib
  </text>
</svg>
