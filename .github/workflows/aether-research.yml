name: Aether Research Loop

on:
  schedule:
    - cron: '13 * * * *'  
    - cron: '43 * * * *'   
  workflow_dispatch:
    inputs:
      max_inflight:
        description: 'Max inflight Aristotle jobs'
        required: false
        default: '9'

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: aether-research
  cancel-in-progress: false

env:
  AETHER_MAX_INFLIGHT: ${{ github.event.inputs.max_inflight || '9' }}
  PYTHONUNBUFFERED: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r Aether/requirements.txt

      - name: Create workspace directories
        run: mkdir -p Aether/.aether_workspace/projects Aether/.aether_workspace/logs

      - name: Write Pollinations key file
        run: echo "${{ secrets.POLLINATIONS_API_KEY }}" > Aether/.aether_workspace/pollinations_api_key

      - name: Run Aether tick
        env:
          ARISTOTLE_API_KEY: ${{ secrets.ARISTOTLE_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: cd Aether && python3 aether_tick.py --max-inflight ${{ env.AETHER_MAX_INFLIGHT }} --ollama-cloud

      - name: Commit and push all changes
        run: |
          git config user.name "Aether Bot"
          git config user.email "aether-bot[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Aether CI: tick $(date -u +%Y-%m-%dT%H:%MZ)"
          # Pull remote changes, auto-resolving conflicts by keeping ours
          git pull --rebase -X ours origin master || git rebase --abort
          git push

      - name: Update website index
        run: cd Catalog/Applications/Packages && python3 update_index.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Packages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Catalog/Applications/Packages'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
