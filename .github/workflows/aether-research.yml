name: Aether Research Loop

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      maxinflight:
        description: 'Max inflight Aristotle jobs'
        required: false
        default: '9'
      phase_a_prompt_weights:
        description: 'JSON weights for Phase A prompt A/B test'
        required: false
        default: '{"v15":0.50,"v16":0.20,"v16a":0.10,"v16b":0.10,"v17":0.05,"v18":0.05}'

permissions:
  contents: write
  actions: write

concurrency:
  group: aether-research
  cancel-in-progress: false

env:
  AETHER_MAX_INFLIGHT: ${{ github.event.inputs.maxinflight || '9' }}
  AETHER_PHASE_A_PROMPT_WEIGHTS: ${{ github.event.inputs.phase_a_prompt_weights || '{"v15":0.50,"v16":0.20,"v16a":0.10,"v16b":0.10,"v17":0.05,"v18":0.05}' }}
  PYTHONUNBUFFERED: '1'
  # Force HuggingFace to download to the workspace so we can track its size, if you use it.
  HF_HOME: ${{ github.workspace }}/.hf_cache

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Check space before pip"
        run: df -h

      - name: Install dependencies
        run: pip install -r Aether/requirements.txt

      - name: "Check space after pip"
        run: |
          df -h
          echo "Checking pip cache size:"
          du -sh ~/.cache/pip || true

      - name: Create workspace directories
        run: mkdir -p Aether/.aether_workspace/projects Aether/.aether_workspace/logs

      - name: Write Pollinations key file
        run: echo "${{ secrets.POLLINATIONS_API_KEY }}" > Aether/.aether_workspace/pollinations_api_key

      - name: Run Aether tick
        env:
          ARISTOTLE_API_KEY: ${{ secrets.ARISTOTLE_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: cd Aether && python3 aether_tick.py --max-inflight ${{ env.AETHER_MAX_INFLIGHT }} --ollama-cloud

      - name: "Check space after Aether tick"
        # This will tell us if aether_tick.py downloaded massive files
        run: |
          df -h
          echo "Finding largest directories in workspace:"
          du -ah --max-depth=2 | sort -rh | head -n 15

      - name: Commit and push all changes
        run: |
          git config user.name "Aether Bot"
          git config user.email "aether-bot[bot]@users.noreply.github.com"

          # SAFETY MEASURE: Ensure we aren't staging hidden cache folders or massive models
          # If your script downloaded a 10GB file, git add -A will crash the runner here.
          echo ".hf_cache/" >> .gitignore
          echo "Aether/.aether_workspace/logs/" >> .gitignore # Reconsider if you want 4x daily logs in git history

          git add -A
          git diff --cached --quiet || git commit -m "Aether CI: tick $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours origin master || git rebase --abort
          git push

      - name: Update catalog-lean branch
        run: |
          bash Aether/.aether_workspace/update-catalog-branch.sh
          # The local pre-commit hook may have already pushed catalog-lean.
          # Force-push is safe because the branch is fully derived from master.
          git push --force origin catalog-lean || true

      - name: Update website index
        run: cd Packages && python3 update_index.py