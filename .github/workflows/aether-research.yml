name: Aether Research Loop

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      maxinflight:
        description: 'Max inflight Aristotle jobs'
        required: false
        default: '9'
permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: aether-research
  cancel-in-progress: false

env:
  AETHER_MAX_INFLIGHT: ${{ github.event.inputs.maxinflight || '9' }}
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r Aether/requirements.txt

      - name: Create workspace directories
        run: mkdir -p Aether/.aether_workspace/projects Aether/.aether_workspace/logs

      - name: Configure Git and install hooks
        run: |
          git config user.name "paul klemstine"
          git config user.email "paulklemstine@gmail.com"
          bash Aether/.aether_workspace/git-hooks/install-hooks.sh

      - name: Run Aether tick
        env:
          ARISTOTLE_API_KEY: ${{ secrets.ARISTOTLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd Aether && python3 aether_tick.py --max-inflight ${{ env.AETHER_MAX_INFLIGHT }}
