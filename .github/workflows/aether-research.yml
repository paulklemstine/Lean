name: Aether Research Loop

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      maxinflight:
        description: 'Max inflight Aristotle jobs'
        required: false
        default: '6'
permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: aether-research
  cancel-in-progress: false

env:
  AETHER_MAX_INFLIGHT: ${{ github.event.inputs.maxinflight || '6' }}
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r Aether/requirements.txt

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('Catalog/lean-toolchain') }}

      - name: Cache Mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: |
            Catalog/.lake/build
            Catalog/.lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('Catalog/lean-toolchain', 'Catalog/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Install elan and fetch Lean cache
        run: |
          if [ ! -d "$HOME/.elan/bin" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          cd Catalog
          lake exe cache get || true

      - name: Create workspace directories
        run: mkdir -p Aether/.aether_workspace/projects Aether/.aether_workspace/logs

      - name: Configure Git and install hooks
        run: |
          git config user.name "paul klemstine"
          git config user.email "paulklemstine@gmail.com"
          bash Aether/.aether_workspace/git-hooks/install-hooks.sh

      - name: Run Aether tick
        env:
          ARISTOTLE_API_KEY: ${{ secrets.ARISTOTLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd Aether && python3 aether_tick.py --max-inflight ${{ env.AETHER_MAX_INFLIGHT }}
