name: Catalog Rebuild

on:
  schedule:
    - cron: '8 */2 * * *'    # Every 2 hours at :08
    - cron: '38 */2 * * *'   # Every 2 hours at :38
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r Aether/requirements.txt

      - name: Rebuild catalog index
        run: cd Catalog/Applications/Packages && python3 update_index.py

      - name: Commit and push
        run: |
          git config user.name "Aether Bot"
          git config user.email "aether-bot[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Catalog rebuild: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours origin master || git rebase --abort
          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Packages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Catalog/Applications/Packages'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4