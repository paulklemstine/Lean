<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:0.3"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg3)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#ffd700" font-size="24" font-weight="bold" filter="url(#glow3)">
    50 Novel Factoring Algorithms — Ten Families
  </text>
  <text x="500" y="60" text-anchor="middle" fill="#a0a0c0" font-size="12">
    Unified by the Stereographic Pythagorean Bridge Framework
  </text>

  <!-- Central hub: SPB -->
  <circle cx="500" cy="370" r="60" fill="url(#center)" stroke="#ffd700" stroke-width="2" filter="url(#glow3)"/>
  <text x="500" y="365" text-anchor="middle" fill="white" font-size="14" font-weight="bold">SPB</text>
  <text x="500" y="382" text-anchor="middle" fill="white" font-size="10">(x+y)/(1+xy)</text>

  <!-- Family nodes arranged in a circle -->
  <!-- Family I: Berggren Tree (top) -->
  <g transform="translate(500, 130)">
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="#e94560" opacity="0.85"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">I. Berggren Tree</text>
    <text x="0" y="12" text-anchor="middle" fill="#ffd0d0" font-size="10">Algorithms 1–7</text>
    <line x1="0" y1="25" x2="0" y2="185" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Family II: Congruence of Squares (top-right) -->
  <g transform="translate(770, 180)">
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="#0f3460" opacity="0.85"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">II. Congruence □²</text>
    <text x="0" y="12" text-anchor="middle" fill="#b0d0ff" font-size="10">Algorithms 8–14</text>
    <line x1="-60" y1="25" x2="-210" y2="155" stroke="#0f3460" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Family III: Quaternion/Octonion (right) -->
  <g transform="translate(850, 370)">
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="#533483" opacity="0.85"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">III. Quaternion</text>
    <text x="0" y="12" text-anchor="middle" fill="#d0b0ff" font-size="10">Algorithms 15–21</text>
    <line x1="-90" y1="0" x2="-290" y2="0" stroke="#533483" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Family IV: Tropical (bottom-right) -->
  <g transform="translate(770, 560)">
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="#3fb950" opacity="0.85"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">IV. Tropical</text>
    <text x="0" y="12" text-anchor="middle" fill="#b0ffb0" font-size="10">Algorithms 22–28</text>
    <line x1="-60" y1="-25" x2="-210" y2="-155" stroke="#3fb950" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Family V: Fibonacci (bottom) -->
  <g transform="translate(500, 610)">
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="#f78166" opacity="0.85"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">V. Fibonacci</text>
    <text x="0" y="12" text-anchor="middle" fill="#ffd0b0" font-size="10">Algorithms 29–35</text>
    <line x1="0" y1="-25" x2="0" y2="-185" stroke="#f78166" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Family VI: Lattice (bottom-left) -->
  <g transform="translate(230, 560)">
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="#58a6ff" opacity="0.85"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">VI. Lattice</text>
    <text x="0" y="12" text-anchor="middle" fill="#b0d0ff" font-size="10">Algorithms 36–40</text>
    <line x1="60" y1="-25" x2="210" y2="-155" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Family VII: Spectral (left) -->
  <g transform="translate(150, 370)">
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="#d29922" opacity="0.85"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">VII. Spectral</text>
    <text x="0" y="12" text-anchor="middle" fill="#fff0b0" font-size="10">Algorithms 41–44</text>
    <line x1="90" y1="0" x2="290" y2="0" stroke="#d29922" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Family VIII: Cryptographic (top-left) -->
  <g transform="translate(230, 180)">
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="#da3633" opacity="0.85"/>
    <text x="0" y="-5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">VIII. Crypto</text>
    <text x="0" y="12" text-anchor="middle" fill="#ffb0b0" font-size="10">Algorithms 45–47</text>
    <line x1="60" y1="25" x2="210" y2="155" stroke="#da3633" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Family IX: ML (far top-left) -->
  <g transform="translate(120, 250)">
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="#8957e5" opacity="0.85"/>
    <text x="0" y="-2" text-anchor="middle" fill="white" font-size="11" font-weight="bold">IX. ML-Guided</text>
    <text x="0" y="12" text-anchor="middle" fill="#d0b0ff" font-size="9">Algorithms 48–49</text>
  </g>

  <!-- Family X: Info-Geometric (far top-right) -->
  <g transform="translate(880, 250)">
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="#79c0ff" opacity="0.85"/>
    <text x="0" y="-2" text-anchor="middle" fill="white" font-size="11" font-weight="bold">X. Info-Geom</text>
    <text x="0" y="12" text-anchor="middle" fill="#b0e0ff" font-size="9">Algorithm 50</text>
  </g>

  <!-- Legend -->
  <rect x="20" y="650" width="960" height="35" rx="8" fill="#1a1a3e" opacity="0.5"/>
  <text x="500" y="673" text-anchor="middle" fill="#a0a0c0" font-size="12">
    28,797 formal declarations · 22,334 verified theorems · 1,446 Lean 4 files · All algorithms grounded in machine-verified mathematics
  </text>
</svg>
