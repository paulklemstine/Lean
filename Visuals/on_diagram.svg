<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <rect x="50" y="20" width="700" height="50" rx="8" fill="url(#headerGrad)"/>
  <text x="400" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">
    Carmichael's Theorem: Proof Architecture
  </text>

  <!-- Main theorem box -->
  <rect x="200" y="90" width="400" height="55" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="400" y="112" text-anchor="middle" font-family="monospace" font-size="12" fill="white" font-weight="bold">fib_carmichael</text>
  <text x="400" y="132" text-anchor="middle" font-family="Arial" font-size="11" fill="white">∀ n ≥ 13, F(n) has a primitive prime divisor</text>

  <!-- Arrow from main to two cases -->
  <line x1="300" y1="145" x2="200" y2="185" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="145" x2="600" y2="185" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Prime case -->
  <rect x="70" y="185" width="260" height="50" rx="8" fill="#27ae60" opacity="0.9"/>
  <text x="200" y="207" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">fib_primitive_divisor_prime</text>
  <text x="200" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="white">n prime: every p | F(n) is primitive ✓</text>

  <!-- Composite case -->
  <rect x="470" y="185" width="260" height="50" rx="8" fill="#f39c12" opacity="0.9"/>
  <text x="600" y="207" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">Composite case</text>
  <text x="600" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="white">n composite ≥ 14</text>

  <!-- Arrow from composite to two sub-cases -->
  <line x1="530" y1="235" x2="400" y2="275" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="670" y1="235" x2="670" y2="275" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Small n case -->
  <rect x="250" y="275" width="300" height="55" rx="8" fill="#27ae60" opacity="0.9"/>
  <text x="400" y="297" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">fib_coprime_part_pos_small</text>
  <text x="400" y="317" text-anchor="middle" font-family="Arial" font-size="10" fill="white">14 ≤ n ≤ 10000: native_decide ✓</text>

  <!-- Large n case -->
  <rect x="570" y="275" width="200" height="55" rx="8" fill="#e74c3c" opacity="0.7"/>
  <text x="670" y="297" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">fib_carmichael_large</text>
  <text x="670" y="317" text-anchor="middle" font-family="Arial" font-size="10" fill="white">n > 10000: sorry ⚠</text>

  <!-- Arrow from small n to coprime part -->
  <line x1="400" y1="330" x2="400" y2="365" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Coprime part correctness -->
  <rect x="170" y="365" width="460" height="50" rx="8" fill="#27ae60" opacity="0.9"/>
  <text x="400" y="387" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">primitive_of_fibCoprimePart_pos</text>
  <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="10" fill="white">fibCoprimePart n > 1 → primitive divisor exists ✓</text>

  <!-- Arrows from coprime part to helpers -->
  <line x1="250" y1="415" x2="150" y2="455" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="415" x2="400" y2="455" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="415" x2="650" y2="455" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Helper lemma boxes -->
  <rect x="40" y="455" width="220" height="45" rx="6" fill="#3498db" opacity="0.85"/>
  <text x="150" y="475" text-anchor="middle" font-family="monospace" font-size="9" fill="white" font-weight="bold">removePrimesOf_dvd/coprime</text>
  <text x="150" y="492" text-anchor="middle" font-family="Arial" font-size="9" fill="white">GCD extraction properties ✓</text>

  <rect x="280" y="455" width="240" height="45" rx="6" fill="#3498db" opacity="0.85"/>
  <text x="400" y="475" text-anchor="middle" font-family="monospace" font-size="9" fill="white" font-weight="bold">primitive_of_not_dvd_proper_divisors</text>
  <text x="400" y="492" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Bridging: proper divs → all k ✓</text>

  <rect x="540" y="455" width="220" height="45" rx="6" fill="#3498db" opacity="0.85"/>
  <text x="650" y="475" text-anchor="middle" font-family="monospace" font-size="9" fill="white" font-weight="bold">fibEntryPt_dvd_of_fib_dvd</text>
  <text x="650" y="492" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Entry point theory ✓</text>

  <!-- Legend -->
  <rect x="50" y="530" width="700" height="50" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <rect x="70" y="545" width="15" height="15" rx="3" fill="#27ae60"/>
  <text x="92" y="557" font-family="Arial" font-size="11" fill="#333">Proved</text>
  <rect x="170" y="545" width="15" height="15" rx="3" fill="#e74c3c" opacity="0.7"/>
  <text x="192" y="557" font-family="Arial" font-size="11" fill="#333">Sorry (1 remaining)</text>
  <rect x="330" y="545" width="15" height="15" rx="3" fill="#3498db"/>
  <text x="352" y="557" font-family="Arial" font-size="11" fill="#333">Helper lemmas</text>
  <rect x="480" y="545" width="15" height="15" rx="3" fill="#f39c12"/>
  <text x="502" y="557" font-family="Arial" font-size="11" fill="#333">Case split</text>
</svg>
