<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Tropical Geometry ↔ Neural Networks</text>
  <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-size="12">ReLU(x) = max(0, x) is a tropical polynomial</text>

  <!-- Left: Tropical Side -->
  <rect x="30" y="80" width="390" height="200" rx="12" fill="#1a1e2e" stroke="#e84393" stroke-width="1.5"/>
  <text x="225" y="110" text-anchor="middle" fill="#e84393" font-size="16" font-weight="bold">Tropical Semiring (ℝ∪{∞}, min, +)</text>

  <text x="60" y="140" fill="#dfe6e9" font-size="13">⊕  Addition = min(a, b)</text>
  <text x="60" y="165" fill="#dfe6e9" font-size="13">⊗  Multiplication = a + b</text>
  <text x="60" y="190" fill="#dfe6e9" font-size="13">𝟎  Zero = +∞</text>
  <text x="60" y="215" fill="#dfe6e9" font-size="13">𝟏  One = 0</text>
  <text x="60" y="245" fill="#8b949e" font-size="11">Tropical polynomial:</text>
  <text x="60" y="263" fill="#fd79a8" font-size="12" font-family="monospace">p(x) = min(a₁+x, a₂+2x, ..., aₙ+nx)</text>

  <!-- Right: Neural Network Side -->
  <rect x="480" y="80" width="390" height="200" rx="12" fill="#1a1e2e" stroke="#48dbfb" stroke-width="1.5"/>
  <text x="675" y="110" text-anchor="middle" fill="#48dbfb" font-size="16" font-weight="bold">ReLU Neural Network</text>

  <text x="510" y="140" fill="#dfe6e9" font-size="13">ReLU(x) = max(0, x)</text>
  <text x="510" y="165" fill="#dfe6e9" font-size="13">Layer: ReLU(Wx + b)</text>
  <text x="510" y="190" fill="#dfe6e9" font-size="13">Output: piecewise linear</text>
  <text x="510" y="215" fill="#dfe6e9" font-size="13">Decision boundaries: linear</text>
  <text x="510" y="245" fill="#8b949e" font-size="11">Network function:</text>
  <text x="510" y="263" fill="#74b9ff" font-size="12" font-family="monospace">f(x) = max(w₁·x+b₁, w₂·x+b₂, ..., 0)</text>

  <!-- Bridge arrow -->
  <path d="M 420 180 L 480 180" fill="none" stroke="#feca57" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 480 180 L 420 180" fill="none" stroke="#feca57" stroke-width="3" marker-end="url(#arrowhead)"/>
  <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
    <polygon points="0 0, 8 4, 0 8" fill="#feca57"/>
  </marker>
  <text x="450" y="173" text-anchor="middle" fill="#feca57" font-size="11" font-weight="bold">≡</text>

  <!-- LogSumExp Bridge -->
  <rect x="200" y="310" width="500" height="90" rx="12" fill="#1a1e2e" stroke="#feca57" stroke-width="2"/>
  <text x="450" y="340" text-anchor="middle" fill="#feca57" font-size="15" font-weight="bold">LogSumExp: Smooth Tropical Bridge</text>
  <text x="450" y="365" text-anchor="middle" fill="#dfe6e9" font-size="13">LSE(a, b) = log(eᵃ + eᵇ)  ≈  max(a, b)</text>
  <text x="450" y="388" text-anchor="middle" fill="#8b949e" font-size="12">max(a,b) ≤ LSE(a,b) ≤ max(a,b) + ln 2  ✓ lse2_le_max_log2</text>

  <!-- Application boxes -->
  <rect x="30" y="430" width="185" height="95" rx="10" fill="#1a1e2e" stroke="#00b894" stroke-width="1"/>
  <text x="122" y="458" text-anchor="middle" fill="#00b894" font-size="12" font-weight="bold">Alg. 12: ReLU Analyzer</text>
  <text x="122" y="478" text-anchor="middle" fill="#8b949e" font-size="10">Extract tropical curve</text>
  <text x="122" y="493" text-anchor="middle" fill="#8b949e" font-size="10">from trained network</text>
  <text x="122" y="513" text-anchor="middle" fill="#636e72" font-size="9">→ Interpretability</text>

  <rect x="235" y="430" width="185" height="95" rx="10" fill="#1a1e2e" stroke="#a29bfe" stroke-width="1"/>
  <text x="327" y="458" text-anchor="middle" fill="#a29bfe" font-size="12" font-weight="bold">Alg. 18: Trop. NAS</text>
  <text x="327" y="478" text-anchor="middle" fill="#8b949e" font-size="10">Architecture search via</text>
  <text x="327" y="493" text-anchor="middle" fill="#8b949e" font-size="10">tropical complexity</text>
  <text x="327" y="513" text-anchor="middle" fill="#636e72" font-size="9">→ VC dim ≤ 2k</text>

  <rect x="440" y="430" width="185" height="95" rx="10" fill="#1a1e2e" stroke="#e17055" stroke-width="1"/>
  <text x="532" y="458" text-anchor="middle" fill="#e17055" font-size="12" font-weight="bold">Alg. 33: Trop. Shortest</text>
  <text x="532" y="478" text-anchor="middle" fill="#8b949e" font-size="10">All-pairs shortest paths</text>
  <text x="532" y="493" text-anchor="middle" fill="#8b949e" font-size="10">via matrix power</text>
  <text x="532" y="513" text-anchor="middle" fill="#636e72" font-size="9">→ O(n³ log n)</text>

  <rect x="645" y="430" width="225" height="95" rx="10" fill="#1a1e2e" stroke="#fdcb6e" stroke-width="1"/>
  <text x="757" y="458" text-anchor="middle" fill="#fdcb6e" font-size="12" font-weight="bold">Alg. 42: Trop. Wavelets</text>
  <text x="757" y="478" text-anchor="middle" fill="#8b949e" font-size="10">Multiresolution analysis</text>
  <text x="757" y="493" text-anchor="middle" fill="#8b949e" font-size="10">of piecewise-linear signals</text>
  <text x="757" y="513" text-anchor="middle" fill="#636e72" font-size="9">→ ReLU network analysis</text>
</svg>
