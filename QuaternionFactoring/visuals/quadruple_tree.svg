<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="550" fill="url(#bgt)"/>

  <text x="450" y="35" text-anchor="middle" fill="#E0E0E0" font-size="20" font-weight="bold">
    The Pythagorean Quadruple Tree
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#90CAF9" font-size="12">
    SL(2,ℤ) action on parameter space (m, n, p, q) generates all primitive quadruples
  </text>

  <!-- Tree structure -->
  <!-- Root: (1,2,2,3) -->
  <g filter="url(#glow2)">
    <!-- Level 0 -->
    <circle cx="450" cy="100" r="28" fill="#FF5722" opacity="0.9"/>
    <text x="450" y="95" text-anchor="middle" fill="white" font-size="9" font-weight="bold">(1,2,2)</text>
    <text x="450" y="108" text-anchor="middle" fill="#FFE0B2" font-size="8">d=3</text>

    <!-- Level 1 - three children -->
    <!-- S action -->
    <line x1="430" y1="125" x2="200" y2="175" stroke="#7C4DFF" stroke-width="1.5" opacity="0.6"/>
    <circle cx="200" cy="190" r="25" fill="#7C4DFF" opacity="0.8"/>
    <text x="200" y="186" text-anchor="middle" fill="white" font-size="8" font-weight="bold">(2,3,6)</text>
    <text x="200" y="198" text-anchor="middle" fill="#D1C4E9" font-size="7">d=7</text>

    <!-- T action -->
    <line x1="450" y1="128" x2="450" y2="175" stroke="#2196F3" stroke-width="1.5" opacity="0.6"/>
    <circle cx="450" cy="190" r="25" fill="#2196F3" opacity="0.8"/>
    <text x="450" y="186" text-anchor="middle" fill="white" font-size="8" font-weight="bold">(1,4,8)</text>
    <text x="450" y="198" text-anchor="middle" fill="#BBDEFB" font-size="7">d=9</text>

    <!-- T⁻¹ action -->
    <line x1="470" y1="125" x2="700" y2="175" stroke="#4CAF50" stroke-width="1.5" opacity="0.6"/>
    <circle cx="700" cy="190" r="25" fill="#4CAF50" opacity="0.8"/>
    <text x="700" y="186" text-anchor="middle" fill="white" font-size="8" font-weight="bold">(4,4,7)</text>
    <text x="700" y="198" text-anchor="middle" fill="#C8E6C9" font-size="7">d=9</text>

    <!-- Level 2 - children of each level 1 node -->
    <!-- From (2,3,6,7) -->
    <line x1="183" y1="212" x2="80" y2="265" stroke="#7C4DFF" stroke-width="1" opacity="0.4"/>
    <circle cx="80" cy="280" r="20" fill="#7C4DFF" opacity="0.6"/>
    <text x="80" y="278" text-anchor="middle" fill="white" font-size="7">(6,6,7)</text>
    <text x="80" y="290" text-anchor="middle" fill="#D1C4E9" font-size="6">d=11</text>

    <line x1="200" y1="215" x2="200" y2="265" stroke="#7C4DFF" stroke-width="1" opacity="0.4"/>
    <circle cx="200" cy="280" r="20" fill="#7C4DFF" opacity="0.6"/>
    <text x="200" y="278" text-anchor="middle" fill="white" font-size="7">(1,2,2)</text>
    <text x="200" y="290" text-anchor="middle" fill="#D1C4E9" font-size="6">d=3</text>

    <line x1="217" y1="212" x2="320" y2="265" stroke="#7C4DFF" stroke-width="1" opacity="0.4"/>
    <circle cx="320" cy="280" r="20" fill="#7C4DFF" opacity="0.6"/>
    <text x="320" y="278" text-anchor="middle" fill="white" font-size="7">(3,6,14)</text>
    <text x="320" y="290" text-anchor="middle" fill="#D1C4E9" font-size="6">d=15</text>

    <!-- From (1,4,8,9) -->
    <line x1="433" y1="212" x2="380" y2="265" stroke="#2196F3" stroke-width="1" opacity="0.4"/>
    <circle cx="380" cy="280" r="20" fill="#2196F3" opacity="0.6"/>
    <text x="380" y="278" text-anchor="middle" fill="white" font-size="7">(4,1,8)</text>
    <text x="380" y="290" text-anchor="middle" fill="#BBDEFB" font-size="6">d=9</text>

    <line x1="450" y1="215" x2="450" y2="265" stroke="#2196F3" stroke-width="1" opacity="0.4"/>
    <circle cx="450" cy="280" r="20" fill="#2196F3" opacity="0.6"/>
    <text x="450" y="278" text-anchor="middle" fill="white" font-size="7">(3,4,12)</text>
    <text x="450" y="290" text-anchor="middle" fill="#BBDEFB" font-size="6">d=13</text>

    <line x1="467" y1="212" x2="520" y2="265" stroke="#2196F3" stroke-width="1" opacity="0.4"/>
    <circle cx="520" cy="280" r="20" fill="#2196F3" opacity="0.6"/>
    <text x="520" y="278" text-anchor="middle" fill="white" font-size="7">(7,4,4)</text>
    <text x="520" y="290" text-anchor="middle" fill="#BBDEFB" font-size="6">d=9</text>

    <!-- From (4,4,7,9) -->
    <line x1="683" y1="212" x2="610" y2="265" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
    <circle cx="610" cy="280" r="20" fill="#4CAF50" opacity="0.6"/>
    <text x="610" y="278" text-anchor="middle" fill="white" font-size="7">(4,7,4)</text>
    <text x="610" y="290" text-anchor="middle" fill="#C8E6C9" font-size="6">d=9</text>

    <line x1="700" y1="215" x2="700" y2="265" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
    <circle cx="700" cy="280" r="20" fill="#4CAF50" opacity="0.6"/>
    <text x="700" y="278" text-anchor="middle" fill="white" font-size="7">(2,8,11)</text>
    <text x="700" y="290" text-anchor="middle" fill="#C8E6C9" font-size="6">d=13</text>

    <line x1="717" y1="212" x2="810" y2="265" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
    <circle cx="810" cy="280" r="20" fill="#4CAF50" opacity="0.6"/>
    <text x="810" y="278" text-anchor="middle" fill="white" font-size="7">(8,4,1)</text>
    <text x="810" y="290" text-anchor="middle" fill="#C8E6C9" font-size="6">d=9</text>
  </g>

  <!-- Legend -->
  <rect x="30" y="360" width="250" height="160" rx="10" fill="#0D1117" opacity="0.8" stroke="#37474F"/>
  <text x="155" y="385" text-anchor="middle" fill="#E0E0E0" font-size="13" font-weight="bold">SL(2,ℤ) Generators</text>

  <line x1="50" y1="410" x2="80" y2="410" stroke="#7C4DFF" stroke-width="2"/>
  <text x="90" y="414" fill="#D1C4E9" font-size="11">S: (m,n) ↦ (n, −m)</text>

  <line x1="50" y1="435" x2="80" y2="435" stroke="#2196F3" stroke-width="2"/>
  <text x="90" y="439" fill="#BBDEFB" font-size="11">T: (m,n) ↦ (m+n, n)</text>

  <line x1="50" y1="460" x2="80" y2="460" stroke="#4CAF50" stroke-width="2"/>
  <text x="90" y="464" fill="#C8E6C9" font-size="11">T⁻¹: (m,n) ↦ (m−n, n)</text>

  <text x="45" y="495" fill="#78909C" font-size="10">Each node: Pythagorean quadruple</text>
  <text x="45" y="510" fill="#78909C" font-size="10">(a, b, c) with a²+b²+c² = d²</text>

  <!-- Parametric formula -->
  <rect x="350" y="360" width="520" height="100" rx="10" fill="#0D1117" opacity="0.8" stroke="#FFD54F" stroke-width="1"/>
  <text x="610" y="385" text-anchor="middle" fill="#FFD54F" font-size="13" font-weight="bold">Parametric Formula</text>
  <text x="365" y="410" fill="#FFF9C4" font-size="11">a = m² + n² − p² − q²</text>
  <text x="365" y="430" fill="#FFF9C4" font-size="11">b = 2(mq + np)</text>
  <text x="550" y="410" fill="#FFF9C4" font-size="11">c = 2(nq − mp)</text>
  <text x="550" y="430" fill="#FFF9C4" font-size="11">d = m² + n² + p² + q²</text>
  <text x="365" y="450" fill="#FFF176" font-size="10">Guaranteed: a² + b² + c² = d² ✓</text>

  <!-- Bottom text -->
  <text x="450" y="530" text-anchor="middle" fill="#546E7A" font-size="10">
    Unlike the Berggren tree for triples (3 fixed matrices), the quadruple tree requires the full SL(2,ℤ) action
  </text>
</svg>
