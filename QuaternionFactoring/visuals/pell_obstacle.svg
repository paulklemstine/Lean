<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#2a1a4e"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="700" height="450" fill="url(#bgp)"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" fill="#E0E0E0" font-size="20" font-weight="bold">
    The Pell Obstacle: λ² − μ² = 1
  </text>
  <text x="350" y="55" text-anchor="middle" fill="#CE93D8" font-size="12">
    Why Berggren matrices cannot directly generalize to 3D
  </text>

  <!-- Coordinate system -->
  <g transform="translate(200, 250)">
    <!-- Axes -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#546E7A" stroke-width="1.5"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#546E7A" stroke-width="1.5"/>
    <text x="160" y="5" fill="#78909C" font-size="12">λ</text>
    <text x="5" y="-155" fill="#78909C" font-size="12">μ</text>

    <!-- Hyperbola branches: λ² - μ² = 1 → λ = ±√(1+μ²) -->
    <!-- Right branch -->
    <path d="M 30,0 Q 35,-60 50,-100 Q 70,-120 100,-135 Q 130,-145 150,-148"
          fill="none" stroke="#7C4DFF" stroke-width="2" opacity="0.6"/>
    <path d="M 30,0 Q 35,60 50,100 Q 70,120 100,135 Q 130,145 150,148"
          fill="none" stroke="#7C4DFF" stroke-width="2" opacity="0.6"/>

    <!-- Left branch -->
    <path d="M -30,0 Q -35,-60 -50,-100 Q -70,-120 -100,-135 Q -130,-145 -150,-148"
          fill="none" stroke="#7C4DFF" stroke-width="2" opacity="0.6"/>
    <path d="M -30,0 Q -35,60 -50,100 Q -70,120 -100,135 Q -130,145 -150,148"
          fill="none" stroke="#7C4DFF" stroke-width="2" opacity="0.6"/>

    <!-- Integer lattice points near the hyperbola -->
    <!-- Grid of integer points -->
    <g fill="#37474F" opacity="0.3">
      <!-- Grid dots -->
      <circle cx="-120" cy="-120" r="1.5"/>
      <circle cx="-90" cy="-120" r="1.5"/>
      <circle cx="-60" cy="-120" r="1.5"/>
      <circle cx="-30" cy="-120" r="1.5"/>
      <circle cx="0" cy="-120" r="1.5"/>
      <circle cx="30" cy="-120" r="1.5"/>
      <circle cx="60" cy="-120" r="1.5"/>
      <circle cx="90" cy="-120" r="1.5"/>
      <circle cx="120" cy="-120" r="1.5"/>
      <circle cx="-120" cy="-90" r="1.5"/>
      <circle cx="-90" cy="-90" r="1.5"/>
      <circle cx="-60" cy="-90" r="1.5"/>
      <circle cx="-30" cy="-90" r="1.5"/>
      <circle cx="0" cy="-90" r="1.5"/>
      <circle cx="30" cy="-90" r="1.5"/>
      <circle cx="60" cy="-90" r="1.5"/>
      <circle cx="90" cy="-90" r="1.5"/>
      <circle cx="120" cy="-90" r="1.5"/>
      <circle cx="-120" cy="-60" r="1.5"/>
      <circle cx="-90" cy="-60" r="1.5"/>
      <circle cx="-60" cy="-60" r="1.5"/>
      <circle cx="-30" cy="-60" r="1.5"/>
      <circle cx="0" cy="-60" r="1.5"/>
      <circle cx="30" cy="-60" r="1.5"/>
      <circle cx="60" cy="-60" r="1.5"/>
      <circle cx="90" cy="-60" r="1.5"/>
      <circle cx="120" cy="-60" r="1.5"/>
      <circle cx="-120" cy="-30" r="1.5"/>
      <circle cx="-90" cy="-30" r="1.5"/>
      <circle cx="-60" cy="-30" r="1.5"/>
      <circle cx="-30" cy="-30" r="1.5"/>
      <circle cx="0" cy="-30" r="1.5"/>
      <circle cx="30" cy="-30" r="1.5"/>
      <circle cx="60" cy="-30" r="1.5"/>
      <circle cx="90" cy="-30" r="1.5"/>
      <circle cx="120" cy="-30" r="1.5"/>
      <circle cx="-120" cy="0" r="1.5"/>
      <circle cx="-90" cy="0" r="1.5"/>
      <circle cx="-60" cy="0" r="1.5"/>
      <circle cx="-30" cy="0" r="1.5"/>
      <circle cx="30" cy="0" r="1.5"/>
      <circle cx="60" cy="0" r="1.5"/>
      <circle cx="90" cy="0" r="1.5"/>
      <circle cx="120" cy="0" r="1.5"/>
      <circle cx="-120" cy="30" r="1.5"/>
      <circle cx="-90" cy="30" r="1.5"/>
      <circle cx="-60" cy="30" r="1.5"/>
      <circle cx="-30" cy="30" r="1.5"/>
      <circle cx="0" cy="30" r="1.5"/>
      <circle cx="30" cy="30" r="1.5"/>
      <circle cx="60" cy="30" r="1.5"/>
      <circle cx="90" cy="30" r="1.5"/>
      <circle cx="120" cy="30" r="1.5"/>
      <circle cx="-120" cy="60" r="1.5"/>
      <circle cx="-90" cy="60" r="1.5"/>
      <circle cx="-60" cy="60" r="1.5"/>
      <circle cx="-30" cy="60" r="1.5"/>
      <circle cx="0" cy="60" r="1.5"/>
      <circle cx="30" cy="60" r="1.5"/>
      <circle cx="60" cy="60" r="1.5"/>
      <circle cx="90" cy="60" r="1.5"/>
      <circle cx="120" cy="60" r="1.5"/>
    </g>

    <!-- THE two solutions: (1,0) and (-1,0) -->
    <circle cx="30" cy="0" r="8" fill="#FF5722" opacity="0.8"/>
    <circle cx="-30" cy="0" r="8" fill="#FF5722" opacity="0.8"/>
    <text x="30" y="-15" text-anchor="middle" fill="#FFAB91" font-size="11" font-weight="bold">(1, 0)</text>
    <text x="-30" y="-15" text-anchor="middle" fill="#FFAB91" font-size="11" font-weight="bold">(−1, 0)</text>

    <!-- Label the curve -->
    <text x="120" y="-110" fill="#B388FF" font-size="11">λ² − μ² = 1</text>
  </g>

  <!-- Explanation panels -->
  <rect x="420" y="90" width="260" height="80" rx="8" fill="#1B0030" opacity="0.8" stroke="#7C4DFF" stroke-width="1"/>
  <text x="550" y="115" text-anchor="middle" fill="#CE93D8" font-size="13" font-weight="bold">The Obstacle</text>
  <text x="435" y="135" fill="#E1BEE7" font-size="10">In 2D, Berggren uses λ²−2μ²=1</text>
  <text x="435" y="150" fill="#E1BEE7" font-size="10">(Pell equation — infinite solutions)</text>

  <rect x="420" y="185" width="260" height="80" rx="8" fill="#300000" opacity="0.8" stroke="#FF5722" stroke-width="1"/>
  <text x="550" y="210" text-anchor="middle" fill="#FF8A65" font-size="13" font-weight="bold">In 3D: Only Trivial</text>
  <text x="435" y="230" fill="#FFAB91" font-size="10">λ² − μ² = 1 has only (±1, 0)</text>
  <text x="435" y="245" fill="#FFAB91" font-size="10">Proof: (λ−μ)(λ+μ)=1 in ℤ ⟹ μ=0</text>

  <rect x="420" y="280" width="260" height="80" rx="8" fill="#003300" opacity="0.8" stroke="#4CAF50" stroke-width="1"/>
  <text x="550" y="305" text-anchor="middle" fill="#A5D6A7" font-size="13" font-weight="bold">The Workaround</text>
  <text x="435" y="325" fill="#C8E6C9" font-size="10">Use SL(2,ℤ) on parameter space</text>
  <text x="435" y="340" fill="#C8E6C9" font-size="10">(m,n,p,q) instead of (a,b,c,d)</text>

  <!-- Bottom annotation -->
  <text x="350" y="430" text-anchor="middle" fill="#78909C" font-size="11">
    Machine-verified in Lean 4: theorem pell_obstacle (λ μ : ℤ) (h : λ²−μ²=1) : μ = 0
  </text>
</svg>
