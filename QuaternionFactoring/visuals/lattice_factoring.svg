<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f85149" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">
    Lattice L₃(N): Finding Factors Through Short Vectors
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#8b949e" font-size="12">
    N = 35 = 5 × 7 — Lattice points where x² + y² + z² ≡ 0 (mod 35)
  </text>

  <!-- Grid -->
  <g transform="translate(400, 310)" stroke="#21262d" stroke-width="0.5">
    <!-- Grid lines -->
    <line x1="-250" y1="0" x2="250" y2="0" stroke="#30363d"/>
    <line x1="0" y1="-230" x2="0" y2="230" stroke="#30363d"/>
    <!-- Lighter grid -->
    <line x1="-250" y1="-100" x2="250" y2="-100" stroke-dasharray="3,3"/>
    <line x1="-250" y1="100" x2="250" y2="100" stroke-dasharray="3,3"/>
    <line x1="-100" y1="-230" x2="-100" y2="230" stroke-dasharray="3,3"/>
    <line x1="100" y1="-230" x2="100" y2="230" stroke-dasharray="3,3"/>
    <line x1="-250" y1="-200" x2="250" y2="-200" stroke-dasharray="3,3"/>
    <line x1="-250" y1="200" x2="250" y2="200" stroke-dasharray="3,3"/>
    <line x1="-200" y1="-230" x2="-200" y2="230" stroke-dasharray="3,3"/>
    <line x1="200" y1="-230" x2="200" y2="230" stroke-dasharray="3,3"/>

    <!-- Minkowski bound circle (√N ≈ 5.92, scaled by 20) -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
    <text x="125" y="-5" fill="#f0883e" font-size="10">√N ≈ 5.9</text>

    <!-- N^(1/3) bound circle -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
    <text x="70" y="-45" fill="#3fb950" font-size="10">N^(1/3) ≈ 3.3</text>

    <!-- Lattice points (projected to xy plane, z=0 slice) -->
    <!-- Regular lattice points -->
    <circle cx="0" cy="0" r="5" fill="#58a6ff" opacity="0.8"/>
    <text x="8" y="15" fill="#58a6ff" font-size="9">origin</text>

    <!-- Points at distance √35 ≈ 5.92 (shortest nonzero vectors) -->
    <!-- (5,3,1), (5,1,3), (3,5,1), etc. — scaled by 20 -->
    <circle cx="100" cy="-60" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="100" cy="60" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="-100" cy="-60" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="-100" cy="60" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="60" cy="-100" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="60" cy="100" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="-60" cy="-100" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="-60" cy="100" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="20" cy="-60" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="20" cy="60" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="-20" cy="-60" r="4" fill="#3fb950" opacity="0.9"/>
    <circle cx="-20" cy="60" r="4" fill="#3fb950" opacity="0.9"/>

    <!-- Factor-revealing points (highlighted) -->
    <circle cx="100" cy="0" r="6" fill="#f85149" opacity="0.9"/>
    <circle cx="-100" cy="0" r="6" fill="#f85149" opacity="0.9"/>
    <circle cx="0" cy="-140" r="6" fill="#f85149" opacity="0.9"/>
    <circle cx="0" cy="140" r="6" fill="#f85149" opacity="0.9"/>
    <circle cx="140" cy="-100" r="6" fill="#f85149" opacity="0.9"/>
    <circle cx="-140" cy="100" r="6" fill="#f85149" opacity="0.9"/>

    <!-- More distant lattice points -->
    <circle cx="200" cy="-40" r="3" fill="#484f58" opacity="0.6"/>
    <circle cx="-200" cy="40" r="3" fill="#484f58" opacity="0.6"/>
    <circle cx="160" cy="-160" r="3" fill="#484f58" opacity="0.6"/>
    <circle cx="-160" cy="160" r="3" fill="#484f58" opacity="0.6"/>
    <circle cx="40" cy="-200" r="3" fill="#484f58" opacity="0.6"/>
    <circle cx="-40" cy="200" r="3" fill="#484f58" opacity="0.6"/>

    <!-- Axis labels -->
    <text x="240" y="15" fill="#8b949e" font-size="11">x</text>
    <text x="5" y="-220" fill="#8b949e" font-size="11">y</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 530)">
    <circle cx="5" cy="5" r="4" fill="#3fb950"/>
    <text x="15" y="9" fill="#c9d1d9" font-size="11">Short lattice vector (inside N^(1/3) bound)</text>

    <circle cx="250" cy="5" r="5" fill="#f85149"/>
    <text x="260" y="9" fill="#c9d1d9" font-size="11">Factor-revealing vector (gcd reveals 5 or 7)</text>

    <circle cx="530" cy="5" r="3" fill="#484f58"/>
    <text x="540" y="9" fill="#c9d1d9" font-size="11">Distant lattice point</text>
  </g>

  <!-- Annotation box -->
  <rect x="550" y="75" width="230" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="665" y="98" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Key Insight</text>
  <text x="565" y="118" fill="#c9d1d9" font-size="10">• Shorter vectors → easier</text>
  <text x="565" y="133" fill="#c9d1d9" font-size="10">  factor extraction</text>
  <text x="565" y="153" fill="#3fb950" font-size="10">• 3D lattice: N^(1/3) bound</text>
  <text x="565" y="168" fill="#f0883e" font-size="10">• 2D lattice: N^(1/2) bound</text>
  <text x="565" y="183" fill="#c9d1d9" font-size="10">• 3D = 40% shorter vectors!</text>

  <!-- Formula box -->
  <rect x="20" y="75" width="230" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="135" y="98" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Lattice Definition</text>
  <text x="35" y="118" fill="#c9d1d9" font-size="11">L₃(N) = { (x,y,z) ∈ ℤ³ :</text>
  <text x="55" y="138" fill="#58a6ff" font-size="12" font-weight="bold">x² + y² + z² ≡ 0 (mod N) }</text>
  <text x="35" y="163" fill="#8b949e" font-size="10">Short vector → gcd(x²+y², N) = factor</text>
</svg>
