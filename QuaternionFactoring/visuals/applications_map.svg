<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141830"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bgA)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="bold">
    Applications of Quaternion Factoring
  </text>
  <text x="450" y="60" text-anchor="middle" fill="#8b949e" font-size="12">
    From ancient number theory to modern cryptography, coding, and quantum computing
  </text>

  <!-- Central node -->
  <circle cx="450" cy="300" r="65" fill="#1a1a4a" stroke="#6666cc" stroke-width="3" filter="url(#glow2)"/>
  <text x="450" y="290" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Quaternion</text>
  <text x="450" y="310" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Factoring</text>
  <text x="450" y="330" text-anchor="middle" fill="#aaaaff" font-size="10">N(q₁·q₂) = N(q₁)·N(q₂)</text>

  <!-- Application 1: RSA Analysis -->
  <line x1="395" y1="260" x2="170" y2="140" stroke="#f85149" stroke-width="2" opacity="0.6"/>
  <circle cx="140" cy="120" r="50" fill="#2a1010" stroke="#f85149" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" fill="#ff9999" font-size="12" font-weight="bold">RSA Key</text>
  <text x="140" y="128" text-anchor="middle" fill="#ff9999" font-size="12" font-weight="bold">Analysis</text>
  <text x="140" y="148" text-anchor="middle" fill="#ff6666" font-size="9">n/2 → n/3 bits</text>

  <!-- Application 2: Lattice Codes -->
  <line x1="510" y1="255" x2="730" y2="130" stroke="#3fb950" stroke-width="2" opacity="0.6"/>
  <circle cx="760" cy="120" r="50" fill="#102a10" stroke="#3fb950" stroke-width="2"/>
  <text x="760" y="110" text-anchor="middle" fill="#99ff99" font-size="12" font-weight="bold">Lattice</text>
  <text x="760" y="128" text-anchor="middle" fill="#99ff99" font-size="12" font-weight="bold">Codes</text>
  <text x="760" y="148" text-anchor="middle" fill="#66ff66" font-size="9">AWGN channels</text>

  <!-- Application 3: Quantum Gates -->
  <line x1="515" y1="290" x2="780" y2="300" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
  <circle cx="810" cy="300" r="50" fill="#101a2a" stroke="#58a6ff" stroke-width="2"/>
  <text x="810" y="290" text-anchor="middle" fill="#99ccff" font-size="12" font-weight="bold">Quantum</text>
  <text x="810" y="308" text-anchor="middle" fill="#99ccff" font-size="12" font-weight="bold">Gates</text>
  <text x="810" y="328" text-anchor="middle" fill="#6699ff" font-size="9">SU(2) synthesis</text>

  <!-- Application 4: Zero-Knowledge -->
  <line x1="505" y1="345" x2="730" y2="470" stroke="#bc8cff" stroke-width="2" opacity="0.6"/>
  <circle cx="760" cy="490" r="50" fill="#1a102a" stroke="#bc8cff" stroke-width="2"/>
  <text x="760" y="480" text-anchor="middle" fill="#ddbbff" font-size="12" font-weight="bold">Zero-</text>
  <text x="760" y="498" text-anchor="middle" fill="#ddbbff" font-size="12" font-weight="bold">Knowledge</text>
  <text x="760" y="518" text-anchor="middle" fill="#bb99ff" font-size="9">Post-quantum ZKP</text>

  <!-- Application 5: Signal Processing -->
  <line x1="395" y1="345" x2="170" y2="470" stroke="#f0883e" stroke-width="2" opacity="0.6"/>
  <circle cx="140" cy="490" r="50" fill="#2a1a0a" stroke="#f0883e" stroke-width="2"/>
  <text x="140" y="480" text-anchor="middle" fill="#ffcc88" font-size="12" font-weight="bold">Signal</text>
  <text x="140" y="498" text-anchor="middle" fill="#ffcc88" font-size="12" font-weight="bold">Processing</text>
  <text x="140" y="518" text-anchor="middle" fill="#ffaa44" font-size="9">Integer DSP</text>

  <!-- Application 6: 3-Square -->
  <line x1="385" y1="300" x2="100" y2="300" stroke="#f8e3a1" stroke-width="2" opacity="0.6"/>
  <circle cx="70" cy="300" r="50" fill="#2a2a0a" stroke="#f8e3a1" stroke-width="2"/>
  <text x="70" y="290" text-anchor="middle" fill="#fff5cc" font-size="12" font-weight="bold">Three-</text>
  <text x="70" y="308" text-anchor="middle" fill="#fff5cc" font-size="12" font-weight="bold">Square</text>
  <text x="70" y="328" text-anchor="middle" fill="#ffe088" font-size="9">n = a²+b²+c²</text>

  <!-- Connecting theory labels -->
  <text x="260" y="185" fill="#ff6666" font-size="9" transform="rotate(-30,260,185)">Lattice SVP</text>
  <text x="640" y="175" fill="#66ff66" font-size="9" transform="rotate(30,640,175)">Algebraic structure</text>
  <text x="690" y="290" fill="#6699ff" font-size="9">Solovay-Kitaev</text>
  <text x="640" y="420" fill="#bb99ff" font-size="9" transform="rotate(30,640,420)">Lattice hardness</text>
  <text x="260" y="420" fill="#ffaa44" font-size="9" transform="rotate(-30,260,420)">Modular energy</text>
  <text x="210" y="290" fill="#ffe088" font-size="9">Legendre</text>
</svg>
