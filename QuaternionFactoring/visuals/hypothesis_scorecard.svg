<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="750" height="520" fill="url(#bgh)"/>

  <text x="375" y="35" text-anchor="middle" fill="#E0E0E0" font-size="20" font-weight="bold">
    Hypothesis Scorecard
  </text>
  <text x="375" y="55" text-anchor="middle" fill="#90CAF9" font-size="12">
    Experimental validation of quaternion factoring hypotheses
  </text>

  <!-- Table header -->
  <rect x="30" y="75" width="690" height="35" rx="5" fill="#1a237e" opacity="0.8"/>
  <text x="55" y="97" fill="#E8EAF6" font-size="12" font-weight="bold">#</text>
  <text x="90" y="97" fill="#E8EAF6" font-size="12" font-weight="bold">Hypothesis</text>
  <text x="400" y="97" fill="#E8EAF6" font-size="12" font-weight="bold">Prediction</text>
  <text x="560" y="97" fill="#E8EAF6" font-size="12" font-weight="bold">Result</text>
  <text x="680" y="97" fill="#E8EAF6" font-size="12" font-weight="bold">Status</text>

  <!-- H1 -->
  <rect x="30" y="115" width="690" height="40" rx="3" fill="#1B5E20" opacity="0.3"/>
  <text x="55" y="140" fill="#A5D6A7" font-size="11">H1</text>
  <text x="90" y="140" fill="#C8E6C9" font-size="11">Structured basis shorter than random</text>
  <text x="400" y="140" fill="#E8F5E9" font-size="11">8× shorter</text>
  <text x="560" y="140" fill="#A5D6A7" font-size="11">8.8× shorter</text>
  <text x="680" y="140" fill="#4CAF50" font-size="14" font-weight="bold">✓</text>

  <!-- H2 -->
  <rect x="30" y="160" width="690" height="40" rx="3" fill="#1B5E20" opacity="0.3"/>
  <text x="55" y="185" fill="#A5D6A7" font-size="11">H2</text>
  <text x="90" y="185" fill="#C8E6C9" font-size="11">Scaling exponent α &lt; 0.5</text>
  <text x="400" y="185" fill="#E8F5E9" font-size="11">α &lt; 0.5</text>
  <text x="560" y="185" fill="#A5D6A7" font-size="11">α ≈ 0.175</text>
  <text x="680" y="185" fill="#4CAF50" font-size="14" font-weight="bold">✓</text>

  <!-- H3 -->
  <rect x="30" y="205" width="690" height="40" rx="3" fill="#E65100" opacity="0.2"/>
  <text x="55" y="230" fill="#FFAB91" font-size="11">H3</text>
  <text x="90" y="230" fill="#FFE0B2" font-size="11">1 mod 4 primes easier to factor</text>
  <text x="400" y="230" fill="#FFF3E0" font-size="11">Higher rate</text>
  <text x="560" y="230" fill="#FFE0B2" font-size="11">Inconclusive</text>
  <text x="680" y="230" fill="#FF9800" font-size="14" font-weight="bold">?</text>

  <!-- H4 -->
  <rect x="30" y="250" width="690" height="40" rx="3" fill="#1B5E20" opacity="0.3"/>
  <text x="55" y="275" fill="#A5D6A7" font-size="11">H4</text>
  <text x="90" y="275" fill="#C8E6C9" font-size="11">Dimensional hierarchy: d+1 beats d</text>
  <text x="400" y="275" fill="#E8F5E9" font-size="11">Strict decrease</text>
  <text x="560" y="275" fill="#A5D6A7" font-size="11">Proved in Lean 4</text>
  <text x="680" y="275" fill="#4CAF50" font-size="14" font-weight="bold">✓</text>

  <!-- H5 -->
  <rect x="30" y="295" width="690" height="40" rx="3" fill="#B71C1C" opacity="0.2"/>
  <text x="55" y="320" fill="#EF9A9A" font-size="11">H5</text>
  <text x="90" y="320" fill="#FFCDD2" font-size="11">Enhanced extraction &gt;80% success</text>
  <text x="400" y="320" fill="#FFEBEE" font-size="11">80%+ rate</text>
  <text x="560" y="320" fill="#EF9A9A" font-size="11">37.5% (+80% rel.)</text>
  <text x="680" y="320" fill="#F44336" font-size="14" font-weight="bold">✗</text>

  <!-- H6 -->
  <rect x="30" y="340" width="690" height="40" rx="3" fill="#1B5E20" opacity="0.3"/>
  <text x="55" y="365" fill="#A5D6A7" font-size="11">H6</text>
  <text x="90" y="365" fill="#C8E6C9" font-size="11">Exponent α stays below 0.3 at scale</text>
  <text x="400" y="365" fill="#E8F5E9" font-size="11">α &lt; 0.3</text>
  <text x="560" y="365" fill="#A5D6A7" font-size="11">α ≈ 0.297</text>
  <text x="680" y="365" fill="#4CAF50" font-size="14" font-weight="bold">✓</text>

  <!-- H7 -->
  <rect x="30" y="385" width="690" height="40" rx="3" fill="#1B5E20" opacity="0.3"/>
  <text x="55" y="410" fill="#A5D6A7" font-size="11">H7</text>
  <text x="90" y="410" fill="#C8E6C9" font-size="11">Optimal dimension exists (d* ≈ log log N)</text>
  <text x="400" y="410" fill="#E8F5E9" font-size="11">d* grows slowly</text>
  <text x="560" y="410" fill="#A5D6A7" font-size="11">d*=4 (small N)</text>
  <text x="680" y="410" fill="#4CAF50" font-size="14" font-weight="bold">✓</text>

  <!-- H8 -->
  <rect x="30" y="430" width="690" height="40" rx="3" fill="#B71C1C" opacity="0.2"/>
  <text x="55" y="455" fill="#EF9A9A" font-size="11">H8</text>
  <text x="90" y="455" fill="#FFCDD2" font-size="11">Coppersmith lattice comparable</text>
  <text x="400" y="455" fill="#FFEBEE" font-size="11">Comparable</text>
  <text x="560" y="455" fill="#EF9A9A" font-size="11">Underperforms</text>
  <text x="680" y="455" fill="#F44336" font-size="14" font-weight="bold">✗</text>

  <!-- Summary -->
  <rect x="30" y="480" width="690" height="30" rx="5" fill="#263238" opacity="0.8"/>
  <text x="375" y="500" text-anchor="middle" fill="#B0BEC5" font-size="12">
    Score: 5 supported ✓ · 1 inconclusive ? · 1 partial · 1 not supported ✗
  </text>
</svg>
