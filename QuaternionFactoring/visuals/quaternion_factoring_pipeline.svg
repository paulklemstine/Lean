<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9C27B0"/>
      <stop offset="100%" stop-color="#6A1B9A"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F44336"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64B5F6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#E0E0E0" font-size="22" font-weight="bold">
    Quaternion Factoring Pipeline
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#90CAF9" font-size="13">
    From Composite Integer N to Prime Factors via Quaternion Norm Decomposition
  </text>

  <!-- Step 1: Input N -->
  <rect x="30" y="90" width="150" height="90" rx="12" fill="url(#box1)" opacity="0.9" filter="url(#glow)"/>
  <text x="105" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="bold">① Input</text>
  <text x="105" y="138" text-anchor="middle" fill="#E3F2FD" font-size="11">Composite N = p·q</text>
  <text x="105" y="158" text-anchor="middle" fill="#BBDEFB" font-size="10">e.g. N = 143 = 11×13</text>

  <!-- Arrow 1→2 -->
  <line x1="180" y1="135" x2="210" y2="135" stroke="#64B5F6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Four-square decomposition -->
  <rect x="215" y="90" width="150" height="90" rx="12" fill="url(#box2)" opacity="0.9" filter="url(#glow)"/>
  <text x="290" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="bold">② Decompose</text>
  <text x="290" y="138" text-anchor="middle" fill="#E8F5E9" font-size="11">N = a²+b²+c²+d²</text>
  <text x="290" y="158" text-anchor="middle" fill="#C8E6C9" font-size="10">Lagrange's theorem</text>

  <!-- Arrow 2→3 -->
  <line x1="365" y1="135" x2="395" y2="135" stroke="#64B5F6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Build Lattice -->
  <rect x="400" y="90" width="150" height="90" rx="12" fill="url(#box3)" opacity="0.9" filter="url(#glow)"/>
  <text x="475" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="bold">③ Build Lattice</text>
  <text x="475" y="138" text-anchor="middle" fill="#FFF3E0" font-size="11">L₄(N) = {v : Σv²≡0}</text>
  <text x="475" y="158" text-anchor="middle" fill="#FFE0B2" font-size="10">3D or 4D lattice</text>

  <!-- Arrow 3→4 -->
  <line x1="550" y1="135" x2="580" y2="135" stroke="#64B5F6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: LLL/BKZ Reduction -->
  <rect x="585" y="90" width="150" height="90" rx="12" fill="url(#box4)" opacity="0.9" filter="url(#glow)"/>
  <text x="660" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="bold">④ Reduce</text>
  <text x="660" y="138" text-anchor="middle" fill="#F3E5F5" font-size="11">LLL / BKZ algorithm</text>
  <text x="660" y="158" text-anchor="middle" fill="#E1BEE7" font-size="10">Find short vectors</text>

  <!-- Arrow 4→5 -->
  <line x1="735" y1="135" x2="755" y2="135" stroke="#64B5F6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Extract Factor -->
  <rect x="760" y="90" width="120" height="90" rx="12" fill="url(#box5)" opacity="0.9" filter="url(#glow)"/>
  <text x="820" y="118" text-anchor="middle" fill="white" font-size="13" font-weight="bold">⑤ Extract</text>
  <text x="820" y="138" text-anchor="middle" fill="#FFEBEE" font-size="11">gcd(v²+w², N)</text>
  <text x="820" y="158" text-anchor="middle" fill="#FFCDD2" font-size="10">→ factor!</text>

  <!-- Quaternion Connection (center panel) -->
  <rect x="150" y="220" width="600" height="120" rx="15" fill="none" stroke="#FFD54F" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="248" text-anchor="middle" fill="#FFD54F" font-size="16" font-weight="bold">
    The Quaternion Connection
  </text>
  <text x="450" y="275" text-anchor="middle" fill="#FFF9C4" font-size="12">
    Factoring N = p·q ⟺ Decomposing quaternion q of norm N into q = q_p · q_q
  </text>
  <text x="450" y="300" text-anchor="middle" fill="#FFF59D" font-size="12">
    N(q₁ · q₂) = N(q₁) · N(q₂)  — Euler's Four-Square Identity
  </text>
  <text x="450" y="322" text-anchor="middle" fill="#FFF176" font-size="11">
    (a₁²+b₁²+c₁²+d₁²)(a₂²+b₂²+c₂²+d₂²) = (a₁a₂-b₁b₂-c₁c₂-d₁d₂)² + ⋯
  </text>

  <!-- Key Results (bottom) -->
  <rect x="30" y="370" width="260" height="110" rx="10" fill="#1B5E20" opacity="0.7"/>
  <text x="160" y="395" text-anchor="middle" fill="#A5D6A7" font-size="14" font-weight="bold">Key Results</text>
  <text x="45" y="418" fill="#C8E6C9" font-size="11">• Scaling exponent α ≈ 0.30 (&lt; 0.5)</text>
  <text x="45" y="438" fill="#C8E6C9" font-size="11">• Optimal dimension d* = 4</text>
  <text x="45" y="458" fill="#C8E6C9" font-size="11">• Enhanced extraction: +80% improvement</text>

  <rect x="320" y="370" width="260" height="110" rx="10" fill="#4A148C" opacity="0.7"/>
  <text x="450" y="395" text-anchor="middle" fill="#CE93D8" font-size="14" font-weight="bold">The Pell Obstacle</text>
  <text x="335" y="418" fill="#E1BEE7" font-size="11">λ² - μ² = 1 ⟹ μ = 0</text>
  <text x="335" y="438" fill="#E1BEE7" font-size="11">No direct Berggren generalization</text>
  <text x="335" y="458" fill="#E1BEE7" font-size="11">Workaround: SL(2,ℤ) on params</text>

  <rect x="610" y="370" width="260" height="110" rx="10" fill="#B71C1C" opacity="0.7"/>
  <text x="740" y="395" text-anchor="middle" fill="#EF9A9A" font-size="14" font-weight="bold">Applications</text>
  <text x="625" y="418" fill="#FFCDD2" font-size="11">• RSA key strength analysis</text>
  <text x="625" y="438" fill="#FFCDD2" font-size="11">• Lattice error-correcting codes</text>
  <text x="625" y="458" fill="#FFCDD2" font-size="11">• Zero-knowledge proofs</text>
</svg>
