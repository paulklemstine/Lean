<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1622"/>
      <stop offset="100%" stop-color="#0f2030"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">
    Dimensional Hierarchy: Minkowski Bounds N^(1/d)
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#8b949e" font-size="12">
    Higher dimension → shorter vectors → easier factoring (formalized in Lean 4)
  </text>

  <!-- Chart area -->
  <g transform="translate(100, 80)">
    <!-- Axes -->
    <line x1="0" y1="340" x2="600" y2="340" stroke="#30363d" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="340" stroke="#30363d" stroke-width="2"/>

    <!-- Y axis label -->
    <text x="-60" y="170" fill="#8b949e" font-size="12" transform="rotate(-90, -60, 170)">
      Minkowski Bound (log scale)
    </text>

    <!-- X axis label -->
    <text x="300" y="380" text-anchor="middle" fill="#8b949e" font-size="12">
      N (bits)
    </text>

    <!-- X axis ticks -->
    <text x="0" y="360" text-anchor="middle" fill="#8b949e" font-size="10">8</text>
    <text x="100" y="360" text-anchor="middle" fill="#8b949e" font-size="10">16</text>
    <text x="200" y="360" text-anchor="middle" fill="#8b949e" font-size="10">32</text>
    <text x="300" y="360" text-anchor="middle" fill="#8b949e" font-size="10">64</text>
    <text x="400" y="360" text-anchor="middle" fill="#8b949e" font-size="10">128</text>
    <text x="500" y="360" text-anchor="middle" fill="#8b949e" font-size="10">256</text>
    <text x="600" y="360" text-anchor="middle" fill="#8b949e" font-size="10">512</text>

    <!-- Y axis ticks (log scale: 2^k) -->
    <text x="-10" y="340" text-anchor="end" fill="#8b949e" font-size="10">2⁰</text>
    <text x="-10" y="280" text-anchor="end" fill="#8b949e" font-size="10">2¹⁶</text>
    <text x="-10" y="220" text-anchor="end" fill="#8b949e" font-size="10">2³²</text>
    <text x="-10" y="160" text-anchor="end" fill="#8b949e" font-size="10">2⁶⁴</text>
    <text x="-10" y="100" text-anchor="end" fill="#8b949e" font-size="10">2⁹⁶</text>
    <text x="-10" y="40" text-anchor="end" fill="#8b949e" font-size="10">2¹²⁸</text>

    <!-- Grid lines -->
    <line x1="0" y1="280" x2="600" y2="280" stroke="#21262d" stroke-dasharray="3,3"/>
    <line x1="0" y1="220" x2="600" y2="220" stroke="#21262d" stroke-dasharray="3,3"/>
    <line x1="0" y1="160" x2="600" y2="160" stroke="#21262d" stroke-dasharray="3,3"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="#21262d" stroke-dasharray="3,3"/>
    <line x1="0" y1="40" x2="600" y2="40" stroke="#21262d" stroke-dasharray="3,3"/>

    <!-- d=2 line (N^(1/2)): slope = bits/2, scaled -->
    <!-- At bits=b, bound = 2^(b/2). Y = 340 - (b/2) * (340/128) = 340 - b * 1.328 -->
    <polyline points="0,329 100,319 200,298 300,255 400,170 500,0" 
              fill="none" stroke="#f85149" stroke-width="2.5" opacity="0.9"/>
    <text x="510" y="5" fill="#f85149" font-size="12" font-weight="bold">d = 2</text>
    <text x="510" y="20" fill="#f85149" font-size="10">N^(1/2)</text>

    <!-- d=3 line (N^(1/3)): bound = 2^(b/3). Y = 340 - (b/3) * 2.656 -->
    <polyline points="0,333 100,326 200,312 300,283 400,227 500,113" 
              fill="none" stroke="#f0883e" stroke-width="2.5" opacity="0.9"/>
    <text x="510" y="118" fill="#f0883e" font-size="12" font-weight="bold">d = 3</text>
    <text x="510" y="133" fill="#f0883e" font-size="10">N^(1/3)</text>

    <!-- d=4 line (N^(1/4)): bound = 2^(b/4). Y = 340 - (b/4) * 2.656 -->
    <polyline points="0,335 100,330 200,319 300,298 400,255 500,170" 
              fill="none" stroke="#3fb950" stroke-width="2.5" opacity="0.9"/>
    <text x="510" y="175" fill="#3fb950" font-size="12" font-weight="bold">d = 4</text>
    <text x="510" y="190" fill="#3fb950" font-size="10">N^(1/4)</text>

    <!-- d=6 line -->
    <polyline points="0,337 100,333 200,325 300,310 400,280 500,220" 
              fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.7" stroke-dasharray="6,3"/>
    <text x="510" y="225" fill="#58a6ff" font-size="12">d = 6</text>

    <!-- d=8 line -->
    <polyline points="0,338 100,335 200,329 300,319 400,298 500,255" 
              fill="none" stroke="#bc8cff" stroke-width="2" opacity="0.7" stroke-dasharray="6,3"/>
    <text x="510" y="260" fill="#bc8cff" font-size="12">d = 8</text>

    <!-- Highlight: gap at 256 bits -->
    <line x1="500" y1="0" x2="500" y2="340" stroke="#30363d" stroke-dasharray="2,4"/>
    <line x1="500" y1="0" x2="500" y2="170" stroke="#f8e3a1" stroke-width="2" opacity="0.3"/>
    <text x="505" y="85" fill="#f8e3a1" font-size="9">← Gap = 2⁶⁴</text>
    <text x="505" y="97" fill="#f8e3a1" font-size="9">   at 256 bits</text>
  </g>

  <!-- Theorem box -->
  <rect x="30" y="440" width="740" height="45" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="400" y="468" text-anchor="middle" fill="#c9d1d9" font-size="13">
    <tspan fill="#3fb950" font-weight="bold">Lean 4 Theorem:</tspan>
    ∀ N ≥ 2, d₁ &lt; d₂ → N^(1/d₂) ≤ N^(1/d₁)  — each dimension strictly improves the bound
  </text>
</svg>
