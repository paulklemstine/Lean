<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#E0E0E0" font-size="20" font-weight="bold">
    Dimensional Scaling: Shortest Vector vs N
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#90CAF9" font-size="12">
    Minkowski bound: ||v_min|| ~ N^(1/d) — each dimension adds a shortcut
  </text>

  <!-- Axes -->
  <line x1="100" y1="420" x2="720" y2="420" stroke="#546E7A" stroke-width="2"/>
  <line x1="100" y1="420" x2="100" y2="80" stroke="#546E7A" stroke-width="2"/>
  <text x="410" y="465" text-anchor="middle" fill="#90A4AE" font-size="14">log₂(N)</text>
  <text x="45" y="250" text-anchor="middle" fill="#90A4AE" font-size="14" transform="rotate(-90 45 250)">log₂(||v_min||)</text>

  <!-- Grid lines -->
  <g stroke="#263238" stroke-width="0.5">
    <line x1="100" y1="150" x2="720" y2="150"/>
    <line x1="100" y1="220" x2="720" y2="220"/>
    <line x1="100" y1="290" x2="720" y2="290"/>
    <line x1="100" y1="350" x2="720" y2="350"/>
    <line x1="200" y1="80" x2="200" y2="420"/>
    <line x1="350" y1="80" x2="350" y2="420"/>
    <line x1="500" y1="80" x2="500" y2="420"/>
    <line x1="650" y1="80" x2="650" y2="420"/>
  </g>

  <!-- Axis labels -->
  <text x="100" y="440" text-anchor="middle" fill="#78909C" font-size="10">4</text>
  <text x="200" y="440" text-anchor="middle" fill="#78909C" font-size="10">8</text>
  <text x="350" y="440" text-anchor="middle" fill="#78909C" font-size="10">12</text>
  <text x="500" y="440" text-anchor="middle" fill="#78909C" font-size="10">16</text>
  <text x="650" y="440" text-anchor="middle" fill="#78909C" font-size="10">20</text>
  <text x="85" y="420" text-anchor="end" fill="#78909C" font-size="10">0</text>
  <text x="85" y="350" text-anchor="end" fill="#78909C" font-size="10">2</text>
  <text x="85" y="290" text-anchor="end" fill="#78909C" font-size="10">4</text>
  <text x="85" y="220" text-anchor="end" fill="#78909C" font-size="10">6</text>
  <text x="85" y="150" text-anchor="end" fill="#78909C" font-size="10">8</text>
  <text x="85" y="80" text-anchor="end" fill="#78909C" font-size="10">10</text>

  <!-- d=2 curve: N^(1/2) — slope 0.5 -->
  <polyline points="100,420 200,385 350,340 500,295 650,250" fill="none" stroke="#F44336" stroke-width="3" opacity="0.8"/>
  <text x="665" y="245" fill="#F44336" font-size="12" font-weight="bold">d=2: N^(1/2)</text>

  <!-- d=3 curve: N^(1/3) — slope 0.333 -->
  <polyline points="100,420 200,397 350,366 500,335 650,304" fill="none" stroke="#4CAF50" stroke-width="3" opacity="0.8"/>
  <text x="665" y="300" fill="#4CAF50" font-size="12" font-weight="bold">d=3: N^(1/3)</text>

  <!-- d=4 curve: N^(1/4) — slope 0.25 -->
  <polyline points="100,420 200,402 350,380 500,355 650,332" fill="none" stroke="#2196F3" stroke-width="3" opacity="0.8"/>
  <text x="665" y="328" fill="#2196F3" font-size="12" font-weight="bold">d=4: N^(1/4)</text>

  <!-- Experimental data points (d=3) -->
  <circle cx="200" cy="400" r="4" fill="#81C784"/>
  <circle cx="280" cy="378" r="4" fill="#81C784"/>
  <circle cx="350" cy="360" r="4" fill="#81C784"/>
  <circle cx="420" cy="348" r="4" fill="#81C784"/>
  <circle cx="500" cy="330" r="4" fill="#81C784"/>
  <circle cx="570" cy="318" r="4" fill="#81C784"/>
  <text x="580" y="312" fill="#81C784" font-size="10">measured (d=3)</text>

  <!-- Experimental data points (d=4) -->
  <circle cx="200" cy="408" r="4" fill="#64B5F6"/>
  <circle cx="280" cy="392" r="4" fill="#64B5F6"/>
  <circle cx="350" cy="378" r="4" fill="#64B5F6"/>
  <circle cx="420" cy="365" r="4" fill="#64B5F6"/>
  <circle cx="500" cy="352" r="4" fill="#64B5F6"/>

  <!-- Annotation: the gap -->
  <line x1="650" y1="250" x2="650" y2="304" stroke="#FFD54F" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="730" y="280" fill="#FFD54F" font-size="11" text-anchor="middle">dimensional</text>
  <text x="730" y="294" fill="#FFD54F" font-size="11" text-anchor="middle">advantage</text>

  <!-- Legend box -->
  <rect x="120" y="90" width="220" height="80" rx="8" fill="#0D1117" opacity="0.8" stroke="#37474F"/>
  <text x="135" y="112" fill="#E0E0E0" font-size="12" font-weight="bold">Minkowski Bounds</text>
  <line x1="135" y1="128" x2="165" y2="128" stroke="#F44336" stroke-width="2"/>
  <text x="175" y="132" fill="#EF9A9A" font-size="11">d=2: ||v|| ~ N^0.50 (trial div.)</text>
  <line x1="135" y1="148" x2="165" y2="148" stroke="#4CAF50" stroke-width="2"/>
  <text x="175" y="152" fill="#A5D6A7" font-size="11">d=3: ||v|| ~ N^0.33 (quadruples)</text>
  <line x1="135" y1="168" x2="165" y2="168" stroke="#2196F3" stroke-width="2"/>
  <text x="175" y="172" fill="#90CAF9" font-size="11">d=4: ||v|| ~ N^0.25 (quaternions)</text>
</svg>
