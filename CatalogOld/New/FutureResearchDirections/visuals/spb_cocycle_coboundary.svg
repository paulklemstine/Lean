<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#1a1030"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFD700"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4FC3F7"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bgc)"/>

  <text x="400" y="35" text-anchor="middle" fill="#FFD700" font-size="20" font-weight="bold">
    The SPB Cocycle is a Coboundary (Theorem H10)
  </text>

  <!-- The commutative diagram -->
  <!-- Top: (ℝ, spb) × (ℝ, spb) -->
  <g transform="translate(200, 120)">
    <rect x="-80" y="-25" width="160" height="50" rx="8" fill="none" stroke="#FFD700" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#FFD700" font-size="14">(ℝ, spb) × (ℝ, spb)</text>
  </g>

  <!-- Top right: (ℝ, spb) -->
  <g transform="translate(600, 120)">
    <rect x="-60" y="-25" width="120" height="50" rx="8" fill="none" stroke="#FFD700" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#FFD700" font-size="14">(ℝ, spb)</text>
  </g>

  <!-- Arrow: spb operation -->
  <line x1="280" y1="120" x2="530" y2="120" stroke="#FFD700" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="110" text-anchor="middle" fill="#FFD700" font-size="12">spb(x, y)</text>

  <!-- Bottom: (S¹, ·) × (S¹, ·) -->
  <g transform="translate(200, 280)">
    <rect x="-80" y="-25" width="160" height="50" rx="8" fill="none" stroke="#4FC3F7" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#4FC3F7" font-size="14">(S¹, ·) × (S¹, ·)</text>
  </g>

  <!-- Bottom right: (S¹, ·) -->
  <g transform="translate(600, 280)">
    <rect x="-60" y="-25" width="120" height="50" rx="8" fill="none" stroke="#4FC3F7" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#4FC3F7" font-size="14">(S¹, ·)</text>
  </g>

  <!-- Arrow: multiplication on S¹ -->
  <line x1="280" y1="280" x2="530" y2="280" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="405" y="270" text-anchor="middle" fill="#4FC3F7" font-size="12">w₁ · w₂</text>

  <!-- Vertical arrows: Cayley transform -->
  <line x1="200" y1="150" x2="200" y2="245" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="170" y="200" text-anchor="end" fill="#aaa" font-size="11">C' × C'</text>

  <line x1="600" y1="150" x2="600" y2="245" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="630" y="200" fill="#aaa" font-size="11">C'</text>

  <!-- The key formulas -->
  <g transform="translate(400, 380)">
    <rect x="-350" y="-50" width="700" height="100" rx="10" fill="rgba(255,215,0,0.05)" stroke="#555" stroke-width="1"/>

    <text x="0" y="-25" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">The Coboundary Identity</text>
    <text x="0" y="0" text-anchor="middle" fill="#fff" font-size="13">
      (1 − xy)² · (1 + spb(x,y)²) = (1 + x²)(1 + y²)
    </text>
    <text x="0" y="25" text-anchor="middle" fill="#aaa" font-size="11">
      Equivalently: c(x,y) = f(spb(x,y)) / (f(x) · f(y))  where  f(x) = 1 + x²
    </text>
    <text x="0" y="45" text-anchor="middle" fill="#4CAF50" font-size="11" font-weight="bold">
      ✓ Machine-verified in Lean 4 (theorem cocycle_is_coboundary)
    </text>
  </g>
</svg>
