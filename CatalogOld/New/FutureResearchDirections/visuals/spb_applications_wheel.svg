<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a0a3e"/>
    </linearGradient>
    <filter id="gw"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgw)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold" filter="url(#gw)">
    SPB Applications Wheel
  </text>
  <text x="400" y="62" text-anchor="middle" fill="#aaa" font-size="12" font-style="italic">
    One formula, ten domains
  </text>

  <!-- Center: SPB formula -->
  <circle cx="400" cy="400" r="80" fill="none" stroke="#FFD700" stroke-width="3" filter="url(#gw)"/>
  <text x="400" y="390" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">SPB</text>
  <text x="400" y="412" text-anchor="middle" fill="#FFD700" font-size="12">(x+y)/(1−xy)</text>

  <!-- Application nodes arranged in a wheel -->
  <!-- Using 10 nodes at 36° intervals starting from top -->

  <!-- Node 1: Trigonometry (0°, top) -->
  <g transform="translate(400, 160)">
    <circle r="55" fill="rgba(76,175,80,0.15)" stroke="#4CAF50" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#4CAF50" font-size="11" font-weight="bold">Trigonometry</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">tan(α+β)</text>
    <text y="22" text-anchor="middle" fill="#4CAF50" font-size="8">✓ Verified</text>
  </g>
  <line x1="400" y1="220" x2="400" y2="320" stroke="#4CAF50" stroke-width="1.5" opacity="0.4"/>

  <!-- Node 2: Relativity (36°) -->
  <g transform="translate(541, 213)">
    <circle r="55" fill="rgba(33,150,243,0.15)" stroke="#2196F3" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#2196F3" font-size="11" font-weight="bold">Relativity</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">v₁ ⊕ v₂</text>
    <text y="22" text-anchor="middle" fill="#4CAF50" font-size="8">✓ Verified</text>
  </g>
  <line x1="495" y1="255" x2="450" y2="355" stroke="#2196F3" stroke-width="1.5" opacity="0.4"/>

  <!-- Node 3: Quantum (72°) -->
  <g transform="translate(628, 340)">
    <circle r="55" fill="rgba(156,39,176,0.15)" stroke="#9C27B0" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#9C27B0" font-size="11" font-weight="bold">Quantum</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">Bloch sphere</text>
    <text y="22" text-anchor="middle" fill="#4CAF50" font-size="8">✓ Verified</text>
  </g>
  <line x1="575" y1="365" x2="480" y2="395" stroke="#9C27B0" stroke-width="1.5" opacity="0.4"/>

  <!-- Node 4: Cryptography (108°) -->
  <g transform="translate(628, 480)">
    <circle r="55" fill="rgba(244,67,54,0.15)" stroke="#F44336" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#F44336" font-size="11" font-weight="bold">Cryptography</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">SPB(𝔽ₚ) DH</text>
    <text y="22" text-anchor="middle" fill="#FF9800" font-size="8">◐ p±1 verified</text>
  </g>
  <line x1="575" y1="460" x2="480" y2="420" stroke="#F44336" stroke-width="1.5" opacity="0.4"/>

  <!-- Node 5: CORDIC (144°) -->
  <g transform="translate(541, 600)">
    <circle r="55" fill="rgba(0,188,212,0.15)" stroke="#00BCD4" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#00BCD4" font-size="11" font-weight="bold">Hardware</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">SPB-CORDIC</text>
    <text y="22" text-anchor="middle" fill="#4CAF50" font-size="8">✓ 25% fewer ops</text>
  </g>
  <line x1="495" y1="560" x2="450" y2="450" stroke="#00BCD4" stroke-width="1.5" opacity="0.4"/>

  <!-- Node 6: Statistics (180°, bottom) -->
  <g transform="translate(400, 650)">
    <circle r="55" fill="rgba(255,152,0,0.15)" stroke="#FF9800" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#FF9800" font-size="11" font-weight="bold">Statistics</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">Cauchy invariance</text>
    <text y="22" text-anchor="middle" fill="#4CAF50" font-size="8">✓ Confirmed</text>
  </g>
  <line x1="400" y1="595" x2="400" y2="480" stroke="#FF9800" stroke-width="1.5" opacity="0.4"/>

  <!-- Node 7: Robotics (216°) -->
  <g transform="translate(259, 600)">
    <circle r="55" fill="rgba(121,85,72,0.15)" stroke="#795548" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#795548" font-size="11" font-weight="bold">Robotics</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">SPB Kalman</text>
    <text y="22" text-anchor="middle" fill="#FF9800" font-size="8">◐ Prototype</text>
  </g>
  <line x1="305" y1="560" x2="350" y2="450" stroke="#795548" stroke-width="1.5" opacity="0.4"/>

  <!-- Node 8: 3D Graphics (252°) -->
  <g transform="translate(172, 480)">
    <circle r="55" fill="rgba(233,30,99,0.15)" stroke="#E91E63" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#E91E63" font-size="11" font-weight="bold">3D Graphics</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">Quaternion SPB</text>
    <text y="22" text-anchor="middle" fill="#4CAF50" font-size="8">✓ Confirmed</text>
  </g>
  <line x1="225" y1="460" x2="320" y2="420" stroke="#E91E63" stroke-width="1.5" opacity="0.4"/>

  <!-- Node 9: Signal Processing (288°) -->
  <g transform="translate(172, 340)">
    <circle r="55" fill="rgba(63,81,181,0.15)" stroke="#3F51B5" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#3F51B5" font-size="11" font-weight="bold">Signals</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">All-pass filters</text>
    <text y="22" text-anchor="middle" fill="#2196F3" font-size="8">○ Open</text>
  </g>
  <line x1="225" y1="365" x2="320" y2="395" stroke="#3F51B5" stroke-width="1.5" opacity="0.4"/>

  <!-- Node 10: Neural Networks (324°) -->
  <g transform="translate(259, 213)">
    <circle r="55" fill="rgba(76,175,80,0.15)" stroke="#8BC34A" stroke-width="2"/>
    <text y="-10" text-anchor="middle" fill="#8BC34A" font-size="11" font-weight="bold">Neural Nets</text>
    <text y="8" text-anchor="middle" fill="#aaa" font-size="9">SPB neurons</text>
    <text y="22" text-anchor="middle" fill="#2196F3" font-size="8">○ H1 open</text>
  </g>
  <line x1="305" y1="255" x2="350" y2="355" stroke="#8BC34A" stroke-width="1.5" opacity="0.4"/>

  <!-- Legend -->
  <g transform="translate(100, 760)">
    <circle cx="0" cy="0" r="5" fill="#4CAF50"/>
    <text x="12" y="4" fill="#888" font-size="10">✓ Verified</text>
    <circle cx="130" cy="0" r="5" fill="#FF9800"/>
    <text x="142" y="4" fill="#888" font-size="10">◐ Partial</text>
    <circle cx="250" cy="0" r="5" fill="#2196F3"/>
    <text x="262" y="4" fill="#888" font-size="10">○ Open</text>
  </g>

  <text x="400" y="785" text-anchor="middle" fill="#555" font-size="9">
    Machine-verified in Lean 4 • April 2026
  </text>
</svg>
