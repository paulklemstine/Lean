<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <radialGradient id="well" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff4444;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="landscape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5276"/>
      <stop offset="30%" style="stop-color:#2e86c1"/>
      <stop offset="50%" style="stop-color:#f39c12"/>
      <stop offset="70%" style="stop-color:#2e86c1"/>
      <stop offset="100%" style="stop-color:#1a5276"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#f0f0f0" font-size="22" font-weight="bold">
    Factoring Energy Landscape E(x, d, N)
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#888" font-size="12">
    The "gravitational well" at factor-revealing configurations
  </text>

  <!-- Axes -->
  <line x1="80" y1="480" x2="720" y2="480" stroke="#555" stroke-width="2"/>
  <line x1="80" y1="480" x2="80" y2="100" stroke="#555" stroke-width="2"/>
  <text x="400" y="510" text-anchor="middle" fill="#aaa" font-size="13">Leg value x (mod N)</text>
  <text x="35" y="290" text-anchor="middle" fill="#aaa" font-size="13" transform="rotate(-90, 35, 290)">
    Factoring Energy E(x)
  </text>

  <!-- Energy landscape curve (stylized) -->
  <path d="M 80,350 Q 120,360 160,340 Q 200,320 220,200 Q 230,140 240,200 Q 260,320 300,350
           Q 340,360 380,340 Q 420,300 440,180 Q 450,120 460,180 Q 480,300 520,350
           Q 560,360 600,350 Q 640,320 660,220 Q 665,160 670,220 Q 690,320 720,350"
        fill="none" stroke="#4a9eff" stroke-width="3" stroke-linejoin="round"/>

  <!-- Fill under curve -->
  <path d="M 80,350 Q 120,360 160,340 Q 200,320 220,200 Q 230,140 240,200 Q 260,320 300,350
           Q 340,360 380,340 Q 420,300 440,180 Q 450,120 460,180 Q 480,300 520,350
           Q 560,360 600,350 Q 640,320 660,220 Q 665,160 670,220 Q 690,320 720,350
           L 720,480 L 80,480 Z"
        fill="#4a9eff" opacity="0.1"/>

  <!-- Gravitational wells (factor locations) -->
  <!-- Well at x ≡ 0 mod p -->
  <circle cx="240" cy="140" r="25" fill="url(#well)" opacity="0.6"/>
  <circle cx="240" cy="140" r="4" fill="#ff6666"/>
  <text x="240" y="115" text-anchor="middle" fill="#ff8888" font-size="11" font-weight="bold">x ≡ 0 (mod p)</text>

  <!-- Well at x ≡ 0 mod q -->
  <circle cx="450" cy="120" r="30" fill="url(#well)" opacity="0.6"/>
  <circle cx="450" cy="120" r="4" fill="#ff6666"/>
  <text x="450" y="95" text-anchor="middle" fill="#ff8888" font-size="11" font-weight="bold">x ≡ 0 (mod q)</text>

  <!-- Well at x ≡ 0 mod N -->
  <circle cx="665" cy="160" r="20" fill="url(#well)" opacity="0.4"/>
  <circle cx="665" cy="160" r="3" fill="#ff6666"/>
  <text x="665" y="140" text-anchor="middle" fill="#ff8888" font-size="10">x ≡ 0 (mod N)</text>

  <!-- Baseline (no factor) -->
  <line x1="80" y1="355" x2="720" y2="355" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="730" y="358" fill="#666" font-size="10">E = 0 (trivial)</text>

  <!-- Factor threshold -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#4a4" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="730" y="253" fill="#6a6" font-size="10">Factor threshold</text>

  <!-- Descent paths (arrows showing gradient descent) -->
  <g stroke="#ffaa00" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)">
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#ffaa00"/>
      </marker>
    </defs>
    <!-- Descent toward p-well -->
    <path d="M 180,340 Q 200,300 225,200"/>
    <path d="M 290,340 Q 270,300 255,200"/>
    <!-- Descent toward q-well -->
    <path d="M 390,340 Q 410,300 435,190"/>
    <path d="M 510,340 Q 490,300 465,190"/>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 530)">
    <rect x="0" y="0" width="600" height="50" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
    <circle cx="30" cy="25" r="6" fill="#ff6666"/>
    <text x="45" y="29" fill="#ccc" font-size="11">Factor-revealing minimum (gravitational well)</text>
    <line x1="250" y1="25" x2="280" y2="25" stroke="#ffaa00" stroke-width="2"/>
    <text x="290" y="29" fill="#ccc" font-size="11">Gradient descent path</text>
    <line x1="460" y1="25" x2="490" y2="25" stroke="#4a9eff" stroke-width="2"/>
    <text x="500" y="29" fill="#ccc" font-size="11">Energy E(x)</text>
  </g>

  <!-- N label -->
  <text x="400" y="470" text-anchor="middle" fill="#666" font-size="11">
    N = p × q (semiprime)  •  Wells at multiples of p and q
  </text>
</svg>
