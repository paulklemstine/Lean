<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d2b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <text x="400" y="35" fill="#ffffff" font-family="Georgia" font-size="22" text-anchor="middle" font-weight="bold">Sub-Binary Recurrence Growth</text>
  <text x="400" y="55" fill="#88aacc" font-family="Georgia" font-size="13" text-anchor="middle">All sequences grow slower than 2ⁿ — provable search space reduction</text>
  
  <!-- Axes -->
  <line x1="80" y1="400" x2="700" y2="400" stroke="#446688" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="60" stroke="#446688" stroke-width="2"/>
  <text x="390" y="440" fill="#aaccee" font-family="monospace" font-size="13" text-anchor="middle">n</text>
  <text x="30" y="230" fill="#aaccee" font-family="monospace" font-size="13" text-anchor="middle" transform="rotate(-90,30,230)">log₂(value)</text>
  
  <!-- Grid -->
  <g stroke="#223344" stroke-width="0.5" stroke-dasharray="4,4">
    <line x1="80" y1="60" x2="700" y2="60"/>
    <line x1="80" y1="145" x2="700" y2="145"/>
    <line x1="80" y1="230" x2="700" y2="230"/>
    <line x1="80" y1="315" x2="700" y2="315"/>
  </g>
  
  <!-- Tick labels -->
  <text x="80" y="420" fill="#88aacc" font-family="monospace" font-size="10" text-anchor="middle">0</text>
  <text x="194" y="420" fill="#88aacc" font-family="monospace" font-size="10" text-anchor="middle">5</text>
  <text x="308" y="420" fill="#88aacc" font-family="monospace" font-size="10" text-anchor="middle">10</text>
  <text x="422" y="420" fill="#88aacc" font-family="monospace" font-size="10" text-anchor="middle">15</text>
  <text x="536" y="420" fill="#88aacc" font-family="monospace" font-size="10" text-anchor="middle">20</text>
  <text x="650" y="420" fill="#88aacc" font-family="monospace" font-size="10" text-anchor="middle">25</text>
  
  <text x="70" y="404" fill="#88aacc" font-family="monospace" font-size="10" text-anchor="end">0</text>
  <text x="70" y="64" fill="#88aacc" font-family="monospace" font-size="10" text-anchor="end">20</text>
  <text x="70" y="234" fill="#88aacc" font-family="monospace" font-size="10" text-anchor="end">10</text>
  
  <!-- 2^n reference line (red, dashed) -->
  <line x1="80" y1="400" x2="650" y2="60" stroke="#ff4444" stroke-width="2" stroke-dasharray="8,4" opacity="0.8"/>
  <text x="660" y="55" fill="#ff4444" font-family="monospace" font-size="12">2ⁿ</text>
  
  <!-- Fibonacci: log₂(fib(n+2)) ≈ n·log₂(φ) ≈ 0.694n for large n -->
  <polyline points="80,400 103,394 126,383 149,372 172,360 194,347 217,334 240,321 263,307 286,293 308,279 331,265 354,251 377,237 400,222 422,208 445,194 468,180 491,165 514,151 536,137"
    stroke="#00ff88" stroke-width="2.5" fill="none" filter="url(#glow2)"/>
  <text x="545" y="132" fill="#00ff88" font-family="monospace" font-size="11">Fibonacci (φ ≈ 1.618)</text>
  
  <!-- Lucas: same growth rate as Fibonacci -->
  <polyline points="80,383 103,383 126,374 149,363 172,351 194,338 217,325 240,312 263,298 286,284 308,270 331,256 354,242 377,228 400,213 422,199 445,185 468,171 491,156 514,142 536,128"
    stroke="#44aaff" stroke-width="2.5" fill="none" filter="url(#glow2)"/>
  <text x="545" y="123" fill="#44aaff" font-family="monospace" font-size="11">Lucas (φ ≈ 1.618)</text>
  
  <!-- Tribonacci: log₂ ≈ 0.879n -->
  <polyline points="80,400 103,400 126,400 149,394 172,383 194,371 217,358 240,346 263,333 286,320 308,307 331,293 354,280 377,266 400,253 422,239 445,225 468,211 491,198 514,184 536,170"
    stroke="#ffaa33" stroke-width="2.5" fill="none" filter="url(#glow2)"/>
  <text x="545" y="165" fill="#ffaa33" font-family="monospace" font-size="11">Tribonacci (T ≈ 1.839)</text>
  
  <!-- Padovan: log₂ ≈ 0.406n -->
  <polyline points="80,400 103,400 126,400 149,400 172,394 194,391 217,388 240,385 263,381 286,377 308,373 331,369 354,364 377,360 400,355 422,350 445,345 468,340 491,335 514,329 536,324"
    stroke="#ff66ff" stroke-width="2.5" fill="none" filter="url(#glow2)"/>
  <text x="545" y="319" fill="#ff66ff" font-family="monospace" font-size="11">Padovan (P ≈ 1.324)</text>
  
  <!-- Gap annotations -->
  <line x1="536" y1="103" x2="536" y2="137" stroke="#00ff88" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="555" y="108" fill="#88ffaa" font-family="monospace" font-size="9">gap = savings</text>
  
  <!-- Legend box -->
  <rect x="100" y="70" width="270" height="105" rx="6" fill="#111133" stroke="#334466" stroke-width="1"/>
  <text x="235" y="90" fill="#ffffff" font-family="Georgia" font-size="13" text-anchor="middle" font-weight="bold">Dominant Roots (all &lt; 2)</text>
  <text x="115" y="110" fill="#00ff88" font-family="monospace" font-size="11">● Fibonacci/Lucas: φ = 1.618...</text>
  <text x="115" y="128" fill="#ffaa33" font-family="monospace" font-size="11">● Tribonacci:      T = 1.839...</text>
  <text x="115" y="146" fill="#ff66ff" font-family="monospace" font-size="11">● Padovan:         P = 1.324...</text>
  <text x="115" y="168" fill="#ff4444" font-family="monospace" font-size="11">--- Binary barrier:    2.000</text>
  
  <!-- Bottom annotation -->
  <rect x="80" y="455" width="640" height="35" rx="4" fill="#112233"/>
  <text x="400" y="472" fill="#88ddff" font-family="Georgia" font-size="11" text-anchor="middle">
    Machine-verified: fib(n+2) &lt; 2ⁿ, lucas(n) &lt; 2ⁿ, tribonacci(n) &lt; 2ⁿ, padovan(n) &lt; 2ⁿ
  </text>
  <text x="400" y="486" fill="#aaddff" font-family="Georgia" font-size="10" text-anchor="middle">
    Each sub-binary sequence provides a factoring lens that provably reduces the search space
  </text>
</svg>
