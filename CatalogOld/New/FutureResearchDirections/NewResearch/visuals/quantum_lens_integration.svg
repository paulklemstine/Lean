<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#0e1a2e"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="480" fill="url(#bg4)"/>
  
  <text x="400" y="35" fill="#ffffff" font-family="Georgia" font-size="20" text-anchor="middle" font-weight="bold">Quantum Lens Integration: Qubit Budget Analysis</text>
  <text x="400" y="55" fill="#88aacc" font-family="Georgia" font-size="12" text-anchor="middle">How 9 classical lenses save ~4400 physical qubits for RSA-2048</text>
  
  <!-- Left: Without lenses -->
  <rect x="40" y="80" width="340" height="170" rx="8" fill="#111133" stroke="#446688" stroke-width="1"/>
  <text x="210" y="105" fill="#ff6644" font-family="Georgia" font-size="15" text-anchor="middle" font-weight="bold">Without Lens Framework</text>
  
  <!-- Qubit bar (full) -->
  <rect x="60" y="125" width="300" height="30" rx="4" fill="#331111" stroke="#ff4444" stroke-width="1"/>
  <rect x="60" y="125" width="300" height="30" rx="4" fill="#ff4444" opacity="0.3"/>
  <text x="210" y="146" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">512 logical qubits</text>
  
  <text x="60" y="180" fill="#ccaaaa" font-family="monospace" font-size="11">Search space: 2^1024</text>
  <text x="60" y="198" fill="#ccaaaa" font-family="monospace" font-size="11">Grover queries: √(2^1024) = 2^512</text>
  <text x="60" y="216" fill="#ccaaaa" font-family="monospace" font-size="11">Physical qubits: 512 × 882 = 451,584</text>
  <text x="60" y="234" fill="#ff8866" font-family="monospace" font-size="11">← Massive hardware requirement</text>
  
  <!-- Right: With lenses -->
  <rect x="420" y="80" width="340" height="170" rx="8" fill="#112211" stroke="#00ff88" stroke-width="2" filter="url(#glow4)"/>
  <text x="590" y="105" fill="#00ff88" font-family="Georgia" font-size="15" text-anchor="middle" font-weight="bold">With 9-Lens Framework</text>
  
  <!-- Qubit bar (reduced) -->
  <rect x="440" y="125" width="300" height="30" rx="4" fill="#112211" stroke="#00ff88" stroke-width="1"/>
  <rect x="440" y="125" width="295" height="30" rx="4" fill="#00ff88" opacity="0.2"/>
  <rect x="735" y="125" width="5" height="30" fill="#00ff88" opacity="0.5"/>
  <text x="590" y="146" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">507.5 logical qubits (−4.5)</text>
  
  <text x="440" y="180" fill="#aaccaa" font-family="monospace" font-size="11">Search space: 2^1015</text>
  <text x="440" y="198" fill="#aaccaa" font-family="monospace" font-size="11">Grover queries: 2^507.5</text>
  <text x="440" y="216" fill="#aaccaa" font-family="monospace" font-size="11">Physical qubits: 507.5 × 882 = 447,615</text>
  <text x="440" y="234" fill="#00ff88" font-family="monospace" font-size="11">→ Saves ~4,000 physical qubits!</text>
  
  <!-- Arrow between -->
  <path d="M380,165 L420,165" stroke="#ffaa33" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="400" y="155" fill="#ffaa33" font-family="Georgia" font-size="14" text-anchor="middle" font-weight="bold">9 lenses</text>
  
  <!-- Bottom: Lens breakdown -->
  <rect x="40" y="275" width="720" height="185" rx="8" fill="#0a0a1e" stroke="#335577" stroke-width="1"/>
  <text x="400" y="300" fill="#ffffff" font-family="Georgia" font-size="15" text-anchor="middle" font-weight="bold">The Nine Independent Lenses</text>
  
  <!-- Lens grid -->
  <g font-family="monospace" font-size="10">
    <!-- Row 1 -->
    <rect x="55" y="315" width="140" height="40" rx="4" fill="#112233" stroke="#44aaff" stroke-width="1"/>
    <text x="125" y="332" fill="#44aaff" text-anchor="middle" font-size="11">1. p mod 2</text>
    <text x="125" y="348" fill="#88aacc" text-anchor="middle">(parity bit)</text>
    
    <rect x="210" y="315" width="140" height="40" rx="4" fill="#112233" stroke="#44aaff" stroke-width="1"/>
    <text x="280" y="332" fill="#44aaff" text-anchor="middle" font-size="11">2. p mod 3</text>
    <text x="280" y="348" fill="#88aacc" text-anchor="middle">(ternary residue)</text>
    
    <rect x="365" y="315" width="140" height="40" rx="4" fill="#112233" stroke="#44aaff" stroke-width="1"/>
    <text x="435" y="332" fill="#44aaff" text-anchor="middle" font-size="11">3. p mod 5</text>
    <text x="435" y="348" fill="#88aacc" text-anchor="middle">(Legendre symbol)</text>
    
    <rect x="520" y="315" width="140" height="40" rx="4" fill="#112233" stroke="#44aaff" stroke-width="1"/>
    <text x="590" y="332" fill="#44aaff" text-anchor="middle" font-size="11">4. p mod 7</text>
    <text x="590" y="348" fill="#88aacc" text-anchor="middle">(cubic residue)</text>
    
    <rect x="675" y="315" width="70" height="40" rx="4" fill="#112233" stroke="#44aaff" stroke-width="1"/>
    <text x="710" y="337" fill="#44aaff" text-anchor="middle" font-size="11">...</text>
    
    <!-- Row 2 -->
    <rect x="55" y="365" width="140" height="40" rx="4" fill="#112233" stroke="#ffaa44" stroke-width="1"/>
    <text x="125" y="382" fill="#ffaa44" text-anchor="middle" font-size="11">5. p mod 11</text>
    <text x="125" y="398" fill="#ccaa88" text-anchor="middle">(quadratic residue)</text>
    
    <rect x="210" y="365" width="140" height="40" rx="4" fill="#112233" stroke="#ffaa44" stroke-width="1"/>
    <text x="280" y="382" fill="#ffaa44" text-anchor="middle" font-size="11">6. p mod 13</text>
    <text x="280" y="398" fill="#ccaa88" text-anchor="middle">(quadratic residue)</text>
    
    <rect x="365" y="365" width="140" height="40" rx="4" fill="#112233" stroke="#ffaa44" stroke-width="1"/>
    <text x="435" y="382" fill="#ffaa44" text-anchor="middle" font-size="11">7. p mod 17</text>
    <text x="435" y="398" fill="#ccaa88" text-anchor="middle">(quadratic residue)</text>
    
    <rect x="520" y="365" width="140" height="40" rx="4" fill="#112233" stroke="#ff6644" stroke-width="1"/>
    <text x="590" y="382" fill="#ff6644" text-anchor="middle" font-size="11">8. p mod 19</text>
    <text x="590" y="398" fill="#cc8866" text-anchor="middle">(quadratic residue)</text>
    
    <rect x="675" y="365" width="70" height="40" rx="4" fill="#112233" stroke="#ff6644" stroke-width="1"/>
    <text x="710" y="382" fill="#ff6644" text-anchor="middle" font-size="11">9. p mod 23</text>
    <text x="710" y="398" fill="#cc8866" text-anchor="middle">(QR)</text>
  </g>
  
  <!-- Key insight -->
  <text x="400" y="440" fill="#88ddff" font-family="Georgia" font-size="12" text-anchor="middle">
    By CRT, residues mod distinct primes are independent → combined constraint = product of individual constraints
  </text>
  <text x="400" y="460" fill="#aaddff" font-family="Georgia" font-size="11" text-anchor="middle">
    Total reduction: 2 × 3 × 5 × 7 × 11 × 13 × 17 × 19 × 23 = 223,092,870 ≫ 2⁹ = 512
  </text>
</svg>
