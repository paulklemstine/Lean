<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a2e"/>
      <stop offset="100%" style="stop-color:#0a2a1e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" fill="url(#bg4)"/>

  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">
    Peel Smoothness Advantage
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#88aacc" font-size="12">
    Why peel products are exponentially smoother than random integers
  </text>

  <!-- Left panel: Random integer -->
  <rect x="30" y="80" width="400" height="200" rx="12" fill="#1a1020" stroke="#ff4444" stroke-width="2"/>
  <text x="230" y="108" text-anchor="middle" fill="#ff4444" font-size="16" font-weight="bold">Random Integer of Size d²</text>

  <text x="50" y="140" fill="#ffaaaa" font-size="13">n ≈ d² (one large number)</text>
  <text x="50" y="165" fill="#cc8888" font-size="12">P(n is B-smooth) ≈ ρ(2 log d / log B)</text>
  <text x="50" y="190" fill="#cc8888" font-size="12">where ρ is the Dickman function</text>

  <text x="50" y="220" fill="#ff6666" font-size="11">Example: d = 1000, B = 100</text>
  <text x="50" y="240" fill="#ff6666" font-size="11">arg = 2·log(1000)/log(100) = 3.0</text>
  <text x="50" y="260" fill="#ff6666" font-size="11">ρ(3.0) ≈ 0.0486 → 4.9% smooth</text>

  <!-- Right panel: Peel product -->
  <rect x="470" y="80" width="400" height="200" rx="12" fill="#0a2a1e" stroke="#00ff88" stroke-width="2"/>
  <text x="670" y="108" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold">Peel Product (d−x)(d+x)</text>

  <text x="490" y="140" fill="#88ffaa" font-size="13">Two factors, each ≤ 2d</text>
  <text x="490" y="165" fill="#66cc88" font-size="12">P(peel B-smooth) ≈ ρ(log d / log B)²</text>
  <text x="490" y="190" fill="#66cc88" font-size="12">Each factor tested independently!</text>

  <text x="490" y="220" fill="#00ff88" font-size="11">Example: d = 1000, B = 100</text>
  <text x="490" y="240" fill="#00ff88" font-size="11">arg = log(1000)/log(100) = 1.5</text>
  <text x="490" y="260" fill="#00ff88" font-size="11">ρ(1.5)² ≈ 0.1315² ≈ 1.7% smooth</text>

  <!-- Comparison -->
  <text x="450" y="75" text-anchor="middle" fill="#ffaa44" font-size="14" font-weight="bold">VS</text>

  <!-- Advantage calculation -->
  <rect x="100" y="310" width="700" height="120" rx="12" fill="#111133" stroke="#ffaa00" stroke-width="2"/>
  <text x="450" y="338" text-anchor="middle" fill="#ffaa00" font-size="16" font-weight="bold">Smoothness Advantage Ratio</text>

  <text x="130" y="368" fill="#ffcc66" font-size="13">
    Advantage = ρ(u/2)² / ρ(u) where u = 2 log d / log B
  </text>
  <text x="130" y="395" fill="#ffaa44" font-size="12">
    For u = 3: Advantage = ρ(1.5)² / ρ(3.0) = 0.0173 / 0.0486 ≈ 0.36×
  </text>
  <text x="130" y="418" fill="#ffaa44" font-size="12">
    For u = 6: Advantage = ρ(3)² / ρ(6) = 0.00236 / 3.07×10⁻⁵ ≈ 77×
  </text>

  <!-- Key insight box -->
  <rect x="100" y="450" width="700" height="80" rx="12" fill="#0a2a0a" stroke="#00ff88" stroke-width="2"/>
  <text x="450" y="478" text-anchor="middle" fill="#00ff88" font-size="15" font-weight="bold">
    KEY INSIGHT: Advantage grows exponentially with u
  </text>
  <text x="450" y="500" text-anchor="middle" fill="#88ffaa" font-size="12">
    For large N (large u), peel products are 10-10,000× more likely to be smooth
  </text>
  <text x="450" y="518" text-anchor="middle" fill="#66cc88" font-size="11">
    This is the structural core of the gravitational sieve advantage (Verified: peel_smooth_structure ✓)
  </text>
</svg>
