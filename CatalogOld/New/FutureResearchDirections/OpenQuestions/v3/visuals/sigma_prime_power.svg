<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Georgia', serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffd700" font-size="22" font-weight="bold">
    σ₁(pⁿ) = (p^{n+1} − 1) / (p − 1)
  </text>
  <text x="400" y="70" text-anchor="middle" fill="#aab" font-size="14">
    Sum of Divisors of Prime Powers — Formally Verified ✓
  </text>

  <!-- Formula Box -->
  <rect x="50" y="90" width="700" height="80" rx="10" fill="#1a1a3e" stroke="#ffd700" stroke-width="1.5"/>
  <text x="400" y="120" text-anchor="middle" fill="white" font-size="18">
    σ₁(pⁿ) = 1 + p + p² + ··· + pⁿ = Σᵢ₌₀ⁿ pⁱ
  </text>
  <text x="400" y="150" text-anchor="middle" fill="#8af" font-size="16">
    Closed form: σ₁(pⁿ) · (p − 1) = p^{n+1} − 1
  </text>

  <!-- Examples Grid -->
  <text x="100" y="205" fill="#ffd700" font-size="16" font-weight="bold">Examples:</text>

  <!-- p=2 column -->
  <text x="120" y="235" fill="#8cf" font-size="14">p = 2:</text>
  <text x="120" y="260" fill="white" font-size="13">σ₁(2) = 3</text>
  <text x="120" y="280" fill="white" font-size="13">σ₁(4) = 7</text>
  <text x="120" y="300" fill="white" font-size="13">σ₁(8) = 15</text>
  <text x="120" y="320" fill="white" font-size="13">σ₁(16) = 31</text>
  <text x="120" y="340" fill="#6d6" font-size="12">= 2ⁿ⁺¹ − 1</text>

  <!-- p=3 column -->
  <text x="280" y="235" fill="#8cf" font-size="14">p = 3:</text>
  <text x="280" y="260" fill="white" font-size="13">σ₁(3) = 4</text>
  <text x="280" y="280" fill="white" font-size="13">σ₁(9) = 13</text>
  <text x="280" y="300" fill="white" font-size="13">σ₁(27) = 40</text>
  <text x="280" y="320" fill="white" font-size="13">σ₁(81) = 121</text>
  <text x="280" y="340" fill="#6d6" font-size="12">= (3ⁿ⁺¹−1)/2</text>

  <!-- p=5 column -->
  <text x="440" y="235" fill="#8cf" font-size="14">p = 5:</text>
  <text x="440" y="260" fill="white" font-size="13">σ₁(5) = 6</text>
  <text x="440" y="280" fill="white" font-size="13">σ₁(25) = 31</text>
  <text x="440" y="300" fill="white" font-size="13">σ₁(125) = 156</text>
  <text x="440" y="320" fill="white" font-size="13">σ₁(625) = 781</text>
  <text x="440" y="340" fill="#6d6" font-size="12">= (5ⁿ⁺¹−1)/4</text>

  <!-- p=7 column -->
  <text x="600" y="235" fill="#8cf" font-size="14">p = 7:</text>
  <text x="600" y="260" fill="white" font-size="13">σ₁(7) = 8</text>
  <text x="600" y="280" fill="white" font-size="13">σ₁(49) = 57</text>
  <text x="600" y="300" fill="white" font-size="13">σ₁(343) = 400</text>
  <text x="600" y="320" fill="white" font-size="13">σ₁(2401) = 2801</text>
  <text x="600" y="340" fill="#6d6" font-size="12">= (7ⁿ⁺¹−1)/6</text>

  <!-- Consequences -->
  <rect x="50" y="370" width="700" height="110" rx="10" fill="#1a2a1a" stroke="#4d4" stroke-width="1"/>
  <text x="400" y="395" text-anchor="middle" fill="#6d6" font-size="16" font-weight="bold">
    Consequences for Factoring
  </text>
  <text x="80" y="420" fill="white" font-size="13">
    • Jacobi: r₄(pⁿ) = 8·σ₁(pⁿ) for odd pⁿ → counts of 4-square representations
  </text>
  <text x="80" y="440" fill="white" font-size="13">
    • Multiplicativity: σ₁(m·n) = σ₁(m)·σ₁(n) when gcd(m,n) = 1
  </text>
  <text x="80" y="460" fill="white" font-size="13">
    • For semiprime N=pq: σ₁(N) = (p+1)(q+1) = N + p + q + 1 ≈ N + 2√N
  </text>
</svg>
