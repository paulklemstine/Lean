  <text x="415" y="535" text-anchor="middle" fill="#aaa" font-size="10">β_c = 2/ln(N)</text>

  <rect x="550" y="495" width="230" height="60" rx="8" fill="#3d3d0f" stroke="#ffd32a"/>
  <text x="665" y="518" text-anchor="middle" fill="#ffd32a" font-size="11" font-weight="bold">D Quantum Algorithms</text>
