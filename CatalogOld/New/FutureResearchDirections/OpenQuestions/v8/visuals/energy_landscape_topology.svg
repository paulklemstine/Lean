<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="ebg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="energyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#ebg)"/>

  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#e6edf3">
    Energy Landscape E(x) = N mod x for N = 30
  </text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#8b949e">
    Divisors of 30: {1, 2, 3, 5, 6, 10, 15, 30} — Zero-energy local minima (verified)
  </text>

  <!-- Axes -->
  <line x1="80" y1="350" x2="950" y2="350" stroke="#444466" stroke-width="2"/>
  <line x1="80" y1="350" x2="80" y2="70" stroke="#444466" stroke-width="2"/>
  <text x="500" y="385" text-anchor="middle" font-size="12" fill="#8b949e">x</text>
  <text x="55" y="210" text-anchor="middle" font-size="12" fill="#8b949e" transform="rotate(-90, 55, 210)">E(N, x)</text>

  <!-- Y-axis labels -->
  <text x="70" y="354" text-anchor="end" font-size="9" fill="#666688">0</text>
  <text x="70" y="304" text-anchor="end" font-size="9" fill="#666688">5</text>
  <text x="70" y="254" text-anchor="end" font-size="9" fill="#666688">10</text>
  <text x="70" y="204" text-anchor="end" font-size="9" fill="#666688">15</text>
  <text x="70" y="154" text-anchor="end" font-size="9" fill="#666688">20</text>
  <text x="70" y="104" text-anchor="end" font-size="9" fill="#666688">25</text>

  <!-- Grid lines -->
  <line x1="80" y1="300" x2="950" y2="300" stroke="#222244" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="250" x2="950" y2="250" stroke="#222244" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="200" x2="950" y2="200" stroke="#222244" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="150" x2="950" y2="150" stroke="#222244" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="100" x2="950" y2="100" stroke="#222244" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Energy function E(30, x) for x = 1..30
       E(30,1)=0, E(30,2)=0, E(30,3)=0, E(30,4)=2, E(30,5)=0,
       E(30,6)=0, E(30,7)=2, E(30,8)=6, E(30,9)=3, E(30,10)=0,
       E(30,11)=8, E(30,12)=6, E(30,13)=4, E(30,14)=2, E(30,15)=0,
       E(30,16)=14, E(30,17)=13, E(30,18)=12, E(30,19)=11, E(30,20)=10,
       E(30,21)=9, E(30,22)=8, E(30,23)=7, E(30,24)=6, E(30,25)=5,
       E(30,26)=4, E(30,27)=3, E(30,28)=2, E(30,29)=1, E(30,30)=0 -->

  <!-- Scale: x goes from 80 to 950 (870px for 30 points = 29px each), y: 10px per unit -->

  <!-- Energy curve as polygon fill -->
  <polygon points="109,350 109,350 138,350 167,350 196,330 225,350 254,350 283,330 312,290 341,320 370,350 399,270 428,290 457,310 486,330 515,350 544,210 573,220 602,230 631,240 660,250 689,260 718,270 747,280 776,290 805,300 834,310 863,320 892,330 921,340 950,350 950,350"
    fill="url(#energyGrad)" stroke="none"/>

  <!-- Energy curve as line -->
  <polyline points="109,350 138,350 167,350 196,330 225,350 254,350 283,330 312,290 341,320 370,350 399,270 428,290 457,310 486,330 515,350 544,210 573,220 602,230 631,240 660,250 689,260 718,270 747,280 776,290 805,300 834,310 863,320 892,330 921,340 950,350"
    fill="none" stroke="#00ff88" stroke-width="2.5"/>

  <!-- Zero-energy points (divisors) - highlighted -->
  <circle cx="109" cy="350" r="7" fill="#ffd700" stroke="#fff" stroke-width="2"/>
  <circle cx="138" cy="350" r="7" fill="#ffd700" stroke="#fff" stroke-width="2"/>
  <circle cx="167" cy="350" r="7" fill="#ffd700" stroke="#fff" stroke-width="2"/>
  <circle cx="225" cy="350" r="7" fill="#ffd700" stroke="#fff" stroke-width="2"/>
  <circle cx="254" cy="350" r="7" fill="#ffd700" stroke="#fff" stroke-width="2"/>
  <circle cx="370" cy="350" r="7" fill="#ffd700" stroke="#fff" stroke-width="2"/>
  <circle cx="515" cy="350" r="7" fill="#ffd700" stroke="#fff" stroke-width="2"/>
  <circle cx="950" cy="350" r="7" fill="#ffd700" stroke="#fff" stroke-width="2"/>

  <!-- X-axis labels for divisors -->
  <text x="109" y="370" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffd700">1</text>
  <text x="138" y="370" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffd700">2</text>
  <text x="167" y="370" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffd700">3</text>
  <text x="225" y="370" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffd700">5</text>
  <text x="254" y="370" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffd700">6</text>
  <text x="370" y="370" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffd700">10</text>
  <text x="515" y="370" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffd700">15</text>
  <text x="950" y="370" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffd700">30</text>

  <!-- Non-divisor labels -->
  <text x="196" y="370" text-anchor="middle" font-size="8" fill="#666688">4</text>
  <text x="283" y="370" text-anchor="middle" font-size="8" fill="#666688">7</text>
  <text x="312" y="370" text-anchor="middle" font-size="8" fill="#666688">8</text>
  <text x="341" y="370" text-anchor="middle" font-size="8" fill="#666688">9</text>
  <text x="399" y="370" text-anchor="middle" font-size="8" fill="#666688">11</text>
  <text x="544" y="370" text-anchor="middle" font-size="8" fill="#666688">16</text>

  <!-- Annotation: Basin of attraction -->
  <rect x="200" y="392" width="170" height="28" rx="5" fill="rgba(68,136,255,0.15)" stroke="#4488ff"/>
  <text x="285" y="410" text-anchor="middle" font-size="10" fill="#4488ff">Basin of d=5</text>

  <rect x="350" y="392" width="180" height="28" rx="5" fill="rgba(68,136,255,0.15)" stroke="#4488ff"/>
  <text x="440" y="410" text-anchor="middle" font-size="10" fill="#4488ff">Basin of d=10</text>

  <!-- Verified Properties Panel -->
  <rect x="600" y="420" width="380" height="165" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
  <text x="790" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Formally Verified Properties</text>

  <text x="620" y="468" font-size="10" fill="#2ea043">✓ energy_at_divisor: E(N,d) = 0 when d | N</text>
  <text x="620" y="486" font-size="10" fill="#2ea043">✓ divisor_is_local_min: divisors are local minima</text>
  <text x="620" y="504" font-size="10" fill="#2ea043">✓ energy_pos_of_not_dvd: E > 0 for non-divisors</text>
  <text x="620" y="522" font-size="10" fill="#2ea043">✓ laplacian_nonneg: Δ ≥ 0 at divisors</text>
  <text x="620" y="540" font-size="10" fill="#2ea043">✓ sublevel_zero_divisors: E⁻¹(0) = Div(N)</text>
  <text x="620" y="558" font-size="10" fill="#2ea043">✓ euler_char_zero: χ(E⁻¹(0)) = τ(N)</text>
  <text x="620" y="576" font-size="10" fill="#2ea043">✓ morse_index_zero: Morse index = 0 at divisors</text>

  <!-- Legend -->
  <circle cx="100" y="445" r="5" fill="#ffd700" stroke="#fff" stroke-width="1.5"/>
  <text x="115" y="449" font-size="10" fill="#ffd700">Zero-energy (divisor)</text>

  <line x1="90" y1="470" x2="110" y2="470" stroke="#00ff88" stroke-width="2.5"/>
  <text x="115" y="474" font-size="10" fill="#00ff88">Energy function E(x)</text>

  <rect x="90" y="485" width="15" height="10" fill="rgba(0,255,136,0.2)"/>
  <text x="115" y="494" font-size="10" fill="#88cc88">Basin of attraction</text>
</svg>
