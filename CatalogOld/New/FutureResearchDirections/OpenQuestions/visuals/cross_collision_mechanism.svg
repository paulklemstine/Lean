<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#141e32"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg4)"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-size="20" font-weight="bold">
    Cross-Collision Factor Extraction
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#8b949e" font-size="12">
    Two k-tuples sharing hypotenuse d yield k² factor candidates via gcd(xᵢ − yⱼ, N)
  </text>
  
  <!-- Tuple 1 -->
  <rect x="50" y="75" width="300" height="150" rx="10" fill="rgba(68,136,255,0.1)" stroke="#4488ff" stroke-width="2"/>
  <text x="200" y="100" text-anchor="middle" fill="#4488ff" font-size="15" font-weight="bold">Tuple 1: (x₁, x₂, ..., xₖ, d)</text>
  <text x="200" y="125" text-anchor="middle" fill="#88aadd" font-size="12">x₁² + x₂² + ⋯ + xₖ² = d²</text>
  
  <!-- Tuple 1 components -->
  <circle cx="100" cy="170" r="18" fill="#4488ff" opacity="0.3" stroke="#4488ff" stroke-width="1"/>
  <text x="100" y="175" text-anchor="middle" fill="#6699ff" font-size="12" font-weight="bold">x₁</text>
  <circle cx="155" cy="170" r="18" fill="#4488ff" opacity="0.3" stroke="#4488ff" stroke-width="1"/>
  <text x="155" y="175" text-anchor="middle" fill="#6699ff" font-size="12" font-weight="bold">x₂</text>
  <circle cx="210" cy="170" r="18" fill="#4488ff" opacity="0.3" stroke="#4488ff" stroke-width="1"/>
  <text x="210" y="175" text-anchor="middle" fill="#6699ff" font-size="12" font-weight="bold">x₃</text>
  <text x="255" y="175" text-anchor="middle" fill="#6699ff" font-size="16">⋯</text>
  <circle cx="300" cy="170" r="18" fill="#4488ff" opacity="0.3" stroke="#4488ff" stroke-width="1"/>
  <text x="300" y="175" text-anchor="middle" fill="#6699ff" font-size="12" font-weight="bold">xₖ</text>
  
  <!-- Tuple 2 -->
  <rect x="450" y="75" width="300" height="150" rx="10" fill="rgba(68,221,136,0.1)" stroke="#44dd88" stroke-width="2"/>
  <text x="600" y="100" text-anchor="middle" fill="#44dd88" font-size="15" font-weight="bold">Tuple 2: (y₁, y₂, ..., yₖ, d)</text>
  <text x="600" y="125" text-anchor="middle" fill="#88ccaa" font-size="12">y₁² + y₂² + ⋯ + yₖ² = d²</text>
  
  <!-- Tuple 2 components -->
  <circle cx="500" cy="170" r="18" fill="#44dd88" opacity="0.3" stroke="#44dd88" stroke-width="1"/>
  <text x="500" y="175" text-anchor="middle" fill="#66ee99" font-size="12" font-weight="bold">y₁</text>
  <circle cx="555" cy="170" r="18" fill="#44dd88" opacity="0.3" stroke="#44dd88" stroke-width="1"/>
  <text x="555" y="175" text-anchor="middle" fill="#66ee99" font-size="12" font-weight="bold">y₂</text>
  <circle cx="610" cy="170" r="18" fill="#44dd88" opacity="0.3" stroke="#44dd88" stroke-width="1"/>
  <text x="610" y="175" text-anchor="middle" fill="#66ee99" font-size="12" font-weight="bold">y₃</text>
  <text x="655" y="175" text-anchor="middle" fill="#66ee99" font-size="16">⋯</text>
  <circle cx="700" cy="170" r="18" fill="#44dd88" opacity="0.3" stroke="#44dd88" stroke-width="1"/>
  <text x="700" y="175" text-anchor="middle" fill="#66ee99" font-size="12" font-weight="bold">yₖ</text>
  
  <!-- Shared hypotenuse -->
  <rect x="320" y="85" width="160" height="35" rx="8" fill="rgba(255,215,0,0.2)" stroke="#ffd700" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">Shared d</text>
  
  <!-- Cross-collision lines -->
  <g opacity="0.4">
    <line x1="100" y1="188" x2="500" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="100" y1="188" x2="555" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="100" y1="188" x2="610" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="100" y1="188" x2="700" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="155" y1="188" x2="500" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="155" y1="188" x2="555" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="155" y1="188" x2="610" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="155" y1="188" x2="700" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="210" y1="188" x2="500" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="210" y1="188" x2="555" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="210" y1="188" x2="610" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="210" y1="188" x2="700" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="300" y1="188" x2="500" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="300" y1="188" x2="555" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="300" y1="188" x2="610" y2="250" stroke="#ff6644" stroke-width="1"/>
    <line x1="300" y1="188" x2="700" y2="250" stroke="#ff6644" stroke-width="1"/>
  </g>
  
  <!-- GCD box -->
  <rect x="100" y="240" width="600" height="50" rx="8" fill="rgba(255,102,68,0.15)" stroke="#ff6644" stroke-width="2"/>
  <text x="400" y="270" text-anchor="middle" fill="#ff6644" font-size="16" font-weight="bold">k² cross-collision tests: gcd(xᵢ − yⱼ, N) for all (i,j) pairs</text>
  
  <!-- Results -->
  <rect x="50" y="310" width="700" height="170" rx="10" fill="rgba(255,255,255,0.03)" stroke="#333" stroke-width="1"/>
  <text x="400" y="340" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold">Channel Counts and Success Probabilities</text>
  
  <text x="120" y="375" text-anchor="middle" fill="#aab" font-size="12" font-weight="bold">k</text>
  <text x="220" y="375" text-anchor="middle" fill="#4488ff" font-size="12" font-weight="bold">Peel Channels</text>
  <text x="350" y="375" text-anchor="middle" fill="#ff6644" font-size="12" font-weight="bold">Cross Channels</text>
  <text x="480" y="375" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">Total</text>
  <text x="620" y="375" text-anchor="middle" fill="#44dd88" font-size="12" font-weight="bold">P(success)</text>
  
  <line x1="70" y1="385" x2="730" y2="385" stroke="#333" stroke-width="1"/>
  
  <text x="120" y="405" text-anchor="middle" fill="#888" font-size="13">2 (ℂ)</text>
  <text x="220" y="405" text-anchor="middle" fill="#6699ff" font-size="13">3</text>
  <text x="350" y="405" text-anchor="middle" fill="#ff8866" font-size="13">4</text>
  <text x="480" y="405" text-anchor="middle" fill="#ffcc44" font-size="13">7</text>
  <text x="620" y="405" text-anchor="middle" fill="#66ee99" font-size="13">≈ 4/√N</text>
  
  <text x="120" y="430" text-anchor="middle" fill="#888" font-size="13">4 (ℍ)</text>
  <text x="220" y="430" text-anchor="middle" fill="#6699ff" font-size="13">10</text>
  <text x="350" y="430" text-anchor="middle" fill="#ff8866" font-size="13">16</text>
  <text x="480" y="430" text-anchor="middle" fill="#ffcc44" font-size="13">26</text>
  <text x="620" y="430" text-anchor="middle" fill="#66ee99" font-size="13">≈ 32/√N</text>
  
  <text x="120" y="455" text-anchor="middle" fill="#888" font-size="13">8 (𝕆)</text>
  <text x="220" y="455" text-anchor="middle" fill="#6699ff" font-size="13">36</text>
  <text x="350" y="455" text-anchor="middle" fill="#ff8866" font-size="13">64</text>
  <text x="480" y="455" text-anchor="middle" fill="#ffcc44" font-size="13">100</text>
  <text x="620" y="455" text-anchor="middle" fill="#66ee99" font-size="13">≈ 128/√N</text>
  
  <text x="120" y="480" text-anchor="middle" fill="#888" font-size="13">16 (𝕊)</text>
  <text x="220" y="480" text-anchor="middle" fill="#6699ff" font-size="13">136</text>
  <text x="350" y="480" text-anchor="middle" fill="#ff8866" font-size="13">256</text>
  <text x="480" y="480" text-anchor="middle" fill="#ffcc44" font-size="13">392</text>
  <text x="620" y="480" text-anchor="middle" fill="#66ee99" font-size="13">≈ 512/√N</text>
</svg>
