<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#bg4)"/>

  <text x="500" y="40" text-anchor="middle" fill="#ffd700" font-size="24" font-weight="bold">
    SPB ↔ Chebyshev Polynomials: The Multiple Angle Connection
  </text>

  <!-- Left: SPB iteration tree -->
  <rect x="30" y="60" width="440" height="260" rx="12" fill="#0a1a2e" stroke="#4488ff" stroke-width="2"/>
  <text x="250" y="90" text-anchor="middle" fill="#4488ff" font-size="18" font-weight="bold">SPB Iteration Tree</text>

  <!-- Tree diagram showing spbPow computation -->
  <!-- Level 0: seed tan(θ) -->
  <rect x="200" y="105" width="100" height="25" rx="5" fill="#1a2a3e" stroke="#ffd700" stroke-width="1.5"/>
  <text x="250" y="122" text-anchor="middle" fill="#ffd700" font-size="12">tan(θ)</text>

  <!-- Level 1: spb(tan θ, tan θ) -->
  <line x1="200" y1="130" x2="150" y2="150" stroke="#4488ff" stroke-width="1"/>
  <line x1="300" y1="130" x2="350" y2="150" stroke="#4488ff" stroke-width="1"/>

  <rect x="100" y="150" width="100" height="25" rx="5" fill="#1a2a3e" stroke="#44ff88" stroke-width="1.5"/>
  <text x="150" y="167" text-anchor="middle" fill="#44ff88" font-size="11">tan(θ)</text>

  <rect x="300" y="150" width="100" height="25" rx="5" fill="#1a2a3e" stroke="#44ff88" stroke-width="1.5"/>
  <text x="350" y="167" text-anchor="middle" fill="#44ff88" font-size="11">tan(θ)</text>

  <text x="250" y="195" text-anchor="middle" fill="#ff6644" font-size="14" font-weight="bold">
    spb = tan(2θ)
  </text>

  <!-- Level 2: spb(tan 2θ, tan θ) -->
  <line x1="175" y1="200" x2="125" y2="220" stroke="#4488ff" stroke-width="1"/>
  <line x1="325" y1="200" x2="375" y2="220" stroke="#4488ff" stroke-width="1"/>

  <rect x="75" y="220" width="100" height="25" rx="5" fill="#1a2a3e" stroke="#aa66ff" stroke-width="1.5"/>
  <text x="125" y="237" text-anchor="middle" fill="#aa66ff" font-size="11">tan(2θ)</text>

  <rect x="325" y="220" width="100" height="25" rx="5" fill="#1a2a3e" stroke="#aa66ff" stroke-width="1.5"/>
  <text x="375" y="237" text-anchor="middle" fill="#aa66ff" font-size="11">tan(θ)</text>

  <text x="250" y="265" text-anchor="middle" fill="#ff6644" font-size="14" font-weight="bold">
    spb = tan(3θ)
  </text>

  <!-- Arrow showing pattern -->
  <text x="250" y="300" text-anchor="middle" fill="#ffd700" font-size="13" font-style="italic">
    spbPow(tan θ, n) = tan(nθ) ✓ Verified
  </text>

  <!-- Right: Chebyshev polynomials -->
  <rect x="530" y="60" width="440" height="260" rx="12" fill="#1a0a2e" stroke="#aa66ff" stroke-width="2"/>
  <text x="750" y="90" text-anchor="middle" fill="#aa66ff" font-size="18" font-weight="bold">Chebyshev Polynomials</text>

  <text x="750" y="120" text-anchor="middle" fill="#cc88ff" font-size="14">T_n(cos θ) = cos(nθ)</text>
  <text x="750" y="145" text-anchor="middle" fill="#cc88ff" font-size="14">U_n(cos θ) sin θ = sin((n+1)θ)</text>

  <text x="750" y="175" text-anchor="middle" fill="#8866aa" font-size="13">Recurrence: T_{n+1} = 2x·T_n − T_{n-1}</text>

  <!-- Table of first few -->
  <text x="630" y="205" fill="#aabbcc" font-size="12">T₀(x) = 1</text>
  <text x="630" y="225" fill="#aabbcc" font-size="12">T₁(x) = x</text>
  <text x="630" y="245" fill="#aabbcc" font-size="12">T₂(x) = 2x² − 1</text>
  <text x="630" y="265" fill="#aabbcc" font-size="12">T₃(x) = 4x³ − 3x</text>

  <text x="810" y="205" fill="#aabbcc" font-size="12">= cos(0·θ)</text>
  <text x="810" y="225" fill="#aabbcc" font-size="12">= cos(θ)</text>
  <text x="810" y="245" fill="#aabbcc" font-size="12">= cos(2θ)</text>
  <text x="810" y="265" fill="#aabbcc" font-size="12">= cos(3θ)</text>

  <text x="750" y="300" text-anchor="middle" fill="#ffd700" font-size="13" font-style="italic">
    Dense in C[-1,1] by Stone-Weierstrass
  </text>

  <!-- Connection arrow -->
  <rect x="420" y="140" width="160" height="90" rx="8" fill="#0a0a1e" stroke="#ffd700" stroke-width="2"/>
  <text x="500" y="165" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">Bridge</text>
  <text x="500" y="185" text-anchor="middle" fill="#ffaa55" font-size="12">x = tan(θ/2)</text>
  <text x="500" y="205" text-anchor="middle" fill="#ffaa55" font-size="12">cos θ = (1−x²)/(1+x²)</text>
  <text x="500" y="220" text-anchor="middle" fill="#ffaa55" font-size="12">[Weierstrass sub]</text>

  <!-- Bottom: Application chain -->
  <rect x="30" y="340" width="940" height="130" rx="12" fill="#0a0a1e" stroke="#44ff88" stroke-width="2"/>
  <text x="500" y="370" text-anchor="middle" fill="#44ff88" font-size="18" font-weight="bold">
    The Approximation Chain
  </text>

  <!-- Chain arrows -->
  <rect x="50" y="385" width="200" height="55" rx="8" fill="#1a2a2a" stroke="#55aa88" stroke-width="1.5"/>
  <text x="150" y="405" text-anchor="middle" fill="#55aa88" font-size="13" font-weight="bold">SPB Trees</text>
  <text x="150" y="425" text-anchor="middle" fill="#88aaaa" font-size="11">Binary ops from x, 0, 1</text>

  <text x="275" y="415" text-anchor="middle" fill="#ffd700" font-size="20">→</text>

  <rect x="300" y="385" width="200" height="55" rx="8" fill="#1a2a2a" stroke="#55aa88" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" fill="#55aa88" font-size="13" font-weight="bold">Multiple Angles</text>
  <text x="400" y="425" text-anchor="middle" fill="#88aaaa" font-size="11">tan(nθ) for all n ∈ ℕ</text>

  <text x="525" y="415" text-anchor="middle" fill="#ffd700" font-size="20">→</text>

  <rect x="550" y="385" width="200" height="55" rx="8" fill="#1a2a2a" stroke="#55aa88" stroke-width="1.5"/>
  <text x="650" y="405" text-anchor="middle" fill="#55aa88" font-size="13" font-weight="bold">Chebyshev Basis</text>
  <text x="650" y="425" text-anchor="middle" fill="#88aaaa" font-size="11">T_n, U_n polynomials</text>

  <text x="775" y="415" text-anchor="middle" fill="#ffd700" font-size="20">→</text>

  <rect x="800" y="385" width="160" height="55" rx="8" fill="#1a2a2a" stroke="#55aa88" stroke-width="1.5"/>
  <text x="880" y="405" text-anchor="middle" fill="#55aa88" font-size="13" font-weight="bold">All of C(K)</text>
  <text x="880" y="425" text-anchor="middle" fill="#88aaaa" font-size="11">Stone-Weierstrass</text>

  <text x="500" y="460" text-anchor="middle" fill="#ffd700" font-size="14" font-style="italic">
    SPB trees approximate any continuous function on compact subsets of ℝ
  </text>

  <!-- Bottom: Complexity -->
  <rect x="30" y="490" width="940" height="130" rx="12" fill="#0a0a1e" stroke="#ff6644" stroke-width="2"/>
  <text x="500" y="520" text-anchor="middle" fill="#ff6644" font-size="18" font-weight="bold">
    SPB Complexity: Binary Exponentiation
  </text>

  <text x="500" y="550" text-anchor="middle" fill="#ffaa88" font-size="14">
    Computing tan(nθ) from tan(θ) via repeated doubling:
  </text>

  <!-- Examples -->
  <text x="200" y="580" text-anchor="middle" fill="#ccddee" font-size="13">n = 8 = 1000₂</text>
  <text x="200" y="600" text-anchor="middle" fill="#88aacc" font-size="12">3 doublings, 0 additions</text>
  <text x="200" y="615" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">= 3 SPB ops</text>

  <text x="500" y="580" text-anchor="middle" fill="#ccddee" font-size="13">n = 15 = 1111₂</text>
  <text x="500" y="600" text-anchor="middle" fill="#88aacc" font-size="12">3 doublings, 3 additions</text>
  <text x="500" y="615" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">= 6 SPB ops</text>

  <text x="800" y="580" text-anchor="middle" fill="#ccddee" font-size="13">n = 1000 = 1111101000₂</text>
  <text x="800" y="600" text-anchor="middle" fill="#88aacc" font-size="12">9 doublings, 5 additions</text>
  <text x="800" y="615" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">= 14 SPB ops</text>
</svg>
