<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Georgia', serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg4)"/>

  <text x="400" y="40" text-anchor="middle" fill="#ffd700" font-size="22" font-weight="bold">
    The Cauchy Distribution: SPB's Natural Measure
  </text>

  <!-- Circle on top -->
  <g transform="translate(400, 200)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#44cc88" stroke-width="2"/>
    <text x="0" y="-115" text-anchor="middle" fill="#66ffaa" font-size="16" font-weight="bold">
      S¹ with Uniform Measure
    </text>

    <!-- Uniform dots on circle -->
    <g fill="#44cc88">
      <circle cx="100" cy="0" r="3"/>
      <circle cx="86.6" cy="-50" r="3"/>
      <circle cx="50" cy="-86.6" r="3"/>
      <circle cx="0" cy="-100" r="3"/>
      <circle cx="-50" cy="-86.6" r="3"/>
      <circle cx="-86.6" cy="-50" r="3"/>
      <circle cx="-100" cy="0" r="3"/>
      <circle cx="-86.6" cy="50" r="3"/>
      <circle cx="-50" cy="86.6" r="3"/>
      <circle cx="0" cy="100" r="3"/>
      <circle cx="50" cy="86.6" r="3"/>
      <circle cx="86.6" cy="50" r="3"/>
    </g>

    <!-- North pole marker -->
    <circle cx="0" cy="-100" r="6" fill="none" stroke="#ff4444" stroke-width="2"/>
    <text x="20" y="-100" fill="#ff6666" font-size="11">projection point</text>

    <!-- Stereographic projection lines -->
    <line x1="0" y1="-100" x2="-250" y2="190" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
    <line x1="0" y1="-100" x2="-100" y2="190" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
    <line x1="0" y1="-100" x2="0" y2="190" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
    <line x1="0" y1="-100" x2="100" y2="190" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
    <line x1="0" y1="-100" x2="250" y2="190" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  </g>

  <!-- Real line on bottom -->
  <g transform="translate(400, 400)">
    <line x1="-350" y1="0" x2="350" y2="0" stroke="#4488cc" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" fill="#66aaff" font-size="16" font-weight="bold">
      ℝ with Cauchy Measure
    </text>

    <!-- Cauchy distribution curve -->
    <path d="M -300,0 C -300,-5 -250,-10 -200,-15 C -150,-20 -120,-30 -80,-50 C -60,-65 -40,-90 -20,-120 C -10,-140 0,-150 0,-150 C 0,-150 10,-140 20,-120 C 40,-90 60,-65 80,-50 C 120,-30 150,-20 200,-15 C 250,-10 300,-5 300,0"
          fill="none" stroke="#ffdd44" stroke-width="2.5" transform="translate(0, 40) scale(1, -0.5)"/>

    <!-- Labels -->
    <text x="0" y="55" text-anchor="middle" fill="#ffdd88" font-size="13">
      f(x) = 1/(π(1+x²))
    </text>

    <!-- Projected points (Cauchy distributed - bunched near center) -->
    <g fill="#4488cc">
      <circle cx="-200" cy="0" r="3"/>
      <circle cx="-100" cy="0" r="3"/>
      <circle cx="-40" cy="0" r="3"/>
      <circle cx="-15" cy="0" r="3"/>
      <circle cx="0" cy="0" r="3"/>
      <circle cx="15" cy="0" r="3"/>
      <circle cx="40" cy="0" r="3"/>
      <circle cx="100" cy="0" r="3"/>
      <circle cx="200" cy="0" r="3"/>
    </g>
  </g>

  <!-- Cayley Transform Label -->
  <g transform="translate(400, 310)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-size="14">
      C⁻¹(w) = (w−1)/(i(w+1))
    </text>
    <text x="0" y="18" text-anchor="middle" fill="#aaaacc" font-size="12">
      Inverse Cayley Transform
    </text>
    <line x1="-20" y1="25" x2="-20" y2="50" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="20" y1="25" x2="20" y2="50" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Invariance theorem box -->
  <g transform="translate(400, 510)">
    <rect x="-300" y="-25" width="600" height="55" rx="10" fill="#1a2a1a" stroke="#44ff44" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">
      Theorem (Verified in Lean 4):
    </text>
    <text x="0" y="18" text-anchor="middle" fill="#ffdd88" font-size="14">
      f(spb(x,a)) · |spb'(x)| = f(x) — Cauchy is SPB-invariant
    </text>
  </g>

  <!-- Key insight -->
  <text x="400" y="585" text-anchor="middle" fill="#8888aa" font-size="12">
    Uniform points on the circle project to Cauchy-distributed points on the line
  </text>
</svg>
