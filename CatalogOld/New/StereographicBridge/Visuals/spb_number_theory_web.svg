<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0a"/>
      <stop offset="100%" style="stop-color:#0a2a2a"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="650" fill="url(#bg3)"/>
  
  <text x="450" y="35" text-anchor="middle" fill="#2ecc71" font-size="22" font-weight="bold">
    SPB Number Theory Web
  </text>
  <text x="450" y="57" text-anchor="middle" fill="#aaa" font-size="13">
    How spb(x,y) = (x+y)/(1−xy) connects to fundamental number theory
  </text>

  <!-- Central node: SPB -->
  <circle cx="450" cy="300" r="55" fill="none" stroke="#2ecc71" stroke-width="3" filter="url(#glow3)"/>
  <text x="450" y="295" text-anchor="middle" fill="#2ecc71" font-size="16" font-weight="bold">SPB</text>
  <text x="450" y="315" text-anchor="middle" fill="#aaa" font-size="11">(x+y)/(1−xy)</text>

  <!-- Node: Pythagorean Triples -->
  <line x1="395" y1="280" x2="170" y2="150" stroke="#e67e22" stroke-width="1.5" opacity="0.6"/>
  <circle cx="140" cy="130" r="45" fill="none" stroke="#e67e22" stroke-width="2"/>
  <text x="140" y="120" text-anchor="middle" fill="#e67e22" font-size="13" font-weight="bold">Pythagorean</text>
  <text x="140" y="138" text-anchor="middle" fill="#e67e22" font-size="13" font-weight="bold">Triples</text>
  <text x="140" y="158" text-anchor="middle" fill="#888" font-size="10">(b²−a², 2ab, b²+a²)</text>

  <!-- Node: Gaussian Integers -->
  <line x1="420" y1="250" x2="310" y2="110" stroke="#9b59b6" stroke-width="1.5" opacity="0.6"/>
  <circle cx="290" cy="90" r="42" fill="none" stroke="#9b59b6" stroke-width="2"/>
  <text x="290" y="83" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="bold">Gaussian</text>
  <text x="290" y="100" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="bold">Integers</text>
  <text x="290" y="118" text-anchor="middle" fill="#888" font-size="10">N(a+bi) = a²+b²</text>

  <!-- Node: Brahmagupta-Fibonacci -->
  <line x1="480" y1="250" x2="600" y2="110" stroke="#3498db" stroke-width="1.5" opacity="0.6"/>
  <circle cx="620" cy="90" r="48" fill="none" stroke="#3498db" stroke-width="2"/>
  <text x="620" y="78" text-anchor="middle" fill="#3498db" font-size="12" font-weight="bold">Brahmagupta-</text>
  <text x="620" y="95" text-anchor="middle" fill="#3498db" font-size="12" font-weight="bold">Fibonacci</text>
  <text x="620" y="115" text-anchor="middle" fill="#888" font-size="9">(a²+b²)(c²+d²)</text>
  <text x="620" y="128" text-anchor="middle" fill="#888" font-size="9">= sum of 2 squares</text>

  <!-- Node: Finite Fields -->
  <line x1="505" y1="290" x2="730" y2="200" stroke="#e74c3c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="760" cy="185" r="45" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="760" y="178" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold">Finite Fields</text>
  <text x="760" y="196" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold">F_p</text>
  <text x="760" y="216" text-anchor="middle" fill="#888" font-size="10">p±1 law</text>

  <!-- Node: Quadratic Reciprocity -->
  <line x1="505" y1="320" x2="740" y2="350" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  <circle cx="770" cy="360" r="48" fill="none" stroke="#FFD700" stroke-width="2"/>
  <text x="770" y="350" text-anchor="middle" fill="#FFD700" font-size="12" font-weight="bold">Quadratic</text>
  <text x="770" y="368" text-anchor="middle" fill="#FFD700" font-size="12" font-weight="bold">Reciprocity</text>
  <text x="770" y="388" text-anchor="middle" fill="#888" font-size="10">(−1/p) determines</text>
  <text x="770" y="401" text-anchor="middle" fill="#888" font-size="10">group order</text>

  <!-- Connection between Finite Fields and QR -->
  <line x1="760" y1="230" x2="770" y2="312" stroke="#FF6600" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Node: Machin Formulas -->
  <line x1="395" y1="310" x2="170" y2="350" stroke="#1abc9c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="140" cy="370" r="42" fill="none" stroke="#1abc9c" stroke-width="2"/>
  <text x="140" y="363" text-anchor="middle" fill="#1abc9c" font-size="13" font-weight="bold">Machin</text>
  <text x="140" y="380" text-anchor="middle" fill="#1abc9c" font-size="13" font-weight="bold">Formulas</text>
  <text x="140" y="400" text-anchor="middle" fill="#888" font-size="10">π via SPB trees</text>

  <!-- Node: Chebyshev -->
  <line x1="430" y1="355" x2="330" y2="470" stroke="#e74c3c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="310" cy="490" r="42" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="310" y="483" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold">Chebyshev</text>
  <text x="310" y="500" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="bold">Polynomials</text>
  <text x="310" y="520" text-anchor="middle" fill="#888" font-size="10">T_n from spb^n</text>

  <!-- Node: Weierstrass -->
  <line x1="470" y1="355" x2="570" y2="470" stroke="#2ecc71" stroke-width="1.5" opacity="0.6"/>
  <circle cx="590" cy="490" r="45" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="590" y="483" text-anchor="middle" fill="#2ecc71" font-size="12" font-weight="bold">Weierstrass</text>
  <text x="590" y="500" text-anchor="middle" fill="#2ecc71" font-size="12" font-weight="bold">Substitution</text>
  <text x="590" y="520" text-anchor="middle" fill="#888" font-size="10">cos θ = (1−t²)/(1+t²)</text>

  <!-- Node: L-functions -->
  <line x1="505" y1="300" x2="780" y2="500" stroke="#9b59b6" stroke-width="1" opacity="0.4" stroke-dasharray="5,5"/>
  <circle cx="790" cy="520" r="42" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="790" y="513" text-anchor="middle" fill="#9b59b6" font-size="12" font-weight="bold">L-functions</text>
  <text x="790" y="530" text-anchor="middle" fill="#9b59b6" font-size="12" font-weight="bold">ζ(s)·L(s,χ₋₄)</text>
  <text x="790" y="548" text-anchor="middle" fill="#888" font-size="9" font-style="italic">conjectural</text>

  <!-- Connection: Pythagorean ↔ Gaussian -->
  <line x1="175" y1="130" x2="250" y2="100" stroke="#666" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Bottom label -->
  <text x="450" y="610" text-anchor="middle" fill="#666" font-size="11">
    Solid lines: machine-verified connections | Dashed lines: conjectural/open
  </text>
  <text x="450" y="630" text-anchor="middle" fill="#666" font-size="11">
    The SPB formula (x+y)/(1−xy) bridges geometry, algebra, and arithmetic
  </text>
</svg>
