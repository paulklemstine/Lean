<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a2e"/>
      <stop offset="100%" style="stop-color:#1a2a4e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg3)"/>

  <text x="450" y="40" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold">
    SPB Matrix Representation
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#aaa" font-size="12">
    M(a) · M(b) = (1-ab) · M(spb(a,b))
  </text>

  <!-- Matrix M(a) -->
  <rect x="50" y="100" width="200" height="120" rx="8" fill="#1a2a4a" stroke="#4488ff" stroke-width="1.5"/>
  <text x="150" y="130" text-anchor="middle" fill="#4488ff" font-size="14" font-weight="bold">M(a)</text>
  <text x="150" y="160" text-anchor="middle" fill="#88aaff" font-size="16" font-family="monospace">⎡ 1   a ⎤</text>
  <text x="150" y="185" text-anchor="middle" fill="#88aaff" font-size="16" font-family="monospace">⎣-a   1 ⎦</text>
  <text x="150" y="205" text-anchor="middle" fill="#6688aa" font-size="10">det = 1 + a²</text>

  <!-- × symbol -->
  <text x="280" y="165" text-anchor="middle" fill="#FFD700" font-size="24">×</text>

  <!-- Matrix M(b) -->
  <rect x="310" y="100" width="200" height="120" rx="8" fill="#1a2a4a" stroke="#44ff88" stroke-width="1.5"/>
  <text x="410" y="130" text-anchor="middle" fill="#44ff88" font-size="14" font-weight="bold">M(b)</text>
  <text x="410" y="160" text-anchor="middle" fill="#88ffaa" font-size="16" font-family="monospace">⎡ 1   b ⎤</text>
  <text x="410" y="185" text-anchor="middle" fill="#88ffaa" font-size="16" font-family="monospace">⎣-b   1 ⎦</text>
  <text x="410" y="205" text-anchor="middle" fill="#668866" font-size="10">det = 1 + b²</text>

  <!-- = symbol -->
  <text x="540" y="165" text-anchor="middle" fill="#FFD700" font-size="24">=</text>

  <!-- Result -->
  <rect x="570" y="100" width="280" height="120" rx="8" fill="#2a1a3a" stroke="#ff88ff" stroke-width="1.5"/>
  <text x="710" y="130" text-anchor="middle" fill="#ff88ff" font-size="14" font-weight="bold">(1-ab) · M(spb(a,b))</text>
  <text x="710" y="160" text-anchor="middle" fill="#ffaaff" font-size="16" font-family="monospace">⎡1-ab   a+b  ⎤</text>
  <text x="710" y="185" text-anchor="middle" fill="#ffaaff" font-size="16" font-family="monospace">⎣-(a+b) 1-ab ⎦</text>
  <text x="710" y="205" text-anchor="middle" fill="#886688" font-size="10">det = (1+a²)(1+b²)</text>

  <!-- Arrow to rotation interpretation -->
  <line x1="150" y1="235" x2="150" y2="310" stroke="#4488ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Rotation matrix -->
  <rect x="30" y="310" width="240" height="150" rx="8" fill="#1a1a3a" stroke="#8888ff" stroke-width="1.5"/>
  <text x="150" y="340" text-anchor="middle" fill="#8888ff" font-size="14" font-weight="bold">Normalized: Rotation</text>
  <text x="150" y="370" text-anchor="middle" fill="#aaaaff" font-size="13">R(θ) = M(a)/√(1+a²)</text>
  <text x="150" y="400" text-anchor="middle" fill="#aaaaff" font-size="14" font-family="monospace">⎡cos θ   sin θ⎤</text>
  <text x="150" y="425" text-anchor="middle" fill="#aaaaff" font-size="14" font-family="monospace">⎣-sin θ  cos θ⎦</text>
  <text x="150" y="450" text-anchor="middle" fill="#6666aa" font-size="11">where θ = arctan(a)</text>

  <!-- Projective action -->
  <rect x="340" y="310" width="240" height="150" rx="8" fill="#1a3a1a" stroke="#88ff88" stroke-width="1.5"/>
  <text x="460" y="340" text-anchor="middle" fill="#88ff88" font-size="14" font-weight="bold">Projective Action</text>
  <text x="460" y="370" text-anchor="middle" fill="#aaffaa" font-size="13">M(a) · [x, 1]ᵀ = [x+a, 1-ax]ᵀ</text>
  <text x="460" y="400" text-anchor="middle" fill="#aaffaa" font-size="13">↓ in ℙ¹</text>
  <text x="460" y="430" text-anchor="middle" fill="#66ff66" font-size="16" font-weight="bold">(x+a)/(1-ax) = spb(x,a)</text>

  <!-- Determinant identity -->
  <rect x="640" y="310" width="230" height="150" rx="8" fill="#3a1a1a" stroke="#ff8888" stroke-width="1.5"/>
  <text x="755" y="340" text-anchor="middle" fill="#ff8888" font-size="14" font-weight="bold">Determinant</text>
  <text x="755" y="370" text-anchor="middle" fill="#ffaaaa" font-size="13">det M(a) = 1 + a²</text>
  <text x="755" y="400" text-anchor="middle" fill="#ffaaaa" font-size="13">Always &gt; 0</text>
  <text x="755" y="430" text-anchor="middle" fill="#ffaaaa" font-size="13">⟹ M(a) ∈ GL₊(2,ℝ)</text>
  <text x="755" y="455" text-anchor="middle" fill="#ff6666" font-size="11">SPB matrices are always</text>
  <text x="755" y="470" text-anchor="middle" fill="#ff6666" font-size="11">orientation-preserving</text>

  <!-- Bottom note -->
  <rect x="200" y="520" width="500" height="45" rx="8" fill="#0d1a0d" stroke="#44ff88" stroke-width="1"/>
  <text x="450" y="540" text-anchor="middle" fill="#44ff88" font-size="12">
    ✓ Machine-verified: spbMatrix_mul_eq_scaled, spbMatrix_det_mul
  </text>
  <text x="450" y="555" text-anchor="middle" fill="#88ffaa" font-size="10">
    SPB embeds into PGL(2,ℝ) as a 1-parameter subgroup of rotations
  </text>
</svg>
