<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" stroke="#94a3b8" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1e293b" font-weight="bold">The Cayley Transform: Bridge Between ℝ and S¹</text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#64748b">C(x) = (x − i)/(x + i) maps the real line to the unit circle</text>

  <!-- Left: Real Line -->
  <g transform="translate(150, 280)">
    <!-- Axis -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="130" y="5" font-family="serif" font-size="14" fill="#333">ℝ</text>
    <text x="0" y="-120" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e293b" font-weight="bold">(ℝ, spb)</text>

    <!-- Points on real line -->
    <circle cx="-100" cy="0" r="5" fill="#dc2626"/>
    <text x="-100" y="20" text-anchor="middle" font-size="12" fill="#dc2626">−∞</text>

    <circle cx="-60" cy="0" r="5" fill="#ea580c"/>
    <text x="-60" y="20" text-anchor="middle" font-size="12" fill="#ea580c">−1</text>

    <circle cx="0" cy="0" r="5" fill="#2563eb"/>
    <text x="0" y="20" text-anchor="middle" font-size="12" fill="#2563eb">0</text>

    <circle cx="60" cy="0" r="5" fill="#16a34a"/>
    <text x="60" y="20" text-anchor="middle" font-size="12" fill="#16a34a">1</text>

    <circle cx="100" cy="0" r="5" fill="#dc2626"/>
    <text x="100" y="20" text-anchor="middle" font-size="12" fill="#dc2626">+∞</text>

    <!-- SPB operation label -->
    <text x="0" y="-90" text-anchor="middle" font-family="serif" font-size="14" fill="#475569">
      <tspan font-style="italic">spb(x,y) = (x+y)/(1−xy)</tspan>
    </text>
  </g>

  <!-- Right: Unit Circle -->
  <g transform="translate(600, 280)">
    <!-- Circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#333" stroke-width="2"/>
    <text x="0" y="-120" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e293b" font-weight="bold">(S¹, ×)</text>

    <!-- Points on circle -->
    <!-- C(0) = -1 (left) -->
    <circle cx="-100" cy="0" r="5" fill="#2563eb"/>
    <text x="-115" y="-10" text-anchor="end" font-size="11" fill="#2563eb">C(0)=−1</text>

    <!-- C(1) = (1-i)/(1+i) = -i (bottom) -->
    <circle cx="0" cy="100" r="5" fill="#16a34a"/>
    <text x="15" y="115" font-size="11" fill="#16a34a">C(1)=−i</text>

    <!-- C(-1) = (-1-i)/(-1+i) = i (top) -->
    <circle cx="0" cy="-100" r="5" fill="#ea580c"/>
    <text x="15" y="-105" font-size="11" fill="#ea580c">C(−1)=i</text>

    <!-- C(∞) = 1 (right) -->
    <circle cx="100" cy="0" r="5" fill="#dc2626"/>
    <text x="115" y="5" font-size="11" fill="#dc2626">C(∞)=1</text>

    <!-- Rotation arrow -->
    <path d="M 70 -70 A 100 100 0 0 1 95 -30" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="95" y="-55" font-size="11" fill="#7c3aed" font-style="italic">rotation</text>

    <!-- Multiplication label -->
    <text x="0" y="-135" text-anchor="middle" font-family="serif" font-size="14" fill="#475569">
      <tspan font-style="italic">multiplication on S¹</tspan>
    </text>
  </g>

  <!-- Arrow: Cayley Transform -->
  <g>
    <path d="M 280 230 C 350 180, 430 180, 490 230" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="385" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2563eb" font-weight="bold">C(x) = (x−i)/(x+i)</text>
    <text x="385" y="210" text-anchor="middle" font-family="serif" font-size="12" fill="#2563eb">Cayley Transform</text>
  </g>

  <!-- Arrow: Inverse -->
  <g>
    <path d="M 490 340 C 430 390, 350 390, 280 340" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
    <text x="385" y="400" text-anchor="middle" font-family="serif" font-size="13" fill="#7c3aed">C⁻¹(z) = i(1−z)/(1+z)</text>
  </g>

  <!-- Key insight box -->
  <rect x="150" y="430" width="500" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="400" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1e40af" font-weight="bold">Key Insight: C conjugates SPB to multiplication</text>
  <text x="400" y="468" text-anchor="middle" font-family="serif" font-size="12" fill="#1e40af">C(spb(x,y)) = C(x) · C(y)  —  The SPB IS the circle group in disguise</text>
</svg>
