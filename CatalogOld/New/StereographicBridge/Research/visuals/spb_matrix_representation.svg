<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="800" height="450" fill="#faf8f0"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">
    SPB as Matrix Multiplication
  </text>

  <!-- SPB formula -->
  <rect x="50" y="60" width="300" height="80" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="200" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">SPB Operation</text>
  <text x="200" y="115" text-anchor="middle" font-size="16" fill="#2c3e50">spb(a, b) = (a+b)/(1−ab)</text>

  <!-- Arrow -->
  <path d="M355 100 L445 100" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="400" y="90" text-anchor="middle" font-size="12" fill="#e74c3c">encode</text>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Matrix formula -->
  <rect x="450" y="60" width="300" height="80" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Matrix Form</text>
  <text x="600" y="115" text-anchor="middle" font-size="16" fill="#2c3e50">M(a) = [ 1  a ; −a  1 ]</text>

  <!-- Composition rule -->
  <rect x="100" y="170" width="600" height="100" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="400" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#f39c12">Composition = Matrix Multiplication</text>
  <text x="400" y="225" text-anchor="middle" font-size="14" fill="#2c3e50">
    M(a) · M(b) = [ 1−ab  a+b ; −(a+b)  1−ab ]
  </text>
  <text x="400" y="250" text-anchor="middle" font-size="12" fill="#7f8c8d">
    Entry (0,1) / Entry (0,0) = (a+b)/(1−ab) = spb(a, b)
  </text>

  <!-- Properties -->
  <rect x="50" y="300" width="220" height="130" rx="8" fill="#f5eef8" stroke="#8e44ad" stroke-width="2"/>
  <text x="160" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e44ad">Determinant</text>
  <text x="160" y="350" text-anchor="middle" font-size="13" fill="#2c3e50">det(M(a)) = 1 + a²</text>
  <text x="160" y="375" text-anchor="middle" font-size="12" fill="#27ae60">Always positive! ✓</text>
  <text x="160" y="400" text-anchor="middle" font-size="12" fill="#7f8c8d">det(M(a)·M(b))</text>
  <text x="160" y="420" text-anchor="middle" font-size="12" fill="#7f8c8d">= (1+a²)(1+b²)</text>

  <rect x="290" y="300" width="220" height="130" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">Trace</text>
  <text x="400" y="350" text-anchor="middle" font-size="13" fill="#2c3e50">tr(M(a)) = 2</text>
  <text x="400" y="375" text-anchor="middle" font-size="12" fill="#e74c3c">Independent of a! ✓</text>
  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#7f8c8d">Eigenvalues: 1 ± ia</text>
  <text x="400" y="420" text-anchor="middle" font-size="12" fill="#7f8c8d">(always on unit circle)</text>

  <rect x="530" y="300" width="220" height="130" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="640" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Inverse</text>
  <text x="640" y="350" text-anchor="middle" font-size="13" fill="#2c3e50">M(a)·M(−a) = (1+a²)·I</text>
  <text x="640" y="375" text-anchor="middle" font-size="12" fill="#2c3e50">So M(a)⁻¹ = M(−a)/(1+a²)</text>
  <text x="640" y="400" text-anchor="middle" font-size="12" fill="#7f8c8d">Normalized: rotation</text>
  <text x="640" y="420" text-anchor="middle" font-size="12" fill="#7f8c8d">by angle arctan(a)</text>
</svg>
