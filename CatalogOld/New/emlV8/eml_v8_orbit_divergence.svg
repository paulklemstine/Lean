<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">Orbit Divergence of d(z) = eᶻ − ln z</text>
  <text x="400" y="55" text-anchor="middle" fill="#94a3b8" font-size="13">Every orbit escapes to infinity — at least linearly, actually super-exponentially</text>

  <!-- Axes -->
  <line x1="80" y1="380" x2="750" y2="380" stroke="#475569" stroke-width="1"/>
  <line x1="80" y1="380" x2="80" y2="80" stroke="#475569" stroke-width="1"/>
  <text x="415" y="410" text-anchor="middle" fill="#94a3b8" font-size="12">Iteration n</text>
  <text x="40" y="230" text-anchor="middle" fill="#94a3b8" font-size="12" transform="rotate(-90, 40, 230)">dⁿ(z)</text>

  <!-- n axis labels -->
  <text x="80" y="400" text-anchor="middle" fill="#64748b" font-size="11">0</text>
  <text x="200" y="400" text-anchor="middle" fill="#64748b" font-size="11">1</text>
  <text x="320" y="400" text-anchor="middle" fill="#64748b" font-size="11">2</text>
  <text x="440" y="400" text-anchor="middle" fill="#64748b" font-size="11">3</text>
  <text x="560" y="400" text-anchor="middle" fill="#64748b" font-size="11">4</text>
  <text x="680" y="400" text-anchor="middle" fill="#64748b" font-size="11">5</text>

  <!-- Linear lower bound line: z + n, starting from z=1 -->
  <polyline points="80,340 200,320 320,300 440,280 560,260 680,240"
    fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="700" y="238" fill="#94a3b8" font-size="11">z + n (linear)</text>

  <!-- Orbit from z=1: 1 → 2.72 → ~12.85 → overflow -->
  <polyline points="80,340 200,260 320,95"
    fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="80" cy="340" r="4" fill="#f59e0b"/>
  <circle cx="200" cy="260" r="4" fill="#f59e0b"/>
  <circle cx="320" cy="95" r="4" fill="#f59e0b"/>
  <text x="90" y="355" fill="#fbbf24" font-size="11">z₀ = 1</text>
  <text x="210" y="255" fill="#fbbf24" font-size="10">e ≈ 2.72</text>
  <text x="330" y="92" fill="#fbbf24" font-size="10">~12.85 → ∞</text>

  <!-- Orbit from z=0.5 -->
  <polyline points="80,350 200,198 320,85"
    fill="none" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="80" cy="350" r="4" fill="#10b981"/>
  <circle cx="200" cy="198" r="4" fill="#10b981"/>
  <circle cx="320" cy="85" r="4" fill="#10b981"/>
  <text x="90" y="365" fill="#34d399" font-size="11">z₀ = 0.5</text>
  <text x="210" y="193" fill="#34d399" font-size="10">~2.34</text>

  <!-- Orbit from z=2 -->
  <polyline points="80,320 200,130"
    fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="80" cy="320" r="4" fill="#8b5cf6"/>
  <circle cx="200" cy="130" r="4" fill="#8b5cf6"/>
  <text x="90" y="315" fill="#a78bfa" font-size="11">z₀ = 2</text>
  <text x="210" y="125" fill="#a78bfa" font-size="10">~6.69 → ∞</text>

  <!-- Key results box -->
  <rect x="420" y="80" width="340" height="180" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="590" y="105" text-anchor="middle" fill="#3b82f6" font-size="15" font-weight="bold">Proven Results (V8)</text>

  <text x="435" y="130" fill="#93c5fd" font-size="12">✓ d(z) &gt; z for all z ∈ ℝ</text>
  <text x="435" y="150" fill="#93c5fd" font-size="12">✓ d(z) ≥ z + 1 for all z ∈ ℝ</text>
  <text x="435" y="170" fill="#93c5fd" font-size="12">✓ d(z) ≥ 2 for z &gt; 0</text>
  <text x="435" y="190" fill="#93c5fd" font-size="12">✓ dⁿ(z) ≥ z + n (linear bound)</text>
  <text x="435" y="210" fill="#93c5fd" font-size="12">✓ Orbits strictly monotone increasing</text>
  <text x="435" y="235" fill="#60a5fa" font-size="11" font-weight="bold">Actual growth: SUPER-EXPONENTIAL</text>
  <text x="435" y="252" fill="#60a5fa" font-size="11" font-weight="bold">Faster than any fixed tower!</text>

  <!-- Arrow showing explosion -->
  <path d="M 340 90 C 360 60, 380 50, 400 45" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#redarrow)"/>
  <defs>
    <marker id="redarrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>
  <text x="410" y="42" fill="#ef4444" font-size="12" font-weight="bold">→ ∞ (overflow!)</text>

  <!-- Bottom info -->
  <rect x="80" y="425" width="670" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="415" y="448" text-anchor="middle" fill="#e2e8f0" font-size="13">
    The diagonal map d(z) = exp(z) − ln(z) has no fixed points. Every real orbit
  </text>
  <text x="415" y="468" text-anchor="middle" fill="#e2e8f0" font-size="13">
    diverges to +∞ super-exponentially. The g-map g(z) = e − ln(z) converges to z* ≈ 2.017.
  </text>
</svg>
