<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1a237e" font-weight="bold">
    Q24 Resolved: Iterated Softplus Growth Rate
  </text>
  <text x="400" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#455a64">
    σⁿ(0) = log(n+1) — Logarithmic, not linear!
  </text>

  <!-- Axes -->
  <line x1="80" y1="380" x2="750" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="380" x2="80" y2="80" stroke="#333" stroke-width="2"/>
  <text x="415" y="410" text-anchor="middle" font-family="monospace" font-size="13" fill="#333">n (iterations)</text>
  <text x="30" y="230" text-anchor="middle" font-family="monospace" font-size="13" fill="#333" transform="rotate(-90, 30, 230)">σⁿ(0)</text>

  <!-- Grid lines -->
  <g stroke="#ddd" stroke-width="0.5">
    <line x1="80" y1="320" x2="750" y2="320"/>
    <line x1="80" y1="260" x2="750" y2="260"/>
    <line x1="80" y1="200" x2="750" y2="200"/>
    <line x1="80" y1="140" x2="750" y2="140"/>
  </g>

  <!-- Y-axis labels -->
  <text x="70" y="384" text-anchor="end" font-family="monospace" font-size="11" fill="#666">0</text>
  <text x="70" y="324" text-anchor="end" font-family="monospace" font-size="11" fill="#666">1</text>
  <text x="70" y="264" text-anchor="end" font-family="monospace" font-size="11" fill="#666">2</text>
  <text x="70" y="204" text-anchor="end" font-family="monospace" font-size="11" fill="#666">3</text>
  <text x="70" y="144" text-anchor="end" font-family="monospace" font-size="11" fill="#666">4</text>

  <!-- X-axis labels -->
  <text x="80" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">0</text>
  <text x="214" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">10</text>
  <text x="348" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">20</text>
  <text x="482" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">30</text>
  <text x="616" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">40</text>
  <text x="750" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#666">50</text>

  <!-- Upper bound: (n+1)·log 2 — linear, shown as red dashed -->
  <line x1="80" y1="339" x2="750" y2="-1600" stroke="#e53935" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <!-- Clipped with viewport, but the slope makes it go very high -->

  <!-- Actual σⁿ(0) curve (approximated by log(n+1)) -->
  <!-- Points: n=0→0, n=1→0.693, n=2→1.099, n=5→1.792, n=10→2.398, n=20→3.045, n=50→3.932 -->
  <!-- Scale: x = 80 + 13.4*n, y = 380 - 60*val -->
  <polyline fill="none" stroke="#1565c0" stroke-width="3" filter="url(#glow)"
    points="80,380 93,338.4 107,314.1 120,297.2 134,283.4 147,272.7 161,264 174,256.9 187,251 201,245.9 214,236.1 281,217.3 348,197.3 415,183.5 482,172.4 549,163.8 616,156.7 683,150.9 750,144.1"/>

  <!-- log(n+1) reference curve (green dashed) -->
  <polyline fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8,4"
    points="80,380 93,338.4 107,314.1 120,297.2 134,283.4 147,272.7 161,264 174,256.9 187,251 201,245.9 214,236.1 281,217.3 348,197.3 415,183.5 482,172.4 549,163.8 616,156.7 683,150.9 750,144.1"/>

  <!-- Data points -->
  <g fill="#1565c0">
    <circle cx="80" cy="380" r="4"/>
    <circle cx="93" cy="338.4" r="4"/>
    <circle cx="107" cy="314.1" r="4"/>
    <circle cx="120" cy="297.2" r="4"/>
    <circle cx="134" cy="283.4" r="4"/>
    <circle cx="214" cy="236.1" r="4"/>
    <circle cx="348" cy="197.3" r="4"/>
    <circle cx="482" cy="172.4" r="4"/>
    <circle cx="750" cy="144.1" r="3"/>
  </g>

  <!-- Labels -->
  <rect x="500" y="80" width="250" height="110" rx="6" fill="white" stroke="#1565c0" stroke-width="1.5" opacity="0.95"/>
  <circle cx="520" cy="100" r="5" fill="#1565c0"/>
  <text x="535" y="105" font-family="monospace" font-size="12" fill="#1565c0">σⁿ(0) (computed)</text>
  <line x1="515" y1="125" x2="545" y2="125" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="555" y="130" font-family="monospace" font-size="12" fill="#2e7d32">log(n+1)</text>
  <line x1="515" y1="150" x2="545" y2="150" stroke="#e53935" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="555" y="155" font-family="monospace" font-size="12" fill="#e53935">(n+1)·log 2</text>
  <text x="555" y="175" font-family="monospace" font-size="11" fill="#666">(proved upper bound)</text>

  <!-- Key result box -->
  <rect x="100" y="415" width="600" height="28" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="400" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1b5e20" font-weight="bold">
    Discovery: σⁿ(0) = log(n+1) exactly! Growth is O(log n), not O(n).
  </text>
</svg>
