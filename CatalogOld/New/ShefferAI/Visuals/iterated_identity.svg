<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <rect width="700" height="350" fill="#fafafa" rx="10"/>

  <text x="350" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1a237e" font-weight="bold">
    σⁿ(0) = log(n+1) — An Exact Dynamical Identity
  </text>
  <text x="350" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#546e7a">
    Formally verified in Lean 4 (softplus_iter_zero_eq)
  </text>

  <!-- The chain of equalities -->
  <rect x="30" y="75" width="640" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>

  <text x="350" y="105" text-anchor="middle" font-family="monospace" font-size="16" fill="#1b5e20">
    σ⁰(0) = 0 = log(1)
  </text>
  <text x="350" y="130" text-anchor="middle" font-family="monospace" font-size="16" fill="#1b5e20">
    σ¹(0) = log 2    σ²(0) = log 3    σ³(0) = log 4
  </text>
  <text x="350" y="155" text-anchor="middle" font-family="monospace" font-size="16" fill="#1b5e20">
    σ¹⁰(0) = log 11   σ¹⁰⁰(0) = log 101   σⁿ(0) = log(n+1)
  </text>

  <!-- Proof sketch -->
  <rect x="30" y="195" width="300" height="130" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="180" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#0d47a1" font-weight="bold">Proof (induction)</text>

  <text x="45" y="245" font-family="monospace" font-size="12" fill="#333">Base: σ⁰(0) = 0 = log 1 ✓</text>
  <text x="45" y="270" font-family="monospace" font-size="12" fill="#333">Step: σⁿ⁺¹(0) = σ(log(n+1))</text>
  <text x="45" y="295" font-family="monospace" font-size="12" fill="#333"> = log(1 + eˡᵒᵍ⁽ⁿ⁺¹⁾)</text>
  <text x="45" y="315" font-family="monospace" font-size="12" fill="#333"> = log(1 + n + 1) = log(n+2) ✓</text>

  <!-- Key insight -->
  <rect x="360" y="195" width="310" height="130" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="515" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e65100" font-weight="bold">Key Insight</text>

  <text x="375" y="248" font-family="Georgia, serif" font-size="13" fill="#333">The key step is algebraic:</text>
  <text x="375" y="273" font-family="monospace" font-size="13" fill="#e65100">σ(log(n+1))</text>
  <text x="375" y="298" font-family="monospace" font-size="13" fill="#e65100"> = log(1 + (n+1))</text>
  <text x="375" y="323" font-family="monospace" font-size="13" fill="#e65100"> = log(n+2) ✓</text>
</svg>
