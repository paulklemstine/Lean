<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#fafafa" rx="10"/>

  <text x="400" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1a237e" font-weight="bold">
    Softplus and Sigmoid as Diffeomorphisms
  </text>

  <!-- Left: Softplus bijection -->
  <rect x="30" y="55" width="350" height="310" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="205" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#0d47a1" font-weight="bold">σ : ℝ → (0, ∞)</text>

  <!-- Domain ℝ -->
  <rect x="60" y="100" width="120" height="50" rx="8" fill="#bbdefb"/>
  <text x="120" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#0d47a1">ℝ</text>

  <!-- Arrow right -->
  <line x1="180" y1="125" x2="230" y2="125" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="118" text-anchor="middle" font-family="monospace" font-size="11" fill="#1565c0">σ</text>

  <!-- Codomain (0,∞) -->
  <rect x="230" y="100" width="120" height="50" rx="8" fill="#bbdefb"/>
  <text x="290" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#0d47a1">(0, ∞)</text>

  <!-- Arrow left (inverse) -->
  <line x1="230" y1="150" x2="180" y2="150" stroke="#e53935" stroke-width="2" marker-end="url(#arrowR)" stroke-dasharray="4"/>
  <text x="205" y="167" text-anchor="middle" font-family="monospace" font-size="11" fill="#e53935">σ⁻¹</text>

  <!-- Formulas -->
  <text x="205" y="205" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">σ(x) = log(1 + eˣ)</text>
  <text x="205" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#e53935">σ⁻¹(y) = log(eʸ − 1)</text>

  <!-- Properties -->
  <text x="205" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1b5e20">✓ σ(σ⁻¹(y)) = y for y > 0</text>
  <text x="205" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1b5e20">✓ σ⁻¹(σ(x)) = x for all x</text>
  <text x="205" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1b5e20">✓ C∞ diffeomorphism</text>
  <text x="205" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1b5e20">✓ Strictly monotone</text>
  <text x="205" y="350" text-anchor="middle" font-family="monospace" font-size="11" fill="#546e7a">Lean: softplus_left_inverse</text>
  <text x="205" y="365" text-anchor="middle" font-family="monospace" font-size="11" fill="#546e7a">      softplus_right_inverse</text>

  <!-- Right: Sigmoid bijection -->
  <rect x="420" y="55" width="350" height="310" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="595" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c62828" font-weight="bold">S : ℝ → (0, 1)</text>

  <!-- Domain ℝ -->
  <rect x="450" y="100" width="120" height="50" rx="8" fill="#ffcdd2"/>
  <text x="510" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#c62828">ℝ</text>

  <!-- Arrow right -->
  <line x1="570" y1="125" x2="620" y2="125" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="118" text-anchor="middle" font-family="monospace" font-size="11" fill="#c62828">S</text>

  <!-- Codomain (0,1) -->
  <rect x="620" y="100" width="120" height="50" rx="8" fill="#ffcdd2"/>
  <text x="680" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#c62828">(0, 1)</text>

  <!-- Arrow left (inverse) -->
  <line x1="620" y1="150" x2="570" y2="150" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowR)" stroke-dasharray="4"/>
  <text x="595" y="167" text-anchor="middle" font-family="monospace" font-size="11" fill="#1565c0">logit</text>

  <!-- Formulas -->
  <text x="595" y="205" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">S(x) = eˣ/(1 + eˣ)</text>
  <text x="595" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#1565c0">logit(p) = log(p/(1−p))</text>

  <!-- Properties -->
  <text x="595" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1b5e20">✓ S(logit(p)) = p for p∈(0,1)</text>
  <text x="595" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1b5e20">✓ logit(S(x)) = x for all x</text>
  <text x="595" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1b5e20">✓ C∞ diffeomorphism</text>
  <text x="595" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1b5e20">✓ S'(x) = S(x)(1−S(x))</text>
  <text x="595" y="350" text-anchor="middle" font-family="monospace" font-size="11" fill="#546e7a">Lean: logit_sigmoid_inverse</text>
  <text x="595" y="365" text-anchor="middle" font-family="monospace" font-size="11" fill="#546e7a">      sigmoid_logit_inverse</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#333"/>
    </marker>
  </defs>
</svg>
