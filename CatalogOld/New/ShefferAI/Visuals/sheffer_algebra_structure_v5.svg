<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500">
  <defs>
    <filter id="sh">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="850" height="500" fill="#fafafa" rx="10"/>

  <text x="425" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1a237e" font-weight="bold">
    The Sheffer Algebra: Complete Structural Picture (v5)
  </text>

  <!-- Central: ShefferAlg -->
  <rect x="300" y="60" width="250" height="100" rx="15" fill="#c8e6c9" stroke="#1b5e20" stroke-width="3" filter="url(#sh)"/>
  <text x="425" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1b5e20" font-weight="bold">ShefferAlg</text>
  <text x="425" y="118" text-anchor="middle" font-family="monospace" font-size="11" fill="#2e7d32">Generated by σ(x) = log(1+eˣ)</text>
  <text x="425" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#2e7d32">∞-dimensional vector space</text>

  <!-- IS properties (left) -->
  <rect x="20" y="200" width="200" height="260" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" filter="url(#sh)"/>
  <text x="120" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1b5e20" font-weight="bold">✓ IS</text>

  <text x="35" y="255" font-family="monospace" font-size="12" fill="#333">• Vector space (ℝ)</text>
  <text x="35" y="280" font-family="monospace" font-size="12" fill="#333">• Composition monoid</text>
  <text x="35" y="305" font-family="monospace" font-size="12" fill="#333">• ⊆ C∞(ℝ)</text>
  <text x="35" y="330" font-family="monospace" font-size="12" fill="#333">• ⊆ Lip(ℝ)</text>
  <text x="35" y="355" font-family="monospace" font-size="12" fill="#333">• ∞-dimensional</text>
  <text x="35" y="380" font-family="monospace" font-size="12" fill="#333">• Contains id, const</text>
  <text x="35" y="405" font-family="monospace" font-size="12" fill="#333">• Dense in C(K)</text>
  <text x="35" y="430" font-family="monospace" font-size="12" fill="#333">• |f(x)| ≤ A|x|+B</text>

  <!-- IS NOT properties (right) -->
  <rect x="630" y="200" width="200" height="260" rx="10" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5" filter="url(#sh)"/>
  <text x="730" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c62828" font-weight="bold">✗ IS NOT</text>

  <text x="645" y="255" font-family="monospace" font-size="12" fill="#333">• Ring (no ×)</text>
  <text x="645" y="280" font-family="monospace" font-size="12" fill="#333">• Field</text>
  <text x="645" y="305" font-family="monospace" font-size="12" fill="#333">• Banach algebra</text>
  <text x="645" y="330" font-family="monospace" font-size="12" fill="#333">• Closed under d/dx</text>
  <text x="645" y="355" font-family="monospace" font-size="12" fill="#333">• Containing exp</text>
  <text x="645" y="380" font-family="monospace" font-size="12" fill="#333">• Containing ReLU</text>
  <text x="645" y="405" font-family="monospace" font-size="12" fill="#333">• Containing sin</text>
  <text x="645" y="430" font-family="monospace" font-size="11" fill="#999">(conjectured)</text>

  <!-- Arrows -->
  <line x1="300" y1="130" x2="220" y2="200" stroke="#2e7d32" stroke-width="2"/>
  <line x1="550" y1="130" x2="630" y2="200" stroke="#c62828" stroke-width="2"/>

  <!-- Key functions in the algebra -->
  <rect x="260" y="200" width="330" height="260" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="425" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#0d47a1" font-weight="bold">Key Members</text>

  <text x="275" y="255" font-family="monospace" font-size="12" fill="#1565c0">σ(x) = log(1+eˣ)</text>
  <text x="275" y="280" font-family="monospace" font-size="12" fill="#1565c0">x = σ(x) - σ(-x)</text>
  <text x="275" y="305" font-family="monospace" font-size="12" fill="#1565c0">ax + b (all affine)</text>
  <text x="275" y="330" font-family="monospace" font-size="12" fill="#1565c0">σⁿ(x) (all iterates)</text>
  <text x="275" y="355" font-family="monospace" font-size="12" fill="#1565c0">σ(x+c) (translates)</text>
  <text x="275" y="380" font-family="monospace" font-size="12" fill="#1565c0">ασ(ax+b)+βσ(cx+d)+γ</text>

  <text x="425" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#0d47a1" font-style="italic">
    Key identity: σⁿ(0) = log(n+1)
  </text>
  <text x="425" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#0d47a1" font-style="italic">
    No fixed point: σ(x) > x always
  </text>

  <!-- Bottom: theorem count -->
  <rect x="200" y="475" width="450" height="20" rx="10" fill="#263238"/>
  <text x="425" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#b2dfdb" font-weight="bold">
    118+ theorems • 0 sorry • 8 Lean files • Machine verified
  </text>
</svg>
