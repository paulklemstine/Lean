<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#00ffcc" font-size="22" font-weight="bold" font-family="Arial">
    The Smoothness Barrier
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#88aacc" font-size="13" font-family="Arial">
    Every Sheffer expression defines a differentiable (smooth) function
  </text>

  <!-- Two panels -->
  <!-- Left: Softplus (smooth) -->
  <rect x="30" y="75" width="355" height="200" rx="10" fill="#0d1b2a" stroke="#00ffcc" stroke-width="1.5"/>
  <text x="207" y="98" text-anchor="middle" fill="#00ffcc" font-size="16" font-weight="bold">σ(x) = log(1 + eˣ)</text>
  <text x="207" y="115" text-anchor="middle" fill="#66ddaa" font-size="12">✓ In Sheffer Algebra</text>

  <!-- Softplus curve -->
  <polyline points="60,260 80,258 100,254 120,247 140,237 160,225 180,212 200,198 220,184 240,170 260,156 280,142 300,128 320,114 340,100" 
            fill="none" stroke="#00ffcc" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Smooth derivative indicator -->
  <text x="207" y="285" text-anchor="middle" fill="#aaddcc" font-size="11">σ'(x) = S(x) — smooth everywhere</text>

  <!-- Right: ReLU (kinked) -->
  <rect x="415" y="75" width="355" height="200" rx="10" fill="#1b0d0d" stroke="#ff4444" stroke-width="1.5"/>
  <text x="592" y="98" text-anchor="middle" fill="#ff6666" font-size="16" font-weight="bold">ReLU(x) = max(0, x)</text>
  <text x="592" y="115" text-anchor="middle" fill="#ff8888" font-size="12">✗ NOT in Sheffer Algebra</text>

  <!-- ReLU curve -->
  <polyline points="445,200 465,200 485,200 505,200 525,200 545,200 565,200 585,185 605,170 625,155 645,140 665,125 685,110 705,95 725,80"
            fill="none" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Kink indicator -->
  <circle cx="565" cy="200" r="5" fill="#ff4444" stroke="#ffcc00" stroke-width="2"/>
  <text x="565" y="220" text-anchor="middle" fill="#ffcc00" font-size="11">← Kink at x=0</text>
  <text x="592" y="285" text-anchor="middle" fill="#ff8888" font-size="11">ReLU'(0) undefined — not differentiable</text>

  <!-- Exclusion diagram -->
  <rect x="30" y="300" width="740" height="180" rx="10" fill="#0a0a1e" stroke="#4488ff" stroke-width="1"/>
  <text x="400" y="325" text-anchor="middle" fill="#4488ff" font-size="16" font-weight="bold">
    Two-Barrier Exclusion System
  </text>

  <!-- Lipschitz barrier -->
  <rect x="50" y="340" width="330" height="120" rx="8" fill="#1a0a2a" stroke="#cc44ff" stroke-width="1"/>
  <text x="215" y="360" text-anchor="middle" fill="#cc44ff" font-size="14" font-weight="bold">Lipschitz Barrier</text>
  <text x="215" y="380" text-anchor="middle" fill="#aa88cc" font-size="11">Unbounded derivative → excluded</text>
  <text x="60" y="400" fill="#ff6666" font-size="12">✗ exp(x)</text>
  <text x="160" y="400" fill="#ff6666" font-size="12">✗ x²</text>
  <text x="250" y="400" fill="#ff6666" font-size="12">✗ sinh(x)</text>
  <text x="60" y="420" fill="#ff6666" font-size="12">✗ cosh(x)</text>
  <text x="160" y="420" fill="#ff6666" font-size="12">✗ x³</text>
  <text x="250" y="420" fill="#ff6666" font-size="12">✗ tan(x)</text>
  <text x="215" y="450" text-anchor="middle" fill="#888" font-size="10">Any f with sup|f'| = ∞</text>

  <!-- Smoothness barrier -->
  <rect x="420" y="340" width="330" height="120" rx="8" fill="#1a1a0a" stroke="#ffcc00" stroke-width="1"/>
  <text x="585" y="360" text-anchor="middle" fill="#ffcc00" font-size="14" font-weight="bold">Smoothness Barrier</text>
  <text x="585" y="380" text-anchor="middle" fill="#ccaa44" font-size="11">Not differentiable → excluded</text>
  <text x="430" y="400" fill="#ff6666" font-size="12">✗ |x|</text>
  <text x="520" y="400" fill="#ff6666" font-size="12">✗ max(0,x)</text>
  <text x="640" y="400" fill="#ff6666" font-size="12">✗ sign(x)</text>
  <text x="430" y="420" fill="#ff6666" font-size="12">✗ ⌊x⌋</text>
  <text x="520" y="420" fill="#ff6666" font-size="12">✗ Heaviside</text>
  <text x="640" y="420" fill="#ff6666" font-size="12">✗ min(|x|,1)</text>
  <text x="585" y="450" text-anchor="middle" fill="#888" font-size="10">Any f with a non-differentiable point</text>
</svg>
