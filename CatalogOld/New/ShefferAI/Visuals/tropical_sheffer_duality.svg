<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="smoothGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#44bd64;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffa502;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">Tropical-Sheffer Duality</text>
  <text x="400" y="65" text-anchor="middle" fill="#aaa" font-size="13">σ_β(x) = (1/β)·log(1 + e^{βx}) → max(0, x) as β → ∞</text>

  <!-- Axes -->
  <g transform="translate(120, 280)">
    <!-- x-axis -->
    <line x1="0" y1="0" x2="550" y2="0" stroke="#555" stroke-width="1.5"/>
    <text x="560" y="5" fill="#888" font-size="12">x</text>
    <!-- y-axis -->
    <line x1="275" y1="-200" x2="275" y2="120" stroke="#555" stroke-width="1.5"/>
    <text x="280" y="-205" fill="#888" font-size="12">y</text>

    <!-- Grid -->
    <line x1="0" y1="-200" x2="550" y2="-200" stroke="#333" stroke-width="0.5" stroke-dasharray="3"/>
    <line x1="0" y1="-100" x2="550" y2="-100" stroke="#333" stroke-width="0.5" stroke-dasharray="3"/>
    <line x1="0" y1="100" x2="550" y2="100" stroke="#333" stroke-width="0.5" stroke-dasharray="3"/>

    <!-- ReLU (β → ∞) -->
    <polyline points="0,0 275,0 550,-200" fill="none" stroke="url(#tropGrad)" stroke-width="3" stroke-dasharray="8,4"/>

    <!-- Softplus β=1 -->
    <path d="M 0,3 C 50,-2 100,-5 150,-10 C 180,-16 210,-28 230,-42 C 250,-58 260,-72 275,-80
             C 290,-88 310,-98 330,-110 C 360,-128 400,-150 450,-172 C 500,-190 530,-197 550,-200"
          fill="none" stroke="url(#smoothGrad)" stroke-width="2.5"/>

    <!-- Softplus β=0.5 (smoother) -->
    <path d="M 0,-25 C 50,-28 100,-34 150,-42 C 200,-54 230,-65 260,-78
             C 280,-88 290,-94 310,-105 C 340,-120 380,-140 420,-158 C 470,-178 520,-195 550,-200"
          fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5"/>

    <!-- Softplus β=3 (sharper) -->
    <path d="M 0,0 C 100,0 200,0 250,-5 C 265,-15 270,-30 275,-45
             C 280,-60 285,-75 300,-95 C 330,-125 400,-165 480,-192 C 520,-198 540,-200 550,-200"
          fill="none" stroke="#44bd64" stroke-width="1.5" opacity="0.5"/>

    <!-- Labels on axes -->
    <text x="275" y="18" text-anchor="middle" fill="#888" font-size="11">0</text>
    <text x="410" y="18" text-anchor="middle" fill="#888" font-size="11">2</text>
    <text x="140" y="18" text-anchor="middle" fill="#888" font-size="11">-2</text>
  </g>

  <!-- Legend -->
  <g transform="translate(530, 100)">
    <rect x="0" y="0" width="240" height="130" rx="8" fill="rgba(0,0,0,0.4)" stroke="#444"/>
    <line x1="15" y1="25" x2="50" y2="25" stroke="#4ecdc4" stroke-width="2.5"/>
    <text x="60" y="29" fill="#ddd" font-size="12">σ₁(x) = log(1+eˣ)</text>

    <line x1="15" y1="50" x2="50" y2="50" stroke="#44bd64" stroke-width="1.5" opacity="0.5"/>
    <text x="60" y="54" fill="#aaa" font-size="12">σ₃(x), β = 3</text>

    <line x1="15" y1="75" x2="50" y2="75" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5"/>
    <text x="60" y="79" fill="#aaa" font-size="12">σ₀.₅(x), β = 0.5</text>

    <line x1="15" y1="100" x2="50" y2="100" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="60" y="104" fill="#ff9999" font-size="12">ReLU = max(0,x)</text>
  </g>

  <!-- Arrow showing limit -->
  <g transform="translate(400, 430)">
    <text x="0" y="0" text-anchor="middle" fill="#ffa502" font-size="16" font-weight="bold">β → ∞</text>
    <text x="0" y="22" text-anchor="middle" fill="#aaa" font-size="12">Smooth Analysis → Tropical Geometry</text>
    <text x="0" y="42" text-anchor="middle" fill="#888" font-size="11">Sheffer Algebra → Tropical Semiring</text>
  </g>

  <!-- Annotation boxes -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="180" height="55" rx="6" fill="rgba(78,205,196,0.15)" stroke="#4ecdc4" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" fill="#4ecdc4" font-size="12" font-weight="bold">Smooth World</text>
    <text x="90" y="38" text-anchor="middle" fill="#aaa" font-size="10">Differentiable, convex</text>
    <text x="90" y="50" text-anchor="middle" fill="#aaa" font-size="10">Gradient-friendly</text>
  </g>

  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="180" height="55" rx="6" fill="rgba(255,107,107,0.15)" stroke="#ff6b6b" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">Tropical World</text>
    <text x="90" y="38" text-anchor="middle" fill="#aaa" font-size="10">Piecewise linear</text>
    <text x="90" y="50" text-anchor="middle" fill="#aaa" font-size="10">Combinatorial</text>
  </g>
</svg>
