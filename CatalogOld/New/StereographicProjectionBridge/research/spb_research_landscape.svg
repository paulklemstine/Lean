<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="#0d1117"/>

  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#e6edf3">
    SPB Research Landscape — 35 Open Directions
  </text>
  <text x="700" y="65" text-anchor="middle" font-size="14" fill="#8b949e">
    Organized by field · Sized by impact · Colored by feasibility
  </text>

  <!-- Legend -->
  <circle cx="100" cy="960" r="8" fill="#3fb950" opacity="0.8"/>
  <text x="115" y="964" font-size="12" fill="#8b949e">HIGH feasibility</text>
  <circle cx="280" cy="960" r="8" fill="#d29922" opacity="0.8"/>
  <text x="295" y="964" font-size="12" fill="#8b949e">MEDIUM feasibility</text>
  <circle cx="480" cy="960" r="8" fill="#f85149" opacity="0.8"/>
  <text x="495" y="964" font-size="12" fill="#8b949e">LOW feasibility</text>
  <text x="700" y="964" font-size="12" fill="#8b949e">Circle size = Impact (★ to ★★★)</text>

  <!-- PURE MATHEMATICS cluster -->
  <text x="250" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#79c0ff">Pure Mathematics</text>
  <rect x="50" y="90" width="400" height="5" rx="2" fill="#79c0ff" opacity="0.3"/>

  <!-- 1. Higher-Dim SPB ★★★ HIGH -->
  <circle cx="150" cy="180" r="30" fill="#3fb950" opacity="0.6" filter="url(#glow)"/>
  <text x="150" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#e6edf3">#1 Higher</text>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#e6edf3">Dim SPB</text>

  <!-- 2. F_p Order ★★★ HIGH -->
  <circle cx="280" cy="180" r="30" fill="#3fb950" opacity="0.6" filter="url(#glow)"/>
  <text x="280" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#e6edf3">#2 F_p</text>
  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#e6edf3">p±1 Law</text>

  <!-- 3. Cocycle ★★ MEDIUM -->
  <circle cx="380" cy="180" r="20" fill="#d29922" opacity="0.6"/>
  <text x="380" y="184" text-anchor="middle" font-size="9" fill="#e6edf3">#3 Cocycle</text>

  <!-- 4. Complexity ★★ MEDIUM -->
  <circle cx="120" cy="270" r="20" fill="#d29922" opacity="0.6"/>
  <text x="120" y="274" text-anchor="middle" font-size="9" fill="#e6edf3">#4 K_SPB</text>

  <!-- 5. Trees ★ MEDIUM -->
  <circle cx="200" cy="270" r="14" fill="#d29922" opacity="0.6"/>
  <text x="200" y="274" text-anchor="middle" font-size="8" fill="#e6edf3">#5</text>

  <!-- 6. Modular ★ LOW -->
  <circle cx="270" cy="270" r="14" fill="#f85149" opacity="0.6"/>
  <text x="270" y="274" text-anchor="middle" font-size="8" fill="#e6edf3">#6</text>

  <!-- 7. Tropical ★ HIGH -->
  <circle cx="340" cy="270" r="14" fill="#3fb950" opacity="0.6"/>
  <text x="340" y="274" text-anchor="middle" font-size="8" fill="#e6edf3">#7</text>

  <!-- 8. p-adic ★★ MEDIUM -->
  <circle cx="410" cy="270" r="20" fill="#d29922" opacity="0.6"/>
