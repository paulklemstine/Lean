  <!-- 31-34 -->
  <circle cx="1120" cy="500" r="14" fill="#f85149" opacity="0.4"/>
  <text x="1120" y="504" text-anchor="middle" font-size="8" fill="#8b949e">#31 Lang</text>

  <circle cx="1190" cy="500" r="14" fill="#f85149" opacity="0.4"/>
  <text x="1190" y="504" text-anchor="middle" font-size="8" fill="#8b949e">#32 QFT</text>

  <circle cx="1260" cy="500" r="14" fill="#f85149" opacity="0.4"/>
  <text x="1260" y="504" text-anchor="middle" font-size="8" fill="#8b949e">#33 TQC</text>

  <circle cx="1330" cy="500" r="14" fill="#d29922" opacity="0.4"/>
