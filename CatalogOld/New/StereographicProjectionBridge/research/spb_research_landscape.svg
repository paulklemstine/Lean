  <text x="250" y="780" text-anchor="middle" font-size="14" font-weight="bold" fill="#79c0ff">8 Pure Math</text>
  <text x="250" y="800" text-anchor="middle" font-size="11" fill="#8b949e">directions</text>

  <text x="470" y="780" text-anchor="middle" font-size="14" font-weight="bold" fill="#d2a8ff">5 Analysis</text>
  <text x="470" y="800" text-anchor="middle" font-size="11" fill="#8b949e">directions</text>

  <text x="690" y="780" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffa657">5 Physics</text>
  <text x="690" y="800" text-anchor="middle" font-size="11" fill="#8b949e">directions</text>

  <text x="910" y="780" text-anchor="middle" font-size="14" font-weight="bold" fill="#7ee787">7 CS/Eng</text>
  <text x="910" y="800" text-anchor="middle" font-size="11" fill="#8b949e">directions</text>

  <text x="1130" y="780" text-anchor="middle" font-size="14" font-weight="bold" fill="#f778ba">10 Cross</text>
  <text x="1130" y="800" text-anchor="middle" font-size="11" fill="#8b949e">directions</text>
</svg>
