  <text x="150" y="514" text-anchor="middle" font-size="9" fill="#e6edf3">#12 CF</text>

  <!-- 13. Fixed Pt ★ HIGH -->
  <circle cx="230" cy="510" r="14" fill="#3fb950" opacity="0.6"/>
  <text x="230" y="514" text-anchor="middle" font-size="8" fill="#e6edf3">#13</text>

