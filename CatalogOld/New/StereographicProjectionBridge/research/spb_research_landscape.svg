  <text x="500" y="640" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFD700">Recommended Priority Path</text>
  <rect x="80" y="660" width="1240" height="60" rx="10" fill="#161b22" stroke="#FFD700" stroke-width="1" opacity="0.8"/>

  <text x="160" y="685" text-anchor="middle" font-size="11" font-weight="bold" fill="#3fb950">Month 1-3</text>
  <text x="160" y="705" text-anchor="middle" font-size="10" fill="#e6edf3">#1 #2 #14 #19</text>

  <text x="340" y="695" text-anchor="middle" font-size="16" fill="#FFD700">→</text>

  <text x="500" y="685" text-anchor="middle" font-size="11" font-weight="bold" fill="#d29922">Month 3-6</text>
  <text x="500" y="705" text-anchor="middle" font-size="10" fill="#e6edf3">#9 #26 #15 #24</text>

  <text x="680" y="695" text-anchor="middle" font-size="16" fill="#FFD700">→</text>

  <text x="860" y="685" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffa657">Month 6-12</text>
  <text x="860" y="705" text-anchor="middle" font-size="10" fill="#e6edf3">★★ items + Lean library</text>

  <text x="1040" y="695" text-anchor="middle" font-size="16" fill="#FFD700">→</text>

  <text x="1200" y="685" text-anchor="middle" font-size="11" font-weight="bold" fill="#f85149">Year 1+</text>
  <text x="1200" y="705" text-anchor="middle" font-size="10" fill="#e6edf3">#31 Langlands, #35 Info Geom</text>

  <!-- Stats bar -->
