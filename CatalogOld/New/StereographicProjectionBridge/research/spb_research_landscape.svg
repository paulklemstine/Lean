  <rect x="550" y="90" width="400" height="5" rx="2" fill="#ffa657" opacity="0.3"/>

  <!-- 14. Thomas ★★★ HIGH -->
  <circle cx="650" cy="180" r="30" fill="#3fb950" opacity="0.6" filter="url(#glow)"/>
  <text x="650" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#e6edf3">#14 Thomas</text>
