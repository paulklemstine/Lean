<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg4)"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#E0E0E0" font-size="24" font-weight="bold">Arithmetic from a Single Instruction</text>
  <text x="400" y="65" text-anchor="middle" fill="#B39DDB" font-size="14">Every arithmetic operation is a composition of EML(a, b) = e^a − ln(b)</text>
  
  <!-- Central EML node -->
  <circle cx="400" cy="250" r="50" fill="none" stroke="#7C4DFF" stroke-width="3"/>
  <text x="400" y="245" text-anchor="middle" fill="#B388FF" font-size="18" font-weight="bold">EML</text>
  <text x="400" y="265" text-anchor="middle" fill="#D1C4E9" font-size="11">e^a − ln(b)</text>
  
  <!-- exp -->
  <rect x="50" y="80" width="180" height="60" rx="8" fill="none" stroke="#4CAF50" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" fill="#A5D6A7" font-size="14" font-weight="bold">exp(x)</text>
  <text x="140" y="125" text-anchor="middle" fill="#81C784" font-size="12">= EML(x, 1)</text>
  <line x1="230" y1="110" x2="360" y2="220" stroke="#4CAF50" stroke-width="1.5"/>
  
  <!-- ln -->
  <rect x="570" y="80" width="180" height="60" rx="8" fill="none" stroke="#FF9800" stroke-width="2"/>
  <text x="660" y="105" text-anchor="middle" fill="#FFCC80" font-size="14" font-weight="bold">ln(x)</text>
  <text x="660" y="125" text-anchor="middle" fill="#FFB74D" font-size="11">= EML(0, exp(EML(0,x)))</text>
  <line x1="570" y1="110" x2="440" y2="220" stroke="#FF9800" stroke-width="1.5"/>
  
  <!-- Subtraction -->
  <rect x="50" y="190" width="180" height="60" rx="8" fill="none" stroke="#2196F3" stroke-width="2"/>
  <text x="140" y="215" text-anchor="middle" fill="#90CAF9" font-size="14" font-weight="bold">a − b</text>
  <text x="140" y="235" text-anchor="middle" fill="#64B5F6" font-size="11">= EML(ln(a), exp(b))</text>
  <line x1="230" y1="220" x2="350" y2="240" stroke="#2196F3" stroke-width="1.5"/>
  
  <!-- Addition -->
  <rect x="570" y="190" width="180" height="60" rx="8" fill="none" stroke="#E91E63" stroke-width="2"/>
  <text x="660" y="215" text-anchor="middle" fill="#F48FB1" font-size="14" font-weight="bold">a + b</text>
  <text x="660" y="235" text-anchor="middle" fill="#F06292" font-size="11">= EML(ln(a), exp(−b))</text>
  <line x1="570" y1="220" x2="450" y2="240" stroke="#E91E63" stroke-width="1.5"/>
  
  <!-- Multiplication -->
  <rect x="50" y="310" width="180" height="60" rx="8" fill="none" stroke="#00BCD4" stroke-width="2"/>
  <text x="140" y="335" text-anchor="middle" fill="#80DEEA" font-size="14" font-weight="bold">a × b</text>
  <text x="140" y="355" text-anchor="middle" fill="#4DD0E1" font-size="11">= EML(ln(a)+ln(b), 1)</text>
  <line x1="230" y1="340" x2="360" y2="280" stroke="#00BCD4" stroke-width="1.5"/>
  
  <!-- Division -->
  <rect x="570" y="310" width="180" height="60" rx="8" fill="none" stroke="#FF5722" stroke-width="2"/>
  <text x="660" y="335" text-anchor="middle" fill="#FFAB91" font-size="14" font-weight="bold">a ÷ b</text>
  <text x="660" y="355" text-anchor="middle" fill="#FF8A65" font-size="11">= EML(ln(a)−ln(b), 1)</text>
  <line x1="570" y1="340" x2="440" y2="280" stroke="#FF5722" stroke-width="1.5"/>
  
  <!-- Powers -->
  <rect x="310" y="390" width="180" height="60" rx="8" fill="none" stroke="#FFEB3B" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" fill="#FFF176" font-size="14" font-weight="bold">a^b</text>
  <text x="400" y="435" text-anchor="middle" fill="#FFEE58" font-size="11">= EML(b·ln(a), 1)</text>
  <line x1="400" y1="390" x2="400" y2="300" stroke="#FFEB3B" stroke-width="1.5"/>
  
  <!-- Footer -->
  <rect x="100" y="465" width="600" height="25" rx="5" fill="none" stroke="#4CAF50" stroke-width="1"/>
  <text x="400" y="483" text-anchor="middle" fill="#A5D6A7" font-size="12">All identities machine-verified in Lean 4 with Mathlib — zero trust assumptions</text>
</svg>
