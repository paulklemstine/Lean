<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0c040"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4080ff"/>
      <stop offset="100%" style="stop-color:#00c8ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#40c040"/>
      <stop offset="100%" style="stop-color:#00ff80"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4040"/>
      <stop offset="100%" style="stop-color:#ff8080"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a040ff"/>
      <stop offset="100%" style="stop-color:#ff40ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="url(#gold)" font-size="32" font-weight="bold" filter="url(#glow)">
    EML Operator V7 — Theorem Map
  </text>
  <text x="600" y="80" text-anchor="middle" fill="#aaa" font-size="16">
    eml(x, y) = exp(x) − ln(y) | 30+ Verified Theorems | 0 Sorry's
  </text>
  
  <!-- Central node -->
  <circle cx="600" cy="300" r="60" fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
  <text x="600" y="295" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">eml(x,y)</text>
  <text x="600" y="315" text-anchor="middle" fill="#ccc" font-size="13">= eˣ − ln y</text>
  
  <!-- Branch 1: Monotonicity (top-left) -->
  <line x1="545" y1="265" x2="200" y2="160" stroke="#4080ff" stroke-width="2" opacity="0.6"/>
  <rect x="60" y="120" width="280" height="120" rx="12" fill="#1a2a4e" stroke="url(#blue)" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" fill="url(#blue)" font-size="16" font-weight="bold">MONOTONICITY</text>
  <text x="200" y="168" text-anchor="middle" fill="#adf" font-size="12">✓ StrictMono in x (all y)</text>
  <text x="200" y="186" text-anchor="middle" fill="#adf" font-size="12">✓ StrictAnti in y (y &gt; 0)</text>
  <text x="200" y="204" text-anchor="middle" fill="#adf" font-size="12">✓ Injective in both args</text>
  <text x="200" y="222" text-anchor="middle" fill="#888" font-size="11">→ Ordered magma structure</text>
  
  <!-- Branch 2: Algebra (top-right) -->
  <line x1="655" y1="265" x2="1000" y2="160" stroke="#ff4040" stroke-width="2" opacity="0.6"/>
  <rect x="860" y="110" width="280" height="140" rx="12" fill="#2a1a1e" stroke="url(#red)" stroke-width="2"/>
  <text x="1000" y="135" text-anchor="middle" fill="url(#red)" font-size="16" font-weight="bold">UNIVERSAL ALGEBRA</text>
  <text x="1000" y="158" text-anchor="middle" fill="#faa" font-size="12">✗ Not commutative</text>
  <text x="1000" y="174" text-anchor="middle" fill="#faa" font-size="12">✗ Not associative, Not medial</text>
  <text x="1000" y="190" text-anchor="middle" fill="#faa" font-size="12">✗ Not flexible, Not alternative</text>
  <text x="1000" y="206" text-anchor="middle" fill="#faa" font-size="12">✗ No left/right identity</text>
  <text x="1000" y="228" text-anchor="middle" fill="#888" font-size="11">→ Maximally unstructured magma</text>
  
  <!-- Branch 3: E-Tower (left) -->
  <line x1="545" y1="315" x2="200" y2="420" stroke="#40c040" stroke-width="2" opacity="0.6"/>
  <rect x="60" y="380" width="280" height="120" rx="12" fill="#1a2a1e" stroke="url(#green)" stroke-width="2"/>
  <text x="200" y="405" text-anchor="middle" fill="url(#green)" font-size="16" font-weight="bold">E-TOWER GROWTH</text>
  <text x="200" y="428" text-anchor="middle" fill="#afa" font-size="12">✓ e↑↑(n+2) ≥ exp(2ⁿ)</text>
  <text x="200" y="446" text-anchor="middle" fill="#afa" font-size="12">✓ Strictly increasing</text>
  <text x="200" y="464" text-anchor="middle" fill="#afa" font-size="12">✓ Always positive</text>
  <text x="200" y="482" text-anchor="middle" fill="#888" font-size="11">→ Superexponential growth</text>
  
  <!-- Branch 4: Dynamics (right) -->
  <line x1="655" y1="315" x2="1000" y2="420" stroke="url(#purple)" stroke-width="2" opacity="0.6"/>
  <rect x="860" y="380" width="280" height="120" rx="12" fill="#2a1a2e" stroke="url(#purple)" stroke-width="2"/>
  <text x="1000" y="405" text-anchor="middle" fill="url(#purple)" font-size="16" font-weight="bold">DIAGONAL DYNAMICS</text>
  <text x="1000" y="428" text-anchor="middle" fill="#daf" font-size="12">✓ d(z) &gt; z for ALL z ∈ ℝ</text>
  <text x="1000" y="446" text-anchor="middle" fill="#daf" font-size="12">✓ d(z) ≥ 2 for z &gt; 0</text>
  <text x="1000" y="464" text-anchor="middle" fill="#daf" font-size="12">✓ Orbits strictly increase</text>
  <text x="1000" y="482" text-anchor="middle" fill="#888" font-size="11">→ No fixed points, escape to ∞</text>
  
  <!-- Branch 5: Inequalities (bottom-left) -->
  <line x1="570" y1="355" x2="300" y2="600" stroke="#f0c040" stroke-width="2" opacity="0.6"/>
  <rect x="120" y="570" width="340" height="110" rx="12" fill="#2a2a1e" stroke="url(#gold)" stroke-width="2"/>
  <text x="290" y="595" text-anchor="middle" fill="url(#gold)" font-size="16" font-weight="bold">AM-GM BRIDGE</text>
  <text x="290" y="618" text-anchor="middle" fill="#fda" font-size="12">✓ a + b − ln(a) − ln(b) ≥ 2</text>
  <text x="290" y="636" text-anchor="middle" fill="#fda" font-size="12">✓ t − ln(t) ≥ 1 for t &gt; 0</text>
  <text x="290" y="654" text-anchor="middle" fill="#fda" font-size="12">✓ Regional: eml ≥ 1 for x≥0, 0&lt;y≤1</text>
  <text x="290" y="672" text-anchor="middle" fill="#888" font-size="11">→ Classical inequalities via EML</text>
  
  <!-- Branch 6: Geometry (bottom-right) -->
  <line x1="630" y1="355" x2="900" y2="600" stroke="#00c8ff" stroke-width="2" opacity="0.6"/>
  <rect x="740" y="570" width="340" height="110" rx="12" fill="#1a2a3e" stroke="#00c8ff" stroke-width="2"/>
  <text x="910" y="595" text-anchor="middle" fill="#00c8ff" font-size="16" font-weight="bold">GEOMETRY &amp; TOPOLOGY</text>
  <text x="910" y="618" text-anchor="middle" fill="#aef" font-size="12">✓ Level sets non-empty for all c</text>
  <text x="910" y="636" text-anchor="middle" fill="#aef" font-size="12">✓ Gradient ∇eml never vanishes</text>
  <text x="910" y="654" text-anchor="middle" fill="#aef" font-size="12">✓ Diagonal convex on (0,∞)</text>
  <text x="910" y="672" text-anchor="middle" fill="#888" font-size="11">→ Smooth foliation of ℝ × ℝ₊</text>
  
  <!-- Bottom banner -->
  <rect x="200" y="750" width="800" height="60" rx="10" fill="#1a1a3e" stroke="#4080ff" stroke-width="1"/>
  <text x="600" y="775" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">
    Identities: exp, power, involution, log-split, subtraction, composition
  </text>
  <text x="600" y="798" text-anchor="middle" fill="#888" font-size="13">
    Tropical: tropEml(x,x) = |x| | All verified in Lean 4.28.0 + Mathlib
  </text>
  
  <!-- Stats -->
  <text x="600" y="860" text-anchor="middle" fill="url(#gold)" font-size="20" font-weight="bold" filter="url(#glow)">
    30+ Theorems ─ 0 Sorry's ─ 3 Standard Axioms
  </text>
</svg>
