<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a0a2a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6f00"/>
      <stop offset="50%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg4)"/>

  <text x="450" y="35" text-anchor="middle" fill="#ffd600" font-size="22" font-weight="bold">
    e-Tower Growth: Superexponential Bounds (V7)
  </text>

  <!-- Tower visualization -->
  <g transform="translate(100, 60)">
    <!-- n=0 -->
    <rect x="0" y="370" width="80" height="30" rx="4" fill="#ff6f00" opacity="0.9"/>
    <text x="40" y="390" text-anchor="middle" fill="white" font-size="13" font-weight="bold">e↑↑0 = 1</text>
    <text x="40" y="420" text-anchor="middle" fill="#aaa" font-size="10">2⁰ = 1</text>

    <!-- n=1 -->
    <rect x="100" y="340" width="80" height="60" rx="4" fill="#ff8f00" opacity="0.9"/>
    <text x="140" y="370" text-anchor="middle" fill="white" font-size="13" font-weight="bold">e↑↑1</text>
    <text x="140" y="388" text-anchor="middle" fill="white" font-size="11">= e ≈ 2.72</text>
    <text x="140" y="420" text-anchor="middle" fill="#aaa" font-size="10">2¹ = 2</text>

    <!-- n=2 -->
    <rect x="200" y="270" width="80" height="130" rx="4" fill="#ffab00" opacity="0.9"/>
    <text x="240" y="310" text-anchor="middle" fill="white" font-size="13" font-weight="bold">e↑↑2</text>
    <text x="240" y="328" text-anchor="middle" fill="white" font-size="11">= eᵉ ≈ 15.15</text>
    <text x="240" y="346" text-anchor="middle" fill="#ddd" font-size="10">≥ exp(2⁰) = e</text>
    <text x="240" y="420" text-anchor="middle" fill="#aaa" font-size="10">2² = 4</text>

    <!-- n=3 -->
    <rect x="300" y="160" width="80" height="240" rx="4" fill="#ffd600" opacity="0.85"/>
    <text x="340" y="220" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">e↑↑3</text>
    <text x="340" y="240" text-anchor="middle" fill="#333" font-size="10">= e^(eᵉ)</text>
    <text x="340" y="258" text-anchor="middle" fill="#333" font-size="10">≈ 3.8×10⁶</text>
    <text x="340" y="280" text-anchor="middle" fill="#555" font-size="9">≥ exp(2¹) = e²</text>
    <text x="340" y="420" text-anchor="middle" fill="#aaa" font-size="10">2³ = 8</text>

    <!-- n=4 -->
    <rect x="400" y="80" width="80" height="320" rx="4" fill="#ffea00" opacity="0.8"/>
    <text x="440" y="150" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">e↑↑4</text>
    <text x="440" y="170" text-anchor="middle" fill="#333" font-size="10">≈ 10^(1.66×10⁶)</text>
    <text x="440" y="190" text-anchor="middle" fill="#555" font-size="9">≥ exp(2²) = e⁴</text>
    <text x="440" y="420" text-anchor="middle" fill="#aaa" font-size="10">2⁴ = 16</text>

    <!-- n=5 -->
    <rect x="500" y="30" width="80" height="370" rx="4" fill="#f5f5dc" opacity="0.75"/>
    <text x="540" y="100" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">e↑↑5</text>
    <text x="540" y="120" text-anchor="middle" fill="#333" font-size="10">>> atoms in</text>
    <text x="540" y="136" text-anchor="middle" fill="#333" font-size="10">universe</text>
    <text x="540" y="156" text-anchor="middle" fill="#555" font-size="9">≥ exp(2³) = e⁸</text>
    <text x="540" y="420" text-anchor="middle" fill="#aaa" font-size="10">2⁵ = 32</text>
  </g>

  <!-- Growth bounds box -->
  <rect x="620" y="80" width="250" height="200" rx="10" fill="#1a1a3a" stroke="#ffd600" stroke-width="1.5"/>
  <text x="745" y="105" text-anchor="middle" fill="#ffd600" font-size="15" font-weight="bold">Proved Bounds (V6-V7)</text>

  <text x="640" y="130" fill="#81c784" font-size="12">✓ e↑↑n ≥ 2ⁿ</text>
  <text x="640" y="150" fill="#81c784" font-size="12">✓ e↑↑n ≥ n + 1</text>
  <text x="640" y="170" fill="#81c784" font-size="12">✓ e↑↑(n+1) ≥ e · e↑↑n</text>
  <text x="640" y="195" fill="#ffd600" font-size="12" font-weight="bold">★ V7 NEW:</text>
  <text x="640" y="215" fill="#ffd600" font-size="12">✓ e↑↑(n+2) ≥ exp(2ⁿ)</text>
  <text x="640" y="235" fill="#ce93d8" font-size="11">  (superexponential!)</text>
  <text x="640" y="260" fill="#aaa" font-size="10">All formally verified</text>
  <text x="640" y="275" fill="#aaa" font-size="10">in Lean 4 + Mathlib</text>

  <!-- Growth comparison -->
  <rect x="620" y="300" width="250" height="120" rx="10" fill="#1a1a3a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="745" y="325" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">Growth Hierarchy</text>
  <text x="640" y="350" fill="#aaa" font-size="12">n + 1</text>
  <text x="750" y="350" fill="#666" font-size="12">≪</text>
  <text x="640" y="370" fill="#aaa" font-size="12">2ⁿ</text>
  <text x="750" y="370" fill="#666" font-size="12">≪</text>
  <text x="640" y="390" fill="#aaa" font-size="12">exp(2ⁿ)</text>
  <text x="750" y="390" fill="#666" font-size="12">≪</text>
  <text x="640" y="410" fill="#ffd600" font-size="13" font-weight="bold">e↑↑n</text>

  <!-- Bottom label -->
  <text x="450" y="485" text-anchor="middle" fill="#888" font-size="12">
    The e-tower grows faster than any fixed tower of exponentials
  </text>
</svg>
