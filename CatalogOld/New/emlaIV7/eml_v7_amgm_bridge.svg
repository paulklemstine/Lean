<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)"/>

  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">
    EML ↔ AM-GM Bridge (V7)
  </text>

  <!-- Left: Classical AM-GM -->
  <rect x="30" y="60" width="340" height="160" rx="12" fill="#1b5e20" fill-opacity="0.4" stroke="#4caf50" stroke-width="2"/>
  <text x="200" y="88" text-anchor="middle" fill="#4caf50" font-size="16" font-weight="bold">Classical AM-GM</text>
  <text x="200" y="115" text-anchor="middle" fill="#a5d6a7" font-size="14">For a, b > 0:</text>
  <text x="200" y="145" text-anchor="middle" fill="#c8e6c9" font-size="18" font-weight="bold">(a + b)/2 ≥ √(ab)</text>
  <text x="200" y="175" text-anchor="middle" fill="#a5d6a7" font-size="13">Equivalently:</text>
  <text x="200" y="200" text-anchor="middle" fill="#c8e6c9" font-size="16">a + b − ln a − ln b ≥ 2</text>

  <!-- Right: EML form -->
  <rect x="430" y="60" width="340" height="160" rx="12" fill="#e65100" fill-opacity="0.4" stroke="#ff9800" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" fill="#ff9800" font-size="16" font-weight="bold">EML Form (V7)</text>
  <text x="600" y="115" text-anchor="middle" fill="#ffcc80" font-size="14">For a, b > 0:</text>
  <text x="600" y="148" text-anchor="middle" fill="#ffe0b2" font-size="16" font-weight="bold">eml(ln a, b) + eml(ln b, a)</text>
  <text x="600" y="175" text-anchor="middle" fill="#ffe0b2" font-size="16" font-weight="bold">= a + b − ln a − ln b</text>
  <text x="600" y="200" text-anchor="middle" fill="#ffe0b2" font-size="18" font-weight="bold">≥ 2</text>

  <!-- Bridge arrow -->
  <path d="M 370 140 Q 400 100 430 140" fill="none" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 430 160 Q 400 200 370 160" fill="none" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffd700"/>
    </marker>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#ffd700"/>
    </marker>
  </defs>
  <text x="400" y="95" text-anchor="middle" fill="#ffd700" font-size="11">≡</text>

  <!-- Proof sketch -->
  <rect x="60" y="245" width="680" height="85" rx="10" fill="#263238" stroke="#78909c" stroke-width="1.5"/>
  <text x="400" y="270" text-anchor="middle" fill="#b0bec5" font-size="14" font-weight="bold">Proof (formally verified in Lean 4)</text>
  <text x="400" y="295" text-anchor="middle" fill="#90a4ae" font-size="13">
    ln(a) ≤ a − 1  and  ln(b) ≤ b − 1    (fundamental log inequality)
  </text>
  <text x="400" y="315" text-anchor="middle" fill="#90a4ae" font-size="13">
    ⟹  ln(a) + ln(b) ≤ (a−1) + (b−1) = a + b − 2  ⟹  a + b − ln a − ln b ≥ 2  ∎
  </text>

  <!-- Equality condition -->
  <rect x="200" y="350" width="400" height="50" rx="8" fill="#4a148c" fill-opacity="0.5" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="400" y="375" text-anchor="middle" fill="#ce93d8" font-size="14" font-weight="bold">
    Equality iff a = b = 1   (eml(0, 1) + eml(0, 1) = 1 + 1 = 2)
  </text>

  <!-- Formal reference -->
  <text x="400" y="430" text-anchor="middle" fill="#666" font-size="11">
    Lean 4 theorems: eml7_sym_sum · eml7_am_gm_connection · Verified with Mathlib
  </text>
</svg>
