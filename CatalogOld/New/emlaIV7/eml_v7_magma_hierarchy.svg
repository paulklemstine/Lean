<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <filter id="glowm">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="700" fill="url(#bgm)"/>
  
  <text x="450" y="45" text-anchor="middle" fill="#f0c040" font-size="26" font-weight="bold" filter="url(#glowm)">
    Where Does EML Live in Algebraic Hierarchy?
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#888" font-size="14">Answer: At the very bottom — it fails everything.</text>
  
  <!-- Hierarchy levels -->
  <!-- Group -->
  <rect x="300" y="95" width="300" height="45" rx="8" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="122" text-anchor="middle" fill="#666" font-size="15">Group</text>
  <text x="620" y="122" fill="#f44" font-size="12">✗ no identity</text>
  
  <!-- Monoid -->
  <rect x="280" y="155" width="340" height="45" rx="8" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="182" text-anchor="middle" fill="#777" font-size="15">Monoid</text>
  <text x="640" y="182" fill="#f44" font-size="12">✗ no identity</text>
  
  <!-- Semigroup -->
  <rect x="260" y="215" width="380" height="45" rx="8" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="242" text-anchor="middle" fill="#888" font-size="15">Semigroup</text>
  <text x="660" y="242" fill="#f44" font-size="12">✗ not associative</text>
  
  <!-- Quasigroup -->
  <rect x="240" y="275" width="420" height="45" rx="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="302" text-anchor="middle" fill="#999" font-size="15">Quasigroup / Loop</text>
  <text x="680" y="302" fill="#f44" font-size="12">✗ open question</text>
  
  <!-- Alternative algebra -->
  <rect x="220" y="335" width="460" height="45" rx="8" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="362" text-anchor="middle" fill="#aaa" font-size="15">Alternative Algebra</text>
  <text x="700" y="362" fill="#f44" font-size="12">✗ not L/R-alt</text>
  
  <!-- Flexible -->
  <rect x="200" y="395" width="500" height="45" rx="8" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="422" text-anchor="middle" fill="#bbb" font-size="15">Flexible Magma</text>
  <text x="720" y="422" fill="#f44" font-size="12">✗ not flexible</text>
  
  <!-- Medial -->
  <rect x="180" y="455" width="540" height="45" rx="8" fill="none" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="482" text-anchor="middle" fill="#ccc" font-size="15">Medial (Entropic) Magma</text>
  <text x="740" y="482" fill="#f44" font-size="12">✗ not medial</text>
  
  <!-- Power-associative -->
  <rect x="160" y="515" width="580" height="45" rx="8" fill="none" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="542" text-anchor="middle" fill="#ddd" font-size="15">Power-Associative Magma</text>
  <text x="760" y="542" fill="#f44" font-size="12">✗ (V6)</text>

  <!-- Commutative magma -->
  <rect x="140" y="575" width="620" height="45" rx="8" fill="none" stroke="#eee" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="602" text-anchor="middle" fill="#eee" font-size="15">Commutative Magma</text>
  <text x="780" y="602" fill="#f44" font-size="12">✗ (V5)</text>
  
  <!-- MAGMA — where EML lives -->
  <rect x="120" y="635" width="660" height="50" rx="12" fill="#2a1a0a" stroke="#f0c040" stroke-width="3" filter="url(#glowm)"/>
  <text x="450" y="665" text-anchor="middle" fill="#f0c040" font-size="20" font-weight="bold">
    MAGMA — EML lives here ★
  </text>
  
  <!-- Arrow annotation -->
  <text x="100" y="665" text-anchor="end" fill="#f0c040" font-size="30">→</text>
  <text x="450" y="695" text-anchor="middle" fill="#888" font-size="12">
    (ℝ, eml) is a magma and nothing more — all V7 results proved in Lean 4
  </text>
</svg>
