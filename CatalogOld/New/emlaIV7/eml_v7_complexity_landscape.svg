<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg2)"/>

  <text x="500" y="40" text-anchor="middle" fill="#e0e0e0" font-size="24" font-weight="bold">
    EML Complexity Landscape: K_EML(f)
  </text>
  <text x="500" y="62" text-anchor="middle" fill="#888" font-size="13">
    Minimum EML tree nodes to compute function f
  </text>

  <!-- Axes -->
  <line x1="80" y1="600" x2="950" y2="600" stroke="#555" stroke-width="2"/>
  <line x1="80" y1="600" x2="80" y2="90" stroke="#555" stroke-width="2"/>
  <text x="500" y="660" text-anchor="middle" fill="#aaa" font-size="14">Function</text>
  <text x="30" y="350" text-anchor="middle" fill="#aaa" font-size="14" transform="rotate(-90, 30, 350)">K_EML nodes</text>

  <!-- Scale markers -->
  <g fill="#666" font-size="11">
    <text x="70" y="600" text-anchor="end">0</text>
    <text x="70" y="510" text-anchor="end">2</text>
    <text x="70" y="420" text-anchor="end">4</text>
    <text x="70" y="330" text-anchor="end">6</text>
    <text x="70" y="240" text-anchor="end">8</text>
    <text x="70" y="150" text-anchor="end">10</text>
  </g>
  <g stroke="#333" stroke-width="1" stroke-dasharray="4,4">
    <line x1="80" y1="510" x2="950" y2="510"/>
    <line x1="80" y1="420" x2="950" y2="420"/>
    <line x1="80" y1="330" x2="950" y2="330"/>
    <line x1="80" y1="240" x2="950" y2="240"/>
    <line x1="80" y1="150" x2="950" y2="150"/>
  </g>

  <!-- Exact complexity bars (green) -->
  <g>
    <!-- x: 0 nodes -->
    <rect x="100" y="595" width="50" height="5" fill="#4caf50" rx="2"/>
    <text x="125" y="620" text-anchor="middle" fill="#aaa" font-size="10">x</text>
    <text x="125" y="590" text-anchor="middle" fill="#4caf50" font-size="10">0</text>

    <!-- 1: 0 nodes -->
    <rect x="170" y="595" width="50" height="5" fill="#4caf50" rx="2"/>
    <text x="195" y="620" text-anchor="middle" fill="#aaa" font-size="10">1</text>
    <text x="195" y="590" text-anchor="middle" fill="#4caf50" font-size="10">0</text>

    <!-- exp(x): 1 node -->
    <rect x="240" y="555" width="50" height="45" fill="#4caf50" rx="2"/>
    <text x="265" y="620" text-anchor="middle" fill="#aaa" font-size="10">eˣ</text>
    <text x="265" y="550" text-anchor="middle" fill="#4caf50" font-size="10">1</text>

    <!-- e: 1 node -->
    <rect x="310" y="555" width="50" height="45" fill="#4caf50" rx="2"/>
    <text x="335" y="620" text-anchor="middle" fill="#aaa" font-size="10">e</text>
    <text x="335" y="550" text-anchor="middle" fill="#4caf50" font-size="10">1</text>

    <!-- e-1: 2 nodes -->
    <rect x="380" y="510" width="50" height="90" fill="#4caf50" rx="2"/>
    <text x="405" y="620" text-anchor="middle" fill="#aaa" font-size="10">e−1</text>
    <text x="405" y="505" text-anchor="middle" fill="#4caf50" font-size="10">2</text>

    <!-- e^e: 2 nodes -->
    <rect x="450" y="510" width="50" height="90" fill="#4caf50" rx="2"/>
    <text x="475" y="620" text-anchor="middle" fill="#aaa" font-size="10">eᵉ</text>
    <text x="475" y="505" text-anchor="middle" fill="#4caf50" font-size="10">2</text>

    <!-- 0: 3 nodes -->
    <rect x="520" y="465" width="50" height="135" fill="#4caf50" rx="2"/>
    <text x="545" y="620" text-anchor="middle" fill="#aaa" font-size="10">0</text>
    <text x="545" y="460" text-anchor="middle" fill="#4caf50" font-size="10">3</text>
  </g>

  <!-- Bounded complexity (orange = range) -->
  <g>
    <!-- ln(x): 3-5 range -->
    <rect x="590" y="375" width="50" height="90" fill="#ff9800" fill-opacity="0.5" rx="2" stroke="#ff9800" stroke-width="1"/>
    <rect x="590" y="465" width="50" height="135" fill="#ff9800" rx="2"/>
    <text x="615" y="620" text-anchor="middle" fill="#aaa" font-size="10">ln x</text>
    <text x="615" y="370" text-anchor="middle" fill="#ff9800" font-size="10">3–5</text>
    <text x="615" y="640" text-anchor="middle" fill="#ff5722" font-size="9">★ OPEN</text>

    <!-- x+y: 3-11 -->
    <rect x="660" y="195" width="50" height="270" fill="#f44336" fill-opacity="0.3" rx="2" stroke="#f44336" stroke-width="1"/>
    <rect x="660" y="465" width="50" height="135" fill="#f44336" fill-opacity="0.6" rx="2"/>
    <text x="685" y="620" text-anchor="middle" fill="#aaa" font-size="10">x+y</text>
    <text x="685" y="190" text-anchor="middle" fill="#f44336" font-size="10">3–11</text>

    <!-- x·y: 5-17 -->
    <rect x="730" y="120" width="50" height="255" fill="#9c27b0" fill-opacity="0.3" rx="2" stroke="#9c27b0" stroke-width="1"/>
    <rect x="730" y="375" width="50" height="225" fill="#9c27b0" fill-opacity="0.6" rx="2"/>
    <text x="755" y="620" text-anchor="middle" fill="#aaa" font-size="10">x·y</text>
    <text x="755" y="115" text-anchor="middle" fill="#9c27b0" font-size="10">5–17</text>

    <!-- sin(x): 5-53 -->
    <rect x="800" y="100" width="50" height="275" fill="#2196f3" fill-opacity="0.2" rx="2" stroke="#2196f3" stroke-width="1"/>
    <rect x="800" y="375" width="50" height="225" fill="#2196f3" fill-opacity="0.4" rx="2"/>
    <text x="825" y="620" text-anchor="middle" fill="#aaa" font-size="10">sin x</text>
    <text x="825" y="95" text-anchor="middle" fill="#2196f3" font-size="10">5–53</text>

    <!-- π: 5-53 -->
    <rect x="870" y="100" width="50" height="275" fill="#00bcd4" fill-opacity="0.2" rx="2" stroke="#00bcd4" stroke-width="1"/>
    <rect x="870" y="375" width="50" height="225" fill="#00bcd4" fill-opacity="0.4" rx="2"/>
    <text x="895" y="620" text-anchor="middle" fill="#aaa" font-size="10">π</text>
    <text x="895" y="95" text-anchor="middle" fill="#00bcd4" font-size="10">5–53</text>
  </g>

  <!-- Legend -->
  <rect x="100" y="80" width="15" height="15" fill="#4caf50" rx="2"/>
  <text x="120" y="93" fill="#aaa" font-size="12">Exact (proved)</text>
  <rect x="250" y="80" width="15" height="15" fill="#ff9800" rx="2"/>
  <text x="270" y="93" fill="#aaa" font-size="12">Lower bound (proved)</text>
  <rect x="430" y="80" width="15" height="15" fill="#f44336" fill-opacity="0.4" rx="2" stroke="#f44336"/>
  <text x="450" y="93" fill="#aaa" font-size="12">Gap (open)</text>
</svg>
