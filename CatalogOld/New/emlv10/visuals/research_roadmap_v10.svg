  <!-- Key Questions Box -->
  <rect x="240" y="380" width="830" height="300" rx="10" fill="#0a0a1a" stroke="#666" stroke-width="1"/>
  <text x="655" y="410" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">
    Key Open Questions — Ranked by Impact × Feasibility
  </text>

  <text x="260" y="445" fill="#00ff88" font-size="12">1. Can QS be formally verified end-to-end? (9×9=81) ← foundations complete!</text>
  <text x="260" y="470" fill="#44aaff" font-size="12">2. Can Hurwitz quaternion factoring be efficient? (10×7=70)</text>
  <text x="260" y="495" fill="#44aaff" font-size="12">3. What is the density of Fibonacci pseudoprimes? (8×8=64)</text>
  <text x="260" y="520" fill="#ffaa44" font-size="12">4. Can persistent homology detect factors? (9×6=54)</text>
  <text x="260" y="545" fill="#ffaa44" font-size="12">5. Can Pisano periods be computed in poly-time? (8×7=56)</text>
  <text x="260" y="570" fill="#ff6644" font-size="12">6. Is the Coppersmith bound optimal for degree ≥ 2? (7×5=35)</text>
  <text x="260" y="595" fill="#ff6644" font-size="12">7. Do Wall-Sun-Sun primes exist? (7×3=21)</text>
  <text x="260" y="620" fill="#aa44ff" font-size="12">8. Do odd perfect numbers exist? (10×1=10) — millennium-level</text>
  <text x="260" y="645" fill="#aa44ff" font-size="12">9. Is there a polynomial-time lattice factoring algorithm? (10×2=20)</text>
  <text x="260" y="670" fill="#888888" font-size="12">10. Can Morse theory reveal factoring structure? (8×6=48)</text>
