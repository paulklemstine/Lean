<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="emlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#2C5F8A"/>
    </linearGradient>
    <linearGradient id="stdGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#D94A4A"/>
      <stop offset="100%" style="stop-color:#8A2C2C"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/></filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#f5f7fa" rx="12"/>

  <!-- Header -->
  <rect width="900" height="60" fill="url(#headerGrad)" rx="12" ry="12"/>
  <rect y="30" width="900" height="30" fill="url(#headerGrad)"/>
  <text x="450" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="bold">
    EML Transformer Architecture vs Standard Transformer
  </text>

  <!-- Standard Transformer (Left) -->
  <text x="225" y="90" text-anchor="middle" fill="#D94A4A" font-size="18" font-weight="bold">Standard Transformer Layer</text>

  <!-- Input -->
  <rect x="125" y="110" width="200" height="35" rx="5" fill="#f0f0f0" stroke="#999" filter="url(#shadow)"/>
  <text x="225" y="132" text-anchor="middle" fill="#333" font-size="13">Input: x ∈ ℝ^d_model</text>

  <!-- Multi-Head Attention -->
  <rect x="105" y="160" width="240" height="80" rx="8" fill="url(#stdGrad)" filter="url(#shadow)"/>
  <text x="225" y="185" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Multi-Head Attention</text>
  <text x="225" y="205" text-anchor="middle" fill="#ffcccc" font-size="11">Q=xW_Q, K=xW_K, V=xW_V</text>
  <text x="225" y="225" text-anchor="middle" fill="#ffcccc" font-size="11">Params: h×4×d×d_k = h×4×d²/h</text>

  <!-- Add & Norm -->
  <rect x="155" y="250" width="140" height="28" rx="5" fill="#eee" stroke="#999"/>
  <text x="225" y="269" text-anchor="middle" fill="#333" font-size="12">Add &amp; LayerNorm</text>

  <!-- FFN -->
  <rect x="105" y="290" width="240" height="70" rx="8" fill="url(#stdGrad)" filter="url(#shadow)"/>
  <text x="225" y="313" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Feed-Forward Network</text>
  <text x="225" y="333" text-anchor="middle" fill="#ffcccc" font-size="11">W₁: d→4d, W₂: 4d→d</text>
  <text x="225" y="348" text-anchor="middle" fill="#ffcccc" font-size="11">Params: 8d² = 8d²</text>

  <!-- Add & Norm 2 -->
  <rect x="155" y="370" width="140" height="28" rx="5" fill="#eee" stroke="#999"/>
  <text x="225" y="389" text-anchor="middle" fill="#333" font-size="12">Add &amp; LayerNorm</text>

  <!-- Arrows -->
  <line x1="225" y1="145" x2="225" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="225" y1="240" x2="225" y2="250" stroke="#666" stroke-width="2"/>
  <line x1="225" y1="278" x2="225" y2="290" stroke="#666" stroke-width="2"/>
  <line x1="225" y1="360" x2="225" y2="370" stroke="#666" stroke-width="2"/>

  <!-- EML Transformer (Right) -->
  <text x="675" y="90" text-anchor="middle" fill="#4A90D9" font-size="18" font-weight="bold">EML Transformer Layer</text>

  <!-- Input -->
  <rect x="575" y="110" width="200" height="35" rx="5" fill="#f0f0f0" stroke="#999" filter="url(#shadow)"/>
  <text x="675" y="132" text-anchor="middle" fill="#333" font-size="13">Input: x ∈ ℝ^d_model</text>

  <!-- EML Attention -->
  <rect x="555" y="160" width="240" height="80" rx="8" fill="url(#emlGrad)" filter="url(#shadow)"/>
  <text x="675" y="185" text-anchor="middle" fill="white" font-size="14" font-weight="bold">EML Attention</text>
  <text x="675" y="205" text-anchor="middle" fill="#cce0ff" font-size="11">exp(Q·K/√d) — native EML op!</text>
  <text x="675" y="225" text-anchor="middle" fill="#cce0ff" font-size="11">Params: h×8×d_k (4 EML coeffs)</text>

  <!-- Add & Norm -->
  <rect x="605" y="250" width="140" height="28" rx="5" fill="#eee" stroke="#999"/>
  <text x="675" y="269" text-anchor="middle" fill="#333" font-size="12">Add &amp; LayerNorm</text>

  <!-- EML FFN -->
  <rect x="555" y="290" width="240" height="70" rx="8" fill="url(#emlGrad)" filter="url(#shadow)"/>
  <text x="675" y="313" text-anchor="middle" fill="white" font-size="14" font-weight="bold">EML Feed-Forward</text>
  <text x="675" y="333" text-anchor="middle" fill="#cce0ff" font-size="11">EML tree: exp/ln/mult ops</text>
  <text x="675" y="348" text-anchor="middle" fill="#cce0ff" font-size="11">Params: 16d (4 coeffs × 4 depth)</text>

  <!-- Add & Norm 2 -->
  <rect x="605" y="370" width="140" height="28" rx="5" fill="#eee" stroke="#999"/>
  <text x="675" y="389" text-anchor="middle" fill="#333" font-size="12">Add &amp; LayerNorm</text>

  <!-- Arrows -->
  <line x1="675" y1="145" x2="675" y2="160" stroke="#666" stroke-width="2"/>
  <line x1="675" y1="240" x2="675" y2="250" stroke="#666" stroke-width="2"/>
  <line x1="675" y1="278" x2="675" y2="290" stroke="#666" stroke-width="2"/>
  <line x1="675" y1="360" x2="675" y2="370" stroke="#666" stroke-width="2"/>

  <!-- Comparison Table -->
  <rect x="50" y="420" width="800" height="250" rx="8" fill="white" stroke="#ddd" filter="url(#shadow)"/>
  <text x="450" y="450" text-anchor="middle" fill="#333" font-size="16" font-weight="bold">Parameter Comparison (d_model = 768, h = 12, d_k = 64)</text>

  <!-- Table headers -->
  <rect x="70" y="465" width="760" height="25" rx="4" fill="#f0f4f8"/>
  <text x="200" y="482" text-anchor="middle" fill="#555" font-size="12" font-weight="bold">Component</text>
  <text x="400" y="482" text-anchor="middle" fill="#D94A4A" font-size="12" font-weight="bold">Standard</text>
  <text x="550" y="482" text-anchor="middle" fill="#4A90D9" font-size="12" font-weight="bold">EML</text>
  <text x="700" y="482" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">Compression</text>

  <!-- Table rows -->
  <text x="200" y="510" text-anchor="middle" fill="#333" font-size="12">Attention (per head)</text>
  <text x="400" y="510" text-anchor="middle" fill="#D94A4A" font-size="12">4×768×64 = 196,608</text>
  <text x="550" y="510" text-anchor="middle" fill="#4A90D9" font-size="12">8×64 = 512</text>
  <text x="700" y="510" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">384×</text>

  <text x="200" y="535" text-anchor="middle" fill="#333" font-size="12">FFN</text>
  <text x="400" y="535" text-anchor="middle" fill="#D94A4A" font-size="12">8×768² = 4,718,592</text>
  <text x="550" y="535" text-anchor="middle" fill="#4A90D9" font-size="12">16×768 = 12,288</text>
  <text x="700" y="535" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">384×</text>

  <text x="200" y="560" text-anchor="middle" fill="#333" font-size="12">LayerNorm</text>
  <text x="400" y="560" text-anchor="middle" fill="#D94A4A" font-size="12">2×768 = 1,536</text>
  <text x="550" y="560" text-anchor="middle" fill="#4A90D9" font-size="12">2×768 = 1,536</text>
  <text x="700" y="560" text-anchor="middle" fill="#333" font-size="12">1×</text>

  <line x1="70" y1="572" x2="830" y2="572" stroke="#ddd"/>
  <text x="200" y="592" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">Total per Layer</text>
  <text x="400" y="592" text-anchor="middle" fill="#D94A4A" font-size="13" font-weight="bold">7,077,888</text>
  <text x="550" y="592" text-anchor="middle" fill="#4A90D9" font-size="13" font-weight="bold">20,480</text>
  <text x="700" y="592" text-anchor="middle" fill="#2C5F8A" font-size="14" font-weight="bold">345×</text>

  <!-- Key insight -->
  <rect x="100" y="610" width="700" height="45" rx="8" fill="#e8f4e8" stroke="#4CAF50"/>
  <text x="450" y="633" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="bold">
    EML naturally implements softmax (exp) — the core of attention — as a primitive operation
  </text>
  <text x="450" y="648" text-anchor="middle" fill="#2e7d32" font-size="11">
    Result: 345× fewer parameters per layer while preserving expressivity (3^d exponential growth)
  </text>
</svg>
