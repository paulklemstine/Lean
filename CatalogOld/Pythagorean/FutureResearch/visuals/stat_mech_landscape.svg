<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a20"/>
      <stop offset="100%" style="stop-color:#151530"/>
    </linearGradient>
    <linearGradient id="energy_grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0044aa"/>
      <stop offset="50%" style="stop-color:#44aa44"/>
      <stop offset="100%" style="stop-color:#ff4444"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg4)"/>

  <text x="450" y="40" text-anchor="middle" fill="#ffd700" font-size="22" font-weight="bold">
    Statistical Mechanics of the Factoring Landscape
  </text>

  <!-- Energy landscape (stylized) -->
  <g transform="translate(80, 80)">
    <!-- Axes -->
    <line x1="0" y1="380" x2="720" y2="380" stroke="#556677" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="380" stroke="#556677" stroke-width="1.5"/>
    <text x="360" y="420" text-anchor="middle" fill="#7788aa" font-size="13">k-tuple parameter space</text>
    <text x="-30" y="190" fill="#7788aa" font-size="13" transform="rotate(-90, -30, 190)">Energy E(x, N)</text>

    <!-- Energy landscape curve -->
    <path d="M 0,80 C 40,85 60,300 80,310 C 100,320 110,330 120,335
             C 140,340 160,350 180,355 C 200,360 210,370 230,375
             C 240,378 250,100 260,50
             C 270,30 275,25 280,20
             C 285,25 290,30 300,50
             C 310,100 320,375 340,370
             C 360,365 380,355 400,350 C 420,340 440,335 460,330
             C 480,325 500,310 520,300
             C 540,280 550,100 560,50
             C 570,25 575,15 580,10
             C 585,15 590,25 600,50
             C 610,100 620,280 640,300
             C 660,330 680,350 700,360 L 720,370"
          fill="none" stroke="url(#energy_grad)" stroke-width="3"/>

    <!-- Factor wells (deep minima) -->
    <circle cx="280" cy="20" r="8" fill="#44ff44" opacity="0.3"/>
    <text x="280" y="8" text-anchor="middle" fill="#44ff44" font-size="10">Factor!</text>

    <circle cx="580" cy="10" r="8" fill="#44ff44" opacity="0.3"/>
    <text x="580" y="-2" text-anchor="middle" fill="#44ff44" font-size="10">Factor!</text>

    <!-- Temperature levels -->
    <line x1="0" y1="200" x2="720" y2="200" stroke="#ff6644" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
    <text x="730" y="204" fill="#ff6644" font-size="10">T = high</text>

    <line x1="0" y1="100" x2="720" y2="100" stroke="#ffaa44" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
    <text x="730" y="104" fill="#ffaa44" font-size="10">T = med</text>

    <line x1="0" y1="40" x2="720" y2="40" stroke="#44aaff" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
    <text x="730" y="44" fill="#44aaff" font-size="10">T = low</text>
  </g>

  <!-- Phase transition diagram (inset) -->
  <rect x="620" y="430" width="250" height="140" rx="8" fill="#0a0a1a" stroke="#444466" stroke-width="1"/>
  <text x="745" y="455" text-anchor="middle" fill="#aabbcc" font-size="13" font-weight="bold">Phase Transition?</text>

  <!-- Sigmoid curve showing P(factor) vs 1/T -->
  <g transform="translate(640, 470)">
    <line x1="0" y1="80" x2="210" y2="80" stroke="#445566" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="80" stroke="#445566" stroke-width="1"/>
    <text x="105" y="95" text-anchor="middle" fill="#778899" font-size="9">Search depth (1/T)</text>
    <text x="-5" y="40" fill="#778899" font-size="9" text-anchor="end">P</text>

    <!-- S-curve -->
    <path d="M 5,75 C 30,75 50,72 80,60 C 100,48 120,25 140,12 C 160,5 180,3 210,2"
          fill="none" stroke="#ffaa44" stroke-width="2"/>

    <!-- Critical point -->
    <circle cx="100" cy="48" r="4" fill="#ff4444"/>
    <text x="115" y="45" fill="#ff6666" font-size="9">T_c ?</text>
  </g>

  <!-- Partition function -->
  <text x="120" y="530" fill="#aabbcc" font-size="14">
    Z = Σ exp(-E(x,N)/T)
  </text>
  <text x="120" y="555" fill="#8899aa" font-size="12">
    ⟨E⟩ = -∂(ln Z)/∂β  where β = 1/T
  </text>
  <text x="120" y="580" fill="#8899aa" font-size="12">
    P(factor) = Z⁻¹ · Σ_{E=0} exp(-E/T) = fraction of Boltzmann weight at E=0
  </text>
</svg>
