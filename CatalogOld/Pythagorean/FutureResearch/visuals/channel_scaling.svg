<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="40" fill="#e94560" font-size="22" font-weight="bold" text-anchor="middle">
    Factoring Channel Count: k(k+1)/2
  </text>
  <text x="400" y="62" fill="#a0a0c0" font-size="13" text-anchor="middle">
    Total channels = k peel + C(k,2) cross-collision
  </text>

  <!-- Axes -->
  <line x1="100" y1="420" x2="750" y2="420" stroke="#4a4a6a" stroke-width="2"/>
  <line x1="100" y1="420" x2="100" y2="80" stroke="#4a4a6a" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="90" y="420" fill="#8080a0" font-size="11" text-anchor="end">0</text>
  <text x="90" y="335" fill="#8080a0" font-size="11" text-anchor="end">34</text>
  <text x="90" y="250" fill="#8080a0" font-size="11" text-anchor="end">68</text>
  <text x="90" y="165" fill="#8080a0" font-size="11" text-anchor="end">102</text>
  <text x="90" y="85" fill="#8080a0" font-size="11" text-anchor="end">136</text>

  <!-- Grid lines -->
  <line x1="100" y1="335" x2="750" y2="335" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
  <line x1="100" y1="250" x2="750" y2="250" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>
  <line x1="100" y1="165" x2="750" y2="165" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="4"/>

  <!-- Bars: k=1(1), k=2(3), k=3(6), k=4(10), k=5(15), k=6(21), k=7(28), k=8(36), k=16(136) -->
  <!-- Scale: 136 maps to 340px height (420-80) -->

  <!-- k=1: 1 channel -->
  <rect x="115" y="417.5" width="50" height="2.5" fill="#0f3460" rx="2" filter="url(#glow)"/>
  <text x="140" y="440" fill="#8080a0" font-size="11" text-anchor="middle">k=1</text>
  <text x="140" y="413" fill="#e0e0ff" font-size="10" text-anchor="middle">1</text>

  <!-- k=2: 3 channels -->
  <rect x="180" y="412.5" width="50" height="7.5" fill="#1a4a70" rx="2" filter="url(#glow)"/>
  <text x="205" y="440" fill="#8080a0" font-size="11" text-anchor="middle">k=2</text>
  <text x="205" y="408" fill="#e0e0ff" font-size="10" text-anchor="middle">3</text>
  <text x="205" y="458" fill="#64b5f6" font-size="9" text-anchor="middle">ℂ</text>

  <!-- k=3: 6 channels -->
  <rect x="245" y="405" width="50" height="15" fill="#2a5a80" rx="2" filter="url(#glow)"/>
  <text x="270" y="440" fill="#8080a0" font-size="11" text-anchor="middle">k=3</text>
  <text x="270" y="401" fill="#e0e0ff" font-size="10" text-anchor="middle">6</text>

  <!-- k=4: 10 channels -->
  <rect x="310" y="395" width="50" height="25" fill="#3a6a90" rx="2" filter="url(#glow)"/>
  <text x="335" y="440" fill="#8080a0" font-size="11" text-anchor="middle">k=4</text>
  <text x="335" y="391" fill="#e0e0ff" font-size="10" text-anchor="middle">10</text>
  <text x="335" y="458" fill="#ffd54f" font-size="9" text-anchor="middle">ℍ</text>

  <!-- k=5: 15 channels -->
  <rect x="375" y="382.5" width="50" height="37.5" fill="#4a7aa0" rx="2" filter="url(#glow)"/>
  <text x="400" y="440" fill="#8080a0" font-size="11" text-anchor="middle">k=5</text>
  <text x="400" y="378" fill="#e0e0ff" font-size="10" text-anchor="middle">15</text>

  <!-- k=6: 21 channels -->
  <rect x="440" y="367.5" width="50" height="52.5" fill="#5a8ab0" rx="2" filter="url(#glow)"/>
  <text x="465" y="440" fill="#8080a0" font-size="11" text-anchor="middle">k=6</text>
  <text x="465" y="363" fill="#e0e0ff" font-size="10" text-anchor="middle">21</text>

  <!-- k=8: 36 channels -->
  <rect x="505" y="330" width="50" height="90" fill="#e94560" rx="2" filter="url(#glow)"/>
  <text x="530" y="440" fill="#e0e0ff" font-size="11" text-anchor="middle" font-weight="bold">k=8</text>
  <text x="530" y="326" fill="#e94560" font-size="12" text-anchor="middle" font-weight="bold">36</text>
  <text x="530" y="458" fill="#ff6b6b" font-size="9" text-anchor="middle" font-weight="bold">𝕆</text>

  <!-- k=16: 136 channels -->
  <rect x="590" y="80" width="50" height="340" fill="url(#barGrad)" rx="2" filter="url(#glow)"/>
  <text x="615" y="440" fill="#e0e0ff" font-size="11" text-anchor="middle" font-weight="bold">k=16</text>
  <text x="615" y="76" fill="#e94560" font-size="14" text-anchor="middle" font-weight="bold">136</text>
  <text x="615" y="458" fill="#ff9800" font-size="9" text-anchor="middle" font-weight="bold">𝕊</text>

  <!-- k=32: 528 (shown as arrow) -->
  <text x="690" y="440" fill="#8080a0" font-size="11" text-anchor="middle">k=32</text>
  <text x="690" y="100" fill="#a0a0c0" font-size="11" text-anchor="middle">528↑</text>
  <line x1="690" y1="110" x2="690" y2="420" stroke="#4a4a6a" stroke-width="2" stroke-dasharray="6"/>

  <!-- Annotations -->
  <rect x="460" y="470" width="300" height="25" fill="#1a1a3e" rx="5" stroke="#e94560" stroke-width="1"/>
  <text x="610" y="487" fill="#e0e0ff" font-size="11" text-anchor="middle">
    🔴 Octonion k=8: 12× improvement over k=2
  </text>

  <!-- Quadratic curve overlay -->
  <path d="M 140,417 Q 300,400 530,330" fill="none" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="5" opacity="0.6"/>
  <text x="350" y="365" fill="#ffd54f" font-size="10" transform="rotate(-15, 350, 365)" opacity="0.7">
    ∝ k²/2
  </text>
</svg>
