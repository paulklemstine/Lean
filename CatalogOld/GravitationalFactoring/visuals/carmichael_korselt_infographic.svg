<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#151a2a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">
    Carmichael Numbers &amp; Korselt's Criterion
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#88aacc" font-size="13">
    The Composites That Masquerade as Primes — Formally Verified in Lean 4
  </text>

  <!-- Fermat's test box -->
  <rect x="30" y="80" width="400" height="120" rx="10" fill="#1a0a0a" stroke="#ff4444" stroke-width="2"/>
  <text x="230" y="105" text-anchor="middle" fill="#ff6666" font-size="15" font-weight="bold">Fermat's Test</text>
  <text x="45" y="128" fill="#ffaaaa" font-size="12">If p is prime, then a^(p-1) ≡ 1 (mod p)</text>
  <text x="45" y="148" fill="#ffaaaa" font-size="12">for all a coprime to p.</text>
  <text x="45" y="175" fill="#ff8888" font-size="11">⚠ Some composites also pass! These are</text>
  <text x="45" y="192" fill="#ff8888" font-size="11">   called Carmichael numbers.</text>

  <!-- Korselt's criterion box -->
  <rect x="470" y="80" width="400" height="120" rx="10" fill="#0a1a0a" stroke="#00cc44" stroke-width="2"/>
  <text x="670" y="105" text-anchor="middle" fill="#00ff66" font-size="15" font-weight="bold">Korselt's Criterion (1899)</text>
  <text x="485" y="128" fill="#88ddaa" font-size="12">n is Carmichael if and only if:</text>
  <text x="485" y="150" fill="#88ddaa" font-size="12">  1. n is squarefree</text>
  <text x="485" y="170" fill="#88ddaa" font-size="12">  2. For every prime p | n: (p-1) | (n-1)</text>
  <text x="485" y="192" fill="#00cc44" font-size="11">✓ Verified for 561 and 1729 in Lean 4</text>

  <!-- 561 analysis -->
  <rect x="30" y="220" width="410" height="200" rx="10" fill="#0a0e1a" stroke="#44aaff" stroke-width="2"/>
  <text x="235" y="245" text-anchor="middle" fill="#66ccff" font-size="16" font-weight="bold">561 = 3 × 11 × 17</text>
  <text x="235" y="265" text-anchor="middle" fill="#88aacc" font-size="12">The Smallest Carmichael Number</text>

  <!-- Squarefree check -->
  <rect x="45" y="280" width="180" height="25" rx="4" fill="#0a2a0a" stroke="#00cc44" stroke-width="1"/>
  <text x="135" y="297" text-anchor="middle" fill="#00ff66" font-size="11">✓ Squarefree</text>

  <!-- Divisibility checks -->
  <text x="50" y="325" fill="#ffffff" font-size="12">Korselt checks (n-1 = 560):</text>
  <text x="60" y="345" fill="#88ddaa" font-size="11">✓ (3-1) = 2  |  560  (560/2 = 280)</text>
  <text x="60" y="365" fill="#88ddaa" font-size="11">✓ (11-1) = 10  |  560  (560/10 = 56)</text>
  <text x="60" y="385" fill="#88ddaa" font-size="11">✓ (17-1) = 16  |  560  (560/16 = 35)</text>

  <text x="50" y="410" fill="#ff8888" font-size="11">Fermat: 11/11 coprime bases pass → FOOLED</text>

  <!-- 1729 analysis -->
  <rect x="460" y="220" width="410" height="200" rx="10" fill="#0a0e1a" stroke="#ffaa00" stroke-width="2"/>
  <text x="665" y="245" text-anchor="middle" fill="#ffcc44" font-size="16" font-weight="bold">1729 = 7 × 13 × 19</text>
  <text x="665" y="265" text-anchor="middle" fill="#ffaa88" font-size="12">Hardy-Ramanujan Taxicab Number</text>

  <!-- Squarefree check -->
  <rect x="475" y="280" width="180" height="25" rx="4" fill="#0a2a0a" stroke="#00cc44" stroke-width="1"/>
  <text x="565" y="297" text-anchor="middle" fill="#00ff66" font-size="11">✓ Squarefree</text>

  <!-- Divisibility checks -->
  <text x="480" y="325" fill="#ffffff" font-size="12">Korselt checks (n-1 = 1728):</text>
  <text x="490" y="345" fill="#88ddaa" font-size="11">✓ (7-1) = 6  |  1728  (1728/6 = 288)</text>
  <text x="490" y="365" fill="#88ddaa" font-size="11">✓ (13-1) = 12  |  1728  (1728/12 = 144)</text>
  <text x="490" y="385" fill="#88ddaa" font-size="11">✓ (19-1) = 18  |  1728  (1728/18 = 96)</text>

  <text x="480" y="410" fill="#ffcc44" font-size="11">Also: 1729 = 1³+12³ = 9³+10³ ✓</text>

  <!-- Miller-Rabin saves the day -->
  <rect x="30" y="440" width="840" height="100" rx="10" fill="#1a1a0a" stroke="#ffaa00" stroke-width="2"/>
  <text x="450" y="465" text-anchor="middle" fill="#ffcc44" font-size="15" font-weight="bold">
    Miller-Rabin Catches Carmichael Numbers!
  </text>
  <text x="50" y="490" fill="#ffffff" font-size="12">
    While Fermat's test is fooled by all Carmichael numbers, Miller-Rabin catches them:
  </text>
  <text x="50" y="515" fill="#88ddaa" font-size="12">
    ✓ For 561: base 7 is a witness — 7^280 mod 561 ≠ 1 and ≠ 560  (formally verified)
  </text>
  <text x="50" y="530" fill="#88ddaa" font-size="12">
    ✓ For any prime p: MR test always passes — no witness exists  (formally verified)
  </text>

  <!-- First 7 Carmichael numbers -->
  <rect x="30" y="555" width="840" height="120" rx="10" fill="#0a0e1a" stroke="#334466" stroke-width="1.5"/>
  <text x="450" y="580" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">
    The First Seven Carmichael Numbers (All Factorizations Verified ✓)
  </text>

  <text x="60" y="605" fill="#88ddaa" font-size="13">561 = 3·11·17</text>
  <text x="250" y="605" fill="#88ddaa" font-size="13">1105 = 5·13·17</text>
  <text x="450" y="605" fill="#88ddaa" font-size="13">1729 = 7·13·19</text>
  <text x="650" y="605" fill="#88ddaa" font-size="13">2465 = 5·17·29</text>

  <text x="60" y="635" fill="#88ddaa" font-size="13">2821 = 7·13·31</text>
  <text x="250" y="635" fill="#88ddaa" font-size="13">6601 = 7·23·41</text>
  <text x="450" y="635" fill="#88ddaa" font-size="13">8911 = 7·19·67</text>

  <text x="650" y="635" fill="#aaaaaa" font-size="11">All have exactly</text>
  <text x="650" y="652" fill="#aaaaaa" font-size="11">3 prime factors!</text>

  <!-- Footer -->
  <text x="450" y="690" text-anchor="middle" fill="#556677" font-size="11">
    Gravitational Factoring Project v12 — Formally verified in Lean 4 with Mathlib v4.28.0
  </text>
</svg>
