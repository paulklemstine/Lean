    Gravitational Factoring — Theorem Dependency Map v11
  </text>
  <text x="600" y="70" text-anchor="middle" fill="#aaa" font-size="14">
    300+ Formally Verified Results • 10 Theorem Clusters • 8 Lean Files
  </text>
  
  <!-- Legend -->
