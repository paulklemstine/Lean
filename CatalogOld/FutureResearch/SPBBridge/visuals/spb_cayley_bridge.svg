<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:0.3"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    The Cayley Transform Bridge
  </text>
  <text x="450" y="65" text-anchor="middle" font-size="14" fill="#7f8c8d">
    How SPB on ℝ becomes multiplication on S¹
  </text>

  <!-- LEFT: Real line with SPB -->
  <g transform="translate(100, 300)">
    <!-- Real line -->
    <line x1="-80" y1="0" x2="280" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <polygon points="280,0 270,-5 270,5" fill="#2c3e50"/>
    <polygon points="-80,0 -70,-5 -70,5" fill="#2c3e50"/>

    <!-- Points on real line -->
    <circle cx="0" cy="0" r="6" fill="#e74c3c"/>
    <text x="0" y="25" text-anchor="middle" font-size="13" fill="#e74c3c">0</text>

    <circle cx="60" cy="0" r="6" fill="#2980b9"/>
    <text x="60" y="25" text-anchor="middle" font-size="13" fill="#2980b9">x</text>

    <circle cx="140" cy="0" r="6" fill="#27ae60"/>
    <text x="140" y="25" text-anchor="middle" font-size="13" fill="#27ae60">y</text>

    <circle cx="220" cy="0" r="6" fill="#8e44ad"/>
    <text x="220" y="25" text-anchor="middle" font-size="13" fill="#8e44ad">spb(x,y)</text>

    <!-- SPB operation label -->
    <text x="100" y="-50" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">
      ℝ ∪ {∞}
    </text>
    <text x="100" y="-25" text-anchor="middle" font-size="14" fill="#7f8c8d">
      SPB group: spb(x,y) = (x+y)/(1−xy)
    </text>

    <!-- Bracket showing operation -->
    <path d="M 60,-10 Q 100,-35 140,-10" fill="none" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="100" y="-40" text-anchor="middle" font-size="11" fill="#7f8c8d">spb</text>
  </g>

  <!-- RIGHT: Unit circle with multiplication -->
  <g transform="translate(680, 300)">
    <!-- Unit circle -->
    <circle cx="0" cy="0" r="120" fill="url(#circleGrad)" stroke="#2c3e50" stroke-width="2"/>

    <!-- Axes -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#bdc3c7" stroke-width="1"/>

    <!-- Points on circle: C(0) = 1, C(x) = e^(2i·arctan(x)), C(y), C(spb(x,y)) -->
    <!-- C(0) = 1 -->
    <circle cx="120" cy="0" r="6" fill="#e74c3c"/>
    <text x="140" y="5" font-size="13" fill="#e74c3c">C(0)=1</text>

    <!-- C(x) at angle ~53° (for x≈1.33) -->
    <circle cx="72" cy="-96" r="6" fill="#2980b9"/>
    <text x="82" y="-100" font-size="13" fill="#2980b9">C(x)</text>

    <!-- C(y) at angle ~90° -->
    <circle cx="-36" cy="-114" r="6" fill="#27ae60"/>
    <text x="-26" y="-118" font-size="13" fill="#27ae60">C(y)</text>

    <!-- C(spb(x,y)) at angle ~143° -->
    <circle cx="-96" cy="-72" r="6" fill="#8e44ad"/>
    <text x="-135" y="-75" font-size="13" fill="#8e44ad">C(x)·C(y)</text>

    <!-- Arc showing angle addition -->
    <path d="M 120,0 A 120,120 0 0,0 72,-96" fill="none" stroke="#2980b9" stroke-width="2.5"/>
    <path d="M 72,-96 A 120,120 0 0,0 -96,-72" fill="none" stroke="#27ae60" stroke-width="2.5"/>

    <!-- Labels -->
    <text x="0" y="-155" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">
      S¹ ⊂ ℂ
    </text>
    <text x="0" y="160" text-anchor="middle" font-size="14" fill="#7f8c8d">
      Multiplication: C(x) · C(y)
    </text>
  </g>

  <!-- Cayley transform arrows -->
  <g>
    <!-- Forward arrow -->
    <path d="M 380,240 Q 450,180 520,240" fill="none" stroke="#2980b9" stroke-width="2.5"
          marker-end="url(#arrowBlue)"/>
    <text x="450" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#2980b9">
      Cayley Transform
    </text>
    <text x="450" y="205" text-anchor="middle" font-size="13" fill="#2980b9">
      C(x) = (1+ix)/(1−ix)
    </text>

    <!-- Backward arrow -->
    <path d="M 520,360 Q 450,420 380,360" fill="none" stroke="#c0392b" stroke-width="2.5"
          marker-end="url(#arrowRed)"/>
    <text x="450" y="415" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">
      Inverse Cayley
    </text>
    <text x="450" y="435" text-anchor="middle" font-size="13" fill="#c0392b">
      C⁻¹(z) = i(1−z)/(1+z)
    </text>
  </g>

  <!-- Key equation -->
  <rect x="200" y="490" width="500" height="60" rx="10" fill="#2c3e50" opacity="0.9"/>
  <text x="450" y="520" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
    C(spb(x, y)) = C(x) · C(y)
  </text>
  <text x="450" y="540" text-anchor="middle" font-size="13" fill="#ecf0f1">
    The Cayley transform is a group homomorphism from (ℝ∪{∞}, spb) to (S¹, ·)
  </text>

  <!-- Side annotations -->
  <text x="30" y="520" font-size="11" fill="#7f8c8d">Identity: 0 ↦ 1</text>
  <text x="30" y="540" font-size="11" fill="#7f8c8d">Inverse: −x ↦ C(x)⁻¹</text>
  <text x="30" y="560" font-size="11" fill="#7f8c8d">tan(θ) ↦ e^(2iθ)</text>

  <text x="770" y="520" font-size="11" fill="#7f8c8d" text-anchor="end">|C(x)| = 1 ∀x∈ℝ</text>
  <text x="770" y="540" font-size="11" fill="#7f8c8d" text-anchor="end">Angles add</text>
  <text x="770" y="560" font-size="11" fill="#7f8c8d" text-anchor="end">Bijective ℝ∪{∞} ↔ S¹</text>
</svg>
