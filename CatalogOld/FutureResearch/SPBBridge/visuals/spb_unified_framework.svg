<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Georgia, serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a2e">
    The SPB Universe: One Formula, Many Worlds
  </text>
  <text x="500" y="72" text-anchor="middle" font-size="16" fill="#6c757d" font-style="italic">
    spb(x, y) = (x + y) / (1 − xy)
  </text>

  <!-- Central node -->
  <circle cx="500" cy="350" r="65" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="500" y="340" text-anchor="middle" font-size="18" font-weight="bold" fill="white">SPB</text>
  <text x="500" y="362" text-anchor="middle" font-size="12" fill="#fce4e4">(x+y)/(1−xy)</text>

  <!-- Branches -->
  <!-- 1. Trigonometry (top-left) -->
  <line x1="450" y1="300" x2="200" y2="160" stroke="#3498db" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="100" y="110" width="200" height="100" rx="12" fill="#3498db" filter="url(#shadow)"/>
  <text x="200" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Trigonometry</text>
  <text x="200" y="162" text-anchor="middle" font-size="11" fill="#d6eaf8">tan(α+β) = spb(tan α, tan β)</text>
  <text x="200" y="180" text-anchor="middle" font-size="11" fill="#d6eaf8">Machin formulas for π</text>
  <text x="200" y="198" text-anchor="middle" font-size="11" fill="#d6eaf8">Double/triple angle identities</text>

  <!-- 2. Group Theory (top) -->
  <line x1="500" y1="285" x2="500" y2="170" stroke="#2ecc71" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="390" y="110" width="220" height="60" rx="12" fill="#2ecc71" filter="url(#shadow)"/>
  <text x="500" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Circle Group S¹</text>
  <text x="500" y="158" text-anchor="middle" font-size="11" fill="#d5f5e3">Cayley: spb ↔ multiplication</text>

  <!-- 3. Number Theory (top-right) -->
  <line x1="555" y1="305" x2="780" y2="160" stroke="#9b59b6" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="680" y="110" width="220" height="100" rx="12" fill="#9b59b6" filter="url(#shadow)"/>
  <text x="790" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Number Theory</text>
  <text x="790" y="162" text-anchor="middle" font-size="11" fill="#ebdef0">p±1 law over 𝔽_p</text>
  <text x="790" y="180" text-anchor="middle" font-size="11" fill="#ebdef0">Quadratic residues</text>
  <text x="790" y="198" text-anchor="middle" font-size="11" fill="#ebdef0">Gaussian integers</text>

  <!-- 4. Physics (left) -->
  <line x1="435" y1="350" x2="200" y2="350" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="60" y="300" width="210" height="100" rx="12" fill="#e67e22" filter="url(#shadow)"/>
  <text x="165" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Special Relativity</text>
  <text x="165" y="352" text-anchor="middle" font-size="11" fill="#fdebd0">Sign flip: (x+y)/(1+xy)</text>
  <text x="165" y="370" text-anchor="middle" font-size="11" fill="#fdebd0">Einstein velocity addition</text>
  <text x="165" y="388" text-anchor="middle" font-size="11" fill="#fdebd0">Thomas precession (quaternionic)</text>

  <!-- 5. Hyperbolic Geometry (right) -->
  <line x1="565" y1="350" x2="770" y2="350" stroke="#1abc9c" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="700" y="300" width="220" height="100" rx="12" fill="#1abc9c" filter="url(#shadow)"/>
  <text x="810" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Hyperbolic Geometry</text>
  <text x="810" y="352" text-anchor="middle" font-size="11" fill="#d1f2eb">Wick rotation: S¹ → H¹</text>
  <text x="810" y="370" text-anchor="middle" font-size="11" fill="#d1f2eb">Poincaré disk model</text>
  <text x="810" y="388" text-anchor="middle" font-size="11" fill="#d1f2eb">Velocity space geometry</text>

  <!-- 6. Tropical Math (bottom-left) -->
  <line x1="450" y1="400" x2="210" y2="540" stroke="#f39c12" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="80" y="500" width="230" height="100" rx="12" fill="#f39c12" filter="url(#shadow)"/>
  <text x="195" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Tropical SPB</text>
  <text x="195" y="552" text-anchor="middle" font-size="11" fill="#fef9e7">max(x,y) − max(0,x+y)</text>
  <text x="195" y="570" text-anchor="middle" font-size="11" fill="#fef9e7">Piecewise-linear geometry</text>
  <text x="195" y="588" text-anchor="middle" font-size="11" fill="#fef9e7">Combinatorial optimization</text>

  <!-- 7. Machine Learning (bottom) -->
  <line x1="500" y1="415" x2="500" y2="520" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="380" y="500" width="240" height="80" rx="12" fill="#c0392b" filter="url(#shadow)"/>
  <text x="500" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Neural Networks</text>
  <text x="500" y="552" text-anchor="middle" font-size="11" fill="#fadbd8">SPB neurons: bounded, smooth</text>
  <text x="500" y="570" text-anchor="middle" font-size="11" fill="#fadbd8">Universal approximation</text>

  <!-- 8. Quantum Computing (bottom-right) -->
  <line x1="555" y1="400" x2="780" y2="540" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="680" y="500" width="230" height="100" rx="12" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="795" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Quantum Computing</text>
  <text x="795" y="552" text-anchor="middle" font-size="11" fill="#d5d8dc">SU(2) gate decomposition</text>
  <text x="795" y="570" text-anchor="middle" font-size="11" fill="#d5d8dc">Bloch sphere rotations</text>
  <text x="795" y="588" text-anchor="middle" font-size="11" fill="#d5d8dc">Stabilizer codes via p±1</text>

  <!-- EML connection -->
  <rect x="380" y="630" width="240" height="50" rx="8" fill="none" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="500" y="652" text-anchor="middle" font-size="13" fill="#7f8c8d">EML Bridge: exp(x) − ln(y)</text>
  <text x="500" y="670" text-anchor="middle" font-size="11" fill="#95a5a6">Arithmetic dual of SPB</text>
  <line x1="500" y1="415" x2="500" y2="630" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4"/>
</svg>
