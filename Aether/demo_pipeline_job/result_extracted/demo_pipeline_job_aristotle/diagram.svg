<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Non-Archimedean Factoring Oracle — Proof Structure
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEFT: The set ℕ_{>1} split into Primes and Composites -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Big set: ℕ_{>1} -->
  <ellipse cx="200" cy="230" rx="170" ry="160" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <text x="200" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2c3e50" font-weight="bold">
    ℕ_{&gt;1}
  </text>

  <!-- Primes region (top) -->
  <ellipse cx="200" cy="170" rx="120" ry="70" fill="url(#primeGrad)" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="200" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e74c3c" font-weight="bold">
    Primes
  </text>
  <text x="200" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b">
    2, 3, 5, 7, 11, 13, …
  </text>
  <text x="200" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#e74c3c" font-style="italic">
    ✗ No nontrivial factorization
  </text>

  <!-- Composites region (bottom) -->
  <ellipse cx="200" cy="310" rx="130" ry="65" fill="url(#compGrad)" stroke="#27ae60" stroke-width="2"/>
  <text x="200" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#27ae60" font-weight="bold">
    Composites
  </text>
  <text x="200" y="310" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e8449">
    4, 6, 8, 9, 10, 12, …
  </text>
  <text x="200" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#27ae60" font-style="italic">
    ✓ Theorem applies here
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- CENTER: The factoring oracle arrow -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Arrow from composites to the factorization box -->
  <line x1="335" y1="310" x2="430" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" transform="rotate(-20, 370, 270)">
    oracle
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- RIGHT: Factorization output -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Factorization box -->
  <rect x="440" y="130" width="320" height="250" rx="12" fill="white" stroke="#2c3e50" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">
    Factorization Witness
  </text>

  <!-- n = a × b diagram -->
  <text x="600" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2c3e50">
    n = a × b
  </text>

  <!-- Conditions -->
  <rect x="475" y="215" width="250" height="30" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1"/>
  <text x="600" y="235" text-anchor="middle" font-family="monospace" font-size="13" fill="#2980b9">
    a &gt; 1  ∧  b &gt; 1  ∧  a·b = n
  </text>

  <!-- Construction details -->
  <text x="470" y="275" font-family="Georgia, serif" font-size="12" fill="#555">
    Construction (from Lean proof):
  </text>
  <text x="490" y="298" font-family="monospace" font-size="12" fill="#8e44ad">
    a := minFac(n)
  </text>
  <text x="490" y="318" font-family="monospace" font-size="12" fill="#8e44ad">
    b := n / minFac(n)
  </text>
  <text x="470" y="345" font-family="Georgia, serif" font-size="11" fill="#555" font-style="italic">
    Key lemma: Nat.exists_dvd_of_not_prime2
  </text>
  <text x="470" y="365" font-family="Georgia, serif" font-size="11" fill="#555" font-style="italic">
    Product recovery: Nat.mul_div_cancel'
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BOTTOM: Example -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <rect x="50" y="420" width="700" height="55" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/>
  <text x="400" y="443" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#d35400" font-weight="bold">
    Example: n = 1729 (Hardy–Ramanujan number)
  </text>
  <text x="400" y="463" text-anchor="middle" font-family="monospace" font-size="12" fill="#a04000">
    minFac(1729) = 7  →  a = 7, b = 247  →  7 × 247 = 1729 ✓  (both &gt; 1)
  </text>

  <!-- Caption -->
  <text x="400" y="505" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d" font-style="italic">
    The factoring oracle extracts a nontrivial divisor for any composite n &gt; 1, producing a certified splitting n = a · b.
  </text>
</svg>
