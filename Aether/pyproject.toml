[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "1.0.0"
description = "Aether — autonomous mathematical research system (discover, prove, package, publish)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "aristotlelib>=2.0.0",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

# NOTE: Aether uses a flat layout (modules at the repo root), so this metadata
# does not declare an installable `aether` package or console_scripts. Run from
# source: `python3 aether_tick.py ...`. See README.md.

[tool.pytest.ini_options]
asyncio_mode = "auto"