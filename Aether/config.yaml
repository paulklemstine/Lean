# AETHER v3 Configuration
# Pi-Agent Centered Autonomous Math Research Engine

pi_agent:
  model: "openai-large"
  ollama_base_url: "http://127.0.0.1:11434"
  timeout: 600
  max_catalog_references: 12
  max_lines_per_reference: 150
  temperature: 0.85
  top_p: 0.92
  num_predict: 4096
  research_modes:
    - prove
    - formalize
    - counterexample
    - sorry_fill

aristotle:
  api_base_url: "https://aristotle.harmonic.fun/api/v1"
  api_key: "${ARISTOTLE_API_KEY}"
  timeout_seconds: 7200
  polling_interval_seconds: 30
  max_retries: 3
  retry_backoff_base: 2.0
  concurrent_jobs: 10
  demo_mode: false

catalog:
  root_dir: "../Catalog"
  db_path: "../Tools/output/catalog.json"
  build_dir: "../../CatalogBuild"
  lean_version: "v4.28.0"
  mathlib_version: "v4.28.0"
  shared_threshold: 5

output_organizer:
  papers_dir: "Applications/Papers"
  demos_dir: "Applications/Demos"
  visuals_dir: "Applications/Visuals"
  articles_dir: "Applications/Articles"
  raw_output_dir: "ResearchOutput"
  speculative_dir: "Speculative/AutoResearch"
  require_pi_agent_classification: true
  max_sorry_count_for_direct_placement: 0

autoresearch:
  enabled: true
  metric_name: "concept_quality"
  metric_unit: ""
  direction: "higher"
  max_retries: 3

research:
  arcs:
    - id: "gravitational_factoring"
      name: "Gravitational Factoring"
      description: "Using geometric/spacetime structures for integer factorization"
      seed_domains: ["Pythagorean", "Geometry", "Algebra"]
      frontier: "Tropical analogues of gravitational lenses"
      target_sorry_reduction: 5
      difficulty: "phd"

    - id: "quantum_pythagoras"
      name: "Quantum Pythagoras"
      description: "Formalizing quantum computing on Berggren tree structures"
      seed_domains: ["Pythagorean", "Cryptography", "Computation"]
      frontier: "QDF (Quantum Diophantine Factoring)"
      target_sorry_reduction: 3
      difficulty: "phd"

    - id: "tropical_langlands"
      name: "Tropical Langlands"
      description: "Tropical geometry meets representation theory"
      seed_domains: ["Tropical", "Algebra", "Bridges"]
      frontier: "Tropical automorphic forms"
      target_sorry_reduction: 2
      difficulty: "master"

    - id: "neural_proof_mining"
      name: "Neural Proof Mining"
      description: "ML-guided theorem discovery"
      seed_domains: ["MachineLearning", "Logic", "Computation"]
      frontier: "RSIL adaptive distillation"
      target_sorry_reduction: 4
      difficulty: "phd"

    - id: "temporal_computation"
      name: "Temporal Computation"
      description: "Time-travel logic and reversible computation"
      seed_domains: ["Logic", "Computation", "Speculative"]
      frontier: "OISCC oracle hierarchies"
      target_sorry_reduction: 3
      difficulty: "phd"

    - id: "eml_cosmology"
      name: "EML Cosmology"
      description: "Emergent meta-language as universe model"
      seed_domains: ["EML", "Physics", "Bridges"]
      frontier: "Self-pairing in curved spacetime"
      target_sorry_reduction: 2
      difficulty: "master"

    - id: "cryptographic_gravity"
      name: "Cryptographic Gravity"
      description: "Post-quantum crypto via geometric invariants"
      seed_domains: ["Cryptography", "Geometry", "Pythagorean"]
      frontier: "Lattice reduction in Berggren trees"
      target_sorry_reduction: 3
      difficulty: "phd"

    - id: "speculative_scifi"
      name: "Speculative Sci-Fi Mathematics"
      description: "Formalizing science-fictional mathematical concepts"
      seed_domains: ["Speculative", "Physics", "MachineLearning"]
      frontier: "Formal models of hyperspace and alien computation"
      target_sorry_reduction: 10
      difficulty: "open_problem"

    # Research arcs derived from FUTURE_RESEARCH.md findings (v3 cycle results)
    - id: "niven_integral_completion"
      name: "Niven Integral Completion"
      description: "Complete Niven's proof of irrationality via integration-by-parts recurrence lemma"
      seed_domains: ["Bridges", "Algebra", "Pythagorean"]
      frontier: "Integration-by-parts integrality lemma for Niven's method"
      target_sorry_reduction: 3
      difficulty: "phd"

    - id: "carmichael_composite"
      name: "Carmichael's Theorem Composite Case"
      description: "Prove Fibonacci primitive divisor theorem for composite indices via lifting-the-exponent"
      seed_domains: ["Pythagorean", "Algebra", "Cryptography"]
      frontier: "Lifting-the-exponent lemma for Fibonacci primitive divisors"
      target_sorry_reduction: 2
      difficulty: "phd"

    - id: "tropical_langlands_gl2"
      name: "Tropical Langlands GL₂"
      description: "Formalize tropical Hecke algebra for GL₂ and prove trace formula equality"
      seed_domains: ["Tropical", "Algebra", "Bridges"]
      frontier: "Tropical Hecke operators and Satake isomorphism for GL₂"
      target_sorry_reduction: 4
      difficulty: "open_problem"

    - id: "tropical_neural_robustness"
      name: "Tropical Neural Certified Robustness"
      description: "Prove certified robustness bounds for neural networks via tropical degree"
      seed_domains: ["MachineLearning", "Tropical", "Bridges"]
      frontier: "Tropical degree as certified L-infinity robustness certificate"
      target_sorry_reduction: 3
      difficulty: "phd"

    - id: "dilithium_security"
      name: "CRYSTALS-Dilithium Security Reduction"
      description: "Formalize the security reduction skeleton for CRYSTALS-Dilithium post-quantum scheme"
      seed_domains: ["Cryptography", "Computation", "Physics"]
      frontier: "Module-SIS to Dilithium security reduction"
      target_sorry_reduction: 3
      difficulty: "phd"

    - id: "berggren_factoring_optimized"
      name: "Optimized Berggren Factoring"
      description: "Improve Berggren tree factoring with birthday-paradox collision detection"
      seed_domains: ["Pythagorean", "Cryptography", "Computation"]
      frontier: "Sub-exponential factoring via Berggren tree collision search"
      target_sorry_reduction: 3
      difficulty: "master"

    - id: "eml_universal_approximation"
      name: "EML Universal Approximation"
      description: "Prove universal approximation theorem for EML neural networks"
      seed_domains: ["MachineLearning", "Bridges", "EML"]
      frontier: "EML network density and universal approximation via Stone-Weierstrass"
      target_sorry_reduction: 2
      difficulty: "master"

    - id: "spb_cryptographic_protocol"
      name: "SPB Cryptographic Protocol Security"
      description: "Formalize security analysis of SPB-based Diffie-Hellman key exchange"
      seed_domains: ["Cryptography", "Pythagorean", "Bridges"]
      frontier: "Discrete logarithm hardness in SPB group structures"
      target_sorry_reduction: 2
      difficulty: "phd"

    - id: "idempotent_optimization_deep"
      name: "Deep Idempotent Optimization"
      description: "Extend tropical semiring optimization to policy iteration and value iteration convergence"
      seed_domains: ["Tropical", "MachineLearning", "Bridges"]
      frontier: "Convergence guarantees for tropical policy iteration"
      target_sorry_reduction: 3
      difficulty: "phd"

  difficulty_levels: ["undergraduate", "graduate", "phd", "master", "open_problem"]
  max_concurrent_cycles: 10
  cycle_interval_seconds: 300
  max_retries_per_cycle: 3

telemetry:
  log_dir: "./logs"
  experiment_registry: "./logs/experiments.jsonl"
  benchmark_file: "./logs/benchmarks.json"
  report_output: "./logs/telemetry_report.html"
  metrics_interval_seconds: 60

git:
  auto_push: true
  commit_template: "AETHER v3 cycle #{cycle}: {concept_title}"