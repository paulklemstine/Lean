<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">ReLU Networks ≡ Tropical Polynomials</text>
  <text x="450" y="55" text-anchor="middle" fill="#aaa" font-size="12">Formally verified equivalence: piecewise-linear functions = tropical rational functions</text>

  <!-- Left panel: ReLU Network -->
  <g transform="translate(30, 80)">
    <rect width="380" height="370" rx="12" fill="#0d1b2a" stroke="#4ecdc4" stroke-width="1.5" opacity="0.9"/>
    <text x="190" y="30" text-anchor="middle" fill="#4ecdc4" font-size="16" font-weight="bold">ReLU Neural Network</text>

    <!-- Network diagram -->
    <!-- Input -->
    <circle cx="80" cy="190" r="18" fill="#2d6a4f" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="80" y="195" text-anchor="middle" fill="#fff" font-size="12">x</text>

    <!-- Hidden layer -->
    <circle cx="190" cy="120" r="18" fill="#e17055" stroke="#fab1a0" stroke-width="1.5"/>
    <text x="190" y="124" text-anchor="middle" fill="#fff" font-size="9">ReLU</text>

    <circle cx="190" cy="190" r="18" fill="#e17055" stroke="#fab1a0" stroke-width="1.5"/>
    <text x="190" y="194" text-anchor="middle" fill="#fff" font-size="9">ReLU</text>

    <circle cx="190" cy="260" r="18" fill="#e17055" stroke="#fab1a0" stroke-width="1.5"/>
    <text x="190" y="264" text-anchor="middle" fill="#fff" font-size="9">ReLU</text>

    <!-- Output -->
    <circle cx="300" cy="190" r="18" fill="#6c5ce7" stroke="#a29bfe" stroke-width="1.5"/>
    <text x="300" y="195" text-anchor="middle" fill="#fff" font-size="12">y</text>

    <!-- Connections -->
    <g stroke="#4ecdc4" stroke-width="1" opacity="0.5">
      <line x1="98" y1="185" x2="172" y2="125"/>
      <line x1="98" y1="190" x2="172" y2="190"/>
      <line x1="98" y1="195" x2="172" y2="255"/>
      <line x1="208" y1="125" x2="282" y2="185"/>
      <line x1="208" y1="190" x2="282" y2="190"/>
      <line x1="208" y1="255" x2="282" y2="195"/>
    </g>

    <!-- Weights -->
    <text x="130" y="148" fill="#ffd93d" font-size="9">w₁</text>
    <text x="130" y="185" fill="#ffd93d" font-size="9">w₂</text>
    <text x="130" y="232" fill="#ffd93d" font-size="9">w₃</text>

    <!-- ReLU function plot -->
    <g transform="translate(50, 280)">
      <text x="130" y="10" text-anchor="middle" fill="#aaa" font-size="10">ReLU(x) = max(0, x)</text>
      <line x1="30" y1="60" x2="260" y2="60" stroke="#555" stroke-width="1"/>
      <line x1="130" y1="20" x2="130" y2="70" stroke="#555" stroke-width="1"/>
      <!-- ReLU curve -->
      <polyline points="30,60 130,60 230,10" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
      <text x="230" y="8" fill="#ff6b6b" font-size="9">y=x</text>
      <text x="50" y="55" fill="#888" font-size="9">y=0</text>
    </g>
  </g>

  <!-- Equals sign -->
  <g transform="translate(430, 250)">
    <text x="0" y="0" text-anchor="middle" fill="#ffd93d" font-size="40" font-weight="bold">≡</text>
    <text x="0" y="25" text-anchor="middle" fill="#ffd93d" font-size="10">formally</text>
    <text x="0" y="37" text-anchor="middle" fill="#ffd93d" font-size="10">verified</text>
  </g>

  <!-- Right panel: Tropical Polynomial -->
  <g transform="translate(490, 80)">
    <rect width="380" height="370" rx="12" fill="#0d1b2a" stroke="#ffd93d" stroke-width="1.5" opacity="0.9"/>
    <text x="190" y="30" text-anchor="middle" fill="#ffd93d" font-size="16" font-weight="bold">Tropical Polynomial</text>

    <!-- Tropical semiring -->
    <g transform="translate(30, 50)">
      <rect width="320" height="70" rx="8" fill="#1a2a1a" stroke="#4ecdc4" stroke-width="1" opacity="0.8"/>
      <text x="160" y="20" text-anchor="middle" fill="#4ecdc4" font-size="12" font-weight="bold">Tropical Semiring (ℝ, ⊕, ⊗)</text>
      <text x="160" y="40" text-anchor="middle" fill="#ccc" font-size="11">a ⊕ b = max(a, b)</text>
      <text x="160" y="57" text-anchor="middle" fill="#ccc" font-size="11">a ⊗ b = a + b</text>
    </g>

    <!-- Tropical polynomial expression -->
    <g transform="translate(30, 140)">
      <text x="160" y="0" text-anchor="middle" fill="#fff" font-size="12">Network output as tropical polynomial:</text>
      <text x="160" y="25" text-anchor="middle" fill="#ffd93d" font-size="13" font-weight="bold">p(x) = ⊕ᵢ (aᵢ ⊗ x)</text>
      <text x="160" y="48" text-anchor="middle" fill="#ccc" font-size="11">= max(a₁ + w₁x, a₂ + w₂x, a₃ + w₃x, 0)</text>
    </g>

    <!-- Piecewise linear plot -->
    <g transform="translate(30, 200)">
      <text x="160" y="0" text-anchor="middle" fill="#aaa" font-size="10">Piecewise-linear function (tropical polynomial evaluation)</text>
      <rect x="20" y="10" width="280" height="130" fill="#0a1520" rx="5"/>

      <!-- Axes -->
      <line x1="40" y1="130" x2="280" y2="130" stroke="#555" stroke-width="1"/>
      <line x1="40" y1="130" x2="40" y2="20" stroke="#555" stroke-width="1"/>

      <!-- Multiple linear pieces (the tropical polynomial) -->
      <polyline points="40,100 80,110 130,90 180,50 230,30 280,25"
                fill="none" stroke="#ffd93d" stroke-width="2.5"/>

      <!-- Individual linear functions (shown faded) -->
      <line x1="40" y1="120" x2="280" y2="80" stroke="#ff6b6b" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>
      <line x1="40" y1="130" x2="280" y2="20" stroke="#4ecdc4" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>
      <line x1="40" y1="90" x2="280" y2="100" stroke="#a29bfe" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>

      <!-- Breakpoints -->
      <circle cx="95" cy="107" r="3" fill="#ff6b6b"/>
      <circle cx="155" cy="72" r="3" fill="#ff6b6b"/>

      <text x="95" y="122" text-anchor="middle" fill="#888" font-size="8">breakpoint</text>
      <text x="155" y="87" text-anchor="middle" fill="#888" font-size="8">breakpoint</text>

      <text x="280" y="145" fill="#888" font-size="9">x</text>
      <text x="25" y="20" fill="#888" font-size="9">y</text>
    </g>
  </g>

  <!-- Bottom: Key theorems -->
  <g transform="translate(30, 465)">
    <text x="420" y="0" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Key Verified Theorems:</text>
    <text x="100" y="20" fill="#4ecdc4" font-size="10">• relu_lipschitz_scalar: ReLU is 1-Lipschitz</text>
    <text x="420" y="20" fill="#ffd93d" font-size="10">• lipschitz_compose: L₁·L₂ bound for compositions</text>
    <text x="730" y="20" fill="#a29bfe" font-size="10">• lse2_le_max_log2: LSE error ≤ ln 2</text>
  </g>
</svg>
