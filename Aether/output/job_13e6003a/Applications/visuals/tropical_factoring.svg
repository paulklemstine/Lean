<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f78166"/>
      <stop offset="100%" style="stop-color:#da3633"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#bg2)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#58a6ff" font-size="22" font-weight="bold" filter="url(#glow2)">
    Tropical Valuation Sieve
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-size="12">
    Factoring through p-adic valuations · v_p(ab) = v_p(a) + v_p(b)
  </text>

  <!-- Example: N = 2310 = 2 × 3 × 5 × 7 × 11 -->
  <text x="450" y="90" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="bold">
    N = 2310 = 2 × 3 × 5 × 7 × 11
  </text>

  <!-- Tropical Profile Bar Chart -->
  <text x="100" y="125" fill="#c9d1d9" font-size="14" font-weight="bold">Tropical Profile: p ↦ v_p(2310)</text>
  
  <!-- Axes -->
  <line x1="100" y1="280" x2="800" y2="280" stroke="#30363d" stroke-width="2"/>
  <line x1="100" y1="140" x2="100" y2="280" stroke="#30363d" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="85" y="285" text-anchor="end" fill="#8b949e" font-size="11">0</text>
  <text x="85" y="245" text-anchor="end" fill="#8b949e" font-size="11">1</text>
  <text x="85" y="205" text-anchor="end" fill="#8b949e" font-size="11">2</text>
  <text x="85" y="165" text-anchor="end" fill="#8b949e" font-size="11">3</text>
  
  <!-- Grid lines -->
  <line x1="100" y1="240" x2="800" y2="240" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  <line x1="100" y1="200" x2="800" y2="200" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  <line x1="100" y1="160" x2="800" y2="160" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Bars: v_2=1, v_3=1, v_5=1, v_7=1, v_11=1, v_13=0, v_17=0, ... -->
  <!-- p=2 --> <rect x="130" y="240" width="40" height="40" fill="url(#bar1)" rx="4"/>
  <text x="150" y="298" text-anchor="middle" fill="#c9d1d9" font-size="12">2</text>
  <text x="150" y="235" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1</text>
  
  <!-- p=3 --> <rect x="200" y="240" width="40" height="40" fill="url(#bar1)" rx="4"/>
  <text x="220" y="298" text-anchor="middle" fill="#c9d1d9" font-size="12">3</text>
  <text x="220" y="235" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1</text>
  
  <!-- p=5 --> <rect x="270" y="240" width="40" height="40" fill="url(#bar1)" rx="4"/>
  <text x="290" y="298" text-anchor="middle" fill="#c9d1d9" font-size="12">5</text>
  <text x="290" y="235" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1</text>
  
  <!-- p=7 --> <rect x="340" y="240" width="40" height="40" fill="url(#bar1)" rx="4"/>
  <text x="360" y="298" text-anchor="middle" fill="#c9d1d9" font-size="12">7</text>
  <text x="360" y="235" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1</text>
  
  <!-- p=11 --> <rect x="410" y="240" width="40" height="40" fill="url(#bar1)" rx="4"/>
  <text x="430" y="298" text-anchor="middle" fill="#c9d1d9" font-size="12">11</text>
  <text x="430" y="235" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">1</text>
  
  <!-- p=13 (zero) --> <rect x="480" y="278" width="40" height="2" fill="#30363d" rx="1"/>
  <text x="500" y="298" text-anchor="middle" fill="#484f58" font-size="12">13</text>
  
  <!-- p=17 (zero) --> <rect x="550" y="278" width="40" height="2" fill="#30363d" rx="1"/>
  <text x="570" y="298" text-anchor="middle" fill="#484f58" font-size="12">17</text>
  
  <!-- p=19 (zero) --> <rect x="620" y="278" width="40" height="2" fill="#30363d" rx="1"/>
  <text x="640" y="298" text-anchor="middle" fill="#484f58" font-size="12">19</text>
  
  <!-- p=23 (zero) --> <rect x="690" y="278" width="40" height="2" fill="#30363d" rx="1"/>
  <text x="710" y="298" text-anchor="middle" fill="#484f58" font-size="12">23</text>

  <!-- Second example: N = 360 = 2³ × 3² × 5 -->
  <text x="450" y="340" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="bold">
    N = 360 = 2³ × 3² × 5
  </text>

  <!-- Axes -->
  <line x1="100" y1="520" x2="800" y2="520" stroke="#30363d" stroke-width="2"/>
  <line x1="100" y1="370" x2="100" y2="520" stroke="#30363d" stroke-width="2"/>
  
  <!-- Y labels -->
  <text x="85" y="525" text-anchor="end" fill="#8b949e" font-size="11">0</text>
  <text x="85" y="485" text-anchor="end" fill="#8b949e" font-size="11">1</text>
  <text x="85" y="445" text-anchor="end" fill="#8b949e" font-size="11">2</text>
  <text x="85" y="405" text-anchor="end" fill="#8b949e" font-size="11">3</text>
  
  <!-- Grid -->
  <line x1="100" y1="480" x2="800" y2="480" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  <line x1="100" y1="440" x2="800" y2="440" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  <line x1="100" y1="400" x2="800" y2="400" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- v_2=3 --> <rect x="130" y="400" width="40" height="120" fill="url(#bar2)" rx="4"/>
  <text x="150" y="538" text-anchor="middle" fill="#c9d1d9" font-size="12">2</text>
  <text x="150" y="395" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">3</text>
  
  <!-- v_3=2 --> <rect x="200" y="440" width="40" height="80" fill="url(#bar2)" rx="4"/>
  <text x="220" y="538" text-anchor="middle" fill="#c9d1d9" font-size="12">3</text>
  <text x="220" y="435" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">2</text>
  
  <!-- v_5=1 --> <rect x="270" y="480" width="40" height="40" fill="url(#bar2)" rx="4"/>
  <text x="290" y="538" text-anchor="middle" fill="#c9d1d9" font-size="12">5</text>
  <text x="290" y="475" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold">1</text>
  
  <!-- zeros -->
  <rect x="340" y="518" width="40" height="2" fill="#30363d" rx="1"/>
  <text x="360" y="538" text-anchor="middle" fill="#484f58" font-size="12">7</text>
  <rect x="410" y="518" width="40" height="2" fill="#30363d" rx="1"/>
  <text x="430" y="538" text-anchor="middle" fill="#484f58" font-size="12">11</text>

  <!-- Key insight box -->
  <rect x="480" y="370" width="380" height="150" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="670" y="395" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Key Theorem</text>
  
  <text x="500" y="420" fill="#c9d1d9" font-size="12">smooth_iff_tropical:</text>
  <text x="500" y="440" fill="#8b949e" font-size="11">N is B-smooth ⟺ v_p(N) = 0 for all p > B</text>
  
  <text x="500" y="468" fill="#c9d1d9" font-size="12">semiprime_valuation:</text>
  <text x="500" y="488" fill="#8b949e" font-size="11">For N = pq, v_ℓ(N) = 0 when ℓ ≠ p, q</text>
  
  <text x="500" y="510" fill="#58a6ff" font-size="11" font-style="italic">All verified in Lean 4 with Mathlib</text>

  <!-- Footer -->
  <text x="450" y="580" text-anchor="middle" fill="#3fb950" font-size="13">
    In tropical algebra: multiplication → addition, addition → min
  </text>
  <text x="450" y="600" text-anchor="middle" fill="#8b949e" font-size="11">
    v_p(ab) = v_p(a) + v_p(b)  ·  The prime factorization IS the tropical coordinate system
  </text>
  <text x="450" y="625" text-anchor="middle" fill="#484f58" font-size="10">
    N = ∏ p^(v_p(N)) ←→ tropical vector (v_2(N), v_3(N), v_5(N), v_7(N), ...)
  </text>
</svg>
