<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#636e72"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00b894"/>
    </marker>
  </defs>

  <rect width="1000" height="400" fill="url(#bg6)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">From Verified Theorem to Working Algorithm</text>
  <text x="500" y="55" text-anchor="middle" fill="#8395a7" font-size="12">The SPB Framework Pipeline</text>

  <!-- Step 1: Mathematical Theorem -->
  <rect x="30" y="80" width="180" height="120" rx="12" fill="#1a2744" stroke="#6c5ce7" stroke-width="2"/>
  <text x="120" y="105" text-anchor="middle" fill="#a29bfe" font-size="13" font-weight="bold">① Theorem</text>
  <text x="120" y="130" text-anchor="middle" fill="#dfe6e9" font-size="10">Mathematical claim</text>
  <text x="120" y="148" text-anchor="middle" fill="#dfe6e9" font-size="10">e.g., gcd(F_m,F_n)</text>
  <text x="120" y="163" text-anchor="middle" fill="#dfe6e9" font-size="10">= F_{gcd(m,n)}</text>
  <text x="120" y="185" text-anchor="middle" fill="#636e72" font-size="9">22,334 theorems</text>

  <!-- Arrow -->
  <line x1="210" y1="140" x2="240" y2="140" stroke="#636e72" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Formal Proof -->
  <rect x="250" y="80" width="180" height="120" rx="12" fill="#1a2744" stroke="#00b894" stroke-width="2"/>
  <text x="340" y="105" text-anchor="middle" fill="#55efc4" font-size="13" font-weight="bold">② Lean 4 Proof</text>
  <text x="340" y="130" text-anchor="middle" fill="#dfe6e9" font-size="10">Machine-verified</text>
  <text x="340" y="148" text-anchor="middle" fill="#dfe6e9" font-size="10">proof in Lean 4</text>
  <text x="340" y="163" text-anchor="middle" fill="#dfe6e9" font-size="10">+ Mathlib</text>
  <text x="340" y="185" text-anchor="middle" fill="#636e72" font-size="9">178,634 lines verified</text>

  <!-- Arrow -->
  <line x1="430" y1="140" x2="460" y2="140" stroke="#636e72" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Algorithm Design -->
  <rect x="470" y="80" width="180" height="120" rx="12" fill="#1a2744" stroke="#0984e3" stroke-width="2"/>
  <text x="560" y="105" text-anchor="middle" fill="#74b9ff" font-size="13" font-weight="bold">③ Algorithm</text>
  <text x="560" y="130" text-anchor="middle" fill="#dfe6e9" font-size="10">Computational method</text>
  <text x="560" y="148" text-anchor="middle" fill="#dfe6e9" font-size="10">built on verified</text>
  <text x="560" y="163" text-anchor="middle" fill="#dfe6e9" font-size="10">mathematical facts</text>
  <text x="560" y="185" text-anchor="middle" fill="#636e72" font-size="9">50 novel algorithms</text>

  <!-- Arrow -->
  <line x1="650" y1="140" x2="680" y2="140" stroke="#636e72" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Implementation -->
  <rect x="690" y="80" width="180" height="120" rx="12" fill="#1a2744" stroke="#e17055" stroke-width="2"/>
  <text x="780" y="105" text-anchor="middle" fill="#fab1a0" font-size="13" font-weight="bold">④ Implementation</text>
  <text x="780" y="130" text-anchor="middle" fill="#dfe6e9" font-size="10">Python demos,</text>
  <text x="780" y="148" text-anchor="middle" fill="#dfe6e9" font-size="10">SVG visualizations,</text>
  <text x="780" y="163" text-anchor="middle" fill="#dfe6e9" font-size="10">production code</text>
  <text x="780" y="185" text-anchor="middle" fill="#636e72" font-size="9">5 demo modules</text>

  <!-- Feedback arrow -->
  <path d="M 780 200 Q 780 250 500 250 Q 120 250 120 200" fill="none" stroke="#00b894" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowGreen)"/>
  <text x="450" y="268" text-anchor="middle" fill="#00b894" font-size="10">Correctness guaranteed by formal verification</text>

  <!-- Bottom: Key guarantee -->
  <rect x="100" y="300" width="800" height="75" rx="12" fill="#1a2744" stroke="#feca57" stroke-width="1.5"/>
  <text x="500" y="328" text-anchor="middle" fill="#feca57" font-size="15" font-weight="bold">The Verification Advantage</text>
  <text x="260" y="355" text-anchor="middle" fill="#dfe6e9" font-size="11">✓ Correctness by construction</text>
  <text x="500" y="355" text-anchor="middle" fill="#dfe6e9" font-size="11">✓ Transparent assumptions</text>
  <text x="740" y="355" text-anchor="middle" fill="#dfe6e9" font-size="11">✓ Composable guarantees</text>
</svg>
