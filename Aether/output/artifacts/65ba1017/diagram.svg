<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Georgia', serif">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#2563EB">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#DC2626">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#059669">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bg)" rx="12"/>
  <rect width="900" height="620" fill="none" stroke="#94a3b8" stroke-width="2" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">
    Backpropagation as Cotangent Lift
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">
    Contravariant Functoriality: T* : Man^op → VectBun
  </text>

  <!-- ═══ TOP ROW: Forward Pass (Tangent/Covariant) ═══ -->
  <text x="450" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563EB">
    Forward Pass — Tangent Map (Covariant)
  </text>

  <!-- Manifolds -->
  <ellipse cx="120" cy="175" rx="70" ry="45" fill="#dbeafe" stroke="#2563EB" stroke-width="2"/>
  <text x="120" y="170" text-anchor="middle" font-size="18" fill="#1e40af" font-weight="bold">M₁</text>
  <text x="120" y="192" text-anchor="middle" font-size="11" fill="#3b82f6">(ℝ⁴)</text>

  <ellipse cx="330" cy="175" rx="70" ry="45" fill="#dbeafe" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="170" text-anchor="middle" font-size="18" fill="#1e40af" font-weight="bold">M₂</text>
  <text x="330" y="192" text-anchor="middle" font-size="11" fill="#3b82f6">(ℝ³)</text>

  <ellipse cx="540" cy="175" rx="70" ry="45" fill="#dbeafe" stroke="#2563EB" stroke-width="2"/>
  <text x="540" y="170" text-anchor="middle" font-size="18" fill="#1e40af" font-weight="bold">M₃</text>
  <text x="540" y="192" text-anchor="middle" font-size="11" fill="#3b82f6">(ℝ²)</text>

  <ellipse cx="750" cy="175" rx="70" ry="45" fill="#dbeafe" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="170" text-anchor="middle" font-size="18" fill="#1e40af" font-weight="bold">M₄</text>
  <text x="750" y="192" text-anchor="middle" font-size="11" fill="#3b82f6">(ℝ²)</text>

  <!-- Forward arrows -->
  <line x1="192" y1="165" x2="258" y2="165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="225" y="155" text-anchor="middle" font-size="14" fill="#2563EB" font-style="italic">f₁</text>

  <line x1="402" y1="165" x2="468" y2="165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="435" y="155" text-anchor="middle" font-size="14" fill="#2563EB" font-style="italic">f₂</text>

  <line x1="612" y1="165" x2="678" y2="165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="645" y="155" text-anchor="middle" font-size="14" fill="#2563EB" font-style="italic">f₃</text>

  <!-- Tangent map label -->
  <text x="450" y="240" text-anchor="middle" font-size="13" fill="#1e40af">
    TΦ = Tf₃ ∘ Tf₂ ∘ Tf₁  (composition preserves order)
  </text>

  <!-- ═══ Divider ═══ -->
  <line x1="50" y1="265" x2="850" y2="265" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="450" y="285" text-anchor="middle" font-size="12" fill="#94a3b8">
    ⟵ duality / transposition ⟶
  </text>

  <!-- ═══ BOTTOM ROW: Backward Pass (Cotangent/Contravariant) ═══ -->
  <text x="450" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#DC2626">
    Backward Pass — Cotangent Lift (Contravariant)
  </text>

  <!-- Cotangent bundles -->
  <ellipse cx="120" cy="400" rx="70" ry="45" fill="#fee2e2" stroke="#DC2626" stroke-width="2"/>
  <text x="120" y="393" text-anchor="middle" font-size="16" fill="#991b1b" font-weight="bold">T*M₁</text>
  <text x="120" y="415" text-anchor="middle" font-size="11" fill="#ef4444">(gradients)</text>

  <ellipse cx="330" cy="400" rx="70" ry="45" fill="#fee2e2" stroke="#DC2626" stroke-width="2"/>
  <text x="330" y="393" text-anchor="middle" font-size="16" fill="#991b1b" font-weight="bold">T*M₂</text>
  <text x="330" y="415" text-anchor="middle" font-size="11" fill="#ef4444">(gradients)</text>

  <ellipse cx="540" cy="400" rx="70" ry="45" fill="#fee2e2" stroke="#DC2626" stroke-width="2"/>
  <text x="540" y="393" text-anchor="middle" font-size="16" fill="#991b1b" font-weight="bold">T*M₃</text>
  <text x="540" y="415" text-anchor="middle" font-size="11" fill="#ef4444">(gradients)</text>

  <ellipse cx="750" cy="400" rx="70" ry="45" fill="#fee2e2" stroke="#DC2626" stroke-width="2"/>
  <text x="750" y="393" text-anchor="middle" font-size="16" fill="#991b1b" font-weight="bold">T*M₄</text>
  <text x="750" y="415" text-anchor="middle" font-size="11" fill="#ef4444">(loss grad)</text>

  <!-- Backward arrows (reversed!) -->
  <line x1="258" y1="390" x2="192" y2="390" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="225" y="380" text-anchor="middle" font-size="14" fill="#DC2626" font-style="italic">f₁*</text>

  <line x1="468" y1="390" x2="402" y2="390" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="435" y="380" text-anchor="middle" font-size="14" fill="#DC2626" font-style="italic">f₂*</text>

  <line x1="678" y1="390" x2="612" y2="390" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="645" y="380" text-anchor="middle" font-size="14" fill="#DC2626" font-style="italic">f₃*</text>

  <!-- Cotangent map label -->
  <text x="450" y="465" text-anchor="middle" font-size="13" fill="#991b1b">
    Φ* = f₁* ∘ f₂* ∘ f₃*  (composition REVERSES order!)
  </text>

  <!-- ═══ Key equation box ═══ -->
  <rect x="180" y="490" width="540" height="65" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="450" y="515" text-anchor="middle" font-size="15" fill="#065f46" font-weight="bold">
    Theorem (Contravariant Functoriality):
  </text>
  <text x="450" y="540" text-anchor="middle" font-size="16" fill="#059669" font-weight="bold" font-style="italic">
    (g ∘ f)* = f* ∘ g*    ⟹    Backprop goes backwards
  </text>

  <!-- ═══ Vertical duality arrows ═══ -->
  <line x1="120" y1="222" x2="120" y2="353" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <line x1="750" y1="222" x2="750" y2="353" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- Caption -->
  <text x="450" y="590" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">
    Figure: The forward pass (top, blue) composes layer maps covariantly. The backward pass (bottom, red)
  </text>
  <text x="450" y="607" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">
    applies cotangent lifts contravariantly — reversing composition order. This IS backpropagation.
  </text>
</svg>
