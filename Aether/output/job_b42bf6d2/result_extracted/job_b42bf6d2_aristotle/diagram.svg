<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Non-Archimedean Factoring Oracle
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Composite Numbers Always Admit Nontrivial Factorization
  </text>

  <!-- LEFT SIDE: The Natural Numbers Classification -->
  <!-- n > 1 box -->
  <rect x="30" y="80" width="350" height="60" rx="8" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="205" y="105" text-anchor="middle" font-family="monospace" font-size="14" fill="#2c3e50" font-weight="bold">ℕ_{&gt;1} = { n ∈ ℕ | n &gt; 1 }</text>
  <text x="205" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7f8c8d">All natural numbers greater than 1</text>

  <!-- Split arrow -->
  <line x1="120" y1="140" x2="120" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="290" y1="140" x2="290" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Prime box (RED - no factorization) -->
  <rect x="30" y="175" width="160" height="80" rx="8" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="2"/>
  <text x="110" y="200" text-anchor="middle" font-family="monospace" font-size="13" fill="#c0392b" font-weight="bold">Primes</text>
  <text x="110" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c0392b">2, 3, 5, 7, 11, …</text>
  <text x="110" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#95a5a6">❌ No a,b &gt; 1</text>
  <text x="110" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#95a5a6">with a·b = p</text>

  <!-- Composite box (GREEN - factorization exists) -->
  <rect x="220" y="175" width="160" height="80" rx="8" fill="#27ae60" opacity="0.12" stroke="#27ae60" stroke-width="2"/>
  <text x="300" y="200" text-anchor="middle" font-family="monospace" font-size="13" fill="#27ae60" font-weight="bold">Composites</text>
  <text x="300" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#27ae60">4, 6, 8, 9, 10, …</text>
  <text x="300" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#2c3e50">✅ ∃ a,b &gt; 1</text>
  <text x="300" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#2c3e50">with a·b = n</text>

  <!-- RIGHT SIDE: Proof Structure -->
  <rect x="420" y="80" width="360" height="260" rx="8" fill="white" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="600" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2c3e50">Proof Structure</text>

  <!-- Step 1 -->
  <rect x="440" y="120" width="320" height="40" rx="5" fill="#f1c40f" opacity="0.2" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450" y="140" font-family="monospace" font-size="11" fill="#2c3e50">① n &gt; 1 ∧ ¬Prime(n)</text>
  <text x="450" y="153" font-family="Georgia, serif" font-size="10" fill="#7f8c8d">   Hypotheses</text>

  <line x1="600" y1="160" x2="600" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->
  <rect x="440" y="180" width="320" height="40" rx="5" fill="#9b59b6" opacity="0.15" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="450" y="198" font-family="monospace" font-size="11" fill="#2c3e50">② Nat.exists_dvd_of_not_prime2</text>
  <text x="450" y="213" font-family="Georgia, serif" font-size="10" fill="#7f8c8d">   → ∃ k, k ∣ n ∧ 1 &lt; k &lt; n</text>

  <line x1="600" y1="220" x2="600" y2="235" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 3 -->
  <rect x="440" y="240" width="320" height="45" rx="5" fill="#1abc9c" opacity="0.15" stroke="#16a085" stroke-width="1.5"/>
  <text x="450" y="257" font-family="monospace" font-size="11" fill="#2c3e50">③ a := k, b := n / k</text>
  <text x="450" y="272" font-family="Georgia, serif" font-size="10" fill="#7f8c8d">   a·b = n ∧ a &gt; 1 ∧ b &gt; 1  ✓</text>

  <!-- Arrow from composite box to proof -->
  <path d="M 380 215 L 420 215" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowGreen)" stroke-dasharray="5,3"/>

  <!-- X from prime box -->
  <line x1="110" y1="255" x2="110" y2="290" stroke="#c0392b" stroke-width="2"/>
  <text x="110" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c0392b" font-weight="bold">Original statement</text>
  <text x="110" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c0392b">was FALSE here!</text>

  <!-- BOTTOM: Example factorization tree -->
  <rect x="30" y="355" width="740" height="200" rx="8" fill="white" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="400" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Example: Iterated Oracle on n = 360
  </text>

  <!-- Tree: 360 -->
  <rect x="340" y="390" width="80" height="30" rx="5" fill="#3498db" opacity="0.25" stroke="#2980b9"/>
  <text x="380" y="410" text-anchor="middle" font-family="monospace" font-size="13" fill="#2c3e50">360</text>

  <!-- 360 -> 2, 180 -->
  <line x1="360" y1="420" x2="260" y2="445" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="420" x2="500" y2="445" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 2 (prime) -->
  <rect x="225" y="448" width="50" height="25" rx="5" fill="#e74c3c" opacity="0.2" stroke="#c0392b"/>
  <text x="250" y="465" text-anchor="middle" font-family="monospace" font-size="12" fill="#c0392b" font-weight="bold">2</text>

  <!-- 180 -->
  <rect x="470" y="448" width="60" height="25" rx="5" fill="#3498db" opacity="0.25" stroke="#2980b9"/>
  <text x="500" y="465" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c3e50">180</text>

  <!-- 180 -> 2, 90 -->
  <line x1="485" y1="473" x2="430" y2="495" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="515" y1="473" x2="570" y2="495" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 2 (prime) -->
  <rect x="405" y="498" width="50" height="25" rx="5" fill="#e74c3c" opacity="0.2" stroke="#c0392b"/>
  <text x="430" y="515" text-anchor="middle" font-family="monospace" font-size="12" fill="#c0392b" font-weight="bold">2</text>

  <!-- 90 -->
  <rect x="555" y="498" width="50" height="25" rx="5" fill="#3498db" opacity="0.25" stroke="#2980b9"/>
  <text x="580" y="515" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c3e50">90</text>

  <!-- 90 -> 2, 45 -->
  <line x1="570" y1="523" x2="535" y2="535" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="523" x2="640" y2="535" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 2 -->
  <rect x="510" y="537" width="40" height="20" rx="4" fill="#e74c3c" opacity="0.2" stroke="#c0392b"/>
  <text x="530" y="551" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">2</text>

  <!-- 45 -->
  <rect x="630" y="537" width="40" height="20" rx="4" fill="#3498db" opacity="0.25" stroke="#2980b9"/>
  <text x="650" y="551" text-anchor="middle" font-family="monospace" font-size="11" fill="#2c3e50">45</text>

  <!-- ... dots indicating continuation -->
  <text x="700" y="551" font-family="Georgia, serif" font-size="14" fill="#7f8c8d">→ 3²·5</text>

  <!-- Result -->
  <text x="120" y="510" font-family="Georgia, serif" font-size="12" fill="#2c3e50" font-weight="bold">Result:</text>
  <text x="120" y="530" font-family="monospace" font-size="12" fill="#27ae60">360 = 2³ × 3² × 5</text>

  <!-- Legend -->
  <rect x="50" y="460" width="15" height="15" rx="3" fill="#e74c3c" opacity="0.3" stroke="#c0392b"/>
  <text x="70" y="473" font-family="Georgia, serif" font-size="11" fill="#555">Prime (leaf)</text>
  <rect x="50" y="480" width="15" height="15" rx="3" fill="#3498db" opacity="0.3" stroke="#2980b9"/>
  <text x="70" y="493" font-family="Georgia, serif" font-size="11" fill="#555">Composite (split)</text>

  <!-- Caption -->
  <text x="400" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#95a5a6" font-style="italic">
    Figure: The factoring oracle recursively splits composite nodes (blue) until only primes (red) remain.
  </text>
</svg>
