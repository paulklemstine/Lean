<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <radialGradient id="blochGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3d9f2;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4b8ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Quantum Berggren Superposition
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Pythagorean Triples as Quantum States on the Bloch Sphere
  </text>

  <!-- ═══════════════ LEFT: Berggren Tree ═══════════════ -->
  <rect x="20" y="70" width="350" height="400" rx="10" fill="url(#treeGrad)" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="195" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#6c3483">
    Berggren Tree  𝓑
  </text>

  <!-- Root node (3,4,5) -->
  <circle cx="195" cy="140" r="22" fill="#8e44ad" stroke="#6c3483" stroke-width="2"/>
  <text x="195" y="145" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">(3,4,5)</text>

  <!-- Level 1 children -->
  <!-- A branch -->
  <line x1="178" y1="158" x2="90" y2="210" stroke="#6c3483" stroke-width="1.5"/>
  <circle cx="90" cy="220" r="20" fill="#a569bd" stroke="#6c3483" stroke-width="1.5"/>
  <text x="90" y="224" text-anchor="middle" font-family="monospace" font-size="9" fill="white">(5,12,13)</text>
  <text x="130" y="182" font-family="monospace" font-size="10" fill="#6c3483" font-weight="bold">A</text>

  <!-- B branch -->
  <line x1="195" y1="162" x2="195" y2="210" stroke="#6c3483" stroke-width="1.5"/>
  <circle cx="195" cy="220" r="20" fill="#a569bd" stroke="#6c3483" stroke-width="1.5"/>
  <text x="195" y="224" text-anchor="middle" font-family="monospace" font-size="9" fill="white">(21,20,29)</text>
  <text x="205" y="192" font-family="monospace" font-size="10" fill="#6c3483" font-weight="bold">B</text>

  <!-- C branch -->
  <line x1="212" y1="158" x2="300" y2="210" stroke="#6c3483" stroke-width="1.5"/>
  <circle cx="300" cy="220" r="20" fill="#a569bd" stroke="#6c3483" stroke-width="1.5"/>
  <text x="300" y="224" text-anchor="middle" font-family="monospace" font-size="9" fill="white">(15,8,17)</text>
  <text x="262" y="182" font-family="monospace" font-size="10" fill="#6c3483" font-weight="bold">C</text>

  <!-- Level 2 (selected children) -->
  <line x1="75" y1="238" x2="50" y2="285" stroke="#6c3483" stroke-width="1"/>
  <circle cx="50" cy="295" r="16" fill="#c39bd3" stroke="#6c3483" stroke-width="1"/>
  <text x="50" y="299" text-anchor="middle" font-family="monospace" font-size="7" fill="white">(7,24,25)</text>

  <line x1="90" y1="240" x2="110" y2="285" stroke="#6c3483" stroke-width="1"/>
  <circle cx="110" cy="295" r="16" fill="#c39bd3" stroke="#6c3483" stroke-width="1"/>
  <text x="110" y="299" text-anchor="middle" font-family="monospace" font-size="7" fill="white">(55,48,73)</text>

  <line x1="300" y1="240" x2="280" y2="285" stroke="#6c3483" stroke-width="1"/>
  <circle cx="280" cy="295" r="16" fill="#c39bd3" stroke="#6c3483" stroke-width="1"/>
  <text x="280" y="299" text-anchor="middle" font-family="monospace" font-size="7" fill="white">(9,40,41)</text>

  <line x1="310" y1="238" x2="335" y2="285" stroke="#6c3483" stroke-width="1"/>
  <circle cx="335" cy="295" r="16" fill="#c39bd3" stroke="#6c3483" stroke-width="1"/>
  <text x="335" y="299" text-anchor="middle" font-family="monospace" font-size="7" fill="white">(35,12,37)</text>

  <!-- Dots for continuation -->
  <text x="195" y="340" text-anchor="middle" font-family="monospace" font-size="16" fill="#6c3483">⋯</text>

  <!-- Key formula -->
  <text x="195" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4a235a">
    a² + b² = c²  ⟹  (a/c)² + (b/c)² = 1
  </text>
  <text x="195" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#6c3483">
    Primitivity: gcd(a, b, c) = 1
  </text>

  <!-- Matrix labels -->
  <text x="195" y="430" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a235a">
    Generators: A, B, C ∈ GL₃(ℤ)
  </text>
  <text x="195" y="450" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a235a">
    det(A) = det(B) = det(C) = −1
  </text>

  <!-- ═══════════════ ARROW: Encoding Map ═══════════════ -->
  <line x1="375" y1="250" x2="425" y2="250" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="400" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#e74c3c" font-weight="bold">φ</text>
  <text x="400" y="272" text-anchor="middle" font-family="monospace" font-size="9" fill="#c0392b">
    (a,b,c) ↦
  </text>
  <text x="400" y="284" text-anchor="middle" font-family="monospace" font-size="9" fill="#c0392b">
    (a/c)|0⟩+(b/c)|1⟩
  </text>

  <!-- ═══════════════ RIGHT: Bloch Sphere ═══════════════ -->
  <rect x="430" y="70" width="350" height="400" rx="10" fill="url(#blochGrad)" stroke="#2980b9" stroke-width="1.5"/>
  <text x="605" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1a5276">
    Bloch Sphere  ℋ = ℂ²
  </text>

  <!-- Bloch sphere circle -->
  <ellipse cx="605" cy="270" rx="110" ry="110" fill="none" stroke="#2980b9" stroke-width="2"/>
  <ellipse cx="605" cy="270" rx="110" ry="30" fill="none" stroke="#2980b9" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Axes -->
  <line x1="605" y1="150" x2="605" y2="390" stroke="#85c1e9" stroke-width="1"/>
  <line x1="485" y1="270" x2="725" y2="270" stroke="#85c1e9" stroke-width="1"/>

  <!-- |0⟩ and |1⟩ labels -->
  <text x="605" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="#1a5276" font-weight="bold">|0⟩</text>
  <text x="605" y="405" text-anchor="middle" font-family="monospace" font-size="12" fill="#1a5276" font-weight="bold">|1⟩</text>

  <!-- Quantum state points (mapped from triples) -->
  <!-- (3,4,5): θ = 2·arctan(4/3) ≈ 1.854 rad, plotted on sphere -->
  <circle cx="655" cy="185" r="6" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="672" y="183" font-family="monospace" font-size="9" fill="#c0392b">(3,4,5)</text>

  <!-- (5,12,13): θ ≈ 2.35 -->
  <circle cx="690" cy="230" r="5" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
  <text x="708" y="228" font-family="monospace" font-size="8" fill="#d35400">(5,12,13)</text>

  <!-- (15,8,17): θ ≈ 1.00 -->
  <circle cx="630" cy="175" r="5" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="530" y="170" font-family="monospace" font-size="8" fill="#1e8449">(15,8,17)</text>

  <!-- (21,20,29): θ ≈ 1.52 -->
  <circle cx="665" cy="208" r="5" fill="#f39c12" stroke="#d68910" stroke-width="1.5"/>
  <text x="680" y="205" font-family="monospace" font-size="8" fill="#d68910">(21,20,29)</text>

  <!-- (7,24,25): θ ≈ 2.57 -->
  <circle cx="695" cy="305" r="5" fill="#8e44ad" stroke="#6c3483" stroke-width="1.5"/>
  <text x="710" y="316" font-family="monospace" font-size="8" fill="#6c3483">(7,24,25)</text>

  <!-- Connection lines from center to points -->
  <line x1="605" y1="270" x2="655" y2="185" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="605" y1="270" x2="690" y2="230" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="605" y1="270" x2="630" y2="175" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Orthogonality annotation -->
  <text x="605" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1a5276">
    Coprimality ⟺ Orthogonal syndrome subspaces
  </text>
  <text x="605" y="445" text-anchor="middle" font-family="monospace" font-size="10" fill="#2980b9">
    gcd(a₁a₂ + b₁b₂, c₁c₂) = 1
  </text>

  <!-- ═══════════════ BOTTOM: Caption ═══════════════ -->
  <rect x="20" y="490" width="760" height="85" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="400" y="515" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Figure: The Quantum Berggren Correspondence
  </text>
  <text x="400" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555">
    Left: The Berggren ternary tree generates all primitive Pythagorean triples via matrices A, B, C.
  </text>
  <text x="400" y="552" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555">
    Right: Each triple maps to a qubit state on the Bloch sphere via φ: (a,b,c) ↦ (a/c)|0⟩ + (b/c)|1⟩.
  </text>
  <text x="400" y="569" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555">
    Coprimality of triple components corresponds to orthogonality of quantum error-syndrome subspaces.
  </text>
</svg>
