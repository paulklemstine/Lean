<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
    <linearGradient id="quat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#8e44ad"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="550" fill="url(#bg4)"/>
  
  <text x="450" y="35" text-anchor="middle" fill="#bb86fc" font-size="22" font-weight="bold" filter="url(#glow4)">
    Quaternion Norm Factoring
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#a0a0c0" font-size="12">
    |q₁q₂| = |q₁|·|q₂| — Multiplicativity of quaternion norms reveals integer factors
  </text>

  <!-- Step 1: Two representations -->
  <rect x="50" y="80" width="380" height="120" rx="12" fill="#2d1b4e" stroke="#bb86fc" stroke-width="1.5"/>
  <text x="240" y="105" text-anchor="middle" fill="#bb86fc" font-size="14" font-weight="bold">Step 1: Find Two Representations</text>
  
  <text x="70" y="135" fill="#e0e0ff" font-size="13">N = a₁² + a₂² + a₃² + a₄²</text>
  <text x="70" y="158" fill="#e0e0ff" font-size="13">N = b₁² + b₂² + b₃² + b₄²</text>
  <text x="70" y="185" fill="#a0a0c0" font-size="11" font-style="italic">Guaranteed for N ≥ 5 (four_square_multiple_reps)</text>

  <!-- Arrow -->
  <path d="M 440 140 L 465 140" stroke="#bb86fc" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#bb86fc"/>
  </marker>

  <!-- Step 2: Cross-terms -->
  <rect x="470" y="80" width="380" height="120" rx="12" fill="#2d1b4e" stroke="#e94560" stroke-width="1.5"/>
  <text x="660" y="105" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">Step 2: Compute Cross-Terms</text>
  
  <text x="490" y="135" fill="#e0e0ff" font-size="13">t₁ = a₁b₂ − a₂b₁</text>
  <text x="490" y="158" fill="#e0e0ff" font-size="13">t₂ = a₁b₃ − a₃b₁</text>
  <text x="490" y="181" fill="#e0e0ff" font-size="13">t₃ = a₁b₄ − a₄b₁  ...</text>

  <!-- Step 3: GCD extraction -->
  <rect x="200" y="230" width="500" height="90" rx="12" fill="#2d1b4e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="450" y="260" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold">Step 3: Extract Factor</text>
  <text x="450" y="285" text-anchor="middle" fill="#e0e0ff" font-size="15">gcd(tᵢ, N) → nontrivial factor</text>
  <text x="450" y="307" text-anchor="middle" fill="#a0a0c0" font-size="11">If 1 &lt; gcd(tᵢ, N) &lt; N, we have factored N!</text>

  <!-- Worked Example -->
  <rect x="50" y="345" width="800" height="180" rx="12" fill="#1a0a2e" stroke="#ffd700" stroke-width="1.5"/>
  <text x="450" y="375" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold">Worked Example: N = 1105 = 5 × 13 × 17</text>
  
  <text x="80" y="405" fill="#58a6ff" font-size="13" font-weight="bold">Rep 1:</text>
  <text x="160" y="405" fill="#e0e0ff" font-size="13">1105 = 4² + 8² + 23² + 18²  =  16 + 64 + 529 + 324</text>
  
  <text x="80" y="430" fill="#f78166" font-size="13" font-weight="bold">Rep 2:</text>
  <text x="160" y="430" fill="#e0e0ff" font-size="13">1105 = 0² + 4² + 33² + 2²   =  0 + 16 + 1089 + 4</text>
  
  <text x="80" y="460" fill="#3fb950" font-size="13" font-weight="bold">Cross:</text>
  <text x="160" y="460" fill="#e0e0ff" font-size="13">t = 4·4 − 8·0 = 16</text>
  
  <text x="80" y="490" fill="#bb86fc" font-size="13" font-weight="bold">GCD:</text>
  <text x="160" y="490" fill="#e0e0ff" font-size="13">gcd(16, 1105) = 1  (try more terms...)</text>
  <text x="160" y="510" fill="#e0e0ff" font-size="13">gcd(a₁b₃ − a₃b₁, 1105) = gcd(4·33 − 23·0, 1105) = gcd(132, 1105) = <tspan fill="#ffd700" font-weight="bold">17</tspan></text>

  <!-- Formula box -->
  <rect x="200" y="540" width="500" height="0" rx="0" fill="none"/>
</svg>
