# Smoke-test sweep: minimal grid for local validation

model: "Qwen/Qwen2.5-0.5B-Instruct"
device: "cpu"
output_dir: "./sweep_results_smoke"
telemetry_file: "./sweep_results_smoke/telemetry.json"

student_configs:
  - name: "tiny"
    d_model: 128
    num_layers: 2
    num_heads: 2
    d_ff: 256

distillation:
  temperatures: [2.0]
  alphas: [0.5]
  epochs: [1]
  batch_sizes: [2]

crystallization:
  weights: [0.005]

dataset:
  num_samples: 10
  max_length: 32

training:
  lr: 5e-5
  max_grad_norm: 1.0
