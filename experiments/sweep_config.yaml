# Hyperparameter sweep configuration for Crystalline Qwen2.5 optimization

model: "Qwen/Qwen2.5-0.5B-Instruct"
device: "cuda"
output_dir: "./sweep_results"
telemetry_file: "./sweep_results/telemetry.json"

# Student configurations
student_configs:
  - name: "tiny"
    d_model: 256
    num_layers: 4
    num_heads: 4
    d_ff: 512
  - name: "small"
    d_model: 384
    num_layers: 6
    num_heads: 6
    d_ff: 768
  - name: "medium"
    d_model: 512
    num_layers: 6
    num_heads: 8
    d_ff: 1024

# Distillation sweeps
distillation:
  temperatures: [1.5, 2.0, 3.0]
  alphas: [0.3, 0.5, 0.7]
  epochs: [1, 2]
  batch_sizes: [2, 4]

# Crystallization sweeps
crystallization:
  weights: [0.001, 0.005, 0.01]

# Dataset
dataset:
  num_samples: 50
  max_length: 64

# Training
training:
  lr: 5e-5
  max_grad_norm: 1.0
