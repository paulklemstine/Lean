    }

    .container {
      align-items: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .main-content,
    .captcha-wrapper {
      align-items: center;
      display: flex;
      justify-content: space-between;
      width: 70%;
    }

    .captcha-wrapper {
      margin-top: 20px;
      opacity: 0;
      text-align: left;
      transform: translateX(-3rem);
      transition: 1s;
    }

    #main-text {
      font-size: 3.5em;
      font-weight: bolder;
      margin: 0;
      opacity: 0;
      text-align: left;
      transform: translateX(-3rem);
      transition: 1s;
      width: 40%;
    }

    /* Used in opening transition */
    #main-text.active,
    .captcha-wrapper.active {
      opacity: 1;
      transform: translateX(0rem);
    }

    .highlight {
      color: #9cfcd4;
    }

    .desktop-logo {
      display: block;
      opacity: 0;
      text-align: center;
      transform: translateX(3rem);
      transition: 1s;
    }

    /* Used in opening transition */
    .desktop-logo.active {
      opacity: 1;
      transform: translateX(0rem);
    }

    .mobile-logo {
      display: none;
      position: fixed;
      text-align: center;
      top: 3rem;
      transition: 1s;
    }

    .mobile-galoa-logo {
      width: 40%;
    }

    .mobile-subtext {
      font-size: 1.1em;
      font-weight: 300;
    }

    .galoa-logo {
      max-width: 70%;
    }

    .subtext {
      font-size: 2.7em;
      font-weight: 300;
    }

    .sub-main-text {
      align-items: center;
      display: flex;
      justify-content: center;
    }

    .sub-main-text-content {
      font-size: 1.6rem;
      margin-top: 5em;
      opacity: 0;
      text-align: left;
      transform: translateY(2rem);
      transition: 1s;
      width: 70%;
    }

    /* Used in opening transition */
    .sub-main-text-content.active {
      opacity: 1;
      transform: translateY(0);
    }

    .footer {
      bottom: 1rem;
      font-size: 1rem;
      font-weight: 300;
      position: fixed;
      text-align: center;
    }

    /* Medium responsiveness */
    @media screen and (max-width: 1750px) {
      #main-text {
        font-size: 2.8em;
        width: 80%;
      }

      .galoa-logo {
        max-width: 70%;
