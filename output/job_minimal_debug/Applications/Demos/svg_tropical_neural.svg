<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1b2838;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="reluGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e53935;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#e53935;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#43a047;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#43a047;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">
    ReLU Networks ↔ Tropical Polynomials
  </text>
  <text x="450" y="57" text-anchor="middle" fill="#78909c" font-size="13">
    The bridge between deep learning and tropical geometry — formally verified
  </text>

  <!-- LEFT SIDE: Neural Network -->
  <text x="200" y="95" text-anchor="middle" fill="#64b5f6" font-size="16" font-weight="bold">
    Neural Network View
  </text>

  <!-- Input layer -->
  <g>
    <circle cx="80" cy="200" r="18" fill="#1565c0" stroke="#42a5f5" stroke-width="2"/>
    <text x="80" y="205" text-anchor="middle" fill="#fff" font-size="12">x</text>

    <circle cx="80" cy="300" r="18" fill="#1565c0" stroke="#42a5f5" stroke-width="2"/>
    <text x="80" y="305" text-anchor="middle" fill="#fff" font-size="12">1</text>
  </g>

  <!-- Hidden layer -->
  <g>
    <circle cx="200" cy="160" r="18" fill="#2e7d32" stroke="#66bb6a" stroke-width="2"/>
    <text x="200" y="165" text-anchor="middle" fill="#fff" font-size="10">ReLU</text>

    <circle cx="200" cy="250" r="18" fill="#2e7d32" stroke="#66bb6a" stroke-width="2"/>
    <text x="200" y="255" text-anchor="middle" fill="#fff" font-size="10">ReLU</text>

    <circle cx="200" cy="340" r="18" fill="#2e7d32" stroke="#66bb6a" stroke-width="2"/>
    <text x="200" y="345" text-anchor="middle" fill="#fff" font-size="10">ReLU</text>
  </g>

  <!-- Output layer -->
  <g>
    <circle cx="320" cy="250" r="20" fill="#e65100" stroke="#ff9800" stroke-width="2"/>
    <text x="320" y="255" text-anchor="middle" fill="#fff" font-size="12">f(x)</text>
  </g>

  <!-- Connections with weights -->
  <g stroke="#546e7a" stroke-width="1.5" opacity="0.6">
    <line x1="98" y1="195" x2="182" y2="165"/>
    <line x1="98" y1="205" x2="182" y2="245"/>
    <line x1="98" y1="200" x2="182" y2="335"/>
    <line x1="98" y1="295" x2="182" y2="165"/>
    <line x1="98" y1="305" x2="182" y2="255"/>
    <line x1="98" y1="305" x2="182" y2="345"/>
    <line x1="218" y1="165" x2="300" y2="245"/>
    <line x1="218" y1="255" x2="300" y2="250"/>
    <line x1="218" y1="340" x2="300" y2="255"/>
  </g>

  <!-- Weight labels -->
  <g fill="#90a4ae" font-size="9">
    <text x="130" y="185">w₁</text>
    <text x="130" y="225">w₂</text>
    <text x="115" y="270">w₃</text>
    <text x="130" y="155">b₁</text>
    <text x="130" y="310">b₂</text>
    <text x="130" y="345">b₃</text>
  </g>

  <!-- Layer labels -->
  <text x="80" y="375" text-anchor="middle" fill="#546e7a" font-size="10">Input</text>
  <text x="200" y="395" text-anchor="middle" fill="#546e7a" font-size="10">Hidden</text>
  <text x="200" y="408" text-anchor="middle" fill="#546e7a" font-size="9">(ReLU = max(0,·))</text>
  <text x="320" y="300" text-anchor="middle" fill="#546e7a" font-size="10">Output</text>

  <!-- Arrow between sides -->
  <g>
    <line x1="390" y1="250" x2="440" y2="250" stroke="#ffcc80" stroke-width="3" marker-end="url(#arrowhead)"/>
    <polygon points="440,244 455,250 440,256" fill="#ffcc80"/>
    <text x="425" y="235" text-anchor="middle" fill="#ffcc80" font-size="11" font-weight="bold">≡</text>
  </g>

  <!-- RIGHT SIDE: Tropical Polynomial -->
  <text x="670" y="95" text-anchor="middle" fill="#ce93d8" font-size="16" font-weight="bold">
    Tropical Polynomial View
  </text>

  <!-- Tropical function graph -->
  <g transform="translate(500, 120)">
    <!-- Axes -->
    <line x1="20" y1="220" x2="330" y2="220" stroke="#546e7a" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="20" y2="220" stroke="#546e7a" stroke-width="1.5"/>
    <text x="330" y="240" fill="#78909c" font-size="11">x</text>
    <text x="8" y="20" fill="#78909c" font-size="11">f(x)</text>

    <!-- Piecewise linear function -->
    <polyline points="20,180 80,180 170,100 240,130 330,80"
              fill="none" stroke="#ce93d8" stroke-width="3"/>

    <!-- Linear region boundaries -->
    <line x1="80" y1="20" x2="80" y2="220" stroke="#7c4dff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
    <line x1="170" y1="20" x2="170" y2="220" stroke="#7c4dff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
    <line x1="240" y1="20" x2="240" y2="220" stroke="#7c4dff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

    <!-- Region labels -->
    <text x="50" y="210" text-anchor="middle" fill="#9575cd" font-size="10">c₁</text>
    <text x="125" y="210" text-anchor="middle" fill="#9575cd" font-size="10">c₁+x</text>
    <text x="205" y="210" text-anchor="middle" fill="#9575cd" font-size="10">c₂+2x</text>
    <text x="285" y="210" text-anchor="middle" fill="#9575cd" font-size="10">c₃+3x</text>

    <!-- Tropical polynomial label -->
    <text x="170" y="270" text-anchor="middle" fill="#b39ddb" font-size="12" font-family="'Courier New', monospace">
      f(x) = max(c₁, c₁+x, c₂+2x, c₃+3x)
    </text>
    <text x="170" y="290" text-anchor="middle" fill="#7e57c2" font-size="11">
      = tropical polynomial in x
    </text>
  </g>

  <!-- Key insight box -->
  <rect x="50" y="460" width="800" height="120" rx="10" fill="#1a237e" fill-opacity="0.4" stroke="#3f51b5" stroke-width="1.5"/>

  <text x="450" y="490" text-anchor="middle" fill="#ffcc80" font-size="15" font-weight="bold">
    Key Theorem (Formally Verified)
  </text>

  <text x="450" y="515" text-anchor="middle" fill="#e8eaf6" font-size="13">
    Every ReLU neural network computes a piecewise-linear function.
  </text>
  <text x="450" y="535" text-anchor="middle" fill="#e8eaf6" font-size="13">
    Every piecewise-linear function is a tropical rational function (ratio of tropical polynomials).
  </text>
  <text x="450" y="558" text-anchor="middle" fill="#c5cae9" font-size="12" font-style="italic">
    # Linear regions = # vertices of the tropical Newton polytope
  </text>

  <!-- Verification stamp -->
  <g transform="translate(780, 470)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#4caf50" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#4caf50" font-size="8" font-weight="bold">LEAN 4</text>
    <text x="0" y="8" text-anchor="middle" fill="#81c784" font-size="7">VERIFIED</text>
    <text x="0" y="18" text-anchor="middle" fill="#a5d6a7" font-size="6">✓</text>
  </g>
</svg>
