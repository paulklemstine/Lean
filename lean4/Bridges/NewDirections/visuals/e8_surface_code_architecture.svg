<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="e8-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b71c1c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e53935;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="surface-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3949ab;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="ft-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004d40;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00897b;stop-opacity:1"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#546e7a"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212121">
    E8 Surface Codes for Fault-Tolerant Quantum Computation
  </text>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#757575">
    From E8 Root System → Self-Dual Code → CSS Construction → Topological Surface Code
  </text>

  <!-- Panel 1: E8 Root System -->
  <rect x="20" y="80" width="280" height="300" rx="12" fill="url(#e8-grad)" filter="url(#sh)"/>
  <text x="160" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    E8 Root System
  </text>

  <!-- E8 Dynkin diagram -->
  <g transform="translate(40, 125)">
    <text x="120" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ef9a9a">Dynkin Diagram</text>
    <!-- Nodes -->
    <circle cx="20" cy="25" r="8" fill="white" stroke="#ffcdd2" stroke-width="2"/>
    <circle cx="55" cy="25" r="8" fill="white" stroke="#ffcdd2" stroke-width="2"/>
    <circle cx="90" cy="25" r="8" fill="white" stroke="#ffcdd2" stroke-width="2"/>
    <circle cx="125" cy="25" r="8" fill="#ffcdd2" stroke="white" stroke-width="2"/>
    <circle cx="160" cy="25" r="8" fill="white" stroke="#ffcdd2" stroke-width="2"/>
    <circle cx="195" cy="25" r="8" fill="white" stroke="#ffcdd2" stroke-width="2"/>
    <circle cx="230" cy="25" r="8" fill="white" stroke="#ffcdd2" stroke-width="2"/>
    <circle cx="125" cy="60" r="8" fill="white" stroke="#ffcdd2" stroke-width="2"/>
    <!-- Edges -->
    <line x1="28" y1="25" x2="47" y2="25" stroke="white" stroke-width="2"/>
    <line x1="63" y1="25" x2="82" y2="25" stroke="white" stroke-width="2"/>
    <line x1="98" y1="25" x2="117" y2="25" stroke="white" stroke-width="2"/>
    <line x1="133" y1="25" x2="152" y2="25" stroke="white" stroke-width="2"/>
    <line x1="168" y1="25" x2="187" y2="25" stroke="white" stroke-width="2"/>
    <line x1="203" y1="25" x2="222" y2="25" stroke="white" stroke-width="2"/>
    <line x1="125" y1="33" x2="125" y2="52" stroke="white" stroke-width="2"/>
    <!-- Labels -->
    <text x="20" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffcdd2">α₁</text>
    <text x="55" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffcdd2">α₂</text>
    <text x="90" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffcdd2">α₃</text>
    <text x="125" y="10" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffcdd2">α₄</text>
    <text x="160" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffcdd2">α₅</text>
    <text x="195" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffcdd2">α₆</text>
    <text x="230" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffcdd2">α₇</text>
    <text x="150" y="65" text-anchor="start" font-family="Arial" font-size="8" fill="#ffcdd2">α₈</text>
  </g>

  <line x1="40" y1="210" x2="280" y2="210" stroke="#ef9a9a" stroke-opacity="0.3"/>

  <text x="160" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">240 roots = 112 + 128</text>
  <text x="160" y="250" text-anchor="middle" font-family="monospace" font-size="10" fill="#ef9a9a">Type A: ±eᵢ±eⱼ (112)</text>
  <text x="160" y="268" text-anchor="middle" font-family="monospace" font-size="10" fill="#ef9a9a">Type B: (±½)⁸ even (128)</text>
  <text x="160" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Self-dual: E8 = E8⊥</text>
  <text x="160" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ef9a9a">Even unimodular, min norm 2</text>
  <text x="160" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ef9a9a">dim = 8 = 2³</text>
  <text x="160" y="350" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffcdd2">det(Cartan) = 1</text>
  <text x="160" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffcdd2">8 nodes, 7 edges</text>

  <!-- Arrow -->
  <line x1="310" y1="230" x2="350" y2="230" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="330" y="220" text-anchor="middle" font-family="Arial" font-size="9" fill="#546e7a">CSS</text>

  <!-- Panel 2: Surface Code -->
  <rect x="360" y="80" width="350" height="300" rx="12" fill="url(#surface-grad)" filter="url(#sh)"/>
  <text x="535" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    E8 Surface Code [[8L², 2, L]]
  </text>

  <!-- Surface code lattice -->
  <g transform="translate(380, 120)">
    <text x="155" y="0" text-anchor="middle" font-family="Arial" font-size="11" fill="#9fa8da">L×L tiling of E8 cells</text>

    <!-- Grid -->
    <rect x="30" y="15" width="250" height="170" rx="5" fill="rgba(255,255,255,0.08)"/>

    <!-- E8 cells -->
    <g>
      <!-- Row 1 -->
      <rect x="40" y="25" width="50" height="50" rx="3" fill="rgba(255,255,255,0.15)" stroke="#7986cb" stroke-width="1"/>
      <text x="65" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#9fa8da">X₈</text>
      <rect x="100" y="25" width="50" height="50" rx="3" fill="rgba(255,255,255,0.15)" stroke="#7986cb" stroke-width="1"/>
      <text x="125" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#9fa8da">X₈</text>
      <rect x="160" y="25" width="50" height="50" rx="3" fill="rgba(255,255,255,0.15)" stroke="#7986cb" stroke-width="1"/>
      <text x="185" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#9fa8da">X₈</text>
      <rect x="220" y="25" width="50" height="50" rx="3" fill="rgba(255,255,255,0.15)" stroke="#7986cb" stroke-width="1"/>
      <text x="245" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#9fa8da">X₈</text>

      <!-- Row 2 -->
      <rect x="40" y="80" width="50" height="50" rx="3" fill="rgba(255,255,255,0.1)" stroke="#5c6bc0" stroke-width="1"/>
      <text x="65" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#7986cb">Z₈</text>
      <rect x="100" y="80" width="50" height="50" rx="3" fill="rgba(255,255,255,0.1)" stroke="#5c6bc0" stroke-width="1"/>
      <text x="125" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#7986cb">Z₈</text>
      <rect x="160" y="80" width="50" height="50" rx="3" fill="rgba(255,255,255,0.1)" stroke="#5c6bc0" stroke-width="1"/>
      <text x="185" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#7986cb">Z₈</text>
      <rect x="220" y="80" width="50" height="50" rx="3" fill="rgba(255,255,255,0.1)" stroke="#5c6bc0" stroke-width="1"/>
      <text x="245" y="110" text-anchor="middle" font-family="Arial" font-size="8" fill="#7986cb">Z₈</text>

      <!-- Row 3 -->
      <rect x="40" y="135" width="50" height="50" rx="3" fill="rgba(255,255,255,0.15)" stroke="#7986cb" stroke-width="1"/>
      <rect x="100" y="135" width="50" height="50" rx="3" fill="rgba(255,255,255,0.15)" stroke="#7986cb" stroke-width="1"/>
      <rect x="160" y="135" width="50" height="50" rx="3" fill="rgba(255,255,255,0.15)" stroke="#7986cb" stroke-width="1"/>
      <rect x="220" y="135" width="50" height="50" rx="3" fill="rgba(255,255,255,0.15)" stroke="#7986cb" stroke-width="1"/>
    </g>

    <!-- Data qubits (dots) -->
    <circle cx="50" cy="35" r="2" fill="#ffeb3b"/>
    <circle cx="60" cy="38" r="2" fill="#ffeb3b"/>
    <circle cx="70" cy="32" r="2" fill="#ffeb3b"/>
    <circle cx="55" cy="45" r="2" fill="#ffeb3b"/>
    <circle cx="65" cy="50" r="2" fill="#ffeb3b"/>
    <circle cx="75" cy="42" r="2" fill="#ffeb3b"/>
    <circle cx="50" cy="55" r="2" fill="#ffeb3b"/>
    <circle cx="80" cy="48" r="2" fill="#ffeb3b"/>
  </g>

  <text x="535" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Weight-8 stabilizers (vs weight-4 standard)
  </text>
  <text x="535" y="340" text-anchor="middle" font-family="monospace" font-size="11" fill="#9fa8da">
    Toric: k=2, Planar: k=1
  </text>
  <text x="535" y="358" text-anchor="middle" font-family="monospace" font-size="11" fill="#9fa8da">
    Distance d = L
  </text>

  <!-- Arrow -->
  <line x1="720" y1="230" x2="760" y2="230" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="740" y="220" text-anchor="middle" font-family="Arial" font-size="9" fill="#546e7a">decode</text>

  <!-- Panel 3: Fault Tolerance -->
  <rect x="770" y="80" width="410" height="300" rx="12" fill="url(#ft-grad)" filter="url(#sh)"/>
  <text x="975" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Fault-Tolerant Operations
  </text>

  <!-- Sub-panels -->
  <rect x="790" y="125" width="175" height="110" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="877" y="145" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Syndrome Extraction</text>
  <text x="877" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">8 CNOTs per stabilizer</text>
  <text x="877" y="183" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">Parallel non-overlapping</text>
  <text x="877" y="201" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">Circuit depth: 8</text>
  <text x="877" y="219" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">d rounds → fault tolerance</text>

  <rect x="985" y="125" width="175" height="110" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="1072" y="145" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Decoders</text>
  <text x="1072" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">MWPM: O(n³ log n)</text>
  <text x="1072" y="183" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">Union-Find: O(n·α(n))</text>
  <text x="1072" y="201" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">n = L² syndromes</text>
  <text x="1072" y="219" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">GPU-accelerable (tropical!)</text>

  <rect x="790" y="245" width="175" height="110" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="877" y="265" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Lattice Surgery</text>
  <text x="877" y="285" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">Merge: XX or ZZ</text>
  <text x="877" y="303" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">CNOT: 4L rounds</text>
  <text x="877" y="321" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">Bridge: 8L qubits</text>
  <text x="877" y="339" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">Clifford transversal</text>

  <rect x="985" y="245" width="175" height="110" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="1072" y="265" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Magic States</text>
  <text x="1072" y="285" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">Standard: 15→1</text>
  <text x="1072" y="303" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">E8: 8→1 (proposed)</text>
  <text x="1072" y="321" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">T gate via distillation</text>
  <text x="1072" y="339" text-anchor="middle" font-family="Arial" font-size="10" fill="#a7ffeb">Universal gate set</text>

  <!-- Comparison Table -->
  <rect x="20" y="400" width="560" height="200" rx="10" fill="white" stroke="#b71c1c" stroke-width="2" filter="url(#sh)"/>
  <text x="300" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#b71c1c">
    E8 vs Standard Surface Code
  </text>

  <text x="50" y="455" font-family="monospace" font-size="11" font-weight="bold" fill="#424242">
    Property        │ Standard    │ E8 Surface
  </text>
  <line x1="40" y1="462" x2="560" y2="462" stroke="#e0e0e0"/>
  <text x="50" y="478" font-family="monospace" font-size="11" fill="#424242">
    Stab. weight    │ 4           │ 8
  </text>
  <text x="50" y="496" font-family="monospace" font-size="11" fill="#424242">
    Qubits          │ 2L²         │ 8L²
  </text>
  <text x="50" y="514" font-family="monospace" font-size="11" fill="#424242">
    Distance        │ L           │ L
  </text>
  <text x="50" y="532" font-family="monospace" font-size="11" fill="#424242">
    Rate            │ 1/L²        │ 1/(4L²)
  </text>
  <text x="50" y="550" font-family="monospace" font-size="11" fill="#424242">
    Threshold       │ ~0.6%       │ ~1% (est.)
  </text>
  <text x="50" y="568" font-family="monospace" font-size="11" fill="#424242">
    Error/check     │ detect 1    │ detect 3
  </text>
  <text x="50" y="588" font-family="monospace" font-size="11" fill="#2e7d32">
    ★ E8 wins below threshold due to stronger detection
  </text>

  <!-- Theorem panel -->
  <rect x="600" y="400" width="580" height="200" rx="10" fill="#263238" filter="url(#sh)"/>
  <text x="890" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">
    Machine-Verified Theorems
  </text>

  <text x="620" y="455" font-family="monospace" font-size="11" fill="#76ff03">✓ e8_surface_code_qubits: 1 ≤ 8·L²</text>
  <text x="620" y="475" font-family="monospace" font-size="11" fill="#76ff03">✓ e8_surface_distance: d = L ≥ 1</text>
  <text x="620" y="495" font-family="monospace" font-size="11" fill="#76ff03">✓ e8_surface_logical_qubits: k = 2g</text>
  <text x="620" y="515" font-family="monospace" font-size="11" fill="#76ff03">✓ threshold_exponential_suppression:</text>
  <text x="640" y="530" font-family="monospace" font-size="10" fill="#b0bec5">    error ∝ (p/p_th)^{L/2}</text>
  <text x="620" y="550" font-family="monospace" font-size="11" fill="#76ff03">✓ magic_state_e8_advantage: 8 &lt; 15</text>
  <text x="620" y="570" font-family="monospace" font-size="11" fill="#76ff03">✓ e8_vs_standard_qubits: 2L² ≤ 8L²</text>
  <text x="620" y="590" font-family="monospace" font-size="11" fill="#76ff03">✓ concatenated_threshold: 1 ≤ 2^k</text>

  <!-- Bottom: Dimension ladder -->
  <rect x="20" y="620" width="1160" height="160" rx="10" fill="white" stroke="#e0e0e0" filter="url(#sh)"/>
  <text x="600" y="648" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#212121">
    The Lattice Code Hierarchy
  </text>

  <!-- Ladder -->
  <g transform="translate(100, 680)">
    <!-- E8 -->
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#b71c1c"/>
    <text x="60" y="22" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">E8</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffcdd2">dim 8, kiss 240</text>
    <text x="60" y="56" text-anchor="middle" font-family="monospace" font-size="10" fill="#ef9a9a">[[8,0,4]]</text>

    <line x1="130" y1="35" x2="180" y2="35" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

    <!-- BW16 -->
    <rect x="190" y="0" width="120" height="70" rx="8" fill="#4a148c"/>
    <text x="250" y="22" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">BW₁₆</text>
    <text x="250" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#ce93d8">dim 16, kiss 4320</text>
    <text x="250" y="56" text-anchor="middle" font-family="monospace" font-size="10" fill="#ba68c8">Barnes-Wall</text>

    <line x1="320" y1="35" x2="370" y2="35" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

    <!-- Leech -->
    <rect x="380" y="0" width="130" height="70" rx="8" fill="#0d47a1"/>
    <text x="445" y="22" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Λ₂₄</text>
    <text x="445" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#90caf9">dim 24, kiss 196560</text>
    <text x="445" y="56" text-anchor="middle" font-family="monospace" font-size="10" fill="#64b5f6">[[24,0,8]]</text>

    <line x1="520" y1="35" x2="570" y2="35" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

    <!-- E8 Surface -->
    <rect x="580" y="0" width="180" height="70" rx="8" fill="#1b5e20"/>
    <text x="670" y="22" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">E8 Surface</text>
    <text x="670" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#a5d6a7">[[8L², 2, L]]</text>
    <text x="670" y="56" text-anchor="middle" font-family="monospace" font-size="10" fill="#81c784">Fault-tolerant!</text>

    <line x1="770" y1="35" x2="820" y2="35" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>

    <!-- Universal QC -->
    <rect x="830" y="0" width="160" height="70" rx="8" fill="#e65100"/>
    <text x="910" y="22" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Universal QC</text>
    <text x="910" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffe0b2">+ Magic states</text>
    <text x="910" y="56" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffcc80">+ Lattice surgery</text>
  </g>
</svg>
