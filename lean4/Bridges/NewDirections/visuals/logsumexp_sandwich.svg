<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#222244" font-family="Georgia, serif" font-size="20" font-weight="bold">
    The LogSumExp Sandwich Theorem
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#666688" font-family="Georgia, serif" font-size="13">
    max(x,y) ≤ log(eˣ + eʸ) ≤ max(x,y) + log 2
  </text>
  
  <!-- Axes -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="100" y1="400" x2="100" y2="80" stroke="#333" stroke-width="1.5"/>
  
  <!-- X axis labels -->
  <text x="400" y="440" text-anchor="middle" fill="#444" font-family="Georgia, serif" font-size="13">x (with y = 0 fixed)</text>
  <text x="100" y="420" text-anchor="middle" fill="#666" font-size="10">-5</text>
  <text x="220" y="420" text-anchor="middle" fill="#666" font-size="10">-3</text>
  <text x="340" y="420" text-anchor="middle" fill="#666" font-size="10">-1</text>
  <text x="400" y="420" text-anchor="middle" fill="#666" font-size="10">0</text>
  <text x="460" y="420" text-anchor="middle" fill="#666" font-size="10">1</text>
  <text x="580" y="420" text-anchor="middle" fill="#666" font-size="10">3</text>
  <text x="700" y="420" text-anchor="middle" fill="#666" font-size="10">5</text>
  
  <!-- Y axis label -->
  <text x="60" y="240" text-anchor="middle" fill="#444" font-family="Georgia, serif" font-size="13" transform="rotate(-90,60,240)">value</text>
  
  <!-- Grid lines -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#ddd" stroke-width="0.5"/>
  <line x1="100" y1="240" x2="700" y2="240" stroke="#ddd" stroke-width="0.5"/>
  <line x1="100" y1="160" x2="700" y2="160" stroke="#ddd" stroke-width="0.5"/>
  <line x1="400" y1="80" x2="400" y2="400" stroke="#ddd" stroke-width="0.5"/>
  
  <!-- max(x,0) curve (tropical/classical) - blue -->
  <polyline points="100,400 220,400 340,400 400,400 460,360 580,280 700,200"
    fill="none" stroke="#0066cc" stroke-width="2.5"/>
  
  <!-- LSE(x,0) curve (quantum/smooth) - red -->
  <polyline points="100,394.6 160,397 220,397.5 280,393 340,375 370,363 400,345
    430,322 460,307 490,287 520,268 550,252 580,237 640,210 700,187"
    fill="none" stroke="#cc3300" stroke-width="2.5"/>
  
  <!-- max(x,0) + log(2) curve (upper bound) - green dashed -->
  <polyline points="100,372.5 220,372.5 340,372.5 400,372.5 460,332.5 580,252.5 700,172.5"
    fill="none" stroke="#009944" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- The gap region (shaded) -->
  <path d="M100,400 L220,400 L340,400 L400,400 L460,360 L580,280 L700,200
           L700,187 L640,210 L580,237 L520,268 L490,287 L460,307 L430,322 L400,345
           L370,363 L340,375 L280,393 L220,397.5 L160,397 L100,394.6 Z"
    fill="#ff6600" opacity="0.12"/>
  
  <!-- Gap annotation -->
  <line x1="400" y1="400" x2="400" y2="345" stroke="#ff6600" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="420" y="375" fill="#ff6600" font-family="monospace" font-size="11">gap ≤ log 2</text>
  <text x="420" y="390" fill="#ff6600" font-family="monospace" font-size="10">≈ 0.693</text>
  
  <!-- The log(2) gap at x=0 -->
  <circle cx="400" cy="400" r="3" fill="#0066cc"/>
  <circle cx="400" cy="345" r="3" fill="#cc3300"/>
  <circle cx="400" cy="372.5" r="3" fill="#009944"/>
  
  <!-- Legend -->
  <rect x="520" y="80" width="170" height="90" rx="5" fill="white" stroke="#ccc" stroke-width="1"/>
  <line x1="530" y1="100" x2="560" y2="100" stroke="#0066cc" stroke-width="2.5"/>
  <text x="570" y="104" fill="#333" font-family="Georgia, serif" font-size="11">max(x, 0) — Tropical</text>
  
  <line x1="530" y1="125" x2="560" y2="125" stroke="#cc3300" stroke-width="2.5"/>
  <text x="570" y="129" fill="#333" font-family="Georgia, serif" font-size="11">LSE(x, 0) — Quantum</text>
  
  <line x1="530" y1="150" x2="560" y2="150" stroke="#009944" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="570" y="154" fill="#333" font-family="Georgia, serif" font-size="11">max + log 2 — Bound</text>
  
  <!-- One bit annotation -->
  <rect x="120" y="100" width="200" height="55" rx="5" fill="#fff8e0" stroke="#ddcc88" stroke-width="1"/>
  <text x="220" y="120" text-anchor="middle" fill="#886600" font-family="Georgia, serif" font-size="12" font-weight="bold">The One-Bit Theorem</text>
  <text x="220" y="138" text-anchor="middle" fill="#886600" font-family="Georgia, serif" font-size="10">The entire quantum-classical gap</text>
  <text x="220" y="150" text-anchor="middle" fill="#886600" font-family="Georgia, serif" font-size="10">is bounded by log(2) = 1 bit</text>
  
  <!-- Formally verified badge -->
  <rect x="280" y="455" width="240" height="25" rx="12" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
  <text x="400" y="472" text-anchor="middle" fill="#2e7d32" font-family="Georgia, serif" font-size="11">✓ Formally verified in Lean 4</text>
</svg>
