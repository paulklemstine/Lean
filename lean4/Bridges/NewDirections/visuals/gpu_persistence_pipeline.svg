<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="gpu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76b900;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8bc34a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="trop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6f00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffa000;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="data-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4527a0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c4dff;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#546e7a"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212121">
    GPU-Accelerated Persistent Homology via Tropical Structure
  </text>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#757575">
    Max-plus semiring operations map directly to GPU warp-level primitives
  </text>

  <!-- Pipeline stages -->

  <!-- Stage 1: Point Cloud -->
  <rect x="20" y="80" width="170" height="130" rx="10" fill="url(#data-grad)" filter="url(#shadow2)"/>
  <text x="105" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Point Cloud</text>
  <!-- Scatter plot dots -->
  <circle cx="50" cy="140" r="3" fill="#e1bee7"/>
  <circle cx="70" cy="125" r="3" fill="#e1bee7"/>
  <circle cx="90" cy="155" r="3" fill="#e1bee7"/>
  <circle cx="110" cy="130" r="3" fill="#e1bee7"/>
  <circle cx="130" cy="150" r="3" fill="#e1bee7"/>
  <circle cx="60" cy="165" r="3" fill="#e1bee7"/>
  <circle cx="140" cy="135" r="3" fill="#e1bee7"/>
  <circle cx="80" cy="175" r="3" fill="#e1bee7"/>
  <circle cx="120" cy="170" r="3" fill="#e1bee7"/>
  <circle cx="100" cy="185" r="3" fill="#e1bee7"/>
  <text x="105" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ce93d8">n points in ℝ^d</text>

  <line x1="200" y1="145" x2="240" y2="145" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2: Distance Matrix -->
  <rect x="250" y="80" width="170" height="130" rx="10" fill="url(#trop-grad)" filter="url(#shadow2)"/>
  <text x="335" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">L∞ Distance</text>
  <text x="335" y="125" text-anchor="middle" font-family="monospace" font-size="11" fill="#fff8e1">d∞(x,y) = max|xᵢ-yᵢ|</text>
  <!-- Matrix grid -->
  <rect x="280" y="140" width="110" height="55" rx="3" fill="rgba(255,255,255,0.2)"/>
  <text x="335" y="160" text-anchor="middle" font-family="monospace" font-size="9" fill="white">0  .8 1.2 .5</text>
  <text x="335" y="172" text-anchor="middle" font-family="monospace" font-size="9" fill="white">.8  0  .9 1.1</text>
  <text x="335" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="white">1.2 .9  0  .7</text>
  <text x="335" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff8e1">GPU: O(n²) parallel</text>

  <line x1="430" y1="145" x2="470" y2="145" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3: Boundary Matrix -->
  <rect x="480" y="80" width="170" height="130" rx="10" fill="#37474f" filter="url(#shadow2)"/>
  <text x="565" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Boundary Matrix</text>
  <text x="565" y="125" text-anchor="middle" font-family="monospace" font-size="11" fill="#b0bec5">∂_k: C_k → C_{k-1}</text>
  <rect x="510" y="140" width="110" height="55" rx="3" fill="rgba(255,255,255,0.1)"/>
  <text x="565" y="158" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0bec5">1 -1  0  1  0</text>
  <text x="565" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0bec5">0  1 -1  0  1</text>
  <text x="565" y="182" text-anchor="middle" font-family="monospace" font-size="9" fill="#b0bec5">-1  0  1 -1  0</text>
  <text x="565" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#90a4ae">Sparse CSR format</text>

  <line x1="660" y1="145" x2="700" y2="145" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 4: GPU Column Reduction -->
  <rect x="710" y="75" width="230" height="140" rx="10" fill="url(#gpu-grad)" filter="url(#shadow2)"/>
  <text x="825" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">GPU Column Reduction</text>

  <!-- Warp visualization -->
  <g transform="translate(730, 110)">
    <text x="95" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Warps of 32 threads</text>
    <rect x="0" y="8" width="190" height="18" rx="3" fill="rgba(255,255,255,0.3)"/>
    <!-- Thread blocks -->
    <rect x="3" y="11" width="5" height="12" rx="1" fill="white" opacity="0.8"/>
    <rect x="10" y="11" width="5" height="12" rx="1" fill="white" opacity="0.8"/>
    <rect x="17" y="11" width="5" height="12" rx="1" fill="white" opacity="0.8"/>
    <rect x="24" y="11" width="5" height="12" rx="1" fill="white" opacity="0.8"/>
    <rect x="31" y="11" width="5" height="12" rx="1" fill="white" opacity="0.7"/>
    <rect x="38" y="11" width="5" height="12" rx="1" fill="white" opacity="0.7"/>
    <rect x="45" y="11" width="5" height="12" rx="1" fill="white" opacity="0.7"/>
    <rect x="52" y="11" width="5" height="12" rx="1" fill="white" opacity="0.7"/>
    <text x="65" y="22" font-family="Arial" font-size="9" fill="white">...</text>
    <rect x="80" y="11" width="5" height="12" rx="1" fill="white" opacity="0.6"/>
    <rect x="87" y="11" width="5" height="12" rx="1" fill="white" opacity="0.6"/>
    <text x="100" y="22" font-family="Arial" font-size="9" fill="white">...</text>
    <rect x="140" y="11" width="5" height="12" rx="1" fill="#ffeb3b" opacity="0.8"/>
    <rect x="147" y="11" width="5" height="12" rx="1" fill="#ffeb3b" opacity="0.8"/>
    <rect x="154" y="11" width="5" height="12" rx="1" fill="#ffeb3b" opacity="0.8"/>
    <rect x="161" y="11" width="5" height="12" rx="1" fill="#ffeb3b" opacity="0.8"/>
    <rect x="168" y="11" width="5" height="12" rx="1" fill="#ffeb3b" opacity="0.8"/>
    <rect x="175" y="11" width="5" height="12" rx="1" fill="#ffeb3b" opacity="0.8"/>
    <rect x="182" y="11" width="5" height="12" rx="1" fill="#ffeb3b" opacity="0.8"/>
  </g>

  <text x="825" y="150" text-anchor="middle" font-family="monospace" font-size="10" fill="white">pivot = max{i : D[i,j]≠0}</text>
  <text x="825" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c5e1a5">Pivot search: O(log n) parallel</text>
  <text x="825" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c5e1a5">Column add: O(nnz) parallel</text>
  <text x="825" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c5e1a5">Apparent pairs: 70-90% eliminated</text>

  <line x1="945" y1="145" x2="985" y2="145" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 5: Barcode -->
  <rect x="995" y="80" width="180" height="130" rx="10" fill="#880e4f" filter="url(#shadow2)"/>
  <text x="1085" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Persistence Barcode</text>
  <!-- Barcode lines -->
  <line x1="1020" y1="130" x2="1120" y2="130" stroke="#f48fb1" stroke-width="3" stroke-linecap="round"/>
  <line x1="1030" y1="145" x2="1090" y2="145" stroke="#f48fb1" stroke-width="3" stroke-linecap="round"/>
  <line x1="1040" y1="160" x2="1150" y2="160" stroke="#f48fb1" stroke-width="3" stroke-linecap="round"/>
  <line x1="1025" y1="175" x2="1060" y2="175" stroke="#ce93d8" stroke-width="3" stroke-linecap="round"/>
  <line x1="1050" y1="190" x2="1140" y2="190" stroke="#ce93d8" stroke-width="3" stroke-linecap="round"/>
  <text x="1085" y="205" text-anchor="middle" font-family="monospace" font-size="10" fill="#f8bbd0">H₀ H₁ features</text>

  <!-- Tropical Structure Panel -->
  <rect x="20" y="250" width="560" height="220" rx="10" fill="white" stroke="#ff6f00" stroke-width="2" filter="url(#shadow2)"/>
  <text x="300" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e65100">
    Tropical Structure Enables GPU Parallelism
  </text>

  <!-- Max-plus operations -->
  <rect x="40" y="295" width="250" height="155" rx="8" fill="#fff3e0"/>
  <text x="165" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">Max-Plus Semiring (ℝ, max, +)</text>
  <text x="165" y="340" text-anchor="middle" font-family="monospace" font-size="12" fill="#bf360c">a ⊕ b = max(a, b)</text>
  <text x="165" y="360" text-anchor="middle" font-family="monospace" font-size="12" fill="#bf360c">a ⊗ b = a + b</text>
  <text x="165" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e65100">Idempotent: a ⊕ a = a</text>
  <text x="165" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e65100">No cancellation errors!</text>
  <text x="165" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e65100">Warp reduce ↔ tropical max</text>
  <text x="165" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bf360c">__shfl_down_sync → max reduction</text>

  <!-- GPU mapping -->
  <rect x="310" y="295" width="250" height="155" rx="8" fill="#e8f5e9"/>
  <text x="435" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">GPU Mapping</text>
  <text x="435" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">Column → Thread block</text>
  <text x="435" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">Row scan → Warp reduction</text>
  <text x="435" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">Pivot find → Parallel max</text>
  <text x="435" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20">Column add → Scatter</text>
  <text x="435" y="415" text-anchor="middle" font-family="monospace" font-size="10" fill="#2e7d32">Warp size: 32 threads</text>
  <text x="435" y="433" text-anchor="middle" font-family="monospace" font-size="10" fill="#2e7d32">SM occupancy: ~100%</text>
  <text x="435" y="448" text-anchor="middle" font-family="monospace" font-size="10" fill="#2e7d32">Memory: CSR O(nnz+n)</text>

  <!-- Speedup table -->
  <rect x="600" y="250" width="580" height="220" rx="10" fill="white" stroke="#76b900" stroke-width="2" filter="url(#shadow2)"/>
  <text x="890" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#33691e">
    Speedup Analysis
  </text>

  <text x="640" y="305" font-family="monospace" font-size="11" font-weight="bold" fill="#424242">
    n simplices │ Seq O(n³)  │ GPU warps │ Speedup
  </text>
  <line x1="620" y1="312" x2="1160" y2="312" stroke="#bdbdbd" stroke-width="1"/>
  <text x="640" y="330" font-family="monospace" font-size="11" fill="#424242">
        1,000 │     10⁹    │      32  │    31×
  </text>
  <text x="640" y="348" font-family="monospace" font-size="11" fill="#424242">
        5,000 │   1.25×10¹¹│     157  │    32×
  </text>
  <text x="640" y="366" font-family="monospace" font-size="11" fill="#424242">
       10,000 │     10¹²   │     313  │    32×
  </text>
  <text x="640" y="384" font-family="monospace" font-size="11" fill="#424242">
       50,000 │  1.25×10¹⁴ │   1,563  │    32×
  </text>
  <text x="640" y="402" font-family="monospace" font-size="11" fill="#424242">
      100,000 │     10¹⁵   │   3,125  │    32×
  </text>

  <text x="890" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#558b2f">
    + Apparent pair optimization: additional 3-10× speedup
  </text>
  <text x="890" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#558b2f">
    + Multi-GPU scaling: near-linear with k GPUs
  </text>

  <!-- Bottom: Verified theorems -->
  <rect x="20" y="490" width="1160" height="240" rx="10" fill="#263238" filter="url(#shadow2)"/>
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Machine-Verified Theorems (Lean 4)
  </text>

  <!-- Theorem columns -->
  <g transform="translate(40, 540)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#76ff03">✓ sequential_reduction_complexity:</text>
    <text x="15" y="18" font-family="monospace" font-size="10" fill="#b0bec5">n * n * n = n ^ 3</text>

    <text x="0" y="42" font-family="monospace" font-size="11" fill="#76ff03">✓ parallel_pivot_search:</text>
    <text x="15" y="60" font-family="monospace" font-size="10" fill="#b0bec5">O(log n) with n/2 processors</text>

    <text x="0" y="84" font-family="monospace" font-size="11" fill="#76ff03">✓ tropical_gpu_assoc:</text>
    <text x="15" y="102" font-family="monospace" font-size="10" fill="#b0bec5">max(max(a,b),c) = max(a,max(b,c))</text>

    <text x="0" y="126" font-family="monospace" font-size="11" fill="#76ff03">✓ gpu_speedup_bound:</text>
    <text x="15" y="144" font-family="monospace" font-size="10" fill="#b0bec5">1 ≤ min(W, n/32) for W warps</text>

    <text x="0" y="168" font-family="monospace" font-size="11" fill="#76ff03">✓ tropical_numerical_stability:</text>
    <text x="15" y="186" font-family="monospace" font-size="10" fill="#b0bec5">max(a,b) ≥ a (no cancellation)</text>
  </g>

  <g transform="translate(600, 540)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#76ff03">✓ apparent_pair_speedup:</text>
    <text x="15" y="18" font-family="monospace" font-size="10" fill="#b0bec5">n - n_apparent ≤ n</text>

    <text x="0" y="42" font-family="monospace" font-size="11" fill="#76ff03">✓ batch_amortized_cost:</text>
    <text x="15" y="60" font-family="monospace" font-size="10" fill="#b0bec5">n³/k ≤ n³ per filtration</text>

    <text x="0" y="84" font-family="monospace" font-size="11" fill="#76ff03">✓ multi_gpu_scaling:</text>
    <text x="15" y="102" font-family="monospace" font-size="10" fill="#b0bec5">n/k columns per GPU</text>

    <text x="0" y="126" font-family="monospace" font-size="11" fill="#76ff03">✓ sparse_memory_bound:</text>
    <text x="15" y="144" font-family="monospace" font-size="10" fill="#b0bec5">nnz ≤ n² (CSR efficient)</text>

    <text x="0" y="168" font-family="monospace" font-size="11" fill="#76ff03">✓ column_independence:</text>
    <text x="15" y="186" font-family="monospace" font-size="10" fill="#b0bec5">Different pivots → parallel safe</text>
  </g>
</svg>
