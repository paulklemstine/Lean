<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e" />
      <stop offset="100%" style="stop-color:#1a1a4e" />
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#FFD700" font-size="18" font-weight="bold">Persistence Stability via Tropical Metric</text>
  <text x="400" y="55" text-anchor="middle" fill="#8888cc" font-size="12">d∞(I,J) = max(|b₁-b₂|, |d₁-d₂|) — the bottleneck distance is L∞</text>

  <!-- Left: Original persistence diagram -->
  <text x="200" y="85" text-anchor="middle" fill="#00CED1" font-size="14" font-weight="bold">Original Diagram</text>

  <!-- Axes -->
  <line x1="60" y1="380" x2="370" y2="380" stroke="#666" stroke-width="1"/>
  <line x1="60" y1="100" x2="60" y2="380" stroke="#666" stroke-width="1"/>
  <text x="215" y="400" text-anchor="middle" fill="#888" font-size="11">birth →</text>
  <text x="35" y="240" text-anchor="middle" fill="#888" font-size="11" transform="rotate(-90,35,240)">death →</text>

  <!-- Diagonal -->
  <line x1="60" y1="380" x2="360" y2="100" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="340" y="115" fill="#555" font-size="9">diagonal</text>

  <!-- Persistence points (original) -->
  <circle cx="100" cy="160" r="8" fill="#FF6B6B" opacity="0.9"/>
  <text x="115" y="158" fill="#FF6B6B" font-size="10">★ significant</text>
  <text x="115" y="170" fill="#888" font-size="9">(0.1, 0.9)</text>

  <circle cx="130" cy="220" r="7" fill="#50C878" opacity="0.9"/>
  <text x="145" y="225" fill="#50C878" font-size="10">significant</text>
  <text x="145" y="237" fill="#888" font-size="9">(0.2, 0.7)</text>

  <circle cx="200" cy="320" r="4" fill="#888" opacity="0.6"/>
  <text x="212" y="325" fill="#888" font-size="9">noise</text>

  <circle cx="240" cy="340" r="3" fill="#888" opacity="0.6"/>
  <circle cx="280" cy="350" r="3" fill="#888" opacity="0.6"/>

  <!-- ε-band around significant points -->
  <circle cx="100" cy="160" r="25" fill="none" stroke="#FF6B6B" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <circle cx="130" cy="220" r="25" fill="none" stroke="#50C878" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Right: Perturbed persistence diagram -->
  <text x="600" y="85" text-anchor="middle" fill="#DA70D6" font-size="14" font-weight="bold">Perturbed Diagram (ε = 0.05)</text>

  <!-- Axes -->
  <line x1="460" y1="380" x2="770" y2="380" stroke="#666" stroke-width="1"/>
  <line x1="460" y1="100" x2="460" y2="380" stroke="#666" stroke-width="1"/>
  <text x="615" y="400" text-anchor="middle" fill="#888" font-size="11">birth →</text>

  <!-- Diagonal -->
  <line x1="460" y1="380" x2="760" y2="100" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Perturbed persistence points -->
  <circle cx="505" cy="165" r="8" fill="#FF6B6B" opacity="0.9"/>
  <text x="520" y="163" fill="#FF6B6B" font-size="10">★ survives!</text>
  <text x="520" y="175" fill="#888" font-size="9">(0.12, 0.88)</text>

  <circle cx="535" cy="225" r="7" fill="#50C878" opacity="0.9"/>
  <text x="550" y="230" fill="#50C878" font-size="10">survives!</text>
  <text x="550" y="242" fill="#888" font-size="9">(0.22, 0.68)</text>

  <circle cx="590" cy="330" r="4" fill="#888" opacity="0.4"/>
  <circle cx="650" cy="355" r="3" fill="#888" opacity="0.4"/>

  <!-- Connection arrows -->
  <path d="M 370 200 C 400 200, 430 200, 460 200" fill="none" stroke="#FFD700" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="415" y="190" text-anchor="middle" fill="#FFD700" font-size="11">d∞ ≤ ε</text>

  <!-- Theorem box -->
  <rect x="130" y="415" width="540" height="55" rx="8" fill="#1a1a3a" stroke="#FFD700" stroke-width="1.5"/>
  <text x="400" y="435" text-anchor="middle" fill="#FFD700" font-size="13" font-weight="bold">Stability Theorem (Lean 4 verified)</text>
  <text x="400" y="455" text-anchor="middle" fill="#ccc" font-size="12">lifetime(I) &gt; t + 2ε  ∧  d∞(I,J) ≤ ε  ⟹  lifetime(J) &gt; t</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFD700"/>
    </marker>
  </defs>
</svg>
