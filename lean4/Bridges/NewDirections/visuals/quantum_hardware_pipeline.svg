<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="dwave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="ibm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tropical-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff6d00;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="hybrid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="white"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212121">
    Quantum Hardware Integration Pipeline
  </text>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#757575">
    Tropical Annealing → QUBO → D-Wave / IBM Processors → Hybrid Optimization
  </text>

  <!-- Step 1: Tropical Optimization Problem -->
  <rect x="30" y="100" width="220" height="160" rx="12" fill="url(#tropical-grad)" filter="url(#shadow)"/>
  <text x="140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">
    Tropical Problem
  </text>
  <text x="140" y="155" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffe0b2">
    max_x (Wx ⊕ b)
  </text>
  <text x="140" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffe0b2">
    where ⊕ = max, ⊗ = +
  </text>
  <line x1="60" y1="200" x2="220" y2="200" stroke="#ffe0b2" stroke-opacity="0.3"/>
  <text x="140" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    β(t) = c·log(1+t)
  </text>
  <text x="140" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffe0b2">
    Logarithmic cooling
  </text>

  <!-- Arrow 1→2 -->
  <line x1="260" y1="180" x2="310" y2="180" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#546e7a">QUBO</text>

  <!-- Step 2: QUBO Formulation -->
  <rect x="320" y="100" width="200" height="160" rx="12" fill="#455a64" filter="url(#shadow)"/>
  <text x="420" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">
    QUBO Matrix
  </text>
  <text x="420" y="155" text-anchor="middle" font-family="monospace" font-size="12" fill="#b0bec5">
    Q = -W (upper tri)
  </text>
  <text x="420" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#b0bec5">
    min x^T Q x
  </text>
  <text x="420" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cfd8dc">
    n(n+1)/2 coefficients
  </text>
  <text x="420" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#90a4ae">
    Ising model equivalent
  </text>

  <!-- Arrows 2→3a and 2→3b -->
  <path d="M 530 155 Q 570 120, 620 120" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 530 220 Q 570 250, 620 250" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3a: D-Wave -->
  <rect x="630" y="80" width="240" height="120" rx="12" fill="url(#dwave-grad)" filter="url(#shadow)"/>
  <text x="750" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">
    D-Wave Annealer
  </text>
  <text x="750" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9fa8da">
    5000+ qubits (Pegasus)
  </text>
  <text x="750" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9fa8da">
    Native annealing: 1-2000 μs
  </text>
  <text x="750" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7986cb">
    s(t) = β(t)/β_max ∈ [0,1]
  </text>
  <text x="750" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7986cb">
    Minor embedding: ~15n physical qubits
  </text>

  <!-- Step 3b: IBM -->
  <rect x="630" y="220" width="240" height="120" rx="12" fill="url(#ibm-grad)" filter="url(#shadow)"/>
  <text x="750" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">
    IBM Gate Processor
  </text>
  <text x="750" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#90caf9">
    1121 qubits (Condor)
  </text>
  <text x="750" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#90caf9">
    Trotter: n² gates/step
  </text>
  <text x="750" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64b5f6">
    Error: ||[H₁,H₂]||t²/(2n)
  </text>
  <text x="750" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64b5f6">
    SU(4) → ≤3 CNOTs + rotations
  </text>

  <!-- Arrows 3a→4 and 3b→4 -->
  <path d="M 880 160 Q 920 180, 930 200" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 880 280 Q 920 260, 930 240" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Hybrid Loop -->
  <rect x="940" y="160" width="230" height="120" rx="12" fill="url(#hybrid-grad)" filter="url(#shadow)"/>
  <text x="1055" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">
    Hybrid Loop
  </text>
  <text x="1055" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a5d6a7">
    QPU → Local Search → Update
  </text>
  <text x="1055" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a5d6a7">
    Best of quantum + classical
  </text>
  <text x="1055" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#81c784">
    Converge to tropical optimum
  </text>
  <text x="1055" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#81c784">
    Error mitigation: ZNE, readout
  </text>

  <!-- Feedback arrow -->
  <path d="M 1055 290 Q 1055 380, 420 380 Q 280 380, 280 270" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <text x="660" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">
    Iterate: update weights, refine schedule
  </text>

  <!-- Bottom panel: Schedule comparison -->
  <rect x="30" y="430" width="1140" height="250" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212121">
    Annealing Schedule Comparison
  </text>

  <!-- Axes -->
  <line x1="100" y1="630" x2="550" y2="630" stroke="#424242" stroke-width="1.5"/>
  <line x1="100" y1="480" x2="100" y2="630" stroke="#424242" stroke-width="1.5"/>
  <text x="325" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#616161">Time t</text>
  <text x="70" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#616161" transform="rotate(-90, 70, 555)">β(t)</text>

  <!-- Logarithmic schedule -->
  <path d="M 100 630 Q 150 560, 200 530 Q 300 490, 400 480 Q 480 475, 550 472" fill="none" stroke="#e65100" stroke-width="2.5"/>
  <circle cx="550" cy="472" r="4" fill="#e65100"/>
  <text x="560" y="472" font-family="Arial, sans-serif" font-size="11" fill="#e65100">log: c·log(1+t)</text>

  <!-- Geometric schedule -->
  <path d="M 100 625 Q 150 620, 200 610 Q 300 580, 400 520 Q 480 470, 550 430" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <text x="560" y="433" font-family="Arial, sans-serif" font-size="11" fill="#1565c0">geometric: β₀·α^t</text>

  <!-- Linear schedule -->
  <path d="M 100 630 L 550 480" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="560" y="483" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">linear: r·t</text>

  <!-- Key metrics -->
  <rect x="650" y="470" width="500" height="190" rx="8" fill="#f5f5f5" stroke="#e0e0e0"/>
  <text x="900" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212121">Key Verified Theorems</text>

  <text x="670" y="520" font-family="monospace" font-size="11" fill="#424242">✓ β(t₁) ≤ β(t₂) for t₁ ≤ t₂</text>
  <text x="670" y="540" font-family="monospace" font-size="11" fill="#424242">✓ β(0) = 0 (max exploration)</text>
  <text x="670" y="560" font-family="monospace" font-size="11" fill="#424242">✓ Gap ≤ log(n)/β → 0 as t → ∞</text>
  <text x="670" y="580" font-family="monospace" font-size="11" fill="#424242">✓ Trotter error: O(t²/n)</text>
  <text x="670" y="600" font-family="monospace" font-size="11" fill="#424242">✓ QUBO coefficients: n(n+1)/2</text>
  <text x="670" y="620" font-family="monospace" font-size="11" fill="#424242">✓ D-Wave schedule: s ∈ [0,1]</text>
  <text x="670" y="640" font-family="monospace" font-size="11" fill="#424242">✓ Gate count: O(n²·T) CNOTs</text>
</svg>
