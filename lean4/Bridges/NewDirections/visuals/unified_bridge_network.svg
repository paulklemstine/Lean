<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#e0e0ff" font-family="Georgia, serif" font-size="22" font-weight="bold">
    The Unified Idempotent-Tropical-Quantum Framework
  </text>
  <text x="500" y="68" text-anchor="middle" fill="#8888cc" font-family="Georgia, serif" font-size="13">
    Four Breakthrough Directions — Machine-Verified in Lean 4
  </text>
  
  <!-- Central node: f∘f=f -->
  <circle cx="500" cy="350" r="55" fill="none" stroke="#ffd700" stroke-width="3" filter="url(#glow2)"/>
  <circle cx="500" cy="350" r="52" fill="#1a1a3e" stroke="#ffd700" stroke-width="1"/>
  <text x="500" y="342" text-anchor="middle" fill="#ffd700" font-family="monospace" font-size="18" font-weight="bold">f ∘ f = f</text>
  <text x="500" y="363" text-anchor="middle" fill="#ccaa00" font-family="Georgia, serif" font-size="11">Idempotence</text>
  
  <!-- Direction 1: Tropical NAS (top-left) -->
  <circle cx="220" cy="170" r="70" fill="none" stroke="#00ccff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="220" cy="170" r="67" fill="#0a1a3e" stroke="#00ccff" stroke-width="1"/>
  <text x="220" y="150" text-anchor="middle" fill="#00ccff" font-family="Georgia, serif" font-size="13" font-weight="bold">Tropical</text>
  <text x="220" y="168" text-anchor="middle" fill="#00ccff" font-family="Georgia, serif" font-size="13" font-weight="bold">Neural</text>
  <text x="220" y="186" text-anchor="middle" fill="#00ccff" font-family="Georgia, serif" font-size="13" font-weight="bold">Architecture</text>
  <text x="220" y="202" text-anchor="middle" fill="#0099cc" font-family="Georgia, serif" font-size="10">Search</text>
  
  <!-- Direction 2: Quantum Optimization (top-right) -->
  <circle cx="780" cy="170" r="70" fill="none" stroke="#ff6600" stroke-width="2" filter="url(#glow)"/>
  <circle cx="780" cy="170" r="67" fill="#1a0a0e" stroke="#ff6600" stroke-width="1"/>
  <text x="780" y="150" text-anchor="middle" fill="#ff6600" font-family="Georgia, serif" font-size="13" font-weight="bold">Quantum-</text>
  <text x="780" y="168" text-anchor="middle" fill="#ff6600" font-family="Georgia, serif" font-size="13" font-weight="bold">Inspired</text>
  <text x="780" y="186" text-anchor="middle" fill="#ff6600" font-family="Georgia, serif" font-size="13" font-weight="bold">Optimization</text>
  <text x="780" y="202" text-anchor="middle" fill="#cc5500" font-family="Georgia, serif" font-size="10">LSE Sandwich</text>
  
  <!-- Direction 3: Topological Interpretability (bottom-left) -->
  <circle cx="220" cy="530" r="70" fill="none" stroke="#00ff88" stroke-width="2" filter="url(#glow)"/>
  <circle cx="220" cy="530" r="67" fill="#0a1a1e" stroke="#00ff88" stroke-width="1"/>
  <text x="220" y="510" text-anchor="middle" fill="#00ff88" font-family="Georgia, serif" font-size="13" font-weight="bold">Topological</text>
  <text x="220" y="528" text-anchor="middle" fill="#00ff88" font-family="Georgia, serif" font-size="13" font-weight="bold">AI</text>
  <text x="220" y="546" text-anchor="middle" fill="#00ff88" font-family="Georgia, serif" font-size="13" font-weight="bold">Interpretability</text>
  <text x="220" y="562" text-anchor="middle" fill="#00cc66" font-family="Georgia, serif" font-size="10">Persistence + L∞</text>
  
  <!-- Direction 4: Division Algebra Codes (bottom-right) -->
  <circle cx="780" cy="530" r="70" fill="none" stroke="#cc44ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="780" cy="530" r="67" fill="#1a0a2e" stroke="#cc44ff" stroke-width="1"/>
  <text x="780" y="510" text-anchor="middle" fill="#cc44ff" font-family="Georgia, serif" font-size="13" font-weight="bold">Division</text>
  <text x="780" y="528" text-anchor="middle" fill="#cc44ff" font-family="Georgia, serif" font-size="13" font-weight="bold">Algebra</text>
  <text x="780" y="546" text-anchor="middle" fill="#cc44ff" font-family="Georgia, serif" font-size="13" font-weight="bold">Codes</text>
  <text x="780" y="562" text-anchor="middle" fill="#9933cc" font-family="Georgia, serif" font-size="10">E8 Lattice + 𝕆</text>
  
  <!-- Bridge lines to center -->
  <line x1="280" y1="215" x2="452" y2="310" stroke="#00ccff" stroke-width="1.5" opacity="0.6"/>
  <line x1="720" y1="215" x2="548" y2="310" stroke="#ff6600" stroke-width="1.5" opacity="0.6"/>
  <line x1="280" y1="485" x2="452" y2="390" stroke="#00ff88" stroke-width="1.5" opacity="0.6"/>
  <line x1="720" y1="485" x2="548" y2="390" stroke="#cc44ff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Cross-bridges -->
  <line x1="290" y1="170" x2="710" y2="170" stroke="#ff9900" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="290" y1="530" x2="710" y2="530" stroke="#88ff88" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="220" y1="240" x2="220" y2="460" stroke="#00ddaa" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="780" y1="240" x2="780" y2="460" stroke="#dd66ff" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  
  <!-- Bridge labels -->
  <text x="365" y="248" text-anchor="middle" fill="#00ccff" font-family="monospace" font-size="9" transform="rotate(-25,365,248)">ReLU = max(·,0)</text>
  <text x="635" y="248" text-anchor="middle" fill="#ff6600" font-family="monospace" font-size="9" transform="rotate(25,635,248)">LSE ≈ max + log2</text>
  <text x="365" y="448" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="9" transform="rotate(25,365,448)">d∞ = max(|Δb|,|Δd|)</text>
  <text x="635" y="448" text-anchor="middle" fill="#cc44ff" font-family="monospace" font-size="9" transform="rotate(-25,635,448)">‖xy‖ = ‖x‖·‖y‖</text>
  
  <!-- Key equations box -->
  <rect x="350" y="600" width="300" height="85" rx="8" fill="#0a0a2e" stroke="#666699" stroke-width="1"/>
  <text x="500" y="620" text-anchor="middle" fill="#aaaadd" font-family="Georgia, serif" font-size="11" font-weight="bold">Key Equations (Formally Verified)</text>
  <text x="500" y="638" text-anchor="middle" fill="#8888bb" font-family="monospace" font-size="10">max(x,y) ≤ LSE(x,y) ≤ max(x,y) + ln2</text>
  <text x="500" y="654" text-anchor="middle" fill="#8888bb" font-family="monospace" font-size="10">(a²+b²)(c²+d²) = (ac-bd)² + (ad+bc)²</text>
  <text x="500" y="670" text-anchor="middle" fill="#8888bb" font-family="monospace" font-size="10">240 = C(8,2)·4 + 2⁸/2 = 112 + 128</text>
  
  <!-- Researcher icons -->
  <g transform="translate(80,620)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00ccff" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#00ccff" font-size="10">A</text>
    <text x="0" y="18" text-anchor="middle" fill="#666699" font-size="7">Algebraist</text>
  </g>
  <g transform="translate(130,640)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ff6600" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ff6600" font-size="10">P</text>
    <text x="0" y="18" text-anchor="middle" fill="#666699" font-size="7">Physicist</text>
  </g>
  <g transform="translate(80,660)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00ff88" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#00ff88" font-size="10">T</text>
    <text x="0" y="18" text-anchor="middle" fill="#666699" font-size="7">Topologist</text>
  </g>
  <g transform="translate(870,620)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#cc44ff" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#cc44ff" font-size="10">C</text>
    <text x="0" y="18" text-anchor="middle" fill="#666699" font-size="7">Coder</text>
  </g>
  <g transform="translate(920,640)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ffdd00" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ffdd00" font-size="10">S</text>
    <text x="0" y="18" text-anchor="middle" fill="#666699" font-size="7">CS</text>
  </g>
</svg>
