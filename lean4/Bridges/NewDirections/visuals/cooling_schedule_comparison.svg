<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e" />
      <stop offset="100%" style="stop-color:#1a1a4e" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#FFD700" font-size="18" font-weight="bold">Quantum Annealing: Temperature Interpolation</text>
  <text x="400" y="55" text-anchor="middle" fill="#8888cc" font-size="12">max(x,y) ≤ LSE(x,y) ≤ max(x,y) + log(2)</text>

  <!-- Axes -->
  <line x1="80" y1="420" x2="750" y2="420" stroke="#666" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="420" stroke="#666" stroke-width="1.5"/>
  <text x="415" y="455" text-anchor="middle" fill="#aaa" font-size="13">Inverse Temperature β →</text>
  <text x="30" y="250" text-anchor="middle" fill="#aaa" font-size="13" transform="rotate(-90,30,250)">LSE_β(x) →</text>

  <!-- Tropical limit line (max) -->
  <line x1="80" y1="150" x2="750" y2="150" stroke="#00CED1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="755" y="148" fill="#00CED1" font-size="11" text-anchor="start">max (tropical)</text>

  <!-- Log(2) gap band -->
  <rect x="80" y="120" width="670" height="30" fill="#FFD700" opacity="0.08"/>
  <line x1="80" y1="120" x2="750" y2="120" stroke="#FFD700" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="755" y="125" fill="#FFD700" font-size="10" opacity="0.7">max + log(2)</text>

  <!-- LSE curve (approaching max from above) -->
  <path d="M 80 350 Q 150 300, 200 250 Q 300 200, 400 180 Q 500 165, 600 158 Q 700 153, 750 151"
        fill="none" stroke="#FF6B6B" stroke-width="3"/>
  <text x="95" y="345" fill="#FF6B6B" font-size="11">β=0.1</text>
  <text x="755" y="155" fill="#FF6B6B" font-size="11">β→∞</text>

  <!-- Average line -->
  <line x1="80" y1="350" x2="130" y2="350" stroke="#50C878" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="135" y="348" fill="#50C878" font-size="11">average (uniform)</text>

  <!-- β annotations -->
  <line x1="200" y1="250" x2="200" y2="425" stroke="#888" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="200" y="440" text-anchor="middle" fill="#888" font-size="10">β=1</text>
  <text x="200" y="265" text-anchor="middle" fill="#FF6B6B" font-size="9">Exploration</text>

  <line x1="500" y1="165" x2="500" y2="425" stroke="#888" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="500" y="440" text-anchor="middle" fill="#888" font-size="10">β=10</text>
  <text x="500" y="180" text-anchor="middle" fill="#FF6B6B" font-size="9">Balanced</text>

  <line x1="700" y1="153" x2="700" y2="425" stroke="#888" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="700" y="440" text-anchor="middle" fill="#888" font-size="10">β=100</text>
  <text x="700" y="168" text-anchor="middle" fill="#FF6B6B" font-size="9">Exploitation</text>

  <!-- Gap annotation -->
  <line x1="300" y1="150" x2="300" y2="210" stroke="#FFD700" stroke-width="2"/>
  <text x="310" y="185" fill="#FFD700" font-size="11">gap ≤ log(2)/β</text>

  <!-- Legend -->
  <rect x="120" y="70" width="200" height="40" rx="5" fill="#1a1a3e" stroke="#444" stroke-width="1"/>
  <text x="130" y="88" fill="#FFD700" font-size="11" font-weight="bold">One-Bit Theorem:</text>
  <text x="130" y="103" fill="#ccc" font-size="10">log(2) &lt; 1 — gap is sub-bit!</text>

  <!-- Phase labels at bottom -->
  <rect x="100" y="460" width="180" height="25" rx="5" fill="#50C878" opacity="0.15"/>
  <text x="190" y="478" text-anchor="middle" fill="#50C878" font-size="11">QUANTUM (explore)</text>

  <rect x="350" y="460" width="150" height="25" rx="5" fill="#FFD700" opacity="0.15"/>
  <text x="425" y="478" text-anchor="middle" fill="#FFD700" font-size="11">TRANSITION</text>

  <rect x="550" y="460" width="180" height="25" rx="5" fill="#00CED1" opacity="0.15"/>
  <text x="640" y="478" text-anchor="middle" fill="#00CED1" font-size="11">TROPICAL (exploit)</text>
</svg>
