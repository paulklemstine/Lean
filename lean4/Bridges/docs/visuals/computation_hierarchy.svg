<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">
    The Computation Hierarchy: Classical ⊂ Tropical ⊂ Quantum
  </text>
  
  <!-- Three nested ellipses -->
  <!-- Quantum (outermost) -->
  <ellipse cx="400" cy="270" rx="350" ry="180" fill="none" stroke="#6644ff" stroke-width="3" opacity="0.8"/>
  <text x="720" y="140" fill="#6644ff" font-size="14" font-weight="bold">QUANTUM</text>
  <text x="720" y="158" fill="#8866ff" font-size="11">(ℂ, +, ×)</text>
  <text x="720" y="174" fill="#8866ff" font-size="10">Amplitudes</text>
  <text x="720" y="188" fill="#8866ff" font-size="10">Superposition</text>
  
  <!-- Tropical (middle) -->
  <ellipse cx="400" cy="280" rx="240" ry="130" fill="none" stroke="#44bb44" stroke-width="3" opacity="0.8"/>
  <text x="610" y="210" fill="#44bb44" font-size="14" font-weight="bold">TROPICAL</text>
  <text x="610" y="228" fill="#66dd66" font-size="11">(ℝ, max, +)</text>
  <text x="610" y="244" fill="#66dd66" font-size="10">Optimization</text>
  <text x="610" y="258" fill="#66dd66" font-size="10">Idempotent</text>
  
  <!-- Classical (innermost) -->
  <ellipse cx="400" cy="290" rx="120" ry="70" fill="none" stroke="#ff4444" stroke-width="3" opacity="0.8"/>
  <text x="400" y="275" text-anchor="middle" fill="#ff4444" font-size="14" font-weight="bold">CLASSICAL</text>
  <text x="400" y="295" text-anchor="middle" fill="#ff6666" font-size="11">({0,1}, OR, AND)</text>
  <text x="400" y="312" text-anchor="middle" fill="#ff6666" font-size="10">Boolean Logic</text>
  
  <!-- Arrows showing embeddings -->
  <g transform="translate(400, 400)">
    <!-- Boolean → Tropical -->
    <line x1="-80" y1="0" x2="-30" y2="0" stroke="#ff8844" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-55" y="-8" text-anchor="middle" fill="#ff8844" font-size="10">embed</text>
    <text x="-120" y="5" text-anchor="middle" fill="#ff4444" font-size="12">Bool</text>
    
    <!-- Tropical → Quantum -->
    <line x1="30" y1="0" x2="80" y2="0" stroke="#44ff44" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="55" y="-8" text-anchor="middle" fill="#44ff44" font-size="10">exp(·)</text>
    <text x="120" y="5" text-anchor="middle" fill="#44bb44" font-size="12">Trop</text>
  </g>
  
  <!-- Temperature axis -->
  <line x1="100" y1="450" x2="700" y2="450" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <text x="100" y="445" text-anchor="middle" fill="#ff4444" font-size="11">T → 0</text>
  <text x="400" y="445" text-anchor="middle" fill="#44bb44" font-size="11">T = 1</text>
  <text x="700" y="445" text-anchor="middle" fill="#6644ff" font-size="11">T → ∞</text>
  <text x="400" y="475" text-anchor="middle" fill="#888888" font-size="10">
    Maslov Dequantization Parameter ε
  </text>
  
  <!-- Key operations at each level -->
  <rect x="50" y="85" width="180" height="100" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="140" y="105" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Operations</text>
  <text x="60" y="125" fill="#ff4444" font-size="10">Bool: OR, AND</text>
  <text x="60" y="145" fill="#44bb44" font-size="10">Trop: max, +</text>
  <text x="60" y="165" fill="#6644ff" font-size="10">Quant: +, ×</text>
  
  <rect x="570" y="300" width="180" height="80" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="660" y="320" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Decision Rule</text>
  <text x="580" y="340" fill="#ff4444" font-size="10">Bool: threshold</text>
  <text x="580" y="358" fill="#44bb44" font-size="10">Trop: argmax</text>
  <text x="580" y="376" fill="#6644ff" font-size="10">Quant: softmax</text>
</svg>
