<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4488ff" opacity="0.6"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">
    The Unified Idempotent-Tropical-Quantum Framework
  </text>
  <text x="500" y="70" text-anchor="middle" fill="#8899cc" font-size="14">
    f ∘ f = f — The Master Equation Connecting Seven Mathematical Domains
  </text>
  
  <!-- Central Node: f∘f = f -->
  <circle cx="500" cy="350" r="60" fill="#2244aa" stroke="#4488ff" stroke-width="3" filter="url(#glow)"/>
  <text x="500" y="343" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">f ∘ f = f</text>
  <text x="500" y="363" text-anchor="middle" fill="#aabbee" font-size="11">Idempotent</text>
  <text x="500" y="378" text-anchor="middle" fill="#aabbee" font-size="11">Fixed Point</text>
  
  <!-- Domain Nodes (7 outer nodes in a heptagon) -->
  
  <!-- 1. Tropical Algebra (top) -->
  <rect x="420" y="100" width="160" height="55" rx="10" fill="#1a5c2a" stroke="#33bb55" stroke-width="2"/>
  <text x="500" y="122" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Tropical Algebra</text>
  <text x="500" y="140" text-anchor="middle" fill="#88ddaa" font-size="10">(ℝ, max, +) semiring</text>
  
  <!-- 2. Neural Networks (top-right) -->
  <rect x="730" y="170" width="160" height="55" rx="10" fill="#5c1a1a" stroke="#dd4444" stroke-width="2"/>
  <text x="810" y="192" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Neural Networks</text>
  <text x="810" y="210" text-anchor="middle" fill="#ffaaaa" font-size="10">ReLU = max(x, 0)</text>
  
  <!-- 3. Quantum Mechanics (right) -->
  <rect x="750" y="370" width="160" height="55" rx="10" fill="#1a1a5c" stroke="#6666ff" stroke-width="2"/>
  <text x="830" y="392" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Quantum Physics</text>
  <text x="830" y="410" text-anchor="middle" fill="#aaaaff" font-size="10">LogSumExp, Born rule</text>
  
  <!-- 4. Number Theory (bottom-right) -->
  <rect x="680" y="530" width="160" height="55" rx="10" fill="#5c4c1a" stroke="#ddaa33" stroke-width="2"/>
  <text x="760" y="552" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Number Theory</text>
  <text x="760" y="570" text-anchor="middle" fill="#eedd88" font-size="10">Berggren, Pythagorean</text>
  
  <!-- 5. Information Theory (bottom-left) -->
  <rect x="160" y="530" width="160" height="55" rx="10" fill="#4c1a5c" stroke="#bb44dd" stroke-width="2"/>
  <text x="240" y="552" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Information Theory</text>
  <text x="240" y="570" text-anchor="middle" fill="#dd99ee" font-size="10">Entropy, KL divergence</text>
  
  <!-- 6. Division Algebras (left) -->
  <rect x="90" y="370" width="160" height="55" rx="10" fill="#1a4c5c" stroke="#44bbdd" stroke-width="2"/>
  <text x="170" y="392" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Division Algebras</text>
  <text x="170" y="410" text-anchor="middle" fill="#88ddee" font-size="10">ℝ → ℂ → ℍ → 𝕆</text>
  
  <!-- 7. Topology/TDA (top-left) -->
  <rect x="110" y="170" width="160" height="55" rx="10" fill="#3c3c1a" stroke="#aaaa44" stroke-width="2"/>
  <text x="190" y="192" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Persistent Homology</text>
  <text x="190" y="210" text-anchor="middle" fill="#dddd88" font-size="10">Barcodes, TDA</text>
  
  <!-- Bridge Lines (connecting center to each domain) -->
  <line x1="500" y1="290" x2="500" y2="155" stroke="#33bb55" stroke-width="2" opacity="0.5"/>
  <line x1="555" y1="310" x2="730" y2="197" stroke="#dd4444" stroke-width="2" opacity="0.5"/>
  <line x1="560" y1="350" x2="750" y2="397" stroke="#6666ff" stroke-width="2" opacity="0.5"/>
  <line x1="545" y1="400" x2="680" y2="557" stroke="#ddaa33" stroke-width="2" opacity="0.5"/>
  <line x1="455" y1="400" x2="320" y2="557" stroke="#bb44dd" stroke-width="2" opacity="0.5"/>
  <line x1="440" y1="350" x2="250" y2="397" stroke="#44bbdd" stroke-width="2" opacity="0.5"/>
  <line x1="445" y1="310" x2="270" y2="197" stroke="#aaaa44" stroke-width="2" opacity="0.5"/>
  
  <!-- Cross-bridges (new discoveries) -->
  <!-- Tropical ↔ Neural -->
  <line x1="580" y1="127" x2="730" y2="182" stroke="#ff8844" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <text x="655" y="140" text-anchor="middle" fill="#ff8844" font-size="9">ReLU Rosetta</text>
  
  <!-- Tropical ↔ Information -->
  <line x1="420" y1="145" x2="240" y2="530" stroke="#bb66ff" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="310" y="340" text-anchor="middle" fill="#bb66ff" font-size="9" transform="rotate(-65,310,340)">LSE Bridge</text>
  
  <!-- Neural ↔ Quantum -->
  <line x1="840" y1="225" x2="840" y2="370" stroke="#ff66aa" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="860" y="300" text-anchor="middle" fill="#ff66aa" font-size="9">Softmax</text>
  
  <!-- Number Theory ↔ Division Algebras -->
  <line x1="680" y1="570" x2="250" y2="410" stroke="#66ffaa" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="470" y="510" text-anchor="middle" fill="#66ffaa" font-size="9">Brahmagupta-Fibonacci</text>
  
  <!-- TDA ↔ Tropical -->
  <line x1="270" y1="180" x2="420" y2="120" stroke="#ffff44" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="345" y="138" text-anchor="middle" fill="#ffff44" font-size="9">Bottleneck = L∞</text>
  
  <!-- Legend -->
  <rect x="30" y="620" width="940" height="60" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="50" y="645" fill="#ffffff" font-size="12" font-weight="bold">New Bridges Discovered:</text>
  <circle cx="280" cy="642" r="5" fill="#ff8844"/>
  <text x="290" y="647" fill="#cccccc" font-size="10">Entropy–Tropical</text>
  <circle cx="420" cy="642" r="5" fill="#66ffaa"/>
  <text x="430" y="647" fill="#cccccc" font-size="10">Coding–Algebra</text>
  <circle cx="560" cy="642" r="5" fill="#ffff44"/>
  <text x="570" y="647" fill="#cccccc" font-size="10">Persistence–Tropical</text>
  <circle cx="730" cy="642" r="5" fill="#ff66aa"/>
  <text x="740" y="647" fill="#cccccc" font-size="10">Spectral–Idempotent</text>
  <circle cx="880" cy="642" r="5" fill="#bb66ff"/>
  <text x="890" y="647" fill="#cccccc" font-size="10">Quantum–Tropical</text>
</svg>
