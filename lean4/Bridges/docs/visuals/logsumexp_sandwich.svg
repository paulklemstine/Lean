<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="700" height="400" fill="#0d1117"/>
  
  <text x="350" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">
    The LogSumExp Sandwich Theorem
  </text>
  <text x="350" y="52" text-anchor="middle" fill="#8899cc" font-size="13">
    max(x,y) ≤ log(eˣ+eʸ) ≤ max(x,y) + log 2
  </text>
  
  <!-- Axes -->
  <line x1="80" y1="330" x2="650" y2="330" stroke="#555555" stroke-width="1"/>
  <line x1="80" y1="330" x2="80" y2="80" stroke="#555555" stroke-width="1"/>
  <text x="365" y="365" text-anchor="middle" fill="#888888" font-size="11">y (with x = 0 fixed)</text>
  <text x="40" y="200" text-anchor="middle" fill="#888888" font-size="11" transform="rotate(-90,40,200)">value</text>
  
  <!-- y-axis labels -->
  <text x="70" y="330" text-anchor="end" fill="#888888" font-size="10">0</text>
  <text x="70" y="230" text-anchor="end" fill="#888888" font-size="10">2</text>
  <text x="70" y="130" text-anchor="end" fill="#888888" font-size="10">4</text>
  
  <!-- x-axis labels -->
  <text x="80" y="348" text-anchor="middle" fill="#888888" font-size="10">-4</text>
  <text x="223" y="348" text-anchor="middle" fill="#888888" font-size="10">-2</text>
  <text x="365" y="348" text-anchor="middle" fill="#888888" font-size="10">0</text>
  <text x="508" y="348" text-anchor="middle" fill="#888888" font-size="10">2</text>
  <text x="650" y="348" text-anchor="middle" fill="#888888" font-size="10">4</text>
  
  <!-- Fill between curves (the sandwich) -->
  <path d="M80,330 L223,330 L365,330 L508,230 L650,130
           L650,96 L508,196 L365,296 L223,296 L80,296 Z"
        fill="#33bb55" opacity="0.15"/>
  
  <!-- Lower bound: max(0, y) -->
  <polyline points="80,330 223,330 365,330 508,230 650,130"
            fill="none" stroke="#4488ff" stroke-width="2.5"/>
  <text x="620" y="118" fill="#4488ff" font-size="12" font-weight="bold">max(0, y)</text>
  
  <!-- LogSumExp curve (smooth) -->
  <path d="M80,296 Q130,296 180,296 Q230,296 280,296 Q330,295 365,282 Q400,268 430,248 Q460,228 490,208 Q520,188 550,168 Q580,148 610,128 Q630,118 650,108"
        fill="none" stroke="#ffcc00" stroke-width="2.5"/>
  <text x="620" y="98" fill="#ffcc00" font-size="12" font-weight="bold">LSE(0, y)</text>
  
  <!-- Upper bound: max(0, y) + log(2) -->
  <polyline points="80,296 223,296 365,296 508,196 650,96"
            fill="none" stroke="#ff4444" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="620" y="82" fill="#ff4444" font-size="12">max + log 2</text>
  
  <!-- Gap annotation -->
  <line x1="365" y1="330" x2="365" y2="282" stroke="#ffcc00" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="365" y1="296" x2="365" y2="296" stroke="#ff4444" stroke-width="1"/>
  
  <!-- Gap label -->
  <rect x="380" y="295" width="160" height="40" rx="5" fill="rgba(255,255,255,0.1)"/>
  <text x="460" y="312" text-anchor="middle" fill="#ffffff" font-size="11">Gap ∈ [0, log 2]</text>
  <text x="460" y="328" text-anchor="middle" fill="#aaaaaa" font-size="10">= [0, 0.693...]</text>
  
  <!-- Interpretation box -->
  <rect x="100" y="370" width="500" height="22" rx="3" fill="rgba(255,204,0,0.1)" stroke="#ffcc00" stroke-width="0.5"/>
  <text x="350" y="385" text-anchor="middle" fill="#ffcc00" font-size="11">
    The cost of dequantization: replacing max with softmax costs at most 0.693 nats
  </text>
</svg>
