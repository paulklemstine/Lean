<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">
    Cayley Transform: SPB ↔ Circle Group
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#666" font-size="13">
    cayley(x) = (1 + ix)/(1 − ix) maps ℝ → S¹
  </text>

  <!-- Left: Real Line with SPB -->
  <g transform="translate(130, 280)">
    <!-- Real line -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="130" y="5" fill="#333" font-size="12">ℝ</text>

    <!-- Points on real line -->
    <circle cx="-60" cy="0" r="6" fill="#2196f3"/>
    <text x="-60" y="-15" text-anchor="middle" fill="#2196f3" font-size="11" font-weight="bold">x</text>
    <text x="-60" y="20" text-anchor="middle" fill="#666" font-size="9">0.5</text>

    <circle cx="30" cy="0" r="6" fill="#4caf50"/>
    <text x="30" y="-15" text-anchor="middle" fill="#4caf50" font-size="11" font-weight="bold">y</text>
    <text x="30" y="20" text-anchor="middle" fill="#666" font-size="9">1.0</text>

    <circle cx="90" cy="0" r="6" fill="#f44336"/>
    <text x="90" y="-15" text-anchor="middle" fill="#f44336" font-size="11" font-weight="bold">spb(x,y)</text>
    <text x="90" y="20" text-anchor="middle" fill="#666" font-size="9">3.0</text>

    <!-- SPB operation -->
    <path d="M -50 -30 Q -15 -55 20 -30" fill="none" stroke="#ff9800" stroke-width="2"/>
    <text x="-15" y="-55" text-anchor="middle" fill="#ff9800" font-size="10">spb</text>

    <text x="0" y="60" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">
      (ℝ, spb) — Partial Group
    </text>
    <text x="0" y="80" text-anchor="middle" fill="#666" font-size="11">
      spb(x,y) = (x+y)/(1−xy)
    </text>

    <!-- Zero as identity -->
    <circle cx="0" cy="0" r="4" fill="#333"/>
    <text x="0" y="-12" text-anchor="middle" fill="#333" font-size="9">0 (id)</text>
  </g>

  <!-- Right: Unit Circle with Multiplication -->
  <g transform="translate(580, 260)">
    <!-- Unit circle -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#333" stroke-width="2"/>

    <!-- Axes -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#ccc" stroke-width="1"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#ccc" stroke-width="1"/>
    <text x="145" y="5" fill="#999" font-size="10">Re</text>
    <text x="5" y="-132" fill="#999" font-size="10">Im</text>

    <!-- cayley(0.5) ≈ 0.6+0.8i → angle ≈ 53° -->
    <circle cx="72" cy="-96" r="6" fill="#2196f3"/>
    <text x="82" y="-100" fill="#2196f3" font-size="10" font-weight="bold">cayley(x)</text>

    <!-- cayley(1.0) = i → angle = 90° -->
    <circle cx="0" cy="-120" r="6" fill="#4caf50"/>
    <text x="10" y="-125" fill="#4caf50" font-size="10" font-weight="bold">cayley(y)</text>

    <!-- cayley(3.0) ≈ -0.8+0.6i → angle ≈ 143° -->
    <circle cx="-96" cy="-72" r="6" fill="#f44336"/>
    <text x="-100" y="-82" fill="#f44336" font-size="10" font-weight="bold">cayley(spb)</text>

    <!-- Multiplication arc -->
    <path d="M 72 -96 A 120 120 0 0 0 -96 -72" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="-20" y="-135" fill="#ff9800" font-size="10">multiply</text>

    <!-- 1 on circle -->
    <circle cx="120" cy="0" r="4" fill="#333"/>
    <text x="120" y="15" text-anchor="middle" fill="#333" font-size="9">1 (id)</text>

    <text x="0" y="170" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">
      (S¹, ·) — Circle Group
    </text>
    <text x="0" y="190" text-anchor="middle" fill="#666" font-size="11">
      |cayley(x)| = 1 always
    </text>
  </g>

  <!-- Arrow between the two -->
  <g transform="translate(310, 240)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#ff9800" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="70" y="-15" text-anchor="middle" fill="#ff9800" font-size="13" font-weight="bold">Cayley</text>
    <text x="70" y="20" text-anchor="middle" fill="#666" font-size="10">Group Homomorphism</text>
    <text x="70" y="35" text-anchor="middle" fill="#999" font-size="9">cayley(spb(x,y)) = cayley(x)·cayley(y)</text>
  </g>

  <!-- Key formula box -->
  <rect x="250" y="430" width="300" height="50" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="400" y="453" text-anchor="middle" fill="#e65100" font-size="12" font-weight="bold">
    Key Identity (Formally Verified in Lean 4)
  </text>
  <text x="400" y="470" text-anchor="middle" fill="#333" font-size="11">
    cayley(spb(x,y)) = cayley(x) · cayley(y)
  </text>
</svg>
