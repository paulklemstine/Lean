<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#d6e4f0"/>
    </linearGradient>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
    </marker>
    <marker id="arrowP" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6a1b9a"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)"/>

  <text x="400" y="35" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">
    3D SPB &amp; Thomas-Wigner Precession
  </text>
  <text x="400" y="58" text-anchor="middle" fill="#666" font-size="13">
    spb₃(u, v) = (u + v + u × v) / (1 − u · v) — Non-commutative!
  </text>

  <!-- Left: 1D commutative case -->
  <rect x="30" y="80" width="220" height="180" rx="10" fill="white" stroke="#1565c0" stroke-width="1.5"/>
  <text x="140" y="105" text-anchor="middle" fill="#1565c0" font-size="15" font-weight="bold">1D SPB: S¹</text>
  <text x="140" y="130" text-anchor="middle" fill="#333" font-size="12">Commutative</text>
  <text x="140" y="155" text-anchor="middle" fill="#555" font-size="11" font-family="serif">
    spb(x, y) = (x+y)/(1−xy)
  </text>
  <text x="140" y="180" text-anchor="middle" fill="#555" font-size="11">
    ≅ Circle group S¹
  </text>
  <text x="140" y="200" text-anchor="middle" fill="#555" font-size="11">
    Division algebra: ℂ
  </text>
  <text x="140" y="220" text-anchor="middle" fill="#1565c0" font-size="11">
    spb(a,b) = spb(b,a) ✓
  </text>
  <text x="140" y="248" text-anchor="middle" fill="#888" font-size="10">
    No precession
  </text>

  <!-- Center: 3D non-commutative case -->
  <rect x="280" y="80" width="250" height="180" rx="10" fill="white" stroke="#2e7d32" stroke-width="2"/>
  <text x="405" y="105" text-anchor="middle" fill="#2e7d32" font-size="15" font-weight="bold">3D SPB: S³ (Quaternions)</text>
  <text x="405" y="130" text-anchor="middle" fill="#c62828" font-size="13" font-weight="bold">Non-Commutative!</text>
  <text x="405" y="155" text-anchor="middle" fill="#555" font-size="11" font-family="serif">
    spb₃(u,v) = (u+v+u×v)/(1−u·v)
  </text>
  <text x="405" y="180" text-anchor="middle" fill="#555" font-size="11">
    ≅ SU(2)/ℤ₂ ≅ SO(3)
  </text>
  <text x="405" y="200" text-anchor="middle" fill="#555" font-size="11">
    Division algebra: ℍ
  </text>
  <text x="405" y="220" text-anchor="middle" fill="#c62828" font-size="11">
    spb₃(u,v) = R(θ_TW) · spb₃(v,u)
  </text>
  <text x="405" y="248" text-anchor="middle" fill="#6a1b9a" font-size="11" font-weight="bold">
    θ_TW = Thomas precession angle
  </text>

  <!-- Right: 7D non-associative case -->
  <rect x="560" y="80" width="210" height="180" rx="10" fill="white" stroke="#ff6f00" stroke-width="1.5"/>
  <text x="665" y="105" text-anchor="middle" fill="#ff6f00" font-size="15" font-weight="bold">7D SPB: S⁷</text>
  <text x="665" y="130" text-anchor="middle" fill="#c62828" font-size="13" font-weight="bold">Non-Associative!</text>
  <text x="665" y="155" text-anchor="middle" fill="#555" font-size="11" font-family="serif">
    Uses octonionic cross product
  </text>
  <text x="665" y="180" text-anchor="middle" fill="#555" font-size="11">
    Not a Lie group
  </text>
  <text x="665" y="200" text-anchor="middle" fill="#555" font-size="11">
    Division algebra: 𝕆
  </text>
  <text x="665" y="220" text-anchor="middle" fill="#c62828" font-size="11">
    spb₇(a,spb₇(b,c)) ≠ spb₇(spb₇(a,b),c)
  </text>
  <text x="665" y="248" text-anchor="middle" fill="#888" font-size="10">
    Hurwitz theorem: only dims 1,3,7
  </text>

  <!-- Thomas precession diagram -->
  <rect x="60" y="290" width="680" height="190" rx="10" fill="white" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="400" y="315" text-anchor="middle" fill="#6a1b9a" font-size="15" font-weight="bold">
    Thomas-Wigner Rotation in SPB Coordinates
  </text>

  <!-- Vector diagram -->
  <!-- Origin -->
  <circle cx="200" cy="400" r="4" fill="#333"/>
  <text x="195" y="425" text-anchor="middle" fill="#333" font-size="11">O</text>

  <!-- u vector -->
  <line x1="200" y1="400" x2="330" y2="350" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="275" y="362" text-anchor="middle" fill="#2e7d32" font-size="13" font-weight="bold">u</text>

  <!-- v vector -->
  <line x1="200" y1="400" x2="260" y2="310" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="220" y="345" text-anchor="middle" fill="#c62828" font-size="13" font-weight="bold">v</text>

  <!-- spb₃(u,v) -->
  <line x1="200" y1="400" x2="410" y2="305" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <text x="320" y="335" text-anchor="middle" fill="#2e7d32" font-size="11">spb₃(u,v)</text>

  <!-- spb₃(v,u) -->
  <line x1="200" y1="400" x2="400" y2="320" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowR)"/>
  <text x="320" y="370" text-anchor="middle" fill="#c62828" font-size="11">spb₃(v,u)</text>

  <!-- Rotation arc -->
  <path d="M 390,320 A 30,30 0 0,1 395,305" fill="none" stroke="#6a1b9a" stroke-width="2"/>
  <text x="420" y="310" fill="#6a1b9a" font-size="11" font-weight="bold">θ_TW</text>

  <!-- Explanation text -->
  <text x="560" y="350" text-anchor="middle" fill="#333" font-size="12">
    The difference between
  </text>
  <text x="560" y="370" text-anchor="middle" fill="#333" font-size="12">
    spb₃(u,v) and spb₃(v,u)
  </text>
  <text x="560" y="390" text-anchor="middle" fill="#333" font-size="12">
    is a pure rotation by θ_TW
  </text>
  <text x="560" y="415" text-anchor="middle" fill="#6a1b9a" font-size="11" font-weight="bold">
    This is the Thomas-Wigner rotation
  </text>
  <text x="560" y="435" text-anchor="middle" fill="#555" font-size="11">
    Observable in relativistic gyroscopes
  </text>
  <text x="560" y="455" text-anchor="middle" fill="#555" font-size="11">
    and atomic spin-orbit coupling
  </text>

  <!-- Footer -->
  <text x="400" y="495" text-anchor="middle" fill="#888" font-size="10">
    The cross product u × v in the SPB₃ formula is the source of non-commutativity and Thomas precession
  </text>
</svg>
