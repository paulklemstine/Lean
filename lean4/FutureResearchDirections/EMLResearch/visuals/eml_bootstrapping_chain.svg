<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1329"/>
      <stop offset="100%" stop-color="#1a1e3e"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFD700"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#FFD700" font-size="24" font-weight="bold" filter="url(#glow2)">
    EML Bootstrapping Chain
  </text>
  <text x="500" y="62" text-anchor="middle" fill="#8888cc" font-size="13">
    Building all elementary functions from eml(x,y) = exp(x) − ln(y) and the constant 1
  </text>

  <!-- Level 0: The constant 1 -->
  <rect x="420" y="90" width="160" height="40" rx="8" fill="#1a3a1a" stroke="#44ff88" stroke-width="2"/>
  <text x="500" y="115" text-anchor="middle" fill="#44ff88" font-size="14" font-weight="bold">1 (constant)</text>
  <text x="500" y="82" text-anchor="middle" fill="#88cc88" font-size="11">Level 0: Primitive</text>

  <!-- Arrow down -->
  <line x1="500" y1="130" x2="500" y2="160" stroke="#FFD700" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 1: e -->
  <rect x="370" y="165" width="260" height="50" rx="8" fill="#2a2a1a" stroke="#FFD700" stroke-width="2"/>
  <text x="500" y="185" text-anchor="middle" fill="#FFD700" font-size="13" font-weight="bold">e = eml(1, 1) = exp(1) − ln(1)</text>
  <text x="500" y="205" text-anchor="middle" fill="#ddcc88" font-size="11">= 2.71828... (Euler's number)</text>
  <text x="350" y="155" text-anchor="end" fill="#cc8844" font-size="11">Level 1</text>

  <!-- Arrows to Level 2 -->
  <line x1="400" y1="215" x2="250" y2="255" stroke="#FFD700" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="215" x2="750" y2="255" stroke="#FFD700" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Level 2a: exp(e) -->
  <rect x="100" y="260" width="300" height="50" rx="8" fill="#2a1a2a" stroke="#ff44aa" stroke-width="2"/>
  <text x="250" y="280" text-anchor="middle" fill="#ff44aa" font-size="12" font-weight="bold">exp(e) = eml(e, 1) = eml(eml(1,1), 1)</text>
  <text x="250" y="298" text-anchor="middle" fill="#dd88aa" font-size="11">= 15.15426... (depth 2, 3 leaves)</text>

  <!-- Level 2b: e - 1 -->
  <rect x="600" y="260" width="300" height="50" rx="8" fill="#1a2a3a" stroke="#4488ff" stroke-width="2"/>
  <text x="750" y="280" text-anchor="middle" fill="#4488ff" font-size="12" font-weight="bold">e − 1 = eml(1, e) = eml(1, eml(1,1))</text>
  <text x="750" y="298" text-anchor="middle" fill="#88aadd" font-size="11">= 1.71828... (depth 2, 3 leaves)</text>

  <!-- Arrow to level 3 -->
  <line x1="250" y1="310" x2="250" y2="345" stroke="#FFD700" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="310" x2="750" y2="345" stroke="#FFD700" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="215" x2="500" y2="345" stroke="#FFD700" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Level 3 expressions -->
  <rect x="50" y="350" width="260" height="45" rx="8" fill="#1a1a2a" stroke="#aa44ff" stroke-width="1.5"/>
  <text x="180" y="370" text-anchor="middle" fill="#aa44ff" font-size="11" font-weight="bold">exp(exp(e)) = eml(exp(e), 1)</text>
  <text x="180" y="387" text-anchor="middle" fill="#9988cc" font-size="10">≈ 3814279.1 (depth 3)</text>

  <rect x="370" y="350" width="260" height="45" rx="8" fill="#1a1a2a" stroke="#44ffff" stroke-width="1.5"/>
  <text x="500" y="370" text-anchor="middle" fill="#44ffff" font-size="11" font-weight="bold">exp(e) − ln(e) = eml(e, e)</text>
  <text x="500" y="387" text-anchor="middle" fill="#88cccc" font-size="10">= exp(e) − 1 ≈ 14.154 (depth 2)</text>

  <rect x="690" y="350" width="260" height="45" rx="8" fill="#1a1a2a" stroke="#ff8844" stroke-width="1.5"/>
  <text x="820" y="370" text-anchor="middle" fill="#ff8844" font-size="11" font-weight="bold">exp(e−1) = eml(e−1, 1)</text>
  <text x="820" y="387" text-anchor="middle" fill="#ccaa88" font-size="10">≈ 5.5749 (depth 3)</text>

  <!-- Big arrow to functions -->
  <line x1="500" y1="400" x2="500" y2="440" stroke="#FFD700" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="430" text-anchor="middle" fill="#FFD700" font-size="12">⋮ continue building ⋮</text>

  <!-- Functions recovered -->
  <rect x="50" y="460" width="900" height="160" rx="12" fill="#0d1133" stroke="#555588" stroke-width="1"/>
  <text x="500" y="485" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">Elementary Functions Recovered</text>

  <!-- Function grid -->
  <text x="100" y="510" fill="#44ff88" font-size="12" font-weight="bold">Algebraic:</text>
  <text x="100" y="528" fill="#aaddbb" font-size="11">a − b = eml(ln(a), exp(b))</text>
  <text x="100" y="544" fill="#aaddbb" font-size="11">a + b = eml(ln(a), exp(−b))</text>
  <text x="100" y="560" fill="#aaddbb" font-size="11">a × b = exp(ln(a) + ln(b))</text>
  <text x="100" y="576" fill="#aaddbb" font-size="11">a / b = exp(ln(a) − ln(b))</text>
  <text x="100" y="592" fill="#aaddbb" font-size="11">aᵇ = exp(b · ln(a))</text>

  <text x="400" y="510" fill="#4488ff" font-size="12" font-weight="bold">Transcendental:</text>
  <text x="400" y="528" fill="#aabbdd" font-size="11">exp(x) = eml(x, 1)</text>
  <text x="400" y="544" fill="#aabbdd" font-size="11">ln(x) via eml composition</text>
  <text x="400" y="560" fill="#aabbdd" font-size="11">xʸ = exp(y · ln(x))</text>

  <text x="680" y="510" fill="#ff44aa" font-size="12" font-weight="bold">Trigonometric (via ℂ):</text>
  <text x="680" y="528" fill="#ddaacc" font-size="11">sin(x) = Im(exp(ix))</text>
  <text x="680" y="544" fill="#ddaacc" font-size="11">cos(x) = Re(exp(ix))</text>
  <text x="680" y="560" fill="#ddaacc" font-size="11">tan(x) = sin(x)/cos(x)</text>
  <text x="680" y="576" fill="#ff6666" font-size="10">⚠ Requires iπ = ln(−1)</text>
  <text x="680" y="592" fill="#ff6666" font-size="10">  (complex intermediate values)</text>

  <!-- Footer -->
  <text x="500" y="650" text-anchor="middle" fill="#555588" font-size="11">
    Key insight: Two buttons (PUSH 1, EML) suffice for all of mathematics' elementary functions
  </text>
  <text x="500" y="670" text-anchor="middle" fill="#444466" font-size="10">
    Based on: A. Odrzywolek, "All elementary functions from a single operator" (2025)
  </text>
</svg>