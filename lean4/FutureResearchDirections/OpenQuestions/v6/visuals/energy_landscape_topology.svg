<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg3)"/>

  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Energy Landscape E(x) = N mod x for N = 143 (= 11 × 13)</text>

  <!-- Axes -->
  <line x1="80" y1="420" x2="850" y2="420" stroke="#444466" stroke-width="2"/>
  <line x1="80" y1="420" x2="80" y2="60" stroke="#444466" stroke-width="2"/>
  <text x="450" y="460" text-anchor="middle" fill="#888888" font-size="13">x (trial divisor)</text>
  <text x="30" y="240" text-anchor="middle" fill="#888888" font-size="13" transform="rotate(-90 30 240)">E(x) = N mod x</text>

  <!-- Energy bars (sampled points for N=143) -->
  <!-- E(1)=0, E(2)=1, E(3)=2, E(4)=3, E(5)=3, E(6)=5, E(7)=3, E(8)=7, E(9)=8, E(10)=3, E(11)=0, E(12)=11, E(13)=0 -->
  <!-- Scale: x from 1-20 mapped to 80-800, E from 0-15 mapped to 420-60 -->

  <rect x="95" y="420" width="20" height="0" fill="#00e676"/>
  <rect x="135" y="396" width="20" height="24" fill="#42a5f5"/>
  <rect x="175" y="372" width="20" height="48" fill="#42a5f5"/>
  <rect x="215" y="348" width="20" height="72" fill="#42a5f5"/>
  <rect x="255" y="348" width="20" height="72" fill="#42a5f5"/>
  <rect x="295" y="300" width="20" height="120" fill="#42a5f5"/>
  <rect x="335" y="348" width="20" height="72" fill="#42a5f5"/>
  <rect x="375" y="252" width="20" height="168" fill="#42a5f5"/>
  <rect x="415" y="228" width="20" height="192" fill="#42a5f5"/>
  <rect x="455" y="348" width="20" height="72" fill="#42a5f5"/>
  <rect x="495" y="420" width="20" height="0" fill="#00e676"/>
  <rect x="535" y="156" width="20" height="264" fill="#ef5350"/>
  <rect x="575" y="420" width="20" height="0" fill="#00e676"/>
  <rect x="615" y="108" width="20" height="312" fill="#ef5350"/>
  <rect x="655" y="324" width="20" height="96" fill="#42a5f5"/>

  <!-- Factor markers -->
  <circle cx="105" cy="420" r="8" fill="#00e676" stroke="#ffffff" stroke-width="2"/>
  <circle cx="505" cy="420" r="8" fill="#00e676" stroke="#ffffff" stroke-width="2"/>
  <circle cx="585" cy="420" r="8" fill="#00e676" stroke="#ffffff" stroke-width="2"/>

  <!-- Labels -->
  <text x="105" y="445" text-anchor="middle" fill="#00e676" font-size="10" font-weight="bold">1</text>
  <text x="145" y="445" text-anchor="middle" fill="#888888" font-size="10">2</text>
  <text x="185" y="445" text-anchor="middle" fill="#888888" font-size="10">3</text>
  <text x="505" y="445" text-anchor="middle" fill="#00e676" font-size="10" font-weight="bold">11</text>
  <text x="585" y="445" text-anchor="middle" fill="#00e676" font-size="10" font-weight="bold">13</text>

  <!-- Y-axis labels -->
  <text x="70" y="425" text-anchor="end" fill="#888888" font-size="10">0</text>
  <text x="70" y="300" text-anchor="end" fill="#888888" font-size="10">5</text>
  <text x="70" y="180" text-anchor="end" fill="#888888" font-size="10">10</text>

  <!-- Annotations -->
  <rect x="60" y="490" width="380" height="100" rx="8" fill="#111133" stroke="#334466" stroke-width="1.5"/>
  <text x="250" y="515" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">Formally Verified Properties</text>
  <text x="80" y="537" fill="#00e676" font-size="11">✓ E(x) = 0 ⟺ x | N (exactly 4 zeros)</text>
  <text x="80" y="555" fill="#00e676" font-size="11">✓ E(N-1) = 1 (energy at predecessor)</text>
  <text x="80" y="573" fill="#00e676" font-size="11">✓ Sublevel set at 0 = divisors of N</text>

  <rect x="470" y="490" width="380" height="100" rx="8" fill="#111133" stroke="#ff6f00" stroke-width="1.5"/>
  <text x="660" y="515" text-anchor="middle" fill="#ff9100" font-size="14" font-weight="bold">Topological Insights</text>
  <text x="490" y="537" fill="#ffcc00" font-size="11">• Zero-energy points = factors (verified)</text>
  <text x="490" y="555" fill="#ffcc00" font-size="11">• Gradient ≥ 0 at factors (verified)</text>
  <text x="490" y="573" fill="#ffcc00" font-size="11">• Phase transition at β_c ≈ 2/ln(N)</text>
</svg>
