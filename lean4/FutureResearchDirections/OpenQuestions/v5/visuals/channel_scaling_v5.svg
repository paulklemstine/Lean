<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2848;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="500" fill="url(#bg3)"/>
  
  <text x="450" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Multi-Channel Factoring: Channel Scaling</text>
  <text x="450" y="55" text-anchor="middle" fill="#88aaff" font-size="13">Total channels = 2k² - k · Proved: k² ≤ channels ≤ 2k²</text>
  
  <!-- Chart area -->
  <line x1="100" y1="400" x2="800" y2="400" stroke="#555" stroke-width="1"/>
  <line x1="100" y1="80" x2="100" y2="400" stroke="#555" stroke-width="1"/>
  
  <!-- Y-axis -->
  <text x="50" y="250" text-anchor="middle" fill="#aaa" font-size="12" transform="rotate(-90, 50, 250)">Number of Channels</text>
  <text x="90" y="404" text-anchor="end" fill="#888" font-size="10">0</text>
  <text x="90" y="324" text-anchor="end" fill="#888" font-size="10">100</text>
  <text x="90" y="244" text-anchor="end" fill="#888" font-size="10">200</text>
  <text x="90" y="164" text-anchor="end" fill="#888" font-size="10">300</text>
  <text x="90" y="84" text-anchor="end" fill="#888" font-size="10">400</text>
  
  <!-- X-axis -->
  <text x="450" y="440" text-anchor="middle" fill="#aaa" font-size="12">k (tuple size)</text>
  
  <!-- Grid -->
  <line x1="100" y1="320" x2="800" y2="320" stroke="#333" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="100" y1="240" x2="800" y2="240" stroke="#333" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="100" y1="160" x2="800" y2="160" stroke="#333" stroke-width="0.5" stroke-dasharray="4"/>
  
  <!-- Data: k=2..16, channels = 2k²-k -->
  <!-- Scale: x from 100 to 800 for k=2..16 (700/14 = 50 px per k) -->
  <!-- Scale: y from 400 to 80 for 0..400 (320/400 = 0.8 px per unit) -->
  
  <!-- 2k² line (upper bound) -->
  <polyline points="100,393.6 150,368 200,332 250,288 300,236 350,176 400,108"
            fill="none" stroke="#ff6666" stroke-width="2" stroke-dasharray="6" opacity="0.7"/>
  <text x="410" y="105" fill="#ff6666" font-size="10">2k² (upper)</text>
  
  <!-- k² line (lower bound) -->
  <polyline points="100,396.8 150,387.2 200,371.2 250,348.8 300,320 350,284.8 400,243.2"
            fill="none" stroke="#66ff66" stroke-width="2" stroke-dasharray="6" opacity="0.7"/>
  <text x="410" y="240" fill="#66ff66" font-size="10">k² (lower)</text>
  
  <!-- Actual channels = 2k²-k -->
  <polyline points="100,395.2 150,372 200,340 250,300 300,252 350,196 400,132"
            fill="none" stroke="#4488ff" stroke-width="3"/>
  
  <!-- Data points with values -->
  <circle cx="100" cy="395.2" r="5" fill="#4488ff"/>
  <text x="100" y="415" text-anchor="middle" fill="#888" font-size="9">k=2</text>
  <text x="100" y="388" text-anchor="middle" fill="#4488ff" font-size="9">6</text>
  
  <circle cx="150" cy="372" r="5" fill="#4488ff"/>
  <text x="150" y="415" text-anchor="middle" fill="#888" font-size="9">k=4</text>
  <text x="150" y="365" text-anchor="middle" fill="#4488ff" font-size="9">28</text>
  
  <circle cx="200" cy="340" r="5" fill="#4488ff"/>
  <text x="200" y="415" text-anchor="middle" fill="#888" font-size="9">k=6</text>
  <text x="200" y="333" text-anchor="middle" fill="#4488ff" font-size="9">66</text>
  
  <circle cx="250" cy="300" r="5" fill="#4488ff"/>
  <text x="250" y="415" text-anchor="middle" fill="#888" font-size="9">k=8</text>
  <text x="260" y="293" fill="#4488ff" font-size="9">120</text>
  
  <circle cx="300" cy="252" r="5" fill="#4488ff"/>
  <text x="300" y="415" text-anchor="middle" fill="#888" font-size="9">k=10</text>
  <text x="310" y="245" fill="#4488ff" font-size="9">190</text>
  
  <circle cx="350" cy="196" r="5" fill="#4488ff"/>
  <text x="350" y="415" text-anchor="middle" fill="#888" font-size="9">k=12</text>
  <text x="360" y="189" fill="#4488ff" font-size="9">276</text>
  
  <circle cx="400" cy="132" r="5" fill="#4488ff"/>
  <text x="400" y="415" text-anchor="middle" fill="#888" font-size="9">k=14</text>
  <text x="410" y="125" fill="#4488ff" font-size="9">378</text>
  
  <!-- Right panel: Theorem summary -->
  <rect x="480" y="80" width="380" height="300" rx="10" fill="#ffffff08" stroke="#ffffff20"/>
  <text x="500" y="105" fill="#fff" font-size="14" font-weight="bold">Formally Verified Results</text>
  
  <text x="500" y="130" fill="#00cc66" font-size="12">✓ total_channels_formula</text>
  <text x="520" y="148" fill="#ccc" font-size="11">k² + 2·C(k,2) = 2k² - k</text>
  
  <text x="500" y="175" fill="#00cc66" font-size="12">✓ channel_lower_bound</text>
  <text x="520" y="193" fill="#ccc" font-size="11">k² ≤ total channels</text>
  
  <text x="500" y="220" fill="#00cc66" font-size="12">✓ channel_upper_bound</text>
  <text x="520" y="238" fill="#ccc" font-size="11">total channels ≤ 2k²</text>
  
  <text x="500" y="265" fill="#00cc66" font-size="12">✓ marginal_channels</text>
  <text x="520" y="283" fill="#ccc" font-size="11">Δ(channels) = 4k + 1</text>
  
  <text x="500" y="310" fill="#00cc66" font-size="12">✓ birthday_tuples_needed</text>
  <text x="520" y="328" fill="#ccc" font-size="11">√(N/k²) ≤ √N/k</text>
  
  <text x="500" y="355" fill="#00cc66" font-size="12">✓ nontrivial_divisor_count</text>
  <text x="520" y="373" fill="#ccc" font-size="11">2^m - 2 ≥ 2 for m ≥ 2</text>
  
  <!-- Bottom insight -->
  <rect x="100" y="450" width="700" height="35" rx="6" fill="#4488ff15" stroke="#4488ff50"/>
  <text x="450" y="472" text-anchor="middle" fill="#88ccff" font-size="12">
    Key insight: Each additional element adds 4k+1 new channels — quadratic scaling!
  </text>
</svg>
