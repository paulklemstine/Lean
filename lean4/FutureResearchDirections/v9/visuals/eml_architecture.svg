<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0c040"/>
      <stop offset="100%" style="stop-color:#ff9900"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4488ff"/>
      <stop offset="100%" style="stop-color:#2255cc"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#44cc88"/>
      <stop offset="100%" style="stop-color:#228855"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="url(#gold)" font-size="28" font-weight="bold" filter="url(#glow)">OISCC Architecture</text>
  <text x="450" y="70" text-anchor="middle" fill="#8899bb" font-size="14">One Instruction Set Continuous Computer</text>
  
  <!-- Central EML Box -->
  <rect x="330" y="120" width="240" height="100" rx="15" fill="url(#blue)" filter="url(#shadow)" stroke="#6699ff" stroke-width="2"/>
  <text x="450" y="155" text-anchor="middle" fill="white" font-size="22" font-weight="bold">EML(a, b)</text>
  <text x="450" y="180" text-anchor="middle" fill="#ccddff" font-size="18">= eᵃ − ln(b)</text>
  <text x="450" y="205" text-anchor="middle" fill="#99bbee" font-size="12">The Universal Instruction</text>
  
  <!-- Input arrows -->
  <path d="M250,170 L325,170" stroke="#ff9944" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="240" y="167" text-anchor="end" fill="#ff9944" font-size="16" font-weight="bold">a</text>
  <path d="M250,190 L325,190" stroke="#44ccaa" stroke-width="2"/>
  <text x="240" y="193" text-anchor="end" fill="#44ccaa" font-size="16" font-weight="bold">b</text>
  
  <!-- Output arrow -->
  <path d="M575,170 L650,170" stroke="url(#gold)" stroke-width="2"/>
  <text x="660" y="175" fill="url(#gold)" font-size="16" font-weight="bold">c = eᵃ − ln(b)</text>
  
  <!-- Recovery Boxes -->
  <!-- exp -->
  <rect x="50" y="280" width="160" height="60" rx="10" fill="#1a3355" stroke="#4488ff" stroke-width="1.5"/>
  <text x="130" y="305" text-anchor="middle" fill="#88bbff" font-size="14" font-weight="bold">exp(x)</text>
  <text x="130" y="325" text-anchor="middle" fill="#6699cc" font-size="12">= EML(x, 1)</text>
  
  <!-- ln -->
  <rect x="230" y="280" width="160" height="60" rx="10" fill="#1a3355" stroke="#4488ff" stroke-width="1.5"/>
  <text x="310" y="305" text-anchor="middle" fill="#88bbff" font-size="14" font-weight="bold">ln(x)</text>
  <text x="310" y="325" text-anchor="middle" fill="#6699cc" font-size="11">= EML(0, exp(EML(0,x)))</text>
  
  <!-- subtraction -->
  <rect x="410" y="280" width="160" height="60" rx="10" fill="#1a3355" stroke="#44cc88" stroke-width="1.5"/>
  <text x="490" y="305" text-anchor="middle" fill="#88ffbb" font-size="14" font-weight="bold">a − b</text>
  <text x="490" y="325" text-anchor="middle" fill="#66cc99" font-size="12">= EML(ln a, exp b)</text>
  
  <!-- addition -->
  <rect x="590" y="280" width="160" height="60" rx="10" fill="#1a3355" stroke="#44cc88" stroke-width="1.5"/>
  <text x="670" y="305" text-anchor="middle" fill="#88ffbb" font-size="14" font-weight="bold">a + b</text>
  <text x="670" y="325" text-anchor="middle" fill="#66cc99" font-size="12">= EML(ln a, exp(−b))</text>
  
  <!-- multiplication -->
  <rect x="140" y="370" width="180" height="60" rx="10" fill="#1a3355" stroke="#ff9944" stroke-width="1.5"/>
  <text x="230" y="395" text-anchor="middle" fill="#ffbb66" font-size="14" font-weight="bold">a × b</text>
  <text x="230" y="415" text-anchor="middle" fill="#cc8833" font-size="12">= EML(ln a + ln b, 1)</text>
  
  <!-- division -->
  <rect x="350" y="370" width="180" height="60" rx="10" fill="#1a3355" stroke="#ff9944" stroke-width="1.5"/>
  <text x="440" y="395" text-anchor="middle" fill="#ffbb66" font-size="14" font-weight="bold">a ÷ b</text>
  <text x="440" y="415" text-anchor="middle" fill="#cc8833" font-size="12">= EML(ln a − ln b, 1)</text>
  
  <!-- power -->
  <rect x="560" y="370" width="180" height="60" rx="10" fill="#1a3355" stroke="#ff4488" stroke-width="1.5"/>
  <text x="650" y="395" text-anchor="middle" fill="#ff88bb" font-size="14" font-weight="bold">aᵇ</text>
  <text x="650" y="415" text-anchor="middle" fill="#cc4477" font-size="12">= EML(b · ln a, 1)</text>
  
  <!-- Connection lines -->
  <line x1="450" y1="220" x2="130" y2="278" stroke="#334466" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="220" x2="310" y2="278" stroke="#334466" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="220" x2="490" y2="278" stroke="#334466" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="220" x2="670" y2="278" stroke="#334466" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="220" x2="230" y2="368" stroke="#334466" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="220" x2="440" y2="368" stroke="#334466" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="220" x2="650" y2="368" stroke="#334466" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Stack Machine -->
  <rect x="50" y="470" width="250" height="150" rx="10" fill="#1a2244" stroke="#4466aa" stroke-width="1.5"/>
  <text x="175" y="495" text-anchor="middle" fill="#88aadd" font-size="16" font-weight="bold">Stack Machine</text>
  
  <!-- Stack visualization -->
  <rect x="80" y="510" width="80" height="25" rx="3" fill="#2a3366" stroke="#5577bb"/>
  <text x="120" y="528" text-anchor="middle" fill="#aaccff" font-size="11">PUSH a</text>
  <rect x="80" y="540" width="80" height="25" rx="3" fill="#2a3366" stroke="#5577bb"/>
  <text x="120" y="558" text-anchor="middle" fill="#aaccff" font-size="11">PUSH b</text>
  <rect x="80" y="570" width="80" height="25" rx="3" fill="#2a4466" stroke="#44aa88"/>
  <text x="120" y="588" text-anchor="middle" fill="#88ffcc" font-size="11">EML</text>
  
  <text x="200" y="535" fill="#6688aa" font-size="11">→ [a]</text>
  <text x="200" y="560" fill="#6688aa" font-size="11">→ [b, a]</text>
  <text x="200" y="590" fill="#88ccaa" font-size="11">→ [eᵃ−ln(b)]</text>
  
  <!-- Key Properties Box -->
  <rect x="340" y="470" width="250" height="150" rx="10" fill="#1a2244" stroke="#cc8844" stroke-width="1.5"/>
  <text x="465" y="495" text-anchor="middle" fill="#ffcc88" font-size="16" font-weight="bold">Key Properties</text>
  <text x="360" y="520" fill="#bbaa88" font-size="12">• Arithmetically complete</text>
  <text x="360" y="540" fill="#bbaa88" font-size="12">• Non-commutative</text>
  <text x="360" y="560" fill="#bbaa88" font-size="12">• Non-associative</text>
  <text x="360" y="580" fill="#bbaa88" font-size="12">• No fixed points (diagonal)</text>
  <text x="360" y="600" fill="#bbaa88" font-size="12">• Strictly convex diagonal</text>
  
  <!-- Formal Verification Badge -->
  <rect x="630" y="470" width="220" height="150" rx="10" fill="#1a3322" stroke="#44cc66" stroke-width="1.5"/>
  <text x="740" y="495" text-anchor="middle" fill="#88ff99" font-size="16" font-weight="bold">✓ Verified in Lean 4</text>
  <text x="650" y="520" fill="#88cc99" font-size="12">• 170+ machine-checked theorems</text>
  <text x="650" y="540" fill="#88cc99" font-size="12">• Arithmetic completeness</text>
  <text x="650" y="560" fill="#88cc99" font-size="12">• No fixed points proof</text>
  <text x="650" y="580" fill="#88cc99" font-size="12">• Strict convexity proof</text>
  <text x="650" y="600" fill="#88cc99" font-size="12">• Irrationality of eml(1,1)</text>
</svg>
