<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="800" height="480" fill="#fafafa"/>
  
  <text x="400" y="30" text-anchor="middle" fill="#222" font-size="20" font-weight="bold">
    EML Expression Tree: Computing exp(x) − ln(y)
  </text>
  
  <!-- Tree 1: exp(x) = EML(x, 1), depth 1 -->
  <text x="150" y="75" text-anchor="middle" fill="#444" font-size="14" font-weight="bold">exp(x) at Depth 1</text>
  
  <circle cx="150" cy="120" r="22" fill="#4488ff" stroke="#2255aa" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" fill="white" font-size="12" font-weight="bold">EML</text>
  
  <line x1="135" y1="140" x2="110" y2="175" stroke="#666" stroke-width="1.5"/>
  <line x1="165" y1="140" x2="190" y2="175" stroke="#666" stroke-width="1.5"/>
  
  <circle cx="110" cy="190" r="18" fill="#ff9944" stroke="#cc7733" stroke-width="1.5"/>
  <text x="110" y="195" text-anchor="middle" fill="white" font-size="12" font-weight="bold">x</text>
  
  <circle cx="190" cy="190" r="18" fill="#44cc88" stroke="#228855" stroke-width="1.5"/>
  <text x="190" y="195" text-anchor="middle" fill="white" font-size="12" font-weight="bold">1</text>
  
  <text x="150" y="240" text-anchor="middle" fill="#666" font-size="11">= eˣ − ln(1) = eˣ</text>
  
  <!-- Tree 2: ln(b) = EML(0, exp(EML(0, b))), depth 3 -->
  <text x="440" y="75" text-anchor="middle" fill="#444" font-size="14" font-weight="bold">ln(b) at Depth 3</text>
  
  <!-- Root -->
  <circle cx="440" cy="110" r="22" fill="#4488ff" stroke="#2255aa" stroke-width="2"/>
  <text x="440" y="115" text-anchor="middle" fill="white" font-size="11" font-weight="bold">EML</text>
  
  <line x1="425" y1="130" x2="390" y2="160" stroke="#666" stroke-width="1.5"/>
  <line x1="455" y1="130" x2="500" y2="160" stroke="#666" stroke-width="1.5"/>
  
  <circle cx="390" cy="175" r="16" fill="#44cc88" stroke="#228855" stroke-width="1.5"/>
  <text x="390" y="180" text-anchor="middle" fill="white" font-size="11" font-weight="bold">0</text>
  
  <!-- exp node -->
  <circle cx="500" cy="175" r="22" fill="#4488ff" stroke="#2255aa" stroke-width="2"/>
  <text x="500" y="180" text-anchor="middle" fill="white" font-size="11" font-weight="bold">EML</text>
  
  <line x1="485" y1="195" x2="455" y2="225" stroke="#666" stroke-width="1.5"/>
  <line x1="515" y1="195" x2="545" y2="225" stroke="#666" stroke-width="1.5"/>
  
  <!-- Inner EML(0, b) -->
  <circle cx="455" cy="240" r="22" fill="#4488ff" stroke="#2255aa" stroke-width="2"/>
  <text x="455" y="245" text-anchor="middle" fill="white" font-size="11" font-weight="bold">EML</text>
  
  <circle cx="545" cy="240" r="16" fill="#44cc88" stroke="#228855" stroke-width="1.5"/>
  <text x="545" y="245" text-anchor="middle" fill="white" font-size="11" font-weight="bold">1</text>
  
  <line x1="440" y1="260" x2="415" y2="290" stroke="#666" stroke-width="1.5"/>
  <line x1="470" y1="260" x2="495" y2="290" stroke="#666" stroke-width="1.5"/>
  
  <circle cx="415" cy="305" r="16" fill="#44cc88" stroke="#228855" stroke-width="1.5"/>
  <text x="415" y="310" text-anchor="middle" fill="white" font-size="11" font-weight="bold">0</text>
  
  <circle cx="495" cy="305" r="16" fill="#ff9944" stroke="#cc7733" stroke-width="1.5"/>
  <text x="495" y="310" text-anchor="middle" fill="white" font-size="11" font-weight="bold">b</text>
  
  <text x="440" y="350" text-anchor="middle" fill="#666" font-size="10">= EML(0, exp(EML(0, b)))</text>
  <text x="440" y="365" text-anchor="middle" fill="#666" font-size="10">= EML(0, exp(1 − ln(b)))</text>
  <text x="440" y="380" text-anchor="middle" fill="#666" font-size="10">= 1 − ln(e/b) = ln(b)</text>
  
  <!-- Tree 3: a − b, depth 5 -->
  <text x="700" y="75" text-anchor="middle" fill="#444" font-size="14" font-weight="bold">a − b (sketch)</text>
  
  <circle cx="700" cy="115" r="22" fill="#4488ff" stroke="#2255aa" stroke-width="2"/>
  <text x="700" y="120" text-anchor="middle" fill="white" font-size="11" font-weight="bold">EML</text>
  
  <line x1="685" y1="135" x2="655" y2="160" stroke="#666" stroke-width="1.5"/>
  <line x1="715" y1="135" x2="745" y2="160" stroke="#666" stroke-width="1.5"/>
  
  <rect x="630" y="165" width="50" height="25" rx="5" fill="#eee" stroke="#999"/>
  <text x="655" y="182" text-anchor="middle" fill="#666" font-size="10">ln(a)</text>
  
  <rect x="720" y="165" width="50" height="25" rx="5" fill="#eee" stroke="#999"/>
  <text x="745" y="182" text-anchor="middle" fill="#666" font-size="10">exp(b)</text>
  
  <text x="700" y="220" text-anchor="middle" fill="#666" font-size="10">= exp(ln(a)) − ln(exp(b))</text>
  <text x="700" y="235" text-anchor="middle" fill="#666" font-size="10">= a − b</text>
  
  <!-- Legend -->
  <rect x="50" y="400" width="700" height="60" rx="8" fill="white" stroke="#ddd"/>
  <text x="70" y="420" fill="#222" font-size="12" font-weight="bold">Legend:</text>
  <circle cx="150" cy="430" r="12" fill="#4488ff"/>
  <text x="170" y="435" fill="#444" font-size="11">EML node</text>
  <circle cx="280" cy="430" r="12" fill="#ff9944"/>
  <text x="300" y="435" fill="#444" font-size="11">Variable</text>
  <circle cx="400" cy="430" r="12" fill="#44cc88"/>
  <text x="420" y="435" fill="#444" font-size="11">Constant</text>
  <text x="550" y="435" fill="#888" font-size="11">Leaves = EML nodes + 1 (proven)</text>
</svg>
