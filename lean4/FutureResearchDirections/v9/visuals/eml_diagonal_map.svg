<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f0f0f5"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg3)"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#222" font-size="20" font-weight="bold">
    The Diagonal Map d(x) = eˣ − ln(x)
  </text>
  <text x="400" y="50" text-anchor="middle" fill="#666" font-size="12">
    Strictly convex on (0, ∞) with minimum at x* = W(1) ≈ 0.567
  </text>
  
  <!-- Axes -->
  <line x1="80" y1="420" x2="750" y2="420" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="420" x2="80" y2="70" stroke="#333" stroke-width="1.5"/>
  
  <!-- Axis labels -->
  <text x="400" y="460" text-anchor="middle" fill="#333" font-size="14">x</text>
  <text x="50" y="245" text-anchor="middle" fill="#333" font-size="14" transform="rotate(-90, 50, 245)">d(x)</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="385" x2="750" y2="385" stroke="#ddd" stroke-width="0.5"/>
  <line x1="80" y1="350" x2="750" y2="350" stroke="#ddd" stroke-width="0.5"/>
  <line x1="80" y1="315" x2="750" y2="315" stroke="#ddd" stroke-width="0.5"/>
  <line x1="80" y1="280" x2="750" y2="280" stroke="#ddd" stroke-width="0.5"/>
  <line x1="80" y1="245" x2="750" y2="245" stroke="#ddd" stroke-width="0.5"/>
  <line x1="80" y1="210" x2="750" y2="210" stroke="#ddd" stroke-width="0.5"/>
  
  <!-- Y-axis ticks and labels -->
  <text x="72" y="424" text-anchor="end" fill="#666" font-size="10">0</text>
  <text x="72" y="389" text-anchor="end" fill="#666" font-size="10">1</text>
  <text x="72" y="354" text-anchor="end" fill="#666" font-size="10">2</text>
  <text x="72" y="319" text-anchor="end" fill="#666" font-size="10">3</text>
  <text x="72" y="284" text-anchor="end" fill="#666" font-size="10">4</text>
  <text x="72" y="249" text-anchor="end" fill="#666" font-size="10">5</text>
  <text x="72" y="214" text-anchor="end" fill="#666" font-size="10">6</text>
  
  <!-- X-axis ticks -->
  <text x="80" y="440" text-anchor="middle" fill="#666" font-size="10">0</text>
  <text x="214" y="440" text-anchor="middle" fill="#666" font-size="10">1</text>
  <text x="348" y="440" text-anchor="middle" fill="#666" font-size="10">2</text>
  <text x="482" y="440" text-anchor="middle" fill="#666" font-size="10">3</text>
  <text x="616" y="440" text-anchor="middle" fill="#666" font-size="10">4</text>
  
  <!-- d(x) = 2 line (lower bound) -->
  <line x1="80" y1="350" x2="750" y2="350" stroke="#cc4444" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="755" y="354" fill="#cc4444" font-size="11">d(x) ≥ 2</text>
  
  <!-- y = x line (no fixed points) -->
  <line x1="80" y1="420" x2="616" y2="70" stroke="#4488ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="590" y="100" fill="#4488ff" font-size="11" opacity="0.7">y = x</text>
  
  <!-- The diagonal map curve d(x) = exp(x) - ln(x) -->
  <!-- Approximated with points: -->
  <!-- x=0.1: exp(0.1)-ln(0.1) ≈ 1.105+2.303 = 3.408 -->
  <!-- x=0.2: 1.221+1.609 = 2.830 -->
  <!-- x=0.3: 1.350+1.204 = 2.554 -->
  <!-- x=0.4: 1.492+0.916 = 2.408 -->
  <!-- x=0.5: 1.649+0.693 = 2.342 -->
  <!-- x=0.567: 1.763+0.568 = 2.331 (minimum!) -->
  <!-- x=0.7: 2.014+0.357 = 2.371 -->
  <!-- x=1.0: 2.718+0 = 2.718 -->
  <!-- x=1.5: 4.482-0.405 = 4.077 -->
  <!-- x=2.0: 7.389-0.693 = 6.696 -->
  <!-- x=2.5: 12.18-0.916 = 11.27 → off chart -->
  
  <path d="M 93.4,301 
           Q 100,325 107,340 
           Q 114,348 121,352 
           Q 128,354.5 135,355 
           Q 143,354 156,352 
           Q 170,349 187,344 
           Q 214,332 250,310 
           Q 280,293 310,265 
           Q 348,225 390,170 
           Q 420,130 450,90" 
        fill="none" stroke="#ff4400" stroke-width="3"/>
  
  <!-- Minimum point -->
  <circle cx="156" cy="355" r="6" fill="#ff4400" stroke="white" stroke-width="2"/>
  <line x1="156" y1="355" x2="200" y2="380" stroke="#888" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="205" y="385" fill="#333" font-size="11" font-weight="bold">x* = W(1) ≈ 0.567</text>
  <text x="205" y="400" fill="#666" font-size="10">d(x*) ≈ 2.333</text>
  
  <!-- Labels on curve -->
  <text x="95" y="295" fill="#ff4400" font-size="12" font-weight="bold">d(x) = eˣ − ln(x)</text>
  
  <!-- Key insight box -->
  <rect x="500" y="280" width="250" height="120" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="625" y="300" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Key Properties</text>
  <text x="515" y="320" fill="#444" font-size="11">• d''(x) = eˣ + 1/x² &gt; 0</text>
  <text x="515" y="340" fill="#444" font-size="11">• min d(x) = d(W(1)) ≈ 2.333</text>
  <text x="515" y="360" fill="#444" font-size="11">• d(x) &gt; x for all x &gt; 0</text>
  <text x="515" y="380" fill="#444" font-size="11">• All orbits diverge to +∞</text>
  
  <!-- Verified badge -->
  <rect x="550" y="410" width="150" height="25" rx="12" fill="#eeffee" stroke="#44cc66" stroke-width="1"/>
  <text x="625" y="427" text-anchor="middle" fill="#228844" font-size="11">✓ Proven in Lean 4</text>
</svg>
