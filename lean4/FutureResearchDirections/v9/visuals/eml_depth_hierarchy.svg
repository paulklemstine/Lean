<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#151540"/>
    </linearGradient>
  </defs>
  
  <rect width="850" height="550" fill="url(#bg4)"/>
  
  <text x="425" y="35" text-anchor="middle" fill="#f0c040" font-size="22" font-weight="bold">
    EML Depth Hierarchy
  </text>
  <text x="425" y="55" text-anchor="middle" fill="#8899bb" font-size="12">
    DEPTH(1) ⊊ DEPTH(2) ⊊ DEPTH(3) ⊊ ··· (Conjectured strict)
  </text>
  
  <!-- Nested ellipses for depth levels -->
  <ellipse cx="425" cy="300" rx="380" ry="200" fill="none" stroke="#2244aa" stroke-width="2" opacity="0.4"/>
  <text x="790" y="130" fill="#4466cc" font-size="13">DEPTH(∞)</text>
  
  <ellipse cx="425" cy="300" rx="320" ry="170" fill="none" stroke="#3366cc" stroke-width="2" opacity="0.5"/>
  <text x="730" y="160" fill="#5588dd" font-size="13">DEPTH(4)</text>
  
  <ellipse cx="425" cy="300" rx="260" ry="140" fill="none" stroke="#4488ee" stroke-width="2" opacity="0.6"/>
  <text x="670" y="190" fill="#6699ee" font-size="13">DEPTH(3)</text>
  
  <ellipse cx="425" cy="300" rx="200" ry="110" fill="none" stroke="#55aaff" stroke-width="2" opacity="0.7"/>
  <text x="610" y="220" fill="#77bbff" font-size="13">DEPTH(2)</text>
  
  <ellipse cx="425" cy="300" rx="130" ry="70" fill="none" stroke="#88ccff" stroke-width="2" opacity="0.9"/>
  <text x="545" y="255" fill="#88ccff" font-size="13">DEPTH(1)</text>
  
  <!-- Core: constant 1 -->
  <circle cx="425" cy="300" r="30" fill="#1a2255" stroke="#f0c040" stroke-width="2"/>
  <text x="425" y="305" text-anchor="middle" fill="#f0c040" font-size="16" font-weight="bold">{1}</text>
  
  <!-- Sample values at each depth -->
  <!-- Depth 1 -->
  <circle cx="370" cy="260" r="5" fill="#88ccff"/>
  <text x="370" y="255" text-anchor="middle" fill="#88ccff" font-size="9">e</text>
  
  <circle cx="480" cy="340" r="5" fill="#88ccff"/>
  <text x="480" y="355" text-anchor="middle" fill="#88ccff" font-size="9">1−0=1</text>
  
  <!-- Depth 2 -->
  <circle cx="310" cy="230" r="5" fill="#77bbff"/>
  <text x="310" y="222" text-anchor="middle" fill="#77bbff" font-size="9">eᵉ</text>
  
  <circle cx="540" cy="250" r="5" fill="#77bbff"/>
  <text x="548" y="242" text-anchor="middle" fill="#77bbff" font-size="9">0</text>
  
  <!-- Depth 3 -->
  <circle cx="250" cy="200" r="5" fill="#6699ee"/>
  <text x="250" y="192" text-anchor="middle" fill="#6699ee" font-size="9">e^(eᵉ)</text>
  
  <circle cx="580" cy="210" r="5" fill="#6699ee"/>
  <text x="595" y="210" text-anchor="middle" fill="#6699ee" font-size="9">ln(x)</text>
  
  <!-- Separation witnesses -->
  <rect x="50" y="430" width="350" height="100" rx="8" fill="#0d0d22" stroke="#334466" stroke-width="1"/>
  <text x="225" y="455" text-anchor="middle" fill="#f0c040" font-size="14" font-weight="bold">Separation Witnesses</text>
  <text x="65" y="475" fill="#88bbff" font-size="11">DEPTH(2)\DEPTH(1): exp(exp(x)) ≠ exp(ax+b)</text>
  <text x="65" y="495" fill="#6699ee" font-size="11">DEPTH(3)\DEPTH(2): exp(exp(exp(x)))</text>
  <text x="65" y="515" fill="#5588dd" font-size="11">DEPTH(d+1)\DEPTH(d): exp^{(d+1)}(x) [Conj.]</text>
  
  <!-- Growth rates -->
  <rect x="450" y="430" width="350" height="100" rx="8" fill="#0d0d22" stroke="#334466" stroke-width="1"/>
  <text x="625" y="455" text-anchor="middle" fill="#f0c040" font-size="14" font-weight="bold">Growth Rate Argument</text>
  <text x="465" y="475" fill="#88ccaa" font-size="11">DEPTH(d) functions grow ≤ exp^{(d)}(O(x))</text>
  <text x="465" y="495" fill="#88ccaa" font-size="11">exp^{(d+1)}(x) grows strictly faster</text>
  <text x="465" y="515" fill="#44cc66" font-size="11">✓ d=1 case proven in Lean 4</text>
</svg>
