<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="classicalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#ff8800"/>
    </linearGradient>
    <linearGradient id="quantumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4488ff"/>
      <stop offset="100%" style="stop-color:#44ffaa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg5)"/>

  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">
    Quantum Gravitational Factoring: Grover Speedup Analysis
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#888" font-size="12">
    Classical O(√N/k²) vs. Quantum O(N^(1/4)/k) search complexity
  </text>

  <!-- Chart -->
  <g transform="translate(100, 80)">
    <!-- Axes -->
    <line x1="0" y1="350" x2="600" y2="350" stroke="#555" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="350" stroke="#555" stroke-width="2"/>

    <text x="300" y="385" text-anchor="middle" fill="#aaa" font-size="13">log₂(N) — Key size (bits)</text>
    <text x="-50" y="175" text-anchor="middle" fill="#aaa" font-size="13" transform="rotate(-90, -50, 175)">
      log₂(Operations)
    </text>

    <!-- X-axis ticks -->
    <g fill="#888" font-size="10">
      <text x="0" y="365" text-anchor="middle">0</text>
      <text x="75" y="365" text-anchor="middle">256</text>
      <text x="150" y="365" text-anchor="middle">512</text>
      <text x="225" y="365" text-anchor="middle">1024</text>
      <text x="300" y="365" text-anchor="middle">2048</text>
      <text x="375" y="365" text-anchor="middle">4096</text>
      <text x="450" y="365" text-anchor="middle">8192</text>
      <text x="525" y="365" text-anchor="middle">16384</text>
    </g>

    <!-- Grid -->
    <g stroke="#1a1a2e" stroke-width="1">
      <line x1="0" y1="280" x2="600" y2="280"/>
      <line x1="0" y1="210" x2="600" y2="210"/>
      <line x1="0" y1="140" x2="600" y2="140"/>
      <line x1="0" y1="70" x2="600" y2="70"/>
    </g>

    <!-- Classical curve: √N ~ 2^(n/2) → log = n/2, scaled -->
    <path d="M 0,350 L 75,326 L 150,303 L 225,280 L 300,257 L 375,233 L 450,210 L 525,187 L 600,163"
          fill="none" stroke="url(#classicalGrad)" stroke-width="3"/>

    <!-- Quantum curve: N^(1/4) ~ 2^(n/4), scaled -->
    <path d="M 0,350 L 75,338 L 150,326 L 225,315 L 300,303 L 375,291 L 450,280 L 525,268 L 600,257"
          fill="none" stroke="url(#quantumGrad)" stroke-width="3"/>

    <!-- Shor's algorithm (polynomial) -->
    <path d="M 0,350 L 75,347 L 150,344 L 225,341 L 300,338 L 375,335 L 450,332 L 525,329 L 600,326"
          fill="none" stroke="#44ff44" stroke-width="2" stroke-dasharray="5,3"/>

    <!-- Gap annotation -->
    <line x1="450" y1="210" x2="450" y2="280" stroke="#ffd700" stroke-width="2" marker-start="url(#arrowUp)" marker-end="url(#arrowDown)"/>
    <defs>
      <marker id="arrowUp" markerWidth="6" markerHeight="6" refX="3" refY="6" orient="auto">
        <polygon points="0 6, 3 0, 6 6" fill="#ffd700"/>
      </marker>
      <marker id="arrowDown" markerWidth="6" markerHeight="6" refX="3" refY="0" orient="auto">
        <polygon points="0 0, 3 6, 6 0" fill="#ffd700"/>
      </marker>
    </defs>
    <text x="470" y="248" fill="#ffd700" font-size="11" font-weight="bold">Quantum</text>
    <text x="470" y="262" fill="#ffd700" font-size="11" font-weight="bold">speedup</text>

    <!-- Labels -->
    <text x="610" y="167" fill="#ff8800" font-size="12" font-weight="bold">Classical: O(√N / k²)</text>
    <text x="610" y="261" fill="#44ddaa" font-size="12" font-weight="bold">Quantum: O(N^¼ / k)</text>
    <text x="610" y="330" fill="#44ff44" font-size="11">Shor's: O((log N)³)</text>
  </g>

  <!-- Info box -->
  <g transform="translate(100, 440)">
    <rect x="0" y="0" width="600" height="40" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
    <text x="300" y="15" text-anchor="middle" fill="#ddd" font-size="11">
      Formally verified: √T &lt; T for T &gt; 1 (Grover gives quadratic speedup over brute force)
    </text>
    <text x="300" y="32" text-anchor="middle" fill="#888" font-size="10">
      With k = O(log N) channels, quantum gravitational factoring approaches O(N^(1/4) / log²N)
    </text>
  </g>
</svg>
