<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg3)"/>

  <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">
    Cayley-Dickson Hierarchy &amp; the Hurwitz Barrier
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#718096" font-size="12">
    Direction 8: Properties Lost at Each Doubling Step
  </text>

  <!-- The staircase of property loss -->
  <!-- ℝ (dim 1) -->
  <rect x="50" y="100" width="140" height="90" rx="10" fill="#2d3748" stroke="#48bb78" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" fill="#48bb78" font-size="16" font-weight="bold">ℝ</text>
  <text x="120" y="142" text-anchor="middle" fill="#a0aec0" font-size="11">Dimension 1</text>
  <text x="120" y="160" text-anchor="middle" fill="#68d391" font-size="9">✓ Ordered</text>
  <text x="120" y="173" text-anchor="middle" fill="#68d391" font-size="9">✓ Commutative</text>
  <text x="120" y="186" text-anchor="middle" fill="#68d391" font-size="9">✓ Normed</text>

  <!-- Arrow ℝ→ℂ -->
  <line x1="190" y1="145" x2="230" y2="145" stroke="#fc8181" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="210" y="138" text-anchor="middle" fill="#fc8181" font-size="9">lose order</text>
  <defs><marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#fc8181"/>
  </marker></defs>

  <!-- ℂ (dim 2) -->
  <rect x="230" y="100" width="140" height="90" rx="10" fill="#2d3748" stroke="#63b3ed" stroke-width="2"/>
  <text x="300" y="125" text-anchor="middle" fill="#63b3ed" font-size="16" font-weight="bold">ℂ</text>
  <text x="300" y="142" text-anchor="middle" fill="#a0aec0" font-size="11">Dimension 2</text>
  <text x="300" y="160" text-anchor="middle" fill="#fc8181" font-size="9">✗ Ordered</text>
  <text x="300" y="173" text-anchor="middle" fill="#68d391" font-size="9">✓ Commutative</text>
  <text x="300" y="186" text-anchor="middle" fill="#68d391" font-size="9">✓ Normed</text>

  <!-- Arrow ℂ→ℍ -->
  <line x1="370" y1="145" x2="410" y2="145" stroke="#fc8181" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="390" y="138" text-anchor="middle" fill="#fc8181" font-size="8">lose comm.</text>

  <!-- ℍ (dim 4) -->
  <rect x="410" y="100" width="140" height="90" rx="10" fill="#2d3748" stroke="#d69e2e" stroke-width="2"/>
  <text x="480" y="125" text-anchor="middle" fill="#d69e2e" font-size="16" font-weight="bold">ℍ</text>
  <text x="480" y="142" text-anchor="middle" fill="#a0aec0" font-size="11">Dimension 4</text>
  <text x="480" y="160" text-anchor="middle" fill="#fc8181" font-size="9">✗ Commutative</text>
  <text x="480" y="173" text-anchor="middle" fill="#68d391" font-size="9">✓ Associative</text>
  <text x="480" y="186" text-anchor="middle" fill="#68d391" font-size="9">✓ Normed</text>

  <!-- Arrow ℍ→𝕆 -->
  <line x1="550" y1="145" x2="590" y2="145" stroke="#fc8181" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="570" y="138" text-anchor="middle" fill="#fc8181" font-size="8">lose assoc.</text>

  <!-- 𝕆 (dim 8) -->
  <rect x="590" y="100" width="140" height="90" rx="10" fill="#2d3748" stroke="#9f7aea" stroke-width="2"/>
  <text x="660" y="125" text-anchor="middle" fill="#9f7aea" font-size="16" font-weight="bold">𝕆</text>
  <text x="660" y="142" text-anchor="middle" fill="#a0aec0" font-size="11">Dimension 8</text>
  <text x="660" y="160" text-anchor="middle" fill="#fc8181" font-size="9">✗ Associative</text>
  <text x="660" y="173" text-anchor="middle" fill="#68d391" font-size="9">✓ Alternative</text>
  <text x="660" y="186" text-anchor="middle" fill="#68d391" font-size="9">✓ Normed</text>

  <!-- HURWITZ BARRIER -->
  <line x1="750" y1="80" x2="750" y2="210" stroke="#f56565" stroke-width="3" stroke-dasharray="8,4"/>
  <rect x="755" y="120" width="120" height="35" rx="5" fill="#742a2a" stroke="#f56565" stroke-width="1"/>
  <text x="815" y="142" text-anchor="middle" fill="#f56565" font-size="11" font-weight="bold">HURWITZ</text>
  <text x="815" y="152" text-anchor="middle" fill="#f56565" font-size="9">BARRIER</text>

  <!-- Below barrier: 𝕊 (dim 16) -->
  <rect x="200" y="260" width="500" height="110" rx="10" fill="#1a202c" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="450" y="290" text-anchor="middle" fill="#a0aec0" font-size="16" font-weight="bold">
    𝕊 — Sedenions (Dimension 16)
  </text>
  <text x="450" y="315" text-anchor="middle" fill="#fc8181" font-size="12">
    ✗ Norm multiplicativity: N(xy) ≠ N(x)·N(y) in general
  </text>
  <text x="450" y="340" text-anchor="middle" fill="#68d391" font-size="12">
    ✓ Flexible identity: (xy)x = x(yx)
  </text>
  <text x="450" y="360" text-anchor="middle" fill="#68d391" font-size="12">
    ✓ Power-associative: x^m · x^n = x^(m+n)
  </text>

  <!-- Open question box -->
  <rect x="100" y="410" width="700" height="80" rx="10" fill="#2a4365" stroke="#63b3ed" stroke-width="1"/>
  <text x="450" y="435" text-anchor="middle" fill="#63b3ed" font-size="14" font-weight="bold">
    Open Question (Direction 20)
  </text>
  <text x="450" y="458" text-anchor="middle" fill="#e2e8f0" font-size="12">
    Can weaker algebraic identities (flexible, power-associative)
  </text>
  <text x="450" y="478" text-anchor="middle" fill="#e2e8f0" font-size="12">
    still provide useful factoring constraints beyond dimension 8?
  </text>

  <!-- Theorem box -->
  <rect x="100" y="510" width="700" height="60" rx="10" fill="#22543d" stroke="#48bb78" stroke-width="1"/>
  <text x="450" y="535" text-anchor="middle" fill="#48bb78" font-size="13" font-weight="bold">
    Proved in Lean 4: hurwitz_barrier_16 : 16 ∉ {1, 2, 4, 8}
  </text>
  <text x="450" y="558" text-anchor="middle" fill="#c6f6d5" font-size="11">
    hurwitz_dimensions_are_powers_of_two : ∀ n ∈ {1,2,4,8}, ∃ k, n = 2^k ✓
  </text>
</svg>
