  <rect x="350" y="460" width="180" height="55" rx="8" fill="url(#blue)" opacity="0.9"/>
  <text x="440" y="480" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 15: Verified ECM</text>
  <text x="440" y="495" text-anchor="middle" fill="#ddf" font-size="9">Formal ECM in Lean 4</text>
  <text x="440" y="508" text-anchor="middle" fill="#aaf" font-size="8">★★★★ difficulty | ★★★ verification</text>

