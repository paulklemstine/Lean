<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#2244cc"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44dd88"/>
      <stop offset="100%" stop-color="#228866"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aa44ff"/>
      <stop offset="100%" stop-color="#6622cc"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4466"/>
      <stop offset="100%" stop-color="#cc2244"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="url(#gold)" font-size="28" font-weight="bold" filter="url(#glow)">
    MetaFactoring: 25 Research Directions Roadmap
  </text>
  <text x="600" y="75" text-anchor="middle" fill="#8888cc" font-size="14">
    From Near-Term Engineering to Grand Mathematical Challenges
  </text>

  <!-- Timeline axis -->
  <line x1="100" y1="850" x2="1100" y2="850" stroke="#444488" stroke-width="2"/>
  <text x="150" y="880" fill="#8888cc" font-size="12">6 months</text>
  <text x="400" y="880" fill="#8888cc" font-size="12">1-2 years</text>
  <text x="650" y="880" fill="#8888cc" font-size="12">3-5 years</text>
  <text x="950" y="880" fill="#8888cc" font-size="12">10+ years</text>

  <!-- Category labels on left -->
  <text x="20" y="160" fill="url(#green)" font-size="11" font-weight="bold" transform="rotate(-90, 20, 160)">NEAR-TERM</text>
  <text x="20" y="380" fill="url(#blue)" font-size="11" font-weight="bold" transform="rotate(-90, 20, 380)">MEDIUM-TERM</text>
  <text x="20" y="600" fill="url(#purple)" font-size="11" font-weight="bold" transform="rotate(-90, 20, 600)">LONG-TERM</text>
  <text x="20" y="790" fill="url(#red)" font-size="11" font-weight="bold" transform="rotate(-90, 20, 790)">GRAND</text>

  <!-- Near-term (6 months - 1 year) -->
  <!-- Direction 5: Tropical Sieve -->
  <rect x="100" y="100" width="180" height="55" rx="8" fill="url(#green)" opacity="0.9"/>
  <text x="190" y="120" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 5: Tropical Sieve</text>
  <text x="190" y="135" text-anchor="middle" fill="#ddf" font-size="9">p-adic factoring sieve</text>
  <text x="190" y="148" text-anchor="middle" fill="#aaf" font-size="8">★★ difficulty | ★★★★ verification</text>

  <!-- Direction 7: Pisano-Spectral -->
  <rect x="300" y="100" width="180" height="55" rx="8" fill="url(#green)" opacity="0.9"/>
  <text x="390" y="120" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 7: Pisano-Spectral</text>
  <text x="390" y="135" text-anchor="middle" fill="#ddf" font-size="9">Fibonacci ↔ spectral bridge</text>
  <text x="390" y="148" text-anchor="middle" fill="#aaf" font-size="8">★★ difficulty | ★★★★ verification</text>

  <!-- Direction 13: Category Formalization -->
  <rect x="100" y="170" width="180" height="55" rx="8" fill="url(#green)" opacity="0.9"/>
  <text x="190" y="190" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 13: Lens Category</text>
  <text x="190" y="205" text-anchor="middle" fill="#ddf" font-size="9">Symmetric monoidal category</text>
  <text x="190" y="218" text-anchor="middle" fill="#aaf" font-size="8">★★ difficulty | ★★★★★ verification</text>

  <!-- Direction 8: Sedenion -->
  <rect x="300" y="170" width="180" height="55" rx="8" fill="url(#green)" opacity="0.9"/>
  <text x="390" y="190" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 8: Sedenion Identities</text>
  <text x="390" y="205" text-anchor="middle" fill="#ddf" font-size="9">Weak algebraic identities</text>
  <text x="390" y="218" text-anchor="middle" fill="#aaf" font-size="8">★★ difficulty | ★★★★ verification</text>

  <!-- Direction 16: Correlation Study -->
  <rect x="100" y="240" width="180" height="55" rx="8" fill="url(#green)" opacity="0.9"/>
  <text x="190" y="260" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 16: Correlation Study</text>
  <text x="190" y="275" text-anchor="middle" fill="#ddf" font-size="9">36 pairwise lens correlations</text>
  <text x="190" y="288" text-anchor="middle" fill="#aaf" font-size="8">★★ difficulty | computational</text>

  <!-- Medium-term (1-3 years) -->
  <!-- Direction 6: Quaternion Algorithm -->
  <rect x="350" y="320" width="180" height="55" rx="8" fill="url(#blue)" opacity="0.9"/>
  <text x="440" y="340" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 6: Quaternion Factor</text>
  <text x="440" y="355" text-anchor="middle" fill="#ddf" font-size="9">Skew-symmetric forms</text>
  <text x="440" y="368" text-anchor="middle" fill="#aaf" font-size="8">★★★ difficulty | ★★★ verification</text>

  <!-- Direction 9: Quantum Hybrid -->
  <rect x="550" y="320" width="180" height="55" rx="8" fill="url(#blue)" opacity="0.9"/>
  <text x="640" y="340" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 9: Quantum Hybrid</text>
  <text x="640" y="355" text-anchor="middle" fill="#ddf" font-size="9">Classical + Grover speedup</text>
  <text x="640" y="368" text-anchor="middle" fill="#aaf" font-size="8">★★★ difficulty | ★★★ verification</text>

  <!-- Direction 11: DLP Adaptation -->
  <rect x="350" y="390" width="180" height="55" rx="8" fill="url(#blue)" opacity="0.9"/>
  <text x="440" y="410" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 11: DLP Lenses</text>
  <text x="440" y="425" text-anchor="middle" fill="#ddf" font-size="9">Discrete log multi-lens</text>
  <text x="440" y="438" text-anchor="middle" fill="#aaf" font-size="8">★★★ difficulty | ★★★ verification</text>

  <!-- Direction 12: Graph Isomorphism -->
  <rect x="550" y="390" width="180" height="55" rx="8" fill="url(#blue)" opacity="0.9"/>
  <text x="640" y="410" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 12: Graph Iso Lenses</text>
  <text x="640" y="425" text-anchor="middle" fill="#ddf" font-size="9">Multi-lens for GI</text>
  <text x="640" y="438" text-anchor="middle" fill="#aaf" font-size="8">★★★ difficulty | ★★★ verification</text>

