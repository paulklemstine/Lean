<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bgR)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">
    Gravitational Factoring: Research Roadmap
  </text>

  <!-- Timeline axis -->
  <line x1="80" y1="80" x2="80" y2="650" stroke="#444" stroke-width="2"/>
  <g fill="#888" font-size="12">
    <text x="60" y="100" text-anchor="end">Now</text>
    <text x="60" y="200" text-anchor="end">3 mo</text>
    <text x="60" y="300" text-anchor="end">6 mo</text>
    <text x="60" y="400" text-anchor="end">12 mo</text>
    <text x="60" y="500" text-anchor="end">24 mo</text>
    <text x="60" y="600" text-anchor="end">5+ yr</text>
  </g>

  <!-- Tier labels -->
  <g font-size="14" font-weight="bold">
    <text x="250" y="70" text-anchor="middle" fill="#4a4">Foundations</text>
    <text x="450" y="70" text-anchor="middle" fill="#48f">Algorithms</text>
    <text x="650" y="70" text-anchor="middle" fill="#f64">Theory</text>
    <text x="850" y="70" text-anchor="middle" fill="#fc4">Applications</text>
  </g>

  <!-- Column dividers -->
  <g stroke="#222" stroke-width="1" stroke-dasharray="4,4">
    <line x1="150" y1="80" x2="150" y2="650"/>
    <line x1="350" y1="80" x2="350" y2="650"/>
    <line x1="550" y1="80" x2="550" y2="650"/>
    <line x1="750" y1="80" x2="750" y2="650"/>
  </g>

  <!-- Foundations column -->
  <g>
    <!-- Density verification -->
    <rect x="160" y="100" width="180" height="35" rx="6" fill="#1a3a1a" stroke="#4a4" stroke-width="1.5"/>
    <text x="250" y="122" text-anchor="middle" fill="#8f8" font-size="11">Density verification ✓</text>

    <!-- Lagrange 4-square -->
    <rect x="160" y="145" width="180" height="35" rx="6" fill="#1a3a1a" stroke="#4a4" stroke-width="1.5"/>
    <text x="250" y="167" text-anchor="middle" fill="#8f8" font-size="11">Lagrange 4-square ✓</text>

    <!-- Congruence of squares -->
    <rect x="160" y="190" width="180" height="35" rx="6" fill="#1a3a1a" stroke="#4a4" stroke-width="1.5"/>
    <text x="250" y="212" text-anchor="middle" fill="#8f8" font-size="11">Congruence of squares ✓</text>

    <!-- Cross-collision theory -->
    <rect x="160" y="240" width="180" height="35" rx="6" fill="#2a4a2a" stroke="#6a6" stroke-width="1.5"/>
    <text x="250" y="262" text-anchor="middle" fill="#afa" font-size="11">Cross-collision bounds</text>

    <!-- Jacobi r4 -->
    <rect x="160" y="310" width="180" height="35" rx="6" fill="#2a4a2a" stroke="#6a6" stroke-width="1.5"/>
    <text x="250" y="332" text-anchor="middle" fill="#afa" font-size="11">Jacobi r₄ formalization</text>

    <!-- Hurwitz ring -->
    <rect x="160" y="370" width="180" height="35" rx="6" fill="#2a4a2a" stroke="#6a6" stroke-width="1.5"/>
    <text x="250" y="392" text-anchor="middle" fill="#afa" font-size="11">Hurwitz ring Euclidean alg</text>

    <!-- LLL formalization -->
    <rect x="160" y="450" width="180" height="35" rx="6" fill="#3a3a2a" stroke="#aa6" stroke-width="1.5"/>
    <text x="250" y="472" text-anchor="middle" fill="#dd8" font-size="11">LLL formalization</text>
  </g>

  <!-- Algorithms column -->
  <g>
    <!-- Smoothness bound -->
    <rect x="360" y="120" width="180" height="35" rx="6" fill="#1a2a3a" stroke="#48f" stroke-width="1.5"/>
    <text x="450" y="142" text-anchor="middle" fill="#8af" font-size="11">Optimal smoothness B*(N)</text>

    <!-- GPU search -->
    <rect x="360" y="170" width="180" height="35" rx="6" fill="#1a2a3a" stroke="#48f" stroke-width="1.5"/>
    <text x="450" y="192" text-anchor="middle" fill="#8af" font-size="11">GPU k-tuple search</text>

    <!-- Lattice hybrid -->
    <rect x="360" y="260" width="180" height="45" rx="6" fill="#1a2a4a" stroke="#4af" stroke-width="2"/>
    <text x="450" y="278" text-anchor="middle" fill="#8cf" font-size="12" font-weight="bold">Lattice-GCD hybrid</text>
    <text x="450" y="295" text-anchor="middle" fill="#6af" font-size="10">★ Critical path</text>

    <!-- ML navigator -->
    <rect x="360" y="380" width="180" height="35" rx="6" fill="#2a2a3a" stroke="#66f" stroke-width="1.5"/>
    <text x="450" y="402" text-anchor="middle" fill="#aaf" font-size="11">ML tree navigator</text>

    <!-- Quantum circuit -->
    <rect x="360" y="440" width="180" height="35" rx="6" fill="#2a2a3a" stroke="#66f" stroke-width="1.5"/>
    <text x="450" y="462" text-anchor="middle" fill="#aaf" font-size="11">Quantum circuit design</text>
  </g>

  <!-- Theory column -->
  <g>
    <!-- Sieve complexity -->
    <rect x="560" y="220" width="180" height="45" rx="6" fill="#3a1a1a" stroke="#f44" stroke-width="2"/>
    <text x="650" y="238" text-anchor="middle" fill="#faa" font-size="12" font-weight="bold">Sieve complexity</text>
    <text x="650" y="255" text-anchor="middle" fill="#f88" font-size="10">★ Central question</text>

    <!-- Morse theory -->
    <rect x="560" y="330" width="180" height="35" rx="6" fill="#3a1a1a" stroke="#f64" stroke-width="1.5"/>
    <text x="650" y="352" text-anchor="middle" fill="#fa8" font-size="11">Energy landscape topology</text>

    <!-- Tropical geometry -->
    <rect x="560" y="400" width="180" height="35" rx="6" fill="#3a2a1a" stroke="#f84" stroke-width="1.5"/>
    <text x="650" y="422" text-anchor="middle" fill="#fc8" font-size="11">Tropical geometry</text>

    <!-- Arithmetic geometry -->
    <rect x="560" y="470" width="180" height="35" rx="6" fill="#3a2a1a" stroke="#f84" stroke-width="1.5"/>
    <text x="650" y="492" text-anchor="middle" fill="#fc8" font-size="11">Arithmetic geometry</text>

    <!-- Riemann connection -->
    <rect x="560" y="560" width="180" height="35" rx="6" fill="#4a1a1a" stroke="#f22" stroke-width="1.5"/>
    <text x="650" y="582" text-anchor="middle" fill="#f88" font-size="11">Riemann hypothesis link</text>

    <!-- Complexity class -->
    <rect x="560" y="610" width="180" height="35" rx="6" fill="#4a1a1a" stroke="#f22" stroke-width="1.5"/>
    <text x="650" y="632" text-anchor="middle" fill="#f88" font-size="11">Complexity classification</text>
  </g>

  <!-- Applications column -->
  <g>
    <!-- RSA benchmarking -->
    <rect x="760" y="150" width="180" height="35" rx="6" fill="#3a2a0a" stroke="#fc4" stroke-width="1.5"/>
    <text x="850" y="172" text-anchor="middle" fill="#fe8" font-size="11">RSA benchmarking</text>

    <!-- Sedenion factoring -->
    <rect x="760" y="300" width="180" height="35" rx="6" fill="#3a2a0a" stroke="#fc4" stroke-width="1.5"/>
    <text x="850" y="322" text-anchor="middle" fill="#fe8" font-size="11">Sedenion zero-div factoring</text>

    <!-- Post-quantum -->
    <rect x="760" y="420" width="180" height="35" rx="6" fill="#3a3a0a" stroke="#cc4" stroke-width="1.5"/>
    <text x="850" y="442" text-anchor="middle" fill="#ee8" font-size="11">Post-quantum assessment</text>

    <!-- Crypto impact -->
    <rect x="760" y="540" width="180" height="35" rx="6" fill="#3a3a0a" stroke="#cc4" stroke-width="1.5"/>
    <text x="850" y="562" text-anchor="middle" fill="#ee8" font-size="11">Cryptographic implications</text>
  </g>

  <!-- Dependency arrows -->
  <defs>
    <marker id="arrowR" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  <g stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrowR)">
    <line x1="250" y1="275" x2="360" y2="275"/>
    <line x1="450" y1="305" x2="560" y2="235"/>
    <line x1="250" y1="345" x2="560" y2="345"/>
    <line x1="650" y1="265" x2="760" y2="310"/>
  </g>
</svg>
