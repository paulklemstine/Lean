  <!-- Direction 1: Algebraic Geometry -->
  <rect x="650" y="540" width="190" height="55" rx="8" fill="url(#purple)" opacity="0.9"/>
  <text x="745" y="560" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 1: Algebraic Geometry</text>
  <text x="745" y="575" text-anchor="middle" fill="#ddf" font-size="9">Genus ≥ 2 factoring lens</text>
  <text x="745" y="588" text-anchor="middle" fill="#aaf" font-size="8">★★★★ difficulty | ★★ verification</text>

  <!-- Direction 10: LWE Connection -->
  <rect x="850" y="540" width="190" height="55" rx="8" fill="url(#purple)" opacity="0.9"/>
  <text x="945" y="560" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 10: LWE Connection</text>
  <text x="945" y="575" text-anchor="middle" fill="#ddf" font-size="9">Post-quantum bridge</text>
  <text x="945" y="588" text-anchor="middle" fill="#aaf" font-size="8">★★★★★ difficulty | ★ verification</text>

  <!-- Direction 2: Analytic NT -->
  <rect x="650" y="610" width="190" height="55" rx="8" fill="url(#purple)" opacity="0.9"/>
  <text x="745" y="630" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 2: Analytic NT Lens</text>
  <text x="745" y="645" text-anchor="middle" fill="#ddf" font-size="9">L-function zeros</text>
  <text x="745" y="658" text-anchor="middle" fill="#aaf" font-size="8">★★★★★ difficulty | ★ verification</text>

  <!-- Grand Challenges (10+ years) -->
  <!-- Direction 4: Optimal Independence -->
  <rect x="850" y="720" width="220" height="55" rx="8" fill="url(#red)" opacity="0.9"/>
  <text x="960" y="740" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 4: Optimal Independence</text>
  <text x="960" y="755" text-anchor="middle" fill="#ddf" font-size="9">Max independent lenses = O(log log N)?</text>
  <text x="960" y="768" text-anchor="middle" fill="#aaf" font-size="8">★★★★★ difficulty | CRITICAL impact</text>

  <!-- Direction 25: Universal Theory -->
  <rect x="850" y="790" width="220" height="55" rx="8" fill="url(#red)" opacity="0.9"/>
  <text x="960" y="810" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dir 25: Universal Multi-Lens</text>
  <text x="960" y="825" text-anchor="middle" fill="#ddf" font-size="9">New complexity paradigm</text>
  <text x="960" y="838" text-anchor="middle" fill="#aaf" font-size="8">★★★★★ difficulty | REVOLUTIONARY impact</text>

  <!-- Connecting arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6688aa" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Near-term → Medium-term connections -->
  <line x1="280" y1="227" x2="350" y2="340" stroke="#6688aa" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>
  <line x1="480" y1="227" x2="550" y2="340" stroke="#6688aa" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>
  
  <!-- Medium-term → Long-term connections -->
  <line x1="530" y1="375" x2="650" y2="560" stroke="#6688aa" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>
  <line x1="730" y1="375" x2="850" y2="560" stroke="#6688aa" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>

  <!-- Long-term → Grand connections -->
  <line x1="840" y1="595" x2="850" y2="740" stroke="#6688aa" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="60" y="820" width="12" height="12" rx="2" fill="url(#green)"/>
  <text x="78" y="831" fill="#aaa" font-size="10">Near-term (6mo-1yr)</text>
  <rect x="200" y="820" width="12" height="12" rx="2" fill="url(#blue)"/>
  <text x="218" y="831" fill="#aaa" font-size="10">Medium (1-3yr)</text>
  <rect x="330" y="820" width="12" height="12" rx="2" fill="url(#purple)"/>
  <text x="348" y="831" fill="#aaa" font-size="10">Long-term (3-5yr)</text>
  <rect x="460" y="820" width="12" height="12" rx="2" fill="url(#red)"/>
  <text x="478" y="831" fill="#aaa" font-size="10">Grand Challenge (10+yr)</text>

  <!-- Stats box -->
  <rect x="500" y="100" width="280" height="130" rx="10" fill="#111133" stroke="#4444aa" stroke-width="1" opacity="0.9"/>
  <text x="640" y="125" text-anchor="middle" fill="url(#gold)" font-size="14" font-weight="bold">Formalization Status</text>
  <text x="520" y="148" fill="#8888cc" font-size="12">✓ 40+ theorems proved in Lean 4</text>
  <text x="520" y="168" fill="#8888cc" font-size="12">✓ 15/25 directions formalized</text>
  <text x="520" y="188" fill="#8888cc" font-size="12">✓ Axiom-clean proofs</text>
  <text x="520" y="208" fill="#8888cc" font-size="12">✓ Universal lens theory framework</text>
  <text x="520" y="224" fill="#aaaaff" font-size="10">Built on Lean 4 v4.28 + Mathlib</text>
</svg>
