<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e2e"/>
      <stop offset="100%" style="stop-color:#1a0e2e"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg6)"/>
  
  <text x="400" y="30" fill="#ffffff" font-family="Georgia" font-size="20" text-anchor="middle" font-weight="bold">Multi-Lens Search Space Reduction</text>
  <text x="400" y="50" fill="#88aacc" font-family="Georgia" font-size="12" text-anchor="middle">Starting from 2^1024 candidates for RSA-2048 factors</text>
  
  <!-- Starting bar -->
  <rect x="60" y="75" width="680" height="30" rx="4" fill="#ff4444" opacity="0.3" stroke="#ff4444"/>
  <text x="400" y="95" fill="#ffffff" font-family="monospace" font-size="12" text-anchor="middle">Full search space: 2^1024 ≈ 10^308 candidates</text>
  
  <!-- After Fibonacci -->
  <rect x="60" y="120" width="476" height="28" rx="4" fill="#00ff88" opacity="0.2" stroke="#00ff88"/>
  <text x="298" y="139" fill="#00ff88" font-family="monospace" font-size="11" text-anchor="middle">After Fibonacci lens: 2^711 (30% reduction per bit)</text>
  <text x="550" y="139" fill="#88ffaa" font-family="monospace" font-size="10">-313 bits</text>
  
  <!-- After parity -->
  <rect x="60" y="158" width="469" height="28" rx="4" fill="#44aaff" opacity="0.2" stroke="#44aaff"/>
  <text x="294" y="177" fill="#44aaff" font-family="monospace" font-size="11" text-anchor="middle">+ Parity lens (p odd): 2^710</text>
  <text x="543" y="177" fill="#88ccff" font-family="monospace" font-size="10">-1 bit</text>
  
  <!-- After mod 3 -->
  <rect x="60" y="196" width="462" height="28" rx="4" fill="#8866ff" opacity="0.2" stroke="#8866ff"/>
  <text x="291" y="215" fill="#8866ff" font-family="monospace" font-size="11" text-anchor="middle">+ Mod 3 lens: 2^709</text>
  <text x="536" y="215" fill="#aa88ff" font-family="monospace" font-size="10">-1 bit</text>
  
  <!-- After 9 lenses -->
  <rect x="60" y="244" width="430" height="30" rx="4" fill="#ffaa33" opacity="0.3" stroke="#ffaa33" stroke-width="2"/>
  <text x="275" y="264" fill="#ffaa33" font-family="monospace" font-size="12" text-anchor="middle">After all 9 CRT lenses: 2^702</text>
  <text x="504" y="264" fill="#ffcc44" font-family="monospace" font-size="10">-9 bits total</text>
  
  <!-- After tropical constraints -->
  <rect x="60" y="286" width="420" height="28" rx="4" fill="#ff66ff" opacity="0.2" stroke="#ff66ff"/>
  <text x="270" y="305" fill="#ff66ff" font-family="monospace" font-size="11" text-anchor="middle">+ Tropical lens (v_ℓ constraints): 2^~700</text>
  <text x="494" y="305" fill="#ff88ff" font-family="monospace" font-size="10">-~2 bits</text>
  
  <!-- After hyperbolic -->
  <rect x="60" y="324" width="410" height="28" rx="4" fill="#ff6644" opacity="0.2" stroke="#ff6644"/>
  <text x="265" y="343" fill="#ff6644" font-family="monospace" font-size="11" text-anchor="middle">+ Hyperbolic lens (d ≤ √N): 2^512</text>
  <text x="484" y="343" fill="#ff8866" font-family="monospace" font-size="10">-188 bits</text>
  
  <!-- Final reduced space -->
  <rect x="60" y="372" width="340" height="35" rx="6" fill="#00ff88" opacity="0.15" stroke="#00ff88" stroke-width="2"/>
  <text x="230" y="395" fill="#00ff88" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Combined: 2^~503 candidates</text>
  
  <!-- Comparison arrow -->
  <line x1="400" y1="90" x2="400" y2="375" stroke="#ffcc44" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="420" y="90" fill="#ffcc44" font-family="monospace" font-size="9">reduction</text>
  <text x="420" y="380" fill="#ffcc44" font-family="monospace" font-size="9">≈ 2^521 times smaller</text>
  
  <!-- Bottom stats -->
  <rect x="40" y="420" width="720" height="65" rx="8" fill="#0a0a1e" stroke="#334466"/>
  <text x="400" y="445" fill="#ffffff" font-family="Georgia" font-size="14" text-anchor="middle" font-weight="bold">Security Assessment (Machine-Verified)</text>
  <text x="200" y="470" fill="#00ff88" font-family="monospace" font-size="11" text-anchor="middle">2^503 ≫ 10^150</text>
  <text x="400" y="470" fill="#ffcc44" font-family="monospace" font-size="11" text-anchor="middle">RSA-2048: STILL SECURE</text>
  <text x="600" y="470" fill="#ff6644" font-family="monospace" font-size="11" text-anchor="middle">Speedup: polynomial only</text>
</svg>
