  <text x="500" y="625" text-anchor="middle" fill="#3377cc" font-family="monospace" font-size="9">Sheffer expression encoding</text>
  <text x="500" y="640" text-anchor="middle" fill="#225599" font-family="monospace" font-size="9">100 params ≈ complex signal</text>

