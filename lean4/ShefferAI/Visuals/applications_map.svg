  <rect x="690" y="450" width="180" height="70" rx="10" fill="#220022" fill-opacity="0.6" stroke="#ff44ff" stroke-width="1.5"/>
  <text x="780" y="475" text-anchor="middle" fill="#ff66ff" font-family="Georgia, serif" font-size="13" font-weight="bold">🔐 Cryptography</text>
  <text x="780" y="495" text-anchor="middle" fill="#cc33cc" font-family="monospace" font-size="9">One-way Sheffer decomp</text>
  <text x="780" y="510" text-anchor="middle" fill="#992299" font-family="monospace" font-size="9">Sheffer hash functions</text>

