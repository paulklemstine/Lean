  <line x1="500" y1="440" x2="500" y2="580" stroke="#4488ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="410" y="580" width="180" height="70" rx="10" fill="#001133" fill-opacity="0.6" stroke="#4488ff" stroke-width="1.5"/>
