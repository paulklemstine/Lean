  <rect x="130" y="450" width="180" height="70" rx="10" fill="#112200" fill-opacity="0.6" stroke="#88ff44" stroke-width="1.5"/>
  <text x="220" y="475" text-anchor="middle" fill="#aaff66" font-family="Georgia, serif" font-size="13" font-weight="bold">💊 Drug Design</text>
  <text x="220" y="495" text-anchor="middle" fill="#66cc33" font-family="monospace" font-size="9">Molecular energy → formula</text>
  <text x="220" y="510" text-anchor="middle" fill="#449922" font-family="monospace" font-size="9">Interpretable potentials</text>

  <!-- Physics Simulation -->
  <line x1="430" y1="370" x2="220" y2="330" stroke="#ff8844" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="130" y="280" width="180" height="70" rx="10" fill="#221100" fill-opacity="0.6" stroke="#ff8844" stroke-width="1.5"/>
  <text x="220" y="305" text-anchor="middle" fill="#ffaa66" font-family="Georgia, serif" font-size="13" font-weight="bold">🌊 Physics Simulation</text>
  <text x="220" y="325" text-anchor="middle" fill="#cc7733" font-family="monospace" font-size="9">Smooth contact dynamics</text>
  <text x="220" y="340" text-anchor="middle" fill="#995522" font-family="monospace" font-size="9">Differentiable simulators</text>

  <!-- Mathematics -->
  <line x1="435" y1="320" x2="220" y2="160" stroke="#44ccff" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="130" y="100" width="180" height="70" rx="10" fill="#001122" fill-opacity="0.6" stroke="#44ccff" stroke-width="1.5"/>
  <text x="220" y="125" text-anchor="middle" fill="#66ddff" font-family="Georgia, serif" font-size="13" font-weight="bold">📐 Pure Mathematics</text>
  <text x="220" y="145" text-anchor="middle" fill="#33aacc" font-family="monospace" font-size="9">Sheffer degree theory</text>
  <text x="220" y="160" text-anchor="middle" fill="#228899" font-family="monospace" font-size="9">Formal groups connection</text>

  <!-- Climate -->
  <line x1="435" y1="440" x2="220" y2="620" stroke="#44ffcc" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="130" y="600" width="180" height="60" rx="10" fill="#002211" fill-opacity="0.5" stroke="#44ffcc" stroke-width="1"/>
  <text x="220" y="625" text-anchor="middle" fill="#66ffdd" font-family="Georgia, serif" font-size="12" font-weight="bold">🌍 Climate Modeling</text>
  <text x="220" y="645" text-anchor="middle" fill="#33ccaa" font-family="monospace" font-size="9">Interpretable parameterizations</text>

  <!-- Finance -->
  <line x1="565" y1="440" x2="780" y2="620" stroke="#ffaa44" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="690" y="600" width="180" height="60" rx="10" fill="#221100" fill-opacity="0.5" stroke="#ffaa44" stroke-width="1"/>
  <text x="780" y="625" text-anchor="middle" fill="#ffcc66" font-family="Georgia, serif" font-size="12" font-weight="bold">💰 Finance</text>
  <text x="780" y="645" text-anchor="middle" fill="#ccaa33" font-family="monospace" font-size="9">Interpretable option pricing</text>

  <!-- Bottom tagline -->
  <text x="500" y="720" text-anchor="middle" fill="#aabbcc" font-family="Georgia, serif" font-size="14" font-style="italic">
