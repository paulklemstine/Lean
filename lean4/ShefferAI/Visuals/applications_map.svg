  <text x="780" y="305" text-anchor="middle" fill="#ffdd44" font-family="Georgia, serif" font-size="13" font-weight="bold">⚡ Analog Hardware</text>
  <text x="780" y="325" text-anchor="middle" fill="#ccaa00" font-family="monospace" font-size="9">MOSFET = natural σ(x)</text>
  <text x="780" y="340" text-anchor="middle" fill="#998800" font-family="monospace" font-size="9">Ultra-low power AI</text>

