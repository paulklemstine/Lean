<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1e2a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="url(#bg5)"/>

  <text x="500" y="40" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="bold">
    Sheffer AI: Applications Map
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#8899aa" font-family="Georgia, serif" font-size="13">
    From One Function to All of Science
  </text>

  <!-- Central hub -->
  <circle cx="500" cy="370" r="70" fill="#001144" fill-opacity="0.8" stroke="#0088ff" stroke-width="3" filter="url(#glow5)"/>
  <text x="500" y="360" text-anchor="middle" fill="#00bbff" font-family="Georgia, serif" font-size="15" font-weight="bold">σ(x)</text>
  <text x="500" y="380" text-anchor="middle" fill="#0088cc" font-family="monospace" font-size="10">log(1+eˣ)</text>
  <text x="500" y="398" text-anchor="middle" fill="#006699" font-family="Georgia, serif" font-size="9">Sheffer Function</text>

  <!-- Application nodes arranged in a circle -->
  <!-- AI/ML -->
  <line x1="500" y1="300" x2="500" y2="160" stroke="#ff6644" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="410" y="90" width="180" height="70" rx="10" fill="#331100" fill-opacity="0.6" stroke="#ff6644" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" fill="#ff8866" font-family="Georgia, serif" font-size="13" font-weight="bold">🧠 AI Interpretability</text>
  <text x="500" y="135" text-anchor="middle" fill="#cc5533" font-family="monospace" font-size="9">Neural nets → formulas</text>
  <text x="500" y="150" text-anchor="middle" fill="#aa4422" font-family="monospace" font-size="9">Softplus transformers</text>

  <!-- Scientific Discovery -->
  <line x1="565" y1="320" x2="780" y2="160" stroke="#44ff88" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="690" y="100" width="180" height="70" rx="10" fill="#002211" fill-opacity="0.6" stroke="#44ff88" stroke-width="1.5"/>
  <text x="780" y="125" text-anchor="middle" fill="#66ffaa" font-family="Georgia, serif" font-size="13" font-weight="bold">🔬 Scientific Discovery</text>
