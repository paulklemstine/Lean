<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#141b2d"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg3)"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#79c0ff" font-size="20" font-weight="bold">
    The Log-Sum-Exp ↔ Softplus Connection
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#8b949e" font-size="12">
    log(eˣ + eʸ) = x + σ(y − x) — Formally Verified
  </text>
  
  <!-- Central identity -->
  <rect x="150" y="75" width="500" height="60" rx="12" fill="#1a2744" stroke="#58a6ff" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="bold">
    log(eˣ + eʸ) = x + σ(y − x)
  </text>
  
  <!-- Three implications -->
  <!-- Left: Softmax/Attention -->
  <rect x="30" y="170" width="230" height="150" rx="10" fill="#112233" stroke="#3fb8af" stroke-width="1.5"/>
  <text x="145" y="195" text-anchor="middle" fill="#56d4c8" font-size="14" font-weight="bold">🧠 Attention Mechanism</text>
  <text x="45" y="218" fill="#7ee8db" font-size="10">softmax(x)ᵢ = eˣⁱ / Σⱼ eˣʲ</text>
  <text x="45" y="238" fill="#7ee8db" font-size="10">= exp(xᵢ − LSE(x))</text>
  <text x="45" y="262" fill="#aadddd" font-size="10">Every transformer attention</text>
  <text x="45" y="278" fill="#aadddd" font-size="10">layer is built from chained</text>
  <text x="45" y="294" fill="#aadddd" font-size="10">softplus operations</text>
  
  <!-- Center: Statistical Mechanics -->
  <rect x="285" y="170" width="230" height="150" rx="10" fill="#221122" stroke="#d29922" stroke-width="1.5"/>
  <text x="400" y="195" text-anchor="middle" fill="#e3b341" font-size="14" font-weight="bold">⚡ Free Energy</text>
  <text x="300" y="218" fill="#f0d67a" font-size="10">F = −T · log Σᵢ e^(−Eᵢ/T)</text>
  <text x="300" y="238" fill="#f0d67a" font-size="10">= −T · LSE(−E/T)</text>
  <text x="300" y="262" fill="#ddcc88" font-size="10">Partition functions in</text>
  <text x="300" y="278" fill="#ddcc88" font-size="10">statistical mechanics are</text>
  <text x="300" y="294" fill="#ddcc88" font-size="10">softplus compositions</text>
  
  <!-- Right: Tropical -->
  <rect x="540" y="170" width="230" height="150" rx="10" fill="#112211" stroke="#238636" stroke-width="1.5"/>
  <text x="655" y="195" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">🌴 Tropical Geometry</text>
  <text x="555" y="218" fill="#7ee787" font-size="10">max(x,y) = lim_{β→∞} σ_β⁻¹(LSE)</text>
  <text x="555" y="238" fill="#7ee787" font-size="10">σ_β(x) = (1/β)·log(1+e^{βx})</text>
  <text x="555" y="262" fill="#aaddaa" font-size="10">Smooth softplus → sharp max</text>
  <text x="555" y="278" fill="#aaddaa" font-size="10">Smooth geometry →</text>
  <text x="555" y="294" fill="#aaddaa" font-size="10">tropical/piecewise-linear</text>
  
  <!-- Chain formula -->
  <rect x="80" y="350" width="640" height="120" rx="10" fill="#151520" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="375" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">
    n-ary Log-Sum-Exp from Binary Softplus
  </text>
  <text x="400" y="400" text-anchor="middle" fill="#c4b5fd" font-size="12">
    log(e^x₁ + e^x₂ + ··· + e^xₙ) = x₁ + σ(LSE(x₂,...,xₙ) − x₁)
  </text>
  <text x="400" y="425" text-anchor="middle" fill="#8b949e" font-size="11">
    Built recursively: binary → ternary → ... → n-ary
  </text>
  <text x="400" y="450" text-anchor="middle" fill="#6e7681" font-size="10">
    Depth O(log n) with parallel reduction, or depth O(n) sequentially
  </text>
  
  <text x="400" y="488" text-anchor="middle" fill="#484f58" font-size="10">
    Theorem: logsumexp_two — Formally verified in Lean 4
  </text>
</svg>
