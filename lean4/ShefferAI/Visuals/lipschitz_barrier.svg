<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg_lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <filter id="glow_lip">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg_lip)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" font-family="Georgia">
    The Lipschitz Barrier Theorem
  </text>
  <text x="400" y="65" text-anchor="middle" fill="#aaaacc" font-size="14" font-family="Georgia" font-style="italic">
    exp ∉ Sheffer Algebra — Formally Proved
  </text>

  <!-- Sheffer Algebra circle -->
  <ellipse cx="280" cy="280" rx="200" ry="180" fill="none" stroke="#4488ff" stroke-width="3" stroke-dasharray="8,4" filter="url(#glow_lip)"/>
  <text x="280" y="130" text-anchor="middle" fill="#4488ff" font-size="16" font-weight="bold" font-family="monospace">
    Sheffer Algebra
  </text>
  <text x="280" y="150" text-anchor="middle" fill="#6699ff" font-size="12" font-family="monospace">
    (All Lipschitz functions)
  </text>

  <!-- Functions inside -->
  <text x="230" y="210" fill="#44ff88" font-size="14" font-family="monospace">σ(x) = log(1+eˣ)</text>
  <text x="250" y="240" fill="#88ffaa" font-size="12" font-family="monospace">S(x) = eˣ/(1+eˣ)</text>
  <text x="200" y="270" fill="#88ffaa" font-size="12" font-family="monospace">id(x) = x</text>
  <text x="260" y="300" fill="#88ffaa" font-size="12" font-family="monospace">σ(σ(x))</text>
  <text x="190" y="330" fill="#88ffaa" font-size="12" font-family="monospace">aσ(bx+c) + d</text>
  <text x="250" y="360" fill="#88ffaa" font-size="12" font-family="monospace">sin(x) ≈ Σwᵢσ(aᵢx+bᵢ)</text>
  <text x="220" y="390" fill="#88ffaa" font-size="12" font-family="monospace">all polynomials</text>

  <!-- exp outside -->
  <text x="600" y="200" fill="#ff4444" font-size="18" font-weight="bold" font-family="monospace" filter="url(#glow_lip)">
    exp(x) ✗
  </text>
  <text x="600" y="225" fill="#ff8888" font-size="12" font-family="monospace">NOT Lipschitz</text>
  <text x="600" y="245" fill="#ff8888" font-size="12" font-family="monospace">NOT in Sheffer algebra</text>

  <!-- Arrow showing barrier -->
  <line x1="480" y1="260" x2="560" y2="220" stroke="#ff4444" stroke-width="2" marker-end="none"/>
  <text x="530" y="275" fill="#ff6666" font-size="11" font-family="monospace">barrier</text>

  <!-- Key insight box -->
  <rect x="500" y="310" width="270" height="150" rx="10" fill="rgba(68,136,255,0.15)" stroke="#4488ff" stroke-width="1"/>
  <text x="635" y="340" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold" font-family="Georgia">Key Results</text>
  <text x="515" y="365" fill="#ccddff" font-size="11" font-family="monospace">• σ is 1-Lipschitz ✓</text>
  <text x="515" y="385" fill="#ccddff" font-size="11" font-family="monospace">• Lip preserved by comp ✓</text>
  <text x="515" y="405" fill="#ccddff" font-size="11" font-family="monospace">• Lip preserved by aff ✓</text>
  <text x="515" y="425" fill="#ccddff" font-size="11" font-family="monospace">• ∴ all Sheffer expr Lip ✓</text>
  <text x="515" y="445" fill="#ff8888" font-size="11" font-family="monospace">• exp NOT Lipschitz ✗</text>

  <!-- Bottom attribution -->
  <text x="400" y="490" text-anchor="middle" fill="#666688" font-size="10" font-family="Georgia">
    Sheffer AI Research Program — Machine-Verified in Lean 4
  </text>
</svg>
