<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="600" fill="url(#bg2)"/>
  
  <text x="450" y="35" text-anchor="middle" fill="#58a6ff" font-size="22" font-weight="bold">
    The Lipschitz Barrier Theorem (Extended)
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-size="12">
    Every Sheffer expression is Lipschitz ⟹ Non-Lipschitz functions are structurally excluded
  </text>
  
  <!-- Left panel: IN the algebra -->
  <rect x="30" y="75" width="400" height="240" rx="10" fill="#0d2818" stroke="#238636" stroke-width="2"/>
  <text x="230" y="100" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold">✅ IN the Sheffer Algebra</text>
  <text x="230" y="118" text-anchor="middle" fill="#238636" font-size="11">(All Lipschitz, computable bounds)</text>
  
  <text x="50" y="145" fill="#7ee787" font-size="13">σ(x) = log(1+eˣ)</text>
  <text x="310" y="145" fill="#56d364" font-size="11">Lip = 1</text>
  
  <text x="50" y="168" fill="#7ee787" font-size="13">x (identity)</text>
  <text x="310" y="168" fill="#56d364" font-size="11">Lip = 1</text>
  
  <text x="50" y="191" fill="#7ee787" font-size="13">ax + b (affine)</text>
  <text x="310" y="191" fill="#56d364" font-size="11">Lip = |a|</text>
  
  <text x="50" y="214" fill="#7ee787" font-size="13">σ(σ(x)) (iterated)</text>
  <text x="310" y="214" fill="#56d364" font-size="11">Lip = 1</text>
  
  <text x="50" y="237" fill="#7ee787" font-size="13">σ(x) - σ(-x) = x</text>
  <text x="310" y="237" fill="#56d364" font-size="11">Lip = 2</text>
  
  <text x="50" y="260" fill="#7ee787" font-size="13">Σ wᵢσ(aᵢx+bᵢ) + c</text>
  <text x="310" y="260" fill="#56d364" font-size="11">Lip = Σ|wᵢaᵢ|</text>
  
  <text x="50" y="283" fill="#7ee787" font-size="13">S(x) = eˣ/(1+eˣ)</text>
  <text x="310" y="283" fill="#56d364" font-size="11">Lip = 1/4</text>
  
  <text x="50" y="300" fill="#3fb950" font-size="10">All with provable, computable robustness certificates</text>
  
  <!-- Right panel: NOT in the algebra -->
  <rect x="470" y="75" width="400" height="240" rx="10" fill="#2d1117" stroke="#da3633" stroke-width="2"/>
  <text x="670" y="100" text-anchor="middle" fill="#f85149" font-size="16" font-weight="bold">❌ NOT in the Sheffer Algebra</text>
  <text x="670" y="118" text-anchor="middle" fill="#da3633" font-size="11">(Not Lipschitz on ℝ — proved impossible)</text>
  
  <text x="490" y="145" fill="#ffa198" font-size="13">exp(x)</text>
  <text x="730" y="145" fill="#f85149" font-size="11">|eˣ-1|/|x| → ∞</text>
  
  <text x="490" y="168" fill="#ffa198" font-size="13">x²</text>
  <text x="730" y="168" fill="#f85149" font-size="11">|x²|/|x| = |x| → ∞</text>
  
  <text x="490" y="191" fill="#ffa198" font-size="13">sinh(x)</text>
  <text x="730" y="191" fill="#f85149" font-size="11">sinh(x)/x → ∞</text>
  
  <text x="490" y="214" fill="#ffa198" font-size="13">cosh(x)</text>
  <text x="730" y="214" fill="#f85149" font-size="11">cosh(x)/x → ∞</text>
  
  <text x="490" y="237" fill="#ffa198" font-size="13">xⁿ (n ≥ 2)</text>
  <text x="730" y="237" fill="#f85149" font-size="11">|xⁿ|/|x| → ∞</text>
  
  <text x="490" y="260" fill="#ffa198" font-size="13">tan(x)</text>
  <text x="730" y="260" fill="#f85149" font-size="11">unbounded deriv</text>
  
  <text x="490" y="283" fill="#ffa198" font-size="13">Any f with f' unbounded</text>
  <text x="730" y="283" fill="#f85149" font-size="11">⟹ not Lipschitz</text>
  
  <text x="490" y="300" fill="#f85149" font-size="10">Approximable on compact sets, but never exactly representable</text>
  
  <!-- Central barrier -->
  <line x1="450" y1="80" x2="450" y2="310" stroke="#ffd700" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="450" y="325" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">LIPSCHITZ BARRIER</text>
  
  <!-- Bottom: Proof structure -->
  <rect x="30" y="345" width="840" height="230" rx="10" fill="#111820" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="375" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">
    Proof Architecture (Formally Verified in Lean 4)
  </text>
  
  <!-- Step 1 -->
  <rect x="50" y="395" width="230" height="80" rx="8" fill="#1a2332" stroke="#388bfd"/>
  <text x="165" y="418" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Step 1: Base Case</text>
  <text x="165" y="438" text-anchor="middle" fill="#8b949e" font-size="10">σ is 1-Lipschitz</text>
  <text x="165" y="455" text-anchor="middle" fill="#8b949e" font-size="10">|σ(x)-σ(y)| ≤ |x-y|</text>
  <text x="165" y="468" text-anchor="middle" fill="#6e7681" font-size="9">(since 0 &lt; σ'(x) &lt; 1)</text>
  
  <!-- Step 2 -->
  <rect x="335" y="395" width="230" height="80" rx="8" fill="#1a2332" stroke="#388bfd"/>
  <text x="450" y="418" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Step 2: Structural Induction</text>
  <text x="450" y="438" text-anchor="middle" fill="#8b949e" font-size="10">Affine: Lip(f∘A) = |a|·Lip(f)</text>
  <text x="450" y="455" text-anchor="middle" fill="#8b949e" font-size="10">Comb: Lip(αf+βg) ≤ |α|Lip(f)+|β|Lip(g)</text>
  <text x="450" y="468" text-anchor="middle" fill="#8b949e" font-size="10">Comp: Lip(f∘g) ≤ Lip(f)·Lip(g)</text>
  
  <!-- Step 3 -->
  <rect x="620" y="395" width="230" height="80" rx="8" fill="#1a2332" stroke="#388bfd"/>
  <text x="735" y="418" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Step 3: Contradiction</text>
  <text x="735" y="438" text-anchor="middle" fill="#8b949e" font-size="10">If f ∈ Sheffer, ∃ C: Lipschitz</text>
  <text x="735" y="455" text-anchor="middle" fill="#8b949e" font-size="10">But exp, x², sinh → ∞ ratio</text>
  <text x="735" y="468" text-anchor="middle" fill="#8b949e" font-size="10">Contradiction ⟹ f ∉ Sheffer</text>
  
  <!-- Arrows between steps -->
  <path d="M285 435 L330 435" stroke="#388bfd" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M570 435 L615 435" stroke="#388bfd" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  
  <!-- Consequence -->
  <text x="450" y="510" text-anchor="middle" fill="#ffd700" font-size="13" font-weight="bold">
    Consequence: Every softplus network has a provable robustness certificate
  </text>
  <text x="450" y="530" text-anchor="middle" fill="#8b949e" font-size="11">
    |f(x) - f(y)| ≤ L · |x - y|  where L is computed from the network architecture
  </text>
  <text x="450" y="550" text-anchor="middle" fill="#6e7681" font-size="10">
    This is simultaneously a limitation (can't represent exp) and a guarantee (certified safety)
  </text>
  
  <text x="450" y="585" text-anchor="middle" fill="#484f58" font-size="10">
    Formally verified: sheffer_expr_lipschitz, exp_not_mem_sheffer, sq_not_mem_sheffer, sinh_not_mem_sheffer
  </text>
</svg>
