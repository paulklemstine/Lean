  <text x="450" y="245" fill="#ce93d8" font-size="16" font-weight="bold" text-anchor="middle">
    TIER 3: ADVANCED DIRECTIONS
  </text>

  <rect x="50" y="255" width="190" height="80" fill="#2a1a2a" rx="8"/>
  <text x="145" y="275" fill="#d0a0e0" font-size="11" text-anchor="middle">Lattice Reduction</text>
