<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="650" fill="url(#bg5)" rx="10"/>

  <text x="450" y="35" fill="#e94560" font-size="22" font-weight="bold" text-anchor="middle">
    Research Roadmap: Gravitational Factoring
  </text>

  <!-- Tier 1: Foundations (bottom) -->
  <rect x="30" y="520" width="840" height="110" fill="#0d1a0d" rx="12" stroke="#4caf50" stroke-width="2"/>
  <text x="450" y="545" fill="#4caf50" font-size="16" font-weight="bold" text-anchor="middle">
    TIER 1: FOUNDATIONS (Completed ✓)
  </text>

  <rect x="50" y="555" width="150" height="60" fill="#1a2a1a" rx="8"/>
  <text x="125" y="575" fill="#81c784" font-size="11" text-anchor="middle">Degen 8-Square</text>
  <text x="125" y="592" fill="#81c784" font-size="11" text-anchor="middle">Identity ✓</text>

  <rect x="215" y="555" width="150" height="60" fill="#1a2a1a" rx="8"/>
  <text x="290" y="575" fill="#81c784" font-size="11" text-anchor="middle">Parity Obstructions</text>
  <text x="290" y="592" fill="#81c784" font-size="11" text-anchor="middle">Analyzed ✓</text>

  <rect x="380" y="555" width="150" height="60" fill="#1a2a1a" rx="8"/>
  <text x="455" y="575" fill="#81c784" font-size="11" text-anchor="middle">Channel Counts</text>
  <text x="455" y="592" fill="#81c784" font-size="11" text-anchor="middle">Verified ✓</text>

  <rect x="545" y="555" width="150" height="60" fill="#1a2a1a" rx="8"/>
  <text x="620" y="575" fill="#81c784" font-size="11" text-anchor="middle">Euler/Lagrange</text>
  <text x="620" y="592" fill="#81c784" font-size="11" text-anchor="middle">4-Square ✓</text>

  <rect x="710" y="555" width="150" height="60" fill="#1a2a1a" rx="8"/>
  <text x="785" y="575" fill="#81c784" font-size="11" text-anchor="middle">Cross-Collision</text>
  <text x="785" y="592" fill="#81c784" font-size="11" text-anchor="middle">Formalized ✓</text>

  <!-- Tier 2: Current Research -->
  <rect x="30" y="370" width="840" height="130" fill="#1a1a0d" rx="12" stroke="#ffd54f" stroke-width="2"/>
  <text x="450" y="395" fill="#ffd54f" font-size="16" font-weight="bold" text-anchor="middle">
    TIER 2: ACTIVE RESEARCH
  </text>

  <rect x="50" y="405" width="180" height="80" fill="#2a2a1a" rx="8"/>
  <text x="140" y="425" fill="#ffe082" font-size="11" text-anchor="middle">Conjecture A:</text>
  <text x="140" y="442" fill="#ffe082" font-size="11" text-anchor="middle">Density δ_k(N)≥1/√N</text>
  <text x="140" y="462" fill="#ffb74d" font-size="10" text-anchor="middle">Status: Consistent ◐</text>

  <rect x="250" y="405" width="180" height="80" fill="#2a2a1a" rx="8"/>
  <text x="340" y="425" fill="#ffe082" font-size="11" text-anchor="middle">Conjecture C:</text>
  <text x="340" y="442" fill="#ffe082" font-size="11" text-anchor="middle">Quaternion ↔ Integer</text>
  <text x="340" y="462" fill="#ff9800" font-size="10" text-anchor="middle">Status: Open ○</text>

  <rect x="450" y="405" width="180" height="80" fill="#2a2a1a" rx="8"/>
  <text x="540" y="425" fill="#ffe082" font-size="11" text-anchor="middle">Conjecture D:</text>
  <text x="540" y="442" fill="#ffe082" font-size="11" text-anchor="middle">Octonionic Advantage</text>
  <text x="540" y="462" fill="#4caf50" font-size="10" text-anchor="middle">Status: Confirmed ● </text>

  <rect x="650" y="405" width="200" height="80" fill="#2a2a1a" rx="8"/>
  <text x="750" y="425" fill="#ffe082" font-size="11" text-anchor="middle">Sieve-Augmented</text>
  <text x="750" y="442" fill="#ffe082" font-size="11" text-anchor="middle">Congruence of Squares</text>
  <text x="750" y="462" fill="#4caf50" font-size="10" text-anchor="middle">Formalized ✓</text>

  <!-- Tier 3: Advanced -->
