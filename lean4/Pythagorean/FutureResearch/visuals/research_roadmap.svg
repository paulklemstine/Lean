  <text x="145" y="315" fill="#ba68c8" font-size="10" text-anchor="middle">Difficulty: Hard</text>

  <rect x="260" y="255" width="190" height="80" fill="#2a1a2a" rx="8"/>
  <text x="355" y="275" fill="#d0a0e0" font-size="11" text-anchor="middle">Quantum Grover</text>
  <text x="355" y="292" fill="#d0a0e0" font-size="11" text-anchor="middle">Tree Exploration</text>
  <text x="355" y="315" fill="#ba68c8" font-size="10" text-anchor="middle">Difficulty: Hard</text>

  <rect x="470" y="255" width="190" height="80" fill="#2a1a2a" rx="8"/>
  <text x="565" y="275" fill="#d0a0e0" font-size="11" text-anchor="middle">Sedenion Zero</text>
  <text x="565" y="292" fill="#d0a0e0" font-size="11" text-anchor="middle">Divisor Factoring</text>
  <text x="565" y="315" fill="#e94560" font-size="10" text-anchor="middle">Difficulty: Very Hard</text>

  <rect x="680" y="255" width="180" height="80" fill="#2a1a2a" rx="8"/>
  <text x="770" y="275" fill="#d0a0e0" font-size="11" text-anchor="middle">Complexity</text>
  <text x="770" y="292" fill="#d0a0e0" font-size="11" text-anchor="middle">Classification</text>
  <text x="770" y="315" fill="#e94560" font-size="10" text-anchor="middle">Difficulty: Very Hard</text>

  <!-- Tier 4: Frontier -->
  <rect x="150" y="70" width="600" height="130" fill="#1a0d0d" rx="12" stroke="#e94560" stroke-width="2"/>
  <text x="450" y="95" fill="#e94560" font-size="16" font-weight="bold" text-anchor="middle">
    TIER 4: FRONTIER / SPECULATIVE
  </text>

  <rect x="170" y="105" width="170" height="80" fill="#2a1010" rx="8"/>
  <text x="255" y="130" fill="#ff8080" font-size="11" text-anchor="middle">Subexponential</text>
  <text x="255" y="147" fill="#ff8080" font-size="11" text-anchor="middle">Factoring via δ_k</text>
  <text x="255" y="170" fill="#ef5350" font-size="10" text-anchor="middle">REVOLUTIONARY</text>

  <rect x="360" y="105" width="170" height="80" fill="#2a1010" rx="8"/>
  <text x="445" y="130" fill="#ff8080" font-size="11" text-anchor="middle">Non-Associative</text>
  <text x="445" y="147" fill="#ff8080" font-size="11" text-anchor="middle">Cryptanalysis</text>
  <text x="445" y="170" fill="#ef5350" font-size="10" text-anchor="middle">SPECULATIVE</text>

  <rect x="550" y="105" width="180" height="80" fill="#2a1010" rx="8"/>
  <text x="640" y="130" fill="#ff8080" font-size="11" text-anchor="middle">Photonic / Quantum</text>
  <text x="640" y="147" fill="#ff8080" font-size="11" text-anchor="middle">Implementation</text>
  <text x="640" y="170" fill="#ef5350" font-size="10" text-anchor="middle">LONG-TERM</text>

  <!-- Connecting arrows between tiers -->
  <line x1="450" y1="520" x2="450" y2="505" stroke="#8a8a6a" stroke-width="2" opacity="0.5"/>
  <line x1="450" y1="370" x2="450" y2="355" stroke="#8a6a8a" stroke-width="2" opacity="0.5"/>
  <line x1="450" y1="220" x2="450" y2="205" stroke="#8a4a4a" stroke-width="2" opacity="0.5"/>
</svg>
