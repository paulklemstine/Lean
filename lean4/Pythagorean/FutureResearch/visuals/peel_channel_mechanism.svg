<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080820"/>
      <stop offset="100%" style="stop-color:#121238"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#88aacc"/>
    </marker>
  </defs>

  <rect width="1000" height="500" fill="url(#bg5)"/>

  <text x="500" y="35" text-anchor="middle" fill="#ffd700" font-size="22" font-weight="bold">
    The Peel Channel Mechanism
  </text>

  <!-- Input: k-tuple -->
  <rect x="30" y="70" width="220" height="130" rx="10" fill="#112244" stroke="#4488ff" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" fill="#4488ff" font-size="16" font-weight="bold">k-tuple</text>
  <text x="140" y="125" text-anchor="middle" fill="#88aacc" font-size="13">x₁² + x₂² + ⋯ + xₖ² = d²</text>
  <text x="140" y="150" text-anchor="middle" fill="#6688aa" font-size="11">with d = N (target)</text>
  <text x="140" y="175" text-anchor="middle" fill="#556699" font-size="11">e.g. 3²+4²+12²=13²</text>

  <!-- Arrow 1 -->
  <line x1="250" y1="135" x2="310" y2="135" stroke="#88aacc" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="280" y="125" text-anchor="middle" fill="#88aacc" font-size="10">peel</text>

  <!-- Peel identity -->
  <rect x="320" y="60" width="280" height="150" rx="10" fill="#221144" stroke="#aa66ff" stroke-width="2"/>
  <text x="460" y="90" text-anchor="middle" fill="#aa66ff" font-size="16" font-weight="bold">Peel Identity</text>
  <text x="460" y="118" text-anchor="middle" fill="#cc88ff" font-size="14">
    (d − xⱼ)(d + xⱼ) = Σᵢ≠ⱼ xᵢ²
  </text>
  <text x="460" y="145" text-anchor="middle" fill="#9966cc" font-size="11">For each j = 1, ..., k:</text>
  <text x="460" y="165" text-anchor="middle" fill="#8855bb" font-size="11">d − xⱼ and d + xⱼ are factors</text>
  <text x="460" y="185" text-anchor="middle" fill="#7744aa" font-size="10">k channels × k-tuples = many chances</text>

  <!-- Arrow 2 -->
  <line x1="600" y1="135" x2="660" y2="135" stroke="#88aacc" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="630" y="125" text-anchor="middle" fill="#88aacc" font-size="10">GCD</text>

  <!-- GCD computation -->
  <rect x="670" y="70" width="300" height="130" rx="10" fill="#114422" stroke="#44dd88" stroke-width="2"/>
  <text x="820" y="100" text-anchor="middle" fill="#44dd88" font-size="16" font-weight="bold">GCD Cascade</text>
  <text x="820" y="128" text-anchor="middle" fill="#66bb88" font-size="13">
    gcd(d − xⱼ, N) = ?
  </text>
  <text x="820" y="155" text-anchor="middle" fill="#55aa77" font-size="12">If 1 &lt; gcd &lt; N → FACTOR!</text>
  <text x="820" y="178" text-anchor="middle" fill="#449966" font-size="10">If gcd = 1 or N → try next channel</text>

  <!-- Bottom: concrete example -->
  <rect x="50" y="240" width="900" height="220" rx="12" fill="#0d0d2d" stroke="#444466" stroke-width="1"/>

  <text x="500" y="270" text-anchor="middle" fill="#ddcc44" font-size="16" font-weight="bold">
    Concrete Example: Factoring N = 77 = 7 × 11
  </text>

  <!-- Step 1 -->
  <text x="80" y="305" fill="#88aacc" font-size="13" font-weight="bold">Step 1:</text>
  <text x="160" y="305" fill="#aabbcc" font-size="12">Find quadruple: 3² + 4² + 8² = 89 ≈ 77... Actually: 2² + 3² + 6² + 8² = 113... </text>
  <text x="160" y="325" fill="#8899bb" font-size="12">Better: use d = 77 directly. Find x₁²+x₂²+x₃² = 77² = 5929</text>

  <!-- Step 2 -->
  <text x="80" y="355" fill="#88aacc" font-size="13" font-weight="bold">Step 2:</text>
  <text x="160" y="355" fill="#aabbcc" font-size="12">Peel channel j=1: (77 − x₁)(77 + x₁) = x₂² + x₃²</text>

  <!-- Step 3 -->
  <text x="80" y="385" fill="#88aacc" font-size="13" font-weight="bold">Step 3:</text>
  <text x="160" y="385" fill="#aabbcc" font-size="12">Compute gcd(77 − x₁, 77). If x₁ ≡ 0 (mod 7), then 7 | (77 − x₁) and 7 | 77</text>

  <!-- Step 4 -->
  <text x="80" y="415" fill="#44dd88" font-size="13" font-weight="bold">Result:</text>
  <text x="160" y="415" fill="#66ff88" font-size="12">gcd(77 − 7k, 77) = 7 → Factor found! 77 = 7 × 11 ✓</text>

  <!-- Channel count -->
  <text x="500" y="450" text-anchor="middle" fill="#ffaa44" font-size="13">
    k=3 gives 6 channels | k=4 gives 10 channels | k=8 gives 36 channels
  </text>
</svg>
