<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#151535"/>
    </linearGradient>
    <radialGradient id="sphere" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#334466;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#112233;stop-opacity:0.2"/>
    </radialGradient>
  </defs>

  <rect width="900" height="700" fill="url(#bg3)"/>

  <text x="450" y="40" text-anchor="middle" fill="#ffd700" font-size="24" font-weight="bold">
    The Factoring Hypersurface
  </text>
  <text x="450" y="65" text-anchor="middle" fill="#8899aa" font-size="13">
    N = 77 = 7 × 11 | Intersection of hyperplanes with the k-sphere
  </text>

  <!-- Main sphere (the k-sphere Σxᵢ² = N²) -->
  <circle cx="350" cy="350" r="220" fill="url(#sphere)" stroke="#334466" stroke-width="1.5"/>
  <text x="350" y="590" text-anchor="middle" fill="#5566aa" font-size="12">
    Σ xᵢ² = N² = 5929
  </text>

  <!-- Hyperplane 1: x ≡ 0 (mod 7) - vertical lines -->
  <g opacity="0.5">
    <line x1="180" y1="130" x2="180" y2="570" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="240" y1="130" x2="240" y2="570" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="300" y1="130" x2="300" y2="570" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="360" y1="130" x2="360" y2="570" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="420" y1="130" x2="420" y2="570" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="480" y1="130" x2="480" y2="570" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Hyperplane 2: x ≡ 0 (mod 11) - diagonal lines -->
  <g opacity="0.5">
    <line x1="130" y1="200" x2="570" y2="200" stroke="#44aaff" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="130" y1="280" x2="570" y2="280" stroke="#44aaff" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="130" y1="360" x2="570" y2="360" stroke="#44aaff" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="130" y1="440" x2="570" y2="440" stroke="#44aaff" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="130" y1="520" x2="570" y2="520" stroke="#44aaff" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Intersection points (factoring-revealing!) -->
  <g>
    <circle cx="180" cy="200" r="6" fill="#ffdd44" opacity="0.9"/>
    <circle cx="300" cy="280" r="6" fill="#ffdd44" opacity="0.9"/>
    <circle cx="360" cy="360" r="6" fill="#ffdd44" opacity="0.9"/>
    <circle cx="420" cy="440" r="6" fill="#ffdd44" opacity="0.9"/>
    <circle cx="240" cy="360" r="6" fill="#ffdd44" opacity="0.9"/>
    <circle cx="480" cy="280" r="6" fill="#ffdd44" opacity="0.9"/>
    <circle cx="300" cy="440" r="6" fill="#ffdd44" opacity="0.9"/>
    <circle cx="360" cy="200" r="6" fill="#ffdd44" opacity="0.9"/>
    <circle cx="180" cy="520" r="6" fill="#ffdd44" opacity="0.9"/>
    <circle cx="480" cy="200" r="6" fill="#ffdd44" opacity="0.9"/>
  </g>

  <!-- Points on sphere but NOT on hyperplanes (non-revealing) -->
  <g>
    <circle cx="200" cy="250" r="3" fill="#334466" opacity="0.6"/>
    <circle cx="320" cy="180" r="3" fill="#334466" opacity="0.6"/>
    <circle cx="400" cy="300" r="3" fill="#334466" opacity="0.6"/>
    <circle cx="280" cy="420" r="3" fill="#334466" opacity="0.6"/>
    <circle cx="450" cy="380" r="3" fill="#334466" opacity="0.6"/>
    <circle cx="160" cy="380" r="3" fill="#334466" opacity="0.6"/>
    <circle cx="500" cy="320" r="3" fill="#334466" opacity="0.6"/>
    <circle cx="220" cy="460" r="3" fill="#334466" opacity="0.6"/>
  </g>

  <!-- Legend -->
  <rect x="620" y="100" width="260" height="280" rx="10" fill="#0a0a1e" stroke="#333355" stroke-width="1"/>
  <text x="750" y="130" text-anchor="middle" fill="#aabbcc" font-size="15" font-weight="bold">Legend</text>

  <line x1="640" y1="160" x2="690" y2="160" stroke="#ff4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="700" y="165" fill="#ff6666" font-size="12">x ≡ 0 (mod 7)</text>

  <line x1="640" y1="190" x2="690" y2="190" stroke="#44aaff" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="700" y="195" fill="#66bbff" font-size="12">x ≡ 0 (mod 11)</text>

  <circle cx="655" cy="220" r="6" fill="#ffdd44"/>
  <text x="700" y="225" fill="#ffdd44" font-size="12">Factoring-revealing</text>

  <circle cx="655" cy="250" r="3" fill="#334466"/>
  <text x="700" y="255" fill="#556688" font-size="12">Non-revealing</text>

  <text x="750" y="290" text-anchor="middle" fill="#8899aa" font-size="11">
    F(N) = ∪ⱼ {xⱼ ≡ N (mod p)}
  </text>
  <text x="750" y="310" text-anchor="middle" fill="#8899aa" font-size="11">
    ∩ {Σ xᵢ² = N²}
  </text>

  <text x="750" y="345" text-anchor="middle" fill="#aabb77" font-size="12">
    Density ≈ 1/p + 1/q - 1/(pq)
  </text>
  <text x="750" y="365" text-anchor="middle" fill="#aabb77" font-size="12">
    = 1/7 + 1/11 - 1/77 ≈ 0.221
  </text>

  <!-- Key insight box -->
  <rect x="620" y="420" width="260" height="120" rx="10" fill="#1a1a0a" stroke="#aaaa44" stroke-width="1"/>
  <text x="750" y="448" text-anchor="middle" fill="#dddd44" font-size="13" font-weight="bold">Key Insight</text>
  <text x="750" y="472" text-anchor="middle" fill="#aaaa88" font-size="11">Higher k = more hyperplanes</text>
  <text x="750" y="492" text-anchor="middle" fill="#aaaa88" font-size="11">More intersections with sphere</text>
  <text x="750" y="512" text-anchor="middle" fill="#aaaa88" font-size="11">Higher factoring probability!</text>
  <text x="750" y="530" text-anchor="middle" fill="#ffaa44" font-size="12" font-weight="bold">δₖ grows with k</text>

  <!-- Equations -->
  <text x="450" y="650" text-anchor="middle" fill="#7788aa" font-size="14">
    gcd(N - xⱼ, N) &gt; 1  ⟺  xⱼ ≡ N (mod p) for some prime p | N
  </text>
  <text x="450" y="680" text-anchor="middle" fill="#5566aa" font-size="12">
    Each peel channel xⱼ probes a different hyperplane intersection
  </text>
</svg>
