<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#1a1e2e"/>
    </linearGradient>
    <radialGradient id="sphere" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#2a4a6a;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0a1a2a;stop-opacity:0.2"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" fill="#58a6ff" font-size="20" font-weight="bold" text-anchor="middle">
    The Factoring Hypersurface: Sphere ∩ Hyperplanes
  </text>
  <text x="400" y="55" fill="#8b949e" font-size="12" text-anchor="middle">
    F(N) = {x on S^(k-1)(N) : gcd(N − xⱼ, N) &gt; 1 for some j}
  </text>

  <!-- Sphere -->
  <ellipse cx="300" cy="280" rx="200" ry="180" fill="url(#sphere)" stroke="#3a5a8a" stroke-width="1.5"/>
  <text x="300" y="110" fill="#5a8aba" font-size="13" text-anchor="middle">
    S^(k-1)(N): Σxᵢ² = N²
  </text>

  <!-- Hyperplane 1 (mod p) - vertical lines -->
  <line x1="200" y1="120" x2="200" y2="440" stroke="#e94560" stroke-width="1.5" stroke-dasharray="6" opacity="0.6"/>
  <line x1="300" y1="100" x2="300" y2="460" stroke="#e94560" stroke-width="1.5" stroke-dasharray="6" opacity="0.6"/>
  <line x1="400" y1="120" x2="400" y2="440" stroke="#e94560" stroke-width="1.5" stroke-dasharray="6" opacity="0.6"/>
  <text x="180" y="445" fill="#e94560" font-size="11">xⱼ ≡ 0 mod p</text>

  <!-- Hyperplane 2 (mod q) - horizontal lines -->
  <line x1="100" y1="200" x2="500" y2="200" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="6" opacity="0.6"/>
  <line x1="100" y1="280" x2="500" y2="280" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="6" opacity="0.6"/>
  <line x1="100" y1="360" x2="500" y2="360" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="6" opacity="0.6"/>
  <text x="510" y="285" fill="#4caf50" font-size="11">xⱼ ≡ 0 mod q</text>

  <!-- Intersection points (factoring-revealing) -->
  <circle cx="200" cy="200" r="6" fill="#ffd54f" stroke="#fff" stroke-width="1"/>
  <circle cx="300" cy="200" r="6" fill="#ffd54f" stroke="#fff" stroke-width="1"/>
  <circle cx="400" cy="200" r="6" fill="#ffd54f" stroke="#fff" stroke-width="1"/>
  <circle cx="200" cy="280" r="6" fill="#ffd54f" stroke="#fff" stroke-width="1"/>
  <circle cx="300" cy="280" r="6" fill="#ffd54f" stroke="#fff" stroke-width="1"/>
  <circle cx="400" cy="280" r="6" fill="#ffd54f" stroke="#fff" stroke-width="1"/>
  <circle cx="200" cy="360" r="6" fill="#ffd54f" stroke="#fff" stroke-width="1"/>
  <circle cx="300" cy="360" r="6" fill="#ffd54f" stroke="#fff" stroke-width="1"/>
  <circle cx="400" cy="360" r="6" fill="#ffd54f" stroke="#fff" stroke-width="1"/>

  <!-- Points on sphere-hyperplane intersection -->
  <circle cx="250" cy="200" r="4" fill="#e94560"/>
  <circle cx="350" cy="200" r="4" fill="#e94560"/>
  <circle cx="200" cy="240" r="4" fill="#4caf50"/>
  <circle cx="300" cy="320" r="4" fill="#4caf50"/>
  <circle cx="250" cy="360" r="4" fill="#e94560"/>

  <!-- Right panel: density analysis -->
  <rect x="550" y="80" width="230" height="400" fill="#0d1520" rx="10" stroke="#3a5a8a" stroke-width="1"/>

  <text x="665" y="110" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">
    Density Analysis
  </text>

  <text x="570" y="140" fill="#e94560" font-size="12">• Points with p | xⱼ:</text>
  <text x="590" y="160" fill="#ff8080" font-size="13" font-family="serif">  N/p = q points</text>

  <text x="570" y="190" fill="#4caf50" font-size="12">• Points with q | xⱼ:</text>
  <text x="590" y="210" fill="#81c784" font-size="13" font-family="serif">  N/q = p points</text>

  <text x="570" y="245" fill="#ffd54f" font-size="12">• Overlap (pq | xⱼ):</text>
  <text x="590" y="265" fill="#ffe082" font-size="13" font-family="serif">  N/(pq) = 1 point</text>

  <line x1="570" y1="280" x2="760" y2="280" stroke="#4a6fa5" stroke-width="1"/>

  <text x="570" y="305" fill="#e0e0ff" font-size="13" font-weight="bold">Inclusion-Exclusion:</text>
  <text x="590" y="330" fill="#c0d0ff" font-size="14" font-family="serif">
    δ = (p + q − 1) / N
  </text>

  <text x="570" y="365" fill="#8b949e" font-size="12">For p ≈ q ≈ √N:</text>
  <text x="590" y="390" fill="#58a6ff" font-size="16" font-family="serif" font-weight="bold">
    δ ≈ 2/√N
  </text>

  <text x="570" y="425" fill="#8b949e" font-size="11">Formally verified in Lean 4</text>
  <text x="570" y="445" fill="#4caf50" font-size="11">inclusion_exclusion_count ✓</text>
  <text x="570" y="465" fill="#4caf50" font-size="11">semiprime_factoring_channels ✓</text>
</svg>
