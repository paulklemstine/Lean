<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
<defs>
  <style>
    .title { font: bold 20px sans-serif; fill: #1a1a2e; }
    .subtitle { font: 14px sans-serif; fill: #16213e; }
    .label { font: 11px monospace; fill: #333; }
    .small { font: 9px sans-serif; fill: #666; }
    .axis { stroke: #333; stroke-width: 1; }
    .grid { stroke: #e0e0e0; stroke-width: 0.5; }
    .node { stroke: #1a1a2e; stroke-width: 1.5; }
    .edge { stroke: #4a4e69; stroke-width: 1; opacity: 0.6; }
    .highlight { stroke: #e63946; stroke-width: 2; fill: #e63946; fill-opacity: 0.3; }
    .factor { fill: #2a9d8f; stroke: #264653; stroke-width: 2; }
    .energy-high { fill: #e76f51; }
    .energy-mid { fill: #f4a261; }
    .energy-low { fill: #2a9d8f; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4e69"/>
  </marker>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#2a9d8f;stop-opacity:0.8"/>
    <stop offset="100%" style="stop-color:#264653;stop-opacity:0"/>
  </radialGradient>
</defs>
<rect width="1000" height="700" fill="#faf9f6" rx="10"/>
<text x="500" y="35" text-anchor="middle" class="title">The Pythagorean Quadruple Tree</text>
<text x="500" y="55" text-anchor="middle" class="subtitle">a² + b² + c² = d²  |  Root: (0, 0, 1, 1)</text>
<line x1="500" y1="115" x2="300" y2="185" class="edge"/>
<line x1="500" y1="115" x2="500" y2="185" class="edge"/>
<line x1="500" y1="115" x2="700" y2="185" class="edge"/>
<line x1="500" y1="115" x2="200" y2="185" class="edge"/>
<line x1="300" y1="215" x2="150" y2="295" class="edge"/>
<line x1="300" y1="215" x2="350" y2="295" class="edge"/>
<line x1="500" y1="215" x2="500" y2="295" class="edge"/>
<line x1="500" y1="215" x2="650" y2="295" class="edge"/>
<line x1="700" y1="215" x2="800" y2="295" class="edge"/>
<line x1="150" y1="325" x2="100" y2="405" class="edge"/>
<line x1="150" y1="325" x2="250" y2="405" class="edge"/>
<line x1="350" y1="325" x2="400" y2="405" class="edge"/>
<line x1="500" y1="325" x2="550" y2="405" class="edge"/>
<line x1="650" y1="325" x2="700" y2="405" class="edge"/>
<circle cx="500" cy="100" r="18" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="500" y="104" text-anchor="middle" class="small" fill="white" font-weight="bold">(0,0,1,1)</text>
<text x="500" y="130" text-anchor="middle" class="small">d=1</text>
<circle cx="300" cy="200" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="300" y="204" text-anchor="middle" class="small" fill="white" font-weight="bold">(1,2,2,3)</text>
<text x="300" y="226" text-anchor="middle" class="small">d=3</text>
<circle cx="500" cy="200" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="500" y="204" text-anchor="middle" class="small" fill="white" font-weight="bold">(2,3,6,7)</text>
<text x="500" y="226" text-anchor="middle" class="small">d=7</text>
<circle cx="700" cy="200" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="700" y="204" text-anchor="middle" class="small" fill="white" font-weight="bold">(0,0,2,2)</text>
<text x="700" y="226" text-anchor="middle" class="small">d=2</text>
<circle cx="150" cy="310" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="150" y="314" text-anchor="middle" class="small" fill="white" font-weight="bold">(1,4,8,9)</text>
<text x="150" y="336" text-anchor="middle" class="small">d=9</text>
<circle cx="350" cy="310" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="350" y="314" text-anchor="middle" class="small" fill="white" font-weight="bold">(4,4,7,9)</text>
<text x="350" y="336" text-anchor="middle" class="small">d=9</text>
<circle cx="500" cy="310" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="500" y="314" text-anchor="middle" class="small" fill="white" font-weight="bold">(2,6,9,11)</text>
<text x="500" y="336" text-anchor="middle" class="small">d=11</text>
<circle cx="650" cy="310" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="650" y="314" text-anchor="middle" class="small" fill="white" font-weight="bold">(6,6,7,11)</text>
<text x="650" y="336" text-anchor="middle" class="small">d=11</text>
<circle cx="200" cy="200" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="200" y="204" text-anchor="middle" class="small" fill="white" font-weight="bold">(0,3,4,5)</text>
<text x="200" y="226" text-anchor="middle" class="small">d=5</text>
<circle cx="800" cy="310" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="800" y="314" text-anchor="middle" class="small" fill="white" font-weight="bold">(2,4,4,6)</text>
<text x="800" y="336" text-anchor="middle" class="small">d=6</text>
<circle cx="100" cy="420" r="14" fill="#e76f51" class="node" fill-opacity="0.8"/>
<text x="100" y="424" text-anchor="middle" class="small" fill="white" font-weight="bold">(1,2,14,15)</text>
<text x="100" y="446" text-anchor="middle" class="small">d=15</text>
<circle cx="250" cy="420" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="250" y="424" text-anchor="middle" class="small" fill="white" font-weight="bold">(2,10,11,15)</text>
<text x="250" y="446" text-anchor="middle" class="small">d=15</text>
<circle cx="400" cy="420" r="14" fill="#e76f51" class="node" fill-opacity="0.8"/>
<text x="400" y="424" text-anchor="middle" class="small" fill="white" font-weight="bold">(3,6,14,15)</text>
<text x="400" y="446" text-anchor="middle" class="small">d=15</text>
<circle cx="550" cy="420" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="550" y="424" text-anchor="middle" class="small" fill="white" font-weight="bold">(4,6,12,14)</text>
<text x="550" y="446" text-anchor="middle" class="small">d=14</text>
<circle cx="700" cy="420" r="14" fill="#2a9d8f" class="node" fill-opacity="0.8"/>
<text x="700" y="424" text-anchor="middle" class="small" fill="white" font-weight="bold">(1,6,18,19)</text>
<text x="700" y="446" text-anchor="middle" class="small">d=19</text>
<rect x="30" y="530" width="250" height="130" fill="white" stroke="#ccc" rx="5"/>
<text x="45" y="555" class="subtitle" font-weight="bold">Legend</text>
<circle cx="55" cy="575" r="8" fill="#2a9d8f"/>
<text x="70" y="579" class="label">Valid quadruple (a²+b²+c²=d²)</text>
<circle cx="55" cy="600" r="8" fill="#e76f51"/>
<text x="70" y="604" class="label">Invalid / approximate</text>
<text x="45" y="630" class="small">Each node has multiple children</text>
<text x="45" y="645" class="small">Hypotenuse d increases down the tree</text>
<text x="920" y="150" text-anchor="middle" class="subtitle" fill="#e63946">↑ Gravity</text>
<text x="920" y="170" text-anchor="middle" class="small">(toward root)</text>
<line x1="920" y1="400" x2="920" y2="180" stroke="#e63946" stroke-width="2" marker-end="url(#arrow)"/>
<text x="920" y="420" text-anchor="middle" class="small">↓ Energy</text>
<text x="920" y="435" text-anchor="middle" class="small">(tree expansion)</text>
</svg>