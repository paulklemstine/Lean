<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
<defs>
  <style>
    .title { font: bold 20px sans-serif; fill: #1a1a2e; }
    .subtitle { font: 14px sans-serif; fill: #16213e; }
    .label { font: 11px monospace; fill: #333; }
    .small { font: 9px sans-serif; fill: #666; }
    .axis { stroke: #333; stroke-width: 1; }
    .grid { stroke: #e0e0e0; stroke-width: 0.5; }
    .node { stroke: #1a1a2e; stroke-width: 1.5; }
    .edge { stroke: #4a4e69; stroke-width: 1; opacity: 0.6; }
    .highlight { stroke: #e63946; stroke-width: 2; fill: #e63946; fill-opacity: 0.3; }
    .factor { fill: #2a9d8f; stroke: #264653; stroke-width: 2; }
    .energy-high { fill: #e76f51; }
    .energy-mid { fill: #f4a261; }
    .energy-low { fill: #2a9d8f; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4e69"/>
  </marker>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#2a9d8f;stop-opacity:0.8"/>
    <stop offset="100%" style="stop-color:#264653;stop-opacity:0"/>
  </radialGradient>
</defs>
<rect width="900" height="600" fill="#faf9f6" rx="10"/>
<text x="450" y="35" text-anchor="middle" class="title">Peel Channels: Factor Extraction</text>
<text x="450" y="55" text-anchor="middle" class="subtitle">a² + b² + c² = d²  →  (d-x)(d+x) = sum of remaining squares</text>
<circle cx="450" cy="200" r="50" fill="#264653" fill-opacity="0.8"/>
<text x="450" y="195" text-anchor="middle" fill="white" font-size="16" font-weight="bold">(a,b,c,d)</text>
<text x="450" y="215" text-anchor="middle" fill="#a8dadc" font-size="12">a²+b²+c²=d²</text>
<line x1="450" y1="250" x2="150" y2="340" stroke="#e63946" stroke-width="2" stroke-dasharray="5,5"/>
<rect x="50" y="350" width="200" height="120" fill="#e63946" fill-opacity="0.1" stroke="#e63946" stroke-width="2" rx="10"/>
<text x="150" y="370" text-anchor="middle" font-weight="bold" fill="#e63946" font-size="14">Channel A</text>
<text x="150" y="400" text-anchor="middle" class="label">(d-a)(d+a) = b²+c²</text>
<text x="150" y="425" text-anchor="middle" class="small">gcd(d-a, N) → factor?</text>
<text x="150" y="445" text-anchor="middle" class="small">gcd(d+a, N) → factor?</text>
<line x1="450" y1="250" x2="450" y2="340" stroke="#457b9d" stroke-width="2" stroke-dasharray="5,5"/>
<rect x="350" y="350" width="200" height="120" fill="#457b9d" fill-opacity="0.1" stroke="#457b9d" stroke-width="2" rx="10"/>
<text x="450" y="370" text-anchor="middle" font-weight="bold" fill="#457b9d" font-size="14">Channel B</text>
<text x="450" y="400" text-anchor="middle" class="label">(d-b)(d+b) = a²+c²</text>
<text x="450" y="425" text-anchor="middle" class="small">gcd(d-b, N) → factor?</text>
<text x="450" y="445" text-anchor="middle" class="small">gcd(d+b, N) → factor?</text>
<line x1="450" y1="250" x2="750" y2="340" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="5,5"/>
<rect x="650" y="350" width="200" height="120" fill="#2a9d8f" fill-opacity="0.1" stroke="#2a9d8f" stroke-width="2" rx="10"/>
<text x="750" y="370" text-anchor="middle" font-weight="bold" fill="#2a9d8f" font-size="14">Channel C</text>
<text x="750" y="400" text-anchor="middle" class="label">(d-c)(d+c) = a²+b²</text>
<text x="750" y="425" text-anchor="middle" class="small">gcd(d-c, N) → factor?</text>
<text x="750" y="445" text-anchor="middle" class="small">gcd(d+c, N) → factor?</text>
<rect x="50" y="510" width="800" height="60" fill="#f1faee" stroke="#a8dadc" rx="5"/>
<text x="450" y="535" text-anchor="middle" class="subtitle" fill="#1d3557">For N = p·q: If any gcd(d±x, N) ∈ {p, q}, factoring succeeds!</text>
<text x="450" y="555" text-anchor="middle" class="small">3 channels × 2 GCDs each = 6 independent factor extraction attempts per quadruple</text>
</svg>