<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550">
<defs>
  <style>
    .title { font: bold 20px sans-serif; fill: #1a1a2e; }
    .subtitle { font: 14px sans-serif; fill: #16213e; }
    .label { font: 11px monospace; fill: #333; }
    .small { font: 9px sans-serif; fill: #666; }
    .axis { stroke: #333; stroke-width: 1; }
    .grid { stroke: #e0e0e0; stroke-width: 0.5; }
    .node { stroke: #1a1a2e; stroke-width: 1.5; }
    .edge { stroke: #4a4e69; stroke-width: 1; opacity: 0.6; }
    .highlight { stroke: #e63946; stroke-width: 2; fill: #e63946; fill-opacity: 0.3; }
    .factor { fill: #2a9d8f; stroke: #264653; stroke-width: 2; }
    .energy-high { fill: #e76f51; }
    .energy-mid { fill: #f4a261; }
    .energy-low { fill: #2a9d8f; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4e69"/>
  </marker>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#2a9d8f;stop-opacity:0.8"/>
    <stop offset="100%" style="stop-color:#264653;stop-opacity:0"/>
  </radialGradient>
</defs>
<rect width="1000" height="550" fill="#faf9f6" rx="10"/>
<text x="500" y="35" text-anchor="middle" class="title">Quaternion Norm Factoring</text>
<text x="500" y="55" text-anchor="middle" class="subtitle">N = p·q  →  q₁·q₂ = Q  where |q₁|²=p, |q₂|²=q, |Q|²=N</text>
<rect x="50" y="110" width="200" height="100" fill="#e63946" fill-opacity="0.15" stroke="#e63946" stroke-width="2" rx="10"/>
<text x="150" y="135" text-anchor="middle" font-size="22" font-weight="bold" fill="#e63946">p</text>
<text x="150" y="160" text-anchor="middle" class="small">q₁ = a₁+b₁i+c₁j+d₁k</text>
<text x="150" y="180" text-anchor="middle" class="small">|q₁|² = a₁²+b₁²+c₁²+d₁² = p</text>
<text x="150" y="200" text-anchor="middle" class="small" fill="#888">Prime factor</text>
<rect x="400" y="110" width="200" height="100" fill="#457b9d" fill-opacity="0.15" stroke="#457b9d" stroke-width="2" rx="10"/>
<text x="500" y="135" text-anchor="middle" font-size="22" font-weight="bold" fill="#457b9d">q</text>
<text x="500" y="160" text-anchor="middle" class="small">q₂ = a₂+b₂i+c₂j+d₂k</text>
<text x="500" y="180" text-anchor="middle" class="small">|q₂|² = a₂²+b₂²+c₂²+d₂² = q</text>
<text x="500" y="200" text-anchor="middle" class="small" fill="#888">Prime factor</text>
<rect x="750" y="110" width="200" height="100" fill="#2a9d8f" fill-opacity="0.15" stroke="#2a9d8f" stroke-width="2" rx="10"/>
<text x="850" y="135" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a9d8f">N=p·q</text>
<text x="850" y="160" text-anchor="middle" class="small">Q = q₁·q₂</text>
<text x="850" y="180" text-anchor="middle" class="small">|Q|² = |q₁|²·|q₂|² = N</text>
<text x="850" y="200" text-anchor="middle" class="small" fill="#888">Semiprime</text>
<text x="325" y="150" text-anchor="middle" font-size="24" fill="#333">×</text>
<text x="675" y="150" text-anchor="middle" font-size="24" fill="#333">=</text>
<rect x="50" y="290" width="900" height="100" fill="#f1faee" stroke="#264653" stroke-width="1" rx="8"/>
<text x="500" y="315" text-anchor="middle" font-weight="bold" fill="#264653" font-size="14">Euler Four-Square Identity (1748)</text>
<text x="500" y="340" text-anchor="middle" class="label">(a₁²+b₁²+c₁²+d₁²)(a₂²+b₂²+c₂²+d₂²) = A² + B² + C² + D²</text>
<text x="500" y="365" text-anchor="middle" class="small">where A,B,C,D are explicit bilinear combinations of the components</text>
<text x="500" y="380" text-anchor="middle" class="small" fill="#e63946">→ gcd(A, N), gcd(B, N), gcd(A±B, N), ... each may reveal p or q</text>
<rect x="50" y="410" width="900" height="110" fill="#264653" fill-opacity="0.05" stroke="#264653" rx="8"/>
<text x="500" y="440" text-anchor="middle" font-weight="bold" fill="#264653" font-size="14">Key Insight: The Factoring Reverse Problem</text>
<text x="500" y="465" text-anchor="middle" class="label" fill="#333">Given N = A² + B² + C² + D² (by Lagrange's theorem), find q₁, q₂ such that q₁·q₂ = Q.</text>
<text x="500" y="485" text-anchor="middle" class="label" fill="#333">This is equivalent to factoring N, but in the quaternion algebra ℍ(ℤ).</text>
<text x="500" y="505" text-anchor="middle" class="small" fill="#e63946">The Pythagorean quadruple tree provides a structured search space for this decomposition!</text>
</svg>