<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a48"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="45" text-anchor="middle" fill="#f0c040" font-size="22" font-weight="bold">
    The Exact Density Formula
  </text>
  <text x="400" y="72" text-anchor="middle" fill="#8899bb" font-size="14">
    Factoring-Revealing Residues for Semiprimes N = p·q
  </text>
  <rect x="180" y="90" width="440" height="60" rx="10" fill="none" stroke="#f0c040" stroke-width="2" opacity="0.6"/>
  <text x="400" y="128" text-anchor="middle" fill="white" font-size="24" font-style="italic">
    δ₁(N) = (p + q − 1) / pq
  </text>
  <g transform="translate(80, 170)">
    <line x1="0" y1="280" x2="640" y2="280" stroke="#445566" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="280" stroke="#445566" stroke-width="1"/>
    <text x="320" y="310" text-anchor="middle" fill="#8899bb" font-size="12">N (semiprime)</text>
    <text x="-20" y="140" text-anchor="middle" fill="#8899bb" font-size="12"
          transform="rotate(-90, -20, 140)">δ₁(N)</text>
    <circle cx="20" cy="22" r="5" fill="#4488ff" filter="url(#glow)" opacity="0.9"/>
    <text x="20" y="15" text-anchor="middle" fill="#6699dd" font-size="9">15</text>
    <circle cx="55" cy="40" r="5" fill="#4488ff" filter="url(#glow)" opacity="0.9"/>
    <text x="55" y="33" text-anchor="middle" fill="#6699dd" font-size="9">21</text>
    <circle cx="100" cy="92" r="5" fill="#4488ff" filter="url(#glow)" opacity="0.9"/>
    <text x="100" y="85" text-anchor="middle" fill="#6699dd" font-size="9">35</text>
    <circle cx="170" cy="132" r="5" fill="#4488ff" filter="url(#glow)" opacity="0.9"/>
    <text x="170" y="125" text-anchor="middle" fill="#6699dd" font-size="9">77</text>
    <circle cx="260" cy="170" r="4" fill="#4488ff" filter="url(#glow)" opacity="0.9"/>
    <text x="260" y="163" text-anchor="middle" fill="#6699dd" font-size="9">143</text>
    <circle cx="340" cy="192" r="4" fill="#4488ff" filter="url(#glow)" opacity="0.9"/>
    <circle cx="420" cy="210" r="4" fill="#4488ff" filter="url(#glow)" opacity="0.9"/>
    <circle cx="520" cy="237" r="4" fill="#4488ff" filter="url(#glow)" opacity="0.9"/>
    <circle cx="620" cy="252" r="3" fill="#4488ff" filter="url(#glow)" opacity="0.9"/>
    <path d="M 10,12 Q 100,120 200,175 Q 350,220 640,260"
          fill="none" stroke="#f0c040" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
    <text x="550" y="240" fill="#f0c040" font-size="11" font-style="italic">≈ 2/√N</text>
    <circle cx="450" cy="30" r="5" fill="#4488ff"/>
    <text x="462" y="35" fill="#aabbcc" font-size="11">Empirical (exact match)</text>
    <line x1="445" y1="50" x2="475" y2="50" stroke="#f0c040" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="480" y="55" fill="#aabbcc" font-size="11">Asymptotic 2/√N</text>
  </g>
  <text x="400" y="485" text-anchor="middle" fill="#556677" font-size="11">
    Formally verified: zero error across all tested semiprimes
  </text>
</svg>
