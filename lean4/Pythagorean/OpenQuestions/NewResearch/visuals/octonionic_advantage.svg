<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#1c2242"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>

  <text x="400" y="40" text-anchor="middle" fill="#f97316" font-size="22" font-weight="bold">
    The Octonionic Advantage
  </text>
  <text x="400" y="65" text-anchor="middle" fill="#9ca3af" font-size="14">
    Non-Associativity Creates Independent Factoring Channels
  </text>

  <!-- Fano plane diagram -->
  <g transform="translate(120, 100)">
    <text x="110" y="0" text-anchor="middle" fill="#f97316" font-size="14" font-weight="bold">
      Fano Plane (octonion multiplication)
    </text>

    <!-- Triangle -->
    <polygon points="110,30 20,190 200,190" fill="none" stroke="#f97316" stroke-width="2" opacity="0.6"/>

    <!-- Inner circle -->
    <circle cx="110" cy="135" r="55" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>

    <!-- Lines -->
    <line x1="110" y1="30" x2="110" y2="190" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="190" x2="155" y2="83" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>
    <line x1="200" y1="190" x2="65" y2="83" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>

    <!-- Vertices -->
    <circle cx="110" cy="30" r="12" fill="#1c2242" stroke="#f97316" stroke-width="2"/>
    <text x="110" y="35" text-anchor="middle" fill="white" font-size="11">e₁</text>

    <circle cx="20" cy="190" r="12" fill="#1c2242" stroke="#f97316" stroke-width="2"/>
    <text x="20" y="195" text-anchor="middle" fill="white" font-size="11">e₂</text>

    <circle cx="200" cy="190" r="12" fill="#1c2242" stroke="#f97316" stroke-width="2"/>
    <text x="200" y="195" text-anchor="middle" fill="white" font-size="11">e₄</text>

    <circle cx="110" cy="190" r="12" fill="#1c2242" stroke="#f97316" stroke-width="2"/>
    <text x="110" y="195" text-anchor="middle" fill="white" font-size="11">e₆</text>

    <circle cx="65" cy="83" r="12" fill="#1c2242" stroke="#f97316" stroke-width="2"/>
    <text x="65" y="88" text-anchor="middle" fill="white" font-size="11">e₇</text>

    <circle cx="155" cy="83" r="12" fill="#1c2242" stroke="#f97316" stroke-width="2"/>
    <text x="155" y="88" text-anchor="middle" fill="white" font-size="11">e₅</text>

    <circle cx="110" cy="135" r="12" fill="#1c2242" stroke="#f97316" stroke-width="2"/>
    <text x="110" y="140" text-anchor="middle" fill="white" font-size="11">e₃</text>
  </g>

  <!-- Non-commutativity demo -->
  <g transform="translate(350, 100)">
    <text x="200" y="0" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="bold">
      Non-Commutativity
    </text>

    <rect x="20" y="20" width="360" height="65" rx="8" fill="rgba(34,211,238,0.08)"
          stroke="#22d3ee" stroke-width="1"/>
    <text x="200" y="42" text-anchor="middle" fill="#67e8f9" font-size="12">A·B = (4, 8, 4, 0, 4, 0, 4, 0)</text>
    <text x="200" y="62" text-anchor="middle" fill="#67e8f9" font-size="12">B·A = (4, 2, 4, 6, 6, 0, 2, 4)</text>
    <text x="200" y="78" text-anchor="middle" fill="#a5f3fc" font-size="11">7/8 components differ!</text>

    <text x="200" y="115" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">
      Non-Associativity
    </text>

    <rect x="20" y="125" width="360" height="65" rx="8" fill="rgba(167,139,250,0.08)"
          stroke="#a78bfa" stroke-width="1"/>
    <text x="200" y="147" text-anchor="middle" fill="#c4b5fd" font-size="12">(A·B)·C = (−8, 16, 0, 0, 0, −8, 8, −8)</text>
    <text x="200" y="167" text-anchor="middle" fill="#c4b5fd" font-size="12">A·(B·C) = (−8, 16, 2, 2, 0, −2, 6, −12)</text>
    <text x="200" y="183" text-anchor="middle" fill="#ddd6fe" font-size="11">6/8 components differ!</text>
  </g>

  <!-- Channel count -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="600" height="90" rx="12" fill="rgba(249,115,22,0.08)"
          stroke="#f97316" stroke-width="2"/>
    <text x="300" y="30" text-anchor="middle" fill="#f97316" font-size="16" font-weight="bold">
      Channel Amplification
    </text>
    <text x="300" y="55" text-anchor="middle" fill="#fdba74" font-size="14">
      480 Fano orientations × 36 channels/orientation = 17,280 total channels
    </text>
    <text x="300" y="78" text-anchor="middle" fill="#9ca3af" font-size="12">
      Each association order provides genuinely independent decompositions
    </text>
  </g>

  <text x="400" y="485" text-anchor="middle" fill="#4b5563" font-size="11">
    Computationally confirmed • Norm multiplicativity preserved despite non-associativity
  </text>
</svg>
