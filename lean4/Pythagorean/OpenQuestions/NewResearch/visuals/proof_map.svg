<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg5)"/>

  <text x="450" y="40" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="bold">
    Proof Dependency Map
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#64748b" font-size="13">
    Formally verified theorem hierarchy — all sorry-free
  </text>

  <!-- Foundation layer -->
  <text x="80" y="100" fill="#475569" font-size="11" font-weight="bold">FOUNDATIONS</text>
  <rect x="50" y="110" width="170" height="35" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="135" y="133" text-anchor="middle" fill="#86efac" font-size="11">brahmagupta_fibonacci</text>

  <rect x="240" y="110" width="140" height="35" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="310" y="133" text-anchor="middle" fill="#86efac" font-size="11">peel_product_eq</text>

  <rect x="400" y="110" width="170" height="35" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="485" y="133" text-anchor="middle" fill="#86efac" font-size="11">cross_collision_dos</text>

  <rect x="590" y="110" width="180" height="35" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="680" y="133" text-anchor="middle" fill="#86efac" font-size="11">quaternion_norm_nonneg</text>

  <!-- Density layer -->
  <text x="80" y="185" fill="#475569" font-size="11" font-weight="bold">DENSITY</text>
  <rect x="50" y="195" width="200" height="35" rx="6" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="218" text-anchor="middle" fill="#93c5fd" font-size="11">inclusion_exclusion_count</text>

  <rect x="270" y="195" width="200" height="35" rx="6" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="370" y="218" text-anchor="middle" fill="#93c5fd" font-size="11">density_formula_primes</text>

  <rect x="490" y="195" width="180" height="35" rx="6" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="580" y="218" text-anchor="middle" fill="#93c5fd" font-size="11">channel_amplification</text>

  <!-- Arrows -->
  <line x1="135" y1="145" x2="150" y2="195" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <line x1="150" y1="230" x2="370" y2="195" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>

  <!-- Channel layer -->
  <text x="80" y="270" fill="#475569" font-size="11" font-weight="bold">CHANNELS</text>
  <rect x="50" y="280" width="160" height="35" rx="6" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="130" y="303" text-anchor="middle" fill="#d8b4fe" font-size="11">channel_efficiency</text>

  <rect x="230" y="280" width="180" height="35" rx="6" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="320" y="303" text-anchor="middle" fill="#d8b4fe" font-size="11">marginal_channel_gain</text>

  <rect x="430" y="280" width="200" height="35" rx="6" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1.5"/>
