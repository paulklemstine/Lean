  <text x="80" y="355" fill="#475569" font-size="11" font-weight="bold">FACTORING</text>
  <rect x="50" y="365" width="250" height="35" rx="6" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1.5"/>
  <text x="175" y="388" text-anchor="middle" fill="#fdba74" font-size="11">congruence_of_squares_factor</text>

  <rect x="320" y="365" width="200" height="35" rx="6" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1.5"/>
  <text x="420" y="388" text-anchor="middle" fill="#fdba74" font-size="11">short_vector_gcd</text>

  <rect x="540" y="365" width="220" height="35" rx="6" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1.5"/>
  <text x="650" y="388" text-anchor="middle" fill="#fdba74" font-size="11">single_success_suffices</text>

  <!-- Arrows -->
  <line x1="310" y1="145" x2="175" y2="365" stroke="#f97316" stroke-width="1" opacity="0.4"/>
  <line x1="485" y1="145" x2="175" y2="365" stroke="#f97316" stroke-width="1" opacity="0.4"/>
  <line x1="175" y1="400" x2="420" y2="440" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
  <line x1="420" y1="400" x2="420" y2="440" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
  <line x1="650" y1="400" x2="420" y2="440" stroke="#ef4444" stroke-width="1" opacity="0.4"/>

  <!-- Main theorem -->
  <rect x="250" y="435" width="400" height="50" rx="10" fill="rgba(239,68,68,0.15)"
        stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="458" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="bold">
    GRAVITATIONAL FACTORING FRAMEWORK
  </text>
  <text x="450" y="476" text-anchor="middle" fill="#fecaca" font-size="11">
    Complete formal verification campaign
  </text>

  <!-- Legend -->
  <g transform="translate(50, 510)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="rgba(34,197,94,0.3)" stroke="#22c55e" stroke-width="1"/>
    <text x="18" y="11" fill="#64748b" font-size="10">Algebraic identities</text>
    <rect x="160" y="0" width="12" height="12" rx="2" fill="rgba(59,130,246,0.3)" stroke="#3b82f6" stroke-width="1"/>
    <text x="178" y="11" fill="#64748b" font-size="10">Density theory</text>
    <rect x="280" y="0" width="12" height="12" rx="2" fill="rgba(168,85,247,0.3)" stroke="#a855f7" stroke-width="1"/>
    <text x="298" y="11" fill="#64748b" font-size="10">Channel theory</text>
    <rect x="400" y="0" width="12" height="12" rx="2" fill="rgba(249,115,22,0.3)" stroke="#f97316" stroke-width="1"/>
    <text x="418" y="11" fill="#64748b" font-size="10">Factoring principles</text>
  </g>

  <text x="450" y="580" text-anchor="middle" fill="#334155" font-size="10">
    All 24 theorems verified with standard axioms only: propext, Classical.choice, Quot.sound
  </text>
</svg>
