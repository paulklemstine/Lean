  <rect x="650" y="280" width="180" height="35" rx="6" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="740" y="303" text-anchor="middle" fill="#d8b4fe" font-size="11">fano_plane_channels</text>

