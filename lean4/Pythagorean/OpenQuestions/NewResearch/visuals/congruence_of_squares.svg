<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a28"/>
      <stop offset="100%" stop-color="#2a1a48"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>

  <text x="400" y="40" text-anchor="middle" fill="#c084fc" font-size="22" font-weight="bold">
    The Congruence of Squares Principle
  </text>
  <text x="400" y="65" text-anchor="middle" fill="#9ca3af" font-size="14">
    Foundation of the Sieve-Augmented Framework
  </text>

  <!-- Main theorem box -->
  <rect x="50" y="85" width="700" height="100" rx="12" fill="rgba(192,132,252,0.08)"
        stroke="#c084fc" stroke-width="2"/>
  <text x="400" y="115" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">
    Theorem (Formally Verified)
  </text>
  <text x="400" y="140" text-anchor="middle" fill="white" font-size="18" font-style="italic">
    If a² ≡ b² (mod N) and a ≢ ±b (mod N)
  </text>
  <text x="400" y="168" text-anchor="middle" fill="white" font-size="18" font-style="italic">
    then 1 &lt; gcd(a − b, N) &lt; N
  </text>

  <!-- Flow diagram -->
  <g transform="translate(0, 200)">
    <!-- Step 1: Generate k-tuples -->
    <rect x="30" y="20" width="160" height="60" rx="8" fill="rgba(99,102,241,0.15)"
          stroke="#6366f1" stroke-width="1.5"/>
    <text x="110" y="45" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="bold">Step 1</text>
    <text x="110" y="65" text-anchor="middle" fill="#c7d2fe" font-size="11">Generate k-tuples</text>

    <!-- Arrow -->
    <line x1="190" y1="50" x2="230" y2="50" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="225,45 235,50 225,55" fill="#6366f1"/>

    <!-- Step 2: Compute peels -->
    <rect x="240" y="20" width="160" height="60" rx="8" fill="rgba(168,85,247,0.15)"
          stroke="#a855f7" stroke-width="1.5"/>
    <text x="320" y="45" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">Step 2</text>
    <text x="320" y="65" text-anchor="middle" fill="#ddd6fe" font-size="11">Compute peel products</text>

    <!-- Arrow -->
    <polygon points="395,45 405,50 395,55" fill="#a855f7"/>
    <line x1="400" y1="50" x2="440" y2="50" stroke="#a855f7" stroke-width="2"/>

    <!-- Step 3: Find smooth -->
    <rect x="445" y="20" width="160" height="60" rx="8" fill="rgba(236,72,153,0.15)"
          stroke="#ec4899" stroke-width="1.5"/>
    <text x="525" y="45" text-anchor="middle" fill="#f9a8d4" font-size="12" font-weight="bold">Step 3</text>
    <text x="525" y="65" text-anchor="middle" fill="#fbcfe8" font-size="11">Find B-smooth products</text>

    <!-- Arrow -->
    <polygon points="600,45 610,50 600,55" fill="#ec4899"/>
    <line x1="605" y1="50" x2="640" y2="50" stroke="#ec4899" stroke-width="2"/>

    <!-- Step 4: Extract factor -->
    <rect x="645" y="20" width="130" height="60" rx="8" fill="rgba(34,197,94,0.15)"
          stroke="#22c55e" stroke-width="1.5"/>
    <text x="710" y="45" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Step 4</text>
    <text x="710" y="65" text-anchor="middle" fill="#bbf7d0" font-size="11">gcd(a−b, N)</text>

    <!-- Success box -->
    <rect x="645" y="100" width="130" height="40" rx="8" fill="rgba(34,197,94,0.25)"
          stroke="#22c55e" stroke-width="2"/>
    <text x="710" y="125" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="bold">
      FACTOR!
    </text>
    <line x1="710" y1="80" x2="710" y2="100" stroke="#22c55e" stroke-width="2"/>
    <polygon points="705,95 710,105 715,95" fill="#22c55e"/>

    <!-- Key identity -->
    <rect x="200" y="110" width="350" height="35" rx="6" fill="rgba(255,255,255,0.05)"
          stroke="#475569" stroke-width="1"/>
    <text x="375" y="133" text-anchor="middle" fill="#94a3b8" font-size="13" font-style="italic">
      (d − xⱼ)(d + xⱼ) = d² − xⱼ² = Σᵢ≠ⱼ xᵢ²
    </text>
  </g>

  <text x="400" y="435" text-anchor="middle" fill="#4b5563" font-size="11">
    Proof: If gcd(a−b,N) = 1 then N | (a+b), contradicting a ≢ −b. If gcd = N then N | (a−b), contradicting a ≢ b.
  </text>
</svg>
