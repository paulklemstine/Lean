<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <style>
      .title { font-family: 'Georgia', serif; font-size: 24px; fill: #0f172a; text-anchor: middle; font-weight: bold; }
      .section-title { font-family: 'Georgia', serif; font-size: 16px; fill: #1e40af; font-weight: bold; }
      .text { font-family: 'Georgia', serif; font-size: 13px; fill: #334155; }
      .mono { font-family: 'Courier New', monospace; font-size: 12px; fill: #475569; }
      .highlight { font-family: 'Georgia', serif; font-size: 14px; fill: #dc2626; font-weight: bold; }
      .orbit-1 { fill: #3b82f6; }
      .orbit-2 { fill: #10b981; }
      .orbit-3 { fill: #f59e0b; }
    </style>
  </defs>
  
  <rect width="900" height="700" fill="#fafafa" rx="8"/>
  
  <text x="450" y="40" class="title">The Leech Lattice Λ₂₄</text>
  <text x="450" y="62" font-family="Georgia, serif" font-size="14" fill="#64748b" text-anchor="middle">
    Dimension 24 · Kissing Number 196,560 · The Crown Jewel of Lattice Theory
  </text>
  
  <!-- Kissing Number Decomposition (pie chart approximation) -->
  <text x="200" y="100" class="section-title">Kissing Number Decomposition</text>
  
  <!-- Simplified bar chart for orbits -->
  <rect x="50" y="120" width="291" height="40" rx="4" class="orbit-1" opacity="0.8"/>
  <text x="195" y="145" font-family="Georgia, serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">
    97,152 (Type 2₂₂)
  </text>
  
  <rect x="50" y="165" width="298" height="40" rx="4" class="orbit-2" opacity="0.8"/>
  <text x="199" y="190" font-family="Georgia, serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">
    99,360 (Type 3₂₂)
  </text>
  
  <rect x="50" y="210" width="8" height="40" rx="4" class="orbit-3" opacity="0.8"/>
  <text x="80" y="235" font-family="Georgia, serif" font-size="14" fill="#92400e" font-weight="bold">
    48 (Type 0₂₂)
  </text>
  
  <text x="50" y="275" class="highlight">Total: 97,152 + 99,360 + 48 = 196,560</text>
  
  <!-- Theta Series -->
  <text x="500" y="100" class="section-title">Theta Series</text>
  <text x="500" y="125" class="mono">Θ(q) = 1 + 0·q + 196560·q² + 16773120·q³ + ...</text>
  <text x="500" y="148" class="text" style="fill: #dc2626; font-weight: bold;">
    ↑ The crucial 0: no vectors of norm² = 2 (rootless!)
  </text>
  <text x="500" y="172" class="text">
    This is the UNIQUE even unimodular lattice in dim 24
  </text>
  <text x="500" y="192" class="text">
    without vectors of norm 2 (proved by Conway, 1968)
  </text>
  
  <!-- Dimension Ladder -->
  <text x="450" y="320" class="section-title" text-anchor="middle">The Exceptional Dimension Ladder</text>
  
  <!-- Ladder visualization -->
  <g transform="translate(100, 340)">
    <!-- D₄ -->
    <rect x="0" y="0" width="100" height="60" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="50" y="22" font-family="Georgia, serif" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="bold">D₄</text>
    <text x="50" y="38" font-family="Courier, monospace" font-size="11" fill="#4f46e5" text-anchor="middle">dim 4</text>
    <text x="50" y="52" font-family="Courier, monospace" font-size="11" fill="#4f46e5" text-anchor="middle">kiss 24</text>
    
    <!-- Arrow -->
    <line x1="105" y1="30" x2="140" y2="30" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
    
    <!-- E₈ -->
    <rect x="145" y="0" width="100" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="195" y="22" font-family="Georgia, serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">E₈</text>
    <text x="195" y="38" font-family="Courier, monospace" font-size="11" fill="#2563eb" text-anchor="middle">dim 8</text>
    <text x="195" y="52" font-family="Courier, monospace" font-size="11" fill="#2563eb" text-anchor="middle">kiss 240</text>
    
    <!-- Arrow -->
    <line x1="250" y1="30" x2="285" y2="30" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- BW₁₆ -->
    <rect x="290" y="0" width="100" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="340" y="22" font-family="Georgia, serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">BW₁₆</text>
    <text x="340" y="38" font-family="Courier, monospace" font-size="11" fill="#16a34a" text-anchor="middle">dim 16</text>
    <text x="340" y="52" font-family="Courier, monospace" font-size="11" fill="#16a34a" text-anchor="middle">kiss 4320</text>
    
    <!-- Arrow -->
    <line x1="395" y1="30" x2="430" y2="30" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Λ₂₄ -->
    <rect x="435" y="0" width="120" height="60" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
    <text x="495" y="22" font-family="Georgia, serif" font-size="16" fill="#be185d" text-anchor="middle" font-weight="bold">Λ₂₄</text>
    <text x="495" y="38" font-family="Courier, monospace" font-size="11" fill="#db2777" text-anchor="middle">dim 24</text>
    <text x="495" y="52" font-family="Courier, monospace" font-size="11" fill="#db2777" text-anchor="middle">kiss 196560</text>
  </g>
  
  <!-- Golay Code Box -->
  <rect x="50" y="430" width="380" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="455" class="section-title" text-anchor="middle">The Golay Code Foundation</text>
  <text x="70" y="478" class="mono">Code: [24, 12, 8] (binary, self-dual, doubly-even)</text>
  <text x="70" y="498" class="mono">Codewords: 2¹² = 4096</text>
  <text x="70" y="518" class="mono">Perfect: achieves Hamming bound</text>
  <text x="70" y="538" class="mono">Aut(G₂₄) = M₂₄ (Mathieu group)</text>
  
  <!-- Quantum Code Box -->
  <rect x="470" y="430" width="380" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="660" y="455" class="section-title" text-anchor="middle" style="fill: #6d28d9;">Quantum Error Correction</text>
  <text x="490" y="478" class="mono">CSS Code: [[24, 0, 8]]</text>
  <text x="490" y="498" class="mono">Physical qubits: 24</text>
  <text x="490" y="518" class="mono">Errors corrected: ⌊(8-1)/2⌋ = 3</text>
  <text x="490" y="538" class="mono">Construction: CSS from self-dual Golay</text>
  
  <!-- Connection to Monster -->
  <rect x="150" y="580" width="600" height="90" rx="8" fill="#1e293b"/>
  <text x="450" y="607" font-family="Georgia, serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold">
    Connection to the Monster Group
  </text>
  <text x="450" y="630" font-family="Georgia, serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    M₂₄ ≤ Co₁ ≤ Co₀ = Aut(Λ₂₄) → Monster M via V♮ (Moonshine module)
  </text>
  <text x="450" y="653" font-family="Georgia, serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    The Leech lattice is the bridge between coding theory and the Monster
  </text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
