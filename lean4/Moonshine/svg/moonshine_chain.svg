<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <style>
      .box { rx: 12; ry: 12; stroke-width: 2.5; }
      .box-coding { fill: #dbeafe; stroke: #2563eb; }
      .box-lattice { fill: #dcfce7; stroke: #16a34a; }
      .box-voa { fill: #fef3c7; stroke: #d97706; }
      .box-monster { fill: #fce7f3; stroke: #db2777; }
      .box-quantum { fill: #f3e8ff; stroke: #7c3aed; }
      .box-title { font-family: 'Georgia', serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .box-text { font-family: 'Georgia', serif; font-size: 12px; text-anchor: middle; fill: #374151; }
      .box-param { font-family: 'Courier New', monospace; font-size: 11px; text-anchor: middle; fill: #6b7280; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrowhead); }
      .arrow-quantum { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 6,3; marker-end: url(#arrowhead-purple); }
      .title { font-family: 'Georgia', serif; font-size: 26px; fill: #0f172a; text-anchor: middle; font-weight: bold; }
      .subtitle { font-family: 'Georgia', serif; font-size: 14px; fill: #64748b; text-anchor: middle; }
      .label { font-family: 'Georgia', serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>
  
  <rect width="900" height="650" fill="#fafafa" rx="8"/>
  
  <!-- Title -->
  <text x="450" y="40" class="title">The Moonshine Chain</text>
  <text x="450" y="62" class="subtitle">From Error-Correcting Codes to the Monster Group</text>
  
  <!-- Level 1: Golay Code -->
  <rect x="300" y="85" width="300" height="80" class="box box-coding"/>
  <text x="450" y="112" class="box-title" fill="#1e40af">Binary Golay Code G₂₄</text>
  <text x="450" y="132" class="box-text">Parameters: [24, 12, 8]</text>
  <text x="450" y="150" class="box-param">Aut(G₂₄) = M₂₄ (|M₂₄| = 244,823,040)</text>
  
  <!-- Arrow 1→2 -->
  <path d="M 450 165 L 450 195" class="arrow"/>
  <text x="510" y="185" class="label">Construction A</text>
  
  <!-- Level 2: Leech Lattice -->
  <rect x="300" y="195" width="300" height="80" class="box box-lattice"/>
  <text x="450" y="222" class="box-title" fill="#15803d">Leech Lattice Λ₂₄</text>
  <text x="450" y="242" class="box-text">dim 24, kissing 196560, no roots</text>
  <text x="450" y="260" class="box-param">Aut(Λ₂₄) = Co₀ (|Co₀| ≈ 8.3 × 10¹⁸)</text>
  
  <!-- Arrow 2→3 -->
  <path d="M 450 275 L 450 305" class="arrow"/>
  <text x="530" y="295" class="label">Vertex Operator Algebra</text>
  
  <!-- Level 3: VOA -->
  <rect x="300" y="305" width="300" height="80" class="box box-voa"/>
  <text x="450" y="332" class="box-title" fill="#b45309">Moonshine Module V♮</text>
  <text x="450" y="352" class="box-text">Central charge c = 24</text>
  <text x="450" y="370" class="box-param">Z₂-orbifold of Leech lattice VOA</text>
  
  <!-- Arrow 3→4 -->
  <path d="M 450 385 L 450 415" class="arrow"/>
  <text x="540" y="405" class="label">Automorphism group</text>
  
  <!-- Level 4: Monster -->
  <rect x="275" y="415" width="350" height="90" class="box box-monster"/>
  <text x="450" y="442" class="box-title" fill="#be185d">Monster Group M</text>
  <text x="450" y="462" class="box-text">|M| ≈ 8.08 × 10⁵³ (largest sporadic simple group)</text>
  <text x="450" y="480" class="box-param">194 conjugacy classes, smallest rep dim = 196883</text>
  <text x="450" y="495" class="box-param">j(τ) = q⁻¹ + 744 + 196884q + ... (Moonshine!)</text>
  
  <!-- Quantum Code Branch -->
  <rect x="50" y="195" width="200" height="80" class="box box-quantum"/>
  <text x="150" y="222" class="box-title" fill="#6d28d9">Quantum Code</text>
  <text x="150" y="242" class="box-text">[[24, 0, 8]] from CSS</text>
  <text x="150" y="260" class="box-param">Corrects 3 errors</text>
  
  <path d="M 300 235 L 250 235" class="arrow-quantum"/>
  <text x="275" y="225" class="label" style="fill: #7c3aed;">self-dual</text>
  
  <!-- E8 Branch -->
  <rect x="650" y="195" width="200" height="80" class="box box-quantum"/>
  <text x="750" y="222" class="box-title" fill="#6d28d9">E₈ Code</text>
  <text x="750" y="242" class="box-text">[[8, 0, 4]] quantum</text>
  <text x="750" y="260" class="box-param">240 roots, self-dual</text>
  
  <path d="M 600 235 L 650 235" class="arrow-quantum"/>
  <text x="625" y="225" class="label" style="fill: #7c3aed;">sublattice</text>
  
  <!-- Moonshine equation -->
  <rect x="100" y="540" width="700" height="75" rx="8" fill="#1e293b"/>
  <text x="450" y="567" font-family="Georgia, serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold">
    Monstrous Moonshine (Borcherds, 1992 — Fields Medal)
  </text>
  <text x="450" y="590" font-family="Courier New, monospace" font-size="13" fill="#a5b4fc" text-anchor="middle">
    196884 = 1 + 196883    |    21493760 = 1 + 196883 + 21296876
  </text>
  <text x="450" y="607" font-family="Georgia, serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    Every j-coefficient = sum of Monster irrep dimensions
  </text>
</svg>
