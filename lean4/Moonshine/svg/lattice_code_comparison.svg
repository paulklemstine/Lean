<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850" height="500">
  <defs>
    <style>
      .title { font-family: 'Georgia', serif; font-size: 22px; fill: #0f172a; text-anchor: middle; font-weight: bold; }
      .header { font-family: 'Georgia', serif; font-size: 13px; fill: #64748b; font-weight: bold; }
      .cell { font-family: 'Courier New', monospace; font-size: 13px; fill: #334155; }
      .cell-highlight { font-family: 'Courier New', monospace; font-size: 13px; fill: #dc2626; font-weight: bold; }
      .bar { rx: 3; ry: 3; opacity: 0.85; }
      .bar-label { font-family: 'Georgia', serif; font-size: 11px; fill: white; text-anchor: middle; font-weight: bold; }
    </style>
  </defs>
  
  <rect width="850" height="500" fill="#fafafa" rx="8"/>
  
  <text x="425" y="35" class="title">Lattice Codes: From D₄ to the Leech Lattice</text>
  <text x="425" y="55" font-family="Georgia, serif" font-size="13" fill="#64748b" text-anchor="middle">
    Kissing numbers and quantum error correction across dimensions
  </text>
  
  <!-- Table -->
  <g transform="translate(40, 75)">
    <!-- Headers -->
    <text x="40" y="0" class="header">Lattice</text>
    <text x="140" y="0" class="header">Dim</text>
    <text x="220" y="0" class="header">Kissing #</text>
    <text x="340" y="0" class="header">Min ‖·‖²</text>
    <text x="440" y="0" class="header">Quantum</text>
    <text x="560" y="0" class="header">Errors</text>
    <text x="660" y="0" class="header">Classical Code</text>
    
    <line x1="0" y1="10" x2="770" y2="10" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Row 1: D₄ -->
    <text x="40" y="35" class="cell">D₄</text>
    <text x="140" y="35" class="cell">4</text>
    <text x="220" y="35" class="cell">24</text>
    <text x="340" y="35" class="cell">2</text>
    <text x="440" y="35" class="cell">[[4,0,2]]</text>
    <text x="560" y="35" class="cell">0</text>
    <text x="660" y="35" class="cell">Hexacode</text>
    
    <!-- Row 2: E₈ -->
    <text x="40" y="65" class="cell" style="font-weight: bold; fill: #2563eb;">E₈</text>
    <text x="140" y="65" class="cell">8</text>
    <text x="220" y="65" class="cell">240</text>
    <text x="340" y="65" class="cell">2</text>
    <text x="440" y="65" class="cell">[[8,0,4]]</text>
    <text x="560" y="65" class="cell">1</text>
    <text x="660" y="65" class="cell">Hamming [8,4,4]</text>
    
    <!-- Row 3: BW₁₆ -->
    <text x="40" y="95" class="cell">BW₁₆</text>
    <text x="140" y="95" class="cell">16</text>
    <text x="220" y="95" class="cell">4,320</text>
    <text x="340" y="95" class="cell">4</text>
    <text x="440" y="95" class="cell">[[16,0,4]]</text>
    <text x="560" y="95" class="cell">1</text>
    <text x="660" y="95" class="cell">Reed-Muller</text>
    
    <!-- Row 4: Λ₂₄ -->
    <rect x="0" y="107" width="770" height="25" rx="4" fill="#fef2f2" opacity="0.5"/>
    <text x="40" y="125" class="cell-highlight">Λ₂₄</text>
    <text x="140" y="125" class="cell-highlight">24</text>
    <text x="220" y="125" class="cell-highlight">196,560</text>
    <text x="340" y="125" class="cell-highlight">4</text>
    <text x="440" y="125" class="cell-highlight">[[24,0,8]]</text>
    <text x="560" y="125" class="cell-highlight">3</text>
    <text x="660" y="125" class="cell-highlight">Golay [24,12,8]</text>
  </g>
  
  <!-- Kissing Number Bar Chart -->
  <text x="425" y="240" font-family="Georgia, serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="bold">
    Kissing Number Comparison (log scale)
  </text>
  
  <g transform="translate(100, 260)">
    <!-- D₄: 24 → log₁₀ ≈ 1.38 → bar width ~46 -->
    <rect x="0" y="0" width="46" height="35" class="bar" fill="#94a3b8"/>
    <text x="23" y="22" class="bar-label">24</text>
    <text x="-10" y="22" font-family="Georgia, serif" font-size="12" fill="#475569" text-anchor="end">D₄</text>
    
    <!-- E₈: 240 → log₁₀ ≈ 2.38 → bar width ~79 -->
    <rect x="0" y="45" width="79" height="35" class="bar" fill="#3b82f6"/>
    <text x="40" y="67" class="bar-label">240</text>
    <text x="-10" y="67" font-family="Georgia, serif" font-size="12" fill="#475569" text-anchor="end">E₈</text>
    
    <!-- BW₁₆: 4320 → log₁₀ ≈ 3.64 → bar width ~121 -->
    <rect x="0" y="90" width="121" height="35" class="bar" fill="#10b981"/>
    <text x="60" y="112" class="bar-label">4,320</text>
    <text x="-10" y="112" font-family="Georgia, serif" font-size="12" fill="#475569" text-anchor="end">BW₁₆</text>
    
    <!-- Λ₂₄: 196560 → log₁₀ ≈ 5.29 → bar width ~176 -->
    <rect x="0" y="135" width="530" height="40" class="bar" fill="#dc2626"/>
    <text x="265" y="160" class="bar-label" style="font-size: 14px;">196,560</text>
    <text x="-10" y="160" font-family="Georgia, serif" font-size="14" fill="#dc2626" text-anchor="end" font-weight="bold">Λ₂₄</text>
  </g>
  
  <!-- Bottom note -->
  <text x="425" y="465" font-family="Georgia, serif" font-size="12" fill="#64748b" text-anchor="middle">
    The Leech lattice has 819× more nearest neighbors than E₈ (196560/240 = 819)
  </text>
  <text x="425" y="485" font-family="Georgia, serif" font-size="12" fill="#64748b" text-anchor="middle">
    All lattices yield quantum codes via CSS construction from self-dual classical codes
  </text>
</svg>
