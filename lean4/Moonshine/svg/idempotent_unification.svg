<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      .center-box { fill: #fef3c7; stroke: #d97706; stroke-width: 3; rx: 50; ry: 50; }
      .petal { stroke-width: 2; opacity: 0.9; }
      .petal-text { font-family: 'Georgia', serif; font-size: 13px; fill: #1e293b; text-anchor: middle; }
      .petal-title { font-family: 'Georgia', serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .center-text { font-family: 'Georgia', serif; font-size: 20px; fill: #92400e; text-anchor: middle; font-weight: bold; }
      .center-eq { font-family: 'Courier New', monospace; font-size: 18px; fill: #b45309; text-anchor: middle; }
      .title { font-family: 'Georgia', serif; font-size: 24px; fill: #0f172a; text-anchor: middle; font-weight: bold; }
      .connector { stroke: #d97706; stroke-width: 2; stroke-dasharray: 8,4; opacity: 0.6; }
    </style>
  </defs>
  
  <rect width="900" height="600" fill="#fafafa" rx="8"/>
  
  <text x="450" y="35" class="title">The Idempotent Unification: f ∘ f = f</text>
  <text x="450" y="55" font-family="Georgia, serif" font-size="13" fill="#64748b" text-anchor="middle">
    Five frontiers connected by a single equation
  </text>
  
  <!-- Center circle -->
  <ellipse cx="450" cy="310" rx="90" ry="60" class="center-box"/>
  <text x="450" y="300" class="center-text">Idempotent</text>
  <text x="450" y="325" class="center-eq">f ∘ f = f</text>
  
  <!-- Connectors -->
  <line x1="450" y1="250" x2="450" y2="130" class="connector"/>
  <line x1="365" y1="280" x2="190" y2="180" class="connector"/>
  <line x1="535" y1="280" x2="710" y2="180" class="connector"/>
  <line x1="380" y1="350" x2="190" y2="440" class="connector"/>
  <line x1="520" y1="350" x2="710" y2="440" class="connector"/>
  
  <!-- Petal 1: Tropical NAS (top) -->
  <rect x="330" y="75" width="240" height="75" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="100" class="petal-title" fill="#1e40af">🧠 Tropical NAS</text>
  <text x="450" y="118" class="petal-text">ReLU(ReLU(x)) = ReLU(x)</text>
  <text x="450" y="138" class="petal-text" style="font-size: 11px; fill: #6b7280;">Conv, Transformer, ResNet scoring</text>
  
  <!-- Petal 2: Quantum Annealing (top-left) -->
  <rect x="50" y="120" width="240" height="75" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="145" class="petal-title" fill="#15803d">⚛️ Quantum Annealing</text>
  <text x="170" y="163" class="petal-text">max(x, x) = x</text>
  <text x="170" y="183" class="petal-text" style="font-size: 11px; fill: #6b7280;">Logarithmic cooling, Boltzmann limit</text>
  
  <!-- Petal 3: Persistent Homology (top-right) -->
  <rect x="610" y="120" width="240" height="75" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="730" y="145" class="petal-title" fill="#be185d">📊 Persistence</text>
  <text x="730" y="163" class="petal-text">max(|a|, |b|) tropical metric</text>
  <text x="730" y="183" class="petal-text" style="font-size: 11px; fill: #6b7280;">O(n³) column reduction, stability</text>
  
  <!-- Petal 4: E8 Codes (bottom-left) -->
  <rect x="50" y="395" width="240" height="75" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="170" y="420" class="petal-title" fill="#3730a3">💎 E₈ Quantum Codes</text>
  <text x="170" y="438" class="petal-text">π ∘ π = π (lattice projection)</text>
  <text x="170" y="458" class="petal-text" style="font-size: 11px; fill: #6b7280;">240 roots, self-dual CSS [[8,0,4]]</text>
  
  <!-- Petal 5: Leech Lattice (bottom-right) -->
  <rect x="610" y="395" width="240" height="75" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="730" y="420" class="petal-title" fill="#92400e">🌟 Leech Lattice</text>
  <text x="730" y="438" class="petal-text">Golay code projection</text>
  <text x="730" y="458" class="petal-text" style="font-size: 11px; fill: #6b7280;">dim 24, kiss 196560, [[24,0,8]]</text>
  
  <!-- Bottom banner -->
  <rect x="100" y="520" width="700" height="55" rx="8" fill="#1e293b"/>
  <text x="450" y="543" font-family="Georgia, serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="bold">
    Grand Unification Theorem: ∀ f, (f ∘ f = f) → ∀ x, f(f(x)) = f(x)
  </text>
  <text x="450" y="563" font-family="Georgia, serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Machine-verified in Lean 4 with Mathlib · Zero sorry statements
  </text>
</svg>
