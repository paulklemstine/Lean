<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  
  <rect width="900" height="650" fill="url(#bg)" rx="10"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Cross-Cutting Themes in Mathematics
  </text>
  <text x="450" y="65" text-anchor="middle" font-size="14" fill="#7f8c8d">
    65 Formally Verified Theorems Connecting Three Deep Structural Principles
  </text>

  <!-- Central Triangle -->
  <!-- Edges -->
  <line x1="450" y1="130" x2="180" y2="430" stroke="#bdc3c7" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="450" y1="130" x2="720" y2="430" stroke="#bdc3c7" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="180" y1="430" x2="720" y2="430" stroke="#bdc3c7" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Edge Labels -->
  <g transform="rotate(-55, 310, 270)">
    <text x="310" y="265" text-anchor="middle" font-size="11" fill="#e74c3c" font-style="italic">max(x,x) = x</text>
    <text x="310" y="282" text-anchor="middle" font-size="11" fill="#e74c3c" font-style="italic">ReLU² = ReLU</text>
  </g>
  <g transform="rotate(55, 590, 270)">
    <text x="590" y="265" text-anchor="middle" font-size="11" fill="#27ae60" font-style="italic">P² = P</text>
    <text x="590" y="282" text-anchor="middle" font-size="11" fill="#27ae60" font-style="italic">Measurement</text>
  </g>
  <text x="450" y="460" text-anchor="middle" font-size="11" fill="#2980b9" font-style="italic">LSE_ε → max as ε → 0⁺</text>

  <!-- Node 1: Idempotent Collapse -->
  <g filter="url(#shadow)">
    <rect x="340" y="100" width="220" height="80" rx="15" fill="#fff5f5" stroke="#e74c3c" stroke-width="2.5"/>
    <text x="450" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">Idempotent Collapse</text>
    <text x="450" y="150" text-anchor="middle" font-size="12" fill="#e74c3c">f(f(x)) = f(x)</text>
    <text x="450" y="168" text-anchor="middle" font-size="10" fill="#999">16 theorems proved</text>
  </g>

  <!-- Node 2: Tropical Algebra -->
  <g filter="url(#shadow)">
    <rect x="70" y="395" width="220" height="80" rx="15" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.5"/>
    <text x="180" y="425" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">Tropical Algebra</text>
    <text x="180" y="445" text-anchor="middle" font-size="12" fill="#2980b9">(ℝ, max, +) semiring</text>
    <text x="180" y="463" text-anchor="middle" font-size="10" fill="#999">18 theorems proved</text>
  </g>

  <!-- Node 3: Quantum/Smooth -->
  <g filter="url(#shadow)">
    <rect x="610" y="395" width="220" height="80" rx="15" fill="#eafaf1" stroke="#27ae60" stroke-width="2.5"/>
    <text x="720" y="425" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e8449">Quantum / Smooth</text>
    <text x="720" y="445" text-anchor="middle" font-size="12" fill="#27ae60">LogSumExp bridge</text>
    <text x="720" y="463" text-anchor="middle" font-size="10" fill="#999">Softmax, attention</text>
  </g>

  <!-- Center: Berggren Tree -->
  <g filter="url(#shadow)">
    <rect x="370" y="300" width="160" height="70" rx="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2.5"/>
    <text x="450" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#d68910">Berggren Tree</text>
    <text x="450" y="348" text-anchor="middle" font-size="11" fill="#f39c12">O(2,1) structure</text>
    <text x="450" y="363" text-anchor="middle" font-size="10" fill="#999">17 theorems</text>
  </g>

  <!-- Application boxes at bottom -->
  <g>
    <rect x="40" y="520" width="160" height="55" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="1.5"/>
    <text x="120" y="543" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2185b">Neural Networks</text>
    <text x="120" y="560" text-anchor="middle" font-size="9" fill="#e91e63">ReLU, convergence</text>
  </g>
  <g>
    <rect x="220" y="520" width="160" height="55" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/>
    <text x="300" y="543" text-anchor="middle" font-size="11" font-weight="bold" fill="#283593">Optimization</text>
    <text x="300" y="560" text-anchor="middle" font-size="9" fill="#3f51b5">Tropical LP, annealing</text>
  </g>
  <g>
    <rect x="400" y="520" width="160" height="55" rx="8" fill="#e0f2f1" stroke="#009688" stroke-width="1.5"/>
    <text x="480" y="543" text-anchor="middle" font-size="11" font-weight="bold" fill="#00695c">Quantum Computing</text>
    <text x="480" y="560" text-anchor="middle" font-size="9" fill="#009688">Gate synthesis, codes</text>
  </g>
  <g>
    <rect x="580" y="520" width="160" height="55" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
    <text x="660" y="543" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Cryptography</text>
    <text x="660" y="560" text-anchor="middle" font-size="9" fill="#ff9800">Tree-based protocols</text>
  </g>
  <g>
    <rect x="760" y="520" width="120" height="55" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
    <text x="820" y="543" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">Physics</text>
    <text x="820" y="560" text-anchor="middle" font-size="9" fill="#9c27b0">Lorentz, spacetime</text>
  </g>

  <!-- Connections label -->
  <text x="450" y="510" text-anchor="middle" font-size="12" fill="#7f8c8d" font-weight="bold">
    14 cross-domain connection theorems
  </text>

  <!-- Lean 4 badge -->
  <g>
    <rect x="730" y="80" width="140" height="45" rx="8" fill="#2c3e50" stroke="none"/>
    <text x="800" y="100" text-anchor="middle" font-size="11" fill="white" font-weight="bold">✓ Lean 4 + Mathlib</text>
    <text x="800" y="116" text-anchor="middle" font-size="10" fill="#95a5a6">0 sorry remaining</text>
  </g>

  <!-- Footer -->
  <text x="450" y="630" text-anchor="middle" font-size="10" fill="#adb5bd">
    All theorems machine-verified in Lean 4 v4.28.0 with Mathlib. No axioms beyond propext, Classical.choice, Quot.sound.
  </text>
</svg>
