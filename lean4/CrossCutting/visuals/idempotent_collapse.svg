<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fce4ec"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg2)" rx="10"/>
  
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">
    The Idempotent Collapse Principle
  </text>
  <text x="400" y="58" text-anchor="middle" font-size="28" fill="#e74c3c" font-weight="bold" font-style="italic">
    f(f(x)) = f(x)
  </text>

  <!-- Central equation -->
  <rect x="280" y="75" width="240" height="40" rx="20" fill="#e74c3c" opacity="0.1" stroke="#e74c3c" stroke-width="1"/>
  <text x="400" y="100" text-anchor="middle" font-size="14" fill="#c0392b">"Convergence in one step"</text>

  <!-- Domain circles arranged in a ring -->
  <!-- Neural Networks -->
  <g transform="translate(140, 200)">
    <circle cx="0" cy="0" r="55" fill="#fff" stroke="#e91e63" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2185b">Neural</text>
    <text x="0" y="2" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2185b">Networks</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#e91e63">ReLU(ReLU(x))</text>
    <text x="0" y="35" text-anchor="middle" font-size="9" fill="#e91e63">= ReLU(x)</text>
  </g>

  <!-- Linear Algebra -->
  <g transform="translate(340, 180)">
    <circle cx="0" cy="0" r="55" fill="#fff" stroke="#9c27b0" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b1fa2">Linear</text>
    <text x="0" y="2" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b1fa2">Algebra</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#9c27b0">P² = P</text>
    <text x="0" y="35" text-anchor="middle" font-size="9" fill="#9c27b0">range ⊕ ker</text>
  </g>

  <!-- Quantum Mechanics -->
  <g transform="translate(540, 180)">
    <circle cx="0" cy="0" r="55" fill="#fff" stroke="#2196f3" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">Quantum</text>
    <text x="0" y="2" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">Mechanics</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#2196f3">Measurement</text>
    <text x="0" y="35" text-anchor="middle" font-size="9" fill="#2196f3">collapse</text>
  </g>

  <!-- Tropical -->
  <g transform="translate(700, 200)">
    <circle cx="0" cy="0" r="55" fill="#fff" stroke="#ff9800" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Tropical</text>
    <text x="0" y="2" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Algebra</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#ff9800">max(x,x) = x</text>
    <text x="0" y="35" text-anchor="middle" font-size="9" fill="#ff9800">min(x,x) = x</text>
  </g>

  <!-- Lattice Theory -->
  <g transform="translate(200, 360)">
    <circle cx="0" cy="0" r="55" fill="#fff" stroke="#4caf50" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">Lattice</text>
    <text x="0" y="2" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">Theory</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#4caf50">(a⊓·)∘(a⊓·)</text>
    <text x="0" y="35" text-anchor="middle" font-size="9" fill="#4caf50">= a⊓·</text>
  </g>

  <!-- Topology -->
  <g transform="translate(420, 370)">
    <circle cx="0" cy="0" r="55" fill="#fff" stroke="#009688" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-size="11" font-weight="bold" fill="#00695c">Topology</text>
    <text x="0" y="5" text-anchor="middle" font-size="9" fill="#009688">Retractions</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#009688">r∘i = id ⟹</text>
    <text x="0" y="35" text-anchor="middle" font-size="9" fill="#009688">(i∘r)² = i∘r</text>
  </g>

  <!-- Finite Sets -->
  <g transform="translate(640, 360)">
    <circle cx="0" cy="0" r="55" fill="#fff" stroke="#795548" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-size="11" font-weight="bold" fill="#4e342e">Finite Sets</text>
    <text x="0" y="5" text-anchor="middle" font-size="9" fill="#795548">#image =</text>
    <text x="0" y="22" text-anchor="middle" font-size="9" fill="#795548">#fixed points</text>
    <text x="0" y="35" text-anchor="middle" font-size="9" fill="#795548">n·n=n ⟹ n∈{0,1}</text>
  </g>

  <!-- Connecting lines to center -->
  <line x1="195" y1="200" x2="285" y2="180" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="485" y1="180" x2="595" y2="180" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="255" y1="360" x2="365" y2="370" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="475" y1="370" x2="585" y2="360" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Theorem count -->
  <rect x="300" y="465" width="200" height="25" rx="12" fill="#c0392b"/>
  <text x="400" y="483" text-anchor="middle" font-size="12" fill="white" font-weight="bold">
    16 theorems · 0 sorry
  </text>
</svg>
