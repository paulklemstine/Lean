<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <linearGradient id="nodeA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
    <linearGradient id="nodeB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48dbfb"/>
      <stop offset="100%" style="stop-color:#0abde3"/>
    </linearGradient>
    <linearGradient id="nodeC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#feca57"/>
      <stop offset="100%" style="stop-color:#ff9f43"/>
    </linearGradient>
    <linearGradient id="root" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#e0e0ff" font-size="28" font-weight="bold" filter="url(#glow)">
    The Berggren Tree of Primitive Pythagorean Triples
  </text>
  <text x="600" y="82" text-anchor="middle" fill="#a0a0d0" font-size="14">
    Every primitive Pythagorean triple appears exactly once — generated by three matrix transformations
  </text>

  <!-- Edges (drawn first, behind nodes) -->
  <!-- Root to depth 1 -->
  <line x1="600" y1="155" x2="200" y2="295" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="155" x2="600" y2="295" stroke="#48dbfb" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="155" x2="1000" y2="295" stroke="#feca57" stroke-width="2" opacity="0.6"/>

  <!-- Depth 1 to depth 2 -->
  <!-- A children -->
  <line x1="200" y1="340" x2="80" y2="470" stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="340" x2="200" y2="470" stroke="#48dbfb" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="340" x2="320" y2="470" stroke="#feca57" stroke-width="1.5" opacity="0.4"/>

  <!-- B children -->
  <line x1="600" y1="340" x2="480" y2="470" stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"/>
  <line x1="600" y1="340" x2="600" y2="470" stroke="#48dbfb" stroke-width="1.5" opacity="0.4"/>
  <line x1="600" y1="340" x2="720" y2="470" stroke="#feca57" stroke-width="1.5" opacity="0.4"/>

  <!-- C children -->
  <line x1="1000" y1="340" x2="880" y2="470" stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"/>
  <line x1="1000" y1="340" x2="1000" y2="470" stroke="#48dbfb" stroke-width="1.5" opacity="0.4"/>
  <line x1="1000" y1="340" x2="1120" y2="470" stroke="#feca57" stroke-width="1.5" opacity="0.4"/>

  <!-- Root node: (3, 4, 5) -->
  <g filter="url(#shadow)">
    <rect x="530" y="110" width="140" height="50" rx="25" fill="url(#root)" opacity="0.95"/>
    <text x="600" y="142" text-anchor="middle" fill="white" font-size="20" font-weight="bold">(3, 4, 5)</text>
  </g>

  <!-- Branch labels -->
  <text x="370" y="215" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="bold">B₁</text>
  <text x="610" y="215" text-anchor="start" fill="#48dbfb" font-size="16" font-weight="bold">B₂</text>
  <text x="830" y="215" text-anchor="middle" fill="#feca57" font-size="16" font-weight="bold">B₃</text>

  <!-- Depth 1 nodes -->
  <g filter="url(#shadow)">
    <rect x="120" y="300" width="160" height="45" rx="22" fill="url(#nodeA)" opacity="0.9"/>
    <text x="200" y="328" text-anchor="middle" fill="white" font-size="17" font-weight="bold">(5, 12, 13)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="300" width="180" height="45" rx="22" fill="url(#nodeB)" opacity="0.9"/>
    <text x="600" y="328" text-anchor="middle" fill="white" font-size="17" font-weight="bold">(21, 20, 29)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="300" width="180" height="45" rx="22" fill="url(#nodeC)" opacity="0.9"/>
    <text x="1000" y="328" text-anchor="middle" fill="white" font-size="17" font-weight="bold">(15, 8, 17)</text>
  </g>

  <!-- Depth 2 nodes (A children) -->
  <g filter="url(#shadow)">
    <rect x="15" y="475" width="130" height="40" rx="20" fill="url(#nodeA)" opacity="0.8"/>
    <text x="80" y="501" text-anchor="middle" fill="white" font-size="14">(7, 24, 25)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="130" y="475" width="140" height="40" rx="20" fill="url(#nodeB)" opacity="0.8"/>
    <text x="200" y="501" text-anchor="middle" fill="white" font-size="14">(55, 48, 73)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="255" y="475" width="130" height="40" rx="20" fill="url(#nodeC)" opacity="0.8"/>
    <text x="320" y="501" text-anchor="middle" fill="white" font-size="14">(45, 28, 53)</text>
  </g>

  <!-- Depth 2 nodes (B children) -->
  <g filter="url(#shadow)">
    <rect x="405" y="475" width="150" height="40" rx="20" fill="url(#nodeA)" opacity="0.8"/>
    <text x="480" y="501" text-anchor="middle" fill="white" font-size="14">(39, 80, 89)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="475" width="160" height="40" rx="20" fill="url(#nodeB)" opacity="0.8"/>
    <text x="600" y="501" text-anchor="middle" fill="white" font-size="14">(119, 120, 169)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="690" y="475" width="150" height="40" rx="20" fill="url(#nodeC)" opacity="0.8"/>
    <text x="765" y="501" text-anchor="middle" fill="white" font-size="14">(77, 36, 85)</text>
  </g>

  <!-- Depth 2 nodes (C children) -->
  <g filter="url(#shadow)">
    <rect x="808" y="475" width="145" height="40" rx="20" fill="url(#nodeA)" opacity="0.8"/>
    <text x="880" y="501" text-anchor="middle" fill="white" font-size="14">(33, 56, 65)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="928" y="475" width="145" height="40" rx="20" fill="url(#nodeB)" opacity="0.8"/>
    <text x="1000" y="501" text-anchor="middle" fill="white" font-size="14">(65, 72, 97)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1048" y="475" width="145" height="40" rx="20" fill="url(#nodeC)" opacity="0.8"/>
    <text x="1120" y="501" text-anchor="middle" fill="white" font-size="14">(35, 12, 37)</text>
  </g>

  <!-- "..." indicators -->
  <text x="200" y="550" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="600" y="550" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="1000" y="550" text-anchor="middle" fill="#888" font-size="20">⋮</text>

  <!-- Legend -->
  <g transform="translate(50, 600)">
    <rect width="1100" height="280" rx="15" fill="#0d0d35" stroke="#333366" stroke-width="1" opacity="0.8"/>

    <text x="550" y="30" text-anchor="middle" fill="#c0c0ff" font-size="18" font-weight="bold">
      Key Properties (Machine-Verified in Lean 4)
    </text>

    <!-- Column 1 -->
    <text x="30" y="65" fill="#10ac84" font-size="14">✓</text>
    <text x="50" y="65" fill="#e0e0ff" font-size="14">Pythagorean preservation: a² + b² = c² for all nodes</text>

    <text x="30" y="95" fill="#10ac84" font-size="14">✓</text>
    <text x="50" y="95" fill="#e0e0ff" font-size="14">Primitivity preservation: gcd(a,b) = 1 for all nodes</text>

    <text x="30" y="125" fill="#10ac84" font-size="14">✓</text>
    <text x="50" y="125" fill="#e0e0ff" font-size="14">Lorentz form: Q(a,b,c) = a² + b² - c² = 0 (null cone)</text>

    <text x="30" y="155" fill="#10ac84" font-size="14">✓</text>
    <text x="50" y="155" fill="#e0e0ff" font-size="14">Determinant asymmetry: det(B₁) = det(B₃) = 1, det(B₂) = -1</text>

    <!-- Column 2 -->
    <text x="570" y="65" fill="#10ac84" font-size="14">✓</text>
    <text x="590" y="65" fill="#e0e0ff" font-size="14">Forward-inverse cancellation: B⁻¹·B = I</text>

    <text x="570" y="95" fill="#10ac84" font-size="14">✓</text>
    <text x="590" y="95" fill="#e0e0ff" font-size="14">Pell recurrence: c_{n+1} = 6c_n - c_{n-1} on B-branch</text>

    <text x="570" y="125" fill="#10ac84" font-size="14">✓</text>
    <text x="590" y="125" fill="#e0e0ff" font-size="14">Hypotenuse growth: c(child) > c(parent)</text>

    <text x="570" y="155" fill="#10ac84" font-size="14">✓</text>
    <text x="590" y="155" fill="#e0e0ff" font-size="14">Euclid parametrization: (m²-n², 2mn, m²+n²)</text>

    <!-- Matrix formulas -->
    <text x="30" y="200" fill="#a0a0d0" font-size="13">
      B₁: (a,b,c) → (a−2b+2c, 2a−b+2c, 2a−2b+3c)
    </text>
    <text x="30" y="225" fill="#a0a0d0" font-size="13">
      B₂: (a,b,c) → (a+2b+2c, 2a+b+2c, 2a+2b+3c)
    </text>
    <text x="30" y="250" fill="#a0a0d0" font-size="13">
      B₃: (a,b,c) → (−a+2b+2c, −2a+b+2c, −2a+2b+3c)
    </text>

    <text x="570" y="200" fill="#a0a0d0" font-size="13">
      Growth rate (B-branch): 3 + 2√2 ≈ 5.828
    </text>
    <text x="570" y="225" fill="#a0a0d0" font-size="13">
      B₁, B₃ ∈ SO(2,1;ℤ) — orientation preserving
    </text>
    <text x="570" y="250" fill="#a0a0d0" font-size="13">
      B₂ ∈ O(2,1;ℤ) \ SO(2,1;ℤ) — orientation reversing
    </text>
  </g>
</svg>
