<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#152238"/>
    </linearGradient>
    <filter id="glowP">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#bgP)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#d0e0ff" font-size="22" font-weight="bold">
    B-Branch Pell Recurrence: c_{n+2} = 6c_{n+1} − c_n
  </text>

  <!-- The sequence -->
  <g transform="translate(50, 80)">
    <!-- Boxes for sequence values -->
    <g>
      <!-- c₀ = 5 -->
      <rect x="0" y="0" width="90" height="55" rx="12" fill="#1a3050" stroke="#2a5080" stroke-width="1.5"/>
      <text x="45" y="22" text-anchor="middle" fill="#6090c0" font-size="12">c₀</text>
      <text x="45" y="44" text-anchor="middle" fill="#48dbfb" font-size="20" font-weight="bold">5</text>

      <!-- Arrow -->
      <text x="105" y="35" fill="#444" font-size="20">→</text>

      <!-- c₁ = 29 -->
      <rect x="120" y="0" width="90" height="55" rx="12" fill="#1a3050" stroke="#2a5080" stroke-width="1.5"/>
      <text x="165" y="22" text-anchor="middle" fill="#6090c0" font-size="12">c₁</text>
      <text x="165" y="44" text-anchor="middle" fill="#48dbfb" font-size="20" font-weight="bold">29</text>

      <text x="225" y="35" fill="#444" font-size="20">→</text>

      <!-- c₂ = 169 -->
      <rect x="240" y="0" width="90" height="55" rx="12" fill="#1a3050" stroke="#2a5080" stroke-width="1.5"/>
      <text x="285" y="22" text-anchor="middle" fill="#6090c0" font-size="12">c₂</text>
      <text x="285" y="44" text-anchor="middle" fill="#48dbfb" font-size="20" font-weight="bold">169</text>

      <text x="345" y="35" fill="#444" font-size="20">→</text>

      <!-- c₃ = 985 -->
      <rect x="360" y="0" width="90" height="55" rx="12" fill="#1a3050" stroke="#2a5080" stroke-width="1.5"/>
      <text x="405" y="22" text-anchor="middle" fill="#6090c0" font-size="12">c₃</text>
      <text x="405" y="44" text-anchor="middle" fill="#48dbfb" font-size="20" font-weight="bold">985</text>

      <text x="465" y="35" fill="#444" font-size="20">→</text>

      <!-- c₄ = 5741 -->
      <rect x="480" y="0" width="100" height="55" rx="12" fill="#1a3050" stroke="#2a5080" stroke-width="1.5"/>
      <text x="530" y="22" text-anchor="middle" fill="#6090c0" font-size="12">c₄</text>
      <text x="530" y="44" text-anchor="middle" fill="#48dbfb" font-size="20" font-weight="bold">5741</text>

      <text x="595" y="35" fill="#444" font-size="20">→</text>

      <!-- c₅ = 33461 -->
      <rect x="610" y="0" width="110" height="55" rx="12" fill="#1a3050" stroke="#2a5080" stroke-width="1.5"/>
      <text x="665" y="22" text-anchor="middle" fill="#6090c0" font-size="12">c₅</text>
      <text x="665" y="44" text-anchor="middle" fill="#48dbfb" font-size="20" font-weight="bold">33461</text>

      <text x="735" y="35" fill="#444" font-size="20">→ ···</text>
    </g>

    <!-- Recurrence verification -->
    <g transform="translate(0, 80)">
      <text x="0" y="0" fill="#90b0d0" font-size="14" font-weight="bold">Verification:</text>

      <text x="30" y="30" fill="#a0c0e0" font-size="13">6 × 29 − 5 = 174 − 5 = 169 ✓</text>
      <text x="30" y="55" fill="#a0c0e0" font-size="13">6 × 169 − 29 = 1014 − 29 = 985 ✓</text>
      <text x="30" y="80" fill="#a0c0e0" font-size="13">6 × 985 − 169 = 5910 − 169 = 5741 ✓</text>
      <text x="30" y="105" fill="#a0c0e0" font-size="13">6 × 5741 − 985 = 34446 − 985 = 33461 ✓</text>
    </g>

    <!-- Growth rate -->
    <g transform="translate(400, 80)">
      <rect x="0" y="-10" width="380" height="130" rx="12" fill="#0d1b2a" stroke="#1a3050" stroke-width="1" opacity="0.9"/>

      <text x="190" y="15" text-anchor="middle" fill="#feca57" font-size="15" font-weight="bold">
        Growth Rate
      </text>

      <text x="20" y="42" fill="#d0c060" font-size="13">
        Characteristic equation: x² − 6x + 1 = 0
      </text>
      <text x="20" y="67" fill="#d0c060" font-size="13">
        Roots: λ₊ = 3 + 2√2 ≈ 5.8284
      </text>
      <text x="20" y="92" fill="#d0c060" font-size="13">
        ⠀⠀⠀⠀ λ₋ = 3 − 2√2 ≈ 0.1716
      </text>
      <text x="20" y="112" fill="#9090a0" font-size="12">
        c_n ~ C · (3 + 2√2)ⁿ as n → ∞
      </text>
    </g>

    <!-- Corresponding triples -->
    <g transform="translate(0, 220)">
      <text x="0" y="0" fill="#90b0d0" font-size="14" font-weight="bold">Corresponding Pythagorean triples (B-branch):</text>

      <text x="30" y="30" fill="#10ac84" font-size="13">(3, 4, 5)          — 3² + 4² = 9 + 16 = 25 = 5²</text>
      <text x="30" y="55" fill="#10ac84" font-size="13">(21, 20, 29)       — 21² + 20² = 441 + 400 = 841 = 29²</text>
      <text x="30" y="80" fill="#10ac84" font-size="13">(119, 120, 169)    — 119² + 120² = 14161 + 14400 = 28561 = 169²</text>
      <text x="30" y="105" fill="#10ac84" font-size="13">(697, 696, 985)    — 697² + 696² = 485809 + 484416 = 970225 = 985²</text>

      <text x="30" y="135" fill="#8090a0" font-size="12" font-style="italic">
        Notice: legs differ by 1! (21-20=1, 120-119=1, 697-696=1) — related to Pell equation x²−2y²=±1
      </text>
    </g>
  </g>
</svg>
