<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2838"/>
    </linearGradient>
    <radialGradient id="cone_glow" cx="50%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="800" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e0e8ff" font-size="24" font-weight="bold">
    Pythagorean Triples on the Lorentz Null Cone
  </text>
  <text x="450" y="65" text-anchor="middle" fill="#8090b0" font-size="14">
    Q(a,b,c) = a² + b² − c² = 0 defines the cone in ℤ³
  </text>

  <!-- Cone visualization -->
  <g transform="translate(300, 450)">
    <!-- Ambient glow -->
    <ellipse cx="150" cy="-50" rx="250" ry="200" fill="url(#cone_glow)"/>

    <!-- Cone outline (two nappes meeting at origin) -->
    <path d="M 150,-350 L -50,50 L 150,50 Z" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.3"/>
    <path d="M 150,-350 L 350,50 L 150,50 Z" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.3"/>

    <!-- The cone as ellipses at different heights -->
    <ellipse cx="150" cy="-50" rx="200" ry="40" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
    <ellipse cx="150" cy="-150" rx="133" ry="27" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
    <ellipse cx="150" cy="-250" rx="67" ry="13" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>

    <!-- Cone edges -->
    <line x1="150" y1="-350" x2="-50" y2="50" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <line x1="150" y1="-350" x2="350" y2="50" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>

    <!-- Axis labels -->
    <text x="150" y="-370" text-anchor="middle" fill="#8090b0" font-size="14">c</text>
    <text x="380" y="50" fill="#8090b0" font-size="14">a</text>
    <text x="-80" y="50" fill="#8090b0" font-size="14">b</text>

    <!-- Triple points on the cone -->
    <!-- (3,4,5): at roughly c=5 level -->
    <circle cx="150" cy="-300" r="6" fill="#ff6b6b" opacity="0.9"/>
    <text x="165" y="-305" fill="#ff6b6b" font-size="12">(3,4,5)</text>

    <!-- (5,12,13) -->
    <circle cx="120" cy="-250" r="5" fill="#feca57" opacity="0.9"/>
    <text x="62" y="-248" fill="#feca57" font-size="11">(5,12,13)</text>

    <!-- (21,20,29) -->
    <circle cx="200" cy="-210" r="5" fill="#48dbfb" opacity="0.9"/>
    <text x="210" y="-208" fill="#48dbfb" font-size="11">(21,20,29)</text>

    <!-- (15,8,17) -->
    <circle cx="100" cy="-270" r="5" fill="#10ac84" opacity="0.9"/>
    <text x="35" y="-268" fill="#10ac84" font-size="11">(15,8,17)</text>

    <!-- (7,24,25) -->
    <circle cx="85" cy="-230" r="4.5" fill="#feca57" opacity="0.8"/>
    <text x="27" y="-228" fill="#feca57" font-size="10">(7,24,25)</text>

    <!-- (119,120,169) -->
    <circle cx="250" cy="-130" r="4.5" fill="#48dbfb" opacity="0.8"/>
    <text x="260" y="-128" fill="#48dbfb" font-size="10">(119,120,169)</text>

    <!-- Arrows showing Berggren action -->
    <path d="M 148,-295 Q 125,-275 122,-255" fill="none" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <path d="M 155,-295 Q 180,-260 198,-215" fill="none" stroke="#48dbfb" stroke-width="1.5"/>
    <path d="M 145,-295 Q 110,-285 102,-275" fill="none" stroke="#10ac84" stroke-width="1.5"/>
  </g>

  <!-- Info panel -->
  <g transform="translate(50, 570)">
    <rect width="800" height="200" rx="12" fill="#0a1525" stroke="#1a3050" stroke-width="1" opacity="0.9"/>

    <text x="400" y="30" text-anchor="middle" fill="#c0d0ff" font-size="16" font-weight="bold">
      The Lorentz Group Connection
    </text>

    <text x="30" y="60" fill="#a0b0d0" font-size="13">
      • The Berggren matrices B₁, B₂, B₃ ∈ O(2,1;ℤ), the integer Lorentz group
    </text>
    <text x="30" y="85" fill="#a0b0d0" font-size="13">
      • They preserve Q(a,b,c) = a² + b² − c² (verified: BᵀQB = Q for all three)
    </text>
    <text x="30" y="110" fill="#a0b0d0" font-size="13">
      • Pythagorean triples live on the null cone Q = 0, analogous to light cones in physics
    </text>
    <text x="30" y="135" fill="#a0b0d0" font-size="13">
      • det(B₁) = det(B₃) = 1 (proper Lorentz), det(B₂) = −1 (improper — includes parity)
    </text>
    <text x="30" y="160" fill="#a0b0d0" font-size="13">
      • The tree structure partitions the null cone lattice points: each primitive triple appears once
    </text>
    <text x="30" y="185" fill="#7890b0" font-size="12" font-style="italic">
      This connects Pythagorean number theory to relativistic geometry via the integer Lorentz group
    </text>
  </g>
</svg>
