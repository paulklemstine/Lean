<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#2a1a3e"/>
    </linearGradient>
    <filter id="glowE">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="700" fill="url(#bgE)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e8d0ff" font-size="24" font-weight="bold">
    EML Fixed-Point Bifurcation
  </text>
  <text x="450" y="65" text-anchor="middle" fill="#a080c0" font-size="14">
    eml(x, y) = eˣ − ln(y) : Fixed points satisfy eˣ − x = ln(y)
  </text>

  <!-- Axes -->
  <g transform="translate(120, 500)">
    <!-- x-axis (y parameter) -->
    <line x1="0" y1="0" x2="700" y2="0" stroke="#666" stroke-width="1.5"/>
    <text x="700" y="25" fill="#999" font-size="13">y</text>

    <!-- y-axis (fixed point x) -->
    <line x1="0" y1="50" x2="0" y2="-400" stroke="#666" stroke-width="1.5"/>
    <text x="-15" y="-400" fill="#999" font-size="13">x*</text>

    <!-- Tick marks on x-axis -->
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#666" stroke-width="1"/>
    <text x="0" y="18" text-anchor="middle" fill="#888" font-size="11">0</text>

    <!-- y = e ≈ 2.718 → scaled position -->
    <!-- Scale: y range [0, 20] → [0, 700px], so y=e → 700*e/20 ≈ 95px -->
    <!-- x range [-5, 5] → [-200, 200] scaled to [400, 0] (inverted) -->

    <!-- Let's use: x_px = y * 35, y_px = -x * 70 -->

    <!-- y=1 -->
    <line x1="35" y1="-3" x2="35" y2="3" stroke="#666" stroke-width="1"/>
    <text x="35" y="18" text-anchor="middle" fill="#888" font-size="11">1</text>

    <!-- y=e -->
    <line x1="95" y1="-3" x2="95" y2="3" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="95" y="18" text-anchor="middle" fill="#ff6b6b" font-size="11">e</text>

    <!-- y=5 -->
    <line x1="175" y1="-3" x2="175" y2="3" stroke="#666" stroke-width="1"/>
    <text x="175" y="18" text-anchor="middle" fill="#888" font-size="11">5</text>

    <!-- y=10 -->
    <line x1="350" y1="-3" x2="350" y2="3" stroke="#666" stroke-width="1"/>
    <text x="350" y="18" text-anchor="middle" fill="#888" font-size="11">10</text>

    <!-- y=20 -->
    <line x1="700" y1="-3" x2="700" y2="3" stroke="#666" stroke-width="1"/>
    <text x="700" y="18" text-anchor="middle" fill="#888" font-size="11">20</text>

    <!-- x=0 line -->
    <line x1="0" y1="0" x2="700" y2="0" stroke="#444" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- Bifurcation point -->
    <circle cx="95" cy="0" r="6" fill="#ff6b6b" filter="url(#glowE)"/>
    <text x="95" y="-15" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">
      Bifurcation
    </text>

    <!-- Stable branch (upper/lower) -->
    <!-- For y > e: stable FP at x < 0, unstable at x > 0 -->
    <!-- x_stable ≈ -sqrt(2(y-e)/e) for y near e -->
    <!-- x_unstable ≈ sqrt(2(y-e)/e) for y near e -->

    <!-- Stable branch (drawn as smooth curve) - goes down as y increases -->
    <path d="M 95,0 Q 120,-20 140,-45 Q 175,-90 210,-120 Q 280,-170 350,-210 Q 450,-260 550,-300 Q 630,-330 700,-350"
          fill="none" stroke="#10ac84" stroke-width="2.5" filter="url(#glowE)"/>

    <!-- Unstable branch (goes up) -->
    <path d="M 95,0 Q 120,30 140,70 Q 175,130 210,170 Q 280,230 350,270 Q 450,310 550,340 Q 630,360 700,380"
          fill="none" stroke="#ee5a24" stroke-width="2" stroke-dasharray="6,3" filter="url(#glowE)"/>

    <!-- Labels -->
    <text x="650" y="-340" fill="#10ac84" font-size="13" font-weight="bold">Stable</text>
    <text x="650" y="370" fill="#ee5a24" font-size="13" font-weight="bold">Unstable</text>

    <!-- No fixed points region -->
    <text x="40" y="-200" fill="#666" font-size="12" font-style="italic" transform="rotate(-90, 40, -200)">
      No fixed points
    </text>

    <!-- Region labels -->
    <rect x="5" y="-350" width="85" height="50" rx="8" fill="#331155" opacity="0.6"/>
    <text x="48" y="-320" text-anchor="middle" fill="#c0a0e0" font-size="12">y &lt; e</text>
    <text x="48" y="-305" text-anchor="middle" fill="#888" font-size="10">no FP</text>

    <rect x="100" y="-380" width="100" height="50" rx="8" fill="#113355" opacity="0.6"/>
    <text x="150" y="-350" text-anchor="middle" fill="#a0c0e0" font-size="12">y &gt; e</text>
    <text x="150" y="-335" text-anchor="middle" fill="#888" font-size="10">two FPs</text>

    <!-- Lambert W annotation -->
    <rect x="400" y="-400" width="250" height="70" rx="10" fill="#1a1a3e" stroke="#333366" stroke-width="1" opacity="0.9"/>
    <text x="525" y="-375" text-anchor="middle" fill="#c0c0ff" font-size="13" font-weight="bold">
      Lambert W Connection
    </text>
    <text x="525" y="-355" text-anchor="middle" fill="#a0a0d0" font-size="12">
      x* = −W_k(−1/y) − ln(y)
    </text>
    <text x="525" y="-340" text-anchor="middle" fill="#8080b0" font-size="11">
      W₀ → stable, W₋₁ → unstable
    </text>
  </g>

  <!-- Bottom info -->
  <g transform="translate(50, 570)">
    <rect width="800" height="110" rx="12" fill="#150a25" stroke="#2a1a3e" stroke-width="1" opacity="0.9"/>

    <text x="400" y="25" text-anchor="middle" fill="#d0c0e0" font-size="15" font-weight="bold">
      EML Operator Properties
    </text>

    <text x="30" y="50" fill="#b0a0c0" font-size="12">
      • eml(x, 1) = eˣ (exponential)
    </text>
    <text x="30" y="70" fill="#b0a0c0" font-size="12">
      • 1 − eml(0, x) = ln(x) (logarithm)
    </text>
    <text x="30" y="90" fill="#b0a0c0" font-size="12">
      • eml generates all elementary functions
    </text>

    <text x="400" y="50" fill="#b0a0c0" font-size="12">
      • Fixed-point bifurcation at y = e ≈ 2.718
    </text>
    <text x="400" y="70" fill="#b0a0c0" font-size="12">
      • Connects to Lambert W function branches
    </text>
    <text x="400" y="90" fill="#b0a0c0" font-size="12">
      • Complex fixed points: infinitely many (Picard)
    </text>
  </g>
</svg>
