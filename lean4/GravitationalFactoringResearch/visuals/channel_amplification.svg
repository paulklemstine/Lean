<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg2)"/>

  <text x="500" y="45" fill="#FFD700" font-size="28" font-weight="bold" text-anchor="middle">Channel Amplification Across the Cayley-Dickson Hierarchy</text>
  <text x="500" y="72" fill="#8B949E" font-size="14" text-anchor="middle">Factoring channels grow quadratically: C(k) = k(k+1)/2</text>

  <!-- Axes -->
  <line x1="100" y1="580" x2="950" y2="580" stroke="#30363d" stroke-width="2"/>
  <line x1="100" y1="580" x2="100" y2="100" stroke="#30363d" stroke-width="2"/>

  <!-- Y-axis label -->
  <text x="40" y="340" fill="#8B949E" font-size="14" text-anchor="middle" transform="rotate(-90, 40, 340)">Total Channels (with cross-collision)</text>

  <!-- X-axis label -->
  <text x="525" y="640" fill="#8B949E" font-size="14" text-anchor="middle">Dimension k (Cayley-Dickson level)</text>

  <!-- Y-axis ticks -->
  <text x="90" y="584" fill="#8B949E" font-size="11" text-anchor="end">0</text>
  <line x1="95" y1="480" x2="950" y2="480" stroke="#21262d" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="90" y="484" fill="#8B949E" font-size="11" text-anchor="end">50</text>
  <line x1="95" y1="380" x2="950" y2="380" stroke="#21262d" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="90" y="384" fill="#8B949E" font-size="11" text-anchor="end">100</text>
  <line x1="95" y1="280" x2="950" y2="280" stroke="#21262d" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="90" y="284" fill="#8B949E" font-size="11" text-anchor="end">150</text>
  <line x1="95" y1="180" x2="950" y2="180" stroke="#21262d" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="90" y="184" fill="#8B949E" font-size="11" text-anchor="end">200</text>

  <!-- Scale: 0-250 maps to 580-100, so 1 unit = 1.92 px -->

  <!-- Bars: Peel (blue) + Cross within (green) + Cross between (orange) -->
  <!-- k=1: peel=1, cross=0, between=1 → total=2 -->
  <g transform="translate(160, 0)">
    <rect x="-25" y="576" width="50" height="4" rx="2" fill="#4FC3F7"/>
    <text x="0" y="600" fill="#8B949E" font-size="12" text-anchor="middle">k=1</text>
    <text x="0" y="618" fill="#546E7A" font-size="10" text-anchor="middle">ℝ</text>
    <text x="0" y="568" fill="#4FC3F7" font-size="11" text-anchor="middle" font-weight="bold">2</text>
  </g>

  <!-- k=2: peel=2, cross=1, between=4 → total=7 -->
  <g transform="translate(280, 0)">
    <rect x="-25" y="566" width="50" height="14" rx="2" fill="#4FC3F7"/>
    <text x="0" y="600" fill="#8B949E" font-size="12" text-anchor="middle">k=2</text>
    <text x="0" y="618" fill="#546E7A" font-size="10" text-anchor="middle">ℂ</text>
    <text x="0" y="558" fill="#4FC3F7" font-size="11" text-anchor="middle" font-weight="bold">7</text>
  </g>

  <!-- k=3: peel=3, cross=3, between=9 → total=15 -->
  <g transform="translate(400, 0)">
    <rect x="-25" y="551" width="50" height="29" rx="2" fill="#4FC3F7"/>
    <text x="0" y="600" fill="#8B949E" font-size="12" text-anchor="middle">k=3</text>
    <text x="0" y="618" fill="#546E7A" font-size="10" text-anchor="middle">Triple</text>
    <text x="0" y="543" fill="#4FC3F7" font-size="11" text-anchor="middle" font-weight="bold">15</text>
  </g>

  <!-- k=4: peel=4, cross=6, between=16 → total=26 -->
  <g transform="translate(520, 0)">
    <rect x="-25" y="530" width="50" height="50" rx="2" fill="#CE93D8"/>
    <text x="0" y="600" fill="#8B949E" font-size="12" text-anchor="middle">k=4</text>
    <text x="0" y="618" fill="#CE93D8" font-size="10" text-anchor="middle">ℍ</text>
    <text x="0" y="522" fill="#CE93D8" font-size="12" text-anchor="middle" font-weight="bold">26</text>
  </g>

  <!-- k=8: peel=8, cross=28, between=64 → total=100 -->
  <g transform="translate(680, 0)">
    <rect x="-30" y="388" width="60" height="192" rx="3" fill="#81C784"/>
    <text x="0" y="600" fill="#8B949E" font-size="12" text-anchor="middle">k=8</text>
    <text x="0" y="618" fill="#81C784" font-size="10" text-anchor="middle">𝕆</text>
    <text x="0" y="378" fill="#81C784" font-size="14" text-anchor="middle" font-weight="bold">100</text>
  </g>

  <!-- k=16: peel=16, cross=120, between=256 → total=392 -->
  <g transform="translate(860, 0)">
    <rect x="-35" y="130" width="70" height="450" rx="3" fill="#EF9A9A"/>
    <text x="0" y="600" fill="#8B949E" font-size="12" text-anchor="middle">k=16</text>
    <text x="0" y="618" fill="#EF9A9A" font-size="10" text-anchor="middle">𝕊</text>
    <text x="0" y="120" fill="#EF9A9A" font-size="14" text-anchor="middle" font-weight="bold">392</text>
    <text x="0" y="650" fill="#EF5350" font-size="9" text-anchor="middle">⚠ zero divisors</text>
  </g>

  <!-- Legend -->
  <g transform="translate(130, 95)">
    <rect width="280" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="15" y="15" width="12" height="12" fill="#4FC3F7"/>
    <text x="35" y="26" fill="#C9D1D9" font-size="12">Peel channels (k per tuple)</text>
    <rect x="15" y="35" width="12" height="12" fill="#81C784"/>
    <text x="35" y="46" fill="#C9D1D9" font-size="12">Cross-collision within (C(k,2))</text>
    <rect x="15" y="55" width="12" height="12" fill="#FFB74D"/>
    <text x="35" y="66" fill="#C9D1D9" font-size="12">Cross-collision between (k²)</text>
    <text x="140" y="82" fill="#8B949E" font-size="10" text-anchor="middle">Total = k + C(k,2) + k²</text>
  </g>

  <!-- Norm multiplicativity indicator -->
  <g transform="translate(500, 95)">
    <rect width="350" height="55" rx="8" fill="#161b22" stroke="#FFD700" stroke-width="1" opacity="0.8"/>
    <text x="175" y="22" fill="#FFD700" font-size="13" font-weight="bold" text-anchor="middle">Norm Multiplicativity: N(ab) = N(a)·N(b)</text>
    <text x="175" y="42" fill="#A5D6A7" font-size="12" text-anchor="middle">✓ ℝ, ℂ, ℍ, 𝕆 (k ≤ 8) &nbsp;&nbsp; ✗ 𝕊 (k = 16, zero divisors)</text>
  </g>
</svg>
