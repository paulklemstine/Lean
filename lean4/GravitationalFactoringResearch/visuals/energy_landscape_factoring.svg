<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="hotspot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="650" fill="url(#bg4)"/>

  <text x="450" y="40" fill="#FFD700" font-size="24" font-weight="bold" text-anchor="middle">Factoring Energy Landscape: E(x, d) = Σxᵢ² − d²</text>
  <text x="450" y="65" fill="#8B949E" font-size="13" text-anchor="middle">Zero-energy manifold contains factor-revealing configurations</text>

  <!-- 3D-ish landscape -->
  <!-- Mountain ridges (high energy) -->
  <path d="M50,400 Q150,200 250,350 Q350,180 450,300 Q550,150 650,320 Q750,220 850,380"
        fill="none" stroke="#4A148C" stroke-width="3" opacity="0.6"/>
  <path d="M50,420 Q150,250 250,370 Q350,220 450,330 Q550,200 650,350 Q750,260 850,400"
        fill="none" stroke="#6A1B9A" stroke-width="2" opacity="0.4"/>

  <!-- Valley (zero energy = Pythagorean surface) -->
  <path d="M50,450 Q200,430 350,445 Q450,440 550,435 Q700,445 850,450"
        fill="none" stroke="#4ECDC4" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Energy contour lines -->
  <path d="M80,380 Q200,300 350,370 Q500,280 650,350 Q780,310 860,370"
        fill="none" stroke="#7B1FA2" stroke-width="1" opacity="0.3"/>
  <path d="M70,410 Q200,360 350,400 Q500,350 650,390 Q780,370 860,410"
        fill="none" stroke="#9C27B0" stroke-width="1" opacity="0.3"/>
  <path d="M60,440 Q200,420 350,435 Q500,420 650,430 Q780,425 860,440"
        fill="none" stroke="#CE93D8" stroke-width="1" opacity="0.3"/>

  <!-- Factor-revealing points (hotspots on zero-energy manifold) -->
  <circle cx="250" cy="445" r="30" fill="url(#hotspot)" opacity="0.7"/>
  <circle cx="250" cy="445" r="5" fill="#FF6B6B"/>
  <text x="250" y="490" fill="#FF6B6B" font-size="11" text-anchor="middle">gcd(d−x₁, N) = p</text>

  <circle cx="550" cy="435" r="25" fill="url(#hotspot2)" opacity="0.7"/>
  <circle cx="550" cy="435" r="5" fill="#4ECDC4"/>
  <text x="550" y="480" fill="#4ECDC4" font-size="11" text-anchor="middle">gcd(d−x₂, N) = q</text>

  <circle cx="700" cy="445" r="20" fill="url(#hotspot)" opacity="0.5"/>
  <circle cx="700" cy="445" r="4" fill="#FF6B6B"/>
  <text x="700" y="490" fill="#FF6B6B" font-size="11" text-anchor="middle">cross-collision</text>

  <!-- Gradient descent arrows -->
  <path d="M180,320 Q200,380 245,440" fill="none" stroke="#FFD700" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <path d="M480,280 Q510,360 545,430" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <path d="M750,300 Q730,370 705,440" fill="none" stroke="#FFD700" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="180" y="310" fill="#FFD700" font-size="11" text-anchor="middle">descent</text>
  <text x="480" y="270" fill="#FFD700" font-size="11" text-anchor="middle">descent</text>

  <!-- Axes -->
  <text x="450" y="530" fill="#8B949E" font-size="13" text-anchor="middle">Configuration space (x₁, x₂, ..., xₖ, d)</text>
  <text x="30" y="350" fill="#8B949E" font-size="12" text-anchor="middle" transform="rotate(-90, 30, 350)">Energy E</text>

  <!-- Energy level labels -->
  <text x="870" y="305" fill="#7B1FA2" font-size="10">E ≫ 0</text>
  <text x="870" y="375" fill="#9C27B0" font-size="10">E > 0</text>
  <text x="870" y="445" fill="#4ECDC4" font-size="10" font-weight="bold">E = 0</text>

  <!-- Info box -->
  <rect x="50" y="545" width="800" height="90" rx="10" fill="#1a1a3e" stroke="#37474F" stroke-width="1"/>
  <text x="450" y="570" fill="#FFD700" font-size="14" font-weight="bold" text-anchor="middle">Key Insight: Factoring = Finding Zero-Energy Factor-Revealing Configurations</text>
  <text x="450" y="590" fill="#E0E0E0" font-size="12" text-anchor="middle">• Zero-energy manifold: {(x,d) : Σxᵢ² = d²} is the Pythagorean hypersurface</text>
  <text x="450" y="608" fill="#E0E0E0" font-size="12" text-anchor="middle">• Factor-revealing subset: {(x,d) : gcd(d−xⱼ, N) ∈ {p, q}} has density δ ≈ 2/√N</text>
  <text x="450" y="626" fill="#E0E0E0" font-size="12" text-anchor="middle">• Morse theory predicts O(N^ε) critical points for any ε > 0 (Direction 6)</text>
</svg>
