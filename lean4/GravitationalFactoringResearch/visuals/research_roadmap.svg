<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg3)"/>
  <text x="600" y="45" fill="#FFD700" font-size="28" font-weight="bold" text-anchor="middle">Gravitational Factoring Research Roadmap</text>
  <text x="600" y="72" fill="#8B949E" font-size="14" text-anchor="middle">Timeline and dependencies for 40 research directions</text>

  <!-- Timeline axis -->
  <line x1="100" y1="750" x2="1100" y2="750" stroke="#37474F" stroke-width="2"/>
  <text x="200" y="775" fill="#8B949E" font-size="12" text-anchor="middle">3 months</text>
  <text x="400" y="775" fill="#8B949E" font-size="12" text-anchor="middle">6 months</text>
  <text x="600" y="775" fill="#8B949E" font-size="12" text-anchor="middle">1 year</text>
  <text x="800" y="775" fill="#8B949E" font-size="12" text-anchor="middle">2 years</text>
  <text x="1000" y="775" fill="#8B949E" font-size="12" text-anchor="middle">5 years</text>

  <!-- Vertical gridlines -->
  <line x1="200" y1="90" x2="200" y2="740" stroke="#1e2d3d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="90" x2="400" y2="740" stroke="#1e2d3d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="600" y1="90" x2="600" y2="740" stroke="#1e2d3d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="800" y1="90" x2="800" y2="740" stroke="#1e2d3d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1000" y1="90" x2="1000" y2="740" stroke="#1e2d3d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- CRITICAL PATH (green) -->
  <text x="60" y="115" fill="#4CAF50" font-size="14" font-weight="bold" transform="rotate(-90, 60, 200)">CRITICAL</text>
  <rect x="130" y="100" width="280" height="35" rx="8" fill="#1B5E20" opacity="0.5" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="270" y="122" fill="#A5D6A7" font-size="12" text-anchor="middle">D3: Cross-collision bound Ω(k²/√N)</text>
  <circle cx="405" cy="117" r="8" fill="#4CAF50"/><text x="405" y="121" fill="#FFF" font-size="8" text-anchor="middle">✓</text>

  <rect x="130" y="145" width="280" height="35" rx="8" fill="#1B5E20" opacity="0.5" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="270" y="167" fill="#A5D6A7" font-size="12" text-anchor="middle">D4: Optimal smoothness B*(N)</text>
  <circle cx="405" cy="162" r="8" fill="#4CAF50"/><text x="405" y="166" fill="#FFF" font-size="8" text-anchor="middle">✓</text>

  <rect x="130" y="190" width="400" height="35" rx="8" fill="#1B5E20" opacity="0.4" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="330" y="212" fill="#A5D6A7" font-size="12" text-anchor="middle">D1: Sieve complexity analysis L(N)^{c+o(1)}</text>

  <rect x="130" y="235" width="400" height="35" rx="8" fill="#1B5E20" opacity="0.4" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="330" y="257" fill="#A5D6A7" font-size="12" text-anchor="middle">D2: Lattice-GCD factor extraction</text>

  <!-- MAJOR (blue) -->
  <text x="60" y="340" fill="#42A5F5" font-size="14" font-weight="bold" transform="rotate(-90, 60, 410)">MAJOR</text>
  <rect x="250" y="290" width="350" height="35" rx="8" fill="#0D47A1" opacity="0.4" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="425" y="312" fill="#90CAF9" font-size="12" text-anchor="middle">D5: Hurwitz quaternion formalization</text>

  <rect x="350" y="335" width="350" height="35" rx="8" fill="#0D47A1" opacity="0.4" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="525" y="357" fill="#90CAF9" font-size="12" text-anchor="middle">D9: Jacobi r₄ formalization</text>

  <rect x="300" y="380" width="450" height="35" rx="8" fill="#0D47A1" opacity="0.4" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="525" y="402" fill="#90CAF9" font-size="12" text-anchor="middle">D6: Energy landscape Morse theory</text>

  <rect x="300" y="425" width="350" height="35" rx="8" fill="#0D47A1" opacity="0.4" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="475" y="447" fill="#90CAF9" font-size="12" text-anchor="middle">D7: Sedenion zero divisors D8: Berggren mod p</text>

  <!-- EXPANDING (purple) -->
  <text x="60" y="530" fill="#AB47BC" font-size="14" font-weight="bold" transform="rotate(-90, 60, 560)">EXPANDING</text>
  <rect x="400" y="475" width="400" height="30" rx="6" fill="#4A148C" opacity="0.3" stroke="#AB47BC" stroke-width="1"/>
  <text x="600" y="495" fill="#CE93D8" font-size="11" text-anchor="middle">D11-20: Tropical, ML, GPU, LLL, Spectral, Info-theory</text>

  <!-- DEEP THEORY (orange) -->
  <text x="60" y="560" fill="#FF7043" font-size="14" font-weight="bold" transform="rotate(-90, 60, 600)">DEEP</text>
  <rect x="600" y="520" width="450" height="30" rx="6" fill="#BF360C" opacity="0.3" stroke="#FF7043" stroke-width="1"/>
  <text x="825" y="540" fill="#FFAB91" font-size="11" text-anchor="middle">D21-25: Complexity class, Riemann, Categories, K-theory</text>

  <!-- SPECULATIVE (gray) -->
  <text x="60" y="610" fill="#78909C" font-size="14" font-weight="bold" transform="rotate(-90, 60, 640)">FRONTIER</text>
  <rect x="700" y="560" width="350" height="30" rx="6" fill="#37474F" opacity="0.3" stroke="#78909C" stroke-width="1"/>
  <text x="875" y="580" fill="#B0BEC5" font-size="11" text-anchor="middle">D26-40: Spin glass, Modular forms, P vs NP, IUT</text>

  <!-- Dependencies arrows -->
  <!-- D3,D4 → D1 -->
  <path d="M405 135 Q420 160 410 190" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowG)"/>
  <path d="M405 162 Q420 180 410 190" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- D1 → D5 -->
  <path d="M530 225 Q540 260 530 290" fill="none" stroke="#66BB6A" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- D5 → D9 -->
  <path d="M600 325 Q610 330 600 335" fill="none" stroke="#42A5F5" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Key insight box -->
  <rect x="130" y="620" width="940" height="100" rx="12" fill="#0a0a2e" stroke="#FFD700" stroke-width="1.5" opacity="0.9"/>
  <text x="600" y="648" fill="#FFD700" font-size="16" font-weight="bold" text-anchor="middle">Key Insight: The Geometric Advantage</text>
  <text x="600" y="672" fill="#E0E0E0" font-size="13" text-anchor="middle">Factoring as spatial navigation: k-tuple generation → peel channels → cross-collision → congruence of squares → factor</text>
  <text x="600" y="696" fill="#B0BEC5" font-size="12" text-anchor="middle">Each step has a geometric interpretation: tree descent, lattice reduction, sphere intersection, energy minimization</text>
</svg>
