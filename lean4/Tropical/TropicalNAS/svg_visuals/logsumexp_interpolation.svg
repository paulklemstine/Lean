<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="550" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#f9d923" font-size="22" font-weight="bold">
    LogSumExp: The Tropical-Classical Bridge
  </text>
  <text x="450" y="58" text-anchor="middle" fill="#8b949e" font-size="12">
    LSE_β(x) = (1/β) · log(Σ exp(β·xᵢ)) interpolates between mean and max
  </text>
  
  <!-- Chart area -->
  <g transform="translate(100, 90)">
    <!-- Axes -->
    <line x1="0" y1="350" x2="700" y2="350" stroke="#555" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="350" stroke="#555" stroke-width="1.5"/>
    
    <!-- Y axis labels -->
    <text x="-10" y="350" text-anchor="end" fill="#aaa" font-size="11">mean</text>
    <text x="-10" y="50" text-anchor="end" fill="#aaa" font-size="11">max</text>
    <text x="-45" y="200" text-anchor="middle" fill="#aaa" font-size="12" transform="rotate(-90, -45, 200)">LSE_β value</text>
    
    <!-- X axis labels -->
    <text x="350" y="385" text-anchor="middle" fill="#aaa" font-size="12">β (inverse temperature)</text>
    <text x="0" y="375" text-anchor="middle" fill="#888" font-size="10">0</text>
    <text x="175" y="375" text-anchor="middle" fill="#888" font-size="10">1</text>
    <text x="350" y="375" text-anchor="middle" fill="#888" font-size="10">5</text>
    <text x="525" y="375" text-anchor="middle" fill="#888" font-size="10">10</text>
    <text x="700" y="375" text-anchor="middle" fill="#888" font-size="10">∞</text>
    
    <!-- Max line (tropical limit) -->
    <line x1="0" y1="50" x2="700" y2="50" stroke="#e94560" stroke-width="1" stroke-dasharray="8,4" opacity="0.6"/>
    <text x="710" y="54" fill="#e94560" font-size="11">max (tropical)</text>
    
    <!-- Mean line -->
    <line x1="0" y1="300" x2="700" y2="300" stroke="#4090ff" stroke-width="1" stroke-dasharray="8,4" opacity="0.6"/>
    <text x="710" y="304" fill="#4090ff" font-size="11">mean (classical)</text>
    
    <!-- LSE curve (smooth interpolation) -->
    <path d="M 0,300 C 50,280 100,230 175,180 S 300,100 400,75 S 550,55 700,50" 
          fill="none" stroke="#f9d923" stroke-width="3" opacity="0.9"/>
    <text x="350" y="135" fill="#f9d923" font-size="13" font-weight="bold">LSE_β(x)</text>
    
    <!-- Gap bound region -->
    <path d="M 175,50 L 175,180 L 350,75 L 350,50 Z" fill="#f9d923" fill-opacity="0.05" stroke="none"/>
    <text x="262" y="100" text-anchor="middle" fill="#f9d923" font-size="10" opacity="0.7">gap ≤ log(n)/β</text>
    
    <!-- Phase annotations -->
    <rect x="5" y="240" width="120" height="45" rx="8" fill="rgba(64,144,255,0.15)" stroke="#4090ff" stroke-width="0.5"/>
    <text x="65" y="258" text-anchor="middle" fill="#4090ff" font-size="10" font-weight="bold">Exploration</text>
    <text x="65" y="273" text-anchor="middle" fill="#4090ff" font-size="9">β ≈ 0, uniform</text>
    
    <rect x="540" y="55" width="130" height="45" rx="8" fill="rgba(233,69,96,0.15)" stroke="#e94560" stroke-width="0.5"/>
    <text x="605" y="73" text-anchor="middle" fill="#e94560" font-size="10" font-weight="bold">Exploitation</text>
    <text x="605" y="88" text-anchor="middle" fill="#e94560" font-size="9">β → ∞, argmax</text>
    
    <!-- Key equation -->
    <rect x="200" y="290" width="300" height="55" rx="10" fill="rgba(249,217,35,0.08)" stroke="#f9d923" stroke-width="0.5"/>
    <text x="350" y="312" text-anchor="middle" fill="#f9d923" font-size="14">
      β → ∞:  LSE → max  (tropical limit)
    </text>
    <text x="350" y="332" text-anchor="middle" fill="#ccc" font-size="11">
      Idempotent: max(max(x,y), y) = max(x,y)
    </text>
  </g>
  
  <!-- Lean verification badge -->
  <g transform="translate(750, 500)">
    <rect x="-70" y="-15" width="140" height="30" rx="15" fill="rgba(0,200,100,0.2)" stroke="#00c864" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#00c864" font-size="11">✓ Lean 4 verified</text>
  </g>
</svg>
