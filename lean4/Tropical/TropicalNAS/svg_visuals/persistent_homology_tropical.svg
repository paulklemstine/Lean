<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="phBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#161b22" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="500" fill="url(#phBg)"/>
  
  <text x="450" y="38" text-anchor="middle" fill="#4090ff" font-size="20" font-weight="bold">
    Persistent Homology as Tropical Computation
  </text>
  <text x="450" y="60" text-anchor="middle" fill="#8b949e" font-size="12">
    The entire persistence pipeline is naturally tropical: max, +, and argmax
  </text>
  
  <!-- Pipeline stages -->
  <!-- Stage 1: Point Cloud -->
  <g transform="translate(100, 160)">
    <rect x="-70" y="-50" width="140" height="100" rx="10" fill="rgba(64,144,255,0.1)" stroke="#4090ff" stroke-width="1.5"/>
    <text x="0" y="-28" text-anchor="middle" fill="#4090ff" font-size="13" font-weight="bold">Point Cloud</text>
    <!-- Sample points -->
    <circle cx="-30" cy="5" r="3" fill="#4090ff" opacity="0.8"/>
    <circle cx="10" cy="-15" r="3" fill="#4090ff" opacity="0.8"/>
    <circle cx="25" cy="10" r="3" fill="#4090ff" opacity="0.8"/>
    <circle cx="-15" cy="20" r="3" fill="#4090ff" opacity="0.8"/>
    <circle cx="40" cy="-5" r="3" fill="#4090ff" opacity="0.8"/>
    <circle cx="-40" cy="-10" r="3" fill="#4090ff" opacity="0.8"/>
    <circle cx="5" cy="30" r="3" fill="#4090ff" opacity="0.8"/>
    <text x="0" y="42" text-anchor="middle" fill="#888" font-size="9">n points in ℝᵈ</text>
  </g>
  
  <!-- Arrow 1→2 -->
  <line x1="175" y1="160" x2="225" y2="160" stroke="#f9d923" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="145" text-anchor="middle" fill="#f9d923" font-size="9">d(x,y)</text>
  
  <!-- Stage 2: Distance Matrix -->
  <g transform="translate(310, 160)">
    <rect x="-70" y="-50" width="140" height="100" rx="10" fill="rgba(233,69,96,0.1)" stroke="#e94560" stroke-width="1.5"/>
    <text x="0" y="-28" text-anchor="middle" fill="#e94560" font-size="13" font-weight="bold">Distance Matrix</text>
    <!-- Mini matrix -->
    <g transform="translate(-35, -8)" fill="#e94560" font-size="9" opacity="0.7">
      <text x="0" y="0">0  2  5</text>
      <text x="0" y="14">2  0  3</text>
      <text x="0" y="28">5  3  0</text>
    </g>
    <text x="0" y="42" text-anchor="middle" fill="#888" font-size="9">tropical: max(dᵢⱼ)</text>
  </g>
  
  <!-- Arrow 2→3 -->
  <line x1="385" y1="160" x2="435" y2="160" stroke="#f9d923" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="410" y="145" text-anchor="middle" fill="#f9d923" font-size="9">filter</text>
  
  <!-- Stage 3: Filtration -->
  <g transform="translate(520, 160)">
    <rect x="-70" y="-50" width="140" height="100" rx="10" fill="rgba(160,112,224,0.1)" stroke="#a070e0" stroke-width="1.5"/>
    <text x="0" y="-28" text-anchor="middle" fill="#a070e0" font-size="13" font-weight="bold">Filtration</text>
    <!-- Growing complex visualization -->
    <g transform="translate(-25, 0)">
      <circle cx="0" cy="0" r="3" fill="#a070e0"/>
      <circle cx="25" cy="-10" r="3" fill="#a070e0"/>
      <circle cx="50" cy="5" r="3" fill="#a070e0"/>
      <line x1="3" y1="0" x2="22" y2="-10" stroke="#a070e0" stroke-width="1"/>
      <line x1="28" y1="-10" x2="47" y2="5" stroke="#a070e0" stroke-width="1" opacity="0.5"/>
      <polygon points="0,0 25,-10 50,5" fill="#a070e0" fill-opacity="0.15" stroke="none"/>
    </g>
    <text x="0" y="35" text-anchor="middle" fill="#888" font-size="9">ε-balls grow</text>
  </g>
  
  <!-- Arrow 3→4 -->
  <line x1="595" y1="160" x2="645" y2="160" stroke="#f9d923" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="620" y="145" text-anchor="middle" fill="#f9d923" font-size="9">O(n³)</text>
  
  <!-- Stage 4: Barcode -->
  <g transform="translate(740, 160)">
    <rect x="-80" y="-50" width="160" height="100" rx="10" fill="rgba(0,200,150,0.1)" stroke="#00c896" stroke-width="1.5"/>
    <text x="0" y="-28" text-anchor="middle" fill="#00c896" font-size="13" font-weight="bold">Persistence Barcode</text>
    <!-- Barcode lines -->
    <line x1="-55" y1="-5" x2="40" y2="-5" stroke="#00c896" stroke-width="3" opacity="0.9"/>
    <line x1="-40" y1="10" x2="10" y2="10" stroke="#00c896" stroke-width="3" opacity="0.7"/>
    <line x1="-20" y1="25" x2="55" y2="25" stroke="#00c896" stroke-width="3" opacity="0.5"/>
    <line x1="-55" y1="37" x2="-30" y2="37" stroke="#e94560" stroke-width="3" opacity="0.6"/>
    <text x="0" y="48" text-anchor="middle" fill="#888" font-size="9">birth → death intervals</text>
  </g>
  
  <!-- Tropical operations row -->
  <g transform="translate(450, 310)">
    <rect x="-380" y="-25" width="760" height="50" rx="12" fill="rgba(249,217,35,0.05)" stroke="#f9d923" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" fill="#f9d923" font-size="14">
      All operations are tropical:  d∞(I,J) = max(|bᵢ-bⱼ|, |dᵢ-dⱼ|)  •  column reduction via max  •  O(n³) total
    </text>
    <text x="0" y="18" text-anchor="middle" fill="#aaa" font-size="11">
      Bottleneck distance is a tropical metric (Lean verified: barcode_tropical_invariance)
    </text>
  </g>
  
  <!-- Stability theorem -->
  <g transform="translate(450, 410)">
    <rect x="-300" y="-35" width="600" height="70" rx="12" fill="rgba(64,144,255,0.08)" stroke="#4090ff" stroke-width="1"/>
    <text x="0" y="-10" text-anchor="middle" fill="#4090ff" font-size="15" font-weight="bold">
      Stability Theorem (Tropical)
    </text>
    <text x="0" y="12" text-anchor="middle" fill="#ccc" font-size="12">
      |perturbation| ≤ ε  →  |barcode change| ≤ ε  in bottleneck distance
    </text>
    <text x="0" y="28" text-anchor="middle" fill="#888" font-size="10">
      Features with lifetime &gt; 2ε survive perturbation — verified in Lean
    </text>
  </g>
  
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f9d923" />
    </marker>
  </defs>
</svg>
