<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#bg4)"/>

  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="20" font-weight="bold">
    Persistent Homology via Tropical Computation
  </text>

  <!-- Left: Point cloud with filtration -->
  <g transform="translate(50, 60)">
    <text x="160" y="15" text-anchor="middle" fill="#6bcb77" font-family="Georgia, serif" font-size="14" font-weight="bold">
      Vietoris-Rips Filtration
    </text>
    <text x="160" y="32" text-anchor="middle" fill="#88aacc" font-family="monospace" font-size="10">
      filt(σ) = max d(pᵢ, pⱼ) — tropical!
    </text>

    <!-- Points on a circle -->
    <circle cx="160" cy="150" r="80" fill="none" stroke="#333366" stroke-width="1" stroke-dasharray="4"/>

    <!-- Points -->
    <circle cx="240" cy="150" r="6" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="217" cy="220" r="6" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="160" cy="230" r="6" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="103" cy="220" r="6" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="80" cy="150" r="6" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="103" cy="80" r="6" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="160" cy="70" r="6" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="217" cy="80" r="6" fill="#4d96ff" filter="url(#glow5)"/>

    <!-- Some edges (at intermediate filtration) -->
    <line x1="240" y1="150" x2="217" y2="220" stroke="#6bcb77" stroke-width="1.5" opacity="0.6"/>
    <line x1="217" y1="220" x2="160" y2="230" stroke="#6bcb77" stroke-width="1.5" opacity="0.6"/>
    <line x1="160" y1="230" x2="103" y2="220" stroke="#6bcb77" stroke-width="1.5" opacity="0.6"/>
    <line x1="103" y1="220" x2="80" y2="150" stroke="#6bcb77" stroke-width="1.5" opacity="0.6"/>
    <line x1="80" y1="150" x2="103" y2="80" stroke="#6bcb77" stroke-width="1.5" opacity="0.6"/>
    <line x1="103" y1="80" x2="160" y2="70" stroke="#6bcb77" stroke-width="1.5" opacity="0.6"/>
    <line x1="160" y1="70" x2="217" y2="80" stroke="#6bcb77" stroke-width="1.5" opacity="0.6"/>
    <line x1="217" y1="80" x2="240" y2="150" stroke="#6bcb77" stroke-width="1.5" opacity="0.6"/>

    <!-- Scale indicator -->
    <text x="160" y="280" text-anchor="middle" fill="#aaaacc" font-family="monospace" font-size="10">
      ε increases →
    </text>

    <!-- Scale bars -->
    <rect x="50" y="290" width="30" height="8" rx="2" fill="#4d96ff" opacity="0.3"/>
    <rect x="90" y="290" width="50" height="8" rx="2" fill="#4d96ff" opacity="0.5"/>
    <rect x="150" y="290" width="70" height="8" rx="2" fill="#4d96ff" opacity="0.7"/>
    <rect x="230" y="290" width="50" height="8" rx="2" fill="#4d96ff" opacity="0.9"/>
  </g>

  <!-- Middle: Barcode diagram -->
  <g transform="translate(340, 60)">
    <text x="130" y="15" text-anchor="middle" fill="#ff6b6b" font-family="Georgia, serif" font-size="14" font-weight="bold">
      Persistence Barcode
    </text>
    <text x="130" y="32" text-anchor="middle" fill="#88aacc" font-family="monospace" font-size="10">
      Each bar = [birth, death)
    </text>

    <!-- Axes -->
    <line x1="30" y1="50" x2="30" y2="290" stroke="#30363d" stroke-width="1"/>
    <line x1="30" y1="290" x2="260" y2="290" stroke="#30363d" stroke-width="1"/>
    <text x="145" y="310" text-anchor="middle" fill="#888" font-size="10">filtration scale ε</text>

    <!-- H₀ bars (connected components) -->
    <text x="25" y="75" text-anchor="end" fill="#4d96ff" font-size="10">H₀</text>
    <line x1="35" y1="70" x2="250" y2="70" stroke="#4d96ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="85" x2="80" y2="85" stroke="#4d96ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="100" x2="90" y2="100" stroke="#4d96ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="115" x2="75" y2="115" stroke="#4d96ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="130" x2="100" y2="130" stroke="#4d96ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="145" x2="85" y2="145" stroke="#4d96ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="160" x2="70" y2="160" stroke="#4d96ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="175" x2="65" y2="175" stroke="#4d96ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <!-- H₁ bar (the cycle!) -->
    <text x="25" y="220" text-anchor="end" fill="#ff6b6b" font-size="10">H₁</text>
    <line x1="100" y1="215" x2="220" y2="215" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" filter="url(#glow5)"/>
    <text x="160" y="240" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="9">
      ← long bar = real feature!
    </text>

    <!-- Annotation -->
    <text x="130" y="270" text-anchor="middle" fill="#6bcb77" font-family="monospace" font-size="9">
      lifetime = death - birth
    </text>
  </g>

  <!-- Right: Bottleneck distance -->
  <g transform="translate(620, 60)">
    <text x="130" y="15" text-anchor="middle" fill="#ffd93d" font-family="Georgia, serif" font-size="14" font-weight="bold">
      Bottleneck Distance
    </text>
    <text x="130" y="32" text-anchor="middle" fill="#88aacc" font-family="monospace" font-size="10">
      d_B = max max(|Δb|, |Δd|)
    </text>

    <!-- Persistence diagram -->
    <line x1="30" y1="270" x2="260" y2="270" stroke="#30363d" stroke-width="1"/>
    <line x1="30" y1="270" x2="30" y2="50" stroke="#30363d" stroke-width="1"/>
    <text x="145" y="290" text-anchor="middle" fill="#888" font-size="10">birth</text>
    <text x="15" y="160" text-anchor="middle" fill="#888" font-size="10" transform="rotate(-90, 15, 160)">death</text>

    <!-- Diagonal -->
    <line x1="30" y1="270" x2="260" y2="50" stroke="#333366" stroke-width="1" stroke-dasharray="4"/>

    <!-- Points (diagram 1) -->
    <circle cx="60" cy="200" r="5" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="80" cy="120" r="5" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="100" cy="180" r="5" fill="#4d96ff" filter="url(#glow5)"/>
    <circle cx="120" cy="80" r="8" fill="#ff6b6b" filter="url(#glow5)"/>

    <!-- Points (diagram 2, slightly shifted) -->
    <circle cx="65" cy="195" r="5" fill="#6bcb77" opacity="0.7"/>
    <circle cx="85" cy="115" r="5" fill="#6bcb77" opacity="0.7"/>
    <circle cx="95" cy="175" r="5" fill="#6bcb77" opacity="0.7"/>
    <circle cx="125" cy="85" r="8" fill="#ffd93d" opacity="0.7"/>

    <!-- Matching lines -->
    <line x1="60" y1="200" x2="65" y2="195" stroke="#ffffff" stroke-width="1" stroke-dasharray="3"/>
    <line x1="80" y1="120" x2="85" y2="115" stroke="#ffffff" stroke-width="1" stroke-dasharray="3"/>
    <line x1="100" y1="180" x2="95" y2="175" stroke="#ffffff" stroke-width="1" stroke-dasharray="3"/>
    <line x1="120" y1="80" x2="125" y2="85" stroke="#ffffff" stroke-width="1" stroke-dasharray="3"/>

    <!-- Legend -->
    <circle cx="180" cy="240" r="4" fill="#4d96ff"/>
    <text x="190" y="244" fill="#4d96ff" font-size="9">Diagram 1</text>
    <circle cx="180" cy="258" r="4" fill="#6bcb77"/>
    <text x="190" y="262" fill="#6bcb77" font-size="9">Diagram 2</text>
  </g>

  <!-- Bottom: Key equations -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="800" height="100" rx="10" fill="#0a1628" stroke="#30363d" stroke-width="1.5"/>

    <text x="400" y="22" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="14" font-weight="bold">
      The Tropical Nature of Persistence
    </text>

    <text x="50" y="45" fill="#6bcb77" font-family="monospace" font-size="11">
      ⊕ = max  (tropical addition)
    </text>
    <text x="50" y="62" fill="#4d96ff" font-family="monospace" font-size="11">
      filtration = max of pairwise distances
    </text>
    <text x="50" y="79" fill="#ff6b6b" font-family="monospace" font-size="11">
      bottleneck = max of max of coordinate diffs
    </text>

    <text x="450" y="45" fill="#ffd93d" font-family="monospace" font-size="11">
      ✓ persistence_cubic_bound: O(n³)
    </text>
    <text x="450" y="62" fill="#ffd93d" font-family="monospace" font-size="11">
      ✓ barcode_tropical_invariance: max(a,b)=max(b,a)
    </text>
    <text x="450" y="79" fill="#ffd93d" font-family="monospace" font-size="11">
      ✓ wasserstein_bottleneck_bound: W₁ ≤ n·d_B
    </text>
  </g>
</svg>
