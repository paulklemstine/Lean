<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="relu_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd93d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tropical_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6bcb77;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4d96ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="22" font-weight="bold">
    Tropical Geometry of ReLU Networks
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#aaaacc" font-family="Georgia, serif" font-size="13">
    ReLU(x) = max(x, 0) — The Fundamental Tropical Operation
  </text>

  <!-- LEFT PANEL: ReLU Function -->
  <g transform="translate(50, 90)">
    <text x="160" y="0" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="14" font-weight="bold">
      Single Neuron: ReLU(x) = max(x, 0)
    </text>

    <!-- Axes -->
    <line x1="20" y1="180" x2="320" y2="180" stroke="#555588" stroke-width="1.5"/>
    <line x1="160" y1="30" x2="160" y2="210" stroke="#555588" stroke-width="1.5"/>
    <text x="325" y="184" fill="#888" font-size="11">x</text>
    <text x="164" y="25" fill="#888" font-size="11">y</text>

    <!-- ReLU function -->
    <!-- Negative part (y=0) -->
    <line x1="20" y1="180" x2="160" y2="180" stroke="#ff6b6b" stroke-width="3" filter="url(#glow2)"/>
    <!-- Positive part (y=x) -->
    <line x1="160" y1="180" x2="300" y2="40" stroke="#ffd93d" stroke-width="3" filter="url(#glow2)"/>
    <!-- Breakpoint -->
    <circle cx="160" cy="180" r="5" fill="#ffffff" filter="url(#glow)"/>

    <!-- Region labels -->
    <rect x="40" y="190" width="80" height="22" rx="4" fill="#ff6b6b" fill-opacity="0.2" stroke="#ff6b6b" stroke-width="1"/>
    <text x="80" y="206" text-anchor="middle" fill="#ff6b6b" font-size="11">Region 1: y=0</text>

    <rect x="200" y="190" width="80" height="22" rx="4" fill="#ffd93d" fill-opacity="0.2" stroke="#ffd93d" stroke-width="1"/>
    <text x="240" y="206" text-anchor="middle" fill="#ffd93d" font-size="11">Region 2: y=x</text>

    <!-- Idempotence annotation -->
    <text x="160" y="240" text-anchor="middle" fill="#6bcb77" font-family="monospace" font-size="12">
      ReLU(ReLU(x)) = ReLU(x) — Idempotent!
    </text>
  </g>

  <!-- RIGHT PANEL: Deep Network Regions -->
  <g transform="translate(470, 90)">
    <text x="190" y="0" text-anchor="middle" fill="#4d96ff" font-family="monospace" font-size="14" font-weight="bold">
      Deep Network: Exponential Regions
    </text>

    <!-- Piecewise linear function (multi-layer) -->
    <!-- Axes -->
    <line x1="20" y1="180" x2="380" y2="180" stroke="#555588" stroke-width="1.5"/>
    <line x1="20" y1="30" x2="20" y2="210" stroke="#555588" stroke-width="1.5"/>

    <!-- Complex piecewise-linear function -->
    <polyline points="20,160 60,140 90,170 120,90 160,120 190,60 230,100 260,70 300,130 340,50 380,80"
              fill="none" stroke="url(#tropical_grad)" stroke-width="3" filter="url(#glow2)"/>

    <!-- Breakpoints -->
    <circle cx="60" cy="140" r="3" fill="#ffffff"/>
    <circle cx="90" cy="170" r="3" fill="#ffffff"/>
    <circle cx="120" cy="90" r="3" fill="#ffffff"/>
    <circle cx="160" cy="120" r="3" fill="#ffffff"/>
    <circle cx="190" cy="60" r="3" fill="#ffffff"/>
    <circle cx="230" cy="100" r="3" fill="#ffffff"/>
    <circle cx="260" cy="70" r="3" fill="#ffffff"/>
    <circle cx="300" cy="130" r="3" fill="#ffffff"/>
    <circle cx="340" cy="50" r="3" fill="#ffffff"/>

    <!-- Region count formula -->
    <text x="190" y="225" text-anchor="middle" fill="#6bcb77" font-family="monospace" font-size="12">
      Regions ≤ Π (tropical rank per layer)
    </text>
    <text x="190" y="245" text-anchor="middle" fill="#aaaacc" font-family="monospace" font-size="11">
      = (tropical degree)^depth
    </text>
  </g>

  <!-- BOTTOM PANEL: Architecture Comparison -->
  <g transform="translate(50, 370)">
    <text x="400" y="0" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="16" font-weight="bold">
      Training-Free Architecture Ranking via Tropical Rank
    </text>

    <!-- Table -->
    <g transform="translate(30, 20)">
      <!-- Header -->
      <rect x="0" y="0" width="740" height="28" rx="4" fill="#333366"/>
      <text x="120" y="19" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="12" font-weight="bold">Architecture</text>
      <text x="300" y="19" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="12" font-weight="bold">Tropical Rank/Layer</text>
      <text x="460" y="19" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="12" font-weight="bold">Depth</text>
      <text x="610" y="19" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="12" font-weight="bold">log₂(Score)</text>

      <!-- Rows -->
      <rect x="0" y="32" width="740" height="24" rx="2" fill="#1a1a3e"/>
      <text x="120" y="49" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">CNN (k=3, c=64)</text>
      <text x="300" y="49" text-anchor="middle" fill="#6bcb77" font-family="monospace" font-size="11">192</text>
      <text x="460" y="49" text-anchor="middle" fill="#4d96ff" font-family="monospace" font-size="11">3</text>
      <text x="610" y="49" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11">22.7</text>

      <rect x="0" y="58" width="740" height="24" rx="2" fill="#222244"/>
      <text x="120" y="75" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Transformer (h=8, d_k=64)</text>
      <text x="300" y="75" text-anchor="middle" fill="#6bcb77" font-family="monospace" font-size="11">512</text>
      <text x="460" y="75" text-anchor="middle" fill="#4d96ff" font-family="monospace" font-size="11">6</text>
      <text x="610" y="75" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11">54.0</text>

      <rect x="0" y="84" width="740" height="24" rx="2" fill="#1a1a3e"/>
      <text x="120" y="101" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">MobileNet (dw=3, pw=128)</text>
      <text x="300" y="101" text-anchor="middle" fill="#6bcb77" font-family="monospace" font-size="11">384</text>
      <text x="460" y="101" text-anchor="middle" fill="#4d96ff" font-family="monospace" font-size="11">6</text>
      <text x="610" y="101" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11">50.3</text>

      <rect x="0" y="110" width="740" height="24" rx="2" fill="#222244"/>
      <text x="120" y="127" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">ResNet-18</text>
      <text x="300" y="127" text-anchor="middle" fill="#6bcb77" font-family="monospace" font-size="11">64</text>
      <text x="460" y="127" text-anchor="middle" fill="#4d96ff" font-family="monospace" font-size="11">18</text>
      <text x="610" y="127" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11">108.0</text>
    </g>

    <!-- No training badge -->
    <rect x="580" y="170" width="180" height="30" rx="15" fill="#6bcb77" fill-opacity="0.2" stroke="#6bcb77" stroke-width="2"/>
    <text x="670" y="190" text-anchor="middle" fill="#6bcb77" font-family="monospace" font-size="12" font-weight="bold">
      NO TRAINING NEEDED
    </text>
  </g>

  <!-- Footer -->
  <text x="450" y="580" text-anchor="middle" fill="#666688" font-family="Georgia, serif" font-size="11">
    Machine-verified in Lean 4 with Mathlib — All theorems compile without sorry
  </text>
</svg>
