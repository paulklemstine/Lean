<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e1a4e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="550" fill="url(#bg5)"/>

  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="20" font-weight="bold">
    From E8 to Leech: Exceptional Lattice Quantum Codes
  </text>

  <!-- E8 Dynkin diagram -->
  <g transform="translate(50, 70)">
    <text x="160" y="0" text-anchor="middle" fill="#ffd93d" font-family="Georgia, serif" font-size="14" font-weight="bold">
      E₈ Dynkin Diagram
    </text>

    <!-- Main chain -->
    <line x1="30" y1="40" x2="70" y2="40" stroke="#ffd93d" stroke-width="2"/>
    <line x1="70" y1="40" x2="110" y2="40" stroke="#ffd93d" stroke-width="2"/>
    <line x1="110" y1="40" x2="150" y2="40" stroke="#ffd93d" stroke-width="2"/>
    <line x1="150" y1="40" x2="190" y2="40" stroke="#ffd93d" stroke-width="2"/>
    <line x1="190" y1="40" x2="230" y2="40" stroke="#ffd93d" stroke-width="2"/>
    <line x1="230" y1="40" x2="270" y2="40" stroke="#ffd93d" stroke-width="2"/>
    <!-- Branch -->
    <line x1="150" y1="40" x2="150" y2="80" stroke="#ffd93d" stroke-width="2"/>

    <!-- Nodes -->
    <circle cx="30" cy="40" r="8" fill="#1a0a2e" stroke="#ffd93d" stroke-width="2" filter="url(#glow6)"/>
    <circle cx="70" cy="40" r="8" fill="#1a0a2e" stroke="#ffd93d" stroke-width="2" filter="url(#glow6)"/>
    <circle cx="110" cy="40" r="8" fill="#1a0a2e" stroke="#ffd93d" stroke-width="2" filter="url(#glow6)"/>
    <circle cx="150" cy="40" r="8" fill="#ffd93d" stroke="#ffd93d" stroke-width="2" filter="url(#glow6)"/>
    <circle cx="190" cy="40" r="8" fill="#1a0a2e" stroke="#ffd93d" stroke-width="2" filter="url(#glow6)"/>
    <circle cx="230" cy="40" r="8" fill="#1a0a2e" stroke="#ffd93d" stroke-width="2" filter="url(#glow6)"/>
    <circle cx="270" cy="40" r="8" fill="#1a0a2e" stroke="#ffd93d" stroke-width="2" filter="url(#glow6)"/>
    <circle cx="150" cy="80" r="8" fill="#1a0a2e" stroke="#ffd93d" stroke-width="2" filter="url(#glow6)"/>

    <text x="160" y="110" text-anchor="middle" fill="#ccaa66" font-family="monospace" font-size="10">
      8 nodes, 7 edges (Lean ✓)
    </text>
  </g>

  <!-- E8 properties -->
  <g transform="translate(400, 70)">
    <text x="200" y="0" text-anchor="middle" fill="#4d96ff" font-family="Georgia, serif" font-size="14" font-weight="bold">
      E₈ Root System Properties
    </text>

    <rect x="20" y="15" width="360" height="100" rx="8" fill="#1a1a3e" stroke="#4d96ff" stroke-width="1"/>

    <text x="40" y="38" fill="#ffffff" font-family="monospace" font-size="11">Dimension:  8 = 2³</text>
    <text x="40" y="56" fill="#ffffff" font-family="monospace" font-size="11">Roots:      240 = 112 + 128</text>
    <text x="40" y="74" fill="#ffffff" font-family="monospace" font-size="11">Min norm²:  2 (even lattice)</text>
    <text x="40" y="92" fill="#ffffff" font-family="monospace" font-size="11">Self-dual:  E₈ = E₈⊥ → CSS</text>
    <text x="40" y="108" fill="#6bcb77" font-family="monospace" font-size="10">Quantum: [[8, 0, 4]] → 1 error</text>
  </g>

  <!-- Arrow: E8 → E8×E8 → Leech -->
  <g transform="translate(50, 200)">
    <text x="400" y="0" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="16" font-weight="bold">
      The Dimension Ladder: 8 → 16 → 24
    </text>

    <!-- E8 box -->
    <rect x="30" y="20" width="180" height="120" rx="10" fill="#2a1a0a" stroke="#ffd93d" stroke-width="2"/>
    <text x="120" y="45" text-anchor="middle" fill="#ffd93d" font-family="Georgia, serif" font-size="16" font-weight="bold">E₈</text>
    <text x="120" y="65" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">dim = 8</text>
    <text x="120" y="80" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">kiss = 240</text>
    <text x="120" y="95" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">min ‖·‖² = 2</text>
    <text x="120" y="115" text-anchor="middle" fill="#6bcb77" font-family="monospace" font-size="10">[[8, 0, 4]]</text>
    <text x="120" y="130" text-anchor="middle" fill="#aaaacc" font-family="monospace" font-size="9">corrects 1 error</text>

    <!-- Arrow -->
    <line x1="220" y1="80" x2="310" y2="80" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="265" y="70" text-anchor="middle" fill="#aaaacc" font-size="10">×2</text>

    <!-- BW16 box -->
    <rect x="320" y="20" width="180" height="120" rx="10" fill="#1a2a1a" stroke="#6bcb77" stroke-width="2"/>
    <text x="410" y="45" text-anchor="middle" fill="#6bcb77" font-family="Georgia, serif" font-size="16" font-weight="bold">BW₁₆</text>
    <text x="410" y="65" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">dim = 16 = 8+8</text>
    <text x="410" y="80" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">kiss = 4,320</text>
    <text x="410" y="95" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">min ‖·‖² = 4</text>
    <text x="410" y="115" text-anchor="middle" fill="#aaaacc" font-family="monospace" font-size="10">E₈ × E₈ heterotic</text>
    <text x="410" y="130" text-anchor="middle" fill="#aaaacc" font-family="monospace" font-size="9">(Lean: e8_product_dimension)</text>

    <!-- Arrow -->
    <line x1="510" y1="80" x2="600" y2="80" stroke="#ffffff" stroke-width="2"/>
    <text x="555" y="70" text-anchor="middle" fill="#aaaacc" font-size="10">+8</text>

    <!-- Leech box -->
    <rect x="610" y="20" width="180" height="120" rx="10" fill="#1a1a3a" stroke="#cc66ff" stroke-width="2"/>
    <text x="700" y="45" text-anchor="middle" fill="#cc66ff" font-family="Georgia, serif" font-size="16" font-weight="bold">Λ₂₄</text>
    <text x="700" y="65" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">dim = 24 = 3×8</text>
    <text x="700" y="80" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">kiss = 196,560</text>
    <text x="700" y="95" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10">min ‖·‖² = 4</text>
    <text x="700" y="115" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="10">[[24, 0, 8]]</text>
    <text x="700" y="130" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="9">corrects 3 errors!</text>
  </g>

  <!-- Golay code connection -->
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="800" height="140" rx="10" fill="#1a1a2e" stroke="#30363d" stroke-width="1.5"/>

    <text x="400" y="22" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="14" font-weight="bold">
      Golay Code → Leech Lattice → Quantum Error Correction
    </text>

    <!-- Flow diagram -->
    <rect x="30" y="40" width="150" height="45" rx="6" fill="#2a1a3e" stroke="#cc66ff" stroke-width="1.5"/>
    <text x="105" y="58" text-anchor="middle" fill="#cc66ff" font-family="monospace" font-size="11">Golay [24,12,8]</text>
    <text x="105" y="74" text-anchor="middle" fill="#aaaacc" font-family="monospace" font-size="9">perfect binary code</text>

    <text x="205" y="65" fill="#ffffff" font-size="16">→</text>

    <rect x="230" y="40" width="150" height="45" rx="6" fill="#1a2a3e" stroke="#4d96ff" stroke-width="1.5"/>
    <text x="305" y="58" text-anchor="middle" fill="#4d96ff" font-family="monospace" font-size="11">Construction A</text>
    <text x="305" y="74" text-anchor="middle" fill="#aaaacc" font-family="monospace" font-size="9">Λ = ∪ (2ℤⁿ + c)</text>

    <text x="405" y="65" fill="#ffffff" font-size="16">→</text>

    <rect x="430" y="40" width="150" height="45" rx="6" fill="#2a2a1a" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="505" y="58" text-anchor="middle" fill="#ffd93d" font-family="monospace" font-size="11">Leech Λ₂₄</text>
    <text x="505" y="74" text-anchor="middle" fill="#aaaacc" font-family="monospace" font-size="9">densest in dim 24</text>

    <text x="605" y="65" fill="#ffffff" font-size="16">→</text>

    <rect x="630" y="40" width="150" height="45" rx="6" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="705" y="58" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11">[[24, 0, 8]]</text>
    <text x="705" y="74" text-anchor="middle" fill="#aaaacc" font-family="monospace" font-size="9">3-error quantum code</text>

    <!-- Key facts -->
    <text x="40" y="110" fill="#6bcb77" font-family="monospace" font-size="10">✓ golay_parameters: 24 = 2×12</text>
    <text x="40" y="125" fill="#6bcb77" font-family="monospace" font-size="10">✓ golay_perfect_bound: 2¹² = 4096</text>
    <text x="300" y="110" fill="#6bcb77" font-family="monospace" font-size="10">✓ leech_kissing_decomposition: 196560 = 97152+99360+48</text>
    <text x="300" y="125" fill="#6bcb77" font-family="monospace" font-size="10">✓ leech_quantum_distance: ⌊(8-1)/2⌋ = 3 errors</text>
  </g>
</svg>
