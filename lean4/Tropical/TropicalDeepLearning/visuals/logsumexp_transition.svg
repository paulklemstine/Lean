<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="550" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="20" font-weight="bold">
    LogSumExp: The Quantum → Tropical Bridge
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-family="Georgia, serif" font-size="13">
    LSE_β(x) = (1/β) · log(Σ exp(β·xᵢ)) interpolates between mean and max
  </text>

  <!-- Temperature spectrum bar -->
  <g transform="translate(100, 75)">
    <rect x="0" y="0" width="700" height="30" rx="15" fill="url(#hot)" fill-opacity="0.3" stroke="url(#hot)" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="12" font-weight="bold">β → 0</text>
    <text x="350" y="20" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="12" font-weight="bold">β = 1</text>
    <text x="650" y="20" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="12" font-weight="bold">β → ∞</text>

    <text x="50" y="50" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="10">QUANTUM</text>
    <text x="50" y="62" text-anchor="middle" fill="#ff6666" font-family="monospace" font-size="9">mean(x)</text>
    <text x="350" y="50" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="10">CLASSICAL</text>
    <text x="350" y="62" text-anchor="middle" fill="#ffcc44" font-family="monospace" font-size="9">softmax(x)</text>
    <text x="650" y="50" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10">TROPICAL</text>
    <text x="650" y="62" text-anchor="middle" fill="#44ffaa" font-family="monospace" font-size="9">max(x)</text>
  </g>

  <!-- Main plot: LSE curves for different β -->
  <g transform="translate(80, 160)">
    <!-- Axes -->
    <line x1="40" y1="0" x2="40" y2="260" stroke="#30363d" stroke-width="1.5"/>
    <line x1="40" y1="260" x2="400" y2="260" stroke="#30363d" stroke-width="1.5"/>
    <text x="220" y="290" text-anchor="middle" fill="#8b949e" font-size="12">Input values x</text>
    <text x="15" y="130" text-anchor="middle" fill="#8b949e" font-size="12" transform="rotate(-90, 15, 130)">LSE_β(x)</text>

    <!-- Grid lines -->
    <line x1="40" y1="60" x2="400" y2="60" stroke="#21262d" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="40" y1="130" x2="400" y2="130" stroke="#21262d" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="40" y1="200" x2="400" y2="200" stroke="#21262d" stroke-width="0.5" stroke-dasharray="4"/>

    <!-- max line (β → ∞) -->
    <line x1="40" y1="40" x2="400" y2="40" stroke="#00ff88" stroke-width="2" stroke-dasharray="8,4" filter="url(#glow3)"/>
    <text x="405" y="44" fill="#00ff88" font-family="monospace" font-size="11">max = 5</text>

    <!-- mean line (β → 0) -->
    <line x1="40" y1="170" x2="400" y2="170" stroke="#ff4444" stroke-width="2" stroke-dasharray="8,4" filter="url(#glow3)"/>
    <text x="405" y="174" fill="#ff4444" font-family="monospace" font-size="11">mean = 3</text>

    <!-- LSE curves for different β (interpolating between mean and max) -->
    <!-- β = 0.5 -->
    <line x1="40" y1="155" x2="400" y2="155" stroke="#ff6666" stroke-width="2" opacity="0.7"/>
    <text x="405" y="159" fill="#ff6666" font-family="monospace" font-size="10">β=0.5</text>

    <!-- β = 1 -->
    <line x1="40" y1="130" x2="400" y2="130" stroke="#ffaa00" stroke-width="2" opacity="0.8"/>
    <text x="405" y="134" fill="#ffaa00" font-family="monospace" font-size="10">β=1</text>

    <!-- β = 2 -->
    <line x1="40" y1="100" x2="400" y2="100" stroke="#aacc00" stroke-width="2" opacity="0.8"/>
    <text x="405" y="104" fill="#aacc00" font-family="monospace" font-size="10">β=2</text>

    <!-- β = 5 -->
    <line x1="40" y1="65" x2="400" y2="65" stroke="#44dd66" stroke-width="2" opacity="0.9"/>
    <text x="405" y="69" fill="#44dd66" font-family="monospace" font-size="10">β=5</text>

    <!-- β = 20 -->
    <line x1="40" y1="47" x2="400" y2="47" stroke="#22ee88" stroke-width="2" opacity="0.9"/>
    <text x="405" y="51" fill="#22ee88" font-family="monospace" font-size="10">β=20</text>

    <!-- Gap annotation -->
    <line x1="370" y1="40" x2="370" y2="170" stroke="#ffffff" stroke-width="1" stroke-dasharray="3"/>
    <text x="355" y="110" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="10">gap ≤ log(n)/β</text>
  </g>

  <!-- RIGHT: Softmax concentration -->
  <g transform="translate(530, 160)">
    <text x="170" y="0" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="14" font-weight="bold">
      Boltzmann Concentration
    </text>

    <!-- Bar charts for different β -->
    <g transform="translate(0, 20)">
      <text x="0" y="15" fill="#ff4444" font-family="monospace" font-size="11">β = 0.1 (uniform)</text>
      <rect x="120" y="3" width="40" height="14" rx="2" fill="#ff4444" fill-opacity="0.6"/>
      <rect x="165" y="3" width="42" height="14" rx="2" fill="#ff4444" fill-opacity="0.6"/>
      <rect x="212" y="3" width="41" height="14" rx="2" fill="#ff4444" fill-opacity="0.6"/>
      <rect x="258" y="3" width="42" height="14" rx="2" fill="#ff4444" fill-opacity="0.6"/>
      <rect x="305" y="3" width="41" height="14" rx="2" fill="#ff4444" fill-opacity="0.6"/>
    </g>

    <g transform="translate(0, 55)">
      <text x="0" y="15" fill="#ffaa00" font-family="monospace" font-size="11">β = 1 (soft)</text>
      <rect x="120" y="8" width="15" height="9" rx="2" fill="#ffaa00" fill-opacity="0.6"/>
      <rect x="165" y="4" width="30" height="13" rx="2" fill="#ffaa00" fill-opacity="0.6"/>
      <rect x="212" y="6" width="22" height="11" rx="2" fill="#ffaa00" fill-opacity="0.6"/>
      <rect x="258" y="0" width="60" height="17" rx="2" fill="#ffaa00" fill-opacity="0.8"/>
      <rect x="305" y="2" width="45" height="15" rx="2" fill="#ffaa00" fill-opacity="0.6"/>
    </g>

    <g transform="translate(0, 90)">
      <text x="0" y="15" fill="#44dd66" font-family="monospace" font-size="11">β = 5 (peaked)</text>
      <rect x="120" y="12" width="5" height="5" rx="1" fill="#44dd66" fill-opacity="0.4"/>
      <rect x="165" y="10" width="10" height="7" rx="1" fill="#44dd66" fill-opacity="0.4"/>
      <rect x="212" y="11" width="7" height="6" rx="1" fill="#44dd66" fill-opacity="0.4"/>
      <rect x="258" y="0" width="90" height="17" rx="2" fill="#44dd66" fill-opacity="0.9"/>
      <rect x="305" y="8" width="15" height="9" rx="1" fill="#44dd66" fill-opacity="0.4"/>
    </g>

    <g transform="translate(0, 125)">
      <text x="0" y="15" fill="#00ff88" font-family="monospace" font-size="11">β → ∞ (argmax)</text>
      <rect x="120" y="14" width="2" height="3" rx="1" fill="#00ff88" fill-opacity="0.2"/>
      <rect x="165" y="14" width="2" height="3" rx="1" fill="#00ff88" fill-opacity="0.2"/>
      <rect x="212" y="14" width="2" height="3" rx="1" fill="#00ff88" fill-opacity="0.2"/>
      <rect x="258" y="0" width="110" height="17" rx="2" fill="#00ff88" fill-opacity="1.0"/>
      <rect x="305" y="14" width="2" height="3" rx="1" fill="#00ff88" fill-opacity="0.2"/>
    </g>

    <!-- Labels -->
    <text x="280" y="170" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">
      x = [1, 3, 2, 5, 4]
    </text>
  </g>

  <!-- Bottom: Key equations -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="800" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

    <text x="400" y="22" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">
      Key Theorems (Machine-Verified in Lean 4)
    </text>

    <text x="30" y="45" fill="#00ff88" font-family="monospace" font-size="11">
      ✓ log_cooling_monotone: β(t₁) ≤ β(t₂) for t₁ ≤ t₂
    </text>
    <text x="30" y="62" fill="#ffaa00" font-family="monospace" font-size="11">
      ✓ cooling_gap_bound: log(2)/β ≤ log(2) for β ≥ 1
    </text>
    <text x="450" y="45" fill="#4d96ff" font-family="monospace" font-size="11">
      ✓ boltzmann_concentration: exp(βx) &lt; exp(βy) for x &lt; y
    </text>
    <text x="450" y="62" fill="#ff6b6b" font-family="monospace" font-size="11">
      ✓ free_energy_bounds: E - T·S ≤ E for T,S ≥ 0
    </text>
  </g>
</svg>
