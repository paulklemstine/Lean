<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a1d"/>
      <stop offset="100%" style="stop-color:#1a1145"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="40%" cy="35%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:0.1"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e0e7ff" font-size="22" font-weight="bold">
    Projective Hilbert Space — ℙ(ℋ)
  </text>
  <text x="400" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">
    Quantum states are rays, not vectors: |ψ⟩ ~ e^{iθ}|ψ⟩
  </text>

  <!-- Bloch Sphere -->
  <g transform="translate(250, 330)">
    <!-- Sphere outline -->
    <ellipse cx="0" cy="0" rx="150" ry="150" fill="url(#sphereGrad)" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>

    <!-- Equator -->
    <ellipse cx="0" cy="0" rx="150" ry="40" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.4"/>

    <!-- Meridian -->
    <ellipse cx="0" cy="0" rx="40" ry="150" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

    <!-- Axes -->
    <line x1="-170" y1="0" x2="170" y2="0" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="-170" x2="0" y2="170" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,3"/>

    <!-- State vectors (rays) -->
    <!-- |0⟩ = north pole -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#34d399" stroke-width="2.5" filter="url(#glow3)"/>
    <circle cx="0" cy="-150" r="6" fill="#34d399" filter="url(#glow3)"/>
    <text x="15" y="-155" fill="#34d399" font-size="14" font-weight="bold">|0⟩</text>

    <!-- |1⟩ = south pole -->
    <line x1="0" y1="0" x2="0" y2="150" stroke="#ef4444" stroke-width="2.5" filter="url(#glow3)"/>
    <circle cx="0" cy="150" r="6" fill="#ef4444" filter="url(#glow3)"/>
    <text x="15" y="155" fill="#ef4444" font-size="14" font-weight="bold">|1⟩</text>

    <!-- |+⟩ = equator -->
    <line x1="0" y1="0" x2="150" y2="0" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow3)"/>
    <circle cx="150" cy="0" r="6" fill="#f59e0b" filter="url(#glow3)"/>
    <text x="160" y="5" fill="#f59e0b" font-size="14" font-weight="bold">|+⟩</text>

    <!-- |−⟩ = equator opposite -->
    <line x1="0" y1="0" x2="-150" y2="0" stroke="#818cf8" stroke-width="2.5" filter="url(#glow3)"/>
    <circle cx="-150" cy="0" r="6" fill="#818cf8" filter="url(#glow3)"/>
    <text x="-175" y="5" fill="#818cf8" font-size="14" font-weight="bold">|−⟩</text>

    <!-- General state -->
    <line x1="0" y1="0" x2="106" y2="-106" stroke="#f472b6" stroke-width="2" filter="url(#glow3)"/>
    <circle cx="106" cy="-106" r="5" fill="#f472b6" filter="url(#glow3)"/>
    <text x="115" y="-110" fill="#f472b6" font-size="12">|ψ⟩</text>

    <!-- Phase orbit (circle at constant latitude) -->
    <ellipse cx="0" cy="-106" rx="106" ry="28" fill="none" stroke="#f472b6" stroke-width="1"
             stroke-dasharray="4,4" opacity="0.5"/>
    <text x="120" y="-80" fill="#f472b6" font-size="10" opacity="0.7">phase orbit</text>

    <!-- Center -->
    <circle cx="0" cy="0" r="3" fill="#e0e7ff"/>

    <!-- Labels -->
    <text x="0" y="195" text-anchor="middle" fill="#94a3b8" font-size="12">Bloch Sphere (qubit)</text>
    <text x="175" y="15" fill="#64748b" font-size="10">x</text>
    <text x="5" y="-165" fill="#64748b" font-size="10">z</text>
  </g>

  <!-- Right panel: Key theorems -->
  <g transform="translate(500, 140)">
    <rect x="0" y="0" width="270" height="380" rx="12" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" opacity="0.7"/>

    <text x="135" y="30" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">
      Verified Theorems
    </text>

    <text x="20" y="60" fill="#34d399" font-size="12">✓</text>
    <text x="40" y="60" fill="#e0e7ff" font-size="11">Phase invariance:</text>
    <text x="40" y="78" fill="#c4b5fd" font-size="11">‖e^{iθ}ψ‖ = ‖ψ‖</text>

    <text x="20" y="105" fill="#34d399" font-size="12">✓</text>
    <text x="40" y="105" fill="#e0e7ff" font-size="11">Born rule:</text>
    <text x="40" y="123" fill="#c4b5fd" font-size="11">|⟨ψ|φ⟩|² ∈ [0, 1]</text>

    <text x="20" y="150" fill="#34d399" font-size="12">✓</text>
    <text x="40" y="150" fill="#e0e7ff" font-size="11">Cauchy-Schwarz:</text>
    <text x="40" y="168" fill="#c4b5fd" font-size="11">|⟨ψ|φ⟩| ≤ ‖ψ‖·‖φ‖</text>

    <text x="20" y="195" fill="#34d399" font-size="12">✓</text>
    <text x="40" y="195" fill="#e0e7ff" font-size="11">Fidelity symmetric:</text>
    <text x="40" y="213" fill="#c4b5fd" font-size="11">|⟨ψ|φ⟩| = |⟨φ|ψ⟩|</text>

    <text x="20" y="240" fill="#34d399" font-size="12">✓</text>
    <text x="40" y="240" fill="#e0e7ff" font-size="11">Projection decreases:</text>
    <text x="40" y="258" fill="#c4b5fd" font-size="11">‖Pψ‖ ≤ ‖ψ‖</text>

    <text x="20" y="285" fill="#34d399" font-size="12">✓</text>
    <text x="40" y="285" fill="#e0e7ff" font-size="11">Parallelogram law:</text>
    <text x="40" y="303" fill="#c4b5fd" font-size="10">‖ψ+φ‖²+‖ψ-φ‖²=2(‖ψ‖²+‖φ‖²)</text>

    <text x="20" y="330" fill="#34d399" font-size="12">✓</text>
    <text x="40" y="330" fill="#e0e7ff" font-size="11">Lattice modular:</text>
    <text x="40" y="348" fill="#c4b5fd" font-size="10">A≤C ⟹ A∨(B∧C) = (A∨B)∧C</text>

    <text x="135" y="375" text-anchor="middle" fill="#94a3b8" font-size="10">
      20 theorems · Lean 4 · 0 sorries
    </text>
  </g>
</svg>
