<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="qgrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#qgrad1)"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#e0e7ff" font-size="24" font-weight="bold" filter="url(#glow)">
    Quantum Phase Lattice — ℒ(ℋ)
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">
    Complete Lattice of Closed Subspaces of a Hilbert Space
  </text>

  <!-- Lattice Diagram (left side) -->
  <g transform="translate(220, 380)">
    <!-- Edges -->
    <line x1="0" y1="-200" x2="-120" y2="-80" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-200" x2="0" y2="-80" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-200" x2="120" y2="-80" stroke="#6366f1" stroke-width="2" opacity="0.6"/>

    <line x1="-120" y1="-80" x2="-120" y2="60" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="-120" y1="-80" x2="0" y2="60" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-80" x2="-120" y2="60" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-80" x2="0" y2="60" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-80" x2="120" y2="60" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="120" y1="-80" x2="0" y2="60" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="120" y1="-80" x2="120" y2="60" stroke="#6366f1" stroke-width="2" opacity="0.6"/>

    <line x1="-120" y1="60" x2="0" y2="180" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="60" x2="0" y2="180" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
    <line x1="120" y1="60" x2="0" y2="180" stroke="#6366f1" stroke-width="2" opacity="0.6"/>

    <!-- Top node: ℋ -->
    <circle cx="0" cy="-200" r="22" fill="url(#topGrad)" filter="url(#glow)"/>
    <text x="0" y="-195" text-anchor="middle" fill="white" font-size="16" font-weight="bold">ℋ</text>

    <!-- Middle-upper nodes: 2D subspaces -->
    <circle cx="-120" cy="-80" r="18" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <text x="-120" y="-75" text-anchor="middle" fill="white" font-size="11">K₁∨K₂</text>

    <circle cx="0" cy="-80" r="18" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <text x="0" y="-75" text-anchor="middle" fill="white" font-size="11">K₁∨K₃</text>

    <circle cx="120" cy="-80" r="18" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <text x="120" y="-75" text-anchor="middle" fill="white" font-size="11">K₂∨K₃</text>

    <!-- Middle-lower nodes: 1D subspaces (rays) -->
    <circle cx="-120" cy="60" r="18" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <text x="-120" y="65" text-anchor="middle" fill="white" font-size="12">K₁</text>

    <circle cx="0" cy="60" r="18" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <text x="0" y="65" text-anchor="middle" fill="white" font-size="12">K₂</text>

    <circle cx="120" cy="60" r="18" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <text x="120" y="65" text-anchor="middle" fill="white" font-size="12">K₃</text>

    <!-- Bottom node: {0} -->
    <circle cx="0" cy="180" r="22" fill="url(#botGrad)" filter="url(#glow)"/>
    <text x="0" y="185" text-anchor="middle" fill="white" font-size="14" font-weight="bold">{0}</text>

    <!-- Labels -->
    <text x="-170" y="-195" text-anchor="end" fill="#94a3b8" font-size="11">⊤ (full space)</text>
    <text x="-170" y="65" text-anchor="end" fill="#94a3b8" font-size="11">rays in ℙ(ℋ)</text>
    <text x="-170" y="185" text-anchor="end" fill="#94a3b8" font-size="11">⊥ (zero)</text>
  </g>

  <!-- Interference diagram (right side) -->
  <g transform="translate(620, 200)">
    <text x="0" y="-20" text-anchor="middle" fill="#e0e7ff" font-size="16" font-weight="bold">
      Quantum Interference
    </text>

    <!-- Wave 1 -->
    <path d="M-120,30 Q-90,0 -60,30 Q-30,60 0,30 Q30,0 60,30 Q90,60 120,30"
          fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8"/>
    <text x="140" y="35" fill="#818cf8" font-size="11">ψ</text>

    <!-- Wave 2 -->
    <path d="M-120,70 Q-90,40 -60,70 Q-30,100 0,70 Q30,40 60,70 Q90,100 120,70"
          fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
    <text x="140" y="75" fill="#34d399" font-size="11">φ</text>

    <!-- Sum wave (constructive) -->
    <path d="M-120,140 Q-90,80 -60,140 Q-30,200 0,140 Q30,80 60,140 Q90,200 120,140"
          fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.9"/>
    <text x="140" y="145" fill="#f59e0b" font-size="11">ψ+φ</text>

    <!-- Formula -->
    <text x="0" y="235" text-anchor="middle" fill="#e0e7ff" font-size="12">
      ‖ψ+φ‖² = ‖ψ‖² + ‖φ‖² + 2Re⟨ψ|φ⟩
    </text>

    <!-- Coherence bound -->
    <rect x="-130" y="255" width="260" height="35" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
    <text x="0" y="278" text-anchor="middle" fill="#c4b5fd" font-size="11">
      |Re⟨ψ|φ⟩| ≤ ‖ψ‖·‖φ‖  (Coherence Bound)
    </text>
  </g>

  <!-- Phase Invariance diagram -->
  <g transform="translate(620, 480)">
    <text x="0" y="0" text-anchor="middle" fill="#e0e7ff" font-size="16" font-weight="bold">
      Projective Hilbert Space
    </text>

    <!-- Circle representing phase -->
    <circle cx="0" cy="80" r="55" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>

    <!-- Rays -->
    <line x1="0" y1="80" x2="55" y2="80" stroke="#f59e0b" stroke-width="2"/>
    <line x1="0" y1="80" x2="39" y2="41" stroke="#34d399" stroke-width="2"/>
    <line x1="0" y1="80" x2="-17" y2="28" stroke="#818cf8" stroke-width="2"/>
    <line x1="0" y1="80" x2="-52" y2="63" stroke="#f472b6" stroke-width="2"/>

    <!-- Phase arrow -->
    <path d="M55,75 A55,55 0 0,1 39,36" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="58" y="55" fill="#94a3b8" font-size="11">e^{iθ}</text>

    <!-- Center dot -->
    <circle cx="0" cy="80" r="3" fill="#e0e7ff"/>

    <!-- Labels -->
    <text x="0" y="160" text-anchor="middle" fill="#c4b5fd" font-size="11">
      ‖e^{iθ}ψ‖ = ‖ψ‖
    </text>
    <text x="0" y="178" text-anchor="middle" fill="#94a3b8" font-size="10">
      States = rays, not vectors
    </text>
  </g>

  <!-- Key properties box -->
  <g transform="translate(30, 610)">
    <rect x="0" y="0" width="840" height="70" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" opacity="0.8"/>
    <text x="20" y="22" fill="#f59e0b" font-size="13" font-weight="bold">Key Properties (Formally Verified in Lean 4)</text>
    <text x="20" y="42" fill="#e0e7ff" font-size="11">
      ✓ Complete lattice  ✓ Modular (non-distributive)  ✓ Phase invariant  ✓ Born rule bounded
    </text>
    <text x="20" y="58" fill="#e0e7ff" font-size="11">
      ✓ Projection norm ≤ 1  ✓ Parallelogram law  ✓ Contractive transport  ✓ 20 theorems, 0 sorries
    </text>
  </g>
</svg>
