<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .title { font: bold 22px 'Helvetica Neue', Arial, sans-serif; fill: #1a1a2e; }
      .subtitle { font: 16px 'Helvetica Neue', Arial, sans-serif; fill: #4a4a6a; }
      .label { font: 13px 'Courier New', monospace; fill: #2d2d2d; }
      .label-sm { font: 11px 'Courier New', monospace; fill: #555; }
      .bit-1 { fill: #e63946; stroke: #c1121f; stroke-width: 1.5; }
      .bit-0 { fill: #f1faee; stroke: #a8dadc; stroke-width: 1.5; }
      .bit-text { font: bold 16px 'Courier New', monospace; fill: white; text-anchor: middle; dominant-baseline: central; }
      .bit-text-dark { font: bold 16px 'Courier New', monospace; fill: #333; text-anchor: middle; dominant-baseline: central; }
      .carry-up { stroke: #2a9d8f; stroke-width: 2; fill: none; marker-end: url(#arrowGreen); }
      .carry-down { stroke: #e76f51; stroke-width: 2; fill: none; marker-end: url(#arrowOrange); stroke-dasharray: 6,3; }
      .partial { fill: #457b9d; stroke: #1d3557; stroke-width: 1; }
      .partial-text { font: bold 14px 'Courier New', monospace; fill: white; text-anchor: middle; dominant-baseline: central; }
      .accent { fill: #f4a261; stroke: #e76f51; stroke-width: 1.5; }
      .fib-box { fill: #264653; stroke: #2a9d8f; stroke-width: 1.5; rx: 4; }
      .fib-text { font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: central; }
      .connector { stroke: #ccc; stroke-width: 1; fill: none; }
      .bracket { font: 14px 'Helvetica Neue', Arial, sans-serif; fill: #666; }
    </style>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2a9d8f" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e76f51" />
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fefefe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f4f8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bgGrad)" rx="8"/>
  <text x="450" y="38" class="title" text-anchor="middle">Fibonacci Carry Propagation: Bidirectional Flow</text>
  <text x="450" y="62" class="subtitle" text-anchor="middle">2·F(n) = F(n+1) + F(n-2) — carries go UP and DOWN</text>
  <rect x="100" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="128" y="215" class="fib-text">pos 11</text>
  <text x="128" y="232" class="fib-text" font-size="10">F(13)=233</text>
  <rect x="160" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="188" y="215" class="fib-text">pos 10</text>
  <text x="188" y="232" class="fib-text" font-size="10">F(12)=144</text>
  <rect x="220" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="248" y="215" class="fib-text">pos 9</text>
  <text x="248" y="232" class="fib-text" font-size="10">F(11)=89</text>
  <rect x="280" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="308" y="215" class="fib-text">pos 8</text>
  <text x="308" y="232" class="fib-text" font-size="10">F(10)=55</text>
  <rect x="340" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="368" y="215" class="fib-text">pos 7</text>
  <text x="368" y="232" class="fib-text" font-size="10">F(9)=34</text>
  <rect x="400" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="428" y="215" class="fib-text">pos 6</text>
  <text x="428" y="232" class="fib-text" font-size="10">F(8)=21</text>
  <rect x="460" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="488" y="215" class="fib-text">pos 5</text>
  <text x="488" y="232" class="fib-text" font-size="10">F(7)=13</text>
  <rect x="520" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="548" y="215" class="fib-text">pos 4</text>
  <text x="548" y="232" class="fib-text" font-size="10">F(6)=8</text>
  <rect x="580" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="608" y="215" class="fib-text">pos 3</text>
  <text x="608" y="232" class="fib-text" font-size="10">F(5)=5</text>
  <rect x="640" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="668" y="215" class="fib-text">pos 2</text>
  <text x="668" y="232" class="fib-text" font-size="10">F(4)=3</text>
  <rect x="700" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="728" y="215" class="fib-text">pos 1</text>
  <text x="728" y="232" class="fib-text" font-size="10">F(3)=2</text>
  <rect x="760" y="200" width="56" height="40" class="fib-box" rx="4"/>
  <text x="788" y="215" class="fib-text">pos 0</text>
  <text x="788" y="232" class="fib-text" font-size="10">F(2)=1</text>
  <path d="M 430,200 Q 400,140 370,200" class="carry-up"/>
  <text x="400" y="135" class="label-sm" fill="#2a9d8f" text-anchor="middle">+1 (upward carry)</text>
  <path d="M 430,240 Q 490,320 550,240" class="carry-down"/>
  <text x="490" y="335" class="label-sm" fill="#e76f51" text-anchor="middle">+1 (DOWNWARD carry!)</text>
  <rect x="400" y="200" width="56" height="40" fill="#e63946" stroke="#c1121f" stroke-width="2" rx="4" opacity="0.7"/>
  <text x="428" y="190" class="label" fill="#e63946" text-anchor="middle">≥ 2 here</text>
  <rect x="60" y="350" width="370" height="110" fill="#f1faee" stroke="#a8dadc" stroke-width="2" rx="6"/>
  <text x="245" y="375" class="label" text-anchor="middle" font-size="14" fill="#1d3557">Binary Carry (base 2)</text>
  <text x="245" y="400" class="label-sm" text-anchor="middle">2·(2^n) = 2^(n+1)</text>
  <text x="245" y="420" class="label-sm" text-anchor="middle">Direction: ↑ only (unidirectional)</text>
  <text x="245" y="440" class="label-sm" text-anchor="middle">Range: 1 position forward</text>
  <rect x="470" y="350" width="370" height="110" fill="#264653" stroke="#2a9d8f" stroke-width="2" rx="6"/>
  <text x="655" y="375" class="fib-text" font-size="14">Fibonacci Carry (Zeckendorf)</text>
  <text x="655" y="400" class="fib-text" font-size="11">2·F(n) = F(n+1) + F(n-2)</text>
  <text x="655" y="420" class="fib-text" font-size="11">Direction: ↑ AND ↓ (bidirectional!)</text>
  <text x="655" y="440" class="fib-text" font-size="11">Range: +1 forward, -2 backward</text>
</svg>