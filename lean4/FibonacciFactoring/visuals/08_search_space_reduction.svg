<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .title { font: bold 18px 'Segoe UI', Arial, sans-serif; fill: #1a1a2e; }
      .subtitle { font: 14px 'Segoe UI', Arial, sans-serif; fill: #4a4a6a; }
      .label { font: 12px 'Courier New', monospace; fill: #333; }
      .label-sm { font: 10px 'Courier New', monospace; fill: #555; }
      .axis { font: 11px 'Segoe UI', Arial, sans-serif; fill: #666; }
      .note { font: italic 11px 'Segoe UI', Arial, sans-serif; fill: #888; }
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C5F8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#fafaf8" rx="8"/>
  <text x="400" y="35" text-anchor="middle" class="title">Q1: Search Space Reduction — Binary vs Fibonacci</text>
  <text x="400" y="60" text-anchor="middle" class="subtitle">Valid digit patterns (log₂ scale) for k-digit representations</text>
  <line x1="80" y1="80" x2="80" y2="420" stroke="#999" stroke-width="1"/>
  <line x1="75" y1="420.0" x2="80" y2="420.0" stroke="#999"/>
  <text x="70" y="424.0" text-anchor="end" class="axis">0</text>
  <line x1="75" y1="365.3125" x2="80" y2="365.3125" stroke="#999"/>
  <text x="70" y="369.3125" text-anchor="end" class="axis">5</text>
  <line x1="75" y1="310.625" x2="80" y2="310.625" stroke="#999"/>
  <text x="70" y="314.625" text-anchor="end" class="axis">10</text>
  <line x1="75" y1="255.9375" x2="80" y2="255.9375" stroke="#999"/>
  <text x="70" y="259.9375" text-anchor="end" class="axis">15</text>
  <line x1="75" y1="201.25" x2="80" y2="201.25" stroke="#999"/>
  <text x="70" y="205.25" text-anchor="end" class="axis">20</text>
  <line x1="75" y1="146.5625" x2="80" y2="146.5625" stroke="#999"/>
  <text x="70" y="150.5625" text-anchor="end" class="axis">25</text>
  <line x1="75" y1="91.875" x2="80" y2="91.875" stroke="#999"/>
  <text x="70" y="95.875" text-anchor="end" class="axis">30</text>
  <text x="25" y="250" text-anchor="middle" transform="rotate(-90, 25, 250)" class="axis">log₂(search space)</text>
  <rect x="110" y="376.25" width="35" height="43.75" fill="url(#blueGrad)" rx="3" opacity="0.85"/>
  <text x="127.5" y="371.25" text-anchor="middle" class="label-sm">2^4</text>
  <rect x="148" y="389.6269162786605" width="35" height="30.373083721339512" fill="url(#goldGrad)" rx="3" opacity="0.85"/>
  <text x="165.5" y="384.6269162786605" text-anchor="middle" class="label-sm">φ^4</text>
  <text x="146" y="435" text-anchor="middle" class="axis">k=4</text>
  <rect x="208" y="332.5" width="35" height="87.5" fill="url(#blueGrad)" rx="3" opacity="0.85"/>
  <text x="225.5" y="327.5" text-anchor="middle" class="label-sm">2^8</text>
  <rect x="246" y="359.25383255732095" width="35" height="60.746167442679024" fill="url(#goldGrad)" rx="3" opacity="0.85"/>
  <text x="263.5" y="354.25383255732095" text-anchor="middle" class="label-sm">φ^8</text>
  <text x="244" y="435" text-anchor="middle" class="axis">k=8</text>
  <rect x="306" y="288.75" width="35" height="131.25" fill="url(#blueGrad)" rx="3" opacity="0.85"/>
  <text x="323.5" y="283.75" text-anchor="middle" class="label-sm">2^12</text>
  <rect x="344" y="328.8807488359815" width="35" height="91.11925116401854" fill="url(#goldGrad)" rx="3" opacity="0.85"/>
  <text x="361.5" y="323.8807488359815" text-anchor="middle" class="label-sm">φ^12</text>
  <text x="342" y="435" text-anchor="middle" class="axis">k=12</text>
  <text x="342" y="450" text-anchor="middle" class="label-sm" fill="#c00">↓3.7</text>
  <rect x="404" y="245.0" width="35" height="175.0" fill="url(#blueGrad)" rx="3" opacity="0.85"/>
  <text x="421.5" y="240.0" text-anchor="middle" class="label-sm">2^16</text>
  <rect x="442" y="298.50766511464195" width="35" height="121.49233488535805" fill="url(#goldGrad)" rx="3" opacity="0.85"/>
  <text x="459.5" y="293.50766511464195" text-anchor="middle" class="label-sm">φ^16</text>
  <text x="440" y="435" text-anchor="middle" class="axis">k=16</text>
  <text x="440" y="450" text-anchor="middle" class="label-sm" fill="#c00">↓4.9</text>
  <rect x="502" y="201.25" width="35" height="218.75" fill="url(#blueGrad)" rx="3" opacity="0.85"/>
  <text x="519.5" y="196.25" text-anchor="middle" class="label-sm">2^20</text>
  <rect x="540" y="268.1345813933025" width="35" height="151.86541860669755" fill="url(#goldGrad)" rx="3" opacity="0.85"/>
  <text x="557.5" y="263.1345813933025" text-anchor="middle" class="label-sm">φ^20</text>
  <text x="538" y="435" text-anchor="middle" class="axis">k=20</text>
  <text x="538" y="450" text-anchor="middle" class="label-sm" fill="#c00">↓6.1</text>
  <rect x="600" y="157.5" width="35" height="262.5" fill="url(#blueGrad)" rx="3" opacity="0.85"/>
  <text x="617.5" y="152.5" text-anchor="middle" class="label-sm">2^24</text>
  <rect x="638" y="237.76149767196293" width="35" height="182.23850232803707" fill="url(#goldGrad)" rx="3" opacity="0.85"/>
  <text x="655.5" y="232.76149767196293" text-anchor="middle" class="label-sm">φ^24</text>
  <text x="636" y="435" text-anchor="middle" class="axis">k=24</text>
  <text x="636" y="450" text-anchor="middle" class="label-sm" fill="#c00">↓7.3</text>
  <rect x="698" y="113.75" width="35" height="306.25" fill="url(#blueGrad)" rx="3" opacity="0.85"/>
  <text x="715.5" y="108.75" text-anchor="middle" class="label-sm">2^28</text>
  <rect x="736" y="207.38841395062343" width="35" height="212.61158604937657" fill="url(#goldGrad)" rx="3" opacity="0.85"/>
  <text x="753.5" y="202.38841395062343" text-anchor="middle" class="label-sm">φ^28</text>
  <text x="734" y="435" text-anchor="middle" class="axis">k=28</text>
  <text x="734" y="450" text-anchor="middle" class="label-sm" fill="#c00">↓8.6</text>
  <rect x="796" y="70.0" width="35" height="350.0" fill="url(#blueGrad)" rx="3" opacity="0.85"/>
  <text x="813.5" y="65.0" text-anchor="middle" class="label-sm">2^32</text>
  <rect x="834" y="177.0153302292839" width="35" height="242.9846697707161" fill="url(#goldGrad)" rx="3" opacity="0.85"/>
  <text x="851.5" y="172.0153302292839" text-anchor="middle" class="label-sm">φ^32</text>
  <text x="832" y="435" text-anchor="middle" class="axis">k=32</text>
  <text x="832" y="450" text-anchor="middle" class="label-sm" fill="#c00">↓9.8</text>
  <rect x="600" y="80" width="15" height="15" fill="url(#blueGrad)" rx="2"/>
  <text x="620" y="92" class="label">Binary (2^k)</text>
  <rect x="600" y="100" width="15" height="15" fill="url(#goldGrad)" rx="2"/>
  <text x="620" y="112" class="label">Fibonacci (φ^k)</text>
  <text x="400" y="475" text-anchor="middle" class="note">Per-digit advantage: 2/φ ≈ 1.236×. Cumulative advantage: (2/φ)^k → exponential gap.</text>
</svg>
