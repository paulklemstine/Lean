<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <style>
      .title { font: bold 22px 'Helvetica Neue', Arial, sans-serif; fill: #1a1a2e; }
      .subtitle { font: 16px 'Helvetica Neue', Arial, sans-serif; fill: #4a4a6a; }
      .label { font: 13px 'Courier New', monospace; fill: #2d2d2d; }
      .label-sm { font: 11px 'Courier New', monospace; fill: #555; }
      .bit-1 { fill: #e63946; stroke: #c1121f; stroke-width: 1.5; }
      .bit-0 { fill: #f1faee; stroke: #a8dadc; stroke-width: 1.5; }
      .bit-text { font: bold 16px 'Courier New', monospace; fill: white; text-anchor: middle; dominant-baseline: central; }
      .bit-text-dark { font: bold 16px 'Courier New', monospace; fill: #333; text-anchor: middle; dominant-baseline: central; }
      .carry-up { stroke: #2a9d8f; stroke-width: 2; fill: none; marker-end: url(#arrowGreen); }
      .carry-down { stroke: #e76f51; stroke-width: 2; fill: none; marker-end: url(#arrowOrange); stroke-dasharray: 6,3; }
      .partial { fill: #457b9d; stroke: #1d3557; stroke-width: 1; }
      .partial-text { font: bold 14px 'Courier New', monospace; fill: white; text-anchor: middle; dominant-baseline: central; }
      .accent { fill: #f4a261; stroke: #e76f51; stroke-width: 1.5; }
      .fib-box { fill: #264653; stroke: #2a9d8f; stroke-width: 1.5; rx: 4; }
      .fib-text { font: bold 12px 'Helvetica Neue', Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: central; }
      .connector { stroke: #ccc; stroke-width: 1; fill: none; }
      .bracket { font: 14px 'Helvetica Neue', Arial, sans-serif; fill: #666; }
    </style>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2a9d8f" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e76f51" />
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fefefe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f4f8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="900" height="550" fill="url(#bgGrad)" rx="8"/>
  <text x="450" y="38" class="title" text-anchor="middle">Fibonacci Carry: Constraint Entanglement Web</text>
  <text x="450" y="60" class="subtitle" text-anchor="middle">How a single carry cascades through digit positions</text>
  <rect x="60" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="86" y="162" class="fib-text" font-size="10">13</text>
  <rect x="115" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="141" y="162" class="fib-text" font-size="10">12</text>
  <rect x="170" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="196" y="162" class="fib-text" font-size="10">11</text>
  <rect x="225" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="251" y="162" class="fib-text" font-size="10">10</text>
  <rect x="280" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="306" y="162" class="fib-text" font-size="10">9</text>
  <rect x="335" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="361" y="162" class="fib-text" font-size="10">8</text>
  <rect x="390" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="416" y="162" class="fib-text" font-size="10">7</text>
  <rect x="445" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="471" y="162" class="fib-text" font-size="10">6</text>
  <rect x="500" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="526" y="162" class="fib-text" font-size="10">5</text>
  <rect x="555" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="581" y="162" class="fib-text" font-size="10">4</text>
  <rect x="610" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="636" y="162" class="fib-text" font-size="10">3</text>
  <rect x="665" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="691" y="162" class="fib-text" font-size="10">2</text>
  <rect x="720" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="746" y="162" class="fib-text" font-size="10">1</text>
  <rect x="775" y="140" width="52" height="36" class="fib-box" rx="3"/>
  <text x="801" y="162" class="fib-text" font-size="10">0</text>
  <path d="M 362,140 Q 334,110 307,140" stroke="#e63946" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 362,176 Q 417,206 472,176" stroke="#e63946" stroke-width="2.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <rect x="335" y="140" width="52" height="36" fill="#e63946" rx="3" opacity="0.3"/>
  <text x="30" y="180" class="label-sm" fill="#e63946">Step 1: pos 8 → ↑9, ↓6</text>
  <path d="M 472,140 Q 444,70 417,140" stroke="#f4a261" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 472,176 Q 527,246 582,176" stroke="#f4a261" stroke-width="2.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <rect x="445" y="140" width="52" height="36" fill="#f4a261" rx="3" opacity="0.3"/>
  <text x="30" y="260" class="label-sm" fill="#f4a261">Step 2: pos 6 → ↑7, ↓4</text>
  <path d="M 582,140 Q 554,30 527,140" stroke="#2a9d8f" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 582,176 Q 637,286 692,176" stroke="#2a9d8f" stroke-width="2.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <rect x="555" y="140" width="52" height="36" fill="#2a9d8f" rx="3" opacity="0.3"/>
  <text x="30" y="340" class="label-sm" fill="#2a9d8f">Step 3: pos 4 → ↑5, ↓2</text>
  <rect x="80" y="420" width="740" height="90" fill="#f1faee" stroke="#a8dadc" stroke-width="2" rx="6"/>
  <text x="450" y="445" class="label" text-anchor="middle" fill="#1d3557">A single overflow at position 8 cascades to positions 9, 7, 6, 5, 4, 2</text>
  <text x="450" y="468" class="label" text-anchor="middle" fill="#1d3557">touching 6 of 14 digit positions — creating a WEB of constraints</text>
  <text x="450" y="492" class="label-sm" text-anchor="middle" fill="#666">In binary, the same overflow would affect only 1-2 adjacent positions</text>
</svg>