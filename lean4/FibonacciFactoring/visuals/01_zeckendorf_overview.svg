  <rect x="428" y="72" width="48" height="28" class="fib-box"/>
  <text x="452" y="86" class="fib-text">F(6)=8</text>
  <rect x="480" y="72" width="48" height="28" class="fib-box"/>
  <text x="504" y="86" class="fib-text">F(7)=13</text>
