  <text x="450" y="552" class="fib-text" font-size="14" text-anchor="middle">KEY RULE: No two consecutive digits may both be 1</text>
  <text x="450" y="574" class="fib-text" font-size="12" text-anchor="middle" opacity="0.8">This constraint (Zeckendorf's theorem) ensures uniqueness — and provides structural information for factoring</text>
