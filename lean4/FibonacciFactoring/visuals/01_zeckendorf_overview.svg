  <text x="608" y="86" class="fib-text">F(9)=34</text>
  <rect x="636" y="72" width="48" height="28" class="fib-box"/>
  <text x="660" y="86" class="fib-text">F(10)=55</text>
  <rect x="688" y="72" width="48" height="28" class="fib-box"/>
  <text x="712" y="86" class="fib-text">F(11)=89</text>
  <rect x="740" y="72" width="48" height="28" class="fib-box"/>
  <text x="764" y="86" class="fib-text">F(12)=144</text>
  <rect x="792" y="72" width="48" height="28" class="fib-box"/>
  <text x="816" y="86" class="fib-text">F(13)=233</text>
