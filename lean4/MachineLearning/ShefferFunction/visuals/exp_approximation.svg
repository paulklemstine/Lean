<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg5)" rx="10"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="20" font-weight="bold">
    The Exponential Approximation Theorem (Proved in Lean 4)
  </text>
  <text x="400" y="60" text-anchor="middle" fill="#aaaacc" font-family="Georgia, serif" font-size="15">
    eᶜ · σ(x − c) → eˣ as c → ∞
  </text>
  
  <!-- Plot area -->
  <g transform="translate(100, 80)">
    <!-- Grid -->
    <g stroke="#333366" stroke-width="0.5">
      <line x1="0" y1="0" x2="600" y2="0"/>
      <line x1="0" y1="60" x2="600" y2="60"/>
      <line x1="0" y1="120" x2="600" y2="120"/>
      <line x1="0" y1="180" x2="600" y2="180"/>
      <line x1="0" y1="240" x2="600" y2="240"/>
      <line x1="0" y1="300" x2="600" y2="300"/>
    </g>
    
    <!-- Axes -->
    <line x1="0" y1="300" x2="600" y2="300" stroke="#6666aa" stroke-width="1.5"/>
    <line x1="200" y1="0" x2="200" y2="310" stroke="#6666aa" stroke-width="1.5"/>
    
    <!-- Axis labels -->
    <text x="0" y="320" fill="#8888bb" font-family="monospace" font-size="11">-4</text>
    <text x="100" y="320" fill="#8888bb" font-family="monospace" font-size="11">-2</text>
    <text x="200" y="320" fill="#8888bb" font-family="monospace" font-size="11">0</text>
    <text x="300" y="320" fill="#8888bb" font-family="monospace" font-size="11">2</text>
    <text x="400" y="320" fill="#8888bb" font-family="monospace" font-size="11">4</text>
    
    <!-- exp(x) - the target (gold, thick) -->
    <!-- e^(-4)=0.018, e^(-2)=0.135, e^0=1, e^1=2.718, e^2=7.389 -->
    <!-- Scale: x: 50px per unit, y: 40px per unit, origin at (200, 300) -->
    <path d="M 0,299.3 L 50,298.5 L 100,294.6 L 150,282 L 200,260 L 250,195 L 300,80 L 320,35"
          stroke="#ffd700" stroke-width="3" fill="none" filter="url(#glow5)" stroke-linecap="round"/>
    <text x="325" y="30" fill="#ffd700" font-family="monospace" font-size="13" font-weight="bold">eˣ</text>
    
    <!-- c=1: e^1 * softplus(x-1) — rough approx -->
    <path d="M 0,299 L 50,297 L 100,291 L 150,275 L 200,245 L 250,178 L 300,63 L 310,30"
          stroke="#ff6b35" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="8,4"/>
    <text x="520" y="255" fill="#ff6b35" font-family="monospace" font-size="11">c = 1</text>
    
    <!-- c=3: much closer -->
    <path d="M 0,299.2 L 50,298.3 L 100,294 L 150,281 L 200,259 L 250,193 L 300,78 L 320,33"
          stroke="#ff9944" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="6,3"/>
    <text x="520" y="275" fill="#ff9944" font-family="monospace" font-size="11">c = 3</text>
    
    <!-- c=10: nearly identical -->
    <path d="M 0,299.3 L 50,298.5 L 100,294.5 L 150,282 L 200,260 L 250,195 L 300,80 L 320,35"
          stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.9" stroke-dasharray="4,2"/>
    <text x="520" y="295" fill="#00ff88" font-family="monospace" font-size="11">c = 10</text>
    
    <!-- Legend box -->
    <rect x="460" y="225" width="130" height="90" rx="5" fill="#1a1a3e" stroke="#666699" stroke-width="1"/>
    <text x="525" y="245" text-anchor="middle" fill="#ccccee" font-family="monospace" font-size="11">eᶜ·σ(x−c)</text>
  </g>
  
  <!-- Formula box -->
  <rect x="150" y="405" width="500" height="35" rx="8" fill="#ffd700" fill-opacity="0.08" stroke="#ffd700" stroke-width="1"/>
  <text x="400" y="428" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="15">
    Theorem: ∀ x ∈ ℝ, lim_{c→∞} eᶜ · log(1 + e^{x−c}) = eˣ  ✓ Lean 4
  </text>
</svg>
