<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="500" fill="url(#bg4)" rx="10"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="24" font-weight="bold">
    From Sheffer Stroke to Sheffer Curve
  </text>
  <text x="450" y="65" text-anchor="middle" fill="#8899bb" font-family="Georgia, serif" font-size="14">
    The same principle, from logic to analysis
  </text>
  
  <!-- Left panel: Boolean Logic -->
  <g transform="translate(30, 90)">
    <rect width="400" height="370" rx="10" fill="#1a1a2e" stroke="#4488ff" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" fill="#4488ff" font-family="Georgia, serif" font-size="20" font-weight="bold">
      Boolean Logic (1913)
    </text>
    
    <!-- NAND gate symbol -->
    <g transform="translate(140, 60)">
      <path d="M 0,0 L 40,0 Q 120,0 120,40 Q 120,80 40,80 L 0,80 Z" fill="none" stroke="#4488ff" stroke-width="2"/>
      <circle cx="128" cy="40" r="8" fill="none" stroke="#4488ff" stroke-width="2"/>
      <text x="50" y="48" fill="#4488ff" font-family="monospace" font-size="16">NAND</text>
    </g>
    
    <text x="200" y="180" text-anchor="middle" fill="#aabbdd" font-family="monospace" font-size="14">
      p ↑ q = ¬(p ∧ q)
    </text>
    
    <!-- Generated operations -->
    <text x="200" y="215" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="13" font-weight="bold">
      Generates ALL Boolean operations:
    </text>
    
    <g fill="#88aadd" font-family="monospace" font-size="13">
      <text x="50" y="245">NOT p = p ↑ p</text>
      <text x="50" y="270">p AND q = (p↑q)↑(p↑q)</text>
      <text x="50" y="295">p OR q = (p↑p)↑(q↑q)</text>
      <text x="50" y="320">p XOR q = ...</text>
      <text x="50" y="345">p → q = p↑(q↑q)</text>
    </g>
  </g>
  
  <!-- Right panel: Real Analysis -->
  <g transform="translate(470, 90)">
    <rect width="400" height="370" rx="10" fill="#1a2a1a" stroke="#00ff88" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" fill="#00ff88" font-family="Georgia, serif" font-size="20" font-weight="bold">
      Real Analysis (2025)
    </text>
    
    <!-- Softplus curve mini -->
    <g transform="translate(120, 55)">
      <path d="M 0,70 L 20,68 L 40,64 L 60,56 L 80,44 L 100,28 L 120,10 L 140,-8" 
            fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
      <text x="80" y="90" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="14">σ(x) = log(1+eˣ)</text>
    </g>
    
    <text x="200" y="180" text-anchor="middle" fill="#aaddbb" font-family="monospace" font-size="14">
      σ + affine maps
    </text>
    
    <!-- Generated functions -->
    <text x="200" y="215" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="13" font-weight="bold">
      Generates ALL elementary functions:
    </text>
    
    <g fill="#88ddaa" font-family="monospace" font-size="13">
      <text x="50" y="245">exp(x) = eᶜ·σ(x-c)</text>
      <text x="50" y="270">x = σ(x) - σ(-x)</text>
      <text x="50" y="295">log(x) = σ⁻¹(x)</text>
      <text x="50" y="320">ReLU(x) = σ(βx)/β</text>
      <text x="50" y="345">sin(x) = Σwᵢσ(aᵢx+bᵢ)</text>
    </g>
  </g>
  
  <!-- Connecting arrow -->
  <g transform="translate(430, 260)">
    <text x="20" y="5" fill="#ffd700" font-family="Georgia, serif" font-size="30">⟹</text>
  </g>
  
  <!-- Bottom insight -->
  <text x="450" y="488" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="15" font-style="italic">
    "One primitive operation generates an entire mathematical universe"
  </text>
</svg>
