<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffd700"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00bcd4"/>
    </marker>
  </defs>
  
  <rect width="900" height="650" fill="url(#bg2)" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="28" font-weight="bold">
    The Unary Sheffer Function
  </text>
  <text x="450" y="75" text-anchor="middle" fill="#8899bb" font-family="Georgia, serif" font-size="16">
    One function to generate them all
  </text>
  
  <!-- Central node: σ(x) -->
  <circle cx="450" cy="300" r="70" fill="none" stroke="#ffd700" stroke-width="3" filter="url(#glow2)"/>
  <circle cx="450" cy="300" r="68" fill="#1a1a3e" fill-opacity="0.8"/>
  <text x="450" y="290" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="22" font-weight="bold">σ(x)</text>
  <text x="450" y="315" text-anchor="middle" fill="#ccccee" font-family="monospace" font-size="13">log(1+eˣ)</text>
  
  <!-- Surrounding generated functions -->
  <!-- exp(x) -->
  <g transform="translate(150,150)">
    <rect x="-60" y="-25" width="120" height="50" rx="10" fill="#2a1a1a" stroke="#ff6b35" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="16" font-weight="bold">exp(x)</text>
  </g>
  <line x1="210" y1="160" x2="390" y2="260" stroke="#ff6b35" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.7"/>
  <text x="280" y="195" fill="#ff6b35" font-family="monospace" font-size="10" transform="rotate(-22,280,195)">eᶜ·σ(x-c)</text>
  
  <!-- log(x) -->
  <g transform="translate(150,450)">
    <rect x="-60" y="-25" width="120" height="50" rx="10" fill="#1a2a1a" stroke="#00ff88" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="16" font-weight="bold">log(x)</text>
  </g>
  <line x1="210" y1="440" x2="390" y2="340" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.7"/>
  <text x="270" y="405" fill="#00ff88" font-family="monospace" font-size="10" transform="rotate(22,270,405)">σ⁻¹(x)</text>
  
  <!-- sigmoid -->
  <g transform="translate(750,150)">
    <rect x="-70" y="-25" width="140" height="50" rx="10" fill="#1a1a2a" stroke="#4488ff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#4488ff" font-family="monospace" font-size="16" font-weight="bold">sigmoid(x)</text>
  </g>
  <line x1="690" y1="160" x2="510" y2="260" stroke="#4488ff" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.7"/>
  <text x="620" y="195" fill="#4488ff" font-family="monospace" font-size="10" transform="rotate(22,620,195)">σ'(x)</text>
  
  <!-- ReLU -->
  <g transform="translate(750,450)">
    <rect x="-60" y="-25" width="120" height="50" rx="10" fill="#2a2a1a" stroke="#ffaa00" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="16" font-weight="bold">ReLU(x)</text>
  </g>
  <line x1="690" y1="440" x2="510" y2="340" stroke="#ffaa00" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.7"/>
  <text x="630" y="405" fill="#ffaa00" font-family="monospace" font-size="10" transform="rotate(-22,630,405)">σ(βx)/β</text>
  
  <!-- sin(x) -->
  <g transform="translate(450,550)">
    <rect x="-60" y="-25" width="120" height="50" rx="10" fill="#1a2a2a" stroke="#00bcd4" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#00bcd4" font-family="monospace" font-size="16" font-weight="bold">sin(x)</text>
  </g>
  <line x1="450" y1="525" x2="450" y2="375" stroke="#00bcd4" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.7"/>
  <text x="465" y="470" fill="#00bcd4" font-family="monospace" font-size="10">Σwᵢσ(aᵢx+bᵢ)</text>
  
  <!-- Identity -->
  <g transform="translate(450,120)">
    <rect x="-40" y="-22" width="80" height="44" rx="10" fill="#2a1a2a" stroke="#cc66ff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#cc66ff" font-family="monospace" font-size="16" font-weight="bold">x</text>
  </g>
  <line x1="450" y1="162" x2="450" y2="225" stroke="#cc66ff" stroke-width="1.5" marker-end="url(#arrowGold)" opacity="0.7"/>
  <text x="465" y="200" fill="#cc66ff" font-family="monospace" font-size="10">σ(x)-σ(-x)</text>

  <!-- Bottom label -->
  <rect x="150" y="600" width="600" height="35" rx="8" fill="#ffd700" fill-opacity="0.1" stroke="#ffd700" stroke-width="1"/>
  <text x="450" y="623" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="15">
    σ(x) + affine maps → all elementary functions (universal generator)
  </text>
</svg>
