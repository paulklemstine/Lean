<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgRelu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <filter id="glowRelu">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgRelu)" rx="10"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="22" font-weight="bold">
    ReLU as a Limit of Softplus (Proved in Lean 4)
  </text>
  <text x="400" y="60" text-anchor="middle" fill="#aaaacc" font-family="Georgia, serif" font-size="14">
    σ(βx)/β → max(0, x) as β → ∞
  </text>
  
  <!-- Plot area -->
  <g transform="translate(100, 80)">
    <!-- Grid -->
    <g stroke="#333366" stroke-width="0.5">
      <line x1="0" y1="0" x2="600" y2="0"/>
      <line x1="0" y1="75" x2="600" y2="75"/>
      <line x1="0" y1="150" x2="600" y2="150"/>
      <line x1="0" y1="225" x2="600" y2="225"/>
      <line x1="0" y1="300" x2="600" y2="300"/>
    </g>
    
    <!-- Axes -->
    <line x1="0" y1="300" x2="600" y2="300" stroke="#6666aa" stroke-width="1.5"/>
    <line x1="300" y1="0" x2="300" y2="310" stroke="#6666aa" stroke-width="1.5"/>
    
    <!-- ReLU (target, thick gold) -->
    <path d="M 0,300 L 150,300 L 300,300 L 450,150 L 600,0"
          stroke="#ffd700" stroke-width="3" fill="none" filter="url(#glowRelu)"/>
    <text x="580" y="-5" fill="#ffd700" font-family="monospace" font-size="14" font-weight="bold">ReLU</text>
    
    <!-- β=1: very smooth -->
    <!-- σ(x)/1 values: σ(-4)=0.018, σ(-2)=0.127, σ(0)=0.693, σ(2)=2.127, σ(4)=4.018 -->
    <!-- Scale: 75px per unit -->
    <path d="M 0,298.6 L 75,295.5 L 150,290.5 L 225,274 L 300,248
             L 375,206 L 450,140.5 L 525,73 L 600,4"
          stroke="#ff4444" stroke-width="1.5" fill="none" opacity="0.7"/>
    <text x="530" y="370" fill="#ff4444" font-family="monospace" font-size="12">β = 1</text>
    
    <!-- β=3: sharper -->
    <path d="M 0,299.9 L 75,299.5 L 150,298 L 225,290 L 300,283
             L 330,258 L 375,178 L 450,140 L 525,72 L 600,2"
          stroke="#ff8844" stroke-width="1.5" fill="none" opacity="0.7"/>
    <text x="530" y="385" fill="#ff8844" font-family="monospace" font-size="12">β = 3</text>
    
    <!-- β=10: almost ReLU -->
    <path d="M 0,300 L 150,300 L 225,299 L 270,295 L 300,285
             L 315,265 L 345,215 L 375,165 L 450,145 L 525,72 L 600,0"
          stroke="#44ff44" stroke-width="1.5" fill="none" opacity="0.8"/>
    <text x="530" y="400" fill="#44ff44" font-family="monospace" font-size="12">β = 10</text>
    
    <!-- β=50: nearly identical -->
    <path d="M 0,300 L 150,300 L 225,300 L 280,300 L 295,298 L 300,295
             L 305,288 L 310,275 L 315,260 L 330,215 L 375,155 L 450,146 L 525,72 L 600,0"
          stroke="#00ffff" stroke-width="1.5" fill="none" opacity="0.9"/>
    <text x="530" y="415" fill="#00ffff" font-family="monospace" font-size="12">β = 50</text>
    
    <!-- Legend -->
    <rect x="480" y="350" width="120" height="80" rx="5" fill="#1a1a3e" stroke="#666699" stroke-width="1"/>
    <text x="540" y="368" text-anchor="middle" fill="#ccccee" font-family="monospace" font-size="11">σ(βx)/β</text>
  </g>
  
  <!-- Formula box -->
  <rect x="150" y="430" width="500" height="50" rx="8" fill="#ffd700" fill-opacity="0.08" stroke="#ffd700" stroke-width="1"/>
  <text x="400" y="452" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="14">
    Theorem: ∀ x &gt; 0, lim_{β→∞} σ(βx)/β = x
  </text>
  <text x="400" y="472" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="14">
    Theorem: ∀ x &lt; 0, lim_{β→∞} σ(βx)/β = 0   ✓ Both proved in Lean 4
  </text>
</svg>
