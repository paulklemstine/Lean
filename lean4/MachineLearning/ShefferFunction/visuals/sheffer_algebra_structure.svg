<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bgAlg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <filter id="glowAlg">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffd700"/>
    </marker>
  </defs>
  
  <rect width="1000" height="700" fill="url(#bgAlg)" rx="12"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="26" font-weight="bold">
    The Sheffer Algebra: Hierarchical Structure
  </text>
  <text x="500" y="68" text-anchor="middle" fill="#8899bb" font-family="Georgia, serif" font-size="15">
    Functions generated by depth of softplus composition
  </text>
  
  <!-- Depth 0: Affine functions -->
  <g transform="translate(50, 100)">
    <rect width="900" height="110" rx="10" fill="#1a2a1a" fill-opacity="0.6" stroke="#44aa44" stroke-width="2"/>
    <text x="20" y="25" fill="#44aa44" font-family="Georgia, serif" font-size="18" font-weight="bold">
      Depth 0: Affine Functions
    </text>
    <text x="20" y="50" fill="#88cc88" font-family="monospace" font-size="14">
      f(x) = ax + b  (linear maps, constants, identity)
    </text>
    <g transform="translate(50, 60)">
      <rect x="0" y="0" width="100" height="35" rx="6" fill="#2a3a2a" stroke="#66cc66" stroke-width="1"/>
      <text x="50" y="22" text-anchor="middle" fill="#66cc66" font-family="monospace" font-size="13">x ↦ x</text>
    </g>
    <g transform="translate(180, 60)">
      <rect x="0" y="0" width="100" height="35" rx="6" fill="#2a3a2a" stroke="#66cc66" stroke-width="1"/>
      <text x="50" y="22" text-anchor="middle" fill="#66cc66" font-family="monospace" font-size="13">x ↦ 2x+1</text>
    </g>
    <g transform="translate(310, 60)">
      <rect x="0" y="0" width="100" height="35" rx="6" fill="#2a3a2a" stroke="#66cc66" stroke-width="1"/>
      <text x="50" y="22" text-anchor="middle" fill="#66cc66" font-family="monospace" font-size="13">x ↦ 5</text>
    </g>
    <text x="700" y="85" fill="#88cc88" font-family="monospace" font-size="12" font-style="italic">
      ℝ-vector space, dimension 2
    </text>
  </g>
  
  <!-- Depth 1: Single softplus layer -->
  <g transform="translate(50, 230)">
    <rect width="900" height="130" rx="10" fill="#2a1a1a" fill-opacity="0.6" stroke="#ff6b35" stroke-width="2"/>
    <text x="20" y="25" fill="#ff6b35" font-family="Georgia, serif" font-size="18" font-weight="bold">
      Depth 1: Single Softplus Layer
    </text>
    <text x="20" y="50" fill="#ff9966" font-family="monospace" font-size="14">
      f(x) = Σ wᵢ σ(aᵢx + bᵢ) + c
    </text>
    <g transform="translate(50, 60)">
      <rect x="0" y="0" width="120" height="55" rx="6" fill="#3a2a1a" stroke="#ff9944" stroke-width="1"/>
      <text x="60" y="20" text-anchor="middle" fill="#ff9944" font-family="monospace" font-size="12">eˣ (approx)</text>
      <text x="60" y="40" text-anchor="middle" fill="#cc8833" font-family="monospace" font-size="10">eᶜ·σ(x-c)</text>
    </g>
    <g transform="translate(200, 60)">
      <rect x="0" y="0" width="120" height="55" rx="6" fill="#3a2a1a" stroke="#ff9944" stroke-width="1"/>
      <text x="60" y="20" text-anchor="middle" fill="#ff9944" font-family="monospace" font-size="12">ReLU (limit)</text>
      <text x="60" y="40" text-anchor="middle" fill="#cc8833" font-family="monospace" font-size="10">σ(βx)/β</text>
    </g>
    <g transform="translate(350, 60)">
      <rect x="0" y="0" width="120" height="55" rx="6" fill="#3a2a1a" stroke="#ff9944" stroke-width="1"/>
      <text x="60" y="20" text-anchor="middle" fill="#ff9944" font-family="monospace" font-size="12">sigmoid</text>
      <text x="60" y="40" text-anchor="middle" fill="#cc8833" font-family="monospace" font-size="10">σ'(x)</text>
    </g>
    <g transform="translate(500, 60)">
      <rect x="0" y="0" width="120" height="55" rx="6" fill="#3a2a1a" stroke="#ff9944" stroke-width="1"/>
      <text x="60" y="20" text-anchor="middle" fill="#ff9944" font-family="monospace" font-size="12">|x| (approx)</text>
      <text x="60" y="40" text-anchor="middle" fill="#cc8833" font-family="monospace" font-size="10">σ(βx)+σ(-βx)</text>
    </g>
    <g transform="translate(650, 60)">
      <rect x="0" y="0" width="140" height="55" rx="6" fill="#3a2a1a" stroke="#ff9944" stroke-width="1"/>
      <text x="70" y="20" text-anchor="middle" fill="#ff9944" font-family="monospace" font-size="12">sin(x) (approx)</text>
      <text x="70" y="40" text-anchor="middle" fill="#cc8833" font-family="monospace" font-size="10">Σwᵢσ(aᵢx+bᵢ)</text>
    </g>
  </g>
  
  <!-- Depth 2: Two softplus layers -->
  <g transform="translate(50, 380)">
    <rect width="900" height="110" rx="10" fill="#1a1a2a" fill-opacity="0.6" stroke="#4488ff" stroke-width="2"/>
    <text x="20" y="25" fill="#4488ff" font-family="Georgia, serif" font-size="18" font-weight="bold">
      Depth 2: Composed Softplus Layers
    </text>
    <text x="20" y="50" fill="#6699ee" font-family="monospace" font-size="14">
      f(x) = Σ wᵢ σ(Σ vⱼ σ(aⱼx + bⱼ) + cᵢ) + d
    </text>
    <g transform="translate(50, 60)">
      <rect x="0" y="0" width="120" height="35" rx="6" fill="#2a2a3a" stroke="#6699ee" stroke-width="1"/>
      <text x="60" y="22" text-anchor="middle" fill="#6699ee" font-family="monospace" font-size="12">x², x³, ...</text>
    </g>
    <g transform="translate(200, 60)">
      <rect x="0" y="0" width="120" height="35" rx="6" fill="#2a2a3a" stroke="#6699ee" stroke-width="1"/>
      <text x="60" y="22" text-anchor="middle" fill="#6699ee" font-family="monospace" font-size="12">log(x)</text>
    </g>
    <g transform="translate(350, 60)">
      <rect x="0" y="0" width="120" height="35" rx="6" fill="#2a2a3a" stroke="#6699ee" stroke-width="1"/>
      <text x="60" y="22" text-anchor="middle" fill="#6699ee" font-family="monospace" font-size="12">exp(-x²)</text>
    </g>
    <g transform="translate(500, 60)">
      <rect x="0" y="0" width="120" height="35" rx="6" fill="#2a2a3a" stroke="#6699ee" stroke-width="1"/>
      <text x="60" y="22" text-anchor="middle" fill="#6699ee" font-family="monospace" font-size="12">1/(1+x²)</text>
    </g>
    <g transform="translate(650, 60)">
      <rect x="0" y="0" width="150" height="35" rx="6" fill="#2a2a3a" stroke="#6699ee" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#6699ee" font-family="monospace" font-size="12">rational funcs</text>
    </g>
  </g>
  
  <!-- Depth n: Universal -->
  <g transform="translate(50, 510)">
    <rect width="900" height="90" rx="10" fill="#2a1a2a" fill-opacity="0.6" stroke="#cc66ff" stroke-width="2"/>
    <text x="20" y="25" fill="#cc66ff" font-family="Georgia, serif" font-size="18" font-weight="bold">
      Depth n → ∞: All Elementary Functions (Dense in C∞)
    </text>
    <text x="20" y="55" fill="#dd88ff" font-family="monospace" font-size="14">
      Every smooth function on a compact set can be uniformly approximated
    </text>
    <text x="20" y="75" fill="#bb77dd" font-family="Georgia, serif" font-size="13" font-style="italic">
      Universal Approximation via the Sheffer Property
    </text>
  </g>
  
  <!-- Connecting arrows -->
  <line x1="500" y1="210" x2="500" y2="230" stroke="#ffd700" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="360" x2="500" y2="380" stroke="#ffd700" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="490" x2="500" y2="510" stroke="#ffd700" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Side annotations -->
  <text x="970" y="160" text-anchor="end" fill="#44aa44" font-family="monospace" font-size="11">dim = 2</text>
  <text x="970" y="300" text-anchor="end" fill="#ff6b35" font-family="monospace" font-size="11">dim = ∞</text>
  <text x="970" y="440" text-anchor="end" fill="#4488ff" font-family="monospace" font-size="11">dim = ∞</text>
  <text x="970" y="555" text-anchor="end" fill="#cc66ff" font-family="monospace" font-size="11">dense in C⁰</text>
  
  <!-- Bottom insight -->
  <rect x="200" y="630" width="600" height="50" rx="10" fill="#ffd700" fill-opacity="0.08" stroke="#ffd700" stroke-width="1"/>
  <text x="500" y="650" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="14">
    Each depth level strictly expands the function class
  </text>
  <text x="500" y="670" text-anchor="middle" fill="#ccbb44" font-family="Georgia, serif" font-size="13" font-style="italic">
    Sheffer Degree = minimum depth needed to approximate a function
  </text>
</svg>
