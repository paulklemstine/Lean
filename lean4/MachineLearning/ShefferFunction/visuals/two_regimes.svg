<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bg3)" rx="10"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="22" font-weight="bold">
    The Two Regimes of Softplus
  </text>
  
  <!-- Left panel: Exponential regime -->
  <g transform="translate(30,60)">
    <rect width="350" height="300" rx="8" fill="#1a0a0a" fill-opacity="0.5" stroke="#ff6b35" stroke-width="1.5"/>
    <text x="175" y="30" text-anchor="middle" fill="#ff6b35" font-family="Georgia, serif" font-size="18" font-weight="bold">
      Exponential Regime
    </text>
    <text x="175" y="55" text-anchor="middle" fill="#ff9966" font-family="monospace" font-size="14">
      x → −∞ : σ(x) ≈ eˣ
    </text>
    
    <!-- Mini plot showing exponential behavior -->
    <g transform="translate(40,80)">
      <!-- Axes -->
      <line x1="0" y1="180" x2="270" y2="180" stroke="#666" stroke-width="1"/>
      <line x1="135" y1="0" x2="135" y2="190" stroke="#666" stroke-width="1"/>
      
      <!-- e^x curve (dashed) for x in [-5, 0] -->
      <path d="M 10,179 L 37,178.5 L 64,177 L 91,172 L 118,160 L 145,135 L 172,90 L 199,20"
            stroke="#ff4444" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6"/>
      
      <!-- softplus curve for x in [-5, 0] -->
      <path d="M 10,179 L 37,178.5 L 64,177.2 L 91,172.5 L 118,161 L 145,137 L 172,95 L 199,30"
            stroke="#ff6b35" stroke-width="2.5" fill="none"/>
      
      <text x="210" y="25" fill="#ff6b35" font-size="12" font-family="monospace">σ(x)</text>
      <text x="210" y="45" fill="#ff4444" font-size="12" font-family="monospace">eˣ</text>
      
      <text x="135" y="200" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">x ≤ 0</text>
    </g>
    
    <text x="175" y="285" text-anchor="middle" fill="#ffccaa" font-family="Georgia, serif" font-size="12" font-style="italic">
      "Softplus remembers how to exponentiate"
    </text>
  </g>
  
  <!-- Right panel: Linear regime -->
  <g transform="translate(420,60)">
    <rect width="350" height="300" rx="8" fill="#0a1a0a" fill-opacity="0.5" stroke="#00ff88" stroke-width="1.5"/>
    <text x="175" y="30" text-anchor="middle" fill="#00ff88" font-family="Georgia, serif" font-size="18" font-weight="bold">
      Linear Regime
    </text>
    <text x="175" y="55" text-anchor="middle" fill="#66ffaa" font-family="monospace" font-size="14">
      x → +∞ : σ(x) ≈ x
    </text>
    
    <!-- Mini plot showing linear behavior -->
    <g transform="translate(40,80)">
      <!-- Axes -->
      <line x1="0" y1="180" x2="270" y2="180" stroke="#666" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="190" stroke="#666" stroke-width="1"/>
      
      <!-- y=x line (dashed) -->
      <path d="M 0,180 L 54,162 L 108,144 L 162,126 L 216,108 L 270,90"
            stroke="#44aa44" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6"/>
      
      <!-- softplus curve for x in [0, 5] -->
      <path d="M 0,157 L 54,140 L 108,125 L 162,110 L 216,98 L 270,88"
            stroke="#00ff88" stroke-width="2.5" fill="none"/>
      
      <text x="250" y="82" fill="#00ff88" font-size="12" font-family="monospace">σ(x)</text>
      <text x="250" y="102" fill="#44aa44" font-size="12" font-family="monospace">x</text>
      
      <text x="135" y="200" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">x ≥ 0</text>
    </g>
    
    <text x="175" y="285" text-anchor="middle" fill="#aaffcc" font-family="Georgia, serif" font-size="12" font-style="italic">
      "Softplus preserves the identity"
    </text>
  </g>
  
  <!-- Bottom insight -->
  <text x="400" y="385" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="14">
    Both exp and identity in one function → generates all elementary functions via composition
  </text>
</svg>
