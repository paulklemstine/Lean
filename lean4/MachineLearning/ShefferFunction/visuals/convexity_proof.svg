<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgConv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgConv)" rx="10"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="22" font-weight="bold">
    Convexity of Softplus (Proved in Lean 4)
  </text>
  <text x="400" y="60" text-anchor="middle" fill="#aaaacc" font-family="Georgia, serif" font-size="14">
    σ(tx + (1−t)y) ≤ tσ(x) + (1−t)σ(y) for all t ∈ [0,1]
  </text>
  
  <!-- Plot -->
  <g transform="translate(100, 80)">
    <g stroke="#333366" stroke-width="0.5">
      <line x1="0" y1="0" x2="600" y2="0"/>
      <line x1="0" y1="100" x2="600" y2="100"/>
      <line x1="0" y1="200" x2="600" y2="200"/>
      <line x1="0" y1="300" x2="600" y2="300"/>
    </g>
    
    <line x1="0" y1="300" x2="600" y2="300" stroke="#6666aa" stroke-width="1.5"/>
    <line x1="100" y1="0" x2="100" y2="310" stroke="#6666aa" stroke-width="1.5"/>
    
    <!-- Softplus curve -->
    <path d="M 0,299.8 L 50,299 L 100,296 L 150,288 L 200,270 L 250,245
             L 300,210 L 350,165 L 400,115 L 450,60 L 500,5"
          stroke="#00ff88" stroke-width="3" fill="none"/>
    
    <!-- Secant line showing convexity -->
    <line x1="100" y1="296" x2="450" y2="60" stroke="#ff6b35" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- Points x and y -->
    <circle cx="100" cy="296" r="6" fill="#ff6b35" stroke="#fff" stroke-width="1.5"/>
    <circle cx="450" cy="60" r="6" fill="#ff6b35" stroke="#fff" stroke-width="1.5"/>
    
    <!-- Midpoint showing convexity -->
    <circle cx="275" cy="178" r="4" fill="#ff6b35" opacity="0.7"/>
    <circle cx="275" cy="237" r="4" fill="#00ff88"/>
    
    <!-- Arrow showing gap -->
    <line x1="275" y1="178" x2="275" y2="237" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="290" y="215" fill="#ffd700" font-family="monospace" font-size="11">gap ≥ 0</text>
    
    <!-- Labels -->
    <text x="80" y="310" fill="#ff6b35" font-family="monospace" font-size="12">x</text>
    <text x="460" y="55" fill="#ff6b35" font-family="monospace" font-size="12">y</text>
    <text x="500" y="20" fill="#00ff88" font-family="monospace" font-size="14">σ(x)</text>
    <text x="460" y="100" fill="#ff6b35" font-family="monospace" font-size="11">secant</text>
  </g>
  
  <!-- Proof structure box -->
  <g transform="translate(50, 400)">
    <rect width="700" height="80" rx="8" fill="#1a1a3e" stroke="#ffd700" stroke-width="1"/>
    <text x="350" y="25" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="14">
      Proof structure: σ''(x) = S(x)(1 − S(x)) &gt; 0 for all x
    </text>
    <text x="350" y="48" text-anchor="middle" fill="#ccccee" font-family="Georgia, serif" font-size="13">
      where S(x) = σ'(x) = eˣ/(1+eˣ) is the sigmoid function
    </text>
    <text x="350" y="68" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="13">
      Positive second derivative ⟹ strict convexity  ✓ Lean 4
    </text>
  </g>
</svg>
