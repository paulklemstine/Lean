<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgId" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <filter id="glowId">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgId)" rx="10"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="22" font-weight="bold">
    Identity Extraction: σ(x) − σ(−x) = x
  </text>
  <text x="400" y="60" text-anchor="middle" fill="#aaaacc" font-family="Georgia, serif" font-size="14">
    Proved in Lean 4 — The identity function emerges from softplus
  </text>
  
  <!-- Plot area -->
  <g transform="translate(100, 80)">
    <!-- Grid -->
    <g stroke="#333366" stroke-width="0.5">
      <line x1="0" y1="0" x2="600" y2="0"/>
      <line x1="0" y1="75" x2="600" y2="75"/>
      <line x1="0" y1="150" x2="600" y2="150"/>
      <line x1="0" y1="225" x2="600" y2="225"/>
      <line x1="0" y1="300" x2="600" y2="300"/>
    </g>
    
    <!-- Axes -->
    <line x1="0" y1="150" x2="600" y2="150" stroke="#6666aa" stroke-width="1.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#6666aa" stroke-width="1.5"/>
    
    <!-- Labels -->
    <text x="0" y="320" fill="#8888bb" font-family="monospace" font-size="11">-4</text>
    <text x="150" y="320" fill="#8888bb" font-family="monospace" font-size="11">-2</text>
    <text x="300" y="320" fill="#8888bb" font-family="monospace" font-size="11">0</text>
    <text x="450" y="320" fill="#8888bb" font-family="monospace" font-size="11">2</text>
    <text x="590" y="320" fill="#8888bb" font-family="monospace" font-size="11">4</text>
    
    <!-- σ(x) curve (orange) -->
    <!-- σ(-4)≈0.018, σ(-2)≈0.127, σ(0)=0.693, σ(2)=2.127, σ(4)=4.018 -->
    <!-- Scale: 75px per unit x, 37.5px per unit y, origin at (300, 150) -->
    <path d="M 0,149.3 L 75,145.2 L 150,133.5 L 225,105 L 300,124
             L 375,70 L 450,10 L 525,-55 L 600,-120"
          stroke="#ff6b35" stroke-width="2" fill="none" opacity="0.7"/>
    <text x="560" y="-110" fill="#ff6b35" font-family="monospace" font-size="13">σ(x)</text>
    
    <!-- -σ(-x) curve (cyan) -->
    <!-- -σ(-x) at x: -σ(4)≈-4.018, -σ(2)≈-2.127, -σ(0)=-0.693, -σ(-2)=-0.127, -σ(-4)=-0.018 -->
    <path d="M 0,300.7 L 75,229.8 L 150,230 L 225,176 L 300,176
             L 375,183 L 450,195 L 525,220 L 600,230"
          stroke="#00bcd4" stroke-width="2" fill="none" opacity="0.7"/>
    <text x="560" y="245" fill="#00bcd4" font-family="monospace" font-size="13">−σ(−x)</text>
    
    <!-- Result: y = x (gold, thick) -->
    <path d="M 0,300 L 150,225 L 300,150 L 450,75 L 600,0"
          stroke="#ffd700" stroke-width="3" fill="none" filter="url(#glowId)"/>
    <text x="560" y="10" fill="#ffd700" font-family="monospace" font-size="15" font-weight="bold">x</text>
    
    <!-- Annotation arrows showing the sum -->
    <g transform="translate(375, 0)">
      <!-- σ(x) value -->
      <line x1="0" y1="150" x2="0" y2="70" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- -σ(-x) value -->
      <line x1="5" y1="150" x2="5" y2="183" stroke="#00bcd4" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- Sum = x -->
      <line x1="10" y1="150" x2="10" y2="75" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="5,3"/>
    </g>
  </g>
  
  <!-- Formula box -->
  <rect x="100" y="420" width="600" height="65" rx="10" fill="#1a1a3e" stroke="#ffd700" stroke-width="1.5"/>
  <text x="400" y="445" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="16">
    Proof: log(1+eˣ) − log(1+e⁻ˣ) = log[(1+eˣ)/(1+e⁻ˣ)]
  </text>
  <text x="400" y="470" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="16">
    = log[(1+eˣ) · eˣ/(eˣ+1)] = log(eˣ) = x  ✓
  </text>
</svg>
