<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700"
     font-family="'CMU Serif', 'Latin Modern Math', 'STIX Two Math', Georgia, serif">

  <defs>
    <!-- Gradient for nodes -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f9fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eef6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5282;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a7bc7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7bc7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a7bc7"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c53030"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#fafbfd" rx="8"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a365d"
        letter-spacing="0.5">MLC Hierarchy: Graded Lattice Structure</text>
  <text x="450" y="58" text-anchor="middle" font-size="11" fill="#718096" font-style="italic">
    Multi-Lens Composition forms a commutative monoid (ℕ, +) under lens application
  </text>

  <!-- Vertical axis label -->
  <text x="30" y="400" text-anchor="middle" font-size="11" fill="#a0aec0"
        transform="rotate(-90, 30, 400)">Search Space Reduction  S / 2ᵏ →</text>

  <!-- Grid lines (subtle) -->
  <g stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4">
    <line x1="80" y1="100" x2="860" y2="100"/>
    <line x1="80" y1="200" x2="860" y2="200"/>
    <line x1="80" y1="310" x2="860" y2="310"/>
    <line x1="80" y1="420" x2="860" y2="420"/>
    <line x1="80" y1="530" x2="860" y2="530"/>
    <line x1="80" y1="620" x2="860" y2="620"/>
  </g>

  <!-- Grade labels (right side) -->
  <g font-size="10" fill="#a0aec0" text-anchor="end">
    <text x="875" y="104">k = 0</text>
    <text x="875" y="204">k = 1</text>
    <text x="875" y="314">k = 2</text>
    <text x="875" y="424">k = 3</text>
    <text x="875" y="534">k = 5</text>
    <text x="875" y="624">k = 9</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEVEL 0: MLC(0) — Full search space S -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="350" y="80" width="200" height="40" rx="6" fill="url(#nodeGrad)"
        stroke="#2c5282" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5282">MLC(0) = S</text>
  <text x="450" y="114" text-anchor="middle" font-size="9" fill="#718096">Full search space</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEVEL 1: Individual lenses — S/2 -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Connecting lines from MLC(0) to each lens -->
  <g stroke="#cbd5e0" stroke-width="1" fill="none">
    <path d="M 370,120 C 370,150 150,170 150,180"/>
    <path d="M 410,120 C 410,150 310,170 310,180"/>
    <path d="M 450,120 C 450,155 450,170 450,180"/>
    <path d="M 490,120 C 490,150 590,170 590,180"/>
    <path d="M 530,120 C 530,150 750,170 750,180"/>
  </g>

  <!-- Lens nodes at level 1 -->
  <g filter="url(#shadow)">
    <!-- L₁: Fibonacci -->
    <rect x="90" y="180" width="120" height="36" rx="5" fill="url(#lensGrad)"/>
    <text x="150" y="198" text-anchor="middle" font-size="10" fill="white" font-weight="bold">L₁ Fibonacci</text>
    <text x="150" y="210" text-anchor="middle" font-size="8" fill="#bee3f8">S/2</text>

    <!-- L₂: Hyperbolic -->
    <rect x="250" y="180" width="120" height="36" rx="5" fill="url(#lensGrad)"/>
    <text x="310" y="198" text-anchor="middle" font-size="10" fill="white" font-weight="bold">L₂ Hyperbolic</text>
    <text x="310" y="210" text-anchor="middle" font-size="8" fill="#bee3f8">S/2</text>

    <!-- L₃: Orbit -->
    <rect x="395" y="180" width="110" height="36" rx="5" fill="url(#lensGrad)"/>
    <text x="450" y="198" text-anchor="middle" font-size="10" fill="white" font-weight="bold">L₃ Orbit</text>
    <text x="450" y="210" text-anchor="middle" font-size="8" fill="#bee3f8">S/2</text>

    <!-- L₄: Spectral -->
    <rect x="530" y="180" width="120" height="36" rx="5" fill="url(#lensGrad)"/>
    <text x="590" y="198" text-anchor="middle" font-size="10" fill="white" font-weight="bold">L₄ Spectral</text>
    <text x="590" y="210" text-anchor="middle" font-size="8" fill="#bee3f8">S/2</text>

    <!-- L₅–₉: collapsed -->
    <rect x="680" y="180" width="130" height="36" rx="5" fill="url(#lensGrad)" stroke-dasharray="3,2"
          stroke="#bee3f8" stroke-width="0.5"/>
    <text x="745" y="198" text-anchor="middle" font-size="10" fill="white" font-weight="bold">L₅ … L₉</text>
    <text x="745" y="210" text-anchor="middle" font-size="8" fill="#bee3f8">S/2 each</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEVEL 2: Pairwise compositions — S/4 -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g stroke="#cbd5e0" stroke-width="0.8" fill="none">
    <path d="M 150,216 C 150,260 270,260 270,290"/>
    <path d="M 310,216 C 310,260 340,260 340,290"/>
    <path d="M 450,216 C 450,260 430,260 430,290"/>
    <path d="M 590,216 C 590,260 540,260 540,290"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="220" y="290" width="130" height="36" rx="5" fill="url(#nodeGrad)"
          stroke="#4a7bc7" stroke-width="1.2"/>
    <text x="285" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5282">MLC(2) = S/4</text>
    <text x="285" y="320" text-anchor="middle" font-size="8" fill="#718096">Lᵢ ∘ Lⱼ (i ≠ j)</text>

    <rect x="450" y="290" width="160" height="36" rx="5" fill="url(#nodeGrad)"
          stroke="#4a7bc7" stroke-width="1.2"/>
    <text x="530" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5282">Commutativity</text>
    <text x="530" y="320" text-anchor="middle" font-size="8" fill="#718096">Lᵢ ∘ Lⱼ = Lⱼ ∘ Lᵢ</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEVEL 3: Triple compositions — S/8 -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g stroke="#cbd5e0" stroke-width="0.8" fill="none">
    <path d="M 285,326 C 285,370 370,370 370,400"/>
    <path d="M 530,326 C 530,370 450,370 450,400"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="400" width="180" height="40" rx="5" fill="url(#nodeGrad)"
          stroke="#4a7bc7" stroke-width="1.2"/>
    <text x="420" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5282">MLC(3) = S/8</text>
    <text x="420" y="432" text-anchor="middle" font-size="8" fill="#718096">
      S/2ᵃ/2ᵇ = S/2ᵃ⁺ᵇ (power law)</text>
  </g>

  <!-- Dots indicating continuation -->
  <g fill="#a0aec0" font-size="20" text-anchor="middle">
    <text x="420" y="475">⋮</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEVEL 5: MLC(5) = S/32 -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <rect x="310" y="510" width="200" height="36" rx="5" fill="url(#nodeGrad)"
          stroke="#4a7bc7" stroke-width="1.2"/>
    <text x="410" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5282">MLC(5) = S/32</text>
    <text x="410" y="540" text-anchor="middle" font-size="8" fill="#718096">5 independent lenses</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEVEL 9: MLC(9) = S/512 — Full framework -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g stroke="#cbd5e0" stroke-width="0.8" fill="none">
    <path d="M 410,546 C 410,575 420,575 420,595"/>
  </g>
  <g fill="#a0aec0" font-size="16" text-anchor="middle">
    <text x="415" y="578">⋮</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="598" width="240" height="44" rx="6"
          fill="#2c5282" stroke="#1a365d" stroke-width="1.5"/>
    <text x="410" y="618" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      MLC(9) = S/512</text>
    <text x="410" y="634" text-anchor="middle" font-size="9" fill="#bee3f8">
      9 independent lenses · √(S/512) qubits</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Naturality square (right side) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="640" y="300" width="210" height="190" rx="8" fill="none"
        stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="745" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#718096">
    Naturality Square</text>

  <!-- The square diagram -->
  <g font-size="10" fill="#2c5282" font-weight="bold" text-anchor="middle">
    <text x="680" y="355">S/2ᵃ</text>
    <text x="805" y="355">S/2ᵇ</text>
    <text x="680" y="465">S/2ᵃ⁺ᵇ</text>
    <text x="805" y="465">S/2ᵃ⁺ᵇ</text>
  </g>

  <!-- Square arrows -->
  <g stroke="#4a7bc7" stroke-width="1.2" fill="none" marker-end="url(#arrowhead)">
    <line x1="700" y1="350" x2="785" y2="350"/>
    <line x1="680" y1="362" x2="680" y2="450"/>
    <line x1="805" y1="362" x2="805" y2="450"/>
    <line x1="700" y1="460" x2="785" y2="460"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="8" fill="#718096" text-anchor="middle" font-style="italic">
    <text x="742" y="344">/2ᵇ</text>
    <text x="665" y="410">/2ᵇ</text>
    <text x="820" y="410">/2ᵃ</text>
    <text x="742" y="475">id</text>
  </g>

  <!-- Diagonal "=" -->
  <text x="742" y="412" text-anchor="middle" font-size="16" fill="#c53030" font-weight="bold">=</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Independence ceiling annotation -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="90" y="410" width="200" height="60" rx="6" fill="#fff5f5"
        stroke="#c53030" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="190" y="428" text-anchor="middle" font-size="9" font-weight="bold" fill="#c53030">
    Independence Conjecture</text>
  <text x="190" y="442" text-anchor="middle" font-size="8" fill="#9b2c2c">
    max independent lenses</text>
  <text x="190" y="456" text-anchor="middle" font-size="11" fill="#c53030" font-weight="bold"
        font-style="italic">k* = Θ(log log N)</text>
  <text x="190" y="466" text-anchor="middle" font-size="7" fill="#9b2c2c">
    ≈ 7.7 for RSA-2048</text>

  <!-- Strict separation annotation -->
  <rect x="90" y="290" width="110" height="40" rx="4" fill="#f0fff4"
        stroke="#276749" stroke-width="0.8"/>
  <text x="145" y="308" text-anchor="middle" font-size="8" font-weight="bold" fill="#276749">
    Strict Separation</text>
  <text x="145" y="322" text-anchor="middle" font-size="8" fill="#276749" font-style="italic">
    S/2ᵏ⁺¹ &lt; S/2ᵏ</text>

  <!-- Monoid structure annotation -->
  <rect x="90" y="340" width="110" height="48" rx="4" fill="#fffff0"
        stroke="#975a16" stroke-width="0.8"/>
  <text x="145" y="356" text-anchor="middle" font-size="8" font-weight="bold" fill="#975a16">
    Monoid (ℕ, +)</text>
  <text x="145" y="368" text-anchor="middle" font-size="7" fill="#975a16">Identity: k = 0</text>
  <text x="145" y="378" text-anchor="middle" font-size="7" fill="#975a16">Assoc: (a+b)+c = a+(b+c)</text>
  <text x="145" y="388" text-anchor="middle" font-size="7" fill="#975a16">Comm: a+b = b+a</text>

  <!-- Footer -->
  <text x="450" y="685" text-anchor="middle" font-size="9" fill="#a0aec0" font-style="italic">
    MetaFactoring Phase II — MLC Hierarchy Naturality Diagram
  </text>
</svg>
