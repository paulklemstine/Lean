<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#161b22" />
    </linearGradient>
  </defs>

  <rect width="700" height="400" fill="url(#cbg)"/>

  <text x="350" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">
    Constraint Intersection: Exponential Search Reduction
  </text>
  <text x="350" y="48" text-anchor="middle" fill="#8b949e" font-size="11">
    S / 2^k → 0 as k → ∞ (Theorem 4.1, formally verified)
  </text>

  <!-- Axes -->
  <line x1="80" y1="340" x2="650" y2="340" stroke="#555577" stroke-width="1"/>
  <line x1="80" y1="340" x2="80" y2="70" stroke="#555577" stroke-width="1"/>
  <text x="365" y="375" text-anchor="middle" fill="#8b949e" font-size="11">Number of independent lenses (k)</text>
  <text x="30" y="205" text-anchor="middle" fill="#8b949e" font-size="11" transform="rotate(-90, 30, 205)">Search space remaining (%)</text>

  <!-- Grid lines -->
  <line x1="80" y1="305" x2="650" y2="305" stroke="#222244" stroke-width="0.5"/>
  <text x="72" y="309" text-anchor="end" fill="#666688" font-size="9">14%</text>
  <line x1="80" y1="270" x2="650" y2="270" stroke="#222244" stroke-width="0.5"/>
  <text x="72" y="274" text-anchor="end" fill="#666688" font-size="9">29%</text>
  <line x1="80" y1="235" x2="650" y2="235" stroke="#222244" stroke-width="0.5"/>
  <text x="72" y="239" text-anchor="end" fill="#666688" font-size="9">43%</text>
  <line x1="80" y1="200" x2="650" y2="200" stroke="#222244" stroke-width="0.5"/>
  <text x="72" y="204" text-anchor="end" fill="#666688" font-size="9">57%</text>
  <line x1="80" y1="165" x2="650" y2="165" stroke="#222244" stroke-width="0.5"/>
  <text x="72" y="169" text-anchor="end" fill="#666688" font-size="9">72%</text>
  <line x1="80" y1="130" x2="650" y2="130" stroke="#222244" stroke-width="0.5"/>
  <text x="72" y="134" text-anchor="end" fill="#666688" font-size="9">86%</text>
  <line x1="80" y1="95" x2="650" y2="95" stroke="#222244" stroke-width="0.5"/>
  <text x="72" y="99" text-anchor="end" fill="#666688" font-size="9">100%</text>
  <rect x="60" y="90.0" width="40" height="250.0" rx="4" fill="#ff6b6b" opacity="0.8"/>
  <text x="80" y="82.0" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="bold">100.0%</text>
  <text x="80" y="358" text-anchor="middle" fill="#8b949e" font-size="10">0</text>
  <rect x="140" y="215.0" width="40" height="125.0" rx="4" fill="#4ecdc4" opacity="0.8"/>
  <text x="160" y="207.0" text-anchor="middle" fill="#4ecdc4" font-size="10" font-weight="bold">50.0%</text>
  <text x="160" y="358" text-anchor="middle" fill="#8b949e" font-size="10">1</text>
  <rect x="220" y="277.5" width="40" height="62.5" rx="4" fill="#45b7d1" opacity="0.8"/>
  <text x="240" y="269.5" text-anchor="middle" fill="#45b7d1" font-size="10" font-weight="bold">25.0%</text>
  <text x="240" y="358" text-anchor="middle" fill="#8b949e" font-size="10">2</text>
  <rect x="300" y="308.75" width="40" height="31.25" rx="4" fill="#f7dc6f" opacity="0.8"/>
  <text x="320" y="300.75" text-anchor="middle" fill="#f7dc6f" font-size="10" font-weight="bold">12.5%</text>
  <text x="320" y="358" text-anchor="middle" fill="#8b949e" font-size="10">3</text>
  <rect x="380" y="324.375" width="40" height="15.625" rx="4" fill="#bb8fce" opacity="0.8"/>
  <text x="400" y="316.375" text-anchor="middle" fill="#bb8fce" font-size="10" font-weight="bold">6.2%</text>
  <text x="400" y="358" text-anchor="middle" fill="#8b949e" font-size="10">4</text>
  <rect x="460" y="332.1875" width="40" height="7.8125" rx="4" fill="#e74c3c" opacity="0.8"/>
  <text x="480" y="324.1875" text-anchor="middle" fill="#e74c3c" font-size="10" font-weight="bold">3.1%</text>
  <text x="480" y="358" text-anchor="middle" fill="#8b949e" font-size="10">5</text>
  <rect x="540" y="336.09375" width="40" height="3.90625" rx="4" fill="#2ecc71" opacity="0.8"/>
  <text x="560" y="328.09375" text-anchor="middle" fill="#2ecc71" font-size="10" font-weight="bold">1.6%</text>
  <text x="560" y="358" text-anchor="middle" fill="#8b949e" font-size="10">6</text>
  <rect x="620" y="338.046875" width="40" height="1.953125" rx="4" fill="#3498db" opacity="0.8"/>
  <text x="640" y="330.046875" text-anchor="middle" fill="#3498db" font-size="10" font-weight="bold">0.8%</text>
  <text x="640" y="358" text-anchor="middle" fill="#8b949e" font-size="10">7</text>

  <!-- Lens labels -->
  <text x="160" y="390" text-anchor="middle" fill="#4ecdc4" font-size="8">+Fibonacci</text>
  <text x="240" y="390" text-anchor="middle" fill="#45b7d1" font-size="8">+Hyperbolic</text>
  <text x="320" y="390" text-anchor="middle" fill="#f7dc6f" font-size="8">+Orbit</text>
  <text x="400" y="390" text-anchor="middle" fill="#bb8fce" font-size="8">+Spectral</text>
  <text x="480" y="390" text-anchor="middle" fill="#e74c3c" font-size="8">+Norm</text>
  <text x="560" y="390" text-anchor="middle" fill="#2ecc71" font-size="8">+Lattice</text>
  <text x="640" y="390" text-anchor="middle" fill="#3498db" font-size="8">+Congruence</text>
</svg>