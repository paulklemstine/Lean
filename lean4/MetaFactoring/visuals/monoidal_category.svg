<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2a0a"/>
      <stop offset="100%" stop-color="#1a3a1a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgM)"/>

  <text x="400" y="35" text-anchor="middle" fill="#88FF88" font-size="22" font-weight="bold">Monoidal Category of Factoring Lenses</text>
  <text x="400" y="58" text-anchor="middle" fill="#66CC66" font-size="13">Lenses form a commutative monoid: (Lenses, ⊗, I)</text>

  <!-- Category diagram -->
  <!-- Objects -->
  <circle cx="400" cy="130" r="40" fill="#1a3a1a" stroke="#88FF88" stroke-width="2"/>
  <text x="400" y="125" text-anchor="middle" fill="#88FF88" font-size="13" font-weight="bold">S</text>
  <text x="400" y="143" text-anchor="middle" fill="#66CC66" font-size="10">Search Space</text>

  <!-- Arrow: Identity -->
  <path d="M 440,130 C 480,100 480,160 440,130" fill="none" stroke="#66CC66" stroke-width="1.5"/>
  <text x="495" y="130" fill="#66CC66" font-size="10">I = 2⁰ = 1</text>

  <!-- Tensor products -->
  <g transform="translate(150, 250)">
    <rect x="-80" y="-30" width="160" height="60" rx="8" fill="#1a3a1a" stroke="#44DD44" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#44DD44" font-size="12" font-weight="bold">A ⊗ B</text>
    <text x="0" y="12" text-anchor="middle" fill="#88FF88" font-size="10">S / 2^(a+b)</text>
  </g>

  <g transform="translate(400, 250)">
    <rect x="-80" y="-30" width="160" height="60" rx="8" fill="#1a3a1a" stroke="#44DD44" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#44DD44" font-size="12" font-weight="bold">B ⊗ A</text>
    <text x="0" y="12" text-anchor="middle" fill="#88FF88" font-size="10">S / 2^(b+a)</text>
  </g>

  <!-- Equals sign -->
  <text x="290" y="255" text-anchor="middle" fill="#FFFF00" font-size="20" font-weight="bold">=</text>

  <!-- Properties -->
  <rect x="50" y="330" width="700" height="150" rx="10" fill="#0a1a0a" stroke="#44DD44" stroke-width="1.5"/>

  <text x="400" y="358" text-anchor="middle" fill="#88FF88" font-size="15" font-weight="bold">Formally Verified Properties</text>

  <text x="100" y="385" fill="#66FF66" font-size="12">✓ Tensor product:    S/2^a / 2^b = S/2^(a+b)</text>
  <text x="100" y="408" fill="#66FF66" font-size="12">✓ Unit (identity):    S/2^0 = S</text>
  <text x="100" y="431" fill="#66FF66" font-size="12">✓ Associativity:     (A ⊗ B) ⊗ C = A ⊗ (B ⊗ C) = S/2^(a+b+c)</text>
  <text x="100" y="454" fill="#66FF66" font-size="12">✓ Commutativity:     A ⊗ B = B ⊗ A    (lens order doesn't matter!)</text>
  <text x="100" y="474" fill="#FFFF66" font-size="12" font-weight="bold">→ The 9 lenses form a free commutative monoid on 9 generators</text>

  <!-- Associativity diagram -->
  <g transform="translate(600, 200)">
    <text x="0" y="0" text-anchor="middle" fill="#88FF88" font-size="11">(A⊗B)⊗C</text>
    <text x="0" y="70" text-anchor="middle" fill="#88FF88" font-size="11">A⊗(B⊗C)</text>
    <text x="80" y="35" text-anchor="middle" fill="#88FF88" font-size="11">A⊗B⊗C</text>
    <line x1="30" y1="5" x2="65" y2="25" stroke="#44DD44" stroke-width="1.5"/>
    <line x1="30" y1="62" x2="65" y2="42" stroke="#44DD44" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="55" stroke="#44DD44" stroke-width="1.5"/>
    <text x="-15" y="35" fill="#FFFF00" font-size="10">=</text>
  </g>
</svg>
