<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5af19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f12711;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="550" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="white" font-size="24" font-weight="bold">The Unified Pisano Divisibility Theorem</text>
  <text x="450" y="70" text-anchor="middle" fill="#aaa" font-size="14" font-style="italic">Machine-verified in Lean 4 — MetaFactoring Open Questions</text>
  
  <!-- Central theorem box -->
  <rect x="200" y="90" width="500" height="70" rx="10" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <text x="450" y="120" text-anchor="middle" fill="#f5af19" font-size="18" font-weight="bold">For all primes p ≠ 5:</text>
  <text x="450" y="145" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-style="italic">p  |  F(p² − 1)</text>
  
  <!-- Arrow down -->
  <line x1="450" y1="160" x2="450" y2="185" stroke="#aaa" stroke-width="2"/>
  <polygon points="445,185 455,185 450,195" fill="#aaa"/>
  
  <!-- Factorization -->
  <rect x="250" y="195" width="400" height="40" rx="8" fill="#0a0a1e" stroke="#667eea" stroke-width="1"/>
  <text x="450" y="220" text-anchor="middle" fill="#667eea" font-size="16">p² − 1 = (p − 1) · (p + 1)</text>
  
  <!-- Split into two branches -->
  <line x1="350" y1="235" x2="220" y2="280" stroke="#764ba2" stroke-width="2"/>
  <line x1="550" y1="235" x2="680" y2="280" stroke="#f12711" stroke-width="2"/>
  
  <!-- Split case -->
  <rect x="80" y="280" width="280" height="130" rx="10" fill="#0a0a1e" stroke="url(#blue)" stroke-width="2"/>
  <text x="220" y="305" text-anchor="middle" fill="#764ba2" font-size="15" font-weight="bold">Split Case</text>
  <text x="220" y="330" text-anchor="middle" fill="#ccc" font-size="13">p ≡ ±1 (mod 5)</text>
  <text x="220" y="355" text-anchor="middle" fill="white" font-size="14">p | F(p − 1)</text>
  <text x="220" y="380" text-anchor="middle" fill="#ccc" font-size="12">(p−1) | (p²−1) ✓</text>
  <text x="220" y="400" text-anchor="middle" fill="#38ef7d" font-size="12">∴ F(p−1) | F(p²−1) → p | F(p²−1)</text>
  
  <!-- Inert case -->
  <rect x="540" y="280" width="280" height="130" rx="10" fill="#0a0a1e" stroke="url(#gold)" stroke-width="2"/>
  <text x="680" y="305" text-anchor="middle" fill="#f12711" font-size="15" font-weight="bold">Inert Case</text>
  <text x="680" y="330" text-anchor="middle" fill="#ccc" font-size="13">p ≡ ±2 (mod 5)</text>
  <text x="680" y="355" text-anchor="middle" fill="white" font-size="14">p | F(p + 1)</text>
  <text x="680" y="380" text-anchor="middle" fill="#ccc" font-size="12">(p+1) | (p²−1) ✓</text>
  <text x="680" y="400" text-anchor="middle" fill="#38ef7d" font-size="12">∴ F(p+1) | F(p²−1) → p | F(p²−1)</text>
  
  <!-- Key lemma box -->
  <rect x="250" y="430" width="400" height="45" rx="8" fill="#0a0a1e" stroke="url(#green)" stroke-width="1"/>
  <text x="450" y="448" text-anchor="middle" fill="#38ef7d" font-size="13" font-weight="bold">Key Lemma: Fibonacci Divisibility</text>
  <text x="450" y="467" text-anchor="middle" fill="#ccc" font-size="13">m | n  ⟹  F(m) | F(n)</text>
  
  <!-- Arrows to key lemma -->
  <line x1="220" y1="410" x2="350" y2="430" stroke="#38ef7d" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="680" y1="410" x2="550" y2="430" stroke="#38ef7d" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Primes diagram -->
  <text x="450" y="510" text-anchor="middle" fill="#aaa" font-size="12">
    p=2: F(3)=2 ✓ | p=3: F(8)=21=3·7 ✓ | p=7: F(48)=4807526976 ✓ | p=11: F(120)≡0 ✓ | p=13: F(168)≡0 ✓
  </text>
  <text x="450" y="535" text-anchor="middle" fill="#667eea" font-size="11" font-style="italic">
    Lean 4 theorem: pisano_period_divides_p_sq_sub_one — 0 sorries, fully machine-verified
  </text>
</svg>
