<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0f0f1a"/>
  
  <text x="400" y="35" fill="#e0e0ff" font-size="22" font-weight="bold" text-anchor="middle" font-family="Arial">Tropical Lens: p-adic Valuation Profiles</text>
  <text x="400" y="55" fill="#8888bb" font-size="12" text-anchor="middle" font-family="Arial">v_p(a·b) = v_p(a) + v_p(b) — Multiplication becomes Addition</text>
  
  <!-- Example: 360 = 2³ × 3² × 5 -->
  <text x="200" y="100" fill="#00ff88" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">N = 360 = 2³ × 3² × 5</text>
  
  <!-- Valuation bars for 360 -->
  <g transform="translate(70,120)">
    <text x="0" y="15" fill="#aaaacc" font-size="11" text-anchor="start" font-family="Arial">v₂ = 3</text>
    <rect x="60" y="2" width="120" height="18" rx="4" fill="#00aa55" opacity="0.8"/>
    <rect x="60" y="2" width="40" height="18" rx="4" fill="#00cc66" opacity="0.5" stroke="#00ff88" stroke-width="1"/>
    <rect x="100" y="2" width="40" height="18" rx="4" fill="#00cc66" opacity="0.5" stroke="#00ff88" stroke-width="1"/>
    <rect x="140" y="2" width="40" height="18" rx="4" fill="#00cc66" opacity="0.5" stroke="#00ff88" stroke-width="1"/>
    
    <text x="0" y="45" fill="#aaaacc" font-size="11" text-anchor="start" font-family="Arial">v₃ = 2</text>
    <rect x="60" y="32" width="80" height="18" rx="4" fill="#0088aa" opacity="0.8"/>
    <rect x="60" y="32" width="40" height="18" rx="4" fill="#00aacc" opacity="0.5" stroke="#00ccee" stroke-width="1"/>
    <rect x="100" y="32" width="40" height="18" rx="4" fill="#00aacc" opacity="0.5" stroke="#00ccee" stroke-width="1"/>
    
    <text x="0" y="75" fill="#aaaacc" font-size="11" text-anchor="start" font-family="Arial">v₅ = 1</text>
    <rect x="60" y="62" width="40" height="18" rx="4" fill="#aa6600" opacity="0.8"/>
    <rect x="60" y="62" width="40" height="18" rx="4" fill="#cc8800" opacity="0.5" stroke="#eeaa00" stroke-width="1"/>
    
    <text x="0" y="105" fill="#666" font-size="11" text-anchor="start" font-family="Arial">v₇ = 0</text>
    <text x="0" y="125" fill="#666" font-size="11" text-anchor="start" font-family="Arial">v₁₁= 0</text>
  </g>
  
  <!-- Factorization decomposition -->
  <text x="200" y="280" fill="#ffcc88" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial">Tropical Decomposition: 360 = 12 × 30</text>
  
  <!-- 12 = 2² × 3 -->
  <g transform="translate(50,300)">
    <text x="70" y="-5" fill="#88ddaa" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">12 = 2² × 3</text>
    <text x="0" y="20" fill="#aaaacc" font-size="10" text-anchor="start" font-family="Arial">v₂ = 2</text>
    <rect x="50" y="8" width="80" height="14" rx="3" fill="#00aa55" opacity="0.7"/>
    <text x="0" y="42" fill="#aaaacc" font-size="10" text-anchor="start" font-family="Arial">v₃ = 1</text>
    <rect x="50" y="30" width="40" height="14" rx="3" fill="#0088aa" opacity="0.7"/>
    <text x="0" y="64" fill="#aaaacc" font-size="10" text-anchor="start" font-family="Arial">v₅ = 0</text>
  </g>
  
  <!-- Plus sign -->
  <text x="200" y="345" fill="#ffaa44" font-size="28" font-weight="bold" text-anchor="middle" font-family="Arial">+</text>
  
  <!-- 30 = 2 × 3 × 5 -->
  <g transform="translate(230,300)">
    <text x="70" y="-5" fill="#88ddaa" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">30 = 2 × 3 × 5</text>
    <text x="0" y="20" fill="#aaaacc" font-size="10" text-anchor="start" font-family="Arial">v₂ = 1</text>
    <rect x="50" y="8" width="40" height="14" rx="3" fill="#00aa55" opacity="0.7"/>
    <text x="0" y="42" fill="#aaaacc" font-size="10" text-anchor="start" font-family="Arial">v₃ = 1</text>
    <rect x="50" y="30" width="40" height="14" rx="3" fill="#0088aa" opacity="0.7"/>
    <text x="0" y="64" fill="#aaaacc" font-size="10" text-anchor="start" font-family="Arial">v₅ = 1</text>
    <rect x="50" y="52" width="40" height="14" rx="3" fill="#aa6600" opacity="0.7"/>
  </g>
  
  <!-- Semiprime example on right -->
  <text x="600" y="100" fill="#ff66ff" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">Semiprime: 143 = 11 × 13</text>
  
  <g transform="translate(450,120)">
    <text x="0" y="15" fill="#666" font-size="11" text-anchor="start" font-family="Arial">v₂ = 0</text>
    <text x="0" y="35" fill="#666" font-size="11" text-anchor="start" font-family="Arial">v₃ = 0</text>
    <text x="0" y="55" fill="#666" font-size="11" text-anchor="start" font-family="Arial">v₅ = 0</text>
    <text x="0" y="75" fill="#666" font-size="11" text-anchor="start" font-family="Arial">v₇ = 0</text>
    <text x="0" y="95" fill="#aaaacc" font-size="11" text-anchor="start" font-family="Arial">v₁₁= 1</text>
    <rect x="60" y="82" width="40" height="16" rx="3" fill="#ff44ff" opacity="0.8"/>
    <text x="0" y="115" fill="#aaaacc" font-size="11" text-anchor="start" font-family="Arial">v₁₃= 1</text>
    <rect x="60" y="102" width="40" height="16" rx="3" fill="#ff44ff" opacity="0.8"/>
  </g>
  
  <text x="600" y="270" fill="#cc88ff" font-size="12" text-anchor="middle" font-family="Arial">Semiprimes have the sparsest</text>
  <text x="600" y="288" fill="#cc88ff" font-size="12" text-anchor="middle" font-family="Arial">possible tropical profile:</text>
  <text x="600" y="308" fill="#ff88ff" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial">exactly 2 entries = 1, rest = 0</text>
  
  <!-- Key insight box -->
  <rect x="420" y="340" width="350" height="80" rx="10" fill="#1a1a2a" stroke="#00ff88" stroke-width="2"/>
  <text x="595" y="365" fill="#00ff88" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial">KEY INSIGHT</text>
  <text x="595" y="385" fill="#88ddaa" font-size="11" text-anchor="middle" font-family="Arial">Tropical profile = fingerprint of prime</text>
  <text x="595" y="400" fill="#88ddaa" font-size="11" text-anchor="middle" font-family="Arial">structure. Unique for each number.</text>
  <text x="595" y="415" fill="#88ddaa" font-size="11" text-anchor="middle" font-family="Arial">Invisible to all other 8 lenses.</text>
  
  <!-- Bottom formula -->
  <text x="200" y="460" fill="#ffcc88" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial">v_p(2+1) + v_p(2+1) = v_p(360)</text>
  <text x="200" y="480" fill="#cc9966" font-size="11" text-anchor="middle" font-family="Arial">Tropical additivity constrains all factorizations</text>
</svg>
