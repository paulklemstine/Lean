<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1a4e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="900" height="550" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Fibonacci-Spectral Duality: Pisano Period Divisibility</text>
  <text x="450" y="62" text-anchor="middle" fill="#aabbcc" font-size="12">The splitting behavior of primes in ℚ(√5) controls the Pisano period π(p)</text>

  <!-- Split case box -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="370" height="200" rx="12" fill="#ffd93d" opacity="0.1" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="185" y="30" text-anchor="middle" fill="#ffd93d" font-size="16" font-weight="bold">Split Primes</text>
    <text x="185" y="50" text-anchor="middle" fill="#ffe066" font-size="12">p ≡ ±1 (mod 5)</text>
    <text x="185" y="75" text-anchor="middle" fill="#ffffff" font-size="11">Legendre symbol (5/p) = +1</text>
    <text x="185" y="95" text-anchor="middle" fill="#ffffff" font-size="11">5 is a quadratic residue mod p</text>
    <text x="185" y="115" text-anchor="middle" fill="#ffffff" font-size="11">p splits in ℚ(√5): (p) = 𝔭₁ · 𝔭₂</text>

    <rect x="30" y="130" width="310" height="50" rx="8" fill="#ffd93d" opacity="0.2"/>
    <text x="185" y="155" text-anchor="middle" fill="#ffd93d" font-size="18" font-weight="bold">π(p) | p − 1</text>
    <text x="185" y="173" text-anchor="middle" fill="#ffe066" font-size="10">✓ Formally verified (pisano_split_case)</text>

    <!-- Examples -->
    <text x="30" y="200" fill="#aabbcc" font-size="9">p=11: π(11)=10 | 10 ✓   p=19: π(19)=18 | 18 ✓   p=29: π(29)=14 | 28 ✓</text>
  </g>

  <!-- Inert case box -->
  <g transform="translate(480, 90)">
    <rect x="0" y="0" width="370" height="200" rx="12" fill="#4ecdc4" opacity="0.1" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="185" y="30" text-anchor="middle" fill="#4ecdc4" font-size="16" font-weight="bold">Inert Primes</text>
    <text x="185" y="50" text-anchor="middle" fill="#66ddd4" font-size="12">p ≡ ±2 (mod 5)</text>
    <text x="185" y="75" text-anchor="middle" fill="#ffffff" font-size="11">Legendre symbol (5/p) = −1</text>
    <text x="185" y="95" text-anchor="middle" fill="#ffffff" font-size="11">5 is a quadratic non-residue mod p</text>
    <text x="185" y="115" text-anchor="middle" fill="#ffffff" font-size="11">p is inert in ℚ(√5): (p) remains prime</text>

    <rect x="30" y="130" width="310" height="50" rx="8" fill="#4ecdc4" opacity="0.2"/>
    <text x="185" y="155" text-anchor="middle" fill="#4ecdc4" font-size="18" font-weight="bold">π(p) | 2(p + 1)</text>
    <text x="185" y="173" text-anchor="middle" fill="#66ddd4" font-size="10">✓ Formally verified (pisano_inert_case)</text>

    <text x="30" y="200" fill="#aabbcc" font-size="9">p=7: π(7)=16 | 16 ✓   p=13: π(13)=7 | 28 ✓   p=17: π(17)=36 | 36 ✓</text>
  </g>

  <!-- Central arrow / connection -->
  <g transform="translate(420, 160)">
    <text x="30" y="0" text-anchor="middle" fill="#ffffff" font-size="30">⟷</text>
    <text x="30" y="20" text-anchor="middle" fill="#8899bb" font-size="9">Determined by</text>
    <text x="30" y="32" text-anchor="middle" fill="#8899bb" font-size="9">(5/p)</text>
  </g>

  <!-- Cassini's identity -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="390" height="90" rx="10" fill="#ff6b6b" opacity="0.1" stroke="#ff6b6b" stroke-width="1"/>
    <text x="195" y="25" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">Cassini's Identity</text>
    <text x="195" y="50" text-anchor="middle" fill="#ffffff" font-size="14">F(n+1)·F(n−1) − F(n)² = (−1)ⁿ</text>
    <text x="195" y="70" text-anchor="middle" fill="#ff8888" font-size="10">det [[F(n+1), F(n)], [F(n), F(n−1)]] = (−1)ⁿ</text>
    <text x="195" y="83" text-anchor="middle" fill="#ff6b6b" font-size="9">✓ Formally verified (cassini)</text>
  </g>

  <!-- GCD identity -->
  <g transform="translate(480, 320)">
    <rect x="0" y="0" width="370" height="90" rx="10" fill="#a55eea" opacity="0.1" stroke="#a55eea" stroke-width="1"/>
    <text x="185" y="25" text-anchor="middle" fill="#a55eea" font-size="14" font-weight="bold">Fibonacci GCD</text>
    <text x="185" y="50" text-anchor="middle" fill="#ffffff" font-size="14">gcd(F(m), F(n)) = F(gcd(m,n))</text>
    <text x="185" y="70" text-anchor="middle" fill="#ffffff" font-size="11">+ Divisibility: m|n ⟹ F(m)|F(n)</text>
    <text x="185" y="83" text-anchor="middle" fill="#a55eea" font-size="9">✓ Formally verified (fib_gcd_identity)</text>
  </g>

  <!-- Bottom: search reduction -->
  <g transform="translate(150, 440)">
    <rect x="0" y="0" width="600" height="80" rx="10" fill="#6bcb77" opacity="0.1" stroke="#6bcb77" stroke-width="1.5"/>
    <text x="300" y="25" text-anchor="middle" fill="#6bcb77" font-size="14" font-weight="bold">Search Space Reduction</text>
    <text x="300" y="50" text-anchor="middle" fill="#ffffff" font-size="13">F(k+2) &lt; 2^k for k ≥ 2   ⟹   Zeckendorf search space ≈ φ^k vs 2^k</text>
    <text x="300" y="70" text-anchor="middle" fill="#88dd99" font-size="10">✓ fibonacci_search_reduction + fib_at_least_linear verified in Lean 4</text>
  </g>
</svg>
