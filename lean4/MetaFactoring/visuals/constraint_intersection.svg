<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2848;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg5)"/>

  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Constraint Intersection: Multi-Lens Advantage</text>
  <text x="400" y="55" text-anchor="middle" fill="#8899bb" font-size="12">Each lens halves the search space → k lenses reduce by factor 2^k</text>

  <!-- Bar chart showing reduction -->
  <g transform="translate(80, 80)">
    <!-- Axes -->
    <line x1="40" y1="0" x2="40" y2="340" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="340" x2="680" y2="340" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <text x="20" y="175" text-anchor="middle" fill="#ffffff" font-size="11" transform="rotate(-90, 20, 175)">Search Space (log scale)</text>
    <text x="360" y="370" text-anchor="middle" fill="#ffffff" font-size="11">Number of Lenses (k)</text>

    <!-- Bars (heights proportional to log of search space) -->
    <!-- k=0: S (full height = 320) -->
    <rect x="80" y="10" width="60" height="330" rx="4" fill="#ff6b6b" opacity="0.8"/>
    <text x="110" y="355" text-anchor="middle" fill="#ffffff" font-size="10">k=0</text>
    <text x="110" y="5" text-anchor="middle" fill="#ff6b6b" font-size="9">S</text>

    <!-- k=1: S/2 (height = 280) -->
    <rect x="160" y="50" width="60" height="290" rx="4" fill="#ffd93d" opacity="0.8"/>
    <text x="190" y="355" text-anchor="middle" fill="#ffffff" font-size="10">k=1</text>
    <text x="190" y="45" text-anchor="middle" fill="#ffd93d" font-size="9">S/2</text>

    <!-- k=2: S/4 (height = 240) -->
    <rect x="240" y="100" width="60" height="240" rx="4" fill="#6bcb77" opacity="0.8"/>
    <text x="270" y="355" text-anchor="middle" fill="#ffffff" font-size="10">k=2</text>
    <text x="270" y="95" text-anchor="middle" fill="#6bcb77" font-size="9">S/4</text>

    <!-- k=3: S/8 (height = 200) -->
    <rect x="320" y="140" width="60" height="200" rx="4" fill="#4ecdc4" opacity="0.8"/>
    <text x="350" y="355" text-anchor="middle" fill="#ffffff" font-size="10">k=3</text>
    <text x="350" y="135" text-anchor="middle" fill="#4ecdc4" font-size="9">S/8</text>

    <!-- k=4: S/16 (height = 160) -->
    <rect x="400" y="180" width="60" height="160" rx="4" fill="#a55eea" opacity="0.8"/>
    <text x="430" y="355" text-anchor="middle" fill="#ffffff" font-size="10">k=4</text>
    <text x="430" y="175" text-anchor="middle" fill="#a55eea" font-size="9">S/16</text>

    <!-- k=5: S/32 (height = 120) -->
    <rect x="480" y="220" width="60" height="120" rx="4" fill="#ff9ff3" opacity="0.8"/>
    <text x="510" y="355" text-anchor="middle" fill="#ffffff" font-size="10">k=5</text>
    <text x="510" y="215" text-anchor="middle" fill="#ff9ff3" font-size="9">S/32</text>

    <!-- k=6: S/64 (height = 80) -->
    <rect x="560" y="260" width="60" height="80" rx="4" fill="#54a0ff" opacity="0.8"/>
    <text x="590" y="355" text-anchor="middle" fill="#ffffff" font-size="10">k=6</text>
    <text x="590" y="255" text-anchor="middle" fill="#54a0ff" font-size="9">S/64</text>

    <!-- k=7: S/128 (height = 40) -->
    <rect x="640" y="300" width="60" height="40" rx="4" fill="#27ae60" opacity="0.9"/>
    <text x="670" y="355" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">k=7</text>
    <text x="670" y="295" text-anchor="middle" fill="#27ae60" font-size="9" font-weight="bold">S/128</text>
  </g>

  <!-- Theorem boxes -->
  <g transform="translate(50, 440)">
    <rect x="0" y="0" width="320" height="40" rx="6" fill="#27ae60" opacity="0.2" stroke="#27ae60" stroke-width="1"/>
    <text x="160" y="17" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="bold">✓ multi_lens_advantage</text>
    <text x="160" y="33" text-anchor="middle" fill="#ffffff" font-size="9">S / 2^k &lt; S for S > 0, k ≥ 1</text>
  </g>

  <g transform="translate(420, 440)">
    <rect x="0" y="0" width="330" height="40" rx="6" fill="#27ae60" opacity="0.2" stroke="#27ae60" stroke-width="1"/>
    <text x="165" y="17" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="bold">✓ advantage_unbounded</text>
    <text x="165" y="33" text-anchor="middle" fill="#ffffff" font-size="9">∀ ε > 0, ∃ k: S / 2^k &lt; ε</text>
  </g>
</svg>
