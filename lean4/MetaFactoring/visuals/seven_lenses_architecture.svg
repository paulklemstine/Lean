<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="centerGrad" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#0a0a2e" rx="20"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-size="28"
        font-family="Georgia, serif" font-weight="bold">MetaFactoring</text>
  <text x="400" y="72" text-anchor="middle" fill="#aaaacc" font-size="14"
        font-family="Arial, sans-serif">Seven-Lens Unified Framework</text>

  <!-- Connection lines (spokes) -->
  <line x1="400" y1="400" x2="400" y2="120" stroke="#E74C3C" stroke-width="3" opacity="0.6"/>
  <line x1="400" y1="400" x2="619" y2="225" stroke="#E67E22" stroke-width="3" opacity="0.6"/>
  <line x1="400" y1="400" x2="673" y2="462" stroke="#F1C40F" stroke-width="3" opacity="0.6"/>
  <line x1="400" y1="400" x2="521" y2="652" stroke="#2ECC71" stroke-width="3" opacity="0.6"/>
  <line x1="400" y1="400" x2="279" y2="652" stroke="#3498DB" stroke-width="3" opacity="0.6"/>
  <line x1="400" y1="400" x2="127" y2="462" stroke="#9B59B6" stroke-width="3" opacity="0.6"/>
  <line x1="400" y1="400" x2="181" y2="225" stroke="#1ABC9C" stroke-width="3" opacity="0.6"/>
  <line x1="400" y1="120" x2="619" y2="225" stroke="#333355" stroke-width="1" opacity="0.5" stroke-dasharray="4,4"/>
  <line x1="619" y1="225" x2="673" y2="462" stroke="#333355" stroke-width="1" opacity="0.5" stroke-dasharray="4,4"/>
  <line x1="673" y1="462" x2="521" y2="652" stroke="#333355" stroke-width="1" opacity="0.5" stroke-dasharray="4,4"/>
  <line x1="521" y1="652" x2="279" y2="652" stroke="#333355" stroke-width="1" opacity="0.5" stroke-dasharray="4,4"/>
  <line x1="279" y1="652" x2="127" y2="462" stroke="#333355" stroke-width="1" opacity="0.5" stroke-dasharray="4,4"/>
  <line x1="127" y1="462" x2="181" y2="225" stroke="#333355" stroke-width="1" opacity="0.5" stroke-dasharray="4,4"/>
  <line x1="181" y1="225" x2="400" y2="120" stroke="#333355" stroke-width="1" opacity="0.5" stroke-dasharray="4,4"/>

  <circle cx="400" cy="120" r="65" fill="#E74C3C" opacity="0.85"
          filter="url(#shadow)"/>
  <text x="400" y="108" text-anchor="middle" fill="white"
        font-size="11" font-family="Arial, sans-serif" font-weight="bold">
    <tspan x="400" dy="0">Fibonacci</tspan>
    <tspan x="400" dy="14">Zeckendorf</tspan>
  </text>
  <text x="400" y="148" text-anchor="middle" fill="white"
        font-size="18" font-family="Georgia, serif" opacity="0.7">φ</text>

  <circle cx="619" cy="225" r="65" fill="#E67E22" opacity="0.85"
          filter="url(#shadow)"/>
  <text x="619" y="213" text-anchor="middle" fill="white"
        font-size="11" font-family="Arial, sans-serif" font-weight="bold">
    <tspan x="619" dy="0">Hyperbolic</tspan>
    <tspan x="619" dy="14">Geometry</tspan>
  </text>
  <text x="619" y="253" text-anchor="middle" fill="white"
        font-size="18" font-family="Georgia, serif" opacity="0.7">xy=N</text>

  <circle cx="673" cy="462" r="65" fill="#F1C40F" opacity="0.85"
          filter="url(#shadow)"/>
  <text x="673" y="450" text-anchor="middle" fill="white"
        font-size="11" font-family="Arial, sans-serif" font-weight="bold">
    <tspan x="673" dy="0">Orbit</tspan>
    <tspan x="673" dy="14">Dynamics</tspan>
  </text>
  <text x="673" y="490" text-anchor="middle" fill="white"
        font-size="18" font-family="Georgia, serif" opacity="0.7">ρ</text>

  <circle cx="521" cy="652" r="65" fill="#2ECC71" opacity="0.85"
          filter="url(#shadow)"/>
  <text x="521" y="640" text-anchor="middle" fill="white"
        font-size="11" font-family="Arial, sans-serif" font-weight="bold">
    <tspan x="521" dy="0">Spectral</tspan>
    <tspan x="521" dy="14">Harmonic</tspan>
  </text>
  <text x="521" y="680" text-anchor="middle" fill="white"
        font-size="18" font-family="Georgia, serif" opacity="0.7">χ</text>

  <circle cx="279" cy="652" r="65" fill="#3498DB" opacity="0.85"
          filter="url(#shadow)"/>
  <text x="279" y="640" text-anchor="middle" fill="white"
        font-size="11" font-family="Arial, sans-serif" font-weight="bold">
    <tspan x="279" dy="0">Division</tspan>
    <tspan x="279" dy="14">Algebra</tspan>
  </text>
  <text x="279" y="680" text-anchor="middle" fill="white"
        font-size="18" font-family="Georgia, serif" opacity="0.7">‖·‖</text>

  <circle cx="127" cy="462" r="65" fill="#9B59B6" opacity="0.85"
          filter="url(#shadow)"/>
  <text x="127" y="450" text-anchor="middle" fill="white"
        font-size="11" font-family="Arial, sans-serif" font-weight="bold">
    <tspan x="127" dy="0">Lattice</tspan>
    <tspan x="127" dy="14">Reduction</tspan>
  </text>
  <text x="127" y="490" text-anchor="middle" fill="white"
        font-size="18" font-family="Georgia, serif" opacity="0.7">LLL</text>

  <circle cx="181" cy="225" r="65" fill="#1ABC9C" opacity="0.85"
          filter="url(#shadow)"/>
  <text x="181" y="213" text-anchor="middle" fill="white"
        font-size="11" font-family="Arial, sans-serif" font-weight="bold">
    <tspan x="181" dy="0">Congruence</tspan>
    <tspan x="181" dy="14">of Squares</tspan>
  </text>
  <text x="181" y="253" text-anchor="middle" fill="white"
        font-size="18" font-family="Georgia, serif" opacity="0.7">x²≡y²</text>

  <circle cx="400" cy="400" r="90" fill="url(#centerGrad)"
          filter="url(#glow)"/>
  <text x="400" y="385" text-anchor="middle" fill="white" font-size="22"
        font-family="Georgia, serif" font-weight="bold">Meta</text>
  <text x="400" y="410" text-anchor="middle" fill="white" font-size="22"
        font-family="Georgia, serif" font-weight="bold">Factoring</text>
  <text x="400" y="435" text-anchor="middle" fill="#ccccee" font-size="12"
        font-family="Arial, sans-serif">N = p × q</text>

  <!-- Bottom caption -->
  <text x="400" y="775" text-anchor="middle" fill="#888899" font-size="12"
        font-family="Arial, sans-serif">
    Each lens provides independent constraints — their intersection reveals factors
  </text>
</svg>