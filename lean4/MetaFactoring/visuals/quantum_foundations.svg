<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2848;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg6)"/>

  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Quantum MetaFactoring: Mathematical Foundations</text>
  <text x="400" y="55" text-anchor="middle" fill="#8899bb" font-size="12">From birthday bounds to congruence of squares — the path to factors</text>

  <!-- Birthday Bound -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="350" height="170" rx="12" fill="#4ecdc4" opacity="0.1" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="175" y="28" text-anchor="middle" fill="#4ecdc4" font-size="15" font-weight="bold">Birthday Paradox</text>
    <text x="175" y="50" text-anchor="middle" fill="#ffffff" font-size="11">Among n+1 items mapped to n slots:</text>
    <text x="175" y="70" text-anchor="middle" fill="#ffffff" font-size="11">∃ distinct i, j with f(i) = f(j)</text>

    <text x="175" y="100" text-anchor="middle" fill="#66ddd4" font-size="12" font-weight="bold">Practical: √n random samples</text>
    <text x="175" y="118" text-anchor="middle" fill="#66ddd4" font-size="12" font-weight="bold">→ ~63% collision probability</text>

    <text x="175" y="145" text-anchor="middle" fill="#ffffff" font-size="10">Basis for Pollard-rho (classical)</text>
    <text x="175" y="160" text-anchor="middle" fill="#ffffff" font-size="10">and quantum collision-finding</text>
    <text x="310" y="24" text-anchor="end" fill="#4ecdc4" font-size="9">✓ birthday_bound</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(380, 155)">
    <text x="20" y="10" fill="#ffffff" font-size="24">→</text>
  </g>

  <!-- Orbit Collision -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="350" height="170" rx="12" fill="#6bcb77" opacity="0.1" stroke="#6bcb77" stroke-width="1.5"/>
    <text x="175" y="28" text-anchor="middle" fill="#6bcb77" font-size="15" font-weight="bold">Orbit Collision</text>
    <text x="175" y="50" text-anchor="middle" fill="#ffffff" font-size="11">Squaring orbit: x, x², x⁴, x⁸, ...</text>
    <text x="175" y="70" text-anchor="middle" fill="#ffffff" font-size="11">If x_i ≡ x_j (mod p) but ≢ (mod N):</text>

    <rect x="30" y="85" width="290" height="35" rx="6" fill="#6bcb77" opacity="0.2"/>
    <text x="175" y="108" text-anchor="middle" fill="#6bcb77" font-size="14" font-weight="bold">gcd(x_i − x_j, N) is a factor!</text>

    <text x="175" y="140" text-anchor="middle" fill="#ffffff" font-size="10">Expected after ~√p iterations</text>
    <text x="175" y="155" text-anchor="middle" fill="#ffffff" font-size="10">(O(N^{1/4}) for N = p·q balanced)</text>
  </g>

  <!-- Congruence of Squares -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="600" height="120" rx="12" fill="#a55eea" opacity="0.1" stroke="#a55eea" stroke-width="2"/>
    <text x="300" y="28" text-anchor="middle" fill="#a55eea" font-size="16" font-weight="bold">Congruence of Squares — The Universal Endgame</text>

    <text x="300" y="55" text-anchor="middle" fill="#ffffff" font-size="13">Given: N | (x² − y²)  and  N ∤ (x−y)  and  N ∤ (x+y)</text>

    <rect x="100" y="65" width="400" height="30" rx="6" fill="#a55eea" opacity="0.2"/>
    <text x="300" y="85" text-anchor="middle" fill="#a55eea" font-size="14" font-weight="bold">Then: 1 &lt; gcd(x−y, N) &lt; N</text>

    <text x="300" y="110" text-anchor="middle" fill="#bb77ff" font-size="10">✓ congruence_of_squares: Formally verified in Lean 4</text>
  </g>

  <!-- Shor's Algorithm connection -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="600" height="60" rx="10" fill="#54a0ff" opacity="0.1" stroke="#54a0ff" stroke-width="1"/>
    <text x="300" y="20" text-anchor="middle" fill="#54a0ff" font-size="13" font-weight="bold">Shor's Algorithm = Quantum Period-Finding + Congruence of Squares</text>
    <text x="300" y="40" text-anchor="middle" fill="#ffffff" font-size="10">Find r: a^r ≡ 1 (mod N) → x = a^{r/2}, y = 1 → gcd(a^{r/2}−1, N) gives factor</text>
    <text x="300" y="55" text-anchor="middle" fill="#77bbff" font-size="9">Quantum Fourier Transform extracts period r in polynomial time</text>
  </g>
</svg>
