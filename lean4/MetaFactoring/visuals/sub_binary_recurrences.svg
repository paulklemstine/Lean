<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">Sub-Binary Recurrence Bound: a(n) &lt; 2ⁿ</text>
  <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-size="13">Conjecture 1 — Verified for Fibonacci, Lucas, and Tribonacci</text>

  <!-- Chart area -->
  <g transform="translate(80, 75)">
    <!-- Axes -->
    <line x1="0" y1="370" x2="750" y2="370" stroke="#30363d" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="370" stroke="#30363d" stroke-width="1"/>

    <!-- Y-axis labels (log scale) -->
    <text x="-10" y="370" text-anchor="end" fill="#8b949e" font-size="10">1</text>
    <text x="-10" y="296" text-anchor="end" fill="#8b949e" font-size="10">10</text>
    <text x="-10" y="222" text-anchor="end" fill="#8b949e" font-size="10">100</text>
    <text x="-10" y="148" text-anchor="end" fill="#8b949e" font-size="10">1K</text>
    <text x="-10" y="74" text-anchor="end" fill="#8b949e" font-size="10">10K</text>
    <text x="-10" y="0" text-anchor="end" fill="#8b949e" font-size="10">100K</text>

    <!-- Grid lines -->
    <line x1="0" y1="296" x2="750" y2="296" stroke="#21262d" stroke-width="0.5"/>
    <line x1="0" y1="222" x2="750" y2="222" stroke="#21262d" stroke-width="0.5"/>
    <line x1="0" y1="148" x2="750" y2="148" stroke="#21262d" stroke-width="0.5"/>
    <line x1="0" y1="74" x2="750" y2="74" stroke="#21262d" stroke-width="0.5"/>

    <!-- X-axis labels -->
    <text x="0" y="385" text-anchor="middle" fill="#8b949e" font-size="10">0</text>
    <text x="150" y="385" text-anchor="middle" fill="#8b949e" font-size="10">5</text>
    <text x="300" y="385" text-anchor="middle" fill="#8b949e" font-size="10">10</text>
    <text x="450" y="385" text-anchor="middle" fill="#8b949e" font-size="10">15</text>
    <text x="600" y="385" text-anchor="middle" fill="#8b949e" font-size="10">20</text>
    <text x="750" y="385" text-anchor="middle" fill="#8b949e" font-size="10">25</text>

    <text x="375" y="405" text-anchor="middle" fill="#8b949e" font-size="12">n</text>
    <text x="-50" y="185" text-anchor="middle" fill="#8b949e" font-size="12" transform="rotate(-90, -50, 185)">Value (log scale)</text>

    <!-- 2^n curve (upper bound) - bright red -->
    <polyline points="
      30,356 60,341 90,326 120,312 150,297 180,282 210,267 240,253 270,238
      300,223 330,208 360,193 390,179 420,164 450,149 480,134 510,119
      540,105 570,90 600,75 630,60 660,46 690,31 720,16
    " fill="none" stroke="#f85149" stroke-width="2.5" stroke-dasharray="8,4"/>

    <!-- Fibonacci curve - gold -->
    <polyline points="
      30,370 60,370 90,356 120,341 150,326 180,308 210,292 240,274
      270,257 300,241 330,223 360,206 390,189 420,172 450,155
      480,138 510,121 540,104 570,87 600,70 630,53 660,35 690,18 720,2
    " fill="none" stroke="#FFD700" stroke-width="2"/>

    <!-- Lucas curve - cyan -->
    <polyline points="
      30,348 60,370 90,341 120,326 150,308 180,290 210,271 240,254
      270,237 300,219 330,201 360,184 390,167 420,150 450,132
      480,115 510,98 540,80 570,63 600,46 630,29 660,12
    " fill="none" stroke="#39d353" stroke-width="2"/>

    <!-- Tribonacci curve - purple -->
    <polyline points="
      30,370 60,370 90,370 120,356 150,341 180,322 210,303 240,283
      270,264 300,245 330,226 360,207 390,188 420,169 450,150
      480,131 510,112 540,93 570,74 600,55 630,36 660,17
    " fill="none" stroke="#bc8cff" stroke-width="2"/>

    <!-- Legend -->
    <rect x="520" y="310" width="220" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <line x1="530" y1="325" x2="560" y2="325" stroke="#f85149" stroke-width="2.5" stroke-dasharray="8,4"/>
    <text x="570" y="329" fill="#f85149" font-size="11">2ⁿ (upper bound)</text>
    <line x1="530" y1="340" x2="560" y2="340" stroke="#FFD700" stroke-width="2"/>
    <text x="570" y="344" fill="#FFD700" font-size="11">Fibonacci (λ≈1.618)</text>
    <line x1="530" y1="355" x2="560" y2="355" stroke="#bc8cff" stroke-width="2"/>
    <text x="570" y="359" fill="#bc8cff" font-size="11">Tribonacci (λ≈1.839)</text>
  </g>

  <!-- Reduction factors box -->
  <rect x="120" y="440" width="660" height="45" rx="8" fill="#1c2333" stroke="#30363d"/>
  <text x="450" y="460" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Search Space Reduction Factors</text>
  <text x="250" y="478" text-anchor="middle" fill="#FFD700" font-size="12">Fibonacci: 2/φ ≈ 1.236×</text>
  <text x="450" y="478" text-anchor="middle" fill="#bc8cff" font-size="12">Tribonacci: 2/1.839 ≈ 1.088×</text>
  <text x="650" y="478" text-anchor="middle" fill="#39d353" font-size="12">Lucas: 2/φ ≈ 1.236×</text>
</svg>
