<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a35;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="900" height="450" fill="url(#bg4)" rx="12"/>

  <text x="450" y="35" text-anchor="middle" fill="#39d353" font-size="20" font-weight="bold">Smooth Number Filtration</text>
  <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-size="13">Discovery 1: B-smooth numbers form a filtered multiplicative submonoid of ℕ</text>

  <!-- Nested circles representing filtration -->
  <g transform="translate(250, 250)">
    <!-- 50-smooth (outermost) -->
    <ellipse cx="200" cy="0" rx="380" ry="155" fill="none" stroke="#39d353" stroke-width="2" opacity="0.3"/>
    <ellipse cx="200" cy="0" rx="380" ry="155" fill="#39d353" opacity="0.05"/>
    <text x="530" y="-130" fill="#39d353" font-size="14" font-weight="bold">50-smooth</text>
    <text x="530" y="-115" fill="#39d353" font-size="11">Ψ(10000,50) = 2463</text>
    <text x="530" y="-100" fill="#8b949e" font-size="10">24.6% density</text>

    <!-- 20-smooth -->
    <ellipse cx="170" cy="0" rx="290" ry="120" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.4"/>
    <ellipse cx="170" cy="0" rx="290" ry="120" fill="#58a6ff" opacity="0.05"/>
    <text x="410" y="-90" fill="#58a6ff" font-size="14" font-weight="bold">20-smooth</text>
    <text x="410" y="-75" fill="#58a6ff" font-size="11">Ψ(10000,20) = 1169</text>
    <text x="410" y="-60" fill="#8b949e" font-size="10">11.7% density</text>

    <!-- 10-smooth -->
    <ellipse cx="140" cy="0" rx="200" ry="85" fill="none" stroke="#bc8cff" stroke-width="2" opacity="0.5"/>
    <ellipse cx="140" cy="0" rx="200" ry="85" fill="#bc8cff" opacity="0.05"/>
    <text x="290" y="-55" fill="#bc8cff" font-size="14" font-weight="bold">10-smooth</text>
    <text x="290" y="-40" fill="#bc8cff" font-size="11">Ψ(10000,10) = 338</text>
    <text x="290" y="-25" fill="#8b949e" font-size="10">3.4% density</text>

    <!-- 5-smooth (innermost) -->
    <ellipse cx="100" cy="0" rx="110" ry="50" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.7"/>
    <ellipse cx="100" cy="0" rx="110" ry="50" fill="#FFD700" opacity="0.08"/>
    <text x="100" y="-10" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">5-smooth</text>
    <text x="100" y="8" text-anchor="middle" fill="#FFD700" font-size="11">Ψ(10000,5) = 175</text>
    <text x="100" y="23" text-anchor="middle" fill="#8b949e" font-size="10">1.75% density</text>

    <!-- Sample numbers -->
    <text x="50" y="40" fill="#FFD700" font-size="9" opacity="0.7">1,2,3,4,5,6,8,9,10,12...</text>
  </g>

  <!-- Properties box -->
  <rect x="50" y="380" width="800" height="55" rx="8" fill="#161b2e" stroke="#30363d"/>
  <text x="130" y="400" fill="#FFD700" font-size="12" font-weight="bold">✓ Closure</text>
  <text x="130" y="415" fill="#8b949e" font-size="10">a,b ∈ Sₘ → ab ∈ Sₘ</text>
  <text x="300" y="400" fill="#58a6ff" font-size="12" font-weight="bold">✓ Filtration</text>
  <text x="300" y="415" fill="#8b949e" font-size="10">B ≤ B' → Sᵦ ⊆ Sᵦ'</text>
  <text x="480" y="400" fill="#39d353" font-size="12" font-weight="bold">✓ Divisor Closed</text>
  <text x="480" y="415" fill="#8b949e" font-size="10">d|n, n ∈ Sᵦ → d ∈ Sᵦ</text>
  <text x="680" y="400" fill="#bc8cff" font-size="12" font-weight="bold">✓ GCD Stable</text>
  <text x="680" y="415" fill="#8b949e" font-size="10">gcd(a,b) ∈ Sᵦ</text>
</svg>
