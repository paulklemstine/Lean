<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="700" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="450" y="45" fill="#e0e0ff" font-size="24" font-weight="bold" text-anchor="middle" font-family="Arial">MetaFactoring Phase II: Nine Lenses Architecture</text>
  <text x="450" y="70" fill="#8888bb" font-size="14" text-anchor="middle" font-family="Arial">512× Search Space Reduction Through Complementary Mathematical Perspectives</text>
  
  <!-- Central N -->
  <circle cx="450" cy="370" r="55" fill="#2a1a4a" stroke="#9966ff" stroke-width="3" filter="url(#glow)"/>
  <text x="450" y="365" fill="#ffffff" font-size="28" font-weight="bold" text-anchor="middle" font-family="Arial">N = pq</text>
  <text x="450" y="390" fill="#bbaadd" font-size="12" text-anchor="middle" font-family="Arial">Factor Target</text>
  
  <!-- 9 Lenses arranged in a circle -->
  <!-- Lens positions (r=200 from center) -->
  
  <!-- Lens 1: Fibonacci-Zeckendorf (top) -->
  <g transform="translate(450,160)">
    <rect x="-75" y="-30" width="150" height="60" rx="10" fill="#1a3a1a" stroke="#44cc44" stroke-width="2"/>
    <text x="0" y="-8" fill="#88ff88" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">1. Fibonacci</text>
    <text x="0" y="10" fill="#66cc66" font-size="10" text-anchor="middle" font-family="Arial">Zeckendorf</text>
    <text x="0" y="24" fill="#44aa44" font-size="9" text-anchor="middle" font-family="Arial">fib(k+2) &lt; 2^k</text>
  </g>
  
  <!-- Lens 2: Hyperbolic (top-right) -->
  <g transform="translate(640,210)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#3a2a1a" stroke="#cc8844" stroke-width="2"/>
    <text x="0" y="-8" fill="#ffbb66" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">2. Hyperbolic</text>
    <text x="0" y="10" fill="#cc9944" font-size="10" text-anchor="middle" font-family="Arial">Geometric</text>
    <text x="0" y="24" fill="#aa7733" font-size="9" text-anchor="middle" font-family="Arial">xy = N curve</text>
  </g>
  
  <!-- Lens 3: Orbit (right) -->
  <g transform="translate(680,370)">
    <rect x="-65" y="-30" width="130" height="60" rx="10" fill="#3a1a1a" stroke="#cc4444" stroke-width="2"/>
    <text x="0" y="-8" fill="#ff6666" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">3. Orbit</text>
    <text x="0" y="10" fill="#cc4444" font-size="10" text-anchor="middle" font-family="Arial">Dynamical</text>
    <text x="0" y="24" fill="#aa3333" font-size="9" text-anchor="middle" font-family="Arial">Pollard ρ</text>
  </g>
  
  <!-- Lens 4: Spectral (bottom-right) -->
  <g transform="translate(640,520)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#1a1a3a" stroke="#4466cc" stroke-width="2"/>
    <text x="0" y="-8" fill="#6688ff" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">4. Spectral</text>
    <text x="0" y="10" fill="#4466cc" font-size="10" text-anchor="middle" font-family="Arial">Harmonic</text>
    <text x="0" y="24" fill="#3355aa" font-size="9" text-anchor="middle" font-family="Arial">a^(p-1) ≡ 1</text>
  </g>
  
  <!-- Lens 5: Division Algebra (bottom) -->
  <g transform="translate(450,580)">
    <rect x="-75" y="-30" width="150" height="60" rx="10" fill="#2a1a3a" stroke="#aa44cc" stroke-width="2"/>
    <text x="0" y="-8" fill="#cc66ff" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">5. Division</text>
    <text x="0" y="10" fill="#aa44cc" font-size="10" text-anchor="middle" font-family="Arial">Algebra ℂ,ℍ,𝕆</text>
    <text x="0" y="24" fill="#8833aa" font-size="9" text-anchor="middle" font-family="Arial">Norm channels</text>
  </g>
  
  <!-- Lens 6: Lattice (bottom-left) -->
  <g transform="translate(260,520)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#1a3a3a" stroke="#44cccc" stroke-width="2"/>
    <text x="0" y="-8" fill="#66ffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">6. Lattice</text>
    <text x="0" y="10" fill="#44cccc" font-size="10" text-anchor="middle" font-family="Arial">Reduction</text>
    <text x="0" y="24" fill="#33aaaa" font-size="9" text-anchor="middle" font-family="Arial">Short vectors</text>
  </g>
  
  <!-- Lens 7: Congruence (left) -->
  <g transform="translate(220,370)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#3a3a1a" stroke="#cccc44" stroke-width="2"/>
    <text x="0" y="-8" fill="#ffff66" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">7. Congruence</text>
    <text x="0" y="10" fill="#cccc44" font-size="10" text-anchor="middle" font-family="Arial">of Squares</text>
    <text x="0" y="24" fill="#aaaa33" font-size="9" text-anchor="middle" font-family="Arial">x²≡y² mod N</text>
  </g>
  
  <!-- Lens 8: Tropical (NEW - top-left) -->
  <g transform="translate(260,210)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#0a2a1a" stroke="#00ff88" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-8" fill="#00ff88" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">8. Tropical ★</text>
    <text x="0" y="10" fill="#00cc66" font-size="10" text-anchor="middle" font-family="Arial">p-adic vals</text>
    <text x="0" y="24" fill="#00aa55" font-size="9" text-anchor="middle" font-family="Arial">v_p(ab)=v_p(a)+v_p(b)</text>
  </g>
  
  <!-- Lens 9: Elliptic Curve (NEW - between 1 and 2) -->
  <g transform="translate(560,130)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#2a0a2a" stroke="#ff44ff" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-8" fill="#ff66ff" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">9. Elliptic ★</text>
    <text x="0" y="10" fill="#cc44cc" font-size="10" text-anchor="middle" font-family="Arial">Curve (ECM)</text>
    <text x="0" y="24" fill="#aa33aa" font-size="9" text-anchor="middle" font-family="Arial">Hasse bound</text>
  </g>
  
  <!-- Connection lines to center -->
  <line x1="450" y1="190" x2="450" y2="315" stroke="#44cc44" stroke-width="1.5" opacity="0.5"/>
  <line x1="600" y1="230" x2="490" y2="340" stroke="#cc8844" stroke-width="1.5" opacity="0.5"/>
  <line x1="640" y1="370" x2="505" y2="370" stroke="#cc4444" stroke-width="1.5" opacity="0.5"/>
  <line x1="600" y1="510" x2="490" y2="400" stroke="#4466cc" stroke-width="1.5" opacity="0.5"/>
  <line x1="450" y1="550" x2="450" y2="425" stroke="#aa44cc" stroke-width="1.5" opacity="0.5"/>
  <line x1="300" y1="510" x2="410" y2="400" stroke="#44cccc" stroke-width="1.5" opacity="0.5"/>
  <line x1="290" y1="370" x2="395" y2="370" stroke="#cccc44" stroke-width="1.5" opacity="0.5"/>
  <line x1="300" y1="230" x2="410" y2="340" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
  <line x1="530" y1="160" x2="480" y2="325" stroke="#ff44ff" stroke-width="2" opacity="0.7"/>
  
  <!-- Bottom stats -->
  <rect x="200" y="640" width="500" height="45" rx="8" fill="#1a1a2a" stroke="#6644aa" stroke-width="1.5"/>
  <text x="450" y="660" fill="#ccbbff" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial">9 Independent Lenses → 2⁹ = 512× Search Space Reduction</text>
  <text x="450" y="676" fill="#9988cc" font-size="11" text-anchor="middle" font-family="Arial">★ = New in Phase II | All 50+ theorems formally verified in Lean 4</text>
</svg>
