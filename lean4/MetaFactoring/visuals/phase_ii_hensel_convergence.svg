<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0f0f1a"/>
  
  <text x="400" y="30" fill="#e0e0ff" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial">Hensel Lifting: Exponential Convergence</text>
  <text x="400" y="50" fill="#8888bb" font-size="12" text-anchor="middle" font-family="Arial">Each step doubles precision: mod p → mod p² → mod p⁴ → mod p⁸ → ...</text>
  
  <!-- Precision bars -->
  <g transform="translate(80,80)">
    <!-- Step 0: mod p -->
    <rect x="0" y="0" width="20" height="250" rx="4" fill="#2244aa" opacity="0.9"/>
    <text x="10" y="270" fill="#aaaacc" font-size="11" text-anchor="middle" font-family="Arial">Step 0</text>
    <text x="10" y="285" fill="#6688ff" font-size="10" text-anchor="middle" font-family="Arial">mod p</text>
    <text x="10" y="-8" fill="#6688ff" font-size="11" text-anchor="middle" font-family="Arial">1 digit</text>
    
    <!-- Step 1: mod p² -->
    <rect x="90" y="0" width="40" height="250" rx="4" fill="#3355bb" opacity="0.9"/>
    <text x="110" y="270" fill="#aaaacc" font-size="11" text-anchor="middle" font-family="Arial">Step 1</text>
    <text x="110" y="285" fill="#7799ff" font-size="10" text-anchor="middle" font-family="Arial">mod p²</text>
    <text x="110" y="-8" fill="#7799ff" font-size="11" text-anchor="middle" font-family="Arial">2 digits</text>
    
    <!-- Step 2: mod p⁴ -->
    <rect x="190" y="0" width="80" height="250" rx="4" fill="#4466cc" opacity="0.9"/>
    <text x="230" y="270" fill="#aaaacc" font-size="11" text-anchor="middle" font-family="Arial">Step 2</text>
    <text x="230" y="285" fill="#88aaff" font-size="10" text-anchor="middle" font-family="Arial">mod p⁴</text>
    <text x="230" y="-8" fill="#88aaff" font-size="11" text-anchor="middle" font-family="Arial">4 digits</text>
    
    <!-- Step 3: mod p⁸ -->
    <rect x="320" y="0" width="140" height="250" rx="4" fill="#5577dd" opacity="0.9"/>
    <text x="390" y="270" fill="#aaaacc" font-size="11" text-anchor="middle" font-family="Arial">Step 3</text>
    <text x="390" y="285" fill="#99bbff" font-size="10" text-anchor="middle" font-family="Arial">mod p⁸</text>
    <text x="390" y="-8" fill="#99bbff" font-size="11" text-anchor="middle" font-family="Arial">8 digits</text>
    
    <!-- Step 4: mod p¹⁶ -->
    <rect x="510" y="0" width="140" height="250" rx="4" fill="#6688ee" opacity="0.9">
      <animate attributeName="opacity" values="0.7;0.9;0.7" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="580" y="270" fill="#aaaacc" font-size="11" text-anchor="middle" font-family="Arial">Step 4</text>
    <text x="580" y="285" fill="#aaccff" font-size="10" text-anchor="middle" font-family="Arial">mod p¹⁶</text>
    <text x="580" y="-8" fill="#aaccff" font-size="11" text-anchor="middle" font-family="Arial">16 digits</text>
    
    <!-- Arrows showing doubling -->
    <text x="55" y="125" fill="#ffaa44" font-size="16" text-anchor="middle" font-family="Arial">×2</text>
    <text x="155" y="125" fill="#ffaa44" font-size="16" text-anchor="middle" font-family="Arial">×2</text>
    <text x="275" y="125" fill="#ffaa44" font-size="16" text-anchor="middle" font-family="Arial">×2</text>
    <text x="470" y="125" fill="#ffaa44" font-size="16" text-anchor="middle" font-family="Arial">×2</text>
  </g>
  
  <!-- Formula -->
  <text x="400" y="375" fill="#ffcc88" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial">Precision after j steps: p^(2^j) — exponential in the number of steps</text>
</svg>
