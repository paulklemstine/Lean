<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="800" height="500" fill="#0a0a1a" rx="10"/>

  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">
    Division Algebra Norm Channel Hierarchy
  </text>
  <text x="400" y="58" text-anchor="middle" fill="#888" font-size="12">
    Hurwitz (1898): Composition algebras exist only in dimensions 1, 2, 4, 8
  </text>

  <!-- Dim 1: Reals -->
  <rect x="50" y="90" width="160" height="100" rx="10" fill="none" stroke="#666" stroke-width="2"/>
  <text x="130" y="115" text-anchor="middle" fill="#888" font-size="14" font-weight="bold">Dim 1: ℝ</text>
  <text x="130" y="140" text-anchor="middle" fill="#aaa" font-size="11">|a| · |b| = |ab|</text>
  <text x="130" y="160" text-anchor="middle" fill="#666" font-size="10">Trivial channel</text>
  <text x="130" y="178" text-anchor="middle" fill="#55EFC4" font-size="10">✓ Verified</text>

  <!-- Dim 2: Complex -->
  <rect x="240" y="90" width="160" height="100" rx="10" fill="none" stroke="#48DBFB" stroke-width="2"/>
  <text x="320" y="115" text-anchor="middle" fill="#48DBFB" font-size="14" font-weight="bold">Dim 2: ℂ</text>
  <text x="320" y="140" text-anchor="middle" fill="#fff" font-size="11">(a²+b²)(c²+d²)</text>
  <text x="320" y="158" text-anchor="middle" fill="#fff" font-size="11">= (ac−bd)²+(ad+bc)²</text>
  <text x="320" y="178" text-anchor="middle" fill="#55EFC4" font-size="10">✓ Brahmagupta-Fibonacci</text>

  <!-- Dim 4: Quaternions -->
  <rect x="430" y="90" width="160" height="100" rx="10" fill="none" stroke="#A29BFE" stroke-width="2"/>
  <text x="510" y="115" text-anchor="middle" fill="#A29BFE" font-size="14" font-weight="bold">Dim 4: ℍ</text>
  <text x="510" y="140" text-anchor="middle" fill="#fff" font-size="11">(Σaᵢ²)(Σbⱼ²) = Σcₖ²</text>
  <text x="510" y="158" text-anchor="middle" fill="#fff" font-size="11">Non-commutative!</text>
  <text x="510" y="178" text-anchor="middle" fill="#55EFC4" font-size="10">✓ Euler 4-square</text>

  <!-- Dim 8: Octonions -->
  <rect x="620" y="90" width="160" height="100" rx="10" fill="none" stroke="#FECA57" stroke-width="2"/>
  <text x="700" y="115" text-anchor="middle" fill="#FECA57" font-size="14" font-weight="bold">Dim 8: 𝕆</text>
  <text x="700" y="140" text-anchor="middle" fill="#fff" font-size="11">(Σaᵢ²)(Σbⱼ²) = Σcₖ²</text>
  <text x="700" y="158" text-anchor="middle" fill="#fff" font-size="11">Non-associative!</text>
  <text x="700" y="178" text-anchor="middle" fill="#55EFC4" font-size="10">✓ Degen 8-square</text>

  <!-- Subsumption arrows -->
  <g stroke="#55EFC4" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 215 140 L 235 140"/>
    <text x="225" y="135" text-anchor="middle" fill="#55EFC4" font-size="10">⊂</text>
    <path d="M 405 140 L 425 140"/>
    <text x="415" y="135" text-anchor="middle" fill="#55EFC4" font-size="10">⊂</text>
    <path d="M 595 140 L 615 140"/>
    <text x="605" y="135" text-anchor="middle" fill="#55EFC4" font-size="10">⊂</text>
  </g>

  <!-- Hurwitz Barrier -->
  <rect x="150" y="220" width="500" height="60" rx="8" fill="#E84393" opacity="0.15" stroke="#E84393" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="248" text-anchor="middle" fill="#E84393" font-size="16" font-weight="bold">
    ✗ HURWITZ BARRIER — No composition algebra in dim 16+
  </text>
  <text x="400" y="268" text-anchor="middle" fill="#FD79A8" font-size="11">
    Sedenions: zero divisors, no norm multiplicativity (verified: no_16_square_naive_identity)
  </text>

  <!-- Key insight boxes -->
  <rect x="50" y="310" width="340" height="90" rx="8" fill="#1a1a2e" stroke="#48DBFB" stroke-width="1"/>
  <text x="220" y="335" text-anchor="middle" fill="#48DBFB" font-size="13" font-weight="bold">Norm-Congruence Bridge</text>
  <text x="220" y="358" text-anchor="middle" fill="#fff" font-size="11">If p ≡ 3 (mod 4) and p | a²+b²</text>
  <text x="220" y="375" text-anchor="middle" fill="#fff" font-size="11">then p | a and p | b</text>
  <text x="220" y="392" text-anchor="middle" fill="#55EFC4" font-size="10">✓ norm_congruence_bridge</text>

  <rect x="410" y="310" width="340" height="90" rx="8" fill="#1a1a2e" stroke="#A29BFE" stroke-width="1"/>
  <text x="580" y="335" text-anchor="middle" fill="#A29BFE" font-size="13" font-weight="bold">Quaternion Double Factorization</text>
  <text x="580" y="358" text-anchor="middle" fill="#fff" font-size="11">q₁·q₂ and q₂·q₁ have same norm</text>
  <text x="580" y="375" text-anchor="middle" fill="#fff" font-size="11">but different components → 2× equations</text>
  <text x="580" y="392" text-anchor="middle" fill="#55EFC4" font-size="10">✓ quaternion_two_factorizations</text>

  <!-- Factoring application -->
  <rect x="100" y="425" width="600" height="55" rx="8" fill="#1a1a2e" stroke="#FECA57" stroke-width="1"/>
  <text x="400" y="448" text-anchor="middle" fill="#FECA57" font-size="13" font-weight="bold">
    Factoring Application
  </text>
  <text x="400" y="468" text-anchor="middle" fill="#aaa" font-size="11">
    Two representations N = a²+b² = c²+d² → (a−c)(a+c) = (d−b)(d+b) → gcd extraction → factors
  </text>
</svg>
