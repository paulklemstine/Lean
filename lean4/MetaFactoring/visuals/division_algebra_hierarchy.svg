<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="450" fill="url(#bg2)"/>
  
  <text x="450" y="40" text-anchor="middle" fill="white" font-size="22" font-weight="bold">Division Algebra Norm Channel Hierarchy</text>
  <text x="450" y="65" text-anchor="middle" fill="#aaa" font-size="13" font-style="italic">The Hurwitz Barrier at Dimension 16 — Formally Verified</text>
  
  <!-- Dimension boxes -->
  <!-- Dim 1 -->
  <rect x="50" y="100" width="160" height="180" rx="12" fill="#1a1a3e" stroke="#43e97b" stroke-width="2"/>
  <text x="130" y="125" text-anchor="middle" fill="#43e97b" font-size="16" font-weight="bold">Dim 1: ℝ</text>
  <text x="130" y="150" text-anchor="middle" fill="white" font-size="13">|a| · |b| = |ab|</text>
  <text x="130" y="180" text-anchor="middle" fill="#ccc" font-size="11">Trivial norm</text>
  <text x="130" y="200" text-anchor="middle" fill="#ccc" font-size="11">multiplicativity</text>
  <text x="130" y="230" text-anchor="middle" fill="#43e97b" font-size="24">✓</text>
  <text x="130" y="260" text-anchor="middle" fill="#43e97b" font-size="11">PROVED</text>
  
  <!-- Dim 2 -->
  <rect x="230" y="100" width="160" height="180" rx="12" fill="#1a1a3e" stroke="#4facfe" stroke-width="2"/>
  <text x="310" y="125" text-anchor="middle" fill="#4facfe" font-size="16" font-weight="bold">Dim 2: ℂ</text>
  <text x="310" y="150" text-anchor="middle" fill="white" font-size="12">(a²+b²)(c²+d²)</text>
  <text x="310" y="170" text-anchor="middle" fill="white" font-size="12">= sum of 2 squares</text>
  <text x="310" y="200" text-anchor="middle" fill="#ccc" font-size="11">Brahmagupta-</text>
  <text x="310" y="215" text-anchor="middle" fill="#ccc" font-size="11">Fibonacci</text>
  <text x="310" y="245" text-anchor="middle" fill="#4facfe" font-size="24">✓</text>
  <text x="310" y="265" text-anchor="middle" fill="#4facfe" font-size="11">PROVED (ring)</text>
  
  <!-- Dim 4 -->
  <rect x="410" y="100" width="160" height="180" rx="12" fill="#1a1a3e" stroke="#f093fb" stroke-width="2"/>
  <text x="490" y="125" text-anchor="middle" fill="#f093fb" font-size="16" font-weight="bold">Dim 4: ℍ</text>
  <text x="490" y="150" text-anchor="middle" fill="white" font-size="12">(Σaᵢ²)(Σbᵢ²)</text>
  <text x="490" y="170" text-anchor="middle" fill="white" font-size="12">= sum of 4 squares</text>
  <text x="490" y="200" text-anchor="middle" fill="#ccc" font-size="11">Euler identity</text>
  <text x="490" y="215" text-anchor="middle" fill="#ccc" font-size="11">Non-commutative!</text>
  <text x="490" y="245" text-anchor="middle" fill="#f093fb" font-size="24">✓</text>
  <text x="490" y="265" text-anchor="middle" fill="#f093fb" font-size="11">PROVED (ring)</text>
  
  <!-- Dim 8 -->
  <rect x="590" y="100" width="160" height="180" rx="12" fill="#1a1a3e" stroke="#fee140" stroke-width="2"/>
  <text x="670" y="125" text-anchor="middle" fill="#fee140" font-size="16" font-weight="bold">Dim 8: 𝕆</text>
  <text x="670" y="150" text-anchor="middle" fill="white" font-size="12">(Σaᵢ²)(Σbᵢ²)</text>
  <text x="670" y="170" text-anchor="middle" fill="white" font-size="12">= sum of 8 squares</text>
  <text x="670" y="200" text-anchor="middle" fill="#ccc" font-size="11">Degen identity</text>
  <text x="670" y="215" text-anchor="middle" fill="#ccc" font-size="11">Non-associative!</text>
  <text x="670" y="245" text-anchor="middle" fill="#fee140" font-size="24">✓</text>
  <text x="670" y="265" text-anchor="middle" fill="#fee140" font-size="11">PROVED (ring)</text>
  
  <!-- Dim 16 -->
  <rect x="770" y="100" width="110" height="180" rx="12" fill="#2a0f0f" stroke="#f5576c" stroke-width="2"/>
  <text x="825" y="125" text-anchor="middle" fill="#f5576c" font-size="16" font-weight="bold">Dim 16: 𝕊</text>
  <text x="825" y="155" text-anchor="middle" fill="#f5576c" font-size="12">NO identity</text>
  <text x="825" y="175" text-anchor="middle" fill="#f5576c" font-size="12">exists!</text>
  <text x="825" y="205" text-anchor="middle" fill="#ccc" font-size="11">Zero divisors</text>
  <text x="825" y="220" text-anchor="middle" fill="#ccc" font-size="11">(Hurwitz 1898)</text>
  <text x="825" y="250" text-anchor="middle" fill="#f5576c" font-size="24">✗</text>
  <text x="825" y="270" text-anchor="middle" fill="#f5576c" font-size="11">DISPROVED</text>
  
  <!-- Subsumption arrows -->
  <line x1="210" y1="190" x2="230" y2="190" stroke="#43e97b" stroke-width="2"/>
  <polygon points="228,186 228,194 236,190" fill="#43e97b"/>
  <line x1="390" y1="190" x2="410" y2="190" stroke="#4facfe" stroke-width="2"/>
  <polygon points="408,186 408,194 416,190" fill="#4facfe"/>
  <line x1="570" y1="190" x2="590" y2="190" stroke="#f093fb" stroke-width="2"/>
  <polygon points="588,186 588,194 596,190" fill="#f093fb"/>
  <line x1="750" y1="190" x2="770" y2="190" stroke="#f5576c" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="760" y="183" fill="#f5576c" font-size="14">✗</text>
  
  <!-- Subsumption labels -->
  <text x="220" y="180" text-anchor="middle" fill="#43e97b" font-size="10">⊆</text>
  <text x="400" y="180" text-anchor="middle" fill="#4facfe" font-size="10">⊆</text>
  <text x="580" y="180" text-anchor="middle" fill="#f093fb" font-size="10">⊆</text>
  
  <!-- Key results below -->
  <rect x="50" y="300" width="400" height="130" rx="10" fill="#0a0a1e" stroke="#4facfe" stroke-width="1"/>
  <text x="250" y="325" text-anchor="middle" fill="#4facfe" font-size="14" font-weight="bold">Factoring Applications (Proved ✓)</text>
  <text x="70" y="350" fill="#ccc" font-size="12">• Two 2-square reps → factor equation</text>
  <text x="70" y="370" fill="#ccc" font-size="12">• Fermat: p ≡ 1 (mod 4) → p = a² + b²</text>
  <text x="70" y="390" fill="#ccc" font-size="12">• Lagrange: every ℕ = sum of 4 squares</text>
  <text x="70" y="410" fill="#ccc" font-size="12">• Norm-congruence bridge: p≡3(4), p|a²+b² → p|a,b</text>
  
  <rect x="470" y="300" width="410" height="130" rx="10" fill="#0a0a1e" stroke="#fa709a" stroke-width="1"/>
  <text x="675" y="325" text-anchor="middle" fill="#fa709a" font-size="14" font-weight="bold">Open Questions</text>
  <text x="490" y="350" fill="#aaa" font-size="12">• Which dimension is optimal for given N?</text>
  <text x="490" y="370" fill="#aaa" font-size="12">• Can sedenion weak identities help?</text>
  <text x="490" y="390" fill="#aaa" font-size="12">• Does quaternion non-commutativity</text>
  <text x="500" y="410" fill="#aaa" font-size="12">  double the factoring equations?</text>
</svg>
