<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2848;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg4)"/>

  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Division Algebra Norm Channel Hierarchy</text>
  <text x="400" y="60" text-anchor="middle" fill="#8899bb" font-size="12">Hurwitz 1898: Norm-multiplicative identities exist only in dimensions 1, 2, 4, 8</text>

  <!-- Dimension 1: Reals -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#ff6b6b" opacity="0.15" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="80" y="25" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">Dim 1: ℝ</text>
    <text x="80" y="45" text-anchor="middle" fill="#ffffff" font-size="11">Real numbers</text>
    <text x="80" y="70" text-anchor="middle" fill="#ffffff" font-size="10">|ab| = |a|·|b|</text>
    <text x="80" y="90" text-anchor="middle" fill="#aabbcc" font-size="9">Trivial norm channel</text>
    <text x="80" y="110" text-anchor="middle" fill="#ff6b6b" font-size="9">r₁(n) = {0,1}</text>
  </g>

  <!-- Dimension 2: Complex -->
  <g transform="translate(230, 100)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#ffd93d" opacity="0.15" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="80" y="25" text-anchor="middle" fill="#ffd93d" font-size="14" font-weight="bold">Dim 2: ℂ</text>
    <text x="80" y="45" text-anchor="middle" fill="#ffffff" font-size="11">Complex numbers</text>
    <text x="80" y="65" text-anchor="middle" fill="#ffffff" font-size="9">(a²+b²)(c²+d²) =</text>
    <text x="80" y="78" text-anchor="middle" fill="#ffffff" font-size="9">(ac−bd)²+(ad+bc)²</text>
    <text x="80" y="95" text-anchor="middle" fill="#ffe066" font-size="9">Brahmagupta-Fibonacci</text>
    <text x="80" y="110" text-anchor="middle" fill="#ffd93d" font-size="9">✓ Verified</text>
  </g>

  <!-- Dimension 4: Quaternions -->
  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#6bcb77" opacity="0.15" stroke="#6bcb77" stroke-width="1.5"/>
    <text x="80" y="25" text-anchor="middle" fill="#6bcb77" font-size="14" font-weight="bold">Dim 4: ℍ</text>
    <text x="80" y="45" text-anchor="middle" fill="#ffffff" font-size="11">Quaternions</text>
    <text x="80" y="65" text-anchor="middle" fill="#ffffff" font-size="9">Product of sums of</text>
    <text x="80" y="78" text-anchor="middle" fill="#ffffff" font-size="9">4 squares = sum of 4 sq</text>
    <text x="80" y="95" text-anchor="middle" fill="#88dd99" font-size="9">Euler's identity</text>
    <text x="80" y="110" text-anchor="middle" fill="#6bcb77" font-size="9">✓ Verified</text>
  </g>

  <!-- Dimension 8: Octonions -->
  <g transform="translate(590, 100)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#4ecdc4" opacity="0.15" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="80" y="25" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="bold">Dim 8: 𝕆</text>
    <text x="80" y="45" text-anchor="middle" fill="#ffffff" font-size="11">Octonions</text>
    <text x="80" y="65" text-anchor="middle" fill="#ffffff" font-size="9">Product of sums of</text>
    <text x="80" y="78" text-anchor="middle" fill="#ffffff" font-size="9">8 squares = sum of 8 sq</text>
    <text x="80" y="95" text-anchor="middle" fill="#66ddd4" font-size="9">Degen's identity (MAX)</text>
    <text x="80" y="110" text-anchor="middle" fill="#4ecdc4" font-size="9">✓ Verified</text>
  </g>

  <!-- Arrows showing hierarchy -->
  <line x1="210" y1="160" x2="230" y2="160" stroke="#ffffff" stroke-width="1.5" opacity="0.5" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="160" x2="410" y2="160" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <line x1="570" y1="160" x2="590" y2="160" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

  <!-- The barrier -->
  <g transform="translate(100, 250)">
    <rect x="0" y="0" width="600" height="50" rx="8" fill="#ff0000" opacity="0.1" stroke="#ff4444" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="300" y="20" text-anchor="middle" fill="#ff4444" font-size="13" font-weight="bold">🚫 HURWITZ BARRIER: No 16-square identity exists!</text>
    <text x="300" y="38" text-anchor="middle" fill="#ff8888" font-size="10">Dim 16 (Sedenions): zero divisors, non-alternative, no norm multiplicativity</text>
  </g>

  <!-- Representation theorems -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="340" height="110" rx="10" fill="#a55eea" opacity="0.1" stroke="#a55eea" stroke-width="1"/>
    <text x="170" y="25" text-anchor="middle" fill="#a55eea" font-size="14" font-weight="bold">Fermat's Two-Square Theorem</text>
    <text x="170" y="48" text-anchor="middle" fill="#ffffff" font-size="11">Prime p ≡ 1 (mod 4) ⟹ p = a² + b²</text>
    <text x="170" y="70" text-anchor="middle" fill="#aabbcc" font-size="10">5 = 1²+2²  13 = 2²+3²  17 = 1²+4²</text>
    <text x="170" y="88" text-anchor="middle" fill="#aabbcc" font-size="10">29 = 2²+5²  37 = 1²+6²  41 = 4²+5²</text>
    <text x="170" y="103" text-anchor="middle" fill="#a55eea" font-size="9">✓ fermat_two_square verified</text>
  </g>

  <g transform="translate(420, 330)">
    <rect x="0" y="0" width="340" height="110" rx="10" fill="#ff9ff3" opacity="0.1" stroke="#ff9ff3" stroke-width="1"/>
    <text x="170" y="25" text-anchor="middle" fill="#ff9ff3" font-size="14" font-weight="bold">Lagrange's Four-Square Theorem</text>
    <text x="170" y="48" text-anchor="middle" fill="#ffffff" font-size="11">Every n ∈ ℕ is a sum of 4 squares</text>
    <text x="170" y="70" text-anchor="middle" fill="#aabbcc" font-size="10">7 = 1²+1²+1²+2²</text>
    <text x="170" y="88" text-anchor="middle" fill="#aabbcc" font-size="10">15 = 1²+1²+2²+3²</text>
    <text x="170" y="103" text-anchor="middle" fill="#ff9ff3" font-size="9">✓ lagrange_four_squares verified</text>
  </g>

  <!-- Factoring connection -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="600" height="80" rx="10" fill="#54a0ff" opacity="0.1" stroke="#54a0ff" stroke-width="1.5"/>
    <text x="300" y="25" text-anchor="middle" fill="#54a0ff" font-size="14" font-weight="bold">Two-Representation Factoring</text>
    <text x="300" y="48" text-anchor="middle" fill="#ffffff" font-size="12">If N = a²+b² = c²+d² then (a−c)(a+c) = (d−b)(d+b)</text>
    <text x="300" y="68" text-anchor="middle" fill="#ffffff" font-size="11">⟹ gcd(a²−c², N) often gives a nontrivial factor</text>
    <text x="300" y="83" text-anchor="middle" fill="#54a0ff" font-size="9">✓ two_reps_factoring verified in Lean 4</text>
  </g>

  <!-- Dimension labels at bottom -->
  <text x="400" y="580" text-anchor="middle" fill="#8899bb" font-size="10">All identities and theorems formally verified in Lean 4 with Mathlib • 0 sorry</text>
</svg>
