<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00CED1"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="url(#gold)" font-size="24" font-weight="bold">MetaFactoring: The Nine Lenses Architecture</text>
  <text x="450" y="65" text-anchor="middle" fill="#aaa" font-size="14">Formally Verified Multi-Lens Integer Factorization Framework</text>

  <!-- Central node: N = pq -->
  <circle cx="450" cy="360" r="60" fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
  <text x="450" y="355" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold">N = p·q</text>
  <text x="450" y="378" text-anchor="middle" fill="#aaa" font-size="12">Factoring Target</text>

  <!-- 9 lens nodes arranged in a nonagon -->
  <!-- Lens 1: Fibonacci (top) -->
  <g transform="translate(450, 120)">
    <rect x="-70" y="-25" width="140" height="50" rx="10" fill="#1a3a1a" stroke="#00FF88" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#00FF88" font-size="11" font-weight="bold">1. Fibonacci</text>
    <text x="0" y="12" text-anchor="middle" fill="#88FFAA" font-size="9">Zeckendorf Constraints</text>
  </g>
  <line x1="450" y1="145" x2="450" y2="300" stroke="#00FF88" stroke-width="1" opacity="0.4"/>

  <!-- Lens 2: Hyperbolic -->
  <g transform="translate(650, 170)">
    <rect x="-70" y="-25" width="140" height="50" rx="10" fill="#3a1a1a" stroke="#FF6644" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FF6644" font-size="11" font-weight="bold">2. Hyperbolic</text>
    <text x="0" y="12" text-anchor="middle" fill="#FF9988" font-size="9">Geometric Divisors</text>
  </g>
  <line x1="615" y1="190" x2="500" y2="330" stroke="#FF6644" stroke-width="1" opacity="0.4"/>

  <!-- Lens 3: Orbit -->
  <g transform="translate(770, 320)">
    <rect x="-70" y="-25" width="140" height="50" rx="10" fill="#1a1a3a" stroke="#6688FF" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#6688FF" font-size="11" font-weight="bold">3. Orbit</text>
    <text x="0" y="12" text-anchor="middle" fill="#99AAFF" font-size="9">Dynamical Systems</text>
  </g>
  <line x1="700" y1="335" x2="510" y2="355" stroke="#6688FF" stroke-width="1" opacity="0.4"/>

  <!-- Lens 4: Spectral -->
  <g transform="translate(720, 490)">
    <rect x="-70" y="-25" width="140" height="50" rx="10" fill="#3a1a3a" stroke="#CC66FF" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#CC66FF" font-size="11" font-weight="bold">4. Spectral</text>
    <text x="0" y="12" text-anchor="middle" fill="#DD99FF" font-size="9">Character Sums</text>
  </g>
  <line x1="665" y1="475" x2="500" y2="390" stroke="#CC66FF" stroke-width="1" opacity="0.4"/>

  <!-- Lens 5: Division Algebra -->
  <g transform="translate(580, 600)">
    <rect x="-70" y="-25" width="140" height="50" rx="10" fill="#3a3a1a" stroke="#FFCC00" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FFCC00" font-size="11" font-weight="bold">5. Division Algebra</text>
    <text x="0" y="12" text-anchor="middle" fill="#FFDD66" font-size="9">Norm Channels ℂ,ℍ,𝕆</text>
  </g>
  <line x1="545" y1="580" x2="470" y2="410" stroke="#FFCC00" stroke-width="1" opacity="0.4"/>

  <!-- Lens 6: Lattice -->
  <g transform="translate(320, 600)">
    <rect x="-70" y="-25" width="140" height="50" rx="10" fill="#1a3a3a" stroke="#00CCCC" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#00CCCC" font-size="11" font-weight="bold">6. Lattice</text>
    <text x="0" y="12" text-anchor="middle" fill="#66DDDD" font-size="9">Short Vectors</text>
  </g>
  <line x1="355" y1="580" x2="430" y2="410" stroke="#00CCCC" stroke-width="1" opacity="0.4"/>

  <!-- Lens 7: Congruence -->
  <g transform="translate(180, 490)">
    <rect x="-70" y="-25" width="140" height="50" rx="10" fill="#3a1a2a" stroke="#FF66AA" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FF66AA" font-size="11" font-weight="bold">7. Congruence</text>
    <text x="0" y="12" text-anchor="middle" fill="#FF99CC" font-size="9">x² ≡ y² mod N</text>
  </g>
  <line x1="235" y1="475" x2="400" y2="390" stroke="#FF66AA" stroke-width="1" opacity="0.4"/>

  <!-- Lens 8: Tropical (NEW) -->
  <g transform="translate(130, 320)">
    <rect x="-75" y="-25" width="150" height="50" rx="10" fill="#2a1a0a" stroke="#FF8800" stroke-width="2.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FF8800" font-size="11" font-weight="bold">8. Tropical ★</text>
    <text x="0" y="12" text-anchor="middle" fill="#FFAA44" font-size="9">p-adic Valuations</text>
  </g>
  <line x1="205" y1="335" x2="390" y2="355" stroke="#FF8800" stroke-width="1" opacity="0.4"/>

  <!-- Lens 9: Elliptic Curve (NEW) -->
  <g transform="translate(250, 170)">
    <rect x="-75" y="-25" width="150" height="50" rx="10" fill="#0a2a1a" stroke="#44FF88" stroke-width="2.5"/>
    <text x="0" y="-5" text-anchor="middle" fill="#44FF88" font-size="11" font-weight="bold">9. Elliptic Curve ★</text>
    <text x="0" y="12" text-anchor="middle" fill="#88FFAA" font-size="9">Hasse-Bound Groups</text>
  </g>
  <line x1="290" y1="195" x2="405" y2="330" stroke="#44FF88" stroke-width="1" opacity="0.4"/>

  <!-- Legend -->
  <rect x="20" y="650" width="860" height="40" rx="5" fill="#111133" opacity="0.8"/>
  <text x="450" y="673" text-anchor="middle" fill="#ccc" font-size="12">
    9 independent lenses × 1 bit each = 2⁹ = 512× search space reduction — All formally verified in Lean 4
  </text>
</svg>
