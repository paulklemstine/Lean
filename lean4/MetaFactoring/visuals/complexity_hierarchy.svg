<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgC)"/>

  <text x="400" y="35" text-anchor="middle" fill="#00CED1" font-size="22" font-weight="bold">MF(k) Complexity Hierarchy</text>
  <text x="400" y="58" text-anchor="middle" fill="#008888" font-size="13">Strict lens hierarchy: MF(1) ⊊ MF(2) ⊊ ... ⊊ MF(9)</text>

  <!-- Nested ovals representing MF(k) classes -->
  <ellipse cx="400" cy="280" rx="370" ry="190" fill="none" stroke="#006666" stroke-width="2" opacity="0.3"/>
  <text x="770" y="285" fill="#006666" font-size="11">MF(9) = 512×</text>

  <ellipse cx="400" cy="280" rx="330" ry="170" fill="none" stroke="#008888" stroke-width="2" opacity="0.4"/>
  <text x="730" y="260" fill="#008888" font-size="11">MF(8)</text>

  <ellipse cx="400" cy="280" rx="290" ry="150" fill="none" stroke="#00AAAA" stroke-width="2" opacity="0.5"/>
  <text x="690" y="240" fill="#00AAAA" font-size="11">MF(7) = 128×</text>

  <ellipse cx="400" cy="280" rx="250" ry="130" fill="none" stroke="#00CCCC" stroke-width="2" opacity="0.6"/>
  <text x="650" y="220" fill="#00CCCC" font-size="11">MF(6)</text>

  <ellipse cx="400" cy="280" rx="210" ry="110" fill="none" stroke="#00DDDD" stroke-width="2" opacity="0.7"/>
  <text x="610" y="200" fill="#00DDDD" font-size="11">MF(5)</text>

  <ellipse cx="400" cy="280" rx="170" ry="90" fill="none" stroke="#00EEEE" stroke-width="2" opacity="0.8"/>
  <text x="570" y="215" fill="#00EEEE" font-size="11">MF(4)</text>

  <ellipse cx="400" cy="280" rx="130" ry="70" fill="none" stroke="#44FFFF" stroke-width="2" opacity="0.9"/>
  <text x="530" y="235" fill="#44FFFF" font-size="11">MF(3)</text>

  <ellipse cx="400" cy="280" rx="90" ry="50" fill="none" stroke="#88FFFF" stroke-width="2"/>
  <text x="490" y="255" fill="#88FFFF" font-size="11">MF(2)</text>

  <ellipse cx="400" cy="280" rx="50" ry="30" fill="#003333" stroke="#CCFFFF" stroke-width="2"/>
  <text x="400" y="285" text-anchor="middle" fill="#CCFFFF" font-size="11" font-weight="bold">MF(1)</text>

  <!-- Key results -->
  <rect x="50" y="420" width="700" height="70" rx="8" fill="#0a0a2e" stroke="#00CED1" stroke-width="1.5"/>
  <text x="400" y="445" text-anchor="middle" fill="#00CED1" font-size="13" font-weight="bold">Formally Verified Results:</text>
  <text x="400" y="465" text-anchor="middle" fill="#88DDDD" font-size="11">
    lens_hierarchy_strict: S/2^(k+1) &lt; S/2^k  |  mf_class_separation: 2^k/2^k = 1 ∧ 2^k/2^(k-1) = 2
  </text>
  <text x="400" y="482" text-anchor="middle" fill="#88DDDD" font-size="11">
    information_ceiling: N/2^N = 0  (sufficiently many lenses reduce to trivial search)
  </text>
</svg>
