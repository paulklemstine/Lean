<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#161b22" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#abg)"/>

  <text x="400" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">
    MetaFactoring: Application Landscape
  </text>

  <!-- Central hub -->
  <circle cx="400" cy="250" r="50" fill="#1a2a4a" stroke="#4ecdc4" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" fill="#4ecdc4" font-size="12" font-weight="bold">Meta</text>
  <text x="400" y="262" text-anchor="middle" fill="#4ecdc4" font-size="12" font-weight="bold">Factoring</text>

  <!-- Application nodes -->
  <rect x="70" y="95" width="120" height="50" rx="10" fill="#e74c3c" opacity="0.8"/>
  <text x="130" y="115" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Cryptography</text>
  <line x1="130" y1="120" x2="400" y2="250" stroke="#e74c3c" stroke-width="1" opacity="0.3"/>
  <rect x="590" y="95" width="120" height="50" rx="10" fill="#3498db" opacity="0.8"/>
  <text x="650" y="115" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Number Theory</text>
  <line x1="650" y1="120" x2="400" y2="250" stroke="#3498db" stroke-width="1" opacity="0.3"/>
  <rect x="70" y="355" width="120" height="50" rx="10" fill="#9b59b6" opacity="0.8"/>
  <text x="130" y="375" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Quantum Computing</text>
  <line x1="130" y1="380" x2="400" y2="250" stroke="#9b59b6" stroke-width="1" opacity="0.3"/>
  <rect x="590" y="355" width="120" height="50" rx="10" fill="#f39c12" opacity="0.8"/>
  <text x="650" y="375" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Machine Learning</text>
  <line x1="650" y1="380" x2="400" y2="250" stroke="#f39c12" stroke-width="1" opacity="0.3"/>
  <rect x="190" y="55" width="120" height="50" rx="10" fill="#1abc9c" opacity="0.8"/>
  <text x="250" y="75" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Lattice Crypto</text>
  <line x1="250" y1="80" x2="400" y2="250" stroke="#1abc9c" stroke-width="1" opacity="0.3"/>
  <rect x="490" y="55" width="120" height="50" rx="10" fill="#e67e22" opacity="0.8"/>
  <text x="550" y="75" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Coding Theory</text>
  <line x1="550" y1="80" x2="400" y2="250" stroke="#e67e22" stroke-width="1" opacity="0.3"/>
  <rect x="190" y="395" width="120" height="50" rx="10" fill="#2ecc71" opacity="0.8"/>
  <text x="250" y="415" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Computational</text>
  <text x="250" y="428" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Algebra</text>
  <line x1="250" y1="420" x2="400" y2="250" stroke="#2ecc71" stroke-width="1" opacity="0.3"/>
  <rect x="490" y="395" width="120" height="50" rx="10" fill="#ff6b6b" opacity="0.8"/>
  <text x="550" y="415" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Education</text>
  <line x1="550" y1="420" x2="400" y2="250" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
  <text x="400" y="480" text-anchor="middle" fill="#8b949e" font-size="11">
    The multi-lens principle extends beyond factoring to any problem with multiple structural facets
  </text>
</svg>