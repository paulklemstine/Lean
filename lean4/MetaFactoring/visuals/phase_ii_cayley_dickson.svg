<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0f0f1a"/>
  
  <text x="400" y="35" fill="#e0e0ff" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial">Cayley-Dickson Hierarchy &amp; Hurwitz Barrier</text>
  <text x="400" y="55" fill="#8888bb" font-size="12" text-anchor="middle" font-family="Arial">Norm-multiplicative algebras exist only in dimensions {1, 2, 4, 8}</text>
  
  <!-- Dim 1: Reals -->
  <rect x="60" y="90" width="140" height="130" rx="12" fill="#1a2a1a" stroke="#44cc44" stroke-width="2"/>
  <text x="130" y="115" fill="#88ff88" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">ℝ</text>
  <text x="130" y="135" fill="#66cc66" font-size="12" text-anchor="middle" font-family="Arial">Dim 1</text>
  <text x="130" y="160" fill="#44aa44" font-size="10" text-anchor="middle" font-family="Arial">Commutative ✓</text>
  <text x="130" y="175" fill="#44aa44" font-size="10" text-anchor="middle" font-family="Arial">Associative ✓</text>
  <text x="130" y="190" fill="#44aa44" font-size="10" text-anchor="middle" font-family="Arial">Ordered ✓</text>
  <text x="130" y="210" fill="#88ff88" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">1-sq identity ✓</text>
  
  <!-- Arrow -->
  <text x="215" y="155" fill="#666" font-size="24" text-anchor="middle" font-family="Arial">→</text>
  
  <!-- Dim 2: Complex -->
  <rect x="235" y="90" width="140" height="130" rx="12" fill="#1a1a2a" stroke="#4466cc" stroke-width="2"/>
  <text x="305" y="115" fill="#6688ff" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">ℂ</text>
  <text x="305" y="135" fill="#4466cc" font-size="12" text-anchor="middle" font-family="Arial">Dim 2</text>
  <text x="305" y="160" fill="#3355aa" font-size="10" text-anchor="middle" font-family="Arial">Commutative ✓</text>
  <text x="305" y="175" fill="#3355aa" font-size="10" text-anchor="middle" font-family="Arial">Associative ✓</text>
  <text x="305" y="190" fill="#cc4444" font-size="10" text-anchor="middle" font-family="Arial">Ordered ✗</text>
  <text x="305" y="210" fill="#6688ff" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">2-sq identity ✓</text>
  
  <!-- Arrow -->
  <text x="390" y="155" fill="#666" font-size="24" text-anchor="middle" font-family="Arial">→</text>
  
  <!-- Dim 4: Quaternions -->
  <rect x="410" y="90" width="140" height="130" rx="12" fill="#2a1a2a" stroke="#aa44cc" stroke-width="2"/>
  <text x="480" y="115" fill="#cc66ff" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">ℍ</text>
  <text x="480" y="135" fill="#aa44cc" font-size="12" text-anchor="middle" font-family="Arial">Dim 4</text>
  <text x="480" y="160" fill="#cc4444" font-size="10" text-anchor="middle" font-family="Arial">Commutative ✗</text>
  <text x="480" y="175" fill="#8833aa" font-size="10" text-anchor="middle" font-family="Arial">Associative ✓</text>
  <text x="480" y="190" fill="#cc4444" font-size="10" text-anchor="middle" font-family="Arial">Ordered ✗</text>
  <text x="480" y="210" fill="#cc66ff" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">4-sq identity ✓</text>
  
  <!-- Arrow -->
  <text x="565" y="155" fill="#666" font-size="24" text-anchor="middle" font-family="Arial">→</text>
  
  <!-- Dim 8: Octonions -->
  <rect x="585" y="90" width="150" height="130" rx="12" fill="#2a2a1a" stroke="#cc8844" stroke-width="2"/>
  <text x="660" y="115" fill="#ffbb66" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">𝕆</text>
  <text x="660" y="135" fill="#cc8844" font-size="12" text-anchor="middle" font-family="Arial">Dim 8</text>
  <text x="660" y="160" fill="#cc4444" font-size="10" text-anchor="middle" font-family="Arial">Commutative ✗</text>
  <text x="660" y="175" fill="#cc4444" font-size="10" text-anchor="middle" font-family="Arial">Associative ✗</text>
  <text x="660" y="190" fill="#aa7733" font-size="10" text-anchor="middle" font-family="Arial">Alternative ✓</text>
  <text x="660" y="210" fill="#ffbb66" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">8-sq identity ✓</text>
  
  <!-- BARRIER -->
  <line x1="60" y1="260" x2="740" y2="260" stroke="#ff4444" stroke-width="4" stroke-dasharray="12,6"/>
  <text x="400" y="285" fill="#ff6666" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial">══ HURWITZ BARRIER (1898) ══</text>
  <text x="400" y="305" fill="#cc4444" font-size="12" text-anchor="middle" font-family="Arial">No norm-multiplicative composition algebra exists beyond dimension 8</text>
  
  <!-- Dim 16: Sedenions (below barrier) -->
  <rect x="280" y="330" width="240" height="100" rx="12" fill="#2a1a1a" stroke="#884444" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="355" fill="#cc6666" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">𝕊 — Sedenions</text>
  <text x="400" y="375" fill="#884444" font-size="12" text-anchor="middle" font-family="Arial">Dim 16</text>
  <text x="400" y="395" fill="#cc4444" font-size="10" text-anchor="middle" font-family="Arial">Norm multiplicativity ✗ | Zero divisors ✓</text>
  <text x="400" y="415" fill="#888844" font-size="10" text-anchor="middle" font-family="Arial">Flexible: (xy)x = x(yx) ✓ | Alternative: (xx)y = x(xy) ✓</text>
</svg>
