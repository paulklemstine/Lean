<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="lens1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#EE5A24"/>
    </linearGradient>
    <linearGradient id="lens2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECA57"/><stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
    <linearGradient id="lens3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48DBFB"/><stop offset="100%" stop-color="#0ABDE3"/>
    </linearGradient>
    <linearGradient id="lens4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A29BFE"/><stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="lens5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55EFC4"/><stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <linearGradient id="lens6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FD79A8"/><stop offset="100%" stop-color="#E84393"/>
    </linearGradient>
    <linearGradient id="lens7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDCB6E"/><stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#centerGlow)"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">MetaFactoring: Seven Lenses Framework</text>
  <text x="450" y="70" text-anchor="middle" fill="#888" font-size="13">Each lens constrains the search space — combined: 2^k reduction</text>

  <!-- Center: N = p × q -->
  <circle cx="450" cy="370" r="65" fill="#1a1a2e" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
  <text x="450" y="360" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">N = p × q</text>
  <text x="450" y="385" text-anchor="middle" fill="#aaa" font-size="12">Factor Target</text>

  <!-- Connection lines -->
  <g stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4">
    <line x1="450" y1="305" x2="450" y2="145" stroke="#FF6B6B"/>
    <line x1="510" y1="320" x2="680" y2="175" stroke="#FECA57"/>
    <line x1="515" y1="370" x2="730" y2="370" stroke="#48DBFB"/>
    <line x1="510" y1="420" x2="680" y2="565" stroke="#A29BFE"/>
    <line x1="450" y1="435" x2="450" y2="595" stroke="#55EFC4"/>
    <line x1="390" y1="420" x2="220" y2="565" stroke="#FD79A8"/>
    <line x1="385" y1="370" x2="170" y2="370" stroke="#FDCB6E"/>
  </g>

  <!-- Lens 1: Fibonacci-Zeckendorf (top) -->
  <g transform="translate(450, 120)">
    <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#lens1)" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">1. Fibonacci-Zeckendorf</text>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">F(k+2) &lt; 2^k</text>
    <text x="0" y="26" text-anchor="middle" fill="#fff" font-size="9" opacity="0.6">Non-adjacent carries</text>
  </g>

  <!-- Lens 2: Hyperbolic (top-right) -->
  <g transform="translate(710, 150)">
    <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#lens2)" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">2. Hyperbolic</text>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">d · (N/d) = N</text>
    <text x="0" y="26" text-anchor="middle" fill="#fff" font-size="9" opacity="0.6">Divisors on xy = N</text>
  </g>

  <!-- Lens 3: Orbit-Dynamical (right) -->
  <g transform="translate(770, 370)">
    <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#lens3)" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">3. Orbit-Dynamical</text>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">x ↦ x² + c mod N</text>
    <text x="0" y="26" text-anchor="middle" fill="#fff" font-size="9" opacity="0.6">Pollard rho collisions</text>
  </g>

  <!-- Lens 4: Spectral (bottom-right) -->
  <g transform="translate(710, 590)">
    <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#lens4)" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">4. Spectral-Harmonic</text>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">a^p ≡ a (mod p)</text>
    <text x="0" y="26" text-anchor="middle" fill="#fff" font-size="9" opacity="0.6">Character sums</text>
  </g>

  <!-- Lens 5: Division Algebra (bottom) -->
  <g transform="translate(450, 620)">
    <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#lens5)" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">5. Division Algebra</text>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">N(ab) = N(a)·N(b)</text>
    <text x="0" y="26" text-anchor="middle" fill="#fff" font-size="9" opacity="0.6">ℂ, ℍ, 𝕆 norm channels</text>
  </g>

  <!-- Lens 6: Lattice (bottom-left) -->
  <g transform="translate(190, 590)">
    <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#lens6)" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">6. Lattice-Reduction</text>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">sa + tb = gcd(a,b)</text>
    <text x="0" y="26" text-anchor="middle" fill="#fff" font-size="9" opacity="0.6">Bézout + LLL</text>
  </g>

  <!-- Lens 7: Congruence of Squares (left) -->
  <g transform="translate(130, 370)">
    <rect x="-90" y="-35" width="180" height="70" rx="12" fill="url(#lens7)" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">7. Congruence of Squares</text>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">x² ≡ y² (mod N)</text>
    <text x="0" y="26" text-anchor="middle" fill="#fff" font-size="9" opacity="0.6">Universal endgame</text>
  </g>

  <!-- Bottom annotation -->
  <text x="450" y="685" text-anchor="middle" fill="#666" font-size="11">
    Combined reduction: S / 2^7 = S / 128 (formally verified in Lean 4)
  </text>
</svg>
