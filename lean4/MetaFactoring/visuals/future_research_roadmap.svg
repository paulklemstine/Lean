<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="thrust1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b" />
      <stop offset="100%" style="stop-color:#ff8e8e" />
    </linearGradient>
    <linearGradient id="thrust2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4" />
      <stop offset="100%" style="stop-color:#6ee7de" />
    </linearGradient>
    <linearGradient id="thrust3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#45b7d1" />
      <stop offset="100%" style="stop-color:#67d1eb" />
    </linearGradient>
    <linearGradient id="thrust4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7dc6f" />
      <stop offset="100%" style="stop-color:#f9e89a" />
    </linearGradient>
    <linearGradient id="thrust5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bb8fce" />
      <stop offset="100%" style="stop-color:#d5b8e8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" filter="url(#glow)">
    MetaFactoring: Future Research Roadmap
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#aaaacc" font-size="13">
    Five Research Thrusts Across Mathematics, Computing, and Verification
  </text>

  <!-- Timeline arrow -->
  <line x1="80" y1="610" x2="820" y2="610" stroke="#555577" stroke-width="2" marker-end="url(#arrow)"/>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#555577"/>
  </marker>

  <!-- Year markers -->
  <text x="120" y="635" text-anchor="middle" fill="#888899" font-size="11">Year 1</text>
  <text x="270" y="635" text-anchor="middle" fill="#888899" font-size="11">Year 2</text>
  <text x="420" y="635" text-anchor="middle" fill="#888899" font-size="11">Year 3</text>
  <text x="570" y="635" text-anchor="middle" fill="#888899" font-size="11">Year 4</text>
  <text x="720" y="635" text-anchor="middle" fill="#888899" font-size="11">Year 5</text>

  <!-- Year lines -->
  <line x1="120" y1="95" x2="120" y2="610" stroke="#333355" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="270" y1="95" x2="270" y2="610" stroke="#333355" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="420" y1="95" x2="420" y2="610" stroke="#333355" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="570" y1="95" x2="570" y2="610" stroke="#333355" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="720" y1="95" x2="720" y2="610" stroke="#333355" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Thrust 1: Constraint Intersection -->
  <rect x="90" y="95" width="330" height="42" rx="8" fill="url(#thrust1)" opacity="0.85"/>
  <text x="100" y="121" fill="#1a1a2e" font-size="12" font-weight="bold">T1: Tightening Constraint Intersection</text>
  <rect x="90" y="95" width="120" height="8" rx="4" fill="#ff4444" opacity="0.9"/>
  <text x="100" y="106" fill="#ffffff" font-size="7">Correlation Experiments</text>
  <rect x="220" y="95" width="100" height="8" rx="4" fill="#ff6666" opacity="0.9"/>
  <text x="230" y="106" fill="#ffffff" font-size="7">Bayesian Selection</text>

  <!-- Thrust 2: Fibonacci-Spectral -->
  <rect x="170" y="165" width="400" height="42" rx="8" fill="url(#thrust2)" opacity="0.85"/>
  <text x="180" y="191" fill="#1a1a2e" font-size="12" font-weight="bold">T2: Fibonacci-Spectral Duality</text>
  <rect x="170" y="165" width="150" height="8" rx="4" fill="#2ecc71" opacity="0.9"/>
  <text x="180" y="176" fill="#ffffff" font-size="7">Pisano-Spectral Computation</text>
  <rect x="330" y="165" width="120" height="8" rx="4" fill="#27ae60" opacity="0.9"/>
  <text x="340" y="176" fill="#ffffff" font-size="7">Representation Theory</text>
  <rect x="460" y="165" width="110" height="8" rx="4" fill="#1e8449" opacity="0.9"/>
  <text x="470" y="176" fill="#ffffff" font-size="7">Proof Attempt</text>

  <!-- Thrust 3: Division Algebra -->
  <rect x="120" y="235" width="480" height="42" rx="8" fill="url(#thrust3)" opacity="0.85"/>
  <text x="130" y="261" fill="#1a1a2e" font-size="12" font-weight="bold">T3: Division Algebra Hierarchy & Beyond Hurwitz</text>
  <rect x="120" y="235" width="100" height="8" rx="4" fill="#2980b9" opacity="0.9"/>
  <text x="130" y="246" fill="#ffffff" font-size="7">Quaternionic Factoring</text>
  <rect x="280" y="235" width="150" height="8" rx="4" fill="#2471a3" opacity="0.9"/>
  <text x="290" y="246" fill="#ffffff" font-size="7">Cayley-Dickson Extensions</text>
  <rect x="460" y="235" width="140" height="8" rx="4" fill="#1a5276" opacity="0.9"/>
  <text x="470" y="246" fill="#ffffff" font-size="7">E₈ Lattice Connection</text>

  <!-- Thrust 4: Quantum -->
  <rect x="350" y="305" width="370" height="42" rx="8" fill="url(#thrust4)" opacity="0.85"/>
  <text x="360" y="331" fill="#1a1a2e" font-size="12" font-weight="bold">T4: Quantum MetaFactoring</text>
  <rect x="350" y="305" width="140" height="8" rx="4" fill="#d4ac0d" opacity="0.9"/>
  <text x="360" y="316" fill="#1a1a2e" font-size="7">Hybrid Protocol Design</text>
  <rect x="510" y="305" width="100" height="8" rx="4" fill="#b7950b" opacity="0.9"/>
  <text x="520" y="316" fill="#ffffff" font-size="7">Grover Speedup</text>
  <rect x="630" y="305" width="90" height="8" rx="4" fill="#9a7d0a" opacity="0.9"/>
  <text x="640" y="316" fill="#ffffff" font-size="7">Hardware Tests</text>

  <!-- Thrust 5: Formal Verification -->
  <rect x="90" y="375" width="630" height="42" rx="8" fill="url(#thrust5)" opacity="0.85"/>
  <text x="100" y="401" fill="#1a1a2e" font-size="12" font-weight="bold">T5: Formal Verification in Lean 4</text>
  <rect x="90" y="375" width="120" height="8" rx="4" fill="#8e44ad" opacity="0.9"/>
  <text x="100" y="386" fill="#ffffff" font-size="7">Jacobi 4-Square</text>
  <rect x="230" y="375" width="120" height="8" rx="4" fill="#7d3c98" opacity="0.9"/>
  <text x="240" y="386" fill="#ffffff" font-size="7">Quadratic Sieve</text>
  <rect x="380" y="375" width="100" height="8" rx="4" fill="#6c3483" opacity="0.9"/>
  <text x="390" y="386" fill="#ffffff" font-size="7">ECM Correctness</text>
  <rect x="510" y="375" width="120" height="8" rx="4" fill="#5b2c6f" opacity="0.9"/>
  <text x="520" y="386" fill="#ffffff" font-size="7">NFS Formalization</text>
  <rect x="660" y="375" width="60" height="8" rx="4" fill="#4a235a" opacity="0.9"/>
  <text x="665" y="386" fill="#ffffff" font-size="7">Complete</text>

  <!-- Milestones -->
  <circle cx="120" cy="460" r="12" fill="#ff6b6b" opacity="0.9" filter="url(#glow)"/>
  <text x="120" y="464" text-anchor="middle" fill="#1a1a2e" font-size="9" font-weight="bold">M1</text>
  <text x="120" y="485" text-anchor="middle" fill="#ccccdd" font-size="9">Correlation</text>
  <text x="120" y="497" text-anchor="middle" fill="#ccccdd" font-size="9">Paper</text>

  <circle cx="270" cy="460" r="12" fill="#4ecdc4" opacity="0.9" filter="url(#glow)"/>
  <text x="270" y="464" text-anchor="middle" fill="#1a1a2e" font-size="9" font-weight="bold">M2</text>
  <text x="270" y="485" text-anchor="middle" fill="#ccccdd" font-size="9">Fibonacci-</text>
  <text x="270" y="497" text-anchor="middle" fill="#ccccdd" font-size="9">Spectral Result</text>

  <circle cx="420" cy="460" r="12" fill="#45b7d1" opacity="0.9" filter="url(#glow)"/>
  <text x="420" y="464" text-anchor="middle" fill="#1a1a2e" font-size="9" font-weight="bold">M3</text>
  <text x="420" y="485" text-anchor="middle" fill="#ccccdd" font-size="9">MetaDLP</text>
  <text x="420" y="497" text-anchor="middle" fill="#ccccdd" font-size="9">Framework</text>

  <circle cx="570" cy="460" r="12" fill="#f7dc6f" opacity="0.9" filter="url(#glow)"/>
  <text x="570" y="464" text-anchor="middle" fill="#1a1a2e" font-size="9" font-weight="bold">M4</text>
  <text x="570" y="485" text-anchor="middle" fill="#ccccdd" font-size="9">Monograph</text>
  <text x="570" y="497" text-anchor="middle" fill="#ccccdd" font-size="9">Published</text>

  <circle cx="720" cy="460" r="12" fill="#bb8fce" opacity="0.9" filter="url(#glow)"/>
  <text x="720" y="464" text-anchor="middle" fill="#1a1a2e" font-size="9" font-weight="bold">M5</text>
  <text x="720" y="485" text-anchor="middle" fill="#ccccdd" font-size="9">Completeness</text>
  <text x="720" y="497" text-anchor="middle" fill="#ccccdd" font-size="9">Assault</text>

  <!-- Breakthrough zone -->
  <rect x="600" y="530" width="200" height="50" rx="12" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="700" y="552" text-anchor="middle" fill="#ffd700" font-size="11" font-weight="bold">🌟 Breakthrough Zone</text>
  <text x="700" y="570" text-anchor="middle" fill="#ffd700" font-size="9">7-Lens Completeness?</text>

  <!-- Legend -->
  <text x="90" y="555" fill="#aaaacc" font-size="10">Difficulty: </text>
  <text x="150" y="555" fill="#4ecdc4" font-size="10">★★★ Moderate</text>
  <text x="260" y="555" fill="#ff8e8e" font-size="10">★★★★ Hard</text>
  <text x="350" y="555" fill="#f7dc6f" font-size="10">★★★★★ Very Hard</text>
</svg>
