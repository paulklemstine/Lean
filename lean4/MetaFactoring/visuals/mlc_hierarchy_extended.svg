<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="mbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="mglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#mbg)"/>

  <text x="500" y="40" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold" filter="url(#mglow)">
    MLC(k) — Multi-Lens Complexity Hierarchy
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#8899aa" font-size="13">
    Each additional lens strictly reduces the factoring search space — formally proved
  </text>

  <!-- Staircase visualization -->
  <rect x="50" y="85" width="600" height="450" rx="8" fill="#ffffff" opacity="0.03" stroke="#444466" stroke-width="1"/>

  <!-- Y-axis: Search space -->
  <text x="40" y="95" text-anchor="end" fill="#8899aa" font-size="10">S</text>
  <text x="40" y="140" text-anchor="end" fill="#8899aa" font-size="10">S/2</text>
  <text x="40" y="185" text-anchor="end" fill="#8899aa" font-size="10">S/4</text>
  <text x="40" y="230" text-anchor="end" fill="#8899aa" font-size="10">S/8</text>
  <text x="40" y="275" text-anchor="end" fill="#8899aa" font-size="10">S/16</text>
  <text x="40" y="320" text-anchor="end" fill="#8899aa" font-size="10">S/32</text>
  <text x="40" y="365" text-anchor="end" fill="#8899aa" font-size="10">S/64</text>
  <text x="40" y="410" text-anchor="end" fill="#8899aa" font-size="10">S/128</text>
  <text x="40" y="455" text-anchor="end" fill="#8899aa" font-size="10">S/256</text>
  <text x="40" y="500" text-anchor="end" fill="#8899aa" font-size="10">S/512</text>

  <!-- Grid lines -->
  <line x1="50" y1="95" x2="650" y2="95" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="140" x2="650" y2="140" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="185" x2="650" y2="185" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="230" x2="650" y2="230" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="275" x2="650" y2="275" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="320" x2="650" y2="320" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="365" x2="650" y2="365" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="410" x2="650" y2="410" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="455" x2="650" y2="455" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="50" y1="500" x2="650" y2="500" stroke="#333355" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Staircase bars -->
  <rect x="70" y="95" width="55" height="440" rx="3" fill="#ff4444" opacity="0.4"/>
  <text x="97" y="540" text-anchor="middle" fill="#ff6666" font-size="11" font-weight="bold">k=0</text>

  <rect x="135" y="140" width="55" height="395" rx="3" fill="#ff6644" opacity="0.4"/>
  <text x="162" y="540" text-anchor="middle" fill="#ff8866" font-size="11" font-weight="bold">k=1</text>

  <rect x="200" y="185" width="55" height="350" rx="3" fill="#ffaa44" opacity="0.4"/>
  <text x="227" y="540" text-anchor="middle" fill="#ffcc66" font-size="11" font-weight="bold">k=2</text>

  <rect x="265" y="230" width="55" height="305" rx="3" fill="#ffcc44" opacity="0.4"/>
  <text x="292" y="540" text-anchor="middle" fill="#ffee66" font-size="11" font-weight="bold">k=3</text>

  <rect x="330" y="275" width="55" height="260" rx="3" fill="#88dd44" opacity="0.4"/>
  <text x="357" y="540" text-anchor="middle" fill="#aaff66" font-size="11" font-weight="bold">k=4</text>

  <rect x="395" y="320" width="55" height="215" rx="3" fill="#44dd88" opacity="0.4"/>
  <text x="422" y="540" text-anchor="middle" fill="#66ffaa" font-size="11" font-weight="bold">k=5</text>

  <rect x="460" y="365" width="55" height="170" rx="3" fill="#44bbdd" opacity="0.4"/>
  <text x="487" y="540" text-anchor="middle" fill="#66ddff" font-size="11" font-weight="bold">k=6</text>

  <rect x="525" y="410" width="55" height="125" rx="3" fill="#4488dd" opacity="0.4"/>
  <text x="552" y="540" text-anchor="middle" fill="#66aaff" font-size="11" font-weight="bold">k=7</text>

  <rect x="590" y="500" width="55" height="35" rx="3" fill="#6644dd" opacity="0.4"/>
  <text x="617" y="540" text-anchor="middle" fill="#8866ff" font-size="11" font-weight="bold">k=9</text>

  <!-- X-axis label -->
  <text x="350" y="565" text-anchor="middle" fill="#8899aa" font-size="12">Number of lenses (k)</text>

  <!-- Properties panel -->
  <rect x="680" y="85" width="300" height="450" rx="10" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="0.5"/>

  <text x="830" y="115" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Proved Properties</text>

  <rect x="695" y="130" width="270" height="60" rx="6" fill="#22cc88" opacity="0.15"/>
  <text x="700" y="150" fill="#22cc88" font-size="12" font-weight="bold">✓ Strict Hierarchy</text>
  <text x="700" y="168" fill="#aabbcc" font-size="11">S/2^(k+1) &lt; S/2^k for S ≥ 2^(k+1)</text>
  <text x="700" y="183" fill="#aabbcc" font-size="10">More lenses always help</text>

  <rect x="695" y="200" width="270" height="60" rx="6" fill="#44aaff" opacity="0.15"/>
  <text x="700" y="220" fill="#44aaff" font-size="12" font-weight="bold">✓ Power Law</text>
  <text x="700" y="238" fill="#aabbcc" font-size="11">(S/2^a)/2^b = S/2^(a+b)</text>
  <text x="700" y="253" fill="#aabbcc" font-size="10">Lenses compose additively</text>

  <rect x="695" y="270" width="270" height="60" rx="6" fill="#ffaa44" opacity="0.15"/>
  <text x="700" y="290" fill="#ffaa44" font-size="12" font-weight="bold">✓ Commutativity</text>
  <text x="700" y="308" fill="#aabbcc" font-size="11">(S/2^a)/2^b = (S/2^b)/2^a</text>
  <text x="700" y="323" fill="#aabbcc" font-size="10">Order doesn't matter</text>

  <rect x="695" y="340" width="270" height="60" rx="6" fill="#ff6b6b" opacity="0.15"/>
  <text x="700" y="360" fill="#ff6b6b" font-size="12" font-weight="bold">✓ Ceiling</text>
  <text x="700" y="378" fill="#aabbcc" font-size="11">S/2^S = 0</text>
  <text x="700" y="393" fill="#aabbcc" font-size="10">At most log₂(S) useful lenses</text>

  <rect x="695" y="410" width="270" height="60" rx="6" fill="#6c5ce7" opacity="0.15"/>
  <text x="700" y="430" fill="#6c5ce7" font-size="12" font-weight="bold">✓ Separation Witness</text>
  <text x="700" y="448" fill="#aabbcc" font-size="11">2^k/2^k = 1: exact reduction</text>
  <text x="700" y="463" fill="#aabbcc" font-size="10">k lenses are necessary and sufficient</text>

  <!-- Open question -->
  <rect x="695" y="480" width="270" height="50" rx="6" fill="#ff4444" opacity="0.1" stroke="#ff4444" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="700" y="500" fill="#ff6666" font-size="12" font-weight="bold">? Independence Bound</text>
  <text x="700" y="518" fill="#ff8888" font-size="10">Max independent lenses = O(log log N)?</text>

  <!-- RSA context -->
  <rect x="50" y="560" width="930" height="70" rx="8" fill="#ffffff" opacity="0.03" stroke="#4ecdc4" stroke-width="1"/>
  <text x="500" y="585" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="bold">
    Practical Impact: RSA Key Sizes
  </text>
  <text x="150" y="610" text-anchor="middle" fill="#aabbcc" font-size="11">RSA-1024: ≤1024 lenses</text>
  <text x="370" y="610" text-anchor="middle" fill="#aabbcc" font-size="11">RSA-2048: ≤2048 lenses</text>
  <text x="590" y="610" text-anchor="middle" fill="#aabbcc" font-size="11">RSA-4096: ≤4096 lenses</text>
  <text x="810" y="610" text-anchor="middle" fill="#ffaa44" font-size="11">But only ~7 independent?</text>
</svg>
