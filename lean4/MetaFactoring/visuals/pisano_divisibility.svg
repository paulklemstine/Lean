<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="splitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B894"/><stop offset="100%" stop-color="#55EFC4"/>
    </linearGradient>
    <linearGradient id="inertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7"/><stop offset="100%" stop-color="#A29BFE"/>
    </linearGradient>
    <linearGradient id="unifiedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E84393"/><stop offset="100%" stop-color="#FD79A8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="#0a0a1a" rx="10"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">
    Unified Pisano Divisibility Theorem
  </text>
  <text x="400" y="65" text-anchor="middle" fill="#aaa" font-size="14">
    For every prime p ≠ 5: p | F(p² − 1)
  </text>

  <!-- Split Case Box -->
  <rect x="50" y="100" width="320" height="160" rx="10" fill="none" stroke="url(#splitGrad)" stroke-width="2"/>
  <text x="210" y="130" text-anchor="middle" fill="#55EFC4" font-size="16" font-weight="bold">Split Case</text>
  <text x="210" y="155" text-anchor="middle" fill="#aaa" font-size="12">p ≡ ±1 (mod 5)</text>
  <text x="210" y="185" text-anchor="middle" fill="#fff" font-size="14">p | F(p − 1)</text>
  <text x="210" y="210" text-anchor="middle" fill="#aaa" font-size="11">(p−1) | (p²−1) since p²−1 = (p−1)(p+1)</text>
  <text x="210" y="235" text-anchor="middle" fill="#aaa" font-size="11">∴ F(p−1) | F(p²−1) by Fibonacci divisibility</text>
  <text x="210" y="250" text-anchor="middle" fill="#55EFC4" font-size="11">∴ p | F(p²−1) ✓</text>

  <!-- Inert Case Box -->
  <rect x="430" y="100" width="320" height="160" rx="10" fill="none" stroke="url(#inertGrad)" stroke-width="2"/>
  <text x="590" y="130" text-anchor="middle" fill="#A29BFE" font-size="16" font-weight="bold">Inert Case</text>
  <text x="590" y="155" text-anchor="middle" fill="#aaa" font-size="12">p ≡ ±2 (mod 5)</text>
  <text x="590" y="185" text-anchor="middle" fill="#fff" font-size="14">p | F(p + 1)</text>
  <text x="590" y="210" text-anchor="middle" fill="#aaa" font-size="11">(p+1) | (p²−1) since p²−1 = (p−1)(p+1)</text>
  <text x="590" y="235" text-anchor="middle" fill="#aaa" font-size="11">∴ F(p+1) | F(p²−1) by Fibonacci divisibility</text>
  <text x="590" y="250" text-anchor="middle" fill="#A29BFE" font-size="11">∴ p | F(p²−1) ✓</text>

  <!-- Arrows converging -->
  <path d="M 210 265 L 210 310 L 400 340" stroke="#55EFC4" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 590 265 L 590 310 L 400 340" stroke="#A29BFE" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- Key identity -->
  <rect x="200" y="290" width="400" height="30" rx="5" fill="#1a1a2e" stroke="#666" stroke-width="1"/>
  <text x="400" y="310" text-anchor="middle" fill="#fff" font-size="12">
    Key: p² − 1 = (p − 1)(p + 1) and m | n ⟹ F(m) | F(n)
  </text>

  <!-- Unified Result Box -->
  <rect x="150" y="340" width="500" height="80" rx="12" fill="url(#unifiedGrad)" opacity="0.15"
        stroke="url(#unifiedGrad)" stroke-width="2"/>
  <text x="400" y="370" text-anchor="middle" fill="#FD79A8" font-size="18" font-weight="bold">
    Unified Theorem
  </text>
  <text x="400" y="395" text-anchor="middle" fill="#fff" font-size="15">
    ∀ p prime, p ≠ 5 ⟹ p | F(p² − 1)
  </text>
  <text x="400" y="412" text-anchor="middle" fill="#aaa" font-size="11">
    Machine-verified in Lean 4 (pisano_period_divides_p_sq_sub_one)
  </text>

  <!-- Verification table -->
  <text x="400" y="455" text-anchor="middle" fill="#888" font-size="13" font-weight="bold">
    Verification Examples
  </text>

  <!-- Table -->
  <g fill="#aaa" font-size="11">
    <text x="120" y="480" fill="#888">p</text>
    <text x="200" y="480" fill="#888">p mod 5</text>
    <text x="300" y="480" fill="#888">Case</text>
    <text x="400" y="480" fill="#888">π(p)</text>
    <text x="490" y="480" fill="#888">p²−1</text>
    <text x="590" y="480" fill="#888">π(p) | p²−1</text>
    <text x="690" y="480" fill="#888">p | F(p²−1)</text>

    <text x="120" y="500">2</text><text x="200" y="500">2</text><text x="300" y="500" fill="#A29BFE">inert</text>
    <text x="400" y="500">3</text><text x="490" y="500">3</text><text x="590" y="500" fill="#55EFC4">✓</text><text x="690" y="500" fill="#55EFC4">✓</text>

    <text x="120" y="518">3</text><text x="200" y="518">3</text><text x="300" y="518" fill="#A29BFE">inert</text>
    <text x="400" y="518">8</text><text x="490" y="518">8</text><text x="590" y="518" fill="#55EFC4">✓</text><text x="690" y="518" fill="#55EFC4">✓</text>

    <text x="120" y="536">7</text><text x="200" y="536">2</text><text x="300" y="536" fill="#A29BFE">inert</text>
    <text x="400" y="536">16</text><text x="490" y="536">48</text><text x="590" y="536" fill="#55EFC4">✓</text><text x="690" y="536" fill="#55EFC4">✓</text>
  </g>
</svg>
