<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="800" height="450" fill="#0a0a1a" rx="10"/>

  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">
    Quantum-Classical Hybrid Advantage
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#888" font-size="12">
    Classical lenses reduce quantum query complexity: √(S/2^k) ≤ √S
  </text>

  <!-- Chart area -->
  <g transform="translate(80, 80)">
    <!-- Axes -->
    <line x1="0" y1="300" x2="640" y2="300" stroke="#444" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#444" stroke-width="1"/>

    <!-- Y-axis label -->
    <text x="-50" y="150" text-anchor="middle" fill="#888" font-size="12" transform="rotate(-90, -50, 150)">
      Grover Queries (relative)
    </text>

    <!-- X-axis label -->
    <text x="320" y="340" text-anchor="middle" fill="#888" font-size="12">
      Number of Classical Lenses (k)
    </text>

    <!-- Grid lines -->
    <g stroke="#222" stroke-width="0.5">
      <line x1="0" y1="60" x2="640" y2="60"/>
      <line x1="0" y1="120" x2="640" y2="120"/>
      <line x1="0" y1="180" x2="640" y2="180"/>
      <line x1="0" y1="240" x2="640" y2="240"/>
    </g>

    <!-- Y-axis ticks -->
    <text x="-10" y="5" text-anchor="end" fill="#888" font-size="10">100%</text>
    <text x="-10" y="65" text-anchor="end" fill="#888" font-size="10">80%</text>
    <text x="-10" y="125" text-anchor="end" fill="#888" font-size="10">60%</text>
    <text x="-10" y="185" text-anchor="end" fill="#888" font-size="10">40%</text>
    <text x="-10" y="245" text-anchor="end" fill="#888" font-size="10">20%</text>
    <text x="-10" y="305" text-anchor="end" fill="#888" font-size="10">0%</text>

    <!-- Data: √(S/2^k) / √S = 1/2^(k/2) -->
    <!-- k=0: 100%, k=1: 70.7%, k=2: 50%, k=3: 35.4%, k=4: 25%, k=5: 17.7%, k=6: 12.5%, k=7: 8.8% -->
    <polyline points="0,0 45.7,88 91.4,150 137.1,194 182.9,225 228.6,247 274.3,263 320,273 365.7,281 411.4,286 457.1,290 502.9,293 548.6,295 594.3,296 640,297"
             stroke="#48DBFB" stroke-width="3" fill="none"/>

    <!-- Data points -->
    <g fill="#48DBFB">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="45.7" cy="88" r="4"/>
      <circle cx="91.4" cy="150" r="4"/>
      <circle cx="137.1" cy="194" r="4"/>
      <circle cx="182.9" cy="225" r="4"/>
      <circle cx="228.6" cy="247" r="4"/>
      <circle cx="274.3" cy="263" r="4"/>
      <circle cx="320" cy="273" r="5" stroke="#FF6B6B" stroke-width="2"/>
      <circle cx="365.7" cy="281" r="4"/>
      <circle cx="411.4" cy="286" r="4"/>
    </g>

    <!-- X-axis ticks -->
    <g fill="#888" font-size="10" text-anchor="middle">
      <text x="0" y="315">0</text>
      <text x="45.7" y="315">1</text>
      <text x="91.4" y="315">2</text>
      <text x="137.1" y="315">3</text>
      <text x="182.9" y="315">4</text>
      <text x="228.6" y="315">5</text>
      <text x="274.3" y="315">6</text>
      <text x="320" y="315" fill="#FF6B6B" font-weight="bold">7</text>
      <text x="365.7" y="315">8</text>
      <text x="411.4" y="315">9</text>
      <text x="457.1" y="315">10</text>
    </g>

    <!-- Annotation for k=7 -->
    <line x1="320" y1="273" x2="320" y2="300" stroke="#FF6B6B" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="330" y="255" width="190" height="40" rx="5" fill="#1a1a2e" stroke="#FF6B6B" stroke-width="1"/>
    <text x="425" y="272" text-anchor="middle" fill="#FF6B6B" font-size="11" font-weight="bold">k = 7: 11.3× speedup</text>
    <text x="425" y="288" text-anchor="middle" fill="#aaa" font-size="10">128× fewer quantum runs</text>
  </g>

  <!-- Legend -->
  <rect x="500" y="100" width="250" height="120" rx="8" fill="#1a1a2e" stroke="#444" stroke-width="1"/>
  <text x="625" y="122" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Key Results</text>
  <text x="520" y="142" fill="#48DBFB" font-size="10">●</text>
  <text x="535" y="142" fill="#aaa" font-size="10">Relative query count</text>
  <text x="520" y="162" fill="#FF6B6B" font-size="10">●</text>
  <text x="535" y="162" fill="#aaa" font-size="10">7 MetaFactoring lenses</text>
  <text x="520" y="185" fill="#aaa" font-size="10">√(S/2^k) ≤ √S</text>
  <text x="520" y="205" fill="#55EFC4" font-size="10">✓ Formally verified in Lean 4</text>
</svg>
