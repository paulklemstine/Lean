<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="barrier" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E74C3C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#0a0a2e" rx="15"/>

  <text x="400" y="40" text-anchor="middle" fill="white" font-size="22"
        font-family="Georgia, serif" font-weight="bold">
    Division Algebra Dimension Barrier (Hurwitz 1898)
  </text>
  <text x="400" y="65" text-anchor="middle" fill="#aaaacc" font-size="13"
        font-family="Arial">
    Norm-multiplicative composition identities exist ONLY in dimensions 1, 2, 4, 8
  </text>
  <circle cx="100" cy="300" r="20" fill="#666" opacity="0.7"/>
  <text x="100" y="306" text-anchor="middle" fill="white" font-size="17" font-family="Georgia, serif" font-weight="bold">ℝ</text>
  <text x="100" y="265" text-anchor="middle" fill="#666" font-size="16" font-family="Arial" font-weight="bold">dim 1</text>
  <text x="100" y="345" text-anchor="middle" fill="#aaa" font-size="12" font-family="Arial">Reals</text>
  <text x="100" y="362" text-anchor="middle" fill="#888" font-size="11" font-family="Arial">trivial</text>
  <line x1="125" y1="300" x2="230" y2="300" stroke="#555" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="260" cy="300" r="25" fill="#E74C3C" opacity="0.7"/>
  <text x="260" y="306" text-anchor="middle" fill="white" font-size="18" font-family="Georgia, serif" font-weight="bold">ℂ</text>
  <text x="260" y="260" text-anchor="middle" fill="#E74C3C" font-size="16" font-family="Arial" font-weight="bold">dim 2</text>
  <text x="260" y="350" text-anchor="middle" fill="#aaa" font-size="12" font-family="Arial">Complex</text>
  <text x="260" y="367" text-anchor="middle" fill="#888" font-size="11" font-family="Arial">Brahmagupta-</text>
  <text x="260" y="382" text-anchor="middle" fill="#888" font-size="11" font-family="Arial">Fibonacci</text>
  <line x1="290" y1="300" x2="380" y2="300" stroke="#555" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="420" cy="300" r="35" fill="#3498DB" opacity="0.7"/>
  <text x="420" y="306" text-anchor="middle" fill="white" font-size="20" font-family="Georgia, serif" font-weight="bold">ℍ</text>
  <text x="420" y="250" text-anchor="middle" fill="#3498DB" font-size="16" font-family="Arial" font-weight="bold">dim 4</text>
  <text x="420" y="360" text-anchor="middle" fill="#aaa" font-size="12" font-family="Arial">Quaternions</text>
  <text x="420" y="377" text-anchor="middle" fill="#888" font-size="11" font-family="Arial">Euler</text>
  <text x="420" y="392" text-anchor="middle" fill="#888" font-size="11" font-family="Arial">4-square</text>
  <line x1="460" y1="300" x2="520" y2="300" stroke="#555" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="580" cy="300" r="55" fill="#2ECC71" opacity="0.7"/>
  <text x="580" y="306" text-anchor="middle" fill="white" font-size="24" font-family="Georgia, serif" font-weight="bold">𝕆</text>
  <text x="580" y="230" text-anchor="middle" fill="#2ECC71" font-size="16" font-family="Arial" font-weight="bold">dim 8</text>
  <text x="580" y="380" text-anchor="middle" fill="#aaa" font-size="12" font-family="Arial">Octonions</text>
  <text x="580" y="397" text-anchor="middle" fill="#888" font-size="11" font-family="Arial">Degen</text>
  <text x="580" y="412" text-anchor="middle" fill="#888" font-size="11" font-family="Arial">8-square</text>

  <!-- The barrier -->
  <rect x="650" y="100" width="4" height="300" fill="#E74C3C" opacity="0.8"/>
  <rect x="660" y="100" width="120" height="300" fill="url(#barrier)"/>

  <text x="715" y="150" text-anchor="middle" fill="#E74C3C"
        font-size="18" font-family="Georgia, serif" font-weight="bold">BARRIER</text>
  <text x="715" y="175" text-anchor="middle" fill="#E74C3C"
        font-size="12" font-family="Arial">No dim 16</text>
  <text x="715" y="195" text-anchor="middle" fill="#E74C3C"
        font-size="12" font-family="Arial">identity exists</text>

  <text x="715" y="300" text-anchor="middle" fill="#E74C3C"
        font-size="40" font-family="Georgia, serif" opacity="0.5">✕</text>
  <text x="715" y="350" text-anchor="middle" fill="#E74C3C"
        font-size="14" font-family="Arial">dim 16</text>

  <!-- Bottom annotation -->
  <text x="400" y="470" text-anchor="middle" fill="#667eea" font-size="13"
        font-family="Georgia, serif" font-style="italic">
    The 8-dimensional octonion norm channel is the richest possible factoring channel
  </text>
</svg>