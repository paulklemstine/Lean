<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="sglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="url(#sbg)"/>

  <text x="500" y="40" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold" filter="url(#sglow)">
    Smooth Number Landscape: The Foundation of Subexponential Factoring
  </text>

  <!-- Main diagram: Smooth number sieve visualization -->
  <text x="500" y="75" text-anchor="middle" fill="#8899aa" font-size="13">
    B-smooth numbers have all prime factors ≤ B — the key to ECM and GNFS
  </text>

  <!-- Grid of numbers 1-100, colored by smoothness -->
  <text x="50" y="110" fill="#4ecdc4" font-size="14" font-weight="bold">Numbers 1-100 colored by smoothness level</text>

  <!-- Legend -->
  <rect x="600" y="95" width="15" height="15" fill="#22cc88" rx="2"/>
  <text x="620" y="107" fill="#aabbcc" font-size="11">2-smooth</text>
  <rect x="700" y="95" width="15" height="15" fill="#44aaff" rx="2"/>
  <text x="720" y="107" fill="#aabbcc" font-size="11">3-smooth</text>
  <rect x="800" y="95" width="15" height="15" fill="#ffaa44" rx="2"/>
  <text x="820" y="107" fill="#aabbcc" font-size="11">5-smooth</text>
  <rect x="600" y="115" width="15" height="15" fill="#ff6b6b" rx="2"/>
  <text x="620" y="127" fill="#aabbcc" font-size="11">7-smooth</text>
  <rect x="700" y="115" width="15" height="15" fill="#cc88ff" rx="2"/>
  <text x="720" y="127" fill="#aabbcc" font-size="11">11-smooth</text>
  <rect x="800" y="115" width="15" height="15" fill="#555577" rx="2"/>
  <text x="820" y="127" fill="#aabbcc" font-size="11">not 11-smooth</text>

  <!-- Number grid (10×10) -->
  <!-- Row 1: 1-10 -->
  <rect x="55" y="140" width="38" height="28" fill="#22cc88" rx="3"/>
  <text x="74" y="159" text-anchor="middle" fill="#000" font-size="11">1</text>
  <rect x="98" y="140" width="38" height="28" fill="#22cc88" rx="3"/>
  <text x="117" y="159" text-anchor="middle" fill="#000" font-size="11">2</text>
  <rect x="141" y="140" width="38" height="28" fill="#44aaff" rx="3"/>
  <text x="160" y="159" text-anchor="middle" fill="#000" font-size="11">3</text>
  <rect x="184" y="140" width="38" height="28" fill="#22cc88" rx="3"/>
  <text x="203" y="159" text-anchor="middle" fill="#000" font-size="11">4</text>
  <rect x="227" y="140" width="38" height="28" fill="#ffaa44" rx="3"/>
  <text x="246" y="159" text-anchor="middle" fill="#000" font-size="11">5</text>
  <rect x="270" y="140" width="38" height="28" fill="#44aaff" rx="3"/>
  <text x="289" y="159" text-anchor="middle" fill="#000" font-size="11">6</text>
  <rect x="313" y="140" width="38" height="28" fill="#ff6b6b" rx="3"/>
  <text x="332" y="159" text-anchor="middle" fill="#000" font-size="11">7</text>
  <rect x="356" y="140" width="38" height="28" fill="#22cc88" rx="3"/>
  <text x="375" y="159" text-anchor="middle" fill="#000" font-size="11">8</text>
  <rect x="399" y="140" width="38" height="28" fill="#44aaff" rx="3"/>
  <text x="418" y="159" text-anchor="middle" fill="#000" font-size="11">9</text>
  <rect x="442" y="140" width="38" height="28" fill="#ffaa44" rx="3"/>
  <text x="461" y="159" text-anchor="middle" fill="#000" font-size="11">10</text>

  <!-- Row 2: 11-20 -->
  <rect x="55" y="173" width="38" height="28" fill="#cc88ff" rx="3"/>
  <text x="74" y="192" text-anchor="middle" fill="#000" font-size="11">11</text>
  <rect x="98" y="173" width="38" height="28" fill="#44aaff" rx="3"/>
  <text x="117" y="192" text-anchor="middle" fill="#000" font-size="11">12</text>
  <rect x="141" y="173" width="38" height="28" fill="#555577" rx="3"/>
  <text x="160" y="192" text-anchor="middle" fill="#fff" font-size="11">13</text>
  <rect x="184" y="173" width="38" height="28" fill="#ff6b6b" rx="3"/>
  <text x="203" y="192" text-anchor="middle" fill="#000" font-size="11">14</text>
  <rect x="227" y="173" width="38" height="28" fill="#ffaa44" rx="3"/>
  <text x="246" y="192" text-anchor="middle" fill="#000" font-size="11">15</text>
  <rect x="270" y="173" width="38" height="28" fill="#22cc88" rx="3"/>
  <text x="289" y="192" text-anchor="middle" fill="#000" font-size="11">16</text>
  <rect x="313" y="173" width="38" height="28" fill="#555577" rx="3"/>
  <text x="332" y="192" text-anchor="middle" fill="#fff" font-size="11">17</text>
  <rect x="356" y="173" width="38" height="28" fill="#44aaff" rx="3"/>
  <text x="375" y="192" text-anchor="middle" fill="#000" font-size="11">18</text>
  <rect x="399" y="173" width="38" height="28" fill="#555577" rx="3"/>
  <text x="418" y="192" text-anchor="middle" fill="#fff" font-size="11">19</text>
  <rect x="442" y="173" width="38" height="28" fill="#ffaa44" rx="3"/>
  <text x="461" y="192" text-anchor="middle" fill="#000" font-size="11">20</text>

  <!-- Proved Properties Box -->
  <rect x="530" y="140" width="440" height="220" rx="10" fill="#ffffff" opacity="0.05" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="750" y="165" text-anchor="middle" fill="#4ecdc4" font-size="16" font-weight="bold">Formally Proved Properties ✓</text>

  <text x="550" y="190" fill="#88ddaa" font-size="12">✓ Closure: smooth(a) ∧ smooth(b) → smooth(a·b)</text>
  <text x="550" y="212" fill="#88ddaa" font-size="12">✓ Divisor: d | n ∧ smooth(n) → smooth(d)</text>
  <text x="550" y="234" fill="#88ddaa" font-size="12">✓ GCD: smooth(a) → smooth(gcd(a,b))</text>
  <text x="550" y="256" fill="#88ddaa" font-size="12">✓ Monotone: smooth_B(n) ∧ B≤B' → smooth_B'(n)</text>
  <text x="550" y="278" fill="#88ddaa" font-size="12">✓ Prime powers: p^k is p-smooth</text>
  <text x="550" y="300" fill="#88ddaa" font-size="12">✓ Below base: 0 &lt; n ≤ B → B-smooth(n)</text>
  <text x="550" y="322" fill="#88ddaa" font-size="12">✓ Counting: Ψ(N,B) monotone in N and B</text>
  <text x="550" y="344" fill="#88ddaa" font-size="12">✓ Factorial: prime p ≤ B → p | B!</text>

  <!-- Connection to factoring algorithms -->
  <rect x="50" y="390" width="900" height="140" rx="10" fill="#ffffff" opacity="0.05" stroke="#ffa500" stroke-width="1.5"/>
  <text x="500" y="420" text-anchor="middle" fill="#ffa500" font-size="16" font-weight="bold">
    How Smooth Numbers Enable Factoring
  </text>

  <!-- ECM -->
  <rect x="70" y="435" width="260" height="80" rx="8" fill="#ff6b6b" opacity="0.15"/>
  <text x="200" y="460" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">ECM (Elliptic Curve Method)</text>
  <text x="200" y="480" text-anchor="middle" fill="#aabbcc" font-size="11">If p-1 is B-smooth, then</text>
  <text x="200" y="496" text-anchor="middle" fill="#aabbcc" font-size="11">(p-1) | B! → detect via gcd</text>

  <!-- GNFS -->
  <rect x="350" y="435" width="280" height="80" rx="8" fill="#44aaff" opacity="0.15"/>
  <text x="490" y="460" text-anchor="middle" fill="#44aaff" font-size="13" font-weight="bold">GNFS (General Number Field Sieve)</text>
  <text x="490" y="480" text-anchor="middle" fill="#aabbcc" font-size="11">Find B-smooth values of f(a,b)</text>
  <text x="490" y="496" text-anchor="middle" fill="#aabbcc" font-size="11">Complexity: exp(c · (ln N)^{1/3})</text>

  <!-- QS -->
  <rect x="650" y="435" width="280" height="80" rx="8" fill="#22cc88" opacity="0.15"/>
  <text x="790" y="460" text-anchor="middle" fill="#22cc88" font-size="13" font-weight="bold">Quadratic Sieve</text>
  <text x="790" y="480" text-anchor="middle" fill="#aabbcc" font-size="11">Find x² ≡ smooth (mod N)</text>
  <text x="790" y="496" text-anchor="middle" fill="#aabbcc" font-size="11">Build congruence of squares</text>

  <!-- Density chart -->
  <rect x="50" y="550" width="900" height="130" rx="10" fill="#ffffff" opacity="0.05" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="500" y="575" text-anchor="middle" fill="#6c5ce7" font-size="14" font-weight="bold">
    Smooth Number Density Ψ(N, B)/N vs log(N)/log(B)
  </text>

  <!-- Approximate density curve -->
  <line x1="100" y1="660" x2="900" y2="660" stroke="#444466" stroke-width="1"/>
  <line x1="100" y1="590" x2="100" y2="660" stroke="#444466" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="500" y="680" text-anchor="middle" fill="#8899aa" font-size="11">u = log(N)/log(B)</text>
  <text x="80" y="625" text-anchor="middle" fill="#8899aa" font-size="11" transform="rotate(-90, 80, 625)">ρ(u)</text>

  <!-- Density curve (Dickman function approximation) -->
  <polyline points="100,595 200,595 300,600 400,615 500,632 600,645 700,652 800,657 900,659"
            stroke="#6c5ce7" stroke-width="2.5" fill="none" filter="url(#sglow)"/>

  <!-- Annotations -->
  <text x="150" y="592" fill="#6c5ce7" font-size="10">u=1: ρ=1</text>
  <text x="350" y="610" fill="#6c5ce7" font-size="10">u=3: ρ≈0.05</text>
  <text x="600" y="640" fill="#6c5ce7" font-size="10">u=6: ρ≈10⁻⁴</text>

  <text x="500" y="698" text-anchor="middle" fill="#555577" font-size="10">
    The Dickman function ρ(u) governs smooth number density — key open direction for formalization
  </text>
</svg>
