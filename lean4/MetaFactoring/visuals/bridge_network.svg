  <text x="750" y="405" text-anchor="middle" fill="white" font-size="14" font-family="Georgia" opacity="0.7">L4</text>
  <circle cx="620" cy="540" r="35" fill="#3498DB" opacity="0.8" filter="url(#glow2)"/>
  <text x="620" y="535" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">Division</text>
  <text x="620" y="549" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">Algebra</text>
  <text x="620" y="565" text-anchor="middle" fill="white" font-size="14" font-family="Georgia" opacity="0.7">L5</text>
  <circle cx="280" cy="540" r="35" fill="#9B59B6" opacity="0.8" filter="url(#glow2)"/>
