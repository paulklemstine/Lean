<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700" />
      <stop offset="100%" style="stop-color:#FFA500" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="650" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="url(#gold)" font-size="22" font-weight="bold">The MetaFactoring Multi-Lens Hierarchy</text>
  <text x="450" y="70" text-anchor="middle" fill="#aab" font-size="13">MLC(k): Graded Monoid Structure with 9 Independent Lenses</text>

  <!-- Main pyramid -->
  <!-- Level 0: Full search space -->
  <rect x="50" y="95" width="800" height="42" rx="6" fill="#2a2a5a" stroke="#556" stroke-width="1"/>
  <text x="70" y="121" fill="#fff" font-size="14" font-weight="bold">MLC(0)</text>
  <text x="200" y="121" fill="#ccc" font-size="13">Full search space S — no lenses applied</text>
  <text x="800" y="121" fill="#8f8" font-size="13" text-anchor="end">S</text>

  <!-- Level 1 -->
  <rect x="80" y="145" width="740" height="42" rx="6" fill="#2e2e64" stroke="#668" stroke-width="1"/>
  <text x="100" y="171" fill="#fff" font-size="14" font-weight="bold">MLC(1)</text>
  <text x="200" y="171" fill="#ccc" font-size="13">① Fibonacci-Zeckendorf lens (Combinatorics)</text>
  <text x="770" y="171" fill="#8f8" font-size="13" text-anchor="end">S/2</text>

  <!-- Level 2 -->
  <rect x="110" y="195" width="680" height="42" rx="6" fill="#32326e" stroke="#77a" stroke-width="1"/>
  <text x="130" y="221" fill="#fff" font-size="14" font-weight="bold">MLC(2)</text>
  <text x="230" y="221" fill="#ccc" font-size="13">② + Hyperbolic-Geometric (Analytic Geometry)</text>
  <text x="740" y="221" fill="#8f8" font-size="13" text-anchor="end">S/4</text>

  <!-- Level 3 -->
  <rect x="140" y="245" width="620" height="42" rx="6" fill="#363678" stroke="#88b" stroke-width="1"/>
  <text x="160" y="271" fill="#fff" font-size="14" font-weight="bold">MLC(3)</text>
  <text x="260" y="271" fill="#ccc" font-size="13">③ + Orbit-Dynamical (Dynamical Systems)</text>
  <text x="710" y="271" fill="#8f8" font-size="13" text-anchor="end">S/8</text>

  <!-- Level 4 -->
  <rect x="170" y="295" width="560" height="42" rx="6" fill="#3a3a82" stroke="#99c" stroke-width="1"/>
  <text x="190" y="321" fill="#fff" font-size="14" font-weight="bold">MLC(4)</text>
  <text x="290" y="321" fill="#ccc" font-size="13">④ + Spectral-Harmonic (Harmonic Analysis)</text>
  <text x="680" y="321" fill="#8f8" font-size="13" text-anchor="end">S/16</text>

  <!-- Level 5 -->
  <rect x="200" y="345" width="500" height="42" rx="6" fill="#3e3e8c" stroke="#aad" stroke-width="1"/>
  <text x="220" y="371" fill="#fff" font-size="14" font-weight="bold">MLC(5)</text>
  <text x="320" y="371" fill="#ccc" font-size="13">⑤ + Division-Algebra (Abstract Algebra)</text>
  <text x="650" y="371" fill="#8f8" font-size="13" text-anchor="end">S/32</text>

  <!-- Level 6 -->
  <rect x="230" y="395" width="440" height="42" rx="6" fill="#424296" stroke="#bbf" stroke-width="1"/>
  <text x="250" y="421" fill="#fff" font-size="14" font-weight="bold">MLC(6)</text>
  <text x="350" y="421" fill="#ccc" font-size="13">⑥ + Lattice-Reduction (Geometry)</text>
  <text x="620" y="421" fill="#8f8" font-size="13" text-anchor="end">S/64</text>

  <!-- Level 7 -->
  <rect x="260" y="445" width="380" height="42" rx="6" fill="#4646a0" stroke="#ccf" stroke-width="1"/>
  <text x="280" y="471" fill="#fff" font-size="14" font-weight="bold">MLC(7)</text>
  <text x="370" y="471" fill="#ccc" font-size="13">⑦ + Congruence-of-Squares</text>
  <text x="590" y="471" fill="#8f8" font-size="13" text-anchor="end">S/128</text>

  <!-- Level 8 -->
  <rect x="290" y="495" width="320" height="42" rx="6" fill="#4a4aaa" stroke="#ddf" stroke-width="1"/>
  <text x="310" y="521" fill="#fff" font-size="14" font-weight="bold">MLC(8)</text>
  <text x="390" y="521" fill="#ccc" font-size="13">⑧ + Tropical (Alg. Geom.)</text>
  <text x="560" y="521" fill="#8f8" font-size="13" text-anchor="end">S/256</text>

  <!-- Level 9 -->
  <rect x="320" y="545" width="260" height="42" rx="6" fill="#5050bb" stroke="#eef" stroke-width="2" filter="url(#glow)"/>
  <text x="340" y="571" fill="#FFD700" font-size="14" font-weight="bold">MLC(9)</text>
  <text x="420" y="571" fill="#fff" font-size="13">⑨ + Elliptic Curve</text>
  <text x="535" y="571" fill="#FFD700" font-size="13" text-anchor="end">S/512</text>

  <!-- Footer -->
  <text x="450" y="615" text-anchor="middle" fill="#aab" font-size="12">S/2ᵃ/2ᵇ = S/2ᵃ⁺ᵇ — Commutative Monoid under Composition</text>
  <text x="450" y="635" text-anchor="middle" fill="#889" font-size="11">Each level provides 1 bit of information • Strict separation: MLC(k+1) &lt; MLC(k) for S ≥ 2ᵏ⁺¹</text>
</svg>
