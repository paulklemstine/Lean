<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2838;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="center_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">The Seven Lenses of MetaFactoring</text>
  <text x="400" y="70" text-anchor="middle" fill="#8899bb" font-size="12">Each lens reveals structure invisible to the others</text>

  <!-- Central glow -->
  <circle cx="400" cy="420" r="200" fill="url(#center_glow)"/>

  <!-- Center: N = p × q -->
  <circle cx="400" cy="420" r="60" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="400" cy="420" r="50" fill="#1b2838" stroke="#ffffff" stroke-width="1"/>
  <text x="400" y="412" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">N = p × q</text>
  <text x="400" y="432" text-anchor="middle" fill="#8899bb" font-size="11">Find p, q</text>

  <!-- Lens 1: Fibonacci-Zeckendorf (top) -->
  <g>
    <line x1="400" y1="360" x2="400" y2="190" stroke="#ff6b6b" stroke-width="2" opacity="0.5"/>
    <circle cx="400" cy="160" r="45" fill="#ff6b6b" opacity="0.15" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="400" y="145" text-anchor="middle" fill="#ff6b6b" font-size="20">🌀</text>
    <text x="400" y="165" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="bold">Fibonacci</text>
    <text x="400" y="178" text-anchor="middle" fill="#ff8888" font-size="8">F(k+2) &lt; 2^k</text>
    <text x="400" y="115" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">LENS 1</text>
  </g>

  <!-- Lens 2: Hyperbolic (top-right) -->
  <g>
    <line x1="445" y1="375" x2="590" y2="220" stroke="#ffd93d" stroke-width="2" opacity="0.5"/>
    <circle cx="615" cy="195" r="45" fill="#ffd93d" opacity="0.15" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="615" y="180" text-anchor="middle" fill="#ffd93d" font-size="20">📐</text>
    <text x="615" y="200" text-anchor="middle" fill="#ffd93d" font-size="10" font-weight="bold">Hyperbolic</text>
    <text x="615" y="213" text-anchor="middle" fill="#ffe066" font-size="8">xy = N curve</text>
    <text x="615" y="152" text-anchor="middle" fill="#ffd93d" font-size="9" font-weight="bold">LENS 2</text>
  </g>

  <!-- Lens 3: Orbit-Dynamical (right) -->
  <g>
    <line x1="460" y1="420" x2="620" y2="420" stroke="#6bcb77" stroke-width="2" opacity="0.5"/>
    <circle cx="660" cy="420" r="45" fill="#6bcb77" opacity="0.15" stroke="#6bcb77" stroke-width="1.5"/>
    <text x="660" y="405" text-anchor="middle" fill="#6bcb77" font-size="20">🔄</text>
    <text x="660" y="425" text-anchor="middle" fill="#6bcb77" font-size="10" font-weight="bold">Orbit</text>
    <text x="660" y="438" text-anchor="middle" fill="#88dd99" font-size="8">x↦x² mod N</text>
    <text x="660" y="377" text-anchor="middle" fill="#6bcb77" font-size="9" font-weight="bold">LENS 3</text>
  </g>

  <!-- Lens 4: Spectral-Harmonic (bottom-right) -->
  <g>
    <line x1="445" y1="465" x2="590" y2="620" stroke="#4ecdc4" stroke-width="2" opacity="0.5"/>
    <circle cx="615" cy="645" r="45" fill="#4ecdc4" opacity="0.15" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="615" y="630" text-anchor="middle" fill="#4ecdc4" font-size="20">🌈</text>
    <text x="615" y="650" text-anchor="middle" fill="#4ecdc4" font-size="10" font-weight="bold">Spectral</text>
    <text x="615" y="663" text-anchor="middle" fill="#66ddd4" font-size="8">a^p ≡ a mod p</text>
    <text x="615" y="602" text-anchor="middle" fill="#4ecdc4" font-size="9" font-weight="bold">LENS 4</text>
  </g>

  <!-- Lens 5: Division Algebra (bottom) -->
  <g>
    <line x1="400" y1="480" x2="400" y2="640" stroke="#a55eea" stroke-width="2" opacity="0.5"/>
    <circle cx="400" cy="680" r="45" fill="#a55eea" opacity="0.15" stroke="#a55eea" stroke-width="1.5"/>
    <text x="400" y="665" text-anchor="middle" fill="#a55eea" font-size="20">🔮</text>
    <text x="400" y="685" text-anchor="middle" fill="#a55eea" font-size="10" font-weight="bold">Div. Algebra</text>
    <text x="400" y="698" text-anchor="middle" fill="#bb77ff" font-size="8">ℂ, ℍ, 𝕆 norms</text>
    <text x="400" y="637" text-anchor="middle" fill="#a55eea" font-size="9" font-weight="bold">LENS 5</text>
  </g>

  <!-- Lens 6: Lattice (bottom-left) -->
  <g>
    <line x1="355" y1="465" x2="210" y2="620" stroke="#ff9ff3" stroke-width="2" opacity="0.5"/>
    <circle cx="185" cy="645" r="45" fill="#ff9ff3" opacity="0.15" stroke="#ff9ff3" stroke-width="1.5"/>
    <text x="185" y="630" text-anchor="middle" fill="#ff9ff3" font-size="20">📊</text>
    <text x="185" y="650" text-anchor="middle" fill="#ff9ff3" font-size="10" font-weight="bold">Lattice</text>
    <text x="185" y="663" text-anchor="middle" fill="#ffaaee" font-size="8">LLL short vectors</text>
    <text x="185" y="602" text-anchor="middle" fill="#ff9ff3" font-size="9" font-weight="bold">LENS 6</text>
  </g>

  <!-- Lens 7: Congruence of Squares (left) -->
  <g>
    <line x1="340" y1="420" x2="180" y2="420" stroke="#54a0ff" stroke-width="2" opacity="0.5"/>
    <circle cx="140" cy="420" r="45" fill="#54a0ff" opacity="0.15" stroke="#54a0ff" stroke-width="1.5"/>
    <text x="140" y="405" text-anchor="middle" fill="#54a0ff" font-size="20">⚡</text>
    <text x="140" y="425" text-anchor="middle" fill="#54a0ff" font-size="10" font-weight="bold">x² ≡ y²</text>
    <text x="140" y="438" text-anchor="middle" fill="#77bbff" font-size="8">gcd(x-y, N)</text>
    <text x="140" y="377" text-anchor="middle" fill="#54a0ff" font-size="9" font-weight="bold">LENS 7</text>
  </g>

  <!-- Lens 8 (future): top-left -->
  <g opacity="0.4">
    <line x1="355" y1="375" x2="210" y2="220" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
    <circle cx="185" cy="195" r="40" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="185" y="190" text-anchor="middle" fill="#888" font-size="10">ECM?</text>
    <text x="185" y="205" text-anchor="middle" fill="#888" font-size="8">Future Lens 8</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 740)">
    <rect x="0" y="0" width="760" height="45" rx="6" fill="#ffffff" opacity="0.05"/>
    <text x="20" y="18" fill="#ffffff" font-size="10" font-weight="bold">Reduction: S → S / 2⁷ = S / 128</text>
    <text x="20" y="35" fill="#8899bb" font-size="9">Each lens independently constrains the search space. Combined: exponential advantage.</text>
    <text x="660" y="28" fill="#27ae60" font-size="11" font-weight="bold">✓ Verified</text>
  </g>
</svg>
