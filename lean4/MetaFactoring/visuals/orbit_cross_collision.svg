<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#161b22" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="url(#bg5)" rx="12"/>

  <text x="400" y="30" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="bold">Cross-Collision Orbit Structure</text>
  <text x="400" y="50" text-anchor="middle" fill="#8b949e" font-size="12">Discovery 3: Tail + Cycle Decomposition (Pigeonhole Principle)</text>

  <!-- Orbit diagram -->
  <g transform="translate(50, 120)">
    <!-- Tail nodes -->
    <circle cx="0" cy="0" r="18" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#58a6ff" font-size="13">x₀</text>

    <line x1="18" y1="0" x2="62" y2="0" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

    <circle cx="80" cy="0" r="18" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
    <text x="80" y="5" text-anchor="middle" fill="#58a6ff" font-size="13">x₁</text>

    <line x1="98" y1="0" x2="142" y2="0" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

    <circle cx="160" cy="0" r="18" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
    <text x="160" y="5" text-anchor="middle" fill="#58a6ff" font-size="13">x₂</text>

    <line x1="178" y1="0" x2="222" y2="0" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Tail label -->
    <text x="120" y="-35" text-anchor="middle" fill="#8b949e" font-size="11">Tail (pre-periodic)</text>
    <line x1="0" y1="-25" x2="240" y2="-25" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="3,3"/>

    <!-- Cycle entry -->
    <circle cx="260" cy="0" r="20" fill="#1c2333" stroke="#e94560" stroke-width="2.5"/>
    <text x="260" y="5" text-anchor="middle" fill="#e94560" font-size="13" font-weight="bold">xᵢ</text>

    <!-- Cycle nodes -->
    <path d="M 278 -8 Q 340 -80 400 -40" fill="none" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <circle cx="410" cy="-40" r="18" fill="#1c2333" stroke="#e94560" stroke-width="2"/>
    <text x="410" y="-35" text-anchor="middle" fill="#e94560" font-size="12">xᵢ₊₁</text>

    <path d="M 428 -40 Q 480 -60 500 -10" fill="none" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <circle cx="505" cy="0" r="18" fill="#1c2333" stroke="#e94560" stroke-width="2"/>
    <text x="505" y="5" text-anchor="middle" fill="#e94560" font-size="12">xᵢ₊₂</text>

    <path d="M 518 12 Q 540 80 460 80" fill="none" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <circle cx="450" cy="80" r="18" fill="#1c2333" stroke="#e94560" stroke-width="2"/>
    <text x="450" y="85" text-anchor="middle" fill="#e94560" font-size="12">xᵢ₊₃</text>

    <path d="M 432 80 Q 340 100 280 18" fill="none" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- Cycle label -->
    <text x="420" y="-80" text-anchor="middle" fill="#e94560" font-size="11">Cycle (period T = j - i)</text>

    <!-- Collision annotation -->
    <text x="260" y="60" text-anchor="middle" fill="#FFD700" font-size="11">f^[i](x₀) = f^[j](x₀)</text>
    <text x="260" y="75" text-anchor="middle" fill="#FFD700" font-size="10">↓ Cross-collision!</text>
  </g>

  <!-- Theorems box -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="700" height="80" rx="8" fill="#161b2e" stroke="#30363d"/>
    <text x="20" y="22" fill="#58a6ff" font-size="12" font-weight="bold">Formal Results (Machine-Verified):</text>
    <text x="20" y="42" fill="#8b949e" font-size="11">• orbit_revisit: ∃ i j, i &lt; j ∧ j ≤ n ∧ f^[i] x = f^[j] x  (Pigeonhole)</text>
    <text x="20" y="58" fill="#8b949e" font-size="11">• cross_collision_period: f^[i + k·(j-i)] x = f^[i] x  for all k  (Periodicity)</text>
    <text x="20" y="74" fill="#8b949e" font-size="11">• Applications: Pollard's ρ (O(√p)), Brent's algorithm, Floyd's tortoise-and-hare</text>
  </g>
</svg>
