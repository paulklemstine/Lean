<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="thrust1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b" />
      <stop offset="100%" style="stop-color:#ee5a24" />
    </linearGradient>
    <linearGradient id="thrust2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd93d" />
      <stop offset="100%" style="stop-color:#f9ca24" />
    </linearGradient>
    <linearGradient id="thrust3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6bcb77" />
      <stop offset="100%" style="stop-color:#38ada9" />
    </linearGradient>
    <linearGradient id="thrust4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4" />
      <stop offset="100%" style="stop-color:#3742fa" />
    </linearGradient>
    <linearGradient id="thrust5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a55eea" />
      <stop offset="100%" style="stop-color:#8854d0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">MetaFactoring: Research Roadmap</text>
  <text x="450" y="70" text-anchor="middle" fill="#8899bb" font-size="13">Five Research Thrusts • 31 Machine-Verified Theorems • Lean 4 + Mathlib</text>

  <!-- Central hub -->
  <circle cx="450" cy="340" r="55" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <circle cx="450" cy="340" r="45" fill="#1a1a4e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="450" y="332" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">META</text>
  <text x="450" y="348" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">FACTORING</text>

  <!-- Thrust I: Constraint Intersection -->
  <g transform="translate(120, 150)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="url(#thrust1)" opacity="0.9"/>
    <text x="100" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">THRUST I</text>
    <text x="100" y="42" text-anchor="middle" fill="#fff" font-size="10">Constraint Intersection</text>
    <line x1="10" y1="50" x2="190" y2="50" stroke="#fff" opacity="0.3"/>
    <text x="100" y="65" text-anchor="middle" fill="#fff" font-size="9">• Multi-lens advantage: 2^k</text>
    <text x="100" y="78" text-anchor="middle" fill="#fff" font-size="9">• Independence quantification</text>
    <text x="100" y="91" text-anchor="middle" fill="#fff" font-size="9">• Bayesian lens selection</text>
  </g>
  <line x1="320" y1="200" x2="410" y2="310" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>

  <!-- Thrust II: Fibonacci-Spectral -->
  <g transform="translate(580, 120)">
    <rect x="0" y="0" width="200" height="110" rx="10" fill="url(#thrust2)" opacity="0.9"/>
    <text x="100" y="25" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">THRUST II</text>
    <text x="100" y="42" text-anchor="middle" fill="#333" font-size="10">Fibonacci-Spectral Duality</text>
    <line x1="10" y1="50" x2="190" y2="50" stroke="#333" opacity="0.3"/>
    <text x="100" y="65" text-anchor="middle" fill="#333" font-size="9">• Pisano period: π(p) | p²−1</text>
    <text x="100" y="78" text-anchor="middle" fill="#333" font-size="9">• Split/inert prime cases</text>
    <text x="100" y="91" text-anchor="middle" fill="#333" font-size="9">• Cassini's identity verified</text>
    <text x="100" y="104" text-anchor="middle" fill="#333" font-size="9">• Zeckendorf spread conjecture</text>
  </g>
  <line x1="580" y1="175" x2="495" y2="310" stroke="#ffd93d" stroke-width="1.5" opacity="0.6"/>

  <!-- Thrust III: Division Algebras -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="210" height="110" rx="10" fill="url(#thrust3)" opacity="0.9"/>
    <text x="105" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">THRUST III</text>
    <text x="105" y="42" text-anchor="middle" fill="#fff" font-size="10">Division Algebra Hierarchy</text>
    <line x1="10" y1="50" x2="200" y2="50" stroke="#fff" opacity="0.3"/>
    <text x="105" y="65" text-anchor="middle" fill="#fff" font-size="9">• Dim 2,4,8 identities verified</text>
    <text x="105" y="78" text-anchor="middle" fill="#fff" font-size="9">• Fermat + Lagrange theorems</text>
    <text x="105" y="91" text-anchor="middle" fill="#fff" font-size="9">• Cayley-Dickson extensions</text>
    <text x="105" y="104" text-anchor="middle" fill="#fff" font-size="9">• Quaternionic factoring</text>
  </g>
  <line x1="270" y1="435" x2="405" y2="360" stroke="#6bcb77" stroke-width="1.5" opacity="0.6"/>

  <!-- Thrust IV: Quantum -->
  <g transform="translate(620, 350)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="url(#thrust4)" opacity="0.9"/>
    <text x="100" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">THRUST IV</text>
    <text x="100" y="42" text-anchor="middle" fill="#fff" font-size="10">Quantum MetaFactoring</text>
    <line x1="10" y1="50" x2="190" y2="50" stroke="#fff" opacity="0.3"/>
    <text x="100" y="65" text-anchor="middle" fill="#fff" font-size="9">• Shor as quantum lens</text>
    <text x="100" y="78" text-anchor="middle" fill="#fff" font-size="9">• Birthday bound verified</text>
    <text x="100" y="91" text-anchor="middle" fill="#fff" font-size="9">• Hybrid classical-quantum</text>
  </g>
  <line x1="620" y1="400" x2="500" y2="360" stroke="#4ecdc4" stroke-width="1.5" opacity="0.6"/>

  <!-- Thrust V: Adjacent -->
  <g transform="translate(330, 520)">
    <rect x="0" y="0" width="240" height="100" rx="10" fill="url(#thrust5)" opacity="0.9"/>
    <text x="120" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">THRUST V</text>
    <text x="120" y="42" text-anchor="middle" fill="#fff" font-size="10">Adjacent Problems</text>
    <line x1="10" y1="50" x2="230" y2="50" stroke="#fff" opacity="0.3"/>
    <text x="120" y="65" text-anchor="middle" fill="#fff" font-size="9">• MetaDLP: Discrete logarithm multi-lens</text>
    <text x="120" y="78" text-anchor="middle" fill="#fff" font-size="9">• MetaLattice: SVP/CVP improvements</text>
    <text x="120" y="91" text-anchor="middle" fill="#fff" font-size="9">• Multi-lens primality proving</text>
  </g>
  <line x1="450" y1="520" x2="450" y2="395" stroke="#a55eea" stroke-width="1.5" opacity="0.6"/>

  <!-- Verified badge -->
  <g transform="translate(20, 590)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#27ae60" opacity="0.8"/>
    <text x="90" y="17" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">✓ FORMALLY VERIFIED</text>
    <text x="90" y="32" text-anchor="middle" fill="#fff" font-size="9">31 theorems • 0 sorry</text>
  </g>

  <!-- Stars/decoration -->
  <circle cx="50" cy="50" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="150" cy="80" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="830" cy="40" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="750" cy="90" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="870" cy="580" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="30" cy="300" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="880" cy="250" r="1" fill="#fff" opacity="0.3"/>
</svg>
