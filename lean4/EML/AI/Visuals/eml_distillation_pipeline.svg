<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="400" fill="url(#bg4)"/>
  
  <text x="450" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">
    Neural Network → EML Distillation Pipeline
  </text>
  
  <!-- Step 1: Neural Network -->
  <g transform="translate(30, 60)">
    <rect width="150" height="120" rx="10" fill="#1a1a3e" stroke="#ff6b6b" stroke-width="2"/>
    <text x="75" y="20" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">Step 1</text>
    <text x="75" y="38" text-anchor="middle" fill="#ccc" font-size="11">Trained NN</text>
    <!-- Mini NN diagram -->
    <circle cx="40" cy="60" r="6" fill="#ff6b6b" opacity="0.5"/>
    <circle cx="40" cy="80" r="6" fill="#ff6b6b" opacity="0.5"/>
    <circle cx="40" cy="100" r="6" fill="#ff6b6b" opacity="0.5"/>
    <circle cx="75" cy="65" r="6" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="75" cy="85" r="6" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="110" cy="75" r="6" fill="#ff6b6b"/>
    <line x1="46" y1="60" x2="69" y2="65" stroke="#ff6b6b44" stroke-width="1"/>
    <line x1="46" y1="80" x2="69" y2="65" stroke="#ff6b6b44" stroke-width="1"/>
    <line x1="46" y1="100" x2="69" y2="85" stroke="#ff6b6b44" stroke-width="1"/>
    <line x1="81" y1="65" x2="104" y2="75" stroke="#ff6b6b44" stroke-width="1"/>
    <line x1="81" y1="85" x2="104" y2="75" stroke="#ff6b6b44" stroke-width="1"/>
    <text x="75" y="115" text-anchor="middle" fill="#888" font-size="9">50,000 params</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(185, 110)">
    <line x1="0" y1="10" x2="50" y2="10" stroke="#555" stroke-width="2"/>
    <polygon points="50,5 60,10 50,15" fill="#555"/>
    <text x="30" y="0" text-anchor="middle" fill="#888" font-size="8">teacher</text>
  </g>
  
  <!-- Step 2: Dense Data -->
  <g transform="translate(250, 60)">
    <rect width="140" height="120" rx="10" fill="#1a1a3e" stroke="#ffcc00" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" fill="#ffcc00" font-size="13" font-weight="bold">Step 2</text>
    <text x="70" y="38" text-anchor="middle" fill="#ccc" font-size="11">Dense Data</text>
    <!-- Data points -->
    <g fill="#ffcc00" opacity="0.6">
      <circle cx="30" cy="55" r="2"/><circle cx="40" cy="70" r="2"/>
      <circle cx="50" cy="60" r="2"/><circle cx="60" cy="85" r="2"/>
      <circle cx="70" cy="75" r="2"/><circle cx="80" cy="65" r="2"/>
      <circle cx="90" cy="90" r="2"/><circle cx="100" cy="55" r="2"/>
      <circle cx="35" cy="80" r="2"/><circle cx="55" cy="95" r="2"/>
      <circle cx="75" cy="50" r="2"/><circle cx="95" cy="70" r="2"/>
      <circle cx="45" cy="85" r="2"/><circle cx="85" cy="60" r="2"/>
      <circle cx="65" cy="100" r="2"/><circle cx="105" cy="80" r="2"/>
    </g>
    <text x="70" y="115" text-anchor="middle" fill="#888" font-size="9">10,000 points</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(395, 110)">
    <line x1="0" y1="10" x2="50" y2="10" stroke="#555" stroke-width="2"/>
    <polygon points="50,5 60,10 50,15" fill="#555"/>
    <text x="30" y="0" text-anchor="middle" fill="#888" font-size="8">MCTS</text>
  </g>
  
  <!-- Step 3: EML Tree -->
  <g transform="translate(460, 60)">
    <rect width="150" height="120" rx="10" fill="#1a1a3e" stroke="#00ff88" stroke-width="2"/>
    <text x="75" y="20" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="bold">Step 3</text>
    <text x="75" y="38" text-anchor="middle" fill="#ccc" font-size="11">EML Tree</text>
    <!-- Mini tree -->
    <circle cx="75" cy="55" r="8" fill="#00ff88" opacity="0.8"/>
    <text x="75" y="58" text-anchor="middle" fill="#000" font-size="8">eml</text>
    <line x1="67" y1="63" x2="50" y2="78" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="83" y1="63" x2="100" y2="78" stroke="#00ff88" stroke-width="1.5"/>
    <circle cx="50" cy="82" r="6" fill="#00ff8866"/>
    <text x="50" y="85" text-anchor="middle" fill="#fff" font-size="7">x</text>
    <circle cx="100" cy="82" r="8" fill="#00ff88" opacity="0.8"/>
    <text x="100" y="85" text-anchor="middle" fill="#000" font-size="8">eml</text>
    <line x1="92" y1="90" x2="80" y2="100" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="108" y1="90" x2="120" y2="100" stroke="#00ff88" stroke-width="1.5"/>
    <circle cx="80" cy="104" r="5" fill="#00ff8866"/>
    <circle cx="120" cy="104" r="5" fill="#00ff8866"/>
    <text x="75" y="115" text-anchor="middle" fill="#888" font-size="9">4 leaves = 196 bytes</text>
  </g>
  
  <!-- Arrow 3 -->
  <g transform="translate(615, 110)">
    <line x1="0" y1="10" x2="50" y2="10" stroke="#555" stroke-width="2"/>
    <polygon points="50,5 60,10 50,15" fill="#555"/>
    <text x="30" y="0" text-anchor="middle" fill="#888" font-size="8">readout</text>
  </g>
  
  <!-- Step 4: Formula -->
  <g transform="translate(670, 60)">
    <rect width="200" height="120" rx="10" fill="#1a1a3e" stroke="#00d4ff" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="bold">Step 4</text>
    <text x="100" y="38" text-anchor="middle" fill="#ccc" font-size="11">Exact Formula</text>
    <text x="100" y="65" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold">
      f(x) = e^(2.1x)
    </text>
    <text x="100" y="82" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold">
      − ln(x + 0.5)
    </text>
    <text x="100" y="105" text-anchor="middle" fill="#888" font-size="9">Human-readable</text>
    <text x="100" y="115" text-anchor="middle" fill="#888" font-size="9">Formally verifiable</text>
  </g>
  
  <!-- Bottom: Compression stats -->
  <g transform="translate(50, 210)">
    <rect width="800" height="55" rx="8" fill="#111133" stroke="#333"/>
    <text x="400" y="20" text-anchor="middle" fill="#ffcc00" font-size="14" font-weight="bold">
      Compression: 50,000 NN parameters → 4 EML leaves = 250× reduction
    </text>
    <text x="400" y="40" text-anchor="middle" fill="#888" font-size="11">
      80 KB neural network → 400 bytes EML tree | Exact formula | Deployable on any device
    </text>
  </g>
  
  <!-- Bottom: Benefits -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#1a2a1e" stroke="#00ff88"/>
    <text x="90" y="22" text-anchor="middle" fill="#00ff88" font-size="12" font-weight="bold">🔍 Interpretable</text>
    <text x="90" y="42" text-anchor="middle" fill="#ccc" font-size="10">Read the formula</text>
    <text x="90" y="57" text-anchor="middle" fill="#ccc" font-size="10">directly from the</text>
    <text x="90" y="72" text-anchor="middle" fill="#ccc" font-size="10">trained tree</text>
    <text x="90" y="90" text-anchor="middle" fill="#888" font-size="9">No black box</text>
    
    <rect x="205" y="0" width="180" height="100" rx="8" fill="#2a1a1e" stroke="#ff6b6b"/>
    <text x="295" y="22" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">📦 Compressed</text>
    <text x="295" y="42" text-anchor="middle" fill="#ccc" font-size="10">250-1000× fewer</text>
    <text x="295" y="57" text-anchor="middle" fill="#ccc" font-size="10">parameters than</text>
    <text x="295" y="72" text-anchor="middle" fill="#ccc" font-size="10">equivalent NN</text>
    <text x="295" y="90" text-anchor="middle" fill="#888" font-size="9">Proved in Lean 4</text>
    
    <rect x="410" y="0" width="180" height="100" rx="8" fill="#1a1a2e" stroke="#00d4ff"/>
    <text x="500" y="22" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">✅ Verifiable</text>
    <text x="500" y="42" text-anchor="middle" fill="#ccc" font-size="10">Formula can be</text>
    <text x="500" y="57" text-anchor="middle" fill="#ccc" font-size="10">formally verified</text>
    <text x="500" y="72" text-anchor="middle" fill="#ccc" font-size="10">in Lean 4</text>
    <text x="500" y="90" text-anchor="middle" fill="#888" font-size="9">Machine-checked proofs</text>
    
    <rect x="615" y="0" width="180" height="100" rx="8" fill="#2a2a1e" stroke="#ffcc00"/>
    <text x="705" y="22" text-anchor="middle" fill="#ffcc00" font-size="12" font-weight="bold">⚡ Deployable</text>
    <text x="705" y="42" text-anchor="middle" fill="#ccc" font-size="10">Runs on IoT,</text>
    <text x="705" y="57" text-anchor="middle" fill="#ccc" font-size="10">satellites, medical</text>
    <text x="705" y="72" text-anchor="middle" fill="#ccc" font-size="10">devices (≤1 KB)</text>
    <text x="705" y="90" text-anchor="middle" fill="#888" font-size="9">No GPU needed</text>
  </g>
</svg>
