<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="900" height="450" fill="url(#bg4)" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">
    EML Distillation Pipeline: Neural Network → Symbolic Formula
  </text>

  <!-- Step 1: Black-box NN -->
  <rect x="30" y="70" width="170" height="120" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="115" y="95" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">① Black-Box NN</text>

  <!-- NN layers visualization -->
  <g transform="translate(60, 105)">
    <circle cx="20" cy="10" r="5" fill="#484f58"/>
    <circle cx="20" cy="25" r="5" fill="#484f58"/>
    <circle cx="20" cy="40" r="5" fill="#484f58"/>
    <circle cx="55" cy="5" r="4" fill="#484f58"/>
    <circle cx="55" cy="17" r="4" fill="#484f58"/>
    <circle cx="55" cy="29" r="4" fill="#484f58"/>
    <circle cx="55" cy="41" r="4" fill="#484f58"/>
    <circle cx="90" cy="10" r="5" fill="#484f58"/>
    <circle cx="90" cy="25" r="5" fill="#484f58"/>
    <circle cx="90" cy="40" r="5" fill="#484f58"/>
    <!-- connections (simplified) -->
    <line x1="25" y1="10" x2="51" y2="5" stroke="#30363d" stroke-width="0.5"/>
    <line x1="25" y1="10" x2="51" y2="17" stroke="#30363d" stroke-width="0.5"/>
    <line x1="25" y1="25" x2="51" y2="17" stroke="#30363d" stroke-width="0.5"/>
    <line x1="25" y1="25" x2="51" y2="29" stroke="#30363d" stroke-width="0.5"/>
    <line x1="25" y1="40" x2="51" y2="29" stroke="#30363d" stroke-width="0.5"/>
    <line x1="25" y1="40" x2="51" y2="41" stroke="#30363d" stroke-width="0.5"/>
    <line x1="59" y1="5" x2="85" y2="10" stroke="#30363d" stroke-width="0.5"/>
    <line x1="59" y1="17" x2="85" y2="25" stroke="#30363d" stroke-width="0.5"/>
    <line x1="59" y1="29" x2="85" y2="25" stroke="#30363d" stroke-width="0.5"/>
    <line x1="59" y1="41" x2="85" y2="40" stroke="#30363d" stroke-width="0.5"/>
  </g>
  <text x="115" y="178" text-anchor="middle" fill="#8b949e" font-size="10">50,500 params</text>

  <!-- Arrow 1 -->
  <line x1="205" y1="130" x2="245" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Grid Prediction -->
  <rect x="250" y="70" width="150" height="120" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="325" y="95" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">② Grid Predict</text>

  <!-- Grid dots -->
  <g transform="translate(275, 110)">
    <g fill="#d29922" opacity="0.6">
      <circle cx="10" cy="10" r="2.5"/>
      <circle cx="30" cy="10" r="2.5"/>
      <circle cx="50" cy="10" r="2.5"/>
      <circle cx="70" cy="10" r="2.5"/>
      <circle cx="90" cy="10" r="2.5"/>
      <circle cx="10" cy="25" r="2.5"/>
      <circle cx="30" cy="25" r="2.5"/>
      <circle cx="50" cy="25" r="2.5"/>
      <circle cx="70" cy="25" r="2.5"/>
      <circle cx="90" cy="25" r="2.5"/>
      <circle cx="10" cy="40" r="2.5"/>
      <circle cx="30" cy="40" r="2.5"/>
      <circle cx="50" cy="40" r="2.5"/>
      <circle cx="70" cy="40" r="2.5"/>
      <circle cx="90" cy="40" r="2.5"/>
    </g>
  </g>
  <text x="325" y="178" text-anchor="middle" fill="#8b949e" font-size="10">n = 10,000 points</text>

  <!-- Arrow 2 -->
  <line x1="405" y1="130" x2="445" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: MCTS Search -->
  <rect x="450" y="70" width="150" height="120" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
  <text x="525" y="95" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="bold">③ MCTS Search</text>

  <!-- Tree visualization -->
  <g transform="translate(480, 105)">
    <circle cx="45" cy="5" r="6" fill="#8957e5"/>
    <text x="45" y="9" text-anchor="middle" fill="white" font-size="7">eml</text>
    <line x1="39" y1="11" x2="25" y2="25" stroke="#8957e5" stroke-width="1.5"/>
    <line x1="51" y1="11" x2="65" y2="25" stroke="#8957e5" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="6" fill="#8957e5"/>
    <text x="25" y="34" text-anchor="middle" fill="white" font-size="7">eml</text>
    <circle cx="65" cy="30" r="5" fill="#238636"/>
    <text x="65" y="34" text-anchor="middle" fill="white" font-size="7">1</text>
    <line x1="19" y1="36" x2="10" y2="48" stroke="#8957e5" stroke-width="1.5"/>
    <line x1="31" y1="36" x2="40" y2="48" stroke="#8957e5" stroke-width="1.5"/>
    <circle cx="10" cy="53" r="5" fill="#1f6feb"/>
    <text x="10" y="57" text-anchor="middle" fill="white" font-size="7">x</text>
    <circle cx="40" cy="53" r="5" fill="#238636"/>
    <text x="40" y="57" text-anchor="middle" fill="white" font-size="7">c</text>
  </g>
  <text x="525" y="178" text-anchor="middle" fill="#8b949e" font-size="10">topology search</text>

  <!-- Arrow 3 -->
  <line x1="605" y1="130" x2="645" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Formula Readout -->
  <rect x="650" y="70" width="220" height="120" rx="10" fill="#161b22" stroke="#238636" stroke-width="2"/>
  <text x="760" y="95" text-anchor="middle" fill="#238636" font-size="13" font-weight="bold">④ Formula Readout</text>

  <rect x="665" y="108" width="190" height="30" rx="5" fill="#0d1117" stroke="#238636"/>
  <text x="760" y="128" text-anchor="middle" fill="#e6edf3" font-size="12" font-style="italic">
    f(x) = exp(2.3x − 1.1)
  </text>

  <rect x="665" y="145" width="190" height="25" rx="5" fill="#0d1117" stroke="#238636"/>
  <text x="760" y="163" text-anchor="middle" fill="#aaf0d1" font-size="11">
    196 params — 250× smaller!
  </text>
  <text x="760" y="178" text-anchor="middle" fill="#8b949e" font-size="10">interpretable ✓</text>

  <!-- Compression comparison -->
  <rect x="30" y="220" width="840" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="248" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">
    Compression Comparison (Formally Verified)
  </text>

  <!-- NN bar -->
  <rect x="60" y="265" width="700" height="20" rx="4" fill="#f85149" opacity="0.3"/>
  <rect x="60" y="265" width="700" height="20" rx="4" fill="none" stroke="#f85149"/>
  <text x="410" y="280" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">
    Neural Network: 50,500 parameters (3,232,000 bits)
  </text>

  <!-- EML bar -->
  <rect x="60" y="295" width="2.8" height="20" rx="2" fill="#238636"/>
  <text x="80" y="310" fill="#238636" font-size="11" font-weight="bold">
    EML Tree: 196 params (3,200 bits) — 1000× storage compression
  </text>

  <!-- Key benefits -->
  <rect x="30" y="340" width="270" height="90" rx="8" fill="#161b22" stroke="#238636"/>
  <text x="165" y="365" text-anchor="middle" fill="#238636" font-size="13" font-weight="bold">✓ Interpretable</text>
  <text x="165" y="385" text-anchor="middle" fill="#e6edf3" font-size="11">Read the formula directly</text>
  <text x="165" y="405" text-anchor="middle" fill="#e6edf3" font-size="11">No black box</text>

  <rect x="315" y="340" width="270" height="90" rx="8" fill="#161b22" stroke="#1f6feb"/>
  <text x="450" y="365" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">✓ Verifiable</text>
  <text x="450" y="385" text-anchor="middle" fill="#e6edf3" font-size="11">Formally prove safety</text>
  <text x="450" y="405" text-anchor="middle" fill="#e6edf3" font-size="11">Lipschitz bounds, domain checks</text>

  <rect x="600" y="340" width="270" height="90" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="735" y="365" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">✓ Efficient</text>
  <text x="735" y="385" text-anchor="middle" fill="#e6edf3" font-size="11">250× parameter reduction</text>
  <text x="735" y="405" text-anchor="middle" fill="#e6edf3" font-size="11">Fits on microcontrollers</text>
</svg>
