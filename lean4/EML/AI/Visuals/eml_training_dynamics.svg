<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="550" fill="url(#bg3)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold" font-family="Arial">
    EML Dual-Gradient Training Dynamics
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#888" font-size="11" font-family="Arial">
    The unique two-phase training behavior of EML neural networks
  </text>
  
  <!-- Left: Gradient decomposition diagram -->
  <g transform="translate(30, 75)">
    <text x="200" y="0" text-anchor="middle" fill="#ccc" font-size="15" font-weight="bold">Gradient Decomposition</text>
    
    <!-- EML neuron box -->
    <rect x="80" y="20" width="240" height="50" rx="8" fill="#1a1a4e" stroke="#00d4ff" stroke-width="2"/>
    <text x="200" y="50" text-anchor="middle" fill="#00d4ff" font-size="13">
      f(x) = exp(w₁x + b₁) − ln(w₂x + b₂)
    </text>
    
    <!-- Arrow down -->
    <line x1="200" y1="75" x2="200" y2="100" stroke="#555" stroke-width="1.5"/>
    <text x="200" y="95" text-anchor="middle" fill="#888" font-size="10">∂f/∂x =</text>
    
    <!-- Split into two components -->
    <line x1="200" y1="105" x2="120" y2="130" stroke="#ff6b6b" stroke-width="1.5"/>
    <line x1="200" y1="105" x2="280" y2="130" stroke="#00ff88" stroke-width="1.5"/>
    
    <!-- Exp gradient -->
    <rect x="30" y="130" width="180" height="60" rx="8" fill="#2a1a1e" stroke="#ff6b6b" stroke-width="2"/>
    <text x="120" y="152" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">Exponential</text>
    <text x="120" y="170" text-anchor="middle" fill="#ff9999" font-size="11">w₁ · exp(w₁x + b₁)</text>
    <text x="120" y="205" text-anchor="middle" fill="#ff6b6b" font-size="10">🔥 EXPLORATION</text>
    <text x="120" y="220" text-anchor="middle" fill="#999" font-size="9">Large, bold updates</text>
    <text x="120" y="233" text-anchor="middle" fill="#999" font-size="9">Grows exponentially</text>
    
    <!-- Log gradient -->
    <rect x="220" y="130" width="160" height="60" rx="8" fill="#1a2a1e" stroke="#00ff88" stroke-width="2"/>
    <text x="300" y="152" text-anchor="middle" fill="#00ff88" font-size="12" font-weight="bold">Logarithmic</text>
    <text x="300" y="170" text-anchor="middle" fill="#88ffaa" font-size="11">w₂ / (w₂x + b₂)</text>
    <text x="300" y="205" text-anchor="middle" fill="#00ff88" font-size="10">🎯 REFINEMENT</text>
    <text x="300" y="220" text-anchor="middle" fill="#999" font-size="9">Small, precise updates</text>
    <text x="300" y="233" text-anchor="middle" fill="#999" font-size="9">Naturally decays</text>
  </g>
  
  <!-- Right: Training phases timeline -->
  <g transform="translate(470, 75)">
    <text x="200" y="0" text-anchor="middle" fill="#ccc" font-size="15" font-weight="bold">Training Timeline</text>
    
    <!-- Timeline axis -->
    <line x1="30" y1="240" x2="380" y2="240" stroke="#555" stroke-width="2"/>
    <text x="205" y="260" text-anchor="middle" fill="#888" font-size="10">Training Epochs →</text>
    
    <!-- Phase 1: Exploration -->
    <rect x="30" y="30" width="150" height="200" rx="8" fill="#2a1a1e" stroke="#ff6b6b" stroke-width="1.5" opacity="0.3"/>
    <text x="105" y="50" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">Phase 1</text>
    <text x="105" y="68" text-anchor="middle" fill="#ff9999" font-size="10">EXPLORATION</text>
    
    <!-- Exp gradient curve (high, decreasing) -->
    <path d="M 40 80 Q 80 85 105 100 Q 140 120 170 150" 
          fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
    <text x="60" y="78" fill="#ff6b6b" font-size="9">exp grad</text>
    
    <!-- Log gradient curve (low, flat) -->
    <path d="M 40 180 Q 80 175 105 172 Q 140 170 170 168" 
          fill="none" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="60" y="195" fill="#00ff88" font-size="9">log grad</text>
    
    <!-- Phase 2: Transition -->
    <rect x="180" y="30" width="60" height="200" rx="4" fill="#1a1a2e" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>
    <text x="210" y="25" text-anchor="middle" fill="#ffcc00" font-size="9">Transition</text>
    
    <!-- Phase 3: Refinement -->
    <rect x="240" y="30" width="140" height="200" rx="8" fill="#1a2a1e" stroke="#00ff88" stroke-width="1.5" opacity="0.3"/>
    <text x="310" y="50" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="bold">Phase 2</text>
    <text x="310" y="68" text-anchor="middle" fill="#88ffaa" font-size="10">REFINEMENT</text>
    
    <!-- Exp gradient (low) -->
    <path d="M 245 155 Q 280 165 310 175 Q 350 182 375 185" 
          fill="none" stroke="#ff6b6b" stroke-width="2"/>
    
    <!-- Log gradient (dominant) -->
    <path d="M 245 165 Q 280 155 310 148 Q 350 142 375 140" 
          fill="none" stroke="#00ff88" stroke-width="2.5" stroke-dasharray="4,3"/>
    
    <!-- Crossover point -->
    <circle cx="210" cy="160" r="5" fill="#ffcc00" stroke="#fff" stroke-width="1"/>
    <text x="210" y="155" text-anchor="middle" fill="#ffcc00" font-size="8">crossover</text>
  </g>
  
  <!-- Bottom: Key insight box -->
  <g transform="translate(50, 400)">
    <rect width="800" height="130" rx="10" fill="#111133" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="400" y="25" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold">
      Key Discovery: EML Networks Have Built-In Learning Rate Annealing
    </text>
    
    <text x="30" y="50" fill="#ccc" font-size="11">
      • The exponential gradient naturally decreases as parameters converge → automatic exploration → exploitation transition
    </text>
    <text x="30" y="70" fill="#ccc" font-size="11">
      • The logarithmic gradient provides 1/x decay → built-in annealing without explicit scheduling
    </text>
    <text x="30" y="90" fill="#ccc" font-size="11">
      • This dual structure is UNIQUE to EML — not found in ReLU, sigmoid, tanh, or any other activation function
    </text>
    <text x="30" y="110" fill="#ffcc00" font-size="11" font-weight="bold">
      → Formally verified: all gradient decomposition theorems proved in Lean 4 with zero sorry's
    </text>
  </g>
</svg>
