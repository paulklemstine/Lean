<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="neuronGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">
    EML Neural Network Architecture
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#6c757d">
    Interpretable neurons: each computes exp(w₁·x + b₁) − ln(w₂·x + b₂)
  </text>

  <!-- Input Layer -->
  <text x="80" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Input</text>
  <circle cx="80" cy="180" r="25" fill="url(#inputGrad)" filter="url(#shadow)"/>
  <text x="80" y="185" text-anchor="middle" font-size="14" fill="white" font-weight="bold">x</text>
  <circle cx="80" cy="300" r="25" fill="url(#inputGrad)" filter="url(#shadow)"/>
  <text x="80" y="305" text-anchor="middle" font-size="14" fill="white" font-weight="bold">y</text>
  <circle cx="80" cy="420" r="25" fill="url(#inputGrad)" filter="url(#shadow)"/>
  <text x="80" y="425" text-anchor="middle" font-size="14" fill="white" font-weight="bold">z</text>

  <!-- EML Layer 1 -->
  <text x="280" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">EML Layer 1</text>

  <!-- Neuron 1 -->
  <rect x="220" y="140" width="120" height="55" rx="8" fill="url(#neuronGrad)" filter="url(#shadow)"/>
  <text x="280" y="160" text-anchor="middle" font-size="10" fill="white">exp(w₁·x+b₁)</text>
  <text x="280" y="175" text-anchor="middle" font-size="10" fill="white">−ln(w₂·x+b₂)</text>
  <text x="280" y="190" text-anchor="middle" font-size="9" fill="#ddd">EML</text>

  <!-- Neuron 2 -->
  <rect x="220" y="220" width="120" height="55" rx="8" fill="url(#neuronGrad)" filter="url(#shadow)"/>
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="white">exp(w₃·x+b₃)</text>
  <text x="280" y="255" text-anchor="middle" font-size="10" fill="white">−ln(w₄·x+b₄)</text>
  <text x="280" y="270" text-anchor="middle" font-size="9" fill="#ddd">EML</text>

  <!-- Neuron 3 -->
  <rect x="220" y="300" width="120" height="55" rx="8" fill="url(#neuronGrad)" filter="url(#shadow)"/>
  <text x="280" y="320" text-anchor="middle" font-size="10" fill="white">exp(w₅·x+b₅)</text>
  <text x="280" y="335" text-anchor="middle" font-size="10" fill="white">−ln(w₆·x+b₆)</text>
  <text x="280" y="350" text-anchor="middle" font-size="9" fill="#ddd">EML</text>

  <!-- Neuron 4 -->
  <rect x="220" y="380" width="120" height="55" rx="8" fill="url(#neuronGrad)" filter="url(#shadow)"/>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="white">exp(w₇·x+b₇)</text>
  <text x="280" y="415" text-anchor="middle" font-size="10" fill="white">−ln(w₈·x+b₈)</text>
  <text x="280" y="430" text-anchor="middle" font-size="9" fill="#ddd">EML</text>

  <!-- EML Layer 2 -->
  <text x="500" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">EML Layer 2</text>

  <rect x="440" y="200" width="120" height="55" rx="8" fill="url(#neuronGrad)" filter="url(#shadow)"/>
  <text x="500" y="220" text-anchor="middle" font-size="10" fill="white">exp(α₁·h+β₁)</text>
  <text x="500" y="235" text-anchor="middle" font-size="10" fill="white">−ln(α₂·h+β₂)</text>
  <text x="500" y="250" text-anchor="middle" font-size="9" fill="#ddd">EML</text>

  <rect x="440" y="310" width="120" height="55" rx="8" fill="url(#neuronGrad)" filter="url(#shadow)"/>
  <text x="500" y="330" text-anchor="middle" font-size="10" fill="white">exp(α₃·h+β₃)</text>
  <text x="500" y="345" text-anchor="middle" font-size="10" fill="white">−ln(α₄·h+β₄)</text>
  <text x="500" y="360" text-anchor="middle" font-size="9" fill="#ddd">EML</text>

  <!-- Output -->
  <text x="700" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Output</text>
  <circle cx="700" cy="285" r="30" fill="url(#outputGrad)" filter="url(#shadow)"/>
  <text x="700" y="282" text-anchor="middle" font-size="11" fill="white" font-weight="bold">f(x,y,z)</text>
  <text x="700" y="296" text-anchor="middle" font-size="9" fill="white">symbolic</text>

  <!-- Connections: Input → Layer 1 -->
  <g stroke="#aaa" stroke-width="1.2" fill="none" opacity="0.6">
    <line x1="105" y1="180" x2="220" y2="167"/>
    <line x1="105" y1="180" x2="220" y2="247"/>
    <line x1="105" y1="300" x2="220" y2="167"/>
    <line x1="105" y1="300" x2="220" y2="247"/>
    <line x1="105" y1="300" x2="220" y2="327"/>
    <line x1="105" y1="420" x2="220" y2="327"/>
    <line x1="105" y1="420" x2="220" y2="407"/>
    <line x1="105" y1="180" x2="220" y2="327"/>
    <line x1="105" y1="180" x2="220" y2="407"/>
    <line x1="105" y1="300" x2="220" y2="407"/>
    <line x1="105" y1="420" x2="220" y2="167"/>
    <line x1="105" y1="420" x2="220" y2="247"/>
  </g>

  <!-- Connections: Layer 1 → Layer 2 -->
  <g stroke="#aaa" stroke-width="1.2" fill="none" opacity="0.6">
    <line x1="340" y1="167" x2="440" y2="227"/>
    <line x1="340" y1="247" x2="440" y2="227"/>
    <line x1="340" y1="327" x2="440" y2="227"/>
    <line x1="340" y1="407" x2="440" y2="227"/>
    <line x1="340" y1="167" x2="440" y2="337"/>
    <line x1="340" y1="247" x2="440" y2="337"/>
    <line x1="340" y1="327" x2="440" y2="337"/>
    <line x1="340" y1="407" x2="440" y2="337"/>
  </g>

  <!-- Connections: Layer 2 → Output -->
  <g stroke="#4facfe" stroke-width="2" fill="none" opacity="0.7">
    <line x1="560" y1="227" x2="670" y2="285"/>
    <line x1="560" y1="337" x2="670" y2="285"/>
  </g>

  <!-- Symbolic Readout Box -->
  <rect x="600" y="370" width="260" height="120" rx="10" fill="white" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#667eea">Symbolic Readout</text>
  <text x="730" y="418" text-anchor="middle" font-size="11" fill="#333">After training, read off:</text>
  <text x="730" y="440" text-anchor="middle" font-size="12" fill="#764ba2" font-weight="bold">f(x,y,z) = exp(a·x+b)</text>
  <text x="730" y="458" text-anchor="middle" font-size="12" fill="#764ba2" font-weight="bold">  − ln(c·y+d·z+e)</text>
  <text x="730" y="478" text-anchor="middle" font-size="10" fill="#999">Exact symbolic formula!</text>

  <!-- Arrow from output to readout -->
  <line x1="700" y1="315" x2="700" y2="368" stroke="#667eea" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Key Properties Box -->
  <rect x="30" y="510" width="840" height="120" rx="10" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="450" y="535" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    Key Properties of EML Neural Networks
  </text>
  <text x="140" y="560" text-anchor="middle" font-size="11" fill="#4facfe">✓ 4 params/neuron</text>
  <text x="320" y="560" text-anchor="middle" font-size="11" fill="#4facfe">✓ Differentiable</text>
  <text x="500" y="560" text-anchor="middle" font-size="11" fill="#4facfe">✓ Symbolic readout</text>
  <text x="700" y="560" text-anchor="middle" font-size="11" fill="#4facfe">✓ Universal approx.</text>
  <text x="140" y="585" text-anchor="middle" font-size="11" fill="#f5576c">∂/∂x = w₁·exp(·)</text>
  <text x="320" y="585" text-anchor="middle" font-size="11" fill="#f5576c">∂/∂y = −w₂/(·)</text>
  <text x="500" y="585" text-anchor="middle" font-size="11" fill="#f5576c">100-1000× compress</text>
  <text x="700" y="585" text-anchor="middle" font-size="11" fill="#f5576c">All elem. functions</text>
  <text x="450" y="615" text-anchor="middle" font-size="12" fill="#ffd700" font-weight="bold">
    "Like KAN networks but with guaranteed universality for elementary functions"
  </text>
</svg>
