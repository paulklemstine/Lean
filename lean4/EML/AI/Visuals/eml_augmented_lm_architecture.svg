<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="transGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="emlEngGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#55efc4"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#f5f6fa" rx="10"/>

  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2d3436">
    EML-Augmented Language Model Architecture
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="13" fill="#636e72">
    Solving "LLMs can't do math" with exact EML computation
  </text>

  <!-- Input -->
  <rect x="250" y="75" width="300" height="40" rx="8" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" font-size="13" fill="#2d3436">
    "What is exp(ln(3) + ln(7))?"
  </text>

  <!-- Arrow down -->
  <line x1="400" y1="115" x2="400" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Transformer Block -->
  <rect x="200" y="145" width="400" height="80" rx="10" fill="url(#transGrad)"/>
  <text x="400" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
    Transformer Layers
  </text>
  <text x="400" y="195" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">
    Standard attention + feed-forward (unchanged)
  </text>

  <!-- Arrow down to router -->
  <line x1="400" y1="225" x2="400" y2="255" stroke="#555" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Router / Math Detector -->
  <rect x="250" y="260" width="300" height="50" rx="25" fill="url(#routeGrad)"/>
  <text x="400" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    🔀 Math Expression Detector
  </text>

  <!-- Two paths -->
  <!-- Left: Text path -->
  <line x1="320" y1="310" x2="180" y2="360" stroke="#6c5ce7" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="230" y="340" font-size="11" fill="#6c5ce7" font-weight="bold">Text</text>

  <!-- Right: Math path -->
  <line x1="480" y1="310" x2="620" y2="360" stroke="#00b894" stroke-width="3" marker-end="url(#arrowB)"/>
  <text x="560" y="340" font-size="11" fill="#00b894" font-weight="bold">Math!</text>

  <!-- Text processing (left) -->
  <rect x="80" y="365" width="200" height="70" rx="10" fill="white" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="180" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c5ce7">
    Text Generation
  </text>
  <text x="180" y="410" text-anchor="middle" font-size="10" fill="#999">
    Standard LLM output
  </text>
  <text x="180" y="425" text-anchor="middle" font-size="10" fill="#999">
    (natural language)
  </text>

  <!-- EML Engine (right) -->
  <rect x="520" y="365" width="220" height="110" rx="10" fill="url(#emlEngGrad)"/>
  <text x="630" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    ⚡ EML Compute Engine
  </text>
  <text x="630" y="412" text-anchor="middle" font-size="10" fill="white">
    Parse → EML Tree → Evaluate
  </text>
  <text x="630" y="432" text-anchor="middle" font-size="10" fill="white">
    exp(ln(3)+ln(7)) = 21
  </text>
  <text x="630" y="452" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)" font-weight="bold">
    EXACT. Not approximate.
  </text>
  <text x="630" y="468" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">
    No training needed — algorithmic
  </text>

  <!-- Converge -->
  <line x1="180" y1="435" x2="320" y2="510" stroke="#6c5ce7" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="630" y1="475" x2="480" y2="510" stroke="#00b894" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Output combiner -->
  <rect x="250" y="510" width="300" height="40" rx="8" fill="#2d3436"/>
  <text x="400" y="535" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
    "The answer is exactly 21"
  </text>

  <!-- Arrow to output -->
  <line x1="400" y1="550" x2="400" y2="575" stroke="#555" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="400" y="592" text-anchor="middle" font-size="12" fill="#00b894" font-weight="bold">
    ✓ Provably correct mathematical output
  </text>

  <!-- Side annotations -->
  <rect x="30" y="150" width="140" height="80" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">Standard LLM</text>
  <text x="100" y="192" text-anchor="middle" font-size="9" fill="#d63031">exp(ln(3)+ln(7))</text>
  <text x="100" y="206" text-anchor="middle" font-size="9" fill="#d63031">≈ "about 20.8"</text>
  <text x="100" y="220" text-anchor="middle" font-size="9" fill="#d63031">❌ Wrong!</text>

  <rect x="30" y="260" width="140" height="80" rx="6" fill="white" stroke="#00b894" stroke-width="2"/>
  <text x="100" y="285" text-anchor="middle" font-size="10" font-weight="bold" fill="#00b894">EML-Augmented</text>
  <text x="100" y="302" text-anchor="middle" font-size="9" fill="#00b894">exp(ln(3)+ln(7))</text>
  <text x="100" y="316" text-anchor="middle" font-size="9" fill="#00b894">= exactly 21</text>
  <text x="100" y="330" text-anchor="middle" font-size="9" fill="#00b894">✓ Exact!</text>
</svg>
