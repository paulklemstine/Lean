<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="searchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="optGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#55efc4"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="550" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2d3436">
    EML Symbolic Regression Pipeline
  </text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#636e72">
    Automated Scientific Discovery: Data → EML Tree → Symbolic Formula
  </text>

  <!-- Step 1: Raw Data -->
  <rect x="30" y="80" width="200" height="160" rx="12" fill="url(#dataGrad)" opacity="0.9"/>
  <text x="130" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="white">① Raw Data</text>

  <!-- Scatter plot simulation -->
  <g fill="white" opacity="0.8">
    <circle cx="60" cy="200" r="3"/><circle cx="75" cy="185" r="3"/>
    <circle cx="90" cy="170" r="3"/><circle cx="105" cy="155" r="3"/>
    <circle cx="120" cy="142" r="3"/><circle cx="135" cy="135" r="3"/>
    <circle cx="150" cy="130" r="3"/><circle cx="165" cy="128" r="3"/>
    <circle cx="180" cy="127" r="3"/><circle cx="195" cy="126" r="3"/>
    <circle cx="68" cy="195" r="2"/><circle cx="82" cy="175" r="2"/>
    <circle cx="112" cy="150" r="2"/><circle cx="142" cy="138" r="2"/>
    <circle cx="172" cy="129" r="2"/>
  </g>
  <text x="130" y="225" text-anchor="middle" font-size="10" fill="white">Experimental measurements</text>

  <!-- Arrow 1→2 -->
  <line x1="230" y1="160" x2="275" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Tree Search -->
  <rect x="280" y="80" width="200" height="160" rx="12" fill="url(#searchGrad)" opacity="0.9"/>
  <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="white">② Tree Search</text>

  <!-- Mini tree -->
  <g stroke="white" stroke-width="1.5" fill="none">
    <circle cx="380" cy="140" r="10" fill="rgba(255,255,255,0.3)"/>
    <text x="380" y="144" text-anchor="middle" font-size="8" fill="white">E</text>
    <line x1="374" y1="148" x2="350" y2="170"/>
    <line x1="386" y1="148" x2="410" y2="170"/>
    <circle cx="350" cy="178" r="8" fill="rgba(255,255,255,0.3)"/>
    <text x="350" y="182" text-anchor="middle" font-size="7" fill="white">x</text>
    <circle cx="410" cy="178" r="8" fill="rgba(255,255,255,0.3)"/>
    <text x="410" y="182" text-anchor="middle" font-size="7" fill="white">E</text>
    <line x1="404" y1="184" x2="393" y2="200"/>
    <line x1="416" y1="184" x2="427" y2="200"/>
    <circle cx="393" cy="207" r="6" fill="rgba(255,255,255,0.3)"/>
    <text x="393" y="210" text-anchor="middle" font-size="6" fill="white">c</text>
    <circle cx="427" cy="207" r="6" fill="rgba(255,255,255,0.3)"/>
    <text x="427" y="210" text-anchor="middle" font-size="6" fill="white">1</text>
  </g>
  <text x="380" y="232" text-anchor="middle" font-size="10" fill="white">Enumerate + mutate trees</text>

  <!-- Arrow 2→3 -->
  <line x1="480" y1="160" x2="525" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Gradient Optimization -->
  <rect x="530" y="80" width="200" height="160" rx="12" fill="url(#optGrad)" opacity="0.9"/>
  <text x="630" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="white">③ Optimize</text>

  <!-- Loss curve -->
  <polyline points="555,200 575,180 595,160 615,150 635,145 655,143 675,142 695,141 715,141"
            fill="none" stroke="white" stroke-width="2"/>
  <text x="560" y="210" font-size="8" fill="white">loss</text>
  <text x="715" y="150" font-size="8" fill="white">→0</text>
  <text x="630" y="232" text-anchor="middle" font-size="10" fill="white">Gradient descent on params</text>

  <!-- Arrow 3→4 -->
  <line x1="730" y1="160" x2="775" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Symbolic Formula -->
  <rect x="780" y="80" width="190" height="160" rx="12" fill="url(#resultGrad)" opacity="0.9"/>
  <text x="875" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="white">④ Formula!</text>
  <text x="875" y="145" text-anchor="middle" font-size="16" fill="white" font-weight="bold">T² = a³</text>
  <text x="875" y="175" text-anchor="middle" font-size="13" fill="white">Kepler's Law</text>
  <text x="875" y="195" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">EML tree: 6 leaves</text>
  <text x="875" y="215" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Exact, not approximate</text>

  <!-- Bottom: The EML Search Space -->
  <rect x="30" y="280" width="940" height="90" rx="12" fill="#2d3436"/>
  <text x="500" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#dfe6e9">
    The EML Search Space
  </text>
  <text x="500" y="330" text-anchor="middle" font-size="12" fill="#b2bec3">
    Grammar: S → c ∈ ℝ | xᵢ | eml(S, S)     where eml(a,b) = exp(a) − ln(b)
  </text>
  <text x="500" y="350" text-anchor="middle" font-size="12" fill="#55efc4">
    ✓ Contains ALL elementary functions: exp, ln, sin, cos, polynomials, roots, x^y, ...
  </text>

  <!-- Bottom boxes: Applications -->
  <text x="500" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3436">
    Discovered Laws
  </text>

  <rect x="30" y="420" width="180" height="100" rx="8" fill="white" stroke="#ff6b6b" stroke-width="2"/>
  <text x="120" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff6b6b">Kepler's Laws</text>
  <text x="120" y="465" text-anchor="middle" font-size="11" fill="#333">T² = ka³</text>
  <text x="120" y="485" text-anchor="middle" font-size="10" fill="#999">From orbital data</text>
  <text x="120" y="505" text-anchor="middle" font-size="10" fill="#999">6 EML leaves</text>

  <rect x="230" y="420" width="180" height="100" rx="8" fill="white" stroke="#a29bfe" stroke-width="2"/>
  <text x="320" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#6c5ce7">Gas Laws</text>
  <text x="320" y="465" text-anchor="middle" font-size="11" fill="#333">PV = nRT</text>
  <text x="320" y="485" text-anchor="middle" font-size="10" fill="#999">From P,V,T data</text>
  <text x="320" y="505" text-anchor="middle" font-size="10" fill="#999">10 EML leaves</text>

  <rect x="430" y="420" width="180" height="100" rx="8" fill="white" stroke="#00b894" stroke-width="2"/>
  <text x="520" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#00b894">Newton's Law</text>
  <text x="520" y="465" text-anchor="middle" font-size="11" fill="#333">F = ma</text>
  <text x="520" y="485" text-anchor="middle" font-size="10" fill="#999">From force data</text>
  <text x="520" y="505" text-anchor="middle" font-size="10" fill="#999">8 EML leaves</text>

  <rect x="630" y="420" width="180" height="100" rx="8" fill="white" stroke="#f39c12" stroke-width="2"/>
  <text x="720" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#f39c12">Ohm's Law</text>
  <text x="720" y="465" text-anchor="middle" font-size="11" fill="#333">V = IR</text>
  <text x="720" y="485" text-anchor="middle" font-size="10" fill="#999">From circuit data</text>
  <text x="720" y="505" text-anchor="middle" font-size="10" fill="#999">8 EML leaves</text>

  <rect x="830" y="420" width="140" height="100" rx="8" fill="white" stroke="#e17055" stroke-width="2"/>
  <text x="900" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#e17055">Your Law?</text>
  <text x="900" y="465" text-anchor="middle" font-size="11" fill="#333">f(x) = ???</text>
  <text x="900" y="485" text-anchor="middle" font-size="10" fill="#999">From your data</text>
  <text x="900" y="505" text-anchor="middle" font-size="10" fill="#999">≤50 EML leaves</text>
</svg>
