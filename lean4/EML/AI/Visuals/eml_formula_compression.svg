<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="emlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <linearGradient id="nnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e17055"/>
      <stop offset="100%" stop-color="#d63031"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="#f5f6fa" rx="10"/>

  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2d3436">
    EML Formula Compression vs Neural Networks
  </text>
  <text x="450" y="55" text-anchor="middle" font-size="13" fill="#636e72">
    50 EML leaves ≈ 20,000 NN parameters — up to 1000× compression
  </text>

  <!-- Bar chart -->
  <g transform="translate(50, 80)">
    <!-- Axes -->
    <line x1="120" y1="0" x2="120" y2="300" stroke="#ddd" stroke-width="1"/>
    <line x1="120" y1="300" x2="800" y2="300" stroke="#ddd" stroke-width="1"/>
    <text x="115" y="310" text-anchor="end" font-size="10" fill="#999">0</text>

    <!-- Y-axis label -->
    <text x="10" y="150" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90, 10, 150)">
      Parameters / Complexity
    </text>

    <!-- Functions and their comparisons -->
    <!-- exp(x) -->
    <rect x="140" y="295" width="30" height="5" fill="url(#emlGrad)" rx="2"/>
    <rect x="175" y="270" width="30" height="30" fill="url(#nnGrad)" rx="2"/>
    <text x="172" y="320" text-anchor="middle" font-size="9" fill="#555">exp(x)</text>
    <text x="155" y="290" text-anchor="middle" font-size="8" fill="#00b894">2</text>
    <text x="190" y="265" text-anchor="middle" font-size="8" fill="#d63031">100</text>

    <!-- ln(x) -->
    <rect x="230" y="282" width="30" height="18" fill="url(#emlGrad)" rx="2"/>
    <rect x="265" y="270" width="30" height="30" fill="url(#nnGrad)" rx="2"/>
    <text x="262" y="320" text-anchor="middle" font-size="9" fill="#555">ln(x)</text>
    <text x="245" y="278" text-anchor="middle" font-size="8" fill="#00b894">6</text>
    <text x="280" y="265" text-anchor="middle" font-size="8" fill="#d63031">100</text>

    <!-- sin(x) -->
    <rect x="320" y="255" width="30" height="45" fill="url(#emlGrad)" rx="2"/>
    <rect x="355" y="210" width="30" height="90" fill="url(#nnGrad)" rx="2"/>
    <text x="352" y="320" text-anchor="middle" font-size="9" fill="#555">sin(x)</text>
    <text x="335" y="250" text-anchor="middle" font-size="8" fill="#00b894">15</text>
    <text x="370" y="205" text-anchor="middle" font-size="8" fill="#d63031">2K</text>

    <!-- x·y -->
    <rect x="410" y="270" width="30" height="30" fill="url(#emlGrad)" rx="2"/>
    <rect x="445" y="255" width="30" height="45" fill="url(#nnGrad)" rx="2"/>
    <text x="442" y="320" text-anchor="middle" font-size="9" fill="#555">x·y</text>
    <text x="425" y="265" text-anchor="middle" font-size="8" fill="#00b894">10</text>
    <text x="460" y="250" text-anchor="middle" font-size="8" fill="#d63031">500</text>

    <!-- Custom 50 -->
    <rect x="500" y="150" width="30" height="150" fill="url(#emlGrad)" rx="2"/>
    <rect x="535" y="0" width="30" height="300" fill="url(#nnGrad)" rx="2"/>
    <text x="532" y="320" text-anchor="middle" font-size="9" fill="#555">Custom</text>
    <text x="515" y="145" text-anchor="middle" font-size="8" fill="#00b894">50</text>
    <text x="550" y="-5" text-anchor="middle" font-size="8" fill="#d63031">20K</text>

    <!-- Legend -->
    <rect x="600" y="120" width="15" height="15" fill="url(#emlGrad)" rx="2"/>
    <text x="620" y="132" font-size="12" fill="#00b894">EML Tree (leaves)</text>
    <rect x="600" y="145" width="15" height="15" fill="url(#nnGrad)" rx="2"/>
    <text x="620" y="157" font-size="12" fill="#d63031">Neural Network (params)</text>

    <!-- Compression ratios -->
    <text x="600" y="195" font-size="14" font-weight="bold" fill="#2d3436">Compression Ratios:</text>
    <text x="600" y="215" font-size="12" fill="#555">exp(x):  50×</text>
    <text x="600" y="235" font-size="12" fill="#555">sin(x):  133×</text>
    <text x="600" y="255" font-size="12" fill="#555">Custom:  400×</text>
    <text x="600" y="280" font-size="13" font-weight="bold" fill="#00b894">Average: ~200×</text>
  </g>

  <!-- Bottom: Kolmogorov Complexity -->
  <rect x="50" y="405" width="800" height="80" rx="10" fill="#2d3436"/>
  <text x="450" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#dfe6e9">
    K_EML: Kolmogorov Complexity for Elementary Functions
  </text>
  <text x="450" y="455" text-anchor="middle" font-size="12" fill="#b2bec3">
    K_EML(f) = minimum leaf count of any EML tree computing f
  </text>
  <text x="450" y="475" text-anchor="middle" font-size="12" fill="#55efc4">
    Well-defined • Subadditive under composition • Natural complexity measure for scientific formulas
  </text>
</svg>
