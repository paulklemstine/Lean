<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="logGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#004e89;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a85ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="bold">
    EML Dual-Gradient Training Dynamics
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#8b949e" font-size="13">
    Phase transition from exploration (exp) to refinement (log)
  </text>

  <!-- Chart area -->
  <rect x="80" y="85" width="520" height="320" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="6"/>

  <!-- Grid lines -->
  <g stroke="#21262d" stroke-width="0.5">
    <line x1="80" y1="165" x2="600" y2="165"/>
    <line x1="80" y1="245" x2="600" y2="245"/>
    <line x1="80" y1="325" x2="600" y2="325"/>
    <line x1="200" y1="85" x2="200" y2="405"/>
    <line x1="340" y1="85" x2="340" y2="405"/>
    <line x1="470" y1="85" x2="470" y2="405"/>
  </g>

  <!-- Axes labels -->
  <text x="340" y="430" text-anchor="middle" fill="#8b949e" font-size="12">Training Epoch</text>
  <text x="40" y="250" text-anchor="middle" fill="#8b949e" font-size="12"
        transform="rotate(-90, 40, 250)">Gradient Magnitude</text>

  <!-- Epoch labels -->
  <text x="80" y="420" text-anchor="middle" fill="#8b949e" font-size="10">0</text>
  <text x="210" y="420" text-anchor="middle" fill="#8b949e" font-size="10">100</text>
  <text x="340" y="420" text-anchor="middle" fill="#8b949e" font-size="10">200</text>
  <text x="470" y="420" text-anchor="middle" fill="#8b949e" font-size="10">300</text>
  <text x="600" y="420" text-anchor="middle" fill="#8b949e" font-size="10">400</text>

  <!-- Exp gradient curve (orange, decreasing) -->
  <path d="M80,100 Q140,105 200,140 Q260,180 340,250 Q420,310 500,360 Q550,380 600,390"
        fill="none" stroke="url(#expGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Log gradient curve (blue, increasing then stable) -->
  <path d="M80,380 Q140,370 200,340 Q260,300 340,250 Q420,220 500,200 Q550,190 600,185"
        fill="none" stroke="url(#logGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Phase transition line -->
  <line x1="340" y1="85" x2="340" y2="405" stroke="#f0883e" stroke-width="2"
        stroke-dasharray="8,4" opacity="0.7"/>
  <text x="340" y="80" text-anchor="middle" fill="#f0883e" font-size="11" font-weight="bold">
    Phase Transition
  </text>

  <!-- Phase labels -->
  <rect x="140" y="92" width="120" height="24" rx="12" fill="#ff6b35" opacity="0.15"/>
  <text x="200" y="108" text-anchor="middle" fill="#ff9500" font-size="11" font-weight="bold">
    EXPLORATION
  </text>

  <rect x="420" y="92" width="120" height="24" rx="12" fill="#1a85ff" opacity="0.15"/>
  <text x="480" y="108" text-anchor="middle" fill="#1a85ff" font-size="11" font-weight="bold">
    REFINEMENT
  </text>

  <!-- Legend -->
  <rect x="640" y="90" width="240" height="140" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="760" y="115" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">
    Gradient Components
  </text>

  <line x1="660" y1="140" x2="700" y2="140" stroke="#ff9500" stroke-width="3"/>
  <text x="710" y="145" fill="#ff9500" font-size="12">w₁·exp(w₁x + b₁)</text>

  <line x1="660" y1="170" x2="700" y2="170" stroke="#1a85ff" stroke-width="3"/>
  <text x="710" y="175" fill="#1a85ff" font-size="12">w₂/(w₂x + b₂)</text>

  <text x="660" y="210" fill="#8b949e" font-size="10">Crossover: O(1/lr)</text>

  <!-- EML neuron diagram -->
  <rect x="640" y="250" width="240" height="160" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="760" y="275" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">
    EML Neuron
  </text>

  <!-- Neuron circle -->
  <circle cx="760" cy="340" r="35" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="760" y="335" text-anchor="middle" fill="#e6edf3" font-size="10">exp(·) −</text>
  <text x="760" y="350" text-anchor="middle" fill="#e6edf3" font-size="10">ln(·)</text>

  <!-- Input arrow -->
  <line x1="670" y1="340" x2="720" y2="340" stroke="#8b949e" stroke-width="1.5"
        marker-end="url(#arrowGray)"/>
  <text x="680" y="330" fill="#8b949e" font-size="10">x</text>

  <!-- Output arrow -->
  <line x1="800" y1="340" x2="850" y2="340" stroke="#8b949e" stroke-width="1.5"/>
  <text x="845" y="330" fill="#8b949e" font-size="10">f(x)</text>

  <!-- Key insight box -->
  <rect x="80" y="450" width="800" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="475" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">
    Key Discovery: Natural Annealing
  </text>
  <text x="450" y="500" text-anchor="middle" fill="#e6edf3" font-size="12">
    The exp gradient dominates early → bold exploration of parameter space
  </text>
  <text x="450" y="520" text-anchor="middle" fill="#e6edf3" font-size="12">
    The log gradient takes over later → fine-grained refinement near optimum
  </text>
  <text x="450" y="545" text-anchor="middle" fill="#8b949e" font-size="11">
    This eliminates the need for manual learning rate scheduling — EML does it automatically!
  </text>

  <!-- Formally verified badge -->
  <rect x="730" y="440" width="140" height="28" rx="14" fill="#238636" opacity="0.9"/>
  <text x="800" y="459" text-anchor="middle" fill="white" font-size="11" font-weight="bold">
    ✓ Formally Verified
  </text>
</svg>
