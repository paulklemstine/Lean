    ④ Hardware Acceleration
  </text>
  <text x="50" y="475" fill="#e6edf3" font-size="11">• Analog EML gates: I ∝ exp(V/V_T), V_out ∝ ln(V_in)</text>
  <text x="50" y="493" fill="#e6edf3" font-size="11">• FPGA: 100× throughput • Custom silicon: 3-instruction ISA</text>
  <text x="50" y="511" fill="#e6edf3" font-size="11">• Power: &lt; 100mW • Die area: &lt; 1mm² @ 7nm</text>

