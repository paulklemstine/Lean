  <text x="760" y="383" text-anchor="middle" fill="#d2b3ff" font-size="9">global explanations</text>
  <text x="760" y="395" text-anchor="middle" fill="#d2b3ff" font-size="9">counterfactuals</text>

  <rect x="850" y="348" width="100" height="55" rx="6" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="900" y="368" text-anchor="middle" fill="white" font-size="11" font-weight="bold">AI Safety</text>
  <text x="900" y="383" text-anchor="middle" fill="#d2b3ff" font-size="9">verification</text>
  <text x="900" y="395" text-anchor="middle" fill="#d2b3ff" font-size="9">robustness</text>

  <!-- Layer 4: Hardware -->
