  <text x="140" y="625" text-anchor="middle" fill="#8b949e" font-size="11">Compression ratio</text>
  <text x="140" y="640" text-anchor="middle" fill="#238636" font-size="10">✓ Proved</text>

  <rect x="240" y="580" width="160" height="80" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="320" y="605" text-anchor="middle" fill="#58a6ff" font-size="28" font-weight="bold">2k</text>
  <text x="320" y="625" text-anchor="middle" fill="#8b949e" font-size="11">VC dimension bound</text>
  <text x="320" y="640" text-anchor="middle" fill="#238636" font-size="10">✓ Proved</text>

  <rect x="420" y="580" width="160" height="80" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="500" y="605" text-anchor="middle" fill="#58a6ff" font-size="28" font-weight="bold">≤5</text>
  <text x="500" y="625" text-anchor="middle" fill="#8b949e" font-size="11">Recommended depth</text>
  <text x="500" y="640" text-anchor="middle" fill="#238636" font-size="10">✓ Proved</text>

  <rect x="600" y="580" width="160" height="80" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="680" y="605" text-anchor="middle" fill="#58a6ff" font-size="28" font-weight="bold">O(k/n)</text>
  <text x="680" y="625" text-anchor="middle" fill="#8b949e" font-size="11">Parametric rate</text>
  <text x="680" y="640" text-anchor="middle" fill="#238636" font-size="10">✓ Proved</text>

  <rect x="780" y="580" width="170" height="80" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="865" y="605" text-anchor="middle" fill="#58a6ff" font-size="28" font-weight="bold">exp(n)</text>
  <text x="865" y="625" text-anchor="middle" fill="#8b949e" font-size="11">Depth advantage</text>
