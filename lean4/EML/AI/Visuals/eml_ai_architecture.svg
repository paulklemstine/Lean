  <text x="600" y="383" text-anchor="middle" fill="#d2b3ff" font-size="9">option pricing</text>
  <text x="600" y="395" text-anchor="middle" fill="#d2b3ff" font-size="9">risk models</text>

  <rect x="690" y="348" width="140" height="55" rx="6" fill="url(#purpleGrad)" filter="url(#shadow)"/>
