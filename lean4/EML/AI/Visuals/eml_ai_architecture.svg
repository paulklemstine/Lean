  <text x="870" y="255" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Distillation</text>
  <text x="870" y="270" text-anchor="middle" fill="#fde68a" font-size="9">NN → EML formula</text>
  <text x="870" y="282" text-anchor="middle" fill="#fde68a" font-size="9">250×+ compression</text>

