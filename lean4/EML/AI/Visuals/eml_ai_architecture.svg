  <rect width="1000" height="700" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#e6edf3" font-size="24" font-weight="bold">
    EML for AI &amp; Machine Learning — Complete Architecture
  </text>
  <text x="500" y="62" text-anchor="middle" fill="#8b949e" font-size="13">
    From theory to deployment: the full EML-AI pipeline
  </text>

  <!-- Layer 1: Mathematical Foundations -->
  <rect x="30" y="85" width="940" height="100" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="60" y="108" fill="#58a6ff" font-size="15" font-weight="bold">
    ① Mathematical Foundations (Formally Verified in Lean 4)
  </text>

  <rect x="50" y="118" width="170" height="55" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="135" y="140" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Stone-Weierstrass</text>
  <text x="135" y="155" text-anchor="middle" fill="#aaf0d1" font-size="9">separation ✓ nonvanishing ✓</text>
  <text x="135" y="167" text-anchor="middle" fill="#aaf0d1" font-size="9">continuity ✓</text>

  <rect x="240" y="118" width="150" height="55" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="315" y="140" text-anchor="middle" fill="white" font-size="11" font-weight="bold">VC Dimension</text>
  <text x="315" y="155" text-anchor="middle" fill="#aaf0d1" font-size="9">VC ≤ 2k ✓</text>
  <text x="315" y="167" text-anchor="middle" fill="#aaf0d1" font-size="9">EML &lt; NN ✓</text>

  <rect x="410" y="118" width="150" height="55" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="485" y="140" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Dual Gradient</text>
  <text x="485" y="155" text-anchor="middle" fill="#aaf0d1" font-size="9">decomposition ✓</text>
  <text x="485" y="167" text-anchor="middle" fill="#aaf0d1" font-size="9">phase transition ✓</text>

  <rect x="580" y="118" width="150" height="55" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="655" y="140" text-anchor="middle" fill="white" font-size="11" font-weight="bold">MDL Bounds</text>
  <text x="655" y="155" text-anchor="middle" fill="#aaf0d1" font-size="9">MDL = 2k + kb ✓</text>
  <text x="655" y="167" text-anchor="middle" fill="#aaf0d1" font-size="9">250× compression ✓</text>

  <rect x="750" y="118" width="200" height="55" rx="6" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="850" y="140" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Depth Efficiency</text>
  <text x="850" y="155" text-anchor="middle" fill="#aaf0d1" font-size="9">tower functions ✓ Lipschitz ✓</text>
  <text x="850" y="167" text-anchor="middle" fill="#aaf0d1" font-size="9">critical depth ✓</text>

