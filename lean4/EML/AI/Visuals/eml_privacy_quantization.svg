<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bg3)"/>

  <text x="500" y="40" fill="#e2e8f0" font-size="24" font-weight="bold" text-anchor="middle">
    EML for Trustworthy AI: Privacy &amp; Quantization
  </text>

  <!-- Left: Differential Privacy -->
  <g transform="translate(30, 70)">
    <rect width="460" height="490" rx="12" fill="#1a1a3e" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <text x="230" y="30" fill="#8b5cf6" font-size="18" font-weight="bold" text-anchor="middle">
      Differential Privacy for EML
    </text>

    <!-- Formula -->
    <rect x="30" y="50" width="400" height="45" rx="8" fill="#0f0c29"/>
    <text x="230" y="72" fill="#e2e8f0" font-size="14" text-anchor="middle">
      Sensitivity = |w₁| · exp(|w₁|·M + |b₁|)
    </text>
    <text x="230" y="88" fill="#a78bfa" font-size="11" text-anchor="middle">
      Noise scale = Sensitivity / ε
    </text>

    <!-- Weight vs Privacy visualization -->
    <text x="30" y="120" fill="#c4b5fd" font-size="13" font-weight="bold">Small weights → Low sensitivity → Better privacy</text>

    <!-- Privacy meter bars -->
    <g transform="translate(30, 140)">
      <text x="0" y="15" fill="#a78bfa" font-size="11">|w|=0.1:</text>
      <rect x="80" y="3" width="30" height="16" rx="3" fill="#22c55e"/>
      <text x="120" y="15" fill="#86efac" font-size="11">Excellent (sens=0.11)</text>

      <text x="0" y="45" fill="#a78bfa" font-size="11">|w|=0.5:</text>
      <rect x="80" y="33" width="80" height="16" rx="3" fill="#eab308"/>
      <text x="170" y="45" fill="#fde047" font-size="11">Good (sens=0.82)</text>

      <text x="0" y="75" fill="#a78bfa" font-size="11">|w|=1.0:</text>
      <rect x="80" y="63" width="200" height="16" rx="3" fill="#f97316"/>
      <text x="290" y="75" fill="#fdba74" font-size="11">Moderate (sens=2.72)</text>

      <text x="0" y="105" fill="#a78bfa" font-size="11">|w|=2.0:</text>
      <rect x="80" y="93" width="350" height="16" rx="3" fill="#ef4444"/>
      <text x="180" y="125" fill="#fca5a5" font-size="11">Poor (sens=14.78) — needs large noise</text>
    </g>

    <!-- Key theorem -->
    <rect x="30" y="290" width="400" height="80" rx="8" fill="#0f0c29" stroke="#22c55e" stroke-width="1"/>
    <text x="230" y="315" fill="#22c55e" font-size="13" font-weight="bold" text-anchor="middle">
      ✓ Formally Verified (Lean 4)
    </text>
    <text x="230" y="335" fill="#e2e8f0" font-size="11" text-anchor="middle">
      smaller_weights_better_privacy:
    </text>
    <text x="230" y="355" fill="#a78bfa" font-size="11" text-anchor="middle">
      |w₁| ≤ |w₂| → noise(w₁) ≤ noise(w₂)
    </text>

    <!-- Insight -->
    <rect x="30" y="385" width="400" height="85" rx="8" fill="#1e1b4b"/>
    <text x="230" y="410" fill="#c4b5fd" font-size="13" font-weight="bold" text-anchor="middle">
      💡 Key Insight
    </text>
    <text x="230" y="430" fill="#e2e8f0" font-size="11" text-anchor="middle">
      EML weight regularization (L1/L2 penalty)
    </text>
    <text x="230" y="450" fill="#e2e8f0" font-size="11" text-anchor="middle">
      simultaneously improves both generalization
    </text>
    <text x="230" y="465" fill="#22c55e" font-size="12" text-anchor="middle" font-weight="bold">
      AND differential privacy — a free lunch!
    </text>
  </g>

  <!-- Right: Quantization -->
  <g transform="translate(510, 70)">
    <rect width="460" height="490" rx="12" fill="#1a1a3e" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
    <text x="230" y="30" fill="#06b6d4" font-size="18" font-weight="bold" text-anchor="middle">
      EML Quantization for Edge AI
    </text>

    <!-- Formula -->
    <rect x="30" y="50" width="400" height="45" rx="8" fill="#0f0c29"/>
    <text x="230" y="72" fill="#e2e8f0" font-size="14" text-anchor="middle">
      Error ≤ k · 2⁻ᵇ · Lip(tree)
    </text>
    <text x="230" y="88" fill="#67e8f9" font-size="11" text-anchor="middle">
      k = leaves, b = bits, Lip = Lipschitz constant
    </text>

    <!-- Bits vs Error table -->
    <text x="30" y="120" fill="#67e8f9" font-size="13" font-weight="bold">Precision vs Model Size (50-leaf tree)</text>

    <g transform="translate(30, 135)">
      <!-- Headers -->
      <text x="0" y="15" fill="#a5f3fc" font-size="11" font-weight="bold">Bits</text>
      <text x="60" y="15" fill="#a5f3fc" font-size="11" font-weight="bold">Size</text>
      <text x="130" y="15" fill="#a5f3fc" font-size="11" font-weight="bold">Error/Lip</text>
      <text x="230" y="15" fill="#a5f3fc" font-size="11" font-weight="bold">Use Case</text>

      <line x1="0" y1="22" x2="380" y2="22" stroke="#334155" stroke-width="1"/>

      <!-- 4-bit -->
      <text x="0" y="42" fill="#e2e8f0" font-size="11">4</text>
      <text x="60" y="42" fill="#e2e8f0" font-size="11">25 B</text>
      <text x="130" y="42" fill="#f87171" font-size="11">3.125</text>
      <text x="230" y="42" fill="#e2e8f0" font-size="11">⚠ Too coarse</text>

      <!-- 8-bit -->
      <text x="0" y="62" fill="#e2e8f0" font-size="11">8</text>
      <text x="60" y="62" fill="#e2e8f0" font-size="11">50 B</text>
      <text x="130" y="62" fill="#fbbf24" font-size="11">0.195</text>
      <text x="230" y="62" fill="#22c55e" font-size="11">✓ Edge/IoT devices</text>

      <!-- 16-bit -->
      <text x="0" y="82" fill="#e2e8f0" font-size="11">16</text>
      <text x="60" y="82" fill="#e2e8f0" font-size="11">100 B</text>
      <text x="130" y="82" fill="#22c55e" font-size="11">0.00076</text>
      <text x="230" y="82" fill="#22c55e" font-size="11">✓ Mobile/embedded</text>

      <!-- 32-bit -->
      <text x="0" y="102" fill="#e2e8f0" font-size="11">32</text>
      <text x="60" y="102" fill="#e2e8f0" font-size="11">200 B</text>
      <text x="130" y="102" fill="#22c55e" font-size="11">~0</text>
      <text x="230" y="102" fill="#22c55e" font-size="11">✓ Full precision</text>

      <!-- 64-bit -->
      <text x="0" y="122" fill="#e2e8f0" font-size="11">64</text>
      <text x="60" y="122" fill="#e2e8f0" font-size="11">400 B</text>
      <text x="130" y="122" fill="#22c55e" font-size="11">~0</text>
      <text x="230" y="122" fill="#e2e8f0" font-size="11">Scientific computing</text>
    </g>

    <!-- Comparison -->
    <rect x="30" y="290" width="400" height="80" rx="8" fill="#0f0c29" stroke="#06b6d4" stroke-width="1"/>
    <text x="230" y="315" fill="#06b6d4" font-size="13" font-weight="bold" text-anchor="middle">
      Storage Comparison (8-bit quantized)
    </text>
    <text x="230" y="338" fill="#e2e8f0" font-size="12" text-anchor="middle">
      EML 50-leaf: 50 bytes  vs  ReLU 5×100: 50,500 bytes
    </text>
    <text x="230" y="358" fill="#22c55e" font-size="14" text-anchor="middle" font-weight="bold">
      1000× compression!
    </text>

    <!-- Insight -->
    <rect x="30" y="385" width="400" height="85" rx="8" fill="#0c4a6e"/>
    <text x="230" y="410" fill="#67e8f9" font-size="13" font-weight="bold" text-anchor="middle">
      💡 Key Insight
    </text>
    <text x="230" y="430" fill="#e2e8f0" font-size="11" text-anchor="middle">
      EML trees are inherently quantization-friendly:
    </text>
    <text x="230" y="450" fill="#e2e8f0" font-size="11" text-anchor="middle">
      50 parameters vs 50,000 means each parameter
    </text>
    <text x="230" y="465" fill="#06b6d4" font-size="12" text-anchor="middle" font-weight="bold">
      can use 1000× more bits at same total cost
    </text>
  </g>

  <text x="500" y="585" fill="#475569" font-size="10" text-anchor="middle">
    Lean 4 Verified: sensitivity_nonneg • smaller_weights_better_privacy • quantization_8bit_50leaf • quantization_improves
  </text>
</svg>
