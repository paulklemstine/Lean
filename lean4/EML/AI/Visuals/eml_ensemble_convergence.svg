<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d29922"/>
      <stop offset="100%" style="stop-color:#9e6a03"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="40" fill="#fff" font-size="24" font-weight="bold" text-anchor="middle">
    EML Ensemble Learning &amp; Convergence Theory
  </text>

  <!-- Left panel: Ensemble Variance Reduction -->
  <g transform="translate(40, 70)">
    <rect width="440" height="280" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="220" y="25" fill="#58a6ff" font-size="16" font-weight="bold" text-anchor="middle">
      Ensemble Variance Reduction: σ²/m
    </text>

    <!-- Axes -->
    <line x1="60" y1="245" x2="410" y2="245" stroke="#484f58" stroke-width="1"/>
    <line x1="60" y1="50" x2="60" y2="245" stroke="#484f58" stroke-width="1"/>
    <text x="235" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Number of Trees (m)</text>
    <text x="25" y="150" fill="#8b949e" font-size="11" text-anchor="middle" transform="rotate(-90,25,150)">Variance</text>

    <!-- 1/m curve -->
    <path d="M 60,60 Q 90,80 120,120 Q 160,160 200,180 Q 250,200 300,210 Q 350,220 410,225"
          fill="none" stroke="#58a6ff" stroke-width="3"/>

    <!-- Data points -->
    <circle cx="60" cy="60" r="5" fill="#58a6ff"/>
    <circle cx="120" cy="120" r="5" fill="#58a6ff"/>
    <circle cx="180" cy="160" r="5" fill="#58a6ff"/>
    <circle cx="240" cy="185" r="5" fill="#58a6ff"/>
    <circle cx="300" cy="205" r="5" fill="#58a6ff"/>
    <circle cx="360" cy="215" r="5" fill="#58a6ff"/>
    <circle cx="410" cy="225" r="5" fill="#58a6ff"/>

    <!-- Labels -->
    <text x="68" y="55" fill="#8b949e" font-size="10">m=1: σ²</text>
    <text x="128" y="115" fill="#8b949e" font-size="10">m=2: σ²/2</text>
    <text x="248" y="180" fill="#8b949e" font-size="10">m=5: σ²/5</text>
    <text x="308" y="200" fill="#8b949e" font-size="10">m=10: σ²/10</text>

    <!-- Theorem box -->
    <rect x="250" y="55" width="170" height="40" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="335" y="72" fill="#58a6ff" font-size="11" text-anchor="middle" font-weight="bold">Lean Verified ✓</text>
    <text x="335" y="88" fill="#c9d1d9" font-size="10" text-anchor="middle">ensemble_variance_reduction</text>
  </g>

  <!-- Right panel: Convergence Rate -->
  <g transform="translate(520, 70)">
    <rect width="440" height="280" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="220" y="25" fill="#3fb950" font-size="16" font-weight="bold" text-anchor="middle">
      GD Convergence: O(1/T)
    </text>

    <!-- Axes -->
    <line x1="60" y1="245" x2="410" y2="245" stroke="#484f58" stroke-width="1"/>
    <line x1="60" y1="50" x2="60" y2="245" stroke="#484f58" stroke-width="1"/>
    <text x="235" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Iterations (T)</text>
    <text x="25" y="150" fill="#8b949e" font-size="11" text-anchor="middle" transform="rotate(-90,25,150)">Loss Gap</text>

    <!-- 1/T curve -->
    <path d="M 60,60 Q 100,140 140,180 Q 180,200 220,215 Q 260,225 300,230 Q 340,233 410,238"
          fill="none" stroke="#3fb950" stroke-width="3"/>

    <!-- Theory bound (dashed) -->
    <path d="M 60,55 Q 100,130 140,170 Q 180,190 220,205 Q 260,215 300,222 Q 340,227 410,233"
          fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Legend -->
    <line x1="260" y1="60" x2="290" y2="60" stroke="#3fb950" stroke-width="3"/>
    <text x="295" y="64" fill="#c9d1d9" font-size="10">Actual loss</text>
    <line x1="260" y1="80" x2="290" y2="80" stroke="#d29922" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="295" y="84" fill="#c9d1d9" font-size="10">Theory: D²/(2ηT)</text>

    <!-- Theorem box -->
    <rect x="250" y="100" width="170" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
    <text x="335" y="117" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="bold">Lean Verified ✓</text>
    <text x="335" y="133" fill="#c9d1d9" font-size="10" text-anchor="middle">gd_convergence_improves</text>
  </g>

  <!-- Bottom panel: Transfer Learning Advantage -->
  <g transform="translate(40, 380)">
    <rect width="920" height="290" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="460" y="30" fill="#d29922" font-size="18" font-weight="bold" text-anchor="middle">
      EML Transfer Learning: k vs k² Parameters
    </text>

    <!-- Bar chart -->
    <g transform="translate(60, 60)">
      <!-- k=5 -->
      <rect x="0" y="140" width="60" height="60" rx="4" fill="url(#accentBlue)"/>
      <rect x="80" y="175" width="60" height="25" rx="4" fill="url(#accentGreen)"/>
      <text x="30" y="215" fill="#8b949e" font-size="10" text-anchor="middle">Full: 25</text>
      <text x="110" y="215" fill="#8b949e" font-size="10" text-anchor="middle">Transfer: 5</text>
      <text x="70" y="135" fill="#c9d1d9" font-size="12" text-anchor="middle" font-weight="bold">k=5 (5×)</text>

      <!-- k=10 -->
      <rect x="180" y="100" width="60" height="100" rx="4" fill="url(#accentBlue)"/>
      <rect x="260" y="175" width="60" height="25" rx="4" fill="url(#accentGreen)"/>
      <text x="210" y="215" fill="#8b949e" font-size="10" text-anchor="middle">Full: 100</text>
      <text x="290" y="215" fill="#8b949e" font-size="10" text-anchor="middle">Transfer: 10</text>
      <text x="250" y="95" fill="#c9d1d9" font-size="12" text-anchor="middle" font-weight="bold">k=10 (10×)</text>

      <!-- k=20 -->
      <rect x="360" y="0" width="60" height="200" rx="4" fill="url(#accentBlue)"/>
      <rect x="440" y="175" width="60" height="25" rx="4" fill="url(#accentGreen)"/>
      <text x="390" y="215" fill="#8b949e" font-size="10" text-anchor="middle">Full: 400</text>
      <text x="470" y="215" fill="#8b949e" font-size="10" text-anchor="middle">Transfer: 20</text>
      <text x="430" y="-5" fill="#c9d1d9" font-size="12" text-anchor="middle" font-weight="bold">k=20 (20×)</text>
    </g>

    <!-- Explanation -->
    <g transform="translate(600, 60)">
      <rect x="0" y="0" width="290" height="200" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
      <text x="145" y="30" fill="#d29922" font-size="14" font-weight="bold" text-anchor="middle">How It Works</text>

      <text x="15" y="60" fill="#c9d1d9" font-size="12">1. Train EML tree on Task A</text>
      <text x="15" y="80" fill="#c9d1d9" font-size="12">2. Freeze tree topology</text>
      <text x="15" y="100" fill="#c9d1d9" font-size="12">3. For Task B: optimize only</text>
      <text x="30" y="118" fill="#c9d1d9" font-size="12">k leaf values (not k² search)</text>

      <line x1="15" y1="130" x2="275" y2="130" stroke="#30363d" stroke-width="1"/>

      <text x="15" y="152" fill="#3fb950" font-size="12" font-weight="bold">✓ Lean: transfer_advantage</text>
      <text x="15" y="172" fill="#8b949e" font-size="11">For k ≥ 2: k &lt; k² (quadratic savings)</text>
      <text x="15" y="192" fill="#8b949e" font-size="11">k=100: 100× parameter reduction!</text>
    </g>

    <!-- Legend -->
    <rect x="60" y="265" width="15" height="10" rx="2" fill="url(#accentBlue)"/>
    <text x="80" y="275" fill="#8b949e" font-size="11">Full topology search (k²)</text>
    <rect x="250" y="265" width="15" height="10" rx="2" fill="url(#accentGreen)"/>
    <text x="270" y="275" fill="#8b949e" font-size="11">Transfer learning (k)</text>
  </g>

  <!-- Footer -->
  <text x="500" y="690" fill="#484f58" font-size="10" text-anchor="middle">
    All results formally verified in Lean 4 • AdvancedTheory.lean • Zero sorry proofs
  </text>
</svg>
