<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#00d4ff" font-size="24" font-weight="bold" font-family="Arial">
    EML Universal Approximation Theorem
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#888" font-size="12" font-family="Arial">
    Any continuous function on a compact set can be approximated by EML networks
  </text>
  
  <!-- Left: Target function (wavy curve) -->
  <g transform="translate(50, 100)">
    <text x="150" y="0" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="bold">Target: f ∈ C([a,b])</text>
    <rect x="20" y="15" width="260" height="180" rx="10" fill="none" stroke="#333" stroke-width="1.5"/>
    
    <!-- Axes -->
    <line x1="40" y1="175" x2="260" y2="175" stroke="#555" stroke-width="1"/>
    <line x1="40" y1="25" x2="40" y2="175" stroke="#555" stroke-width="1"/>
    
    <!-- Target function curve -->
    <path d="M 40 140 Q 80 30 120 100 Q 160 170 200 60 Q 230 40 260 80" 
          fill="none" stroke="#ff6b6b" stroke-width="3" filter="url(#glow)"/>
    <text x="150" y="210" text-anchor="middle" fill="#aaa" font-size="11">Any continuous function</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(330, 200)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#00d4ff" stroke-width="2"/>
    <polygon points="80,-6 95,0 80,6" fill="#00d4ff"/>
    <text x="47" y="-10" text-anchor="middle" fill="#00d4ff" font-size="11">ε-approx</text>
  </g>
  
  <!-- Right: EML network approximation -->
  <g transform="translate(430, 100)">
    <text x="200" y="0" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold">EML Network Σ αᵢ · EML(x)</text>
    <rect x="20" y="15" width="360" height="180" rx="10" fill="none" stroke="#333" stroke-width="1.5"/>
    
    <!-- Axes -->
    <line x1="40" y1="175" x2="360" y2="175" stroke="#555" stroke-width="1"/>
    <line x1="40" y1="25" x2="40" y2="175" stroke="#555" stroke-width="1"/>
    
    <!-- Approximation (dashed, similar to target) -->
    <path d="M 40 140 Q 80 30 120 100 Q 160 170 200 60 Q 230 40 260 80" 
          fill="none" stroke="#00ff88" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#glow)"/>
    
    <!-- Individual EML neurons (faded) -->
    <path d="M 40 120 Q 100 80 160 130 Q 220 170 360 50" fill="none" stroke="#00ff8844" stroke-width="1"/>
    <path d="M 40 150 Q 100 140 160 90 Q 220 60 360 120" fill="none" stroke="#00ff8844" stroke-width="1"/>
    <path d="M 40 100 Q 100 160 160 120 Q 220 100 360 140" fill="none" stroke="#00ff8844" stroke-width="1"/>
    
    <text x="200" y="210" text-anchor="middle" fill="#aaa" font-size="11">Sum of n EML neurons</text>
  </g>
  
  <!-- Proof sketch box -->
  <g transform="translate(50, 340)">
    <rect width="800" height="230" rx="10" fill="#111133" stroke="#333"/>
    <text x="400" y="25" text-anchor="middle" fill="#ffcc00" font-size="16" font-weight="bold">Proof Strategy (Lean 4 Formalized)</text>
    
    <!-- Step 1 -->
    <rect x="20" y="40" width="170" height="80" rx="8" fill="#1a1a3e" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="105" y="60" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">Step 1</text>
    <text x="105" y="78" text-anchor="middle" fill="#ccc" font-size="10">EML neurons</text>
    <text x="105" y="93" text-anchor="middle" fill="#ccc" font-size="10">separate points</text>
    <text x="105" y="108" text-anchor="middle" fill="#888" font-size="9">eml_separates_points</text>
    
    <!-- Arrow -->
    <line x1="195" y1="80" x2="225" y2="80" stroke="#555" stroke-width="1.5"/>
    <polygon points="225,77 232,80 225,83" fill="#555"/>
    
    <!-- Step 2 -->
    <rect x="235" y="40" width="170" height="80" rx="8" fill="#1a1a3e" stroke="#00ff88" stroke-width="1.5"/>
    <text x="320" y="60" text-anchor="middle" fill="#00ff88" font-size="12" font-weight="bold">Step 2</text>
    <text x="320" y="78" text-anchor="middle" fill="#ccc" font-size="10">EML neurons</text>
    <text x="320" y="93" text-anchor="middle" fill="#ccc" font-size="10">are nonvanishing</text>
    <text x="320" y="108" text-anchor="middle" fill="#888" font-size="9">eml_nonvanishing</text>
    
    <!-- Arrow -->
    <line x1="410" y1="80" x2="440" y2="80" stroke="#555" stroke-width="1.5"/>
    <polygon points="440,77 447,80 440,83" fill="#555"/>
    
    <!-- Step 3 -->
    <rect x="450" y="40" width="170" height="80" rx="8" fill="#1a1a3e" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="535" y="60" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">Step 3</text>
    <text x="535" y="78" text-anchor="middle" fill="#ccc" font-size="10">EML neurons</text>
    <text x="535" y="93" text-anchor="middle" fill="#ccc" font-size="10">are continuous</text>
    <text x="535" y="108" text-anchor="middle" fill="#888" font-size="9">eml_exp_neuron_continuous</text>
    
    <!-- Arrow -->
    <line x1="625" y1="80" x2="655" y2="80" stroke="#555" stroke-width="1.5"/>
    <polygon points="655,77 662,80 655,83" fill="#555"/>
    
    <!-- Step 4 -->
    <rect x="665" y="40" width="120" height="80" rx="8" fill="#1a1a3e" stroke="#ffcc00" stroke-width="2"/>
    <text x="725" y="60" text-anchor="middle" fill="#ffcc00" font-size="12" font-weight="bold">Result</text>
    <text x="725" y="78" text-anchor="middle" fill="#ffcc00" font-size="10">Stone-</text>
    <text x="725" y="93" text-anchor="middle" fill="#ffcc00" font-size="10">Weierstrass</text>
    <text x="725" y="108" text-anchor="middle" fill="#ffcc00" font-size="10">→ Dense!</text>
    
    <!-- Bottom note -->
    <text x="400" y="150" text-anchor="middle" fill="#ccc" font-size="13">
      ∀ f ∈ C([a,b]), ∀ ε &gt; 0, ∃ n ∈ ℕ, ∃ αᵢ,wᵢ,bᵢ : |f(x) − Σ αᵢ·EML_neuron(wᵢ,bᵢ,x)| &lt; ε
    </text>
    
    <text x="400" y="175" text-anchor="middle" fill="#888" font-size="11">
      Key advantage over standard UAT: EML neurons give exact symbolic formulas after training
    </text>
    
    <text x="400" y="200" text-anchor="middle" fill="#555" font-size="10">
      Proven in Lean 4 — All prerequisites formalized with zero sorry's
    </text>
  </g>
</svg>
