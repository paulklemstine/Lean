<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">
    EML Depth Efficiency: Towers of Exponentials
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#8b949e" font-size="12">
    A depth-d EML chain computes exp^d(x) — requiring exponentially many ReLU neurons
  </text>

  <!-- EML side -->
  <rect x="30" y="75" width="350" height="310" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
  <text x="205" y="100" text-anchor="middle" fill="#238636" font-size="16" font-weight="bold">
    EML Chain (Depth d)
  </text>
  <text x="205" y="118" text-anchor="middle" fill="#8b949e" font-size="11">
    2d + 1 leaves, 6d parameters
  </text>

  <!-- EML chain visualization -->
  <!-- Depth 1 -->
  <rect x="60" y="135" width="290" height="35" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="70" y="157" fill="#8b949e" font-size="11">d=1:</text>
  <circle cx="140" cy="152" r="12" fill="#238636"/>
  <text x="140" y="156" text-anchor="middle" fill="white" font-size="9">eml</text>
  <text x="115" y="152" text-anchor="middle" fill="#58a6ff" font-size="10">x</text>
  <text x="165" y="152" text-anchor="middle" fill="#ff9500" font-size="10">1</text>
  <text x="210" y="157" fill="#e6edf3" font-size="11">→ exp(x)</text>
  <text x="310" y="157" fill="#58a6ff" font-size="10">3 leaves</text>

  <!-- Depth 2 -->
  <rect x="60" y="178" width="290" height="35" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="70" y="200" fill="#8b949e" font-size="11">d=2:</text>
  <circle cx="160" cy="195" r="12" fill="#238636"/>
  <text x="160" y="199" text-anchor="middle" fill="white" font-size="9">eml</text>
  <circle cx="130" cy="195" r="10" fill="#1f6feb"/>
  <text x="130" y="199" text-anchor="middle" fill="white" font-size="8">eml</text>
  <text x="190" y="199" fill="#ff9500" font-size="10">1</text>
  <text x="210" y="200" fill="#e6edf3" font-size="11">→ exp²(x)</text>
  <text x="310" y="200" fill="#58a6ff" font-size="10">5 leaves</text>

  <!-- Depth 3 -->
  <rect x="60" y="221" width="290" height="35" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="70" y="243" fill="#8b949e" font-size="11">d=3:</text>
  <text x="155" y="243" fill="#e6edf3" font-size="11">eml(eml(eml(x,1),1),1)</text>
  <text x="310" y="243" fill="#58a6ff" font-size="10">7 leaves</text>

  <!-- Depth 5 -->
  <rect x="60" y="264" width="290" height="35" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="70" y="286" fill="#8b949e" font-size="11">d=5:</text>
  <text x="155" y="286" fill="#e6edf3" font-size="11">exp⁵(x) — 5 nested exp</text>
  <text x="310" y="286" fill="#58a6ff" font-size="10">11 leaves</text>

  <!-- Formula -->
  <rect x="60" y="310" width="290" height="55" rx="5" fill="#0d1117" stroke="#238636"/>
  <text x="205" y="333" text-anchor="middle" fill="#238636" font-size="13" font-weight="bold">
    Parameters = 6d
  </text>
  <text x="205" y="353" text-anchor="middle" fill="#aaf0d1" font-size="11">
    Linear growth with depth!
  </text>

  <!-- ReLU side -->
  <rect x="420" y="75" width="350" height="310" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="595" y="100" text-anchor="middle" fill="#f85149" font-size="16" font-weight="bold">
    ReLU Network (Width W)
  </text>
  <text x="595" y="118" text-anchor="middle" fill="#8b949e" font-size="11">
    W ≈ 2^d neurons needed to approximate exp^d
  </text>

  <!-- ReLU layers -->
  <rect x="450" y="135" width="290" height="35" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="460" y="157" fill="#8b949e" font-size="11">d=1:</text>
  <text x="540" y="157" fill="#e6edf3" font-size="11">~2 neurons</text>
  <text x="700" y="157" fill="#f85149" font-size="10">~6 params</text>

  <rect x="450" y="178" width="290" height="35" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="460" y="200" fill="#8b949e" font-size="11">d=2:</text>
  <text x="540" y="200" fill="#e6edf3" font-size="11">~4 neurons</text>
  <text x="700" y="200" fill="#f85149" font-size="10">~20 params</text>

  <rect x="450" y="221" width="290" height="35" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="460" y="243" fill="#8b949e" font-size="11">d=3:</text>
  <text x="540" y="243" fill="#e6edf3" font-size="11">~8 neurons</text>
  <text x="700" y="243" fill="#f85149" font-size="10">~72 params</text>

  <rect x="450" y="264" width="290" height="35" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="460" y="286" fill="#8b949e" font-size="11">d=5:</text>
  <text x="540" y="286" fill="#e6edf3" font-size="11">~32 neurons</text>
  <text x="700" y="286" fill="#f85149" font-size="10">~1056 params</text>

  <!-- Formula -->
  <rect x="450" y="310" width="290" height="55" rx="5" fill="#0d1117" stroke="#f85149"/>
  <text x="595" y="333" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">
    Parameters ≈ O(2^d · W)
  </text>
  <text x="595" y="353" text-anchor="middle" fill="#ffa198" font-size="11">
    Exponential growth with depth!
  </text>

  <!-- Comparison chart -->
  <rect x="30" y="400" width="740" height="85" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="425" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">
    Parameter Comparison: EML vs ReLU for exp^d(x) Approximation
  </text>

  <!-- Bar chart -->
  <g transform="translate(80, 440)">
    <!-- EML bars -->
    <rect x="0" y="5" width="30" height="25" rx="3" fill="#238636"/>
    <text x="15" y="22" text-anchor="middle" fill="white" font-size="8">6</text>
    <rect x="80" y="5" width="30" height="25" rx="3" fill="#238636"/>
    <text x="95" y="22" text-anchor="middle" fill="white" font-size="8">12</text>
    <rect x="160" y="5" width="30" height="25" rx="3" fill="#238636"/>
    <text x="175" y="22" text-anchor="middle" fill="white" font-size="8">18</text>
    <rect x="240" y="5" width="30" height="25" rx="3" fill="#238636"/>
    <text x="255" y="22" text-anchor="middle" fill="white" font-size="8">24</text>
    <rect x="320" y="5" width="30" height="25" rx="3" fill="#238636"/>
    <text x="335" y="22" text-anchor="middle" fill="white" font-size="8">30</text>

    <!-- ReLU bars (scaled) -->
    <rect x="35" y="15" width="6" height="15" rx="2" fill="#f85149"/>
    <rect x="115" y="5" width="20" height="25" rx="2" fill="#f85149"/>
    <rect x="195" y="-5" width="35" height="35" rx="2" fill="#f85149"/>
    <text x="212" y="16" text-anchor="middle" fill="white" font-size="7">72</text>
    <rect x="275" y="-15" width="55" height="45" rx="2" fill="#f85149"/>
    <text x="302" y="12" text-anchor="middle" fill="white" font-size="7">288</text>
    <rect x="355" y="-25" width="90" height="55" rx="2" fill="#f85149"/>
    <text x="400" y="8" text-anchor="middle" fill="white" font-size="7">1056</text>

    <!-- Labels -->
    <text x="15" y="45" text-anchor="middle" fill="#8b949e" font-size="9">d=1</text>
    <text x="95" y="45" text-anchor="middle" fill="#8b949e" font-size="9">d=2</text>
    <text x="175" y="45" text-anchor="middle" fill="#8b949e" font-size="9">d=3</text>
    <text x="255" y="45" text-anchor="middle" fill="#8b949e" font-size="9">d=4</text>
    <text x="335" y="45" text-anchor="middle" fill="#8b949e" font-size="9">d=5</text>
  </g>

  <!-- Legend -->
  <rect x="560" y="447" width="12" height="12" rx="2" fill="#238636"/>
  <text x="578" y="458" fill="#238636" font-size="11">EML (linear)</text>
  <rect x="660" y="447" width="12" height="12" rx="2" fill="#f85149"/>
  <text x="678" y="458" fill="#f85149" font-size="11">ReLU (exponential)</text>
</svg>
