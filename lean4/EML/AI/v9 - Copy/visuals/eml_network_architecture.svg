<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <filter id="g3">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="750" fill="url(#bg3)"/>

  <text x="550" y="40" text-anchor="middle" fill="#FFD700" font-size="26" font-weight="bold" font-family="Arial" filter="url(#g3)">
    EML Neural Network Architecture for Factor Discovery
  </text>

  <!-- Input Layer -->
  <rect x="30" y="200" width="120" height="300" rx="10" fill="#1a3a5c" stroke="#4FC3F7" stroke-width="2"/>
  <text x="90" y="230" text-anchor="middle" fill="#4FC3F7" font-size="14" font-weight="bold" font-family="Arial">Input</text>
  <circle cx="90" cy="280" r="20" fill="#0288D1" fill-opacity="0.4" stroke="#4FC3F7"/>
  <text x="90" y="285" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial">k</text>
  <circle cx="90" cy="340" r="20" fill="#0288D1" fill-opacity="0.4" stroke="#4FC3F7"/>
  <text x="90" y="345" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial">N</text>
  <circle cx="90" cy="400" r="20" fill="#0288D1" fill-opacity="0.4" stroke="#4FC3F7"/>
  <text x="90" y="405" text-anchor="middle" fill="#fff" font-size="11" font-family="Arial">k/N</text>
  <circle cx="90" cy="460" r="20" fill="#0288D1" fill-opacity="0.4" stroke="#4FC3F7"/>
  <text x="90" y="465" text-anchor="middle" fill="#fff" font-size="10" font-family="Arial">N%k</text>

  <!-- EML Layer 1 -->
  <rect x="220" y="150" width="160" height="400" rx="10" fill="#2d1a4e" stroke="#CE93D8" stroke-width="2"/>
  <text x="300" y="180" text-anchor="middle" fill="#CE93D8" font-size="14" font-weight="bold" font-family="Arial">EML Layer 1</text>
  <text x="300" y="196" text-anchor="middle" fill="#999" font-size="10" font-family="Arial">4 params/neuron</text>

  <!-- EML neurons -->
  <g transform="translate(300, 240)">
    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#7B1FA2" fill-opacity="0.4" stroke="#CE93D8"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace">e^(w₁x+b₁)-ln(w₂x+b₂)</text>
  </g>
  <g transform="translate(300, 300)">
    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#7B1FA2" fill-opacity="0.4" stroke="#CE93D8"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace">e^(w₁x+b₁)-ln(w₂x+b₂)</text>
  </g>
  <g transform="translate(300, 360)">
    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#7B1FA2" fill-opacity="0.4" stroke="#CE93D8"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace">e^(w₁x+b₁)-ln(w₂x+b₂)</text>
  </g>
  <g transform="translate(300, 420)">
    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#7B1FA2" fill-opacity="0.4" stroke="#CE93D8"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace">e^(w₁x+b₁)-ln(w₂x+b₂)</text>
  </g>
  <text x="300" y="480" text-anchor="middle" fill="#CE93D8" font-size="11" font-family="Arial">⋮ (W neurons)</text>
  <g transform="translate(300, 510)">
    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#7B1FA2" fill-opacity="0.4" stroke="#CE93D8"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace">e^(w₁x+b₁)-ln(w₂x+b₂)</text>
  </g>

  <!-- Connections input → layer 1 -->
  <g stroke="#4FC3F7" stroke-width="0.5" opacity="0.3">
    <line x1="110" y1="280" x2="250" y2="240"/>
    <line x1="110" y1="280" x2="250" y2="300"/>
    <line x1="110" y1="340" x2="250" y2="300"/>
    <line x1="110" y1="340" x2="250" y2="360"/>
    <line x1="110" y1="400" x2="250" y2="360"/>
    <line x1="110" y1="400" x2="250" y2="420"/>
    <line x1="110" y1="460" x2="250" y2="420"/>
    <line x1="110" y1="460" x2="250" y2="510"/>
  </g>

  <!-- EML Layer 2 -->
  <rect x="450" y="200" width="160" height="300" rx="10" fill="#2d1a4e" stroke="#CE93D8" stroke-width="2"/>
  <text x="530" y="230" text-anchor="middle" fill="#CE93D8" font-size="14" font-weight="bold" font-family="Arial">EML Layer 2</text>
  <g transform="translate(530, 290)">
    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#7B1FA2" fill-opacity="0.4" stroke="#CE93D8"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace">EML neuron</text>
  </g>
  <g transform="translate(530, 350)">
    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#7B1FA2" fill-opacity="0.4" stroke="#CE93D8"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace">EML neuron</text>
  </g>
  <g transform="translate(530, 410)">
    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="#7B1FA2" fill-opacity="0.4" stroke="#CE93D8"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="10" font-family="monospace">EML neuron</text>
  </g>

  <!-- Connections L1 → L2 -->
  <g stroke="#CE93D8" stroke-width="0.5" opacity="0.3">
    <line x1="380" y1="240" x2="480" y2="290"/>
    <line x1="380" y1="300" x2="480" y2="290"/>
    <line x1="380" y1="360" x2="480" y2="350"/>
    <line x1="380" y1="420" x2="480" y2="410"/>
    <line x1="380" y1="510" x2="480" y2="410"/>
  </g>

  <!-- Output -->
  <rect x="680" y="280" width="120" height="140" rx="10" fill="#1a3a1a" stroke="#66BB6A" stroke-width="2"/>
  <text x="740" y="310" text-anchor="middle" fill="#66BB6A" font-size="14" font-weight="bold" font-family="Arial">Output</text>
  <circle cx="740" cy="350" r="25" fill="#2E7D32" fill-opacity="0.4" stroke="#66BB6A" stroke-width="2"/>
  <text x="740" y="355" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial">P(k|N)</text>
  <text x="740" y="400" text-anchor="middle" fill="#999" font-size="10" font-family="Arial">Factor probability</text>

  <!-- L2 → Output -->
  <g stroke="#66BB6A" stroke-width="1" opacity="0.5">
    <line x1="610" y1="290" x2="715" y2="350"/>
    <line x1="610" y1="350" x2="715" y2="350"/>
    <line x1="610" y1="410" x2="715" y2="350"/>
  </g>

  <!-- Comparison Box -->
  <rect x="840" y="150" width="230" height="250" rx="10" fill="#111" stroke="#FFD700" stroke-width="1"/>
  <text x="955" y="180" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold" font-family="Arial">Parameter Comparison</text>

  <text x="860" y="210" fill="#CE93D8" font-size="12" font-family="monospace">EML Network:</text>
  <text x="860" y="230" fill="#ccc" font-size="11" font-family="monospace">  4W params/layer</text>
  <text x="860" y="248" fill="#ccc" font-size="11" font-family="monospace">  Width 100: 400/layer</text>
  <text x="860" y="266" fill="#8f8" font-size="11" font-family="monospace">  ✓ Interpretable</text>

  <line x1="860" y1="280" x2="1050" y2="280" stroke="#444"/>

  <text x="860" y="300" fill="#EF5350" font-size="12" font-family="monospace">Standard ReLU:</text>
  <text x="860" y="318" fill="#ccc" font-size="11" font-family="monospace">  W(W+1) params/layer</text>
  <text x="860" y="336" fill="#ccc" font-size="11" font-family="monospace">  Width 100: 10,100/layer</text>
  <text x="860" y="354" fill="#f88" font-size="11" font-family="monospace">  ✗ Black box</text>

  <line x1="860" y1="368" x2="1050" y2="368" stroke="#444"/>
  <text x="955" y="390" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold" font-family="monospace">25× compression</text>

  <!-- Key Insight -->
  <rect x="100" y="610" width="900" height="60" rx="8" fill="#1a1a3e" stroke="#FFD700" stroke-width="1"/>
  <text x="550" y="635" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold" font-family="Arial">
    Key Insight: EML neurons use exp and log as primitives, so they natively encode the
  </text>
  <text x="550" y="655" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold" font-family="Arial">
    energy landscape's analytic structure — no need to learn it from scratch like ReLU networks.
  </text>

  <!-- Footer -->
  <text x="550" y="700" text-anchor="middle" fill="#666" font-size="11" font-family="Arial">
    Formally verified: eml_param_advantage, depth_width_tradeoff, neural_sieve_complete, factor_detector_pos
  </text>
</svg>
