  <text x="600" y="775" text-anchor="middle" font-size="16" font-weight="bold" fill="#ddd">Summary: 7 Questions Answered in This Session</text>

  <text x="50" y="800" font-size="11" fill="#8d8">1. Dir #23 (Char Poly): B₁≅B₃ via leg-swap conjugation P∈O(2,1;ℤ). Nilpotency index = 3.</text>
  <text x="50" y="818" font-size="11" fill="#8d8">2. Dir #11 (Lyapunov): Spectrum is [0.88, 1.76], a compact interval — NOT a Cantor set.</text>
  <text x="50" y="836" font-size="11" fill="#8d8">3. Dir #30 (Tropical): Tree degenerates tropically — every pair (a,b) is a "triple". Not robust.</text>
  <text x="50" y="854" font-size="11" fill="#8d8">4. Dir #27 (Markov): No algebraic deformation between trees — different surfaces (cone vs cubic).</text>
  <text x="50" y="872" font-size="11" fill="#8d8">5. Dir #39 (Complexity): Path length O(log c) is optimal. Berggren path ≈ ternary expansion of angle.</text>
  <text x="50" y="854" font-size="11" fill="#8d8">6. Dir #3 (Angles): Confirmed bell-shaped, NOT uniform. Mean=45°, σ≈22°.</text>
  <text x="640" y="872" font-size="11" fill="#8d8">7. Dir #38 (Symbolic): Topological entropy = log 3 (full shift).</text>
