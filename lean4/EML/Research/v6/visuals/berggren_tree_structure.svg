<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e8eaf6"/>
    </linearGradient>
    <filter id="nodeShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a237e">
    The Berggren Tree of Pythagorean Triples
  </text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#5c6bc0" font-style="italic">
    Every primitive Pythagorean triple appears exactly once • Machine-verified in Lean 4
  </text>

  <!-- Tree edges -->
  <g stroke="#90a4ae" stroke-width="2.5" fill="none">
    <!-- Root to depth 1 -->
    <path d="M500,110 Q350,150 200,200"/>
    <path d="M500,110 Q500,150 500,200"/>
    <path d="M500,110 Q650,150 800,200"/>

    <!-- A children -->
    <path d="M200,240 Q150,270 100,310"/>
    <path d="M200,240 Q200,270 200,310"/>
    <path d="M200,240 Q250,270 300,310"/>

    <!-- B children -->
    <path d="M500,240 Q450,270 400,310"/>
    <path d="M500,240 Q500,270 500,310"/>
    <path d="M500,240 Q550,270 600,310"/>

    <!-- C children -->
    <path d="M800,240 Q750,270 700,310"/>
    <path d="M800,240 Q800,270 800,310"/>
    <path d="M800,240 Q850,270 900,310"/>
  </g>

  <!-- Branch labels -->
  <text x="320" y="145" font-size="16" font-weight="bold" fill="#e53935">A</text>
  <text x="510" y="145" font-size="16" font-weight="bold" fill="#43a047">B</text>
  <text x="685" y="145" font-size="16" font-weight="bold" fill="#1e88e5">C</text>

  <!-- Root node -->
  <circle cx="500" cy="100" r="35" fill="#fff3e0" stroke="#ff9800" stroke-width="3" filter="url(#nodeShadow)"/>
  <text x="500" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">(3,4,5)</text>
  <text x="500" y="112" text-anchor="middle" font-size="9" fill="#bf360c">root</text>

  <!-- Depth 1 nodes -->
  <circle cx="200" cy="220" r="32" fill="#ffebee" stroke="#e53935" stroke-width="2.5" filter="url(#nodeShadow)"/>
  <text x="200" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">(5,12,13)</text>
  <text x="200" y="232" text-anchor="middle" font-size="8" fill="#c62828">θ=67.4°</text>

  <circle cx="500" cy="220" r="32" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5" filter="url(#nodeShadow)"/>
  <text x="500" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">(21,20,29)</text>
  <text x="500" y="232" text-anchor="middle" font-size="8" fill="#2e7d32">θ=43.6°</text>

  <circle cx="800" cy="220" r="32" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2.5" filter="url(#nodeShadow)"/>
  <text x="800" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">(15,8,17)</text>
  <text x="800" y="232" text-anchor="middle" font-size="8" fill="#1565c0">θ=28.1°</text>

  <!-- Depth 2 nodes (A-branch) -->
  <circle cx="100" cy="330" r="28" fill="#fff" stroke="#ef9a9a" stroke-width="2" filter="url(#nodeShadow)"/>
  <text x="100" y="328" text-anchor="middle" font-size="10" fill="#c62828">(7,24,25)</text>
  <text x="100" y="340" text-anchor="middle" font-size="7" fill="#999">AA</text>

  <circle cx="200" cy="330" r="28" fill="#fff" stroke="#ef9a9a" stroke-width="2" filter="url(#nodeShadow)"/>
  <text x="200" y="328" text-anchor="middle" font-size="10" fill="#c62828">(55,48,73)</text>
  <text x="200" y="340" text-anchor="middle" font-size="7" fill="#999">AB</text>

  <circle cx="300" cy="330" r="28" fill="#fff" stroke="#ef9a9a" stroke-width="2" filter="url(#nodeShadow)"/>
  <text x="300" y="328" text-anchor="middle" font-size="10" fill="#c62828">(45,28,53)</text>
  <text x="300" y="340" text-anchor="middle" font-size="7" fill="#999">AC</text>

  <!-- Depth 2 nodes (B-branch) -->
  <circle cx="400" cy="330" r="28" fill="#fff" stroke="#a5d6a7" stroke-width="2" filter="url(#nodeShadow)"/>
  <text x="400" y="328" text-anchor="middle" font-size="10" fill="#2e7d32">(39,80,89)</text>
  <text x="400" y="340" text-anchor="middle" font-size="7" fill="#999">BA</text>

  <circle cx="500" cy="330" r="28" fill="#fff" stroke="#a5d6a7" stroke-width="2" filter="url(#nodeShadow)"/>
  <text x="500" y="324" text-anchor="middle" font-size="9" fill="#2e7d32">(119,120,</text>
  <text x="500" y="336" text-anchor="middle" font-size="9" fill="#2e7d32">169)</text>
  <text x="500" y="348" text-anchor="middle" font-size="7" fill="#999">BB</text>

  <circle cx="600" cy="330" r="28" fill="#fff" stroke="#a5d6a7" stroke-width="2" filter="url(#nodeShadow)"/>
  <text x="600" y="324" text-anchor="middle" font-size="9" fill="#2e7d32">(105,88,</text>
  <text x="600" y="336" text-anchor="middle" font-size="9" fill="#2e7d32">137)</text>
  <text x="600" y="348" text-anchor="middle" font-size="7" fill="#999">BC</text>

  <!-- Depth 2 nodes (C-branch) -->
  <circle cx="700" cy="330" r="28" fill="#fff" stroke="#90caf9" stroke-width="2" filter="url(#nodeShadow)"/>
  <text x="700" y="328" text-anchor="middle" font-size="10" fill="#1565c0">(33,56,65)</text>
  <text x="700" y="340" text-anchor="middle" font-size="7" fill="#999">CA</text>

  <circle cx="800" cy="330" r="28" fill="#fff" stroke="#90caf9" stroke-width="2" filter="url(#nodeShadow)"/>
  <text x="800" y="328" text-anchor="middle" font-size="10" fill="#1565c0">(65,72,97)</text>
  <text x="800" y="340" text-anchor="middle" font-size="7" fill="#999">CB</text>

  <circle cx="900" cy="330" r="28" fill="#fff" stroke="#90caf9" stroke-width="2" filter="url(#nodeShadow)"/>
  <text x="900" y="328" text-anchor="middle" font-size="10" fill="#1565c0">(35,12,37)</text>
  <text x="900" y="340" text-anchor="middle" font-size="7" fill="#999">CC</text>

  <!-- Ellipsis -->
  <text x="100" y="385" text-anchor="middle" font-size="18" fill="#999">⋮</text>
  <text x="200" y="385" text-anchor="middle" font-size="18" fill="#999">⋮</text>
  <text x="300" y="385" text-anchor="middle" font-size="18" fill="#999">⋮</text>
  <text x="500" y="385" text-anchor="middle" font-size="18" fill="#999">⋮</text>
  <text x="800" y="385" text-anchor="middle" font-size="18" fill="#999">⋮</text>

  <!-- Properties panel -->
  <rect x="50" y="420" width="420" height="310" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="260" y="448" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">Machine-Verified Properties</text>

  <text x="70" y="478" font-size="12" fill="#2e7d32">✅ Pythagorean preservation</text>
  <text x="75" y="494" font-size="10" fill="#555">a'² + b'² = c'² for all children</text>

  <text x="70" y="518" font-size="12" fill="#2e7d32">✅ Primitivity preservation</text>
  <text x="75" y="534" font-size="10" fill="#555">gcd(a',b') = 1 when gcd(a,b) = 1</text>

  <text x="70" y="558" font-size="12" fill="#2e7d32">✅ Lorentz form: a²+b²-c² invariant</text>
  <text x="75" y="574" font-size="10" fill="#555">Berggren matrices ∈ O(2,1;ℤ)</text>

  <text x="70" y="598" font-size="12" fill="#2e7d32">✅ Hypotenuse strictly grows</text>
  <text x="75" y="614" font-size="10" fill="#555">c' > c for positive triples with a,b &lt; c</text>

  <text x="70" y="638" font-size="12" fill="#2e7d32">✅ B-branch: c_{n+1} = 6c_n - c_{n-1}</text>
  <text x="75" y="654" font-size="10" fill="#555">Pell equation recurrence verified</text>

  <text x="70" y="678" font-size="12" fill="#1565c0">★ NEW: B₃ = P·B₁·P⁻¹ (similarity)</text>
  <text x="75" y="694" font-size="10" fill="#555">Explains identical characteristic polynomials</text>

  <text x="70" y="718" font-size="12" fill="#1565c0">★ NEW: Parent descent infrastructure</text>

  <!-- Matrix panel -->
  <rect x="530" y="420" width="420" height="310" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="740" y="448" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">Berggren Matrices</text>

  <text x="550" y="478" font-size="13" font-weight="bold" fill="#e53935">B₁ (A-branch):</text>
  <text x="555" y="498" font-size="12" fill="#333" font-family="monospace">⎡ 1  -2   2⎤   det = 1</text>
  <text x="555" y="514" font-size="12" fill="#333" font-family="monospace">⎢ 2  -1   2⎥   tr = 3</text>
  <text x="555" y="530" font-size="12" fill="#333" font-family="monospace">⎣ 2  -2   3⎦   χ = (x-1)³</text>

  <text x="550" y="558" font-size="13" font-weight="bold" fill="#43a047">B₂ (B-branch):</text>
  <text x="555" y="578" font-size="12" fill="#333" font-family="monospace">⎡ 1   2   2⎤   det = -1</text>
  <text x="555" y="594" font-size="12" fill="#333" font-family="monospace">⎢ 2   1   2⎥   tr = 5</text>
  <text x="555" y="610" font-size="12" fill="#333" font-family="monospace">⎣ 2   2   3⎦   χ = x³-5x²+5x+1</text>

  <text x="550" y="638" font-size="13" font-weight="bold" fill="#1e88e5">B₃ (C-branch):</text>
  <text x="555" y="658" font-size="12" fill="#333" font-family="monospace">⎡-1   2   2⎤   det = 1</text>
  <text x="555" y="674" font-size="12" fill="#333" font-family="monospace">⎢-2   1   2⎥   tr = 3</text>
  <text x="555" y="690" font-size="12" fill="#333" font-family="monospace">⎣-2   2   3⎦   χ = (x-1)³</text>

  <text x="555" y="718" font-size="11" fill="#7b1fa2" font-weight="bold">B₃ = P·B₁·P  where P = [[0,-1,0],[-1,0,0],[0,0,1]]</text>
</svg>
