<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <rect width="800" height="500" fill="#fff"/>

  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">
    Angle Distribution of Pythagorean Triples (Depth 7, n=2187)
  </text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#5c6bc0" font-style="italic">
    θ = arctan(b/a) for each triple (a,b,c) • Symmetric about 45° • NOT uniform
  </text>

  <!-- Axes -->
  <line x1="80" y1="400" x2="720" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="400" x2="80" y2="70" stroke="#333" stroke-width="1.5"/>

  <!-- X-axis labels -->
  <text x="80" y="420" text-anchor="middle" font-size="10" fill="#555">0°</text>
  <text x="186" y="420" text-anchor="middle" font-size="10" fill="#555">15°</text>
  <text x="293" y="420" text-anchor="middle" font-size="10" fill="#555">30°</text>
  <text x="400" y="420" text-anchor="middle" font-size="10" fill="#555">45°</text>
  <text x="507" y="420" text-anchor="middle" font-size="10" fill="#555">60°</text>
  <text x="614" y="420" text-anchor="middle" font-size="10" fill="#555">75°</text>
  <text x="720" y="420" text-anchor="middle" font-size="10" fill="#555">90°</text>
  <text x="400" y="445" text-anchor="middle" font-size="12" fill="#333">Angle θ = arctan(b/a)</text>

  <!-- Y-axis label -->
  <text x="25" y="235" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90, 25, 235)">Frequency</text>

  <!-- Y-axis ticks -->
  <text x="70" y="404" text-anchor="end" font-size="9" fill="#555">0</text>
  <text x="70" y="338" text-anchor="end" font-size="9" fill="#555">50</text>
  <text x="70" y="272" text-anchor="end" font-size="9" fill="#555">100</text>
  <text x="70" y="206" text-anchor="end" font-size="9" fill="#555">150</text>
  <text x="70" y="140" text-anchor="end" font-size="9" fill="#555">200</text>
  <text x="70" y="74" text-anchor="end" font-size="9" fill="#555">350</text>

  <!-- Grid lines -->
  <g stroke="#eee" stroke-width="0.5">
    <line x1="80" y1="335" x2="720" y2="335"/>
    <line x1="80" y1="270" x2="720" y2="270"/>
    <line x1="80" y1="205" x2="720" y2="205"/>
    <line x1="80" y1="140" x2="720" y2="140"/>
  </g>

  <!-- Symmetry line at 45° -->
  <line x1="400" y1="70" x2="400" y2="400" stroke="#e53935" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="402" y="66" font-size="9" fill="#e53935">45° (mean)</text>

  <!-- Histogram bars (from depth 7 data: 18 bins of 5°) -->
  <!-- Data: 0,8,58,123,135,223,181,28,338,337,28,181,223,135,123,58,8,0 -->
  <!-- Scale: max=338, bar_height proportional, bar_width = (720-80)/18 ≈ 35.6 -->

  <g fill="#3f51b5" fill-opacity="0.7" stroke="#1a237e" stroke-width="0.5">
    <!-- [0-5): 0 -->
    <rect x="80" y="400" width="35" height="0"/>
    <!-- [5-10): 8 -->
    <rect x="115" y="392" width="35" height="8"/>
    <!-- [10-15): 58 -->
    <rect x="150" y="324" width="35" height="76"/>
    <!-- [15-20): 123 -->
    <rect x="185" y="239" width="35" height="161"/>
    <!-- [20-25): 135 -->
    <rect x="220" y="223" width="35" height="177"/>
    <!-- [25-30): 223 -->
    <rect x="255" y="107" width="35" height="293"/>
    <!-- [30-35): 181 -->
    <rect x="290" y="163" width="35" height="237"/>
    <!-- [35-40): 28 -->
    <rect x="325" y="363" width="35" height="37"/>
    <!-- [40-45): 338 -->
    <rect x="360" y="84" width="35" height="316"/>
    <!-- [45-50): 337 -->
    <rect x="395" y="85" width="35" height="315"/>
    <!-- [50-55): 28 -->
    <rect x="430" y="363" width="35" height="37"/>
    <!-- [55-60): 181 -->
    <rect x="465" y="163" width="35" height="237"/>
    <!-- [60-65): 223 -->
    <rect x="500" y="107" width="35" height="293"/>
    <!-- [65-70): 135 -->
    <rect x="535" y="223" width="35" height="177"/>
    <!-- [70-75): 123 -->
    <rect x="570" y="239" width="35" height="161"/>
    <!-- [75-80): 58 -->
    <rect x="605" y="324" width="35" height="76"/>
    <!-- [80-85): 8 -->
    <rect x="640" y="392" width="35" height="8"/>
    <!-- [85-90): 0 -->
    <rect x="675" y="400" width="35" height="0"/>
  </g>

  <!-- Statistics box -->
  <rect x="560" y="60" width="160" height="100" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="640" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Statistics</text>
  <text x="570" y="96" font-size="10" fill="#555">Mean: 45.00°</text>
  <text x="570" y="112" font-size="10" fill="#555">Std dev: 17.49°</text>
  <text x="570" y="128" font-size="10" fill="#555">Range: [7.2°, 83.3°]</text>
  <text x="570" y="144" font-size="10" fill="#e53935">Uniform σ: 25.98°</text>

  <!-- Key observation -->
  <rect x="80" y="455" width="640" height="35" rx="5" fill="#e8eaf6" stroke="#7986cb" stroke-width="1"/>
  <text x="400" y="477" text-anchor="middle" font-size="11" fill="#1a237e">
    ★ Perfect mirror symmetry about 45° reflects B₃ = S·B₁·S conjugacy (machine-verified)
  </text>
</svg>
