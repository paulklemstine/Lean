<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
  <defs>
    <radialGradient id="poincare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="90%" stop-color="#c5cae9"/>
      <stop offset="100%" stop-color="#7986cb"/>
    </radialGradient>
    <clipPath id="diskClip">
      <circle cx="300" cy="330" r="220"/>
    </clipPath>
  </defs>

  <rect width="1000" height="600" fill="#fafafa"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a237e">
    The Berggren Tree in Hyperbolic Space
  </text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#5c6bc0" font-style="italic">
    Γ_B = ⟨B₁,B₂,B₃⟩ ⊂ O(2,1;ℤ) acts on the Poincaré disk model of ℍ²
  </text>

  <!-- Poincaré disk -->
  <circle cx="300" cy="330" r="220" fill="url(#poincare)" stroke="#3f51b5" stroke-width="2"/>

  <!-- Hyperbolic geodesics (arcs in the disk) -->
  <g clip-path="url(#diskClip)" stroke="#90a4ae" stroke-width="1" fill="none" opacity="0.4">
    <!-- Radial lines -->
    <line x1="300" y1="110" x2="300" y2="550"/>
    <line x1="80" y1="330" x2="520" y2="330"/>
    <line x1="144" y1="174" x2="456" y2="486"/>
    <line x1="144" y1="486" x2="456" y2="174"/>
    <!-- Arcs approximating hyperbolic geodesics -->
    <path d="M180,140 Q300,250 420,140"/>
    <path d="M140,220 Q300,350 460,220"/>
    <path d="M180,520 Q300,410 420,520"/>
    <path d="M140,440 Q300,310 460,440"/>
  </g>

  <!-- Tree nodes in hyperbolic space -->
  <g clip-path="url(#diskClip)">
    <!-- Root -->
    <circle cx="300" cy="280" r="8" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
    <text x="312" y="275" font-size="10" font-weight="bold" fill="#e65100">(3,4,5)</text>

    <!-- A-branch nodes (upper left) -->
    <circle cx="230" cy="210" r="6" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
    <text x="195" y="207" font-size="8" fill="#c62828">(5,12,13)</text>

    <circle cx="190" cy="160" r="5" fill="#ef9a9a" stroke="#e53935" stroke-width="1"/>
    <text x="152" y="158" font-size="7" fill="#e53935">(7,24,25)</text>

    <circle cx="165" cy="190" r="5" fill="#ef9a9a" stroke="#e53935" stroke-width="1"/>
    <circle cx="210" cy="170" r="5" fill="#ef9a9a" stroke="#e53935" stroke-width="1"/>

    <!-- B-branch nodes (right, moving to boundary fast) -->
    <circle cx="370" cy="250" r="6" fill="#66bb6a" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="380" y="248" font-size="8" fill="#2e7d32">(21,20,29)</text>

    <circle cx="420" cy="220" r="5" fill="#a5d6a7" stroke="#43a047" stroke-width="1"/>
    <text x="430" y="218" font-size="7" fill="#43a047">(119,120,169)</text>

    <circle cx="455" cy="200" r="4" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1"/>
    <circle cx="475" cy="185" r="3" fill="#e8f5e9" stroke="#81c784" stroke-width="1"/>

    <!-- C-branch nodes (lower left) -->
    <circle cx="240" cy="350" r="6" fill="#42a5f5" stroke="#1565c0" stroke-width="1.5"/>
    <text x="195" y="365" font-size="8" fill="#1565c0">(15,8,17)</text>

    <circle cx="200" cy="400" r="5" fill="#90caf9" stroke="#1e88e5" stroke-width="1"/>
    <circle cx="180" cy="380" r="5" fill="#90caf9" stroke="#1e88e5" stroke-width="1"/>
    <circle cx="220" cy="420" r="5" fill="#90caf9" stroke="#1e88e5" stroke-width="1"/>

    <!-- Edges -->
    <line x1="300" y1="280" x2="230" y2="210" stroke="#e53935" stroke-width="1.5"/>
    <line x1="300" y1="280" x2="370" y2="250" stroke="#43a047" stroke-width="1.5"/>
    <line x1="300" y1="280" x2="240" y2="350" stroke="#1e88e5" stroke-width="1.5"/>

    <line x1="230" y1="210" x2="190" y2="160" stroke="#ef9a9a" stroke-width="1"/>
    <line x1="230" y1="210" x2="165" y2="190" stroke="#ef9a9a" stroke-width="1"/>
    <line x1="230" y1="210" x2="210" y2="170" stroke="#ef9a9a" stroke-width="1"/>

    <line x1="370" y1="250" x2="420" y2="220" stroke="#a5d6a7" stroke-width="1"/>
    <line x1="420" y1="220" x2="455" y2="200" stroke="#c8e6c9" stroke-width="0.8"/>
    <line x1="455" y1="200" x2="475" y2="185" stroke="#e8f5e9" stroke-width="0.5"/>

    <line x1="240" y1="350" x2="200" y2="400" stroke="#90caf9" stroke-width="1"/>
    <line x1="240" y1="350" x2="180" y2="380" stroke="#90caf9" stroke-width="1"/>
    <line x1="240" y1="350" x2="220" y2="420" stroke="#90caf9" stroke-width="1"/>
  </g>

  <!-- Annotations on right side -->
  <rect x="570" y="80" width="400" height="490" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>

  <text x="770" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a237e">Key Insights</text>

  <text x="590" y="140" font-size="12" font-weight="bold" fill="#e53935">Lorentz Group Structure</text>
  <text x="590" y="158" font-size="10" fill="#555">Berggren matrices ∈ O(2,1;ℤ), the</text>
  <text x="590" y="173" font-size="10" fill="#555">integer Lorentz group. Verified: BᵀQB = Q</text>
  <text x="590" y="188" font-size="10" fill="#555">where Q = diag(1,1,-1).</text>

  <text x="590" y="218" font-size="12" font-weight="bold" fill="#43a047">B-branch → Pell Equations</text>
  <text x="590" y="236" font-size="10" fill="#555">Pure B-path nodes approach the</text>
  <text x="590" y="251" font-size="10" fill="#555">boundary exponentially: λ = 3+2√2.</text>
  <text x="590" y="266" font-size="10" fill="#555">This equals the fundamental unit of ℤ[√2].</text>
  <text x="590" y="281" font-size="10" fill="#555">Closed geodesics ↔ Pell solutions.</text>

  <text x="590" y="311" font-size="12" font-weight="bold" fill="#1e88e5">Fundamental Domain</text>
  <text x="590" y="329" font-size="10" fill="#555">The quotient ℍ²/Γ_B is a hyperbolic</text>
  <text x="590" y="344" font-size="10" fill="#555">surface with cusps. Each cusp corresponds</text>
  <text x="590" y="359" font-size="10" fill="#555">to a rational point on the unit circle</text>
  <text x="590" y="374" font-size="10" fill="#555">(a/c, b/c) — a primitive Pythagorean triple.</text>

  <text x="590" y="404" font-size="12" font-weight="bold" fill="#7b1fa2">NEW: Conjugacy B₁ ≅ B₃</text>
  <text x="590" y="422" font-size="10" fill="#555">B₃ = P·B₁·P where P swaps legs.</text>
  <text x="590" y="437" font-size="10" fill="#555">The A and C branches are mirror images</text>
  <text x="590" y="452" font-size="10" fill="#555">in hyperbolic space, reflected across</text>
  <text x="590" y="467" font-size="10" fill="#555">the 45° geodesic. Same growth rate λ_A=λ_C.</text>

  <text x="590" y="497" font-size="12" font-weight="bold" fill="#ff6f00">Open Questions</text>
  <text x="590" y="515" font-size="10" fill="#555">• Is ⟨B₁,B₂,B₃⟩ free? (Dir #2)</text>
  <text x="590" y="530" font-size="10" fill="#555">• What is the genus of ℍ²/Γ_B? (Dir #12)</text>
  <text x="590" y="545" font-size="10" fill="#555">• Spectral gap of Laplacian? (Dir #10)</text>
  <text x="590" y="560" font-size="10" fill="#555">• Selberg zeta function? (Dir #9)</text>
</svg>
