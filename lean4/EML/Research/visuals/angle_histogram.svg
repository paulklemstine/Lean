<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Georgia, serif">
  <rect width="700" height="500" fill="#050510"/>
  
  <text x="350" y="30" text-anchor="middle" fill="#e0e0ff" font-size="16" font-weight="bold">Angle Distribution of Berggren Tree Triples (Depth ≤ 5)</text>
  
  <!-- Axes -->
  <line x1="80" y1="400" x2="630" y2="400" stroke="#555588" stroke-width="1"/>
  <line x1="80" y1="50" x2="80" y2="400" stroke="#555588" stroke-width="1"/>
  
  <!-- X axis labels -->
  <text x="355.0" y="435" text-anchor="middle" fill="#8899bb" font-size="12">Angle θ = arctan(b/a) (degrees)</text>
  <text x="70" y="225.0" text-anchor="middle" fill="#8899bb" font-size="12" transform="rotate(-90 70 225.0)">Count</text>
  <rect x="81.0" y="400.0" width="28.6" height="0.0" fill="rgb(0,0,200)" opacity="0.8"/>
  <text x="95.3" y="415" text-anchor="middle" fill="#666699" font-size="8">0°</text>
  <rect x="111.6" y="394.4" width="28.6" height="5.6" fill="rgb(11,11,188)" opacity="0.8"/>
  <text x="125.8" y="415" text-anchor="middle" fill="#666699" font-size="8">5°</text>
  <rect x="142.1" y="343.8" width="28.6" height="56.2" fill="rgb(22,22,177)" opacity="0.8"/>
  <text x="156.4" y="415" text-anchor="middle" fill="#666699" font-size="8">10°</text>
  <rect x="172.7" y="287.5" width="28.6" height="112.5" fill="rgb(33,33,166)" opacity="0.8"/>
  <text x="186.9" y="415" text-anchor="middle" fill="#666699" font-size="8">15°</text>
  <rect x="203.2" y="276.2" width="28.6" height="123.8" fill="rgb(44,44,155)" opacity="0.8"/>
  <text x="217.5" y="415" text-anchor="middle" fill="#666699" font-size="8">20°</text>
  <rect x="233.8" y="186.2" width="28.6" height="213.8" fill="rgb(55,55,144)" opacity="0.8"/>
  <text x="248.1" y="415" text-anchor="middle" fill="#666699" font-size="8">25°</text>
  <rect x="264.3" y="231.2" width="28.6" height="168.8" fill="rgb(66,66,133)" opacity="0.8"/>
  <text x="278.6" y="415" text-anchor="middle" fill="#666699" font-size="8">30°</text>
  <rect x="294.9" y="371.9" width="28.6" height="28.1" fill="rgb(77,77,122)" opacity="0.8"/>
  <text x="309.2" y="415" text-anchor="middle" fill="#666699" font-size="8">35°</text>
  <rect x="325.4" y="85.0" width="28.6" height="315.0" fill="rgb(88,88,111)" opacity="0.8"/>
  <text x="339.7" y="415" text-anchor="middle" fill="#666699" font-size="8">40°</text>
  <rect x="356.0" y="85.0" width="28.6" height="315.0" fill="rgb(100,100,100)" opacity="0.8"/>
  <text x="370.3" y="415" text-anchor="middle" fill="#666699" font-size="8">45°</text>
  <rect x="386.6" y="371.9" width="28.6" height="28.1" fill="rgb(111,88,88)" opacity="0.8"/>
  <text x="400.8" y="415" text-anchor="middle" fill="#666699" font-size="8">50°</text>
  <rect x="417.1" y="231.2" width="28.6" height="168.8" fill="rgb(122,77,77)" opacity="0.8"/>
  <text x="431.4" y="415" text-anchor="middle" fill="#666699" font-size="8">55°</text>
  <rect x="447.7" y="191.9" width="28.6" height="208.1" fill="rgb(133,66,66)" opacity="0.8"/>
  <text x="461.9" y="415" text-anchor="middle" fill="#666699" font-size="8">60°</text>
  <rect x="478.2" y="270.6" width="28.6" height="129.4" fill="rgb(144,55,55)" opacity="0.8"/>
  <text x="492.5" y="415" text-anchor="middle" fill="#666699" font-size="8">65°</text>
  <rect x="508.8" y="287.5" width="28.6" height="112.5" fill="rgb(155,44,44)" opacity="0.8"/>
  <text x="523.1" y="415" text-anchor="middle" fill="#666699" font-size="8">70°</text>
  <rect x="539.3" y="343.8" width="28.6" height="56.2" fill="rgb(166,33,33)" opacity="0.8"/>
  <text x="553.6" y="415" text-anchor="middle" fill="#666699" font-size="8">75°</text>
  <rect x="569.9" y="394.4" width="28.6" height="5.6" fill="rgb(177,22,22)" opacity="0.8"/>
  <text x="584.2" y="415" text-anchor="middle" fill="#666699" font-size="8">80°</text>
  <rect x="600.4" y="400.0" width="28.6" height="0.0" fill="rgb(188,11,11)" opacity="0.8"/>
  <text x="614.7" y="415" text-anchor="middle" fill="#666699" font-size="8">85°</text>
  <line x1="355.0" y1="50" x2="355.0" y2="400" stroke="#ff6666" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="360.0" y="65" fill="#ff6666" font-size="9">mean ≈ 45°</text>

  <rect x="430" y="60" width="230" height="100" rx="5" fill="#0a0a20" stroke="#333366" stroke-width="1"/>
  <text x="445" y="80" fill="#aabbee" font-size="11" font-weight="bold">Statistics</text>
  <text x="445" y="98" fill="#8899bb" font-size="10">N = 364 triples</text>
  <text x="445" y="114" fill="#8899bb" font-size="10">Mean = 45.05°</text>
  <text x="445" y="130" fill="#8899bb" font-size="10">Std Dev = 17.44°</text>
  <text x="445" y="146" fill="#8899bb" font-size="10">Uniform would be: 25.98°</text>

  <text x="350" y="475" text-anchor="middle" fill="#666699" font-size="10" font-style="italic">Distribution is concentrated around 45°, confirming non-uniform limiting distribution</text>
</svg>
