  <rect width="1200" height="900" fill="url(#bg3)"/>
  
  <text x="600" y="40" text-anchor="middle" fill="#e0e0ff" font-size="22" font-weight="bold">EML–Pythagorean Research Roadmap</text>
  <text x="600" y="62" text-anchor="middle" fill="#8888cc" font-size="12">35+ Research Directions Across 9 Themes</text>
  
  <!-- ═══ Theme Boxes ═══ -->
  
  <!-- I. Foundations -->
  <rect x="20" y="85" width="270" height="150" rx="8" fill="#0a1530" stroke="#3366cc" stroke-width="2"/>
  <text x="155" y="107" text-anchor="middle" fill="#6699ff" font-size="13" font-weight="bold">I. Foundations</text>
  <text x="35" y="130" fill="#8899cc" font-size="9">▸ Berggren group structure ★★</text>
  <text x="35" y="148" fill="#8899cc" font-size="9">▸ Completeness proof ★★★</text>
  <text x="35" y="166" fill="#8899cc" font-size="9">▸ Primitivity preservation ★★</text>
  <text x="35" y="186" fill="#44cc44" font-size="9" font-weight="bold">STATUS: Lorentz ✓ | Pyth ✓ | Growth ✓</text>
  <text x="35" y="204" fill="#cccc44" font-size="9">NEXT: Free group proof, descent formalization</text>
  
  <!-- II. Gaussian Bridge -->
  <rect x="310" y="85" width="270" height="150" rx="8" fill="#0a2015" stroke="#33aa66" stroke-width="2"/>
  <text x="445" y="107" text-anchor="middle" fill="#66ff99" font-size="13" font-weight="bold">II. Gaussian Bridge</text>
