<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6688cc"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#e0e0ff" font-size="22" font-weight="bold">The Berggren Tree of Primitive Pythagorean Triples</text>
  <text x="500" y="55" text-anchor="middle" fill="#8888cc" font-size="12">EML–Pythagorean Bridge · Lorentz Group O(2,1;ℤ)</text>
  
  <!-- Root: (3,4,5) -->
  <circle cx="500" cy="100" r="28" fill="#2244aa" stroke="#6688ff" stroke-width="2" filter="url(#glow)"/>
  <text x="500" y="96" text-anchor="middle" fill="white" font-size="11" font-weight="bold">(3,4,5)</text>
  <text x="500" y="110" text-anchor="middle" fill="#aaccff" font-size="9">θ=53.1°</text>
  
  <!-- Depth 1 edges -->
  <line x1="480" y1="125" x2="200" y2="210" stroke="#4466aa" stroke-width="1.5"/>
  <line x1="500" y1="128" x2="500" y2="210" stroke="#44aa66" stroke-width="1.5"/>
  <line x1="520" y1="125" x2="800" y2="210" stroke="#aa4466" stroke-width="1.5"/>
  
  <!-- Labels on edges -->
  <text x="330" y="165" text-anchor="middle" fill="#6688cc" font-size="10" transform="rotate(-20 330 165)">M₁ (A)</text>
  <text x="515" y="175" text-anchor="start" fill="#66cc88" font-size="10">M₂ (B)</text>
  <text x="670" y="165" text-anchor="middle" fill="#cc6688" font-size="10" transform="rotate(20 670 165)">M₃ (C)</text>
  
  <!-- Depth 1: (5,12,13) -->
  <circle cx="200" cy="230" r="25" fill="#223388" stroke="#5577dd" stroke-width="1.5"/>
  <text x="200" y="226" text-anchor="middle" fill="white" font-size="10">(5,12,13)</text>
  <text x="200" y="240" text-anchor="middle" fill="#aaccff" font-size="8">θ=67.4°</text>
  
  <!-- Depth 1: (21,20,29) -->
  <circle cx="500" cy="230" r="25" fill="#224422" stroke="#55dd77" stroke-width="1.5"/>
  <text x="500" y="226" text-anchor="middle" fill="white" font-size="10">(21,20,29)</text>
  <text x="500" y="240" text-anchor="middle" fill="#aaffcc" font-size="8">θ=43.6°</text>
  
  <!-- Depth 1: (15,8,17) -->
  <circle cx="800" cy="230" r="25" fill="#442233" stroke="#dd5577" stroke-width="1.5"/>
  <text x="800" y="226" text-anchor="middle" fill="white" font-size="10">(15,8,17)</text>
  <text x="800" y="240" text-anchor="middle" fill="#ffaacc" font-size="8">θ=28.1°</text>
  
  <!-- Depth 2 edges from (5,12,13) -->
  <line x1="180" y1="252" x2="100" y2="330" stroke="#4466aa" stroke-width="1" opacity="0.7"/>
  <line x1="200" y1="255" x2="200" y2="330" stroke="#44aa66" stroke-width="1" opacity="0.7"/>
  <line x1="220" y1="252" x2="300" y2="330" stroke="#aa4466" stroke-width="1" opacity="0.7"/>
  
  <!-- Depth 2 children of (5,12,13) -->
  <circle cx="100" cy="350" r="20" fill="#1a2266" stroke="#4466bb" stroke-width="1"/>
  <text x="100" y="347" text-anchor="middle" fill="white" font-size="8">(7,24,25)</text>
  <text x="100" y="359" text-anchor="middle" fill="#8899cc" font-size="7">θ=73.7°</text>
  
  <circle cx="200" cy="350" r="20" fill="#1a3322" stroke="#44bb66" stroke-width="1"/>
  <text x="200" y="347" text-anchor="middle" fill="white" font-size="8">(55,48,73)</text>
  <text x="200" y="359" text-anchor="middle" fill="#88cc99" font-size="7">θ=41.1°</text>
  
  <circle cx="300" cy="350" r="20" fill="#331a22" stroke="#bb4466" stroke-width="1"/>
  <text x="300" y="347" text-anchor="middle" fill="white" font-size="8">(45,28,53)</text>
  <text x="300" y="359" text-anchor="middle" fill="#cc8899" font-size="7">θ=31.9°</text>
  
  <!-- Depth 2 edges from (21,20,29) -->
  <line x1="480" y1="252" x2="400" y2="330" stroke="#4466aa" stroke-width="1" opacity="0.7"/>
  <line x1="500" y1="255" x2="500" y2="330" stroke="#44aa66" stroke-width="1" opacity="0.7"/>
  <line x1="520" y1="252" x2="600" y2="330" stroke="#aa4466" stroke-width="1" opacity="0.7"/>
  
  <!-- Depth 2 children of (21,20,29) -->
  <circle cx="400" cy="350" r="20" fill="#1a2266" stroke="#4466bb" stroke-width="1"/>
  <text x="400" y="347" text-anchor="middle" fill="white" font-size="8">(39,80,89)</text>
  <text x="400" y="359" text-anchor="middle" fill="#8899cc" font-size="7">θ=64.0°</text>

  <circle cx="500" cy="350" r="20" fill="#1a3322" stroke="#44bb66" stroke-width="1"/>
  <text x="500" y="347" text-anchor="middle" fill="white" font-size="8">(119,120,169)</text>
  <text x="500" y="359" text-anchor="middle" fill="#88cc99" font-size="7">θ=45.2°</text>
  
  <circle cx="600" cy="350" r="20" fill="#331a22" stroke="#bb4466" stroke-width="1"/>
  <text x="600" y="347" text-anchor="middle" fill="white" font-size="8">(77,36,85)</text>
  <text x="600" y="359" text-anchor="middle" fill="#cc8899" font-size="7">θ=25.0°</text>
  
  <!-- Depth 2 edges from (15,8,17) -->
  <line x1="780" y1="252" x2="700" y2="330" stroke="#4466aa" stroke-width="1" opacity="0.7"/>
  <line x1="800" y1="255" x2="800" y2="330" stroke="#44aa66" stroke-width="1" opacity="0.7"/>
  <line x1="820" y1="252" x2="900" y2="330" stroke="#aa4466" stroke-width="1" opacity="0.7"/>
  
  <!-- Depth 2 children of (15,8,17) -->
  <circle cx="700" cy="350" r="20" fill="#1a2266" stroke="#4466bb" stroke-width="1"/>
  <text x="700" y="347" text-anchor="middle" fill="white" font-size="8">(33,56,65)</text>
  <text x="700" y="359" text-anchor="middle" fill="#8899cc" font-size="7">θ=59.5°</text>
  
  <circle cx="800" cy="350" r="20" fill="#1a3322" stroke="#44bb66" stroke-width="1"/>
  <text x="800" y="347" text-anchor="middle" fill="white" font-size="8">(65,72,97)</text>
  <text x="800" y="359" text-anchor="middle" fill="#88cc99" font-size="7">θ=47.9°</text>
  
  <circle cx="900" cy="350" r="20" fill="#331a22" stroke="#bb4466" stroke-width="1"/>
  <text x="900" y="347" text-anchor="middle" fill="white" font-size="8">(35,12,37)</text>
  <text x="900" y="359" text-anchor="middle" fill="#cc8899" font-size="7">θ=18.9°</text>
  
  <!-- Ellipsis dots -->
  <text x="100" y="400" text-anchor="middle" fill="#666" font-size="16">⋮</text>
  <text x="200" y="400" text-anchor="middle" fill="#666" font-size="16">⋮</text>
  <text x="300" y="400" text-anchor="middle" fill="#666" font-size="16">⋮</text>
  <text x="500" y="400" text-anchor="middle" fill="#666" font-size="16">⋮</text>
  <text x="800" y="400" text-anchor="middle" fill="#666" font-size="16">⋮</text>
  
  <!-- Legend / Info Panel -->
  <rect x="30" y="440" width="940" height="240" rx="10" fill="#0d0d35" stroke="#334477" stroke-width="1"/>
  
  <text x="500" y="465" text-anchor="middle" fill="#aabbee" font-size="14" font-weight="bold">Key Properties (Machine-Verified in Lean 4)</text>
  
  <!-- Column 1 -->
  <text x="60" y="495" fill="#88aaee" font-size="11" font-weight="bold">Lorentz Preservation</text>
  <text x="60" y="515" fill="#99aabb" font-size="10">• Bᵢᵀ · Q · Bᵢ = Q  where Q = diag(1,1,-1)</text>
  <text x="60" y="535" fill="#99aabb" font-size="10">• Each Bᵢ ∈ O(2,1;ℤ), the integer Lorentz group</text>
  <text x="60" y="555" fill="#99aabb" font-size="10">• Pythagorean triples = null cone of Q</text>
  <text x="60" y="575" fill="#99aabb" font-size="10">• det(B₁) = det(B₃) = 1, det(B₂) = -1</text>
  
  <!-- Column 2 -->
  <text x="400" y="495" fill="#88aaee" font-size="11" font-weight="bold">Growth &amp; Structure</text>
  <text x="400" y="515" fill="#99aabb" font-size="10">• B-branch growth rate → 3 + 2√2 ≈ 5.828</text>
  <text x="400" y="535" fill="#99aabb" font-size="10">• Pell recurrence: c_{n+1} = 6c_n - c_{n-1}</text>
  <text x="400" y="555" fill="#99aabb" font-size="10">• All triples are primitive (gcd(a,b) = 1)</text>
  <text x="400" y="575" fill="#99aabb" font-size="10">• Ternary tree: 3ⁿ triples at depth n</text>

  <!-- Column 3 / bottom -->
  <text x="60" y="605" fill="#88aaee" font-size="11" font-weight="bold">EML Bridge</text>
  <text x="60" y="625" fill="#99aabb" font-size="10">• eml(x,y) = exp(x) - ln(y) generates all elementary functions</text>
  <text x="60" y="645" fill="#99aabb" font-size="10">• Pythagorean condition in log-space: exp(2·ln a) + exp(2·ln b) = exp(2·ln c)</text>
  <text x="60" y="665" fill="#99aabb" font-size="10">• Each Berggren step encodable as O(1) EML operations → O(d) for depth-d triples</text>
  
  <!-- Color legend -->
  <circle cx="750" cy="610" r="6" fill="#2244aa" stroke="#5577dd" stroke-width="1"/>
  <text x="765" y="614" fill="#99aabb" font-size="10">A-branch (M₁)</text>
  <circle cx="750" cy="632" r="6" fill="#224422" stroke="#55dd77" stroke-width="1"/>
  <text x="765" y="636" fill="#99aabb" font-size="10">B-branch (M₂, fast growth)</text>
  <circle cx="750" cy="654" r="6" fill="#442233" stroke="#dd5577" stroke-width="1"/>
  <text x="765" y="658" fill="#99aabb" font-size="10">C-branch (M₃)</text>
</svg>
