<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg3)"/>

  <text x="450" y="35" text-anchor="middle" fill="#58a6ff" font-size="24" font-weight="bold">
    EML Dynamical Systems — Three Maps
  </text>

  <!-- Map 1: Diagonal -->
  <rect x="20" y="60" width="270" height="520" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="155" y="90" text-anchor="middle" fill="#ff7b72" font-size="16" font-weight="bold">Diagonal Map</text>
  <text x="155" y="112" text-anchor="middle" fill="#8b949e" font-size="13">d(x) = eˣ − ln(x)</text>

  <!-- Mini phase portrait for diagonal (diverging) -->
  <rect x="40" y="130" width="230" height="180" rx="5" fill="#0d1117" stroke="#30363d"/>
  <!-- Axis -->
  <line x1="60" y1="290" x2="250" y2="290" stroke="#484f58" stroke-width="1"/>
  <line x1="60" y1="290" x2="60" y2="140" stroke="#484f58" stroke-width="1"/>
  <text x="250" y="305" fill="#484f58" font-size="10">x</text>
  <text x="45" y="145" fill="#484f58" font-size="10">d(x)</text>
  <!-- y=x line -->
  <line x1="60" y1="290" x2="230" y2="120" stroke="#484f58" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- d(x) curve (always above y=x) -->
  <path d="M 70 270 Q 100 260, 120 240 Q 150 200, 170 150 Q 180 130, 190 110" fill="none" stroke="#ff7b72" stroke-width="2.5"/>
  <!-- Arrow showing divergence -->
  <text x="200" y="120" fill="#ff7b72" font-size="10">→ ∞</text>

  <!-- Properties -->
  <text x="40" y="335" fill="#c9d1d9" font-size="11">Properties (proved in Lean 4):</text>
  <text x="45" y="355" fill="#8b949e" font-size="10">✓ d(x) &gt; x for all x &gt; 0</text>
  <text x="45" y="375" fill="#8b949e" font-size="10">✓ No fixed points on (0,∞)</text>
  <text x="45" y="395" fill="#8b949e" font-size="10">✓ All orbits diverge to +∞</text>
  <text x="45" y="415" fill="#8b949e" font-size="10">✓ d''(x) = eˣ + 1/x² &gt; 0</text>
  <text x="45" y="435" fill="#8b949e" font-size="10">  (strictly convex)</text>

  <text x="45" y="465" fill="#ff7b72" font-size="11" font-weight="bold">Minimum:</text>
  <text x="45" y="485" fill="#8b949e" font-size="10">d(x) ≥ 2 for all x &gt; 0</text>
  <text x="45" y="505" fill="#8b949e" font-size="10">(from eˣ + 1 ≥ x + 1 and</text>
  <text x="45" y="520" fill="#8b949e" font-size="10"> ln(x) ≤ x − 1)</text>

  <!-- Map 2: One-minus-log -->
  <rect x="310" y="60" width="270" height="520" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="445" y="90" text-anchor="middle" fill="#7ee787" font-size="16" font-weight="bold">One-Minus-Log</text>
  <text x="445" y="112" text-anchor="middle" fill="#8b949e" font-size="13">g(x) = 1 − ln(x)</text>

  <!-- Mini phase portrait (spiral near fixed point) -->
  <rect x="330" y="130" width="230" height="180" rx="5" fill="#0d1117" stroke="#30363d"/>
  <line x1="350" y1="290" x2="540" y2="290" stroke="#484f58" stroke-width="1"/>
  <line x1="350" y1="290" x2="350" y2="140" stroke="#484f58" stroke-width="1"/>
  <text x="540" y="305" fill="#484f58" font-size="10">x</text>
  <text x="335" y="145" fill="#484f58" font-size="10">g(x)</text>
  <!-- y=x line -->
  <line x1="350" y1="290" x2="520" y2="120" stroke="#484f58" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- g(x) curve -->
  <path d="M 370 260 Q 420 200, 445 195 Q 470 190, 530 130" fill="none" stroke="#7ee787" stroke-width="2.5"/>
  <!-- Fixed point marker -->
  <circle cx="445" cy="195" r="4" fill="#ffd700" stroke="#ffd700"/>
  <text x="455" y="188" fill="#ffd700" font-size="9">x=1</text>

  <!-- Properties -->
  <text x="330" y="335" fill="#c9d1d9" font-size="11">Properties (proved in Lean 4):</text>
  <text x="335" y="355" fill="#8b949e" font-size="10">✓ g(1) = 1 (fixed point)</text>
  <text x="335" y="375" fill="#8b949e" font-size="10">✓ g'(1) = −1 (neutral)</text>
  <text x="335" y="395" fill="#8b949e" font-size="10">✓ g(e) = 0</text>
  <text x="335" y="415" fill="#8b949e" font-size="10">✓ g(e⁻¹) = 2</text>
  <text x="335" y="435" fill="#8b949e" font-size="10">✓ g(g(x)) = 1−ln(1−ln(x))</text>

  <text x="335" y="465" fill="#7ee787" font-size="11" font-weight="bold">Dynamics:</text>
  <text x="335" y="485" fill="#8b949e" font-size="10">Orbits oscillate around x=1</text>
  <text x="335" y="505" fill="#8b949e" font-size="10">|g'(1)| = 1 → marginal stability</text>
  <text x="335" y="525" fill="#8b949e" font-size="10">Lyapunov exponent λ ≈ 0</text>

  <!-- Map 3: Exp Tower -->
  <rect x="600" y="60" width="280" height="520" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="740" y="90" text-anchor="middle" fill="#d2a8ff" font-size="16" font-weight="bold">Exp Tower</text>
  <text x="740" y="112" text-anchor="middle" fill="#8b949e" font-size="13">T(n+1) = eᵀ⁽ⁿ⁾</text>

  <!-- Tower visualization -->
  <rect x="620" y="130" width="240" height="180" rx="5" fill="#0d1117" stroke="#30363d"/>
  <!-- Growth bars -->
  <rect x="640" y="275" width="20" height="25" fill="#d2a8ff" opacity="0.4"/>
  <text x="650" y="300" text-anchor="middle" fill="#8b949e" font-size="8">T(0)</text>
  <rect x="675" y="240" width="20" height="60" fill="#d2a8ff" opacity="0.5"/>
  <text x="685" y="300" text-anchor="middle" fill="#8b949e" font-size="8">T(1)</text>
  <rect x="710" y="195" width="20" height="105" fill="#d2a8ff" opacity="0.6"/>
  <text x="720" y="300" text-anchor="middle" fill="#8b949e" font-size="8">T(2)</text>
  <rect x="745" y="150" width="20" height="150" fill="#d2a8ff" opacity="0.7"/>
  <text x="755" y="300" text-anchor="middle" fill="#8b949e" font-size="8">T(3)</text>
  <rect x="780" y="135" width="20" height="165" fill="#d2a8ff" opacity="0.8"/>
  <text x="790" y="300" text-anchor="middle" fill="#8b949e" font-size="8">T(4)</text>
  <text x="830" y="155" fill="#d2a8ff" font-size="12">→ ∞</text>

  <!-- Properties -->
  <text x="620" y="335" fill="#c9d1d9" font-size="11">Properties (proved in Lean 4):</text>
  <text x="625" y="355" fill="#8b949e" font-size="10">✓ T(n) &gt; 0 for all n</text>
  <text x="625" y="375" fill="#8b949e" font-size="10">✓ T(n) &lt; T(n+1) (strict mono)</text>
  <text x="625" y="395" fill="#8b949e" font-size="10">✓ ∀M, ∃n: T(n) &gt; M (unbounded)</text>
  <text x="625" y="415" fill="#8b949e" font-size="10">✓ T(n) = EML(T(n-1), 1)</text>
  <text x="625" y="435" fill="#8b949e" font-size="10">✓ Each T(n) is EML-generated</text>

  <text x="625" y="465" fill="#d2a8ff" font-size="11" font-weight="bold">Values:</text>
  <text x="625" y="485" fill="#8b949e" font-size="10">T(0) = 1</text>
  <text x="625" y="505" fill="#8b949e" font-size="10">T(1) = e ≈ 2.718</text>
  <text x="625" y="525" fill="#8b949e" font-size="10">T(2) = eᵉ ≈ 15.15</text>
  <text x="625" y="545" fill="#8b949e" font-size="10">T(3) = eᵉᵉ ≈ 3.8 × 10⁶</text>
  <text x="625" y="565" fill="#8b949e" font-size="10">T(4) ≈ 10^(1.66×10⁶)</text>
</svg>
