<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#f0f4ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#1a1a4e" font-size="22" font-weight="bold">
    Interval Arithmetic for EML (Formally Verified)
  </text>

  <!-- Main diagram -->
  <!-- x-axis interval -->
  <text x="100" y="80" fill="#333" font-size="14" font-weight="bold">Input intervals:</text>

  <!-- x interval -->
  <rect x="100" y="95" width="250" height="40" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="225" y="120" text-anchor="middle" fill="#1565c0" font-size="14">x ∈ [x_lo, x_hi]</text>

  <!-- y interval -->
  <rect x="400" y="95" width="250" height="40" rx="5" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="525" y="120" text-anchor="middle" fill="#c62828" font-size="14">y ∈ [y_lo, y_hi], y_lo &gt; 0</text>

  <!-- Arrow down -->
  <path d="M 400 145 L 400 175" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <line x1="400" y1="145" x2="400" y2="175" stroke="#333" stroke-width="2"/>
  <polygon points="395,175 400,185 405,175" fill="#333"/>

  <!-- EML box -->
  <rect x="300" y="190" width="200" height="50" rx="10" fill="#1a1a4e" stroke="#ffd700" stroke-width="2"/>
  <text x="400" y="215" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold">EML(x, y) = eˣ − ln(y)</text>
  <text x="400" y="230" text-anchor="middle" fill="#aaa" font-size="10">↑ in x, ↓ in y</text>

  <!-- Arrow down -->
  <line x1="400" y1="240" x2="400" y2="270" stroke="#333" stroke-width="2"/>
  <polygon points="395,270 400,280 405,270" fill="#333"/>

  <!-- Output interval -->
  <rect x="150" y="285" width="500" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="400" y="310" text-anchor="middle" fill="#2e7d32" font-size="16" font-weight="bold">
    EML(x, y) ∈ [EML(x_lo, y_hi), EML(x_hi, y_lo)]
  </text>
  <text x="400" y="333" text-anchor="middle" fill="#388e3c" font-size="12">
    Guaranteed enclosure — no result can escape this interval
  </text>

  <!-- Explanation -->
  <rect x="50" y="370" width="320" height="110" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="210" y="392" text-anchor="middle" fill="#e65100" font-size="14" font-weight="bold">Why It Works</text>
  <text x="70" y="412" fill="#333" font-size="11">• exp(x) is monotonically increasing</text>
  <text x="70" y="430" fill="#333" font-size="11">• ln(y) is monotonically increasing for y &gt; 0</text>
  <text x="70" y="448" fill="#333" font-size="11">• EML = exp - ln inherits:</text>
  <text x="80" y="466" fill="#333" font-size="11">  ↑ in first arg, ↓ in second arg</text>

  <rect x="430" y="370" width="320" height="110" rx="8" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="590" y="392" text-anchor="middle" fill="#283593" font-size="14" font-weight="bold">Lean 4 Verification</text>
  <text x="450" y="412" fill="#333" font-size="11">theorem emlI_interval_enclosure:</text>
  <text x="455" y="430" fill="#555" font-size="10">  x_lo ≤ x → x ≤ x_hi →</text>
  <text x="455" y="446" fill="#555" font-size="10">  0 &lt; y_lo → y_lo ≤ y → y ≤ y_hi →</text>
  <text x="455" y="462" fill="#555" font-size="10">  emlI x_lo y_hi ≤ emlI x y ∧</text>
  <text x="455" y="478" fill="#555" font-size="10">  emlI x y ≤ emlI x_hi y_lo</text>
</svg>
