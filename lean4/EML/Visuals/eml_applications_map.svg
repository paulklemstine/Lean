<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .center-node { fill: #FF5722; stroke: #BF360C; stroke-width: 3; }
      .app-node { fill: #E3F2FD; stroke: #1565C0; stroke-width: 2; rx: 10; }
      .theory-node { fill: #FFF3E0; stroke: #E65100; stroke-width: 2; rx: 10; }
      .future-node { fill: #F3E5F5; stroke: #6A1B9A; stroke-width: 2; rx: 10; }
      .conn { stroke: #999; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
      .conn-solid { stroke: #666; stroke-width: 2; fill: none; }
      .center-text { font-family: Arial, sans-serif; font-size: 18px; fill: white; text-anchor: middle; font-weight: bold; }
      .node-title { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; font-weight: bold; }
      .node-detail { font-family: Arial, sans-serif; font-size: 10px; fill: #666; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 22px; fill: #1a1a1a; text-anchor: middle; font-weight: bold; }
      .legend-text { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" class="title">EML Operator: Applications &amp; Research Map</text>
  
  <!-- Central node -->
  <circle cx="500" cy="350" r="55" class="center-node"/>
  <text x="500" y="343" class="center-text">EML</text>
  <text x="500" y="363" font-family="Arial" font-size="11" fill="#FFE0B2" text-anchor="middle">eˣ - ln(y)</text>
  
  <!-- Application nodes (blue) -->
  <!-- Symbolic Regression -->
  <line x1="460" y1="310" x2="200" y2="120" class="conn-solid"/>
  <rect x="100" y="80" width="200" height="70" class="app-node"/>
  <text x="200" y="105" class="node-title">Symbolic Regression</text>
  <text x="200" y="120" class="node-detail">EML master formula as</text>
  <text x="200" y="133" class="node-detail">differentiable search space</text>
  
  <!-- Analog Computing -->
  <line x1="545" y1="310" x2="800" y2="120" class="conn-solid"/>
  <rect x="700" y="80" width="200" height="70" class="app-node"/>
  <text x="800" y="105" class="node-title">Analog Computing</text>
  <text x="800" y="120" class="node-detail">EML circuits as uniform</text>
  <text x="800" y="133" class="node-detail">building blocks for analog chips</text>
  
  <!-- Neural Architecture -->
  <line x1="460" y1="390" x2="130" y2="450" class="conn-solid"/>
  <rect x="30" y="420" width="200" height="70" class="app-node"/>
  <text x="130" y="445" class="node-title">Neural Architecture</text>
  <text x="130" y="460" class="node-detail">EML trees as interpretable</text>
  <text x="130" y="473" class="node-detail">network architectures</text>
  
  <!-- Compiler Design -->
  <line x1="540" y1="390" x2="870" y2="450" class="conn-solid"/>
  <rect x="770" y="420" width="200" height="70" class="app-node"/>
  <text x="870" y="445" class="node-title">EML Compiler</text>
  <text x="870" y="460" class="node-detail">Formula → EML tree</text>
  <text x="870" y="473" class="node-detail">Single-instruction evaluation</text>
  
  <!-- Theory nodes (orange) -->
  <!-- Complexity Theory -->
  <line x1="500" y1="295" x2="500" y2="120" class="conn-solid"/>
  <rect x="400" y="75" width="200" height="55" class="theory-node"/>
  <text x="500" y="98" class="node-title">Complexity Theory</text>
  <text x="500" y="115" class="node-detail">EML depth as intrinsic complexity measure</text>
  
  <!-- Algebra -->
  <line x1="460" y1="350" x2="120" y2="270" class="conn-solid"/>
  <rect x="20" y="240" width="200" height="55" class="theory-node"/>
  <text x="120" y="263" class="node-title">Universal Algebra</text>
  <text x="120" y="280" class="node-detail">EML as Sheffer element for ℂ-algebras</text>
  
  <!-- Combinatorics -->
  <line x1="540" y1="350" x2="880" y2="270" class="conn-solid"/>
  <rect x="780" y="240" width="200" height="55" class="theory-node"/>
  <text x="880" y="263" class="node-title">Combinatorics</text>
  <text x="880" y="280" class="node-detail">Catalan numbers, binary trees</text>
  
  <!-- Future nodes (purple) -->
  <!-- Ternary Operator -->
  <line x1="460" y1="380" x2="130" y2="580" class="conn"/>
  <rect x="30" y="555" width="200" height="55" class="future-node"/>
  <text x="130" y="578" class="node-title">🔮 Ternary EML Variant</text>
  <text x="130" y="595" class="node-detail">No constant needed?</text>
  
  <!-- Activation Functions -->
  <line x1="500" y1="405" x2="500" y2="580" class="conn"/>
  <rect x="350" y="570" width="300" height="55" class="future-node"/>
  <text x="500" y="593" class="node-title">🔮 EML-Based Activation Function</text>
  <text x="500" y="610" class="node-detail">Unary Sheffer for neural networks?</text>
  
  <!-- Quantum -->
  <line x1="540" y1="380" x2="870" y2="580" class="conn"/>
  <rect x="770" y="555" width="200" height="55" class="future-node"/>
  <text x="870" y="578" class="node-title">🔮 Quantum EML</text>
  <text x="870" y="595" class="node-detail">Unitary EML circuits?</text>
  
  <!-- Legend -->
  <rect x="30" y="650" width="15" height="15" fill="#E3F2FD" stroke="#1565C0" stroke-width="1" rx="3"/>
  <text x="52" y="662" class="legend-text">Current Applications</text>
  
  <rect x="230" y="650" width="15" height="15" fill="#FFF3E0" stroke="#E65100" stroke-width="1" rx="3"/>
  <text x="252" y="662" class="legend-text">Mathematical Theory</text>
  
  <rect x="430" y="650" width="15" height="15" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1" rx="3"/>
  <text x="452" y="662" class="legend-text">Future Research Directions</text>
</svg>
