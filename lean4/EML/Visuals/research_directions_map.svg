    35+ Research Directions • 30+ Verified Theorems • 7 Themes
  </text>

  <!-- Central hub -->
  <circle cx="450" cy="300" r="55" fill="rgba(255,215,0,0.15)" stroke="#ffd700" stroke-width="2.5"/>
