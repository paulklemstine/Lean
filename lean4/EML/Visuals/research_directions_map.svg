  <text x="450" y="130" text-anchor="middle" fill="#aaa" font-size="9">Completeness</text>
  <line x1="450" y1="160" x2="450" y2="245" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>

  <text x="375" y="105" fill="#7ec8e3" font-size="8">• Group structure</text>
