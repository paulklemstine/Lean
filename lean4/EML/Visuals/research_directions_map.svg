  <text x="450" y="310" text-anchor="middle" fill="#ffd700" font-size="13" font-weight="bold">Bridge</text>

  <!-- Theme 1: Foundations (top) -->
  <circle cx="450" cy="120" r="40" fill="rgba(0,229,255,0.12)" stroke="#00e5ff" stroke-width="1.5"/>
