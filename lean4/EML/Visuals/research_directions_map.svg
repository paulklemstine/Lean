  <circle cx="200" cy="170" r="38" fill="rgba(230,219,116,0.12)" stroke="#e6db74" stroke-width="1.5"/>
  <text x="200" y="165" text-anchor="middle" fill="#e6db74" font-size="10" font-weight="bold">Formal</text>
  <text x="200" y="178" text-anchor="middle" fill="#e6db74" font-size="10" font-weight="bold">Verification</text>
  <line x1="232" y1="198" x2="405" y2="270" stroke="#e6db74" stroke-width="1" opacity="0.4"/>

  <text x="100" y="155" fill="#f0e68c" font-size="8">• 30+ theorems ✓</text>
  <text x="100" y="168" fill="#f0e68c" font-size="8">• Lean 4 + Mathlib</text>
  <text x="100" y="181" fill="#f0e68c" font-size="8">• Zero sorry</text>

  <!-- Legend -->
  <rect x="320" y="555" width="260" height="30" rx="5" fill="rgba(255,255,255,0.05)" stroke="#555" stroke-width="0.5"/>
  <circle cx="345" cy="570" r="5" fill="#00e5ff"/>
  <text x="355" y="574" fill="#aaa" font-size="9">Verified</text>
  <circle cx="415" cy="570" r="5" fill="#fd971f"/>
  <text x="425" y="574" fill="#aaa" font-size="9">Partial</text>
  <circle cx="485" cy="570" r="5" fill="#f92672"/>
  <text x="495" y="574" fill="#aaa" font-size="9">Open</text>
</svg>
