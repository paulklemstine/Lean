  <circle cx="150" cy="330" r="38" fill="rgba(102,217,239,0.12)" stroke="#66d9ef" stroke-width="1.5"/>
  <text x="150" y="325" text-anchor="middle" fill="#66d9ef" font-size="10" font-weight="bold">Applications</text>
  <text x="150" y="338" text-anchor="middle" fill="#66d9ef" font-size="10" font-weight="bold">&amp; ML</text>
