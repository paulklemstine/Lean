  <text x="48" y="315" fill="#80deea" font-size="8">• Cryptography</text>
  <text x="48" y="328" fill="#80deea" font-size="8">• Neural nets</text>
  <text x="48" y="341" fill="#80deea" font-size="8">• Signal proc.</text>
