<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold">
    New Verified Results — OISCC Open Problems
  </text>
  <text x="500" y="62" text-anchor="middle" fill="#94a3b8" font-size="12">
    All theorems machine-verified in Lean 4 • Sorry-free • Standard axioms only
  </text>

  <!-- Results grid -->
  <!-- Row 1 -->
  <g transform="translate(30, 90)">
    <rect width="300" height="110" rx="10" fill="#0f2918" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="25" fill="#22c55e" font-size="11" font-weight="bold">PROBLEM 7 ✓ RESOLVED</text>
    <text x="15" y="45" fill="#f1f5f9" font-size="14" font-weight="bold">Complex EML = Trigonometry</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">ceml(ix, 1) = cos(x) + i·sin(x)</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">Euler's formula via single EML operation</text>
    <text x="15" y="100" fill="#64748b" font-size="9">Lean: ceml_euler, ceml_cos, ceml_sin</text>
  </g>

  <g transform="translate(350, 90)">
    <rect width="300" height="110" rx="10" fill="#0f2918" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="25" fill="#22c55e" font-size="11" font-weight="bold">PROBLEM 5 ✓ PARTIAL</text>
    <text x="15" y="45" fill="#f1f5f9" font-size="14" font-weight="bold">Depth Hierarchy (Levels 1-2)</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">exp(exp(x)) ∉ {exp(ax+b) : a,b ∈ ℝ}</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">Depth-2 strictly contains depth-1</text>
    <text x="15" y="100" fill="#64748b" font-size="9">Lean: double_exp_not_affine_exp</text>
  </g>

  <g transform="translate(670, 90)">
    <rect width="300" height="110" rx="10" fill="#0f2918" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="25" fill="#22c55e" font-size="11" font-weight="bold">PROBLEM 6 ✓ RESOLVED</text>
    <text x="15" y="45" fill="#f1f5f9" font-size="14" font-weight="bold">No Identity Element</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">¬∃e, ∀x, EML(x,e)=x (right)</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11">¬∃e, ∀x, EML(e,x)=x (left)</text>
    <text x="15" y="100" fill="#64748b" font-size="9">Lean: eml_no_right/left_identity</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(30, 220)">
    <rect width="300" height="110" rx="10" fill="#0f2918" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="25" fill="#22c55e" font-size="11" font-weight="bold">PROBLEM 4 ✓ PARTIAL</text>
    <text x="15" y="45" fill="#f1f5f9" font-size="14" font-weight="bold">Condition Numbers</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">κ_x(0, y) = 0 (perfectly conditioned)</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11">κ_x(x, 1) = |x| (linear growth)</text>
    <text x="15" y="100" fill="#64748b" font-size="9">Lean: emlCondX_at_zero, emlCondX_at_y_one</text>
  </g>

  <g transform="translate(350, 220)">
    <rect width="300" height="110" rx="10" fill="#0f2918" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="25" fill="#22c55e" font-size="11" font-weight="bold">PROBLEM 9 ✓ RESOLVED</text>
    <text x="15" y="45" fill="#f1f5f9" font-size="14" font-weight="bold">Tropical EML</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">tropicalEML(a,b) = a − b</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">Right identity ✓  Anti-commutative ✓</text>
    <text x="15" y="100" fill="#64748b" font-size="9">Lean: tropicalEML_* (4 theorems)</text>
  </g>

  <g transform="translate(670, 220)">
    <rect width="300" height="110" rx="10" fill="#0f2918" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="25" fill="#22c55e" font-size="11" font-weight="bold">NEW RESULT ✓</text>
    <text x="15" y="45" fill="#f1f5f9" font-size="14" font-weight="bold">EML Chain Rule</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">d/dt EML(g(t),h(t)) =</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11">  g'·exp(g) − h'/h</text>
    <text x="15" y="100" fill="#64748b" font-size="9">Lean: eml_chain_rule</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(30, 350)">
    <rect width="300" height="110" rx="10" fill="#0f2918" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="25" fill="#22c55e" font-size="11" font-weight="bold">NEW RESULT ✓</text>
    <text x="15" y="45" fill="#f1f5f9" font-size="14" font-weight="bold">Sigmoid Bounds &amp; Derivative</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">0 &lt; σ(x) &lt; 1  for all x</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11">σ'(x) = σ(x)·(1 − σ(x))</text>
    <text x="15" y="100" fill="#64748b" font-size="9">Lean: oiscc_sigmoid_pos/lt_one/deriv</text>
  </g>

  <g transform="translate(350, 350)">
    <rect width="300" height="110" rx="10" fill="#0f2918" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="25" fill="#22c55e" font-size="11" font-weight="bold">NEW RESULT ✓</text>
    <text x="15" y="45" fill="#f1f5f9" font-size="14" font-weight="bold">Log-Split Identity</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">EML(x, y·z) = EML(x,y) − ln(z)</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">For y, z &gt; 0. Enables optimization.</text>
    <text x="15" y="100" fill="#64748b" font-size="9">Lean: eml_log_split</text>
  </g>

  <g transform="translate(670, 350)">
    <rect width="300" height="110" rx="10" fill="#0f2918" stroke="#22c55e" stroke-width="2"/>
    <text x="15" y="25" fill="#22c55e" font-size="11" font-weight="bold">NEW RESULT ✓</text>
    <text x="15" y="45" fill="#f1f5f9" font-size="14" font-weight="bold">Catalan Tree Counting</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">C(n) = # distinct EML trees with n nodes</text>
    <text x="15" y="85" fill="#94a3b8" font-size="10">C(4) = 14 matches master formula params</text>
    <text x="15" y="100" fill="#64748b" font-size="9">Lean: emlCatalan_four</text>
  </g>

  <!-- Summary bar -->
  <rect x="30" y="490" width="940" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="515" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="bold">
    Total: 25+ new theorems • 0 sorries • 4 open problems partially resolved
  </text>
  <text x="500" y="538" text-anchor="middle" fill="#94a3b8" font-size="12">
    Problems 4, 5, 6, 7, 9 addressed  •  Problems 1, 2, 3, 8, 10 remain fully open
  </text>

  <!-- New demos bar -->
  <rect x="30" y="565" width="940" height="70" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="500" y="590" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold">
    New Applications Demonstrated
  </text>
  <text x="500" y="615" text-anchor="middle" fill="#cbd5e1" font-size="11">
    Kalman Filter (113 EML/step) • Signal Processing (wavelet, FM, spectral)
  </text>
  <text x="500" y="632" text-anchor="middle" fill="#cbd5e1" font-size="11">
    Neuromorphic Computing (spiking networks) • Cryptographic Hash (EML-based one-way function)
  </text>
</svg>
