<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>

  <rect width="1000" height="750" fill="url(#bg3)"/>

  <text x="500" y="40" text-anchor="middle" fill="#FFD700" font-size="24" font-weight="bold" filter="url(#glow3)">
    How EML Builds All of Arithmetic
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#aaa" font-size="14">
    From one operation and one constant, everything follows
  </text>

  <!-- Level 0: The constant 1 -->
  <g transform="translate(500, 100)">
    <circle r="30" fill="#1565C0" stroke="#42A5F5" stroke-width="2"/>
    <text y="6" text-anchor="middle" fill="white" font-size="20" font-weight="bold">1</text>
    <text y="55" text-anchor="middle" fill="#888" font-size="11">Starting constant</text>
  </g>

  <!-- Level 1: e -->
  <line x1="500" y1="135" x2="500" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <g transform="translate(500, 210)">
    <rect x="-80" y="-25" width="160" height="50" rx="10" fill="#2E7D32" stroke="#66BB6A" stroke-width="1.5"/>
    <text y="5" text-anchor="middle" fill="white" font-size="14" font-weight="bold">e = eml(1, 1)</text>
    <text x="-110" y="5" text-anchor="end" fill="#66BB6A" font-size="11">1 node</text>
    <text y="40" text-anchor="middle" fill="#888" font-size="11">≈ 2.71828...</text>
  </g>

  <!-- Level 2: e^e and e-1 -->
  <line x1="460" y1="235" x2="300" y2="280" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="235" x2="700" y2="280" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g transform="translate(300, 310)">
    <rect x="-90" y="-25" width="180" height="50" rx="10" fill="#F57F17" stroke="#FFB300" stroke-width="1.5"/>
    <text y="5" text-anchor="middle" fill="white" font-size="13" font-weight="bold">e^e = eml(e, 1)</text>
    <text x="-120" y="5" text-anchor="end" fill="#FFB300" font-size="11">2 nodes</text>
  </g>

  <g transform="translate(700, 310)">
    <rect x="-100" y="-25" width="200" height="50" rx="10" fill="#F57F17" stroke="#FFB300" stroke-width="1.5"/>
    <text y="5" text-anchor="middle" fill="white" font-size="13" font-weight="bold">e−1 = eml(1, e)</text>
    <text x="130" y="5" fill="#FFB300" font-size="11">2 nodes</text>
  </g>

  <!-- Level 3: 0 -->
  <line x1="300" y1="340" x2="400" y2="385" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g transform="translate(400, 410)">
    <rect x="-100" y="-25" width="200" height="50" rx="10" fill="#C62828" stroke="#EF5350" stroke-width="1.5"/>
    <text y="5" text-anchor="middle" fill="white" font-size="13" font-weight="bold">0 = eml(1, e^e)</text>
    <text x="-130" y="5" text-anchor="end" fill="#EF5350" font-size="11">3 nodes</text>
    <text y="40" text-anchor="middle" fill="#EF5350" font-size="11">First appearance of zero!</text>
  </g>

  <!-- Arithmetic operations box -->
  <rect x="50" y="480" width="900" height="240" rx="15" fill="#0d0d2a" stroke="#4FC3F7" stroke-width="1.5"/>
  <text x="500" y="510" text-anchor="middle" fill="#4FC3F7" font-size="18" font-weight="bold">
    Arithmetic Operations via EML
  </text>

  <!-- Column 1: Basic operations -->
  <text x="100" y="545" fill="#81C784" font-size="14" font-weight="bold">Basic Operations</text>
  <text x="100" y="572" fill="#ccc" font-size="12">exp(x) = eml(x, 1)</text>
  <text x="330" y="572" fill="#888" font-size="10">1 node</text>
  <text x="100" y="594" fill="#ccc" font-size="12">ln(x) = e − eml(1, x)</text>
  <text x="330" y="594" fill="#888" font-size="10">3-5 nodes</text>
  <text x="100" y="616" fill="#ccc" font-size="12">−x = eml(0, exp(x)) − 1</text>
  <text x="330" y="616" fill="#888" font-size="10">via negation</text>

  <!-- Column 2: Arithmetic -->
  <text x="420" y="545" fill="#FF9800" font-size="14" font-weight="bold">Arithmetic</text>
  <text x="420" y="572" fill="#ccc" font-size="12">a − b = eml(ln a, exp b)</text>
  <text x="650" y="572" fill="#888" font-size="10">a &gt; 0</text>
  <text x="420" y="594" fill="#ccc" font-size="12">a + b = eml(ln a, exp(−b))</text>
  <text x="650" y="594" fill="#888" font-size="10">a &gt; 0</text>
  <text x="420" y="616" fill="#ccc" font-size="12">a × b = exp(ln a + ln b)</text>
  <text x="650" y="616" fill="#888" font-size="10">a, b &gt; 0</text>

  <!-- Column 3: Advanced -->
  <text x="720" y="545" fill="#CE93D8" font-size="14" font-weight="bold">Advanced</text>
  <text x="720" y="572" fill="#ccc" font-size="12">a/b = exp(ln a − ln b)</text>
  <text x="720" y="594" fill="#ccc" font-size="12">aⁿ = exp(n · ln a)</text>
  <text x="720" y="616" fill="#ccc" font-size="12">√a = exp(½ · ln a)</text>

  <!-- Key identity -->
  <rect x="100" y="640" width="800" height="45" rx="8" fill="#1a1a3e" stroke="#FFD700" stroke-width="1"/>
  <text x="500" y="668" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
    ★ Double Negation: eml(0, exp(eml(0, exp(x)))) = x (proved in Lean 4)
  </text>

  <!-- Footer -->
  <text x="500" y="740" text-anchor="middle" fill="#555" font-size="10">
    All identities formally verified in Lean 4 with Mathlib · EML V5 · April 2026
  </text>
</svg>
