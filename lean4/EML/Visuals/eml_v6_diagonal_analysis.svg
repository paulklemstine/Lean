<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg_diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow_d">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg_diag)"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold">The Diagonal Map: d(x) = eˣ − ln(x)</text>
  <text x="400" y="58" text-anchor="middle" fill="#aaa" font-size="14">Strict Convexity, Minimum at Lambert W, and the No-Fixed-Point Theorem</text>
  
  <!-- Main plot area -->
  <rect x="80" y="75" width="400" height="300" rx="5" fill="rgba(255,255,255,0.02)" stroke="#333" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="80" y1="375" x2="480" y2="375" stroke="#555" stroke-width="1.5"/>
  <line x1="80" y1="375" x2="80" y2="75" stroke="#555" stroke-width="1.5"/>
  
  <!-- x-axis labels -->
  <text x="80" y="395" fill="#888" font-size="10" text-anchor="middle">0</text>
  <text x="160" y="395" fill="#888" font-size="10" text-anchor="middle">0.5</text>
  <text x="240" y="395" fill="#888" font-size="10" text-anchor="middle">1.0</text>
  <text x="320" y="395" fill="#888" font-size="10" text-anchor="middle">1.5</text>
  <text x="400" y="395" fill="#888" font-size="10" text-anchor="middle">2.0</text>
  <text x="480" y="395" fill="#888" font-size="10" text-anchor="middle">2.5</text>
  
  <!-- y-axis labels -->
  <text x="70" y="375" fill="#888" font-size="10" text-anchor="end">0</text>
  <text x="70" y="315" fill="#888" font-size="10" text-anchor="end">2</text>
  <text x="70" y="255" fill="#888" font-size="10" text-anchor="end">4</text>
  <text x="70" y="195" fill="#888" font-size="10" text-anchor="end">6</text>
  <text x="70" y="135" fill="#888" font-size="10" text-anchor="end">8</text>
  <text x="70" y="95" fill="#888" font-size="10" text-anchor="end">10</text>
  
  <!-- d(x) ≥ 2 reference line -->
  <line x1="80" y1="315" x2="480" y2="315" stroke="#FF6347" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="485" y="319" fill="#FF6347" font-size="10">d = 2 (proven lower bound)</text>
  
  <!-- y = x reference line -->
  <line x1="80" y1="375" x2="400" y2="135" stroke="#4169E1" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="405" y="130" fill="#4169E1" font-size="10">y = x (no intersection = no fixed points)</text>
  
  <!-- The diagonal curve -->
  <path d="M90,75 Q110,140 130,220 Q145,270 160,295 Q180,310 200,315 Q220,318 240,318 Q260,316 280,310 Q310,295 340,265 Q380,215 420,140 Q450,90 470,75" 
        stroke="#00CED1" stroke-width="3" fill="none" filter="url(#glow_d)"/>
  <text x="350" y="275" fill="#00CED1" font-size="12" font-weight="bold">d(x) = eˣ − ln(x)</text>
  
  <!-- Minimum point annotation -->
  <circle cx="196" cy="307" r="6" fill="#FFD700" stroke="#fff" stroke-width="2"/>
  <line x1="196" y1="313" x2="196" y2="375" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="196" y="390" fill="#FFD700" font-size="9" text-anchor="middle">W(1)≈0.567</text>
  
  <!-- Annotation box for minimum -->
  <rect x="210" y="400" width="260" height="55" rx="8" fill="rgba(255,215,0,0.1)" stroke="#FFD700" stroke-width="1"/>
  <text x="340" y="420" text-anchor="middle" fill="#FFD700" font-size="12" font-weight="bold">Minimum at x* = W(1)</text>
  <text x="340" y="440" text-anchor="middle" fill="#ffe680" font-size="11">d(x*) = 1/W(1) + 1 + ln(1/W(1)) ≈ 2.330</text>
  
  <!-- Right panel: Theorem summary -->
  <rect x="510" y="75" width="270" height="380" rx="10" fill="rgba(255,255,255,0.03)" stroke="#444" stroke-width="1"/>
  <text x="645" y="105" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">Proven Properties</text>
  
  <!-- Theorem 1 -->
  <rect x="525" y="120" width="240" height="55" rx="6" fill="rgba(0,206,209,0.1)" stroke="#00CED1" stroke-width="1"/>
  <text x="535" y="140" fill="#00CED1" font-size="11" font-weight="bold">Strict Convexity ✓</text>
  <text x="535" y="160" fill="#7fdbda" font-size="10">f″(x) = eˣ + 1/x² &gt; 0 for all x &gt; 0</text>
  
  <!-- Theorem 2 -->
  <rect x="525" y="185" width="240" height="55" rx="6" fill="rgba(0,206,209,0.1)" stroke="#00CED1" stroke-width="1"/>
  <text x="535" y="205" fill="#00CED1" font-size="11" font-weight="bold">Lower Bound ✓</text>
  <text x="535" y="225" fill="#7fdbda" font-size="10">d(x) ≥ 2 for all x &gt; 0</text>
  
  <!-- Theorem 3 -->
  <rect x="525" y="250" width="240" height="55" rx="6" fill="rgba(0,206,209,0.1)" stroke="#00CED1" stroke-width="1"/>
  <text x="535" y="270" fill="#00CED1" font-size="11" font-weight="bold">No Fixed Points ✓</text>
  <text x="535" y="290" fill="#7fdbda" font-size="10">d(x) ≠ x for all x &gt; 0</text>
  
  <!-- Theorem 4 -->
  <rect x="525" y="315" width="240" height="55" rx="6" fill="rgba(0,206,209,0.1)" stroke="#00CED1" stroke-width="1"/>
  <text x="535" y="335" fill="#00CED1" font-size="11" font-weight="bold">Critical Point ✓</text>
  <text x="535" y="355" fill="#7fdbda" font-size="10">eˣ = 1/x ⟹ x·eˣ = 1 (Lambert W)</text>
  
  <!-- Theorem 5 -->
  <rect x="525" y="380" width="240" height="55" rx="6" fill="rgba(0,206,209,0.1)" stroke="#00CED1" stroke-width="1"/>
  <text x="535" y="400" fill="#00CED1" font-size="11" font-weight="bold">Monotonicity ✓</text>
  <text x="535" y="420" fill="#7fdbda" font-size="10">eml strictly ↑ in x, strictly ↓ in y</text>
  
  <!-- Proof sketch at bottom -->
  <rect x="80" y="470" width="700" height="110" rx="10" fill="rgba(138,43,226,0.08)" stroke="#8A2BE2" stroke-width="1"/>
  <text x="430" y="495" text-anchor="middle" fill="#8A2BE2" font-size="14" font-weight="bold">Proof Sketch: d(x) ≥ 2</text>
  <text x="100" y="520" fill="#c9a0dc" font-size="12">From eˣ ≥ 1 + x (convexity of exp) and ln(x) ≤ x − 1 (concavity of log):</text>
  <text x="100" y="545" fill="#c9a0dc" font-size="12">d(x) = eˣ − ln(x) ≥ (1 + x) − (x − 1) = 2  ∎</text>
  <text x="100" y="565" fill="#888" font-size="11">Machine-verified in Lean 4 with Mathlib — all proofs compile without sorry</text>
</svg>
