<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a28"/>
      <stop offset="100%" style="stop-color:#1a1a38"/>
    </linearGradient>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FFD700"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg5)"/>

  <text x="400" y="35" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold">
    EML Composition Algebra
  </text>
  <text x="400" y="58" text-anchor="middle" fill="#aab" font-size="13">
    How eml builds exponential towers and arithmetic operations
  </text>

  <!-- Exponential Tower Chain -->
  <rect x="30" y="80" width="740" height="130" rx="12" fill="#0d1d0d" stroke="#50c878" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" fill="#50c878" font-size="16" font-weight="bold">
    Exponential Tower Generation
  </text>

  <!-- Tower nodes -->
  <circle cx="100" cy="155" r="25" fill="#1a3a1a" stroke="#50c878" stroke-width="2"/>
  <text x="100" y="160" text-anchor="middle" fill="#fff" font-size="14">1</text>
  <text x="100" y="195" text-anchor="middle" fill="#aab" font-size="10">e↑↑0</text>

  <line x1="130" y1="155" x2="175" y2="155" stroke="#FFD700" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="152" y="148" text-anchor="middle" fill="#ff9" font-size="9">eml(·,1)</text>

  <circle cx="210" cy="155" r="25" fill="#1a3a1a" stroke="#50c878" stroke-width="2"/>
  <text x="210" y="160" text-anchor="middle" fill="#fff" font-size="14">e</text>
  <text x="210" y="195" text-anchor="middle" fill="#aab" font-size="10">e↑↑1</text>

  <line x1="240" y1="155" x2="285" y2="155" stroke="#FFD700" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="262" y="148" text-anchor="middle" fill="#ff9" font-size="9">eml(·,1)</text>

  <circle cx="320" cy="155" r="25" fill="#1a3a1a" stroke="#50c878" stroke-width="2"/>
  <text x="320" y="160" text-anchor="middle" fill="#fff" font-size="12">eᵉ</text>
  <text x="320" y="195" text-anchor="middle" fill="#aab" font-size="10">e↑↑2</text>

  <line x1="350" y1="155" x2="395" y2="155" stroke="#FFD700" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="372" y="148" text-anchor="middle" fill="#ff9" font-size="9">eml(·,1)</text>

  <circle cx="430" cy="155" r="25" fill="#1a3a1a" stroke="#50c878" stroke-width="2"/>
  <text x="430" y="155" text-anchor="middle" fill="#fff" font-size="10">e^(eᵉ)</text>
  <text x="430" y="195" text-anchor="middle" fill="#aab" font-size="10">e↑↑3</text>

  <line x1="460" y1="155" x2="505" y2="155" stroke="#FFD700" stroke-width="2" marker-end="url(#arr2)"/>

  <text x="535" y="160" fill="#FFD700" font-size="14">· · ·</text>

  <line x1="560" y1="155" x2="605" y2="155" stroke="#FFD700" stroke-width="2" marker-end="url(#arr2)"/>

  <circle cx="640" cy="155" r="25" fill="#1a3a1a" stroke="#50c878" stroke-width="2"/>
  <text x="640" y="155" text-anchor="middle" fill="#fff" font-size="10">e↑↑n</text>
  <text x="640" y="195" text-anchor="middle" fill="#7f7" font-size="10">≥ 2ⁿ ✓</text>

  <!-- Arithmetic Operations -->
  <rect x="30" y="230" width="355" height="130" rx="12" fill="#1a1a3a" stroke="#4da6ff" stroke-width="2"/>
  <text x="207" y="258" text-anchor="middle" fill="#4da6ff" font-size="15" font-weight="bold">
    Arithmetic via EML
  </text>

  <text x="50" y="285" fill="#fff" font-size="12">a − b = eml(ln a, eᵇ)</text>
  <text x="50" y="305" fill="#fff" font-size="12">a + b = eml(ln a, e⁻ᵇ)</text>
  <text x="50" y="325" fill="#fff" font-size="12">a · b = exp(ln a + ln b)</text>
  <text x="50" y="345" fill="#fff" font-size="12">a / b = exp(ln a − ln b)</text>

  <!-- Involution -->
  <rect x="415" y="230" width="355" height="130" rx="12" fill="#2d1a1a" stroke="#ff6b6b" stroke-width="2"/>
  <text x="592" y="258" text-anchor="middle" fill="#ff6b6b" font-size="15" font-weight="bold">
    The EML Involution
  </text>

  <text x="435" y="285" fill="#fff" font-size="12">f(x) = eml(0, eˣ) = 1 − x</text>
  <text x="435" y="310" fill="#aab" font-size="12">f(f(x)) = x  (involution ✓)</text>
  <text x="435" y="335" fill="#aab" font-size="12">Fixed point: x = 1/2</text>
  <text x="435" y="355" fill="#7f7" font-size="11">Proved: eml6_neg_involution</text>

  <!-- Chain Identity -->
  <rect x="30" y="380" width="740" height="100" rx="12" fill="#1a2d1a" stroke="#FFD700" stroke-width="2"/>
  <text x="400" y="410" text-anchor="middle" fill="#FFD700" font-size="15" font-weight="bold">
    The Chain Identity (Formally Proved)
  </text>
  <text x="400" y="440" text-anchor="middle" fill="#fff" font-size="14">
    eml(eml(a, eᵇ), exp(eml(c, eᵈ))) = exp(eᵃ − b) − (eᶜ − d)
  </text>
  <text x="400" y="465" text-anchor="middle" fill="#aab" font-size="12">
    Governs how EML compositions simplify • Key to normal form theory
  </text>
</svg>
