<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg_k" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <filter id="glow_k">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="650" fill="url(#bg_k)"/>
  
  <text x="450" y="40" text-anchor="middle" fill="#FFD700" font-size="24" font-weight="bold">K_EML: EML Kolmogorov Complexity</text>
  <text x="450" y="65" text-anchor="middle" fill="#aaa" font-size="14">Minimum EML tree depth to reach a value from the constant 1</text>
  
  <!-- Growth table -->
  <rect x="50" y="90" width="380" height="230" rx="10" fill="rgba(0,206,209,0.05)" stroke="#00CED1" stroke-width="1"/>
  <text x="240" y="115" text-anchor="middle" fill="#00CED1" font-size="16" font-weight="bold">Tree Enumeration Growth</text>
  
  <!-- Table header -->
  <text x="100" y="145" fill="#FFD700" font-size="13" font-weight="bold">Depth</text>
  <text x="190" y="145" fill="#FFD700" font-size="13" font-weight="bold">New</text>
  <text x="270" y="145" fill="#FFD700" font-size="13" font-weight="bold">Total</text>
  <text x="350" y="145" fill="#FFD700" font-size="13" font-weight="bold">Catalan</text>
  <line x1="70" y1="152" x2="410" y2="152" stroke="#444" stroke-width="1"/>
  
  <!-- Table rows -->
  <text x="100" y="172" fill="#7fdbda" font-size="13">0</text>
  <text x="190" y="172" fill="#7fdbda" font-size="13">1</text>
  <text x="270" y="172" fill="#7fdbda" font-size="13">1</text>
  <text x="350" y="172" fill="#7fdbda" font-size="13">C₀ = 1</text>
  
  <text x="100" y="197" fill="#7fdbda" font-size="13">1</text>
  <text x="190" y="197" fill="#7fdbda" font-size="13">1</text>
  <text x="270" y="197" fill="#7fdbda" font-size="13">2</text>
  <text x="350" y="197" fill="#7fdbda" font-size="13">C₁ = 1</text>
  
  <text x="100" y="222" fill="#7fdbda" font-size="13">2</text>
  <text x="190" y="222" fill="#7fdbda" font-size="13">3</text>
  <text x="270" y="222" fill="#7fdbda" font-size="13">5</text>
  <text x="350" y="222" fill="#7fdbda" font-size="13">C₂ = 2</text>
  
  <text x="100" y="247" fill="#7fdbda" font-size="13">3</text>
  <text x="190" y="247" fill="#7fdbda" font-size="13">21</text>
  <text x="270" y="247" fill="#7fdbda" font-size="13">26</text>
  <text x="350" y="247" fill="#7fdbda" font-size="13">C₃ = 5</text>
  
  <text x="100" y="272" fill="#FFD700" font-size="13" font-weight="bold">4</text>
  <text x="190" y="272" fill="#FFD700" font-size="13" font-weight="bold">370</text>
  <text x="270" y="272" fill="#FFD700" font-size="13" font-weight="bold">396</text>
  <text x="350" y="272" fill="#FFD700" font-size="13" font-weight="bold">C₄ = 14</text>
  
  <text x="100" y="300" fill="#FF6347" font-size="13">5</text>
  <text x="190" y="300" fill="#FF6347" font-size="13">~10⁴?</text>
  <text x="270" y="300" fill="#FF6347" font-size="13">~10⁴?</text>
  <text x="350" y="300" fill="#FF6347" font-size="13">C₅ = 42</text>
  
  <!-- Notable constants panel -->
  <rect x="470" y="90" width="400" height="230" rx="10" fill="rgba(255,215,0,0.05)" stroke="#FFD700" stroke-width="1"/>
  <text x="670" y="115" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">Notable EML Constants</text>
  
  <text x="490" y="145" fill="#ffe680" font-size="12">K_EML(1) = 0    →  1 (leaf)</text>
  <text x="490" y="170" fill="#ffe680" font-size="12">K_EML(e) = 1    →  eml(1, 1)</text>
  <text x="490" y="195" fill="#ffe680" font-size="12">K_EML(e−1) = 2  →  eml(1, eml(1,1))</text>
  <text x="490" y="220" fill="#ffe680" font-size="12">K_EML(eᵉ) = 2   →  eml(eml(1,1), 1)</text>
  <text x="490" y="245" fill="#ffe680" font-size="12">K_EML(0) = 3    →  eml(1, eml(eml(1,1), 1))</text>
  <text x="490" y="270" fill="#ffe680" font-size="12">K_EML(eᵉᵉ) = 3  →  eml(eml(eml(1,1),1), 1)</text>
  
  <rect x="490" y="285" width="360" height="25" rx="5" fill="rgba(255,69,0,0.2)" stroke="#FF4500" stroke-width="1"/>
  <text x="670" y="303" text-anchor="middle" fill="#FF4500" font-size="13" font-weight="bold">K_EML(2) &gt; 4  —  The integer 2 is HARD!</text>
  
  <!-- The 2 mystery -->
  <rect x="50" y="340" width="820" height="130" rx="10" fill="rgba(255,69,0,0.05)" stroke="#FF4500" stroke-width="1.5"/>
  <text x="460" y="370" text-anchor="middle" fill="#FF4500" font-size="18" font-weight="bold">🔍 The Mystery of 2</text>
  
  <text x="70" y="400" fill="#ff9966" font-size="13">The integer 2 is not reachable from constant 1 via any EML tree of depth ≤ 4.</text>
  <text x="70" y="425" fill="#ff9966" font-size="13">This means 2 = 1 + 1 requires at least 5 EML operations — more than 0, e, eᵉ, or eᵉᵉ!</text>
  <text x="70" y="450" fill="#ff9966" font-size="13">Why? The EML tower generates transcendental towers. Simple integers live in a different world.</text>
  
  <!-- Tree diagrams at bottom -->
  <rect x="50" y="490" width="250" height="140" rx="8" fill="rgba(0,206,209,0.05)" stroke="#00CED1" stroke-width="1"/>
  <text x="175" y="515" text-anchor="middle" fill="#00CED1" font-size="14" font-weight="bold">Depth 1: eml(1,1) = e</text>
  <!-- Tree -->
  <text x="175" y="545" text-anchor="middle" fill="#7fdbda" font-size="20">EML</text>
  <line x1="155" y1="555" x2="135" y2="580" stroke="#7fdbda" stroke-width="1.5"/>
  <line x1="195" y1="555" x2="215" y2="580" stroke="#7fdbda" stroke-width="1.5"/>
  <circle cx="135" cy="590" r="12" fill="rgba(255,215,0,0.2)" stroke="#FFD700" stroke-width="1.5"/>
  <text x="135" y="595" text-anchor="middle" fill="#FFD700" font-size="12">1</text>
  <circle cx="215" cy="590" r="12" fill="rgba(255,215,0,0.2)" stroke="#FFD700" stroke-width="1.5"/>
  <text x="215" y="595" text-anchor="middle" fill="#FFD700" font-size="12">1</text>
  
  <rect x="330" y="490" width="250" height="140" rx="8" fill="rgba(0,206,209,0.05)" stroke="#00CED1" stroke-width="1"/>
  <text x="455" y="515" text-anchor="middle" fill="#00CED1" font-size="14" font-weight="bold">Depth 2: eml(e,1) = eᵉ</text>
  <text x="455" y="540" text-anchor="middle" fill="#7fdbda" font-size="18">EML</text>
  <line x1="435" y1="548" x2="405" y2="565" stroke="#7fdbda" stroke-width="1.5"/>
  <line x1="475" y1="548" x2="505" y2="565" stroke="#7fdbda" stroke-width="1.5"/>
  <text x="405" y="580" text-anchor="middle" fill="#7fdbda" font-size="14">EML</text>
  <line x1="390" y1="588" x2="375" y2="605" stroke="#7fdbda" stroke-width="1"/>
  <line x1="420" y1="588" x2="435" y2="605" stroke="#7fdbda" stroke-width="1"/>
  <circle cx="375" cy="615" r="9" fill="rgba(255,215,0,0.2)" stroke="#FFD700" stroke-width="1"/>
  <text x="375" y="619" text-anchor="middle" fill="#FFD700" font-size="10">1</text>
  <circle cx="435" cy="615" r="9" fill="rgba(255,215,0,0.2)" stroke="#FFD700" stroke-width="1"/>
  <text x="435" y="619" text-anchor="middle" fill="#FFD700" font-size="10">1</text>
  <circle cx="505" cy="575" r="12" fill="rgba(255,215,0,0.2)" stroke="#FFD700" stroke-width="1.5"/>
  <text x="505" y="580" text-anchor="middle" fill="#FFD700" font-size="12">1</text>
  
  <rect x="610" y="490" width="260" height="140" rx="8" fill="rgba(0,206,209,0.05)" stroke="#00CED1" stroke-width="1"/>
  <text x="740" y="515" text-anchor="middle" fill="#00CED1" font-size="14" font-weight="bold">Depth 3: eml(1,eᵉ) = 0</text>
  <text x="740" y="545" text-anchor="middle" fill="#7fdbda" font-size="16">The first zero!</text>
  <text x="740" y="575" text-anchor="middle" fill="#7fdbda" font-size="12">e¹ − ln(eᵉ) = e − e = 0</text>
  <text x="740" y="600" text-anchor="middle" fill="#ffe680" font-size="11">3 EML nodes required</text>
  
  <text x="870" y="640" text-anchor="end" fill="#555" font-size="10">OISCC Research — K_EML Analysis V6</text>
</svg>
