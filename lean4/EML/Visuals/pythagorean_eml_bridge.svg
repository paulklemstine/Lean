<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#ffd700" font-size="28" font-weight="bold" font-family="Georgia" filter="url(#glow)">
    The EML–Pythagorean Tree Bridge
  </text>
  <text x="600" y="80" text-anchor="middle" fill="#aabbcc" font-size="14" font-family="Georgia">
    Connecting Discrete Number Theory to Continuous Analysis via eml(x,y) = exp(x) − log(y)
  </text>
  
  <!-- LEFT SIDE: Berggren Tree -->
  <text x="250" y="120" text-anchor="middle" fill="#ff6b35" font-size="20" font-weight="bold" font-family="monospace">
    BERGGREN TREE
  </text>
  <text x="250" y="140" text-anchor="middle" fill="#888" font-size="12" font-family="monospace">
    Ternary · Discrete · ℤ
  </text>
  
  <!-- Root node (3,4,5) -->
  <circle cx="250" cy="200" r="30" fill="none" stroke="#ff6b35" stroke-width="2" filter="url(#glow)"/>
  <text x="250" y="196" text-anchor="middle" fill="#ff6b35" font-size="11" font-weight="bold" font-family="monospace">(3,4,5)</text>
  <text x="250" y="210" text-anchor="middle" fill="#ff9966" font-size="9" font-family="monospace">9+16=25</text>
  
  <!-- Level 1 children -->
  <!-- Child A -->
  <line x1="225" y1="225" x2="100" y2="290" stroke="#ff6b35" stroke-width="1" opacity="0.6"/>
  <circle cx="100" cy="310" r="28" fill="none" stroke="#ff8855" stroke-width="1.5"/>
  <text x="100" y="306" text-anchor="middle" fill="#ff8855" font-size="9" font-family="monospace">(5,12,13)</text>
  <text x="100" y="318" text-anchor="middle" fill="#ffaa77" font-size="8" font-family="monospace">M₁</text>
  
  <!-- Child B -->
  <line x1="250" y1="230" x2="250" y2="290" stroke="#ff6b35" stroke-width="1" opacity="0.6"/>
  <circle cx="250" cy="310" r="28" fill="none" stroke="#ff8855" stroke-width="1.5"/>
  <text x="250" y="306" text-anchor="middle" fill="#ff8855" font-size="9" font-family="monospace">(21,20,29)</text>
  <text x="250" y="318" text-anchor="middle" fill="#ffaa77" font-size="8" font-family="monospace">M₂</text>
  
  <!-- Child C -->
  <line x1="275" y1="225" x2="400" y2="290" stroke="#ff6b35" stroke-width="1" opacity="0.6"/>
  <circle cx="400" cy="310" r="28" fill="none" stroke="#ff8855" stroke-width="1.5"/>
  <text x="400" y="306" text-anchor="middle" fill="#ff8855" font-size="9" font-family="monospace">(15,8,17)</text>
  <text x="400" y="318" text-anchor="middle" fill="#ffaa77" font-size="8" font-family="monospace">M₃</text>
  
  <!-- Level 2 (partial) -->
  <line x1="85" y1="335" x2="50" y2="380" stroke="#ff6b35" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="338" x2="100" y2="380" stroke="#ff6b35" stroke-width="0.8" opacity="0.4"/>
  <line x1="115" y1="335" x2="150" y2="380" stroke="#ff6b35" stroke-width="0.8" opacity="0.4"/>
  
  <circle cx="50" cy="395" r="18" fill="none" stroke="#ffaa77" stroke-width="1" opacity="0.6"/>
  <text x="50" y="397" text-anchor="middle" fill="#ffaa77" font-size="7" font-family="monospace">(7,24,25)</text>
  
  <circle cx="100" cy="395" r="18" fill="none" stroke="#ffaa77" stroke-width="1" opacity="0.6"/>
  <text x="100" y="397" text-anchor="middle" fill="#ffaa77" font-size="7" font-family="monospace">(55,48,73)</text>
  
  <circle cx="150" cy="395" r="18" fill="none" stroke="#ffaa77" stroke-width="1" opacity="0.6"/>
  <text x="150" y="397" text-anchor="middle" fill="#ffaa77" font-size="7" font-family="monospace">(45,28,53)</text>
  
  <!-- Dots for more -->
  <text x="250" y="400" text-anchor="middle" fill="#666" font-size="20">⋯</text>
  <text x="400" y="400" text-anchor="middle" fill="#666" font-size="20">⋯</text>
  
  <!-- RIGHT SIDE: EML Tree -->
  <text x="900" y="120" text-anchor="middle" fill="#00d4ff" font-size="20" font-weight="bold" font-family="monospace">
    EML TREE
  </text>
  <text x="900" y="140" text-anchor="middle" fill="#888" font-size="12" font-family="monospace">
    Binary · Continuous · ℂ
  </text>
  
  <!-- EML tree for exp(x) = eml(x, 1) -->
  <text x="750" y="180" text-anchor="middle" fill="#00aadd" font-size="10" font-family="monospace">exp(x):</text>
  <rect x="730" y="190" width="40" height="25" rx="5" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <text x="750" y="207" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="bold" font-family="monospace">eml</text>
  <line x1="740" y1="215" x2="725" y2="235" stroke="#00d4ff" stroke-width="1"/>
  <line x1="760" y1="215" x2="775" y2="235" stroke="#00d4ff" stroke-width="1"/>
  <circle cx="725" cy="245" r="12" fill="none" stroke="#00aadd" stroke-width="1"/>
  <text x="725" y="248" text-anchor="middle" fill="#00aadd" font-size="10" font-family="monospace">x</text>
  <circle cx="775" cy="245" r="12" fill="none" stroke="#00aadd" stroke-width="1"/>
  <text x="775" y="248" text-anchor="middle" fill="#00aadd" font-size="10" font-family="monospace">1</text>
  
  <!-- EML tree for log(z) -->
  <text x="950" y="180" text-anchor="middle" fill="#00aadd" font-size="10" font-family="monospace">log(z):</text>
  
  <!-- Top eml node -->
  <rect x="930" y="190" width="40" height="25" rx="5" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <text x="950" y="207" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="bold" font-family="monospace">eml</text>
  
  <!-- Left: 1 -->
  <line x1="940" y1="215" x2="920" y2="235" stroke="#00d4ff" stroke-width="1"/>
  <circle cx="920" cy="245" r="12" fill="none" stroke="#00aadd" stroke-width="1"/>
  <text x="920" y="248" text-anchor="middle" fill="#00aadd" font-size="10" font-family="monospace">1</text>
  
  <!-- Right: eml node -->
  <line x1="960" y1="215" x2="990" y2="235" stroke="#00d4ff" stroke-width="1"/>
  <rect x="970" y="240" width="40" height="22" rx="4" fill="none" stroke="#00bbdd" stroke-width="1.5"/>
  <text x="990" y="255" text-anchor="middle" fill="#00bbdd" font-size="9" font-weight="bold" font-family="monospace">eml</text>
  
  <line x1="980" y1="262" x2="960" y2="280" stroke="#00bbdd" stroke-width="1"/>
  <line x1="1000" y1="262" x2="1020" y2="280" stroke="#00bbdd" stroke-width="1"/>
  
  <!-- eml(1,z) node -->
  <rect x="940" y="282" width="40" height="20" rx="4" fill="none" stroke="#0099bb" stroke-width="1"/>
  <text x="960" y="296" text-anchor="middle" fill="#0099bb" font-size="8" font-weight="bold" font-family="monospace">eml</text>
  
  <line x1="950" y1="302" x2="940" y2="315" stroke="#0099bb" stroke-width="1"/>
  <line x1="970" y1="302" x2="980" y2="315" stroke="#0099bb" stroke-width="1"/>
  <circle cx="940" cy="325" r="10" fill="none" stroke="#008899" stroke-width="1"/>
  <text x="940" y="328" text-anchor="middle" fill="#008899" font-size="8" font-family="monospace">1</text>
  <circle cx="980" cy="325" r="10" fill="none" stroke="#008899" stroke-width="1"/>
  <text x="980" y="328" text-anchor="middle" fill="#008899" font-size="8" font-family="monospace">z</text>
  
  <!-- 1 on the right -->
  <circle cx="1020" cy="290" r="10" fill="none" stroke="#0099bb" stroke-width="1"/>
  <text x="1020" y="293" text-anchor="middle" fill="#0099bb" font-size="8" font-family="monospace">1</text>
  
  <!-- BRIDGE in the middle -->
  <rect x="450" y="200" width="200" height="220" rx="15" fill="none" stroke="url(#bridgeGrad)" stroke-width="3" filter="url(#glowStrong)" opacity="0.8"/>
  
  <text x="550" y="230" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold" font-family="Georgia">
    BRIDGE
  </text>
  
  <!-- Bridge equations -->
  <text x="550" y="260" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">
    Log-Space Encoding:
  </text>
  <text x="550" y="280" text-anchor="middle" fill="#ffd700" font-size="12" font-family="monospace">
    (a,b,c) → (log a, log b, log c)
  </text>
  <text x="550" y="305" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">
    a² + b² = c²
  </text>
  <text x="550" y="320" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">
    ⇕
  </text>
  <text x="550" y="340" text-anchor="middle" fill="#00d4ff" font-size="11" font-family="monospace">
    e^(2α) + e^(2β) = e^(2γ)
  </text>
  
  <text x="550" y="370" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">
    Angle Encoding:
  </text>
  <text x="550" y="390" text-anchor="middle" fill="#ffd700" font-size="11" font-family="monospace">
    cos θ = Re[eml(iθ, 1)]
  </text>
  <text x="550" y="405" text-anchor="middle" fill="#ffd700" font-size="11" font-family="monospace">
    sin θ = Im[eml(iθ, 1)]
  </text>
  
  <!-- BOTTOM SECTION: N-tuple generalization -->
  <rect x="50" y="460" width="1100" height="200" rx="10" fill="none" stroke="#555" stroke-width="1"/>
  
  <text x="600" y="490" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="bold" font-family="Georgia">
    N-Tuple Generalization
  </text>
  
  <!-- 3-tuple -->
  <rect x="80" y="510" width="200" height="130" rx="8" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.7"/>
  <text x="180" y="535" text-anchor="middle" fill="#ff6b35" font-size="13" font-weight="bold" font-family="monospace">3-Tuple (Triple)</text>
  <text x="180" y="555" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">a² + b² = c²</text>
  <text x="180" y="575" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">Berggren ternary tree</text>
  <text x="180" y="595" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">3 matrices ∈ GL(3,ℤ)</text>
  <text x="180" y="615" text-anchor="middle" fill="#00d4ff" font-size="10" font-family="monospace">EML depth: O(d)</text>
  <text x="180" y="632" text-anchor="middle" fill="#888" font-size="9" font-family="monospace">e.g. (3,4,5), (5,12,13)</text>
  
  <!-- 4-tuple -->
  <rect x="310" y="510" width="200" height="130" rx="8" fill="none" stroke="#ff9933" stroke-width="1.5" opacity="0.7"/>
  <text x="410" y="535" text-anchor="middle" fill="#ff9933" font-size="13" font-weight="bold" font-family="monospace">4-Tuple (Quad)</text>
  <text x="410" y="555" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">a²+b²+c² = d²</text>
  <text x="410" y="575" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">Matrix tree in GL(4,ℤ)</text>
  <text x="410" y="595" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">Embeds all triples</text>
  <text x="410" y="615" text-anchor="middle" fill="#00d4ff" font-size="10" font-family="monospace">EML depth: O(d)</text>
  <text x="410" y="632" text-anchor="middle" fill="#888" font-size="9" font-family="monospace">e.g. (1,2,2,3), (2,3,6,7)</text>
  
  <!-- 5-tuple -->
  <rect x="540" y="510" width="200" height="130" rx="8" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.7"/>
  <text x="640" y="535" text-anchor="middle" fill="#ffcc00" font-size="13" font-weight="bold" font-family="monospace">5-Tuple</text>
  <text x="640" y="555" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">a²+b²+c²+d² = e²</text>
  <text x="640" y="575" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">Extends quadruples</text>
  <text x="640" y="595" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">Sum-of-4-squares theory</text>
  <text x="640" y="615" text-anchor="middle" fill="#00d4ff" font-size="10" font-family="monospace">EML depth: O(d)</text>
  <text x="640" y="632" text-anchor="middle" fill="#888" font-size="9" font-family="monospace">e.g. (1,2,3,4,...)</text>
  
  <!-- N-tuple -->
  <rect x="770" y="510" width="200" height="130" rx="8" fill="none" stroke="#00ffaa" stroke-width="1.5" opacity="0.7"/>
  <text x="870" y="535" text-anchor="middle" fill="#00ffaa" font-size="13" font-weight="bold" font-family="monospace">N-Tuple</text>
  <text x="870" y="555" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">Σxᵢ² = xₙ²</text>
  <text x="870" y="575" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">GL(N,ℤ) matrix trees</text>
  <text x="870" y="595" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">Lagrange 4-squares thm</text>
  <text x="870" y="615" text-anchor="middle" fill="#00d4ff" font-size="10" font-family="monospace">EML depth: O(d·N)</text>
  <text x="870" y="632" text-anchor="middle" fill="#888" font-size="9" font-family="monospace">Universal framework</text>
  
  <!-- Arrows between N-tuple boxes -->
  <text x="295" y="580" text-anchor="middle" fill="#ffd700" font-size="20">⊂</text>
  <text x="525" y="580" text-anchor="middle" fill="#ffd700" font-size="20">⊂</text>
  <text x="755" y="580" text-anchor="middle" fill="#ffd700" font-size="20">⊂</text>
  
  <!-- Bottom: Key theorem -->
  <rect x="200" y="700" width="800" height="80" rx="10" fill="none" stroke="#ffd700" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="725" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold" font-family="Georgia">
    Key Theorem (Formalized in Lean 4)
  </text>
  <text x="600" y="745" text-anchor="middle" fill="#ddd" font-size="12" font-family="monospace">
    Every Pythagorean N-tuple tree of depth d can be encoded as an EML expression tree
  </text>
  <text x="600" y="765" text-anchor="middle" fill="#00d4ff" font-size="12" font-family="monospace">
    of depth O(d) and size O(d), since integer arithmetic ⊂ elementary functions ⊂ EML
  </text>
  
  <!-- Decorative elements -->
  <text x="600" y="850" text-anchor="middle" fill="#555" font-size="10" font-family="Georgia">
    eml(x,y) = exp(x) − log(y)  ·  The Continuous Sheffer Stroke  ·  Universality Bridge
  </text>
  
  <!-- Star decorations -->
  <circle cx="50" cy="50" r="2" fill="#ffd700" opacity="0.5"/>
  <circle cx="1150" cy="80" r="2" fill="#ffd700" opacity="0.5"/>
  <circle cx="200" cy="850" r="1.5" fill="#00d4ff" opacity="0.4"/>
  <circle cx="1000" cy="850" r="1.5" fill="#00d4ff" opacity="0.4"/>
  <circle cx="100" cy="700" r="1.5" fill="#ff6b35" opacity="0.3"/>
  <circle cx="1100" cy="700" r="1.5" fill="#ff6b35" opacity="0.3"/>
</svg>
