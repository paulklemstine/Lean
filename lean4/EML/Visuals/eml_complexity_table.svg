<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgct" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" fill="url(#bgct)"/>

  <text x="400" y="35" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold">
    EML Complexity Theory
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#888" font-size="12">
    K_EML(f) = minimum number of leaves in any EML tree computing f
  </text>

  <!-- Table -->
  <g transform="translate(100, 75)">
    <!-- Header -->
    <rect x="0" y="0" width="600" height="35" fill="rgba(255,215,0,0.1)"/>
    <text x="100" y="23" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">Function</text>
    <text x="260" y="23" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">K_EML (upper)</text>
    <text x="400" y="23" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">K_EML (lower)</text>
    <text x="530" y="23" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">Status</text>

    <!-- Rows -->
    <g fill="#fff" font-size="13">
      <!-- 1 -->
      <rect x="0" y="40" width="600" height="30" fill="rgba(255,255,255,0.02)"/>
      <text x="100" y="60" text-anchor="middle" font-weight="bold">1</text>
      <text x="260" y="60" text-anchor="middle">1</text>
      <text x="400" y="60" text-anchor="middle">1</text>
      <text x="530" y="60" text-anchor="middle" fill="#00FF7F">✓ Exact</text>

      <!-- e -->
      <rect x="0" y="75" width="600" height="30" fill="rgba(255,255,255,0.04)"/>
      <text x="100" y="95" text-anchor="middle" font-weight="bold">e</text>
      <text x="260" y="95" text-anchor="middle">3</text>
      <text x="400" y="95" text-anchor="middle">3</text>
      <text x="530" y="95" text-anchor="middle" fill="#00FF7F">✓ Exact</text>

      <!-- exp(x) -->
      <rect x="0" y="110" width="600" height="30" fill="rgba(255,255,255,0.02)"/>
      <text x="100" y="130" text-anchor="middle" font-weight="bold">exp(x)</text>
      <text x="260" y="130" text-anchor="middle">3</text>
      <text x="400" y="130" text-anchor="middle">3</text>
      <text x="530" y="130" text-anchor="middle" fill="#00FF7F">✓ Exact</text>

      <!-- 0 -->
      <rect x="0" y="145" width="600" height="30" fill="rgba(255,255,255,0.04)"/>
      <text x="100" y="165" text-anchor="middle" font-weight="bold">0</text>
      <text x="260" y="165" text-anchor="middle">7</text>
      <text x="400" y="165" text-anchor="middle">7</text>
      <text x="530" y="165" text-anchor="middle" fill="#00FF7F">✓ Exact</text>

      <!-- ln(x) -->
      <rect x="0" y="180" width="600" height="30" fill="rgba(255,255,255,0.02)"/>
      <text x="100" y="200" text-anchor="middle" font-weight="bold">ln(x)</text>
      <text x="260" y="200" text-anchor="middle">7</text>
      <text x="400" y="200" text-anchor="middle">7</text>
      <text x="530" y="200" text-anchor="middle" fill="#00FF7F">✓ Exact</text>

      <!-- -1 -->
      <rect x="0" y="215" width="600" height="30" fill="rgba(255,255,255,0.04)"/>
      <text x="100" y="235" text-anchor="middle" font-weight="bold">−1</text>
      <text x="260" y="235" text-anchor="middle">17</text>
      <text x="400" y="235" text-anchor="middle">15</text>
      <text x="530" y="235" text-anchor="middle" fill="#FFD700">Gap: 2</text>

      <!-- x·y -->
      <rect x="0" y="250" width="600" height="30" fill="rgba(255,255,255,0.02)"/>
      <text x="100" y="270" text-anchor="middle" font-weight="bold">x · y</text>
      <text x="260" y="270" text-anchor="middle">41</text>
      <text x="400" y="270" text-anchor="middle">17</text>
      <text x="530" y="270" text-anchor="middle" fill="#FF6347">Open</text>

      <!-- x² -->
      <rect x="0" y="285" width="600" height="30" fill="rgba(255,255,255,0.04)"/>
      <text x="100" y="305" text-anchor="middle" font-weight="bold">x²</text>
      <text x="260" y="305" text-anchor="middle">75</text>
      <text x="400" y="305" text-anchor="middle">17</text>
      <text x="530" y="305" text-anchor="middle" fill="#FF6347">Open</text>

      <!-- π -->
      <rect x="0" y="320" width="600" height="30" fill="rgba(255,255,255,0.02)"/>
      <text x="100" y="340" text-anchor="middle" font-weight="bold">π</text>
      <text x="260" y="340" text-anchor="middle">53+</text>
      <text x="400" y="340" text-anchor="middle">?</text>
      <text x="530" y="340" text-anchor="middle" fill="#FF6347">Conjecture: ≤40</text>
    </g>

    <!-- Border -->
    <rect x="0" y="0" width="600" height="355" fill="none" stroke="#444" rx="5"/>
    <line x1="0" y1="35" x2="600" y2="35" stroke="#444"/>
    <line x1="180" y1="0" x2="180" y2="355" stroke="#333"/>
    <line x1="340" y1="0" x2="340" y2="355" stroke="#333"/>
    <line x1="460" y1="0" x2="460" y2="355" stroke="#333"/>
  </g>

  <!-- Key theorems box -->
  <rect x="100" y="445" width="600" height="55" rx="8" fill="rgba(0,206,209,0.08)" stroke="#00CED1" stroke-width="1"/>
  <text x="400" y="465" text-anchor="middle" fill="#00CED1" font-size="13" font-weight="bold">
    Proven: leaves(T) = nodes(T) + 1  |  leaves(T) ≤ 2^depth(T)  |  #trees(n nodes) = Cₙ
  </text>
  <text x="400" y="485" text-anchor="middle" fill="#888" font-size="12">
    Catalan numbers: C₀=1, C₁=1, C₂=2, C₃=5, C₄=14, C₅=42, ...  Growth: O(4ⁿ/n^(3/2))
  </text>
</svg>
