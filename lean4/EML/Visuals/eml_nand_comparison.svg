<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      .box { fill: #f5f5f5; stroke: #333; stroke-width: 2; rx: 10; }
      .box-digital { fill: #E3F2FD; stroke: #1565C0; stroke-width: 2; rx: 10; }
      .box-continuous { fill: #FFF3E0; stroke: #E65100; stroke-width: 2; rx: 10; }
      .header { font-family: Arial, sans-serif; font-size: 18px; fill: #333; text-anchor: middle; font-weight: bold; }
      .subheader { font-family: Arial, sans-serif; font-size: 14px; fill: #555; text-anchor: middle; }
      .item { font-family: 'Courier New', monospace; font-size: 12px; fill: #333; }
      .item-bold { font-family: Arial, sans-serif; font-size: 13px; fill: #333; font-weight: bold; }
      .connector { stroke: #999; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
      .arrow { fill: #666; }
      .title { font-family: Arial, sans-serif; font-size: 22px; fill: #1a1a1a; text-anchor: middle; font-weight: bold; }
      .symbol-circle { fill: white; stroke: #333; stroke-width: 2; }
      .symbol-dot { fill: #333; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" class="title">NAND vs EML: Universal Gates for Two Domains</text>
  
  <!-- Digital/NAND Box -->
  <rect x="30" y="55" width="400" height="420" class="box-digital"/>
  <text x="230" y="85" class="header" fill="#1565C0">DIGITAL: NAND Gate</text>
  <text x="230" y="105" class="subheader">Boolean Logic Universal Primitive</text>
  
  <!-- NAND Symbol -->
  <g transform="translate(180, 130)">
    <path d="M 0,0 L 40,0 Q 80,0 80,25 Q 80,50 40,50 L 0,50 Z" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <circle cx="90" cy="25" r="6" fill="white" stroke="#1565C0" stroke-width="2"/>
    <line x1="-20" y1="15" x2="0" y2="15" stroke="#1565C0" stroke-width="2"/>
    <line x1="-20" y1="35" x2="0" y2="35" stroke="#1565C0" stroke-width="2"/>
    <line x1="96" y1="25" x2="120" y2="25" stroke="#1565C0" stroke-width="2"/>
    <text x="35" y="29" font-size="12" fill="#1565C0" text-anchor="middle" font-family="Arial">NAND</text>
  </g>
  
  <text x="80" y="210" class="item-bold">Domain:</text>
  <text x="200" y="210" class="item">{0, 1}</text>
  
  <text x="80" y="235" class="item-bold">Definition:</text>
  <text x="200" y="235" class="item">NAND(a,b) = ¬(a ∧ b)</text>
  
  <text x="80" y="260" class="item-bold">Constants:</text>
  <text x="200" y="260" class="item">None needed (self-generating)</text>
  
  <text x="80" y="285" class="item-bold">Generates:</text>
  <text x="200" y="285" class="item">NOT, AND, OR, XOR, IMPLIES</text>
  <text x="200" y="305" class="item">...all 16 Boolean functions</text>
  
  <text x="80" y="335" class="item-bold">Grammar:</text>
  <text x="200" y="335" class="item">S → 0 | 1 | NAND(S, S)</text>
  
  <text x="80" y="365" class="item-bold">Complexity:</text>
  <text x="200" y="365" class="item">Gate count</text>
  
  <text x="80" y="395" class="item-bold">Discovery:</text>
  <text x="200" y="395" class="item">Sheffer, 1913</text>
  
  <text x="80" y="425" class="item-bold">Applications:</text>
  <text x="200" y="425" class="item">All digital circuits (CPUs,</text>
  <text x="200" y="445" class="item">memory, FPGA, ...)</text>
  
  <!-- Continuous/EML Box -->
  <rect x="470" y="55" width="400" height="420" class="box-continuous"/>
  <text x="670" y="85" class="header" fill="#E65100">CONTINUOUS: EML Operator</text>
  <text x="670" y="105" class="subheader">Elementary Functions Universal Primitive</text>
  
  <!-- EML Symbol -->
  <g transform="translate(620, 135)">
    <circle cx="25" cy="25" r="25" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
    <circle cx="49" cy="25" r="3" fill="#E65100"/>
    <line x1="-20" y1="10" x2="3" y2="10" stroke="#E65100" stroke-width="2"/>
    <line x1="-20" y1="40" x2="3" y2="40" stroke="#E65100" stroke-width="2"/>
    <line x1="52" y1="25" x2="75" y2="25" stroke="#E65100" stroke-width="2"/>
    <text x="25" y="29" font-size="11" fill="#E65100" text-anchor="middle" font-family="Arial" font-weight="bold">EML</text>
  </g>
  
  <text x="520" y="210" class="item-bold">Domain:</text>
  <text x="640" y="210" class="item">ℂ (complex numbers)</text>
  
  <text x="520" y="235" class="item-bold">Definition:</text>
  <text x="640" y="235" class="item">EML(x,y) = exp(x) - ln(y)</text>
  
  <text x="520" y="260" class="item-bold">Constants:</text>
  <text x="640" y="260" class="item">1 (the digit one)</text>
  
  <text x="520" y="285" class="item-bold">Generates:</text>
  <text x="640" y="285" class="item">+, -, ×, /, ^, √, exp, ln,</text>
  <text x="640" y="305" class="item">sin, cos, π, e, i, ...</text>
  
  <text x="520" y="335" class="item-bold">Grammar:</text>
  <text x="640" y="335" class="item">S → 1 | x | EML(S, S)</text>
  
  <text x="520" y="365" class="item-bold">Complexity:</text>
  <text x="640" y="365" class="item">Leaf count / tree depth</text>
  
  <text x="520" y="395" class="item-bold">Discovery:</text>
  <text x="640" y="395" class="item">Odrzywolek, 2025</text>
  
  <text x="520" y="425" class="item-bold">Applications:</text>
  <text x="640" y="425" class="item">Symbolic regression, analog</text>
  <text x="640" y="445" class="item">computing, neural architecture</text>
  
  <!-- Central connector -->
  <line x1="430" y1="150" x2="470" y2="150" class="connector"/>
  <line x1="430" y1="250" x2="470" y2="250" class="connector"/>
  <line x1="430" y1="350" x2="470" y2="350" class="connector"/>
  <text x="450" y="200" font-size="24" fill="#999" text-anchor="middle">↔</text>
  <text x="450" y="300" font-size="24" fill="#999" text-anchor="middle">↔</text>
</svg>
