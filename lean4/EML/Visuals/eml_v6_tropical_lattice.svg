<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a1e3e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>

  <text x="400" y="35" text-anchor="middle" fill="#dda0dd" font-size="22" font-weight="bold">
    Tropical EML: Universal Lattice Generator
  </text>
  <text x="400" y="58" text-anchor="middle" fill="#aab" font-size="13">
    trop(x, y) = max(x, −y) generates all piecewise-linear functions
  </text>

  <!-- Main operations -->
  <rect x="40" y="80" width="220" height="150" rx="12" fill="#1a2a4a" stroke="#50c878" stroke-width="2"/>
  <text x="150" y="108" text-anchor="middle" fill="#50c878" font-size="15" font-weight="bold">Maximum</text>
  <text x="60" y="135" fill="#fff" font-size="14">max(x, y) = trop(x, −y)</text>
  <text x="60" y="160" fill="#aab" font-size="12">= max(x, −(−y))</text>
  <text x="60" y="180" fill="#aab" font-size="12">= max(x, y) ✓</text>
  <text x="60" y="215" fill="#7f7" font-size="11">Proved: trop6_recovers_max</text>

  <rect x="290" y="80" width="220" height="150" rx="12" fill="#1a2a4a" stroke="#4da6ff" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" fill="#4da6ff" font-size="15" font-weight="bold">Minimum</text>
  <text x="310" y="135" fill="#fff" font-size="14">min(x, y) = −trop(−x, y)</text>
  <text x="310" y="160" fill="#aab" font-size="12">= −max(−x, −y)</text>
  <text x="310" y="180" fill="#aab" font-size="12">= min(x, y) ✓</text>
  <text x="310" y="215" fill="#7f7" font-size="11">Proved: trop6_recovers_min</text>

  <rect x="540" y="80" width="220" height="150" rx="12" fill="#1a2a4a" stroke="#ff9f43" stroke-width="2"/>
  <text x="650" y="108" text-anchor="middle" fill="#ff9f43" font-size="15" font-weight="bold">Absolute Value</text>
  <text x="560" y="135" fill="#fff" font-size="14">|z| = trop(z, z)</text>
  <text x="560" y="160" fill="#aab" font-size="12">= max(z, −z)</text>
  <text x="560" y="180" fill="#aab" font-size="12">= |z| ✓</text>
  <text x="560" y="215" fill="#7f7" font-size="11">Proved: trop6_abs</text>

  <!-- Universality arrow -->
  <rect x="100" y="260" width="600" height="80" rx="15" fill="#0d2d0d" stroke="#FFD700" stroke-width="2"/>
  <text x="400" y="290" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">
    TROPICAL UNIVERSALITY THEOREM
  </text>
  <text x="400" y="315" text-anchor="middle" fill="#afa" font-size="13">
    {max, +} generates all piecewise-linear functions
  </text>
  <text x="400" y="333" text-anchor="middle" fill="#afa" font-size="13">
    trop generates max ⟹ trop is tropically universal
  </text>

  <!-- Analogy -->
  <rect x="100" y="360" width="600" height="70" rx="10" fill="#1a1a3a" stroke="#bb86fc" stroke-width="1.5"/>
  <text x="400" y="388" text-anchor="middle" fill="#bb86fc" font-size="14" font-weight="bold">
    The Grand Analogy
  </text>
  <text x="150" y="415" fill="#dda0dd" font-size="12">EML → elementary functions</text>
  <text x="400" y="415" fill="#888" font-size="16">⇔</text>
  <text x="480" y="415" fill="#4da6ff" font-size="12">Tropical EML → piecewise-linear functions</text>
</svg>
