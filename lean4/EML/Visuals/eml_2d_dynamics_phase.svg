<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff8844"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <text x="400" y="35" text-anchor="middle" font-family="Georgia" font-size="22" fill="#ffd700">2D EML Dynamical Map: Φ(x,y) = (EML(x,y), EML(y,x))</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial" font-size="12" fill="#8888cc">Phase portrait showing universal divergence</text>

  <!-- Axes -->
  <line x1="100" y1="500" x2="700" y2="500" stroke="#444466" stroke-width="1"/>
  <line x1="100" y1="500" x2="100" y2="80" stroke="#444466" stroke-width="1"/>
  <text x="400" y="530" text-anchor="middle" font-family="Arial" font-size="12" fill="#8888aa">x</text>
  <text x="80" y="290" text-anchor="middle" font-family="Arial" font-size="12" fill="#8888aa" transform="rotate(-90,80,290)">y</text>

  <!-- Grid -->
  <line x1="220" y1="500" x2="220" y2="80" stroke="#222244" stroke-width="0.5"/>
  <line x1="340" y1="500" x2="340" y2="80" stroke="#222244" stroke-width="0.5"/>
  <line x1="460" y1="500" x2="460" y2="80" stroke="#222244" stroke-width="0.5"/>
  <line x1="580" y1="500" x2="580" y2="80" stroke="#222244" stroke-width="0.5"/>
  <line x1="100" y1="395" x2="700" y2="395" stroke="#222244" stroke-width="0.5"/>
  <line x1="100" y1="290" x2="700" y2="290" stroke="#222244" stroke-width="0.5"/>
  <line x1="100" y1="185" x2="700" y2="185" stroke="#222244" stroke-width="0.5"/>

  <!-- Scale labels -->
  <text x="100" y="515" text-anchor="middle" font-family="Arial" font-size="10" fill="#666688">0</text>
  <text x="220" y="515" text-anchor="middle" font-family="Arial" font-size="10" fill="#666688">1</text>
  <text x="340" y="515" text-anchor="middle" font-family="Arial" font-size="10" fill="#666688">2</text>
  <text x="460" y="515" text-anchor="middle" font-family="Arial" font-size="10" fill="#666688">3</text>
  <text x="580" y="515" text-anchor="middle" font-family="Arial" font-size="10" fill="#666688">4</text>
  <text x="700" y="515" text-anchor="middle" font-family="Arial" font-size="10" fill="#666688">5</text>
  <text x="90" y="500" text-anchor="end" font-family="Arial" font-size="10" fill="#666688">0</text>
  <text x="90" y="395" text-anchor="end" font-family="Arial" font-size="10" fill="#666688">1</text>
  <text x="90" y="290" text-anchor="end" font-family="Arial" font-size="10" fill="#666688">2</text>
  <text x="90" y="185" text-anchor="end" font-family="Arial" font-size="10" fill="#666688">3</text>
  <text x="90" y="80" text-anchor="end" font-family="Arial" font-size="10" fill="#666688">4</text>

  <!-- Diagonal line x=y -->
  <line x1="100" y1="500" x2="600" y2="0" stroke="#333355" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="630" y="30" font-family="Arial" font-size="10" fill="#555577">x = y</text>

  <!-- Trajectory 1: (0.5, 0.5) -->
  <circle cx="160" cy="447.5" r="5" fill="#ff4444" opacity="0.9"/>
  <line x1="160" y1="447.5" x2="248" y2="119" stroke="#ff4444" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.7"/>
  <text x="165" y="465" font-family="Arial" font-size="9" fill="#ff8888">(0.5, 0.5)</text>

  <!-- Trajectory 2: (1.0, 1.0) → (e-0, e-0) = (e, e) ≈ (2.72, 2.72) -->
  <circle cx="220" cy="395" r="5" fill="#44ff44" opacity="0.9"/>
  <line x1="220" y1="395" x2="425" y2="115" stroke="#44ff44" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.7"/>
  <text x="230" y="410" font-family="Arial" font-size="9" fill="#88ff88">(1.0, 1.0)</text>

  <!-- Trajectory 3: (0.5, 1.5) asymmetric -->
  <circle cx="160" cy="342.5" r="5" fill="#4488ff" opacity="0.9"/>
  <line x1="160" y1="342.5" x2="249" y2="117" stroke="#4488ff" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.7"/>
  <text x="115" y="338" font-family="Arial" font-size="9" fill="#88aaff">(0.5, 1.5)</text>

  <!-- Trajectory 4: (2.0, 0.5) -->
  <circle cx="340" cy="447.5" r="5" fill="#ff44ff" opacity="0.9"/>
  <line x1="340" y1="447.5" x2="690" y2="390" stroke="#ff44ff" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.7"/>
  <text x="345" y="465" font-family="Arial" font-size="9" fill="#ff88ff">(2.0, 0.5)</text>

  <!-- Arrows pointing outward (indicating divergence) -->
  <text x="690" y="100" font-family="Arial" font-size="14" fill="#ff8844">↗ ∞</text>
  <text x="690" y="120" font-family="Arial" font-size="10" fill="#ff8844">All orbits diverge</text>

  <!-- Key findings box -->
  <rect x="110" y="80" width="220" height="100" rx="8" fill="#0a0a2e" stroke="#ffd700" stroke-width="1" opacity="0.9"/>
  <text x="220" y="100" text-anchor="middle" font-family="Georgia" font-size="13" fill="#ffd700">Key Findings</text>
  <text x="120" y="118" font-family="Arial" font-size="10" fill="#ff4444">✗ No fixed points</text>
  <text x="120" y="134" font-family="Arial" font-size="10" fill="#ff4444">✗ No periodic orbits (≤4)</text>
  <text x="120" y="150" font-family="Arial" font-size="10" fill="#44ff44">✓ Universal divergence</text>
  <text x="120" y="166" font-family="Arial" font-size="10" fill="#44ff44">✓ Positive Lyapunov exp.</text>

  <!-- Jacobian info -->
  <rect x="420" y="540" width="340" height="45" rx="6" fill="#0a0a2e" stroke="#555588" stroke-width="1"/>
  <text x="590" y="558" text-anchor="middle" font-family="monospace" font-size="11" fill="#aaaacc">J(Φ) = [[exp(x), −1/y], [−1/x, exp(y)]]</text>
  <text x="590" y="575" text-anchor="middle" font-family="Arial" font-size="10" fill="#888888">det(J) = exp(x+y) − 1/(xy) &gt; 0 for x,y &gt; 0</text>

  <text x="400" y="595" text-anchor="middle" font-family="Arial" font-size="10" fill="#666688">Computationally verified: no bounded orbits exist in the positive quadrant</text>
</svg>
