<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08082a"/>
      <stop offset="100%" style="stop-color:#1a1a4a"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="750" fill="url(#bg5)"/>

  <text x="550" y="40" text-anchor="middle" font-family="Georgia" font-size="24" fill="#ffd700" filter="url(#glow5)">OISCC Application Ecosystem — Demonstrated &amp; Proposed</text>
  <text x="550" y="62" text-anchor="middle" font-family="Arial" font-size="13" fill="#8888cc">One Instruction. Endless Applications.</text>

  <!-- Row 1: Demonstrated (green border) -->
  <text x="50" y="100" font-family="Georgia" font-size="16" fill="#44ff44">✓ Demonstrated (Python + Lean)</text>

  <!-- App 1: Black-Scholes -->
  <rect x="30" y="115" width="240" height="105" rx="8" fill="#0a1a0a" stroke="#44ff44" stroke-width="2"/>
  <text x="150" y="138" text-anchor="middle" font-family="Georgia" font-size="14" fill="#44ff44" font-weight="bold">💰 Black-Scholes</text>
  <text x="45" y="158" font-family="Arial" font-size="10" fill="#cccccc">Option pricing: ~17 instructions</text>
  <text x="45" y="173" font-family="Arial" font-size="10" fill="#cccccc">Error: &lt; 0.02% vs IEEE 754</text>
  <text x="45" y="188" font-family="Arial" font-size="10" fill="#cccccc">All Greeks computable</text>
  <text x="45" y="203" font-family="Arial" font-size="10" fill="#88ff88">Volatility surface: ✓</text>

  <!-- App 2: Neural Networks -->
  <rect x="290" y="115" width="240" height="105" rx="8" fill="#0a1a0a" stroke="#44ff44" stroke-width="2"/>
  <text x="410" y="138" text-anchor="middle" font-family="Georgia" font-size="14" fill="#44ff44" font-weight="bold">🧠 Neural Networks</text>
  <text x="305" y="158" font-family="Arial" font-size="10" fill="#cccccc">XOR network: ~50 EML ops</text>
  <text x="305" y="173" font-family="Arial" font-size="10" fill="#cccccc">Sigmoid native: ~7 EML ops</text>
  <text x="305" y="188" font-family="Arial" font-size="10" fill="#cccccc">Softmax: ~15 EML ops/class</text>
  <text x="305" y="203" font-family="Arial" font-size="10" fill="#88ff88">PID controller: ✓</text>

  <!-- App 3: Signal Processing -->
  <rect x="550" y="115" width="240" height="105" rx="8" fill="#0a1a0a" stroke="#44ff44" stroke-width="2"/>
  <text x="670" y="138" text-anchor="middle" font-family="Georgia" font-size="14" fill="#44ff44" font-weight="bold">📡 Signal Processing</text>
  <text x="565" y="158" font-family="Arial" font-size="10" fill="#cccccc">FM demodulation: ✓</text>
  <text x="565" y="173" font-family="Arial" font-size="10" fill="#cccccc">Goertzel DFT: 76 EML/bin</text>
  <text x="565" y="188" font-family="Arial" font-size="10" fill="#cccccc">Wavelet transform: ✓</text>
  <text x="565" y="203" font-family="Arial" font-size="10" fill="#88ff88">Kalman filter: ~200 EML/cycle</text>

  <!-- App 4: Cryptography -->
  <rect x="810" y="115" width="240" height="105" rx="8" fill="#0a1a0a" stroke="#44ff44" stroke-width="2"/>
  <text x="930" y="138" text-anchor="middle" font-family="Georgia" font-size="14" fill="#44ff44" font-weight="bold">🔐 Crypto &amp; PRNG</text>
  <text x="825" y="158" font-family="Arial" font-size="10" fill="#cccccc">EML hash: avalanche effect</text>
  <text x="825" y="173" font-family="Arial" font-size="10" fill="#cccccc">PRNG: good correlation</text>
  <text x="825" y="188" font-family="Arial" font-size="10" fill="#cccccc">Seed sensitivity: ✓</text>
  <text x="825" y="203" font-family="Arial" font-size="10" fill="#ffaa44">Security: UNPROVEN</text>

  <!-- Row 2: Proposed (yellow border) -->
  <text x="50" y="260" font-family="Georgia" font-size="16" fill="#ffaa44">◎ Proposed (Feasibility Analyzed)</text>

  <!-- App 5: Medical -->
  <rect x="30" y="275" width="330" height="130" rx="8" fill="#1a1a0a" stroke="#ffaa44" stroke-width="2"/>
  <text x="195" y="298" text-anchor="middle" font-family="Georgia" font-size="14" fill="#ffaa44" font-weight="bold">⚕️ Medical Devices</text>
  <rect x="45" y="310" width="300" height="85" rx="4" fill="#0a0a1a"/>
  <text x="55" y="328" font-family="Arial" font-size="10" fill="#cccccc">Glucose Monitor</text>
  <text x="55" y="343" font-family="Arial" font-size="9" fill="#888888">  • 200 EML/measurement</text>
  <text x="55" y="356" font-family="Arial" font-size="9" fill="#888888">  • &lt;50µW power</text>
  <text x="55" y="369" font-family="Arial" font-size="9" fill="#888888">  • &gt;1 year battery life</text>
  <text x="200" y="328" font-family="Arial" font-size="10" fill="#cccccc">Cochlear Implant</text>
  <text x="200" y="343" font-family="Arial" font-size="9" fill="#888888">  • 20-bin spectral analysis</text>
  <text x="200" y="356" font-family="Arial" font-size="9" fill="#888888">  • 24.3 MHz required</text>
  <text x="200" y="369" font-family="Arial" font-size="9" fill="#888888">  • Real-time 16kHz audio</text>

  <!-- App 6: Space -->
  <rect x="380" y="275" width="330" height="130" rx="8" fill="#1a1a0a" stroke="#ffaa44" stroke-width="2"/>
  <text x="545" y="298" text-anchor="middle" font-family="Georgia" font-size="14" fill="#ffaa44" font-weight="bold">🚀 Space &amp; Defense</text>
  <rect x="395" y="310" width="300" height="85" rx="4" fill="#0a0a1a"/>
  <text x="405" y="328" font-family="Arial" font-size="10" fill="#cccccc">Radiation-Hard Processor</text>
  <text x="405" y="343" font-family="Arial" font-size="9" fill="#888888">  • 300 transistors (analog)</text>
  <text x="405" y="356" font-family="Arial" font-size="9" fill="#888888">  • TMR: 3×300 = 900 transistors</text>
  <text x="405" y="369" font-family="Arial" font-size="9" fill="#888888">  • Simpler than Cortex-M0</text>
  <text x="405" y="385" font-family="Arial" font-size="9" fill="#88ff88">  • Inherent radiation tolerance</text>

  <!-- App 7: IoT -->
  <rect x="730" y="275" width="330" height="130" rx="8" fill="#1a1a0a" stroke="#ffaa44" stroke-width="2"/>
  <text x="895" y="298" text-anchor="middle" font-family="Georgia" font-size="14" fill="#ffaa44" font-weight="bold">🌐 IoT &amp; Smart Dust</text>
  <rect x="745" y="310" width="300" height="85" rx="4" fill="#0a0a1a"/>
  <text x="755" y="328" font-family="Arial" font-size="10" fill="#cccccc">Smart Sensor Node</text>
  <text x="755" y="343" font-family="Arial" font-size="9" fill="#888888">  • Solar powered</text>
  <text x="755" y="356" font-family="Arial" font-size="9" fill="#888888">  • &lt;10µW active, &lt;1µW sleep</text>
  <text x="755" y="369" font-family="Arial" font-size="9" fill="#888888">  • Temp compensation + filtering</text>
  <text x="755" y="385" font-family="Arial" font-size="9" fill="#888888">  • Wireless environmental sensing</text>

  <!-- Row 3: Hardware roadmap -->
  <text x="50" y="440" font-family="Georgia" font-size="16" fill="#6688ff">⚙ Hardware Roadmap</text>

  <!-- Timeline -->
  <line x1="80" y1="475" x2="1050" y2="475" stroke="#4466aa" stroke-width="2"/>

  <!-- Year 1 -->
  <circle cx="200" cy="475" r="8" fill="#44ff44" stroke="#ffffff" stroke-width="2"/>
  <text x="200" y="468" text-anchor="middle" font-family="Arial" font-size="11" fill="#44ff44">Year 1</text>
  <rect x="120" y="490" width="160" height="55" rx="6" fill="#0a1a0a" stroke="#44ff44" stroke-width="1"/>
  <text x="200" y="508" text-anchor="middle" font-family="Arial" font-size="10" fill="#cccccc">FPGA Prototype</text>
  <text x="200" y="523" text-anchor="middle" font-family="Arial" font-size="9" fill="#888888">Xilinx Artix-7</text>
  <text x="200" y="538" text-anchor="middle" font-family="Arial" font-size="9" fill="#888888">CORDIC exp/ln</text>

  <!-- Year 2 -->
  <circle cx="420" cy="475" r="8" fill="#ffaa44" stroke="#ffffff" stroke-width="2"/>
  <text x="420" y="468" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffaa44">Year 2</text>
  <rect x="340" y="490" width="160" height="55" rx="6" fill="#1a1a0a" stroke="#ffaa44" stroke-width="1"/>
  <text x="420" y="508" text-anchor="middle" font-family="Arial" font-size="10" fill="#cccccc">Analog Breadboard</text>
  <text x="420" y="523" text-anchor="middle" font-family="Arial" font-size="9" fill="#888888">BJT circuit</text>
  <text x="420" y="538" text-anchor="middle" font-family="Arial" font-size="9" fill="#888888">&lt;100 transistors</text>

  <!-- Year 3 -->
  <circle cx="640" cy="475" r="8" fill="#ff6644" stroke="#ffffff" stroke-width="2"/>
  <text x="640" y="468" text-anchor="middle" font-family="Arial" font-size="11" fill="#ff6644">Year 3</text>
  <rect x="560" y="490" width="160" height="55" rx="6" fill="#1a0a0a" stroke="#ff6644" stroke-width="1"/>
  <text x="640" y="508" text-anchor="middle" font-family="Arial" font-size="10" fill="#cccccc">ASIC Tape-out</text>
  <text x="640" y="523" text-anchor="middle" font-family="Arial" font-size="9" fill="#888888">65nm or 28nm CMOS</text>
  <text x="640" y="538" text-anchor="middle" font-family="Arial" font-size="9" fill="#888888">&lt;100µW, 1-10MHz</text>

  <!-- Year 5 -->
  <circle cx="880" cy="475" r="8" fill="#ff44ff" stroke="#ffffff" stroke-width="2"/>
  <text x="880" y="468" text-anchor="middle" font-family="Arial" font-size="11" fill="#ff44ff">Year 5</text>
  <rect x="800" y="490" width="160" height="55" rx="6" fill="#1a0a1a" stroke="#ff44ff" stroke-width="1"/>
  <text x="880" y="508" text-anchor="middle" font-family="Arial" font-size="10" fill="#cccccc">Production ASIC</text>
  <text x="880" y="523" text-anchor="middle" font-family="Arial" font-size="9" fill="#888888">Clinical deployment</text>
  <text x="880" y="538" text-anchor="middle" font-family="Arial" font-size="9" fill="#888888">Space qualification</text>

  <!-- Comparison table -->
  <rect x="30" y="575" width="1040" height="145" rx="10" fill="#0a0a2a" stroke="#555588" stroke-width="1"/>
  <text x="550" y="600" text-anchor="middle" font-family="Georgia" font-size="16" fill="#ffd700">OISCC vs. Conventional Architectures</text>

  <text x="60" y="625" font-family="monospace" font-size="11" fill="#aaaacc">Metric              OISCC (analog)   OISCC (FPGA)    ARM Cortex-M0    Intel i9</text>
  <text x="60" y="640" font-family="monospace" font-size="11" fill="#aaaacc">─────────────────────────────────────────────────────────────────────────────</text>
  <text x="60" y="655" font-family="monospace" font-size="11" fill="#cccccc">Transistors          ~300             ~7,500          ~12,000          ~10B</text>
  <text x="60" y="670" font-family="monospace" font-size="11" fill="#cccccc">Instructions         1 (EML)          1 (EML)         52               ~1,500</text>
  <text x="60" y="685" font-family="monospace" font-size="11" fill="#cccccc">exp(x) ops           1                1               ~100             1*</text>
  <text x="60" y="700" font-family="monospace" font-size="11" fill="#cccccc">Power (est.)         ~10µW            ~1mW            ~5mW             ~125W</text>
  <text x="60" y="715" font-family="monospace" font-size="11" fill="#888888">* Intel uses dedicated FPU microcode</text>

  <text x="550" y="740" text-anchor="middle" font-family="Arial" font-size="10" fill="#666688">OISCC: Simplest possible architecture for continuous mathematics</text>
</svg>
