<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgDiag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#0a0a1e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgDiag)"/>

  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-size="20" font-weight="bold" font-family="Georgia">
    The EML Diagonal Map d(z) = exp(z) − ln(z)
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#999" font-size="13" font-family="sans-serif">
    Proved: d(z) > z for all z ∈ ℝ (no real fixed points)
  </text>

  <!-- Coordinate system -->
  <!-- Plot area: x from 50 to 750, y from 80 to 520 -->
  <!-- Math coords: x from -2 to 4, y from -1 to 10 -->

  <!-- Grid -->
  <g stroke="#333" stroke-width="0.5">
    <!-- Vertical lines at x = -1, 0, 1, 2, 3 -->
    <line x1="167" y1="80" x2="167" y2="520"/>
    <line x1="283" y1="80" x2="283" y2="520"/>
    <line x1="400" y1="80" x2="400" y2="520"/>
    <line x1="517" y1="80" x2="517" y2="520"/>
    <line x1="633" y1="80" x2="633" y2="520"/>
    <!-- Horizontal lines at y = 0, 2, 4, 6, 8 -->
    <line x1="50" y1="480" x2="750" y2="480"/>
    <line x1="50" y1="400" x2="750" y2="400"/>
    <line x1="50" y1="320" x2="750" y2="320"/>
    <line x1="50" y1="240" x2="750" y2="240"/>
    <line x1="50" y1="160" x2="750" y2="160"/>
  </g>

  <!-- Axes -->
  <line x1="50" y1="480" x2="750" y2="480" stroke="#666" stroke-width="1.5"/>
  <line x1="283" y1="80" x2="283" y2="520" stroke="#666" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="167" y="498" text-anchor="middle" fill="#888" font-size="11">-1</text>
  <text x="283" y="498" text-anchor="middle" fill="#888" font-size="11">0</text>
  <text x="400" y="498" text-anchor="middle" fill="#888" font-size="11">1</text>
  <text x="517" y="498" text-anchor="middle" fill="#888" font-size="11">2</text>
  <text x="633" y="498" text-anchor="middle" fill="#888" font-size="11">3</text>
  <text x="270" y="403" text-anchor="end" fill="#888" font-size="11">2</text>
  <text x="270" y="323" text-anchor="end" fill="#888" font-size="11">4</text>
  <text x="270" y="243" text-anchor="end" fill="#888" font-size="11">6</text>
  <text x="270" y="163" text-anchor="end" fill="#888" font-size="11">8</text>

  <!-- y = x line (identity) -->
  <line x1="50" y1="520" x2="710" y2="80" stroke="#444" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="680" y="110" fill="#555" font-size="12" font-family="sans-serif">y = z</text>

  <!-- d(z) = exp(z) - ln(z) curve for z > 0 -->
  <!-- Points computed: z=0.1→2.4, z=0.3→1.55, z=0.567→1.76, z=1→2.72, z=2→7.08, z=3→19.9 -->
  <!-- Scale: x_pixel = 283 + z*116.7, y_pixel = 480 - y*40 -->
  <polyline points="
    73,434
    108,418
    132,406
    155,400
    190,398
    213,400
    237,404
    260,412
    283,422
    307,400
    330,378
    354,348
    377,308
    400,254
    424,180
    448,80
  " fill="none" stroke="#ff4444" stroke-width="2.5"/>
  <text x="460" y="95" fill="#ff4444" font-size="13" font-weight="bold" font-family="sans-serif">d(z) = eᶻ − ln z</text>

  <!-- d(z) = exp(z) for z ≤ 0 (ln(z) = 0) -->
  <polyline points="
    50,464
    73,457
    108,445
    132,438
    155,434
    190,428
    213,425
    237,422
    260,420
    283,440
  " fill="none" stroke="#ff6666" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="90" y="475" fill="#ff8888" font-size="11" font-family="sans-serif">d(z) = eᶻ (z ≤ 0)</text>

  <!-- Minimum point marker (z ≈ 0.567, d ≈ 1.76) -->
  <circle cx="349" cy="410" r="5" fill="#ffd700" stroke="#ffa500" stroke-width="2"/>
  <text x="365" y="425" fill="#ffd700" font-size="11" font-family="sans-serif">min ≈ (W(1), 1.76)</text>

  <!-- Key annotations -->
  <rect x="510" y="350" width="230" height="160" rx="8" fill="#0a0a2e" stroke="#ffd700" stroke-width="1.5" opacity="0.9"/>
  <text x="625" y="375" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold" font-family="sans-serif">Key Properties</text>
  <text x="520" y="400" fill="#ccc" font-size="12" font-family="sans-serif">• d(z) > z  ∀z ∈ ℝ (proved)</text>
  <text x="520" y="420" fill="#ccc" font-size="12" font-family="sans-serif">• d(z) ≥ 1  for z > 0 (proved)</text>
  <text x="520" y="440" fill="#ccc" font-size="12" font-family="sans-serif">• min at z = W(1) ≈ 0.567</text>
  <text x="520" y="460" fill="#ccc" font-size="12" font-family="sans-serif">• d(z) → ∞ as z → ±∞ (proved)</text>
  <text x="520" y="480" fill="#ccc" font-size="12" font-family="sans-serif">• No fixed point (proved)</text>
  <text x="520" y="500" fill="#ccc" font-size="12" font-family="sans-serif">• g(z) = e−ln z has z*≈1.763</text>

  <!-- Gap indicator -->
  <text x="400" y="555" text-anchor="middle" fill="#999" font-size="11" font-family="sans-serif">
    The curve d(z) always stays strictly above the line y = z
  </text>
  <text x="400" y="575" text-anchor="middle" fill="#666" font-size="10" font-family="sans-serif">
    (Formally verified in Lean 4 via Real.add_one_le_exp and Real.log_le_sub_one_of_pos)
  </text>
</svg>
