<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f4"/>
      <stop offset="100%" stop-color="#f0ece4"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="600" fill="url(#bgD)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#2a3a5a" font-size="22" font-weight="bold">
    The Diagonal EML Map: d(z) = exp(z) − ln(z)
  </text>
  <text x="450" y="58" text-anchor="middle" fill="#6a7a9a" font-size="14">
    Formally proved: No real fixed point exists (d(z) > z for all z ∈ ℝ)
  </text>
  
  <!-- Graph axes -->
  <line x1="100" y1="500" x2="550" y2="500" stroke="#2a3a5a" stroke-width="2"/>
  <line x1="100" y1="500" x2="100" y2="100" stroke="#2a3a5a" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="330" y="540" text-anchor="middle" fill="#2a3a5a" font-size="14">z</text>
  <text x="70" y="300" text-anchor="middle" fill="#2a3a5a" font-size="14" transform="rotate(-90,70,300)">d(z)</text>
  
  <!-- Grid lines -->
  <line x1="100" y1="400" x2="550" y2="400" stroke="#ddd" stroke-width="0.5"/>
  <line x1="100" y1="300" x2="550" y2="300" stroke="#ddd" stroke-width="0.5"/>
  <line x1="100" y1="200" x2="550" y2="200" stroke="#ddd" stroke-width="0.5"/>
  <line x1="200" y1="100" x2="200" y2="500" stroke="#ddd" stroke-width="0.5"/>
  <line x1="300" y1="100" x2="300" y2="500" stroke="#ddd" stroke-width="0.5"/>
  <line x1="400" y1="100" x2="400" y2="500" stroke="#ddd" stroke-width="0.5"/>
  
  <!-- Scale markers -->
  <text x="95" y="505" text-anchor="end" fill="#6a7a9a" font-size="10">0</text>
  <text x="200" y="518" text-anchor="middle" fill="#6a7a9a" font-size="10">1</text>
  <text x="300" y="518" text-anchor="middle" fill="#6a7a9a" font-size="10">2</text>
  <text x="400" y="518" text-anchor="middle" fill="#6a7a9a" font-size="10">3</text>
  <text x="90" y="404" text-anchor="end" fill="#6a7a9a" font-size="10">1</text>
  <text x="90" y="304" text-anchor="end" fill="#6a7a9a" font-size="10">2</text>
  <text x="90" y="204" text-anchor="end" fill="#6a7a9a" font-size="10">3</text>
  
  <!-- y = z line (identity) -->
  <line x1="100" y1="500" x2="500" y2="100" stroke="#aaa" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="510" y="100" fill="#999" font-size="12">y = z</text>
  
  <!-- d(z) = exp(z) - ln(z) curve (approximate, for z > 0) -->
  <!-- At z=0.1: exp(0.1)-ln(0.1) ≈ 1.105+2.303 = 3.408 -->
  <!-- At z=0.5: exp(0.5)-ln(0.5) ≈ 1.649+0.693 = 2.342 -->
  <!-- At z=1:   exp(1)-ln(1) ≈ 2.718-0 = 2.718 -->
  <!-- At z=1.5: exp(1.5)-ln(1.5) ≈ 4.482-0.405 = 4.077 -->
  <!-- At z=2:   exp(2)-ln(2) ≈ 7.389-0.693 = 6.696 -->
  <!-- Plotting with scale: 100px = 1 unit -->
  <path d="M 110,158 Q 130,260 150,266 Q 200,274 200,228 Q 250,180 300,100"
        fill="none" stroke="#e04040" stroke-width="3"/>
  <text x="310" y="95" fill="#e04040" font-size="13" font-weight="bold">d(z) = eᶻ − ln z</text>
  
  <!-- Gap annotation -->
  <line x1="200" y1="228" x2="200" y2="400" stroke="#4488ff" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="215" y="320" fill="#4488ff" font-size="12">gap > 0</text>
  <text x="215" y="338" fill="#4488ff" font-size="11">(always)</text>
  
  <!-- Minimum annotation -->
  <circle cx="165" cy="272" r="5" fill="#e04040" stroke="white" stroke-width="2"/>
  <text x="178" y="290" fill="#e04040" font-size="11">minimum ≈ (0.57, 2.22)</text>
  <text x="178" y="305" fill="#e04040" font-size="11">d(z) ≥ 1 (proved)</text>
  
  <!-- Right panel: Theorem statements -->
  <rect x="580" y="90" width="300" height="450" rx="10" fill="white" stroke="#ccc" stroke-width="1"/>
  
  <text x="730" y="120" text-anchor="middle" fill="#2a3a5a" font-size="16" font-weight="bold">
    Verified Theorems
  </text>
  
  <rect x="600" y="135" width="260" height="55" rx="6" fill="#f0fff0" stroke="#88cc88"/>
  <text x="610" y="155" fill="#2a6a2a" font-size="12" font-weight="bold">Theorem 1 (No Fixed Point)</text>
  <text x="610" y="175" fill="#2a6a2a" font-size="11">∀ z : ℝ, exp(z) − ln(z) ≠ z</text>
  
  <rect x="600" y="200" width="260" height="55" rx="6" fill="#f0fff0" stroke="#88cc88"/>
  <text x="610" y="220" fill="#2a6a2a" font-size="12" font-weight="bold">Theorem 2 (Positive Gap)</text>
  <text x="610" y="240" fill="#2a6a2a" font-size="11">∀ z > 0, exp(z) − ln(z) > z</text>
  
  <rect x="600" y="265" width="260" height="55" rx="6" fill="#f0fff0" stroke="#88cc88"/>
  <text x="610" y="285" fill="#2a6a2a" font-size="12" font-weight="bold">Theorem 3 (Lower Bound)</text>
  <text x="610" y="305" fill="#2a6a2a" font-size="11">∀ z > 0, exp(z) − ln(z) ≥ 1</text>
  
  <rect x="600" y="330" width="260" height="55" rx="6" fill="#f0f0ff" stroke="#8888cc"/>
  <text x="610" y="350" fill="#2a2a6a" font-size="12" font-weight="bold">Theorem 4 (Lambert W)</text>
  <text x="610" y="370" fill="#2a2a6a" font-size="11">z* = e − ln(z*) ⟹ z*·eᶻ* = eᵉ</text>
  
  <rect x="600" y="395" width="260" height="55" rx="6" fill="#fff0f0" stroke="#cc8888"/>
  <text x="610" y="415" fill="#6a2a2a" font-size="12" font-weight="bold">Theorem 5 (Monotonicity)</text>
  <text x="610" y="435" fill="#6a2a2a" font-size="11">eml is ↑ in x, ↓ in y (y > 0)</text>
  
  <rect x="600" y="460" width="260" height="55" rx="6" fill="#f0f8ff" stroke="#8888cc"/>
  <text x="610" y="480" fill="#2a2a6a" font-size="12" font-weight="bold">Theorem 6 (Convexity)</text>
  <text x="610" y="500" fill="#2a2a6a" font-size="11">eml convex in x (ℝ), convex in y (ℝ₊)</text>
  
  <!-- Footer -->
  <text x="450" y="580" text-anchor="middle" fill="#8a9aba" font-size="12">
    All theorems machine-verified in Lean 4 with Mathlib — zero sorry's
  </text>
</svg>
