<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="1000" height="700" fill="url(#bg2)"/>
  
  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#ffd700" font-size="24" font-weight="bold" font-family="Georgia" filter="url(#glow2)">
    Pythagorean N-Tuple Hierarchy in EML Space
  </text>
  <text x="500" y="70" text-anchor="middle" fill="#999" font-size="12" font-family="Georgia">
    Each level embeds in the next · All levels are EML-computable
  </text>
  
  <!-- Concentric rings representing dimensions -->
  <!-- N=3: Triples (innermost) -->
  <ellipse cx="500" cy="380" rx="100" ry="60" fill="none" stroke="#ff4444" stroke-width="3" filter="url(#glow2)"/>
  <text x="500" y="370" text-anchor="middle" fill="#ff4444" font-size="14" font-weight="bold" font-family="monospace">N = 3</text>
  <text x="500" y="388" text-anchor="middle" fill="#ff8888" font-size="11" font-family="monospace">a² + b² = c²</text>
  <text x="500" y="405" text-anchor="middle" fill="#ff6666" font-size="9" font-family="monospace">(3,4,5) (5,12,13) ...</text>
  
  <!-- N=4: Quadruples -->
  <ellipse cx="500" cy="380" rx="200" ry="120" fill="none" stroke="#ff8800" stroke-width="2.5" filter="url(#glow2)"/>
  <text x="500" y="275" text-anchor="middle" fill="#ff8800" font-size="13" font-weight="bold" font-family="monospace">N = 4: Quadruples</text>
  <text x="500" y="293" text-anchor="middle" fill="#ffaa44" font-size="10" font-family="monospace">a² + b² + c² = d²</text>
  <text x="720" y="380" text-anchor="middle" fill="#ff8800" font-size="9" font-family="monospace">(1,2,2,3)</text>
  <text x="280" y="380" text-anchor="middle" fill="#ff8800" font-size="9" font-family="monospace">(2,3,6,7)</text>
  
  <!-- N=5: Quintuples -->
  <ellipse cx="500" cy="380" rx="300" ry="175" fill="none" stroke="#ffcc00" stroke-width="2" filter="url(#glow2)"/>
  <text x="500" y="218" text-anchor="middle" fill="#ffcc00" font-size="13" font-weight="bold" font-family="monospace">N = 5: Quintuples</text>
  <text x="500" y="236" text-anchor="middle" fill="#ffdd44" font-size="10" font-family="monospace">a² + b² + c² + d² = e²</text>
  
  <!-- N=∞: General -->
  <ellipse cx="500" cy="380" rx="400" ry="230" fill="none" stroke="#00dd88" stroke-width="1.5" stroke-dasharray="8,4" filter="url(#glow2)"/>
  <text x="500" y="162" text-anchor="middle" fill="#00dd88" font-size="13" font-weight="bold" font-family="monospace">N → ∞: General N-tuples</text>
  <text x="500" y="180" text-anchor="middle" fill="#44ffaa" font-size="10" font-family="monospace">Σ xᵢ² = xₙ²</text>
  
  <!-- EML wrapper (outermost) -->
  <rect x="40" y="100" width="920" height="530" rx="20" fill="none" stroke="#00aaff" stroke-width="2" stroke-dasharray="12,6" opacity="0.6"/>
  <text x="500" y="130" text-anchor="middle" fill="#00aaff" font-size="16" font-weight="bold" font-family="monospace" filter="url(#glow2)">
    EML SPACE: All Elementary Functions
  </text>
  <text x="500" y="148" text-anchor="middle" fill="#66ccff" font-size="10" font-family="monospace">
    eml(x,y) = exp(x) - log(y) generates everything
  </text>
  
  <!-- Embedding arrows -->
  <text x="500" y="340" text-anchor="middle" fill="#ffd700" font-size="16">↑ embed via (a,b,0,c)</text>
  <text x="500" y="318" text-anchor="middle" fill="#ffd700" font-size="14">↑ embed via (a,b,c,0,d)</text>
  <text x="500" y="258" text-anchor="middle" fill="#ffd700" font-size="12">↑ insert zeros</text>
  
  <!-- Right side: EML complexity table -->
  <rect x="750" y="440" width="200" height="170" rx="8" fill="none" stroke="#555" stroke-width="1"/>
  <text x="850" y="465" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold" font-family="monospace">EML Complexity</text>
  <text x="850" y="490" text-anchor="middle" fill="#ff4444" font-size="10" font-family="monospace">3-tuple: O(d)</text>
  <text x="850" y="510" text-anchor="middle" fill="#ff8800" font-size="10" font-family="monospace">4-tuple: O(d)</text>
  <text x="850" y="530" text-anchor="middle" fill="#ffcc00" font-size="10" font-family="monospace">5-tuple: O(d)</text>
  <text x="850" y="550" text-anchor="middle" fill="#00dd88" font-size="10" font-family="monospace">N-tuple: O(d·N)</text>
  <line x1="770" y1="565" x2="930" y2="565" stroke="#555" stroke-width="0.5"/>
  <text x="850" y="585" text-anchor="middle" fill="#00aaff" font-size="10" font-family="monospace">d = tree depth</text>
  <text x="850" y="600" text-anchor="middle" fill="#00aaff" font-size="10" font-family="monospace">N = dimension</text>
  
  <!-- Left side: Key properties -->
  <rect x="50" y="440" width="200" height="170" rx="8" fill="none" stroke="#555" stroke-width="1"/>
  <text x="150" y="465" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold" font-family="monospace">Key Properties</text>
  <text x="150" y="490" text-anchor="middle" fill="#ddd" font-size="10" font-family="monospace">• Each level ⊂ next</text>
  <text x="150" y="510" text-anchor="middle" fill="#ddd" font-size="10" font-family="monospace">• Insert 0 to embed</text>
  <text x="150" y="530" text-anchor="middle" fill="#ddd" font-size="10" font-family="monospace">• EML encodes all</text>
  <text x="150" y="550" text-anchor="middle" fill="#ddd" font-size="10" font-family="monospace">• Log-space ↔ EML</text>
  <text x="150" y="570" text-anchor="middle" fill="#ddd" font-size="10" font-family="monospace">• O(d) compression</text>
  <text x="150" y="590" text-anchor="middle" fill="#ddd" font-size="10" font-family="monospace">• Lean 4 verified ✓</text>
  
  <!-- Bottom theorem -->
  <rect x="200" y="640" width="600" height="45" rx="8" fill="none" stroke="#ffd700" stroke-width="1.5" filter="url(#glow2)"/>
  <text x="500" y="662" text-anchor="middle" fill="#ffd700" font-size="11" font-weight="bold" font-family="Georgia">
    Theorem: ∀N≥3, Pythagorean N-tuples ⊂ EML-computable functions
  </text>
  <text x="500" y="678" text-anchor="middle" fill="#aaa" font-size="10" font-family="monospace">
    with tree encoding complexity O(d·N) — formally verified in Lean 4
  </text>
</svg>
