<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2848"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4da6ff"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>

  <text x="400" y="40" text-anchor="middle" fill="#FFD700" font-size="24" font-weight="bold">
    EML Hessian &amp; Riemannian Structure
  </text>

  <!-- Hessian Matrix -->
  <rect x="50" y="70" width="300" height="180" rx="12" fill="#1a2a4a" stroke="#4da6ff" stroke-width="2"/>
  <text x="200" y="100" text-anchor="middle" fill="#4da6ff" font-size="16" font-weight="bold">Hessian Matrix</text>

  <text x="110" y="135" fill="#fff" font-size="18">H = </text>
  <rect x="150" y="115" width="170" height="60" rx="5" fill="none" stroke="#fff" stroke-width="1.5"/>
  <text x="190" y="140" fill="#7f7" font-size="16">eˣ    0</text>
  <text x="190" y="165" fill="#7f7" font-size="16"> 0   1/y²</text>

  <text x="80" y="210" fill="#aab" font-size="12">• det(H) = eˣ/y² &gt; 0 for y &gt; 0</text>
  <text x="80" y="230" fill="#aab" font-size="12">• tr(H) = eˣ + 1/y² &gt; 0</text>
  <text x="80" y="245" fill="#7f7" font-size="11">→ POSITIVE DEFINITE everywhere</text>

  <!-- Metric -->
  <rect x="380" y="70" width="380" height="180" rx="12" fill="#1a2a4a" stroke="#ff9f43" stroke-width="2"/>
  <text x="570" y="100" text-anchor="middle" fill="#ff9f43" font-size="16" font-weight="bold">Riemannian Metric</text>

  <text x="410" y="135" fill="#fff" font-size="16">ds² = eˣ dx² + y⁻² dy²</text>
  <text x="410" y="170" fill="#aab" font-size="12">Gaussian curvature:</text>
  <text x="410" y="190" fill="#fff" font-size="14">K = −(1/2√g)(∂²√g_yy/∂x² + ∂²√g_xx/∂y²)</text>
  <text x="410" y="215" fill="#aab" font-size="12">Volume form: dA = eˣ/² · y⁻¹ dx ∧ dy</text>
  <text x="410" y="240" fill="#7f7" font-size="11">Natural geometry for exp-log optimization</text>

  <!-- Geodesic Illustration -->
  <rect x="50" y="270" width="340" height="300" rx="12" fill="#0d1d0d" stroke="#50c878" stroke-width="2"/>
  <text x="220" y="300" text-anchor="middle" fill="#50c878" font-size="16" font-weight="bold">Geodesics</text>

  <!-- Axes -->
  <line x1="90" y1="530" x2="360" y2="530" stroke="#555" stroke-width="1"/>
  <line x1="90" y1="530" x2="90" y2="320" stroke="#555" stroke-width="1"/>
  <text x="360" y="548" fill="#555" font-size="10">x</text>
  <text x="78" y="325" fill="#555" font-size="10">y</text>

  <!-- Geodesic curves (schematic) -->
  <path d="M 100,520 Q 150,480 200,450 Q 250,420 300,400 Q 330,390 350,385"
        fill="none" stroke="#50c878" stroke-width="2"/>
  <path d="M 100,520 Q 120,460 140,400 Q 160,350 170,330"
        fill="none" stroke="#4da6ff" stroke-width="2"/>
  <path d="M 100,520 Q 180,500 260,470 Q 320,450 350,440"
        fill="none" stroke="#ff6b6b" stroke-width="2"/>

  <text x="110" y="415" fill="#4da6ff" font-size="10">steep (y-dir)</text>
  <text x="260" y="375" fill="#50c878" font-size="10">diagonal</text>
  <text x="280" y="460" fill="#ff6b6b" font-size="10">shallow (x-dir)</text>

  <text x="110" y="565" fill="#888" font-size="10">
    Geodesics curve away from x-axis (eˣ large)
  </text>

  <!-- Applications -->
  <rect x="420" y="270" width="340" height="300" rx="12" fill="#1a0d2d" stroke="#bb86fc" stroke-width="2"/>
  <text x="590" y="300" text-anchor="middle" fill="#bb86fc" font-size="16" font-weight="bold">Applications</text>

  <text x="445" y="335" fill="#dda0dd" font-size="13" font-weight="bold">Natural Gradient Descent</text>
  <text x="445" y="355" fill="#aab" font-size="11">• EML metric as preconditioner</text>
  <text x="445" y="375" fill="#aab" font-size="11">• ∇_nat f = H⁻¹ ∇f</text>
  <text x="445" y="395" fill="#aab" font-size="11">• Adapts step size to curvature</text>

  <text x="445" y="425" fill="#ff9f43" font-size="13" font-weight="bold">Optimal Transport</text>
  <text x="445" y="445" fill="#aab" font-size="11">• Cost c(x,y) = eml(x,y)</text>
  <text x="445" y="465" fill="#aab" font-size="11">• Wasserstein-EML distance</text>
  <text x="445" y="485" fill="#aab" font-size="11">• Connection to KL divergence</text>

  <text x="445" y="515" fill="#4da6ff" font-size="13" font-weight="bold">Information Geometry</text>
  <text x="445" y="535" fill="#aab" font-size="11">• Fisher metric analogue</text>
  <text x="445" y="555" fill="#aab" font-size="11">• Statistical manifold structure</text>

  <text x="400" y="590" text-anchor="middle" fill="#667" font-size="10">
    EML V6 — Hessian analysis formally verified in Lean 4
  </text>
</svg>
