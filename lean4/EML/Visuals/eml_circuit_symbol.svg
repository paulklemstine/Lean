<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; fill: #333; text-anchor: middle; font-weight: bold; }
      .label { font-family: 'Courier New', monospace; font-size: 12px; fill: #333; }
      .label-center { font-family: Arial, sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
      .wire { stroke: #333; stroke-width: 2; fill: none; stroke-linecap: round; }
      .body { fill: white; stroke: #333; stroke-width: 2; }
      .dot { fill: #333; }
      .arrow-head { fill: #333; stroke: #333; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="250" y="25" class="title">EML Circuit Symbol</text>
  
  <!-- Main symbol (large, centered) -->
  <g transform="translate(200, 130)">
    <!-- Circle body -->
    <circle cx="0" cy="0" r="50" class="body"/>
    
    <!-- Input wires -->
    <line x1="-100" y1="-25" x2="-45" y2="-25" class="wire"/>
    <line x1="-100" y1="25" x2="-45" y2="25" class="wire"/>
    
    <!-- Output wire -->
    <line x1="50" y1="0" x2="100" y2="0" class="wire"/>
    
    <!-- Output dot -->
    <circle cx="50" cy="0" r="4" class="dot"/>
    
    <!-- Chirality arrow (arc with arrowhead) -->
    <path d="M -20,40 A 45,45 0 0,1 20,40" class="wire" marker-end="url(#arrowhead)"/>
    
    <!-- Internal label -->
    <text x="0" y="5" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">EML</text>
    
    <!-- Input labels -->
    <text x="-110" y="-22" class="label">x → eˣ</text>
    <text x="-110" y="28" class="label">y → ln(y)</text>
    
    <!-- Output label -->
    <text x="108" y="4" class="label">eˣ - ln(y)</text>
  </g>
  
  <!-- Annotations -->
  <text x="250" y="220" class="label-center">First input (top): exponential pathway</text>
  <text x="250" y="238" class="label-center">Second input (bottom): logarithmic pathway</text>
  <text x="250" y="256" class="label-center">Output (dot): subtraction of the two</text>
  <text x="250" y="274" class="label-center">Arrow: chirality indicator (non-commutative)</text>
</svg>
