<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="bgAr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffd700"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="url(#bgAr)"/>

  <text x="500" y="40" text-anchor="middle" fill="#ffd700" font-size="24" font-weight="bold" font-family="Georgia">
    All of Arithmetic from One Operation
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#888" font-size="14" font-family="sans-serif">
    How eml(x,y) = eˣ − ln(y) constructs every arithmetic operation
  </text>

  <!-- Level 0: EML primitive -->
  <rect x="350" y="90" width="300" height="50" rx="8" fill="#1a1a3e" stroke="#ffd700" stroke-width="2"/>
  <text x="500" y="120" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="bold" font-family="monospace">eml(x, y) = eˣ − ln y</text>

  <!-- Level 1: exp and constants -->
  <line x1="400" y1="140" x2="200" y2="180" stroke="#ffd700" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="140" x2="500" y2="180" stroke="#ffd700" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="140" x2="800" y2="180" stroke="#ffd700" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="100" y="185" width="200" height="45" rx="6" fill="#1a2a1a" stroke="#66ff66" stroke-width="1.5"/>
  <text x="200" y="213" text-anchor="middle" fill="#66ff66" font-size="14" font-family="monospace">exp(x) = eml(x, 1)</text>

  <rect x="370" y="185" width="260" height="45" rx="6" fill="#2a1a1a" stroke="#ff6666" stroke-width="1.5"/>
  <text x="500" y="213" text-anchor="middle" fill="#ff6666" font-size="14" font-family="monospace">e = eml(1, 1) = 2.718...</text>

  <rect x="700" y="185" width="200" height="45" rx="6" fill="#1a1a2a" stroke="#6666ff" stroke-width="1.5"/>
  <text x="800" y="213" text-anchor="middle" fill="#6666ff" font-size="14" font-family="monospace">0 = eml(1, exp(e))</text>

  <!-- Level 2: ln and negation -->
  <line x1="200" y1="230" x2="200" y2="270" stroke="#66ff66" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="230" x2="500" y2="270" stroke="#ff6666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="60" y="275" width="280" height="45" rx="6" fill="#1a2a2a" stroke="#66ffff" stroke-width="1.5"/>
  <text x="200" y="303" text-anchor="middle" fill="#66ffff" font-size="14" font-family="monospace">ln(x) = e − eml(1, x)</text>

  <rect x="360" y="275" width="280" height="45" rx="6" fill="#2a1a2a" stroke="#ff66ff" stroke-width="1.5"/>
  <text x="500" y="303" text-anchor="middle" fill="#ff66ff" font-size="14" font-family="monospace">−x = eml(0, exp(x)) − 1</text>

  <!-- Level 3: Arithmetic operations -->
  <line x1="200" y1="320" x2="150" y2="380" stroke="#66ffff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="320" x2="350" y2="380" stroke="#66ffff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="320" x2="550" y2="380" stroke="#ff66ff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="320" x2="750" y2="380" stroke="#ff66ff" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="30" y="385" width="250" height="45" rx="6" fill="#0d1d0d" stroke="#44dd44" stroke-width="1.5"/>
  <text x="155" y="413" text-anchor="middle" fill="#44dd44" font-size="13" font-family="monospace">a+b = eml(ln a, exp(−b))</text>

  <rect x="290" y="385" width="240" height="45" rx="6" fill="#1d0d0d" stroke="#dd4444" stroke-width="1.5"/>
  <text x="410" y="413" text-anchor="middle" fill="#dd4444" font-size="13" font-family="monospace">a−b = eml(ln a, exp b)</text>

  <rect x="540" y="385" width="200" height="45" rx="6" fill="#0d0d1d" stroke="#4444dd" stroke-width="1.5"/>
  <text x="640" y="413" text-anchor="middle" fill="#4444dd" font-size="13" font-family="monospace">a×b = exp(ln a+ln b)</text>

  <rect x="750" y="385" width="210" height="45" rx="6" fill="#1d1d0d" stroke="#dddd44" stroke-width="1.5"/>
  <text x="855" y="413" text-anchor="middle" fill="#dddd44" font-size="13" font-family="monospace">a÷b = exp(ln a−ln b)</text>

  <!-- Level 4: Higher operations -->
  <line x1="640" y1="430" x2="300" y2="490" stroke="#4444dd" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="430" x2="600" y2="490" stroke="#4444dd" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="855" y1="430" x2="855" y2="490" stroke="#dddd44" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="150" y="495" width="300" height="45" rx="6" fill="#0d1d1d" stroke="#44dddd" stroke-width="1.5"/>
  <text x="300" y="523" text-anchor="middle" fill="#44dddd" font-size="13" font-family="monospace">aᵇ = exp(b · ln a)</text>

  <rect x="480" y="495" width="250" height="45" rx="6" fill="#1d0d1d" stroke="#dd44dd" stroke-width="1.5"/>
  <text x="605" y="523" text-anchor="middle" fill="#dd44dd" font-size="13" font-family="monospace">√a = exp(½ · ln a)</text>

  <rect x="760" y="495" width="200" height="45" rx="6" fill="#1d1d1d" stroke="#aaaaaa" stroke-width="1.5"/>
  <text x="860" y="523" text-anchor="middle" fill="#aaaaaa" font-size="13" font-family="monospace">1/x = exp(−ln x)</text>

  <!-- Level 5: Transcendental -->
  <rect x="200" y="580" width="600" height="50" rx="8" fill="#0a0a2e" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="500" y="608" text-anchor="middle" fill="#ffd700" font-size="15" font-family="sans-serif">
    sin, cos, tan, arcsin, ... via exp(ix) and complex EML trees
  </text>

  <!-- Footer -->
  <text x="500" y="670" text-anchor="middle" fill="#666" font-size="12" font-family="sans-serif">
    All operations are formally verified in Lean 4 (0 sorry's) • Each box shows the minimal EML construction
  </text>
</svg>
