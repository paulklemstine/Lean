<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bgMagma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bgMagma)"/>

  <text x="450" y="35" text-anchor="middle" fill="#ffd700" font-size="22" font-weight="bold" font-family="Georgia">
    The EML Magma: Algebraic Structure
  </text>
  <text x="450" y="58" text-anchor="middle" fill="#999" font-size="13" font-family="sans-serif">
    (ℝ, eml) forms a non-commutative, non-associative magma with no identity — All proved in Lean 4
  </text>

  <!-- Property boxes -->
  <!-- Not commutative -->
  <rect x="30" y="85" width="260" height="120" rx="10" fill="#1a0a0a" stroke="#ff4444" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" fill="#ff4444" font-size="16" font-weight="bold" font-family="sans-serif">✗ Not Commutative</text>
  <text x="160" y="135" text-anchor="middle" fill="#cc8888" font-size="12" font-family="monospace">eml(0, 1) = 1</text>
  <text x="160" y="155" text-anchor="middle" fill="#cc8888" font-size="12" font-family="monospace">eml(1, 0) = undefined</text>
  <text x="160" y="180" text-anchor="middle" fill="#999" font-size="11" font-family="sans-serif">eml(x,y) ≠ eml(y,x) in general</text>
  <text x="160" y="198" text-anchor="middle" fill="#66ff66" font-size="11" font-weight="bold">✓ Proved: eml_not_comm</text>

  <!-- Not associative -->
  <rect x="320" y="85" width="260" height="120" rx="10" fill="#0a0a1a" stroke="#4444ff" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" fill="#4444ff" font-size="16" font-weight="bold" font-family="sans-serif">✗ Not Associative</text>
  <text x="450" y="135" text-anchor="middle" fill="#8888cc" font-size="12" font-family="monospace">eml(eml(0,1),1) = e</text>
  <text x="450" y="155" text-anchor="middle" fill="#8888cc" font-size="12" font-family="monospace">eml(0,eml(1,1)) = 0</text>
  <text x="450" y="180" text-anchor="middle" fill="#999" font-size="11" font-family="sans-serif">e ≠ 0</text>
  <text x="450" y="198" text-anchor="middle" fill="#66ff66" font-size="11" font-weight="bold">✓ Proved: eml_not_assoc</text>

  <!-- No identity -->
  <rect x="610" y="85" width="260" height="120" rx="10" fill="#0a1a0a" stroke="#44ff44" stroke-width="2"/>
  <text x="740" y="110" text-anchor="middle" fill="#44ff44" font-size="16" font-weight="bold" font-family="sans-serif">✗ No Identity</text>
  <text x="740" y="135" text-anchor="middle" fill="#88cc88" font-size="12" font-family="monospace">No e_L: eml(e_L,y)=y ∀y</text>
  <text x="740" y="155" text-anchor="middle" fill="#88cc88" font-size="12" font-family="monospace">No e_R: eml(x,e_R)=x ∀x</text>
  <text x="740" y="180" text-anchor="middle" fill="#999" font-size="11" font-family="sans-serif">Not a monoid, not a group</text>
  <text x="740" y="198" text-anchor="middle" fill="#66ff66" font-size="11" font-weight="bold">✓ Proved: no_left/right_identity</text>

  <!-- Algebraic hierarchy -->
  <rect x="100" y="240" width="700" height="230" rx="12" fill="#0d0d2d" stroke="#ffd700" stroke-width="1.5"/>
  <text x="450" y="270" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold" font-family="sans-serif">
    Position in the Algebraic Hierarchy
  </text>

  <!-- Hierarchy diagram -->
  <rect x="350" y="290" width="200" height="30" rx="5" fill="#4a1a1a" stroke="#ff6666" stroke-width="1.5"/>
  <text x="450" y="310" text-anchor="middle" fill="#ff6666" font-size="13" font-weight="bold">Magma (set + op)</text>

  <line x1="450" y1="320" x2="450" y2="340" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="335" fill="#888" font-size="10">+ assoc</text>

  <rect x="350" y="340" width="200" height="30" rx="5" fill="#1a1a3a" stroke="#666" stroke-width="1"/>
  <text x="450" y="360" text-anchor="middle" fill="#888" font-size="13">Semigroup</text>
  <text x="560" y="360" fill="#ff4444" font-size="11">✗ EML fails</text>

  <line x1="450" y1="370" x2="450" y2="390" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="385" fill="#888" font-size="10">+ identity</text>

  <rect x="350" y="390" width="200" height="30" rx="5" fill="#1a1a3a" stroke="#666" stroke-width="1"/>
  <text x="450" y="410" text-anchor="middle" fill="#888" font-size="13">Monoid</text>
  <text x="560" y="410" fill="#ff4444" font-size="11">✗ EML fails</text>

  <line x1="450" y1="420" x2="450" y2="440" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="435" fill="#888" font-size="10">+ inverse</text>

  <rect x="350" y="440" width="200" height="25" rx="5" fill="#1a1a3a" stroke="#666" stroke-width="1"/>
  <text x="450" y="457" text-anchor="middle" fill="#888" font-size="13">Group</text>
  <text x="560" y="457" fill="#ff4444" font-size="11">✗ EML fails</text>

  <!-- EML indicator -->
  <line x1="310" y1="305" x2="350" y2="305" stroke="#ffd700" stroke-width="2"/>
  <text x="300" y="310" text-anchor="end" fill="#ffd700" font-size="12" font-weight="bold">EML ←</text>

  <!-- Additional note -->
  <text x="180" y="310" fill="#aaa" font-size="11" font-family="sans-serif">EML is a "bare" magma:</text>
  <text x="180" y="330" fill="#aaa" font-size="11" font-family="sans-serif">no algebraic axioms</text>
  <text x="180" y="350" fill="#aaa" font-size="11" font-family="sans-serif">beyond closure.</text>
  <text x="180" y="380" fill="#aaa" font-size="11" font-family="sans-serif">Yet it generates ALL</text>
  <text x="180" y="400" fill="#aaa" font-size="11" font-family="sans-serif">elementary functions!</text>

  <text x="450" y="490" text-anchor="middle" fill="#666" font-size="10" font-family="sans-serif">
    The paradox: the weakest algebraic structure produces the richest function space
  </text>
</svg>
