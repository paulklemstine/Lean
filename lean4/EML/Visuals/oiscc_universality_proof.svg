<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>

  <rect width="1000" height="650" fill="url(#bgG)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#212529" font-size="22" font-weight="bold">
    OISCC Universality: The Arithmetic Reduction Tower
  </text>
  <text x="500" y="55" text-anchor="middle" fill="#6c757d" font-size="13">
    How one instruction builds all of arithmetic — each level machine-verified in Lean 4
  </text>

  <!-- Level 0: The Primitive -->
  <g transform="translate(350, 75)">
    <rect x="0" y="0" width="300" height="55" rx="10" fill="#dc3545" stroke="#a71d2a" stroke-width="2"/>
    <text x="150" y="22" text-anchor="middle" fill="white" font-size="11" font-weight="bold">LEVEL 0 — THE PRIMITIVE</text>
    <text x="150" y="42" text-anchor="middle" fill="white" font-size="16" font-weight="bold">EML(a, b) = eᵃ − ln(b)</text>
  </g>

  <!-- Arrows down -->
  <line x1="430" y1="130" x2="230" y2="165" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="130" x2="500" y2="165" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="130" x2="770" y2="165" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Level 1: Core Functions -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="280" height="70" rx="8" fill="#fd7e14" stroke="#e8590c" stroke-width="1.5"/>
    <text x="140" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">LEVEL 1 — EXPONENTIAL</text>
    <text x="140" y="38" text-anchor="middle" fill="white" font-size="14" font-weight="bold">exp(x) = EML(x, 1)</text>
    <text x="140" y="55" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">3 instructions • Lean: eml_recovers_exp ✓</text>
  </g>

  <g transform="translate(360, 170)">
    <rect x="0" y="0" width="280" height="70" rx="8" fill="#fd7e14" stroke="#e8590c" stroke-width="1.5"/>
    <text x="140" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">LEVEL 1 — ONE-MINUS-LOG</text>
    <text x="140" y="38" text-anchor="middle" fill="white" font-size="14" font-weight="bold">1−ln(b) = EML(0, b)</text>
    <text x="140" y="55" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">3 instructions • Lean: eml_one_minus_log ✓</text>
  </g>

  <g transform="translate(690, 170)">
    <rect x="0" y="0" width="280" height="70" rx="8" fill="#fd7e14" stroke="#e8590c" stroke-width="1.5"/>
    <text x="140" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">LEVEL 1 — CONSTANTS</text>
    <text x="140" y="38" text-anchor="middle" fill="white" font-size="14" font-weight="bold">e = EML(1,1) • 0 = EML(0,e)</text>
    <text x="140" y="55" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">Lean: oiscc_constant_e, oiscc_constant_zero ✓</text>
  </g>

  <!-- Arrows to Level 2 -->
  <line x1="170" y1="240" x2="170" y2="275" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="240" x2="350" y2="275" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Level 2: Logarithm -->
  <g transform="translate(70, 280)">
    <rect x="0" y="0" width="400" height="65" rx="8" fill="#ffc107" stroke="#e0a800" stroke-width="1.5"/>
    <text x="200" y="18" text-anchor="middle" fill="#212529" font-size="10" font-weight="bold">LEVEL 2 — NATURAL LOGARITHM (depth 3 composition)</text>
    <text x="200" y="38" text-anchor="middle" fill="#212529" font-size="14" font-weight="bold">ln(b) = EML(0, exp(EML(0, b)))</text>
    <text x="200" y="55" text-anchor="middle" fill="#495057" font-size="10">7 instructions • Lean: eml_recovers_ln ✓</text>
  </g>

  <!-- Level 2: Negation -->
  <g transform="translate(530, 280)">
    <rect x="0" y="0" width="400" height="65" rx="8" fill="#ffc107" stroke="#e0a800" stroke-width="1.5"/>
    <text x="200" y="18" text-anchor="middle" fill="#212529" font-size="10" font-weight="bold">LEVEL 2 — NEGATION / COMPLEMENT</text>
    <text x="200" y="38" text-anchor="middle" fill="#212529" font-size="14" font-weight="bold">1 − a = EML(0, exp(a))</text>
    <text x="200" y="55" text-anchor="middle" fill="#495057" font-size="10">3 instructions • Lean: eml_one_minus ✓</text>
  </g>

  <!-- Arrow to Level 3 -->
  <line x1="270" y1="345" x2="270" y2="380" stroke="#dc3545" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="285" y="370" fill="#dc3545" font-size="10" font-weight="bold">KEY STEP</text>

  <!-- Level 3: Subtraction — THE KEY -->
  <g transform="translate(80, 385)">
    <rect x="0" y="0" width="500" height="70" rx="10" fill="#28a745" stroke="#1e7e34" stroke-width="3"/>
    <text x="250" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">⭐ LEVEL 3 — SUBTRACTION (The Breakthrough Identity)</text>
    <text x="250" y="42" text-anchor="middle" fill="white" font-size="18" font-weight="bold">a − b = EML(ln(a), exp(b))</text>
    <text x="250" y="60" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">11 instructions • Lean: eml_recovers_sub ✓ • Unlocks ALL arithmetic!</text>
  </g>

  <!-- Level 3: Addition -->
  <g transform="translate(620, 385)">
    <rect x="0" y="0" width="340" height="70" rx="8" fill="#20c997" stroke="#13795b" stroke-width="1.5"/>
    <text x="170" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">LEVEL 3 — ADDITION</text>
    <text x="170" y="42" text-anchor="middle" fill="white" font-size="16" font-weight="bold">a + b = EML(ln(a), exp(−b))</text>
    <text x="170" y="60" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="10">11 instructions • Lean: eml_recovers_add ✓</text>
  </g>

  <!-- Arrows to Level 4 -->
  <line x1="280" y1="455" x2="200" y2="490" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="455" x2="480" y2="490" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="330" y1="455" x2="750" y2="490" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Level 4: Multiplication, Division, Powers -->
  <g transform="translate(30, 495)">
    <rect x="0" y="0" width="280" height="60" rx="8" fill="#6f42c1" stroke="#59359a" stroke-width="1.5"/>
    <text x="140" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">LEVEL 4 — MULTIPLICATION</text>
    <text x="140" y="38" text-anchor="middle" fill="white" font-size="13" font-weight="bold">a×b = EML(ln a+ln b, 1)</text>
    <text x="140" y="53" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Lean: eml_mul_final ✓</text>
  </g>

  <g transform="translate(360, 495)">
    <rect x="0" y="0" width="280" height="60" rx="8" fill="#6f42c1" stroke="#59359a" stroke-width="1.5"/>
    <text x="140" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">LEVEL 4 — DIVISION</text>
    <text x="140" y="38" text-anchor="middle" fill="white" font-size="13" font-weight="bold">a/b = EML(ln a−ln b, 1)</text>
    <text x="140" y="53" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Lean: eml_div_final ✓</text>
  </g>

  <g transform="translate(690, 495)">
    <rect x="0" y="0" width="280" height="60" rx="8" fill="#6f42c1" stroke="#59359a" stroke-width="1.5"/>
    <text x="140" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">LEVEL 4 — POWERS</text>
    <text x="140" y="38" text-anchor="middle" fill="white" font-size="13" font-weight="bold">aᵇ = EML(b·ln a, 1)</text>
    <text x="140" y="53" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Lean: rpow_via_eml ✓</text>
  </g>

  <!-- Final summary arrow -->
  <line x1="500" y1="560" x2="500" y2="590" stroke="#28a745" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Completeness box -->
  <g transform="translate(150, 595)">
    <rect x="0" y="0" width="700" height="40" rx="8" fill="#212529" stroke="#28a745" stroke-width="2"/>
    <text x="350" y="25" text-anchor="middle" fill="#28a745" font-size="15" font-weight="bold">
      ✅ ARITHMETIC COMPLETENESS — 23 theorems, 0 sorry's — Lean 4 verified
    </text>
  </g>
</svg>
