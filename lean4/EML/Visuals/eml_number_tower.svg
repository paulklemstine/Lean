<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00CED1"/>
      <stop offset="100%" stop-color="#00BFFF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#32CD32"/>
      <stop offset="100%" stop-color="#00FF7F"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6347"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="url(#gold)" font-size="24" font-weight="bold" filter="url(#glow)">
    The EML Number Tower
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#aaa" font-size="13">
    Constants generated from eml(x,y) = eˣ − ln(y) and the constant 1
  </text>

  <!-- Level 0 -->
  <rect x="370" y="520" width="160" height="50" rx="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <text x="450" y="540" text-anchor="middle" fill="url(#gold)" font-size="14" font-weight="bold">Level 0</text>
  <text x="450" y="558" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">1</text>

  <!-- Arrow Level 0 → Level 1 -->
  <line x1="450" y1="520" x2="450" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="470" y="505" fill="#888" font-size="10">eml(1,1)</text>

  <!-- Level 1 -->
  <rect x="370" y="420" width="160" height="50" rx="10" fill="none" stroke="url(#cyan)" stroke-width="2"/>
  <text x="450" y="440" text-anchor="middle" fill="url(#cyan)" font-size="14" font-weight="bold">Level 1</text>
  <text x="450" y="458" text-anchor="middle" fill="#fff" font-size="14">e ≈ 2.718</text>

  <!-- Arrows Level 1 → Level 2 -->
  <line x1="400" y1="420" x2="200" y2="370" stroke="#555" stroke-width="1"/>
  <line x1="450" y1="420" x2="450" y2="370" stroke="#555" stroke-width="1"/>
  <line x1="500" y1="420" x2="700" y2="370" stroke="#555" stroke-width="1"/>

  <!-- Level 2 - three values -->
  <rect x="100" y="310" width="200" height="50" rx="10" fill="none" stroke="url(#green)" stroke-width="2"/>
  <text x="200" y="328" text-anchor="middle" fill="url(#green)" font-size="12" font-weight="bold">eml(e, 1)</text>
  <text x="200" y="348" text-anchor="middle" fill="#fff" font-size="14">e^e ≈ 15.154</text>

  <rect x="350" y="310" width="200" height="50" rx="10" fill="none" stroke="url(#green)" stroke-width="2"/>
  <text x="450" y="328" text-anchor="middle" fill="url(#green)" font-size="12" font-weight="bold">eml(1, e)</text>
  <text x="450" y="348" text-anchor="middle" fill="#fff" font-size="14">e − 1 ≈ 1.718</text>

  <rect x="600" y="310" width="200" height="50" rx="10" fill="none" stroke="url(#green)" stroke-width="2"/>
  <text x="700" y="328" text-anchor="middle" fill="url(#green)" font-size="12" font-weight="bold">eml(e, e)</text>
  <text x="700" y="348" text-anchor="middle" fill="#fff" font-size="14">e^e − 1 ≈ 14.154</text>

  <!-- Level 2 label -->
  <text x="30" y="340" fill="url(#green)" font-size="14" font-weight="bold">Level 2</text>

  <!-- Arrows to Level 3 -->
  <line x1="200" y1="310" x2="150" y2="260" stroke="#555" stroke-width="1"/>
  <line x1="200" y1="310" x2="350" y2="260" stroke="#555" stroke-width="1"/>

  <!-- Level 3 - key values -->
  <rect x="50" y="200" width="200" height="50" rx="10" fill="none" stroke="url(#red)" stroke-width="2"/>
  <text x="150" y="218" text-anchor="middle" fill="url(#red)" font-size="12" font-weight="bold">eml(e^e, 1)</text>
  <text x="150" y="238" text-anchor="middle" fill="#fff" font-size="13">e^(e^e) ≈ 3.8×10⁶</text>

  <!-- THE ZERO - highlighted! -->
  <rect x="300" y="190" width="300" height="70" rx="15" fill="rgba(255,215,0,0.1)" stroke="url(#gold)" stroke-width="3"/>
  <text x="450" y="215" text-anchor="middle" fill="url(#gold)" font-size="16" font-weight="bold" filter="url(#glow)">
    ★ ZERO DISCOVERED ★
  </text>
  <text x="450" y="238" text-anchor="middle" fill="#fff" font-size="13">eml(1, e^e) = e − ln(e^e) = e − e = 0</text>
  <text x="450" y="252" text-anchor="middle" fill="#aaa" font-size="11">= eml(1, eml(eml(1,1), 1))</text>

  <rect x="650" y="200" width="200" height="50" rx="10" fill="none" stroke="url(#red)" stroke-width="2"/>
  <text x="750" y="218" text-anchor="middle" fill="url(#red)" font-size="12" font-weight="bold">eml(1, e^e−1)</text>
  <text x="750" y="238" text-anchor="middle" fill="#fff" font-size="13">e − ln(e^e−1)</text>

  <!-- Level 3 label -->
  <text x="30" y="230" fill="url(#red)" font-size="14" font-weight="bold">Level 3</text>

  <!-- Legend / Key insight -->
  <rect x="100" y="90" width="700" height="80" rx="10" fill="rgba(255,255,255,0.05)" stroke="#444" stroke-width="1"/>
  <text x="450" y="115" text-anchor="middle" fill="#ccc" font-size="13" font-weight="bold">
    Key Insight: The EML operator generates 0 at depth 3
  </text>
  <text x="450" y="135" text-anchor="middle" fill="#999" font-size="12">
    Once 0 is available, all integers become reachable (via exp/log arithmetic).
  </text>
  <text x="450" y="155" text-anchor="middle" fill="#999" font-size="12">
    The EML complexity of 0 is K_EML(0) = 7 (tree has 7 leaves, 6 EML nodes).
  </text>

  <!-- Stats bar -->
  <rect x="0" y="600" width="900" height="50" fill="rgba(0,0,0,0.3)"/>
  <text x="150" y="625" text-anchor="middle" fill="#888" font-size="11">
    Level 0: 1 constant
  </text>
  <text x="350" y="625" text-anchor="middle" fill="#888" font-size="11">
    Level 1: 1 new constant
  </text>
  <text x="550" y="625" text-anchor="middle" fill="#888" font-size="11">
    Level 2: 3 new constants
  </text>
  <text x="750" y="625" text-anchor="middle" fill="#888" font-size="11">
    Level 3: 11+ new constants
  </text>
</svg>
