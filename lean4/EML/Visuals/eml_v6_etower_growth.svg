<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0a2818"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <text x="400" y="35" text-anchor="middle" fill="#FFD700" font-size="22" font-weight="bold">
    e-Tower Growth: e↑↑n vs Other Functions
  </text>
  <text x="400" y="58" text-anchor="middle" fill="#aab" font-size="13">
    Formally proved: e↑↑n ≥ 2ⁿ, e↑↑n ≥ eⁿ, e↑↑n dominates all polynomials
  </text>

  <!-- Data table -->
  <rect x="50" y="80" width="700" height="200" rx="10" fill="#0d1d2d" stroke="#4da6ff" stroke-width="1.5"/>

  <!-- Headers -->
  <text x="90" y="105" fill="#FFD700" font-size="13" font-weight="bold">n</text>
  <text x="155" y="105" fill="#FFD700" font-size="13" font-weight="bold">e↑↑n</text>
  <text x="315" y="105" fill="#FFD700" font-size="13" font-weight="bold">2ⁿ</text>
  <text x="405" y="105" fill="#FFD700" font-size="13" font-weight="bold">eⁿ</text>
  <text x="515" y="105" fill="#FFD700" font-size="13" font-weight="bold">n!</text>
  <text x="605" y="105" fill="#FFD700" font-size="13" font-weight="bold">Ratio e↑↑n/2ⁿ</text>

  <line x1="70" y1="112" x2="730" y2="112" stroke="#333" stroke-width="1"/>

  <!-- n=0 -->
  <text x="90" y="132" fill="#fff" font-size="12">0</text>
  <text x="155" y="132" fill="#50c878" font-size="12">1</text>
  <text x="315" y="132" fill="#4da6ff" font-size="12">1</text>
  <text x="405" y="132" fill="#ff9f43" font-size="12">1</text>
  <text x="515" y="132" fill="#dda0dd" font-size="12">1</text>
  <text x="625" y="132" fill="#fff" font-size="12">1.0</text>

  <!-- n=1 -->
  <text x="90" y="152" fill="#fff" font-size="12">1</text>
  <text x="155" y="152" fill="#50c878" font-size="12">e ≈ 2.718</text>
  <text x="315" y="152" fill="#4da6ff" font-size="12">2</text>
  <text x="405" y="152" fill="#ff9f43" font-size="12">2.718</text>
  <text x="515" y="152" fill="#dda0dd" font-size="12">1</text>
  <text x="625" y="152" fill="#fff" font-size="12">1.36</text>

  <!-- n=2 -->
  <text x="90" y="172" fill="#fff" font-size="12">2</text>
  <text x="155" y="172" fill="#50c878" font-size="12">eᵉ ≈ 15.15</text>
  <text x="315" y="172" fill="#4da6ff" font-size="12">4</text>
  <text x="405" y="172" fill="#ff9f43" font-size="12">7.389</text>
  <text x="515" y="172" fill="#dda0dd" font-size="12">2</text>
  <text x="625" y="172" fill="#fff" font-size="12">3.79</text>

  <!-- n=3 -->
  <text x="90" y="192" fill="#fff" font-size="12">3</text>
  <text x="155" y="192" fill="#50c878" font-size="12" font-weight="bold">e^(eᵉ) ≈ 3.8×10⁶</text>
  <text x="315" y="192" fill="#4da6ff" font-size="12">8</text>
  <text x="405" y="192" fill="#ff9f43" font-size="12">20.09</text>
  <text x="515" y="192" fill="#dda0dd" font-size="12">6</text>
  <text x="625" y="192" fill="#fff" font-size="12">4.7×10⁵</text>

  <!-- n=4 -->
  <text x="90" y="212" fill="#fff" font-size="12">4</text>
  <text x="155" y="212" fill="#50c878" font-size="12" font-weight="bold">≈ 10^(1.66×10⁶)</text>
  <text x="315" y="212" fill="#4da6ff" font-size="12">16</text>
  <text x="405" y="212" fill="#ff9f43" font-size="12">54.60</text>
  <text x="515" y="212" fill="#dda0dd" font-size="12">24</text>
  <text x="625" y="212" fill="#fff" font-size="12">≫ 10⁶⁰⁰⁰⁰⁰</text>

  <!-- n=5 -->
  <text x="90" y="232" fill="#fff" font-size="12">5</text>
  <text x="155" y="232" fill="#50c878" font-size="12" font-weight="bold">Incomprehensibly large</text>
  <text x="315" y="232" fill="#4da6ff" font-size="12">32</text>
  <text x="405" y="232" fill="#ff9f43" font-size="12">148.4</text>
  <text x="515" y="232" fill="#dda0dd" font-size="12">120</text>
  <text x="625" y="232" fill="#fff" font-size="12">∞</text>

  <!-- Growth hierarchy -->
  <rect x="50" y="300" width="700" height="170" rx="10" fill="#0d2d0d" stroke="#50c878" stroke-width="1.5"/>
  <text x="400" y="330" text-anchor="middle" fill="#50c878" font-size="16" font-weight="bold">
    Growth Hierarchy (Formally Proved in Lean 4)
  </text>

  <!-- Arrow chain -->
  <text x="100" y="370" fill="#4da6ff" font-size="16">nᵏ</text>
  <text x="145" y="370" fill="#777" font-size="20">≪</text>
  <text x="180" y="370" fill="#ff9f43" font-size="16">eⁿ</text>
  <text x="225" y="370" fill="#777" font-size="20">≤</text>
  <text x="260" y="370" fill="#dda0dd" font-size="16">2ⁿ·eⁿ</text>
  <text x="345" y="370" fill="#777" font-size="20">≤</text>
  <text x="380" y="370" fill="#50c878" font-size="18" font-weight="bold">e↑↑n</text>

  <text x="100" y="405" fill="#aab" font-size="12">✓ eTower6_dominates_poly: ∀k, e↑↑n &gt; nᵏ eventually</text>
  <text x="100" y="425" fill="#aab" font-size="12">✓ eTower6_ge_pow2: e↑↑n ≥ 2ⁿ for all n (NEW V6)</text>
  <text x="100" y="445" fill="#aab" font-size="12">✓ eTower6_growth: e↑↑(n+1) ≥ e · e↑↑n (superexponential)</text>
  <text x="100" y="465" fill="#aab" font-size="12">✓ eTower6_unbounded: ∀M, ∃n, e↑↑n &gt; M</text>

  <text x="400" y="495" text-anchor="middle" fill="#667" font-size="10">
    All bounds machine-verified in Lean 4 with Mathlib
  </text>
</svg>
