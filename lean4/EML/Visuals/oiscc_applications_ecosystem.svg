<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="g2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#58a6ff" font-size="26" font-weight="bold">
    OISCC Application Ecosystem
  </text>
  <text x="600" y="65" text-anchor="middle" fill="#8b949e" font-size="14">
    One Instruction → Infinite Applications
  </text>

  <!-- Central EML -->
  <circle cx="600" cy="400" r="50" fill="#1f6feb" stroke="#58a6ff" stroke-width="3"/>
  <text x="600" y="395" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">EML</text>
  <text x="600" y="415" text-anchor="middle" fill="#c9d1d9" font-size="10">e^a − ln(b)</text>

  <!-- Category: AI / ML (top-left) -->
  <g transform="translate(150,150)">
    <rect width="240" height="160" rx="12" fill="#1a2332" stroke="#f78166" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" fill="#f78166" font-size="15" font-weight="bold">🧠 AI / Machine Learning</text>
    <text x="15" y="50" fill="#c9d1d9" font-size="11">• Sigmoid activation: 15 EML ops</text>
    <text x="15" y="70" fill="#c9d1d9" font-size="11">• Softmax layer: 20 EML ops/neuron</text>
    <text x="15" y="90" fill="#c9d1d9" font-size="11">• XOR network: 89 EML ops total</text>
    <text x="15" y="110" fill="#c9d1d9" font-size="11">• MNIST inference: ~50K EML ops</text>
    <text x="15" y="135" fill="#8b949e" font-size="10">Power: &lt;1mW for 100-neuron net</text>
    <text x="15" y="150" fill="#f78166" font-size="10" font-weight="bold">TinyML on 300 transistors</text>
  </g>
  <line x1="390" y1="230" x2="550" y2="380" stroke="#f78166" stroke-width="1.5" opacity="0.5"/>

  <!-- Category: Signal Processing (top-right) -->
  <g transform="translate(810,150)">
    <rect width="240" height="160" rx="12" fill="#1a2332" stroke="#7ee787" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" fill="#7ee787" font-size="15" font-weight="bold">📡 Signal Processing</text>
    <text x="15" y="50" fill="#c9d1d9" font-size="11">• FM demodulation: &lt;50µW</text>
    <text x="15" y="70" fill="#c9d1d9" font-size="11">• Morlet wavelet transform</text>
    <text x="15" y="90" fill="#c9d1d9" font-size="11">• Goertzel spectral analysis</text>
    <text x="15" y="110" fill="#c9d1d9" font-size="11">• Low-pass EMA filtering</text>
    <text x="15" y="135" fill="#8b949e" font-size="10">20K samples/sec at 1 MHz</text>
    <text x="15" y="150" fill="#7ee787" font-size="10" font-weight="bold">Software-defined radio</text>
  </g>
  <line x1="810" y1="230" x2="650" y2="380" stroke="#7ee787" stroke-width="1.5" opacity="0.5"/>

  <!-- Category: Sensor Fusion (left) -->
  <g transform="translate(50,370)">
    <rect width="220" height="140" rx="12" fill="#1a2332" stroke="#d2a8ff" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" fill="#d2a8ff" font-size="15" font-weight="bold">🎯 Sensor Fusion</text>
    <text x="15" y="50" fill="#c9d1d9" font-size="11">• Scalar Kalman filter</text>
    <text x="15" y="70" fill="#c9d1d9" font-size="11">• 113 EML ops/step</text>
    <text x="15" y="90" fill="#c9d1d9" font-size="11">• GPS + IMU fusion</text>
    <text x="15" y="115" fill="#8b949e" font-size="10">8,850 updates/sec at 1 MHz</text>
    <text x="15" y="130" fill="#d2a8ff" font-size="10" font-weight="bold">Implantable devices</text>
  </g>
  <line x1="270" y1="440" x2="550" y2="400" stroke="#d2a8ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Category: Cryptography (right) -->
  <g transform="translate(930,370)">
    <rect width="220" height="140" rx="12" fill="#1a2332" stroke="#ff7b72" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" fill="#ff7b72" font-size="15" font-weight="bold">🔐 Cryptography</text>
    <text x="15" y="50" fill="#c9d1d9" font-size="11">• EML hash function</text>
    <text x="15" y="70" fill="#c9d1d9" font-size="11">• One-way via exp towers</text>
    <text x="15" y="90" fill="#c9d1d9" font-size="11">• 160 EML ops/hash</text>
    <text x="15" y="115" fill="#8b949e" font-size="10">62.5K hashes/sec at 10 MHz</text>
    <text x="15" y="130" fill="#ff7b72" font-size="10" font-weight="bold">Lightweight IoT security</text>
  </g>
  <line x1="930" y1="440" x2="650" y2="400" stroke="#ff7b72" stroke-width="1.5" opacity="0.5"/>

  <!-- Category: ODE Solvers (bottom-left) -->
  <g transform="translate(150,580)">
    <rect width="240" height="140" rx="12" fill="#1a2332" stroke="#ffa657" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" fill="#ffa657" font-size="15" font-weight="bold">📐 Differential Equations</text>
    <text x="15" y="50" fill="#c9d1d9" font-size="11">• Euler method: 30 EML/step</text>
    <text x="15" y="70" fill="#c9d1d9" font-size="11">• RK4: 120 EML/step</text>
    <text x="15" y="90" fill="#c9d1d9" font-size="11">• y'=y exact: 3 EML ops (∞ order)</text>
    <text x="15" y="115" fill="#8b949e" font-size="10">Native transcendental accuracy</text>
    <text x="15" y="130" fill="#ffa657" font-size="10" font-weight="bold">Control systems + physics</text>
  </g>
  <line x1="390" y1="620" x2="560" y2="440" stroke="#ffa657" stroke-width="1.5" opacity="0.5"/>

  <!-- Category: Neuromorphic (bottom-right) -->
  <g transform="translate(810,580)">
    <rect width="240" height="140" rx="12" fill="#1a2332" stroke="#79c0ff" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" fill="#79c0ff" font-size="15" font-weight="bold">🧬 Neuromorphic</text>
    <text x="15" y="50" fill="#c9d1d9" font-size="11">• exp = presynaptic calcium</text>
    <text x="15" y="70" fill="#c9d1d9" font-size="11">• ln = Weber-Fechner response</text>
    <text x="15" y="90" fill="#c9d1d9" font-size="11">• Each EML = silicon neuron</text>
    <text x="15" y="115" fill="#8b949e" font-size="10">Analog: &lt;100µW, &gt;10 MHz</text>
    <text x="15" y="130" fill="#79c0ff" font-size="10" font-weight="bold">Brain-inspired computing</text>
  </g>
  <line x1="810" y1="620" x2="640" y2="440" stroke="#79c0ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Hardware Pathway -->
  <g transform="translate(430,730)">
    <rect width="340" height="55" rx="8" fill="#21262d" stroke="#484f58" stroke-width="1"/>
    <text x="170" y="20" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Hardware Pathway</text>
    <text x="20" y="40" fill="#8b949e" font-size="11">FPGA (now) → Analog IC (1yr) → ASIC (3yr) → Quantum (5yr)</text>
  </g>
</svg>
