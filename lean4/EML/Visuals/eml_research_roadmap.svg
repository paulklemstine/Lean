<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="url(#gold)" font-size="28" font-weight="bold" filter="url(#glow)">
    OISCC Research Roadmap
  </text>
  <text x="600" y="75" text-anchor="middle" fill="#aaa" font-size="14">
    The One Instruction Set Continuous Computer — 35 Research Directions
  </text>

  <!-- Central EML equation -->
  <circle cx="600" cy="300" r="80" fill="none" stroke="#ffd700" stroke-width="3" filter="url(#glow)"/>
  <text x="600" y="290" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">EML(a,b)</text>
  <text x="600" y="315" text-anchor="middle" fill="#ffd700" font-size="16">= eᵃ − ln(b)</text>

  <!-- Branch 1: Theory (top-left) -->
  <line x1="535" y1="250" x2="200" y2="130" stroke="#4ecdc4" stroke-width="2" opacity="0.7"/>
  <rect x="80" y="95" width="240" height="130" rx="10" fill="#1a3a3a" stroke="#4ecdc4" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="120" text-anchor="middle" fill="#4ecdc4" font-size="16" font-weight="bold">I. Theory</text>
  <text x="200" y="142" text-anchor="middle" fill="#ccc" font-size="11">• Optimal instruction counts</text>
  <text x="200" y="158" text-anchor="middle" fill="#ccc" font-size="11">• Stack depth tradeoffs</text>
  <text x="200" y="174" text-anchor="middle" fill="#ccc" font-size="11">• EML complexity classes</text>
  <text x="200" y="190" text-anchor="middle" fill="#ccc" font-size="11">• Constant complexity K_EML(π)</text>
  <text x="200" y="206" text-anchor="middle" fill="#ccc" font-size="11">• Algebraic monoid structure</text>

  <!-- Branch 2: Hardware (top-right) -->
  <line x1="665" y1="250" x2="1000" y2="130" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
  <rect x="880" y="95" width="240" height="130" rx="10" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="120" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="bold">II. Hardware</text>
  <text x="1000" y="142" text-anchor="middle" fill="#ccc" font-size="11">• Analog BJT circuit (&lt;100 transistors)</text>
  <text x="1000" y="158" text-anchor="middle" fill="#ccc" font-size="11">• Digital CORDIC EML unit</text>
  <text x="1000" y="174" text-anchor="middle" fill="#ccc" font-size="11">• FPGA prototype</text>
  <text x="1000" y="190" text-anchor="middle" fill="#ccc" font-size="11">• Power measurement</text>
  <text x="1000" y="206" text-anchor="middle" fill="#ccc" font-size="11">• Log number system integration</text>

  <!-- Branch 3: Programming (left) -->
  <line x1="525" y1="310" x2="200" y2="370" stroke="#c39bd3" stroke-width="2" opacity="0.7"/>
  <rect x="60" y="340" width="280" height="110" rx="10" fill="#2a1a3a" stroke="#c39bd3" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="365" text-anchor="middle" fill="#c39bd3" font-size="16" font-weight="bold">III. Programming</text>
  <text x="200" y="387" text-anchor="middle" fill="#ccc" font-size="11">• OISCC compiler (expr → PUSH/EML)</text>
  <text x="200" y="403" text-anchor="middle" fill="#ccc" font-size="11">• Peephole optimization</text>
  <text x="200" y="419" text-anchor="middle" fill="#ccc" font-size="11">• Common subexpression elimination</text>
  <text x="200" y="435" text-anchor="middle" fill="#ccc" font-size="11">• Standard macro library</text>

  <!-- Branch 4: Numerical Analysis (right) -->
  <line x1="675" y1="310" x2="1000" y2="370" stroke="#f39c12" stroke-width="2" opacity="0.7"/>
  <rect x="860" y="340" width="280" height="110" rx="10" fill="#3a2a1a" stroke="#f39c12" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="365" text-anchor="middle" fill="#f39c12" font-size="16" font-weight="bold">IV. Numerical Analysis</text>
  <text x="1000" y="387" text-anchor="middle" fill="#ccc" font-size="11">• Error propagation in EML chains</text>
  <text x="1000" y="403" text-anchor="middle" fill="#ccc" font-size="11">• Interval arithmetic (proved!)</text>
  <text x="1000" y="419" text-anchor="middle" fill="#ccc" font-size="11">• Mixed-precision EML</text>
  <text x="1000" y="435" text-anchor="middle" fill="#ccc" font-size="11">• Catastrophic cancellation avoidance</text>

  <!-- Branch 5: Applications (bottom-left) -->
  <line x1="560" y1="370" x2="250" y2="570" stroke="#2ecc71" stroke-width="2" opacity="0.7"/>
  <rect x="80" y="530" width="340" height="130" rx="10" fill="#1a3a1a" stroke="#2ecc71" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="555" text-anchor="middle" fill="#2ecc71" font-size="16" font-weight="bold">V. Applications</text>
  <text x="250" y="577" text-anchor="middle" fill="#ccc" font-size="11">• TinyML on OISCC (neural networks)</text>
  <text x="250" y="593" text-anchor="middle" fill="#ccc" font-size="11">• PID controller (90 instructions/cycle)</text>
  <text x="250" y="609" text-anchor="middle" fill="#ccc" font-size="11">• Software-defined radio</text>
  <text x="250" y="625" text-anchor="middle" fill="#ccc" font-size="11">• Implantable medical devices (&lt;10μW)</text>
  <text x="250" y="641" text-anchor="middle" fill="#ccc" font-size="11">• EML random number generation</text>

  <!-- Branch 6: Math Extensions (bottom-right) -->
  <line x1="640" y1="370" x2="950" y2="570" stroke="#3498db" stroke-width="2" opacity="0.7"/>
  <rect x="780" y="530" width="340" height="130" rx="10" fill="#1a2a3a" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="555" text-anchor="middle" fill="#3498db" font-size="16" font-weight="bold">VI. Mathematical Extensions</text>
  <text x="950" y="577" text-anchor="middle" fill="#ccc" font-size="11">• Complex EML → trigonometry</text>
  <text x="950" y="593" text-anchor="middle" fill="#ccc" font-size="11">• p-adic EML</text>
  <text x="950" y="609" text-anchor="middle" fill="#ccc" font-size="11">• Tropical EML: min(a, -b)</text>
  <text x="950" y="625" text-anchor="middle" fill="#ccc" font-size="11">• Differential algebra of EML</text>
  <text x="950" y="641" text-anchor="middle" fill="#ccc" font-size="11">• Quantum OISCC</text>

  <!-- Branch 7: Biology (bottom-center) -->
  <line x1="600" y1="380" x2="600" y2="700" stroke="#e74c3c" stroke-width="2" opacity="0.7"/>
  <rect x="420" y="700" width="360" height="100" rx="10" fill="#3a1a2a" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="725" text-anchor="middle" fill="#e74c3c" font-size="16" font-weight="bold">VII. Bio &amp; Chemical Computing</text>
  <text x="600" y="747" text-anchor="middle" fill="#ccc" font-size="11">• Biochemical EML circuits (Arrhenius + Weber-Fechner)</text>
  <text x="600" y="763" text-anchor="middle" fill="#ccc" font-size="11">• DNA strand displacement computing</text>
  <text x="600" y="779" text-anchor="middle" fill="#ccc" font-size="11">• Neural EML (excitatory + inhibitory pairs)</text>

  <!-- Priority badges -->
  <rect x="40" y="840" width="100" height="25" rx="12" fill="#2ecc71"/>
  <text x="90" y="857" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1-2 years</text>
  <rect x="160" y="840" width="100" height="25" rx="12" fill="#f39c12"/>
  <text x="210" y="857" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2-5 years</text>
  <rect x="280" y="840" width="100" height="25" rx="12" fill="#e74c3c"/>
  <text x="330" y="857" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">5+ years</text>

  <!-- Formal verification badge -->
  <rect x="850" y="840" width="300" height="25" rx="12" fill="#1a3a3a" stroke="#4ecdc4"/>
  <text x="1000" y="857" text-anchor="middle" fill="#4ecdc4" font-size="11">
    ✓ 40+ theorems formally verified in Lean 4
  </text>

  <!-- Quote -->
  <text x="600" y="890" text-anchor="middle" fill="#666" font-size="11" font-style="italic">
    "Every instruction except one." — The OISCC Philosophy
  </text>
</svg>
