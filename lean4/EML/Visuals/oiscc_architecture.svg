<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="stackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#533483"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#0a0a1a"/>
  <rect x="10" y="10" width="880" height="680" rx="15" fill="none" stroke="#e94560" stroke-width="2" opacity="0.3"/>

  <!-- Title -->
  <text x="450" y="50" text-anchor="middle" fill="#e94560" font-size="28" font-weight="bold" filter="url(#glow)">OISCC Architecture</text>
  <text x="450" y="75" text-anchor="middle" fill="#aaa" font-size="14">One Instruction Set Continuous Computer</text>

  <!-- Main Chip -->
  <rect x="200" y="100" width="500" height="480" rx="20" fill="url(#chipGrad)" stroke="#e94560" stroke-width="2" filter="url(#shadow)"/>

  <!-- Pin labels on left -->
  <g fill="#888" font-size="10">
    <line x1="160" y1="160" x2="200" y2="160" stroke="#e94560" stroke-width="1.5"/>
    <text x="155" y="163" text-anchor="end">DATA IN</text>
    <line x1="160" y1="200" x2="200" y2="200" stroke="#e94560" stroke-width="1.5"/>
    <text x="155" y="203" text-anchor="end">CLK</text>
    <line x1="160" y1="240" x2="200" y2="240" stroke="#e94560" stroke-width="1.5"/>
    <text x="155" y="243" text-anchor="end">PUSH/EML</text>
  </g>

  <!-- Pin labels on right -->
  <g fill="#888" font-size="10">
    <line x1="700" y1="160" x2="740" y2="160" stroke="#e94560" stroke-width="1.5"/>
    <text x="745" y="163">RESULT</text>
    <line x1="700" y1="200" x2="740" y2="200" stroke="#e94560" stroke-width="1.5"/>
    <text x="745" y="203">READY</text>
    <line x1="700" y1="240" x2="740" y2="240" stroke="#e94560" stroke-width="1.5"/>
    <text x="745" y="243">ERROR</text>
  </g>

  <!-- Instruction Decoder -->
  <rect x="230" y="120" width="180" height="60" rx="8" fill="#1a1a3e" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="bold">INSTRUCTION</text>
  <text x="320" y="168" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="bold">DECODER</text>
  <text x="320" y="110" text-anchor="middle" fill="#666" font-size="10">1-bit opcode!</text>

  <!-- PUSH path -->
  <text x="270" y="200" fill="#888" font-size="10">PUSH</text>
  <line x1="320" y1="180" x2="320" y2="310" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M 280 190 L 280 310" stroke="#4ecdc4" stroke-width="1" fill="none" stroke-dasharray="4,4"/>

  <!-- EML path -->
  <text x="360" y="200" fill="#888" font-size="10">EML</text>
  <path d="M 370 190 L 500 270" stroke="#ff6b6b" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- The ONE Circuit: EML ALU -->
  <rect x="430" y="250" width="240" height="120" rx="12" fill="url(#circuitGrad)" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
  <text x="550" y="285" text-anchor="middle" fill="white" font-size="20" font-weight="bold">EML UNIT</text>
  <text x="550" y="310" text-anchor="middle" fill="white" font-size="16">c = eᵃ − ln(b)</text>
  <text x="550" y="335" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">THE ONLY CIRCUIT</text>
  <text x="550" y="355" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="10">Replaces entire ALU: +, −, ×, ÷, exp, ln, ^</text>

  <!-- Input labels for EML unit -->
  <text x="425" y="278" text-anchor="end" fill="#ff9" font-size="11">a →</text>
  <text x="425" y="338" text-anchor="end" fill="#ff9" font-size="11">b →</text>
  <text x="675" y="308" fill="#ff9" font-size="11">→ c</text>

  <!-- Stack Memory -->
  <rect x="230" y="310" width="150" height="240" rx="8" fill="url(#stackGrad)" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="305" y="340" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="bold">STACK</text>

  <!-- Stack entries -->
  <g>
    <rect x="245" y="350" width="120" height="30" rx="4" fill="rgba(78,205,196,0.2)" stroke="#4ecdc4" stroke-width="0.5"/>
    <text x="305" y="370" text-anchor="middle" fill="#4ecdc4" font-size="12">← TOP (b)</text>

    <rect x="245" y="385" width="120" height="30" rx="4" fill="rgba(78,205,196,0.15)" stroke="#4ecdc4" stroke-width="0.5"/>
    <text x="305" y="405" text-anchor="middle" fill="#4ecdc4" font-size="12">← NEXT (a)</text>

    <rect x="245" y="420" width="120" height="30" rx="4" fill="rgba(78,205,196,0.1)" stroke="#4ecdc4" stroke-width="0.5"/>
    <text x="305" y="440" text-anchor="middle" fill="#aaa" font-size="11">...</text>

    <rect x="245" y="455" width="120" height="30" rx="4" fill="rgba(78,205,196,0.05)" stroke="#4ecdc4" stroke-width="0.5"/>
    <text x="305" y="475" text-anchor="middle" fill="#888" font-size="11">...</text>

    <rect x="245" y="490" width="120" height="30" rx="4" fill="rgba(78,205,196,0.02)" stroke="#4ecdc4" stroke-width="0.5"/>
    <text x="305" y="510" text-anchor="middle" fill="#666" font-size="11">BOTTOM</text>
  </g>

  <!-- Data flow arrows -->
  <!-- Stack to EML -->
  <path d="M 365 365 Q 400 340 430 290" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 365 400 Q 400 380 430 330" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- EML result back to stack -->
  <path d="M 550 370 Q 450 420 365 370" stroke="#ff6b6b" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="470" y="410" text-anchor="middle" fill="#ff6b6b" font-size="9">result pushed</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ecdc4"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b6b"/>
    </marker>
  </defs>

  <!-- Instruction format box -->
  <rect x="430" y="420" width="240" height="130" rx="8" fill="#1a1a3e" stroke="#888" stroke-width="1"/>
  <text x="550" y="445" text-anchor="middle" fill="#ccc" font-size="12" font-weight="bold">INSTRUCTION FORMAT</text>

  <rect x="450" y="455" width="200" height="25" rx="4" fill="#2a2a4e" stroke="#4ecdc4" stroke-width="0.5"/>
  <text x="460" y="472" fill="#4ecdc4" font-size="11">0 | value (64-bit)</text>
  <text x="460" y="455" fill="#888" font-size="9" dy="-3">PUSH:</text>

  <rect x="450" y="490" width="200" height="25" rx="4" fill="#2a2a4e" stroke="#ff6b6b" stroke-width="0.5"/>
  <text x="460" y="507" fill="#ff6b6b" font-size="11">1 | (unused)</text>
  <text x="460" y="490" fill="#888" font-size="9" dy="-3">EML:</text>

  <text x="550" y="540" text-anchor="middle" fill="#666" font-size="10">1-bit opcode → minimal decode logic</text>

  <!-- Comparison callout -->
  <rect x="50" y="590" width="800" height="80" rx="10" fill="#1a1a2e" stroke="#e94560" stroke-width="1" opacity="0.8"/>

  <text x="450" y="615" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">Traditional CPU vs OISCC</text>

  <text x="250" y="640" text-anchor="middle" fill="#888" font-size="11">Traditional: ADD, SUB, MUL, DIV, EXP, LOG, SQRT, ...</text>
  <text x="250" y="658" text-anchor="middle" fill="#888" font-size="11">→ Dozens of circuits, complex decode</text>

  <text x="650" y="640" text-anchor="middle" fill="#4ecdc4" font-size="11" font-weight="bold">OISCC: EML only</text>
  <text x="650" y="658" text-anchor="middle" fill="#4ecdc4" font-size="11" font-weight="bold">→ ONE circuit, 1-bit decode ✓</text>
</svg>
