<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="700" fill="url(#bg3)"/>

  <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="bold">
    Algebraic Structure of EML
  </text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">
    Verified Properties (Lean 4)
  </text>

  <!-- Algebraic hierarchy -->
  <g transform="translate(50, 100)">
    <!-- Group -->
    <rect x="0" y="0" width="170" height="80" rx="10" fill="#1e3a5f" stroke="#64748b" stroke-width="2"/>
    <text x="85" y="25" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">Group</text>
    <text x="85" y="45" text-anchor="middle" fill="#64748b" font-size="10">Assoc + Identity + Inverse</text>
    <text x="85" y="65" text-anchor="middle" fill="#ef4444" font-size="11">✗ EML is NOT a group</text>

    <!-- Monoid -->
    <rect x="200" y="0" width="170" height="80" rx="10" fill="#1e3a5f" stroke="#64748b" stroke-width="2"/>
    <text x="285" y="25" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">Monoid</text>
    <text x="285" y="45" text-anchor="middle" fill="#64748b" font-size="10">Assoc + Identity</text>
    <text x="285" y="65" text-anchor="middle" fill="#ef4444" font-size="11">✗ EML is NOT a monoid</text>

    <!-- Semigroup -->
    <rect x="400" y="0" width="170" height="80" rx="10" fill="#1e3a5f" stroke="#64748b" stroke-width="2"/>
    <text x="485" y="25" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">Semigroup</text>
    <text x="485" y="45" text-anchor="middle" fill="#64748b" font-size="10">Associative</text>
    <text x="485" y="65" text-anchor="middle" fill="#ef4444" font-size="11">✗ EML is NOT a semigroup</text>

    <!-- Magma (what EML actually is) -->
    <rect x="600" y="0" width="200" height="80" rx="10" fill="#1e4a1e" stroke="#4ade80" stroke-width="3"/>
    <text x="700" y="25" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">Magma (Groupoid)</text>
    <text x="700" y="45" text-anchor="middle" fill="#86efac" font-size="10">Binary operation, no axioms</text>
    <text x="700" y="65" text-anchor="middle" fill="#4ade80" font-size="11">✓ EML IS a magma</text>
  </g>

  <!-- Arrows connecting hierarchy -->
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="140" x2="285" y2="140" stroke-dasharray="5,3"/>
    <line x1="420" y1="140" x2="485" y2="140" stroke-dasharray="5,3"/>
    <line x1="620" y1="140" x2="685" y2="140" stroke-dasharray="5,3"/>
  </g>

  <!-- Verified properties -->
  <g transform="translate(50, 220)">
    <text x="400" y="0" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">
      Verified Algebraic Properties
    </text>

    <!-- Property cards -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="250" height="90" rx="8" fill="#1a1a3e" stroke="#ef4444" stroke-width="1.5"/>
      <text x="125" y="22" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">✗ Not Commutative</text>
      <text x="125" y="42" text-anchor="middle" fill="#cbd5e1" font-size="11">EML(0,1) = 1 ≠ EML(1,0)</text>
      <text x="125" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">EML(0,1)=1, EML(1,0)=e</text>
      <text x="125" y="80" text-anchor="middle" fill="#64748b" font-size="9">Lean: eml_noncommutative</text>
    </g>

    <g transform="translate(275, 20)">
      <rect x="0" y="0" width="250" height="90" rx="8" fill="#1a1a3e" stroke="#ef4444" stroke-width="1.5"/>
      <text x="125" y="22" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">✗ Not Associative</text>
      <text x="125" y="42" text-anchor="middle" fill="#cbd5e1" font-size="11">EML(EML(1,1),1) ≠ EML(1,EML(1,1))</text>
      <text x="125" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">e^e ≠ e − (e−1) = 1</text>
      <text x="125" y="80" text-anchor="middle" fill="#64748b" font-size="9">Lean: emlA_not_assoc</text>
    </g>

    <g transform="translate(550, 20)">
      <rect x="0" y="0" width="250" height="90" rx="8" fill="#1a1a3e" stroke="#ef4444" stroke-width="1.5"/>
      <text x="125" y="22" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">✗ No Identity Element</text>
      <text x="125" y="42" text-anchor="middle" fill="#cbd5e1" font-size="11">¬∃e, ∀x, EML(x,e)=x</text>
      <text x="125" y="62" text-anchor="middle" fill="#cbd5e1" font-size="11">¬∃e, ∀x, EML(e,x)=x</text>
      <text x="125" y="80" text-anchor="middle" fill="#64748b" font-size="9">Lean: eml_no_right/left_identity</text>
    </g>

    <!-- Positive properties -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="250" height="90" rx="8" fill="#1a2a1a" stroke="#4ade80" stroke-width="1.5"/>
      <text x="125" y="22" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">✓ Anti-EML Symmetry</text>
      <text x="125" y="42" text-anchor="middle" fill="#cbd5e1" font-size="11">anti(x,y) = −EML(y,x)</text>
      <text x="125" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">ln(x)−exp(y) = −(exp(y)−ln(x))</text>
      <text x="125" y="80" text-anchor="middle" fill="#64748b" font-size="9">Lean: antiEml_eq_neg_eml_swap</text>
    </g>

    <g transform="translate(275, 130)">
      <rect x="0" y="0" width="250" height="90" rx="8" fill="#1a2a1a" stroke="#4ade80" stroke-width="1.5"/>
      <text x="125" y="22" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">✓ Log-Split Rule</text>
      <text x="125" y="42" text-anchor="middle" fill="#cbd5e1" font-size="11">EML(x, y·z) = EML(x,y) − ln(z)</text>
      <text x="125" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">For y, z &gt; 0</text>
      <text x="125" y="80" text-anchor="middle" fill="#64748b" font-size="9">Lean: eml_log_split</text>
    </g>

    <g transform="translate(550, 130)">
      <rect x="0" y="0" width="250" height="90" rx="8" fill="#1a2a1a" stroke="#4ade80" stroke-width="1.5"/>
      <text x="125" y="22" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">✓ No Positive Fixed Pts</text>
      <text x="125" y="42" text-anchor="middle" fill="#cbd5e1" font-size="11">EML(x,x) &gt; x for all x &gt; 0</text>
      <text x="125" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">exp(x) − ln(x) &gt; x</text>
      <text x="125" y="80" text-anchor="middle" fill="#64748b" font-size="9">Lean: emlDiag_no_fixed_point</text>
    </g>
  </g>

  <!-- Tropical comparison -->
  <g transform="translate(50, 530)">
    <rect x="0" y="0" width="380" height="140" rx="10" fill="#1a1a3e" stroke="#c084fc" stroke-width="2"/>
    <text x="190" y="25" text-anchor="middle" fill="#c084fc" font-size="15" font-weight="bold">Tropical EML: a − b</text>
    <text x="20" y="50" fill="#cbd5e1" font-size="11">✓ Right identity: tEML(a,0) = a</text>
    <text x="20" y="70" fill="#cbd5e1" font-size="11">✓ Anti-commutative: tEML(a,b) = −tEML(b,a)</text>
    <text x="20" y="90" fill="#cbd5e1" font-size="11">✗ Not associative: (1−1)−1 ≠ 1−(1−1)</text>
    <text x="20" y="115" fill="#94a3b8" font-size="10">Connects OISCC to shortest-path</text>
    <text x="20" y="130" fill="#94a3b8" font-size="10">algorithms and tropical geometry</text>
  </g>

  <!-- EML closure -->
  <g transform="translate(470, 530)">
    <rect x="0" y="0" width="380" height="140" rx="10" fill="#1a1a3e" stroke="#fbbf24" stroke-width="2"/>
    <text x="190" y="25" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="bold">EML Closure from {1}</text>
    <text x="20" y="50" fill="#cbd5e1" font-size="11">Level 0: {1}</text>
    <text x="20" y="70" fill="#cbd5e1" font-size="11">Level 1: {e ≈ 2.718}</text>
    <text x="20" y="90" fill="#cbd5e1" font-size="11">Level 2: {e^e ≈ 15.15, e−1 ≈ 1.718}</text>
    <text x="20" y="110" fill="#cbd5e1" font-size="11">Level 3: {0, e^(e^e), e^(e−1), ...}</text>
    <text x="20" y="130" fill="#94a3b8" font-size="10">Open: Is this set dense in ℝ? Is π in it?</text>
  </g>
</svg>
