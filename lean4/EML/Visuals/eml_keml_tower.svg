<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f2f"/>
      <stop offset="100%" style="stop-color:#1f1f4f"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="650" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Georgia" font-size="24" fill="#ffd700" filter="url(#glow2)">EML Kolmogorov Complexity Tower</text>
  <text x="450" y="62" text-anchor="middle" font-family="Arial" font-size="13" fill="#8888cc">K_EML(x) = minimum EML tree depth to compute x from constant 1</text>

  <!-- Level 0 -->
  <rect x="350" y="90" width="200" height="50" rx="10" fill="#1a3a1a" stroke="#44ff44" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" font-family="Georgia" font-size="16" fill="#44ff44" font-weight="bold">Depth 0</text>
  <text x="450" y="128" text-anchor="middle" font-family="Arial" font-size="12" fill="#cccccc">1 value</text>
  <!-- Value -->
  <circle cx="450" cy="165" r="22" fill="#1a1a3a" stroke="#44ff44" stroke-width="2"/>
  <text x="450" y="170" text-anchor="middle" font-family="Georgia" font-size="14" fill="#ffffff" font-weight="bold">1</text>

  <!-- Level 1 -->
  <rect x="350" y="200" width="200" height="50" rx="10" fill="#2a2a1a" stroke="#ffaa44" stroke-width="2"/>
  <text x="450" y="220" text-anchor="middle" font-family="Georgia" font-size="16" fill="#ffaa44" font-weight="bold">Depth 1</text>
  <text x="450" y="238" text-anchor="middle" font-family="Arial" font-size="12" fill="#cccccc">1 new value</text>
  <circle cx="450" cy="275" r="22" fill="#1a1a3a" stroke="#ffaa44" stroke-width="2"/>
  <text x="450" y="272" text-anchor="middle" font-family="Georgia" font-size="12" fill="#ffffff" font-weight="bold">e</text>
  <text x="450" y="286" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaaaaa">2.718...</text>
  <!-- Arrow and expression -->
  <text x="530" y="278" font-family="monospace" font-size="10" fill="#888888">eml(1,1)</text>

  <!-- Level 2 -->
  <rect x="350" y="310" width="200" height="50" rx="10" fill="#1a1a3a" stroke="#4488ff" stroke-width="2"/>
  <text x="450" y="330" text-anchor="middle" font-family="Georgia" font-size="16" fill="#4488ff" font-weight="bold">Depth 2</text>
  <text x="450" y="348" text-anchor="middle" font-family="Arial" font-size="12" fill="#cccccc">3 new values</text>
  <!-- Values at depth 2 -->
  <circle cx="300" cy="390" r="22" fill="#1a1a3a" stroke="#4488ff" stroke-width="2"/>
  <text x="300" y="387" text-anchor="middle" font-family="Georgia" font-size="10" fill="#ffffff" font-weight="bold">e−1</text>
  <text x="300" y="400" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaaaaa">1.718</text>

  <circle cx="450" cy="390" r="22" fill="#1a1a3a" stroke="#4488ff" stroke-width="2"/>
  <text x="450" y="387" text-anchor="middle" font-family="Georgia" font-size="10" fill="#ffffff" font-weight="bold">e²−e</text>
  <text x="450" y="400" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaaaaa">14.15</text>

  <circle cx="600" cy="390" r="22" fill="#1a1a3a" stroke="#4488ff" stroke-width="2"/>
  <text x="600" y="387" text-anchor="middle" font-family="Georgia" font-size="10" fill="#ffffff" font-weight="bold">e^e</text>
  <text x="600" y="400" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaaaaa">15.15</text>

  <!-- Level 3 -->
  <rect x="350" y="430" width="200" height="50" rx="10" fill="#3a1a1a" stroke="#ff4444" stroke-width="2"/>
  <text x="450" y="450" text-anchor="middle" font-family="Georgia" font-size="16" fill="#ff4444" font-weight="bold">Depth 3</text>
  <text x="450" y="468" text-anchor="middle" font-family="Arial" font-size="12" fill="#cccccc">21 new values</text>
  <!-- Highlight: 0 appears! -->
  <circle cx="200" cy="510" r="25" fill="#3a0a0a" stroke="#ff4444" stroke-width="3"/>
  <text x="200" y="515" text-anchor="middle" font-family="Georgia" font-size="16" fill="#ff4444" font-weight="bold">0</text>
  <text x="200" y="545" text-anchor="middle" font-family="Arial" font-size="9" fill="#ff8888">★ First zero!</text>

  <circle cx="370" cy="510" r="22" fill="#1a1a3a" stroke="#ff4444" stroke-width="2"/>
  <text x="370" y="507" text-anchor="middle" font-family="Georgia" font-size="9" fill="#ffffff">e^e−e</text>
  <text x="370" y="520" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaaaaa">12.44</text>

  <circle cx="530" cy="510" r="22" fill="#1a1a3a" stroke="#ff4444" stroke-width="2"/>
  <text x="530" y="507" text-anchor="middle" font-family="Georgia" font-size="9" fill="#ffffff">e^(e^e)</text>
  <text x="530" y="520" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaaaaa">3.8M</text>

  <circle cx="700" cy="510" r="22" fill="#1a1a3a" stroke="#ff4444" stroke-width="2"/>
  <text x="700" y="515" text-anchor="middle" font-family="Georgia" font-size="9" fill="#ffffff">+18 more</text>

  <!-- Level 4 -->
  <rect x="350" y="550" width="200" height="50" rx="10" fill="#2a1a3a" stroke="#aa44ff" stroke-width="2"/>
  <text x="450" y="570" text-anchor="middle" font-family="Georgia" font-size="16" fill="#aa44ff" font-weight="bold">Depth 4</text>
  <text x="450" y="588" text-anchor="middle" font-family="Arial" font-size="12" fill="#cccccc">370 new values</text>
  
  <!-- Open question box -->
  <rect x="580" y="555" width="280" height="45" rx="8" fill="#1a1a3a" stroke="#aa44ff" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="720" y="573" text-anchor="middle" font-family="Arial" font-size="11" fill="#cc88ff">OPEN: K_EML(2) &gt; 4</text>
  <text x="720" y="590" text-anchor="middle" font-family="Arial" font-size="10" fill="#8888aa">Is the integer 2 reachable from 1?</text>

  <!-- Growth annotation -->
  <rect x="30" y="130" width="200" height="120" rx="8" fill="#0a0a2a" stroke="#555588" stroke-width="1"/>
  <text x="130" y="150" text-anchor="middle" font-family="Georgia" font-size="13" fill="#aaaacc">Growth Rate</text>
  <text x="50" y="170" font-family="monospace" font-size="11" fill="#44ff44">Depth 0: 1 value</text>
  <text x="50" y="188" font-family="monospace" font-size="11" fill="#ffaa44">Depth 1: 1 value</text>
  <text x="50" y="206" font-family="monospace" font-size="11" fill="#4488ff">Depth 2: 3 values</text>
  <text x="50" y="224" font-family="monospace" font-size="11" fill="#ff4444">Depth 3: 21 values</text>
  <text x="50" y="242" font-family="monospace" font-size="11" fill="#aa44ff">Depth 4: 370 values</text>

  <!-- Key results box -->
  <rect x="670" y="130" width="200" height="130" rx="8" fill="#0a0a2a" stroke="#ffd700" stroke-width="1"/>
  <text x="770" y="150" text-anchor="middle" font-family="Georgia" font-size="13" fill="#ffd700">Verified K_EML</text>
  <text x="690" y="172" font-family="monospace" font-size="11" fill="#44ff44">K_EML(1)   = 0 ✓</text>
  <text x="690" y="190" font-family="monospace" font-size="11" fill="#44ff44">K_EML(e)   = 1 ✓</text>
  <text x="690" y="208" font-family="monospace" font-size="11" fill="#44ff44">K_EML(e^e) = 2 ✓</text>
  <text x="690" y="226" font-family="monospace" font-size="11" fill="#44ff44">K_EML(e-1) = 2 ✓</text>
  <text x="690" y="244" font-family="monospace" font-size="11" fill="#44ff44">K_EML(0)   = 3 ✓</text>

  <!-- Footer -->
  <text x="450" y="635" text-anchor="middle" font-family="Arial" font-size="11" fill="#666688">Computationally verified via exhaustive EML tree enumeration • All Lean 4 formalized</text>
</svg>
