<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgU" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="goldU" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d848"/>
      <stop offset="100%" stop-color="#e8b830"/>
    </linearGradient>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#88ff88"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#88aaff"/>
    </marker>
  </defs>
  
  <rect width="1000" height="700" fill="url(#bgU)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="url(#goldU)" font-size="26" font-weight="bold">
    How EML Generates All Elementary Functions
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#8899bb" font-size="13">
    The bootstrapping chain: from one constant and one operation to all of mathematics
  </text>
  
  <!-- Step 0: Starting point -->
  <rect x="60" y="100" width="120" height="50" rx="10" fill="#2a2a4e" stroke="url(#goldU)" stroke-width="2"/>
  <text x="120" y="122" text-anchor="middle" fill="url(#goldU)" font-size="16" font-weight="bold">1</text>
  <text x="120" y="140" text-anchor="middle" fill="#aabbcc" font-size="11">constant</text>
  
  <!-- Arrow to e -->
  <line x1="180" y1="125" x2="245" y2="125" stroke="#88ff88" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="212" y="115" text-anchor="middle" fill="#88ff88" font-size="10">eml(1,1)</text>
  
  <!-- Step 1: e -->
  <rect x="250" y="100" width="120" height="50" rx="10" fill="#2a2a4e" stroke="#ff8844" stroke-width="2"/>
  <text x="310" y="122" text-anchor="middle" fill="#ff8844" font-size="16" font-weight="bold">e ≈ 2.718</text>
  <text x="310" y="140" text-anchor="middle" fill="#aabbcc" font-size="11">Euler's number</text>
  
  <!-- Arrow to exp -->
  <line x1="370" y1="125" x2="435" y2="125" stroke="#88ff88" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="402" y="115" text-anchor="middle" fill="#88ff88" font-size="10">eml(x,1)</text>
  
  <!-- Step 2: exp -->
  <rect x="440" y="100" width="120" height="50" rx="10" fill="#2a2a4e" stroke="#4488ff" stroke-width="2"/>
  <text x="500" y="122" text-anchor="middle" fill="#4488ff" font-size="16" font-weight="bold">exp(x)</text>
  <text x="500" y="140" text-anchor="middle" fill="#aabbcc" font-size="11">exponential</text>
  
  <!-- Arrow to 0 and ln -->
  <line x1="560" y1="125" x2="625" y2="125" stroke="#88ff88" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="593" y="115" text-anchor="middle" fill="#88ff88" font-size="9">compose</text>
  
  <!-- Step 3: ln and 0 -->
  <rect x="630" y="90" width="130" height="35" rx="8" fill="#2a2a4e" stroke="#44dd88" stroke-width="2"/>
  <text x="695" y="114" text-anchor="middle" fill="#44dd88" font-size="14" font-weight="bold">ln(x)</text>
  
  <rect x="630" y="130" width="130" height="35" rx="8" fill="#2a2a4e" stroke="#dd44aa" stroke-width="2"/>
  <text x="695" y="154" text-anchor="middle" fill="#dd44aa" font-size="14" font-weight="bold">0</text>
  
  <!-- Arrow to subtraction -->
  <line x1="760" y1="125" x2="815" y2="125" stroke="#88ff88" stroke-width="2" marker-end="url(#arrowG)"/>
  
  <!-- Step 4: subtraction -->
  <rect x="820" y="100" width="130" height="50" rx="10" fill="#2a2a4e" stroke="#ff44ff" stroke-width="2"/>
  <text x="885" y="122" text-anchor="middle" fill="#ff44ff" font-size="14" font-weight="bold">a − b</text>
  <text x="885" y="140" text-anchor="middle" fill="#aabbcc" font-size="10">eml(ln a, exp b)</text>
  
  <!-- Second row: arithmetic -->
  <text x="500" y="200" text-anchor="middle" fill="#8899bb" font-size="14">▼ From subtraction, exp, and ln, we build all arithmetic ▼</text>
  
  <!-- Arithmetic operations -->
  <rect x="60" y="230" width="170" height="45" rx="8" fill="#1a2a3e" stroke="#88aaff" stroke-width="1.5"/>
  <text x="145" y="250" text-anchor="middle" fill="#88aaff" font-size="13" font-weight="bold">a + b</text>
  <text x="145" y="266" text-anchor="middle" fill="#8899aa" font-size="10">= a − (−b)</text>
  
  <rect x="260" y="230" width="170" height="45" rx="8" fill="#1a2a3e" stroke="#88aaff" stroke-width="1.5"/>
  <text x="345" y="250" text-anchor="middle" fill="#88aaff" font-size="13" font-weight="bold">a × b</text>
  <text x="345" y="266" text-anchor="middle" fill="#8899aa" font-size="10">= exp(ln a + ln b)</text>
  
  <rect x="460" y="230" width="170" height="45" rx="8" fill="#1a2a3e" stroke="#88aaff" stroke-width="1.5"/>
  <text x="545" y="250" text-anchor="middle" fill="#88aaff" font-size="13" font-weight="bold">a / b</text>
  <text x="545" y="266" text-anchor="middle" fill="#8899aa" font-size="10">= exp(ln a − ln b)</text>
  
  <rect x="660" y="230" width="170" height="45" rx="8" fill="#1a2a3e" stroke="#88aaff" stroke-width="1.5"/>
  <text x="745" y="250" text-anchor="middle" fill="#88aaff" font-size="13" font-weight="bold">aᵇ</text>
  <text x="745" y="266" text-anchor="middle" fill="#8899aa" font-size="10">= exp(b · ln a)</text>
  
  <!-- Third row: transcendental functions -->
  <text x="500" y="320" text-anchor="middle" fill="#8899bb" font-size="14">▼ Complex EML gives trigonometry via Euler's formula ▼</text>
  
  <rect x="80" y="350" width="160" height="60" rx="8" fill="#2a1a2e" stroke="#ff88ff" stroke-width="1.5"/>
  <text x="160" y="375" text-anchor="middle" fill="#ff88ff" font-size="14" font-weight="bold">sin(x)</text>
  <text x="160" y="395" text-anchor="middle" fill="#aa88bb" font-size="10">= Im(eⁱˣ)</text>
  
  <rect x="270" y="350" width="160" height="60" rx="8" fill="#2a1a2e" stroke="#ff88ff" stroke-width="1.5"/>
  <text x="350" y="375" text-anchor="middle" fill="#ff88ff" font-size="14" font-weight="bold">cos(x)</text>
  <text x="350" y="395" text-anchor="middle" fill="#aa88bb" font-size="10">= Re(eⁱˣ)</text>
  
  <rect x="460" y="350" width="160" height="60" rx="8" fill="#2a1a2e" stroke="#ff88ff" stroke-width="1.5"/>
  <text x="540" y="375" text-anchor="middle" fill="#ff88ff" font-size="14" font-weight="bold">arctan(x)</text>
  <text x="540" y="395" text-anchor="middle" fill="#aa88bb" font-size="10">= Im(ln(1+ix))</text>
  
  <rect x="650" y="350" width="200" height="60" rx="8" fill="#2a1a2e" stroke="#ff88ff" stroke-width="1.5"/>
  <text x="750" y="375" text-anchor="middle" fill="#ff88ff" font-size="14" font-weight="bold">All trig functions</text>
  <text x="750" y="395" text-anchor="middle" fill="#aa88bb" font-size="10">tan, sec, csc, cot, ...</text>
  
  <!-- Constants section -->
  <text x="500" y="455" text-anchor="middle" fill="#8899bb" font-size="14">▼ All mathematical constants follow ▼</text>
  
  <rect x="80" y="480" width="140" height="50" rx="8" fill="#1a2a1e" stroke="#88ff88" stroke-width="1.5"/>
  <text x="150" y="502" text-anchor="middle" fill="#88ff88" font-size="14" font-weight="bold">π</text>
  <text x="150" y="520" text-anchor="middle" fill="#88aa88" font-size="10">= 4·arctan(1)</text>
  
  <rect x="250" y="480" width="140" height="50" rx="8" fill="#1a2a1e" stroke="#88ff88" stroke-width="1.5"/>
  <text x="320" y="502" text-anchor="middle" fill="#88ff88" font-size="14" font-weight="bold">i</text>
  <text x="320" y="520" text-anchor="middle" fill="#88aa88" font-size="10">= eⁱᵖ/² = eml(...)</text>
  
  <rect x="420" y="480" width="140" height="50" rx="8" fill="#1a2a1e" stroke="#88ff88" stroke-width="1.5"/>
  <text x="490" y="502" text-anchor="middle" fill="#88ff88" font-size="14" font-weight="bold">√2</text>
  <text x="490" y="520" text-anchor="middle" fill="#88aa88" font-size="10">= 2^(1/2)</text>
  
  <rect x="590" y="480" width="140" height="50" rx="8" fill="#1a2a1e" stroke="#88ff88" stroke-width="1.5"/>
  <text x="660" y="502" text-anchor="middle" fill="#88ff88" font-size="14" font-weight="bold">φ (golden)</text>
  <text x="660" y="520" text-anchor="middle" fill="#88aa88" font-size="10">= (1+√5)/2</text>
  
  <rect x="760" y="480" width="140" height="50" rx="8" fill="#1a2a1e" stroke="#88ff88" stroke-width="1.5"/>
  <text x="830" y="502" text-anchor="middle" fill="#88ff88" font-size="14" font-weight="bold">Any algebraic</text>
  <text x="830" y="520" text-anchor="middle" fill="#88aa88" font-size="10">roots of polys</text>
  
  <!-- Bottom: the key insight -->
  <rect x="150" y="570" width="700" height="60" rx="12" fill="#2a2a1e" stroke="url(#goldU)" stroke-width="2"/>
  <text x="500" y="595" text-anchor="middle" fill="url(#goldU)" font-size="18" font-weight="bold">
    36 standard operations → 1 operation (EML) + 1 constant (1)
  </text>
  <text x="500" y="618" text-anchor="middle" fill="#ccbb88" font-size="13">
    The most extreme compression of mathematical operations known
  </text>
  
  <!-- Decorative: count boxes -->
  <text x="500" y="665" text-anchor="middle" fill="#556677" font-size="11">
    Based on Odrzywolek (2025) · Formalized in Lean 4 · 100+ machine-verified theorems
  </text>
</svg>
