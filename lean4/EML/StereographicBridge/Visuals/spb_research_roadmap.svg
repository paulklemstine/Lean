<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#ffd700" font-size="32" font-weight="bold" filter="url(#glow)">
    SPB Research Roadmap: 30+ Open Problems
  </text>
  <text x="600" y="85" text-anchor="middle" fill="#aaccff" font-size="16">
    spb(x, y) = (x + y) / (1 − xy)  ·  The Formula That Connects Everything
  </text>

  <!-- Central Formula -->
  <circle cx="600" cy="350" r="80" fill="none" stroke="#ffd700" stroke-width="3" filter="url(#glow)"/>
  <text x="600" y="340" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">SPB</text>
  <text x="600" y="365" text-anchor="middle" fill="#ffd700" font-size="14">(x+y)/(1−xy)</text>

  <!-- Category A: Pure Math (top-left) -->
  <rect x="30" y="130" width="280" height="200" rx="15" fill="#1a3a5c" stroke="#4a9eff" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="160" text-anchor="middle" fill="#4a9eff" font-size="18" font-weight="bold">Pure Mathematics</text>
  <text x="50" y="185" fill="#cce0ff" font-size="11">A1. Higher-dimensional SPB (S^n)</text>
  <text x="50" y="205" fill="#cce0ff" font-size="11">A2. SPB over p-adic numbers</text>
  <text x="50" y="225" fill="#cce0ff" font-size="11">A3. SPB and modular forms</text>
  <text x="50" y="245" fill="#cce0ff" font-size="11">A4. Tropical SPB</text>
  <text x="50" y="265" fill="#cce0ff" font-size="11">A5. SPB trees and Catalan structures</text>
  <text x="50" y="290" fill="#7fff7f" font-size="11">✓ Finite field classification PROVED</text>
  <text x="50" y="310" fill="#7fff7f" font-size="11">✓ Chebyshev connection PROVED</text>
  <line x1="310" y1="230" x2="520" y2="330" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Category B: Analysis (top-right) -->
  <rect x="890" y="130" width="280" height="200" rx="15" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="160" text-anchor="middle" fill="#ff6b6b" font-size="18" font-weight="bold">Analysis &amp; Dynamics</text>
  <text x="910" y="185" fill="#ffcccc" font-size="11">B1. Ergodic theory (equidistribution)</text>
  <text x="910" y="205" fill="#ffcccc" font-size="11">B2. Random SPB iteration</text>
  <text x="910" y="225" fill="#ffcccc" font-size="11">B3. SPB PDE (nonlinear transport)</text>
  <text x="910" y="245" fill="#ffcccc" font-size="11">B4. Numerical stability / CORDIC</text>
  <text x="910" y="270" fill="#7fff7f" font-size="11">✓ Monotonicity PROVED</text>
  <text x="910" y="290" fill="#7fff7f" font-size="11">✓ Cauchy invariant measure PROVED</text>
  <text x="910" y="310" fill="#7fff7f" font-size="11">✓ Arctangent addition PROVED</text>
  <line x1="890" y1="230" x2="680" y2="330" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Category C: Physics (bottom-left) -->
  <rect x="30" y="470" width="280" height="200" rx="15" fill="#1a3a1a" stroke="#6bff6b" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="500" text-anchor="middle" fill="#6bff6b" font-size="18" font-weight="bold">Physics</text>
  <text x="50" y="525" fill="#ccffcc" font-size="11">C1. Thomas precession in 3D</text>
  <text x="50" y="545" fill="#ccffcc" font-size="11">C2. Bloch sphere &amp; quantum gates</text>
  <text x="50" y="565" fill="#ccffcc" font-size="11">C3. Gravitational lensing</text>
  <text x="50" y="585" fill="#ccffcc" font-size="11">C4. Paramagnetism &amp; Brillouin</text>
  <text x="50" y="615" fill="#7fff7f" font-size="11">✓ Einstein velocity addition PROVED</text>
  <text x="50" y="635" fill="#7fff7f" font-size="11">✓ Sub-luminal closure PROVED</text>
  <text x="50" y="655" fill="#7fff7f" font-size="11">✓ Rapidity addition PROVED</text>
  <line x1="310" y1="570" x2="520" y2="370" stroke="#6bff6b" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Category D: Computer Science (bottom-right) -->
  <rect x="890" y="470" width="280" height="200" rx="15" fill="#3a1a3a" stroke="#ff6bff" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="500" text-anchor="middle" fill="#ff6bff" font-size="18" font-weight="bold">Computer Science</text>
  <text x="910" y="525" fill="#ffccff" font-size="11">D1. SPB neural networks</text>
  <text x="910" y="545" fill="#ffccff" font-size="11">D2. CORDIC-SPB hardware</text>
  <text x="910" y="565" fill="#ffccff" font-size="11">D3. SPB cryptography (DLP)</text>
  <text x="910" y="585" fill="#ffccff" font-size="11">D4. SPB compression</text>
  <text x="910" y="615" fill="#7fff7f" font-size="11">✓ SPB complexity theory PROVED</text>
  <text x="910" y="635" fill="#7fff7f" font-size="11">✓ Expression tree algebra PROVED</text>
  <line x1="890" y1="570" x2="680" y2="370" stroke="#ff6bff" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- EML-SPB Bridge (center bottom) -->
  <rect x="400" y="500" width="400" height="120" rx="15" fill="#2a2a1a" stroke="#ffd700" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="530" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="bold">EML-SPB Bridge</text>
  <text x="600" y="555" text-anchor="middle" fill="#ffe0a0" font-size="12">EML: exp(x) − ln(y) → Arithmetic World</text>
  <text x="600" y="575" text-anchor="middle" fill="#ffe0a0" font-size="12">SPB: (x+y)/(1−xy) → Geometric World</text>
  <text x="600" y="600" text-anchor="middle" fill="#7fff7f" font-size="11">✓ Dual operator system FORMALIZED</text>
  <line x1="600" y1="430" x2="600" y2="500" stroke="#ffd700" stroke-width="2"/>

  <!-- Wick Rotation (center top) -->
  <rect x="420" y="130" width="360" height="80" rx="15" fill="#2a1a2a" stroke="#ff9f43" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="160" text-anchor="middle" fill="#ff9f43" font-size="16" font-weight="bold">Wick Rotation Duality</text>
  <text x="600" y="185" text-anchor="middle" fill="#ffd0a0" font-size="12">1−xy ↔ 1+xy  ·  Circular ↔ Hyperbolic  ·  t → it</text>
  <text x="600" y="200" text-anchor="middle" fill="#7fff7f" font-size="11">✓ Functoriality PROVED</text>
  <line x1="600" y1="210" x2="600" y2="270" stroke="#ff9f43" stroke-width="2"/>

  <!-- Statistics -->
  <rect x="100" y="720" width="1000" height="140" rx="15" fill="#111133" stroke="#888" stroke-width="1"/>
  <text x="600" y="755" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Formalization Status</text>

  <text x="200" y="790" text-anchor="middle" fill="#7fff7f" font-size="36" font-weight="bold">25+</text>
  <text x="200" y="815" text-anchor="middle" fill="#aaa" font-size="12">Theorems Proved</text>

  <text x="400" y="790" text-anchor="middle" fill="#4a9eff" font-size="36" font-weight="bold">8</text>
  <text x="400" y="815" text-anchor="middle" fill="#aaa" font-size="12">Lean 4 Files</text>

  <text x="600" y="790" text-anchor="middle" fill="#ffd700" font-size="36" font-weight="bold">0</text>
  <text x="600" y="815" text-anchor="middle" fill="#aaa" font-size="12">Remaining Sorries</text>

  <text x="800" y="790" text-anchor="middle" fill="#ff6bff" font-size="36" font-weight="bold">30+</text>
  <text x="800" y="815" text-anchor="middle" fill="#aaa" font-size="12">Open Problems</text>

  <text x="1000" y="790" text-anchor="middle" fill="#ff9f43" font-size="36" font-weight="bold">6</text>
  <text x="1000" y="815" text-anchor="middle" fill="#aaa" font-size="12">Research Domains</text>

  <text x="600" y="845" text-anchor="middle" fill="#888" font-size="11">
    Lean 4 + Mathlib · Machine-Verified · Zero Axioms Beyond Propext, Choice, Quot.sound
  </text>
</svg>
