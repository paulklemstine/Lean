<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 550" font-family="Georgia, serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <text x="375" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">
    EML: The Arithmetic Sheffer Stroke
  </text>
  <text x="375" y="60" text-anchor="middle" font-size="14" fill="#888">
    eml(x, y) = eˣ − ln(y)  — One operator to generate all elementary functions
  </text>

  <!-- Main operator box -->
  <rect x="250" y="80" width="250" height="70" rx="12" fill="url(#g1)" stroke="#9b59b6" stroke-width="2"/>
  <text x="375" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#8e44ad">
    eml(x, y) = eˣ − ln(y)
  </text>
  <text x="375" y="135" text-anchor="middle" font-size="12" fill="#555">
    Non-commutative · Non-associative
  </text>

  <!-- Recovery tree -->
  <text x="375" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    What EML Generates
  </text>

  <!-- exp recovery -->
  <rect x="50" y="210" width="200" height="50" rx="8" fill="#ebf5fb" stroke="#3498db" stroke-width="1.5"/>
  <text x="150" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">Exponential</text>
  <text x="150" y="250" text-anchor="middle" font-size="12" fill="#555">eml(x, 1) = eˣ</text>

  <!-- log recovery -->
  <rect x="275" y="210" width="200" height="50" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/>
  <text x="375" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#d35400">Logarithm</text>
  <text x="375" y="250" text-anchor="middle" font-size="12" fill="#555">1 − eml(0, y) = ln(y)</text>

  <!-- constants -->
  <rect x="500" y="210" width="200" height="50" rx="8" fill="#eafaf1" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="600" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Constants</text>
  <text x="600" y="250" text-anchor="middle" font-size="12" fill="#555">eml(1,1) = e, eml(0,1) = 1</text>

  <!-- Second row: arithmetic -->
  <rect x="50" y="280" width="200" height="50" rx="8" fill="#f4ecf7" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="150" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e44ad">Addition</text>
  <text x="150" y="320" text-anchor="middle" font-size="11" fill="#555">x+y = ln(eˣ · eʸ)</text>

  <rect x="275" y="280" width="200" height="50" rx="8" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="375" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Multiplication</text>
  <text x="375" y="320" text-anchor="middle" font-size="11" fill="#555">x·y = exp(ln x + ln y)</text>

  <rect x="500" y="280" width="200" height="50" rx="8" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5"/>
  <text x="600" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#d4ac0d">Powers</text>
  <text x="600" y="320" text-anchor="middle" font-size="11" fill="#555">xⁿ = exp(n · ln x)</text>

  <!-- Bridge section -->
  <line x1="50" y1="360" x2="700" y2="360" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="375" y="390" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    Bridge to SPB
  </text>

  <!-- SPB via EML -->
  <rect x="100" y="410" width="250" height="60" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="225" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">SPB via exp/log</text>
  <text x="225" y="452" text-anchor="middle" font-size="12" fill="#555">spb(x,y) = exp(ln(x+y) − ln(1−xy))</text>
  <text x="225" y="465" text-anchor="middle" font-size="10" fill="#888">= eml(ln(x+y) − ln(1−xy), 1)</text>

  <!-- Bridge identity -->
  <rect x="380" y="410" width="280" height="60" rx="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
  <text x="520" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a085">Bridge Identity</text>
  <text x="520" y="455" text-anchor="middle" font-size="11" fill="#555">ln(1+spb²) = ln(1+x²) + ln(1+y²)</text>
  <text x="520" y="468" text-anchor="middle" font-size="11" fill="#555">                  − 2·ln|1−xy|</text>

  <!-- Bottom summary -->
  <rect x="100" y="490" width="560" height="45" rx="8" fill="#2c3e50" stroke="none"/>
  <text x="380" y="515" text-anchor="middle" font-size="14" fill="white" font-weight="bold">
    EML = Arithmetic World  ↔  SPB = Geometric World  ↔  Together = Everything
  </text>
</svg>
