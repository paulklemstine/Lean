<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Georgia', serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="700" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffd700" font-size="24" font-weight="bold">
    SPB Group Structure: (ℝ, spb) ≅ (S¹, ·)
  </text>

  <!-- Left side: Real line with SPB -->
  <g transform="translate(220, 350)">
    <!-- Real line -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#4488cc" stroke-width="2"/>
    <text x="0" y="-120" text-anchor="middle" fill="#66aaff" font-size="18" font-weight="bold">
      (ℝ ∪ {∞}, spb)
    </text>
    <text x="0" y="-95" text-anchor="middle" fill="#8899bb" font-size="13">
      The Real Line with SPB Operation
    </text>

    <!-- Points on real line -->
    <circle cx="-150" cy="0" r="5" fill="#ff6644"/>
    <text x="-150" y="22" text-anchor="middle" fill="#ff8866" font-size="12">−tan α</text>
    <circle cx="0" cy="0" r="6" fill="#44ff44"/>
    <text x="0" y="22" text-anchor="middle" fill="#66ff66" font-size="12">0 (identity)</text>
    <circle cx="100" cy="0" r="5" fill="#4488ff"/>
    <text x="100" y="22" text-anchor="middle" fill="#66aaff" font-size="12">tan α</text>
    <circle cx="150" cy="0" r="5" fill="#ff44ff"/>
    <text x="150" y="22" text-anchor="middle" fill="#ff66ff" font-size="12">tan β</text>

    <!-- SPB operation shown -->
    <path d="M 100,-10 Q 125,-40 150,-10" fill="none" stroke="#ffdd44" stroke-width="1.5"/>
    <text x="125" y="-45" text-anchor="middle" fill="#ffdd44" font-size="11">spb</text>

    <!-- Group axioms -->
    <g transform="translate(0, 80)">
      <text x="-160" y="0" fill="#ffffff" font-size="13">✓ Commutative: spb(x,y) = spb(y,x)</text>
      <text x="-160" y="22" fill="#ffffff" font-size="13">✓ Identity: spb(x, 0) = x</text>
      <text x="-160" y="44" fill="#ffffff" font-size="13">✓ Inverse: spb(x, −x) = 0</text>
      <text x="-160" y="66" fill="#ffffff" font-size="13">✓ Associative: spb(spb(x,y), z) = spb(x, spb(y,z))</text>
    </g>
  </g>

  <!-- Right side: Unit circle -->
  <g transform="translate(680, 330)">
    <!-- Circle -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#44cc88" stroke-width="2"/>
    <text x="0" y="-145" text-anchor="middle" fill="#66ffaa" font-size="18" font-weight="bold">
      (S¹, ·)
    </text>
    <text x="0" y="-128" text-anchor="middle" fill="#88bbaa" font-size="13">
      The Unit Circle
    </text>

    <!-- Points on circle -->
    <circle cx="120" cy="0" r="6" fill="#44ff44"/>
    <text x="140" y="5" fill="#66ff66" font-size="12">1</text>

    <!-- Point at angle alpha -->
    <circle cx="84.85" cy="-84.85" r="5" fill="#4488ff"/>
    <text x="98" y="-90" fill="#66aaff" font-size="12">e^{iα}</text>

    <!-- Point at angle beta -->
    <circle cx="0" cy="-120" r="5" fill="#ff44ff"/>
    <text x="15" y="-125" fill="#ff66ff" font-size="12">e^{iβ}</text>

    <!-- Point at angle alpha+beta -->
    <circle cx="-84.85" cy="-84.85" r="5" fill="#ffdd44"/>
    <text x="-105" y="-90" fill="#ffdd44" font-size="12">e^{i(α+β)}</text>

    <!-- Angle arc for alpha -->
    <path d="M 40,0 A 40,40 0 0 0 28.28,-28.28" fill="none" stroke="#4488ff" stroke-width="1.5"/>
    <text x="45" y="-15" fill="#4488ff" font-size="10">α</text>

    <!-- Multiplication shown -->
    <text x="0" y="155" text-anchor="middle" fill="#aaaacc" font-size="12">
      Multiplication on S¹ = angle addition
    </text>
  </g>

  <!-- Cayley Transform Arrow -->
  <g transform="translate(450, 280)">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#ffd700" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="0" y="-15" text-anchor="middle" fill="#ffd700" font-size="15" font-weight="bold">
      Cayley Transform
    </text>
    <text x="0" y="20" text-anchor="middle" fill="#ddbb44" font-size="12">
      C(x) = (1+ix)/(1−ix)
    </text>
    <text x="0" y="40" text-anchor="middle" fill="#ddbb44" font-size="12">
      |C(x)| = 1 ∀ x ∈ ℝ
    </text>
  </g>

  <!-- Intertwining property -->
  <rect x="280" y="560" width="340" height="60" rx="10" fill="#1a2a1a" stroke="#44cc88" stroke-width="2"/>
  <text x="450" y="585" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">
    C(spb(x, y)) = C(x) · C(y)
  </text>
  <text x="450" y="607" text-anchor="middle" fill="#88ccaa" font-size="13">
    Group Homomorphism (Intertwining Property)
  </text>

  <!-- Verified badge -->
  <g transform="translate(450, 660)">
    <rect x="-130" y="-15" width="260" height="30" rx="15" fill="#1a3a1a" stroke="#44cc44" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#44ff44" font-size="13">
      ✓ All properties formally verified in Lean 4
    </text>
  </g>
</svg>
