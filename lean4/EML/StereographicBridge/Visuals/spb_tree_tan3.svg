<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="Georgia, serif">
  <rect width="500" height="300" fill="#fafafa" rx="10"/>
  
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    SPB Tree: tan(3θ) = spb(tan θ, spb(tan θ, tan θ))
  </text>
  
  <!-- Root node -->
  <circle cx="250" cy="70" r="25" fill="#8e44ad"/>
  <text x="250" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="white">spb</text>
  
  <!-- Left child (leaf) -->
  <circle cx="150" cy="160" r="22" fill="#3498db"/>
  <text x="150" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="white">tan θ</text>
  
  <!-- Right child (internal) -->
  <circle cx="350" cy="160" r="25" fill="#8e44ad"/>
  <text x="350" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="white">spb</text>
  
  <!-- Right-left grandchild -->
  <circle cx="290" cy="250" r="22" fill="#3498db"/>
  <text x="290" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="white">tan θ</text>
  
  <!-- Right-right grandchild -->
  <circle cx="410" cy="250" r="22" fill="#3498db"/>
  <text x="410" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="white">tan θ</text>
  
  <!-- Edges -->
  <line x1="230" y1="88" x2="165" y2="142" stroke="#2c3e50" stroke-width="2"/>
  <line x1="270" y1="88" x2="335" y2="142" stroke="#2c3e50" stroke-width="2"/>
  <line x1="333" y1="180" x2="305" y2="232" stroke="#2c3e50" stroke-width="2"/>
  <line x1="367" y1="180" x2="395" y2="232" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Formula -->
  <text x="250" y="290" text-anchor="middle" font-size="12" fill="#7f8c8d">
    Result: (3tan θ − tan³θ) / (1 − 3tan²θ) = tan(3θ) via Chebyshev
  </text>
</svg>
