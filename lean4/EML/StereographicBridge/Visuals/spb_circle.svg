<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Georgia, serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3498db"/>
    </marker>
  </defs>

  <text x="350" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">
    SPB as Circle Group Multiplication via Cayley Transform
  </text>

  <!-- Real line (left) -->
  <g transform="translate(120, 280)">
    <text x="0" y="-130" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">
      Real Line ℝ
    </text>
    <text x="0" y="-110" text-anchor="middle" font-size="12" fill="#888">
      SPB group: (x+y)/(1−xy)
    </text>

    <!-- Horizontal line -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#333" stroke-width="1.5"/>

    <!-- Tick marks and points -->
    <line x1="-80" y1="-5" x2="-80" y2="5" stroke="#333" stroke-width="1"/>
    <text x="-80" y="20" text-anchor="middle" font-size="10" fill="#555">−2</text>

    <line x1="-40" y1="-5" x2="-40" y2="5" stroke="#333" stroke-width="1"/>
    <text x="-40" y="20" text-anchor="middle" font-size="10" fill="#555">−1</text>

    <circle cx="0" cy="0" r="5" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
    <text x="0" y="20" text-anchor="middle" font-size="10" fill="#2ecc71" font-weight="bold">0 (id)</text>

    <line x1="40" y1="-5" x2="40" y2="5" stroke="#333" stroke-width="1"/>
    <text x="40" y="20" text-anchor="middle" font-size="10" fill="#555">1</text>

    <line x1="80" y1="-5" x2="80" y2="5" stroke="#333" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" font-size="10" fill="#555">2</text>

    <!-- Points x and y -->
    <circle cx="25" cy="0" r="6" fill="#e74c3c" opacity="0.8"/>
    <text x="25" y="-12" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">x</text>

    <circle cx="55" cy="0" r="6" fill="#3498db" opacity="0.8"/>
    <text x="55" y="-12" text-anchor="middle" font-size="11" fill="#3498db" font-weight="bold">y</text>

    <!-- spb(x,y) result -->
    <circle cx="85" cy="0" r="6" fill="#9b59b6" opacity="0.8"/>
    <text x="85" y="-12" text-anchor="middle" font-size="11" fill="#9b59b6" font-weight="bold">spb</text>
  </g>

  <!-- Arrow between -->
  <g transform="translate(300, 250)">
    <path d="M 0,0 C 30,-20 60,-20 90,0" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="45" y="-25" text-anchor="middle" font-size="12" fill="#f39c12" font-weight="bold">
      Cayley
    </text>
    <text x="45" y="-10" text-anchor="middle" font-size="10" fill="#f39c12">
      C(t) = (1+it)/(1−it)
    </text>

    <path d="M 90,30 C 60,50 30,50 0,30" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="45" y="55" text-anchor="middle" font-size="10" fill="#f39c12">
      C⁻¹(z) = i(1−z)/(1+z)
    </text>
  </g>

  <!-- Unit circle (right) -->
  <g transform="translate(520, 260)">
    <text x="0" y="-155" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db">
      Unit Circle S¹
    </text>
    <text x="0" y="-135" text-anchor="middle" font-size="12" fill="#888">
      Multiplication: z₁ · z₂
    </text>

    <circle cx="0" cy="0" r="100" fill="none" stroke="#333" stroke-width="1.5"/>

    <!-- Axes -->
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#ddd" stroke-width="0.5"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#ddd" stroke-width="0.5"/>

    <!-- Identity point (1,0) -->
    <circle cx="100" cy="0" r="5" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
    <text x="115" y="5" font-size="10" fill="#2ecc71" font-weight="bold">1</text>

    <!-- C(x) point -->
    <circle cx="72" cy="-69" r="6" fill="#e74c3c" opacity="0.8"/>
    <text x="85" y="-75" font-size="11" fill="#e74c3c" font-weight="bold">C(x)</text>

    <!-- C(y) point -->
    <circle cx="28" cy="-96" r="6" fill="#3498db" opacity="0.8"/>
    <text x="15" y="-105" font-size="11" fill="#3498db" font-weight="bold">C(y)</text>

    <!-- C(spb) = C(x)·C(y) point -->
    <circle cx="-42" cy="-91" r="6" fill="#9b59b6" opacity="0.8"/>
    <text x="-70" y="-95" font-size="11" fill="#9b59b6" font-weight="bold">C(x)·C(y)</text>

    <!-- Angle arcs -->
    <path d="M 40,0 A 40,40 0 0,0 29,-28" stroke="#e74c3c" stroke-width="1.5" fill="none"/>
    <text x="45" y="-15" font-size="9" fill="#e74c3c">2arctan(x)</text>

    <path d="M 29,-28 A 40,40 0 0,0 -17,-36" stroke="#3498db" stroke-width="1.5" fill="none"/>
    <text x="20" y="-42" font-size="9" fill="#3498db">2arctan(y)</text>
  </g>

  <!-- Key formulas -->
  <rect x="50" y="380" width="600" height="100" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="350" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    The Fundamental Correspondence
  </text>
  <text x="350" y="430" text-anchor="middle" font-size="13" fill="#555">
    C(spb(x, y)) = C(x) · C(y)     ←  SPB becomes multiplication on S¹
  </text>
  <text x="350" y="455" text-anchor="middle" font-size="13" fill="#555">
    arctan(spb(x, y)) = arctan(x) + arctan(y)     ←  arctan is the group logarithm
  </text>
  <text x="350" y="475" text-anchor="middle" font-size="12" fill="#888" font-style="italic">
    (valid when xy &lt; 1, i.e., arctan(x) + arctan(y) ∈ (−π/2, π/2))
  </text>
</svg>
