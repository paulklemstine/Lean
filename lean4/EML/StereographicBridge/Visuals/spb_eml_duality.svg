<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bgd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2640;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bgd)"/>

  <text x="450" y="45" text-anchor="middle" fill="#ffd700" font-size="28" font-weight="bold">
    EML ⊕ SPB: The Dual Operator System
  </text>
  <text x="450" y="75" text-anchor="middle" fill="#aaccff" font-size="14">
    Two operations that together span arithmetic and geometry
  </text>

  <!-- EML Box -->
  <rect x="40" y="110" width="370" height="350" rx="20" fill="#1a1a3a" stroke="#6b8aff" stroke-width="2"/>
  <text x="225" y="150" text-anchor="middle" fill="#6b8aff" font-size="24" font-weight="bold">EML World</text>
  <text x="225" y="180" text-anchor="middle" fill="#fff" font-size="18">eml(x, y) = eˣ − ln y</text>

  <text x="70" y="220" fill="#cce0ff" font-size="13">• Bridges: Addition ↔ Multiplication</text>
  <text x="70" y="245" fill="#cce0ff" font-size="13">• Key transform: exp / log</text>
  <text x="70" y="270" fill="#cce0ff" font-size="13">• Structure: Non-commutative</text>
  <text x="70" y="295" fill="#cce0ff" font-size="13">• Generates: eml(x,1) = eˣ</text>
  <text x="70" y="320" fill="#cce0ff" font-size="13">• Group: (ℝ₊, ×) via exp</text>
  <text x="70" y="345" fill="#cce0ff" font-size="13">• Domain: Arithmetic</text>

  <text x="225" y="390" text-anchor="middle" fill="#888" font-size="12">
    exp(a+b) = exp(a) · exp(b)
  </text>
  <text x="225" y="415" text-anchor="middle" fill="#888" font-size="12">
    log(a·b) = log(a) + log(b)
  </text>
  <text x="225" y="440" text-anchor="middle" fill="#6b8aff" font-size="13">Growth · Decay · Scaling</text>

  <!-- SPB Box -->
  <rect x="490" y="110" width="370" height="350" rx="20" fill="#1a3a1a" stroke="#6bff8a" stroke-width="2"/>
  <text x="675" y="150" text-anchor="middle" fill="#6bff8a" font-size="24" font-weight="bold">SPB World</text>
  <text x="675" y="180" text-anchor="middle" fill="#fff" font-size="18">spb(x, y) = (x+y)/(1−xy)</text>

  <text x="520" y="220" fill="#ccffcc" font-size="13">• Bridges: Euclidean ↔ Spherical</text>
  <text x="520" y="245" fill="#ccffcc" font-size="13">• Key transform: Cayley / stereographic</text>
  <text x="520" y="270" fill="#ccffcc" font-size="13">• Structure: Commutative (abelian)</text>
  <text x="520" y="295" fill="#ccffcc" font-size="13">• Generates: tan(α+β) from tan α, tan β</text>
  <text x="520" y="320" fill="#ccffcc" font-size="13">• Group: (S¹, ×) via Cayley</text>
  <text x="520" y="345" fill="#ccffcc" font-size="13">• Domain: Geometry</text>

  <text x="675" y="390" text-anchor="middle" fill="#888" font-size="12">
    tan(α+β) = spb(tan α, tan β)
  </text>
  <text x="675" y="415" text-anchor="middle" fill="#888" font-size="12">
    arctan(spb(x,y)) = arctan x + arctan y
  </text>
  <text x="675" y="440" text-anchor="middle" fill="#6bff8a" font-size="13">Rotations · Boosts · Angles</text>

  <!-- Bridge Arrow -->
  <line x1="410" y1="285" x2="490" y2="285" stroke="#ffd700" stroke-width="3"/>
  <polygon points="487,278 497,285 487,292" fill="#ffd700"/>
  <polygon points="413,278 403,285 413,292" fill="#ffd700"/>
  <text x="450" y="275" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">DUAL</text>

  <!-- Bottom: Conjecture -->
  <rect x="150" y="490" width="600" height="80" rx="15" fill="#2a2a0a" stroke="#ffd700" stroke-width="2"/>
  <text x="450" y="520" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold">
    Conjecture: EML + SPB = Universal Algebraic Calculus
  </text>
  <text x="450" y="545" text-anchor="middle" fill="#ffe0a0" font-size="13">
    Every elementary function can be expressed as a composition of EML and SPB operations
  </text>
  <text x="450" y="565" text-anchor="middle" fill="#aaa" font-size="11">
    C'∘tan = exp(i·)  connects the two worlds
  </text>
</svg>
