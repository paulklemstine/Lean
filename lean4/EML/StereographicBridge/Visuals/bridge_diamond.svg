<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" font-family="Georgia, serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grad_add" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.25"/>
    </linearGradient>
    <linearGradient id="grad_spb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.25"/>
    </linearGradient>
    <linearGradient id="grad_mul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0.25"/>
    </linearGradient>
    <linearGradient id="grad_eml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:0.25"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">
    The SPB–EML Bridge Diamond
  </text>
  <text x="400" y="65" text-anchor="middle" font-size="13" fill="#7f8c8d" font-style="italic">
    Four algebraic structures connected by natural homomorphisms
  </text>

  <!-- Arrows (drawn first, behind nodes) -->
  <!-- SPB → Addition (arctan) -->
  <line x1="215" y1="295" x2="330" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="210" width="70" height="22" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="255" y="226" text-anchor="middle" font-size="12" fill="#555" font-style="italic">arctan</text>

  <!-- Addition → Multiplication (exp) -->
  <line x1="470" y1="170" x2="585" y2="295" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="210" width="45" height="22" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="522" y="226" text-anchor="middle" font-size="12" fill="#555" font-style="italic">exp</text>

  <!-- SPB → Multiplication (exp∘arctan) -->
  <line x1="260" y1="330" x2="540" y2="330" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <rect x="340" y="310" width="105" height="22" rx="4" fill="white" stroke="#e67e22" stroke-width="1"/>
  <text x="392" y="326" text-anchor="middle" font-size="12" fill="#e67e22" font-weight="bold">exp ∘ arctan</text>

  <!-- EML → SPB -->
  <line x1="330" y1="490" x2="215" y2="385" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="218" y="430" width="100" height="22" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="268" y="446" text-anchor="middle" font-size="11" fill="#555" font-style="italic">arctan∘eml</text>

  <!-- EML → Multiplication -->
  <line x1="470" y1="490" x2="585" y2="385" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="505" y="430" width="45" height="22" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="527" y="446" text-anchor="middle" font-size="12" fill="#555" font-style="italic">exp</text>

  <!-- Nodes -->
  <!-- Addition node (top) -->
  <ellipse cx="400" cy="140" rx="85" ry="50" fill="url(#grad_add)" stroke="#3498db" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="400" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">(ℝ, +)</text>
  <text x="400" y="152" text-anchor="middle" font-size="12" fill="#555">Addition</text>

  <!-- SPB node (left) -->
  <ellipse cx="160" cy="330" rx="95" ry="55" fill="url(#grad_spb)" stroke="#e74c3c" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="160" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">(ℝ, spb)</text>
  <text x="160" y="338" text-anchor="middle" font-size="11" fill="#555">Stereographic</text>
  <text x="160" y="355" text-anchor="middle" font-size="10" fill="#888">(x+y)/(1−xy)</text>

  <!-- Multiplication node (right) -->
  <ellipse cx="640" cy="330" rx="95" ry="55" fill="url(#grad_mul)" stroke="#2ecc71" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="640" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">(ℝ₊, ×)</text>
  <text x="640" y="338" text-anchor="middle" font-size="12" fill="#555">Multiplication</text>

  <!-- EML node (bottom) -->
  <ellipse cx="400" cy="510" rx="85" ry="50" fill="url(#grad_eml)" stroke="#9b59b6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="400" y="502" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">(ℝ, eml)</text>
  <text x="400" y="522" text-anchor="middle" font-size="12" fill="#555">Exp-Minus-Log</text>
  <text x="400" y="540" text-anchor="middle" font-size="10" fill="#888">eˣ − ln(y)</text>

  <!-- Key Identity Box -->
  <rect x="150" y="580" width="500" height="55" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="400" y="600" text-anchor="middle" font-size="13" font-weight="bold" fill="#d35400">
    Bridge Identity
  </text>
  <text x="400" y="620" text-anchor="middle" font-size="12" fill="#555">
    ln(1 + spb(x,y)²) = ln(1+x²) + ln(1+y²) − 2·ln|1−xy|
  </text>
</svg>
