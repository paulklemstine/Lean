<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#ffd700" font-size="26" font-weight="bold">
    Wick Rotation: The Circular ↔ Hyperbolic Bridge
  </text>

  <!-- Left: Circular World -->
  <rect x="30" y="70" width="430" height="480" rx="15" fill="#0a1a2e" stroke="#4488ff" stroke-width="2" opacity="0.8"/>
  <text x="245" y="100" text-anchor="middle" fill="#4488ff" font-size="22" font-weight="bold">Circular (Euclidean)</text>

  <!-- Circle -->
  <circle cx="245" cy="220" r="80" fill="none" stroke="#4488ff" stroke-width="2"/>
  <text x="245" y="175" text-anchor="middle" fill="#4488ff" font-size="14">S¹: unit circle</text>
  <!-- Angle arc -->
  <path d="M 325 220 A 80 80 0 0 0 285 158" fill="none" stroke="#ffd700" stroke-width="2"/>
  <text x="325" y="185" fill="#ffd700" font-size="12">θ</text>
  <!-- Point on circle -->
  <circle cx="285" cy="158" r="4" fill="#ffd700"/>

  <!-- Circular formulas -->
  <text x="245" y="330" text-anchor="middle" fill="#88bbff" font-size="15" font-weight="bold">
    spb(x,y) = (x+y)/(1−xy)
  </text>
  <text x="245" y="360" text-anchor="middle" fill="#6699cc" font-size="13">
    tan(α+β) = spb(tan α, tan β)
  </text>
  <text x="245" y="385" text-anchor="middle" fill="#6699cc" font-size="13">
    tan(nθ) = spbⁿ(tan θ)
  </text>
  <text x="245" y="415" text-anchor="middle" fill="#6699cc" font-size="13">
    C(x) = (1+ix)/(1−ix) ∈ S¹
  </text>
  <text x="245" y="445" text-anchor="middle" fill="#6699cc" font-size="13">
    sin²θ + cos²θ = 1
  </text>
  <text x="245" y="475" text-anchor="middle" fill="#88bbff" font-size="14" font-weight="bold">
    Oscillatory: e^(iθ)
  </text>
  <text x="245" y="500" text-anchor="middle" fill="#446688" font-size="12">
    Bounded orbits on S¹
  </text>
  <text x="245" y="525" text-anchor="middle" fill="#446688" font-size="12">
    Geometry: Euclidean rotations
  </text>

  <!-- Right: Hyperbolic World -->
  <rect x="540" y="70" width="430" height="480" rx="15" fill="#2a0a0e" stroke="#ff6644" stroke-width="2" opacity="0.8"/>
  <text x="755" y="100" text-anchor="middle" fill="#ff6644" font-size="22" font-weight="bold">Hyperbolic (Lorentzian)</text>

  <!-- Hyperbola -->
  <path d="M 680 170 Q 755 300 680 290" fill="none" stroke="#ff6644" stroke-width="2"/>
  <path d="M 830 170 Q 755 300 830 290" fill="none" stroke="#ff6644" stroke-width="2"/>
  <text x="755" y="165" text-anchor="middle" fill="#ff6644" font-size="14">x²−y²=1</text>
  <!-- Rapidity arc -->
  <circle cx="710" cy="230" r="4" fill="#ffd700"/>
  <text x="690" y="225" fill="#ffd700" font-size="12">φ</text>

  <!-- Hyperbolic formulas -->
  <text x="755" y="330" text-anchor="middle" fill="#ffaa88" font-size="15" font-weight="bold">
    spbH(x,y) = (x+y)/(1+xy)
  </text>
  <text x="755" y="360" text-anchor="middle" fill="#cc8866" font-size="13">
    tanh(α+β) = spbH(tanh α, tanh β)
  </text>
  <text x="755" y="385" text-anchor="middle" fill="#cc8866" font-size="13">
    v₁⊕v₂ = spbH(v₁, v₂) [Einstein]
  </text>
  <text x="755" y="415" text-anchor="middle" fill="#cc8866" font-size="13">
    |v| &lt; c ⇒ |v₁⊕v₂| &lt; c
  </text>
  <text x="755" y="445" text-anchor="middle" fill="#cc8866" font-size="13">
    cosh²φ − sinh²φ = 1
  </text>
  <text x="755" y="475" text-anchor="middle" fill="#ffaa88" font-size="14" font-weight="bold">
    Exponential: e^φ
  </text>
  <text x="755" y="500" text-anchor="middle" fill="#886644" font-size="12">
    Unbounded orbits on ℝ
  </text>
  <text x="755" y="525" text-anchor="middle" fill="#886644" font-size="12">
    Geometry: Lorentz boosts
  </text>

  <!-- Wick rotation arrow (center) -->
  <rect x="440" y="180" width="120" height="220" rx="10" fill="#1a0a1e" stroke="#aa66ff" stroke-width="2"/>
  <text x="500" y="210" text-anchor="middle" fill="#aa66ff" font-size="16" font-weight="bold">Wick</text>
  <text x="500" y="230" text-anchor="middle" fill="#aa66ff" font-size="16" font-weight="bold">Rotation</text>

  <!-- Arrows -->
  <text x="500" y="265" text-anchor="middle" fill="#cc88ff" font-size="14">θ → iφ</text>
  <text x="500" y="290" text-anchor="middle" fill="#cc88ff" font-size="14">1−xy → 1+xy</text>
  <text x="500" y="315" text-anchor="middle" fill="#cc88ff" font-size="14">tan → tanh</text>
  <text x="500" y="340" text-anchor="middle" fill="#cc88ff" font-size="14">sin → sinh</text>
  <text x="500" y="365" text-anchor="middle" fill="#cc88ff" font-size="14">cos → cosh</text>

  <!-- Arrow heads -->
  <path d="M 460 280 L 445 280 L 455 270" fill="none" stroke="#4488ff" stroke-width="2"/>
  <path d="M 540 280 L 555 280 L 545 270" fill="none" stroke="#ff6644" stroke-width="2"/>

  <!-- Bottom: Key insight -->
  <text x="500" y="580" text-anchor="middle" fill="#ffd700" font-size="14" font-style="italic">
    "The same algebra, two geometries — connected by a single sign flip"
  </text>
</svg>
