<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Georgia, serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <rect width="800" height="450" fill="#fafafa" rx="10"/>
  
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">
    Wick Rotation: Circular ↔ Hyperbolic Duality
  </text>
  
  <!-- Circular side -->
  <rect x="30" y="60" width="340" height="350" fill="#ebf5fb" rx="15" stroke="#3498db" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#2980b9">CIRCULAR</text>
  <text x="200" y="110" text-anchor="middle" font-size="14" fill="#2980b9">SPB(x,y) = (x+y)/(1−xy)</text>
  
  <!-- Circle illustration -->
  <circle cx="200" cy="200" r="60" fill="none" stroke="#3498db" stroke-width="2"/>
  <circle cx="200" cy="200" r="3" fill="#2c3e50"/>
  <!-- Orbit points -->
  <circle cx="260" cy="200" r="4" fill="#e74c3c"/>
  <circle cx="218" cy="143" r="4" fill="#e74c3c"/>
  <circle cx="158" cy="156" r="4" fill="#e74c3c"/>
  <circle cx="148" cy="223" r="4" fill="#e74c3c"/>
  <circle cx="242" cy="247" r="4" fill="#e74c3c"/>
  <!-- Connecting lines (pentagon) -->
  <polygon points="260,200 218,143 158,156 148,223 242,247" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <text x="200" y="290" text-anchor="middle" font-size="13" fill="#2c3e50">Compact orbits (periodic)</text>
  <text x="200" y="310" text-anchor="middle" font-size="13" fill="#2c3e50">tan(α+β) = SPB(tan α, tan β)</text>
  <text x="200" y="335" text-anchor="middle" font-size="13" fill="#2c3e50">Chebyshev polynomials Tₙ</text>
  <text x="200" y="360" text-anchor="middle" font-size="13" fill="#2c3e50">Signal processing (phase)</text>
  <text x="200" y="385" text-anchor="middle" font-size="13" fill="#2c3e50">Elliptic geometry</text>
  
  <!-- Hyperbolic side -->
  <rect x="430" y="60" width="340" height="350" fill="#fef5e7" rx="15" stroke="#e67e22" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#d35400">HYPERBOLIC</text>
  <text x="600" y="110" text-anchor="middle" font-size="14" fill="#d35400">SPB_H(x,y) = (x+y)/(1+xy)</text>
  
  <!-- Hyperbola illustration -->
  <line x1="500" y1="250" x2="700" y2="250" stroke="#ccc" stroke-width="1"/>
  <line x1="600" y1="150" x2="600" y2="260" stroke="#ccc" stroke-width="1"/>
  <!-- Hyperbola branches -->
  <path d="M520,160 Q560,230 520,250" fill="none" stroke="#e67e22" stroke-width="2"/>
  <path d="M680,160 Q640,230 680,250" fill="none" stroke="#e67e22" stroke-width="2"/>
  <!-- Light cone -->
  <line x1="600" y1="150" x2="520" y2="250" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="600" y1="150" x2="680" y2="250" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="515" y="148" font-size="10" fill="#e74c3c">v=−c</text>
  <text x="670" y="148" font-size="10" fill="#e74c3c">v=+c</text>
  
  <!-- Converging orbits -->
  <circle cx="580" cy="200" r="3" fill="#27ae60"/>
  <circle cx="590" cy="210" r="3" fill="#27ae60"/>
  <circle cx="595" cy="218" r="3" fill="#27ae60"/>
  <circle cx="598" cy="224" r="3" fill="#27ae60"/>
  
  <text x="600" y="290" text-anchor="middle" font-size="13" fill="#2c3e50">Open orbits (convergent)</text>
  <text x="600" y="310" text-anchor="middle" font-size="13" fill="#2c3e50">v₁⊕v₂ = SPB_H(v₁, v₂)</text>
  <text x="600" y="335" text-anchor="middle" font-size="13" fill="#2c3e50">Rapidity addition</text>
  <text x="600" y="360" text-anchor="middle" font-size="13" fill="#2c3e50">Special relativity</text>
  <text x="600" y="385" text-anchor="middle" font-size="13" fill="#2c3e50">Hyperbolic geometry</text>
  
  <!-- Wick rotation arrow -->
  <rect x="340" y="180" width="120" height="60" fill="#f5eef8" rx="8" stroke="#8e44ad" stroke-width="2"/>
  <text x="400" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e44ad">Wick</text>
  <text x="400" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e44ad">Rotation</text>
  <text x="400" y="235" text-anchor="middle" font-size="12" fill="#8e44ad">t → it</text>
  
  <line x1="370" y1="168" x2="370" y2="182" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="168" x2="430" y2="182" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="370" y1="252" x2="370" y2="240" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="252" x2="430" y2="240" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Bottom formula -->
  <text x="400" y="435" text-anchor="middle" font-size="14" fill="#2c3e50">
    Sign flip (1−xy) ↔ (1+xy) unifies trigonometry and special relativity
  </text>
</svg>
