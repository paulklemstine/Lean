<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bgE)"/>

  <text x="450" y="35" text-anchor="middle" font-family="Georgia" font-size="22" fill="#FFD700">
    Einstein Velocity Addition = Hyperbolic SPB
  </text>

  <!-- Axes -->
  <g transform="translate(100, 60)">
    <!-- Grid -->
    <rect x="0" y="0" width="350" height="350" fill="none" stroke="#333" stroke-width="1"/>

    <!-- Grid lines -->
    <line x1="0" y1="87.5" x2="350" y2="87.5" stroke="#333" stroke-width="0.5"/>
    <line x1="0" y1="175" x2="350" y2="175" stroke="#333" stroke-width="0.5"/>
    <line x1="0" y1="262.5" x2="350" y2="262.5" stroke="#333" stroke-width="0.5"/>
    <line x1="87.5" y1="0" x2="87.5" y2="350" stroke="#333" stroke-width="0.5"/>
    <line x1="175" y1="0" x2="175" y2="350" stroke="#333" stroke-width="0.5"/>
    <line x1="262.5" y1="0" x2="262.5" y2="350" stroke="#333" stroke-width="0.5"/>

    <!-- Galilean line: v_total = v1 + 0.5 -->
    <line x1="0" y1="175" x2="175" y2="0" stroke="#4FC3F7" stroke-width="2.5" stroke-dasharray="8,4"/>
    <text x="80" y="60" font-family="Georgia" font-size="12" fill="#4FC3F7" transform="rotate(-45 80 60)">Galilean: v₁ + v₂</text>

    <!-- Speed of light line -->
    <line x1="0" y1="0" x2="350" y2="0" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="355" y="5" font-family="Georgia" font-size="12" fill="#FFD700">c = 1</text>

    <!-- Einstein curve for v2 = 0.5: v = (v1 + 0.5)/(1 + 0.5*v1) -->
    <!-- Points: v1=0→0.5, v1=0.25→0.667, v1=0.5→0.8, v1=0.75→0.909, v1=1→1 -->
    <path d="M 0 175 Q 87.5 80 175 70 Q 262.5 25 350 0" fill="none" stroke="#EF5350" stroke-width="3"/>
    <text x="250" y="50" font-family="Georgia" font-size="12" fill="#EF5350">Einstein: spbH(v₁, v₂)</text>

    <!-- Axes labels -->
    <text x="175" y="385" text-anchor="middle" font-family="Georgia" font-size="14" fill="#aaa">v₁ / c</text>
    <text x="-30" y="175" text-anchor="middle" font-family="Georgia" font-size="14" fill="#aaa" transform="rotate(-90 -30 175)">v_total / c</text>

    <!-- Tick marks -->
    <text x="0" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">0</text>
    <text x="87.5" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">0.25</text>
    <text x="175" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">0.5</text>
    <text x="262.5" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">0.75</text>
    <text x="350" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">1.0</text>

    <text x="-10" y="353" text-anchor="end" font-family="monospace" font-size="10" fill="#888">0</text>
    <text x="-10" y="265" text-anchor="end" font-family="monospace" font-size="10" fill="#888">0.25</text>
    <text x="-10" y="178" text-anchor="end" font-family="monospace" font-size="10" fill="#888">0.5</text>
    <text x="-10" y="90" text-anchor="end" font-family="monospace" font-size="10" fill="#888">0.75</text>
    <text x="-10" y="5" text-anchor="end" font-family="monospace" font-size="10" fill="#888">1.0</text>

    <!-- v2 = 0.5 label -->
    <text x="175" y="400" text-anchor="middle" font-family="Georgia" font-size="13" fill="#F48FB1" font-style="italic">
      v₂ = 0.5c
    </text>
  </g>

  <!-- Key formulas on the right -->
  <g transform="translate(530, 80)">
    <rect x="0" y="0" width="330" height="380" rx="12" fill="#0d1117" stroke="#FFD700" stroke-width="1.5" opacity="0.9"/>

    <text x="165" y="30" text-anchor="middle" font-family="Georgia" font-size="16" fill="#FFD700" font-weight="bold">
      Key Formulas
    </text>

    <text x="20" y="65" font-family="monospace" font-size="14" fill="#EF5350">
      v₁ ⊕ v₂ = (v₁+v₂)/(1+v₁v₂)
    </text>
    <text x="20" y="85" font-family="Georgia" font-size="11" fill="#aaa">
      Einstein velocity addition
    </text>

    <text x="20" y="120" font-family="monospace" font-size="14" fill="#4FC3F7">
      1 ⊕ v = 1 for all v
    </text>
    <text x="20" y="140" font-family="Georgia" font-size="11" fill="#aaa">
      Speed of light is invariant
    </text>

    <text x="20" y="175" font-family="monospace" font-size="14" fill="#81C784">
      v ⊕ (-v) = 0
    </text>
    <text x="20" y="195" font-family="Georgia" font-size="11" fill="#aaa">
      Velocity inversion
    </text>

    <text x="20" y="230" font-family="monospace" font-size="14" fill="#CE93D8">
      tanh(φ₁+φ₂) = spbH(tanh φ₁, tanh φ₂)
    </text>
    <text x="20" y="250" font-family="Georgia" font-size="11" fill="#aaa">
      Rapidity is additive
    </text>

    <text x="20" y="285" font-family="monospace" font-size="14" fill="#FF7043">
      |v₁|,|v₂| &lt; 1 ⟹ |v₁⊕v₂| &lt; 1
    </text>
    <text x="20" y="305" font-family="Georgia" font-size="11" fill="#aaa">
      Sub-luminal closure
    </text>

    <line x1="20" y1="325" x2="310" y2="325" stroke="#555" stroke-width="1"/>

    <text x="165" y="350" text-anchor="middle" font-family="Georgia" font-size="12" fill="#FFD700" font-style="italic">
      All proved in Lean 4
    </text>
    <text x="165" y="370" text-anchor="middle" font-family="Georgia" font-size="12" fill="#FFD700" font-style="italic">
      with Mathlib
    </text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="480" text-anchor="middle" font-family="Georgia" font-size="12" fill="#666">
    The difference between Newton and Einstein is a single sign: 1-xy → 1+xy (Wick rotation)
  </text>
</svg>
