<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Georgia, serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ecc71"/>
    </marker>
  </defs>

  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">
    SPB → EML Conversion: Step by Step
  </text>

  <!-- Step 1 -->
  <rect x="50" y="60" width="700" height="80" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="80" y="85" font-size="16" font-weight="bold" fill="#d35400">Step 1: Start with SPB</text>
  <text x="80" y="110" font-size="15" fill="#555">
    spb(x, y) = (x + y) / (1 − xy)
  </text>
  <text x="80" y="130" font-size="12" fill="#888">The geometric operation — tangent addition on the real line</text>

  <!-- Arrow -->
  <line x1="400" y1="140" x2="400" y2="165" stroke="#e74c3c" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <rect x="50" y="170" width="700" height="80" rx="8" fill="#ebf5fb" stroke="#3498db" stroke-width="1.5"/>
  <text x="80" y="195" font-size="16" font-weight="bold" fill="#2980b9">Step 2: Decompose via exp/log</text>
  <text x="80" y="220" font-size="15" fill="#555">
    spb(x, y) = exp( ln(x+y) − ln(1−xy) )
  </text>
  <text x="80" y="240" font-size="12" fill="#888">Express SPB as composition of exp and log — the EML building blocks</text>

  <!-- Arrow -->
  <line x1="400" y1="250" x2="400" y2="275" stroke="#3498db" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Step 3 -->
  <rect x="50" y="280" width="700" height="80" rx="8" fill="#eafaf1" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="80" y="305" font-size="16" font-weight="bold" fill="#27ae60">Step 3: Express in EML</text>
  <text x="80" y="330" font-size="15" fill="#555">
    spb(x, y) = eml( ln(x+y) − ln(1−xy),  1 )
  </text>
  <text x="80" y="350" font-size="12" fill="#888">Since eml(t, 1) = exp(t), any exp(·) is a single EML call</text>

  <!-- Arrow -->
  <line x1="400" y1="360" x2="400" y2="385" stroke="#2ecc71" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Step 4 -->
  <rect x="50" y="390" width="700" height="100" rx="8" fill="#f4ecf7" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="80" y="415" font-size="16" font-weight="bold" fill="#8e44ad">Step 4: Fully Expand in EML</text>
  <text x="80" y="440" font-size="14" fill="#555">
    ln(x+y) = 1 − eml(0, x+y)     and     ln(1−xy) = 1 − eml(0, 1−xy)
  </text>
  <text x="80" y="465" font-size="14" fill="#555">
    spb(x, y) = eml( eml(0, 1−xy) − eml(0, x+y),  1 )
  </text>
  <text x="80" y="485" font-size="12" fill="#888">Three EML operations convert any SPB into pure arithmetic</text>

  <!-- Simplification box -->
  <rect x="100" y="510" width="600" height="80" rx="10" fill="#2c3e50"/>
  <text x="400" y="535" text-anchor="middle" font-size="16" font-weight="bold" fill="#f1c40f">
    Simplified Bridge Formula
  </text>
  <text x="400" y="560" text-anchor="middle" font-size="15" fill="white">
    spb(x, y)  =  eml( eml(0, 1−xy) − eml(0, x+y),  1 )
  </text>
  <text x="400" y="580" text-anchor="middle" font-size="12" fill="#95a5a6">
    3 EML operations translate geometry into arithmetic
  </text>

  <!-- Verification -->
  <rect x="100" y="610" width="600" height="70" rx="8" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="400" y="635" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">
    ✓ Verified in Lean 4 with Mathlib
  </text>
  <text x="400" y="660" text-anchor="middle" font-size="12" fill="#555">
    Machine-checked proofs: norm identity, log bridge, exp∘arctan homomorphism, Cauchy entropy additivity
  </text>
</svg>
