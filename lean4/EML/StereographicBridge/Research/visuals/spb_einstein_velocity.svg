<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fefce8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff7ed;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="700" height="350" rx="12" fill="url(#bg6)" stroke="#94a3b8"/>

  <text x="350" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e293b" font-weight="bold">Circular SPB vs Hyperbolic SPB (Einstein)</text>
  <text x="350" y="50" text-anchor="middle" font-family="serif" font-size="13" fill="#64748b">One sign flip bridges trigonometry and relativity</text>

  <!-- Left: Circular -->
  <rect x="30" y="70" width="300" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e40af" font-weight="bold">Circular SPB</text>
  <text x="180" y="118" text-anchor="middle" font-family="serif" font-size="15" fill="#1e293b">spb(x,y) = (x+y)/(1<tspan font-weight="bold" fill="#dc2626">−</tspan>xy)</text>
  <text x="180" y="140" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">= tan(α+β) from tan α, tan β</text>
  <text x="180" y="158" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">Circle group S¹ via stereographic</text>
  <text x="180" y="176" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">Unbounded: spb(1,1) = ∞ (pole)</text>
  <text x="180" y="194" text-anchor="middle" font-family="serif" font-size="11" fill="#2563eb" font-style="italic">Curvature K = +1</text>

  <!-- Right: Hyperbolic -->
  <rect x="370" y="70" width="300" height="130" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#92400e" font-weight="bold">Hyperbolic SPB</text>
  <text x="520" y="118" text-anchor="middle" font-family="serif" font-size="15" fill="#1e293b">spbH(x,y) = (x+y)/(1<tspan font-weight="bold" fill="#16a34a">+</tspan>xy)</text>
  <text x="520" y="140" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">= Einstein velocity addition (c=1)</text>
  <text x="520" y="158" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">Hyperbolic group via Poincaré disk</text>
  <text x="520" y="176" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">Bounded: |spbH(v₁,v₂)| &lt; 1 always</text>
  <text x="520" y="194" text-anchor="middle" font-family="serif" font-size="11" fill="#f59e0b" font-style="italic">Curvature K = −1</text>

  <!-- Wick rotation arrow -->
  <path d="M 330 135 L 370 135" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="350" y="125" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="bold">y→iy</text>
  <path d="M 370 155 L 330 155" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <text x="350" y="170" text-anchor="middle" font-size="10" fill="#7c3aed">Wick</text>

  <!-- Comparison table -->
  <rect x="60" y="220" width="580" height="110" rx="8" fill="white" stroke="#cbd5e1"/>

  <text x="350" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e293b" font-weight="bold">Numerical Comparison: v₁ ⊕ v₂</text>

  <text x="120" y="268" text-anchor="middle" font-family="serif" font-size="12" fill="#64748b" font-weight="bold">v₁, v₂</text>
  <text x="250" y="268" text-anchor="middle" font-family="serif" font-size="12" fill="#64748b" font-weight="bold">Classical v₁+v₂</text>
  <text x="400" y="268" text-anchor="middle" font-family="serif" font-size="12" fill="#64748b" font-weight="bold">spbH(v₁,v₂)</text>
  <text x="540" y="268" text-anchor="middle" font-family="serif" font-size="12" fill="#64748b" font-weight="bold">Note</text>

  <line x1="70" y1="274" x2="630" y2="274" stroke="#e2e8f0"/>

  <text x="120" y="290" text-anchor="middle" font-size="12" fill="#1e293b">0.5, 0.5</text>
  <text x="250" y="290" text-anchor="middle" font-size="12" fill="#dc2626">1.000</text>
  <text x="400" y="290" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">0.800</text>
  <text x="540" y="290" text-anchor="middle" font-size="11" fill="#475569">20% slower</text>

  <text x="120" y="308" text-anchor="middle" font-size="12" fill="#1e293b">0.9, 0.9</text>
  <text x="250" y="308" text-anchor="middle" font-size="12" fill="#dc2626">1.800</text>
  <text x="400" y="308" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">0.994</text>
  <text x="540" y="308" text-anchor="middle" font-size="11" fill="#475569">Still &lt; c !</text>

  <text x="120" y="326" text-anchor="middle" font-size="12" fill="#1e293b">0.99, 0.99</text>
  <text x="250" y="326" text-anchor="middle" font-size="12" fill="#dc2626">1.980</text>
  <text x="400" y="326" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">0.99995</text>
  <text x="540" y="326" text-anchor="middle" font-size="11" fill="#475569">Can never reach 1</text>
</svg>
