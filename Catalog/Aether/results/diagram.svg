<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">Non-Archimedean Factoring Oracle</text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">Composite vs. Prime: The Factorability Divide</text>
  
  <!-- Number line region: Primes (red, unfactorable) -->
  <rect x="50" y="80" width="700" height="120" rx="6" fill="url(#primeGrad)" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="70" y="100" font-family="monospace" font-size="12" fill="#e74c3c" font-weight="bold">PRIMES (¬∃ a,b &gt; 1 : a·b = n)</text>
  
  <!-- Prime numbers -->
  <g font-family="monospace" font-size="16" fill="#c0392b" text-anchor="middle">
    <circle cx="120" cy="145" r="22" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="120" y="150">2</text>
    <circle cx="200" cy="145" r="22" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="200" y="150">3</text>
    <circle cx="280" cy="145" r="22" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="280" y="150">5</text>
    <circle cx="360" cy="145" r="22" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="360" y="150">7</text>
    <circle cx="440" cy="145" r="22" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="440" y="150">11</text>
    <circle cx="520" cy="145" r="22" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="520" y="150">13</text>
    <circle cx="620" cy="145" r="18" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="620" y="150" font-size="13">···</text>
  </g>
  <text x="700" y="190" font-family="Georgia, serif" font-size="11" fill="#e74c3c" text-anchor="end">✗ No oracle</text>
  
  <!-- Number line region: Composites (green, factorable) -->
  <rect x="50" y="220" width="700" height="160" rx="6" fill="url(#compGrad)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="70" y="240" font-family="monospace" font-size="12" fill="#27ae60" font-weight="bold">COMPOSITES (∃ a,b &gt; 1 : a·b = n)  ← THEOREM APPLIES HERE</text>
  
  <!-- Composite numbers with factorizations -->
  <g font-family="monospace" text-anchor="middle">
    <!-- n=4 -->
    <circle cx="120" cy="290" r="22" fill="#2ecc71" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="120" y="295" font-size="16" fill="#1e8449">4</text>
    <text x="120" y="330" font-size="10" fill="#27ae60">2 × 2</text>
    
    <!-- n=6 -->
    <circle cx="200" cy="290" r="22" fill="#2ecc71" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="200" y="295" font-size="16" fill="#1e8449">6</text>
    <text x="200" y="330" font-size="10" fill="#27ae60">2 × 3</text>
    
    <!-- n=8 -->
    <circle cx="280" cy="290" r="22" fill="#2ecc71" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="280" y="295" font-size="16" fill="#1e8449">8</text>
    <text x="280" y="330" font-size="10" fill="#27ae60">2 × 4</text>
    
    <!-- n=9 -->
    <circle cx="360" cy="290" r="22" fill="#2ecc71" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="360" y="295" font-size="16" fill="#1e8449">9</text>
    <text x="360" y="330" font-size="10" fill="#27ae60">3 × 3</text>
    
    <!-- n=10 -->
    <circle cx="440" cy="290" r="22" fill="#2ecc71" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="440" y="295" font-size="16" fill="#1e8449">10</text>
    <text x="440" y="330" font-size="10" fill="#27ae60">2 × 5</text>
    
    <!-- n=15 -->
    <circle cx="520" cy="290" r="22" fill="#2ecc71" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="520" y="295" font-size="16" fill="#1e8449">15</text>
    <text x="520" y="330" font-size="10" fill="#27ae60">3 × 5</text>
    
    <!-- ... -->
    <circle cx="620" cy="290" r="18" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="620" y="295" font-size="13" fill="#27ae60">···</text>
  </g>
  <text x="700" y="370" font-family="Georgia, serif" font-size="11" fill="#27ae60" text-anchor="end">✓ Oracle exists</text>
  
  <!-- Proof flow diagram -->
  <rect x="50" y="400" width="700" height="145" rx="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">Proof Structure</text>
  
  <!-- Step 1 -->
  <rect x="80" y="435" width="150" height="40" rx="4" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="1"/>
  <text x="155" y="450" text-anchor="middle" font-family="monospace" font-size="10" fill="#2c3e50">n &gt; 1 ∧ ¬Prime n</text>
  <text x="155" y="465" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f8c8d">(hypotheses)</text>
  
  <!-- Arrow 1→2 -->
  <line x1="230" y1="455" x2="280" y2="455" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="255" y="448" text-anchor="middle" font-family="monospace" font-size="8" fill="#7f8c8d">extract</text>
  
  <!-- Step 2 -->
  <rect x="280" y="435" width="150" height="40" rx="4" fill="#9b59b6" opacity="0.15" stroke="#9b59b6" stroke-width="1"/>
  <text x="355" y="450" text-anchor="middle" font-family="monospace" font-size="10" fill="#2c3e50">∃ k: k∣n, 2≤k&lt;n</text>
  <text x="355" y="465" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f8c8d">(exists_dvd_of_not_prime2)</text>
  
  <!-- Arrow 2→3 -->
  <line x1="430" y1="455" x2="480" y2="455" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="455" y="448" text-anchor="middle" font-family="monospace" font-size="8" fill="#7f8c8d">set</text>
  
  <!-- Step 3 -->
  <rect x="480" y="435" width="130" height="40" rx="4" fill="#e67e22" opacity="0.15" stroke="#e67e22" stroke-width="1"/>
  <text x="545" y="450" text-anchor="middle" font-family="monospace" font-size="10" fill="#2c3e50">a=k, b=n/k</text>
  <text x="545" y="465" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f8c8d">(construction)</text>
  
  <!-- Arrow 3→4 -->
  <line x1="610" y1="455" x2="640" y2="455" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4 -->
  <rect x="640" y="435" width="90" height="40" rx="4" fill="#27ae60" opacity="0.2" stroke="#27ae60" stroke-width="1.5"/>
  <text x="685" y="452" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e8449" font-weight="bold">a·b=n</text>
  <text x="685" y="465" text-anchor="middle" font-family="monospace" font-size="9" fill="#27ae60">a,b &gt; 1 ✓</text>
  
  <!-- Annotations -->
  <text x="155" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#e74c3c">Without ¬Prime n,</text>
  <text x="155" y="515" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#e74c3c">step 2 fails for primes!</text>
  
  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#555">
    Figure: The factoring oracle exists precisely for composite numbers. Primes are irreducible atoms.
  </text>
  <text x="400" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#999">
    The corrected theorem adds ¬Prime(n) to bridge the gap between existence and universality.
  </text>
</svg>
