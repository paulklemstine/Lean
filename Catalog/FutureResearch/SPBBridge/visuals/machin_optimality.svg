<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="Georgia, serif">
  <rect width="700" height="450" fill="#fafafa" rx="10"/>

  <text x="350" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">
    Euler's Machin Formula is Provably Optimal
  </text>

  <!-- The equation -->
  <rect x="100" y="55" width="500" height="50" rx="8" fill="#2c3e50" opacity="0.9"/>
  <text x="350" y="85" text-anchor="middle" font-size="16" fill="white">
    π/4 = arctan(1/2) + arctan(1/3)  ⟺  spb(1/2, 1/3) = 1
  </text>

  <!-- Proof tree -->
  <text x="350" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    Proof: The Unique 2-Leaf Machin Formula
  </text>

  <!-- Step 1 -->
  <rect x="50" y="155" width="600" height="40" rx="6" fill="#ebf5fb" stroke="#3498db" stroke-width="1"/>
  <text x="70" y="180" font-size="13" fill="#2c3e50">
    Step 1: spb(1/a, 1/b) = 1  ⟺  (1/a + 1/b) / (1 − 1/(ab)) = 1  ⟺  a + b = ab − 1
  </text>

  <!-- Step 2 -->
  <rect x="50" y="205" width="600" height="40" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1"/>
  <text x="70" y="230" font-size="13" fill="#2c3e50">
    Step 2: a + b = ab − 1  ⟺  (a − 1)(b − 1) = 2  [add 1 and factor]
  </text>

  <!-- Step 3 -->
  <rect x="50" y="255" width="600" height="40" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
  <text x="70" y="280" font-size="13" fill="#2c3e50">
    Step 3: 2 is prime, so factors (a−1)(b−1) = 1 × 2  [unique factorization]
  </text>

  <!-- Step 4 -->
  <rect x="50" y="305" width="600" height="40" rx="6" fill="#fdedec" stroke="#e74c3c" stroke-width="1"/>
  <text x="70" y="330" font-size="13" fill="#2c3e50">
    Step 4: a − 1 = 1, b − 1 = 2  ⟹  (a, b) = (2, 3)  ✓  [QED]
  </text>

  <!-- Conclusion box -->
  <rect x="100" y="365" width="500" height="65" rx="10" fill="#27ae60" opacity="0.9"/>
  <text x="350" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
    Theorem (Machine-Verified in Lean 4):
  </text>
  <text x="350" y="415" text-anchor="middle" font-size="13" fill="#d5f5e3">
    Euler's formula is the unique Machin formula with exactly 2 reciprocal leaves.
  </text>

  <!-- Arrow decoration -->
  <line x1="350" y1="195" x2="350" y2="205" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="350" y1="245" x2="350" y2="255" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="350" y1="295" x2="350" y2="305" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="350" y1="345" x2="350" y2="365" stroke="#7f8c8d" stroke-width="1.5"/>
</svg>
