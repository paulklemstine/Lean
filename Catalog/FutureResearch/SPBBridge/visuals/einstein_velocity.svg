<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#1a1a2e" rx="10"/>

  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="white">
    Einstein Velocity Addition = Hyperbolic SPB
  </text>

  <!-- Formula -->
  <text x="400" y="65" text-anchor="middle" font-size="16" fill="#bdc3c7">
    spbH(u, v) = (u + v) / (1 + uv)     [c = 1]
  </text>

  <!-- Chart area -->
  <g transform="translate(100, 90)">
    <!-- Axes -->
    <line x1="0" y1="250" x2="600" y2="250" stroke="white" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="250" stroke="white" stroke-width="1.5"/>

    <!-- Speed of light line -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#e74c3c" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="610" y="5" font-size="12" fill="#e74c3c">c = 1 (light)</text>

    <!-- Galilean line (u + v for v = 0.5) -->
    <line x1="0" y1="125" x2="600" y2="-125" stroke="#3498db" stroke-width="2" opacity="0.6"/>
    <text x="480" y="30" font-size="12" fill="#3498db">Galilean: u + 0.5</text>

    <!-- Einstein curve (spbH(u, 0.5) for u from 0 to 1) -->
    <!-- spbH(u, 0.5) = (u+0.5)/(1+0.5u) -->
    <!-- u=0: 0.5/1 = 0.5 → y=125 -->
    <!-- u=0.2: 0.7/1.1 = 0.636 → y=91 -->
    <!-- u=0.4: 0.9/1.2 = 0.75 → y=62.5 -->
    <!-- u=0.6: 1.1/1.3 = 0.846 → y=38.5 -->
    <!-- u=0.8: 1.3/1.4 = 0.929 → y=17.9 -->
    <!-- u=1.0: 1.5/1.5 = 1.0 → y=0 -->
    <polyline points="0,125 60,109 120,91 180,77 240,62.5 300,50 360,38.5 420,28.5 480,17.9 540,9 600,0"
             fill="none" stroke="#f39c12" stroke-width="3"/>
    <text x="500" y="60" font-size="12" fill="#f39c12" font-weight="bold">Einstein: spbH(u, 0.5)</text>

    <!-- Data points -->
    <circle cx="0" cy="125" r="4" fill="#f39c12"/>
    <circle cx="120" cy="91" r="4" fill="#f39c12"/>
    <circle cx="240" cy="62.5" r="4" fill="#f39c12"/>
    <circle cx="360" cy="38.5" r="4" fill="#f39c12"/>
    <circle cx="480" cy="17.9" r="4" fill="#f39c12"/>
    <circle cx="600" cy="0" r="4" fill="#f39c12"/>

    <!-- Y-axis labels -->
    <text x="-10" y="5" text-anchor="end" font-size="10" fill="#bdc3c7">1.0</text>
    <text x="-10" y="68" text-anchor="end" font-size="10" fill="#bdc3c7">0.75</text>
    <text x="-10" y="130" text-anchor="end" font-size="10" fill="#bdc3c7">0.5</text>
    <text x="-10" y="193" text-anchor="end" font-size="10" fill="#bdc3c7">0.25</text>
    <text x="-10" y="255" text-anchor="end" font-size="10" fill="#bdc3c7">0</text>

    <!-- X-axis labels -->
    <text x="0" y="270" text-anchor="middle" font-size="10" fill="#bdc3c7">0</text>
    <text x="120" y="270" text-anchor="middle" font-size="10" fill="#bdc3c7">0.2</text>
    <text x="240" y="270" text-anchor="middle" font-size="10" fill="#bdc3c7">0.4</text>
    <text x="360" y="270" text-anchor="middle" font-size="10" fill="#bdc3c7">0.6</text>
    <text x="480" y="270" text-anchor="middle" font-size="10" fill="#bdc3c7">0.8</text>
    <text x="600" y="270" text-anchor="middle" font-size="10" fill="#bdc3c7">1.0</text>

    <text x="300" y="295" text-anchor="middle" font-size="13" fill="white">
      First velocity u (in units of c)
    </text>
  </g>

  <!-- Insight -->
  <rect x="150" y="370" width="500" height="25" rx="5" fill="#27ae60" opacity="0.8"/>
  <text x="400" y="388" text-anchor="middle" font-size="13" fill="white">
    Theorem (Lean 4): |u| &lt; 1 ∧ |v| &lt; 1  ⟹  |spbH(u,v)| &lt; 1  ✓
  </text>
</svg>
