<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#162040"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#88aacc"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0c040"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <text x="400" y="40" text-anchor="middle" fill="#f0c040" font-size="24" font-weight="bold">
    The Conjugation Diamond
  </text>
  <text x="400" y="62" text-anchor="middle" fill="#8899bb" font-size="13">
    Four arithmetic operations from one: a ★ b = f(f⁻¹(a) + f⁻¹(b))
  </text>

  <!-- Diamond vertices -->
  <!-- Top: Addition (the universal operation) -->
  <circle cx="400" cy="130" r="50" fill="rgba(68,136,255,0.2)" stroke="#4488ff" stroke-width="2"/>
  <text x="400" y="125" text-anchor="middle" fill="#4488ff" font-size="18" font-weight="bold">a + b</text>
  <text x="400" y="145" text-anchor="middle" fill="#88aadd" font-size="12">(ℝ, +)</text>
  <text x="400" y="100" text-anchor="middle" fill="#6688aa" font-size="11">f = id</text>

  <!-- Left: Circular SPB -->
  <circle cx="150" cy="320" r="50" fill="rgba(255,102,68,0.2)" stroke="#ff6644" stroke-width="2"/>
  <text x="150" y="310" text-anchor="middle" fill="#ff6644" font-size="15" font-weight="bold">spb(a,b)</text>
  <text x="150" y="330" text-anchor="middle" fill="#dd8866" font-size="11">(x+y)/(1-xy)</text>
  <text x="150" y="348" text-anchor="middle" fill="#aa6644" font-size="10">f = tan</text>

  <!-- Right: Multiplication -->
  <circle cx="650" cy="320" r="50" fill="rgba(68,221,136,0.2)" stroke="#44dd88" stroke-width="2"/>
  <text x="650" y="310" text-anchor="middle" fill="#44dd88" font-size="15" font-weight="bold">a · b</text>
  <text x="650" y="330" text-anchor="middle" fill="#88ddaa" font-size="11">exp(ln a+ln b)</text>
  <text x="650" y="348" text-anchor="middle" fill="#66aa88" font-size="10">f = exp</text>

  <!-- Bottom: Hyperbolic SPB -->
  <circle cx="400" cy="480" r="50" fill="rgba(170,102,255,0.2)" stroke="#aa66ff" stroke-width="2"/>
  <text x="400" y="470" text-anchor="middle" fill="#aa66ff" font-size="15" font-weight="bold">spbH(a,b)</text>
  <text x="400" y="490" text-anchor="middle" fill="#bb88dd" font-size="11">(x+y)/(1+xy)</text>
  <text x="400" y="508" text-anchor="middle" fill="#8866aa" font-size="10">f = tanh</text>

  <!-- Connecting arrows -->
  <!-- Addition → SPB (tan conjugation) -->
  <line x1="358" y1="163" x2="193" y2="282" stroke="#88aacc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="205" text-anchor="middle" fill="#88aacc" font-size="11" transform="rotate(-38, 250, 205)">tan⁻¹ = arctan</text>

  <!-- Addition → Multiplication (exp conjugation) -->
  <line x1="442" y1="163" x2="607" y2="282" stroke="#88aacc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="550" y="205" text-anchor="middle" fill="#88aacc" font-size="11" transform="rotate(38, 550, 205)">exp</text>

  <!-- Addition → spbH (tanh conjugation) -->
  <line x1="400" y1="180" x2="400" y2="428" stroke="#88aacc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="310" fill="#88aacc" font-size="11">tanh</text>

  <!-- Wick rotation: SPB ↔ spbH -->
  <line x1="184" y1="358" x2="360" y2="455" stroke="#f0c040" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGold)"/>
  <text x="240" y="420" text-anchor="middle" fill="#f0c040" font-size="11" transform="rotate(28, 240, 420)">Wick: 1-xy→1+xy</text>

  <!-- SPB ↔ Multiplication connection -->
  <line x1="200" y1="320" x2="600" y2="320" stroke="#445566" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="310" text-anchor="middle" fill="#445566" font-size="10">Cayley transform</text>

  <!-- Properties annotations -->
  <rect x="30" y="420" width="120" height="70" rx="6" fill="rgba(255,102,68,0.08)" stroke="#ff6644" stroke-width="0.5"/>
  <text x="90" y="438" text-anchor="middle" fill="#ff6644" font-size="10" font-weight="bold">Circular</text>
  <text x="90" y="453" text-anchor="middle" fill="#aa6644" font-size="9">• SO(2) rotations</text>
  <text x="90" y="466" text-anchor="middle" fill="#aa6644" font-size="9">• Cauchy measure</text>
  <text x="90" y="479" text-anchor="middle" fill="#aa6644" font-size="9">• Periodic orbits</text>

  <rect x="650" y="420" width="120" height="70" rx="6" fill="rgba(68,221,136,0.08)" stroke="#44dd88" stroke-width="0.5"/>
  <text x="710" y="438" text-anchor="middle" fill="#44dd88" font-size="10" font-weight="bold">Multiplicative</text>
  <text x="710" y="453" text-anchor="middle" fill="#66aa88" font-size="9">• (ℝ₊, ·) group</text>
  <text x="710" y="466" text-anchor="middle" fill="#66aa88" font-size="9">• Log-normal</text>
  <text x="710" y="479" text-anchor="middle" fill="#66aa88" font-size="9">• Scaling laws</text>

  <rect x="500" y="530" width="120" height="55" rx="6" fill="rgba(170,102,255,0.08)" stroke="#aa66ff" stroke-width="0.5"/>
  <text x="560" y="548" text-anchor="middle" fill="#aa66ff" font-size="10" font-weight="bold">Hyperbolic</text>
  <text x="560" y="563" text-anchor="middle" fill="#8866aa" font-size="9">• SO(1,1) boosts</text>
  <text x="560" y="576" text-anchor="middle" fill="#8866aa" font-size="9">• Einstein velocity</text>

  <!-- Key insight -->
  <rect x="200" y="555" width="280" height="30" rx="6" fill="rgba(240,192,64,0.1)" stroke="#f0c040" stroke-width="1"/>
  <text x="340" y="575" text-anchor="middle" fill="#f0c040" font-size="12" font-style="italic">
    All verified in Lean 4 — zero sorries
  </text>
</svg>
