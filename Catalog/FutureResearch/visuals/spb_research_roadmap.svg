  <!-- H10: Cocycle -->
  <rect x="30" y="130" width="300" height="65" rx="8" fill="rgba(68,221,136,0.12)" stroke="#44dd88" stroke-width="1.5"/>
  <text x="45" y="150" fill="#44dd88" font-size="14" font-weight="bold">H10: Cocycle is Coboundary</text>
  <text x="45" y="167" fill="#88ddaa" font-size="11">c(x,y) = 1/(1-xy), f(x) = 1+x²</text>
  <text x="45" y="184" fill="#66aa88" font-size="10">(1-xy)²·(1+spb²) = (1+x²)(1+y²) ✓</text>

