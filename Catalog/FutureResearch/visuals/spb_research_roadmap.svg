  <rect x="30" y="205" width="300" height="65" rx="8" fill="rgba(68,221,136,0.12)" stroke="#44dd88" stroke-width="1.5"/>
  <text x="45" y="225" fill="#44dd88" font-size="14" font-weight="bold">H4: 3D SPB / Thomas-Wigner</text>
  <text x="45" y="242" fill="#88ddaa" font-size="11">spb₃(u,v)-spb₃(v,u) = 2(u×v)/(1-u·v)</text>
  <text x="45" y="259" fill="#66aa88" font-size="10">Non-commutativity + quaternion link ✓</text>

