<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1e3a"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="100%" stop-color="#0abde3"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold" filter="url(#glow)">The Berggren Ternary Tree of Pythagorean Triples</text>
  <text x="500" y="70" text-anchor="middle" fill="#8395a7" font-size="13">Formally verified: every primitive Pythagorean triple appears exactly once</text>

  <!-- Connection lines -->
  <!-- Root to depth 1 -->
  <line x1="500" y1="140" x2="200" y2="260" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="140" x2="500" y2="260" stroke="#48dbfb" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="140" x2="800" y2="260" stroke="#feca57" stroke-width="2" opacity="0.6"/>

  <!-- Depth 1 to depth 2 -->
  <!-- B1 children -->
  <line x1="200" y1="310" x2="80" y2="420" stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="310" x2="180" y2="420" stroke="#48dbfb" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="310" x2="280" y2="420" stroke="#feca57" stroke-width="1.5" opacity="0.4"/>
  <!-- B2 children -->
  <line x1="500" y1="310" x2="400" y2="420" stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"/>
  <line x1="500" y1="310" x2="500" y2="420" stroke="#48dbfb" stroke-width="1.5" opacity="0.4"/>
  <line x1="500" y1="310" x2="600" y2="420" stroke="#feca57" stroke-width="1.5" opacity="0.4"/>
  <!-- B3 children -->
  <line x1="800" y1="310" x2="720" y2="420" stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"/>
  <line x1="800" y1="310" x2="820" y2="420" stroke="#48dbfb" stroke-width="1.5" opacity="0.4"/>
  <line x1="800" y1="310" x2="920" y2="420" stroke="#feca57" stroke-width="1.5" opacity="0.4"/>

  <!-- Root node: (3, 4, 5) -->
  <circle cx="500" cy="120" r="38" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="500" y="115" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">(3, 4, 5)</text>
  <text x="500" y="133" text-anchor="middle" fill="#dfe6e9" font-size="10">root</text>

  <!-- Depth 1 nodes -->
  <!-- B1·(3,4,5) = (5, 12, 13) -->
  <circle cx="200" cy="285" r="35" fill="url(#nodeGrad1)" filter="url(#shadow)"/>
  <text x="200" y="280" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">(5, 12, 13)</text>
  <text x="200" y="298" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">B₁</text>

  <!-- B2·(3,4,5) = (21, 20, 29) -->
  <circle cx="500" cy="285" r="35" fill="url(#nodeGrad2)" filter="url(#shadow)"/>
  <text x="500" y="280" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">(21, 20, 29)</text>
  <text x="500" y="298" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">B₂</text>

  <!-- B3·(3,4,5) = (15, 8, 17) -->
  <circle cx="800" cy="285" r="35" fill="url(#nodeGrad3)" filter="url(#shadow)"/>
  <text x="800" y="280" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">(15, 8, 17)</text>
  <text x="800" y="298" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">B₃</text>

  <!-- Depth 2 nodes (smaller) -->
  <!-- B1 children -->
  <circle cx="80" cy="440" r="28" fill="url(#nodeGrad1)" opacity="0.8" filter="url(#shadow)"/>
  <text x="80" y="436" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">(7, 24, 25)</text>
  <text x="80" y="451" text-anchor="middle" fill="#fff" font-size="9" opacity="0.7">B₁B₁</text>

  <circle cx="180" cy="440" r="28" fill="url(#nodeGrad2)" opacity="0.8" filter="url(#shadow)"/>
  <text x="180" y="436" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">(55, 48, 73)</text>
  <text x="180" y="451" text-anchor="middle" fill="#fff" font-size="9" opacity="0.7">B₂B₁</text>

  <circle cx="280" cy="440" r="28" fill="url(#nodeGrad3)" opacity="0.8" filter="url(#shadow)"/>
  <text x="280" y="436" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">(45, 28, 53)</text>
  <text x="280" y="451" text-anchor="middle" fill="#fff" font-size="9" opacity="0.7">B₃B₁</text>

  <!-- B2 children -->
  <circle cx="400" cy="440" r="28" fill="url(#nodeGrad1)" opacity="0.8" filter="url(#shadow)"/>
  <text x="400" y="436" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">(39, 80, 89)</text>
  <text x="400" y="451" text-anchor="middle" fill="#fff" font-size="9" opacity="0.7">B₁B₂</text>

  <circle cx="500" cy="440" r="28" fill="url(#nodeGrad2)" opacity="0.8" filter="url(#shadow)"/>
  <text x="500" y="436" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">(119,120,169)</text>
  <text x="500" y="451" text-anchor="middle" fill="#fff" font-size="9" opacity="0.7">B₂B₂</text>

  <circle cx="600" cy="440" r="28" fill="url(#nodeGrad3)" opacity="0.8" filter="url(#shadow)"/>
  <text x="600" y="436" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">(77, 36, 85)</text>
  <text x="600" y="451" text-anchor="middle" fill="#fff" font-size="9" opacity="0.7">B₃B₂</text>

  <!-- B3 children -->
  <circle cx="720" cy="440" r="28" fill="url(#nodeGrad1)" opacity="0.8" filter="url(#shadow)"/>
  <text x="720" y="436" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">(33, 56, 65)</text>
  <text x="720" y="451" text-anchor="middle" fill="#fff" font-size="9" opacity="0.7">B₁B₃</text>

  <circle cx="820" cy="440" r="28" fill="url(#nodeGrad2)" opacity="0.8" filter="url(#shadow)"/>
  <text x="820" y="436" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">(91, 60, 109)</text>
  <text x="820" y="451" text-anchor="middle" fill="#fff" font-size="9" opacity="0.7">B₂B₃</text>

  <circle cx="920" cy="440" r="28" fill="url(#nodeGrad3)" opacity="0.8" filter="url(#shadow)"/>
  <text x="920" y="436" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">(65, 32, 73)</text>
  <text x="920" y="451" text-anchor="middle" fill="#fff" font-size="9" opacity="0.7">B₃B₃</text>

  <!-- Ellipsis indicators -->
  <text x="80" y="490" text-anchor="middle" fill="#636e72" font-size="18">⋮</text>
  <text x="180" y="490" text-anchor="middle" fill="#636e72" font-size="18">⋮</text>
  <text x="280" y="490" text-anchor="middle" fill="#636e72" font-size="18">⋮</text>
  <text x="400" y="490" text-anchor="middle" fill="#636e72" font-size="18">⋮</text>
  <text x="500" y="490" text-anchor="middle" fill="#636e72" font-size="18">⋮</text>
  <text x="600" y="490" text-anchor="middle" fill="#636e72" font-size="18">⋮</text>
  <text x="720" y="490" text-anchor="middle" fill="#636e72" font-size="18">⋮</text>
  <text x="820" y="490" text-anchor="middle" fill="#636e72" font-size="18">⋮</text>
  <text x="920" y="490" text-anchor="middle" fill="#636e72" font-size="18">⋮</text>

  <!-- Matrix labels -->
  <rect x="30" y="540" width="300" height="140" rx="10" fill="#1e272e" opacity="0.8" stroke="#dfe6e9" stroke-width="1"/>
  <text x="180" y="565" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">B₁ Matrix</text>
  <text x="180" y="588" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace">┌  1  -2   2 ┐</text>
  <text x="180" y="606" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace">│  2  -1   2 │</text>
  <text x="180" y="624" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace">└  2  -2   3 ┘</text>
  <text x="180" y="650" text-anchor="middle" fill="#636e72" font-size="10">Preserves x²+y²−z²</text>
  <text x="180" y="666" text-anchor="middle" fill="#636e72" font-size="10">✓ B₁_preserves_lorentz</text>

  <rect x="350" y="540" width="300" height="140" rx="10" fill="#1e272e" opacity="0.8" stroke="#dfe6e9" stroke-width="1"/>
  <text x="500" y="565" text-anchor="middle" fill="#48dbfb" font-size="13" font-weight="bold">B₂ Matrix</text>
  <text x="500" y="588" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace">┌  1   2   2 ┐</text>
  <text x="500" y="606" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace">│  2   1   2 │</text>
  <text x="500" y="624" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace">└  2   2   3 ┘</text>
  <text x="500" y="650" text-anchor="middle" fill="#636e72" font-size="10">Preserves x²+y²−z²</text>
  <text x="500" y="666" text-anchor="middle" fill="#636e72" font-size="10">✓ B₂_preserves_lorentz</text>

  <rect x="670" y="540" width="300" height="140" rx="10" fill="#1e272e" opacity="0.8" stroke="#dfe6e9" stroke-width="1"/>
  <text x="820" y="565" text-anchor="middle" fill="#feca57" font-size="13" font-weight="bold">B₃ Matrix</text>
  <text x="820" y="588" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace">┌ -1   2   2 ┐</text>
  <text x="820" y="606" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace">│ -2   1   2 │</text>
  <text x="820" y="624" text-anchor="middle" fill="#dfe6e9" font-size="12" font-family="monospace">└ -2   2   3 ┘</text>
  <text x="820" y="650" text-anchor="middle" fill="#636e72" font-size="10">Preserves x²+y²−z²</text>
  <text x="820" y="666" text-anchor="middle" fill="#636e72" font-size="10">✓ B₃_preserves_lorentz</text>
</svg>
