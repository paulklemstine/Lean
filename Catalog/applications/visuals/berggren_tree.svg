<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#44b8a8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">The Berggren Tree of Pythagorean Triples</text>
  <text x="450" y="62" text-anchor="middle" fill="#aaa" font-size="13">Every primitive Pythagorean triple appears exactly once (formally verified)</text>

  <!-- Connection lines -->
  <g stroke="#4ecdc4" stroke-opacity="0.4" stroke-width="2">
    <!-- Root to depth 1 -->
    <line x1="450" y1="120" x2="150" y2="230"/>
    <line x1="450" y1="120" x2="450" y2="230"/>
    <line x1="450" y1="120" x2="750" y2="230"/>

    <!-- B1 children -->
    <line x1="150" y1="260" x2="50" y2="370"/>
    <line x1="150" y1="260" x2="150" y2="370"/>
    <line x1="150" y1="260" x2="250" y2="370"/>

    <!-- B2 children -->
    <line x1="450" y1="260" x2="350" y2="370"/>
    <line x1="450" y1="260" x2="450" y2="370"/>
    <line x1="450" y1="260" x2="550" y2="370"/>

    <!-- B3 children -->
    <line x1="750" y1="260" x2="650" y2="370"/>
    <line x1="750" y1="260" x2="750" y2="370"/>
    <line x1="750" y1="260" x2="850" y2="370"/>
  </g>

  <!-- Root node: (3, 4, 5) -->
  <g filter="url(#glow)">
    <ellipse cx="450" cy="110" rx="55" ry="22" fill="url(#rootGrad)" filter="url(#shadow)"/>
    <text x="450" y="115" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">(3, 4, 5)</text>
  </g>

  <!-- Depth 1 nodes -->
  <g filter="url(#shadow)">
    <ellipse cx="150" cy="250" rx="60" ry="20" fill="url(#nodeGrad)"/>
    <text x="150" y="255" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">(5, 12, 13)</text>
    <text x="150" y="220" text-anchor="middle" fill="#ff6b6b" font-size="11">B₁</text>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="450" cy="250" rx="65" ry="20" fill="url(#nodeGrad)"/>
    <text x="450" y="255" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">(21, 20, 29)</text>
    <text x="450" y="220" text-anchor="middle" fill="#ffd93d" font-size="11">B₂</text>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="750" cy="250" rx="60" ry="20" fill="url(#nodeGrad)"/>
    <text x="750" y="255" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">(15, 8, 17)</text>
    <text x="750" y="220" text-anchor="middle" fill="#6c5ce7" font-size="11">B₃</text>
  </g>

  <!-- Depth 2 nodes (B1 children) -->
  <g filter="url(#shadow)">
    <ellipse cx="50" cy="385" rx="48" ry="18" fill="#2d6a4f" opacity="0.9"/>
    <text x="50" y="389" text-anchor="middle" fill="#fff" font-size="10">(7, 24, 25)</text>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="150" cy="385" rx="55" ry="18" fill="#2d6a4f" opacity="0.9"/>
    <text x="150" y="389" text-anchor="middle" fill="#fff" font-size="10">(55, 48, 73)</text>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="250" cy="385" rx="55" ry="18" fill="#2d6a4f" opacity="0.9"/>
    <text x="250" y="389" text-anchor="middle" fill="#fff" font-size="10">(45, 28, 53)</text>
  </g>

  <!-- Depth 2 nodes (B2 children) -->
  <g filter="url(#shadow)">
    <ellipse cx="350" cy="385" rx="55" ry="18" fill="#2d6a4f" opacity="0.9"/>
    <text x="350" y="389" text-anchor="middle" fill="#fff" font-size="10">(39, 80, 89)</text>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="450" cy="385" rx="62" ry="18" fill="#2d6a4f" opacity="0.9"/>
    <text x="450" y="389" text-anchor="middle" fill="#fff" font-size="10">(119, 120, 169)</text>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="550" cy="385" rx="58" ry="18" fill="#2d6a4f" opacity="0.9"/>
    <text x="550" y="389" text-anchor="middle" fill="#fff" font-size="10">(77, 36, 85)</text>
  </g>

  <!-- Depth 2 nodes (B3 children) -->
  <g filter="url(#shadow)">
    <ellipse cx="650" cy="385" rx="55" ry="18" fill="#2d6a4f" opacity="0.9"/>
    <text x="650" y="389" text-anchor="middle" fill="#fff" font-size="10">(33, 56, 65)</text>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="750" cy="385" rx="55" ry="18" fill="#2d6a4f" opacity="0.9"/>
    <text x="750" y="389" text-anchor="middle" fill="#fff" font-size="10">(65, 72, 97)</text>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="850" cy="385" rx="55" ry="18" fill="#2d6a4f" opacity="0.9"/>
    <text x="850" y="389" text-anchor="middle" fill="#fff" font-size="10">(35, 12, 37)</text>
  </g>

  <!-- Ellipsis -->
  <text x="150" y="440" text-anchor="middle" fill="#666" font-size="20">⋮</text>
  <text x="450" y="440" text-anchor="middle" fill="#666" font-size="20">⋮</text>
  <text x="750" y="440" text-anchor="middle" fill="#666" font-size="20">⋮</text>

  <!-- Legend -->
  <g transform="translate(30, 470)">
    <rect width="840" height="115" rx="10" fill="#0d0d3a" stroke="#4ecdc4" stroke-width="1" opacity="0.8"/>
    <text x="420" y="25" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Formally Verified Properties</text>

    <text x="30" y="50" fill="#ff6b6b" font-size="12">▸ Lorentz Invariance:</text>
    <text x="175" y="50" fill="#ccc" font-size="11">All Berggren matrices preserve x² + y² − z² (Minkowski form)</text>

    <text x="30" y="70" fill="#ffd93d" font-size="12">▸ Completeness:</text>
    <text x="145" y="70" fill="#ccc" font-size="11">Every primitive Pythagorean triple appears exactly once</text>

    <text x="30" y="90" fill="#6c5ce7" font-size="12">▸ Invertibility:</text>
    <text x="140" y="90" fill="#ccc" font-size="11">Each B matrix has a verified inverse — unique path from any triple to (3,4,5)</text>

    <text x="30" y="108" fill="#4ecdc4" font-size="12">▸ 28,797 declarations</text>
    <text x="195" y="108" fill="#888" font-size="11">across 1,446 Lean 4 files, 178,634 lines of verified code</text>
  </g>
</svg>
