<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>

  <text x="400" y="35" text-anchor="middle" fill="#00ffcc" font-size="22" font-weight="bold" font-family="Arial">
    The Two-Barrier Exclusion System
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#88aacc" font-size="12" font-family="Arial">
    Classifying functions by Lipschitz continuity and differentiability
  </text>

  <!-- 2×2 grid -->
  <!-- Top-left: Smooth + Lipschitz (IN) -->
  <rect x="50" y="80" width="330" height="150" rx="10" fill="#0a2a1a" stroke="#00cc88" stroke-width="2"/>
  <text x="215" y="105" text-anchor="middle" fill="#00cc88" font-size="16" font-weight="bold">Smooth ∧ Lipschitz</text>
  <text x="215" y="125" text-anchor="middle" fill="#88ddaa" font-size="12">✓ Potentially in Sheffer Algebra</text>
  <text x="70" y="150" fill="#00ffcc" font-size="13">σ(x), sigmoid, arctan</text>
  <text x="70" y="170" fill="#00ffcc" font-size="13">x (identity), constants</text>
  <text x="70" y="190" fill="#00ffcc" font-size="13">σ(σ(x)), ax + b</text>
  <text x="70" y="215" fill="#aaddcc" font-size="11">sin(x)? tanh(x)? (open Q21)</text>

  <!-- Top-right: Smooth + NOT Lipschitz -->
  <rect x="420" y="80" width="330" height="150" rx="10" fill="#2a0a1a" stroke="#cc44aa" stroke-width="2"/>
  <text x="585" y="105" text-anchor="middle" fill="#cc44aa" font-size="16" font-weight="bold">Smooth ∧ ¬Lipschitz</text>
  <text x="585" y="125" text-anchor="middle" fill="#ee6688" font-size="12">✗ Excluded by Lipschitz Barrier</text>
  <text x="440" y="150" fill="#ff6666" font-size="13">exp(x) — unbounded derivative</text>
  <text x="440" y="170" fill="#ff6666" font-size="13">x² — derivative = 2x → ∞</text>
  <text x="440" y="190" fill="#ff6666" font-size="13">sinh(x) — derivative = cosh → ∞</text>
  <text x="440" y="210" fill="#ff6666" font-size="13">x³, cosh, tan, ...</text>

  <!-- Bottom-left: NOT Smooth + Lipschitz -->
  <rect x="50" y="260" width="330" height="150" rx="10" fill="#2a1a0a" stroke="#ccaa44" stroke-width="2"/>
  <text x="215" y="285" text-anchor="middle" fill="#ccaa44" font-size="16" font-weight="bold">¬Smooth ∧ Lipschitz</text>
  <text x="215" y="305" text-anchor="middle" fill="#eecc66" font-size="12">✗ Excluded by Smoothness Barrier</text>
  <text x="70" y="330" fill="#ffaa44" font-size="13">ReLU = max(0,x) — kink at 0</text>
  <text x="70" y="350" fill="#ffaa44" font-size="13">|x| — not differentiable at 0</text>
  <text x="70" y="370" fill="#ffaa44" font-size="13">min(|x|, 1) — kinks</text>
  <text x="70" y="390" fill="#ffaa44" font-size="13">Leaky ReLU — kink at 0</text>

  <!-- Bottom-right: Neither -->
  <rect x="420" y="260" width="330" height="150" rx="10" fill="#2a0a0a" stroke="#ff4444" stroke-width="2"/>
  <text x="585" y="285" text-anchor="middle" fill="#ff4444" font-size="16" font-weight="bold">¬Smooth ∧ ¬Lipschitz</text>
  <text x="585" y="305" text-anchor="middle" fill="#ff6666" font-size="12">✗✗ Excluded by BOTH barriers</text>
  <text x="440" y="330" fill="#ff4444" font-size="13">⌊x⌋ — discontinuous</text>
  <text x="440" y="350" fill="#ff4444" font-size="13">sign(x)·x² — kink + unbounded</text>
  <text x="440" y="370" fill="#ff4444" font-size="13">x·|x| — kink at 0</text>
  <text x="440" y="390" fill="#ff4444" font-size="13">Heaviside · exp — both fail</text>

  <!-- Arrows/labels -->
  <text x="400" y="440" text-anchor="middle" fill="#888" font-size="11" font-family="Arial">
    ShefferAlg ⊆ C∞(ℝ) ∩ Lip(ℝ) — both barriers must be passed
  </text>
</svg>
