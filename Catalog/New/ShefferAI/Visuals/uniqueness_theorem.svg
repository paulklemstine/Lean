<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">The Uniqueness of Softplus</text>
  <text x="400" y="58" text-anchor="middle" fill="#8b949e" font-size="12">Four axioms uniquely determine σ(x) = log(1 + eˣ)</text>

  <!-- Central softplus curve -->
  <g transform="translate(250, 250)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#444" stroke-width="1"/>
    <line x1="150" y1="-150" x2="150" y2="50" stroke="#444" stroke-width="1"/>

    <!-- Softplus curve -->
    <path d="M 0,2 C 20,1 40,0 60,-2 C 80,-5 100,-12 120,-25 C 135,-38 143,-48 150,-55
             C 157,-62 165,-72 180,-88 C 200,-108 230,-132 260,-148 C 280,-156 295,-160 300,-162"
          fill="none" stroke="#4ecdc4" stroke-width="3"/>

    <!-- Asymptote lines -->
    <!-- y = x line (positive asymptote) -->
    <line x1="150" y1="0" x2="300" y2="-162" stroke="#ffa502" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
    <!-- y = 0 line (negative asymptote) -->
    <line x1="0" y1="0" x2="150" y2="0" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

    <text x="150" y="18" text-anchor="middle" fill="#888" font-size="10">0</text>
  </g>

  <!-- Four axiom boxes -->
  <!-- Axiom 1: Smooth -->
  <g transform="translate(30, 90)">
    <rect width="165" height="70" rx="8" fill="rgba(78,205,196,0.1)" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="82" y="22" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="bold">C∞ Smooth</text>
    <text x="82" y="42" text-anchor="middle" fill="#ccc" font-size="11">Infinitely</text>
    <text x="82" y="58" text-anchor="middle" fill="#ccc" font-size="11">differentiable</text>
  </g>

  <!-- Axiom 2: Monotone -->
  <g transform="translate(30, 175)">
    <rect width="165" height="70" rx="8" fill="rgba(255,165,2,0.1)" stroke="#ffa502" stroke-width="1.5"/>
    <text x="82" y="22" text-anchor="middle" fill="#ffa502" font-size="13" font-weight="bold">Strictly ↑</text>
    <text x="82" y="42" text-anchor="middle" fill="#ccc" font-size="11">f'(x) > 0</text>
    <text x="82" y="58" text-anchor="middle" fill="#ccc" font-size="11">for all x</text>
  </g>

  <!-- Axiom 3: Convex -->
  <g transform="translate(605, 90)">
    <rect width="165" height="70" rx="8" fill="rgba(255,107,107,0.1)" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="82" y="22" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">Strictly Convex</text>
    <text x="82" y="42" text-anchor="middle" fill="#ccc" font-size="11">f''(x) > 0</text>
    <text x="82" y="58" text-anchor="middle" fill="#ccc" font-size="11">for all x</text>
  </g>

  <!-- Axiom 4: Asymptotes -->
  <g transform="translate(605, 175)">
    <rect width="165" height="70" rx="8" fill="rgba(139,148,158,0.15)" stroke="#8b949e" stroke-width="1.5"/>
    <text x="82" y="22" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="bold">Two Regimes</text>
    <text x="82" y="42" text-anchor="middle" fill="#ffa502" font-size="11">f(x) ~ x as x→+∞</text>
    <text x="82" y="58" text-anchor="middle" fill="#ff6b6b" font-size="11">f(x) ~ eˣ as x→-∞</text>
  </g>

  <!-- Connecting arrows -->
  <line x1="195" y1="125" x2="245" y2="195" stroke="#4ecdc4" stroke-width="1" opacity="0.4"/>
  <line x1="195" y1="210" x2="245" y2="235" stroke="#ffa502" stroke-width="1" opacity="0.4"/>
  <line x1="605" y1="125" x2="555" y2="195" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
  <line x1="605" y1="210" x2="555" y2="235" stroke="#8b949e" stroke-width="1" opacity="0.4"/>

  <!-- Result box -->
  <g transform="translate(200, 370)">
    <rect width="400" height="55" rx="10" fill="rgba(78,205,196,0.15)" stroke="#4ecdc4" stroke-width="2"/>
    <text x="200" y="22" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">⟹ f(x) = log(1 + eˣ⁺ᶜ) + d</text>
    <text x="200" y="42" text-anchor="middle" fill="#8b949e" font-size="11">Unique up to affine parameters c, d</text>
  </g>

  <!-- ODE annotation -->
  <g transform="translate(230, 340)">
    <text x="170" y="0" text-anchor="middle" fill="#aaa" font-size="11">Key ODE: f'' = f'(1 − f') has unique sigmoid solution</text>
  </g>
</svg>
