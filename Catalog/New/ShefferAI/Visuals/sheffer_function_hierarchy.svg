<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#bg3)"/>

  <text x="400" y="35" text-anchor="middle" fill="#00ffcc" font-size="20" font-weight="bold" font-family="Arial">
    The Function Space Hierarchy
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#88aacc" font-size="12" font-family="Arial">
    Where the Sheffer Algebra sits in the landscape of function spaces
  </text>

  <!-- Nested ellipses from largest to smallest -->

  <!-- All functions ℝ → ℝ -->
  <ellipse cx="400" cy="310" rx="370" ry="210" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="750" y="120" text-anchor="end" fill="#555" font-size="12">All functions ℝ → ℝ</text>

  <!-- Measurable -->
  <ellipse cx="400" cy="310" rx="340" ry="190" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="720" y="145" text-anchor="end" fill="#666" font-size="11">Measurable</text>

  <!-- Continuous -->
  <ellipse cx="400" cy="310" rx="300" ry="170" fill="#0a1520" stroke="#2244aa" stroke-width="1.5"/>
  <text x="680" y="170" text-anchor="end" fill="#4466cc" font-size="12">Continuous C⁰</text>

  <!-- Differentiable C¹ -->
  <ellipse cx="400" cy="310" rx="255" ry="145" fill="#0a1a25" stroke="#2288aa" stroke-width="1.5"/>
  <text x="640" y="195" text-anchor="end" fill="#44aacc" font-size="12">Differentiable C¹</text>

  <!-- Smooth C∞ -->
  <ellipse cx="400" cy="310" rx="210" ry="120" fill="#0a2020" stroke="#22aa88" stroke-width="1.5"/>
  <text x="600" y="220" text-anchor="end" fill="#44cc88" font-size="12">Smooth C∞</text>

  <!-- Lipschitz -->
  <ellipse cx="370" cy="310" rx="160" ry="95" fill="#0a2a1a" stroke="#44cc44" stroke-width="1.5"/>
  <text x="510" y="240" text-anchor="end" fill="#66ee66" font-size="12">Lipschitz</text>

  <!-- Smooth ∩ Lipschitz -->
  <ellipse cx="380" cy="310" rx="130" ry="78" fill="#0a2a2a" stroke="#00ccaa" stroke-width="2"/>
  <text x="500" y="258" text-anchor="end" fill="#00ddbb" font-size="11">C∞ ∩ Lip</text>

  <!-- Sheffer Algebra -->
  <ellipse cx="380" cy="310" rx="85" ry="52" fill="#0a3a2a" stroke="#00ffcc" stroke-width="2.5"/>
  <text x="380" y="305" text-anchor="middle" fill="#00ffcc" font-size="14" font-weight="bold">Sheffer</text>
  <text x="380" y="322" text-anchor="middle" fill="#00ffcc" font-size="14" font-weight="bold">Algebra</text>
  <text x="380" y="342" text-anchor="middle" fill="#88ddbb" font-size="10">σ, id, const, ...</text>

  <!-- Affine functions (innermost) -->
  <ellipse cx="380" cy="315" rx="40" ry="22" fill="#0a4a3a" stroke="#88ffdd" stroke-width="1.5"/>
  <text x="380" y="319" text-anchor="middle" fill="#aaffee" font-size="10">Affine</text>

  <!-- Excluded functions with labels -->
  <!-- Outside Lipschitz -->
  <circle cx="180" cy="180" r="4" fill="#ff4444"/>
  <text x="168" y="175" fill="#ff6666" font-size="11" text-anchor="end">exp(x)</text>
  <circle cx="200" cy="420" r="4" fill="#ff4444"/>
  <text x="188" y="435" fill="#ff6666" font-size="11" text-anchor="end">x²</text>
  <circle cx="580" cy="200" r="4" fill="#ff4444"/>
  <text x="592" y="195" fill="#ff6666" font-size="11">sinh(x)</text>

  <!-- Outside C¹ but inside C⁰ -->
  <circle cx="140" cy="300" r="4" fill="#ffaa00"/>
  <text x="128" y="295" fill="#ffcc44" font-size="11" text-anchor="end">|x|</text>
  <circle cx="120" cy="350" r="4" fill="#ffaa00"/>
  <text x="108" y="345" fill="#ffcc44" font-size="11" text-anchor="end">ReLU</text>

  <!-- In Smooth∩Lip but outside Sheffer -->
  <circle cx="500" cy="310" r="4" fill="#aaaaff"/>
  <text x="512" y="305" fill="#bbbbff" font-size="11">sin(x)?</text>
  <circle cx="490" cy="340" r="4" fill="#aaaaff"/>
  <text x="502" y="350" fill="#bbbbff" font-size="11">tanh(x)?</text>

  <!-- Outside continuous -->
  <circle cx="100" cy="150" r="4" fill="#ff0000"/>
  <text x="88" y="145" fill="#ff3333" font-size="11" text-anchor="end">⌊x⌋</text>

  <!-- Legend -->
  <rect x="580" y="420" width="200" height="110" rx="6" fill="#0a0a1e" stroke="#444" stroke-width="1"/>
  <text x="680" y="440" text-anchor="middle" fill="#aaa" font-size="12" font-weight="bold">Legend</text>
  <circle cx="600" cy="458" r="4" fill="#00ffcc"/>
  <text x="615" y="462" fill="#aaa" font-size="11">∈ Sheffer algebra</text>
  <circle cx="600" cy="478" r="4" fill="#ff4444"/>
  <text x="615" y="482" fill="#aaa" font-size="11">Lipschitz excluded</text>
  <circle cx="600" cy="498" r="4" fill="#ffaa00"/>
  <text x="615" y="502" fill="#aaa" font-size="11">Smoothness excluded</text>
  <circle cx="600" cy="518" r="4" fill="#aaaaff"/>
  <text x="615" y="522" fill="#aaa" font-size="11">Status unknown</text>
</svg>
