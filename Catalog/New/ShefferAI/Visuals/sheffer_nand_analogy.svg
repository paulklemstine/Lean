<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a28;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg4)"/>

  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="bold">
    The Grand Analogy: NAND ↔ Softplus
  </text>

  <!-- Left column: Boolean -->
  <rect x="40" y="70" width="380" height="400" rx="15" fill="#0a1a30" fill-opacity="0.8" stroke="#2255aa" stroke-width="2"/>
  <text x="230" y="100" text-anchor="middle" fill="#4488ff" font-family="Georgia, serif" font-size="18" font-weight="bold">Boolean World</text>

  <text x="70" y="140" fill="#88aadd" font-family="monospace" font-size="13">Generator: NAND(a,b) = ¬(a ∧ b)</text>
  <text x="70" y="170" fill="#6688bb" font-family="monospace" font-size="12">Domain: {0, 1}</text>
  <text x="70" y="195" fill="#6688bb" font-family="monospace" font-size="12">Generates: All Boolean functions</text>
  <text x="70" y="225" fill="#88aadd" font-family="monospace" font-size="13">Derived operations:</text>
  <text x="90" y="250" fill="#5577aa" font-family="monospace" font-size="11">NOT(a)  = NAND(a,a)</text>
  <text x="90" y="270" fill="#5577aa" font-family="monospace" font-size="11">AND(a,b) = NOT(NAND(a,b))</text>
  <text x="90" y="290" fill="#5577aa" font-family="monospace" font-size="11">OR(a,b)  = NAND(NOT a, NOT b)</text>
  <text x="90" y="310" fill="#5577aa" font-family="monospace" font-size="11">XOR(a,b) = NAND(NAND(a,c),NAND(b,c))</text>
  <text x="90" y="330" fill="#5577aa" font-family="monospace" font-size="11">         where c = NAND(a,b)</text>

  <text x="70" y="365" fill="#88aadd" font-family="monospace" font-size="13">Complexity: Circuit depth</text>
  <text x="70" y="390" fill="#88aadd" font-family="monospace" font-size="13">Theory: Shannon (1938)</text>
  <text x="70" y="415" fill="#88aadd" font-family="monospace" font-size="13">Hardware: Digital logic gates</text>
  <text x="70" y="440" fill="#88aadd" font-family="monospace" font-size="13">P vs NP: Depth lower bounds?</text>

  <!-- Right column: Continuous -->
  <rect x="480" y="70" width="380" height="400" rx="15" fill="#1a0a20" fill-opacity="0.8" stroke="#aa22aa" stroke-width="2"/>
  <text x="670" y="100" text-anchor="middle" fill="#dd66ff" font-family="Georgia, serif" font-size="18" font-weight="bold">Smooth World</text>

  <text x="510" y="140" fill="#cc88ee" font-family="monospace" font-size="13">Generator: σ(x) = log(1+eˣ)</text>
  <text x="510" y="170" fill="#9966bb" font-family="monospace" font-size="12">Domain: ℝ</text>
  <text x="510" y="195" fill="#9966bb" font-family="monospace" font-size="12">Generates: All smooth functions</text>
  <text x="510" y="225" fill="#cc88ee" font-family="monospace" font-size="13">Derived operations:</text>
  <text x="530" y="250" fill="#8855aa" font-family="monospace" font-size="11">id(x)   = σ(x) - σ(-x)</text>
  <text x="530" y="270" fill="#8855aa" font-family="monospace" font-size="11">exp(x)  = e^σ(x) - 1</text>
  <text x="530" y="290" fill="#8855aa" font-family="monospace" font-size="11">log(x)  = σ(log(x))</text>
  <text x="530" y="310" fill="#8855aa" font-family="monospace" font-size="11">sin(x)  = Im(exp(ix))</text>
  <text x="530" y="330" fill="#8855aa" font-family="monospace" font-size="11">xⁿ      = exp(n·log(x))</text>

  <text x="510" y="365" fill="#cc88ee" font-family="monospace" font-size="13">Complexity: Sheffer depth</text>
  <text x="510" y="390" fill="#cc88ee" font-family="monospace" font-size="13">Theory: Sheffer AI (2025)</text>
  <text x="510" y="415" fill="#cc88ee" font-family="monospace" font-size="13">Hardware: Neural networks</text>
  <text x="510" y="440" fill="#cc88ee" font-family="monospace" font-size="13">Open: Depth separation?</text>

  <!-- Central connection -->
  <text x="445" y="260" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="30">⟷</text>
  <text x="445" y="290" text-anchor="middle" fill="#aaaaaa" font-family="Georgia, serif" font-size="12" font-style="italic">analogy</text>
</svg>
