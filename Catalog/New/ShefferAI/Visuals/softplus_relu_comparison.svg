<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg5)"/>

  <text x="400" y="30" text-anchor="middle" fill="#00ffcc" font-size="20" font-weight="bold" font-family="Arial">
    Softplus vs ReLU: The Smoothness Divide
  </text>

  <!-- Graph area -->
  <rect x="80" y="50" width="640" height="300" rx="5" fill="#0a0a1e" stroke="#333" stroke-width="1"/>

  <!-- Grid lines -->
  <line x1="400" y1="50" x2="400" y2="350" stroke="#222" stroke-width="1"/>
  <line x1="80" y1="200" x2="720" y2="200" stroke="#222" stroke-width="1"/>

  <!-- Axes labels -->
  <text x="400" y="375" text-anchor="middle" fill="#666" font-size="12">x</text>
  <text x="65" y="205" text-anchor="middle" fill="#666" font-size="12">y</text>

  <!-- x-axis ticks -->
  <text x="240" y="365" text-anchor="middle" fill="#555" font-size="10">-2</text>
  <text x="320" y="365" text-anchor="middle" fill="#555" font-size="10">-1</text>
  <text x="400" y="365" text-anchor="middle" fill="#555" font-size="10">0</text>
  <text x="480" y="365" text-anchor="middle" fill="#555" font-size="10">1</text>
  <text x="560" y="365" text-anchor="middle" fill="#555" font-size="10">2</text>
  <text x="640" y="365" text-anchor="middle" fill="#555" font-size="10">3</text>

  <!-- ReLU: max(0, x) — piecewise linear with kink -->
  <!-- For x from -4 to 0: y = 0 (at y=200) -->
  <!-- For x from 0 to 4: y = x (going up) -->
  <polyline points="80,200 160,200 240,200 320,200 400,200 480,120 560,40"
            fill="none" stroke="#ff4444" stroke-width="2.5" stroke-dasharray="8,4"/>

  <!-- Softplus: log(1 + e^x) — smooth curve -->
  <!-- Approximate points for softplus scaled to graph -->
  <!-- x=-4: σ≈0.018, x=-3: σ≈0.049, x=-2: σ≈0.127, x=-1: σ≈0.313 -->
  <!-- x=0: σ≈0.693, x=1: σ≈1.313, x=2: σ≈2.127, x=3: σ≈3.049 -->
  <!-- Scale: 80px per unit x, 80px per unit y, origin at (400, 200) -->
  <polyline points="80,199 120,199 160,198 200,197 240,190 280,180 320,175 360,155 400,145 440,115 480,95 520,70 560,48 600,28 640,14"
            fill="none" stroke="#00ffcc" stroke-width="2.5"/>

  <!-- Kink marker on ReLU -->
  <circle cx="400" cy="200" r="6" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <text x="415" y="225" fill="#ffcc00" font-size="11">← Kink!</text>
  <text x="415" y="240" fill="#ffaa00" font-size="10">Not differentiable</text>

  <!-- Smooth marker on softplus -->
  <circle cx="400" cy="145" r="3" fill="#00ffcc"/>
  <text x="340" y="135" fill="#00ffcc" font-size="11">σ(0) = ln 2 ≈ 0.69</text>
  <text x="340" y="148" fill="#88ddbb" font-size="10">Smooth everywhere</text>

  <!-- Legend -->
  <rect x="90" y="60" width="200" height="55" rx="5" fill="#0a0a2e" stroke="#444" stroke-width="1"/>
  <line x1="100" y1="78" x2="130" y2="78" stroke="#00ffcc" stroke-width="2.5"/>
  <text x="140" y="82" fill="#00ffcc" font-size="12">σ(x) = log(1+eˣ) ∈ Sheffer</text>
  <line x1="100" y1="100" x2="130" y2="100" stroke="#ff4444" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="140" y="104" fill="#ff4444" font-size="12">ReLU = max(0,x) ∉ Sheffer</text>
</svg>
