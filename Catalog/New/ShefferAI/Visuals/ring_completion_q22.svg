<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#fafafa" rx="10"/>

  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1a237e" font-weight="bold">
    Q22: Ring Completion of the Sheffer Algebra
  </text>

  <!-- Arrow diagram -->
  <!-- ShefferAlg -->
  <rect x="30" y="150" width="160" height="80" rx="10" fill="#c8e6c9" stroke="#1b5e20" stroke-width="2"/>
  <text x="110" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1b5e20" font-weight="bold">ShefferAlg</text>
  <text x="110" y="205" text-anchor="middle" font-family="monospace" font-size="10" fill="#1b5e20">Lip ∩ C∞</text>

  <!-- Arrow: add × -->
  <line x1="190" y1="190" x2="280" y2="190" stroke="#e53935" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="235" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#e53935" font-weight="bold">add ×</text>

  <!-- Ring completion -->
  <rect x="280" y="130" width="180" height="120" rx="10" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="370" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c62828" font-weight="bold">Ring</text>
  <text x="370" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c62828" font-weight="bold">Completion</text>
  <text x="370" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#c62828">Contains x²!</text>
  <text x="370" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#c62828">NOT Lipschitz</text>

  <!-- Arrow -->
  <line x1="460" y1="190" x2="540" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">⊆</text>

  <!-- All smooth functions -->
  <rect x="540" y="150" width="220" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="650" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1565c0" font-weight="bold">C∞(ℝ)</text>
  <text x="650" y="205" text-anchor="middle" font-family="monospace" font-size="10" fill="#1565c0">(no Lipschitz constraint)</text>

  <!-- Key insight -->
  <rect x="100" y="290" width="600" height="90" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text x="400" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e65100" font-weight="bold">
    Theorem (v5, formally verified):
  </text>
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">
    x ∈ ShefferAlg. If × is added, then x·x = x² ∈ Ring.
  </text>
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">
    But x² is NOT Lipschitz. So the ring completion immediately escapes Lip(ℝ).
  </text>

  <!-- Proof: the identity argument -->
  <text x="400" y="95" text-anchor="middle" font-family="monospace" font-size="12" fill="#546e7a">
    x = σ(x) − σ(−x) ∈ ShefferAlg ⟹ x·x = x² ∈ Ring(ShefferAlg)
  </text>
  <text x="400" y="115" text-anchor="middle" font-family="monospace" font-size="12" fill="#c62828">
    But ∀C≥0, ∃x: |(x+1)² - x²| = |2x+1| > C·1 — NOT Lipschitz!
  </text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
