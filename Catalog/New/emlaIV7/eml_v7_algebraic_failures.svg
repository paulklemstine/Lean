<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg3)"/>

  <text x="450" y="40" text-anchor="middle" fill="#f0f0f0" font-size="22" font-weight="bold">
    EML Magma: Algebraic Property Landscape
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#888" font-size="13">
    Formally verified failures place EML outside all standard algebraic categories
  </text>

  <!-- Property boxes -->
  <!-- Row 1 -->
  <rect x="30" y="90" width="200" height="70" rx="10" fill="#1c1c1c" stroke="#f44336" stroke-width="2"/>
  <text x="130" y="118" text-anchor="middle" fill="#f44336" font-size="14" font-weight="bold">Commutativity</text>
  <text x="130" y="140" text-anchor="middle" fill="#ef9a9a" font-size="11">ab ≠ ba: eml(0,1)=1 ≠ e=eml(1,0)</text>
  <text x="185" y="105" fill="#f44336" font-size="16">✗</text>

  <rect x="250" y="90" width="200" height="70" rx="10" fill="#1c1c1c" stroke="#f44336" stroke-width="2"/>
  <text x="350" y="118" text-anchor="middle" fill="#f44336" font-size="14" font-weight="bold">Associativity</text>
  <text x="350" y="140" text-anchor="middle" fill="#ef9a9a" font-size="11">(ab)c ≠ a(bc): e ≠ 0</text>
  <text x="405" y="105" fill="#f44336" font-size="16">✗</text>

  <rect x="470" y="90" width="200" height="70" rx="10" fill="#1c1c1c" stroke="#f44336" stroke-width="2"/>
  <text x="570" y="118" text-anchor="middle" fill="#f44336" font-size="14" font-weight="bold">Left Identity</text>
  <text x="570" y="140" text-anchor="middle" fill="#ef9a9a" font-size="11">¬∃e: ea = a for all a</text>
  <text x="625" y="105" fill="#f44336" font-size="16">✗</text>

  <rect x="690" y="90" width="180" height="70" rx="10" fill="#1c1c1c" stroke="#f44336" stroke-width="2"/>
  <text x="780" y="118" text-anchor="middle" fill="#f44336" font-size="14" font-weight="bold">Right Identity</text>
  <text x="780" y="140" text-anchor="middle" fill="#ef9a9a" font-size="11">¬∃e: ae = a for all a</text>
  <text x="830" y="105" fill="#f44336" font-size="16">✗</text>

  <!-- Row 2 -->
  <rect x="30" y="185" width="200" height="70" rx="10" fill="#1c1c1c" stroke="#ff9800" stroke-width="2"/>
  <text x="130" y="213" text-anchor="middle" fill="#ff9800" font-size="14" font-weight="bold">Power Associative</text>
  <text x="130" y="235" text-anchor="middle" fill="#ffcc80" font-size="11">x(xx) ≠ (xx)x (V5-V6)</text>
  <text x="185" y="200" fill="#ff9800" font-size="16">✗</text>

  <rect x="250" y="185" width="200" height="70" rx="10" fill="#1c1c1c" stroke="#ff9800" stroke-width="2"/>
  <text x="350" y="213" text-anchor="middle" fill="#ff9800" font-size="14" font-weight="bold">Left Alternative</text>
  <text x="350" y="235" text-anchor="middle" fill="#ffcc80" font-size="11">(aa)b ≠ a(ab) (V7 NEW)</text>
  <text x="405" y="200" fill="#ff9800" font-size="16">✗</text>

  <rect x="470" y="185" width="200" height="70" rx="10" fill="#1c1c1c" stroke="#ff9800" stroke-width="2"/>
  <text x="570" y="213" text-anchor="middle" fill="#ff9800" font-size="14" font-weight="bold">Right Alternative</text>
  <text x="570" y="235" text-anchor="middle" fill="#ffcc80" font-size="11">a(bb) ≠ (ab)b (V7 NEW)</text>
  <text x="625" y="200" fill="#ff9800" font-size="16">✗</text>

  <rect x="690" y="185" width="180" height="70" rx="10" fill="#1c1c1c" stroke="#ff9800" stroke-width="2"/>
  <text x="780" y="213" text-anchor="middle" fill="#ff9800" font-size="14" font-weight="bold">Flexibility</text>
  <text x="780" y="235" text-anchor="middle" fill="#ffcc80" font-size="11">(ab)a ≠ a(ba) (V7 NEW)</text>
  <text x="830" y="200" fill="#ff9800" font-size="16">✗</text>

  <!-- Row 3 -->
  <rect x="140" y="280" width="200" height="70" rx="10" fill="#1c1c1c" stroke="#ffd700" stroke-width="2"/>
  <text x="240" y="308" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">Mediality</text>
  <text x="240" y="330" text-anchor="middle" fill="#fff59d" font-size="11">(ab)(cd) ≠ (ac)(bd) (V7 NEW)</text>
  <text x="295" y="295" fill="#ffd700" font-size="16">✗</text>

  <rect x="560" y="280" width="200" height="70" rx="10" fill="#1c1c1c" stroke="#4caf50" stroke-width="2"/>
  <text x="660" y="308" text-anchor="middle" fill="#4caf50" font-size="14" font-weight="bold">Magma</text>
  <text x="660" y="330" text-anchor="middle" fill="#a5d6a7" font-size="11">Closed binary operation ✓</text>
  <text x="715" y="295" fill="#4caf50" font-size="16">✓</text>

  <!-- Hierarchy diagram -->
  <text x="450" y="390" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">
    Algebraic Hierarchy (EML fails at every level above Magma)
  </text>

  <!-- Nested boxes showing hierarchy -->
  <rect x="50" y="410" width="800" height="160" rx="12" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="60" y="430" fill="#666" font-size="11">Group</text>

  <rect x="80" y="440" width="740" height="120" rx="10" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="90" y="458" fill="#888" font-size="11">Quasigroup</text>

  <rect x="110" y="468" width="680" height="82" rx="8" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="120" y="485" fill="#aaa" font-size="11">Semigroup</text>

  <rect x="140" y="495" width="620" height="45" rx="6" fill="#1b5e20" fill-opacity="0.3" stroke="#4caf50" stroke-width="2"/>
  <text x="450" y="522" text-anchor="middle" fill="#4caf50" font-size="16" font-weight="bold">
    EML Magma (ℝ, eml) — HERE
  </text>

  <!-- Arrows showing what's excluded -->
  <g fill="#f44336" font-size="20">
    <text x="830" y="430">✗</text>
    <text x="800" y="458">✗</text>
    <text x="770" y="485">✗</text>
  </g>
</svg>
