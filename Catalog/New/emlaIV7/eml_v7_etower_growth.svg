<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <filter id="glowe">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bge)"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#f0c040" font-size="22" font-weight="bold" filter="url(#glowe)">
    E-Tower Superexponential Growth
  </text>
  <text x="400" y="62" text-anchor="middle" fill="#888" font-size="13">
    e↑↑(n+2) ≥ exp(2ⁿ) — Proved in Lean 4
  </text>
  
  <!-- Tower visualization -->
  <g transform="translate(100, 90)">
    <!-- Level 0 -->
    <rect x="0" y="340" width="120" height="30" rx="5" fill="#1a3a1a" stroke="#40c040" stroke-width="1.5"/>
    <text x="60" y="360" text-anchor="middle" fill="#40c040" font-size="14" font-weight="bold">e↑↑0 = 1</text>
    
    <!-- Level 1 -->
    <rect x="0" y="295" width="120" height="35" rx="5" fill="#1a3a2a" stroke="#40c040" stroke-width="1.5"/>
    <text x="60" y="317" text-anchor="middle" fill="#60e060" font-size="14" font-weight="bold">e↑↑1 = e</text>
    <text x="140" y="317" fill="#888" font-size="12">≈ 2.718</text>
    
    <!-- Level 2 -->
    <rect x="0" y="240" width="120" height="45" rx="5" fill="#1a4a2a" stroke="#60e060" stroke-width="1.5"/>
    <text x="60" y="267" text-anchor="middle" fill="#80ff80" font-size="15" font-weight="bold">e↑↑2 = eᵉ</text>
    <text x="140" y="267" fill="#888" font-size="12">≈ 15.15</text>
    
    <!-- Level 3 -->
    <rect x="0" y="170" width="120" height="60" rx="5" fill="#2a5a2a" stroke="#80ff80" stroke-width="2"/>
    <text x="60" y="200" text-anchor="middle" fill="#a0ffa0" font-size="16" font-weight="bold">e↑↑3</text>
    <text x="60" y="220" text-anchor="middle" fill="#80ff80" font-size="11">= e^(eᵉ)</text>
    <text x="140" y="205" fill="#888" font-size="12">≈ 3,814,279</text>
    
    <!-- Level 4 -->
    <rect x="0" y="80" width="120" height="80" rx="5" fill="#3a6a3a" stroke="#a0ffa0" stroke-width="2"/>
    <text x="60" y="115" text-anchor="middle" fill="#c0ffc0" font-size="17" font-weight="bold">e↑↑4</text>
    <text x="60" y="140" text-anchor="middle" fill="#a0ffa0" font-size="10">1.6 million</text>
    <text x="60" y="155" text-anchor="middle" fill="#a0ffa0" font-size="10">digits</text>
    
    <!-- Level 5 -->
    <rect x="0" y="0" width="120" height="70" rx="5" fill="#4a7a4a" stroke="#c0ffc0" stroke-width="2" filter="url(#glowe)"/>
    <text x="60" y="30" text-anchor="middle" fill="#e0ffe0" font-size="18" font-weight="bold">e↑↑5</text>
    <text x="60" y="50" text-anchor="middle" fill="#c0ffc0" font-size="10"># of digits &gt;</text>
    <text x="60" y="65" text-anchor="middle" fill="#c0ffc0" font-size="10"># atoms in universe</text>
  </g>
  
  <!-- Bound comparison -->
  <g transform="translate(350, 100)">
    <text x="0" y="0" fill="#f0c040" font-size="16" font-weight="bold">Superexponential Bound</text>
    <text x="0" y="25" fill="#fda" font-size="13">e↑↑(n+2) ≥ exp(2ⁿ)</text>
    
    <text x="0" y="60" fill="#aaa" font-size="13" font-weight="bold">n │  e↑↑(n+2)  │  exp(2ⁿ)  │  Ratio</text>
    <line x1="0" y1="70" x2="350" y2="70" stroke="#555" stroke-width="1"/>
    
    <text x="0" y="90" fill="#ccc" font-size="12" font-family="monospace">0 │      15.15  │     2.72  │   5.57</text>
    <text x="0" y="110" fill="#ccc" font-size="12" font-family="monospace">1 │ 3,814,279  │    54.60  │ 69,851</text>
    <text x="0" y="130" fill="#ccc" font-size="12" font-family="monospace">2 │  10^1.6M   │  2,981    │ 10^1.6M</text>
    <text x="0" y="150" fill="#ccc" font-size="12" font-family="monospace">3 │     ∞∞∞    │  8,886    │    ∞∞∞</text>
    
    <text x="0" y="185" fill="#888" font-size="11">The e-tower outpaces exp(2ⁿ) by</text>
    <text x="0" y="200" fill="#888" font-size="11">an incomprehensibly large margin.</text>
    
    <!-- Key insight box -->
    <rect x="0" y="230" width="380" height="60" rx="8" fill="#2a1a0a" stroke="#f0c040" stroke-width="1.5"/>
    <text x="190" y="255" text-anchor="middle" fill="#f0c040" font-size="13" font-weight="bold">Key: exp(t) ≥ 2t for t ≥ 1</text>
    <text x="190" y="278" text-anchor="middle" fill="#fda" font-size="11">
      Uses exp(t) ≥ 1 + t + t²/2 ≥ 2t (quadratic bound)
    </text>
  </g>
  
  <!-- Bottom note -->
  <rect x="100" y="440" width="600" height="40" rx="8" fill="#1a2a1e" stroke="#40c040" stroke-width="1"/>
  <text x="400" y="465" text-anchor="middle" fill="#40c040" font-size="13">
    ✓ eTower7_pos | ✓ eTower7_strictMono | ✓ eTower7_superexp — All verified in Lean 4
  </text>
</svg>
