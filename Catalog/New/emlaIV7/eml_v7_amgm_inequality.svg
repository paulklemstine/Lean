<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <filter id="glowa">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bga)"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#f0c040" font-size="22" font-weight="bold" filter="url(#glowa)">
    The AM-GM Bridge via EML
  </text>
  
  <!-- Main inequality -->
  <rect x="150" y="60" width="500" height="50" rx="10" fill="#2a2a1e" stroke="#f0c040" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">
    a + b − ln(a) − ln(b) ≥ 2
  </text>
  
  <!-- Building blocks -->
  <text x="400" y="135" text-anchor="middle" fill="#888" font-size="14">Built from the fundamental inequality:</text>
  
  <rect x="250" y="145" width="300" height="40" rx="8" fill="#1a2a2e" stroke="#00c8ff" stroke-width="1.5"/>
  <text x="400" y="170" text-anchor="middle" fill="#00c8ff" font-size="16">t − ln(t) ≥ 1   ∀t &gt; 0</text>
  
  <!-- Graph of t - ln(t) -->
  <g transform="translate(50, 200)">
    <text x="150" y="0" text-anchor="middle" fill="#aaa" font-size="13" font-weight="bold">f(t) = t − ln(t)</text>
    
    <!-- Axes -->
    <line x1="30" y1="180" x2="280" y2="180" stroke="#555" stroke-width="1"/>
    <line x1="30" y1="180" x2="30" y2="10" stroke="#555" stroke-width="1"/>
    <text x="155" y="198" text-anchor="middle" fill="#888" font-size="10">t</text>
    <text x="15" y="100" text-anchor="middle" fill="#888" font-size="10" transform="rotate(-90,15,100)">f(t)</text>
    
    <!-- f = 1 line -->
    <line x1="30" y1="130" x2="280" y2="130" stroke="#f0c040" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="285" y="133" fill="#f0c040" font-size="10">f = 1</text>
    
    <!-- Curve t - ln(t) -->
    <!-- Using points: t=0.1→3.40, t=0.3→1.90, t=0.5→1.19, t=0.7→1.06, t=1→1, t=1.5→1.09, t=2→1.31, t=3→1.90, t=4→2.61 -->
    <!-- Scale: t: 0→4 maps to x: 30→280, f: 0→4 maps to y: 180→10 -->
    <path d="M 43,37 Q 80,100 93,110 Q 130,140 155,130 Q 180,120 218,100 Q 250,80 280,50" 
          fill="none" stroke="#00c8ff" stroke-width="2.5" filter="url(#glowa)"/>
    
    <!-- Minimum at t = 1, f = 1 -->
    <circle cx="93" cy="130" r="4" fill="#ff4040" filter="url(#glowa)"/>
    <text x="93" y="150" text-anchor="middle" fill="#ff8080" font-size="10">min at t=1</text>
    <text x="93" y="162" text-anchor="middle" fill="#ff8080" font-size="9">f(1) = 1</text>
    
    <!-- Tick marks -->
    <text x="93" y="192" text-anchor="middle" fill="#888" font-size="9">1</text>
    <text x="155" y="192" text-anchor="middle" fill="#888" font-size="9">2</text>
    <text x="218" y="192" text-anchor="middle" fill="#888" font-size="9">3</text>
    <text x="18" y="133" text-anchor="end" fill="#888" font-size="9">1</text>
    <text x="18" y="88" text-anchor="end" fill="#888" font-size="9">2</text>
  </g>
  
  <!-- Connection explanation -->
  <g transform="translate(400, 210)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#1a1a3e" stroke="#4080ff" stroke-width="1"/>
    
    <text x="175" y="25" text-anchor="middle" fill="#4080ff" font-size="14" font-weight="bold">How It Works</text>
    
    <text x="20" y="55" fill="#adf" font-size="12">Since ln(t) ≤ t − 1 for all t &gt; 0:</text>
    <text x="20" y="75" fill="#ccc" font-size="12">  t − ln(t) ≥ t − (t − 1) = 1</text>
    
    <text x="20" y="105" fill="#adf" font-size="12">Apply to both a and b:</text>
    <text x="20" y="125" fill="#ccc" font-size="12">  (a − ln a) + (b − ln b) ≥ 1 + 1 = 2</text>
    
    <text x="20" y="155" fill="#fda" font-size="12">Equality iff a = b = 1</text>
    <text x="20" y="175" fill="#888" font-size="11">(the unique minimum of t − ln t)</text>
    
    <text x="175" y="198" text-anchor="middle" fill="#4a8" font-size="10">Lean: linarith [log_le_sub_one_of_pos]</text>
  </g>
  
  <!-- Bottom banner -->
  <rect x="100" y="415" width="600" height="30" rx="6" fill="#1a2a1e" stroke="#40c040" stroke-width="1"/>
  <text x="400" y="435" text-anchor="middle" fill="#40c040" font-size="12">
    ✓ eml7_am_gm_connection | ✓ eml7_t_minus_log_ge_one — Formally verified in Lean 4
  </text>
</svg>
