<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg4)"/>

  <text x="500" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">
    EML Optimization &amp; Convergence Theory
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#94a3b8" font-size="12">
    Formally verified training dynamics and convergence guarantees
  </text>

  <!-- Learning Rate Schedules -->
  <rect x="30" y="90" width="460" height="260" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="115" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold">Learning Rate Schedules</text>

  <!-- Mini chart area -->
  <rect x="60" y="130" width="400" height="180" rx="5" fill="#0f172a"/>

  <!-- Constant LR -->
  <line x1="80" y1="160" x2="440" y2="160" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="445" y="164" fill="#f87171" font-size="9">Constant</text>

  <!-- Cosine LR -->
  <path d="M 80 160 Q 140 200, 200 240 Q 260 280, 320 240 Q 380 200, 440 290"
        stroke="#8b5cf6" stroke-width="2" fill="none"/>
  <text x="445" y="294" fill="#a78bfa" font-size="9">Cosine</text>

  <!-- Exponential Decay -->
  <path d="M 80 160 Q 160 180, 200 210 Q 260 240, 320 260 Q 380 275, 440 280"
        stroke="#10b981" stroke-width="2" fill="none"/>
  <text x="445" y="278" fill="#34d399" font-size="9">Exp Decay</text>

  <!-- Warmup + Decay -->
  <path d="M 80 290 L 150 160 L 200 165 Q 260 180, 320 210 Q 380 240, 440 265"
        stroke="#3b82f6" stroke-width="2.5" fill="none"/>
  <text x="445" y="268" fill="#60a5fa" font-size="9">Warmup</text>

  <text x="260" y="330" text-anchor="middle" fill="#94a3b8" font-size="10">
    ✓ exp_decay_mono: η·γ^t₂ ≤ η·γ^t₁ for t₁ ≤ t₂
  </text>
  <text x="260" y="345" text-anchor="middle" fill="#94a3b8" font-size="10">
    ✓ warmup_reaches_target: warmupLR η W W = η
  </text>

  <!-- Gradient Flow -->
  <rect x="510" y="90" width="460" height="260" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="740" y="115" text-anchor="middle" fill="#34d399" font-size="16" font-weight="bold">Gradient Flow Analysis</text>

  <rect x="540" y="130" width="400" height="180" rx="5" fill="#0f172a"/>

  <!-- Vanishing gradient (no skip) -->
  <path d="M 560 160 Q 620 170, 680 210 Q 740 260, 800 285 Q 860 295, 920 298"
        stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="5,3"/>

  <!-- With skip connections -->
  <path d="M 560 160 Q 620 163, 680 167 Q 740 172, 800 178 Q 860 185, 920 192"
        stroke="#3b82f6" stroke-width="2.5" fill="none"/>

  <!-- Annotations -->
  <text x="920" y="195" fill="#60a5fa" font-size="9" font-weight="bold">+ Skip</text>
  <text x="920" y="302" fill="#f87171" font-size="9">No skip</text>

  <text x="740" y="175" text-anchor="middle" fill="#22c55e" font-size="10">1 + r^d (residual)</text>
  <text x="740" y="280" text-anchor="middle" fill="#ef4444" font-size="10">r^d (vanishing)</text>

  <text x="740" y="330" text-anchor="middle" fill="#94a3b8" font-size="10">
    ✓ skip_prevents_vanishing: r^d ≤ 1 + r^d
  </text>
  <text x="740" y="345" text-anchor="middle" fill="#94a3b8" font-size="10">
    ✓ gradient_vanishing: r^d₂ ≤ r^d₁ for d₁ ≤ d₂
  </text>

  <!-- Convergence Bounds -->
  <rect x="30" y="370" width="460" height="280" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260" y="395" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">Convergence Guarantees</text>

  <rect x="60" y="410" width="400" height="190" rx="5" fill="#0f172a"/>

  <!-- GD convergence curve -->
  <path d="M 80 420 Q 120 480, 160 530 Q 200 560, 260 575 Q 320 582, 380 585 L 440 587"
        stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <text x="445" y="587" fill="#fbbf24" font-size="9">Standard</text>

  <!-- EML convergence (faster) -->
  <path d="M 80 420 Q 110 500, 140 555 Q 170 575, 220 582 Q 280 586, 340 587 L 440 588"
        stroke="#3b82f6" stroke-width="2.5" fill="none"/>
  <text x="445" y="575" fill="#60a5fa" font-size="9">EML</text>

  <!-- Loss level annotation -->
  <line x1="80" y1="587" x2="440" y2="587" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="260" y="595" text-anchor="middle" fill="#475569" font-size="8">L∞ (irreducible)</text>

  <text x="260" y="620" text-anchor="middle" fill="#94a3b8" font-size="10">
    ✓ gd_convergence_improves: L·R²/(2t) decreasing in t
  </text>
  <text x="260" y="638" text-anchor="middle" fill="#94a3b8" font-size="10">
    ✓ eml_depth_helps_convergence: deeper = faster/param
  </text>

  <!-- Momentum & Clipping -->
  <rect x="510" y="370" width="460" height="280" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="740" y="395" text-anchor="middle" fill="#a78bfa" font-size="16" font-weight="bold">Training Stabilization</text>

  <!-- Momentum diagram -->
  <g transform="translate(540, 415)">
    <text x="100" y="0" text-anchor="middle" fill="#94a3b8" font-size="12">Momentum Accumulation</text>

    <rect x="10" y="15" width="180" height="70" rx="5" fill="#0f172a"/>
    <text x="100" y="40" text-anchor="middle" fill="#a78bfa" font-size="11">v_{t+1} = β·v_t + g_t</text>
    <text x="100" y="60" text-anchor="middle" fill="#94a3b8" font-size="10">bounded: g·(1-β^k)/(1-β)</text>
    <text x="100" y="75" text-anchor="middle" fill="#22c55e" font-size="9">✓ momentum_bounded</text>
  </g>

  <!-- Gradient clipping -->
  <g transform="translate(540, 510)">
    <text x="100" y="0" text-anchor="middle" fill="#94a3b8" font-size="12">Gradient Clipping</text>

    <rect x="10" y="15" width="180" height="70" rx="5" fill="#0f172a"/>
    <text x="100" y="38" text-anchor="middle" fill="#a78bfa" font-size="11">clip(g, τ) = min(|g|, τ)</text>
    <text x="100" y="56" text-anchor="middle" fill="#22c55e" font-size="9">✓ clip_bounded: clip(g,τ) ≤ τ</text>
    <text x="100" y="72" text-anchor="middle" fill="#22c55e" font-size="9">✓ clip_preserves_small</text>
  </g>

  <!-- Curvature -->
  <g transform="translate(740, 415)">
    <text x="100" y="0" text-anchor="middle" fill="#94a3b8" font-size="12">EML Curvature</text>

    <rect x="10" y="15" width="180" height="70" rx="5" fill="#0f172a"/>
    <text x="100" y="38" text-anchor="middle" fill="#a78bfa" font-size="11">L = w_max²</text>
    <text x="100" y="56" text-anchor="middle" fill="#94a3b8" font-size="10">Bounded by weight norm</text>
    <text x="100" y="72" text-anchor="middle" fill="#22c55e" font-size="9">✓ eml_curvature_scales</text>
  </g>

  <!-- Step size -->
  <g transform="translate(740, 510)">
    <text x="100" y="0" text-anchor="middle" fill="#94a3b8" font-size="12">Optimal Step Size</text>

    <rect x="10" y="15" width="180" height="70" rx="5" fill="#0f172a"/>
    <text x="100" y="38" text-anchor="middle" fill="#a78bfa" font-size="11">η* = 1/L</text>
    <text x="100" y="56" text-anchor="middle" fill="#94a3b8" font-size="10">Guaranteed progress</text>
    <text x="100" y="72" text-anchor="middle" fill="#22c55e" font-size="9">✓ optimal_step_pos</text>
  </g>

  <!-- Footer -->
  <text x="500" y="680" text-anchor="middle" fill="#475569" font-size="11">
    30+ optimization theorems · All formally verified in Lean 4 · Zero sorries
  </text>
</svg>
