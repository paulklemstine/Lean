<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bg3)"/>

  <text x="500" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">
    EML Scaling Advantage: Parameters vs Expressivity
  </text>

  <!-- Chart area -->
  <rect x="80" y="70" width="860" height="420" rx="10" fill="#1e293b" stroke="#334155"/>

  <!-- Y axis -->
  <line x1="120" y1="90" x2="120" y2="470" stroke="#475569" stroke-width="1"/>
  <text x="40" y="280" text-anchor="middle" fill="#94a3b8" font-size="13" transform="rotate(-90, 40, 280)">
    Expressivity (function classes)
  </text>

  <!-- X axis -->
  <line x1="120" y1="470" x2="900" y2="470" stroke="#475569" stroke-width="1"/>
  <text x="510" y="510" text-anchor="middle" fill="#94a3b8" font-size="13">
    Parameter Count
  </text>

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.5">
    <line x1="120" y1="150" x2="900" y2="150"/>
    <line x1="120" y1="230" x2="900" y2="230"/>
    <line x1="120" y1="310" x2="900" y2="310"/>
    <line x1="120" y1="390" x2="900" y2="390"/>
    <line x1="280" y1="90" x2="280" y2="470"/>
    <line x1="440" y1="90" x2="440" y2="470"/>
    <line x1="600" y1="90" x2="600" y2="470"/>
    <line x1="760" y1="90" x2="760" y2="470"/>
  </g>

  <!-- EML curve (exponential growth) -->
  <path d="M 150 450 Q 250 420, 350 370 Q 450 300, 500 230 Q 550 170, 650 130 Q 750 100, 880 95"
        stroke="#3b82f6" stroke-width="3" fill="none"/>
  <text x="880" y="88" fill="#60a5fa" font-size="12" font-weight="bold">EML: 3^d</text>

  <!-- Standard MLP curve (linear) -->
  <path d="M 150 450 L 300 420 L 450 390 L 600 360 L 750 330 L 880 305"
        stroke="#ef4444" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
  <text x="880" y="298" fill="#f87171" font-size="12" font-weight="bold">MLP: d·w</text>

  <!-- Fill between -->
  <path d="M 150 450 Q 250 420, 350 370 Q 450 300, 500 230 Q 550 170, 650 130 Q 750 100, 880 95
           L 880 305 L 750 330 L 600 360 L 450 390 L 300 420 L 150 450 Z"
        fill="#3b82f6" opacity="0.08"/>

  <!-- Annotation -->
  <rect x="500" y="230" width="200" height="80" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="255" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">EML Advantage</text>
  <text x="600" y="275" text-anchor="middle" fill="#94a3b8" font-size="11">Exponential expressivity</text>
  <text x="600" y="293" text-anchor="middle" fill="#94a3b8" font-size="11">with linear parameters</text>

  <!-- Key metrics -->
  <g font-size="11">
    <rect x="100" y="530" width="160" height="50" rx="8" fill="#1e293b" stroke="#3b82f6"/>
    <text x="180" y="553" text-anchor="middle" fill="#60a5fa" font-weight="bold">252× Compression</text>
    <text x="180" y="570" text-anchor="middle" fill="#94a3b8">Distillation ✓</text>

    <rect x="280" y="530" width="140" height="50" rx="8" fill="#1e293b" stroke="#8b5cf6"/>
    <text x="350" y="553" text-anchor="middle" fill="#a78bfa" font-weight="bold">O(dw) FLOPs</text>
    <text x="350" y="570" text-anchor="middle" fill="#94a3b8">vs O(dw²) ✓</text>

    <rect x="440" y="530" width="140" height="50" rx="8" fill="#1e293b" stroke="#10b981"/>
    <text x="510" y="553" text-anchor="middle" fill="#34d399" font-weight="bold">4dw Params</text>
    <text x="510" y="570" text-anchor="middle" fill="#94a3b8">vs dw² ✓</text>

    <rect x="600" y="530" width="140" height="50" rx="8" fill="#1e293b" stroke="#f59e0b"/>
    <text x="670" y="553" text-anchor="middle" fill="#fbbf24" font-weight="bold">σ(x) ∈ [0,1]</text>
    <text x="670" y="570" text-anchor="middle" fill="#94a3b8">Bounded ✓</text>

    <rect x="760" y="530" width="160" height="50" rx="8" fill="#1e293b" stroke="#ef4444"/>
    <text x="840" y="553" text-anchor="middle" fill="#f87171" font-weight="bold">√k Composition</text>
    <text x="840" y="570" text-anchor="middle" fill="#94a3b8">DP Privacy ✓</text>
  </g>
</svg>
