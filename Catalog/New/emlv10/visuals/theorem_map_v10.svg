<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4488ff"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold">
    Gravitational Factoring — Theorem Map v10
  </text>
  <text x="600" y="70" text-anchor="middle" fill="#88aaff" font-size="14">
    280+ Formally Verified Theorems · 8 New Lean Files · 40+ New Results
  </text>

  <!-- Quadratic Reciprocity Cluster -->
  <rect x="30" y="100" width="270" height="200" rx="15" fill="#1a2a5a" stroke="#4488ff" stroke-width="2"/>
  <text x="165" y="125" text-anchor="middle" fill="#66aaff" font-size="16" font-weight="bold">Quadratic Reciprocity</text>
  <circle cx="55" cy="150" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="155" fill="#ccddff" font-size="11">QR Law (full)</text>
  <circle cx="55" cy="175" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="180" fill="#ccddff" font-size="11">(-1/p) = (-1)^((p-1)/2)</text>
  <circle cx="55" cy="200" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="205" fill="#ccddff" font-size="11">(2/p) = (-1)^((p²-1)/8)</text>
  <circle cx="55" cy="225" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="230" fill="#ccddff" font-size="11">Σ(a/p) = 0</text>
  <circle cx="55" cy="250" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="255" fill="#ccddff" font-size="11">First + Second Supplements</text>
  <circle cx="55" cy="275" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="280" fill="#ccddff" font-size="11">QNR × QNR = QR</text>

  <!-- Euclid-Euler Cluster -->
  <rect x="320" y="100" width="270" height="200" rx="15" fill="#1a3a2a" stroke="#00ff88" stroke-width="2"/>
  <text x="455" y="125" text-anchor="middle" fill="#66ffaa" font-size="16" font-weight="bold">Euclid-Euler Complete</text>
  <circle cx="345" cy="150" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="155" fill="#ccffdd" font-size="11">σ₁ multiplicative</text>
  <circle cx="345" cy="175" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="180" fill="#ccffdd" font-size="11">Euclid direction ✓</text>
  <circle cx="345" cy="200" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="205" fill="#ccffdd" font-size="11">Euler direction ✓</text>
  <circle cx="345" cy="225" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="230" fill="#ccffdd" font-size="11">Full iff ✓</text>
  <circle cx="345" cy="250" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="255" fill="#ccffdd" font-size="11">No odd perfect &lt; 10⁴</text>
  <circle cx="345" cy="275" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="280" fill="#ccffdd" font-size="11">6, 28, 496, 8128 verified</text>

  <!-- Arithmetic Functions Cluster -->
  <rect x="610" y="100" width="270" height="200" rx="15" fill="#3a1a2a" stroke="#ff6688" stroke-width="2"/>
  <text x="745" y="125" text-anchor="middle" fill="#ff88aa" font-size="16" font-weight="bold">Arithmetic Functions</text>
  <circle cx="635" cy="150" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="650" y="155" fill="#ffccdd" font-size="11">τ multiplicative</text>
  <circle cx="635" cy="175" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="650" y="180" fill="#ffccdd" font-size="11">τ(p^k) = k+1</text>
  <circle cx="635" cy="200" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="650" y="205" fill="#ffccdd" font-size="11">φ(p^k) = p^k - p^(k-1)</text>
  <circle cx="635" cy="225" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="650" y="230" fill="#ffccdd" font-size="11">μ(p) = -1</text>
  <circle cx="635" cy="250" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="650" y="255" fill="#ffccdd" font-size="11">Möbius inversion</text>
  <circle cx="635" cy="275" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="650" y="280" fill="#ffccdd" font-size="11">12 smallest abundant</text>

  <!-- Fibonacci/Pisano Cluster -->
  <rect x="900" y="100" width="270" height="200" rx="15" fill="#2a2a1a" stroke="#ffaa44" stroke-width="2"/>
  <text x="1035" y="125" text-anchor="middle" fill="#ffcc66" font-size="16" font-weight="bold">Fibonacci Theory</text>
  <circle cx="925" cy="150" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="940" y="155" fill="#ffeecc" font-size="11">Pisano periodicity</text>
  <circle cx="925" cy="175" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="940" y="180" fill="#ffeecc" font-size="11">F(n)²+F(n+1)²=F(2n+1)</text>
  <circle cx="925" cy="200" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="940" y="205" fill="#ffeecc" font-size="11">Entry point divides</text>
  <circle cx="925" cy="225" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="940" y="230" fill="#ffeecc" font-size="11">L(n) = F(n-1)+F(n+1)</text>
  <circle cx="925" cy="250" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="940" y="255" fill="#ffeecc" font-size="11">F(2n) = F(n)·L(n)</text>

  <!-- Energy Landscape Cluster -->
  <rect x="30" y="340" width="270" height="200" rx="15" fill="#1a1a3a" stroke="#aa66ff" stroke-width="2"/>
  <text x="165" y="365" text-anchor="middle" fill="#bb88ff" font-size="16" font-weight="bold">Energy Landscape</text>
  <circle cx="55" cy="390" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="395" fill="#ddccff" font-size="11">Divisors = local minima</text>
  <circle cx="55" cy="415" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="420" fill="#ddccff" font-size="11">Sublevel filtration</text>
  <circle cx="55" cy="440" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="445" fill="#ddccff" font-size="11">sublevel(0) = divisors</text>
  <circle cx="55" cy="465" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="70" y="470" fill="#ddccff" font-size="11">Monotone sublevel card</text>
  <circle cx="55" cy="490" r="8" fill="#ffaa44" filter="url(#glow)"/>
  <text x="70" y="495" fill="#ddccff" font-size="11">Gradient descent (open)</text>

  <!-- Quadratic Sieve Cluster -->
  <rect x="320" y="340" width="270" height="200" rx="15" fill="#2a1a1a" stroke="#ff4444" stroke-width="2"/>
  <text x="455" y="365" text-anchor="middle" fill="#ff6666" font-size="16" font-weight="bold">Quadratic Sieve</text>
  <circle cx="345" cy="390" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="395" fill="#ffcccc" font-size="11">Fermat diff of squares</text>
  <circle cx="345" cy="415" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="420" fill="#ffcccc" font-size="11">x²≡y² → factor</text>
  <circle cx="345" cy="440" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="445" fill="#ffcccc" font-size="11">Smooth product congruence</text>
  <circle cx="345" cy="465" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="360" y="470" fill="#ffcccc" font-size="11">Factor base verified</text>

  <!-- Wieferich Cluster -->
  <rect x="610" y="340" width="270" height="200" rx="15" fill="#1a2a2a" stroke="#44dddd" stroke-width="2"/>
  <text x="745" y="365" text-anchor="middle" fill="#66eeff" font-size="16" font-weight="bold">Wieferich Theory</text>
  <circle cx="635" cy="390" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="650" y="395" fill="#ccffff" font-size="11">Non-Wieferich p ≤ 199</text>
  <circle cx="635" cy="415" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="650" y="420" fill="#ccffff" font-size="11">Fermat quotient ↔</text>
  <circle cx="635" cy="440" r="8" fill="#00ff88" filter="url(#glow)"/>
  <text x="650" y="445" fill="#ccffff" font-size="11">1093, 3511 verified</text>
  <circle cx="635" cy="465" r="8" fill="#ffaa44" filter="url(#glow)"/>
  <text x="650" y="470" fill="#ccffff" font-size="11">ABC → ∞ non-Wieferich</text>

  <!-- Statistics Box -->
  <rect x="900" y="340" width="270" height="200" rx="15" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
  <text x="1035" y="375" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">v10 Statistics</text>
  <text x="920" y="410" fill="#00ff88" font-size="14">● Proved: 40+ new</text>
  <text x="920" y="435" fill="#00ff88" font-size="14">● Total: 280+</text>
  <text x="920" y="460" fill="#ffaa44" font-size="14">● Remaining: 3 sorry</text>
  <text x="920" y="485" fill="#88aaff" font-size="14">● New files: 8 Lean</text>
  <text x="920" y="510" fill="#88aaff" font-size="14">● New demos: 3 Python</text>

  <!-- Connections -->
  <line x1="300" y1="200" x2="320" y2="200" stroke="#4488ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="200" x2="610" y2="200" stroke="#4488ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="165" y1="300" x2="165" y2="340" stroke="#4488ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="300" x2="455" y2="340" stroke="#4488ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="440" x2="320" y2="440" stroke="#4488ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="580" width="1140" height="300" rx="15" fill="#0a0a1e" stroke="#333366" stroke-width="1"/>
  <text x="600" y="610" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">
    Key Open Questions Answered in v10
  </text>

  <text x="60" y="645" fill="#00ff88" font-size="13">✓ Can quadratic reciprocity be fully formalized? → YES (proved all supplements + main law)</text>
  <text x="60" y="670" fill="#00ff88" font-size="13">✓ Complete Euclid-Euler characterization? → YES (full iff proved: even perfect ↔ Euclid form)</text>
  <text x="60" y="695" fill="#00ff88" font-size="13">✓ Möbius inversion formula? → YES (formally verified)</text>
  <text x="60" y="720" fill="#00ff88" font-size="13">✓ Fibonacci periodicity (Pisano)? → YES (pigeonhole proof)</text>
  <text x="60" y="745" fill="#00ff88" font-size="13">✓ Congruence of squares → factoring? → YES (gcd extraction proved)</text>
  <text x="60" y="770" fill="#00ff88" font-size="13">✓ Wieferich ↔ Fermat quotient? → YES (equivalence proved)</text>
  <text x="60" y="795" fill="#ffaa44" font-size="13">○ Gradient descent convergence → OPEN (algorithmically complex)</text>
  <text x="60" y="820" fill="#ffaa44" font-size="13">○ ABC → infinitely many non-Wieferich → OPEN (deep conjecture)</text>
  <text x="60" y="845" fill="#88aaff" font-size="13">★ 40+ new formally verified theorems across 8 new Lean files</text>
</svg>
