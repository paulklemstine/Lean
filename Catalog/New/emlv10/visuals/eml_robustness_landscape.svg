<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="rbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0a2838"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#rbg)"/>

  <text x="450" y="35" text-anchor="middle" fill="#81c784" font-size="22" font-weight="bold">
    EML Adversarial Robustness: Certified Safe Regions
  </text>

  <!-- Activation comparison -->
  <text x="225" y="70" text-anchor="middle" fill="#4fc3f7" font-size="16" font-weight="bold">
    EML: σ(x) = exp(−x²)
  </text>
  <text x="675" y="70" text-anchor="middle" fill="#ef9a9a" font-size="16" font-weight="bold">
    ReLU: σ(x) = max(0, x)
  </text>

  <!-- EML Gaussian curve -->
  <g transform="translate(50, 80)">
    <!-- Axes -->
    <line x1="30" y1="200" x2="350" y2="200" stroke="#555" stroke-width="1"/>
    <line x1="175" y1="40" x2="175" y2="220" stroke="#555" stroke-width="1"/>

    <!-- Gaussian curve -->
    <path d="M30,200 Q50,198 70,195 Q90,185 110,168 Q130,140 150,100 Q160,70 170,50 Q175,42 180,50 Q190,70 200,100 Q220,140 240,168 Q260,185 280,195 Q300,198 320,199 L350,200"
          fill="none" stroke="#4fc3f7" stroke-width="2.5"/>

    <!-- Certified radius (wide) -->
    <rect x="115" y="38" width="120" height="170" rx="5" fill="rgba(129,199,132,0.15)" stroke="#81c784" stroke-width="1" stroke-dasharray="4"/>
    <text x="175" y="228" text-anchor="middle" fill="#81c784" font-size="11">ε/L = 1.6 (LARGE)</text>

    <!-- Labels -->
    <text x="175" y="248" text-anchor="middle" fill="#aaa" font-size="10">Lipschitz L ≈ 0.06</text>
    <text x="30" y="215" fill="#666" font-size="9">-3</text>
    <text x="175" y="215" fill="#666" font-size="9">0</text>
    <text x="320" y="215" fill="#666" font-size="9">3</text>
  </g>

  <!-- ReLU curve -->
  <g transform="translate(500, 80)">
    <!-- Axes -->
    <line x1="30" y1="200" x2="350" y2="200" stroke="#555" stroke-width="1"/>
    <line x1="175" y1="40" x2="175" y2="220" stroke="#555" stroke-width="1"/>

    <!-- ReLU curve -->
    <path d="M30,200 L175,200 L350,40" fill="none" stroke="#ef9a9a" stroke-width="2.5"/>

    <!-- Certified radius (tiny) -->
    <rect x="170" y="180" width="10" height="25" rx="2" fill="rgba(239,154,154,0.3)" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="4"/>
    <text x="175" y="228" text-anchor="middle" fill="#ef9a9a" font-size="11">ε/L = 0.01 (TINY)</text>

    <!-- Labels -->
    <text x="175" y="248" text-anchor="middle" fill="#aaa" font-size="10">Lipschitz L ≈ 10.0</text>
    <text x="30" y="215" fill="#666" font-size="9">-3</text>
    <text x="175" y="215" fill="#666" font-size="9">0</text>
    <text x="320" y="215" fill="#666" font-size="9">3</text>
  </g>

  <!-- Comparison table -->
  <rect x="50" y="350" width="800" height="220" rx="10" fill="rgba(255,255,255,0.03)" stroke="#ffffff22"/>

  <text x="450" y="380" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold">
    Security Properties Comparison (All Formally Verified)
  </text>

  <!-- Headers -->
  <text x="120" y="410" fill="#aaa" font-size="13" font-weight="bold">Property</text>
  <text x="420" y="410" fill="#4fc3f7" font-size="13" font-weight="bold" text-anchor="middle">EML Network</text>
  <text x="680" y="410" fill="#ef9a9a" font-size="13" font-weight="bold" text-anchor="middle">ReLU Network</text>

  <line x1="70" y1="418" x2="830" y2="418" stroke="#444" stroke-width="0.5"/>

  <!-- Row 1 -->
  <text x="120" y="438" fill="#ddd" font-size="12">Lipschitz constant</text>
  <text x="420" y="438" fill="#81c784" font-size="12" text-anchor="middle">Bounded (exp decay)</text>
  <text x="680" y="438" fill="#ef9a9a" font-size="12" text-anchor="middle">Exponential in depth</text>

  <!-- Row 2 -->
  <text x="120" y="460" fill="#ddd" font-size="12">Certified radius</text>
  <text x="420" y="460" fill="#81c784" font-size="12" text-anchor="middle">Large (ε/L → ∞)</text>
  <text x="680" y="460" fill="#ef9a9a" font-size="12" text-anchor="middle">Tiny (ε/L → 0)</text>

  <!-- Row 3 -->
  <text x="120" y="482" fill="#ddd" font-size="12">Timing attacks</text>
  <text x="420" y="482" fill="#81c784" font-size="12" text-anchor="middle">0 branches ✓</text>
  <text x="680" y="482" fill="#ef9a9a" font-size="12" text-anchor="middle">w branches per layer ✗</text>

  <!-- Row 4 -->
  <text x="120" y="504" fill="#ddd" font-size="12">DP sensitivity</text>
  <text x="420" y="504" fill="#81c784" font-size="12" text-anchor="middle">√(4dw) · maxGrad</text>
  <text x="680" y="504" fill="#ef9a9a" font-size="12" text-anchor="middle">√(dw(w+1)) · maxGrad</text>

  <!-- Row 5 -->
  <text x="120" y="526" fill="#ddd" font-size="12">Privacy composition</text>
  <text x="420" y="526" fill="#81c784" font-size="12" text-anchor="middle">√k · ε (advanced)</text>
  <text x="680" y="526" fill="#ef9a9a" font-size="12" text-anchor="middle">k · ε (basic)</text>

  <!-- Row 6 -->
  <text x="120" y="548" fill="#ddd" font-size="12">Communication cost</text>
  <text x="420" y="548" fill="#81c784" font-size="12" text-anchor="middle">4dw · bits</text>
  <text x="680" y="548" fill="#ef9a9a" font-size="12" text-anchor="middle">dw(w+1) · bits</text>

  <text x="450" y="585" text-anchor="middle" fill="#666" font-size="10">
    Theorems: certified_radius_pos, eml_constant_time, eml_sensitivity_advantage, advanced_better, eml_comm_advantage
  </text>
</svg>
