<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <style>
      .title { font: bold 18px 'Helvetica Neue', Arial, sans-serif; fill: #2c3e50; }
      .label { font: 13px 'Helvetica Neue', Arial, sans-serif; fill: #555; }
      .axis-label { font: bold 14px 'Helvetica Neue', Arial, sans-serif; fill: #333; }
      .tick { font: 11px monospace; fill: #777; }
      .annotation { font: italic 12px 'Georgia', serif; fill: #c0392b; }
    </style>
  </defs>
  <rect width="700" height="400" fill="white" rx="8"/>
  <text x="350" y="30" text-anchor="middle" class="title">E-Tower Growth: e↑↑n (Superexponential)</text>
<rect x="100" y="55" width="540" height="290" fill="#fafafa" stroke="#ddd"/>
<rect x="145" y="340" width="63" height="5" fill="#3498db" rx="3" opacity="0.85"/>
<text x="176" y="360" text-anchor="middle" class="tick">e↑↑0</text>
<text x="176" y="335" text-anchor="middle" class="label">1.0</text>
<rect x="235" y="340" width="63" height="5" fill="#2ecc71" rx="3" opacity="0.85"/>
<text x="266" y="360" text-anchor="middle" class="tick">e↑↑1</text>
<text x="266" y="335" text-anchor="middle" class="label">2.7</text>
<rect x="325" y="340" width="63" height="5" fill="#e67e22" rx="3" opacity="0.85"/>
<text x="356" y="360" text-anchor="middle" class="tick">e↑↑2</text>
<text x="356" y="335" text-anchor="middle" class="label">15.2</text>
<rect x="415" y="339" width="63" height="6" fill="#e74c3c" rx="3" opacity="0.85"/>
<text x="446" y="360" text-anchor="middle" class="tick">e↑↑3</text>
<text x="446" y="334" text-anchor="middle" class="label">≈10^7</text>
<rect x="505" y="55" width="63" height="290" fill="#9b59b6" rx="3" opacity="0.85"/>
<text x="536" y="360" text-anchor="middle" class="tick">e↑↑4</text>
<text x="536" y="50" text-anchor="middle" class="label">≈10^308</text>
<text x="630" y="75" text-anchor="end" class="annotation">e↑↑(n+2) ≥ exp(2ⁿ) ✓</text>
</svg>
