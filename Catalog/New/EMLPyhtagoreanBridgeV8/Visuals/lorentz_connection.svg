<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg4)"/>

  <text x="500" y="40" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">
    The Pythagorean–Lorentz Connection
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#888" font-size="13">
    Berggren matrices ∈ O(2,1;ℤ) — the integer Lorentz group preserving a² + b² − c² = 0
  </text>

  <!-- Left panel: Pythagorean world -->
  <rect x="30" y="90" width="440" height="280" rx="15" fill="#0d1020" stroke="#334" stroke-width="1"/>
  <text x="250" y="120" text-anchor="middle" fill="#a29bfe" font-size="18" font-weight="bold">
    Pythagorean World
  </text>

  <text x="55" y="155" fill="#ddd" font-size="13">Equation: a² + b² = c²</text>
  <text x="55" y="180" fill="#ddd" font-size="13">Space: Light cone in (a, b, c) ∈ ℤ³</text>
  <text x="55" y="205" fill="#ddd" font-size="13">Symmetry: O(2,1;ℤ) preserves Q = a²+b²−c²</text>
  <text x="55" y="230" fill="#ddd" font-size="13">Generators: B₁, B₂, B₃ (Berggren matrices)</text>
  <text x="55" y="255" fill="#ddd" font-size="13">Root: (3, 4, 5) — smallest PPT</text>
  <text x="55" y="280" fill="#ddd" font-size="13">Structure: Ternary tree (3ᵈ nodes at depth d)</text>
  <text x="55" y="310" fill="#ff6b6b" font-size="13">B₁,B₃: parabolic — eigenvalue 1, tr=3</text>
  <text x="55" y="335" fill="#48dbfb" font-size="13">B₂: hyperbolic — eigenvalues −1, 3±2√2, tr=5</text>

  <!-- Right panel: Lorentz world -->
  <rect x="530" y="90" width="440" height="280" rx="15" fill="#0d1020" stroke="#334" stroke-width="1"/>
  <text x="750" y="120" text-anchor="middle" fill="#feca57" font-size="18" font-weight="bold">
    Lorentz World
  </text>

  <text x="555" y="155" fill="#ddd" font-size="13">Equation: x² + y² − t² = 0</text>
  <text x="555" y="180" fill="#ddd" font-size="13">Space: Light cone in (2+1)D spacetime</text>
  <text x="555" y="205" fill="#ddd" font-size="13">Symmetry: O(2,1;ℝ) (Lorentz group)</text>
  <text x="555" y="230" fill="#ddd" font-size="13">Physics: Special relativity (c = 1)</text>
  <text x="555" y="255" fill="#ddd" font-size="13">Elements: Boosts, rotations, reflections</text>
  <text x="555" y="280" fill="#ddd" font-size="13">Discrete: O(2,1;ℤ) = integer Lorentz</text>
  <text x="555" y="310" fill="#ff6b6b" font-size="13">Parabolic: null rotations (light-like)</text>
  <text x="555" y="335" fill="#48dbfb" font-size="13">Hyperbolic: boosts (time-like)</text>

  <!-- Connection arrow -->
  <path d="M 470 230 L 530 230" stroke="#fff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 530 230 L 470 230" stroke="#fff" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff"/>
    </marker>
  </defs>
  <text x="500" y="215" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">=</text>
  <text x="500" y="250" text-anchor="middle" fill="#888" font-size="11">same math</text>

  <!-- Bottom panel: Eigenvalue classification -->
  <rect x="30" y="400" width="940" height="270" rx="15" fill="#0d1020" stroke="#334" stroke-width="1"/>
  <text x="500" y="430" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">
    Spectral Classification of Berggren Matrices
  </text>

  <!-- B₁ column -->
  <rect x="60" y="450" width="270" height="200" rx="10" fill="#1a0a2e" stroke="#ff6b6b" stroke-width="1"/>
  <text x="195" y="475" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="bold">B₁ — Parabolic</text>
  <text x="80" y="500" fill="#ddd" font-size="12">det = 1, tr = 3</text>
  <text x="80" y="520" fill="#ddd" font-size="12">Char poly: (λ−1)³</text>
  <text x="80" y="540" fill="#ddd" font-size="12">Eigenvalues: {1, 1, 1}</text>
  <text x="80" y="560" fill="#ddd" font-size="12">(B₁−I)³ = 0, (B₁−I)² ≠ 0</text>
  <text x="80" y="580" fill="#ddd" font-size="12">Nilpotency index: 3</text>
  <text x="80" y="605" fill="#ff9999" font-size="12">Growth: polynomial O(n²)</text>
  <text x="80" y="625" fill="#ff9999" font-size="12">A-branch: (3,4,5)→(5,12,13)→…</text>
  <text x="80" y="645" fill="#888" font-size="11">Physics: null rotation</text>

  <!-- B₂ column -->
  <rect x="365" y="450" width="270" height="200" rx="10" fill="#0a1a2e" stroke="#48dbfb" stroke-width="1"/>
  <text x="500" y="475" text-anchor="middle" fill="#48dbfb" font-size="16" font-weight="bold">B₂ — Hyperbolic</text>
  <text x="385" y="500" fill="#ddd" font-size="12">det = −1, tr = 5</text>
  <text x="385" y="520" fill="#ddd" font-size="12">Char poly: x³−5x²−5x+1</text>
  <text x="385" y="540" fill="#ddd" font-size="12">Eigenvalues: {−1, 3±2√2}</text>
  <text x="385" y="560" fill="#ddd" font-size="12">3+2√2 = (1+√2)² ≈ 5.83</text>
  <text x="385" y="580" fill="#ddd" font-size="12">Pell recurrence: cₙ₊₁=6cₙ−cₙ₋₁</text>
  <text x="385" y="605" fill="#99ddff" font-size="12">Growth: exponential (3+2√2)ⁿ</text>
  <text x="385" y="625" fill="#99ddff" font-size="12">B-branch: |a−b|=1 always</text>
  <text x="385" y="645" fill="#888" font-size="11">Physics: Lorentz boost</text>

  <!-- B₃ column -->
  <rect x="670" y="450" width="270" height="200" rx="10" fill="#1a1a0e" stroke="#feca57" stroke-width="1"/>
  <text x="805" y="475" text-anchor="middle" fill="#feca57" font-size="16" font-weight="bold">B₃ — Parabolic</text>
  <text x="690" y="500" fill="#ddd" font-size="12">det = 1, tr = 3</text>
  <text x="690" y="520" fill="#ddd" font-size="12">Char poly: (λ−1)³</text>
  <text x="690" y="540" fill="#ddd" font-size="12">Eigenvalues: {1, 1, 1}</text>
  <text x="690" y="560" fill="#ddd" font-size="12">B₃ = S·B₁·S (conjugate)</text>
  <text x="690" y="580" fill="#ddd" font-size="12">S = leg-swap: (a,b,c)↦(b,a,c)</text>
  <text x="690" y="605" fill="#ffee99" font-size="12">Growth: polynomial O(n²)</text>
  <text x="690" y="625" fill="#ffee99" font-size="12">C-branch: mirror of A-branch</text>
  <text x="690" y="645" fill="#888" font-size="11">Physics: null rotation (conjugate)</text>
</svg>
