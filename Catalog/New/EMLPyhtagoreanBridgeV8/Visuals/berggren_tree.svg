<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="nodeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="nodeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="100%" stop-color="#0abde3"/>
    </linearGradient>
    <linearGradient id="nodeC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="nodeRoot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#fff" font-size="28" font-weight="bold" filter="url(#glow)">
    The Berggren Tree of Primitive Pythagorean Triples
  </text>
  <text x="600" y="80" text-anchor="middle" fill="#a0a0c0" font-size="14">
    Every primitive Pythagorean triple appears exactly once · Machine-verified in Lean 4
  </text>

  <!-- Edges (draw first so nodes appear on top) -->
  <g stroke-width="2.5" fill="none" opacity="0.7">
    <!-- Root to depth 1 -->
    <line x1="600" y1="145" x2="200" y2="255" stroke="#ff6b6b"/>
    <line x1="600" y1="145" x2="600" y2="255" stroke="#48dbfb"/>
    <line x1="600" y1="145" x2="1000" y2="255" stroke="#feca57"/>

    <!-- A-branch depth 2 -->
    <line x1="200" y1="305" x2="80" y2="415" stroke="#ff6b6b" opacity="0.6"/>
    <line x1="200" y1="305" x2="200" y2="415" stroke="#48dbfb" opacity="0.6"/>
    <line x1="200" y1="305" x2="320" y2="415" stroke="#feca57" opacity="0.6"/>

    <!-- B-branch depth 2 -->
    <line x1="600" y1="305" x2="480" y2="415" stroke="#ff6b6b" opacity="0.6"/>
    <line x1="600" y1="305" x2="600" y2="415" stroke="#48dbfb" opacity="0.6"/>
    <line x1="600" y1="305" x2="720" y2="415" stroke="#feca57" opacity="0.6"/>

    <!-- C-branch depth 2 -->
    <line x1="1000" y1="305" x2="880" y2="415" stroke="#ff6b6b" opacity="0.6"/>
    <line x1="1000" y1="305" x2="1000" y2="415" stroke="#48dbfb" opacity="0.6"/>
    <line x1="1000" y1="305" x2="1120" y2="415" stroke="#feca57" opacity="0.6"/>
  </g>

  <!-- Branch labels -->
  <text x="370" y="190" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="bold">A</text>
  <text x="600" y="190" text-anchor="middle" fill="#48dbfb" font-size="16" font-weight="bold">B</text>
  <text x="830" y="190" text-anchor="middle" fill="#feca57" font-size="16" font-weight="bold">C</text>

  <!-- ROOT NODE: (3, 4, 5) -->
  <g filter="url(#shadow)">
    <rect x="525" y="100" width="150" height="50" rx="12" fill="url(#nodeRoot)" opacity="0.95"/>
    <text x="600" y="130" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">(3, 4, 5)</text>
  </g>

  <!-- DEPTH 1 -->
  <!-- A: (5, 12, 13) -->
  <g filter="url(#shadow)">
    <rect x="120" y="260" width="160" height="50" rx="10" fill="url(#nodeA)" opacity="0.9"/>
    <text x="200" y="290" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">(5, 12, 13)</text>
  </g>
  <!-- B: (21, 20, 29) -->
  <g filter="url(#shadow)">
    <rect x="515" y="260" width="170" height="50" rx="10" fill="url(#nodeB)" opacity="0.9"/>
    <text x="600" y="290" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">(21, 20, 29)</text>
  </g>
  <!-- C: (15, 8, 17) -->
  <g filter="url(#shadow)">
    <rect x="920" y="260" width="160" height="50" rx="10" fill="url(#nodeC)" opacity="0.9"/>
    <text x="1000" y="290" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">(15, 8, 17)</text>
  </g>

  <!-- DEPTH 2 -->
  <!-- AA: (7, 24, 25) -->
  <g>
    <rect x="15" y="420" width="130" height="40" rx="8" fill="#ff6b6b" opacity="0.7"/>
    <text x="80" y="445" text-anchor="middle" fill="#fff" font-size="13">(7, 24, 25)</text>
  </g>
  <!-- AB: (55, 48, 73) -->
  <g>
    <rect x="150" y="420" width="130" height="40" rx="8" fill="#48dbfb" opacity="0.7"/>
    <text x="215" y="445" text-anchor="middle" fill="#fff" font-size="13">(55, 48, 73)</text>
  </g>
  <!-- AC: (45, 28, 53) -->
  <g>
    <rect x="255" y="420" width="130" height="40" rx="8" fill="#feca57" opacity="0.7"/>
    <text x="320" y="445" text-anchor="middle" fill="#fff" font-size="13">(45, 28, 53)</text>
  </g>
  <!-- BA: (39, 80, 89) -->
  <g>
    <rect x="415" y="420" width="130" height="40" rx="8" fill="#ff6b6b" opacity="0.7"/>
    <text x="480" y="445" text-anchor="middle" fill="#fff" font-size="13">(39, 80, 89)</text>
  </g>
  <!-- BB: (119, 120, 169) -->
  <g>
    <rect x="535" y="420" width="140" height="40" rx="8" fill="#48dbfb" opacity="0.7"/>
    <text x="605" y="445" text-anchor="middle" fill="#fff" font-size="12">(119, 120, 169)</text>
  </g>
  <!-- BC: (77, 36, 85) -->
  <g>
    <rect x="660" y="420" width="130" height="40" rx="8" fill="#feca57" opacity="0.7"/>
    <text x="725" y="445" text-anchor="middle" fill="#fff" font-size="13">(77, 36, 85)</text>
  </g>
  <!-- CA: (33, 56, 65) -->
  <g>
    <rect x="815" y="420" width="130" height="40" rx="8" fill="#ff6b6b" opacity="0.7"/>
    <text x="880" y="445" text-anchor="middle" fill="#fff" font-size="13">(33, 56, 65)</text>
  </g>
  <!-- CB: (65, 72, 97) -->
  <g>
    <rect x="935" y="420" width="130" height="40" rx="8" fill="#48dbfb" opacity="0.7"/>
    <text x="1000" y="445" text-anchor="middle" fill="#fff" font-size="13">(65, 72, 97)</text>
  </g>
  <!-- CC: (35, 12, 37) -->
  <g>
    <rect x="1055" y="420" width="130" height="40" rx="8" fill="#feca57" opacity="0.7"/>
    <text x="1120" y="445" text-anchor="middle" fill="#fff" font-size="13">(35, 12, 37)</text>
  </g>

  <!-- Dots indicating continuation -->
  <text x="80" y="490" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="215" y="490" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="320" y="490" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="480" y="490" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="605" y="490" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="725" y="490" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="880" y="490" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="1000" y="490" text-anchor="middle" fill="#888" font-size="20">⋮</text>
  <text x="1120" y="490" text-anchor="middle" fill="#888" font-size="20">⋮</text>

  <!-- Info Panel -->
  <rect x="50" y="540" width="500" height="330" rx="15" fill="#12123a" stroke="#333366" stroke-width="1"/>
  <text x="70" y="575" fill="#a29bfe" font-size="18" font-weight="bold">Key Properties</text>

  <text x="70" y="605" fill="#ddd" font-size="13">• Every PPT (a,b,c) with gcd(a,b)=1 appears exactly once</text>
  <text x="70" y="630" fill="#ddd" font-size="13">• Each node has exactly 3 children (ternary tree)</text>
  <text x="70" y="655" fill="#ddd" font-size="13">• All matrices preserve Q = a² + b² − c² = 0</text>
  <text x="70" y="680" fill="#ddd" font-size="13">• Berggren matrices ∈ O(2,1;ℤ) (integer Lorentz group)</text>
  <text x="70" y="705" fill="#ddd" font-size="13">• B₁, B₃: parabolic (eigenvalue 1, multiplicity 3)</text>
  <text x="70" y="730" fill="#ddd" font-size="13">• B₂: hyperbolic (eigenvalues −1, 3±2√2)</text>
  <text x="70" y="755" fill="#ddd" font-size="13">• B₃ = S·B₁·S where S swaps legs (a ↔ b)</text>
  <text x="70" y="785" fill="#ff6b6b" font-size="13">A-branch: polynomial growth O(n²)</text>
  <text x="70" y="810" fill="#48dbfb" font-size="13">B-branch: exponential growth (3+2√2)ⁿ ≈ 5.83ⁿ</text>
  <text x="70" y="835" fill="#feca57" font-size="13">C-branch: polynomial growth O(n²) [conjugate to A]</text>

  <!-- Matrix Panel -->
  <rect x="600" y="540" width="550" height="330" rx="15" fill="#12123a" stroke="#333366" stroke-width="1"/>
  <text x="620" y="575" fill="#a29bfe" font-size="18" font-weight="bold">Berggren Matrices</text>

  <!-- B₁ -->
  <text x="640" y="610" fill="#ff6b6b" font-size="15" font-weight="bold">B₁ =</text>
  <text x="700" y="610" fill="#ff6b6b" font-size="14" font-family="monospace">⎡ 1  −2   2 ⎤</text>
  <text x="700" y="630" fill="#ff6b6b" font-size="14" font-family="monospace">⎢ 2  −1   2 ⎥</text>
  <text x="700" y="650" fill="#ff6b6b" font-size="14" font-family="monospace">⎣ 2  −2   3 ⎦</text>
  <text x="640" y="670" fill="#ff9999" font-size="11">det=1, tr=3, char poly: (λ−1)³</text>

  <!-- B₂ -->
  <text x="900" y="610" fill="#48dbfb" font-size="15" font-weight="bold">B₂ =</text>
  <text x="960" y="610" fill="#48dbfb" font-size="14" font-family="monospace">⎡ 1   2   2 ⎤</text>
  <text x="960" y="630" fill="#48dbfb" font-size="14" font-family="monospace">⎢ 2   1   2 ⎥</text>
  <text x="960" y="650" fill="#48dbfb" font-size="14" font-family="monospace">⎣ 2   2   3 ⎦</text>
  <text x="900" y="670" fill="#99ddff" font-size="11">det=−1, tr=5, eigenvalues: −1, 3±2√2</text>

  <!-- B₃ -->
  <text x="640" y="720" fill="#feca57" font-size="15" font-weight="bold">B₃ =</text>
  <text x="700" y="720" fill="#feca57" font-size="14" font-family="monospace">⎡−1   2   2 ⎤</text>
  <text x="700" y="740" fill="#feca57" font-size="14" font-family="monospace">⎢−2   1   2 ⎥</text>
  <text x="700" y="760" fill="#feca57" font-size="14" font-family="monospace">⎣−2   2   3 ⎦</text>
  <text x="640" y="780" fill="#ffee99" font-size="11">det=1, tr=3, B₃ = S·B₁·S</text>

  <!-- Lorentz form -->
  <text x="900" y="720" fill="#a29bfe" font-size="15" font-weight="bold">Q =</text>
  <text x="960" y="720" fill="#a29bfe" font-size="14" font-family="monospace">⎡ 1   0   0 ⎤</text>
  <text x="960" y="740" fill="#a29bfe" font-size="14" font-family="monospace">⎢ 0   1   0 ⎥</text>
  <text x="960" y="760" fill="#a29bfe" font-size="14" font-family="monospace">⎣ 0   0  −1 ⎦</text>
  <text x="900" y="780" fill="#c0b0ff" font-size="11">BᵢᵀQBᵢ = Q (Lorentz invariant)</text>

  <!-- Depth counts -->
  <text x="620" y="820" fill="#888" font-size="12">Depth 0: 1 triple · Depth 1: 3 · Depth 2: 9 · Depth d: 3ᵈ</text>
  <text x="620" y="840" fill="#888" font-size="12">Total triples at depth ≤ d: (3^(d+1) − 1)/2</text>
  <text x="620" y="860" fill="#666" font-size="11">EML–Pythagorean Bridge v8 · Machine-verified with Lean 4 + Mathlib</text>
</svg>
