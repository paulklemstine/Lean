<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#1a1a4e" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="900" height="900" fill="url(#bg2)"/>

  <text x="450" y="45" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">
    Primitive Pythagorean Triples on the Unit Circle
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#888" font-size="13">
    Each PPT (a,b,c) maps to the rational point (a/c, b/c) on x² + y² = 1
  </text>

  <!-- Coordinate system centered at (450, 470), radius 380 -->
  <!-- Unit circle -->
  <circle cx="450" cy="470" r="380" fill="none" stroke="#333366" stroke-width="1.5"/>
  <circle cx="450" cy="470" r="380" fill="url(#circleGlow)"/>

  <!-- Axes -->
  <line x1="50" y1="470" x2="850" y2="470" stroke="#444" stroke-width="0.5"/>
  <line x1="450" y1="70" x2="450" y2="870" stroke="#444" stroke-width="0.5"/>
  <text x="845" y="465" fill="#666" font-size="12">a/c</text>
  <text x="455" y="82" fill="#666" font-size="12">b/c</text>

  <!-- 45° line -->
  <line x1="450" y1="470" x2="720" y2="200" stroke="#333" stroke-width="0.5" stroke-dasharray="5,5"/>
  <text x="730" y="200" fill="#555" font-size="11">θ = 45°</text>

  <!-- Tick marks -->
  <text x="830" y="485" fill="#555" font-size="11">1</text>
  <text x="450" y="97" fill="#555" font-size="11" text-anchor="middle">1</text>
  <text x="64" y="485" fill="#555" font-size="11">0</text>

  <!-- PPT points as dots on the unit circle (first quadrant only) -->
  <!-- (3,4,5) → (0.6, 0.8) → (450+228, 470-304) = (678, 166) -->
  <circle cx="678" cy="166" r="7" fill="#6c5ce7" opacity="0.9"/>
  <text x="693" y="161" fill="#a29bfe" font-size="11">(3,4,5)</text>

  <!-- (4,3,5) → (0.8, 0.6) → (754, 242) -->
  <circle cx="754" cy="242" r="7" fill="#6c5ce7" opacity="0.9"/>
  <text x="769" y="237" fill="#a29bfe" font-size="11">(4,3,5)</text>

  <!-- (5,12,13) → (5/13, 12/13) ≈ (0.385, 0.923) → (596, 119) -->
  <circle cx="596" cy="119" r="6" fill="#ff6b6b" opacity="0.8"/>
  <text x="608" y="114" fill="#ff9999" font-size="10">(5,12,13)</text>

  <!-- (12,5,13) → mirror → (754, 119) wait no: (12/13, 5/13) ≈ (0.923, 0.385) → (801, 324) -->
  <circle cx="801" cy="324" r="6" fill="#ff6b6b" opacity="0.8"/>
  <text x="813" y="319" fill="#ff9999" font-size="10">(12,5,13)</text>

  <!-- (8,15,17) → (8/17, 15/17) ≈ (0.471, 0.882) → (629, 135) -->
  <circle cx="629" cy="135" r="5" fill="#feca57" opacity="0.8"/>
  <text x="641" y="127" fill="#ffee99" font-size="10">(8,15,17)</text>

  <!-- (15,8,17) → (15/17, 8/17) ≈ (0.882, 0.471) → (785, 291) -->
  <circle cx="785" cy="291" r="5" fill="#feca57" opacity="0.8"/>
  <text x="797" y="286" fill="#ffee99" font-size="10">(15,8,17)</text>

  <!-- (7,24,25) → (0.28, 0.96) → (556, 106) -->
  <circle cx="556" cy="106" r="5" fill="#ff6b6b" opacity="0.7"/>
  <text x="568" y="100" fill="#ff9999" font-size="9">(7,24,25)</text>

  <!-- (20,21,29) → (20/29, 21/29) ≈ (0.69, 0.724) → (712, 195) -->
  <circle cx="712" cy="195" r="5" fill="#48dbfb" opacity="0.8"/>
  <text x="724" y="190" fill="#99ddff" font-size="10">(20,21,29)</text>

  <!-- (21,20,29) → (0.724, 0.69) → (725, 208) -->
  <circle cx="725" cy="208" r="5" fill="#48dbfb" opacity="0.8"/>
  <text x="737" y="203" fill="#99ddff" font-size="10">(21,20,29)</text>

  <!-- (9,40,41) → (9/41, 40/41) ≈ (0.22, 0.976) → (533, 100) -->
  <circle cx="533" cy="100" r="4" fill="#ff6b6b" opacity="0.6"/>
  <text x="543" y="95" fill="#ff9999" font-size="9">(9,40,41)</text>

  <!-- (11,60,61) → (11/61, 60/61) ≈ (0.18, 0.984) → (518, 96) -->
  <circle cx="518" cy="96" r="4" fill="#ff6b6b" opacity="0.6"/>

  <!-- (28,45,53) → (28/53, 45/53) ≈ (0.528, 0.849) → (651, 147) -->
  <circle cx="651" cy="147" r="4" fill="#feca57" opacity="0.7"/>

  <!-- (33,56,65) → (33/65, 56/65) ≈ (0.508, 0.862) → (643, 143) -->
  <circle cx="643" cy="143" r="4" fill="#ff6b6b" opacity="0.6"/>

  <!-- (36,77,85) → (36/85, 77/85) ≈ (0.424, 0.906) → (611, 126) -->
  <circle cx="611" cy="126" r="4" fill="#feca57" opacity="0.6"/>

  <!-- (48,55,73) → (48/73, 55/73) ≈ (0.658, 0.753) → (700, 184) -->
  <circle cx="700" cy="184" r="4" fill="#48dbfb" opacity="0.6"/>

  <!-- (119,120,169) → (119/169, 120/169) ≈ (0.704, 0.710) → (717, 200) -->
  <circle cx="717" cy="200" r="4" fill="#48dbfb" opacity="0.6"/>
  <text x="729" y="218" fill="#99ddff" font-size="9">(119,120,169)</text>

  <!-- More scattered points to show density -->
  <circle cx="490" cy="102" r="3" fill="#888" opacity="0.5"/>
  <circle cx="575" cy="112" r="3" fill="#888" opacity="0.5"/>
  <circle cx="620" cy="128" r="3" fill="#888" opacity="0.5"/>
  <circle cx="660" cy="152" r="3" fill="#888" opacity="0.5"/>
  <circle cx="740" cy="220" r="3" fill="#888" opacity="0.5"/>
  <circle cx="760" cy="260" r="3" fill="#888" opacity="0.5"/>
  <circle cx="790" cy="310" r="3" fill="#888" opacity="0.5"/>
  <circle cx="810" cy="350" r="3" fill="#888" opacity="0.5"/>
  <circle cx="820" cy="390" r="3" fill="#888" opacity="0.5"/>
  <circle cx="826" cy="420" r="3" fill="#888" opacity="0.5"/>
  <circle cx="508" cy="98" r="3" fill="#888" opacity="0.4"/>
  <circle cx="545" cy="103" r="3" fill="#888" opacity="0.4"/>
  <circle cx="695" cy="168" r="3" fill="#888" opacity="0.4"/>

  <!-- Angle arc for (3,4,5) -->
  <path d="M 490 470 A 40 40 0 0 0 474 438" fill="none" stroke="#a29bfe" stroke-width="1.5"/>
  <text x="500" y="445" fill="#a29bfe" font-size="10">53.1°</text>

  <!-- Legend -->
  <rect x="50" y="750" width="350" height="130" rx="10" fill="#0d1117" stroke="#333" stroke-width="1"/>
  <text x="70" y="775" fill="#fff" font-size="14" font-weight="bold">Branch Colors</text>
  <circle cx="85" cy="795" r="5" fill="#ff6b6b"/>
  <text x="100" y="800" fill="#ddd" font-size="12">A-branch (near axis, small angles)</text>
  <circle cx="85" cy="820" r="5" fill="#48dbfb"/>
  <text x="100" y="825" fill="#ddd" font-size="12">B-branch (near 45° line, balanced)</text>
  <circle cx="85" cy="845" r="5" fill="#feca57"/>
  <text x="100" y="850" fill="#ddd" font-size="12">C-branch (conjugate to A via swap)</text>
  <circle cx="85" cy="865" r="5" fill="#6c5ce7"/>
  <text x="100" y="870" fill="#ddd" font-size="12">Root (3,4,5)</text>

  <!-- Note about density -->
  <rect x="500" y="750" width="370" height="130" rx="10" fill="#0d1117" stroke="#333" stroke-width="1"/>
  <text x="520" y="775" fill="#fff" font-size="14" font-weight="bold">Angle Distribution</text>
  <text x="520" y="800" fill="#ddd" font-size="12">• Angles are dense in (0°, 90°)</text>
  <text x="520" y="820" fill="#ddd" font-size="12">• Mean angle = 45° (by leg-swap symmetry)</text>
  <text x="520" y="840" fill="#ddd" font-size="12">• B-branch points cluster near 45°</text>
  <text x="520" y="860" fill="#ddd" font-size="12">• A-branch: θ → 0° (pure A-path)</text>
  <text x="520" y="880" fill="#ddd" font-size="12">• The set {a/c, b/c} is dense in [0,1]²∩S¹</text>
</svg>
