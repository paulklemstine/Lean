<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="bar-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">
    The Information Ceiling: How Many Lenses Suffice?
  </text>
  <text x="500" y="62" text-anchor="middle" fill="#8b949e" font-size="13">
    Search space reduction as a function of independent lenses (Direction 4)
  </text>

  <!-- Chart area -->
  <g transform="translate(80, 90)">
    <!-- Y-axis -->
    <line x1="60" y1="0" x2="60" y2="420" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="210" text-anchor="middle" fill="#8b949e" font-size="12" transform="rotate(-90, 30, 210)">
      Search Space (log₂ scale)
    </text>

    <!-- X-axis -->
    <line x1="60" y1="420" x2="880" y2="420" stroke="#30363d" stroke-width="1"/>
    <text x="470" y="460" text-anchor="middle" fill="#8b949e" font-size="12">Number of Independent Lenses (k)</text>

    <!-- Grid lines and Y labels -->
    <line x1="60" y1="0" x2="880" y2="0" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="50" y="5" text-anchor="end" fill="#8b949e" font-size="10">2²⁰</text>

    <line x1="60" y1="105" x2="880" y2="105" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="50" y="110" text-anchor="end" fill="#8b949e" font-size="10">2¹⁵</text>

    <line x1="60" y1="210" x2="880" y2="210" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="50" y="215" text-anchor="end" fill="#8b949e" font-size="10">2¹⁰</text>

    <line x1="60" y1="315" x2="880" y2="315" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="50" y="320" text-anchor="end" fill="#8b949e" font-size="10">2⁵</text>

    <text x="50" y="425" text-anchor="end" fill="#8b949e" font-size="10">2⁰=1</text>

    <!-- Bars for each k value -->
    <!-- k=0: full height (420px = 20 units) -->
    <rect x="80" y="0" width="35" height="420" rx="3" fill="url(#bar-blue)" opacity="0.8"/>
    <text x="97" y="440" text-anchor="middle" fill="#8b949e" font-size="10">0</text>
    <text x="97" y="-8" text-anchor="middle" fill="#58a6ff" font-size="9">1×</text>

    <!-- k=1: 399px (19 units) -->
    <rect x="140" y="21" width="35" height="399" rx="3" fill="url(#bar-blue)" opacity="0.8"/>
    <text x="157" y="440" text-anchor="middle" fill="#8b949e" font-size="10">1</text>
    <text x="157" y="16" text-anchor="middle" fill="#58a6ff" font-size="9">2×</text>

    <!-- k=3: 357px -->
    <rect x="200" y="63" width="35" height="357" rx="3" fill="url(#bar-blue)" opacity="0.8"/>
    <text x="217" y="440" text-anchor="middle" fill="#8b949e" font-size="10">3</text>
    <text x="217" y="58" text-anchor="middle" fill="#58a6ff" font-size="9">8×</text>

    <!-- k=5: 315px -->
    <rect x="260" y="105" width="35" height="315" rx="3" fill="url(#bar-blue)" opacity="0.8"/>
    <text x="277" y="440" text-anchor="middle" fill="#8b949e" font-size="10">5</text>
    <text x="277" y="100" text-anchor="middle" fill="#58a6ff" font-size="9">32×</text>

    <!-- k=7: 273px -->
    <rect x="320" y="147" width="35" height="273" rx="3" fill="url(#bar-green)" opacity="0.8"/>
    <text x="337" y="440" text-anchor="middle" fill="#8b949e" font-size="10">7</text>
    <text x="337" y="142" text-anchor="middle" fill="#3fb950" font-size="9">128×</text>

    <!-- k=9: 231px  ← Current MetaFactoring -->
    <rect x="380" y="189" width="35" height="231" rx="3" fill="url(#bar-gold)" opacity="0.9"/>
    <text x="397" y="440" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">9</text>
    <text x="397" y="184" text-anchor="middle" fill="#f0883e" font-size="9" font-weight="bold">512×</text>
    <!-- Arrow pointing to k=9 -->
    <text x="397" y="174" text-anchor="middle" fill="#f0883e" font-size="8">← Current</text>

    <!-- k=12: 168px -->
    <rect x="440" y="252" width="35" height="168" rx="3" fill="url(#bar-green)" opacity="0.8"/>
    <text x="457" y="440" text-anchor="middle" fill="#8b949e" font-size="10">12</text>
    <text x="457" y="247" text-anchor="middle" fill="#3fb950" font-size="9">4K×</text>

    <!-- k=15: 105px -->
    <rect x="500" y="315" width="35" height="105" rx="3" fill="url(#bar-green)" opacity="0.8"/>
    <text x="517" y="440" text-anchor="middle" fill="#8b949e" font-size="10">15</text>
    <text x="517" y="310" text-anchor="middle" fill="#3fb950" font-size="9">32K×</text>

    <!-- k=18: 42px -->
    <rect x="560" y="378" width="35" height="42" rx="3" fill="url(#bar-green)" opacity="0.8"/>
    <text x="577" y="440" text-anchor="middle" fill="#8b949e" font-size="10">18</text>
    <text x="577" y="373" text-anchor="middle" fill="#3fb950" font-size="9">256K×</text>

    <!-- k=20: 0px (eliminated) -->
    <rect x="620" y="418" width="35" height="2" rx="1" fill="#f85149"/>
    <text x="637" y="440" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">20</text>
    <text x="637" y="413" text-anchor="middle" fill="#f85149" font-size="9">1M× = 0</text>

    <!-- k=25 -->
    <rect x="680" y="418" width="35" height="2" rx="1" fill="#f85149"/>
    <text x="697" y="440" text-anchor="middle" fill="#8b949e" font-size="10">25</text>

    <!-- Theorem annotation -->
    <rect x="620" y="340" width="250" height="50" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
    <text x="745" y="358" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">
      Information Ceiling Theorem
    </text>
    <text x="745" y="378" text-anchor="middle" fill="#8b949e" font-size="10">
      ⌈log₂ N⌉ + 1 lenses → space = 0 ✓
    </text>
  </g>

  <!-- Key insight box -->
  <rect x="60" y="560" width="880" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="500" y="590" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="bold">
    Key Theorem (Proved in Lean 4)
  </text>
  <text x="500" y="615" text-anchor="middle" fill="#58a6ff" font-size="13" font-style="italic">
    sufficient_lenses: ∀ N, N / 2^(Nat.log 2 N + 1) = 0
  </text>
  <text x="500" y="640" text-anchor="middle" fill="#8b949e" font-size="12">
    "Enough independent lenses trivialize any factoring problem."
  </text>
  <text x="500" y="660" text-anchor="middle" fill="#f0883e" font-size="11">
    Open Question: Is the maximum number of independent lenses O(log log N)?
  </text>
</svg>
