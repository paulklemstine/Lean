<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#152238"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="650" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">
    The Berggren Tree: Navigating Pythagorean Triples for Factoring
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#888" font-size="12">
    Every primitive Pythagorean triple is reached by exactly one path from root (3, 4, 5)
  </text>

  <!-- Tree edges -->
  <g stroke="#3a5a7a" stroke-width="2" fill="none">
    <!-- Level 0 → 1 -->
    <line x1="450" y1="105" x2="180" y2="195"/>
    <line x1="450" y1="105" x2="450" y2="195"/>
    <line x1="450" y1="105" x2="720" y2="195"/>

    <!-- Level 1 → 2 (left branch) -->
    <line x1="180" y1="235" x2="80" y2="320"/>
    <line x1="180" y1="235" x2="180" y2="320"/>
    <line x1="180" y1="235" x2="280" y2="320"/>

    <!-- Level 1 → 2 (middle branch) -->
    <line x1="450" y1="235" x2="370" y2="320"/>
    <line x1="450" y1="235" x2="450" y2="320"/>
    <line x1="450" y1="235" x2="530" y2="320"/>

    <!-- Level 1 → 2 (right branch) -->
    <line x1="720" y1="235" x2="630" y2="320"/>
    <line x1="720" y1="235" x2="720" y2="320"/>
    <line x1="720" y1="235" x2="820" y2="320"/>
  </g>

  <!-- Matrix labels on edges -->
  <g fill="#7a9aba" font-size="11" font-weight="bold">
    <text x="290" y="150" text-anchor="middle">A</text>
    <text x="440" y="150" text-anchor="middle">B</text>
    <text x="610" y="150" text-anchor="middle">C</text>
  </g>

  <!-- Root node (3, 4, 5) -->
  <g transform="translate(450, 95)" filter="url(#nodeGlow)">
    <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#2a5a2a" stroke="#4a4" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#8f8" font-size="14" font-weight="bold">(3, 4, 5)</text>
  </g>

  <!-- Level 1 nodes -->
  <g filter="url(#nodeGlow)">
    <!-- A child: (5, 12, 13) -->
    <g transform="translate(180, 215)">
      <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#1a3a5a" stroke="#48f" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#8af" font-size="13" font-weight="bold">(5, 12, 13)</text>
    </g>
    <!-- B child: (21, 20, 29) -->
    <g transform="translate(450, 215)">
      <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#1a3a5a" stroke="#48f" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#8af" font-size="13" font-weight="bold">(21, 20, 29)</text>
    </g>
    <!-- C child: (15, 8, 17) -->
    <g transform="translate(720, 215)">
      <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#1a3a5a" stroke="#48f" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#8af" font-size="13" font-weight="bold">(15, 8, 17)</text>
    </g>
  </g>

  <!-- Level 2 nodes (smaller) -->
  <g font-size="10">
    <!-- Children of (5,12,13) -->
    <g transform="translate(80, 335)">
      <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#2a1a3a" stroke="#a4f" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#c8f" font-weight="bold">(7, 24, 25)</text>
    </g>
    <g transform="translate(180, 335)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#2a1a3a" stroke="#a4f" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#c8f" font-weight="bold">(55, 48, 73)</text>
    </g>
    <g transform="translate(280, 335)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#2a1a3a" stroke="#a4f" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#c8f" font-weight="bold">(45, 28, 53)</text>
    </g>

    <!-- Children of (21,20,29) -->
    <g transform="translate(370, 335)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#2a1a3a" stroke="#a4f" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#c8f" font-weight="bold">(39, 80, 89)</text>
    </g>
    <g transform="translate(450, 335)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#2a1a3a" stroke="#a4f" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#c8f" font-weight="bold">(119,120,169)</text>
    </g>
    <g transform="translate(530, 335)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#2a1a3a" stroke="#a4f" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#c8f" font-weight="bold">(77, 36, 85)</text>
    </g>

    <!-- Children of (15,8,17) -->
    <g transform="translate(630, 335)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#2a1a3a" stroke="#a4f" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#c8f" font-weight="bold">(33, 56, 65)</text>
    </g>
    <g transform="translate(720, 335)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#2a1a3a" stroke="#a4f" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#c8f" font-weight="bold">(77, 36, 85)</text>
    </g>
    <g transform="translate(820, 335)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#2a1a3a" stroke="#a4f" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#c8f" font-weight="bold">(35, 12, 37)</text>
    </g>
  </g>

  <!-- Factoring annotations -->
  <g transform="translate(0, 400)">
    <rect x="50" y="10" width="800" height="220" rx="12" fill="#0d1117" stroke="#333" stroke-width="1"/>

    <text x="450" y="40" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">
      Factoring via Tree Navigation
    </text>

    <text x="80" y="70" fill="#aaa" font-size="12">
      Given N = p × q, search the tree for a triple (a, b, c) where gcd(a, N) ∈ {p, q}
    </text>

    <!-- Example 1 -->
    <g transform="translate(80, 90)">
      <rect x="0" y="0" width="340" height="55" rx="8" fill="#1a2a1a" stroke="#4a4" stroke-width="1"/>
      <text x="10" y="18" fill="#8f8" font-size="12" font-weight="bold">Example: N = 65 = 5 × 13</text>
      <text x="10" y="35" fill="#6d6" font-size="11">Triple (33, 56, 65): gcd(65, 65) = 65 ✓</text>
      <text x="10" y="48" fill="#6d6" font-size="11">Peel: gcd(65-33, 65) = gcd(32, 65) = 1</text>
    </g>

    <!-- Example 2 -->
    <g transform="translate(460, 90)">
      <rect x="0" y="0" width="360" height="55" rx="8" fill="#2a1a1a" stroke="#f64" stroke-width="1"/>
      <text x="10" y="18" fill="#fa8" font-size="12" font-weight="bold">Example: N = 85 = 5 × 17</text>
      <text x="10" y="35" fill="#f86" font-size="11">Triple (77, 36, 85): gcd(85, 85) = 85 ✓</text>
      <text x="10" y="48" fill="#f86" font-size="11">Peel: gcd(85-36, 85) = gcd(49, 85) = 1</text>
    </g>

    <!-- Key insight -->
    <g transform="translate(80, 160)">
      <rect x="0" y="0" width="720" height="50" rx="8" fill="#1a1a2e" stroke="#48f" stroke-width="1"/>
      <text x="360" y="18" text-anchor="middle" fill="#8af" font-size="12" font-weight="bold">
        Key: The Berggren tree is a structured search through ALL primitive Pythagorean triples
      </text>
      <text x="360" y="38" text-anchor="middle" fill="#68f" font-size="11">
        Tree depth d reaches triples with hypotenuse c ≤ 3ᵈ⁺¹ — exponential coverage from linear descent
      </text>
    </g>
  </g>
</svg>
