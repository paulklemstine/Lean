<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a1a3e"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="450" fill="url(#bg3)"/>
  
  <text x="450" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">
    Quadratic Residues mod p — Formally Verified in Lean 4
  </text>
  <text x="450" y="50" text-anchor="middle" fill="#88aacc" font-size="12">
    Green = QR, Red = Non-QR | Theorems: euler_criterion_forward, neg_one_qr_iff, two_qr_iff
  </text>
  
  <!-- p = 5 -->
  <text x="80" y="90" fill="#ffffff" font-size="14" font-weight="bold">p = 5 (≡ 1 mod 4)</text>
  <text x="80" y="105" fill="#88aacc" font-size="11">QRs: {0,1,4} | -1=4 is QR ✓</text>
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="40" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="20" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">0</text>
    <rect x="50" y="0" width="40" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="70" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">1</text>
    <rect x="100" y="0" width="40" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="120" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">2</text>
    <rect x="150" y="0" width="40" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="170" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">3</text>
    <rect x="200" y="0" width="40" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="220" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">4</text>
  </g>
  
  <!-- p = 7 -->
  <text x="80" y="175" fill="#ffffff" font-size="14" font-weight="bold">p = 7 (≡ 3 mod 4)</text>
  <text x="80" y="190" fill="#88aacc" font-size="11">QRs: {0,1,2,4} | -1=6 NOT QR ✓ | 2 IS QR (7≡7 mod 8) ✓</text>
  <g transform="translate(80, 195)">
    <rect x="0" y="0" width="40" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="20" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">0</text>
    <rect x="50" y="0" width="40" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="70" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">1</text>
    <rect x="100" y="0" width="40" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="120" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">2</text>
    <rect x="150" y="0" width="40" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="170" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">3</text>
    <rect x="200" y="0" width="40" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="220" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">4</text>
    <rect x="250" y="0" width="40" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="270" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">5</text>
    <rect x="300" y="0" width="40" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="320" y="17" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">6</text>
  </g>
  
  <!-- p = 13 -->
  <text x="80" y="260" fill="#ffffff" font-size="14" font-weight="bold">p = 13 (≡ 1 mod 4)</text>
  <text x="80" y="275" fill="#88aacc" font-size="11">QRs: {0,1,3,4,9,10,12} | -1=12 is QR ✓ | (p-1)/2 = 6 QRs excl. 0</text>
  <g transform="translate(80, 280)">
    <rect x="0" y="0" width="35" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="17" y="17" text-anchor="middle" fill="#ffffff" font-size="11">0</text>
    <rect x="40" y="0" width="35" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="57" y="17" text-anchor="middle" fill="#ffffff" font-size="11">1</text>
    <rect x="80" y="0" width="35" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="97" y="17" text-anchor="middle" fill="#ffffff" font-size="11">2</text>
    <rect x="120" y="0" width="35" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="137" y="17" text-anchor="middle" fill="#ffffff" font-size="11">3</text>
    <rect x="160" y="0" width="35" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="177" y="17" text-anchor="middle" fill="#ffffff" font-size="11">4</text>
    <rect x="200" y="0" width="35" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="217" y="17" text-anchor="middle" fill="#ffffff" font-size="11">5</text>
    <rect x="240" y="0" width="35" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="257" y="17" text-anchor="middle" fill="#ffffff" font-size="11">6</text>
    <rect x="280" y="0" width="35" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="297" y="17" text-anchor="middle" fill="#ffffff" font-size="11">7</text>
    <rect x="320" y="0" width="35" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="337" y="17" text-anchor="middle" fill="#ffffff" font-size="11">8</text>
    <rect x="360" y="0" width="35" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="377" y="17" text-anchor="middle" fill="#ffffff" font-size="11">9</text>
    <rect x="400" y="0" width="35" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="417" y="17" text-anchor="middle" fill="#ffffff" font-size="11">10</text>
    <rect x="440" y="0" width="35" height="25" rx="4" fill="#cc3355" stroke="#ffffff" stroke-width="1"/>
    <text x="457" y="17" text-anchor="middle" fill="#ffffff" font-size="11">11</text>
    <rect x="480" y="0" width="35" height="25" rx="4" fill="#00cc66" stroke="#ffffff" stroke-width="1"/>
    <text x="497" y="17" text-anchor="middle" fill="#ffffff" font-size="11">12</text>
  </g>
  
  <!-- Key theorems box -->
  <rect x="550" y="85" width="320" height="220" rx="10" fill="#0d1117" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/>
  <text x="710" y="110" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Verified Theorems</text>
  <text x="570" y="135" fill="#00cc66" font-size="12">✓ euler_criterion_forward</text>
  <text x="580" y="152" fill="#88aacc" font-size="10">a QR ⟹ a^((p-1)/2) = 1</text>
  <text x="570" y="175" fill="#00cc66" font-size="12">✓ neg_one_qr_iff_one_mod_four</text>
  <text x="580" y="192" fill="#88aacc" font-size="10">-1 is QR ↔ p ≡ 1 (mod 4)</text>
  <text x="570" y="215" fill="#00cc66" font-size="12">✓ two_qr_iff</text>
  <text x="580" y="232" fill="#88aacc" font-size="10">2 is QR ↔ p ≡ ±1 (mod 8)</text>
  <text x="570" y="255" fill="#00cc66" font-size="12">✓ qr_mul, qr_pow_closed</text>
  <text x="580" y="272" fill="#88aacc" font-size="10">QRs form a submonoid</text>
  <text x="570" y="295" fill="#00cc66" font-size="12">✓ legendreSym_mul'</text>
  <text x="580" y="295" fill="#88aacc" font-size="10"></text>
  
  <!-- Summary -->
  <rect x="80" y="340" width="780" height="90" rx="10" fill="#1f2937" fill-opacity="0.8" stroke="#30363d"/>
  <text x="470" y="365" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">
    Key Insight: QR Structure Enables Factoring
  </text>
  <text x="470" y="385" text-anchor="middle" fill="#88aacc" font-size="12">
    The quadratic sieve finds smooth values x² - N ≡ 0 (mod p) for small primes p.
  </text>
  <text x="470" y="405" text-anchor="middle" fill="#88aacc" font-size="12">
    Whether N is a QR mod p (determined by Euler's criterion) controls which primes contribute.
  </text>
  <text x="470" y="425" text-anchor="middle" fill="#88aacc" font-size="12">
    The product closure (qr_mul) ensures the factor base relations compose correctly.
  </text>
</svg>
