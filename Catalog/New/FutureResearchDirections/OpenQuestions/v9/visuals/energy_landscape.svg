<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <linearGradient id="energy" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="50%" style="stop-color:#ffaa00"/>
      <stop offset="100%" style="stop-color:#ff3355"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">
    Energy Landscape E(N, x) = N mod x — Verified in Lean 4
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#88aacc" font-size="14">
    N = 60 | Divisors at global minima (E = 0) | Theorem: energy_global_min_at_divisor
  </text>
  
  <!-- Axes -->
  <line x1="80" y1="400" x2="860" y2="400" stroke="#446688" stroke-width="2"/>
  <line x1="80" y1="70" x2="80" y2="400" stroke="#446688" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="70" y="405" text-anchor="end" fill="#88aacc" font-size="11">0</text>
  <text x="70" y="340" text-anchor="end" fill="#88aacc" font-size="11">10</text>
  <text x="70" y="280" text-anchor="end" fill="#88aacc" font-size="11">20</text>
  <text x="70" y="220" text-anchor="end" fill="#88aacc" font-size="11">30</text>
  <text x="70" y="160" text-anchor="end" fill="#88aacc" font-size="11">40</text>
  <text x="70" y="100" text-anchor="end" fill="#88aacc" font-size="11">50</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="340" x2="860" y2="340" stroke="#223344" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="80" y1="280" x2="860" y2="280" stroke="#223344" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="80" y1="220" x2="860" y2="220" stroke="#223344" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="80" y1="160" x2="860" y2="160" stroke="#223344" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="80" y1="100" x2="860" y2="100" stroke="#223344" stroke-width="0.5" stroke-dasharray="4"/>
  
  <!-- Energy curve for N=60 (E(60,x) = 60 mod x for x=1..60) -->
  <!-- Scale: x: 80 + (x-1)*13, y: 400 - E*6 -->
  <polyline fill="none" stroke="url(#energy)" stroke-width="2.5"
    points="80,400 93,400 106,400 119,400 132,400 145,400 158,394 
            171,400 184,388 197,394 210,400 223,388 236,400 
            249,382 262,400 275,400 284,394 297,394 310,376
            323,400 336,382 349,382 362,370 375,388 388,400
            401,370 414,382 427,364 440,388 453,400 466,400
            479,358 492,376 505,370 519,382 532,400 545,388
            558,370 571,376 585,382 598,400 611,394 624,376
            637,382 650,388 658,394 671,400 684,394 697,388
            710,382 723,376 736,370 749,364 762,358 775,352
            788,346 801,340 814,334 827,328 840,322 853,400"/>
  
  <!-- Divisor markers (1,2,3,4,5,6,10,12,15,20,30,60) -->
  <g filter="url(#glow)">
    <!-- x=1: 80 -->
    <circle cx="80" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=2: 93 -->
    <circle cx="93" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=3: 106 -->
    <circle cx="106" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=4: 119 -->
    <circle cx="119" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=5: 132 -->
    <circle cx="132" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=6: 145 -->
    <circle cx="145" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=10: 197 -->
    <circle cx="197" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=12: 223 -->
    <circle cx="223" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=15: 262 -->
    <circle cx="262" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=20: 327 -->
    <circle cx="327" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=30: 457 -->
    <circle cx="457" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
    <!-- x=60: 847 -->
    <circle cx="853" cy="400" r="6" fill="#00ff88" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  
  <!-- Divisor labels -->
  <text x="80" y="420" text-anchor="middle" fill="#00ff88" font-size="9">1</text>
  <text x="93" y="420" text-anchor="middle" fill="#00ff88" font-size="9">2</text>
  <text x="106" y="420" text-anchor="middle" fill="#00ff88" font-size="9">3</text>
  <text x="119" y="420" text-anchor="middle" fill="#00ff88" font-size="9">4</text>
  <text x="132" y="420" text-anchor="middle" fill="#00ff88" font-size="9">5</text>
  <text x="145" y="420" text-anchor="middle" fill="#00ff88" font-size="9">6</text>
  <text x="197" y="420" text-anchor="middle" fill="#00ff88" font-size="9">10</text>
  <text x="223" y="420" text-anchor="middle" fill="#00ff88" font-size="9">12</text>
  <text x="262" y="420" text-anchor="middle" fill="#00ff88" font-size="9">15</text>
  <text x="327" y="420" text-anchor="middle" fill="#00ff88" font-size="9">20</text>
  <text x="457" y="420" text-anchor="middle" fill="#00ff88" font-size="9">30</text>
  <text x="853" y="420" text-anchor="middle" fill="#00ff88" font-size="9">60</text>
  
  <!-- Axis labels -->
  <text x="470" y="450" text-anchor="middle" fill="#ffffff" font-size="14">x (trial divisor)</text>
  <text x="30" y="240" text-anchor="middle" fill="#ffffff" font-size="14" transform="rotate(-90 30 240)">E(N, x)</text>
  
  <!-- Legend -->
  <rect x="620" y="70" width="250" height="100" fill="#0a0a2e" fill-opacity="0.8" stroke="#446688" rx="8"/>
  <circle cx="640" cy="90" r="5" fill="#00ff88"/>
  <text x="655" y="95" fill="#ffffff" font-size="12">Divisor (E = 0, global min)</text>
  <line x1="630" y1="115" x2="660" y2="115" stroke="url(#energy)" stroke-width="2.5"/>
  <text x="670" y="119" fill="#ffffff" font-size="12">Energy curve</text>
  <text x="640" y="145" fill="#88aacc" font-size="11">τ(60) = 12 divisors</text>
  <text x="640" y="160" fill="#88aacc" font-size="11">σ₁(60) = 168</text>
</svg>
