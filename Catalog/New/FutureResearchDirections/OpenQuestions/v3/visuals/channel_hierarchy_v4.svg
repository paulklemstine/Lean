<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bgch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgch)"/>

  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="bold">
    Cayley-Dickson Channel Hierarchy: k(k+1)/2
  </text>

  <!-- Bar chart of channel counts -->
  <!-- Scale: max = 8256 (k=128), chart width = 650, height = 300 -->

  <!-- k=2: 3 channels -->
  <rect x="80" y="310" width="60" height="0.1" rx="3" fill="#4af"/>
  <rect x="80" y="305" width="60" height="5" rx="3" fill="#4af" opacity="0.8"/>
  <text x="110" y="330" text-anchor="middle" fill="white" font-size="11">k=2</text>
  <text x="110" y="345" text-anchor="middle" fill="#8af" font-size="10">3</text>
  <text x="110" y="360" text-anchor="middle" fill="#668" font-size="9">ℂ</text>

  <!-- k=4: 10 channels -->
  <rect x="160" y="310" width="60" height="0.4" rx="3" fill="#4af"/>
  <rect x="160" y="300" width="60" height="10" rx="3" fill="#4af" opacity="0.8"/>
  <text x="190" y="330" text-anchor="middle" fill="white" font-size="11">k=4</text>
  <text x="190" y="345" text-anchor="middle" fill="#8af" font-size="10">10</text>
  <text x="190" y="360" text-anchor="middle" fill="#668" font-size="9">ℍ</text>

  <!-- k=8: 36 channels -->
  <rect x="240" y="310" width="60" height="1.3" rx="3" fill="#4af"/>
  <rect x="240" y="290" width="60" height="20" rx="3" fill="#4af" opacity="0.8"/>
  <text x="270" y="330" text-anchor="middle" fill="white" font-size="11">k=8</text>
  <text x="270" y="345" text-anchor="middle" fill="#8af" font-size="10">36</text>
  <text x="270" y="360" text-anchor="middle" fill="#668" font-size="9">𝕆</text>

  <!-- k=16: 136 channels -->
  <rect x="320" y="265" width="60" height="45" rx="3" fill="#f84" opacity="0.8"/>
  <text x="350" y="330" text-anchor="middle" fill="white" font-size="11">k=16</text>
  <text x="350" y="345" text-anchor="middle" fill="#fa8" font-size="10">136</text>
  <text x="350" y="360" text-anchor="middle" fill="#a86" font-size="9">𝕊</text>

  <!-- k=32: 528 channels -->
  <rect x="400" y="210" width="60" height="100" rx="3" fill="#f84" opacity="0.8"/>
  <text x="430" y="330" text-anchor="middle" fill="white" font-size="11">k=32</text>
  <text x="430" y="345" text-anchor="middle" fill="#fa8" font-size="10">528</text>

  <!-- k=64: 2080 channels -->
  <rect x="480" y="110" width="60" height="200" rx="3" fill="#f44" opacity="0.8"/>
  <text x="510" y="330" text-anchor="middle" fill="white" font-size="11">k=64</text>
  <text x="510" y="345" text-anchor="middle" fill="#f88" font-size="10">2,080</text>

  <!-- k=128: 8256 channels -->
  <rect x="560" y="60" width="60" height="250" rx="3" fill="#f44" opacity="0.7"/>
  <text x="590" y="330" text-anchor="middle" fill="white" font-size="11">k=128</text>
  <text x="590" y="345" text-anchor="middle" fill="#f88" font-size="10">8,256</text>

  <!-- Quadratic curve overlay -->
  <text x="680" y="100" fill="#ffd700" font-size="13" font-weight="bold">k(k+1)/2</text>
  <text x="680" y="120" fill="#aab" font-size="11">Quadratic</text>
  <text x="680" y="140" fill="#aab" font-size="11">growth ✓</text>

  <!-- Annotations -->
  <line x1="300" y1="380" x2="300" y2="395" stroke="#666" stroke-width="1"/>
  <text x="300" y="410" text-anchor="middle" fill="#888" font-size="10">← Normed division algebras →</text>
  <line x1="80" y1="395" x2="300" y2="395" stroke="#666" stroke-width="1"/>

  <line x1="320" y1="380" x2="620" y2="380" stroke="#a66" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="470" y="410" text-anchor="middle" fill="#a88" font-size="10">Zero divisors exist, but channels still grow</text>

  <!-- Legend -->
  <rect x="650" y="200" width="12" height="12" fill="#4af"/>
  <text x="670" y="211" fill="white" font-size="10">Division algebra</text>
  <rect x="650" y="220" width="12" height="12" fill="#f84"/>
  <text x="670" y="231" fill="white" font-size="10">Non-division</text>
  <rect x="650" y="240" width="12" height="12" fill="#f44"/>
  <text x="670" y="251" fill="white" font-size="10">High-dimensional</text>

  <!-- Formula -->
  <rect x="50" y="390" width="700" height="45" rx="8" fill="#1a1a2a" stroke="#446" stroke-width="1"/>
  <text x="400" y="415" text-anchor="middle" fill="white" font-size="14">
    Total channels = k (peel) + C(k,2) (cross) = k + k(k−1)/2 = k(k+1)/2
  </text>
  <text x="400" y="430" text-anchor="middle" fill="#6d6" font-size="11">Formally verified: channel_quadratic ✓</text>
</svg>
