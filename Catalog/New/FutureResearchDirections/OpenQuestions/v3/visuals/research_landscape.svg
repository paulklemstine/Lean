<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <linearGradient id="tierA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00aa55"/>
    </linearGradient>
    <linearGradient id="tierB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00"/>
      <stop offset="100%" style="stop-color:#cc7700"/>
    </linearGradient>
    <linearGradient id="tierC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4488"/>
      <stop offset="100%" style="stop-color:#cc2266"/>
    </linearGradient>
    <linearGradient id="tierD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8844ff"/>
      <stop offset="100%" style="stop-color:#6622cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold" filter="url(#glow)">
    Gravitational Factoring: Research Landscape v3
  </text>
  <text x="600" y="70" text-anchor="middle" fill="#88aacc" font-size="14">
    50 Research Directions Organized by Feasibility × Impact
  </text>

  <!-- Axes labels -->
  <text x="600" y="880" text-anchor="middle" fill="#aaaacc" font-size="14">FEASIBILITY →</text>
  <text x="25" y="450" text-anchor="middle" fill="#aaaacc" font-size="14" transform="rotate(-90 25 450)">IMPACT →</text>

  <!-- Grid -->
  <line x1="100" y1="85" x2="100" y2="850" stroke="#333366" stroke-width="1"/>
  <line x1="100" y1="850" x2="1150" y2="850" stroke="#333366" stroke-width="1"/>

  <!-- Tier A: High Feasibility, High Impact (top-right) -->
  <rect x="700" y="100" width="430" height="200" rx="15" fill="url(#tierA)" opacity="0.15" stroke="#00ff88" stroke-width="2"/>
  <text x="915" y="125" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold">TIER A: Do First</text>

  <rect x="720" y="140" width="180" height="60" rx="8" fill="#0a2a1e" stroke="#00ff88" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="160" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">A1: Peel Smoothness</text>
  <text x="810" y="175" text-anchor="middle" fill="#88ccaa" font-size="9">90% success · Medium impact</text>
  <text x="810" y="190" text-anchor="middle" fill="#66aa88" font-size="8">3-10,000× advantage measured</text>

  <rect x="920" y="140" width="190" height="60" rx="8" fill="#0a2a1e" stroke="#ff4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="1015" y="160" text-anchor="middle" fill="#ff6666" font-size="11" font-weight="bold">A2: Lattice-GCD ⚡</text>
  <text x="1015" y="175" text-anchor="middle" fill="#ffaaaa" font-size="9">10-20% · REVOLUTIONARY</text>
  <text x="1015" y="190" text-anchor="middle" fill="#ff8888" font-size="8">Polynomial-time factoring?</text>

  <rect x="720" y="210" width="180" height="60" rx="8" fill="#0a2a1e" stroke="#00ff88" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="230" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">A3: Independence Proof</text>
  <text x="810" y="245" text-anchor="middle" fill="#88ccaa" font-size="9">60% success · High impact</text>
  <text x="810" y="260" text-anchor="middle" fill="#66aa88" font-size="8">Ω(k²/√N) collision bound</text>

