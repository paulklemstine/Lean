  <text x="1000" y="548" text-anchor="middle" fill="#aaaaff" font-size="15" font-weight="bold">Key Metrics</text>

  <text x="870" y="575" fill="#88ff88" font-size="12">✓ 45+ verified Lean theorems</text>
  <text x="870" y="598" fill="#88ff88" font-size="12">✓ 0 sorries remaining</text>
  <text x="870" y="621" fill="#88ff88" font-size="12">✓ 12 computational demos</text>
  <text x="870" y="644" fill="#88ff88" font-size="12">✓ σ₁ multiplicativity proved</text>
  <text x="870" y="667" fill="#88ff88" font-size="12">✓ Euler 4-square identity</text>
  <text x="870" y="690" fill="#88ff88" font-size="12">✓ Lattice factor extraction</text>
  <text x="870" y="713" fill="#88ff88" font-size="12">✓ Berggren tree preservation</text>

  <text x="870" y="746" fill="#ffaa44" font-size="12">◇ Polynomial-time conjecture</text>
  <text x="870" y="769" fill="#ffaa44" font-size="12">◇ Independence proof</text>
  <text x="870" y="792" fill="#ffaa44" font-size="12">◇ Quantum walk speedup</text>
  <text x="870" y="815" fill="#ffaa44" font-size="12">◇ Barrier height bounds</text>

  <!-- Legend -->
  <rect x="580" y="780" width="250" height="60" rx="8" fill="#111133" stroke="#333366" stroke-width="1"/>
  <rect x="595" y="795" width="12" height="12" rx="3" fill="#00ff88"/>
  <text x="612" y="806" fill="#aaaacc" font-size="10">Proved</text>
  <rect x="660" y="795" width="12" height="12" rx="3" fill="#ffaa00"/>
  <text x="677" y="806" fill="#aaaacc" font-size="10">In progress</text>
  <rect x="745" y="795" width="12" height="12" rx="3" fill="#ff4488"/>
  <text x="762" y="806" fill="#aaaacc" font-size="10">Exploratory</text>
  <rect x="595" y="815" width="12" height="12" rx="3" fill="#ff4444" stroke="#ff4444" stroke-width="2"/>
  <text x="612" y="826" fill="#aaaacc" font-size="10">★ Most impactful open question</text>
</svg>
