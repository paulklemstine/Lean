  <text x="435" y="580" text-anchor="middle" fill="#ff4488" font-size="11" font-weight="bold">C2: Persistent Homology</text>
  <text x="435" y="598" text-anchor="middle" fill="#cc6688" font-size="9">Barrier heights O(polylog)?</text>

  <rect x="140" y="620" width="190" height="50" rx="8" fill="#2a0a1e" stroke="#ff4488" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="235" y="640" text-anchor="middle" fill="#ff4488" font-size="11" font-weight="bold">C3: Adelic Unification</text>
  <text x="235" y="658" text-anchor="middle" fill="#cc6688" font-size="9">p-adic cross-collisions</text>

  <rect x="340" y="620" width="190" height="50" rx="8" fill="#2a0a1e" stroke="#ff4488" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="435" y="640" text-anchor="middle" fill="#ff4488" font-size="11" font-weight="bold">C4: Galois Obstructions</text>
  <text x="435" y="658" text-anchor="middle" fill="#cc6688" font-size="9">Étale cohomology</text>

  <rect x="240" y="680" width="190" height="30" rx="8" fill="#2a0a1e" stroke="#ff4488" stroke-width="1" filter="url(#shadow)"/>
  <text x="335" y="700" text-anchor="middle" fill="#ff4488" font-size="10">C5: Tropical Geometry</text>

