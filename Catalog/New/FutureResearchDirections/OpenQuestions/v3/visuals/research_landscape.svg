  <text x="1015" y="230" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">A4: Jacobi r₄ Formula</text>
  <text x="1015" y="245" text-anchor="middle" fill="#88ccaa" font-size="9">70% success · Medium-High</text>
  <text x="1015" y="260" text-anchor="middle" fill="#66aa88" font-size="8">r₄(n) = 8σ₁(n) formalized</text>

