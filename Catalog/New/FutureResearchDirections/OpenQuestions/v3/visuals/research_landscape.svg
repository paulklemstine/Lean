  <text x="695" y="440" text-anchor="middle" fill="#ffaa00" font-size="11" font-weight="bold">B4: Multi-Scale Factor</text>
  <text x="695" y="455" text-anchor="middle" fill="#ccaa66" font-size="9">k = 2, 4, 8 hierarchy</text>
