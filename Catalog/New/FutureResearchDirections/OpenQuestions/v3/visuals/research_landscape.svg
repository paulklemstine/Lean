  <text x="285" y="775" text-anchor="middle" fill="#aa88cc" font-size="10">D1: Proof Complexity</text>
  <text x="285" y="793" text-anchor="middle" fill="#aa88cc" font-size="10">D2: Neuromorphic Hardware</text>
  <text x="285" y="811" text-anchor="middle" fill="#aa88cc" font-size="10">D3: Octonion Crypto  ·  D4: Category Theory</text>
  <text x="285" y="829" text-anchor="middle" fill="#aa88cc" font-size="10">D5: ML for Berggren Navigation</text>

  <!-- Connections (dependency arrows) -->
  <line x1="810" y1="200" x2="810" y2="210" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="810" y1="270" x2="495" y2="350" stroke="#88aa88" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1015" y1="200" x2="695" y2="350" stroke="#88aa88" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="695" y1="410" x2="435" y2="560" stroke="#aa8866" stroke-width="1" stroke-dasharray="5,5"/>

