<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#bg5)"/>

  <text x="500" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" filter="url(#glow5)">
    The Berggren Tree: Generating All Pythagorean Triples
  </text>
  <text x="500" y="58" text-anchor="middle" fill="#88aacc" font-size="12">
    Three matrices A, B, C act on (3,4,5) to produce every primitive Pythagorean triple
  </text>

  <!-- Root node -->
  <circle cx="500" cy="110" r="30" fill="#0a2a1e" stroke="#00ff88" stroke-width="3"/>
  <text x="500" y="107" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">(3,4,5)</text>
  <text x="500" y="122" text-anchor="middle" fill="#66cc88" font-size="9">3²+4²=5²</text>

  <!-- Level 1 connections -->
  <line x1="475" y1="135" x2="200" y2="195" stroke="#ff8844" stroke-width="2"/>
  <line x1="500" y1="140" x2="500" y2="195" stroke="#4488ff" stroke-width="2"/>
  <line x1="525" y1="135" x2="800" y2="195" stroke="#ff44aa" stroke-width="2"/>

  <!-- Matrix labels -->
  <text x="330" y="170" text-anchor="middle" fill="#ff8844" font-size="10" font-weight="bold">A</text>
  <text x="505" y="175" text-anchor="end" fill="#4488ff" font-size="10" font-weight="bold">B</text>
  <text x="670" y="170" text-anchor="middle" fill="#ff44aa" font-size="10" font-weight="bold">C</text>

  <!-- Level 1 nodes -->
  <circle cx="200" cy="215" r="28" fill="#1a1020" stroke="#ff8844" stroke-width="2"/>
  <text x="200" y="212" text-anchor="middle" fill="#ff8844" font-size="10">(5,12,13)</text>
  <text x="200" y="227" text-anchor="middle" fill="#cc8866" font-size="8">5²+12²=13²</text>

  <circle cx="500" cy="215" r="28" fill="#1a1020" stroke="#4488ff" stroke-width="2"/>
  <text x="500" y="212" text-anchor="middle" fill="#4488ff" font-size="10">(21,20,29)</text>
  <text x="500" y="227" text-anchor="middle" fill="#6688aa" font-size="8">21²+20²=29²</text>

  <circle cx="800" cy="215" r="28" fill="#1a1020" stroke="#ff44aa" stroke-width="2"/>
  <text x="800" y="212" text-anchor="middle" fill="#ff44aa" font-size="10">(15,8,17)</text>
  <text x="800" y="227" text-anchor="middle" fill="#cc66aa" font-size="8">15²+8²=17²</text>

  <!-- Level 2 from left node -->
  <line x1="178" y1="240" x2="80" y2="300" stroke="#ff8844" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="243" x2="200" y2="300" stroke="#4488ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="222" y1="240" x2="320" y2="300" stroke="#ff44aa" stroke-width="1.5" opacity="0.7"/>

  <circle cx="80" cy="320" r="24" fill="#1a1020" stroke="#ff8844" stroke-width="1.5" opacity="0.7"/>
  <text x="80" y="318" text-anchor="middle" fill="#ff8844" font-size="8">(7,24,25)</text>

  <circle cx="200" cy="320" r="24" fill="#1a1020" stroke="#4488ff" stroke-width="1.5" opacity="0.7"/>
  <text x="200" y="318" text-anchor="middle" fill="#4488ff" font-size="8">(55,48,73)</text>

  <circle cx="320" cy="320" r="24" fill="#1a1020" stroke="#ff44aa" stroke-width="1.5" opacity="0.7"/>
  <text x="320" y="318" text-anchor="middle" fill="#ff44aa" font-size="8">(45,28,53)</text>

  <!-- Level 2 from middle node -->
  <line x1="478" y1="240" x2="420" y2="300" stroke="#ff8844" stroke-width="1.5" opacity="0.7"/>
  <line x1="500" y1="243" x2="500" y2="300" stroke="#4488ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="522" y1="240" x2="580" y2="300" stroke="#ff44aa" stroke-width="1.5" opacity="0.7"/>

  <circle cx="420" cy="320" r="24" fill="#1a1020" stroke="#ff8844" stroke-width="1.5" opacity="0.7"/>
  <text x="420" y="318" text-anchor="middle" fill="#ff8844" font-size="8">(39,80,89)</text>

  <circle cx="500" cy="320" r="24" fill="#1a1020" stroke="#4488ff" stroke-width="1.5" opacity="0.7"/>
  <text x="500" y="318" text-anchor="middle" fill="#4488ff" font-size="8">(119,...)</text>

  <circle cx="580" cy="320" r="24" fill="#1a1020" stroke="#ff44aa" stroke-width="1.5" opacity="0.7"/>
  <text x="580" y="318" text-anchor="middle" fill="#ff44aa" font-size="8">(77,36,...)</text>

  <!-- Level 2 from right node -->
  <line x1="778" y1="240" x2="690" y2="300" stroke="#ff8844" stroke-width="1.5" opacity="0.7"/>
  <line x1="800" y1="243" x2="800" y2="300" stroke="#4488ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="822" y1="240" x2="910" y2="300" stroke="#ff44aa" stroke-width="1.5" opacity="0.7"/>

  <circle cx="690" cy="320" r="24" fill="#1a1020" stroke="#ff8844" stroke-width="1.5" opacity="0.7"/>
  <text x="690" y="318" text-anchor="middle" fill="#ff8844" font-size="8">(9,40,41)</text>

  <circle cx="800" cy="320" r="24" fill="#1a1020" stroke="#4488ff" stroke-width="1.5" opacity="0.7"/>
  <text x="800" y="318" text-anchor="middle" fill="#4488ff" font-size="8">(65,...)</text>

  <circle cx="910" cy="320" r="24" fill="#1a1020" stroke="#ff44aa" stroke-width="1.5" opacity="0.7"/>
  <text x="910" y="318" text-anchor="middle" fill="#ff44aa" font-size="8">(35,12,...)</text>

  <!-- Ellipsis -->
  <text x="500" y="375" text-anchor="middle" fill="#666688" font-size="14">⋮  ⋮  ⋮  ⋮  ⋮  ⋮  ⋮  ⋮  ⋮</text>

  <!-- Info panels -->
  <rect x="30" y="400" width="300" height="230" rx="10" fill="#111133" stroke="#00ff88" stroke-width="1.5"/>
  <text x="180" y="425" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="bold">Tree Properties (Verified ✓)</text>
  <text x="50" y="452" fill="#88ffaa" font-size="11">✓ Branching factor: 3</text>
  <text x="50" y="475" fill="#88ffaa" font-size="11">✓ Depth d nodes: 3ᵈ</text>
  <text x="50" y="498" fill="#88ffaa" font-size="11">✓ Total to depth d: (3ᵈ⁺¹-1)/2</text>
  <text x="50" y="521" fill="#88ffaa" font-size="11">✓ All A,B,C preserve a²+b²=c² mod p</text>
  <text x="50" y="544" fill="#88ffaa" font-size="11">✓ Generates ALL primitive triples</text>
  <text x="50" y="570" fill="#ffaa44" font-size="10">Open: Modular period formula (Dir. B3)</text>
  <text x="50" y="590" fill="#ffaa44" font-size="10">Open: Quantum walk speedup (Dir. C1)</text>
  <text x="50" y="610" fill="#ffaa44" font-size="10">Open: ML navigation policy (Dir. D5)</text>

  <rect x="370" y="400" width="280" height="230" rx="10" fill="#111133" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="510" y="425" text-anchor="middle" fill="#ffaa00" font-size="14" font-weight="bold">Factoring Connection</text>
  <text x="390" y="452" fill="#ffcc66" font-size="11">Each triple (a,b,c) gives:</text>
  <text x="390" y="475" fill="#ccaa44" font-size="10">• Peel product: c²-a² = (c-a)(c+a)</text>
  <text x="390" y="498" fill="#ccaa44" font-size="10">• Peel product: c²-b² = (c-b)(c+b)</text>
  <text x="390" y="521" fill="#ccaa44" font-size="10">• Each factor ≤ 2c ≈ 2√N</text>
  <text x="390" y="544" fill="#ccaa44" font-size="10">• 3-10,000× smoother than random</text>
  <text x="390" y="575" fill="#ff8844" font-size="10">Navigation strategy: follow the tree</text>
  <text x="390" y="595" fill="#ff8844" font-size="10">toward triples producing smooth peel</text>
  <text x="390" y="615" fill="#ff8844" font-size="10">products ≡ 0 (mod N)</text>

  <rect x="690" y="400" width="280" height="230" rx="10" fill="#111133" stroke="#4488ff" stroke-width="1.5"/>
  <text x="830" y="425" text-anchor="middle" fill="#4488ff" font-size="14" font-weight="bold">Matrix Generators</text>
  <text x="710" y="455" fill="#88aaff" font-size="10">A: (a,b,c) → (a-2b+2c, 2a-b+2c, 2a-2b+3c)</text>
  <text x="710" y="480" fill="#88aaff" font-size="10">B: (a,b,c) → (a+2b+2c, 2a+b+2c, 2a+2b+3c)</text>
  <text x="710" y="505" fill="#88aaff" font-size="10">C: (a,b,c) → (-a+2b+2c,-2a+b+2c,-2a+2b+3c)</text>
  <text x="710" y="540" fill="#6688aa" font-size="10">All three are in SL₂(ℤ)</text>
  <text x="710" y="560" fill="#6688aa" font-size="10">Det = -1 (invertible over ℤ)</text>
  <text x="710" y="590" fill="#6688aa" font-size="10">Mod p: gives action of SL₂(𝔽_p)</text>
  <text x="710" y="610" fill="#6688aa" font-size="10">on projective Pythagorean conic</text>
</svg>
