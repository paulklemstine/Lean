<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Georgia, serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3498db"/>
    </marker>
  </defs>
  
  <rect width="700" height="500" fill="#fafafa" rx="10"/>
  
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">
    Stereographic Projection: Geometry of the SPB
  </text>
  
  <!-- The circle S¹ -->
  <circle cx="350" cy="220" r="130" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  
  <!-- North pole (projection point) -->
  <circle cx="350" cy="90" r="6" fill="#e74c3c"/>
  <text x="370" y="85" font-size="14" font-weight="bold" fill="#e74c3c">N = (0,1)</text>
  <text x="370" y="100" font-size="11" fill="#e74c3c">(projection center)</text>
  
  <!-- South pole -->
  <circle cx="350" cy="350" r="5" fill="#2980b9"/>
  <text x="370" y="360" font-size="13" fill="#2980b9">S = (0,−1)</text>
  
  <!-- Real line (tangent at south pole) -->
  <line x1="100" y1="350" x2="600" y2="350" stroke="#27ae60" stroke-width="2.5"/>
  <text x="610" y="355" font-size="14" fill="#27ae60" font-weight="bold">ℝ</text>
  
  <!-- Point P on circle -->
  <circle cx="440" cy="155" r="5" fill="#8e44ad"/>
  <text x="450" y="148" font-size="13" fill="#8e44ad" font-weight="bold">P</text>
  
  <!-- Projection line from N through P to ℝ -->
  <line x1="350" y1="90" x2="515" y2="350" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#a1)"/>
  
  <!-- Projected point on ℝ -->
  <circle cx="515" cy="350" r="5" fill="#e74c3c"/>
  <text x="520" y="375" font-size="13" fill="#e74c3c" font-weight="bold">σ(P)</text>
  
  <!-- Another point Q -->
  <circle cx="265" cy="160" r="5" fill="#3498db"/>
  <text x="240" y="150" font-size="13" fill="#3498db" font-weight="bold">Q</text>
  
  <!-- Projection line from N through Q to ℝ -->
  <line x1="350" y1="90" x2="195" y2="350" stroke="#3498db" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#a2)"/>
  
  <!-- Projected point on ℝ -->
  <circle cx="195" cy="350" r="5" fill="#3498db"/>
  <text x="175" y="375" font-size="13" fill="#3498db" font-weight="bold">σ(Q)</text>
  
  <!-- Origin on real line -->
  <circle cx="350" cy="350" r="3" fill="#2c3e50"/>
  <text x="343" y="370" font-size="11" fill="#2c3e50">0</text>
  
  <!-- Cayley transform annotation -->
  <rect x="50" y="400" width="600" height="85" fill="#ecf0f1" rx="10" stroke="#bdc3c7"/>
  <text x="350" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">
    Stereographic Projection IS the Cayley Transform
  </text>
  <text x="350" y="448" text-anchor="middle" font-size="13" fill="#2c3e50">
    σ: S¹ \ {N} → ℝ maps (cos θ, sin θ) ↦ cos θ/(1 − sin θ) = tan(θ/2 + π/4)
  </text>
  <text x="350" y="470" text-anchor="middle" font-size="13" fill="#8e44ad">
    The product P·Q on S¹ maps to spb(σ(P), σ(Q)) on ℝ — this IS the SPB!
  </text>
  
  <!-- Angle labels -->
  <text x="270" y="230" font-size="12" fill="#7f8c8d">S¹</text>
</svg>
