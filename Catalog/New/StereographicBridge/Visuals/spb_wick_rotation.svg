<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4FC3F7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF5350"/>
    </marker>
    <marker id="arrowGold2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFD700"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Georgia" font-size="24" fill="#FFD700">
    The Wick Rotation: Circular ↔ Hyperbolic Duality
  </text>

  <!-- Left: Circular (Euclidean/Trigonometric) -->
  <rect x="30" y="70" width="430" height="480" rx="15" fill="#0d1117" stroke="#4FC3F7" stroke-width="2" opacity="0.9"/>
  <text x="245" y="100" text-anchor="middle" font-family="Georgia" font-size="20" fill="#4FC3F7" font-weight="bold">
    Circular World
  </text>

  <!-- Circle -->
  <circle cx="245" cy="270" r="100" fill="none" stroke="#4FC3F7" stroke-width="2" opacity="0.6"/>
  <text x="245" y="275" text-anchor="middle" font-family="Georgia" font-size="14" fill="#4FC3F7">S¹</text>

  <!-- Points on circle -->
  <circle cx="345" cy="270" r="5" fill="#4FC3F7"/>
  <text x="360" y="265" font-family="Georgia" font-size="11" fill="#4FC3F7">1</text>
  <circle cx="245" cy="170" r="5" fill="#4FC3F7"/>
  <text x="260" y="170" font-family="Georgia" font-size="11" fill="#4FC3F7">i</text>
  <circle cx="145" cy="270" r="5" fill="#4FC3F7"/>
  <text x="125" y="265" font-family="Georgia" font-size="11" fill="#4FC3F7">-1</text>

  <!-- Arc showing rotation -->
  <path d="M 340 245 A 100 100 0 0 0 270 175" fill="none" stroke="#81C784" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="330" y="200" font-family="Georgia" font-size="12" fill="#81C784">θ</text>

  <!-- Formulas -->
  <text x="245" y="410" text-anchor="middle" font-family="monospace" font-size="15" fill="#4FC3F7">
    spb(x,y) = (x+y)/(1-xy)
  </text>
  <text x="245" y="435" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">tan(α+β) = spb(tan α, tan β)</text>
  <text x="245" y="460" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">cos²θ + sin²θ = 1</text>
  <text x="245" y="485" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">Periodic orbits</text>
  <text x="245" y="510" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">Cayley: (1+ix)/(1-ix)</text>
  <text x="245" y="535" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">Compact group S¹</text>

  <!-- Right: Hyperbolic (Relativistic) -->
  <rect x="540" y="70" width="430" height="480" rx="15" fill="#0d1117" stroke="#EF5350" stroke-width="2" opacity="0.9"/>
  <text x="755" y="100" text-anchor="middle" font-family="Georgia" font-size="20" fill="#EF5350" font-weight="bold">
    Hyperbolic World
  </text>

  <!-- Hyperbola -->
  <path d="M 655 190 Q 755 370 855 190" fill="none" stroke="#EF5350" stroke-width="2" opacity="0.6"/>
  <path d="M 655 350 Q 755 170 855 350" fill="none" stroke="#EF5350" stroke-width="2" opacity="0.6"/>
  <text x="755" y="275" text-anchor="middle" font-family="Georgia" font-size="14" fill="#EF5350">(-1,1)</text>

  <!-- Interval -->
  <line x1="670" y1="320" x2="840" y2="320" stroke="#EF5350" stroke-width="3"/>
  <circle cx="670" cy="320" r="4" fill="none" stroke="#EF5350" stroke-width="2"/>
  <circle cx="840" cy="320" r="4" fill="none" stroke="#EF5350" stroke-width="2"/>
  <text x="660" y="340" font-family="Georgia" font-size="11" fill="#EF5350">-1</text>
  <text x="845" y="340" font-family="Georgia" font-size="11" fill="#EF5350">+1</text>
  <circle cx="755" cy="320" r="4" fill="#EF5350"/>
  <text x="755" y="360" text-anchor="middle" font-family="Georgia" font-size="11" fill="#EF5350">0</text>

  <!-- Formulas -->
  <text x="755" y="410" text-anchor="middle" font-family="monospace" font-size="15" fill="#EF5350">
    spbH(x,y) = (x+y)/(1+xy)
  </text>
  <text x="755" y="435" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">tanh(a+b) = spbH(tanh a, tanh b)</text>
  <text x="755" y="460" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">cosh²φ - sinh²φ = 1</text>
  <text x="755" y="485" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">Open orbits (sub-luminal)</text>
  <text x="755" y="510" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">Cayley: (1+x)/(1-x)</text>
  <text x="755" y="535" text-anchor="middle" font-family="Georgia" font-size="12" fill="#aaa">Non-compact group ℝ</text>

  <!-- Wick Rotation Arrow -->
  <line x1="470" y1="250" x2="530" y2="250" stroke="#FFD700" stroke-width="3" marker-end="url(#arrowGold2)"/>
  <line x1="530" y1="290" x2="470" y2="290" stroke="#FFD700" stroke-width="3" marker-end="url(#arrowGold2)"/>

  <text x="500" y="240" text-anchor="middle" font-family="Georgia" font-size="14" fill="#FFD700" font-weight="bold">Wick</text>
  <text x="500" y="315" text-anchor="middle" font-family="Georgia" font-size="12" fill="#FFD700">t → it</text>
  <text x="500" y="335" text-anchor="middle" font-family="Georgia" font-size="11" fill="#aaa">1-xy ↔ 1+xy</text>

  <!-- Bottom note -->
  <text x="500" y="580" text-anchor="middle" font-family="Georgia" font-size="12" fill="#666" font-style="italic">
    The sign in the denominator is the only difference between rotation and boost, between geometry and physics.
  </text>
</svg>
