<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#faf8f0"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">
    Tropical SPB Discovery
  </text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#7f8c8d">
    tropSPB(a, b) = min(a, b) − max(0, a+b) = −max(|a|, |b|)
  </text>

  <!-- Left box: Original definition -->
  <rect x="30" y="90" width="340" height="160" rx="10" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="200" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#2980b9">Original Definition</text>
  <text x="200" y="145" text-anchor="middle" font-size="13" fill="#2c3e50">Standard SPB: spb(a,b) = (a+b)/(1−ab)</text>
  <text x="200" y="170" text-anchor="middle" font-size="13" fill="#2c3e50">↓ Tropicalize</text>
  <text x="200" y="195" text-anchor="middle" font-size="13" fill="#2c3e50">+ → min, × → +, / → −</text>
  <text x="200" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#e74c3c">
    tropSPB(a,b) = min(a,b) − max(0, a+b)
  </text>

  <!-- Right box: Simplified form -->
  <rect x="430" y="90" width="340" height="160" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">Simplified Form</text>
  <text x="600" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">
    tropSPB(a,b) = −max(|a|, |b|)
  </text>
  <text x="600" y="180" text-anchor="middle" font-size="12" fill="#7f8c8d">Machine-verified in Lean 4</text>
  <text x="600" y="210" text-anchor="middle" font-size="12" fill="#2c3e50">"Extract dominant magnitude, negate"</text>
  <text x="600" y="235" text-anchor="middle" font-size="12" fill="#27ae60">✓ Proved by case analysis on signs</text>

  <!-- Arrow between boxes -->
  <path d="M375 170 L425 170" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="400" y="160" text-anchor="middle" font-size="12" fill="#e74c3c">=</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Properties grid -->
  <rect x="30" y="280" width="740" height="200" rx="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#f39c12">
    Algebraic Properties (Conjecture 14.4 Resolution)
  </text>

  <!-- Property columns -->
  <text x="60" y="340" font-size="13" fill="#27ae60">✓ Commutative</text>
  <text x="60" y="365" font-size="12" fill="#7f8c8d">  max(|a|,|b|) = max(|b|,|a|)</text>

  <text x="60" y="400" font-size="13" fill="#27ae60">✓ Associative</text>
  <text x="60" y="425" font-size="12" fill="#7f8c8d">  max is associative</text>

  <text x="60" y="460" font-size="13" fill="#e74c3c">✗ No identity element</text>

  <text x="300" y="340" font-size="13" fill="#27ae60">✓ Commutative semigroup</text>

  <text x="300" y="375" font-size="13" fill="#2980b9">◉ Idempotent on ℝ⁻</text>
  <text x="300" y="400" font-size="12" fill="#7f8c8d">  x &lt; 0 ⟹ tropSPB(x,x) = x</text>

  <text x="300" y="435" font-size="13" fill="#8e44ad">◉ Anti-idempotent on ℝ⁺</text>
  <text x="300" y="460" font-size="12" fill="#7f8c8d">  x &gt; 0 ⟹ tropSPB(x,x) = −x</text>

  <!-- Examples -->
  <text x="570" y="340" font-size="12" fill="#2c3e50">Examples:</text>
  <text x="570" y="365" font-size="12" fill="#7f8c8d">tropSPB(3, −2) = −3</text>
  <text x="570" y="390" font-size="12" fill="#7f8c8d">tropSPB(1, 1) = −1</text>
  <text x="570" y="415" font-size="12" fill="#7f8c8d">tropSPB(−5, −3) = −5</text>
  <text x="570" y="440" font-size="12" fill="#7f8c8d">tropSPB(0, 7) = −7</text>
  <text x="570" y="465" font-size="12" fill="#7f8c8d">tropSPB(−2, −2) = −2</text>
</svg>
