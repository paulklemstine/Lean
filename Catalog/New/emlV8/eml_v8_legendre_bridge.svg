<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg2)"/>

  <text x="450" y="40" text-anchor="middle" fill="#fff" font-size="26" font-weight="bold">The Legendre Transform Bridge</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="14">V8 Discovery: eml(x, eʸ) = eˣ − y</text>

  <!-- Left: EML domain -->
  <rect x="30" y="90" width="250" height="200" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="120" text-anchor="middle" fill="#3b82f6" font-size="18" font-weight="bold">EML Domain</text>
  <text x="155" y="145" text-anchor="middle" fill="#93c5fd" font-size="14">(x, y) ∈ ℝ × ℝ₊</text>
  <text x="50" y="175" fill="#e2e8f0" font-size="13">eml(x, y) = eˣ − ln y</text>
  <text x="50" y="200" fill="#e2e8f0" font-size="13">∂eml/∂x = eˣ</text>
  <text x="50" y="225" fill="#e2e8f0" font-size="13">∂eml/∂y = −1/y</text>
  <text x="50" y="255" fill="#60a5fa" font-size="12">Convex in x, convex in y</text>
  <text x="50" y="275" fill="#60a5fa" font-size="12">Gradient never vanishes</text>

  <!-- Arrow -->
  <line x1="290" y1="190" x2="370" y2="190" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow1)"/>
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>
  <text x="330" y="175" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">y = eᵗ</text>

  <!-- Center: Legendre domain -->
  <rect x="380" y="90" width="250" height="200" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="505" y="120" text-anchor="middle" fill="#f59e0b" font-size="18" font-weight="bold">Legendre Domain</text>
  <text x="505" y="145" text-anchor="middle" fill="#fde68a" font-size="14">(x, t) ∈ ℝ × ℝ</text>
  <text x="400" y="175" fill="#e2e8f0" font-size="13">L(x, t) = eˣ − t</text>
  <text x="400" y="200" fill="#e2e8f0" font-size="13">∂L/∂x = eˣ</text>
  <text x="400" y="225" fill="#e2e8f0" font-size="13">∂L/∂t = −1</text>
  <text x="400" y="255" fill="#fbbf24" font-size="12">Simple subtraction!</text>
  <text x="400" y="275" fill="#fbbf24" font-size="12">Linear in t</text>

  <!-- Arrow -->
  <line x1="640" y1="190" x2="720" y2="190" stroke="#10b981" stroke-width="3" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>
  <text x="680" y="175" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">Dual</text>

  <!-- Right: Convex conjugate -->
  <rect x="730" y="90" width="150" height="200" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="805" y="120" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">Convex</text>
  <text x="805" y="140" text-anchor="middle" fill="#10b981" font-size="16" font-weight="bold">Conjugate</text>
  <text x="750" y="175" fill="#a7f3d0" font-size="13">f(x) = eˣ</text>
  <text x="750" y="200" fill="#a7f3d0" font-size="13">f*(p) = p ln p − p</text>
  <text x="750" y="230" fill="#34d399" font-size="12">EML encodes the</text>
  <text x="750" y="250" fill="#34d399" font-size="12">Fenchel-Legendre</text>
  <text x="750" y="270" fill="#34d399" font-size="12">transform of eˣ</text>

  <!-- Consequences section -->
  <rect x="30" y="320" width="840" height="260" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
  <text x="450" y="350" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Consequences of the Legendre Bridge</text>

  <!-- Consequence 1 -->
  <rect x="50" y="370" width="250" height="90" rx="8" fill="#1e1e3f" stroke="#8b5cf6" stroke-width="1"/>
  <text x="175" y="395" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">Power Identity</text>
  <text x="65" y="420" fill="#ddd6fe" font-size="12">eml(n·x, 1) = (eˣ)ⁿ</text>
  <text x="65" y="440" fill="#ddd6fe" font-size="12">→ Integer powers via scaling</text>

  <!-- Consequence 2 -->
  <rect x="320" y="370" width="250" height="90" rx="8" fill="#1e1e3f" stroke="#ec4899" stroke-width="1"/>
  <text x="445" y="395" text-anchor="middle" fill="#f472b6" font-size="14" font-weight="bold">Self-Pairing</text>
  <text x="335" y="420" fill="#fbcfe8" font-size="12">eml(x, eˣ) = eˣ − x</text>
  <text x="335" y="440" fill="#fbcfe8" font-size="12">→ Diagonal gap function</text>

  <!-- Consequence 3 -->
  <rect x="590" y="370" width="260" height="90" rx="8" fill="#1e1e3f" stroke="#14b8a6" stroke-width="1"/>
  <text x="720" y="395" text-anchor="middle" fill="#2dd4bf" font-size="14" font-weight="bold">Negation Involution</text>
  <text x="605" y="420" fill="#99f6e4" font-size="12">N(x) = eml(0, eˣ) = 1 − x</text>
  <text x="605" y="440" fill="#99f6e4" font-size="12">→ N(N(x)) = x ✓</text>

  <!-- Consequence 4 -->
  <rect x="50" y="480" width="250" height="85" rx="8" fill="#1e1e3f" stroke="#f59e0b" stroke-width="1"/>
  <text x="175" y="505" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">AM-GM Bridge</text>
  <text x="65" y="530" fill="#fde68a" font-size="12">Trace ≥ 2 for a, b &gt; 0</text>
  <text x="65" y="550" fill="#fde68a" font-size="12">→ Classical AM-GM via EML</text>

  <!-- Consequence 5 -->
  <rect x="320" y="480" width="250" height="85" rx="8" fill="#1e1e3f" stroke="#3b82f6" stroke-width="1"/>
  <text x="445" y="505" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">Log-Split</text>
  <text x="335" y="530" fill="#bfdbfe" font-size="12">eml(x, yz) = eml(x,y) − ln z</text>
  <text x="335" y="550" fill="#bfdbfe" font-size="12">→ Multiplicative decomposition</text>

  <!-- Consequence 6 -->
  <rect x="590" y="480" width="260" height="85" rx="8" fill="#1e1e3f" stroke="#ef4444" stroke-width="1"/>
  <text x="720" y="505" text-anchor="middle" fill="#f87171" font-size="14" font-weight="bold">Zero Generation</text>
  <text x="605" y="530" fill="#fecaca" font-size="12">eml(1, eᵉ) = e − e = 0</text>
  <text x="605" y="550" fill="#fecaca" font-size="12">→ 3-node zero construction</text>
</svg>
