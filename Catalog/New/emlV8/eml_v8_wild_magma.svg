<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>

  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">The Wild Magma: (ℝ, eml)</text>
  <text x="400" y="57" text-anchor="middle" fill="#c084fc" font-size="14">Every standard algebraic law fails — machine-verified in Lean 4</text>

  <!-- Hierarchy diagram -->
  <!-- Groups -->
  <ellipse cx="400" cy="230" rx="370" ry="180" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="770" y="95" fill="#64748b" font-size="12">All Magmas</text>

  <!-- Quasigroups -->
  <ellipse cx="400" cy="230" rx="290" ry="150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="690" y="130" fill="#818cf8" font-size="11">Quasigroups</text>

  <!-- Loops -->
  <ellipse cx="380" cy="230" rx="220" ry="120" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="600" y="155" fill="#a78bfa" font-size="11">Loops</text>

  <!-- Semigroups -->
  <ellipse cx="300" cy="220" rx="150" ry="90" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="160" y="155" fill="#34d399" font-size="11">Semigroups</text>

  <!-- Monoids -->
  <ellipse cx="280" cy="220" rx="110" ry="65" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="190" y="180" fill="#fbbf24" font-size="10">Monoids</text>

  <!-- Groups -->
  <ellipse cx="260" cy="220" rx="70" ry="40" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="235" y="205" fill="#f87171" font-size="10">Groups</text>

  <!-- Abelian -->
  <ellipse cx="250" cy="225" rx="35" ry="20" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <text x="232" y="229" fill="#f472b6" font-size="8">Abelian</text>

  <!-- EML point - OUTSIDE everything -->
  <circle cx="690" cy="350" r="12" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <text x="690" y="355" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">EML</text>
  <text x="690" y="385" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">← HERE!</text>
  <text x="690" y="400" text-anchor="middle" fill="#fca5a5" font-size="10">Outside everything</text>

  <!-- Failure annotations -->
  <line x1="660" y1="340" x2="600" y2="280" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="595" y="278" fill="#fca5a5" font-size="9" text-anchor="end">No identity ✗</text>

  <line x1="670" y1="335" x2="530" y2="250" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="520" y="248" fill="#fca5a5" font-size="9" text-anchor="end">Not associative ✗</text>

  <line x1="680" y1="330" x2="450" y2="175" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="440" y="172" fill="#fca5a5" font-size="9" text-anchor="end">Not commutative ✗</text>

  <!-- Legend -->
  <rect x="20" y="370" width="350" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="195" y="392" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Failed Algebraic Laws (All Verified)</text>
  <text x="35" y="412" fill="#fca5a5" font-size="10">✗ Commutative  ✗ Associative  ✗ Left identity</text>
  <text x="35" y="430" fill="#fca5a5" font-size="10">✗ Right identity  ✗ Medial  ✗ Flexible  ✗ Alternative</text>
</svg>
