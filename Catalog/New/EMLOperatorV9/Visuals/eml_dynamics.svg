<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bg3)"/>

  <text x="500" y="40" text-anchor="middle" fill="#ffd200" font-size="28" font-weight="bold">
    EML Dynamical Systems
  </text>

  <!-- Left Panel: Diagonal Map -->
  <rect x="30" y="60" width="460" height="510" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="260" y="95" text-anchor="middle" fill="#ff7043" font-size="20" font-weight="bold">Diagonal Map: d(z) = eᶻ − ln z</text>

  <!-- Coordinate axes -->
  <line x1="80" y1="500" x2="460" y2="500" stroke="#555" stroke-width="1.5"/>
  <line x1="80" y1="500" x2="80" y2="130" stroke="#555" stroke-width="1.5"/>
  <text x="270" y="530" text-anchor="middle" fill="#888" font-size="12">z</text>
  <text x="60" y="310" text-anchor="middle" fill="#888" font-size="12" transform="rotate(-90,60,310)">d(z)</text>

  <!-- d(z) curve (schematic) -->
  <path d="M 80,480 Q 120,470 160,420 Q 200,350 240,250 Q 280,140 320,130"
        fill="none" stroke="#ff7043" stroke-width="3"/>

  <!-- y = z line -->
  <line x1="80" y1="500" x2="400" y2="180" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="390" y="175" fill="#4fc3f7" font-size="11">y = z</text>

  <!-- y = z + 1 line -->
  <line x1="80" y1="460" x2="370" y2="180" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="375" y="195" fill="#66bb6a" font-size="11">y = z+1</text>

  <!-- Gap annotation -->
  <line x1="200" y1="390" x2="200" y2="340" stroke="#ffd200" stroke-width="2"/>
  <text x="215" y="365" fill="#ffd200" font-size="11">gap ≥ 1</text>

  <!-- Key facts -->
  <text x="260" y="545" text-anchor="middle" fill="#ff7043" font-size="13">d(z) &gt; z ∀z ∈ ℝ  •  d(z) ≥ z + 1  •  No fixed points</text>

  <!-- Right Panel: g-map -->
  <rect x="510" y="60" width="460" height="510" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="740" y="95" text-anchor="middle" fill="#ab47bc" font-size="20" font-weight="bold">g-Map: g(z) = e − ln z</text>

  <!-- Coordinate axes -->
  <line x1="560" y1="500" x2="940" y2="500" stroke="#555" stroke-width="1.5"/>
  <line x1="560" y1="500" x2="560" y2="130" stroke="#555" stroke-width="1.5"/>

  <!-- g(z) curve (decreasing) -->
  <path d="M 580,130 Q 620,200 680,300 Q 720,370 800,430 Q 860,460 940,480"
        fill="none" stroke="#ab47bc" stroke-width="3"/>

  <!-- y = z line -->
  <line x1="560" y1="500" x2="880" y2="180" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Fixed point z* -->
  <circle cx="730" cy="320" r="8" fill="#ffd200" stroke="#fff" stroke-width="2"/>
  <text x="755" y="315" fill="#ffd200" font-size="13" font-weight="bold">z* ≈ 2.017</text>
  <text x="755" y="335" fill="#aaa" font-size="11">= W(eᵉ)</text>

  <!-- Convergence spiral (schematic) -->
  <path d="M 620,190 L 620,500 L 830,500 L 830,370 L 700,370 L 700,420 L 760,420 L 760,340"
        fill="none" stroke="rgba(171,71,188,0.4)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Key facts -->
  <text x="740" y="545" text-anchor="middle" fill="#ab47bc" font-size="13">|g'(z*)| = 1/z* &lt; 1  •  Attracting fixed point</text>

  <!-- Bottom summary -->
  <text x="500" y="590" text-anchor="middle" fill="#666" font-size="12">
    Diagonal map: orbits diverge super-exponentially  |  g-map: orbits converge to z* = W(eᵉ)
  </text>
</svg>
