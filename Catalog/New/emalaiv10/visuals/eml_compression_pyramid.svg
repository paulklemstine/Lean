<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a0a1e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#cbg)"/>

  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-size="22" font-weight="bold">
    EML Knowledge Distillation Pyramid
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#aaa" font-size="12">
    Compressing large neural networks into interpretable EML trees
  </text>

  <!-- Large teacher (wide base) -->
  <polygon points="400,80 700,450 100,450" fill="none" stroke="#ef9a9a55" stroke-width="1" stroke-dasharray="4"/>

  <!-- Teacher layers -->
  <rect x="180" y="380" width="440" height="40" rx="5" fill="rgba(239,154,154,0.15)" stroke="#ef9a9a" stroke-width="1"/>
  <text x="400" y="405" text-anchor="middle" fill="#ef9a9a" font-size="13">GPT-3: 175 Billion Parameters</text>

  <rect x="210" y="320" width="380" height="35" rx="5" fill="rgba(239,154,154,0.12)" stroke="#ef9a9a88" stroke-width="1"/>
  <text x="400" y="342" text-anchor="middle" fill="#ef9a9a" font-size="12">BERT-Large: 340M Parameters</text>

  <rect x="240" y="265" width="320" height="35" rx="5" fill="rgba(239,154,154,0.10)" stroke="#ef9a9a66" stroke-width="1"/>
  <text x="400" y="287" text-anchor="middle" fill="#ef9a9a" font-size="12">ResNet-50: 25M Parameters</text>

  <rect x="270" y="210" width="260" height="35" rx="5" fill="rgba(255,152,0,0.12)" stroke="#ff9800" stroke-width="1"/>
  <text x="400" y="232" text-anchor="middle" fill="#ff9800" font-size="12">VGG-16: 138M Parameters</text>

  <!-- EML student (tiny peak) -->
  <rect x="360" y="130" width="80" height="55" rx="8" fill="rgba(79,195,247,0.2)" stroke="#4fc3f7" stroke-width="2"/>
  <text x="400" y="152" text-anchor="middle" fill="#4fc3f7" font-size="13" font-weight="bold">EML</text>
  <text x="400" y="170" text-anchor="middle" fill="#4fc3f7" font-size="10">400 params</text>

  <!-- Distillation arrows -->
  <line x1="400" y1="185" x2="400" y2="210" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="440" y="200" fill="#ffd700" font-size="10">distill</text>

  <!-- Compression ratios on right side -->
  <text x="680" y="160" fill="#4fc3f7" font-size="12" font-weight="bold">Compression Ratios:</text>

  <text x="680" y="190" fill="#b3e5fc" font-size="11">ResNet-50 → EML</text>
  <text x="680" y="208" fill="#ffd700" font-size="13" font-weight="bold">62,500×</text>

  <text x="680" y="238" fill="#b3e5fc" font-size="11">BERT-Large → EML</text>
  <text x="680" y="256" fill="#ffd700" font-size="13" font-weight="bold">850,000×</text>

  <text x="680" y="286" fill="#b3e5fc" font-size="11">GPT-3 → EML</text>
  <text x="680" y="304" fill="#ffd700" font-size="13" font-weight="bold">437,500,000×</text>

  <!-- Memory comparison -->
  <rect x="50" y="460" width="700" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="#ffffff22"/>
  <text x="400" y="488" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold">
    Memory &amp; Energy Impact
  </text>

  <text x="80" y="515" fill="#ef9a9a" font-size="12">GPT-3 at inference: ~350 GB RAM, ~300W power, $0.01/query</text>
  <text x="80" y="538" fill="#4fc3f7" font-size="12">EML equivalent:     ~2 KB RAM,   ~0.001W power, $0.000001/query</text>
  <text x="80" y="558" fill="#81c784" font-size="12">
    ✓ 175,000,000× less memory · 300,000× less energy · Formally verified: distillation_ratio_concrete
  </text>
</svg>
