<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="650" fill="url(#bg2)"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#E0E0E0" font-size="24" font-weight="bold">EML Depth Hierarchy — Strict Separation</text>
  <text x="400" y="65" text-anchor="middle" fill="#90CAF9" font-size="14">DEPTH(d+1) ⊋ DEPTH(d) for all d ≥ 0 — Proven via growth rate theory</text>
  
  <!-- Nested ellipses for depth hierarchy -->
  <ellipse cx="400" cy="360" rx="370" ry="250" fill="none" stroke="#1565C0" stroke-width="2" opacity="0.5"/>
  <text x="770" y="140" fill="#1565C0" font-size="14">DEPTH(∞)</text>
  
  <ellipse cx="400" cy="360" rx="310" ry="210" fill="none" stroke="#1976D2" stroke-width="2" opacity="0.6"/>
  <text x="705" y="185" fill="#1976D2" font-size="14">DEPTH(4)</text>
  
  <ellipse cx="400" cy="360" rx="250" ry="170" fill="none" stroke="#2196F3" stroke-width="2" opacity="0.7"/>
  <text x="645" y="225" fill="#2196F3" font-size="14">DEPTH(3)</text>
  
  <ellipse cx="400" cy="360" rx="190" ry="130" fill="none" stroke="#42A5F5" stroke-width="2" opacity="0.8"/>
  <text x="585" y="265" fill="#42A5F5" font-size="14">DEPTH(2)</text>
  
  <ellipse cx="400" cy="360" rx="130" ry="90" fill="none" stroke="#64B5F6" stroke-width="2" opacity="0.9"/>
  <text x="525" y="305" fill="#64B5F6" font-size="14">DEPTH(1)</text>
  
  <ellipse cx="400" cy="360" rx="60" ry="45" fill="none" stroke="#90CAF9" stroke-width="2"/>
  <text x="460" y="340" fill="#90CAF9" font-size="14">DEPTH(0)</text>
  
  <!-- Values at each depth -->
  <circle cx="400" cy="360" r="5" fill="#FFD54F"/>
  <text x="400" y="375" text-anchor="middle" fill="#FFD54F" font-size="12" font-weight="bold">1</text>
  
  <circle cx="400" cy="290" r="5" fill="#FF9800"/>
  <text x="400" y="285" text-anchor="middle" fill="#FF9800" font-size="12" font-weight="bold">e ≈ 2.718</text>
  
  <circle cx="320" cy="240" r="5" fill="#4CAF50"/>
  <text x="320" y="230" text-anchor="middle" fill="#4CAF50" font-size="11">e^e ≈ 15.15</text>
  
  <circle cx="480" cy="240" r="5" fill="#4CAF50"/>
  <text x="480" y="230" text-anchor="middle" fill="#4CAF50" font-size="11">e−1 ≈ 1.72</text>
  
  <circle cx="250" cy="200" r="5" fill="#E91E63"/>
  <text x="250" y="190" text-anchor="middle" fill="#E91E63" font-size="11">e^(e^e)</text>
  
  <circle cx="550" cy="200" r="5" fill="#E91E63"/>
  <text x="550" y="190" text-anchor="middle" fill="#E91E63" font-size="11">0</text>
  
  <!-- Growth rate witness -->
  <rect x="50" y="560" width="700" height="75" rx="8" fill="none" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="400" y="580" text-anchor="middle" fill="#4CAF50" font-size="14" font-weight="bold">Growth Rate Separation Theorem (Proven in Lean 4)</text>
  <text x="400" y="600" text-anchor="middle" fill="#A5D6A7" font-size="13">exp^(d+2)(x) eventually exceeds exp^(d+1)(Cx + D) for any constants C, D</text>
  <text x="400" y="620" text-anchor="middle" fill="#A5D6A7" font-size="13">⟹ Functions in DEPTH(d+1) grow strictly faster than DEPTH(d)</text>
  
  <!-- e-tower -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" fill="#FFD54F" font-size="14" font-weight="bold">e-Tower Growth:</text>
    <text x="0" y="22" fill="#FFCC80" font-size="12">e↑↑0 = 1</text>
    <text x="0" y="42" fill="#FFCC80" font-size="12">e↑↑1 = e ≈ 2.72</text>
    <text x="0" y="62" fill="#FFCC80" font-size="12">e↑↑2 = e^e ≈ 15.15</text>
    <text x="0" y="82" fill="#FFCC80" font-size="12">e↑↑3 = e^(e^e) ≈ 3.8×10⁶</text>
    <text x="0" y="102" fill="#FFCC80" font-size="12">e↑↑4 = e^(e^(e^e)) ≈ 10^(1.66×10⁶)</text>
    <text x="0" y="122" fill="#FF9800" font-size="12" font-style="italic">Grows faster than any primitive recursive fn!</text>
  </g>
</svg>
