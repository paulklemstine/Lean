<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="cordic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#E0E0E0" font-size="28" font-weight="bold">OISCC Architecture — Version 9</text>
  <text x="400" y="72" text-anchor="middle" fill="#90CAF9" font-size="16">One Instruction Set Continuous Computer</text>
  
  <!-- Main equation -->
  <rect x="200" y="85" width="400" height="40" rx="20" fill="none" stroke="#FFD54F" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="112" text-anchor="middle" fill="#FFD54F" font-size="22" font-weight="bold">EML(a, b) = e^a − ln(b)</text>
  
  <!-- OISCC Core Box -->
  <rect x="150" y="150" width="500" height="380" rx="15" fill="none" stroke="#42A5F5" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" fill="#42A5F5" font-size="18" font-weight="bold">OISCC Core</text>
  
  <!-- Stack -->
  <rect x="180" y="200" width="160" height="300" rx="8" fill="url(#stack)" opacity="0.3" stroke="#4CAF50" stroke-width="2"/>
  <text x="260" y="225" text-anchor="middle" fill="#A5D6A7" font-size="14" font-weight="bold">Stack (32 deep)</text>
  
  <!-- Stack entries -->
  <rect x="195" y="240" width="130" height="28" rx="4" fill="#1B5E20" stroke="#4CAF50"/>
  <text x="260" y="260" text-anchor="middle" fill="#A5D6A7" font-size="12">TOS: result</text>
  
  <rect x="195" y="275" width="130" height="28" rx="4" fill="#1B5E20" stroke="#4CAF50"/>
  <text x="260" y="295" text-anchor="middle" fill="#A5D6A7" font-size="12">operand a</text>
  
  <rect x="195" y="310" width="130" height="28" rx="4" fill="#1B5E20" stroke="#4CAF50"/>
  <text x="260" y="330" text-anchor="middle" fill="#A5D6A7" font-size="12">operand b</text>
  
  <rect x="195" y="345" width="130" height="28" rx="4" fill="#1B5E20" stroke="#388E3C" stroke-dasharray="4,4"/>
  <text x="260" y="365" text-anchor="middle" fill="#66BB6A" font-size="12">...</text>
  
  <!-- CORDIC Unit -->
  <rect x="400" y="200" width="220" height="180" rx="8" fill="url(#cordic)" opacity="0.3" stroke="#FF9800" stroke-width="2"/>
  <text x="510" y="225" text-anchor="middle" fill="#FFCC80" font-size="14" font-weight="bold">CORDIC exp/ln Unit</text>
  
  <text x="510" y="255" text-anchor="middle" fill="#FFE0B2" font-size="12">16-stage pipeline</text>
  <text x="510" y="280" text-anchor="middle" fill="#FFE0B2" font-size="12">15-bit accuracy</text>
  <text x="510" y="305" text-anchor="middle" fill="#FFE0B2" font-size="12">IEEE 754 (32-bit)</text>
  
  <!-- Pipeline stages -->
  <g transform="translate(420, 320)">
    <rect x="0" y="0" width="15" height="15" rx="2" fill="#E65100"/>
    <rect x="18" y="0" width="15" height="15" rx="2" fill="#EF6C00"/>
    <rect x="36" y="0" width="15" height="15" rx="2" fill="#F57C00"/>
    <rect x="54" y="0" width="15" height="15" rx="2" fill="#FB8C00"/>
    <rect x="72" y="0" width="15" height="15" rx="2" fill="#FF9800"/>
    <rect x="90" y="0" width="15" height="15" rx="2" fill="#FFA726"/>
    <rect x="108" y="0" width="15" height="15" rx="2" fill="#FFB74D"/>
    <rect x="126" y="0" width="15" height="15" rx="2" fill="#FFCC80"/>
    <text x="80" y="35" text-anchor="middle" fill="#FFCC80" font-size="10">Pipeline stages</text>
  </g>
  
  <!-- Arrows: Stack ↔ CORDIC -->
  <path d="M 340 280 L 400 260" stroke="#E0E0E0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 300 L 340 320" stroke="#E0E0E0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#E0E0E0"/>
    </marker>
  </defs>
  
  <!-- Program Counter -->
  <rect x="400" y="410" width="220" height="80" rx="8" fill="url(#core)" opacity="0.3" stroke="#2196F3" stroke-width="2"/>
  <text x="510" y="440" text-anchor="middle" fill="#90CAF9" font-size="14" font-weight="bold">Program Counter</text>
  <text x="510" y="465" text-anchor="middle" fill="#BBDEFB" font-size="12">2 instructions: PUSH, EML</text>
  <text x="510" y="485" text-anchor="middle" fill="#BBDEFB" font-size="12">~10 MOPS throughput</text>
  
  <!-- Instruction set box -->
  <rect x="50" y="550" width="700" height="40" rx="8" fill="none" stroke="#7C4DFF" stroke-width="1.5"/>
  <text x="400" y="575" text-anchor="middle" fill="#B388FF" font-size="14">
    Instructions: PUSH v (push constant) | EML (pop b, pop a, push e^a − ln(b))
  </text>
  
  <!-- Legend: proven results -->
  <g transform="translate(50, 145)">
    <rect width="15" height="15" rx="3" fill="#4CAF50"/>
    <text x="20" y="13" fill="#A5D6A7" font-size="11">Formally verified in Lean 4</text>
  </g>
</svg>
