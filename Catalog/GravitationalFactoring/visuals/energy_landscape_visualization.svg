<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ffaa00;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="1000" height="700" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold">
    Energy Landscape E(x) = N mod x for N = 30
  </text>
  <text x="500" y="62" text-anchor="middle" fill="#888" font-size="13">
    Divisors of 30 = {1, 2, 3, 5, 6, 10, 15, 30} appear as zero-energy valleys
  </text>
  
  <!-- Axes -->
  <line x1="80" y1="550" x2="950" y2="550" stroke="#444" stroke-width="2"/>
  <line x1="80" y1="550" x2="80" y2="90" stroke="#444" stroke-width="2"/>
  
  <!-- Y axis labels -->
  <text x="70" y="555" text-anchor="end" fill="#888" font-size="11">0</text>
  <text x="70" y="465" text-anchor="end" fill="#888" font-size="11">5</text>
  <text x="70" y="375" text-anchor="end" fill="#888" font-size="11">10</text>
  <text x="70" y="285" text-anchor="end" fill="#888" font-size="11">15</text>
  <text x="70" y="195" text-anchor="end" fill="#888" font-size="11">20</text>
  <text x="70" y="105" text-anchor="end" fill="#888" font-size="11">25</text>
  
  <!-- Y axis title -->
  <text x="25" y="320" text-anchor="middle" fill="#aaa" font-size="14" transform="rotate(-90, 25, 320)">
    E(x) = N mod x
  </text>
  
  <!-- X axis title -->
  <text x="515" y="590" text-anchor="middle" fill="#aaa" font-size="14">x</text>
  
  <!-- Grid lines -->
  <g stroke="#222" stroke-width="0.5" stroke-dasharray="3,3">
    <line x1="80" y1="460" x2="950" y2="460"/>
    <line x1="80" y1="370" x2="950" y2="370"/>
    <line x1="80" y1="280" x2="950" y2="280"/>
    <line x1="80" y1="190" x2="950" y2="190"/>
    <line x1="80" y1="100" x2="950" y2="100"/>
  </g>
  
  <!-- Energy values for N=30:
       E(1)=0, E(2)=0, E(3)=0, E(4)=2, E(5)=0, E(6)=0, E(7)=2,
       E(8)=6, E(9)=3, E(10)=0, E(11)=8, E(12)=6, E(13)=4,
       E(14)=2, E(15)=0, E(16)=14, E(17)=13, E(18)=12, E(19)=11,
       E(20)=10, E(21)=9, E(22)=8, E(23)=7, E(24)=6, E(25)=5,
       E(26)=4, E(27)=3, E(28)=2, E(29)=1, E(30)=0
  -->
  
  <!-- Energy landscape fill area -->
  <polygon fill="url(#energyGrad)" opacity="0.3"
    points="80,550 109,550 109,550 138,550 138,550 167,550 167,514 196,550 196,550
            225,550 225,514 254,442 254,442 283,496 283,496 312,550 312,550
            341,406 341,406 370,442 370,442 399,478 399,478 428,514 428,514
            457,550 457,550 486,298 486,298 515,316 515,316 544,334 544,334
            573,352 573,352 602,370 602,370 631,388 631,388 660,406 660,406
            689,424 689,424 718,442 718,442 747,460 747,460 776,478 776,478
            805,496 805,496 834,514 834,514 863,532 863,532 892,550 892,550
            950,550"/>
  
  <!-- Energy landscape line -->
  <polyline fill="none" stroke="#ff6b6b" stroke-width="2.5"
    points="109,550 138,550 167,550 196,514 225,550 254,550 283,514
            312,442 341,496 370,550 399,406 428,442 457,478
            486,514 515,550 544,298 573,316 602,334 631,352
            660,370 689,388 718,406 747,424 776,442 805,460
            834,478 863,496 892,514 921,532 950,550"/>
  
  <!-- Zero-energy points (divisors) with glow -->
  <g filter="url(#glowGreen)">
    <!-- x=1, E=0 -->
    <circle cx="109" cy="550" r="8" fill="#00ff88" stroke="white" stroke-width="1.5"/>
    <!-- x=2, E=0 -->
    <circle cx="138" cy="550" r="8" fill="#00ff88" stroke="white" stroke-width="1.5"/>
    <!-- x=3, E=0 -->
    <circle cx="167" cy="550" r="8" fill="#00ff88" stroke="white" stroke-width="1.5"/>
    <!-- x=5, E=0 -->
    <circle cx="225" cy="550" r="8" fill="#00ff88" stroke="white" stroke-width="1.5"/>
    <!-- x=6, E=0 -->
    <circle cx="254" cy="550" r="8" fill="#00ff88" stroke="white" stroke-width="1.5"/>
    <!-- x=10, E=0 -->
    <circle cx="370" cy="550" r="8" fill="#00ff88" stroke="white" stroke-width="1.5"/>
    <!-- x=15, E=0 -->
    <circle cx="515" cy="550" r="8" fill="#00ff88" stroke="white" stroke-width="1.5"/>
    <!-- x=30, E=0 -->
    <circle cx="950" cy="550" r="8" fill="#00ff88" stroke="white" stroke-width="1.5"/>
  </g>
  
  <!-- Labels for divisors -->
  <text x="109" y="570" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">1</text>
  <text x="138" y="570" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">2</text>
  <text x="167" y="570" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">3</text>
  <text x="225" y="570" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">5</text>
  <text x="254" y="570" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">6</text>
  <text x="370" y="570" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">10</text>
  <text x="515" y="570" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">15</text>
  <text x="950" y="570" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">30</text>
  
  <!-- Non-divisor X labels -->
  <text x="196" y="570" text-anchor="middle" fill="#666" font-size="9">4</text>
  <text x="283" y="570" text-anchor="middle" fill="#666" font-size="9">7</text>
  <text x="312" y="570" text-anchor="middle" fill="#666" font-size="9">8</text>
  <text x="341" y="570" text-anchor="middle" fill="#666" font-size="9">9</text>
  <text x="399" y="570" text-anchor="middle" fill="#666" font-size="9">11</text>
  <text x="428" y="570" text-anchor="middle" fill="#666" font-size="9">12</text>
  <text x="544" y="570" text-anchor="middle" fill="#666" font-size="9">16</text>
  
  <!-- Max energy annotation -->
  <line x1="544" y1="298" x2="544" y2="260" stroke="#ff4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="544" y="255" text-anchor="middle" fill="#ff6b6b" font-size="11">E(16) = 14</text>
  <text x="544" y="242" text-anchor="middle" fill="#ff6b6b" font-size="10">(local max)</text>
  
  <!-- Insight boxes -->
  <rect x="50" y="620" width="900" height="65" rx="8" fill="#111a22" stroke="#333" stroke-width="1"/>
  
  <text x="70" y="642" fill="#00ff88" font-size="13" font-weight="bold">Key Insight (Formally Verified):</text>
  <text x="70" y="660" fill="#ccc" font-size="12">
    E(x) = 0 ⟺ x | N  (energy_zero_iff). Local minima of E(x) are exactly the divisors (divisor_is_local_min).
  </text>
  <text x="70" y="676" fill="#ccc" font-size="12">
    Factoring N ≡ finding zero-energy states in the landscape. The "gravitational" potential guides search toward factors.
  </text>
  
  <!-- Theorem references -->
  <g fill="#555" font-size="9">
    <text x="700" y="642">Theorems: energy_zero_iff, energy_lt,</text>
    <text x="700" y="654">zero_energy_count, divisor_is_local_min,</text>
    <text x="700" y="666">sublevel_zero_eq_divisors, energy_predecessor</text>
  </g>
</svg>
