<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c62a48;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="compositeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="factorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecca3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#36b38e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ecca3"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e8e8e8" font-family="Georgia, serif" font-size="22" font-weight="bold">
    Non-Archimedean Factoring Oracle
  </text>
  <text x="400" y="62" text-anchor="middle" fill="#aaa" font-family="Georgia, serif" font-size="13" font-style="italic">
    ∀ composite n > 1, ∃ a, b > 1 : a × b = n
  </text>

  <!-- LEFT SIDE: The Oracle Process -->

  <!-- Input node: n -->
  <rect x="60" y="100" width="120" height="50" rx="10" fill="url(#compositeGrad)" stroke="#7b68ee" stroke-width="2" filter="url(#glow)"/>
  <text x="120" y="130" text-anchor="middle" fill="white" font-family="monospace" font-size="16" font-weight="bold">n = 360</text>
  <text x="120" y="90" text-anchor="middle" fill="#ccc" font-family="Arial" font-size="11">Input (composite)</text>

  <!-- Decision diamond -->
  <polygon points="120,190 180,230 120,270 60,230" fill="#2a2a4a" stroke="#7b68ee" stroke-width="2"/>
  <text x="120" y="225" text-anchor="middle" fill="#e8e8e8" font-family="Arial" font-size="11">Prime?</text>
  <text x="120" y="240" text-anchor="middle" fill="#e8e8e8" font-family="Arial" font-size="11">test</text>

  <!-- Arrow from n to decision -->
  <line x1="120" y1="150" x2="120" y2="190" stroke="#7b68ee" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- NO branch (composite) — goes down -->
  <text x="55" y="255" fill="#4ecca3" font-family="Arial" font-size="11" font-weight="bold">NO</text>

  <!-- Oracle box -->
  <rect x="40" y="290" width="160" height="60" rx="10" fill="url(#factorGrad)" stroke="#4ecca3" stroke-width="2" filter="url(#glow)"/>
  <text x="120" y="315" text-anchor="middle" fill="#1a1a2e" font-family="monospace" font-size="13" font-weight="bold">ORACLE</text>
  <text x="120" y="335" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="11">Extract divisor d</text>

  <!-- Arrow from decision to oracle -->
  <line x1="120" y1="270" x2="120" y2="290" stroke="#4ecca3" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Output factors -->
  <rect x="30" y="390" width="80" height="45" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="70" y="417" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="15" font-weight="bold">a = 2</text>

  <rect x="130" y="390" width="80" height="45" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="170" y="417" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="15" font-weight="bold">b = 180</text>

  <!-- Arrows from oracle to factors -->
  <line x1="90" y1="350" x2="70" y2="390" stroke="#4ecca3" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="150" y1="350" x2="170" y2="390" stroke="#4ecca3" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Verification -->
  <text x="120" y="460" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="12">2 × 180 = 360 ✓</text>
  <text x="120" y="478" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="12">a > 1 ✓  b > 1 ✓</text>

  <!-- YES branch (prime) — goes right -->
  <text x="190" y="225" fill="#e94560" font-family="Arial" font-size="11" font-weight="bold">YES</text>

  <!-- Prime rejection box -->
  <rect x="220" y="210" width="120" height="40" rx="8" fill="#3a1528" stroke="#e94560" stroke-width="2"/>
  <text x="280" y="234" text-anchor="middle" fill="#e94560" font-family="Arial" font-size="12" font-weight="bold">N/A (prime)</text>

  <!-- Arrow from decision to prime box -->
  <line x1="180" y1="230" x2="220" y2="230" stroke="#e94560" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- RIGHT SIDE: P-adic Valuation Tree for 360 -->
  <text x="580" y="95" text-anchor="middle" fill="#e8e8e8" font-family="Georgia, serif" font-size="16" font-weight="bold">
    P-adic Valuation Structure
  </text>
  <text x="580" y="115" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="12">
    360 = 2³ × 3² × 5¹
  </text>

  <!-- Tree: root 360 -->
  <circle cx="580" cy="155" r="25" fill="url(#compositeGrad)" stroke="#7b68ee" stroke-width="2"/>
  <text x="580" y="160" text-anchor="middle" fill="white" font-family="monospace" font-size="13" font-weight="bold">360</text>

  <!-- Branches to prime factors -->
  <!-- Branch to 2 -->
  <line x1="560" y1="175" x2="470" y2="225" stroke="#e94560" stroke-width="2"/>
  <circle cx="470" cy="240" r="20" fill="url(#primeGrad)" stroke="#e94560" stroke-width="2"/>
  <text x="470" y="245" text-anchor="middle" fill="white" font-family="monospace" font-size="14" font-weight="bold">2</text>
  <text x="470" y="275" text-anchor="middle" fill="#e94560" font-family="Arial" font-size="11">v₂ = 3</text>

  <!-- Valuation bar for 2 -->
  <rect x="445" y="285" width="50" height="8" rx="3" fill="#333"/>
  <rect x="445" y="285" width="37" rx="3" height="8" fill="#e94560"/>

  <!-- Branch to 3 -->
  <line x1="580" y1="180" x2="580" y2="225" stroke="#f0a500" stroke-width="2"/>
  <circle cx="580" cy="240" r="20" fill="#f0a500" stroke="#d49000" stroke-width="2"/>
  <text x="580" y="245" text-anchor="middle" fill="#1a1a2e" font-family="monospace" font-size="14" font-weight="bold">3</text>
  <text x="580" y="275" text-anchor="middle" fill="#f0a500" font-family="Arial" font-size="11">v₃ = 2</text>

  <!-- Valuation bar for 3 -->
  <rect x="555" y="285" width="50" height="8" rx="3" fill="#333"/>
  <rect x="555" y="285" width="25" rx="3" height="8" fill="#f0a500"/>

  <!-- Branch to 5 -->
  <line x1="600" y1="175" x2="690" y2="225" stroke="#4ecca3" stroke-width="2"/>
  <circle cx="690" cy="240" r="20" fill="#2a6e5a" stroke="#4ecca3" stroke-width="2"/>
  <text x="690" y="245" text-anchor="middle" fill="white" font-family="monospace" font-size="14" font-weight="bold">5</text>
  <text x="690" y="275" text-anchor="middle" fill="#4ecca3" font-family="Arial" font-size="11">v₅ = 1</text>

  <!-- Valuation bar for 5 -->
  <rect x="665" y="285" width="50" height="8" rx="3" fill="#333"/>
  <rect x="665" y="285" width="12" rx="3" height="8" fill="#4ecca3"/>

  <!-- P-adic "closeness" annotation -->
  <rect x="420" y="320" width="320" height="80" rx="10" fill="#1a1a2e" stroke="#555" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="580" y="342" text-anchor="middle" fill="#ccc" font-family="Georgia, serif" font-size="12" font-style="italic">
    In ℚ₂: |360|₂ = 2⁻³ = 1/8 (close to 0)
  </text>
  <text x="580" y="362" text-anchor="middle" fill="#ccc" font-family="Georgia, serif" font-size="12" font-style="italic">
    In ℚ₃: |360|₃ = 3⁻² = 1/9 (close to 0)
  </text>
  <text x="580" y="382" text-anchor="middle" fill="#ccc" font-family="Georgia, serif" font-size="12" font-style="italic">
    In ℚ₅: |360|₅ = 5⁻¹ = 1/5 (moderately close)
  </text>

  <!-- Lean proof box -->
  <rect x="380" y="420" width="400" height="100" rx="8" fill="#0d1117" stroke="#4ecca3" stroke-width="1"/>
  <text x="400" y="445" fill="#7b68ee" font-family="monospace" font-size="11">theorem</text>
  <text x="465" y="445" fill="#e8e8e8" font-family="monospace" font-size="11">pAdic_factoring_oracle</text>
  <text x="400" y="462" fill="#aaa" font-family="monospace" font-size="10">  (hn : n > 1) (hc : ¬ Nat.Prime n) :</text>
  <text x="400" y="479" fill="#aaa" font-family="monospace" font-size="10">  ∃ a b, a * b = n ∧ a > 1 ∧ b > 1</text>
  <text x="400" y="496" fill="#4ecca3" font-family="monospace" font-size="10">  -- Proved ✓ (no sorry, clean axioms)</text>
  <text x="400" y="511" fill="#555" font-family="monospace" font-size="9">  Axioms: propext, Classical.choice, Quot.sound</text>

  <!-- Legend -->
  <circle cx="50" cy="540" r="8" fill="url(#primeGrad)"/>
  <text x="65" y="544" fill="#e8e8e8" font-family="Arial" font-size="11">Prime (no factoring)</text>

  <circle cx="230" cy="540" r="8" fill="url(#compositeGrad)"/>
  <text x="245" y="544" fill="#e8e8e8" font-family="Arial" font-size="11">Composite (oracle applies)</text>

  <circle cx="440" cy="540" r="8" fill="url(#factorGrad)"/>
  <text x="455" y="544" fill="#e8e8e8" font-family="Arial" font-size="11">Factor (output)</text>

  <!-- Caption -->
  <text x="400" y="585" text-anchor="middle" fill="#888" font-family="Georgia, serif" font-size="11" font-style="italic">
    Figure: The factoring oracle splits composite numbers via divisor extraction. P-adic valuations reveal prime factor structure.
  </text>
</svg>
