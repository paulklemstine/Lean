<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Non-Archimedean Factoring Oracle
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Composite Number Decomposition via Non-Trivial Divisors
  </text>

  <!-- LEFT SIDE: The Natural Numbers Partition -->
  <rect x="30" y="75" width="340" height="230" rx="8" fill="#fff" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="200" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    ℕ &gt; 1 = Primes ∪ Composites
  </text>

  <!-- Prime numbers (red region) -->
  <rect x="50" y="115" width="140" height="170" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">
    Primes
  </text>
  <text x="120" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b">2, 3, 5, 7, 11</text>
  <text x="120" y="175" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b">13, 17, 19, 23</text>
  <text x="120" y="192" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b">29, 31, 37, ...</text>

  <!-- X mark for primes -->
  <text x="120" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#c0392b">✗</text>
  <text x="120" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#c0392b">
    No factorization
  </text>
  <text x="120" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#c0392b">
    a × b = p, a,b &gt; 1
  </text>
  <text x="120" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c0392b">
    ORIGINAL THEOREM FAILS
  </text>

  <!-- Composite numbers (green region) -->
  <rect x="210" y="115" width="145" height="170" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="282" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
    Composites
  </text>
  <text x="282" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60">4, 6, 8, 9, 10</text>
  <text x="282" y="175" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60">12, 14, 15, 16</text>
  <text x="282" y="192" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60">18, 20, 21, ...</text>

  <!-- Check mark for composites -->
  <text x="282" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#27ae60">✓</text>
  <text x="282" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">
    ∃ a, b &gt; 1
  </text>
  <text x="282" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">
    a × b = n
  </text>
  <text x="282" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#27ae60">
    CORRECTED THEOREM ✓
  </text>

  <!-- RIGHT SIDE: Proof Structure -->
  <rect x="400" y="75" width="380" height="230" rx="8" fill="#fff" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="590" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Proof Architecture
  </text>

  <!-- Input box -->
  <rect x="500" y="112" width="180" height="35" rx="5" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="590" y="134" text-anchor="middle" font-family="monospace" font-size="11" fill="#2980b9">
    n &gt; 1, ¬Prime(n)
  </text>

  <!-- Arrow down -->
  <line x1="590" y1="147" x2="590" y2="165" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Mathlib lemma box -->
  <rect x="440" y="168" width="300" height="35" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="590" y="185" text-anchor="middle" font-family="monospace" font-size="10" fill="#7d6608">
    Nat.exists_dvd_of_not_prime2
  </text>
  <text x="590" y="198" text-anchor="middle" font-family="monospace" font-size="9" fill="#7d6608">
    → ∃ k, k ∣ n ∧ 2 ≤ k ∧ k &lt; n
  </text>

  <!-- Arrow down -->
  <line x1="590" y1="203" x2="590" y2="218" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Witness construction -->
  <rect x="460" y="221" width="260" height="30" rx="5" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="590" y="241" text-anchor="middle" font-family="monospace" font-size="11" fill="#8e44ad">
    a := k,  b := n / k
  </text>

  <!-- Arrow down to three verification boxes -->
  <line x1="590" y1="251" x2="590" y2="263" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Three verification boxes -->
  <rect x="420" y="266" width="100" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1"/>
  <text x="470" y="284" text-anchor="middle" font-family="monospace" font-size="9" fill="#27ae60">a × b = n ✓</text>

  <rect x="530" y="266" width="80" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1"/>
  <text x="570" y="284" text-anchor="middle" font-family="monospace" font-size="9" fill="#27ae60">a &gt; 1 ✓</text>

  <rect x="620" y="266" width="80" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1"/>
  <text x="660" y="284" text-anchor="middle" font-family="monospace" font-size="9" fill="#27ae60">b &gt; 1 ✓</text>

  <!-- BOTTOM: Example factorizations -->
  <rect x="30" y="320" width="740" height="240" rx="8" fill="#fff" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="400" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Example Factorizations (Oracle in Action)
  </text>

  <!-- Examples -->
  <g font-family="monospace" font-size="13">
    <!-- n = 4 -->
    <rect x="60" y="365" width="50" height="40" rx="5" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
    <text x="85" y="390" text-anchor="middle" fill="#2980b9" font-weight="bold">4</text>
    <text x="120" y="390" text-anchor="middle" fill="#333">=</text>
    <rect x="130" y="365" width="35" height="40" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="148" y="390" text-anchor="middle" fill="#27ae60" font-weight="bold">2</text>
    <text x="175" y="390" text-anchor="middle" fill="#333">×</text>
    <rect x="185" y="365" width="35" height="40" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="203" y="390" text-anchor="middle" fill="#27ae60" font-weight="bold">2</text>

    <!-- n = 12 -->
    <rect x="260" y="365" width="50" height="40" rx="5" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
    <text x="285" y="390" text-anchor="middle" fill="#2980b9" font-weight="bold">12</text>
    <text x="320" y="390" text-anchor="middle" fill="#333">=</text>
    <rect x="330" y="365" width="35" height="40" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="348" y="390" text-anchor="middle" fill="#27ae60" font-weight="bold">2</text>
    <text x="375" y="390" text-anchor="middle" fill="#333">×</text>
    <rect x="385" y="365" width="35" height="40" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="403" y="390" text-anchor="middle" fill="#27ae60" font-weight="bold">6</text>

    <!-- n = 91 -->
    <rect x="460" y="365" width="50" height="40" rx="5" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
    <text x="485" y="390" text-anchor="middle" fill="#2980b9" font-weight="bold">91</text>
    <text x="520" y="390" text-anchor="middle" fill="#333">=</text>
    <rect x="530" y="365" width="35" height="40" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="548" y="390" text-anchor="middle" fill="#27ae60" font-weight="bold">7</text>
    <text x="575" y="390" text-anchor="middle" fill="#333">×</text>
    <rect x="585" y="365" width="42" height="40" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="606" y="390" text-anchor="middle" fill="#27ae60" font-weight="bold">13</text>
  </g>

  <!-- Prime counterexample -->
  <g font-family="monospace" font-size="13">
    <rect x="60" y="430" width="50" height="40" rx="5" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/>
    <text x="85" y="455" text-anchor="middle" fill="#c0392b" font-weight="bold">7</text>
    <text x="120" y="455" text-anchor="middle" fill="#c0392b">=</text>
    <text x="180" y="455" text-anchor="middle" fill="#c0392b" font-size="12">??? (prime — no factorization exists)</text>
  </g>

  <!-- p-adic valuation illustration -->
  <text x="400" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">
    p-adic Valuations Encode Structure
  </text>
  <g font-family="monospace" font-size="11" fill="#8e44ad">
    <text x="100" y="522" text-anchor="middle">v₂(12) = 2</text>
    <text x="250" y="522" text-anchor="middle">v₃(12) = 1</text>
    <text x="400" y="522" text-anchor="middle">12 = 2² × 3¹</text>
    <text x="580" y="522" text-anchor="middle">→ factors: (2, 6) or (3, 4) or (4, 3)</text>
  </g>

  <!-- Caption -->
  <text x="400" y="558" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#7f8c8d">
    Figure: The factoring oracle decomposes composite numbers into non-trivial factors (green).
  </text>
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#7f8c8d">
    Primes (red) cannot be factored — the original universal claim is false.
  </text>
</svg>
