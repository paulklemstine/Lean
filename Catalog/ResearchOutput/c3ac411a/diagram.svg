<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Algebraic Projective Adjunction Hypothesis
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Terminal Object Universal Property &amp; Tropical Degeneration
  </text>

  <!-- ===== LEFT: Category of Types ===== -->
  <rect x="30" y="80" width="220" height="240" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#2563EB">Cat(Type)</text>

  <!-- Inhabited type X -->
  <ellipse cx="90" cy="170" rx="40" ry="25" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="90" y="165" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">X</text>
  <text x="90" y="180" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3b82f6">[Inhabited]</text>

  <!-- Another type Y -->
  <ellipse cx="190" cy="170" rx="30" ry="20" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="190" y="175" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">Y</text>

  <!-- Terminal object (Unit) -->
  <circle cx="140" cy="270" r="22" fill="#2563EB" stroke="#1e40af" stroke-width="2"/>
  <text x="140" y="275" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="white">𝟙</text>

  <!-- Arrows to terminal -->
  <line x1="90" y1="195" x2="130" y2="252" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="95" y="230" font-family="monospace" font-size="9" fill="#2563EB">!</text>
  <line x1="190" y1="190" x2="155" y2="252" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="180" y="230" font-family="monospace" font-size="9" fill="#2563EB">!</text>

  <!-- ===== MIDDLE: Category of Propositions ===== -->
  <rect x="290" y="80" width="220" height="240" rx="12" fill="#F0FDF4" stroke="#059669" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#059669">Cat(Prop)</text>

  <!-- Proposition P -->
  <rect x="310" y="145" width="60" height="35" rx="6" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text x="340" y="167" text-anchor="middle" font-family="monospace" font-size="12" fill="#065f46">P</text>

  <!-- Proposition Q -->
  <rect x="430" y="145" width="60" height="35" rx="6" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text x="460" y="167" text-anchor="middle" font-family="monospace" font-size="12" fill="#065f46">Q</text>

  <!-- True (terminal) -->
  <circle cx="400" cy="270" r="22" fill="#059669" stroke="#065f46" stroke-width="2"/>
  <text x="400" y="268" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="white">True</text>
  <text x="400" y="281" text-anchor="middle" font-family="monospace" font-size="9" fill="white">= ⊤</text>

  <!-- Arrows to True -->
  <line x1="340" y1="180" x2="385" y2="252" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="348" y="225" font-family="monospace" font-size="9" fill="#059669">trivial</text>
  <line x1="460" y1="180" x2="415" y2="252" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="445" y="225" font-family="monospace" font-size="9" fill="#059669">trivial</text>

  <!-- ===== Adjunction arrows between categories ===== -->
  <line x1="255" y1="175" x2="285" y2="175" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="285" y1="195" x2="255" y2="195" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="270" y="168" text-anchor="middle" font-family="monospace" font-size="10" fill="#7C3AED">F</text>
  <text x="270" y="210" text-anchor="middle" font-family="monospace" font-size="10" fill="#7C3AED">G</text>
  <text x="270" y="225" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7C3AED">F ⊣ G</text>

  <!-- ===== RIGHT: Tropical Degeneration ===== -->
  <rect x="550" y="80" width="220" height="240" rx="12" fill="#FDF4FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="660" y="105" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#7C3AED">Tropical</text>

  <!-- Tropical polynomial (piecewise linear) -->
  <polyline points="570,260 620,220 680,200 740,180" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  
  <!-- Kink points -->
  <circle cx="620" cy="220" r="5" fill="#C084FC" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="680" cy="200" r="5" fill="#C084FC" stroke="#7C3AED" stroke-width="1.5"/>
  
  <text x="620" y="245" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7C3AED">kink₁</text>
  <text x="680" y="225" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7C3AED">kink₂</text>

  <!-- Tropical labels -->
  <text x="660" y="140" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b21a8">(ℝ∪{∞}, min, +)</text>
  <text x="660" y="158" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7C3AED">Piecewise linear collapse</text>
  
  <text x="660" y="285" text-anchor="middle" font-family="monospace" font-size="10" fill="#7C3AED">min(2x, x+3, 2)</text>

  <!-- ===== BOTTOM: Yoneda & Universal Property ===== -->
  <rect x="80" y="360" width="640" height="130" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="400" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#92400E">
    Universal Property via Yoneda Lemma
  </text>

  <!-- Yoneda equation -->
  <text x="400" y="415" text-anchor="middle" font-family="monospace" font-size="13" fill="#78350f">
    Nat(Hom(−, A), F) ≅ F(A)
  </text>

  <!-- Specialization -->
  <text x="400" y="445" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400E">
    F = Δ(⊤)  ⟹  Nat(Hom(−, A), Δ(⊤)) ≅ ⊤ ≅ {∗}
  </text>

  <!-- Conclusion -->
  <rect x="250" y="458" width="300" height="25" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="400" y="476" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#78350f">
    ∀ (X : Type*) [Inhabited X], True  ✓
  </text>

  <!-- Connection arrows from top boxes to Yoneda -->
  <line x1="140" y1="320" x2="250" y2="370" stroke="#D97706" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="320" x2="400" y2="355" stroke="#D97706" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="660" y1="320" x2="550" y2="370" stroke="#D97706" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Caption -->
  <text x="400" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    The projective adjunction F ⊣ G between Type and Prop collapses to the terminal object property.
  </text>
  <text x="400" y="548" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    The Yoneda lemma with the constant-⊤ presheaf confirms: the universal property is trivially satisfied.
  </text>
  <text x="400" y="566" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    Tropical degeneration sends algebraic varieties to piecewise-linear complexes, preserving satisfiability.
  </text>

  <!-- Legend -->
  <rect x="600" y="510" width="12" height="12" rx="2" fill="#2563EB"/>
  <text x="618" y="521" font-family="sans-serif" font-size="9" fill="#334155">Types</text>
  <rect x="660" y="510" width="12" height="12" rx="2" fill="#059669"/>
  <text x="678" y="521" font-family="sans-serif" font-size="9" fill="#334155">Propositions</text>
  <rect x="600" y="528" width="12" height="12" rx="2" fill="#7C3AED"/>
  <text x="618" y="539" font-family="sans-serif" font-size="9" fill="#334155">Tropical</text>
  <rect x="660" y="528" width="12" height="12" rx="2" fill="#D97706"/>
  <text x="678" y="539" font-family="sans-serif" font-size="9" fill="#334155">Yoneda</text>
</svg>
