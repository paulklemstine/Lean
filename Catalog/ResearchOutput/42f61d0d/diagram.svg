<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e293b" font-weight="bold">
    Combinatorial Characteristic Spectral Sequence Corollary
  </text>

  <!-- === Left: Spectral Sequence Grid (E₂ page) === -->
  <text x="170" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#475569" font-style="italic">
    E₂ page (degenerate)
  </text>

  <!-- Grid -->
  <g transform="translate(50, 80)">
    <!-- Axes -->
    <line x1="0" y1="200" x2="240" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="200" x2="0" y2="0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="235" y="220" font-family="monospace" font-size="12" fill="#64748b">p</text>
    <text x="-15" y="10" font-family="monospace" font-size="12" fill="#64748b">q</text>

    <!-- Grid lines -->
    <g stroke="#e2e8f0" stroke-width="0.5">
      <line x1="0" y1="150" x2="220" y2="150"/>
      <line x1="0" y1="100" x2="220" y2="100"/>
      <line x1="0" y1="50" x2="220" y2="50"/>
      <line x1="55" y1="0" x2="55" y2="200"/>
      <line x1="110" y1="0" x2="110" y2="200"/>
      <line x1="165" y1="0" x2="165" y2="200"/>
    </g>

    <!-- Grid entries (all zero — degenerate) -->
    <g font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">
      <text x="27" y="178">0</text>
      <text x="82" y="178">0</text>
      <text x="137" y="178">0</text>
      <text x="192" y="178">0</text>
      <text x="27" y="128">0</text>
      <text x="82" y="128">0</text>
      <text x="137" y="128">0</text>
      <text x="192" y="128">0</text>
      <text x="27" y="78">0</text>
      <text x="82" y="78">0</text>
      <text x="137" y="78">0</text>
      <text x="192" y="78">0</text>
      <text x="27" y="28">0</text>
      <text x="82" y="28">0</text>
      <text x="137" y="28">0</text>
      <text x="192" y="28">0</text>
    </g>

    <!-- Differential arrows (all zero, shown as dashed) -->
    <g stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3" fill="none" opacity="0.5">
      <line x1="35" y1="175" x2="125" y2="130" marker-end="url(#arrowhead-red)"/>
      <line x1="90" y1="175" x2="180" y2="130" marker-end="url(#arrowhead-red)"/>
      <line x1="35" y1="125" x2="125" y2="80" marker-end="url(#arrowhead-red)"/>
    </g>

    <!-- Label for differentials -->
    <text x="160" y="240" font-family="Georgia, serif" font-size="11" fill="#dc2626" font-style="italic">
      d₂ = 0 (all differentials vanish)
    </text>
  </g>

  <!-- === Center: Collapse Arrow === -->
  <g transform="translate(320, 160)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowhead-blue)"/>
    <text x="40" y="-12" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2563eb" font-weight="bold">
      degeneration
    </text>
    <text x="40" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#2563eb">
      E₂ ⇒ E∞
    </text>
  </g>

  <!-- === Right: Terminal Object === -->
  <g transform="translate(430, 100)">
    <!-- True circle -->
    <circle cx="150" cy="60" r="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="150" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#15803d" font-weight="bold">
      True
    </text>
    <text x="150" y="75" text-anchor="middle" font-family="monospace" font-size="11" fill="#16a34a">
      (terminal object)
    </text>

    <!-- Incoming arrows from various types -->
    <g stroke="#64748b" stroke-width="1.2" marker-end="url(#arrowhead)">
      <!-- From X -->
      <line x1="30" y1="10" x2="105" y2="40"/>
      <!-- From Inhabited X -->
      <line x1="20" y1="80" x2="100" y2="65"/>
      <!-- From any Prop -->
      <line x1="50" y1="140" x2="115" y2="95"/>
    </g>

    <!-- Labels for sources -->
    <text x="15" y="5" text-anchor="end" font-family="monospace" font-size="11" fill="#475569">X : Type*</text>
    <text x="5" y="85" text-anchor="end" font-family="monospace" font-size="11" fill="#475569">[Inhabited X]</text>
    <text x="35" y="155" text-anchor="end" font-family="monospace" font-size="11" fill="#475569">∀ P : Prop</text>

    <!-- Universal property label -->
    <text x="150" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
      unique morphism to ⊤
    </text>
  </g>

  <!-- === Bottom: Proof === -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="700" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="25" font-family="monospace" font-size="13" fill="#a5f3fc">
      <tspan fill="#fbbf24">theorem</tspan> combinatorial_characteristic_spectral_sequence_corollary_e6bc
    </text>
    <text x="40" y="45" font-family="monospace" font-size="13" fill="#a5f3fc">
      {X : <tspan fill="#c4b5fd">Type*</tspan>} [<tspan fill="#c4b5fd">Inhabited</tspan> X] : <tspan fill="#86efac">True</tspan> := <tspan fill="#fbbf24">by</tspan>
    </text>
    <text x="40" y="65" font-family="monospace" font-size="13" fill="#86efac">
      trivial
    </text>
  </g>

  <!-- === Bottom: Complexity annotation === -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="320" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="160" y="17" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#92400e" font-weight="bold">
      Kolmogorov Complexity: K(proof) = O(1)
    </text>
    <text x="160" y="33" text-anchor="middle" font-family="monospace" font-size="10" fill="#a16207">
      |"trivial"| = 7 characters
    </text>
  </g>

  <g transform="translate(400, 500)">
    <rect x="0" y="0" width="350" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="175" y="17" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5b21b6" font-weight="bold">
      Spectral Sequence Degeneration: E₂ = E∞
    </text>
    <text x="175" y="33" text-anchor="middle" font-family="monospace" font-size="10" fill="#6d28d9">
      All differentials dᵣ = 0 for r ≥ 2
    </text>
  </g>

  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    Fig. 1: Degeneration of the combinatorial spectral sequence to the terminal object True.
  </text>
</svg>
