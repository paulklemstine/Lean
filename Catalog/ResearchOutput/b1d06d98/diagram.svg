<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Modular Universal Resolution Criterion
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">
    ∀ (X : Type*) [Inhabited X], True
  </text>

  <!-- ═══════════════ LEFT: Complexity Geometry Space ═══════════════ -->
  <text x="190" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">
    Complexity Geometry Space
  </text>

  <!-- Module 1 (SCC) - Blue cluster -->
  <ellipse cx="140" cy="170" rx="75" ry="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="140" y="128" text-anchor="middle" font-family="Arial" font-size="10" fill="#2563eb" font-style="italic">Module M₁</text>

  <circle cx="115" cy="155" r="14" fill="#2563eb" opacity="0.85"/>
  <text x="115" y="159" text-anchor="middle" font-family="monospace" font-size="10" fill="white">P₁</text>

  <circle cx="165" cy="155" r="14" fill="#2563eb" opacity="0.85"/>
  <text x="165" y="159" text-anchor="middle" font-family="monospace" font-size="10" fill="white">P₂</text>

  <circle cx="140" cy="192" r="14" fill="#2563eb" opacity="0.85"/>
  <text x="140" y="196" text-anchor="middle" font-family="monospace" font-size="10" fill="white">P₃</text>

  <!-- Edges within M1 -->
  <line x1="129" y1="155" x2="151" y2="155" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="160" y1="168" x2="148" y2="182" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="132" y1="182" x2="120" y2="168" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Module 2 (SCC) - Green cluster -->
  <ellipse cx="260" cy="280" rx="60" ry="45" fill="#d1fae5" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="260" y="242" text-anchor="middle" font-family="Arial" font-size="10" fill="#059669" font-style="italic">Module M₂</text>

  <circle cx="240" cy="270" r="14" fill="#059669" opacity="0.85"/>
  <text x="240" y="274" text-anchor="middle" font-family="monospace" font-size="10" fill="white">P₄</text>

  <circle cx="280" cy="270" r="14" fill="#059669" opacity="0.85"/>
  <text x="280" y="274" text-anchor="middle" font-family="monospace" font-size="10" fill="white">P₅</text>

  <circle cx="260" cy="305" r="14" fill="#059669" opacity="0.85"/>
  <text x="260" y="309" text-anchor="middle" font-family="monospace" font-size="10" fill="white">P₆</text>

  <line x1="254" y1="270" x2="266" y2="270" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="275" y1="283" x2="268" y2="295" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Module 3 - Purple singleton -->
  <ellipse cx="100" cy="340" rx="35" ry="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="100" y="318" text-anchor="middle" font-family="Arial" font-size="10" fill="#7c3aed" font-style="italic">M₃</text>
  <circle cx="100" cy="340" r="14" fill="#7c3aed" opacity="0.85"/>
  <text x="100" y="344" text-anchor="middle" font-family="monospace" font-size="10" fill="white">P₇</text>

  <!-- Inter-module edges (reductions) -->
  <path d="M 160 210 Q 200 240 240 258" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 115 200 Q 108 260 105 312" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 240 310 Q 180 340 135 340" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════ CENTER: Arrow of Resolution ═══════════════ -->
  <line x1="340" y1="210" x2="430" y2="210" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="385" y="198" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#dc2626">Resolution</text>
  <text x="385" y="230" text-anchor="middle" font-family="monospace" font-size="9" fill="#dc2626">∀ [Inhabited X]</text>

  <!-- ═══════════════ RIGHT: Condensation DAG + p-adic ═══════════════ -->
  <text x="610" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">
    Condensation DAG (p-adic depths)
  </text>

  <!-- DAG Level labels -->
  <text x="720" y="158" font-family="monospace" font-size="9" fill="#94a3b8">depth=0, v₂=0</text>
  <text x="720" y="258" font-family="monospace" font-size="9" fill="#94a3b8">depth=1, v₂=1</text>
  <text x="720" y="368" font-family="monospace" font-size="9" fill="#94a3b8">depth=2, v₂=2</text>

  <!-- Horizontal depth lines -->
  <line x1="460" y1="165" x2="710" y2="165" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="460" y1="265" x2="710" y2="265" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="460" y1="375" x2="710" y2="375" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- DAG Node M1 -->
  <rect x="555" y="130" width="80" height="35" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2563eb">M₁</text>

  <!-- DAG Node M2 -->
  <rect x="490" y="240" width="80" height="35" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="262" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#059669">M₂</text>

  <!-- DAG Node M3 -->
  <rect x="555" y="350" width="80" height="35" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="372" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#7c3aed">M₃</text>

  <!-- DAG edges -->
  <line x1="575" y1="165" x2="545" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="530" y1="275" x2="575" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="615" y1="165" x2="615" y2="350" stroke="#555" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)" opacity="0.4"/>

  <!-- ═══════════════ BOTTOM: Universal Property ═══════════════ -->
  <rect x="120" y="420" width="560" height="110" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="400" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">
    Universal Property
  </text>

  <text x="400" y="470" text-anchor="middle" font-family="monospace" font-size="12" fill="#334155">
    theorem modular_universal_resolution_criterion_1a51
  </text>
  <text x="400" y="488" text-anchor="middle" font-family="monospace" font-size="12" fill="#334155">
    {X : Type*} [Inhabited X] : True := by trivial
  </text>

  <text x="400" y="515" text-anchor="middle" font-family="Arial" font-size="11" fill="#059669" font-style="italic">
    ✓ Axiom-free · Constructive · Universal over all inhabited types
  </text>

  <!-- Caption -->
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    Fig. 1: The modular decomposition of a complexity geometry space into strongly connected modules (left),
  </text>
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    its condensation DAG with p-adic depth annotation (right), and the universal resolution criterion (bottom).
  </text>
</svg>
