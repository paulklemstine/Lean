<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8ecf1;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Equivariant Universal Fixpoint Conjecture
  </text>
  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    The triangle of domains: AI · Homotopy Theory · Tropical Geometry
  </text>

  <!-- ═══════ Three domain circles ═══════ -->

  <!-- AI / Fixpoint Theory (top) -->
  <circle cx="400" cy="160" r="70" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.5"/>
  <text x="400" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2980b9">AI</text>
  <text x="400" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2980b9">Fixpoint Iteration</text>
  <text x="400" y="183" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5dade2">F(x*) = x*</text>

  <!-- Homotopy Theory (bottom-left) -->
  <circle cx="250" cy="350" r="70" fill="#eafaf1" stroke="#27ae60" stroke-width="2.5"/>
  <text x="250" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Homotopy</text>
  <text x="250" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#27ae60">Equivariant Maps</text>
  <text x="250" y="373" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#58d68d">G ↷ X, f∘g = g∘f</text>

  <!-- Tropical Geometry (bottom-right) -->
  <circle cx="550" cy="350" r="70" fill="#fef9e7" stroke="#e67e22" stroke-width="2.5"/>
  <text x="550" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e67e22">Tropical</text>
  <text x="550" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e67e22">Min-Plus Algebra</text>
  <text x="550" y="373" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f0b27a">a⊕b = min(a,b)</text>

  <!-- ═══════ Connecting arrows ═══════ -->

  <!-- AI → Homotopy -->
  <line x1="345" y1="210" x2="290" y2="295" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="295" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2c3e50" transform="rotate(-35, 295, 245)">equivariance</text>

  <!-- AI → Tropical -->
  <line x1="455" y1="210" x2="510" y2="295" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="505" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2c3e50" transform="rotate(35, 505, 245)">tropicalization</text>

  <!-- Homotopy ↔ Tropical -->
  <line x1="325" y1="365" x2="475" y2="365" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="400" y="385" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2c3e50">tropical duality</text>

  <!-- ═══════ Central node: Universal Fixpoint ═══════ -->
  <circle cx="400" cy="290" r="35" fill="#f5eef8" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="400" y="285" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8e44ad">Universal</text>
  <text x="400" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8e44ad">Fixpoint</text>

  <!-- ═══════ Inhabited Type box ═══════ -->
  <rect x="300" y="430" width="200" height="50" rx="8" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>
  <text x="400" y="452" text-anchor="middle" font-family="monospace" font-size="13" fill="#c0392b">[Inhabited X]</text>
  <text x="400" y="470" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e74c3c">∃ default : X</text>

  <!-- Arrow from Inhabited to Universal Fixpoint -->
  <line x1="400" y1="430" x2="400" y2="328" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="425" y="390" font-family="sans-serif" font-size="10" fill="#c0392b">guarantees</text>

  <!-- ═══════ Result: True ═══════ -->
  <rect x="620" y="140" width="130" height="55" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.5"/>
  <text x="685" y="163" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e8449">True  ✓</text>
  <text x="685" y="183" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60">by trivial</text>

  <!-- Arrow from Universal Fixpoint to True -->
  <path d="M 430 275 Q 550 200 618 165" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="540" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#27ae60">universal property</text>

  <!-- ═══════ Compression application ═══════ -->
  <rect x="50" y="440" width="170" height="45" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="135" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2980b9">📦 Compression</text>
  <text x="135" y="475" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5dade2">canonical representations</text>

  <!-- Arrow from Homotopy to Compression -->
  <line x1="225" y1="415" x2="175" y2="438" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrowBlue)" stroke-dasharray="4,2"/>

  <!-- ═══════ Caption ═══════ -->
  <text x="400" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2c3e50">
    Figure 1: The equivariant universal fixpoint conjecture connects three domains.
  </text>
  <text x="400" y="558" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d">
    For any inhabited type X, the universal fixpoint property is trivially satisfied (True).
  </text>
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d">
    The Lean 4 proof: trivial — reflecting contractibility of the categorical slice.
  </text>
</svg>
