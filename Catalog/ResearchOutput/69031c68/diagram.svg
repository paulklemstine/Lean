<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-gradient)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Quantum Transfinite Transformation Principle
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    Universal property in the category of inhabited types
  </text>

  <!-- ============================================ -->
  <!-- LEFT: Algorithm Homotopy Space -->
  <!-- ============================================ -->
  <g transform="translate(120, 200)">
    <!-- Outer ellipse: the homotopy space -->
    <ellipse cx="0" cy="0" rx="95" ry="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-135" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb" font-weight="bold">
      Alg(X)
    </text>
    <text x="0" y="-118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">
      Algorithm Homotopy Space
    </text>

    <!-- Points representing algorithms -->
    <circle cx="-30" cy="-60" r="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="-30" y="-72" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">f₁</text>

    <circle cx="40" cy="-30" r="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="40" y="-42" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">f₂</text>

    <circle cx="-20" cy="20" r="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="-20" y="8" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">f₃</text>

    <circle cx="30" cy="50" r="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="30" y="38" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">f₄</text>

    <circle cx="-45" cy="60" r="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="-45" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">f₅</text>

    <!-- Homotopy paths between algorithms -->
    <path d="M -24,-55 Q 10,-50 35,-30" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M -15,18 Q 15,40 25,47" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M -40,56 Q -30,30 -22,24" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Base point (quantum vacuum) -->
    <circle cx="0" cy="85" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <text x="0" y="88" text-anchor="middle" font-family="monospace" font-size="8" fill="white" font-weight="bold">★</text>
    <text x="25" y="92" text-anchor="start" font-family="sans-serif" font-size="9" fill="#dc2626">
      base point
    </text>
    <text x="25" y="104" text-anchor="start" font-family="sans-serif" font-size="8" fill="#dc2626" font-style="italic">
      (Inhabited X)
    </text>
  </g>

  <!-- ============================================ -->
  <!-- CENTER: Transfinite Transformation Arrow -->
  <!-- ============================================ -->
  <g transform="translate(310, 200)">
    <!-- Main transformation arrow -->
    <line x1="0" y1="0" x2="160" y2="0" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>

    <!-- Ordinal steps along the arrow -->
    <circle cx="30" cy="0" r="3" fill="#f59e0b"/>
    <text x="30" y="-10" text-anchor="middle" font-family="monospace" font-size="8" fill="#92400e">α₀</text>

    <circle cx="60" cy="0" r="3" fill="#f59e0b"/>
    <text x="60" y="-10" text-anchor="middle" font-family="monospace" font-size="8" fill="#92400e">α₁</text>

    <circle cx="90" cy="0" r="3" fill="#f59e0b"/>
    <text x="90" y="-10" text-anchor="middle" font-family="monospace" font-size="8" fill="#92400e">α₂</text>

    <text x="115" y="-10" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">⋯</text>

    <circle cx="140" cy="0" r="3" fill="#f59e0b"/>
    <text x="140" y="-10" text-anchor="middle" font-family="monospace" font-size="8" fill="#92400e">ω</text>

    <text x="80" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">
      Transfinite iteration
    </text>
    <text x="80" y="36" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">
      T : Ord → End(Alg(X))
    </text>
  </g>

  <!-- ============================================ -->
  <!-- RIGHT: Terminal Object (True / ⊤) -->
  <!-- ============================================ -->
  <g transform="translate(580, 200)">
    <circle cx="0" cy="0" r="50" fill="#dcfce7" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#16a34a" font-weight="bold">⊤</text>
    <text x="0" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">True</text>

    <text x="0" y="-65" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a" font-weight="bold">
      Prop
    </text>
    <text x="0" y="-50" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">
      Terminal Object
    </text>
  </g>

  <!-- ============================================ -->
  <!-- BOTTOM: Universal Property Diagram -->
  <!-- ============================================ -->
  <g transform="translate(400, 440)">
    <!-- Category diagram: universal property -->
    <rect x="-280" y="-50" width="560" height="130" fill="white" stroke="#cbd5e1" stroke-width="1" rx="8" filter="url(#shadow)"/>

    <text x="0" y="-32" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1e293b" font-weight="bold">
      Universal Property (Commutative Diagram)
    </text>

    <!-- Objects -->
    <!-- Alg(X) on the left -->
    <text x="-180" y="15" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb" font-weight="bold">Alg(X)</text>

    <!-- P in the middle -->
    <text x="0" y="15" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed" font-weight="bold">P</text>
    <text x="0" y="30" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#7c3aed">(any Prop)</text>

    <!-- True on the right -->
    <text x="180" y="15" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a" font-weight="bold">True</text>

    <!-- Arrow: Alg(X) → P (arbitrary morphism) -->
    <line x1="-140" y1="10" x2="-30" y2="10" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
    <text x="-85" y="0" text-anchor="middle" font-family="monospace" font-size="9" fill="#7c3aed">∃ φ</text>

    <!-- Arrow: P → True (unique factoring) -->
    <line x1="30" y1="10" x2="150" y2="10" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)" stroke-dasharray="6,3"/>
    <text x="90" y="0" text-anchor="middle" font-family="monospace" font-size="9" fill="#16a34a">∃! ψ</text>

    <!-- Arrow: Alg(X) → True (the canonical morphism = trivial) -->
    <path d="M -140,25 Q 0,75 150,25" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
    <text x="0" y="67" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc2626" font-weight="bold">trivial</text>
    <text x="0" y="80" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#dc2626" font-style="italic">
      (the unique morphism to terminal object)
    </text>
  </g>

  <!-- ============================================ -->
  <!-- SIDE: Spectral Sequence Notation -->
  <!-- ============================================ -->
  <g transform="translate(680, 120)">
    <rect x="-80" y="-25" width="160" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">E₂^{p,q} ⟹ H^{p+q}</text>
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#92400e">Spectral sequence</text>
    <text x="0" y="22" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#92400e">collapses at E₂ page</text>
  </g>

  <!-- ============================================ -->
  <!-- Lean proof box -->
  <!-- ============================================ -->
  <g transform="translate(100, 420)">
    <rect x="-70" y="-18" width="170" height="50" fill="#1e293b" stroke="#475569" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="15" y="-2" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">-- Lean 4 proof:</text>
    <text x="15" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#4ade80" font-weight="bold">trivial</text>
    <text x="15" y="27" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">-- Q.E.D. ∎</text>
  </g>

  <!-- Caption -->
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
    Fig. 1: The quantum transfinite transformation principle as a universal property in Prop.
  </text>
</svg>
