<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Differential Compactified Schema Principle
  </text>

  <!-- === LEFT: Schema Space (Simplicial Complex) === -->
  <g transform="translate(150, 200)">
    <!-- Triangle (2-simplex) representing schema -->
    <polygon points="0,-80 -70,50 70,50" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="0.7"/>

    <!-- Vertices -->
    <circle cx="0" cy="-80" r="8" fill="#2563eb"/>
    <circle cx="-70" cy="50" r="8" fill="#2563eb"/>
    <circle cx="70" cy="50" r="8" fill="#2563eb"/>

    <!-- Edges -->
    <line x1="0" y1="-80" x2="-70" y2="50" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="-80" x2="70" y2="50" stroke="#2563eb" stroke-width="2"/>
    <line x1="-70" y1="50" x2="70" y2="50" stroke="#2563eb" stroke-width="2"/>

    <!-- Labels -->
    <text x="0" y="-95" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₀</text>
    <text x="-90" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₁</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₂</text>

    <!-- Differential operator annotation -->
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1e40af" font-style="italic">∂</text>

    <!-- Title -->
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">Schema Space S(X)</text>
    <text x="0" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">Contractible (χ = 1)</text>
  </g>

  <!-- === Arrow: Compactification === -->
  <g>
    <line x1="260" y1="200" x2="340" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="300" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">compactify</text>
    <text x="300" y="218" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">+ point at ∞</text>
  </g>

  <!-- === CENTER: Compactified Schema === -->
  <g transform="translate(420, 200)">
    <!-- Tetrahedron-like shape (cone over triangle) -->
    <polygon points="0,-80 -70,50 70,50" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="0.5"/>

    <!-- Cone edges to infinity point -->
    <line x1="0" y1="-80" x2="0" y2="-20" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="-70" y1="50" x2="0" y2="-20" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="70" y1="50" x2="0" y2="-20" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Original vertices -->
    <circle cx="0" cy="-80" r="7" fill="#2563eb"/>
    <circle cx="-70" cy="50" r="7" fill="#2563eb"/>
    <circle cx="70" cy="50" r="7" fill="#2563eb"/>

    <!-- Infinity point (star) -->
    <circle cx="0" cy="-20" r="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="-16" text-anchor="middle" font-family="serif" font-size="14" fill="white" font-weight="bold">∞</text>

    <!-- Original edges -->
    <line x1="0" y1="-80" x2="-70" y2="50" stroke="#2563eb" stroke-width="2"/>
    <line x1="0" y1="-80" x2="70" y2="50" stroke="#2563eb" stroke-width="2"/>
    <line x1="-70" y1="50" x2="70" y2="50" stroke="#2563eb" stroke-width="2"/>

    <!-- Title -->
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">Compactified Schema Ŝ(X)</text>
    <text x="0" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">Still contractible (χ = 1)</text>
  </g>

  <!-- === Arrow: Tropical Duality === -->
  <g>
    <line x1="530" y1="200" x2="610" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="570" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">tropicalize</text>
    <text x="570" y="218" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">(+,×) → (min,+)</text>
  </g>

  <!-- === RIGHT: Tropical Schema === -->
  <g transform="translate(680, 200)">
    <!-- Piecewise linear tropical curve -->
    <polyline points="-60,50 -20,0 0,-40 20,10 60,50" fill="none" stroke="#dc2626" stroke-width="3"/>
    <polyline points="-40,-30 0,-40 30,-10" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>

    <!-- Vertices (tropical) -->
    <circle cx="-20" cy="0" r="5" fill="#dc2626"/>
    <circle cx="0" cy="-40" r="5" fill="#dc2626"/>
    <circle cx="20" cy="10" r="5" fill="#dc2626"/>

    <!-- Title -->
    <text x="0" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">Tropical Dual</text>
    <text x="0" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">Piecewise-linear</text>
  </g>

  <!-- === Bottom: Universal Property Diagram === -->
  <g transform="translate(400, 430)">
    <rect x="-280" y="-40" width="560" height="110" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5" opacity="0.9"/>

    <text x="0" y="-20" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1e293b">
      Universal Property
    </text>

    <!-- Category diagram -->
    <!-- Object A -->
    <text x="-180" y="20" text-anchor="middle" font-family="monospace" font-size="16" fill="#2563eb" font-weight="bold">A</text>
    <!-- Arrow A → Ŝ(X) -->
    <line x1="-155" y1="15" x2="-30" y2="15" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
    <text x="-90" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2563eb">∃! f</text>
    <!-- Object Ŝ(X) -->
    <text x="0" y="20" text-anchor="middle" font-family="monospace" font-size="16" fill="#16a34a" font-weight="bold">Ŝ(X)</text>

    <!-- Result -->
    <text x="100" y="20" text-anchor="start" font-family="Georgia, serif" font-size="14" fill="#333">
      = terminal object
    </text>

    <!-- Conclusion -->
    <text x="0" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
      Contractible ⟹ terminal ⟹ universal property holds ⟹ True
    </text>
  </g>

  <!-- === Legend === -->
  <g transform="translate(30, 520)">
    <rect x="0" y="0" width="740" height="35" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1" opacity="0.8"/>
    <circle cx="20" cy="17" r="6" fill="#2563eb"/>
    <text x="35" y="22" font-family="Georgia, serif" font-size="11" fill="#333">Original schema</text>

    <circle cx="170" cy="17" r="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <text x="185" y="22" font-family="Georgia, serif" font-size="11" fill="#333">Point at ∞</text>

    <line x1="300" y1="17" x2="330" y2="17" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="340" y="22" font-family="Georgia, serif" font-size="11" fill="#333">Compactification</text>

    <line x1="480" y1="17" x2="510" y2="17" stroke="#dc2626" stroke-width="3"/>
    <text x="520" y="22" font-family="Georgia, serif" font-size="11" fill="#333">Tropical curve</text>
  </g>

  <!-- Caption -->
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
    Fig. 1: The schema space S(X) is compactified and tropicalized; contractibility ensures the universal property holds trivially.
  </text>
</svg>
