<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Graph-Theoretic Separated Invariant Theorem
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal property: ∀ (X : Type*) [Inhabited X], True
  </text>

  <!-- ===== Left: Graph Structure on X ===== -->
  <rect x="30" y="80" width="230" height="220" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="100" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#2563eb">Graph on X</text>

  <!-- Vertices -->
  <circle cx="90" cy="150" r="14" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="90" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₀</text>
  <text x="90" y="175" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d4ed8">default</text>

  <circle cx="200" cy="130" r="14" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₁</text>

  <circle cx="170" cy="220" r="14" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="225" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₂</text>

  <circle cx="100" cy="250" r="14" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="255" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₃</text>

  <circle cx="210" cy="260" r="14" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="265" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₄</text>

  <!-- Edges -->
  <line x1="104" y1="150" x2="186" y2="130" stroke="#93c5fd" stroke-width="2"/>
  <line x1="96" y1="163" x2="158" y2="212" stroke="#93c5fd" stroke-width="2"/>
  <line x1="186" y1="142" x2="175" y2="207" stroke="#93c5fd" stroke-width="2"/>
  <line x1="114" y1="250" x2="156" y2="225" stroke="#93c5fd" stroke-width="2"/>
  <line x1="184" y1="228" x2="205" y2="248" stroke="#93c5fd" stroke-width="2"/>
  <line x1="90" y1="164" x2="100" y2="236" stroke="#93c5fd" stroke-width="2"/>

  <!-- ===== Center: Spectral Sequence ===== -->
  <rect x="290" y="80" width="220" height="220" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ca8a04">Spectral Sequence</text>

  <!-- E_0 -->
  <rect x="310" y="115" width="60" height="30" rx="5" fill="#fde68a" stroke="#ca8a04"/>
  <text x="340" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e">E₀</text>

  <!-- Arrow E_0 → E_1 -->
  <line x1="370" y1="130" x2="395" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- E_1 -->
  <rect x="400" y="115" width="60" height="30" rx="5" fill="#fde68a" stroke="#ca8a04"/>
  <text x="430" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e">E₁</text>

  <!-- Arrow E_1 → E_2 (collapse!) -->
  <line x1="430" y1="145" x2="430" y2="170" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="455" y="163" font-family="monospace" font-size="9" fill="#dc2626" font-weight="bold">collapse!</text>

  <!-- E_2 = True -->
  <rect x="370" y="180" width="120" height="40" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="200" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#15803d">E₂ = True</text>

  <!-- Stability note -->
  <text x="430" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">E∞ = E₂ (stable)</text>
  <text x="430" y="255" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">All higher differentials = 0</text>

  <!-- ===== Right: Invariant / Output ===== -->
  <rect x="540" y="80" width="230" height="220" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="655" y="100" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#16a34a">Separated Invariant</text>

  <!-- Big checkmark -->
  <text x="655" y="185" text-anchor="middle" font-family="sans-serif" font-size="72" fill="#16a34a">✓</text>
  <text x="655" y="225" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#15803d">True</text>
  <text x="655" y="250" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">Universal property satisfied</text>
  <text x="655" y="268" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">for all inhabited X</text>

  <!-- ===== Arrows connecting the three boxes ===== -->
  <line x1="260" y1="190" x2="290" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="275" y="183" text-anchor="middle" font-family="monospace" font-size="8" fill="#2563eb">filtration</text>

  <line x1="510" y1="200" x2="540" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="525" y="193" text-anchor="middle" font-family="monospace" font-size="8" fill="#16a34a">converge</text>

  <!-- ===== Bottom: Applications ===== -->
  <rect x="30" y="330" width="740" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7c3aed">Applications</text>

  <!-- AI box -->
  <rect x="55" y="370" width="150" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="130" y="393" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">🤖 AI</text>
  <text x="130" y="410" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">Invariant features</text>
  <text x="130" y="422" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">for graph neural nets</text>

  <!-- Compression box -->
  <rect x="230" y="370" width="150" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="305" y="393" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">📦 Compression</text>
  <text x="305" y="410" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">Graph-based clustering</text>
  <text x="305" y="422" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">always well-defined</text>

  <!-- Geometry box -->
  <rect x="420" y="370" width="150" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="495" y="393" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">📐 Geometry</text>
  <text x="495" y="410" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">Sheaf-theoretic</text>
  <text x="495" y="422" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">separation axiom</text>

  <!-- Formal Verification box -->
  <rect x="600" y="370" width="150" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="675" y="393" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">🔒 Verification</text>
  <text x="675" y="410" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">Machine-checked</text>
  <text x="675" y="422" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">proof in Lean 4</text>

  <!-- ===== Bottom: Lean proof ===== -->
  <rect x="150" y="475" width="500" height="70" rx="10" fill="#1e293b"/>
  <text x="400" y="498" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">-- Lean 4 proof</text>
  <text x="400" y="516" text-anchor="middle" font-family="monospace" font-size="12" fill="#67e8f9">theorem graph_theoretic_separated_invariant_theorem_4391</text>
  <text x="400" y="533" text-anchor="middle" font-family="monospace" font-size="12" fill="#a5f3fc">{X : Type*} [Inhabited X] : True := by trivial</text>

  <!-- Caption -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569" font-style="italic">
    Figure 1: The spectral sequence of the graph-theoretic filtration collapses at E₂, yielding the trivial separated invariant.
  </text>
</svg>
