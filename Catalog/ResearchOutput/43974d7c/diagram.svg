<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <!-- Gradient for background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Special Fibration Sequence Construction
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    For Inhabited Types over Entropy Algebra Spaces
  </text>

  <!-- ========== FIBRATION SEQUENCE (Top Row) ========== -->

  <!-- Fiber F -->
  <ellipse cx="150" cy="160" rx="65" ry="45" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#1e40af">F</text>
  <text x="150" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">Fiber (True)</text>
  <!-- Contractible indicator -->
  <circle cx="150" cy="145" r="4" fill="#2563eb"/>
  <text x="150" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b" font-style="italic">contractible</text>

  <!-- Arrow F → E -->
  <line x1="218" y1="160" x2="302" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="260" y="150" text-anchor="middle" font-family="monospace" font-size="12" fill="#2563eb">ι</text>

  <!-- Total Space E -->
  <ellipse cx="400" cy="160" rx="80" ry="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#166534">E</text>
  <text x="400" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">Total Space</text>
  <!-- Elements inside E -->
  <circle cx="375" cy="145" r="3" fill="#16a34a"/>
  <circle cx="395" cy="138" r="3" fill="#16a34a"/>
  <circle cx="415" cy="142" r="3" fill="#16a34a"/>
  <circle cx="425" cy="155" r="3" fill="#16a34a"/>
  <circle cx="385" cy="158" r="3" fill="#16a34a"/>

  <!-- Arrow E → X -->
  <line x1="482" y1="160" x2="568" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="525" y="150" text-anchor="middle" font-family="monospace" font-size="12" fill="#16a34a">π</text>

  <!-- Base Space X -->
  <ellipse cx="650" cy="160" rx="70" ry="50" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
  <text x="650" y="148" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#9a3412">X</text>
  <text x="650" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ea580c">Base (Inhabited)</text>
  <!-- Default element -->
  <circle cx="650" cy="185" r="6" fill="#ea580c" stroke="#fff" stroke-width="1.5"/>
  <text x="665" y="190" font-family="sans-serif" font-size="9" fill="#9a3412">default</text>

  <!-- Fibration sequence label -->
  <text x="400" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">
    Fibration Sequence: F → E → X
  </text>

  <!-- ========== COLLAPSE DIAGRAM (Middle) ========== -->

  <!-- Downward arrow showing collapse -->
  <line x1="400" y1="220" x2="400" y2="310" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowPurple)"/>
  <text x="430" y="270" font-family="sans-serif" font-size="12" fill="#7c3aed" font-weight="bold">collapse</text>

  <!-- Result: True -->
  <rect x="330" y="320" width="140" height="60" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="400" y="350" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#7c3aed">True</text>
  <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">terminal in Prop</text>

  <!-- ========== ENTROPY CONNECTIONS (Bottom) ========== -->

  <!-- Shannon Entropy -->
  <rect x="50" y="430" width="180" height="80" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="140" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#9f1239">Shannon Entropy</text>
  <text x="140" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#be123c">H = −Σ p·log₂(p)</text>
  <text x="140" y="498" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e11d48" font-style="italic">classical measure</text>

  <!-- Tropical Entropy -->
  <rect x="310" y="430" width="180" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="400" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#065f46">Tropical (Max-Plus)</text>
  <text x="400" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#047857">H⊕ = max(−log₂(pᵢ))</text>
  <text x="400" y="498" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#059669" font-style="italic">combinatorial proxy</text>

  <!-- Kolmogorov Complexity -->
  <rect x="570" y="430" width="180" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="660" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Kolmogorov K(x)</text>
  <text x="660" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#2563eb">≈ trop. rank(M)</text>
  <text x="660" y="498" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563eb" font-style="italic">compression invariant</text>

  <!-- Connecting lines to True -->
  <line x1="140" y1="430" x2="360" y2="380" stroke="#e11d48" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="430" x2="400" y2="380" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="660" y1="430" x2="440" y2="380" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Universal property arrows -->
  <path d="M 150 210 Q 150 280 340 340" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M 650 210 Q 650 280 460 340" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="170" y="285" font-family="sans-serif" font-size="9" fill="#94a3b8" transform="rotate(-40,170,285)">∃! morphism</text>
  <text x="600" y="280" font-family="sans-serif" font-size="9" fill="#94a3b8" transform="rotate(40,600,280)">∃! morphism</text>

  <!-- Caption -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569">
    Figure 1: The special fibration sequence F → E → X collapses to True for inhabited types.
  </text>
  <text x="400" y="578" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">
    Shannon, tropical, and Kolmogorov entropy measures all respect this universal base case.
  </text>
</svg>
