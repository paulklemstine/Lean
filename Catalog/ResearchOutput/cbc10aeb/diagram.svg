<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="bundleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Derived Hyperbolic Bundle Formula (ef46)
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Trivialization of the Entanglement Bundle via Inhabited Basepoint
  </text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT SIDE: The Bundle Structure                     -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Base space (entanglement information space) -->
  <ellipse cx="200" cy="450" rx="140" ry="40" fill="url(#baseGrad)" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="455" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">
    Entanglement Space E(X)
  </text>

  <!-- Bundle total space -->
  <rect x="60" y="140" width="280" height="220" rx="12" fill="url(#bundleGrad)" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="200" y="165" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1e40af">
    Hyperbolic Bundle H(X)
  </text>

  <!-- Fibers (vertical lines from base to bundle) -->
  <line x1="120" y1="410" x2="120" y2="180" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="200" y1="410" x2="200" y2="180" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="280" y1="410" x2="280" y2="180" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Fiber labels -->
  <text x="115" y="295" text-anchor="end" font-family="monospace" font-size="9" fill="#3b82f6" transform="rotate(-90, 115, 295)">fiber</text>
  <text x="195" y="295" text-anchor="end" font-family="monospace" font-size="9" fill="#3b82f6" transform="rotate(-90, 195, 295)">fiber</text>
  <text x="275" y="295" text-anchor="end" font-family="monospace" font-size="9" fill="#3b82f6" transform="rotate(-90, 275, 295)">fiber</text>

  <!-- Points in fibers -->
  <circle cx="120" cy="220" r="4" fill="#3b82f6"/>
  <circle cx="120" cy="260" r="4" fill="#3b82f6"/>
  <circle cx="120" cy="310" r="4" fill="#3b82f6"/>
  <circle cx="200" cy="230" r="4" fill="#3b82f6"/>
  <circle cx="200" cy="280" r="4" fill="#3b82f6"/>
  <circle cx="200" cy="340" r="4" fill="#3b82f6"/>
  <circle cx="280" cy="210" r="4" fill="#3b82f6"/>
  <circle cx="280" cy="270" r="4" fill="#3b82f6"/>
  <circle cx="280" cy="320" r="4" fill="#3b82f6"/>

  <!-- Canonical section (red curve through bundle) -->
  <path d="M 80,280 C 130,250 170,270 200,260 C 230,250 270,240 320,260"
        fill="none" stroke="#dc2626" stroke-width="3"/>
  <!-- Section points -->
  <circle cx="120" cy="265" r="6" fill="#dc2626" stroke="white" stroke-width="2"/>
  <circle cx="200" cy="260" r="6" fill="#dc2626" stroke="white" stroke-width="2"/>
  <circle cx="280" cy="248" r="6" fill="#dc2626" stroke="white" stroke-width="2"/>
  <text x="330" y="265" font-family="monospace" font-size="10" font-weight="bold" fill="#dc2626">
    s₀ (canonical
  </text>
  <text x="330" y="278" font-family="monospace" font-size="10" font-weight="bold" fill="#dc2626">
    section)
  </text>

  <!-- Projection arrow -->
  <line x1="200" y1="370" x2="200" y2="405" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="218" y="393" font-family="monospace" font-size="10" fill="#333">π</text>

  <!-- Basepoint in base space -->
  <circle cx="200" cy="445" r="6" fill="#dc2626" stroke="white" stroke-width="2"/>
  <text x="200" y="480" text-anchor="middle" font-family="monospace" font-size="9" fill="#dc2626">
    default ∈ X (Inhabited)
  </text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RIGHT SIDE: The Trivialization                      -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Isomorphism arrow -->
  <line x1="370" y1="290" x2="440" y2="290" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="405" y="280" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#16a34a">≃</text>
  <text x="405" y="310" text-anchor="middle" font-family="monospace" font-size="9" fill="#16a34a">trivial</text>

  <!-- Trivial bundle (product space) -->
  <rect x="460" y="140" width="280" height="220" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="165" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#166534">
    E(X) × F  (trivial bundle)
  </text>

  <!-- Grid lines in trivial bundle -->
  <line x1="480" y1="180" x2="480" y2="350" stroke="#86efac" stroke-width="1"/>
  <line x1="520" y1="180" x2="520" y2="350" stroke="#86efac" stroke-width="1"/>
  <line x1="560" y1="180" x2="560" y2="350" stroke="#86efac" stroke-width="1"/>
  <line x1="600" y1="180" x2="600" y2="350" stroke="#86efac" stroke-width="1"/>
  <line x1="640" y1="180" x2="640" y2="350" stroke="#86efac" stroke-width="1"/>
  <line x1="680" y1="180" x2="680" y2="350" stroke="#86efac" stroke-width="1"/>
  <line x1="720" y1="180" x2="720" y2="350" stroke="#86efac" stroke-width="1"/>

  <line x1="480" y1="200" x2="720" y2="200" stroke="#86efac" stroke-width="1"/>
  <line x1="480" y1="230" x2="720" y2="230" stroke="#86efac" stroke-width="1"/>
  <line x1="480" y1="260" x2="720" y2="260" stroke="#86efac" stroke-width="1"/>
  <line x1="480" y1="290" x2="720" y2="290" stroke="#86efac" stroke-width="1"/>
  <line x1="480" y1="320" x2="720" y2="320" stroke="#86efac" stroke-width="1"/>

  <!-- Product structure labels -->
  <text x="600" y="345" text-anchor="middle" font-family="monospace" font-size="9" fill="#166534">
    base × fiber = product
  </text>

  <!-- Trivial base space -->
  <ellipse cx="600" cy="450" rx="140" ry="40" fill="url(#baseGrad)" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="455" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">
    E(X)
  </text>

  <!-- Projection from trivial bundle -->
  <line x1="600" y1="370" x2="600" y2="405" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="618" y="393" font-family="monospace" font-size="10" fill="#333">pr₁</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- BOTTOM: Proof Summary                               -->
  <!-- ═══════════════════════════════════════════════════ -->

  <rect x="100" y="510" width="600" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <text x="400" y="532" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#334155">
    Proof: Inhabited X  →  ∃ default : X  →  global section s₀  →  bundle trivial  →  True
  </text>
  <text x="400" y="552" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">
    The inhabitedness witness provides a canonical basepoint, trivializing the derived bundle.
  </text>
  <text x="400" y="568" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#94a3b8">
    "Every inhabited entanglement space carries a trivial hyperbolic bundle." — ef46
  </text>

  <!-- Legend -->
  <rect x="15" y="85" width="180" height="45" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="25" y1="102" x2="55" y2="102" stroke="#dc2626" stroke-width="3"/>
  <text x="60" y="106" font-family="monospace" font-size="9" fill="#333">Canonical section s₀</text>
  <circle cx="40" cy="120" r="4" fill="#3b82f6"/>
  <text x="60" y="124" font-family="monospace" font-size="9" fill="#333">Bundle fiber points</text>
</svg>
