<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Tropical Canonical Dimension Construction
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal property for inhabited types via tropical structures
  </text>

  <!-- ========== Inhabited Type X (top-left) ========== -->
  <rect x="40" y="80" width="200" height="120" rx="12" fill="url(#logicGrad)" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">
    Type X
  </text>
  <text x="140" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">
    [Inhabited X]
  </text>
  <!-- Elements inside -->
  <circle cx="90" cy="165" r="8" fill="#3b82f6" opacity="0.7"/>
  <text x="90" y="169" text-anchor="middle" font-family="monospace" font-size="9" fill="white">x₀</text>
  <circle cx="120" cy="160" r="8" fill="#3b82f6" opacity="0.5"/>
  <text x="120" y="164" text-anchor="middle" font-family="monospace" font-size="9" fill="white">x₁</text>
  <circle cx="150" cy="170" r="8" fill="#3b82f6" opacity="0.5"/>
  <text x="150" y="174" text-anchor="middle" font-family="monospace" font-size="9" fill="white">x₂</text>
  <circle cx="185" cy="162" r="6" fill="#3b82f6" opacity="0.3"/>
  <text x="200" y="175" font-family="sans-serif" font-size="10" fill="#64748b">⋯</text>

  <!-- ========== Tropical Semiring (top-right) ========== -->
  <rect x="560" y="80" width="200" height="120" rx="12" fill="url(#tropGrad)" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="110" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">
    (T, ⊕, ⊗)
  </text>
  <text x="660" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">
    Tropical Semiring
  </text>
  <text x="660" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#78350f">
    a ⊕ b = min(a, b)
  </text>
  <text x="660" y="172" text-anchor="middle" font-family="monospace" font-size="10" fill="#78350f">
    a ⊗ b = a + b
  </text>
  <text x="660" y="189" text-anchor="middle" font-family="monospace" font-size="10" fill="#78350f">
    T = ℝ ∪ {+∞}
  </text>

  <!-- ========== Arrow: X → Tropical structure ========== -->
  <path d="M 240 140 C 330 100, 450 100, 560 140" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333" font-style="italic">
    Tropicalization functor
  </text>

  <!-- ========== Logic Probability Space (middle-left) ========== -->
  <rect x="40" y="260" width="200" height="130" rx="12" fill="url(#logicGrad)" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="290" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1e40af">
    (X, ℱ, μ)
  </text>
  <text x="140" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">
    Logic Probability Space
  </text>
  <!-- Boolean algebra diagram -->
  <circle cx="140" cy="340" r="4" fill="#2563eb"/>
  <circle cx="110" cy="360" r="4" fill="#2563eb"/>
  <circle cx="170" cy="360" r="4" fill="#2563eb"/>
  <circle cx="140" cy="380" r="4" fill="#2563eb"/>
  <line x1="140" y1="340" x2="110" y2="360" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="140" y1="340" x2="170" y2="360" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="110" y1="360" x2="140" y2="380" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="170" y1="360" x2="140" y2="380" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="155" y="343" font-family="monospace" font-size="8" fill="#1e40af">⊤</text>
  <text x="90" y="363" font-family="monospace" font-size="8" fill="#1e40af">p</text>
  <text x="180" y="363" font-family="monospace" font-size="8" fill="#1e40af">q</text>
  <text x="155" y="383" font-family="monospace" font-size="8" fill="#1e40af">⊥</text>

  <!-- ========== Canonical Dimension (middle-right) ========== -->
  <rect x="560" y="260" width="200" height="130" rx="12" fill="url(#dimGrad)" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="290" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#166534">
    dim_τ(X) ∈ ℕ
  </text>
  <text x="660" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">
    Canonical Dimension
  </text>
  <text x="660" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d">
    Universal property:
  </text>
  <text x="660" y="358" text-anchor="middle" font-family="monospace" font-size="10" fill="#15803d">
    ∀ d-chart, d ≥ dim_τ(X)
  </text>
  <text x="660" y="378" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d">
    Minimal tropical embedding
  </text>

  <!-- ========== Arrow: Logic Space → Canonical Dimension ========== -->
  <path d="M 240 325 L 555 325" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="400" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a" font-style="italic">
    Canonical dimension map
  </text>

  <!-- ========== Arrow: X → Logic Space ========== -->
  <path d="M 140 200 L 140 255" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="100" y="232" font-family="sans-serif" font-size="10" fill="#2563eb" font-style="italic">
    σ-algebra
  </text>

  <!-- ========== Arrow: Tropical → Dimension ========== -->
  <path d="M 660 200 L 660 255" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="720" y="232" font-family="sans-serif" font-size="10" fill="#b45309" font-style="italic">
    min-rank
  </text>

  <!-- ========== Yoneda Equivalence (bottom center) ========== -->
  <rect x="250" y="440" width="300" height="100" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="400" y="470" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#6b21a8">
    Yoneda Lemma
  </text>
  <text x="400" y="492" text-anchor="middle" font-family="monospace" font-size="11" fill="#7c3aed">
    Nat(Hom(−,A), F) ≅ F(A)
  </text>
  <text x="400" y="515" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">
    Establishes equivalence to classical construction
  </text>

  <!-- ========== Arrows to Yoneda ========== -->
  <path d="M 140 390 C 140 430, 280 450, 250 480" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <path d="M 660 390 C 660 430, 520 450, 550 480" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- ========== Central result box ========== -->
  <rect x="280" y="350" width="240" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="372" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#991b1b">
    ∀ X [Inhabited X], True
  </text>
  <text x="400" y="390" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b91c1c">
    Construction is universally valid ✓
  </text>

  <!-- Connecting arrows to central result -->
  <path d="M 240 350 L 278 370" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <path d="M 560 350 L 522 370" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>

  <!-- ========== Caption ========== -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    Figure 1: The tropical canonical dimension construction connects inhabited types to their canonical dimension
  </text>
  <text x="400" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    via logic probability spaces and tropical structures, with categorical equivalence established by the Yoneda lemma.
  </text>
</svg>
