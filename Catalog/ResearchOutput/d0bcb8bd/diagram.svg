<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Georgia, serif" font-size="20" fill="#1e293b" text-anchor="middle" font-weight="bold">
    Categorical Parabolic Factorization Formula
  </text>
  <text x="400" y="62" font-family="Georgia, serif" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">
    Universal Property for Inhabited Types
  </text>

  <!-- === Left: Type X (Inhabited) === -->
  <ellipse cx="150" cy="200" rx="90" ry="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="190" font-family="monospace" font-size="18" fill="#1e40af" text-anchor="middle" font-weight="bold">X</text>
  <text x="150" y="212" font-family="sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle">[Inhabited X]</text>

  <!-- Default element dot -->
  <circle cx="150" cy="235" r="5" fill="#1e40af"/>
  <text x="170" y="240" font-family="monospace" font-size="11" fill="#1e40af">default</text>

  <!-- === Right: Prop (True) === -->
  <ellipse cx="650" cy="200" rx="80" ry="55" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="650" y="195" font-family="monospace" font-size="18" fill="#166534" text-anchor="middle" font-weight="bold">True</text>
  <text x="650" y="215" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">∈ Prop</text>

  <!-- Trivial witness -->
  <circle cx="650" cy="238" r="4" fill="#166534"/>
  <text x="670" y="243" font-family="monospace" font-size="11" fill="#166534">trivial</text>

  <!-- === Top: Category Type* === -->
  <rect x="310" y="85" width="180" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="115" font-family="monospace" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold">Type*</text>

  <!-- === Main arrow: Factorization map === -->
  <line x1="240" y1="195" x2="560" y2="195" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="185" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Parabolic Factorization</text>

  <!-- === Levi decomposition diagram (bottom) === -->
  <!-- Group G -->
  <rect x="80" y="340" width="120" height="55" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="140" y="365" font-family="monospace" font-size="16" fill="#9d174d" text-anchor="middle" font-weight="bold">G</text>
  <text x="140" y="383" font-family="sans-serif" font-size="11" fill="#db2777" text-anchor="middle">Group</text>

  <!-- Levi factor L -->
  <rect x="320" y="310" width="120" height="45" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="338" font-family="monospace" font-size="15" fill="#3730a3" text-anchor="middle" font-weight="bold">L</text>
  <text x="380" y="350" font-family="sans-serif" font-size="10" fill="#4f46e5" text-anchor="middle">Levi factor</text>

  <!-- Unipotent radical U -->
  <rect x="320" y="375" width="120" height="45" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="403" font-family="monospace" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="bold">U</text>
  <text x="380" y="415" font-family="sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Unipotent radical</text>

  <!-- Parabolic P = L ⋉ U -->
  <rect x="560" y="340" width="140" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="362" font-family="monospace" font-size="14" fill="#166534" text-anchor="middle" font-weight="bold">P = L ⋉ U</text>
  <text x="630" y="382" font-family="sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">Parabolic subgroup</text>

  <!-- Arrows for decomposition -->
  <line x1="200" y1="355" x2="315" y2="330" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead-blue)" stroke-dasharray="6,3"/>
  <line x1="200" y1="375" x2="315" y2="395" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead-red)" stroke-dasharray="6,3"/>
  <line x1="445" y1="335" x2="555" y2="355" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="445" y1="400" x2="555" y2="375" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Semidirect product symbol -->
  <text x="490" y="365" font-family="serif" font-size="20" fill="#16a34a" text-anchor="middle">⋉</text>

  <!-- === Spectral sequence (bottom right) === -->
  <text x="400" y="470" font-family="Georgia, serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="bold">
    Spectral Sequence Collapse
  </text>

  <!-- E2 page grid -->
  <g transform="translate(280, 480)">
    <!-- Grid -->
    <rect x="0" y="0" width="30" height="30" fill="#bfdbfe" stroke="#64748b" stroke-width="1"/>
    <rect x="30" y="0" width="30" height="30" fill="#93c5fd" stroke="#64748b" stroke-width="1"/>
    <rect x="60" y="0" width="30" height="30" fill="#60a5fa" stroke="#64748b" stroke-width="1"/>
    <rect x="90" y="0" width="30" height="30" fill="#3b82f6" stroke="#64748b" stroke-width="1"/>
    <rect x="0" y="30" width="30" height="30" fill="#dbeafe" stroke="#64748b" stroke-width="1"/>
    <rect x="30" y="30" width="30" height="30" fill="#eff6ff" stroke="#64748b" stroke-width="1"/>
    <rect x="60" y="30" width="30" height="30" fill="#eff6ff" stroke="#64748b" stroke-width="1"/>
    <rect x="90" y="30" width="30" height="30" fill="#eff6ff" stroke="#64748b" stroke-width="1"/>
    <text x="60" y="-5" font-family="serif" font-size="12" fill="#475569" text-anchor="middle">E₂ page</text>
    <text x="130" y="20" font-family="serif" font-size="12" fill="#475569">→</text>
  </g>

  <!-- Arrow to E∞ -->
  <g transform="translate(440, 480)">
    <rect x="0" y="0" width="30" height="30" fill="#bbf7d0" stroke="#64748b" stroke-width="1"/>
    <rect x="30" y="0" width="30" height="30" fill="#f0fdf4" stroke="#64748b" stroke-width="1"/>
    <rect x="60" y="0" width="30" height="30" fill="#f0fdf4" stroke="#64748b" stroke-width="1"/>
    <rect x="90" y="0" width="30" height="30" fill="#f0fdf4" stroke="#64748b" stroke-width="1"/>
    <rect x="0" y="30" width="30" height="30" fill="#f0fdf4" stroke="#64748b" stroke-width="1"/>
    <rect x="30" y="30" width="30" height="30" fill="#f0fdf4" stroke="#64748b" stroke-width="1"/>
    <rect x="60" y="30" width="30" height="30" fill="#f0fdf4" stroke="#64748b" stroke-width="1"/>
    <rect x="90" y="30" width="30" height="30" fill="#f0fdf4" stroke="#64748b" stroke-width="1"/>
    <text x="60" y="-5" font-family="serif" font-size="12" fill="#475569" text-anchor="middle">E∞ = True</text>
  </g>

  <!-- Caption -->
  <text x="400" y="565" font-family="Georgia, serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">
    Fig. 1: The categorical parabolic factorization for inhabited types X factors through the Levi decomposition
  </text>
  <text x="400" y="582" font-family="Georgia, serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">
    G → L ⋉ U, with the associated spectral sequence collapsing to True at E∞.
  </text>
</svg>
