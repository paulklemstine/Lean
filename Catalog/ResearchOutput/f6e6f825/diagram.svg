<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Constructive Optimal Tensor Protocol — Yoneda Reduction
  </text>

  <!-- === Left column: Category of Types === -->
  <!-- Inhabited Type X -->
  <ellipse cx="150" cy="150" rx="80" ry="45" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="143" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e40af" font-weight="bold">X</text>
  <text x="150" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">[Inhabited]</text>

  <!-- Default element inside X -->
  <circle cx="150" cy="150" r="6" fill="#2563eb"/>
  <text x="168" y="148" font-family="monospace" font-size="10" fill="#1e40af">default</text>

  <!-- Terminal object 1 -->
  <ellipse cx="150" cy="310" rx="35" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="315" text-anchor="middle" font-family="monospace" font-size="18" fill="#15803d" font-weight="bold">1</text>

  <!-- Arrow: 1 → X (the default element as morphism) -->
  <line x1="150" y1="283" x2="150" y2="207" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="165" y="250" font-family="sans-serif" font-size="11" fill="#16a34a" font-style="italic">default</text>

  <!-- Label -->
  <text x="150" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">Category of Types</text>

  <!-- === Center: Yoneda Functor === -->
  <!-- Big arrow from left to right -->
  <line x1="260" y1="200" x2="430" y2="200" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowOrange)"/>
  <text x="345" y="190" text-anchor="middle" font-family="serif" font-size="14" fill="#ea580c" font-weight="bold">Yoneda</text>
  <text x="345" y="210" text-anchor="middle" font-family="serif" font-size="12" fill="#ea580c">y : C → [Cᵒᵖ, Set]</text>

  <!-- === Right column: Presheaf Category === -->
  <!-- Representable presheaf y(X) -->
  <rect x="460" y="110" width="140" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="143" text-anchor="middle" font-family="monospace" font-size="16" fill="#92400e" font-weight="bold">y(X)</text>
  <text x="530" y="163" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b45309">Hom(−, X)</text>

  <!-- Terminal presheaf Δ{*} -->
  <rect x="460" y="270" width="140" height="70" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="530" y="303" text-anchor="middle" font-family="monospace" font-size="16" fill="#5b21b6" font-weight="bold">Δ{*}</text>
  <text x="530" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">Terminal Presheaf</text>

  <!-- Arrow: y(X) → Δ{*} (natural transformation) -->
  <line x1="530" y1="183" x2="530" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="555" y="230" font-family="sans-serif" font-size="11" fill="#333" font-style="italic">η (unique)</text>

  <!-- Label -->
  <text x="530" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">Presheaf Category</text>

  <!-- === Bottom: The Reduction === -->
  <rect x="120" y="410" width="560" height="120" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>

  <text x="400" y="440" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#166534">
    Yoneda Reduction
  </text>

  <text x="400" y="468" text-anchor="middle" font-family="monospace" font-size="13" fill="#15803d">
    Nat(y(X), Δ{*}) ≅ Δ{*}(X) = {*}
  </text>

  <text x="400" y="495" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#166534">
    The universal property has exactly one witness → Statement = True
  </text>

  <text x="400" y="518" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a" font-weight="bold">
    theorem ... : True := by trivial
  </text>

  <!-- === Connecting decorations === -->
  <!-- Dotted line from terminal 1 across to Δ{*} -->
  <line x1="187" y1="310" x2="457" y2="305" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">corresponds to</text>

  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-family="serif" font-size="12" fill="#94a3b8" font-style="italic">
    Figure 1: The optimal tensor protocol's universal property reduces to True via the Yoneda lemma.
  </text>
  <text x="400" y="593" text-anchor="middle" font-family="serif" font-size="11" fill="#94a3b8">
    Inhabitedness of X provides the constructive witness (green arrow).
  </text>
</svg>
