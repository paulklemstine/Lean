<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">
    Information-Theoretic Recursive Hamiltonian Scheme (de76)
  </text>
  <text x="400" y="60" font-family="Georgia, serif" font-size="13" fill="#64748b" text-anchor="middle">
    Universal Property: ∀ (X : Type*) [Inhabited X], True
  </text>

  <!-- === Layer 1: Inhabited Types (left) === -->
  <rect x="40" y="100" width="200" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Inhabited Types</text>

  <!-- Type circles -->
  <circle cx="90" cy="170" r="25" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="175" font-family="monospace" font-size="12" fill="#1e3a5f" text-anchor="middle">X₁</text>
  <circle cx="90" cy="170" r="4" fill="#1e40af"/>
  <text x="90" y="155" font-family="sans-serif" font-size="8" fill="#1e40af" text-anchor="middle">default</text>

  <circle cx="170" cy="170" r="25" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="175" font-family="monospace" font-size="12" fill="#1e3a5f" text-anchor="middle">X₂</text>
  <circle cx="170" cy="170" r="4" fill="#1e40af"/>

  <circle cx="130" cy="240" r="25" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="245" font-family="monospace" font-size="12" fill="#1e3a5f" text-anchor="middle">X₃</text>
  <circle cx="130" cy="240" r="4" fill="#1e40af"/>

  <text x="140" y="270" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">• = distinguished element</text>

  <!-- === Layer 2: Recursive Hamiltonian (center) === -->
  <rect x="290" y="100" width="220" height="180" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">Recursive Hamiltonian</text>

  <!-- Hamiltonian flow arrows (spiral) -->
  <path d="M 340 170 Q 360 140 400 150 Q 440 160 430 190 Q 420 220 380 215 Q 350 210 355 185 Q 360 170 380 175" 
        fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="380" cy="195" r="8" fill="#ea580c" opacity="0.3"/>
  <circle cx="380" cy="195" r="3" fill="#ea580c"/>
  <text x="380" y="225" font-family="sans-serif" font-size="10" fill="#c2410c" text-anchor="middle">fixed point</text>

  <!-- Equation -->
  <text x="400" y="255" font-family="monospace" font-size="11" fill="#92400e" text-anchor="middle">x(n+1) = x(n)·(1 - x(n))</text>
  <text x="400" y="270" font-family="sans-serif" font-size="10" fill="#92400e" text-anchor="middle">converges → 0 (trivial)</text>

  <!-- === Layer 3: Terminal Object True (right) === -->
  <rect x="560" y="100" width="200" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">Prop (Category)</text>

  <!-- True as terminal -->
  <circle cx="660" cy="185" r="35" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="660" y="182" font-family="monospace" font-size="18" font-weight="bold" fill="#166534" text-anchor="middle">True</text>
  <text x="660" y="198" font-family="sans-serif" font-size="9" fill="#166534" text-anchor="middle">terminal object</text>

  <!-- Small prop nodes -->
  <circle cx="600" cy="250" r="12" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
  <text x="600" y="254" font-family="monospace" font-size="8" fill="#166534" text-anchor="middle">P</text>
  <circle cx="660" cy="260" r="12" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
  <text x="660" y="264" font-family="monospace" font-size="8" fill="#166534" text-anchor="middle">Q</text>
  <circle cx="720" cy="250" r="12" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
  <text x="720" y="254" font-family="monospace" font-size="8" fill="#166534" text-anchor="middle">R</text>

  <!-- Morphisms to True -->
  <line x1="600" y1="240" x2="645" y2="210" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="660" y1="248" x2="660" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="720" y1="240" x2="675" y2="210" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="660" y="280" font-family="sans-serif" font-size="9" fill="#475569" text-anchor="middle">∀ P, ∃! (P → True)</text>

  <!-- === Connecting Arrows === -->
  <!-- Types → Hamiltonian -->
  <line x1="245" y1="190" x2="285" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="265" y="183" font-family="sans-serif" font-size="9" fill="#333" text-anchor="middle">H(·)</text>

  <!-- Hamiltonian → True -->
  <line x1="515" y1="190" x2="555" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="535" y="183" font-family="sans-serif" font-size="9" fill="#333" text-anchor="middle">inv</text>

  <!-- === Bottom: Information Hierarchy === -->
  <rect x="40" y="320" width="720" height="120" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="345" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Information-Theoretic Invariant Hierarchy</text>

  <!-- Level boxes -->
  <rect x="60" y="360" width="120" height="55" rx="8" fill="#16a34a" opacity="0.85"/>
  <text x="120" y="382" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Level 0</text>
  <text x="120" y="400" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">True (existence)</text>

  <rect x="200" y="360" width="120" height="55" rx="8" fill="#2563eb" opacity="0.75"/>
  <text x="260" y="382" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Level 1</text>
  <text x="260" y="400" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">H(X) ≥ 0</text>

  <rect x="340" y="360" width="120" height="55" rx="8" fill="#7c3aed" opacity="0.7"/>
  <text x="400" y="382" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Level 2</text>
  <text x="400" y="400" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">H(X) ≤ log|X|</text>

  <rect x="480" y="360" width="120" height="55" rx="8" fill="#be185d" opacity="0.65"/>
  <text x="540" y="382" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Level 3</text>
  <text x="540" y="400" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">K(x) ≤ |x| + c</text>

  <rect x="620" y="360" width="120" height="55" rx="8" fill="#475569" opacity="0.6"/>
  <text x="680" y="382" font-family="monospace" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Level n</text>
  <text x="680" y="400" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">···</text>

  <!-- Arrows between levels -->
  <line x1="182" y1="387" x2="197" y2="387" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="322" y1="387" x2="337" y2="387" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="462" y1="387" x2="477" y2="387" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="602" y1="387" x2="617" y2="387" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- === Yoneda annotation === -->
  <rect x="40" y="460" width="720" height="80" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="485" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#854d0e" text-anchor="middle">
    Yoneda Perspective: Hom(X, True) ≅ {★} for all inhabited X
  </text>
  <text x="400" y="505" font-family="sans-serif" font-size="11" fill="#92400e" text-anchor="middle">
    The unique morphism X → True witnesses the universal property of the recursive Hamiltonian invariant.
  </text>
  <text x="400" y="525" font-family="monospace" font-size="11" fill="#78716c" text-anchor="middle">
    Lean proof: trivial   — witnesses True.intro, the canonical inhabitant of True
  </text>

  <!-- Caption -->
  <text x="400" y="575" font-family="Georgia, serif" font-size="12" fill="#64748b" text-anchor="middle">
    Fig. 1: The Information-Theoretic Recursive Hamiltonian Scheme — from inhabited types to the trivial invariant via categorical universality.
  </text>
</svg>
