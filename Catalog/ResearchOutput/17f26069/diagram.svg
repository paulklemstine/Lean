<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Quantum Projective Twistor Theorem (b4a6)
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Inhabited Type → Projective Twistor → Tropical Collapse → Triviality
  </text>

  <!-- ============ BOX 1: Inhabited Type X ============ -->
  <rect x="40" y="80" width="160" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">X : Type*</text>
  <text x="120" y="125" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">[Inhabited X]</text>
  <!-- States as dots -->
  <circle cx="75" cy="155" r="6" fill="#3b82f6" opacity="0.8"/>
  <circle cx="100" cy="165" r="6" fill="#3b82f6" opacity="0.6"/>
  <circle cx="130" cy="150" r="6" fill="#3b82f6" opacity="0.7"/>
  <circle cx="155" cy="170" r="6" fill="#3b82f6" opacity="0.5"/>
  <!-- Base point (star) -->
  <circle cx="75" cy="155" r="9" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="75" y="190" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">base point</text>

  <!-- ============ BOX 2: Projective Twistor Space PT(X) ============ -->
  <rect x="310" y="80" width="180" height="120" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#9d174d">PT(X)</text>
  <text x="400" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9d174d">Projective Twistor Space</text>
  <!-- Fibration lines -->
  <line x1="335" y1="145" x2="335" y2="185" stroke="#db2777" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="365" y1="145" x2="365" y2="185" stroke="#db2777" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="145" x2="400" y2="185" stroke="#db2777" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="435" y1="145" x2="435" y2="185" stroke="#db2777" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="465" y1="145" x2="465" y2="185" stroke="#db2777" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Section (red line) -->
  <path d="M 330 165 Q 370 150, 400 160 Q 440 172, 470 158" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="400" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">global section (from base point)</text>

  <!-- ============ BOX 3: Tropical Semiring ============ -->
  <rect x="600" y="80" width="160" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#15803d">𝕋</text>
  <text x="680" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d">Tropical Semiring</text>
  <text x="680" y="150" text-anchor="middle" font-family="monospace" font-size="11" fill="#15803d">(ℝ ∪ {-∞}, max, +)</text>
  <!-- Single point (collapsed) -->
  <circle cx="680" cy="175" r="8" fill="#16a34a"/>
  <text x="680" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#15803d">trivial variety</text>

  <!-- ============ ARROWS: Top Row ============ -->
  <!-- X → PT(X) -->
  <line x1="200" y1="140" x2="305" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="252" y="133" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">twistor</text>
  <text x="252" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">construction</text>

  <!-- PT(X) → T -->
  <line x1="490" y1="140" x2="595" y2="140" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="542" y="133" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">trop</text>
  <text x="542" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">(measurement)</text>

  <!-- ============ BOX 4: Yoneda Lemma ============ -->
  <rect x="120" y="270" width="200" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="295" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#92400e">Yoneda Lemma</text>
  <text x="220" y="318" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e">Nat(Hom(−,X), F) ≅ F(X)</text>
  <text x="220" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#92400e">Presheaf evaluation at X</text>
  <text x="220" y="358" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#92400e">determines universal property</text>

  <!-- ============ BOX 5: Result ============ -->
  <rect x="460" y="270" width="220" height="100" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="298" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#6b21a8">True</text>
  <text x="570" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b21a8">The invariant is trivially satisfied</text>
  <text x="570" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b21a8">for all inhabited types X.</text>
  <text x="570" y="360" text-anchor="middle" font-family="monospace" font-size="11" fill="#6b21a8">Proof: trivial</text>

  <!-- ============ ARROWS: Middle connections ============ -->
  <!-- PT(X) down to Yoneda -->
  <line x1="350" y1="200" x2="280" y2="265" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="330" y="235" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#d97706">presheaf</text>

  <!-- Yoneda to Result -->
  <line x1="320" y1="320" x2="455" y2="320" stroke="#9333ea" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="388" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9333ea">F(X) = True</text>

  <!-- Tropical to Result -->
  <line x1="680" y1="200" x2="620" y2="265" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="670" y="235" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">collapse</text>

  <!-- ============ Bottom: Proof Chain ============ -->
  <rect x="100" y="420" width="600" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#334155">Proof Chain</text>

  <!-- Chain steps -->
  <rect x="120" y="455" width="100" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="170" y="474" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">Inhabited X</text>

  <text x="232" y="474" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">⟹</text>

  <rect x="250" y="455" width="100" height="30" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="300" y="474" text-anchor="middle" font-family="monospace" font-size="10" fill="#9d174d">Section ∃</text>

  <text x="362" y="474" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">⟹</text>

  <rect x="380" y="455" width="110" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="435" y="474" text-anchor="middle" font-family="monospace" font-size="10" fill="#15803d">Contractible</text>

  <text x="502" y="474" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">⟹</text>

  <rect x="520" y="455" width="160" height="30" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1"/>
  <text x="600" y="474" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b21a8">Invariant = True</text>

  <!-- ============ Caption ============ -->
  <text x="400" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    Figure 1: The quantum projective twistor theorem. An inhabited type X yields a projective twistor space PT(X)
  </text>
  <text x="400" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    with a global section. Tropical projection collapses PT(X) to a point. The Yoneda lemma confirms triviality.
  </text>
  <text x="400" y="579" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
    The simplicity of the proof (trivial) reflects the deep structural insight that no obstruction exists.
  </text>
</svg>
