<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Spectral Resolved Transformation Corollary
  </text>

  <!-- LEFT: Algorithm Homotopy Space -->
  <ellipse cx="150" cy="220" rx="110" ry="130" fill="url(#spectrumGrad)" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">
    Algorithm Homotopy Space
  </text>

  <!-- Dots representing algorithms -->
  <circle cx="110" cy="160" r="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="95" y="150" font-family="sans-serif" font-size="10" fill="#5b21b6">f₁</text>
  <circle cx="180" cy="180" r="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="190" y="175" font-family="sans-serif" font-size="10" fill="#5b21b6">f₂</text>
  <circle cx="130" cy="230" r="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="110" y="225" font-family="sans-serif" font-size="10" fill="#5b21b6">f₃</text>
  <circle cx="170" cy="260" r="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="255" font-family="sans-serif" font-size="10" fill="#5b21b6">f₄</text>
  <circle cx="140" cy="300" r="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="120" y="295" font-family="sans-serif" font-size="10" fill="#5b21b6">f₅</text>

  <!-- Homotopy paths (curved lines between dots) -->
  <path d="M 116 160 Q 155 155 174 180" stroke="#c4b5fd" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 174 186 Q 140 210 136 224" stroke="#c4b5fd" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 136 236 Q 160 250 164 260" stroke="#c4b5fd" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 164 266 Q 145 285 146 294" stroke="#c4b5fd" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- Label: X inhabited -->
  <text x="150" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b21b6">
    X : Type* [Inhabited X]
  </text>

  <!-- MIDDLE: Spectral Resolution Arrow -->
  <line x1="270" y1="200" x2="430" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="350" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">
    Spectral Resolution
  </text>
  <text x="350" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2563eb" font-style="italic">
    quotient by homotopy
  </text>

  <!-- MIDDLE-RIGHT: Collapsed Spectrum -->
  <rect x="450" y="130" width="140" height="180" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="520" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">
    Spectrum
  </text>

  <!-- Eigenvalue bars -->
  <rect x="470" y="155" width="100" height="16" rx="3" fill="#2563eb"/>
  <text x="475" y="167" font-family="monospace" font-size="11" fill="white">λ₁ = 1</text>

  <rect x="470" y="185" width="2" height="16" rx="1" fill="#93c5fd"/>
  <text x="480" y="197" font-family="monospace" font-size="11" fill="#93c5fd">λ₂ = 0</text>

  <rect x="470" y="210" width="2" height="16" rx="1" fill="#93c5fd"/>
  <text x="480" y="222" font-family="monospace" font-size="11" fill="#93c5fd">λ₃ = 0</text>

  <rect x="470" y="235" width="2" height="16" rx="1" fill="#93c5fd"/>
  <text x="480" y="247" font-family="monospace" font-size="11" fill="#93c5fd">λ₄ = 0</text>

  <rect x="470" y="260" width="2" height="16" rx="1" fill="#93c5fd"/>
  <text x="480" y="272" font-family="monospace" font-size="11" fill="#93c5fd">λ₅ = 0</text>

  <!-- Brace indicating gap -->
  <text x="580" y="172" font-family="sans-serif" font-size="11" fill="#16a34a" font-weight="bold">← trivial</text>
  <text x="580" y="172" font-family="sans-serif" font-size="11" fill="#16a34a" font-weight="bold">← trivial</text>
  <line x1="576" y1="185" x2="576" y2="275" stroke="#16a34a" stroke-width="1.5"/>
  <text x="590" y="235" font-family="sans-serif" font-size="10" fill="#16a34a">gap = 1</text>

  <!-- RIGHT: Terminal Object True -->
  <line x1="600" y1="163" x2="680" y2="163" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="640" y="153" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">
    resolve
  </text>

  <circle cx="720" cy="163" r="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="720" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#16a34a">
    True
  </text>
  <text x="720" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">
    (terminal)
  </text>

  <!-- Universal property annotation -->
  <path d="M 150 350 Q 400 430 715 198" stroke="#333" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
  <text x="400" y="410" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333" font-style="italic">
    ∃! morphism (universal property)
  </text>

  <!-- Yoneda annotation -->
  <rect x="280" y="320" width="240" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="400" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a16207">
    Yoneda Lemma
  </text>
  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207">
    Hom(—, True) ≅ terminal functor
  </text>

  <!-- Caption -->
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b" font-style="italic">
    Figure 1: The spectral resolution of an algorithm homotopy space collapses to the terminal object True.
  </text>
  <text x="400" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">
    All non-trivial eigenvalues vanish; the unique surviving invariant witnesses the universal property.
  </text>
</svg>
