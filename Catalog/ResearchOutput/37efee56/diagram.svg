<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="massGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#ffd700;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0f0f23"/>

  <!-- Spacetime grid (curved near mass) -->
  <g stroke="#1a3a5c" stroke-width="0.5" fill="none" opacity="0.4">
    <!-- Horizontal grid lines, curved near center -->
    <path d="M 50,100 Q 400,95 750,100"/>
    <path d="M 50,150 Q 400,140 750,150"/>
    <path d="M 50,200 Q 400,180 750,200"/>
    <path d="M 50,250 Q 400,235 750,250"/>
    <path d="M 50,300 Q 400,310 750,300"/>
    <path d="M 50,350 Q 400,360 750,350"/>
    <path d="M 50,400 Q 400,405 750,400"/>
    <!-- Vertical grid lines -->
    <line x1="150" y1="60" x2="150" y2="430"/>
    <line x1="250" y1="60" x2="250" y2="430"/>
    <line x1="350" y1="60" x2="350" y2="430"/>
    <line x1="450" y1="60" x2="450" y2="430"/>
    <line x1="550" y1="60" x2="550" y2="430"/>
    <line x1="650" y1="60" x2="650" y2="430"/>
  </g>

  <!-- Massive object (lens) at center -->
  <circle cx="400" cy="250" r="35" fill="url(#massGrad)" stroke="#e94560" stroke-width="2"/>
  <circle cx="400" cy="250" r="35" fill="none" stroke="#e94560" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="35;40;35" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="255" text-anchor="middle" fill="#e94560" font-family="serif" font-size="18" font-weight="bold">M</text>

  <!-- Light ray (bent path) — upper ray -->
  <path d="M 50,180 Q 300,185 370,210 Q 400,225 430,210 Q 500,185 750,170"
        stroke="#00d4ff" stroke-width="2.5" fill="none" filter="url(#glow)"
        stroke-dasharray="8,4"/>

  <!-- Light ray — lower ray -->
  <path d="M 50,320 Q 300,315 370,290 Q 400,275 430,290 Q 500,315 750,330"
        stroke="#00d4ff" stroke-width="2.5" fill="none" filter="url(#glow)"
        stroke-dasharray="8,4"/>

  <!-- Straight (unbent) path for reference -->
  <line x1="50" y1="180" x2="750" y2="180" stroke="#445566" stroke-width="1" stroke-dasharray="4,6" opacity="0.5"/>
  <line x1="50" y1="320" x2="750" y2="320" stroke="#445566" stroke-width="1" stroke-dasharray="4,6" opacity="0.5"/>

  <!-- Deflection angle annotation (upper) -->
  <line x1="700" y1="180" x2="750" y2="170" stroke="#e94560" stroke-width="1.5"/>
  <line x1="700" y1="180" x2="750" y2="180" stroke="#e94560" stroke-width="1.5"/>
  <path d="M 730,180 A 30,30 0 0,0 732,175" stroke="#e94560" stroke-width="1.5" fill="none"/>
  <text x="718" y="173" fill="#e94560" font-family="serif" font-size="14" font-style="italic">θ</text>

  <!-- Source star (right side, apparent position) -->
  <circle cx="750" cy="170" r="6" fill="url(#starGrad)" filter="url(#glow)"/>
  <circle cx="750" cy="330" r="6" fill="url(#starGrad)" filter="url(#glow)"/>

  <!-- True source position -->
  <circle cx="750" cy="250" r="5" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="770" y="254" fill="#ffd700" font-family="serif" font-size="11">true</text>

  <!-- Observer (left side) -->
  <circle cx="50" cy="250" r="8" fill="#4ecca3" stroke="#4ecca3" stroke-width="1"/>
  <text x="30" y="275" fill="#4ecca3" font-family="sans-serif" font-size="11" text-anchor="middle">Observer</text>

  <!-- Impact parameter annotation -->
  <line x1="400" y1="250" x2="400" y2="210" stroke="#ffd700" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="415" y="230" fill="#ffd700" font-family="serif" font-size="12" font-style="italic">r</text>

  <!-- Nilpotent residue contour (around mass) -->
  <ellipse cx="400" cy="250" rx="60" ry="55" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="6,3" opacity="0.8"/>
  <polygon points="460,248 455,243 455,253" fill="#9b59b6"/>
  <text x="470" y="225" fill="#9b59b6" font-family="serif" font-size="12">∮ ⟨s, ∇s⟩</text>

  <!-- Residue formula box -->
  <rect x="20" y="60" width="220" height="55" rx="8" fill="#0f0f23" stroke="#9b59b6" stroke-width="1.5" opacity="0.9"/>
  <text x="130" y="80" text-anchor="middle" fill="#9b59b6" font-family="serif" font-size="13" font-weight="bold">Nilpotent Residue</text>
  <text x="130" y="100" text-anchor="middle" fill="#ddd" font-family="serif" font-size="12">θ = Res(⟨s, ∇s⟩) = 4GM/rc²</text>

  <!-- EML framework box -->
  <rect x="560" y="60" width="220" height="55" rx="8" fill="#0f0f23" stroke="#4ecca3" stroke-width="1.5" opacity="0.9"/>
  <text x="670" y="80" text-anchor="middle" fill="#4ecca3" font-family="serif" font-size="13" font-weight="bold">EML Self-Pairing</text>
  <text x="670" y="100" text-anchor="middle" fill="#ddd" font-family="serif" font-size="12">N² = 0 ⟹ simple pole</text>

  <!-- Labels for apparent images -->
  <text x="750" y="158" fill="#00d4ff" font-family="sans-serif" font-size="10" text-anchor="middle">Image +</text>
  <text x="750" y="350" fill="#00d4ff" font-family="sans-serif" font-size="10" text-anchor="middle">Image −</text>

  <!-- Caption -->
  <rect x="0" y="455" width="800" height="45" fill="#0a0a1a"/>
  <text x="400" y="478" text-anchor="middle" fill="#aab" font-family="sans-serif" font-size="13">
    EML Gravitational Lensing: Nilpotent residue contour (purple) around mass M extracts deflection angle θ = 4GM/rc²
  </text>
</svg>
