<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, serif">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <!-- Gradient backgrounds -->
    <linearGradient id="tangentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="cotangentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FEE2E2;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FECACA;stop-opacity:0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#FAFAF9" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">
    Backpropagation as the Cotangent Lift
  </text>
  <text x="450" y="55" text-anchor="middle" font-size="13" fill="#666" font-style="italic">
    The contravariant functor T*: Man^op → Man
  </text>

  <!-- ═══════════ FORWARD PASS (TOP) ═══════════ -->
  <rect x="30" y="75" width="840" height="120" fill="url(#tangentGrad)" rx="10" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="50" y="97" font-size="14" font-weight="bold" fill="#1E40AF">FORWARD PASS (Tangent / Covariant)</text>

  <!-- Manifolds -->
  <ellipse cx="150" cy="145" rx="55" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="141" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E40AF">X</text>
  <text x="150" y="158" text-anchor="middle" font-size="11" fill="#3B82F6">params</text>

  <ellipse cx="380" cy="145" rx="55" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="380" y="141" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E40AF">Y</text>
  <text x="380" y="158" text-anchor="middle" font-size="11" fill="#3B82F6">hidden</text>

  <ellipse cx="610" cy="145" rx="55" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="610" y="141" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E40AF">Z</text>
  <text x="610" y="158" text-anchor="middle" font-size="11" fill="#3B82F6">output</text>

  <ellipse cx="790" cy="145" rx="40" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="790" y="149" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E40AF">ℝ</text>

  <!-- Forward arrows -->
  <line x1="207" y1="145" x2="322" y2="145" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="265" y="137" text-anchor="middle" font-size="13" fill="#1E40AF" font-style="italic">f₁</text>

  <line x1="437" y1="145" x2="552" y2="145" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="495" y="137" text-anchor="middle" font-size="13" fill="#1E40AF" font-style="italic">f₂</text>

  <line x1="667" y1="145" x2="747" y2="145" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="707" y="137" text-anchor="middle" font-size="13" fill="#1E40AF" font-style="italic">ℒ</text>

  <!-- ═══════════ BACKWARD PASS (BOTTOM) ═══════════ -->
  <rect x="30" y="220" width="840" height="120" fill="url(#cotangentGrad)" rx="10" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="50" y="242" font-size="14" font-weight="bold" fill="#991B1B">BACKWARD PASS (Cotangent / Contravariant)</text>

  <!-- Cotangent bundles -->
  <ellipse cx="150" cy="290" rx="55" ry="30" fill="#FFF5F5" stroke="#DC2626" stroke-width="2"/>
  <text x="150" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#991B1B">T*X</text>
  <text x="150" y="303" text-anchor="middle" font-size="10" fill="#EF4444">gradients</text>

  <ellipse cx="380" cy="290" rx="55" ry="30" fill="#FFF5F5" stroke="#DC2626" stroke-width="2"/>
  <text x="380" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#991B1B">T*Y</text>
  <text x="380" y="303" text-anchor="middle" font-size="10" fill="#EF4444">∂ℒ/∂y</text>

  <ellipse cx="610" cy="290" rx="55" ry="30" fill="#FFF5F5" stroke="#DC2626" stroke-width="2"/>
  <text x="610" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#991B1B">T*Z</text>
  <text x="610" y="303" text-anchor="middle" font-size="10" fill="#EF4444">∂ℒ/∂z</text>

  <ellipse cx="790" cy="290" rx="40" ry="30" fill="#FFF5F5" stroke="#DC2626" stroke-width="2"/>
  <text x="790" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#991B1B">T*ℝ</text>

  <!-- Backward arrows (reversed!) -->
  <line x1="322" y1="290" x2="207" y2="290" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="265" y="282" text-anchor="middle" font-size="13" fill="#991B1B" font-style="italic">f₁*</text>

  <line x1="552" y1="290" x2="437" y2="290" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="495" y="282" text-anchor="middle" font-size="13" fill="#991B1B" font-style="italic">f₂*</text>

  <line x1="747" y1="290" x2="667" y2="290" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="707" y="282" text-anchor="middle" font-size="13" fill="#991B1B" font-style="italic">ℒ*</text>

  <!-- ═══════════ FUNCTORIALITY DIAGRAM ═══════════ -->
  <rect x="30" y="365" width="410" height="190" fill="#F0FDF4" rx="10" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="235" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">FUNCTORIALITY (Chain Rule)</text>

  <!-- Top row -->
  <text x="100" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">T*Z</text>
  <text x="360" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">T*X</text>

  <line x1="125" y1="425" x2="330" y2="425" stroke="#166534" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="418" text-anchor="middle" font-size="13" fill="#166534" font-style="italic">(f₂ ∘ f₁)*</text>

  <!-- Bottom row -->
  <text x="230" y="520" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">T*Y</text>

  <line x1="125" y1="440" x2="210" y2="510" stroke="#166534" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="145" y="485" text-anchor="middle" font-size="13" fill="#166534" font-style="italic">f₂*</text>

  <line x1="250" y1="510" x2="335" y2="440" stroke="#166534" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="315" y="485" text-anchor="middle" font-size="13" fill="#166534" font-style="italic">f₁*</text>

  <!-- Equals sign -->
  <text x="230" y="460" text-anchor="middle" font-size="20" fill="#166534" font-weight="bold">=</text>

  <!-- ═══════════ KEY EQUATIONS ═══════════ -->
  <rect x="460" y="365" width="410" height="190" fill="#FDF4FF" rx="10" stroke="#D8B4FE" stroke-width="1.5"/>
  <text x="665" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B21A8">KEY IDENTITIES</text>

  <text x="490" y="420" font-size="14" fill="#6B21A8" font-weight="bold">Forward:</text>
  <text x="490" y="440" font-size="13" fill="#7C3AED" font-style="italic">  F = f_L ∘ ⋯ ∘ f₂ ∘ f₁</text>

  <text x="490" y="470" font-size="14" fill="#6B21A8" font-weight="bold">Backprop:</text>
  <text x="490" y="490" font-size="13" fill="#7C3AED" font-style="italic">  F* = f₁* ∘ f₂* ∘ ⋯ ∘ f_L*</text>

  <text x="490" y="520" font-size="14" fill="#6B21A8" font-weight="bold">Chain Rule = Functoriality:</text>
  <text x="490" y="540" font-size="13" fill="#7C3AED" font-style="italic">  (g ∘ f)* = f* ∘ g*</text>

  <!-- Caption -->
  <text x="450" y="585" text-anchor="middle" font-size="12" fill="#666" font-style="italic">
    Figure 1: Backpropagation as the cotangent functor T*: Man^op → Man. The reversal of arrows
  </text>
  <text x="450" y="598" text-anchor="middle" font-size="12" fill="#666" font-style="italic">
    in the backward pass is the defining property of a contravariant functor.
  </text>
</svg>
