<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Derived Functorial Action Classification
  </text>

  <!-- === Left: Spacetime Category S(X) === -->
  <rect x="30" y="60" width="220" height="200" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e40af">
    𝒮(X) — Spacetime Category
  </text>

  <!-- Objects in S(X) -->
  <circle cx="90" cy="140" r="18" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="90" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="white">x₁</text>

  <circle cx="190" cy="140" r="18" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="190" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="white">x₂</text>

  <circle cx="140" cy="210" r="18" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="140" y="215" text-anchor="middle" font-family="monospace" font-size="12" fill="white">x₃</text>

  <!-- Identity arrows (loops) -->
  <path d="M 90 122 C 70 105 110 105 90 122" fill="none" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <path d="M 190 122 C 170 105 210 105 190 122" fill="none" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <path d="M 140 228 C 120 245 160 245 140 228" fill="none" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>

  <text x="140" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    Inhabited: ∃ x ∈ X
  </text>

  <!-- === Center: Functor F === -->
  <path d="M 260 160 L 340 160" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  <text x="300" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#333">F</text>
  <text x="300" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748b">Endofunctor</text>

  <!-- === Right: Classification Space === -->
  <rect x="350" y="60" width="220" height="200" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#166534">
    Classification Space
  </text>

  <!-- Equivalence classes -->
  <ellipse cx="460" cy="155" rx="70" ry="45" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="430" cy="140" r="10" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
  <circle cx="460" cy="155" r="10" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
  <circle cx="490" cy="140" r="10" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
  <circle cx="445" cy="170" r="10" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
  <circle cx="475" cy="170" r="10" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>

  <text x="460" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    All F's ∈ single class
  </text>
  <text x="460" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    (terminal object ✓)
  </text>

  <!-- === Bottom: Universal Property Triangle === -->
  <rect x="150" y="300" width="500" height="220" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#92400e">
    Universal Property
  </text>

  <!-- Triangle vertices -->
  <!-- Any classification C -->
  <rect x="190" y="360" width="120" height="40" rx="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <text x="250" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#78350f">Any C</text>

  <!-- Terminal classification T -->
  <rect x="490" y="360" width="120" height="40" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#78350f">T (terminal)</text>

  <!-- True -->
  <rect x="350" y="450" width="100" height="40" rx="8" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="400" y="475" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="white">True</text>

  <!-- Arrows -->
  <!-- C -> T (unique morphism) -->
  <line x1="310" y1="380" x2="485" y2="380" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="395" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#92400e">∃! morphism</text>

  <!-- C -> True -->
  <line x1="270" y1="400" x2="370" y2="450" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- T -> True -->
  <line x1="530" y1="400" x2="430" y2="450" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Commutes label -->
  <text x="400" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#92400e">▲ commutes</text>

  <!-- Lean proof annotation -->
  <rect x="480" y="470" width="160" height="35" rx="6" fill="#1e293b"/>
  <text x="560" y="492" text-anchor="middle" font-family="monospace" font-size="12" fill="#22d3ee">
    proof := trivial
  </text>

  <!-- Kolmogorov connection -->
  <text x="220" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748b">
    K(T) = O(1) — maximal compression
  </text>

  <!-- Caption -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569">
    Figure: The functorial action classification on an inhabited spacetime category 𝒮(X)
  </text>
  <text x="400" y="578" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569">
    admits a terminal object T, making the universal property trivially True.
  </text>
</svg>
