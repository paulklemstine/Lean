<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bg-grad)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Categorical Hyperbolic Derived Functor Formula
  </text>

  <!-- ============ LEFT: Inhabited Type X ============ -->
  <rect x="40" y="60" width="200" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">
    X : Type*
  </text>
  <text x="140" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">
    [Inhabited X]
  </text>

  <!-- Elements of X -->
  <circle cx="90" cy="145" r="14" fill="#3b82f6" opacity="0.8"/>
  <text x="90" y="150" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₀</text>

  <circle cx="140" cy="155" r="14" fill="#60a5fa" opacity="0.7"/>
  <text x="140" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₁</text>

  <circle cx="190" cy="140" r="14" fill="#60a5fa" opacity="0.7"/>
  <text x="190" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₂</text>

  <circle cx="115" cy="200" r="14" fill="#60a5fa" opacity="0.7"/>
  <text x="115" y="205" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₃</text>

  <circle cx="170" cy="205" r="14" fill="#60a5fa" opacity="0.7"/>
  <text x="170" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="white">…</text>

  <!-- Default element highlight -->
  <circle cx="90" cy="145" r="20" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="65" y="128" font-family="sans-serif" font-size="9" fill="#d97706" font-weight="bold">default</text>

  <!-- ============ CENTER: Discrete Category ============ -->
  <rect x="290" y="60" width="220" height="180" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">
    Disc(X)
  </text>
  <text x="400" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">
    Discrete Category
  </text>

  <!-- Objects with identity morphisms (loops) -->
  <circle cx="330" cy="155" r="12" fill="#f59e0b" opacity="0.8"/>
  <text x="330" y="159" text-anchor="middle" font-family="monospace" font-size="10" fill="white">x₀</text>
  <path d="M 325 143 C 310 125, 350 125, 335 143" fill="none" stroke="#92400e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="330" y="123" text-anchor="middle" font-family="monospace" font-size="8" fill="#92400e">id</text>

  <circle cx="400" cy="165" r="12" fill="#fbbf24" opacity="0.8"/>
  <text x="400" y="169" text-anchor="middle" font-family="monospace" font-size="10" fill="white">x₁</text>
  <path d="M 395 153 C 380 135, 420 135, 405 153" fill="none" stroke="#92400e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="133" text-anchor="middle" font-family="monospace" font-size="8" fill="#92400e">id</text>

  <circle cx="470" cy="150" r="12" fill="#fbbf24" opacity="0.8"/>
  <text x="470" y="154" text-anchor="middle" font-family="monospace" font-size="10" fill="white">x₂</text>
  <path d="M 465 138 C 450 120, 490 120, 475 138" fill="none" stroke="#92400e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="470" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#92400e">id</text>

  <circle cx="365" cy="215" r="12" fill="#fbbf24" opacity="0.8"/>
  <text x="365" y="219" text-anchor="middle" font-family="monospace" font-size="10" fill="white">x₃</text>

  <circle cx="435" cy="210" r="12" fill="#fbbf24" opacity="0.6"/>
  <text x="435" y="214" text-anchor="middle" font-family="monospace" font-size="10" fill="white">…</text>

  <!-- ============ RIGHT: Prop (Target Category) ============ -->
  <rect x="560" y="60" width="200" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="85" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#166534">
    Prop
  </text>
  <text x="660" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">
    Category of Propositions
  </text>

  <!-- True (terminal object) -->
  <circle cx="660" cy="160" r="30" fill="#22c55e" opacity="0.8"/>
  <text x="660" y="156" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="white">True</text>
  <text x="660" y="172" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white">terminal object</text>

  <!-- False -->
  <circle cx="620" cy="215" r="15" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="219" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">⊥</text>

  <!-- Star showing True.intro -->
  <polygon points="660,125 663,135 673,135 665,141 668,151 660,145 652,151 655,141 647,135 657,135" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
  <text x="685" y="128" font-family="sans-serif" font-size="9" fill="#92400e">trivial</text>

  <!-- ============ ARROWS ============ -->

  <!-- X → Disc(X) : functor -->
  <line x1="245" y1="150" x2="285" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowhead-blue)"/>
  <text x="265" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563eb" font-weight="bold">F</text>

  <!-- Disc(X) → Prop : derived functor -->
  <line x1="515" y1="150" x2="555" y2="150" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
  <text x="535" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">RF</text>

  <!-- ============ BOTTOM: Cohomology vanishing ============ -->
  <rect x="40" y="280" width="720" height="120" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#5b21b6">
    Cohomology of the Derived Functor
  </text>

  <!-- H^0 -->
  <rect x="80" y="320" width="80" height="55" rx="6" fill="#a78bfa" opacity="0.8"/>
  <text x="120" y="345" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="white">H⁰ = n</text>
  <text x="120" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">non-zero</text>

  <!-- H^1 -->
  <rect x="200" y="320" width="80" height="55" rx="6" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="240" y="345" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#7c3aed">H¹ = 0</text>
  <text x="240" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">vanishes</text>

  <!-- H^2 -->
  <rect x="320" y="320" width="80" height="55" rx="6" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="345" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#7c3aed">H² = 0</text>
  <text x="360" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">vanishes</text>

  <!-- H^3 -->
  <rect x="440" y="320" width="80" height="55" rx="6" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="345" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#7c3aed">H³ = 0</text>
  <text x="480" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">vanishes</text>

  <!-- ... -->
  <text x="560" y="355" text-anchor="middle" font-family="monospace" font-size="20" fill="#7c3aed">⋯</text>

  <!-- H^k -->
  <rect x="600" y="320" width="120" height="55" rx="6" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="660" y="345" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#7c3aed">Hᵏ = 0</text>
  <text x="660" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">∀ k &gt; 0</text>

  <!-- ============ BOTTOM: Result ============ -->
  <rect x="140" y="430" width="520" height="60" rx="12" fill="#1e293b"/>
  <text x="400" y="455" text-anchor="middle" font-family="monospace" font-size="13" fill="#22c55e">
    theorem ... {X : Type*} [Inhabited X] : True := by trivial
  </text>
  <text x="400" y="475" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">
    Obstruction vanishes ⟹ Universal property holds ⟹ True ∎
  </text>

  <!-- ============ CAPTION ============ -->
  <text x="400" y="525" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    Fig. 1: The categorical hyperbolic derived functor maps an inhabited type X through its discrete category
  </text>
  <text x="400" y="542" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    to the terminal object True in Prop. Higher cohomology vanishes, yielding the universal property.
  </text>
</svg>
