<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8" />

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Probabilistic Simply-Connected Complex Formula
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal Property via the Terminal Object in Prop
  </text>

  <!-- Category of Inhabited Types (left) -->
  <rect x="40" y="90" width="220" height="200" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="0.8" />
  <text x="150" y="115" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1e40af">
    InhabitedType
  </text>
  <text x="150" y="133" text-anchor="middle" font-family="serif" font-size="11" fill="#3b82f6">
    (Category of inhabited types)
  </text>

  <!-- Objects in InhabitedType -->
  <circle cx="90" cy="170" r="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text x="90" y="175" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a5f">(ℕ, 0)</text>

  <circle cx="200" cy="170" r="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text x="200" y="175" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a5f">(ℤ, 0)</text>

  <circle cx="90" cy="230" r="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text x="90" y="235" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a5f">(ℝ, 0)</text>

  <circle cx="200" cy="230" r="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text x="200" y="235" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e3a5f">(X, x₀)</text>

  <!-- Morphisms in InhabitedType -->
  <line x1="108" y1="170" x2="180" y2="170" stroke="#2563eb" stroke-width="1" marker-end="url(#arrowhead-blue)" />
  <line x1="90" y1="190" x2="90" y2="210" stroke="#2563eb" stroke-width="1" marker-end="url(#arrowhead-blue)" />
  <line x1="200" y1="190" x2="200" y2="210" stroke="#2563eb" stroke-width="1" marker-end="url(#arrowhead-blue)" />

  <!-- Prop category (right) -->
  <rect x="540" y="90" width="220" height="200" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" opacity="0.8" />
  <text x="650" y="115" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#991b1b">
    Prop
  </text>
  <text x="650" y="133" text-anchor="middle" font-family="serif" font-size="11" fill="#ef4444">
    (Category of propositions)
  </text>

  <!-- True (terminal object) — highlighted -->
  <circle cx="650" cy="185" r="30" fill="#fecaca" stroke="#dc2626" stroke-width="2.5" />
  <text x="650" y="190" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#7f1d1d">True</text>

  <!-- Other props -->
  <circle cx="580" cy="250" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1" opacity="0.5" />
  <text x="580" y="254" text-anchor="middle" font-family="monospace" font-size="9" fill="#991b1b">P</text>

  <circle cx="720" cy="250" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1" opacity="0.5" />
  <text x="720" y="254" text-anchor="middle" font-family="monospace" font-size="9" fill="#991b1b">Q</text>

  <!-- Arrows from P, Q to True (terminal object property) -->
  <line x1="588" y1="238" x2="630" y2="200" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead-red)" opacity="0.6" />
  <line x1="712" y1="238" x2="672" y2="200" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead-red)" opacity="0.6" />

  <text x="650" y="275" text-anchor="middle" font-family="serif" font-size="10" fill="#991b1b" font-style="italic">
    ∀ P : Prop, P → True
  </text>

  <!-- The Functor arrow -->
  <line x1="270" y1="190" x2="530" y2="190" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="400" y="180" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#333">
    F : InhabitedType → Prop
  </text>
  <text x="400" y="200" text-anchor="middle" font-family="serif" font-size="11" fill="#64748b" font-style="italic">
    "simply-connected complex formula"
  </text>

  <!-- Factorization through terminal object -->
  <rect x="80" y="340" width="640" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" opacity="0.7" />
  <text x="400" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#15803d">
    Universal Property (Theorem)
  </text>

  <!-- The key diagram -->
  <!-- X inhabited -->
  <rect x="130" y="400" width="140" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" />
  <text x="200" y="420" text-anchor="middle" font-family="monospace" font-size="12" fill="#14532d">X : Type*</text>
  <text x="200" y="438" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">[Inhabited X]</text>

  <!-- Arrow to True -->
  <line x1="280" y1="425" x2="480" y2="425" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowhead)" />

  <!-- Label on arrow -->
  <text x="380" y="415" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#15803d">
    trivial
  </text>
  <text x="380" y="445" text-anchor="middle" font-family="serif" font-size="10" fill="#16a34a" font-style="italic">
    (True.intro)
  </text>

  <!-- True box -->
  <rect x="490" y="400" width="100" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5" />
  <text x="540" y="430" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#14532d">True</text>

  <!-- Proof statement -->
  <text x="400" y="495" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">
    theorem ... {X : Type*} [Inhabited X] : True := by trivial
  </text>

  <!-- QED -->
  <rect x="670" y="480" width="30" height="30" fill="#16a34a" stroke="#15803d" stroke-width="1" />
  <text x="685" y="500" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="white">∎</text>

  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569">
    Figure 1: The functor F maps every inhabited type to True ∈ Prop via the terminal object universal property.
  </text>
  <text x="400" y="593" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#94a3b8">
    The proof factors through True.intro, the unique morphism to the terminal object.
  </text>
</svg>
