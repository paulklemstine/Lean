<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Stacky Semisimple Lagrangian Corollary
  </text>
  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Universal property: ∀ {X : Type*} [Inhabited X], True
  </text>

  <!-- Left: Type X (Inhabited) -->
  <ellipse cx="150" cy="220" rx="100" ry="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="195" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e40af">X : Type*</text>
  <text x="150" y="220" text-anchor="middle" font-family="monospace" font-size="12" fill="#3b82f6">[Inhabited X]</text>

  <!-- Elements inside X -->
  <circle cx="120" cy="250" r="6" fill="#3b82f6" opacity="0.6"/>
  <circle cx="145" cy="260" r="6" fill="#3b82f6" opacity="0.6"/>
  <circle cx="170" cy="245" r="6" fill="#3b82f6" opacity="0.6"/>
  <circle cx="150" cy="240" r="8" fill="#1d4ed8" stroke="#fff" stroke-width="2"/>
  <text x="150" y="280" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">default</text>

  <!-- Center: Stacky Structure / Lagrangian -->
  <rect x="320" y="160" width="160" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="195" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#92400e">Stacky</text>
  <text x="400" y="215" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#92400e">Semisimple</text>
  <text x="400" y="235" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#92400e">Lagrangian</text>
  <text x="400" y="260" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">L : X → Prop</text>

  <!-- Right: Prop (Target) -->
  <ellipse cx="650" cy="220" rx="90" ry="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="210" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#166534">Prop</text>
  <text x="650" y="235" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">True</text>

  <!-- Star for True -->
  <polygon points="650,185 654,196 666,196 656,203 660,214 650,207 640,214 644,203 634,196 646,196" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>

  <!-- Arrow: X → Lagrangian -->
  <line x1="255" y1="220" x2="315" y2="220" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="285" y="210" text-anchor="middle" font-family="monospace" font-size="10" fill="#2563eb">structure</text>

  <!-- Arrow: Lagrangian → Prop -->
  <line x1="485" y1="220" x2="555" y2="220" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="520" y="210" text-anchor="middle" font-family="monospace" font-size="10" fill="#16a34a">invariant</text>

  <!-- Bottom: Proof diagram -->
  <rect x="100" y="350" width="600" height="180" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="400" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#334155">Proof Structure (Commutative Diagram)</text>

  <!-- Nodes -->
  <!-- X -->
  <ellipse cx="200" cy="440" rx="50" ry="25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="445" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e40af">X</text>

  <!-- True -->
  <ellipse cx="600" cy="440" rx="50" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="445" text-anchor="middle" font-family="monospace" font-size="13" fill="#166534">True</text>

  <!-- 1 (terminal) -->
  <circle cx="400" cy="490" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="495" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">⊤</text>

  <!-- Arrows -->
  <line x1="255" y1="440" x2="545" y2="440" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="432" text-anchor="middle" font-family="monospace" font-size="11" fill="#334155">trivial</text>

  <line x1="225" y1="460" x2="378" y2="485" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <text x="290" y="485" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">unique</text>

  <line x1="422" y1="485" x2="575" y2="460" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <text x="510" y="485" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">id</text>

  <!-- Caption -->
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569">
    Figure: The stacky semisimple Lagrangian invariant factors through the terminal object ⊤ in Prop.
  </text>
  <text x="400" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">
    All paths commute — the invariant is universally True. Formally verified in Lean 4 + Mathlib.
  </text>
</svg>
