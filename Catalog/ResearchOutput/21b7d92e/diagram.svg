<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <!-- Gradient for twistor space -->
    <radialGradient id="twistorGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#bfdbfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.3" />
    </radialGradient>
    <!-- Gradient for terminal object -->
    <radialGradient id="terminalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fde68a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.5" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8" />

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Higher Smooth Twistor Protocol (HSTP-3279)
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b" font-style="italic">
    Universal property: every inhabited type maps to True
  </text>

  <!-- ========== LEFT COLUMN: Inhabited Types ========== -->
  <text x="130" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">
    Inhabited Types
  </text>

  <!-- Type X₁ -->
  <ellipse cx="130" cy="140" rx="70" ry="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
  <text x="130" y="137" text-anchor="middle" font-family="monospace" font-size="13" fill="#4c1d95">X₁ : ℕ</text>
  <text x="130" y="153" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">[Inhabited, default=0]</text>

  <!-- Type X₂ -->
  <ellipse cx="130" cy="230" rx="70" ry="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
  <text x="130" y="227" text-anchor="middle" font-family="monospace" font-size="13" fill="#4c1d95">X₂ : ℝ</text>
  <text x="130" y="243" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">[Inhabited, default=0]</text>

  <!-- Type X₃ -->
  <ellipse cx="130" cy="320" rx="70" ry="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
  <text x="130" y="317" text-anchor="middle" font-family="monospace" font-size="13" fill="#4c1d95">X₃ : Vec₃</text>
  <text x="130" y="333" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">[Inhabited, default=0⃗]</text>

  <!-- Type X₄ -->
  <ellipse cx="130" cy="410" rx="70" ry="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
  <text x="130" y="407" text-anchor="middle" font-family="monospace" font-size="13" fill="#4c1d95">X₄ : Mat₂</text>
  <text x="130" y="423" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">[Inhabited, default=I]</text>

  <!-- Vertical dots -->
  <text x="130" y="465" text-anchor="middle" font-family="serif" font-size="20" fill="#7c3aed">⋮</text>

  <!-- ========== CENTER: Twistor Protocol ========== -->
  <text x="400" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">
    Smooth Twistor Protocol
  </text>

  <!-- Twistor space -->
  <ellipse cx="400" cy="275" rx="100" ry="130" fill="url(#twistorGrad)" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3" />
  <text x="400" y="170" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">Twistor Space</text>

  <!-- Internal structure lines (representing fiber structure) -->
  <path d="M 340 200 Q 400 240 460 200" fill="none" stroke="#93c5fd" stroke-width="1.5" />
  <path d="M 330 240 Q 400 280 470 240" fill="none" stroke="#93c5fd" stroke-width="1.5" />
  <path d="M 325 280 Q 400 320 475 280" fill="none" stroke="#93c5fd" stroke-width="1.5" />
  <path d="M 330 320 Q 400 360 470 320" fill="none" stroke="#93c5fd" stroke-width="1.5" />
  <path d="M 340 360 Q 400 390 460 360" fill="none" stroke="#93c5fd" stroke-width="1.5" />

  <!-- Yoneda label -->
  <text x="400" y="260" text-anchor="middle" font-family="serif" font-size="14" fill="#1e3a8a" font-style="italic">
    Yoneda
  </text>
  <text x="400" y="280" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a8a">
    Nat(Hom(1,-), F) ≅ F(1)
  </text>
  <text x="400" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">
    = True
  </text>

  <!-- ========== RIGHT: Terminal Object ========== -->
  <text x="670" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d97706">
    Terminal Object
  </text>

  <!-- True / terminal -->
  <circle cx="670" cy="275" r="55" fill="url(#terminalGrad)" stroke="#d97706" stroke-width="2.5" />
  <text x="670" y="270" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#92400e">True</text>
  <text x="670" y="292" text-anchor="middle" font-family="serif" font-size="12" fill="#92400e" font-style="italic">trivial</text>

  <!-- ========== ARROWS: Types → Twistor → True ========== -->

  <!-- X₁ → Twistor -->
  <line x1="202" y1="135" x2="298" y2="210" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowhead)" opacity="0.7" />
  <!-- X₂ → Twistor -->
  <line x1="202" y1="230" x2="298" y2="260" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowhead)" opacity="0.7" />
  <!-- X₃ → Twistor -->
  <line x1="202" y1="320" x2="298" y2="290" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowhead)" opacity="0.7" />
  <!-- X₄ → Twistor -->
  <line x1="202" y1="405" x2="298" y2="340" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowhead)" opacity="0.7" />

  <!-- Twistor → True (single thick arrow) -->
  <line x1="502" y1="275" x2="612" y2="275" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowhead-green)" />
  <text x="557" y="265" text-anchor="middle" font-family="monospace" font-size="11" fill="#16a34a" font-weight="bold">∃!</text>

  <!-- Direct arrows from types to True (dashed, showing commutativity) -->
  <path d="M 200 130 Q 500 50 665 220" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrowhead-red)" opacity="0.5" />
  <path d="M 200 415 Q 500 500 665 330" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrowhead-red)" opacity="0.5" />

  <!-- ========== BOTTOM: Tropical Degeneration ========== -->
  <line x1="50" y1="490" x2="750" y2="490" stroke="#e2e8f0" stroke-width="1" />

  <text x="400" y="515" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f766e">
    Tropical Degeneration (t → 0)
  </text>

  <!-- Smooth curve (t=1) -->
  <path d="M 100 545 Q 140 525 180 545 Q 220 565 260 545" fill="none" stroke="#2563eb" stroke-width="2" />
  <text x="180" y="575" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563eb">t = 1 (smooth)</text>

  <!-- Intermediate (t=0.5) -->
  <path d="M 280 545 Q 310 530 340 545 Q 370 560 400 545" fill="none" stroke="#7c3aed" stroke-width="2" />
  <text x="340" y="575" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed">t = 0.5</text>

  <!-- Arrow between stages -->
  <text x="260" y="548" font-family="sans-serif" font-size="14" fill="#94a3b8">→</text>
  <text x="420" y="548" font-family="sans-serif" font-size="14" fill="#94a3b8">→</text>

  <!-- Tropical limit (piecewise linear) -->
  <path d="M 450 555 L 510 535 L 570 555" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" />
  <text x="510" y="575" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">t → 0 (tropical)</text>

  <!-- Arrow to invariant -->
  <text x="590" y="548" font-family="sans-serif" font-size="14" fill="#94a3b8">→</text>

  <!-- Invariant box -->
  <rect x="620" y="530" width="100" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="670" y="550" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#166534">True ✓</text>

  <!-- Caption -->
  <text x="400" y="598" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
    Fig. 1: The HSTP-3279 maps all inhabited types through the twistor space to the terminal object True.
  </text>
</svg>
