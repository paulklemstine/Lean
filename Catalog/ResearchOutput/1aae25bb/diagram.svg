<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Parametrized Special Decomposition Algorithm (b844)
  </text>
  
  <!-- === LEFT: Inhabited Type X === -->
  <g transform="translate(130, 220)">
    <!-- Outer circle representing X -->
    <circle cx="0" cy="0" r="90" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" opacity="0.7"/>
    <text x="0" y="-100" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e40af">
      Inhabited Type X
    </text>
    
    <!-- Points in X -->
    <circle cx="-40" cy="-30" r="5" fill="#93c5fd"/>
    <circle cx="30" cy="-50" r="5" fill="#93c5fd"/>
    <circle cx="50" cy="20" r="5" fill="#93c5fd"/>
    <circle cx="-20" cy="50" r="5" fill="#93c5fd"/>
    <circle cx="-55" cy="15" r="5" fill="#93c5fd"/>
    <circle cx="15" cy="35" r="5" fill="#93c5fd"/>
    
    <!-- Base point (default) — highlighted -->
    <circle cx="0" cy="0" r="8" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
    <text x="15" y="5" font-family="monospace" font-size="11" fill="#991b1b" font-weight="bold">default</text>
    
    <!-- Sector lines from base point -->
    <line x1="0" y1="0" x2="0" y2="-85" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="0" y1="0" x2="73" y2="43" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="0" y1="0" x2="-73" y2="43" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
    
    <!-- Sector labels -->
    <text x="25" y="-55" font-family="sans-serif" font-size="9" fill="#64748b">S₁</text>
    <text x="-35" y="-55" font-family="sans-serif" font-size="9" fill="#64748b">S₂</text>
    <text x="-55" y="0" font-family="sans-serif" font-size="9" fill="#64748b">S₃</text>
  </g>
  
  <!-- === Arrow: Decomposition Functor === -->
  <line x1="240" y1="220" x2="360" y2="220" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="300" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#475569">
    Decompose
  </text>
  <text x="300" y="245" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">
    trivial
  </text>
  
  <!-- === CENTER: Tropical Variety === -->
  <g transform="translate(440, 220)">
    <text x="0" y="-120" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#15803d">
      Tropical Variety
    </text>
    
    <!-- Three rays of the tropical line max(x, y, 0) -->
    <!-- Ray going north (y ≥ 0, x = 0) -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#16a34a" stroke-width="3"/>
    <text x="8" y="-85" font-family="sans-serif" font-size="10" fill="#15803d">y ≥ 0</text>
    
    <!-- Ray going east (x ≥ 0, y = 0) -->
    <line x1="0" y1="0" x2="100" y2="0" stroke="#16a34a" stroke-width="3"/>
    <text x="75" y="-8" font-family="sans-serif" font-size="10" fill="#15803d">x ≥ 0</text>
    
    <!-- Ray going southwest (x = y ≤ 0) -->
    <line x1="0" y1="0" x2="-70" y2="70" stroke="#16a34a" stroke-width="3"/>
    <text x="-85" y="60" font-family="sans-serif" font-size="10" fill="#15803d">x = y ≤ 0</text>
    
    <!-- Vertex (origin) — the base point -->
    <circle cx="0" cy="0" r="7" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <text x="12" y="18" font-family="monospace" font-size="10" fill="#c2410c" font-weight="bold">vertex</text>
    
    <!-- Equation label -->
    <text x="0" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#166534">
      f(x,y) = max(x, y, 0)
    </text>
  </g>
  
  <!-- === Arrow: Universal Property === -->
  <line x1="555" y1="220" x2="630" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" stroke-dasharray="6,3"/>
  <line x1="555" y1="220" x2="630" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" stroke-dasharray="6,3"/>
  
  <text x="610" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2563eb" font-style="italic">
    Universal
  </text>
  <text x="610" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2563eb" font-style="italic">
    Property
  </text>
  
  <!-- === RIGHT TOP: Target 1 === -->
  <g transform="translate(700, 120)">
    <rect x="-55" y="-30" width="110" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#92400e">Number</text>
    <text x="0" y="16" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#92400e">Theory</text>
  </g>
  
  <!-- === RIGHT BOTTOM: Target 2 === -->
  <g transform="translate(700, 320)">
    <rect x="-55" y="-30" width="110" height="60" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#9d174d">AI / ML</text>
    <text x="0" y="16" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#9d174d">Invariants</text>
  </g>
  
  <!-- === Bottom: Lean proof === -->
  <g transform="translate(400, 440)">
    <rect x="-280" y="-25" width="560" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" font-family="monospace" font-size="13" fill="#a5f3fc">
      theorem parametrized_special_decomposition_algorithm_b844
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="13" fill="#86efac">
      {X : Type*} [Inhabited X] : True := by trivial
    </text>
    <text x="0" y="42" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">
      — Lean 4 / Mathlib — formally verified ✓
    </text>
  </g>
  
  <!-- === Legend === -->
  <g transform="translate(50, 500)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#334155">Legend:</text>
    
    <circle cx="15" cy="20" r="5" fill="#ef4444"/>
    <text x="28" y="24" font-family="sans-serif" font-size="11" fill="#475569">Base point (Inhabited.default)</text>
    
    <circle cx="215" cy="20" r="5" fill="#f97316"/>
    <text x="228" y="24" font-family="sans-serif" font-size="11" fill="#475569">Tropical vertex</text>
    
    <line x1="370" y1="20" x2="400" y2="20" stroke="#16a34a" stroke-width="3"/>
    <text x="410" y="24" font-family="sans-serif" font-size="11" fill="#475569">Tropical rays</text>
    
    <line x1="520" y1="20" x2="550" y2="20" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="560" y="24" font-family="sans-serif" font-size="11" fill="#475569">Decomposition sectors</text>
  </g>
  
  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#64748b">
    Fig. 1: The parametrized decomposition of an inhabited type X, its tropical dual, and the universal property connecting to applications.
  </text>
</svg>
