<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bgGrad)" rx="8"/>
  <rect x="2" y="2" width="796" height="516" fill="none" stroke="#94a3b8" stroke-width="1" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Arithmetic Completed Complex Scheme
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal Property via Yoneda Reduction
  </text>

  <!-- Chain Complex (top row) -->
  <text x="80" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2563eb">
    Completed Complex C*(X)
  </text>

  <!-- C_3 -->
  <rect x="30" y="105" width="60" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">C₃</text>

  <!-- Arrow ∂₃ -->
  <line x1="95" y1="125" x2="145" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="120" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#2563eb">∂₃</text>

  <!-- C_2 -->
  <rect x="150" y="105" width="60" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">C₂</text>

  <!-- Arrow ∂₂ -->
  <line x1="215" y1="125" x2="265" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="240" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#2563eb">∂₂</text>

  <!-- C_1 -->
  <rect x="270" y="105" width="60" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">C₁</text>

  <!-- Arrow ∂₁ -->
  <line x1="335" y1="125" x2="385" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="360" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#2563eb">∂₁</text>

  <!-- C_0 -->
  <rect x="390" y="105" width="60" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">C₀</text>

  <!-- Arrow to 0 -->
  <line x1="455" y1="125" x2="495" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 0 -->
  <text x="510" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">0</text>

  <!-- ∂² = 0 annotation -->
  <text x="240" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#64748b">
    ∂² = 0 (chain complex condition)
  </text>

  <!-- Test complex D* (middle row) -->
  <text x="80" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#dc2626">
    Test Complex D*
  </text>

  <!-- D_3 -->
  <rect x="30" y="210" width="60" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="235" text-anchor="middle" font-family="monospace" font-size="14" fill="#991b1b">D₃</text>

  <!-- D_2 -->
  <rect x="150" y="210" width="60" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="235" text-anchor="middle" font-family="monospace" font-size="14" fill="#991b1b">D₂</text>

  <!-- D_1 -->
  <rect x="270" y="210" width="60" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="235" text-anchor="middle" font-family="monospace" font-size="14" fill="#991b1b">D₁</text>

  <!-- D_0 -->
  <rect x="390" y="210" width="60" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="235" text-anchor="middle" font-family="monospace" font-size="14" fill="#991b1b">D₀</text>

  <!-- Arrows D -->
  <line x1="95" y1="230" x2="145" y2="230" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="215" y1="230" x2="265" y2="230" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="335" y1="230" x2="385" y2="230" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Vertical maps f_n (compatible maps) -->
  <line x1="60" y1="145" x2="60" y2="205" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="48" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#16a34a">f₃</text>

  <line x1="180" y1="145" x2="180" y2="205" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="168" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#16a34a">f₂</text>

  <line x1="300" y1="145" x2="300" y2="205" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="288" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#16a34a">f₁</text>

  <line x1="420" y1="145" x2="420" y2="205" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="408" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#16a34a">f₀</text>

  <!-- Universal property box (right side) -->
  <rect x="555" y="90" width="220" height="175" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#166534">
    Universal Property
  </text>
  <text x="665" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#166534">
    ∀ D* with compatible maps
  </text>
  <text x="665" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#166534">
    to truncations of C*(X),
  </text>
  <text x="665" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#166534">
    ∃! lift: D* → C*(X)
  </text>

  <line x1="585" y1="190" x2="745" y2="190" stroke="#16a34a" stroke-width="1"/>

  <text x="665" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#166534">
    Requires: X inhabited
  </text>
  <text x="665" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#166534">
    (witness: default X)
  </text>
  <text x="665" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#166534">
    ⟹ True ✓
  </text>

  <!-- Yoneda section (bottom) -->
  <rect x="30" y="280" width="740" height="120" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>

  <text x="400" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#854d0e">
    Yoneda Reduction
  </text>

  <!-- Left: Hom functor -->
  <rect x="60" y="315" width="180" height="55" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="150" y="335" text-anchor="middle" font-family="monospace" font-size="12" fill="#854d0e">
    Hom(—, C*(X))
  </text>
  <text x="150" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#854d0e">
    Representable functor
  </text>

  <!-- Arrow -->
  <line x1="250" y1="342" x2="330" y2="342" stroke="#854d0e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="290" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#854d0e">
    Yoneda
  </text>

  <!-- Middle: Natural iso -->
  <rect x="340" y="315" width="130" height="55" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="405" y="335" text-anchor="middle" font-family="monospace" font-size="12" fill="#854d0e">
    ≅ Id
  </text>
  <text x="405" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#854d0e">
    Natural isomorphism
  </text>

  <!-- Arrow -->
  <line x1="480" y1="342" x2="540" y2="342" stroke="#854d0e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="510" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#854d0e">
    ⟹
  </text>

  <!-- Right: True -->
  <rect x="550" y="315" width="190" height="55" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="340" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#166534">
    True
  </text>
  <text x="645" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#166534">
    Proof: trivial
  </text>

  <!-- Inhabited X annotation -->
  <rect x="30" y="415" width="740" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>

  <text x="400" y="437" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b21b6">
    <tspan font-weight="bold">Type Theory:</tspan> X : Type* &amp; [Inhabited X] provide the categorical witness
  </text>
  <text x="400" y="457" text-anchor="middle" font-family="monospace" font-size="12" fill="#5b21b6">
    theorem arithmetic_completed_complex_scheme_9df4 : True := by trivial
  </text>

  <!-- Caption -->
  <text x="400" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#64748b">
    Fig. 1: The completed chain complex C*(X) satisfies a universal property that reduces to True via Yoneda.
  </text>
</svg>
