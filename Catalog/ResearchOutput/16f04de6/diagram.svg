<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect width="800" height="520" fill="#fafafa" rx="10"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">
    Finitary Separated Comonad Method — Structural Collapse
  </text>
  
  <!-- Left box: General Comonad -->
  <rect x="40" y="60" width="220" height="180" rx="12" fill="#e8f4f8" stroke="#2196F3" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">General Comonad W</text>
  
  <text x="70" y="120" font-size="13" fill="#333">W : C → C</text>
  <text x="70" y="145" font-size="13" fill="#333">ε : W → Id</text>
  <text x="70" y="170" font-size="13" fill="#333">δ : W → W ∘ W</text>
  
  <text x="70" y="200" font-size="11" fill="#666" font-style="italic">Counit laws</text>
  <text x="70" y="218" font-size="11" fill="#666" font-style="italic">Coassociativity</text>
  
  <!-- Right box: Identity Comonad -->
  <rect x="540" y="60" width="220" height="180" rx="12" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
  <text x="650" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Identity Comonad Id</text>
  
  <text x="570" y="120" font-size="13" fill="#333">Id : C → C</text>
  <text x="570" y="145" font-size="13" fill="#333">ε = id</text>
  <text x="570" y="170" font-size="13" fill="#333">δ = id</text>
  
  <text x="570" y="200" font-size="11" fill="#666" font-style="italic">All laws trivially</text>
  <text x="570" y="218" font-size="11" fill="#666" font-style="italic">satisfied</text>
  
  <!-- Collapse arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E91E63"/>
    </marker>
  </defs>
  <line x1="270" y1="150" x2="530" y2="150" stroke="#E91E63" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Collapse label -->
  <rect x="330" y="115" width="140" height="25" rx="5" fill="#FCE4EC" stroke="#E91E63" stroke-width="1"/>
  <text x="400" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#C2185B">
    Finitary + Separated
  </text>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#E91E63" font-style="italic">
    collapse on discrete cat.
  </text>
  
  <!-- Middle section: The inhabited type -->
  <rect x="200" y="270" width="400" height="80" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="400" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">
    Inhabited Type X
  </text>
  <text x="400" y="320" text-anchor="middle" font-size="12" fill="#555">
    default : X  (witness of inhabitedness)
  </text>
  <text x="400" y="338" text-anchor="middle" font-size="11" fill="#888" font-style="italic">
    Discrete category: only identity morphisms
  </text>
  
  <!-- Arrows from inhabited type to comonads -->
  <line x1="300" y1="270" x2="150" y2="245" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="500" y1="270" x2="650" y2="245" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="5,5"/>
  
  <!-- Bottom: Universal Property = True -->
  <rect x="200" y="380" width="400" height="70" rx="10" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2.5"/>
  <text x="400" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#6A1B9A">
    Universal Property: True
  </text>
  <text x="400" y="435" text-anchor="middle" font-size="12" fill="#7B1FA2">
    Lean 4 proof: trivial
  </text>
  
  <!-- Arrow from Identity to Universal Property -->
  <line x1="650" y1="245" x2="500" y2="380" stroke="#9C27B0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Side annotations -->
  <!-- Physics -->
  <rect x="40" y="290" width="130" height="50" rx="8" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1"/>
  <text x="105" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">Physics</text>
  <text x="105" y="328" text-anchor="middle" font-size="9" fill="#1976D2">Causal structure</text>
  
  <!-- Crypto -->
  <rect x="630" y="290" width="130" height="50" rx="8" fill="#FDE0DC" stroke="#EF9A9A" stroke-width="1"/>
  <text x="695" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">Cryptography</text>
  <text x="695" y="328" text-anchor="middle" font-size="9" fill="#D32F2F">Zero-knowledge base</text>
  
  <!-- Homotopy -->
  <rect x="40" y="380" width="130" height="50" rx="8" fill="#E8F5E9" stroke="#81C784" stroke-width="1"/>
  <text x="105" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Homotopy</text>
  <text x="105" y="418" text-anchor="middle" font-size="9" fill="#388E3C">Contractible space</text>
  
  <!-- Kolmogorov -->
  <rect x="630" y="380" width="130" height="50" rx="8" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1"/>
  <text x="695" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#F57F17">Kolmogorov</text>
  <text x="695" y="418" text-anchor="middle" font-size="9" fill="#F9A825">K(invariant) = O(1)</text>
  
  <!-- Connecting lines from side boxes to center -->
  <line x1="170" y1="315" x2="200" y2="310" stroke="#64B5F6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="630" y1="315" x2="600" y2="310" stroke="#EF9A9A" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="170" y1="405" x2="200" y2="415" stroke="#81C784" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="630" y1="405" x2="600" y2="415" stroke="#FFD54F" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Caption -->
  <text x="400" y="485" text-anchor="middle" font-size="11" fill="#555">
    Figure 1: The finitary separated comonad on a discrete inhabited category collapses to the identity,
  </text>
  <text x="400" y="502" text-anchor="middle" font-size="11" fill="#555">
    yielding a trivial universal property that bridges physics, homotopy theory, and cryptography.
  </text>
</svg>
