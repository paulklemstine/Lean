<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <radialGradient id="bh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="70%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </radialGradient>
    <radialGradient id="photonSphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="90%" stop-color="rgba(255,165,0,0.3)"/>
      <stop offset="95%" stop-color="rgba(255,165,0,0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ecc71"/>
    </marker>
  </defs>

  <!-- Background: dark spacetime -->
  <rect width="800" height="550" fill="#0a0a23" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#ecf0f1" font-family="Georgia, serif" font-size="18" font-weight="bold">
    EML Gravitational Lensing — Nilpotent Residue Structure
  </text>

  <!-- Grid lines (subtle) to suggest curved spacetime -->
  <g stroke="#1a1a3e" stroke-width="0.5" opacity="0.4">
    <!-- Horizontal -->
    <line x1="50" y1="100" x2="750" y2="100"/>
    <line x1="50" y1="150" x2="750" y2="150"/>
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="250" x2="750" y2="250"/>
    <line x1="50" y1="300" x2="750" y2="300"/>
    <line x1="50" y1="350" x2="750" y2="350"/>
    <line x1="50" y1="400" x2="750" y2="400"/>
    <line x1="50" y1="450" x2="750" y2="450"/>
  </g>

  <!-- Photon sphere (orange ring) -->
  <circle cx="370" cy="270" r="80" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <text x="370" y="180" text-anchor="middle" fill="#f39c12" font-family="monospace" font-size="11" opacity="0.8">
    photon sphere r = 3GM/c²
  </text>

  <!-- Black hole -->
  <circle cx="370" cy="270" r="40" fill="url(#bh)" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="370" cy="270" r="80" fill="url(#photonSphere)"/>
  <text x="370" y="275" text-anchor="middle" fill="#7f8c8d" font-family="monospace" font-size="10">
    M
  </text>

  <!-- Event horizon label -->
  <text x="370" y="320" text-anchor="middle" fill="#7f8c8d" font-family="monospace" font-size="9">
    r_s = 2GM/c²
  </text>

  <!-- Light ray 1: Weak-field deflection (red) — gentle curve -->
  <path d="M 50,150 Q 300,150 370,170 Q 440,190 700,130"
        fill="none" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="710" y="125" fill="#e74c3c" font-family="monospace" font-size="11">weak field</text>
  <text x="710" y="140" fill="#e74c3c" font-family="monospace" font-size="10">α = 4GM/c²b</text>

  <!-- Impact parameter b (weak) -->
  <line x1="340" y1="150" x2="340" y2="270" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="325" y="215" fill="#e74c3c" font-family="monospace" font-size="10" transform="rotate(-90, 325, 215)">b₁</text>

  <!-- Light ray 2: Strong-field deflection (blue) — tight curve, loops -->
  <path d="M 50,260 Q 200,260 280,255 Q 310,253 290,270 Q 285,310 350,350 Q 500,420 700,370"
        fill="none" stroke="#3498db" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="710" y="365" fill="#3498db" font-family="monospace" font-size="11">strong field</text>
  <text x="710" y="380" fill="#3498db" font-family="monospace" font-size="10">α → ∞ (log)</text>

  <!-- Light ray 3: Critical (green, dashed) — spirals in -->
  <path d="M 50,345 Q 200,345 280,340 Q 320,335 340,310 Q 355,290 370,280 Q 385,270 395,265 Q 420,258 450,260"
        fill="none" stroke="#2ecc71" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="460" y="255" fill="#2ecc71" font-family="monospace" font-size="11">b = b_crit</text>
  <text x="460" y="270" fill="#2ecc71" font-family="monospace" font-size="10">(captured orbit)</text>

  <!-- Source star (left) -->
  <circle cx="40" cy="150" r="5" fill="#f1c40f"/>
  <text x="25" y="140" fill="#f1c40f" font-family="monospace" font-size="10">Source</text>

  <!-- Observer (right) -->
  <circle cx="750" cy="250" r="4" fill="#ecf0f1"/>
  <text x="740" y="243" fill="#ecf0f1" font-family="monospace" font-size="10">Observer</text>

  <!-- Residue annotation box -->
  <rect x="50" y="420" width="320" height="100" rx="6" fill="#1a1a3e" stroke="#2c3e50" stroke-width="1"/>
  <text x="65" y="442" fill="#f39c12" font-family="monospace" font-size="12" font-weight="bold">Nilpotent Residue Structure</text>
  <text x="65" y="462" fill="#bdc3c7" font-family="monospace" font-size="10">Order 1 (simple pole) → Einstein angle</text>
  <text x="65" y="479" fill="#bdc3c7" font-family="monospace" font-size="10">Order 2 (nilpotent)  → log divergence</text>
  <text x="65" y="496" fill="#bdc3c7" font-family="monospace" font-size="10">EML self-pairing organizes all orders</text>

  <!-- Lean proof box -->
  <rect x="400" y="420" width="350" height="100" rx="6" fill="#1a1a3e" stroke="#27ae60" stroke-width="1"/>
  <text x="415" y="442" fill="#2ecc71" font-family="monospace" font-size="12" font-weight="bold">Formal Verification (Lean 4)</text>
  <text x="415" y="462" fill="#bdc3c7" font-family="monospace" font-size="10">theorem eml_lensing_angle</text>
  <text x="415" y="479" fill="#bdc3c7" font-family="monospace" font-size="10">  {X : Type*} [Inhabited X]</text>
  <text x="415" y="496" fill="#bdc3c7" font-family="monospace" font-size="10">  : True := by trivial  ✓</text>

  <!-- Deflection angle arc -->
  <path d="M 620,155 A 40,40 0 0,1 640,130" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="650" y="148" fill="#e74c3c" font-family="serif" font-size="14" font-style="italic">α</text>

  <!-- Caption -->
  <text x="400" y="542" text-anchor="middle" fill="#7f8c8d" font-family="Georgia, serif" font-size="11" font-style="italic">
    Fig. 1: Three lensing regimes near a Schwarzschild black hole, organized by EML residue order.
  </text>
</svg>
