<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="quantumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="tropicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.08"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f46e5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">
    Quantum Resolved Extension Protocol
  </text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">
    Universal Property via Tropical Duality
  </text>

  <!-- ===== QUANTUM STATE SPACE (left) ===== -->
  <rect x="40" y="85" width="250" height="220" rx="16" fill="url(#quantumGrad)" stroke="#6366f1" stroke-width="2"/>
  <text x="165" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">Quantum State Space X</text>
  <text x="165" y="130" text-anchor="middle" font-size="11" fill="#6366f1">[Inhabited X]</text>

  <!-- States as circles -->
  <circle cx="100" cy="175" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="100" y="180" text-anchor="middle" font-size="11" fill="#5b21b6">|ψ₁⟩</text>

  <circle cx="180" cy="165" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="180" y="170" text-anchor="middle" font-size="11" fill="#5b21b6">|ψ₂⟩</text>

  <circle cx="230" cy="210" r="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="230" y="215" text-anchor="middle" font-size="10" fill="#5b21b6">|ψₙ⟩</text>

  <!-- Default state (highlighted) -->
  <circle cx="130" cy="250" r="26" fill="#c4b5fd" stroke="#7c3aed" stroke-width="3"/>
  <text x="130" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b0764">x₀</text>
  <text x="130" y="262" text-anchor="middle" font-size="9" fill="#5b21b6">default</text>

  <!-- Entanglement lines -->
  <line x1="118" y1="178" x2="162" y2="170" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="195" y1="175" x2="220" y2="198" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="110" y1="193" x2="125" y2="228" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- ===== RESOLVED EXTENSION (center) ===== -->
  <rect x="370" y="85" width="200" height="220" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="470" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#059669">Resolved Extension</text>
  <text x="470" y="130" text-anchor="middle" font-size="11" fill="#059669">E(X)</text>

  <!-- Universal element -->
  <circle cx="470" cy="200" r="40" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
  <text x="470" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#064e3b">True</text>
  <text x="470" y="212" text-anchor="middle" font-size="10" fill="#065f46">terminal</text>

  <!-- Star decoration for universal property -->
  <text x="430" y="160" font-size="16" fill="#10b981">✦</text>
  <text x="505" y="165" font-size="14" fill="#10b981">✦</text>
  <text x="445" y="260" font-size="12" fill="#10b981">✦</text>
  <text x="495" y="275" font-size="14" fill="#10b981">✦</text>

  <!-- ===== TROPICAL SEMIRING (right) ===== -->
  <rect x="650" y="85" width="210" height="220" rx="16" fill="url(#tropicalGrad)" stroke="#d97706" stroke-width="2"/>
  <text x="755" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Tropical Semiring</text>
  <text x="755" y="130" text-anchor="middle" font-size="11" fill="#d97706">(ℝ ∪ {∞}, min, +)</text>

  <!-- Tropical polytope -->
  <polygon points="700,170 810,190 780,270 690,250" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="700" cy="170" r="5" fill="#f59e0b"/>
  <circle cx="810" cy="190" r="5" fill="#f59e0b"/>
  <circle cx="780" cy="270" r="5" fill="#f59e0b"/>
  <circle cx="690" cy="250" r="5" fill="#f59e0b"/>

  <text x="740" y="225" text-anchor="middle" font-size="11" fill="#92400e">Tropical</text>
  <text x="740" y="240" text-anchor="middle" font-size="11" fill="#92400e">Polytope</text>

  <!-- ===== ARROWS ===== -->

  <!-- X → E(X): resolved extension morphism -->
  <line x1="290" y1="195" x2="360" y2="195" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="325" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#4f46e5">φ</text>
  <text x="325" y="215" text-anchor="middle" font-size="9" fill="#6366f1">resolved</text>
  <text x="325" y="227" text-anchor="middle" font-size="9" fill="#6366f1">extension</text>

  <!-- X → Tropical: tropical valuation -->
  <path d="M 270 280 Q 450 380 650 250" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowOrange)"/>
  <text x="430" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">v</text>
  <text x="430" y="356" text-anchor="middle" font-size="9" fill="#d97706">tropical valuation</text>
  <text x="430" y="368" text-anchor="middle" font-size="9" fill="#d97706">v(z) = −log|z|</text>

  <!-- E(X) → Tropical: induced morphism -->
  <line x1="570" y1="200" x2="645" y2="215" stroke="#059669" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="610" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">∃!</text>

  <!-- ===== UNIVERSAL PROPERTY DIAGRAM (bottom) ===== -->
  <rect x="60" y="380" width="780" height="200" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Universal Property — Commutative Diagram</text>

  <!-- Objects -->
  <circle cx="180" cy="480" r="35" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="180" y="476" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6">X</text>
  <text x="180" y="495" text-anchor="middle" font-size="10" fill="#7c3aed">[Inhabited]</text>

  <circle cx="450" cy="430" r="32" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="450" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">E(X)</text>

  <circle cx="450" cy="540" r="32" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="450" y="545" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">T</text>

  <circle cx="720" cy="480" r="35" fill="#fce7f3" stroke="#dc2626" stroke-width="2.5"/>
  <text x="720" y="476" text-anchor="middle" font-size="14" font-weight="bold" fill="#9f1239">True</text>
  <text x="720" y="495" text-anchor="middle" font-size="10" fill="#dc2626">terminal</text>

  <!-- Arrows in commutative diagram -->
  <line x1="212" y1="462" x2="420" y2="438" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="310" y="440" text-anchor="middle" font-size="12" fill="#4f46e5">φ</text>

  <line x1="212" y1="500" x2="420" y2="530" stroke="#d97706" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="310" y="530" text-anchor="middle" font-size="12" fill="#d97706">v</text>

  <line x1="450" y1="462" x2="450" y2="508" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="465" y="490" text-anchor="middle" font-size="11" fill="#059669">∃! ψ</text>

  <line x1="480" y1="425" x2="688" y2="470" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="590" y="440" text-anchor="middle" font-size="11" fill="#dc2626">trivial</text>

  <line x1="480" y1="545" x2="688" y2="490" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="590" y="535" text-anchor="middle" font-size="11" fill="#dc2626">trivial</text>

  <!-- Legend -->
  <text x="720" y="555" text-anchor="middle" font-size="9" fill="#64748b">T = Tropical Semiring</text>

  <!-- Caption -->
  <text x="450" y="630" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">
    The resolved extension E(X) satisfies the universal property: every morphism from X to T
  </text>
  <text x="450" y="646" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">
    factors uniquely through E(X). Both paths to True commute, yielding the QREP theorem.
  </text>
</svg>
