<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2266aa"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc3333"/>
    </marker>
    <linearGradient id="tropicalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#2ecc71;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.15"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#fafafa" rx="8"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Holomorphic Flat Phase Scheme
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7f8c8d">
    Tropical Geometry × Neural Networks × Sheaf Theory
  </text>

  <!-- ================================================================ -->
  <!-- LEFT: Neural Network / Tropical Space -->
  <!-- ================================================================ -->
  <rect x="30" y="75" width="260" height="250" rx="10" fill="url(#tropicalGrad)" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="100" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1a5276">
    Activation Tropical Space
  </text>
  <text x="160" y="116" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a5276">
    𝒯(𝒜)
  </text>

  <!-- Piecewise linear function (tropical polynomial) -->
  <polyline points="50,280 90,280 120,260 160,220 190,200 220,160 250,140 270,140"
            fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Flat phase region (shaded) -->
  <rect x="50" y="260" width="70" height="25" fill="#3498db" opacity="0.25" rx="3"/>
  <text x="85" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#2266aa" font-weight="bold">
    Φ₀ (flat phase)
  </text>
  
  <!-- Breakpoints (tropical hypersurface vertices) -->
  <circle cx="90" cy="280" r="4" fill="#e74c3c"/>
  <circle cx="120" cy="260" r="4" fill="#e74c3c"/>
  <circle cx="160" cy="220" r="4" fill="#e74c3c"/>
  <circle cx="190" cy="200" r="4" fill="#e74c3c"/>
  <circle cx="220" cy="160" r="4" fill="#e74c3c"/>
  
  <text x="230" y="150" font-family="monospace" font-size="9" fill="#e74c3c">breakpoints</text>
  <text x="160" y="175" font-family="monospace" font-size="9" fill="#7f8c8d">ReLU = x ⊕ 0</text>
  
  <!-- Axes -->
  <line x1="45" y1="285" x2="275" y2="285" stroke="#bbb" stroke-width="1"/>
  <line x1="45" y1="135" x2="45" y2="285" stroke="#bbb" stroke-width="1"/>
  <text x="270" y="298" font-family="monospace" font-size="9" fill="#999">x</text>
  <text x="38" y="145" font-family="monospace" font-size="9" fill="#999">f</text>

  <!-- ================================================================ -->
  <!-- CENTER: Sheaf / Functor Diagram -->
  <!-- ================================================================ -->
  <rect x="320" y="75" width="260" height="250" rx="10" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="100" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#8e44ad">
    Feature Sheaf ℱ
  </text>
  
  <!-- Open cover diagram -->
  <ellipse cx="400" cy="180" rx="55" ry="35" fill="#af7ac5" opacity="0.2" stroke="#8e44ad" stroke-width="1"/>
  <ellipse cx="480" cy="180" rx="55" ry="35" fill="#5dade2" opacity="0.2" stroke="#2266aa" stroke-width="1"/>
  <ellipse cx="440" cy="230" rx="55" ry="35" fill="#58d68d" opacity="0.2" stroke="#27ae60" stroke-width="1"/>
  
  <text x="380" y="175" font-family="monospace" font-size="10" fill="#8e44ad">U₁</text>
  <text x="500" y="175" font-family="monospace" font-size="10" fill="#2266aa">U₂</text>
  <text x="440" y="245" font-family="monospace" font-size="10" fill="#27ae60">U₃</text>
  
  <!-- Sections labels -->
  <text x="375" y="195" font-family="monospace" font-size="9" fill="#666">ℱ(U₁)</text>
  <text x="490" y="195" font-family="monospace" font-size="9" fill="#666">ℱ(U₂)</text>
  <text x="425" y="260" font-family="monospace" font-size="9" fill="#666">ℱ(U₃)</text>
  
  <!-- Overlap region -->
  <text x="440" y="185" font-family="monospace" font-size="8" fill="#333" text-anchor="middle">glue</text>
  
  <!-- Restriction arrows -->
  <text x="450" y="290" text-anchor="middle" font-family="monospace" font-size="10" fill="#8e44ad">
    Sections = feature maps
  </text>
  <text x="450" y="305" text-anchor="middle" font-family="monospace" font-size="10" fill="#8e44ad">
    Restrictions = projections
  </text>

  <!-- ================================================================ -->
  <!-- RIGHT: Cotangent Functor (Backprop) -->
  <!-- ================================================================ -->
  <rect x="610" y="75" width="260" height="250" rx="10" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="100" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e67e22">
    Cotangent Functor T*𝒜
  </text>
  <text x="740" y="116" text-anchor="middle" font-family="monospace" font-size="11" fill="#e67e22">
    (Backpropagation)
  </text>

  <!-- Neural network layers -->
  <!-- Input layer -->
  <circle cx="660" cy="170" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <circle cx="660" cy="210" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="640" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c3e50">L₀</text>
  
  <!-- Hidden layer -->
  <circle cx="740" cy="150" r="12" fill="#2ecc71" stroke="#2c3e50" stroke-width="1.5"/>
  <circle cx="740" cy="190" r="12" fill="#2ecc71" stroke="#2c3e50" stroke-width="1.5"/>
  <circle cx="740" cy="230" r="12" fill="#2ecc71" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="740" y="255" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c3e50">L₁</text>
  
  <!-- Output layer -->
  <circle cx="820" cy="190" r="12" fill="#e74c3c" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="840" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c3e50">L₂</text>
  
  <!-- Forward arrows (thin) -->
  <line x1="672" y1="170" x2="728" y2="150" stroke="#bbb" stroke-width="1"/>
  <line x1="672" y1="170" x2="728" y2="190" stroke="#bbb" stroke-width="1"/>
  <line x1="672" y1="170" x2="728" y2="230" stroke="#bbb" stroke-width="1"/>
  <line x1="672" y1="210" x2="728" y2="150" stroke="#bbb" stroke-width="1"/>
  <line x1="672" y1="210" x2="728" y2="190" stroke="#bbb" stroke-width="1"/>
  <line x1="672" y1="210" x2="728" y2="230" stroke="#bbb" stroke-width="1"/>
  <line x1="752" y1="150" x2="808" y2="190" stroke="#bbb" stroke-width="1"/>
  <line x1="752" y1="190" x2="808" y2="190" stroke="#bbb" stroke-width="1"/>
  <line x1="752" y1="230" x2="808" y2="190" stroke="#bbb" stroke-width="1"/>
  
  <!-- Backprop arrows (bold, reversed) -->
  <line x1="808" y1="185" x2="755" y2="148" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
  <line x1="808" y1="190" x2="755" y2="190" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
  <line x1="808" y1="195" x2="755" y2="232" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <text x="740" y="285" text-anchor="middle" font-family="monospace" font-size="10" fill="#e67e22">
    T*: Layer^op → TropMod
  </text>
  <text x="740" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#e67e22">
    Chain rule = functoriality
  </text>

  <!-- ================================================================ -->
  <!-- BOTTOM: Universal Property & Invariant -->
  <!-- ================================================================ -->
  <rect x="30" y="345" width="840" height="130" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="370" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#27ae60">
    Universal Property of the Flat Phase
  </text>
  
  <!-- Commutative diagram -->
  <!-- Free module -->
  <text x="120" y="410" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="#2c3e50">F</text>
  <text x="120" y="425" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">(free tropical</text>
  <text x="120" y="436" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">module)</text>
  
  <!-- Activation map -->
  <text x="350" y="410" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="#2c3e50">A</text>
  <text x="350" y="425" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">(activation</text>
  <text x="350" y="436" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">module)</text>
  
  <!-- Flat phase -->
  <text x="240" y="465" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#27ae60">Φ₀</text>
  <text x="240" y="455" text-anchor="middle" font-family="monospace" font-size="9" fill="#27ae60">(flat phase)</text>
  
  <!-- Arrows -->
  <line x1="145" y1="405" x2="320" y2="405" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="230" y="398" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="#333">φ</text>
  
  <line x1="145" y1="420" x2="220" y2="452" stroke="#2266aa" stroke-width="1.5" marker-end="url(#arrowhead-blue)" stroke-dasharray="5,3"/>
  <text x="170" y="445" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="#2266aa">∃! ψ</text>
  
  <line x1="260" y1="458" x2="330" y2="420" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="310" y="445" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="#27ae60">ι</text>

  <!-- Invariant box -->
  <rect x="500" y="390" width="350" height="70" rx="8" fill="white" stroke="#2c3e50" stroke-width="1"/>
  <text x="675" y="415" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#2c3e50">
    Tropical Kolmogorov Invariant
  </text>
  <text x="675" y="438" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#e74c3c">
    K(𝒜) = dim_T H⁰(𝒯(𝒜), ℱ) = #linear regions
  </text>

  <!-- ================================================================ -->
  <!-- CONNECTING ARROWS between main boxes -->
  <!-- ================================================================ -->
  <!-- Left to Center -->
  <line x1="290" y1="200" x2="320" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="305" y="193" text-anchor="middle" font-family="monospace" font-size="8" fill="#333">sheafify</text>
  
  <!-- Center to Right -->
  <line x1="580" y1="200" x2="610" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="595" y="193" text-anchor="middle" font-family="monospace" font-size="8" fill="#333">T*</text>

  <!-- ================================================================ -->
  <!-- Bottom: Formal verification badge -->
  <!-- ================================================================ -->
  <rect x="300" y="495" width="300" height="40" rx="8" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="450" y="517" text-anchor="middle" font-family="monospace" font-size="12" fill="white">
    ✓ Verified in Lean 4 + Mathlib
  </text>
  <text x="450" y="530" text-anchor="middle" font-family="monospace" font-size="9" fill="#95a5a6">
    holomorphic_flat_phase_scheme_97d8
  </text>

  <!-- Caption -->
  <text x="450" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d">
    Figure 1: The holomorphic flat phase scheme connects three mathematical worlds:
  </text>
  <text x="450" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d">
    tropical geometry (left), sheaf theory (center), and categorical algebra (right).
  </text>
  <text x="450" y="609" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d">
    The flat phase Φ₀ satisfies a universal property (bottom), yielding the invariant K(𝒜).
  </text>
</svg>
