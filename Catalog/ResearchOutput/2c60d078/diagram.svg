<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#457b9d"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e63946"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="10"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2b2d42">
    Parametrized Perfect Complex Identity (f7d0)
  </text>

  <!-- Left box: Inhabited Type X -->
  <rect x="40" y="80" width="200" height="160" rx="12" fill="#d8e2dc" stroke="#457b9d" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="110" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1d3557">X : Type*</text>
  <text x="140" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#457b9d">[Inhabited X]</text>

  <!-- Points in X -->
  <circle cx="90" cy="175" r="8" fill="#e63946" stroke="#fff" stroke-width="2"/>
  <text x="90" y="200" text-anchor="middle" font-size="10" fill="#333">default</text>
  <circle cx="130" cy="165" r="6" fill="#457b9d" opacity="0.7"/>
  <circle cx="160" cy="185" r="6" fill="#457b9d" opacity="0.7"/>
  <circle cx="185" cy="160" r="6" fill="#457b9d" opacity="0.7"/>
  <circle cx="110" cy="195" r="6" fill="#457b9d" opacity="0.5"/>

  <!-- Center: Parameter space -->
  <rect x="300" y="80" width="200" height="160" rx="12" fill="#fce4ec" stroke="#e63946" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="110" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#c1121f">Parameter t</text>
  <text x="400" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e63946">t ∈ [0, 1]</text>

  <!-- Parameter line -->
  <line x1="320" y1="180" x2="480" y2="180" stroke="#e63946" stroke-width="3" stroke-linecap="round"/>
  <circle cx="320" cy="180" r="6" fill="#e63946"/>
  <text x="320" y="205" text-anchor="middle" font-size="11" fill="#333">t=0</text>
  <text x="320" y="220" text-anchor="middle" font-size="10" fill="#e63946" font-weight="bold">Identity</text>
  <circle cx="480" cy="180" r="5" fill="#e63946" opacity="0.5"/>
  <text x="480" y="205" text-anchor="middle" font-size="11" fill="#333">t=1</text>

  <!-- Right box: Proposition True -->
  <rect x="560" y="80" width="200" height="160" rx="12" fill="#d4edda" stroke="#2a9d8f" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="115" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#264653">True</text>
  <text x="660" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2a9d8f">Universal Property</text>
  <text x="660" y="170" text-anchor="middle" font-family="monospace" font-size="13" fill="#264653">proof: trivial</text>

  <!-- Check mark -->
  <text x="660" y="215" text-anchor="middle" font-size="36" fill="#2a9d8f">✓</text>

  <!-- Arrows -->
  <line x1="245" y1="160" x2="295" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="270" y="152" text-anchor="middle" font-size="10" fill="#666">param</text>

  <line x1="505" y1="160" x2="555" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="530" y="152" text-anchor="middle" font-size="10" fill="#666">∀ X</text>

  <!-- Bottom section: Spectral Sequence Diagram -->
  <rect x="40" y="280" width="720" height="200" rx="12" fill="#fff" stroke="#adb5bd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#2b2d42">
    Spectral Sequence: Perfect Complex → Identity
  </text>

  <!-- E_0 page -->
  <rect x="70" y="330" width="120" height="80" rx="8" fill="#dbeafe" stroke="#457b9d" stroke-width="1.5"/>
  <text x="130" y="355" text-anchor="middle" font-family="monospace" font-size="14" fill="#1d3557">E₀</text>
  <text x="130" y="375" text-anchor="middle" font-size="11" fill="#457b9d">Complex(X)</text>
  <text x="130" y="395" text-anchor="middle" font-size="10" fill="#666">chains</text>

  <!-- E_1 page -->
  <rect x="240" y="330" width="120" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="300" y="355" text-anchor="middle" font-family="monospace" font-size="14" fill="#92400e">E₁</text>
  <text x="300" y="375" text-anchor="middle" font-size="11" fill="#d97706">Homology</text>
  <text x="300" y="395" text-anchor="middle" font-size="10" fill="#666">derived</text>

  <!-- E_2 page -->
  <rect x="410" y="330" width="120" height="80" rx="8" fill="#fce4ec" stroke="#e63946" stroke-width="1.5"/>
  <text x="470" y="355" text-anchor="middle" font-family="monospace" font-size="14" fill="#c1121f">E₂</text>
  <text x="470" y="375" text-anchor="middle" font-size="11" fill="#e63946">p-adic</text>
  <text x="470" y="395" text-anchor="middle" font-size="10" fill="#666">filtration</text>

  <!-- E_∞ page -->
  <rect x="580" y="330" width="140" height="80" rx="8" fill="#d4edda" stroke="#2a9d8f" stroke-width="2"/>
  <text x="650" y="355" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#264653">E∞ = True</text>
  <text x="650" y="375" text-anchor="middle" font-size="11" fill="#2a9d8f">Collapse</text>
  <text x="650" y="395" text-anchor="middle" font-size="10" fill="#666">trivial</text>

  <!-- Arrows between pages -->
  <line x1="195" y1="370" x2="235" y2="370" stroke="#457b9d" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="215" y="362" text-anchor="middle" font-size="9" fill="#457b9d">d₀</text>

  <line x1="365" y1="370" x2="405" y2="370" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="385" y="362" text-anchor="middle" font-size="9" fill="#d97706">d₁</text>

  <line x1="535" y1="370" x2="575" y2="370" stroke="#e63946" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="555" y="362" text-anchor="middle" font-size="9" fill="#e63946">d₂</text>

  <!-- Convergence annotation -->
  <text x="400" y="450" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#495057">
    The spectral sequence degenerates at E₂, yielding the universal identity True.
  </text>

  <!-- Caption -->
  <text x="400" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#495057">
    Figure 1: The parametrized perfect complex identity as a collapsing spectral sequence.
  </text>
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6c757d">
    For any inhabited type X, the parametrized family M(t) satisfies M(0) = Id,
  </text>
  <text x="400" y="578" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6c757d">
    and the spectral sequence of the associated filtered complex collapses to True.
  </text>
</svg>
