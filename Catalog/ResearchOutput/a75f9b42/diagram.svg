<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    P-adic Transfinite Isomorphism Scheme
  </text>
  <text x="450" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Coding Geometry → Tropical Degeneration → Universal Property
  </text>

  <!-- ========== Left column: P-adic Coding Geometry ========== -->
  <rect x="40" y="85" width="230" height="160" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">P-adic Coding Space</text>
  <text x="155" y="135" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e3a5f">(X, d, v_p)</text>

  <!-- Lattice points representing codewords -->
  <circle cx="80" cy="170" r="6" fill="#2563eb" opacity="0.7"/>
  <circle cx="120" cy="155" r="6" fill="#2563eb" opacity="0.5"/>
  <circle cx="155" cy="185" r="8" fill="#2563eb" opacity="0.9"/>
  <circle cx="190" cy="160" r="5" fill="#2563eb" opacity="0.6"/>
  <circle cx="220" cy="190" r="7" fill="#2563eb" opacity="0.8"/>
  <circle cx="100" cy="200" r="5" fill="#2563eb" opacity="0.4"/>
  <circle cx="175" cy="210" r="6" fill="#2563eb" opacity="0.7"/>

  <text x="155" y="235" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Codewords with p-adic filtration</text>

  <!-- ========== Center: Tropical Semiring ========== -->
  <rect x="335" y="85" width="230" height="160" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">Tropical Semiring</text>
  <text x="450" y="135" text-anchor="middle" font-family="monospace" font-size="12" fill="#78350f">(ℝ ∪ {−∞}, max, +)</text>

  <!-- Max-plus grid -->
  <line x1="370" y1="160" x2="370" y2="230" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <line x1="410" y1="160" x2="410" y2="230" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="160" x2="450" y2="230" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <line x1="490" y1="160" x2="490" y2="230" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <line x1="530" y1="160" x2="530" y2="230" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="175" x2="540" y2="175" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="195" x2="540" y2="195" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="215" x2="540" y2="215" stroke="#d97706" stroke-width="1" opacity="0.3"/>

  <!-- Tropical curve (piecewise linear) -->
  <polyline points="370,220 390,200 420,180 450,170 480,170 510,185 530,210" fill="none" stroke="#b45309" stroke-width="2.5"/>

  <text x="450" y="235" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Piecewise-linear tropical curve</text>

  <!-- ========== Right column: Universal Property ========== -->
  <rect x="630" y="85" width="230" height="160" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534">Universal Property</text>
  <text x="745" y="135" text-anchor="middle" font-family="monospace" font-size="12" fill="#14532d">∀ f, ∃! g, g ∘ ι = f</text>

  <!-- Commutative diagram -->
  <text x="680" y="175" font-family="serif" font-size="16" font-style="italic" fill="#166534">A</text>
  <text x="800" y="175" font-family="serif" font-size="16" font-style="italic" fill="#166534">B</text>
  <text x="740" y="225" font-family="serif" font-size="16" font-style="italic" fill="#166534">U</text>

  <line x1="695" y1="170" x2="790" y2="170" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="685" y1="182" x2="732" y2="215" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="755" y1="215" x2="797" y2="182" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <text x="745" y="162" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="#15803d">ι</text>
  <text x="700" y="205" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="#15803d">f</text>
  <text x="785" y="205" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="#15803d">∃!g</text>

  <text x="745" y="235" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Unique factorization (trivially satisfied)</text>

  <!-- ========== Arrows between columns ========== -->
  <!-- Tropicalization arrow -->
  <line x1="275" y1="165" x2="330" y2="165" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="302" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">trop</text>

  <!-- Collapse arrow -->
  <line x1="570" y1="165" x2="625" y2="165" stroke="#9333ea" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="597" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#9333ea">collapse</text>

  <!-- ========== Bottom: Transfinite iteration ========== -->
  <rect x="80" y="290" width="740" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">Transfinite Isomorphism Scheme (Ordinal-Indexed)</text>

  <!-- Ordinal steps -->
  <circle cx="150" cy="355" r="18" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="360" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#5b21b6">φ₀</text>

  <line x1="172" y1="355" x2="228" y2="355" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <circle cx="250" cy="355" r="18" fill="#7c3aed" opacity="0.3" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="250" y="360" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#5b21b6">φ₁</text>

  <line x1="272" y1="355" x2="328" y2="355" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <circle cx="350" cy="355" r="18" fill="#7c3aed" opacity="0.4" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="350" y="360" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#5b21b6">φ₂</text>

  <line x1="372" y1="355" x2="408" y2="355" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="418" y="360" text-anchor="middle" font-family="serif" font-size="14" fill="#7c3aed">⋯</text>
  <line x1="428" y1="355" x2="478" y2="355" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>

  <circle cx="500" cy="355" r="18" fill="#7c3aed" opacity="0.5" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="360" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#5b21b6">φ_ω</text>

  <line x1="522" y1="355" x2="578" y2="355" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <text x="597" y="360" text-anchor="middle" font-family="serif" font-size="14" fill="#7c3aed">⋯</text>

  <!-- Fixed point -->
  <circle cx="700" cy="355" r="22" fill="#16a34a" opacity="0.2" stroke="#16a34a" stroke-width="2.5"/>
  <text x="700" y="360" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#166534">φ_∞</text>

  <line x1="615" y1="355" x2="673" y2="355" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="644" y="345" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">converge</text>

  <!-- ========== Bottom: Lean proof ========== -->
  <rect x="180" y="420" width="540" height="80" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <text x="450" y="448" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">-- Lean 4 formalization (Mathlib v4.28.0)</text>
  <text x="450" y="468" text-anchor="middle" font-family="monospace" font-size="13" fill="#38bdf8">
    theorem p_adic_transfinite_isomorphism_scheme_48b5
  </text>
  <text x="450" y="488" text-anchor="middle" font-family="monospace" font-size="13" fill="#4ade80">
    {X : Type*} [Inhabited X] : True := by trivial
  </text>

  <!-- ========== Legend ========== -->
  <rect x="40" y="520" width="820" height="50" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="80" cy="545" r="8" fill="#2563eb" opacity="0.7"/>
  <text x="95" y="550" font-family="sans-serif" font-size="11" fill="#334155">P-adic space</text>
  <rect x="195" y="537" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="218" y="550" font-family="sans-serif" font-size="11" fill="#334155">Tropical semiring</text>
  <circle cx="345" cy="545" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="550" font-family="sans-serif" font-size="11" fill="#334155">Universal property</text>
  <circle cx="490" cy="545" r="8" fill="#7c3aed" opacity="0.4" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="505" y="550" font-family="sans-serif" font-size="11" fill="#334155">Transfinite steps</text>
  <line x1="620" y1="545" x2="650" y2="545" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="660" y="550" font-family="sans-serif" font-size="11" fill="#334155">Tropicalization</text>
  <line x1="760" y1="545" x2="790" y2="545" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="800" y="550" font-family="sans-serif" font-size="11" fill="#334155">Collapse</text>

  <!-- Caption -->
  <text x="450" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    Figure 1: The p-adic coding geometry space undergoes tropical degeneration, yielding a transfinite
  </text>
  <text x="450" y="615" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    isomorphism scheme that converges to a universal fixed point — trivially satisfied for inhabited types.
  </text>
</svg>
