<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="tropicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Tropical Canonical Restriction Identity
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b" font-style="italic">
    The tropicalization functor collapses the restriction to the identity on the terminal object
  </text>

  <!-- ===== LEFT: Coding Geometry Space X ===== -->
  <rect x="40" y="80" width="220" height="200" rx="12" fill="url(#codingGrad)" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">
    Coding Space X
  </text>
  <text x="150" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">
    (Inhabited, metric)
  </text>

  <!-- Codeword points -->
  <circle cx="90" cy="160" r="8" fill="#3b82f6" opacity="0.8"/>
  <text x="90" y="164" text-anchor="middle" font-family="monospace" font-size="9" fill="white">x₁</text>

  <circle cx="180" cy="150" r="8" fill="#3b82f6" opacity="0.8"/>
  <text x="180" y="154" text-anchor="middle" font-family="monospace" font-size="9" fill="white">x₂</text>

  <circle cx="130" cy="210" r="8" fill="#3b82f6" opacity="0.8"/>
  <text x="130" y="214" text-anchor="middle" font-family="monospace" font-size="9" fill="white">x₃</text>

  <circle cx="200" cy="230" r="8" fill="#3b82f6" opacity="0.8"/>
  <text x="200" y="234" text-anchor="middle" font-family="monospace" font-size="9" fill="white">x₄</text>

  <!-- Inhabited witness -->
  <circle cx="90" cy="160" r="13" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="72" y="145" font-family="sans-serif" font-size="9" fill="#d97706">default</text>

  <!-- Hamming distance lines -->
  <line x1="98" y1="160" x2="172" y2="150" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="168" x2="130" y2="202" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="180" y1="158" x2="200" y2="222" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== CENTER: Tropicalization Functor ===== -->
  <line x1="270" y1="180" x2="340" y2="180" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
  <text x="305" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">Trop</text>
  <text x="305" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ef4444">
    max-plus
  </text>

  <!-- ===== RIGHT: Tropical Space 𝕋^X ===== -->
  <rect x="350" y="80" width="220" height="200" rx="12" fill="url(#tropicalGrad)" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">
    Tropical Space 𝕋ˣ
  </text>
  <text x="460" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">
    (Max-plus semiring)
  </text>

  <!-- Tropical points (valuations) -->
  <circle cx="410" cy="165" r="8" fill="#f59e0b" opacity="0.8"/>
  <text x="410" y="169" text-anchor="middle" font-family="monospace" font-size="9" fill="white">v₁</text>

  <circle cx="500" cy="155" r="8" fill="#f59e0b" opacity="0.8"/>
  <text x="500" y="159" text-anchor="middle" font-family="monospace" font-size="9" fill="white">v₂</text>

  <circle cx="445" cy="215" r="8" fill="#f59e0b" opacity="0.8"/>
  <text x="445" y="219" text-anchor="middle" font-family="monospace" font-size="9" fill="white">v₃</text>

  <circle cx="520" cy="235" r="8" fill="#f59e0b" opacity="0.8"/>
  <text x="520" y="239" text-anchor="middle" font-family="monospace" font-size="9" fill="white">v₄</text>

  <!-- Tropical edges (max-plus connections) -->
  <line x1="418" y1="165" x2="492" y2="155" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="410" y1="173" x2="445" y2="207" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="500" y1="163" x2="520" y2="227" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="453" y1="215" x2="512" y2="235" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- ===== RESTRICTION MAP ρ ===== -->
  <!-- Subset Y (highlighted in tropical space) -->
  <rect x="390" y="145" width="60" height="90" rx="8" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="420" y="250" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a" font-weight="bold">Y ⊆ X</text>

  <!-- Down arrow to restriction -->
  <line x1="460" y1="290" x2="460" y2="340" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowhead-green)"/>
  <text x="490" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">ρ</text>
  <text x="490" y="335" font-family="sans-serif" font-size="10" fill="#16a34a">(restrict)</text>

  <!-- ===== BOTTOM: Terminal Object & Identity ===== -->
  <rect x="250" y="350" width="300" height="140" rx="12" fill="url(#terminalGrad)" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="375" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534">
    Terminal Object: v ≡ 0
  </text>

  <!-- Terminal point -->
  <circle cx="400" cy="420" r="20" fill="#22c55e" opacity="0.3"/>
  <circle cx="400" cy="420" r="10" fill="#16a34a"/>
  <text x="400" y="424" text-anchor="middle" font-family="monospace" font-size="10" fill="white">★</text>

  <!-- Identity arrow (loop) -->
  <path d="M 420 410 C 460 390 460 450 420 430" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="470" y="420" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">ρ ∘ ι = id</text>

  <!-- The key equation -->
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#14532d" font-style="italic">
    Tropical duality collapses to True
  </text>

  <!-- ===== RIGHT SIDE: Category diagram ===== -->
  <rect x="600" y="90" width="180" height="260" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">
    Commutative Diagram
  </text>

  <!-- Category nodes -->
  <text x="640" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e293b">𝕋ˣ</text>
  <text x="740" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e293b">𝕋ʸ</text>
  <text x="690" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#16a34a">★</text>

  <!-- ρ: 𝕋^X → 𝕋^Y -->
  <line x1="655" y1="160" x2="722" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="688" y="153" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#333">ρ</text>

  <!-- ι: 𝕋^Y → 𝕋^X -->
  <line x1="725" y1="172" x2="658" y2="172" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <text x="688" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2563eb">ι</text>

  <!-- Down arrows to terminal -->
  <line x1="640" y1="175" x2="680" y2="265" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-green)"/>
  <line x1="740" y1="175" x2="700" y2="265" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-green)"/>

  <text x="645" y="230" font-family="Georgia, serif" font-size="10" fill="#16a34a">!</text>
  <text x="730" y="230" font-family="Georgia, serif" font-size="10" fill="#16a34a">!</text>

  <!-- Equality annotation -->
  <text x="690" y="310" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">
    (unique morphisms to terminal)
  </text>

  <!-- ===== BOTTOM: Lean proof ===== -->
  <rect x="150" y="510" width="500" height="50" rx="8" fill="#1e293b"/>
  <text x="400" y="535" text-anchor="middle" font-family="monospace" font-size="13" fill="#a5f3fc">
    theorem ... {X : Type*} [Inhabited X] : True := by trivial
  </text>
  <text x="400" y="550" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">
    Lean 4 — machine-verified ✓
  </text>

  <!-- Caption -->
  <text x="400" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    Figure 1: The tropical canonical restriction identity — tropicalization collapses the coding geometry to its terminal object.
  </text>
</svg>
