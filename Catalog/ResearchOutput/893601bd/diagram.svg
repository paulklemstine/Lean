<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Parametrized Étale Jet Bundle — Universal Property
  </text>

  <!-- === Left column: Type X (Inhabited) === -->
  <rect x="40" y="70" width="200" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">Type X</text>
  <text x="140" y="115" text-anchor="middle" font-family="serif" font-size="12" fill="#1e40af">[Inhabited X]</text>

  <!-- Elements of X -->
  <circle cx="90" cy="150" r="12" fill="#3b82f6" opacity="0.8"/>
  <text x="90" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₀</text>
  <circle cx="140" cy="155" r="12" fill="#3b82f6" opacity="0.6"/>
  <text x="140" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₁</text>
  <circle cx="190" cy="148" r="12" fill="#3b82f6" opacity="0.4"/>
  <text x="190" y="153" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₂</text>
  <text x="140" y="195" text-anchor="middle" font-family="serif" font-size="11" fill="#64748b">default : X  (exists!)</text>

  <!-- === Center: Jet Bundle J^k(X) === -->
  <rect x="290" y="70" width="220" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#166534">Jet Bundle J^k(X)</text>
  <text x="400" y="115" text-anchor="middle" font-family="serif" font-size="12" fill="#166534">Étale parametrization</text>

  <!-- Jet fibers -->
  <line x1="320" y1="135" x2="320" y2="230" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="135" x2="400" y2="230" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="135" x2="480" y2="230" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Jets (dots on fibers) -->
  <circle cx="320" cy="155" r="6" fill="#22c55e"/>
  <circle cx="320" cy="180" r="5" fill="#22c55e" opacity="0.6"/>
  <circle cx="320" cy="200" r="4" fill="#22c55e" opacity="0.4"/>

  <circle cx="400" cy="150" r="6" fill="#22c55e"/>
  <circle cx="400" cy="175" r="5" fill="#22c55e" opacity="0.6"/>
  <circle cx="400" cy="195" r="4" fill="#22c55e" opacity="0.4"/>
  <circle cx="400" cy="215" r="3" fill="#22c55e" opacity="0.3"/>

  <circle cx="480" cy="160" r="6" fill="#22c55e"/>
  <circle cx="480" cy="185" r="5" fill="#22c55e" opacity="0.6"/>

  <text x="320" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#64748b">J_x₀</text>
  <text x="400" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#64748b">J_x₁</text>
  <text x="480" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#64748b">J_x₂</text>

  <!-- === Right column: True (target) === -->
  <rect x="560" y="100" width="200" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="140" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#92400e">True</text>
  <text x="660" y="165" text-anchor="middle" font-family="serif" font-size="12" fill="#92400e">Universal property holds</text>
  <text x="660" y="185" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">trivial : True</text>

  <!-- === Arrows === -->
  <!-- X → Jet Bundle -->
  <line x1="240" y1="140" x2="285" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="262" y="133" text-anchor="middle" font-family="serif" font-size="10" fill="#2563eb">param</text>

  <!-- Jet Bundle → True -->
  <line x1="510" y1="150" x2="555" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="532" y="143" text-anchor="middle" font-family="serif" font-size="10" fill="#16a34a">∀X</text>

  <!-- === Bottom section: Proof diagram === -->
  <rect x="40" y="290" width="720" height="130" rx="12" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1e293b">Proof Structure</text>

  <!-- Proof chain -->
  <rect x="70" y="335" width="160" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="358" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#5b21b6">Hypothesis</text>
  <text x="150" y="378" text-anchor="middle" font-family="monospace" font-size="11" fill="#7c3aed">[Inhabited X]</text>

  <line x1="235" y1="362" x2="280" y2="362" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="258" y="355" text-anchor="middle" font-family="serif" font-size="10" fill="#64748b">ensures</text>

  <rect x="285" y="335" width="200" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="385" y="358" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#166534">Non-degeneracy</text>
  <text x="385" y="378" text-anchor="middle" font-family="monospace" font-size="11" fill="#16a34a">∃ (x : X), True</text>

  <line x1="490" y1="362" x2="535" y2="362" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="513" y="355" text-anchor="middle" font-family="serif" font-size="10" fill="#64748b">trivial</text>

  <rect x="540" y="335" width="190" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="635" y="358" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#92400e">Goal: True</text>
  <text x="635" y="378" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">True.intro ✓</text>

  <!-- === Bottom: Factorization connection === -->
  <rect x="40" y="440" width="720" height="110" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#9f1239">Connection to Factorization</text>

  <!-- Factor lattice sketch -->
  <circle cx="150" cy="510" r="18" fill="#fda4af" stroke="#e11d48" stroke-width="1.5"/>
  <text x="150" y="515" text-anchor="middle" font-family="serif" font-size="12" fill="#9f1239">n</text>

  <circle cx="100" cy="480" r="14" fill="#fecdd3" stroke="#e11d48" stroke-width="1"/>
  <text x="100" y="484" text-anchor="middle" font-family="serif" font-size="10" fill="#9f1239">p</text>
  <circle cx="200" cy="480" r="14" fill="#fecdd3" stroke="#e11d48" stroke-width="1"/>
  <text x="200" y="484" text-anchor="middle" font-family="serif" font-size="10" fill="#9f1239">q</text>

  <line x1="135" y1="500" x2="108" y2="490" stroke="#e11d48" stroke-width="1"/>
  <line x1="165" y1="500" x2="192" y2="490" stroke="#e11d48" stroke-width="1"/>

  <text x="150" y="540" text-anchor="middle" font-family="serif" font-size="10" fill="#9f1239">n = p · q</text>

  <!-- Arrow from factorization to jet analysis -->
  <line x1="230" y1="505" x2="310" y2="505" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>

  <text x="400" y="500" text-anchor="middle" font-family="serif" font-size="12" fill="#9f1239">
    Jets of φ(n) encode factor structure:
  </text>
  <text x="400" y="518" text-anchor="middle" font-family="monospace" font-size="11" fill="#9f1239">
    φ(n)/n = ∏(1 - 1/p)  for  p | n
  </text>
  <text x="400" y="536" text-anchor="middle" font-family="serif" font-size="11" fill="#9f1239">
    Jet signatures distinguish primes from composites
  </text>

  <!-- Caption -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    Figure 1: The parametrized étale jet bundle over an inhabited type X, with fibers J_xᵢ,
  </text>
  <text x="400" y="596" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    its universal property (True), and connection to factorization via Euler's totient function.
  </text>
</svg>
