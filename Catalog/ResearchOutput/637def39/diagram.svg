<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Computable Filtered Interpolation Characterization
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal Property over Inhabited Types
  </text>

  <!-- ====== Left: Type Space X ====== -->
  <g transform="translate(120, 180)">
    <!-- Outer ellipse: Type X -->
    <ellipse cx="0" cy="0" rx="90" ry="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-100" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">X : Type*</text>

    <!-- Inner: Inhabited witness -->
    <circle cx="0" cy="0" r="20" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">default</text>
    <text x="0" y="40" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3b82f6">[Inhabited X]</text>

    <!-- Elements -->
    <circle cx="-40" cy="-50" r="5" fill="#60a5fa" opacity="0.6"/>
    <circle cx="30" cy="-60" r="5" fill="#60a5fa" opacity="0.6"/>
    <circle cx="50" cy="20" r="5" fill="#60a5fa" opacity="0.6"/>
    <circle cx="-55" cy="40" r="5" fill="#60a5fa" opacity="0.6"/>
    <circle cx="20" cy="70" r="5" fill="#60a5fa" opacity="0.6"/>
    <circle cx="-30" cy="80" r="5" fill="#60a5fa" opacity="0.6"/>
  </g>

  <!-- ====== Center: Filtration Tower ====== -->
  <g transform="translate(400, 140)">
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">Filtration</text>

    <!-- F_0 -->
    <rect x="-30" y="10" width="60" height="35" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="32" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">F₀</text>

    <!-- F_1 -->
    <rect x="-45" y="60" width="90" height="35" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="82" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">F₁</text>

    <!-- F_2 -->
    <rect x="-60" y="110" width="120" height="35" rx="4" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="132" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">F₂</text>

    <!-- F_n -->
    <rect x="-80" y="180" width="160" height="35" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="202" text-anchor="middle" font-family="monospace" font-size="12" fill="#78350f">F_n</text>

    <!-- Dots -->
    <text x="0" y="165" text-anchor="middle" font-family="serif" font-size="18" fill="#d97706">⋮</text>

    <!-- Inclusion arrows -->
    <line x1="0" y1="45" x2="0" y2="58" stroke="#d97706" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="95" x2="0" y2="108" stroke="#d97706" stroke-width="1" marker-end="url(#arrowhead)"/>

    <!-- Label -->
    <text x="95" y="110" font-family="sans-serif" font-size="10" fill="#92400e">F₀ ⊂ F₁ ⊂ ··· ⊂ F_n</text>
  </g>

  <!-- ====== Right: Interpolation Scheme ====== -->
  <g transform="translate(660, 180)">
    <rect x="-80" y="-100" width="160" height="200" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="-75" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#166534">Interpolation</text>
    <text x="0" y="-58" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#166534">Scheme</text>

    <!-- Constant interpolant -->
    <rect x="-60" y="-40" width="120" height="50" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
    <text x="0" y="-18" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">f(·) = default</text>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">Constant Interpolant</text>

    <!-- Universal property -->
    <rect x="-60" y="25" width="120" height="55" rx="4" fill="#86efac" stroke="#22c55e" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">Universal Property:</text>
    <text x="0" y="60" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">Initial in Interp(X)</text>
    <text x="0" y="73" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">K(f) = 1 (minimal)</text>
  </g>

  <!-- ====== Arrows connecting sections ====== -->
  <!-- X → Filtration -->
  <line x1="215" y1="180" x2="335" y2="250" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <text x="260" y="200" font-family="sans-serif" font-size="9" fill="#2563eb" transform="rotate(-15, 260, 200)">constraints</text>

  <!-- Filtration → Interpolation -->
  <line x1="485" y1="250" x2="575" y2="200" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="520" y="210" font-family="sans-serif" font-size="9" fill="#16a34a" transform="rotate(15, 520, 210)">interpolate</text>

  <!-- ====== Bottom: The Proof ====== -->
  <g transform="translate(400, 430)">
    <rect x="-350" y="-20" width="700" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="-300" y="5" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">The Proof:</text>

    <!-- Step 1 -->
    <rect x="-300" y="15" width="180" height="50" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="-210" y="35" text-anchor="middle" font-family="monospace" font-size="11" fill="#5b21b6">[Inhabited X]</text>
    <text x="-210" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">∃ default : X</text>

    <!-- Arrow -->
    <line x1="-115" y1="40" x2="-65" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="-90" y="33" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">implies</text>

    <!-- Step 2 -->
    <rect x="-60" y="15" width="180" height="50" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="30" y="35" text-anchor="middle" font-family="monospace" font-size="11" fill="#9d174d">∃ interpolant</text>
    <text x="30" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#db2777">f(·) = default works</text>

    <!-- Arrow -->
    <line x1="125" y1="40" x2="175" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="150" y="33" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">yields</text>

    <!-- Step 3 -->
    <rect x="180" y="15" width="150" height="50" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="255" y="35" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#065f46">True</text>
    <text x="255" y="52" text-anchor="middle" font-family="monospace" font-size="10" fill="#059669">trivial  ∎</text>
  </g>

  <!-- Caption -->
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    Figure 1: The computable filtered interpolation characterization. An inhabited type X provides a default
  </text>
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    element, yielding a constant interpolant that trivially satisfies the universal property over any filtration.
  </text>
</svg>
