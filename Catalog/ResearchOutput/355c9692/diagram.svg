<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Nilpotent Euclidean Factorization — Universal Property
  </text>

  <!-- Category of Inhabited Types (left region) -->
  <rect x="40" y="70" width="350" height="420" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="215" y="100" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af" font-weight="bold">
    Category of Inhabited Types
  </text>

  <!-- Object X₁ -->
  <ellipse cx="150" cy="180" rx="55" ry="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="176" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">X₁</text>
  <text x="150" y="194" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">[Inhabited]</text>

  <!-- Object X₂ -->
  <ellipse cx="280" cy="220" rx="55" ry="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="216" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">X₂</text>
  <text x="280" y="234" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">[Inhabited]</text>

  <!-- Object X₃ -->
  <ellipse cx="130" cy="310" rx="55" ry="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="306" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">X₃</text>
  <text x="130" y="324" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">[Inhabited]</text>

  <!-- Object Xₙ -->
  <ellipse cx="290" cy="370" rx="55" ry="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="366" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">Xₙ</text>
  <text x="290" y="384" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">[Inhabited]</text>

  <!-- Dots indicating more objects -->
  <text x="200" y="420" text-anchor="middle" font-family="serif" font-size="24" fill="#64748b">⋯</text>

  <!-- Terminal Object (right side) -->
  <rect x="520" y="180" width="220" height="200" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="630" y="215" text-anchor="middle" font-family="monospace" font-size="14" fill="#991b1b" font-weight="bold">
    Terminal Object
  </text>

  <!-- True / Unit -->
  <ellipse cx="630" cy="290" rx="60" ry="35" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="630" y="285" text-anchor="middle" font-family="monospace" font-size="18" fill="#991b1b" font-weight="bold">True</text>
  <text x="630" y="305" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">trivial</text>

  <!-- Arrows: unique morphisms to terminal -->
  <!-- X₁ → True -->
  <line x1="205" y1="175" x2="568" y2="278" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="380" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#16a34a" transform="rotate(-12, 380, 210)">∃! morphism</text>

  <!-- X₂ → True -->
  <line x1="335" y1="218" x2="568" y2="282" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>

  <!-- X₃ → True -->
  <line x1="185" y1="308" x2="568" y2="292" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>

  <!-- Xₙ → True -->
  <line x1="345" y1="365" x2="568" y2="298" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>

  <!-- Nilpotent descent chain (bottom) -->
  <rect x="40" y="500" width="720" height="55" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="520" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">
    Nilpotent chain:  a₀  →  a₁ = a₀ mod b₀  →  a₂ = a₁ mod b₁  →  ⋯  →  0  ≡  True  ✓
  </text>
  <text x="400" y="542" text-anchor="middle" font-family="monospace" font-size="11" fill="#15803d">
    Every Euclidean factorization terminates at the trivial fixed point (universal property)
  </text>

  <!-- Legend -->
  <rect x="520" y="420" width="220" height="60" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="535" y1="442" x2="575" y2="442" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="585" y="446" font-family="monospace" font-size="11" fill="#334155">Unique morphism (∃!)</text>
  <ellipse cx="555" cy="464" rx="14" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="468" font-family="monospace" font-size="11" fill="#334155">Inhabited type</text>

  <!-- Caption -->
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#475569" font-style="italic">
    Figure 1: The universal property of nilpotent Euclidean factorization — all inhabited types map uniquely to True.
  </text>
</svg>
