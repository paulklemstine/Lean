<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" stroke="#333" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Condensed Smooth Descent Formula (c298)
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#666">
    Smooth descent on inhabited spacetime categories
  </text>
  
  <!-- Left: Spacetime Category X -->
  <g transform="translate(130, 200)">
    <!-- Light cone -->
    <polygon points="0,-100 -70,0 0,100 70,0" fill="#e8f4fd" stroke="#2196F3" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#2196F3" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#2196F3" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Distinguished point (inhabited) -->
    <circle cx="0" cy="0" r="6" fill="#F44336" stroke="#B71C1C" stroke-width="2"/>
    <text x="12" y="5" font-size="11" fill="#B71C1C" font-weight="bold">x₀</text>
    
    <!-- Other points -->
    <circle cx="-20" cy="-40" r="3" fill="#2196F3" opacity="0.6"/>
    <circle cx="25" cy="-25" r="3" fill="#2196F3" opacity="0.6"/>
    <circle cx="-15" cy="35" r="3" fill="#2196F3" opacity="0.6"/>
    <circle cx="30" cy="50" r="3" fill="#2196F3" opacity="0.6"/>
    <circle cx="-35" cy="10" r="3" fill="#2196F3" opacity="0.6"/>
    
    <!-- Label -->
    <text x="0" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">
      Spacetime X
    </text>
    <text x="0" y="148" text-anchor="middle" font-size="11" fill="#1565C0">
      [Inhabited X]
    </text>
  </g>
  
  <!-- Arrow: Smooth Cover -->
  <g transform="translate(260, 200)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="50" y="-12" text-anchor="middle" font-size="11" fill="#333">smooth</text>
    <text x="50" y="20" text-anchor="middle" font-size="11" fill="#333">cover {Uᵢ}</text>
  </g>
  
  <!-- Middle: Cover with overlaps -->
  <g transform="translate(440, 200)">
    <!-- Cover sets as overlapping circles -->
    <circle cx="-25" cy="-15" r="50" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" opacity="0.5"/>
    <circle cx="25" cy="-15" r="50" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="25" r="50" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" opacity="0.5"/>
    
    <!-- Labels for covers -->
    <text x="-45" y="-35" font-size="12" fill="#2E7D32" font-weight="bold">U₁</text>
    <text x="40" y="-35" font-size="12" fill="#E65100" font-weight="bold">U₂</text>
    <text x="0" y="60" text-anchor="middle" font-size="12" fill="#6A1B9A" font-weight="bold">U₃</text>
    
    <!-- Triple overlap point -->
    <circle cx="0" cy="0" r="4" fill="#F44336" stroke="#B71C1C" stroke-width="1.5"/>
    <text x="10" y="-5" font-size="9" fill="#B71C1C">g_{ijk}=1</text>
    
    <!-- Label -->
    <text x="0" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
      Smooth Cover
    </text>
    <text x="0" y="118" text-anchor="middle" font-size="11" fill="#666">
      Cocycle condition trivial
    </text>
  </g>
  
  <!-- Arrow: Descent -->
  <g transform="translate(540, 200)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="50" y="-12" text-anchor="middle" font-size="11" fill="#333">descent</text>
    <text x="50" y="20" text-anchor="middle" font-size="11" fill="#333">gluing</text>
  </g>
  
  <!-- Right: Result = True -->
  <g transform="translate(690, 200)">
    <rect x="-45" y="-40" width="90" height="80" rx="10" fill="#E8F5E9" stroke="#4CAF50" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" font-size="24" font-weight="bold" fill="#2E7D32">True</text>
    <text x="0" y="25" text-anchor="middle" font-size="10" fill="#2E7D32">∈ Prop</text>
    
    <text x="0" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">
      Descent Class
    </text>
  </g>
  
  <!-- Bottom: Spectral Sequence -->
  <g transform="translate(100, 420)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Spectral Sequence Degeneration:</text>
    
    <!-- E1 page grid -->
    <g transform="translate(30, 25)">
      <text x="-20" y="15" font-size="10" fill="#666">q</text>
      <text x="60" y="95" font-size="10" fill="#666">p</text>
      
      <!-- Grid -->
      <rect x="0" y="0" width="120" height="80" fill="none" stroke="#ccc" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="#ccc"/>
      <line x1="80" y1="0" x2="80" y2="80" stroke="#ccc"/>
      <line x1="0" y1="27" x2="120" y2="27" stroke="#ccc"/>
      <line x1="0" y1="54" x2="120" y2="54" stroke="#ccc"/>
      
      <!-- E1 entries -->
      <text x="20" y="72" text-anchor="middle" font-size="12" fill="#2196F3" font-weight="bold">ℝ</text>
      <text x="60" y="72" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="100" y="72" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="20" y="45" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="60" y="45" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="100" y="45" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="20" y="20" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="60" y="20" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="100" y="20" text-anchor="middle" font-size="11" fill="#999">0</text>
      
      <text x="60" y="110" text-anchor="middle" font-size="12" fill="#333">E₁ page</text>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(190, 60)">
      <line x1="0" y1="0" x2="50" y2="0" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="25" y="-8" text-anchor="middle" font-size="10" fill="#333">d₁</text>
    </g>
    
    <!-- E2 = E∞ page grid -->
    <g transform="translate(280, 25)">
      <rect x="0" y="0" width="120" height="80" fill="none" stroke="#ccc" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="#ccc"/>
      <line x1="80" y1="0" x2="80" y2="80" stroke="#ccc"/>
      <line x1="0" y1="27" x2="120" y2="27" stroke="#ccc"/>
      <line x1="0" y1="54" x2="120" y2="54" stroke="#ccc"/>
      
      <!-- E2 = E∞ entries -->
      <text x="20" y="72" text-anchor="middle" font-size="12" fill="#4CAF50" font-weight="bold">ℝ</text>
      <text x="60" y="72" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="100" y="72" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="20" y="45" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="60" y="45" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="100" y="45" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="20" y="20" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="60" y="20" text-anchor="middle" font-size="11" fill="#999">0</text>
      <text x="100" y="20" text-anchor="middle" font-size="11" fill="#999">0</text>
      
      <!-- Highlight the surviving term -->
      <rect x="1" y="55" width="38" height="24" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="3" opacity="0.5"/>
      
      <text x="60" y="110" text-anchor="middle" font-size="12" fill="#333">E₂ = E∞</text>
    </g>
    
    <!-- Equals sign -->
    <g transform="translate(440, 60)">
      <text x="0" y="5" font-size="18" fill="#333">=</text>
    </g>
    
    <!-- Result box -->
    <g transform="translate(490, 40)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" font-size="13" fill="#2E7D32" font-weight="bold">H⁰(X, Ω) = ℝ</text>
      <text x="70" y="40" text-anchor="middle" font-size="11" fill="#2E7D32">Descent: True ✓</text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    Figure: The smooth descent formula for an inhabited spacetime X. The spectral sequence degenerates at E₂,
  </text>
  <text x="400" y="592" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    confirming that the descent class c298 equals True — smooth descent is automatically satisfied.
  </text>
</svg>
