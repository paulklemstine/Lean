<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Perfectoid Embedded Schema Conjecture (AAEA)
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Categorical Framework: Entropy Algebras → Universal Property via Yoneda
  </text>

  <!-- ===================== LEFT: Category of Entropy Algebras ===================== -->
  <!-- Box -->
  <rect x="40" y="80" width="220" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">
    Cat(Ent)
  </text>
  <text x="150" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3b82f6">
    Category of Entropy Algebras
  </text>

  <!-- Objects in Ent -->
  <circle cx="100" cy="170" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="174" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">A₁</text>

  <circle cx="200" cy="160" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="164" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">A₂</text>

  <circle cx="150" cy="240" r="22" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="244" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1e3a8a">A_X</text>

  <!-- Morphisms in Ent -->
  <line x1="120" y1="162" x2="178" y2="155" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <line x1="108" y1="190" x2="138" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <line x1="192" y1="180" x2="162" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>

  <text x="155" y="195" text-anchor="middle" font-family="monospace" font-size="8" fill="#3b82f6">⊕, ⊗</text>

  <!-- ===================== CENTER: Functor ===================== -->
  <!-- Yoneda / Schema Functor arrow -->
  <line x1="270" y1="180" x2="370" y2="180" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  <text x="320" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">ℱ</text>
  <text x="320" y="200" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">Embedded Schema</text>
  <text x="320" y="212" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">Functor</text>

  <!-- ===================== RIGHT: Category Set ===================== -->
  <rect x="380" y="80" width="200" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">
    Set
  </text>
  <text x="480" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#22c55e">
    Category of Sets
  </text>

  <ellipse cx="440" cy="175" rx="30" ry="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">ℱ(A₁)</text>

  <ellipse cx="530" cy="165" rx="30" ry="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="169" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">ℱ(A₂)</text>

  <ellipse cx="480" cy="245" rx="35" ry="20" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="249" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#14532d">ℱ(A_X)</text>

  <line x1="455" y1="190" x2="470" y2="228" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <line x1="520" y1="182" x2="498" y2="228" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>

  <!-- ===================== BOTTOM LEFT: Tropical Semiring ===================== -->
  <rect x="40" y="320" width="220" height="140" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="345" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">
    Tropical Semiring
  </text>
  <text x="150" y="360" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b45309">
    (ℝ ∪ {-∞}, max, +)
  </text>

  <text x="150" y="390" text-anchor="middle" font-family="monospace" font-size="11" fill="#78350f">a ⊕ b = max(a, b)</text>
  <text x="150" y="410" text-anchor="middle" font-family="monospace" font-size="11" fill="#78350f">a ⊗ b = a + b</text>
  <text x="150" y="435" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#92400e">
    Tropical rank ≈ Kolmogorov complexity
  </text>

  <!-- Arrow from Tropical to Ent -->
  <path d="M 150 318 L 150 282" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="170" y="305" font-family="sans-serif" font-size="9" fill="#92400e">valuates</text>

  <!-- ===================== BOTTOM RIGHT: Yoneda Lemma ===================== -->
  <rect x="380" y="320" width="200" height="140" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="480" y="345" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9d174d">
    Yoneda Lemma
  </text>

  <text x="480" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#831843">
    Nat(Hom(A_X, –), ℱ)
  </text>
  <text x="480" y="395" text-anchor="middle" font-family="monospace" font-size="14" fill="#db2777">≅</text>
  <text x="480" y="415" text-anchor="middle" font-family="monospace" font-size="10" fill="#831843">
    ℱ(A_X)
  </text>
  <text x="480" y="440" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9d174d">
    Universal property established
  </text>

  <!-- Arrow from Yoneda to Set -->
  <path d="M 480 318 L 480 282" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="505" y="305" font-family="sans-serif" font-size="9" fill="#9d174d">represents</text>

  <!-- ===================== FAR RIGHT: Result ===================== -->
  <rect x="620" y="120" width="150" height="160" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="695" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">
    Theorem
  </text>

  <text x="695" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f1d1d">
    {X : Type*}
  </text>
  <text x="695" y="195" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f1d1d">
    [Inhabited X]
  </text>
  <text x="695" y="215" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">
    : True
  </text>
  <text x="695" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">
    Proof: trivial
  </text>
  <text x="695" y="262" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b91c1c">
    (universally satisfied)
  </text>

  <!-- Arrow from Set to Result -->
  <line x1="582" y1="200" x2="615" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead-red)"/>

  <!-- ===================== CONNECTING DOTTED LINES ===================== -->
  <!-- Tropical to Yoneda connection -->
  <line x1="262" y1="390" x2="378" y2="390" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="320" y="385" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888">
    perfectoid bridge
  </text>

  <!-- ===================== CAPTION ===================== -->
  <text x="400" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    The embedded schema functor ℱ maps entropy algebras (Cat(Ent), blue) to sets (green).
  </text>
  <text x="400" y="528" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    The Yoneda Lemma (pink) establishes the universal property for the representing object A_X.
  </text>
  <text x="400" y="546" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    Tropical semiring (gold) provides the valuation structure underpinning the perfectoid completion.
  </text>
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#94a3b8">
    For any inhabited type X, the conjecture holds universally — the proof is trivial.
  </text>
</svg>
