<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Probabilistic Étale Spectral Sequence Characterization
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Degeneration via Tropical Duality for Inhabited Types
  </text>

  <!-- ═══ Left column: Inhabited Type X ═══ -->
  <rect x="40" y="80" width="200" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">Inhabited Type X</text>
  <text x="140" y="130" text-anchor="middle" font-family="serif" font-size="12" fill="#1e3a5f">default : X</text>
  <circle cx="140" cy="165" r="15" fill="#2563eb" opacity="0.3" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="140" cy="165" r="4" fill="#2563eb"/>
  <text x="165" y="170" font-family="serif" font-size="10" fill="#1e40af">default</text>

  <!-- ═══ Middle column: Entropy Algebra H(X) ═══ -->
  <rect x="310" y="80" width="240" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">Entropy Algebra H(X)</text>
  <text x="430" y="130" text-anchor="middle" font-family="serif" font-size="12" fill="#78350f">Unique distribution: δ(default)</text>
  <text x="430" y="150" text-anchor="middle" font-family="serif" font-size="12" fill="#78350f">H(δ) = 0 bits</text>
  <text x="430" y="175" text-anchor="middle" font-family="serif" font-size="11" fill="#92400e" font-style="italic">Trivial algebra ≅ {⋆}</text>

  <!-- ═══ Right column: Spectral Sequence ═══ -->
  <rect x="620" y="80" width="240" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="740" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#166534">Étale Spectral Seq.</text>
  <text x="740" y="130" text-anchor="middle" font-family="serif" font-size="12" fill="#14532d">E₀ = E₁ = E₂ = ··· = E∞</text>
  <text x="740" y="150" text-anchor="middle" font-family="serif" font-size="12" fill="#14532d">dim = 1, bidegree (0,0)</text>
  <text x="740" y="175" text-anchor="middle" font-family="serif" font-size="11" fill="#166534" font-style="italic">Degenerates at E₀</text>

  <!-- Arrows: top row -->
  <line x1="240" y1="140" x2="305" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="273" y="133" text-anchor="middle" font-family="serif" font-size="10" fill="#2563eb">δ(·)</text>

  <line x1="550" y1="140" x2="615" y2="140" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="583" y="133" text-anchor="middle" font-family="serif" font-size="10" fill="#16a34a">sheafify</text>

  <!-- ═══ Tropical Duality (center, bottom) ═══ -->
  <rect x="280" y="260" width="300" height="100" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="285" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#9d174d">Tropical Duality</text>
  <text x="430" y="310" text-anchor="middle" font-family="serif" font-size="12" fill="#831843">(ℝ, +, ×) ↦ (ℝ ∪ {-∞}, max, +)</text>
  <text x="430" y="335" text-anchor="middle" font-family="serif" font-size="11" fill="#9d174d" font-style="italic">Trivial algebra ↦ Trivial max-plus algebra</text>

  <!-- Arrow from Entropy Algebra down to Tropical -->
  <line x1="430" y1="200" x2="430" y2="255" stroke="#db2777" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="230" font-family="serif" font-size="10" fill="#db2777">tropicalize</text>

  <!-- ═══ Universal Property (bottom) ═══ -->
  <rect x="280" y="410" width="300" height="80" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
  <text x="430" y="440" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#166534">Universal Property</text>
  <text x="430" y="468" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#15803d">True ✓</text>

  <!-- Arrow from Tropical down to Universal Property -->
  <line x1="430" y1="360" x2="430" y2="405" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="465" y="385" font-family="serif" font-size="10" fill="#16a34a">collapse</text>

  <!-- Curved arrows from sides to bottom -->
  <path d="M 140 200 Q 140 450 275 450" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="160" y="370" font-family="serif" font-size="10" fill="#dc2626" transform="rotate(-70, 160, 370)">inhabited → trivial</text>

  <path d="M 740 200 Q 740 450 585 450" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="730" y="370" font-family="serif" font-size="10" fill="#dc2626" transform="rotate(70, 730, 370)">degenerate → trivial</text>

  <!-- ═══ Spectral sequence grid (mini diagram) ═══ -->
  <g transform="translate(60, 280)">
    <text x="70" y="0" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#475569">E₀ Page (p,q grid)</text>
    <!-- Grid -->
    <rect x="10" y="10" width="120" height="90" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="40" x2="130" y2="40" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="10" y1="70" x2="130" y2="70" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="50" y1="10" x2="50" y2="100" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="90" y1="10" x2="90" y2="100" stroke="#94a3b8" stroke-width="0.5"/>
    <!-- Labels -->
    <text x="5" y="85" text-anchor="end" font-family="serif" font-size="9" fill="#64748b">0</text>
    <text x="5" y="55" text-anchor="end" font-family="serif" font-size="9" fill="#64748b">1</text>
    <text x="5" y="25" text-anchor="end" font-family="serif" font-size="9" fill="#64748b">2</text>
    <text x="30" y="108" text-anchor="middle" font-family="serif" font-size="9" fill="#64748b">0</text>
    <text x="70" y="108" text-anchor="middle" font-family="serif" font-size="9" fill="#64748b">1</text>
    <text x="110" y="108" text-anchor="middle" font-family="serif" font-size="9" fill="#64748b">2</text>
    <!-- Only (0,0) is nonzero -->
    <circle cx="30" cy="85" r="10" fill="#2563eb" opacity="0.8"/>
    <text x="30" y="89" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">1</text>
    <!-- Zero entries -->
    <text x="70" y="89" text-anchor="middle" font-family="serif" font-size="10" fill="#cbd5e1">0</text>
    <text x="110" y="89" text-anchor="middle" font-family="serif" font-size="10" fill="#cbd5e1">0</text>
    <text x="30" y="59" text-anchor="middle" font-family="serif" font-size="10" fill="#cbd5e1">0</text>
    <text x="70" y="59" text-anchor="middle" font-family="serif" font-size="10" fill="#cbd5e1">0</text>
    <text x="110" y="59" text-anchor="middle" font-family="serif" font-size="10" fill="#cbd5e1">0</text>
    <text x="30" y="29" text-anchor="middle" font-family="serif" font-size="10" fill="#cbd5e1">0</text>
    <text x="70" y="29" text-anchor="middle" font-family="serif" font-size="10" fill="#cbd5e1">0</text>
    <text x="110" y="29" text-anchor="middle" font-family="serif" font-size="10" fill="#cbd5e1">0</text>
    <!-- Axis labels -->
    <text x="70" y="122" text-anchor="middle" font-family="serif" font-size="9" fill="#475569" font-style="italic">p →</text>
    <text x="-8" y="55" text-anchor="middle" font-family="serif" font-size="9" fill="#475569" font-style="italic" transform="rotate(-90, -8, 55)">q →</text>
  </g>

  <!-- ═══ Legend ═══ -->
  <g transform="translate(640, 280)">
    <rect x="0" y="0" width="210" height="120" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" opacity="0.9"/>
    <text x="105" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">Legend</text>
    <rect x="15" y="32" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="38" y="44" font-family="sans-serif" font-size="10" fill="#334155">Inhabited Type (input)</text>
    <rect x="15" y="52" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="38" y="64" font-family="sans-serif" font-size="10" fill="#334155">Entropy Algebra</text>
    <rect x="15" y="72" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="38" y="84" font-family="sans-serif" font-size="10" fill="#334155">Spectral Sequence</text>
    <rect x="15" y="92" width="14" height="14" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="38" y="104" font-family="sans-serif" font-size="10" fill="#334155">Tropical Duality</text>
  </g>

  <!-- Caption -->
  <text x="450" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    Figure 1: The inhabited type X induces a trivial entropy algebra, whose étale spectral sequence
  </text>
  <text x="450" y="548" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    degenerates at E₀ (only bidegree (0,0) is nonzero). Tropical duality preserves this triviality,
  </text>
  <text x="450" y="566" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    and the universal property collapses to True — the correct base case for compression-theoretic invariants.
  </text>

  <!-- Lean 4 proof badge -->
  <rect x="700" y="500" width="170" height="35" rx="6" fill="#1e293b" filter="url(#shadow)"/>
  <text x="785" y="522" text-anchor="middle" font-family="monospace" font-size="11" fill="#a5f3fc">Lean 4 proof: trivial</text>
</svg>
