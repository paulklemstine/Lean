<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="520" fill="#fafafa" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Non-Archimedean Factoring Oracle
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Corrected Theorem: Composite numbers admit non-trivial factorization
  </text>
  
  <!-- Left panel: Number line classification -->
  <rect x="30" y="75" width="350" height="200" fill="white" stroke="#bdc3c7" stroke-width="1" rx="6"/>
  <text x="205" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    ℕ &gt; 1 Classification
  </text>
  
  <!-- Prime region -->
  <rect x="50" y="110" width="310" height="55" fill="url(#primeGrad)" stroke="#e74c3c" stroke-width="1.5" rx="4"/>
  <text x="65" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">PRIMES (¬∃ a,b &gt; 1 : a·b = n)</text>
  <g font-family="monospace" font-size="16" fill="#e74c3c">
    <text x="65" y="155">2  3  5  7  11  13  17  19  23 …</text>
  </g>
  
  <!-- Composite region -->
  <rect x="50" y="175" width="310" height="55" fill="url(#compGrad)" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="65" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">COMPOSITES (∃ a,b &gt; 1 : a·b = n) ✓</text>
  <g font-family="monospace" font-size="16" fill="#27ae60">
    <text x="65" y="220">4  6  8  9  10  12  14  15  …</text>
  </g>
  
  <!-- Annotation -->
  <text x="205" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
    Original claim: ALL of ℕ &gt; 1 — FALSE (primes are counterexamples)
  </text>
  
  <!-- Right panel: Proof structure -->
  <rect x="410" y="75" width="370" height="200" fill="white" stroke="#bdc3c7" stroke-width="1" rx="6"/>
  <text x="595" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Proof Structure
  </text>
  
  <!-- Input box -->
  <rect x="435" y="110" width="130" height="35" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="1.5" rx="4"/>
  <text x="500" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2980b9">n &gt; 1, ¬Prime n</text>
  
  <!-- Arrow -->
  <line x1="565" y1="127" x2="615" y2="127" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="590" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">minFac</text>
  
  <!-- MinFac box -->
  <rect x="620" y="110" width="140" height="35" fill="#9b59b6" fill-opacity="0.1" stroke="#9b59b6" stroke-width="1.5" rx="4"/>
  <text x="690" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8e44ad">k = minFac(n)</text>
  <text x="690" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8e44ad">k | n, 2 ≤ k</text>
  
  <!-- Arrow down -->
  <line x1="690" y1="145" x2="690" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Witnesses -->
  <rect x="440" y="175" width="140" height="40" fill="#e67e22" fill-opacity="0.1" stroke="#e67e22" stroke-width="1.5" rx="4"/>
  <text x="510" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d35400">a = k</text>
  <text x="510" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d35400">a &gt; 1 ✓</text>
  
  <rect x="620" y="175" width="140" height="40" fill="#e67e22" fill-opacity="0.1" stroke="#e67e22" stroke-width="1.5" rx="4"/>
  <text x="690" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d35400">b = n / k</text>
  <text x="690" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d35400">b &gt; 1 ✓</text>
  
  <!-- Result -->
  <rect x="490" y="230" width="200" height="30" fill="#2ecc71" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="590" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">a · b = n ✓</text>
  
  <!-- Arrow to result -->
  <line x1="510" y1="215" x2="540" y2="232" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="215" x2="650" y2="232" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Bottom panel: p-adic valuation example -->
  <rect x="30" y="290" width="740" height="185" fill="white" stroke="#bdc3c7" stroke-width="1" rx="6"/>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    p-adic Valuation Landscape: n = 1729 = 7 × 13 × 19
  </text>
  
  <!-- Valuation bars -->
  <g transform="translate(80, 330)">
    <!-- Axis -->
    <line x1="0" y1="120" x2="640" y2="120" stroke="#bdc3c7" stroke-width="1"/>
    <text x="320" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">prime p</text>
    
    <!-- Bars for each prime -->
    <!-- p=2: v=0 -->
    <rect x="20" y="115" width="40" height="5" fill="#bdc3c7" rx="2"/>
    <text x="40" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#7f8c8d">2</text>
    <text x="40" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">v=0</text>
    
    <!-- p=3: v=0 -->
    <rect x="90" y="115" width="40" height="5" fill="#bdc3c7" rx="2"/>
    <text x="110" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#7f8c8d">3</text>
    <text x="110" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">v=0</text>
    
    <!-- p=5: v=0 -->
    <rect x="160" y="115" width="40" height="5" fill="#bdc3c7" rx="2"/>
    <text x="180" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#7f8c8d">5</text>
    <text x="180" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">v=0</text>
    
    <!-- p=7: v=1 — FACTOR -->
    <rect x="230" y="70" width="40" height="50" fill="#e74c3c" rx="2"/>
    <text x="250" y="135" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#e74c3c">7</text>
    <text x="250" y="63" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#e74c3c">v=1 ★</text>
    
    <!-- p=11: v=0 -->
    <rect x="300" y="115" width="40" height="5" fill="#bdc3c7" rx="2"/>
    <text x="320" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#7f8c8d">11</text>
    <text x="320" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">v=0</text>
    
    <!-- p=13: v=1 — FACTOR -->
    <rect x="370" y="70" width="40" height="50" fill="#e67e22" rx="2"/>
    <text x="390" y="135" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#e67e22">13</text>
    <text x="390" y="63" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#e67e22">v=1 ★</text>
    
    <!-- p=17: v=0 -->
    <rect x="440" y="115" width="40" height="5" fill="#bdc3c7" rx="2"/>
    <text x="460" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#7f8c8d">17</text>
    <text x="460" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">v=0</text>
    
    <!-- p=19: v=1 — FACTOR -->
    <rect x="510" y="70" width="40" height="50" fill="#9b59b6" rx="2"/>
    <text x="530" y="135" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#9b59b6">19</text>
    <text x="530" y="63" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#9b59b6">v=1 ★</text>
    
    <!-- p=23: v=0 -->
    <rect x="580" y="115" width="40" height="5" fill="#bdc3c7" rx="2"/>
    <text x="600" y="135" text-anchor="middle" font-family="monospace" font-size="11" fill="#7f8c8d">23</text>
    <text x="600" y="108" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">v=0</text>
  </g>
  
  <!-- Caption -->
  <text x="400" y="502" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#555">
    Figure: Classification of ℕ &gt; 1, proof structure, and p-adic valuation landscape for n = 1729.
  </text>
  <text x="400" y="516" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#777">
    Stars (★) mark primes p with v_p(1729) &gt; 0, revealing factors. Primes have no such witnesses below themselves.
  </text>
</svg>
