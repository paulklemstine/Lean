<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16A34A" />
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Symplectic Connected Complex Theorem
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    Universal property via inhabited types
  </text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- LEFT: Type Space X with Inhabited constraint -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Box -->
  <rect x="40" y="80" width="220" height="200" rx="12" fill="white" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#2563EB">X : Type*</text>
  <text x="150" y="122" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">[Inhabited X]</text>

  <!-- Points in the type space -->
  <circle cx="80" cy="160" r="6" fill="#2563EB" opacity="0.7"/>
  <circle cx="120" cy="180" r="6" fill="#2563EB" opacity="0.7"/>
  <circle cx="160" cy="150" r="6" fill="#2563EB" opacity="0.7"/>
  <circle cx="200" cy="190" r="6" fill="#2563EB" opacity="0.7"/>
  <circle cx="140" cy="220" r="6" fill="#2563EB" opacity="0.7"/>
  <circle cx="100" cy="240" r="6" fill="#2563EB" opacity="0.7"/>

  <!-- Default element (star) -->
  <circle cx="150" cy="170" r="10" fill="#FBBF24" stroke="#F59E0B" stroke-width="2"/>
  <text x="150" y="174" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#78350F">d</text>
  <text x="175" y="165" font-family="monospace" font-size="9" fill="#92400E">default</text>

  <!-- Edges (connected complex) -->
  <line x1="80" y1="160" x2="120" y2="180" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="180" x2="160" y2="150" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
  <line x1="160" y1="150" x2="200" y2="190" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="180" x2="140" y2="220" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
  <line x1="140" y1="220" x2="100" y2="240" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
  <line x1="80" y1="160" x2="150" y2="170" stroke="#FCD34D" stroke-width="1.5" opacity="0.8"/>
  <line x1="150" y1="170" x2="120" y2="180" stroke="#FCD34D" stroke-width="1.5" opacity="0.8"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- CENTER: Symplectic Structure -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <rect x="290" y="80" width="220" height="200" rx="12" fill="white" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#DC2626">Symplectic Form ω</text>

  <!-- Symplectic matrix J -->
  <text x="400" y="140" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">J = </text>
  <!-- Matrix brackets -->
  <text x="370" y="165" font-family="monospace" font-size="28" fill="#DC2626">⌈</text>
  <text x="370" y="195" font-family="monospace" font-size="28" fill="#DC2626">⌊</text>
  <text x="450" y="165" font-family="monospace" font-size="28" fill="#DC2626">⌉</text>
  <text x="450" y="195" font-family="monospace" font-size="28" fill="#DC2626">⌋</text>

  <text x="400" y="167" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">  0   I</text>
  <text x="400" y="192" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b"> −I   0</text>

  <!-- Non-degeneracy label -->
  <text x="400" y="225" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">det(J) = 1 ≠ 0</text>
  <text x="400" y="242" text-anchor="middle" font-family="monospace" font-size="10" fill="#DC2626">non-degenerate</text>
  <text x="400" y="260" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">≅ Inhabited constraint</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- RIGHT: Terminal Object True -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <rect x="540" y="80" width="220" height="200" rx="12" fill="white" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16A34A">Prop (Terminal)</text>

  <!-- True as terminal object -->
  <circle cx="650" cy="180" r="40" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="650" y="177" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#16A34A">True</text>
  <text x="650" y="197" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">trivial</text>

  <!-- Unique morphism indicator -->
  <text x="650" y="245" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">∃! morphism from any Prop</text>
  <text x="650" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#16A34A">universal property ✓</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- ARROWS -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- X → Symplectic -->
  <line x1="260" y1="170" x2="285" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="272" y="162" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">ω</text>

  <!-- Symplectic → True -->
  <line x1="510" y1="170" x2="600" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="555" y="162" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">∃!</text>

  <!-- Direct arrow X → True (the theorem) -->
  <path d="M 150 285 Q 400 370 640 220" stroke="#7C3AED" stroke-width="2.5" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#7C3AED">
    The Theorem
  </text>
  <text x="400" y="357" text-anchor="middle" font-family="monospace" font-size="10" fill="#7C3AED">
    Inhabited X → True
  </text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM: Category Diagram -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <rect x="40" y="390" width="720" height="160" rx="12" fill="white" stroke="#64748b" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">
    Categorical View: Adjunction Equivalence
  </text>

  <!-- Functor boxes -->
  <rect x="80" y="435" width="140" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="150" y="455" text-anchor="middle" font-family="monospace" font-size="11" fill="#2563EB">Type*</text>
  <text x="150" y="472" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">(inhabited types)</text>

  <rect x="330" y="435" width="140" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="400" y="455" text-anchor="middle" font-family="monospace" font-size="11" fill="#DC2626">SympConn</text>
  <text x="400" y="472" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">(connected complexes)</text>

  <rect x="580" y="435" width="140" height="50" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="650" y="455" text-anchor="middle" font-family="monospace" font-size="11" fill="#16A34A">Prop</text>
  <text x="650" y="472" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">(propositions)</text>

  <!-- Functors -->
  <line x1="225" y1="455" x2="325" y2="455" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="275" y="448" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">F</text>

  <line x1="475" y1="455" x2="575" y2="455" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="525" y="448" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">G</text>

  <!-- Adjunction symbol -->
  <text x="275" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7C3AED">F ⊣ U</text>
  <path d="M 225 495 C 250 515, 300 515, 325 495" stroke="#7C3AED" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- Composition = const True -->
  <text x="525" y="510" text-anchor="middle" font-family="monospace" font-size="11" fill="#16A34A">G ∘ F = const True</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- Caption -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    Figure 1: The symplectic connected complex theorem — an inhabited type X yields a connected complex
  </text>
  <text x="400" y="595" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    whose universal property (True) is witnessed by the unique morphism trivial. Proved in Lean 4 with 0 axioms.
  </text>
</svg>
