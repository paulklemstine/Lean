<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Holomorphic Optimal Extrapolation Principle
  </text>

  <!-- === Left: State Number Spaces === -->
  <!-- Quantum states (Bloch sphere equator) -->
  <circle cx="160" cy="220" r="80" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="160" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2563eb" font-weight="bold">
    State Number Space S(X)
  </text>

  <!-- States on the circle -->
  <circle cx="240" cy="220" r="6" fill="#3b82f6"/>
  <text x="255" y="218" font-family="sans-serif" font-size="11" fill="#1e40af">|ψ₁⟩</text>

  <circle cx="196" cy="150" r="6" fill="#3b82f6"/>
  <text x="206" y="148" font-family="sans-serif" font-size="11" fill="#1e40af">|ψ₂⟩</text>

  <circle cx="108" cy="168" r="6" fill="#3b82f6"/>
  <text x="78" y="165" font-family="sans-serif" font-size="11" fill="#1e40af">|ψ₃⟩</text>

  <circle cx="88" cy="250" r="6" fill="#3b82f6"/>
  <text x="55" y="255" font-family="sans-serif" font-size="11" fill="#1e40af">|ψ₄⟩</text>

  <circle cx="160" cy="300" r="6" fill="#3b82f6"/>
  <text x="145" y="318" font-family="sans-serif" font-size="11" fill="#1e40af">|ψ₅⟩</text>

  <!-- Pythagorean triple label -->
  <text x="160" y="345" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6366f1" font-style="italic">
    α² + β² = 1 (Pythagorean over ℂ)
  </text>

  <!-- === Center: Extrapolation Arrows === -->
  <!-- Arrow from each state to terminal -->
  <line x1="250" y1="220" x2="490" y2="220" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <line x1="200" y1="152" x2="490" y2="210" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)" stroke-dasharray="4,2"/>
  <line x1="115" y1="170" x2="490" y2="210" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)" stroke-dasharray="4,2"/>
  <line x1="95" y1="250" x2="490" y2="225" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)" stroke-dasharray="4,2"/>
  <line x1="168" y1="300" x2="490" y2="230" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)" stroke-dasharray="4,2"/>

  <!-- Label on arrows -->
  <text x="370" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dc2626" font-weight="bold">
    ℰ (extrapolation)
  </text>
  <text x="370" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626" font-style="italic">
    holomorphic (constant)
  </text>

  <!-- === Right: Terminal Object === -->
  <rect x="500" y="190" width="90" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="545" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#166534" font-weight="bold">
    True
  </text>
  <text x="545" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">
    Terminal Object in Prop
  </text>

  <!-- === Bottom Left: Dirichlet Characters === -->
  <rect x="40" y="390" width="200" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="140" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400e" font-weight="bold">
    Dirichlet Characters
  </text>
  <text x="140" y="435" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">
    χ : (ℤ/qℤ)* → ℂ*
  </text>
  <text x="140" y="455" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f" font-style="italic">
    Error-correcting syndromes
  </text>
  <text x="140" y="475" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f" font-style="italic">
    on quantum registers
  </text>

  <!-- === Bottom Center: Tropical Projection === -->
  <rect x="290" y="390" width="200" height="100" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="390" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9d174d" font-weight="bold">
    Tropical Projection
  </text>
  <text x="390" y="435" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#831843">
    z ↦ −log|z| (valuation)
  </text>
  <text x="390" y="455" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#831843" font-style="italic">
    Measurement = projection onto
  </text>
  <text x="390" y="475" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#831843" font-style="italic">
    tropical hypersurface
  </text>

  <!-- === Bottom Right: Universal Property === -->
  <rect x="540" y="390" width="220" height="100" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="650" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b21b6" font-weight="bold">
    Universal Property
  </text>
  <text x="650" y="435" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4c1d95">
    ∀ f : S(X) → P, ∃! g : P → True
  </text>
  <text x="650" y="455" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4c1d95" font-style="italic">
    such that f = g ∘ ℰ
  </text>
  <text x="650" y="475" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4c1d95" font-style="italic">
    (unique factorization)
  </text>

  <!-- Connecting lines from bottom boxes to main diagram -->
  <line x1="140" y1="390" x2="140" y2="340" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="390" x2="400" y2="280" stroke="#db2777" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="650" y1="390" x2="570" y2="270" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- === Lean proof annotation === -->
  <rect x="600" y="140" width="170" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="685" y="163" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">
    Lean proof: trivial
  </text>

  <!-- Caption -->
  <text x="400" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    Figure 1: The optimal extrapolation ℰ maps all quantum states in the holomorphic state number
  </text>
  <text x="400" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    space S(X) to the terminal object True, satisfying the universal property of terminal objects.
  </text>
</svg>
