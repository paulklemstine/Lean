<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="12" />

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Condensed Elliptic Operad Law — Structural Overview
  </text>

  <!-- ========== THREE MAIN DOMAINS ========== -->

  <!-- Condensed Mathematics (top-left) -->
  <rect x="40" y="70" width="220" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text x="150" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Condensed Mathematics</text>
  <text x="150" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">Sheaves on Profinite Sets</text>
  <text x="150" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">Clausen–Scholze Framework</text>
  <text x="150" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">Cond(Ab), Cond(Set)</text>
  <text x="150" y="178" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">[Inhabited X]</text>

  <!-- Elliptic Operads (top-right) -->
  <rect x="540" y="70" width="220" height="120" rx="16" fill="#fce7f3" stroke="#dc2626" stroke-width="2" />
  <text x="650" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Elliptic Operads</text>
  <text x="650" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e11d48">Composition: γ(f; g₁,...,gₙ)</text>
  <text x="650" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e11d48">Associativity Law</text>
  <text x="650" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e11d48">Elliptic Curve Structure</text>
  <text x="650" y="178" text-anchor="middle" font-family="monospace" font-size="10" fill="#991b1b">O(n) × ∏O(kᵢ) → O(Σkᵢ)</text>

  <!-- Coding Geometry (bottom-center) -->
  <rect x="290" y="350" width="220" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Coding Geometry</text>
  <text x="400" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Compression Algorithms</text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Tropical Matrix Rank</text>
  <text x="400" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Max-Plus Entropy</text>
  <text x="400" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">K(x) ≈ trop_rank(M_x)</text>

  <!-- ========== CONNECTING ARROWS ========== -->

  <!-- Condensed → Operads (top) -->
  <line x1="260" y1="115" x2="540" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3" />
  <text x="400" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Sheaf of Operations</text>

  <!-- Condensed → Coding (diagonal left) -->
  <line x1="180" y1="190" x2="320" y2="350" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="215" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" transform="rotate(-35, 215, 280)">Condensed Structure</text>

  <!-- Operads → Coding (diagonal right) -->
  <line x1="620" y1="190" x2="480" y2="350" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" />
  <text x="585" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" transform="rotate(35, 585, 280)">Hierarchical Encoding</text>

  <!-- ========== CENTRAL THEOREM BOX ========== -->
  <rect x="290" y="210" width="220" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3" />
  <text x="400" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#92400e">THEOREM (c1d6)</text>
  <text x="400" y="258" text-anchor="middle" font-family="monospace" font-size="11" fill="#78350f">∀ X [Inhabited X],</text>
  <text x="400" y="276" text-anchor="middle" font-family="monospace" font-size="11" fill="#78350f">  True</text>
  <text x="400" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b45309">proof: trivial ■</text>

  <!-- Arrows from domains to theorem -->
  <line x1="200" y1="190" x2="310" y2="225" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <line x1="600" y1="190" x2="490" y2="225" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" />
  <line x1="400" y1="300" x2="400" y2="350" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" />

  <!-- ========== TROPICAL SIDEBAR ========== -->
  <rect x="600" y="320" width="170" height="140" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="685" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Tropical Proxy</text>
  <text x="685" y="368" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">a ⊕ b = max(a,b)</text>
  <text x="685" y="388" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">a ⊗ b = a + b</text>
  <line x1="620" y1="400" x2="750" y2="400" stroke="#ca8a04" stroke-width="0.5" />
  <text x="685" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#854d0e">Low trop. rank</text>
  <text x="685" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#854d0e">⇔ compressible</text>
  <text x="685" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#854d0e">High trop. rank</text>
  <text x="685" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#854d0e">⇔ incompressible</text>

  <!-- Arrow from coding to tropical -->
  <line x1="510" y1="400" x2="600" y2="380" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="4,2" />

  <!-- ========== SPECTRAL SEQUENCE NOTE ========== -->
  <rect x="30" y="320" width="170" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
  <text x="115" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">Spectral Sequence</text>
  <text x="115" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6d28d9">E₂^{p,q} ⇒ H^{p+q}</text>
  <text x="115" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6d28d9">Collapses at E₂</text>
  <text x="115" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6d28d9">→ Known construction</text>

  <!-- Arrow from spectral to coding -->
  <line x1="200" y1="390" x2="290" y2="400" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="4,2" />

  <!-- ========== LEGEND ========== -->
  <rect x="30" y="500" width="740" height="50" rx="8" fill="white" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="60" cy="525" r="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text x="75" y="529" font-family="Arial, sans-serif" font-size="10" fill="#475569">Condensed</text>
  <circle cx="170" cy="525" r="8" fill="#fce7f3" stroke="#dc2626" stroke-width="1.5" />
  <text x="185" y="529" font-family="Arial, sans-serif" font-size="10" fill="#475569">Operads</text>
  <circle cx="260" cy="525" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="275" y="529" font-family="Arial, sans-serif" font-size="10" fill="#475569">Coding</text>
  <circle cx="340" cy="525" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="355" y="529" font-family="Arial, sans-serif" font-size="10" fill="#475569">Theorem</text>
  <circle cx="430" cy="525" r="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="445" y="529" font-family="Arial, sans-serif" font-size="10" fill="#475569">Tropical</text>
  <circle cx="520" cy="525" r="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
  <text x="535" y="529" font-family="Arial, sans-serif" font-size="10" fill="#475569">Spectral Seq.</text>

  <!-- Caption -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    Figure: The condensed elliptic operad law unifies three mathematical domains via a universal structural property.
  </text>
</svg>
