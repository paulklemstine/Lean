<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="filtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="gerbeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fde68a;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Adic Embedded Gerbe Corollary 2749
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Obstruction vanishing for inhabited types
  </text>

  <!-- LEFT: Adic Filtration Tower -->
  <text x="150" y="85" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#1e40af">
    Adic Filtration on X
  </text>

  <!-- Filtration levels (nested rectangles) -->
  <rect x="50" y="100" width="200" height="250" rx="12" fill="url(#filtGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="118" font-family="monospace" font-size="11" fill="#1e40af">F₀ = X (full space)</text>

  <rect x="70" y="130" width="160" height="200" rx="10" fill="url(#filtGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="80" y="148" font-family="monospace" font-size="11" fill="#1e40af">F₁ ⊂ F₀</text>

  <rect x="90" y="160" width="120" height="150" rx="8" fill="url(#filtGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="100" y="178" font-family="monospace" font-size="11" fill="#1e40af">F₂ ⊂ F₁</text>

  <rect x="110" y="190" width="80" height="100" rx="6" fill="url(#filtGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="118" y="208" font-family="monospace" font-size="10" fill="#1e40af">F₃ ⊂ F₂</text>

  <!-- Basepoint (star) at center of all filtrations -->
  <circle cx="150" cy="260" r="8" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <text x="150" y="264" text-anchor="middle" font-family="monospace" font-size="9" fill="white" font-weight="bold">★</text>
  <text x="150" y="285" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc2626" font-weight="bold">
    default : X
  </text>
  <text x="150" y="300" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">
    (Inhabited.default)
  </text>

  <!-- Annotation: basepoint in all levels -->
  <text x="150" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#475569" font-style="italic">
    ★ ∈ Fₖ for all k
  </text>

  <!-- CENTER: Gerbe over filtration -->
  <text x="430" y="85" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#b45309">
    Embedded Gerbe 𝒢
  </text>

  <!-- Gerbe (cloud-like shape) -->
  <ellipse cx="430" cy="180" rx="120" ry="70" fill="url(#gerbeGrad)" stroke="#f59e0b" stroke-width="2"/>
  <ellipse cx="400" cy="160" rx="40" ry="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <ellipse cx="460" cy="175" rx="35" ry="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <ellipse cx="420" cy="200" rx="45" ry="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>

  <text x="430" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#92400e" font-weight="bold">
    𝒢 → X
  </text>
  <text x="430" y="198" text-anchor="middle" font-family="monospace" font-size="10" fill="#78350f">
    Band = Aut(fiber)
  </text>

  <!-- Arrow: Filtration → Gerbe (embedding) -->
  <path d="M 260 200 Q 310 170 360 180" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="310" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333" font-style="italic">
    embed
  </text>

  <!-- RIGHT: Obstruction class -->
  <text x="660" y="85" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#059669">
    Obstruction Class
  </text>

  <rect x="590" y="100" width="140" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="660" y="125" text-anchor="middle" font-family="monospace" font-size="12" fill="#065f46">
    [𝒢] ∈ H²(X, B)
  </text>
  <text x="660" y="150" text-anchor="middle" font-family="monospace" font-size="16" fill="#059669" font-weight="bold">
    = 0
  </text>
  <text x="660" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#065f46" font-style="italic">
    (trivial!)
  </text>

  <!-- Arrow: Gerbe → Obstruction -->
  <path d="M 555 170 L 585 150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="570" y="145" text-anchor="middle" font-family="monospace" font-size="9" fill="#666" transform="rotate(-20 570 145)">
    classify
  </text>

  <!-- BOTTOM: The proof diagram -->
  <rect x="50" y="370" width="700" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">
    Proof Structure
  </text>

  <!-- Step 1 -->
  <rect x="80" y="410" width="150" height="55" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="155" y="432" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af" font-weight="bold">Inhabited X</text>
  <text x="155" y="450" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">∃ default : X</text>

  <!-- Arrow 1→2 -->
  <line x1="230" y1="437" x2="280" y2="437" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <!-- Step 2 -->
  <rect x="285" y="410" width="180" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="375" y="432" text-anchor="middle" font-family="monospace" font-size="11" fill="#92400e" font-weight="bold">Global Section</text>
  <text x="375" y="450" text-anchor="middle" font-family="monospace" font-size="10" fill="#b45309">s : X → 𝒢 (constant)</text>

  <!-- Arrow 2→3 -->
  <line x1="465" y1="437" x2="515" y2="437" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead-red)"/>

  <!-- Step 3 -->
  <rect x="520" y="410" width="200" height="55" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="432" text-anchor="middle" font-family="monospace" font-size="11" fill="#065f46" font-weight="bold">Obstruction = 0</text>
  <text x="620" y="450" text-anchor="middle" font-family="monospace" font-size="10" fill="#059669">∴ True  (QED)</text>

  <!-- Lean proof box -->
  <rect x="250" y="480" width="300" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="400" y="500" text-anchor="middle" font-family="monospace" font-size="12" fill="#a5f3fc">
    theorem ... : True := by trivial
  </text>
  <text x="400" y="516" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">
    — Lean 4 + Mathlib v4.28.0
  </text>

  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
    Figure 1: The adic filtration (left) embeds into the gerbe (center), with obstruction class (right)
  </text>
  <text x="400" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
    vanishing due to the basepoint (★) provided by the Inhabited instance.
  </text>
</svg>
