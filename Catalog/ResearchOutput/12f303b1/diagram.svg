<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bg-grad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Universal Property of Smooth Complexity
  </text>

  <!-- ========== Left: Parametrized Structure Spaces ========== -->

  <!-- Type X₁ -->
  <ellipse cx="120" cy="150" rx="70" ry="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">X₁</text>
  <text x="120" y="163" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3b82f6">[Inhabited]</text>

  <!-- Type X₂ -->
  <ellipse cx="120" cy="270" rx="70" ry="40" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="120" y="265" text-anchor="middle" font-family="monospace" font-size="14" fill="#9d174d">X₂</text>
  <text x="120" y="283" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#db2777">[Inhabited]</text>

  <!-- Type X₃ -->
  <ellipse cx="120" cy="390" rx="70" ry="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="385" text-anchor="middle" font-family="monospace" font-size="14" fill="#166534">X₃</text>
  <text x="120" y="403" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">[Inhabited]</text>

  <!-- Label -->
  <text x="120" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">
    Inhabited Types
  </text>

  <!-- ========== Middle: Complexity Measures ========== -->

  <!-- C₁ -->
  <rect x="310" y="120" width="100" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="150" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">C(X₁)</text>

  <!-- C₂ -->
  <rect x="310" y="240" width="100" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="270" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">C(X₂)</text>

  <!-- C₃ -->
  <rect x="310" y="360" width="100" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="390" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">C(X₃)</text>

  <!-- Label -->
  <text x="360" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">
    Complexity Measures
  </text>

  <!-- Arrows: Types → Measures -->
  <line x1="190" y1="145" x2="305" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <line x1="190" y1="268" x2="305" y2="265" stroke="#db2777" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <line x1="190" y1="388" x2="305" y2="385" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Labels on arrows -->
  <text x="248" y="135" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563eb" font-style="italic">smooth</text>
  <text x="248" y="258" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#db2777" font-style="italic">smooth</text>
  <text x="248" y="378" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a" font-style="italic">smooth</text>

  <!-- ========== Right: Terminal Object (True) ========== -->

  <!-- True - the terminal object -->
  <circle cx="620" cy="270" r="60" fill="#fefce8" stroke="#eab308" stroke-width="3"/>
  <circle cx="620" cy="270" r="50" fill="#fffbeb" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="620" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#854d0e">True</text>
  <text x="620" y="287" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207">terminal object</text>

  <!-- Label -->
  <text x="620" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">
    Universal Invariant
  </text>

  <!-- Arrows: Measures → True (all converge) -->
  <line x1="415" y1="145" x2="565" y2="252" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <line x1="415" y1="265" x2="560" y2="268" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <line x1="415" y1="385" x2="565" y2="290" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>

  <!-- Labels on convergence arrows -->
  <text x="490" y="188" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#d97706" font-style="italic">∃! factorization</text>
  <text x="487" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#d97706" font-style="italic">∃! factorization</text>
  <text x="490" y="355" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#d97706" font-style="italic">∃! factorization</text>

  <!-- ========== Proof witness ========== -->
  <rect x="560" y="355" width="120" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="620" y="378" text-anchor="middle" font-family="monospace" font-size="14" fill="#166534" font-weight="bold">trivial</text>
  <line x1="620" y1="330" x2="620" y2="352" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="645" y="345" font-family="sans-serif" font-size="10" fill="#16a34a" font-style="italic">proof</text>

  <!-- ========== Category label ========== -->
  <rect x="250" y="440" width="300" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">
    Category of Propositions (Prop)
  </text>
  <text x="400" y="479" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">
    True is terminal • Every P : Prop admits P → True
  </text>

  <!-- ========== Caption ========== -->
  <text x="400" y="525" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    Fig. 1: The universal property of parametrized smooth complexity — all measures factor uniquely through True.
  </text>
</svg>
