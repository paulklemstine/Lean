<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Stacky Embedded Factorization Algorithm (a8e5)
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal Property of the Entanglement Information Stack
  </text>

  <!-- === Left: Type Universe X === -->
  <ellipse cx="150" cy="200" rx="90" ry="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="185" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e40af">X : Type*</text>
  <text x="150" y="205" text-anchor="middle" font-family="serif" font-size="12" fill="#3b82f6">(Quantum State Space)</text>

  <!-- Ground state dot -->
  <circle cx="150" cy="230" r="6" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="165" y="235" font-family="monospace" font-size="11" fill="#1e3a8a">default</text>
  <text x="150" y="255" text-anchor="middle" font-family="serif" font-size="10" fill="#64748b">[Inhabited X]</text>

  <!-- === Center: Stacky Fibration === -->
  <rect x="310" y="140" width="180" height="120" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#9a3412">Stacky</text>
  <text x="400" y="195" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#9a3412">Fibration</text>
  <text x="400" y="220" text-anchor="middle" font-family="serif" font-size="11" fill="#c2410c">Identity fibration</text>
  <text x="400" y="237" text-anchor="middle" font-family="serif" font-size="11" fill="#c2410c">over Ent(X)</text>

  <!-- === Right: Terminal Object True === -->
  <circle cx="650" cy="200" r="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="650" y="195" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#166534">True</text>
  <text x="650" y="215" text-anchor="middle" font-family="serif" font-size="11" fill="#15803d">Terminal Object</text>

  <!-- Arrow: X → Stack -->
  <line x1="240" y1="200" x2="305" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="272" y="190" text-anchor="middle" font-family="serif" font-size="11" fill="#2563eb">embed</text>

  <!-- Arrow: Stack → True -->
  <line x1="495" y1="200" x2="595" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="545" y="190" text-anchor="middle" font-family="serif" font-size="11" fill="#16a34a">factor</text>

  <!-- Arrow: X → True (direct, curved) -->
  <path d="M 200 155 Q 400 80 600 160" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
  <text x="400" y="100" text-anchor="middle" font-family="monospace" font-size="12" fill="#ea580c">trivial</text>
  <text x="400" y="115" text-anchor="middle" font-family="serif" font-size="10" fill="#ea580c">(universal morphism)</text>

  <!-- === Bottom Left: Tropical Degeneration === -->
  <rect x="60" y="340" width="220" height="130" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="170" y="365" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#9d174d">Tropical Degeneration</text>

  <!-- Tropical tent function -->
  <polyline points="90,440 170,380 250,440" fill="none" stroke="#db2777" stroke-width="2.5"/>
  <circle cx="90" cy="440" r="3" fill="#db2777"/>
  <circle cx="170" cy="380" r="3" fill="#db2777"/>
  <circle cx="250" cy="440" r="3" fill="#db2777"/>
  <text x="85" y="455" font-family="monospace" font-size="9" fill="#9d174d">θ=0</text>
  <text x="160" y="375" font-family="monospace" font-size="9" fill="#9d174d">θ=π/4</text>
  <text x="238" y="455" font-family="monospace" font-size="9" fill="#9d174d">θ=π/2</text>
  <text x="170" y="465" text-anchor="middle" font-family="serif" font-size="10" fill="#64748b">S_trop(θ) — piecewise linear</text>

  <!-- === Bottom Center: Entanglement Entropy === -->
  <rect x="310" y="340" width="220" height="130" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="420" y="365" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#5b21b6">Entanglement Entropy</text>

  <!-- Smooth entropy curve -->
  <path d="M 340,440 C 370,410 390,390 420,385 C 450,390 470,410 500,440" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="340" cy="440" r="3" fill="#7c3aed"/>
  <circle cx="420" cy="385" r="3" fill="#7c3aed"/>
  <circle cx="500" cy="440" r="3" fill="#7c3aed"/>
  <text x="335" y="455" font-family="monospace" font-size="9" fill="#5b21b6">|00⟩</text>
  <text x="405" y="380" font-family="monospace" font-size="9" fill="#5b21b6">Bell</text>
  <text x="490" y="455" font-family="monospace" font-size="9" fill="#5b21b6">|11⟩</text>
  <text x="420" y="465" text-anchor="middle" font-family="serif" font-size="10" fill="#64748b">S(ρ_A) — von Neumann</text>

  <!-- === Bottom Right: Proof === -->
  <rect x="560" y="340" width="200" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="365" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#166534">Lean 4 Proof</text>
  <text x="660" y="395" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">theorem ... :=</text>
  <text x="660" y="415" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">  True := by</text>
  <text x="660" y="435" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">trivial</text>
  <text x="660" y="460" text-anchor="middle" font-family="serif" font-size="10" fill="#64748b">QED ∎</text>

  <!-- Connecting arrows bottom -->
  <line x1="170" y1="340" x2="170" y2="280" stroke="#db2777" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="340" x2="400" y2="265" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="660" y1="340" x2="650" y2="255" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>

  <!-- Caption -->
  <text x="400" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    Figure 1: The stacky embedded factorization. Any inhabited type X embeds into the
  </text>
  <text x="400" y="536" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    entanglement stack and factors uniquely through the terminal object True.
  </text>
  <text x="400" y="552" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">
    The tropical degeneration (bottom left) approximates the smooth entropy curve (bottom center).
  </text>

  <!-- Legend -->
  <rect x="30" y="565" width="12" height="12" fill="#2563eb" rx="2"/>
  <text x="47" y="576" font-family="serif" font-size="10" fill="#334155">Type/States</text>
  <rect x="130" y="565" width="12" height="12" fill="#ea580c" rx="2"/>
  <text x="147" y="576" font-family="serif" font-size="10" fill="#334155">Stacky Fibration</text>
  <rect x="260" y="565" width="12" height="12" fill="#16a34a" rx="2"/>
  <text x="277" y="576" font-family="serif" font-size="10" fill="#334155">Terminal/Proof</text>
  <rect x="370" y="565" width="12" height="12" fill="#db2777" rx="2"/>
  <text x="387" y="576" font-family="serif" font-size="10" fill="#334155">Tropical</text>
  <rect x="460" y="565" width="12" height="12" fill="#7c3aed" rx="2"/>
  <text x="477" y="576" font-family="serif" font-size="10" fill="#334155">Quantum Entropy</text>
</svg>
