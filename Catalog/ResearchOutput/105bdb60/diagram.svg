<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Holomorphic Proper PROP Protocol — Structural Diagram
  </text>

  <!-- ================================================================ -->
  <!-- Layer 1: Three source domains -->
  <!-- ================================================================ -->

  <!-- Holomorphic Structure (left) -->
  <rect x="40" y="70" width="220" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Holomorphic Structure</text>
  <text x="150" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">Complex-analytic charts</text>
  <text x="150" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">Cauchy–Riemann coherence</text>
  <text x="150" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">Transition matrix M_t</text>

  <!-- PROP Protocol (center) -->
  <rect x="310" y="70" width="220" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Proper PROP</text>
  <text x="420" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Symmetric monoidal category</text>
  <text x="420" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Universal property</text>
  <text x="420" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Objects = ℕ, morphisms = ops</text>

  <!-- Information Topology (right) -->
  <rect x="580" y="70" width="220" height="110" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="690" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9a3412">Information Topology</text>
  <text x="690" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f97316">Inhabited type (X, x₀)</text>
  <text x="690" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f97316">Kolmogorov complexity K(·)</text>
  <text x="690" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f97316">Compression invariants</text>

  <!-- ================================================================ -->
  <!-- Arrows from sources to central node -->
  <!-- ================================================================ -->

  <!-- Left → Center -->
  <path d="M 260 125 Q 310 200 370 250" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  <text x="285" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" transform="rotate(-40, 285, 200)">analytify</text>

  <!-- Center → Center -->
  <line x1="420" y1="180" x2="420" y2="240" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="445" y="215" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">encode</text>

  <!-- Right → Center -->
  <path d="M 580 125 Q 530 200 470 250" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arroworange)"/>
  <text x="555" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ea580c" transform="rotate(40, 555, 200)">measure</text>

  <!-- ================================================================ -->
  <!-- Layer 2: Convergence node -->
  <!-- ================================================================ -->

  <rect x="310" y="250" width="220" height="80" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="420" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#92400e">Holomorphic PROP Rank</text>
  <text x="420" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#b45309">hpr(X) = lim rank_trop(M_t)</text>
  <text x="420" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d97706">t → 0</text>

  <!-- ================================================================ -->
  <!-- Layer 3: Tropical degeneration -->
  <!-- ================================================================ -->

  <line x1="420" y1="330" x2="420" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="460" y="355" font-family="Arial, sans-serif" font-size="10" fill="#666" font-style="italic">tropicalize</text>

  <!-- Tropical semiring box -->
  <rect x="280" y="375" width="280" height="70" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">Tropical Semiring (ℝ ∪ {−∞}, max, +)</text>
  <text x="420" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7c3aed">Rank stabilizes → combinatorial skeleton</text>
  <text x="420" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7c3aed">Max-plus entropy bounded</text>

  <!-- ================================================================ -->
  <!-- Layer 4: Result -->
  <!-- ================================================================ -->

  <line x1="420" y1="445" x2="420" y2="485" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="460" y="470" font-family="Arial, sans-serif" font-size="10" fill="#666" font-style="italic">collapse</text>

  <!-- The theorem box -->
  <rect x="250" y="490" width="340" height="70" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="3" filter="url(#shadow)"/>
  <text x="420" y="518" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#065f46">Universal Property ≡ True</text>
  <text x="420" y="540" text-anchor="middle" font-family="monospace" font-size="12" fill="#047857">theorem ... : True := by trivial</text>

  <!-- ================================================================ -->
  <!-- Side annotations -->
  <!-- ================================================================ -->

  <!-- Left side: Lean 4 badge -->
  <rect x="40" y="500" width="140" height="45" rx="8" fill="#1e293b" stroke="none"/>
  <text x="110" y="520" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">Lean 4 + Mathlib</text>
  <text x="110" y="536" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">Machine-verified ✓</text>

  <!-- Right side: Applications -->
  <rect x="680" y="380" width="170" height="100" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="765" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#be123c">Applications</text>
  <text x="765" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e11d48">• Number theory valuations</text>
  <text x="765" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e11d48">• Compression bounds</text>
  <text x="765" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e11d48">• Representation theory</text>
  <text x="765" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e11d48">• Algebraic K-theory</text>

  <line x1="560" y1="420" x2="675" y2="430" stroke="#e11d48" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Caption -->
  <text x="450" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    Fig. 1: The holomorphic proper PROP protocol connects three domains through tropical degeneration,
  </text>
  <text x="450" y="615" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    revealing that the universal property collapses to a type-theoretic tautology.
  </text>
</svg>
