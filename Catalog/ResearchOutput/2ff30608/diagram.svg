<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Graph-Theoretic Connected Algebra Principle
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal property over inhabited types via tropical duality
  </text>

  <!-- ═══ LEFT: State Graph ═══ -->
  <text x="175" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">
    State Graph (X inhabited)
  </text>

  <!-- Graph vertices (quantum states) -->
  <!-- |00⟩ -->
  <circle cx="120" cy="150" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">|00⟩</text>

  <!-- |01⟩ -->
  <circle cx="230" cy="150" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">|01⟩</text>

  <!-- |10⟩ -->
  <circle cx="120" cy="260" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="265" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">|10⟩</text>

  <!-- |11⟩ -->
  <circle cx="230" cy="260" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="265" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">|11⟩</text>

  <!-- Inhabited marker (star) -->
  <circle cx="120" cy="150" r="28" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="85" y="130" font-family="sans-serif" font-size="9" fill="#d97706">default</text>

  <!-- Edges (algebraic transitions) -->
  <line x1="142" y1="150" x2="208" y2="150" stroke="#2563eb" stroke-width="2"/>
  <line x1="120" y1="172" x2="120" y2="238" stroke="#2563eb" stroke-width="2"/>
  <line x1="230" y1="172" x2="230" y2="238" stroke="#2563eb" stroke-width="2"/>
  <line x1="142" y1="260" x2="208" y2="260" stroke="#2563eb" stroke-width="2"/>
  <line x1="137" y1="167" x2="213" y2="243" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="213" y1="167" x2="137" y2="243" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Edge labels -->
  <text x="175" y="142" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3b82f6">bit-flip</text>
  <text x="100" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3b82f6" transform="rotate(-90, 100, 210)">bit-flip</text>

  <!-- ═══ CENTER: Arrow & Universal Property ═══ -->
  <line x1="280" y1="200" x2="340" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="310" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Universal</text>
  <text x="310" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Property</text>

  <!-- Central result box -->
  <rect x="350" y="160" width="120" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#15803d">True</text>
  <text x="410" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">:= trivial</text>

  <!-- ═══ RIGHT: Tropical Dual ═══ -->
  <line x1="480" y1="200" x2="540" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="510" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Tropical</text>
  <text x="510" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Duality</text>

  <text x="650" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">
    Tropical Distance Matrix
  </text>

  <!-- Distance matrix -->
  <rect x="565" y="110" width="170" height="170" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Matrix content -->
  <text x="577" y="105" font-family="monospace" font-size="11" fill="#7c3aed">(min, +) semiring</text>

  <text x="605" y="145" font-family="monospace" font-size="13" fill="#4c1d95">0  1  1  2</text>
  <text x="605" y="170" font-family="monospace" font-size="13" fill="#4c1d95">1  0  2  1</text>
  <text x="605" y="195" font-family="monospace" font-size="13" fill="#4c1d95">1  2  0  1</text>
  <text x="605" y="220" font-family="monospace" font-size="13" fill="#4c1d95">2  1  1  0</text>

  <!-- Row/col labels -->
  <text x="585" y="145" font-family="monospace" font-size="9" fill="#a78bfa">00</text>
  <text x="585" y="170" font-family="monospace" font-size="9" fill="#a78bfa">01</text>
  <text x="585" y="195" font-family="monospace" font-size="9" fill="#a78bfa">10</text>
  <text x="585" y="220" font-family="monospace" font-size="9" fill="#a78bfa">11</text>

  <text x="650" y="260" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">
    All entries finite ⟺ connected
  </text>

  <!-- ═══ BOTTOM: Category Theory Perspective ═══ -->
  <rect x="50" y="320" width="700" height="220" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>

  <text x="400" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c2410c">
    Categorical Framework
  </text>

  <!-- Functor diagram -->
  <!-- Category of Inhabited Types -->
  <ellipse cx="160" cy="420" rx="90" ry="50" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="410" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">InhType</text>
  <text x="160" y="428" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a16207">(X, default x)</text>
  <text x="160" y="445" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a16207">Objects: inhabited types</text>

  <!-- Arrow: Functor -->
  <line x1="260" y1="420" x2="350" y2="420" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="305" y="408" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ea580c">F</text>
  <text x="305" y="440" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ea580c">Connected</text>
  <text x="305" y="452" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ea580c">Algebra Functor</text>

  <!-- Category of Propositions -->
  <ellipse cx="440" cy="420" rx="70" ry="50" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="410" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">Prop</text>
  <text x="440" y="430" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d">F(X) = True</text>
  <text x="440" y="448" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#15803d">∀ X inhabited</text>

  <!-- Arrow: to Tropical -->
  <line x1="520" y1="420" x2="580" y2="420" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="550" y="408" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed">dual</text>

  <!-- Tropical Category -->
  <ellipse cx="670" cy="420" rx="70" ry="50" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="410" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">Trop</text>
  <text x="670" y="428" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">Distance matrices</text>
  <text x="670" y="445" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6d28d9">over (ℝ∪{∞}, min, +)</text>

  <!-- Legend -->
  <rect x="80" y="485" width="12" height="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="98" y="496" font-family="sans-serif" font-size="10" fill="#334155">Quantum states</text>

  <rect x="220" y="485" width="12" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="238" y="496" font-family="sans-serif" font-size="10" fill="#334155">Universal property (True)</text>

  <rect x="410" y="485" width="12" height="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="428" y="496" font-family="sans-serif" font-size="10" fill="#334155">Tropical dual</text>

  <rect x="580" y="485" width="12" height="12" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="598" y="496" font-family="sans-serif" font-size="10" fill="#334155">Inhabited types</text>

  <!-- Caption -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569">
    Figure 1: The connected algebra functor maps inhabited types to True,
  </text>
  <text x="400" y="578" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569">
    with tropical duality providing a concrete distance-matrix invariant.
  </text>
</svg>
