<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="url(#bgGrad)" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Arithmetic Transfinite Continuation Formula
  </text>

  <!-- ═══ LEFT: Inhabited Type X ═══ -->
  <rect x="40" y="70" width="200" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">
    X : Type*
  </text>
  <text x="140" y="115" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b82f6">
    [Inhabited X]
  </text>

  <!-- Elements inside X -->
  <circle cx="90" cy="155" r="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a5f">x₀</text>

  <circle cx="140" cy="155" r="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a5f">x₁</text>

  <circle cx="190" cy="155" r="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e3a5f">x₂</text>

  <text x="140" y="195" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">
    default = x₀
  </text>

  <!-- ═══ CENTER: Transfinite Continuation ═══ -->
  <rect x="290" y="70" width="220" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#92400e">
    Transfinite Continuation
  </text>

  <!-- Ordinal stages -->
  <text x="310" y="125" font-family="monospace" font-size="11" fill="#78350f">Stage 0:</text>
  <rect x="380" y="112" width="110" height="18" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="435" y="126" text-anchor="middle" font-family="monospace" font-size="10" fill="#78350f">f₀ : X → Prop</text>

  <text x="310" y="150" font-family="monospace" font-size="11" fill="#78350f">Stage α:</text>
  <rect x="380" y="137" width="110" height="18" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="435" y="151" text-anchor="middle" font-family="monospace" font-size="10" fill="#78350f">fα : X → Prop</text>

  <text x="310" y="175" font-family="monospace" font-size="11" fill="#78350f">Limit λ:</text>
  <rect x="380" y="162" width="110" height="18" rx="4" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
  <text x="435" y="176" text-anchor="middle" font-family="monospace" font-size="10" fill="#78350f">f_λ = ⋃ fα</text>

  <!-- ═══ RIGHT: Target Predicate ═══ -->
  <rect x="560" y="70" width="200" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#166534">
    Target: True
  </text>

  <text x="660" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#16a34a">✓</text>

  <text x="660" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">
    Universal property
  </text>
  <text x="660" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">
    trivially satisfied
  </text>

  <!-- ═══ ARROWS ═══ -->
  <!-- X → Continuation -->
  <line x1="240" y1="140" x2="285" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="262" y="133" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2563eb">arith</text>

  <!-- Continuation → True -->
  <line x1="510" y1="140" x2="555" y2="140" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="532" y="133" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">∀ α</text>

  <!-- ═══ BOTTOM: Proof Diagram ═══ -->
  <rect x="120" y="260" width="560" height="200" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#334155">
    Proof Structure (Commutative Diagram)
  </text>

  <!-- Nodes of the proof diagram -->
  <!-- X -->
  <ellipse cx="200" cy="340" rx="50" ry="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="345" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e40af">(X, default)</text>

  <!-- Prop -->
  <ellipse cx="400" cy="340" rx="45" ry="25" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="345" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">Prop</text>

  <!-- True -->
  <ellipse cx="600" cy="340" rx="40" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="345" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#166534">True</text>

  <!-- {*} terminal -->
  <ellipse cx="400" cy="420" rx="35" ry="22" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="400" y="425" text-anchor="middle" font-family="monospace" font-size="13" fill="#9d174d">{⋆}</text>

  <!-- Arrows -->
  <line x1="250" y1="340" x2="350" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="300" y="333" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">fα</text>

  <line x1="445" y1="340" x2="555" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="500" y="333" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">P = id</text>

  <line x1="400" y1="365" x2="400" y2="395" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="418" y="383" font-family="sans-serif" font-size="9" fill="#db2777">terminal</text>

  <line x1="220" y1="360" x2="380" y2="403" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="280" y="398" font-family="sans-serif" font-size="9" fill="#64748b">unique</text>

  <line x1="420" y1="403" x2="580" y2="360" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="520" y="398" font-family="sans-serif" font-size="9" fill="#64748b">True.intro</text>

  <!-- Caption -->
  <text x="400" y="502" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#475569">
    Fig. 1: The transfinite continuation factors through the terminal object {⋆},
  </text>
  <text x="400" y="516" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#475569">
    rendering the universal property trivially satisfiable for target predicate True.
  </text>
</svg>
