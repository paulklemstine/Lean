<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <radialGradient id="diskGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#bae6fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="terminalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8" />

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Arithmetic Hyperbolic Transformation Method
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Universal Property in the Poincaré Disk Model
  </text>

  <!-- ═══ LEFT: Poincaré Disk with Lattice Points ═══ -->
  <text x="200" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">
    Inhabited Type X (Algorithm Space)
  </text>

  <!-- Disk boundary -->
  <circle cx="200" cy="250" r="140" fill="url(#diskGrad)" stroke="#1e40af" stroke-width="2" />

  <!-- Geodesics (hyperbolic lines) — arcs -->
  <path d="M 80 180 Q 200 300 320 180" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3" />
  <path d="M 100 320 Q 250 200 300 330" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3" />
  <path d="M 60 250 Q 200 150 340 250" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3" />

  <!-- Arithmetic lattice points -->
  <!-- Row 1 -->
  <circle cx="140" cy="190" r="4" fill="#2563eb" />
  <circle cx="200" cy="190" r="4" fill="#2563eb" />
  <circle cx="260" cy="190" r="4" fill="#2563eb" />
  <!-- Row 2 -->
  <circle cx="140" cy="250" r="4" fill="#2563eb" />
  <circle cx="200" cy="250" r="5" fill="#dc2626" stroke="#991b1b" stroke-width="1" />
  <circle cx="260" cy="250" r="4" fill="#2563eb" />
  <!-- Row 3 -->
  <circle cx="140" cy="310" r="4" fill="#2563eb" />
  <circle cx="200" cy="310" r="4" fill="#2563eb" />
  <circle cx="260" cy="310" r="4" fill="#2563eb" />
  <!-- Outer points -->
  <circle cx="110" cy="220" r="3" fill="#60a5fa" />
  <circle cx="290" cy="220" r="3" fill="#60a5fa" />
  <circle cx="110" cy="280" r="3" fill="#60a5fa" />
  <circle cx="290" cy="280" r="3" fill="#60a5fa" />
  <circle cx="170" cy="160" r="3" fill="#60a5fa" />
  <circle cx="230" cy="160" r="3" fill="#60a5fa" />
  <circle cx="170" cy="340" r="3" fill="#60a5fa" />
  <circle cx="230" cy="340" r="3" fill="#60a5fa" />

  <!-- Label for default element -->
  <text x="215" y="245" font-family="monospace" font-size="10" fill="#991b1b">default</text>

  <!-- Label: Inhabited -->
  <text x="200" y="410" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">
    [Inhabited X] ensures ∃ x₀ : X
  </text>

  <!-- ═══ CENTER: Transformation Arrow ═══ -->
  <line x1="355" y1="250" x2="440" y2="250" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" />
  <text x="398" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">T</text>
  <text x="398" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Möbius</text>
  <text x="398" y="282" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">isometry</text>

  <!-- ═══ RIGHT: Terminal Object (True) ═══ -->
  <text x="600" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">
    Terminal Object: True (Prop)
  </text>

  <!-- Glow effect for terminal object -->
  <circle cx="600" cy="250" r="70" fill="url(#terminalGlow)" />

  <!-- Terminal object circle -->
  <circle cx="600" cy="250" r="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" />
  <text x="600" y="246" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#92400e">True</text>
  <text x="600" y="264" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">.intro</text>

  <!-- Multiple arrows converging to True from different directions -->
  <line x1="480" y1="190" x2="565" y2="230" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)" stroke-dasharray="5,3" />
  <line x1="480" y1="250" x2="555" y2="250" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)" stroke-dasharray="5,3" />
  <line x1="480" y1="310" x2="565" y2="270" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)" stroke-dasharray="5,3" />
  <line x1="600" y1="140" x2="600" y2="205" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" stroke-dasharray="5,3" />
  <line x1="700" y1="200" x2="645" y2="235" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" stroke-dasharray="5,3" />
  <line x1="700" y1="300" x2="645" y2="265" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" stroke-dasharray="5,3" />

  <!-- Labels for converging arrows -->
  <text x="470" y="185" font-family="sans-serif" font-size="9" fill="#2563eb">∀ x₁</text>
  <text x="470" y="248" font-family="sans-serif" font-size="9" fill="#2563eb">∀ x₂</text>
  <text x="470" y="320" font-family="sans-serif" font-size="9" fill="#2563eb">∀ x₃</text>
  <text x="610" y="135" font-family="sans-serif" font-size="9" fill="#dc2626">trivial</text>

  <!-- ═══ BOTTOM: Category Diagram ═══ -->
  <rect x="50" y="440" width="700" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

  <text x="400" y="465" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">
    Categorical View: Universal Property as Terminal Morphism
  </text>

  <!-- Objects -->
  <circle cx="150" cy="505" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text x="150" y="510" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">X</text>

  <circle cx="400" cy="505" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <text x="400" y="510" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">Prop</text>

  <circle cx="650" cy="505" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="650" y="510" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">True</text>

  <!-- Morphisms -->
  <line x1="175" y1="505" x2="373" y2="505" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="274" y="498" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">∃! morphism</text>

  <line x1="425" y1="505" x2="623" y2="505" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="524" y="498" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">terminal map</text>

  <!-- Caption -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    Figure 1: The arithmetic hyperbolic transformation maps all points of the inhabited type X
  </text>
  <text x="400" y="595" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    to the terminal object True via the unique canonical morphism (trivial / True.intro).
  </text>
</svg>
