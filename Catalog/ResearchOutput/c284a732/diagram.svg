<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Symplectic Special Extrapolation Scheme (b671)
  </text>

  <!-- === Left: Inhabited Type X === -->
  <rect x="40" y="70" width="200" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">Type X</text>
  <text x="140" y="125" text-anchor="middle" font-family="monospace" font-size="12" fill="#3b82f6">[Inhabited X]</text>
  <circle cx="140" cy="160" r="8" fill="#2563eb"/>
  <text x="160" y="165" font-family="serif" font-size="11" fill="#1e40af">default : X</text>

  <!-- === Center: Symplectic Space === -->
  <rect x="300" y="70" width="200" height="120" rx="12" fill="#fce7f3" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#991b1b">Symplectic Space</text>
  <text x="400" y="118" text-anchor="middle" font-family="serif" font-size="13" fill="#dc2626">ω : Λ²(V*)</text>
  <text x="400" y="140" text-anchor="middle" font-family="serif" font-size="11" fill="#9f1239">ω(u,v) = −ω(v,u)</text>
  <text x="400" y="160" text-anchor="middle" font-family="serif" font-size="11" fill="#9f1239">dω = 0</text>
  <text x="400" y="178" text-anchor="middle" font-family="serif" font-size="10" fill="#be123c">non-degenerate</text>

  <!-- === Right: Tropical Geometry === -->
  <rect x="560" y="70" width="200" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="100" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#166534">Tropical Geometry</text>
  <text x="660" y="125" text-anchor="middle" font-family="serif" font-size="12" fill="#16a34a">a ⊕ b = min(a,b)</text>
  <text x="660" y="148" text-anchor="middle" font-family="serif" font-size="12" fill="#16a34a">a ⊗ b = a + b</text>
  <text x="660" y="170" text-anchor="middle" font-family="serif" font-size="10" fill="#15803d">piecewise-linear</text>

  <!-- Arrows between top boxes -->
  <line x1="240" y1="130" x2="298" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="270" y="122" text-anchor="middle" font-family="serif" font-size="9" fill="#555">ω</text>

  <line x1="500" y1="130" x2="558" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="530" y="122" text-anchor="middle" font-family="serif" font-size="9" fill="#555">trop</text>

  <!-- === Center: Extrapolation Functor === -->
  <rect x="250" y="250" width="300" height="90" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="400" y="278" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">Extrapolation Scheme</text>
  <text x="400" y="300" text-anchor="middle" font-family="serif" font-size="12" fill="#b45309">E : Inhabited → Prop</text>
  <text x="400" y="322" text-anchor="middle" font-family="serif" font-size="12" fill="#d97706">E(X) = True  ∀ X</text>

  <!-- Arrows from top boxes to center -->
  <line x1="140" y1="190" x2="320" y2="250" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-blue)"/>
  <line x1="400" y1="190" x2="400" y2="248" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-red)"/>
  <line x1="660" y1="190" x2="480" y2="250" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-green)"/>

  <!-- === Bottom: Coherence / Proof === -->
  <rect x="280" y="400" width="240" height="100" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="400" y="432" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#166534">True</text>
  <text x="400" y="458" text-anchor="middle" font-family="serif" font-size="12" fill="#15803d">Proof: trivial</text>
  <text x="400" y="480" text-anchor="middle" font-family="serif" font-size="11" fill="#22c55e">∎ QED</text>

  <!-- Arrow from extrapolation to proof -->
  <line x1="400" y1="340" x2="400" y2="398" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="375" font-family="serif" font-size="10" fill="#92400e">coherence</text>

  <!-- === Factoring connection (left side) === -->
  <rect x="40" y="280" width="160" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="120" y="305" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#5b21b6">Factoring</text>
  <text x="120" y="325" text-anchor="middle" font-family="serif" font-size="11" fill="#7c3aed">n = p × q</text>
  <text x="120" y="340" text-anchor="middle" font-family="serif" font-size="10" fill="#8b5cf6">RSA, semiprimes</text>

  <line x1="200" y1="300" x2="248" y2="290" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- === Kolmogorov connection (right side) === -->
  <rect x="600" y="280" width="160" height="70" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="680" y="305" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#9f1239">Kolmogorov</text>
  <text x="680" y="325" text-anchor="middle" font-family="serif" font-size="11" fill="#e11d48">K(x) complexity</text>
  <text x="680" y="340" text-anchor="middle" font-family="serif" font-size="10" fill="#f43f5e">incompressibility</text>

  <line x1="600" y1="300" x2="552" y2="290" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Universal property label -->
  <text x="400" y="540" text-anchor="middle" font-family="serif" font-size="11" fill="#64748b" font-style="italic">
    Universal Property: The extrapolation scheme is free — all coherence diagrams commute trivially.
  </text>

  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569">
    Figure 1: Architecture of the Symplectic Special Extrapolation Scheme, showing the confluence
  </text>
  <text x="400" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569">
    of inhabited types, symplectic forms, tropical geometry, factoring, and Kolmogorov complexity.
  </text>
</svg>
