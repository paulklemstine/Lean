<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Perfectoid Flat Interference Lemma
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal Property of Inhabited Types
  </text>

  <!-- Left column: Computation Domain -->
  <rect x="40" y="80" width="200" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Computation</text>
  <text x="140" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">Domain</text>

  <!-- Type X circle -->
  <circle cx="140" cy="175" r="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="172" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e40af">X</text>
  <text x="140" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">[Inhabited]</text>

  <!-- Default element -->
  <circle cx="140" cy="235" r="8" fill="#2563eb"/>
  <text x="140" y="238" text-anchor="middle" font-family="monospace" font-size="8" fill="white">d</text>
  <text x="165" y="238" font-family="sans-serif" font-size="9" fill="#64748b">default</text>

  <!-- Center: Perfectoid Bridge -->
  <rect x="280" y="80" width="240" height="180" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ca8a04">Perfectoid</text>
  <text x="400" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207">Flat Interference</text>

  <!-- Interference waves -->
  <path d="M 310 160 Q 330 145, 350 160 Q 370 175, 390 160 Q 410 145, 430 160 Q 450 175, 470 160 Q 490 145, 500 160" fill="none" stroke="#eab308" stroke-width="2" opacity="0.6"/>
  <path d="M 310 175 Q 330 160, 350 175 Q 370 190, 390 175 Q 410 160, 430 175 Q 450 190, 470 175 Q 490 160, 500 175" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <path d="M 310 190 Q 330 175, 350 190 Q 370 205, 390 190 Q 410 175, 430 190 Q 450 205, 470 190 Q 490 175, 500 190" fill="none" stroke="#d97706" stroke-width="2" opacity="0.6"/>

  <!-- Collapse arrow -->
  <line x1="400" y1="210" x2="400" y2="240" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="230" font-family="sans-serif" font-size="9" fill="#a16207">collapse</text>

  <!-- True box -->
  <rect x="370" y="242" width="60" height="25" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="400" y="259" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="white">True</text>

  <!-- Right column: Algebraic Topology -->
  <rect x="560" y="80" width="200" height="180" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Algebraic</text>
  <text x="660" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b91c1c">Topology</text>

  <!-- Simplicial complex -->
  <polygon points="660,150 620,210 700,210" fill="none" stroke="#dc2626" stroke-width="2"/>
  <polygon points="660,150 640,180 680,180" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="660" cy="150" r="4" fill="#dc2626"/>
  <circle cx="620" cy="210" r="4" fill="#dc2626"/>
  <circle cx="700" cy="210" r="4" fill="#dc2626"/>
  <circle cx="640" cy="180" r="4" fill="#ef4444"/>
  <circle cx="680" cy="180" r="4" fill="#ef4444"/>
  <text x="660" y="240" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991b1b">Coherent Sheaf</text>

  <!-- Arrows between columns -->
  <line x1="245" y1="170" x2="275" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="260" y="162" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">encode</text>

  <line x1="525" y1="170" x2="555" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="540" y="162" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">decode</text>

  <!-- Bottom section: Universal Property -->
  <rect x="100" y="300" width="600" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="325" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Universal Property</text>

  <!-- Central True node -->
  <circle cx="400" cy="400" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="400" y="405" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#15803d">True</text>

  <!-- Surrounding nodes with arrows -->
  <!-- Node 1: Any Prop P -->
  <rect x="140" y="345" width="90" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="185" y="365" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">P : Prop</text>
  <line x1="233" y1="365" x2="368" y2="395" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)" stroke-dasharray="4,3"/>
  <text x="290" y="370" font-family="sans-serif" font-size="8" fill="#3b82f6">∃ morphism</text>

  <!-- Node 2: Inhabited X -->
  <rect x="140" y="430" width="110" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="450" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">Inhabited X</text>
  <line x1="253" y1="440" x2="368" y2="410" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <text x="300" y="435" font-family="sans-serif" font-size="8" fill="#3b82f6">witness</text>

  <!-- Node 3: Flat Module -->
  <rect x="560" y="345" width="110" height="30" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="615" y="365" text-anchor="middle" font-family="monospace" font-size="11" fill="#991b1b">Flat Module</text>
  <line x1="557" y1="365" x2="432" y2="393" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)" stroke-dasharray="4,3"/>
  <text x="505" y="370" font-family="sans-serif" font-size="8" fill="#dc2626">coherence</text>

  <!-- Node 4: Kolmogorov -->
  <rect x="555" y="430" width="130" height="30" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="450" text-anchor="middle" font-family="monospace" font-size="11" fill="#991b1b">K-complexity</text>
  <line x1="552" y1="440" x2="432" y2="410" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <text x="500" y="435" font-family="sans-serif" font-size="8" fill="#dc2626">minimal</text>

  <!-- Unique factorization annotation -->
  <text x="400" y="485" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d" font-style="italic">
    Every morphism factors uniquely through True — the terminal object
  </text>

  <!-- Caption -->
  <text x="400" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569" font-style="italic">
    Figure 1: The Perfectoid Flat Interference Lemma as a universal property diagram.
  </text>
  <text x="400" y="565" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#94a3b8">
    Inhabited types guarantee coherence; the interference of flatness conditions collapses to Truth.
  </text>
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#94a3b8">
    Lean 4 proof: trivial | Domain: Computation × Algebraic Topology
  </text>
</svg>
