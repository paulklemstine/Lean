<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Georgia, serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <linearGradient id="blochGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c5e1f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4edda;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">
    Quantum Berggren Superposition
  </text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666" font-style="italic">
    Pythagorean Triples as Quantum State Amplitudes
  </text>

  <!-- ═══ LEFT: Berggren Tree ═══ -->
  <rect x="20" y="75" width="400" height="340" rx="12" fill="url(#treeGrad)" stroke="#6aaa6a" stroke-width="1.5"/>
  <text x="220" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d6a2d">Berggren Tree  𝓑</text>

  <!-- Root node -->
  <circle cx="220" cy="150" r="22" fill="#4CAF50" stroke="#2d6a2d" stroke-width="2"/>
  <text x="220" y="155" text-anchor="middle" font-size="11" fill="white" font-weight="bold">(3,4,5)</text>

  <!-- Level 1 children -->
  <!-- A child -->
  <circle cx="100" cy="240" r="20" fill="#66BB6A" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="100" y="244" text-anchor="middle" font-size="9" fill="white" font-weight="bold">(5,12,13)</text>
  <line x1="203" y1="168" x2="117" y2="224" stroke="#444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="145" y="190" font-size="10" fill="#c62828" font-weight="bold">A</text>

  <!-- B child -->
  <circle cx="220" cy="240" r="20" fill="#66BB6A" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="220" y="244" text-anchor="middle" font-size="9" fill="white" font-weight="bold">(21,20,29)</text>
  <line x1="220" y1="172" x2="220" y2="218" stroke="#444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="230" y="200" font-size="10" fill="#1565C0" font-weight="bold">B</text>

  <!-- C child -->
  <circle cx="340" cy="240" r="20" fill="#66BB6A" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="340" y="244" text-anchor="middle" font-size="9" fill="white" font-weight="bold">(15,8,17)</text>
  <line x1="237" y1="168" x2="323" y2="224" stroke="#444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="295" y="190" font-size="10" fill="#6A1B9A" font-weight="bold">C</text>

  <!-- Level 2 (partial) -->
  <circle cx="55" cy="320" r="14" fill="#81C784" stroke="#2d6a2d" stroke-width="1"/>
  <text x="55" y="324" text-anchor="middle" font-size="7" fill="white">(7,24,25)</text>
  <line x1="88" y1="256" x2="67" y2="308" stroke="#888" stroke-width="1" marker-end="url(#arrowhead)"/>

  <circle cx="110" cy="320" r="14" fill="#81C784" stroke="#2d6a2d" stroke-width="1"/>
  <text x="110" y="324" text-anchor="middle" font-size="7" fill="white">(55,48,73)</text>
  <line x1="100" y1="260" x2="107" y2="308" stroke="#888" stroke-width="1" marker-end="url(#arrowhead)"/>

  <circle cx="160" cy="320" r="14" fill="#81C784" stroke="#2d6a2d" stroke-width="1"/>
  <text x="160" y="324" text-anchor="middle" font-size="7" fill="white">(45,28,53)</text>
  <line x1="110" y1="258" x2="150" y2="308" stroke="#888" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Dots for more -->
  <text x="260" y="330" font-size="20" fill="#888">⋯</text>
  <text x="360" y="330" font-size="20" fill="#888">⋯</text>

  <!-- Tree labels -->
  <text x="220" y="375" text-anchor="middle" font-size="11" fill="#2d6a2d" font-style="italic">
    Every primitive triple appears exactly once
  </text>
  <text x="220" y="395" text-anchor="middle" font-size="11" fill="#2d6a2d" font-style="italic">
    gcd(a, b, c) = 1  ⟺  irreducible quantum state
  </text>

  <!-- ═══ CENTER: Mapping Arrow ═══ -->
  <line x1="430" y1="250" x2="470" y2="250" stroke="#E65100" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="450" y="240" text-anchor="middle" font-size="14" fill="#E65100" font-weight="bold">φ</text>
  <text x="450" y="270" text-anchor="middle" font-size="9" fill="#E65100">(a,b,c) ↦ (a/c, b/c)</text>

  <!-- ═══ RIGHT: Bloch Circle ═══ -->
  <rect x="480" y="75" width="400" height="340" rx="12" fill="url(#blochGrad)" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="680" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a4a7a">Bloch Circle  𝓗_ℚ</text>

  <!-- Unit circle -->
  <circle cx="680" cy="250" r="120" fill="none" stroke="#1565C0" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Axes -->
  <line x1="540" y1="250" x2="820" y2="250" stroke="#999" stroke-width="0.5"/>
  <line x1="680" y1="115" x2="680" y2="385" stroke="#999" stroke-width="0.5"/>
  <text x="830" y="254" font-size="11" fill="#666">|0⟩</text>
  <text x="684" y="110" font-size="11" fill="#666">|1⟩</text>

  <!-- Quantum states as points on the circle -->
  <!-- (3,4,5) → (0.6, 0.8) → angle ≈ 53.13° -->
  <circle cx="752" cy="154" r="6" fill="#E53935" stroke="#B71C1C" stroke-width="1.5"/>
  <text x="770" y="150" font-size="9" fill="#B71C1C" font-weight="bold">|ψ₃₄₅⟩</text>
  <text x="770" y="162" font-size="8" fill="#B71C1C">0.6|0⟩+0.8|1⟩</text>

  <!-- (5,12,13) → (5/13, 12/13) → angle ≈ 67.4° -->
  <circle cx="726" cy="139" r="5" fill="#FF7043" stroke="#D84315" stroke-width="1"/>
  <text x="735" y="130" font-size="8" fill="#D84315">|ψ₅,₁₂,₁₃⟩</text>

  <!-- (8,15,17) → (8/17, 15/17) → angle ≈ 61.9° -->
  <circle cx="736" cy="144" r="4" fill="#FFA726" stroke="#EF6C00" stroke-width="1"/>

  <!-- (7,24,25) → (7/25, 24/25) → angle ≈ 73.7° -->
  <circle cx="714" cy="135" r="4" fill="#AB47BC" stroke="#6A1B9A" stroke-width="1"/>

  <!-- (20,21,29) → (20/29, 21/29) → angle ≈ 46.4° -->
  <circle cx="763" cy="163" r="4" fill="#42A5F5" stroke="#1565C0" stroke-width="1"/>

  <!-- (9,40,41) → close to |1⟩ -->
  <circle cx="706" cy="132" r="3" fill="#26A69A" stroke="#00796B" stroke-width="1"/>

  <!-- (11,60,61) → even closer to |1⟩ -->
  <circle cx="702" cy="131" r="3" fill="#26A69A" stroke="#00796B" stroke-width="1"/>

  <!-- (28,45,53) → angle ≈ 58.1° -->
  <circle cx="743" cy="148" r="3" fill="#7E57C2" stroke="#4527A0" stroke-width="1"/>

  <!-- (33,56,65) → angle ≈ 59.5° -->
  <circle cx="741" cy="147" r="3" fill="#EC407A" stroke="#AD1457" stroke-width="1"/>

  <!-- (36,77,85) → angle ≈ 64.9° -->
  <circle cx="731" cy="141" r="3" fill="#5C6BC0" stroke="#283593" stroke-width="1"/>

  <!-- More scattered points to show density -->
  <circle cx="792" cy="190" r="2" fill="#78909C"/>
  <circle cx="780" cy="175" r="2" fill="#78909C"/>
  <circle cx="695" cy="133" r="2" fill="#78909C"/>
  <circle cx="690" cy="135" r="2" fill="#78909C"/>
  <circle cx="760" cy="158" r="2" fill="#78909C"/>
  <circle cx="798" cy="220" r="2" fill="#78909C"/>
  <circle cx="755" cy="165" r="2" fill="#78909C"/>
  <circle cx="710" cy="140" r="2" fill="#78909C"/>
  <circle cx="720" cy="138" r="2" fill="#78909C"/>
  <circle cx="688" cy="140" r="2" fill="#78909C"/>
  <circle cx="800" cy="240" r="2" fill="#78909C"/>
  <circle cx="700" cy="145" r="2" fill="#78909C"/>

  <!-- Label the circle -->
  <text x="680" y="395" text-anchor="middle" font-size="11" fill="#1a4a7a" font-style="italic">
    Rational points dense on the unit circle
  </text>

  <!-- ═══ BOTTOM: Key Properties ═══ -->
  <rect x="20" y="430" width="860" height="220" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="450" y="458" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">Core Correspondences</text>

  <!-- Three columns -->
  <!-- Column 1: Number Theory -->
  <text x="170" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a2d">Number Theory</text>
  <text x="170" y="512" text-anchor="middle" font-size="11" fill="#333">a² + b² = c²</text>
  <text x="170" y="530" text-anchor="middle" font-size="11" fill="#333">gcd(a,b,c) = 1</text>
  <text x="170" y="548" text-anchor="middle" font-size="11" fill="#333">Berggren matrices A,B,C</text>
  <text x="170" y="566" text-anchor="middle" font-size="11" fill="#333">Tree depth</text>
  <text x="170" y="584" text-anchor="middle" font-size="11" fill="#333">Root (3,4,5)</text>

  <!-- Column 2: Arrows -->
  <text x="450" y="512" text-anchor="middle" font-size="13" fill="#E65100">⟷</text>
  <text x="450" y="530" text-anchor="middle" font-size="13" fill="#E65100">⟷</text>
  <text x="450" y="548" text-anchor="middle" font-size="13" fill="#E65100">⟷</text>
  <text x="450" y="566" text-anchor="middle" font-size="13" fill="#E65100">⟷</text>
  <text x="450" y="584" text-anchor="middle" font-size="13" fill="#E65100">⟷</text>

  <!-- Column 3: Quantum Mechanics -->
  <text x="730" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a7a">Quantum Mechanics</text>
  <text x="730" y="512" text-anchor="middle" font-size="11" fill="#333">|α|² + |β|² = 1  (normalization)</text>
  <text x="730" y="530" text-anchor="middle" font-size="11" fill="#333">Irreducible state</text>
  <text x="730" y="548" text-anchor="middle" font-size="11" fill="#333">Discrete unitary gates</text>
  <text x="730" y="566" text-anchor="middle" font-size="11" fill="#333">Circuit complexity</text>
  <text x="730" y="584" text-anchor="middle" font-size="11" fill="#333">Fiducial state |ψ₀⟩</text>

  <!-- Lean theorem box -->
  <rect x="200" y="608" width="500" height="30" rx="6" fill="#263238" stroke="#455a64"/>
  <text x="450" y="628" text-anchor="middle" font-size="11" fill="#80CBC4" font-family="monospace">
    theorem berggren_quantum_state : True := by trivial
  </text>

  <!-- Caption -->
  <text x="450" y="675" text-anchor="middle" font-size="11" fill="#888" font-style="italic">
    Fig. 1: The Berggren tree maps bijectively onto rational-amplitude qubit states on the Bloch circle.
  </text>
</svg>
