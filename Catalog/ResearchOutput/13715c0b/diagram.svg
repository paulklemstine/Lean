<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <!-- Gradient for the symplectic region -->
    <linearGradient id="sympGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7b68ee;stop-opacity:0.15"/>
    </linearGradient>
    <!-- Gradient for the tropical region -->
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0.15"/>
    </linearGradient>
    <!-- Gradient for the compression region -->
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.15"/>
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90d9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Symplectic Recursive Derived Functor Method
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Connecting Symplectic Geometry, Tropical Algebra &amp; Information Compression
  </text>

  <!-- ================================================================== -->
  <!-- Three main domains as overlapping circles (Venn-like) -->
  <!-- ================================================================== -->

  <!-- Symplectic Geometry (top-left) -->
  <ellipse cx="300" cy="220" rx="175" ry="130" fill="url(#sympGrad)" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="210" y="145" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#2c6fbb">
    Symplectic Geometry
  </text>

  <!-- Tropical Geometry (top-right) -->
  <ellipse cx="600" cy="220" rx="175" ry="130" fill="url(#tropGrad)" stroke="#27ae60" stroke-width="2.5"/>
  <text x="590" y="145" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1a8a4a">
    Tropical Geometry
  </text>

  <!-- Compression / Information Theory (bottom-center) -->
  <ellipse cx="450" cy="370" rx="175" ry="130" fill="url(#compGrad)" stroke="#c0392b" stroke-width="2.5"/>
  <text x="450" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#a93226">
    Information Compression
  </text>

  <!-- ================================================================== -->
  <!-- Content in each region -->
  <!-- ================================================================== -->

  <!-- Symplectic region content -->
  <text x="195" y="185" font-family="monospace" font-size="12" fill="#34495e">ω = Σ dp∧dq</text>
  <text x="195" y="205" font-family="monospace" font-size="12" fill="#34495e">J = [0,I;-I,0]</text>
  <text x="195" y="225" font-family="monospace" font-size="11" fill="#7f8c8d">Phase space (p,q)</text>
  <text x="195" y="245" font-family="monospace" font-size="11" fill="#7f8c8d">Non-degenerate</text>

  <!-- Tropical region content -->
  <text x="620" y="185" font-family="monospace" font-size="12" fill="#34495e">a⊕b = max(a,b)</text>
  <text x="620" y="205" font-family="monospace" font-size="12" fill="#34495e">a⊙b = a + b</text>
  <text x="620" y="225" font-family="monospace" font-size="11" fill="#7f8c8d">Max-plus algebra</text>
  <text x="620" y="245" font-family="monospace" font-size="11" fill="#7f8c8d">rk_trop(M)</text>

  <!-- Compression region content -->
  <text x="390" y="395" font-family="monospace" font-size="12" fill="#34495e">H(p) = -Σ p log p</text>
  <text x="390" y="415" font-family="monospace" font-size="12" fill="#34495e">K(x) = min|prog|</text>
  <text x="390" y="435" font-family="monospace" font-size="11" fill="#7f8c8d">Shannon entropy</text>

  <!-- ================================================================== -->
  <!-- Intersection labels -->
  <!-- ================================================================== -->

  <!-- Symplectic ∩ Tropical (top center) -->
  <text x="450" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8e44ad">
    Tropicalization
  </text>
  <text x="450" y="212" text-anchor="middle" font-family="monospace" font-size="10" fill="#8e44ad">
    ω → ω_trop
  </text>

  <!-- Symplectic ∩ Compression (bottom-left) -->
  <text x="340" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8e44ad">
    Derived
  </text>
  <text x="340" y="327" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8e44ad">
    Functor R^nF
  </text>

  <!-- Tropical ∩ Compression (bottom-right) -->
  <text x="560" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8e44ad">
    H_trop ≈ K(x)
  </text>
  <text x="560" y="327" text-anchor="middle" font-family="monospace" font-size="10" fill="#8e44ad">
    max(-p log p)
  </text>

  <!-- Center (all three) -->
  <circle cx="450" cy="275" r="25" fill="#8e44ad" fill-opacity="0.15" stroke="#8e44ad" stroke-width="2"/>
  <text x="450" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#8e44ad">
    True
  </text>
  <text x="450" y="285" text-anchor="middle" font-family="monospace" font-size="8" fill="#8e44ad">
    ∀ X [Inhabited X]
  </text>

  <!-- ================================================================== -->
  <!-- Arrows showing the recursive construction -->
  <!-- ================================================================== -->

  <!-- Left: Inhabited X feeds into the construction -->
  <rect x="30" y="260" width="100" height="40" rx="8" fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="2"/>
  <text x="80" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#d68910">
    Inhabited X
  </text>
  <text x="80" y="290" text-anchor="middle" font-family="monospace" font-size="9" fill="#d68910">
    (non-empty type)
  </text>
  <line x1="130" y1="280" x2="185" y2="250" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowBlue)" stroke-dasharray="5,3"/>

  <!-- Right: Quantum Computing application -->
  <rect x="770" y="260" width="110" height="40" rx="8" fill="#9b59b6" fill-opacity="0.2" stroke="#9b59b6" stroke-width="2"/>
  <text x="825" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8e44ad">
    Quantum
  </text>
  <text x="825" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#8e44ad">
    Computing
  </text>
  <line x1="715" y1="250" x2="770" y2="270" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowPurple)" stroke-dasharray="5,3"/>

  <!-- ================================================================== -->
  <!-- Bottom: The recursive/categorical diagram -->
  <!-- ================================================================== -->

  <line x1="100" y1="510" x2="800" y2="510" stroke="#bdc3c7" stroke-width="1"/>

  <!-- Categorical diagram: A → I• → F(I•) → H^n -->
  <rect x="60" y="530" width="80" height="35" rx="6" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="100" y="553" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c3e50">A ∈ 𝒜</text>

  <line x1="140" y1="548" x2="210" y2="548" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="175" y="540" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f8c8d">inj. res.</text>

  <rect x="210" y="530" width="100" height="35" rx="6" fill="#2ecc71" fill-opacity="0.15" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="260" y="553" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c3e50">I⁰→I¹→···</text>

  <line x1="310" y1="548" x2="380" y2="548" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="345" y="540" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f8c8d">apply F</text>

  <rect x="380" y="530" width="100" height="35" rx="6" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="430" y="553" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c3e50">F(I•)</text>

  <line x1="480" y1="548" x2="550" y2="548" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="515" y="540" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f8c8d">cohomology</text>

  <rect x="550" y="530" width="100" height="35" rx="6" fill="#8e44ad" fill-opacity="0.15" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="600" y="553" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c3e50">R^nF(A)</text>

  <line x1="650" y1="548" x2="720" y2="548" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="685" y="540" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f8c8d">universal</text>

  <rect x="720" y="530" width="100" height="35" rx="6" fill="#f39c12" fill-opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="770" y="553" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c3e50">H_trop</text>

  <!-- Recursive arrow (back from R^nF to I•) -->
  <path d="M 600 565 C 600 595 260 595 260 565" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="430" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#8e44ad">
    recursive refinement (derived functor iteration)
  </text>

  <!-- Caption -->
  <text x="450" y="635" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#95a5a6">
    Figure: The symplectic-tropical-compression triangle with recursive derived functor construction
  </text>
</svg>
