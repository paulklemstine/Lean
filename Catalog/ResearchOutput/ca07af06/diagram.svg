<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="truthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#222">
    Stacky Flat Capacity Characterization
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#666">
    Universal property: Inhabited X → flat capacity = True
  </text>

  <!-- Left: Complexity Space X (stacky) -->
  <ellipse cx="200" cy="220" rx="140" ry="110" fill="url(#spaceGrad)" stroke="#4A90D9" stroke-width="2"/>
  <text x="200" y="120" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#4A90D9">
    X : Type*
  </text>
  <text x="200" y="138" text-anchor="middle" font-family="monospace" font-size="11" fill="#4A90D9">
    [Inhabited X]
  </text>

  <!-- Points inside X -->
  <circle cx="160" cy="190" r="6" fill="#7B68EE" opacity="0.6"/>
  <circle cx="220" cy="210" r="6" fill="#7B68EE" opacity="0.6"/>
  <circle cx="180" cy="260" r="6" fill="#7B68EE" opacity="0.6"/>
  <circle cx="240" cy="250" r="6" fill="#7B68EE" opacity="0.6"/>
  <circle cx="150" cy="230" r="6" fill="#7B68EE" opacity="0.6"/>

  <!-- Base point (default) — highlighted -->
  <circle cx="200" cy="220" r="10" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <text x="200" y="225" text-anchor="middle" font-family="monospace" font-size="8" fill="white" font-weight="bold">★</text>
  <text x="200" y="300" text-anchor="middle" font-family="monospace" font-size="11" fill="#E74C3C">
    default : X
  </text>
  <text x="200" y="316" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">
    (base point / stacky section)
  </text>

  <!-- Arrow from X to True -->
  <line x1="350" y1="220" x2="500" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="425" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">
    flat_capacity
  </text>
  <text x="425" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">
    trivial
  </text>

  <!-- Right: Prop (True) -->
  <rect x="520" y="170" width="120" height="100" rx="15" fill="url(#truthGrad)" stroke="#27AE60" stroke-width="2"/>
  <text x="580" y="215" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="white">
    True
  </text>
  <text x="580" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="white">
    : Prop
  </text>
  <text x="580" y="155" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#27AE60">
    Target
  </text>

  <!-- Proof witness -->
  <text x="580" y="295" text-anchor="middle" font-family="monospace" font-size="11" fill="#27AE60">
    True.intro
  </text>
  <text x="580" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">
    (canonical proof witness)
  </text>

  <!-- Bottom: Categorical diagram -->
  <line x1="100" y1="370" x2="700" y2="370" stroke="#DDD" stroke-width="1"/>

  <text x="400" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#555">
    Categorical View: Pointed Types → Prop
  </text>

  <!-- Category diagram -->
  <!-- Object 1: Type* -->
  <rect x="80" y="415" width="100" height="35" rx="5" fill="#F0E6FF" stroke="#7B68EE" stroke-width="1.5"/>
  <text x="130" y="437" text-anchor="middle" font-family="monospace" font-size="11" fill="#7B68EE">Type*</text>

  <!-- Object 2: Pointed -->
  <rect x="260" y="415" width="120" height="35" rx="5" fill="#FFE6E6" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="320" y="437" text-anchor="middle" font-family="monospace" font-size="11" fill="#E74C3C">Type*_pointed</text>

  <!-- Object 3: Prop -->
  <rect x="460" y="415" width="80" height="35" rx="5" fill="#E6FFE6" stroke="#27AE60" stroke-width="1.5"/>
  <text x="500" y="437" text-anchor="middle" font-family="monospace" font-size="11" fill="#27AE60">Prop</text>

  <!-- Object 4: {True} -->
  <rect x="620" y="415" width="80" height="35" rx="5" fill="#27AE60" stroke="#1a8a47" stroke-width="1.5"/>
  <text x="660" y="437" text-anchor="middle" font-family="monospace" font-size="11" fill="white">{True}</text>

  <!-- Arrows -->
  <line x1="180" y1="432" x2="255" y2="432" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="218" y="425" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888">Inhabited</text>

  <line x1="380" y1="432" x2="455" y2="432" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="418" y="425" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888">capacity</text>

  <line x1="540" y1="432" x2="615" y2="432" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="578" y="425" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888">collapses</text>

  <!-- Caption -->
  <text x="400" y="485" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999" font-style="italic">
    Figure 1. The stacky flat capacity maps any inhabited type to True via the universal property.
  </text>
</svg>
