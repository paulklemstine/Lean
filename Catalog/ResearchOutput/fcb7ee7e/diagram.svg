<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Constructive Solvable Total Derivative Characterization
  </text>
  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b" font-style="italic">
    Universal Property via Yoneda Embedding
  </text>

  <!-- ===================== Left: Inhabited Type X ===================== -->
  <ellipse cx="150" cy="220" rx="90" ry="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="170" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e40af">X : Type*</text>
  <text x="150" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">[Inhabited X]</text>

  <!-- Elements inside X -->
  <circle cx="120" cy="220" r="8" fill="#3b82f6" opacity="0.7"/>
  <text x="120" y="224" text-anchor="middle" font-size="9" fill="white" font-weight="bold">x₁</text>
  <circle cx="155" cy="240" r="8" fill="#3b82f6" opacity="0.7"/>
  <text x="155" y="244" text-anchor="middle" font-size="9" fill="white" font-weight="bold">x₂</text>
  <circle cx="175" cy="210" r="8" fill="#3b82f6" opacity="0.7"/>
  <text x="175" y="214" text-anchor="middle" font-size="9" fill="white" font-weight="bold">x₃</text>

  <!-- Default element (highlighted) -->
  <circle cx="135" cy="255" r="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="135" y="259" text-anchor="middle" font-size="8" fill="white" font-weight="bold">def</text>
  <text x="135" y="278" text-anchor="middle" font-size="9" fill="#92400e" font-style="italic">default</text>

  <!-- ===================== Center: Total Derivative ===================== -->
  <rect x="310" y="170" width="180" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="400" y="198" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#166534">∂/∂x (Total Deriv)</text>
  <text x="400" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">f(x) = c (constant)</text>
  <text x="400" y="242" text-anchor="middle" font-family="monospace" font-size="13" fill="#166534">∇f ≡ 0</text>
  <text x="400" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a" font-style="italic">→ solvable ✓</text>

  <!-- ===================== Right: Terminal Object (True) ===================== -->
  <circle cx="650" cy="220" r="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="650" y="210" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#991b1b">True</text>
  <text x="650" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#dc2626">Terminal Object</text>
  <text x="650" y="248" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">⊤ : Prop</text>

  <!-- ===================== Arrows ===================== -->
  <!-- X → Total Derivative -->
  <line x1="240" y1="220" x2="305" y2="220" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="272" y="212" text-anchor="middle" font-size="10" fill="#2563eb" font-style="italic">apply</text>

  <!-- Total Derivative → True -->
  <line x1="495" y1="220" x2="590" y2="220" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="542" y="212" text-anchor="middle" font-size="10" fill="#16a34a" font-style="italic">solvable</text>

  <!-- X → True (universal morphism, curved) -->
  <path d="M 200 160 Q 400 60 610 175" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowhead-red)"/>
  <text x="400" y="95" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#dc2626">trivial</text>
  <text x="400" y="112" text-anchor="middle" font-size="10" fill="#991b1b" font-style="italic">universal morphism !</text>

  <!-- ===================== Bottom: Yoneda / Category Diagram ===================== -->
  <!-- Yoneda box -->
  <rect x="80" y="370" width="250" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="205" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#92400e">Yoneda Lemma</text>
  <text x="205" y="418" text-anchor="middle" font-family="monospace" font-size="11" fill="#78350f">Nat(Hom(X, −), F) ≅ F(X)</text>
  <text x="205" y="442" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207">For F = Const(True):</text>
  <text x="205" y="462" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">F(X) = True</text>
  <text x="205" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b45309" font-style="italic">∀ X inhabited</text>

  <!-- Curry-Howard box -->
  <rect x="400" y="370" width="320" height="120" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="560" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5b21b6">Curry-Howard Correspondence</text>
  <text x="560" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6d28d9">Propositions = Types</text>
  <text x="560" y="442" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6d28d9">Proofs = Terms</text>
  <text x="560" y="465" text-anchor="middle" font-family="monospace" font-size="12" fill="#5b21b6">True ≅ Unit</text>
  <text x="560" y="482" text-anchor="middle" font-family="monospace" font-size="11" fill="#7c3aed">trivial : True := True.intro</text>

  <!-- Connection arrow between boxes -->
  <line x1="335" y1="430" x2="395" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="365" y="422" text-anchor="middle" font-size="9" fill="#666">↔</text>

  <!-- Arrow from Total Derivative box down to Yoneda -->
  <path d="M 350 270 Q 300 340 250 365" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Arrow from True down to Curry-Howard -->
  <path d="M 650 275 Q 630 340 600 365" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- ===================== Legend ===================== -->
  <rect x="30" y="520" width="740" height="45" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="60" cy="542" r="6" fill="#2563eb"/>
  <text x="75" y="546" font-size="10" fill="#334155">Inhabited Type</text>
  <rect x="170" y="536" width="12" height="12" rx="2" fill="#dcfce7" stroke="#16a34a"/>
  <text x="190" y="546" font-size="10" fill="#334155">Solvable Derivative</text>
  <circle cx="320" cy="542" r="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="335" y="546" font-size="10" fill="#334155">Terminal (True)</text>
  <rect x="430" y="536" width="12" height="12" rx="2" fill="#fef3c7" stroke="#d97706"/>
  <text x="450" y="546" font-size="10" fill="#334155">Yoneda</text>
  <rect x="510" y="536" width="12" height="12" rx="2" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="530" y="546" font-size="10" fill="#334155">Curry-Howard</text>
  <line x1="620" y1="542" x2="650" y2="542" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="660" y="546" font-size="10" fill="#334155">Universal morphism</text>

  <!-- Caption -->
  <text x="400" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
    Figure 1: The universal property of the solvable total derivative — every inhabited type maps uniquely to True.
  </text>
</svg>
