<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Derived Completed Spinor Conjecture (a92a)
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Universal collapse of spinor invariants for inhabited types
  </text>

  <!-- Box 1: Type X (Inhabited) -->
  <rect x="50" y="90" width="200" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="118" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1e40af">X : Type*</text>
  <text x="150" y="140" text-anchor="middle" font-family="monospace" font-size="12" fill="#3b82f6">[Inhabited X]</text>
  <line x1="80" y1="155" x2="220" y2="155" stroke="#93c5fd" stroke-width="1"/>
  <text x="150" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">Has default element</text>
  <text x="150" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">x₀ : X</text>

  <!-- Dots representing elements -->
  <circle cx="100" cy="195" r="3" fill="#2563eb" opacity="0.4"/>
  <circle cx="120" cy="200" r="3" fill="#2563eb" opacity="0.4"/>
  <circle cx="140" cy="195" r="3" fill="#2563eb" opacity="0.4"/>
  <circle cx="160" cy="198" r="3" fill="#2563eb" opacity="0.4"/>
  <circle cx="180" cy="195" r="3" fill="#2563eb" opacity="0.4"/>
  <circle cx="130" cy="195" r="5" fill="#2563eb" opacity="0.9"/>
  <text x="130" y="193" text-anchor="middle" font-family="monospace" font-size="7" fill="white">x₀</text>

  <!-- Box 2: Derived Spinor Completion -->
  <rect x="300" y="90" width="200" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="118" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">Spinor(X)</text>
  <text x="400" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b45309">Derived completion</text>
  <line x1="330" y1="155" x2="470" y2="155" stroke="#fbbf24" stroke-width="1"/>
  <text x="400" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">Orientation data</text>
  <text x="400" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">collapses to unit</text>

  <!-- Spiral/spinor symbol -->
  <path d="M385,195 Q395,180 405,195 Q415,210 400,200" fill="none" stroke="#d97706" stroke-width="1.5"/>

  <!-- Box 3: True (Terminal Object) -->
  <rect x="550" y="90" width="200" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="118" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#166534">True</text>
  <text x="650" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">Terminal object in Prop</text>
  <line x1="580" y1="155" x2="720" y2="155" stroke="#86efac" stroke-width="1"/>
  <text x="650" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">Unique proof:</text>
  <text x="650" y="192" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">True.intro</text>

  <!-- Check mark -->
  <path d="M640,195 L647,202 L660,189" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arrow 1: X → Spinor(X) -->
  <line x1="250" y1="150" x2="295" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="272" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">derive</text>

  <!-- Arrow 2: Spinor(X) → True -->
  <line x1="500" y1="150" x2="545" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="522" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">collapse</text>

  <!-- Big curved arrow: direct proof X → True -->
  <path d="M150,215 Q400,310 650,215" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowGreen)"/>
  <text x="400" y="290" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#16a34a">trivial</text>
  <text x="400" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">Direct proof (bypasses intermediate structure)</text>

  <!-- Category diagram section -->
  <rect x="50" y="340" width="700" height="170" rx="10" fill="white" fill-opacity="0.6" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#334155">
    Universal Property (Yoneda perspective)
  </text>

  <!-- Universal property diagram -->
  <!-- Object P -->
  <circle cx="200" cy="430" r="25" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="200" y="435" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#5b21b6">P</text>
  <text x="200" y="470" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">Any Prop</text>

  <!-- Object True -->
  <circle cx="600" cy="430" r="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="435" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#166534">⊤</text>
  <text x="600" y="470" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d">True (terminal)</text>

  <!-- Arrow P → True -->
  <line x1="225" y1="430" x2="570" y2="430" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="422" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c3aed">∃! morphism (terminal property)</text>

  <!-- Notation: for all P, Hom(P, True) ≅ {*} -->
  <text x="400" y="495" text-anchor="middle" font-family="monospace" font-size="12" fill="#334155">
    ∀ P : Prop, (P → True) ≃ Unit
  </text>

  <!-- Caption -->
  <text x="400" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    Fig. 1: The derived spinor completion of an inhabited type collapses to True, the terminal object in Prop.
  </text>
</svg>
