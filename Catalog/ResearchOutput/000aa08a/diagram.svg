<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">
    Stacky Injective Tensor Criterion
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#64748b">
    Network Sheaf Space with Stacky Structure
  </text>

  <!-- ===== LEFT: Network Graph (Neural Network) ===== -->
  <text x="150" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">
    Neural Network Graph G
  </text>

  <!-- Input layer nodes -->
  <circle cx="80" cy="150" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="155" text-anchor="middle" font-size="11" fill="#1e40af">x₁</text>
  <circle cx="80" cy="210" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="215" text-anchor="middle" font-size="11" fill="#1e40af">x₂</text>
  <circle cx="80" cy="270" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="275" text-anchor="middle" font-size="11" fill="#1e40af">x₃</text>

  <!-- Hidden layer nodes -->
  <circle cx="180" cy="170" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="175" text-anchor="middle" font-size="11" fill="#166534">h₁</text>
  <circle cx="180" cy="250" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="255" text-anchor="middle" font-size="11" fill="#166534">h₂</text>

  <!-- Output node -->
  <circle cx="270" cy="210" r="18" fill="#fae8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="270" y="215" text-anchor="middle" font-size="11" fill="#7e22ce">y</text>

  <!-- Edges (weight matrices = restriction maps) -->
  <line x1="98" y1="150" x2="162" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="98" y1="155" x2="162" y2="245" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="98" y1="210" x2="162" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="98" y1="215" x2="162" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="98" y1="270" x2="162" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="198" y1="175" x2="252" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="198" y1="245" x2="252" y2="215" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Layer labels -->
  <text x="80" y="310" text-anchor="middle" font-size="10" fill="#64748b">Input</text>
  <text x="180" y="310" text-anchor="middle" font-size="10" fill="#64748b">Hidden</text>
  <text x="270" y="310" text-anchor="middle" font-size="10" fill="#64748b">Output</text>

  <!-- ===== MIDDLE: Sheaf Assignment ===== -->
  <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">
    Network Sheaf ℱ
  </text>

  <!-- Sheaf spaces (feature spaces) -->
  <rect x="340" y="120" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" font-size="11" fill="#166534">ℱ(input) = ℝ³</text>
  <text x="400" y="158" text-anchor="middle" font-size="10" fill="#166534" font-style="italic">feature space</text>

  <rect x="340" y="190" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-size="11" fill="#166534">ℱ(hidden) = ℝ²</text>
  <text x="400" y="228" text-anchor="middle" font-size="10" fill="#166534" font-style="italic">feature space</text>

  <rect x="340" y="260" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#166534">ℱ(output) = ℝ¹</text>
  <text x="400" y="298" text-anchor="middle" font-size="10" fill="#166534" font-style="italic">feature space</text>

  <!-- Restriction map arrows -->
  <line x1="400" y1="170" x2="400" y2="188" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="430" y="183" font-size="9" fill="#16a34a">W₁ (restriction)</text>
  
  <line x1="400" y1="240" x2="400" y2="258" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="430" y="253" font-size="9" fill="#16a34a">W₂ (restriction)</text>

  <!-- ===== RIGHT: Stacky Structure ===== -->
  <text x="650" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#9333ea">
    Stacky Structure
  </text>

  <!-- 2-morphism diagram -->
  <rect x="580" y="110" width="140" height="100" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,3"/>
  
  <circle cx="620" cy="140" r="12" fill="#e9d5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="620" y="144" text-anchor="middle" font-size="9" fill="#7e22ce">ℱ</text>
  
  <circle cx="700" cy="140" r="12" fill="#e9d5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="700" y="144" text-anchor="middle" font-size="9" fill="#7e22ce">ℱ'</text>
  
  <!-- 1-morphism -->
  <line x1="635" y1="135" x2="685" y2="135" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="660" y="130" text-anchor="middle" font-size="8" fill="#9333ea">φ</text>
  
  <line x1="635" y1="148" x2="685" y2="148" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="660" y="162" text-anchor="middle" font-size="8" fill="#9333ea">ψ</text>
  
  <!-- 2-morphism (double arrow) -->
  <text x="660" y="145" text-anchor="middle" font-size="12" fill="#9333ea">⇓ α</text>
  
  <text x="650" y="195" text-anchor="middle" font-size="9" fill="#7e22ce" font-style="italic">
    2-morphisms = gauge
  </text>
  <text x="650" y="207" text-anchor="middle" font-size="9" fill="#7e22ce" font-style="italic">
    transformations
  </text>

  <!-- Injective tensor box -->
  <rect x="580" y="225" width="140" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="650" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">
    Tensor Criterion
  </text>
  <text x="650" y="268" text-anchor="middle" font-size="10" fill="#c2410c">
    − ⊗ ℱ preserves
  </text>
  <text x="650" y="283" text-anchor="middle" font-size="10" fill="#c2410c">
    injections ⟺ flat
  </text>
  <text x="650" y="298" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="bold">
    ✓ Always true!
  </text>

  <!-- ===== BOTTOM: Proof Reduction ===== -->
  <rect x="100" y="340" width="600" height="120" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  
  <text x="400" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">
    Proof Reduction Chain
  </text>

  <!-- Reduction steps -->
  <rect x="120" y="380" width="120" height="35" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="402" text-anchor="middle" font-size="10" fill="#1e40af">Stacky Descent</text>

  <text x="252" y="400" text-anchor="middle" font-size="16" fill="#64748b">→</text>

  <rect x="265" y="380" width="120" height="35" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="325" y="402" text-anchor="middle" font-size="10" fill="#166534">Stalk Flatness</text>

  <text x="397" y="400" text-anchor="middle" font-size="16" fill="#64748b">→</text>

  <rect x="410" y="380" width="120" height="35" rx="6" fill="#fae8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="470" y="398" text-anchor="middle" font-size="10" fill="#7e22ce">Modules/Field</text>
  <text x="470" y="410" text-anchor="middle" font-size="9" fill="#7e22ce">are Flat</text>

  <text x="542" y="400" text-anchor="middle" font-size="16" fill="#64748b">→</text>

  <rect x="555" y="380" width="120" height="35" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="615" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">True ∎</text>

  <text x="400" y="448" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">
    Lean 4 proof: trivial (all categorical abstractions unwind to a tautology)
  </text>

  <!-- ===== Inhabited condition note ===== -->
  <rect x="180" y="475" width="440" height="55" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="400" y="495" text-anchor="middle" font-size="11" fill="#1e40af">
    Hypothesis: [Inhabited X] — the base type has a distinguished element
  </text>
  <text x="400" y="512" text-anchor="middle" font-size="10" fill="#3b82f6">
    Ensures non-trivial stalks → tensor product preserves structure → criterion holds
  </text>

  <!-- Caption -->
  <text x="400" y="565" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">
    Figure 1: The stacky injective tensor criterion on network sheaf spaces.
  </text>
  <text x="400" y="582" text-anchor="middle" font-size="10" fill="#475569">
    The neural network graph (left) induces a sheaf (center) with stacky 2-categorical structure (right).
  </text>
  <text x="400" y="596" text-anchor="middle" font-size="10" fill="#475569">
    The injective tensor criterion reduces through categorical descent to a tautology.
  </text>
</svg>
