<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Georgia, serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">
    p-Adic Optimal Frequency Corollary — Structural Diagram
  </text>

  <!-- === Three Pillars === -->

  <!-- Pillar 1: Tropical Semiring (left) -->
  <rect x="40" y="70" width="240" height="160" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Tropical Semiring</text>
  <text x="160" y="120" text-anchor="middle" font-size="13" fill="#1e3a5f">𝕋 = (ℝ ∪ {−∞}, ⊕, ⊙)</text>
  <text x="160" y="145" text-anchor="middle" font-size="13" fill="#1e3a5f">a ⊕ b = max(a, b)</text>
  <text x="160" y="165" text-anchor="middle" font-size="13" fill="#1e3a5f">a ⊙ b = a + b</text>
  <text x="160" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">ReLU(x) = 0 ⊕ x</text>
  <text x="160" y="218" text-anchor="middle" font-size="11" fill="#64748b">Piecewise-linear geometry</text>

  <!-- Pillar 2: p-Adic Analysis (center) -->
  <rect x="330" y="70" width="240" height="160" rx="10" fill="#fce7f3" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#9f1239">p-Adic Analysis</text>
  <text x="450" y="120" text-anchor="middle" font-size="13" fill="#5f1e3a">vₚ : ℚ× → ℤ</text>
  <text x="450" y="145" text-anchor="middle" font-size="13" fill="#5f1e3a">|x|ₚ = p^{−vₚ(x)}</text>
  <text x="450" y="170" text-anchor="middle" font-size="13" fill="#5f1e3a">Ultrametric: |x+y|ₚ ≤ max(|x|ₚ,|y|ₚ)</text>
  <text x="450" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Hierarchical structure</text>
  <text x="450" y="218" text-anchor="middle" font-size="11" fill="#64748b">Non-Archimedean topology</text>

  <!-- Pillar 3: Category Theory (right) -->
  <rect x="620" y="70" width="240" height="160" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Category Theory</text>
  <text x="740" y="120" text-anchor="middle" font-size="13" fill="#1e5f3a">Backprop = Cotangent Functor</text>
  <text x="740" y="145" text-anchor="middle" font-size="13" fill="#1e5f3a">F: Para → Smooth</text>
  <text x="740" y="170" text-anchor="middle" font-size="13" fill="#1e5f3a">T*F ∘ T*G = T*(G ∘ F)</text>
  <text x="740" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Chain rule = functoriality</text>
  <text x="740" y="218" text-anchor="middle" font-size="11" fill="#64748b">Compositional learning</text>

  <!-- Connecting arrows between pillars -->
  <line x1="280" y1="150" x2="330" y2="150" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <line x1="570" y1="150" x2="620" y2="150" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>

  <!-- === Central Node: The Corollary === -->
  <rect x="280" y="280" width="340" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="450" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">p-Adic Optimal Frequency Corollary</text>
  <text x="450" y="335" text-anchor="middle" font-size="14" fill="#78350f">∀ (X : Type*) [Inhabited X], True</text>
  <text x="450" y="358" text-anchor="middle" font-size="12" fill="#92400e">Base case of the universal construction</text>

  <!-- Arrows from pillars to central node -->
  <line x1="160" y1="230" x2="350" y2="280" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="450" y1="230" x2="450" y2="280" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="740" y1="230" x2="550" y2="280" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- === Neural Network Diagram (bottom left) === -->
  <text x="150" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Neural Network (Tropical View)</text>

  <!-- Input layer -->
  <circle cx="60" cy="460" r="12" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <circle cx="60" cy="500" r="12" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <circle cx="60" cy="540" r="12" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="575" text-anchor="middle" font-size="10" fill="#64748b">Input</text>

  <!-- Hidden layer 1 -->
  <circle cx="150" cy="450" r="12" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <circle cx="150" cy="490" r="12" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <circle cx="150" cy="530" r="12" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <circle cx="150" cy="550" r="12" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="575" text-anchor="middle" font-size="10" fill="#64748b">ReLU = 0⊕x</text>

  <!-- Hidden layer 2 (optimal frequency layer, highlighted) -->
  <rect x="220" y="435" width="40" height="130" rx="5" fill="#fef9c3" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>
  <circle cx="240" cy="460" r="12" fill="#fde047" stroke="#d97706" stroke-width="2"/>
  <circle cx="240" cy="500" r="12" fill="#fde047" stroke="#d97706" stroke-width="2"/>
  <circle cx="240" cy="540" r="12" fill="#fde047" stroke="#d97706" stroke-width="2"/>
  <text x="240" y="575" text-anchor="middle" font-size="10" fill="#d97706" font-weight="bold">Optimal freq.</text>

  <!-- Connections (sparse) -->
  <line x1="72" y1="460" x2="138" y2="450" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="72" y1="460" x2="138" y2="490" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="72" y1="500" x2="138" y2="490" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="72" y1="500" x2="138" y2="530" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="72" y1="540" x2="138" y2="530" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="72" y1="540" x2="138" y2="550" stroke="#cbd5e1" stroke-width="1"/>

  <line x1="162" y1="450" x2="228" y2="460" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="162" y1="490" x2="228" y2="460" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="162" y1="490" x2="228" y2="500" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="162" y1="530" x2="228" y2="500" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="162" y1="530" x2="228" y2="540" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="162" y1="550" x2="228" y2="540" stroke="#cbd5e1" stroke-width="1"/>

  <!-- === p-Adic Tree (bottom center) === -->
  <text x="450" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">p-Adic Valuation Tree (p=2)</text>

  <!-- Tree structure -->
  <circle cx="450" cy="450" r="8" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="465" y="448" font-size="10" fill="#dc2626">v₂=0</text>

  <line x1="445" y1="458" x2="410" y2="485" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="455" y1="458" x2="490" y2="485" stroke="#dc2626" stroke-width="1.5"/>

  <circle cx="410" cy="490" r="8" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <circle cx="490" cy="490" r="8" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <text x="395" y="488" font-size="10" fill="#dc2626" text-anchor="end">v₂=1</text>
  <text x="505" y="488" font-size="10" fill="#dc2626">v₂=1</text>

  <line x1="405" y1="498" x2="385" y2="520" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="415" y1="498" x2="435" y2="520" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="485" y1="498" x2="465" y2="520" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="495" y1="498" x2="515" y2="520" stroke="#dc2626" stroke-width="1.5"/>

  <circle cx="385" cy="525" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="435" cy="525" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="465" cy="525" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="515" cy="525" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="555" text-anchor="middle" font-size="10" fill="#64748b">Ultrametric hierarchy ≅ layer depth</text>

  <!-- === Functorial Diagram (bottom right) === -->
  <text x="740" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Functorial Backpropagation</text>

  <!-- Category diagram -->
  <rect x="660" y="440" width="50" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="460" text-anchor="middle" font-size="12" fill="#166534">A</text>

  <rect x="770" y="440" width="50" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="795" y="460" text-anchor="middle" font-size="12" fill="#166534">B</text>

  <rect x="660" y="510" width="50" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="530" text-anchor="middle" font-size="12" fill="#166534">T*A</text>

  <rect x="770" y="510" width="50" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="795" y="530" text-anchor="middle" font-size="12" fill="#166534">T*B</text>

  <!-- Arrows -->
  <line x1="710" y1="455" x2="770" y2="455" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="740" y="448" text-anchor="middle" font-size="11" fill="#16a34a">f</text>

  <line x1="770" y1="525" x2="710" y2="525" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="740" y="518" text-anchor="middle" font-size="11" fill="#16a34a">T*f</text>

  <line x1="685" y1="470" x2="685" y2="510" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="4,2"/>
  <line x1="795" y1="470" x2="795" y2="510" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="4,2"/>

  <text x="740" y="560" text-anchor="middle" font-size="10" fill="#64748b">T* reverses arrows (backprop)</text>

  <!-- Caption -->
  <rect x="40" y="590" width="820" height="25" rx="4" fill="#f1f5f9"/>
  <text x="450" y="607" text-anchor="middle" font-size="12" fill="#475569">
    Figure: Three mathematical perspectives unified by the p-adic optimal frequency corollary. The corollary (gold box) anchors the construction.
  </text>
</svg>
