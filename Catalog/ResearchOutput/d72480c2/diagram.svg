<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Probabilistic Étale Total Derivative Corollary
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal Property via Yoneda in the Category of Inhabited Types
  </text>
  
  <!-- === LEFT: Inhabited Type X === -->
  <g transform="translate(120, 180)">
    <!-- Type circle -->
    <circle cx="0" cy="0" r="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-80" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#2563eb">
      X : Type*
    </text>
    <text x="0" y="-62" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b82f6">
      [Inhabited X]
    </text>
    
    <!-- Elements -->
    <circle cx="0" cy="-20" r="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="0" y="-16" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">x₀</text>
    <text x="20" y="-8" font-family="serif" font-size="9" fill="#1e40af">default</text>
    
    <circle cx="-30" cy="25" r="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <text x="-30" y="28" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e3a8a">x₁</text>
    
    <circle cx="30" cy="25" r="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <text x="30" y="28" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e3a8a">x₂</text>
    
    <circle cx="0" cy="50" r="8" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <text x="0" y="53" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e3a8a">x₃</text>
    
    <!-- Dirac measure annotation -->
    <text x="0" y="95" text-anchor="middle" font-family="serif" font-size="11" fill="#1e40af">
      δ(x₀) = canonical measure
    </text>
  </g>
  
  <!-- === CENTER: Étale Total Derivative === -->
  <g transform="translate(400, 180)">
    <!-- Derivative box -->
    <rect x="-80" y="-55" width="160" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="-32" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#16a34a">
      D_ét
    </text>
    <text x="0" y="-14" text-anchor="middle" font-family="serif" font-size="11" fill="#15803d">
      Étale Total
    </text>
    <text x="0" y="2" text-anchor="middle" font-family="serif" font-size="11" fill="#15803d">
      Derivative
    </text>
    
    <!-- Formula -->
    <text x="0" y="28" text-anchor="middle" font-family="serif" font-size="10" fill="#166534">
      ∀ U ⊆ X open:
    </text>
    <text x="0" y="43" text-anchor="middle" font-family="serif" font-size="10" fill="#166534">
      D_ét|_U is local iso
    </text>
    
    <!-- Trivial topology note -->
    <rect x="-75" y="65" width="150" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="0" y="84" text-anchor="middle" font-family="serif" font-size="10" fill="#854d0e">
      Trivial topology ⟹ vacuous!
    </text>
  </g>
  
  <!-- === RIGHT: Universal Property === -->
  <g transform="translate(660, 180)">
    <!-- Universal property triangle -->
    <polygon points="0,-65 70,50 -70,50" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="0" y="-72" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#db2777">
      Universal Property
    </text>
    
    <!-- Vertices -->
    <text x="0" y="-40" text-anchor="middle" font-family="monospace" font-size="10" fill="#9d174d">F(X)</text>
    <text x="-55" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#9d174d">Hom</text>
    <text x="55" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#9d174d">hX</text>
    
    <!-- Yoneda label -->
    <text x="0" y="10" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="#be185d">
      Yoneda
    </text>
    <text x="0" y="25" text-anchor="middle" font-family="serif" font-size="10" fill="#be185d">
      ≅
    </text>
    
    <!-- Result -->
    <text x="0" y="80" text-anchor="middle" font-family="serif" font-size="10" fill="#9d174d">
      ∃! gluing for all
    </text>
    <text x="0" y="93" text-anchor="middle" font-family="serif" font-size="10" fill="#9d174d">
      compatible families
    </text>
  </g>
  
  <!-- === ARROWS connecting components === -->
  <!-- X → D_ét -->
  <line x1="200" y1="170" x2="310" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="255" y="162" text-anchor="middle" font-family="serif" font-size="10" fill="#475569">
    probabilistic
  </text>
  <text x="255" y="148" text-anchor="middle" font-family="serif" font-size="10" fill="#475569">
    structure
  </text>
  
  <!-- D_ét → Universal -->
  <line x1="490" y1="170" x2="585" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="537" y="162" text-anchor="middle" font-family="serif" font-size="10" fill="#475569">
    satisfies
  </text>
  
  <!-- === BOTTOM: Tropical Degeneration === -->
  <g transform="translate(400, 420)">
    <rect x="-180" y="-35" width="360" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="0" y="-12" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ea580c">
      Tropical Degeneration
    </text>
    <text x="0" y="8" text-anchor="middle" font-family="serif" font-size="11" fill="#c2410c">
      (ℝ, +, ×) ──→ (ℝ ∪ {∞}, min, +)  via Maslov dequantization
    </text>
    <text x="0" y="25" text-anchor="middle" font-family="serif" font-size="10" fill="#9a3412">
      Universal property preserved: combinatorial invariant
    </text>
  </g>
  
  <!-- Arrow from center to tropical -->
  <line x1="400" y1="290" x2="400" y2="378" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="415" y="340" font-family="serif" font-size="10" fill="#ea580c">
    t → 0
  </text>
  
  <!-- === BOTTOM-RIGHT: Conclusion === -->
  <g transform="translate(400, 530)">
    <rect x="-250" y="-25" width="500" height="50" rx="8" fill="#1e293b"/>
    <text x="0" y="-2" text-anchor="middle" font-family="monospace" font-size="14" fill="#22d3ee">
      theorem ... {X : Type*} [Inhabited X] : True := by trivial
    </text>
    <text x="0" y="16" text-anchor="middle" font-family="serif" font-size="11" fill="#94a3b8">
      The composition of all three observations yields an unconditionally true statement.
    </text>
  </g>
  
  <!-- === Caption === -->
  <text x="400" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#64748b">
    Figure 1: Structure of the Probabilistic Étale Total Derivative Corollary — three theories conspire to produce a tautology.
  </text>
</svg>
