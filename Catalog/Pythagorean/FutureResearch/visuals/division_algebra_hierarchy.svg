<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)" rx="10"/>

  <!-- Title -->
  <text x="400" y="40" fill="#58a6ff" font-size="24" font-weight="bold" text-anchor="middle">
    The Division Algebra Hierarchy
  </text>
  <text x="400" y="62" fill="#8b949e" font-size="13" text-anchor="middle">
    Cayley-Dickson Construction &amp; Factoring Channel Counts
  </text>

  <!-- ℝ (Real) -->
  <circle cx="400" cy="520" r="45" fill="#1a3a1a" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="515" fill="#4caf50" font-size="28" font-weight="bold" text-anchor="middle">ℝ</text>
  <text x="400" y="535" fill="#81c784" font-size="11" text-anchor="middle">dim 1 · 1 ch</text>
  <text x="400" y="555" fill="#a5d6a7" font-size="10" text-anchor="middle">ordered field</text>

  <!-- ℂ (Complex) -->
  <circle cx="400" cy="420" r="50" fill="#1a2a3a" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="415" fill="#2196f3" font-size="28" font-weight="bold" text-anchor="middle">ℂ</text>
  <text x="400" y="435" fill="#64b5f6" font-size="11" text-anchor="middle">dim 2 · 3 ch</text>
  <text x="400" y="455" fill="#90caf9" font-size="10" text-anchor="middle">commutative field</text>

  <!-- ℍ (Quaternion) -->
  <circle cx="400" cy="310" r="55" fill="#3a2a1a" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="305" fill="#ff9800" font-size="28" font-weight="bold" text-anchor="middle">ℍ</text>
  <text x="400" y="325" fill="#ffb74d" font-size="11" text-anchor="middle">dim 4 · 10 ch</text>
  <text x="400" y="345" fill="#ffcc80" font-size="10" text-anchor="middle">non-commutative</text>

  <!-- 𝕆 (Octonion) - highlighted -->
  <circle cx="400" cy="190" r="60" fill="#3a1a1a" stroke="#e94560" stroke-width="3" filter="url(#glow2)"/>
  <text x="400" y="182" fill="#e94560" font-size="32" font-weight="bold" text-anchor="middle">𝕆</text>
  <text x="400" y="205" fill="#ff6b6b" font-size="12" font-weight="bold" text-anchor="middle">dim 8 · 36 ch</text>
  <text x="400" y="228" fill="#ef9a9a" font-size="10" text-anchor="middle">non-associative</text>

  <!-- 𝕊 (Sedenion) -->
  <circle cx="400" cy="90" r="50" fill="#2a1a3a" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="85" fill="#9c27b0" font-size="24" font-weight="bold" text-anchor="middle">𝕊</text>
  <text x="400" y="105" fill="#ba68c8" font-size="11" text-anchor="middle">dim 16 · 136 ch</text>
  <text x="400" y="120" fill="#ce93d8" font-size="10" text-anchor="middle">zero divisors</text>

  <!-- Arrows (Cayley-Dickson) -->
  <line x1="400" y1="475" x2="400" y2="470" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="370" x2="400" y2="365" stroke="#555" stroke-width="2"/>
  <line x1="400" y1="255" x2="400" y2="250" stroke="#555" stroke-width="2"/>
  <line x1="400" y1="140" x2="400" y2="130" stroke="#555" stroke-width="2"/>

  <!-- Properties lost at each step -->
  <text x="560" y="448" fill="#ff5252" font-size="11" text-anchor="start">✗ loses ordering</text>
  <text x="560" y="340" fill="#ff5252" font-size="11" text-anchor="start">✗ loses commutativity</text>
  <text x="560" y="225" fill="#ff5252" font-size="11" text-anchor="start">✗ loses associativity</text>
  <text x="560" y="110" fill="#ff5252" font-size="11" text-anchor="start">✗ loses alternativity</text>

  <!-- Properties gained -->
  <text x="200" y="448" fill="#4caf50" font-size="11" text-anchor="end">✓ algebraic closure</text>
  <text x="200" y="340" fill="#4caf50" font-size="11" text-anchor="end">✓ 4-square identity</text>
  <text x="200" y="225" fill="#4caf50" font-size="11" text-anchor="end">✓ 8-square identity</text>
  <text x="200" y="110" fill="#4caf50" font-size="11" text-anchor="end">✓ 136 channels</text>

  <!-- Connecting arrows -->
  <path d="M 540,448 L 460,435" stroke="#555" stroke-width="1" fill="none"/>
  <path d="M 540,340 L 455,325" stroke="#555" stroke-width="1" fill="none"/>
  <path d="M 540,225 L 460,210" stroke="#555" stroke-width="1" fill="none"/>
  <path d="M 540,110 L 450,100" stroke="#555" stroke-width="1" fill="none"/>

  <path d="M 220,448 L 350,435" stroke="#555" stroke-width="1" fill="none"/>
  <path d="M 220,340 L 345,325" stroke="#555" stroke-width="1" fill="none"/>
  <path d="M 220,225 L 340,210" stroke="#555" stroke-width="1" fill="none"/>
  <path d="M 220,110 L 350,100" stroke="#555" stroke-width="1" fill="none"/>

  <!-- Key insight box -->
  <rect x="50" y="555" width="700" height="35" fill="#1a2a3a" rx="8" stroke="#58a6ff" stroke-width="1"/>
  <text x="400" y="578" fill="#58a6ff" font-size="13" text-anchor="middle">
    Key Insight: Octonion non-associativity provides MULTIPLE independent decompositions → more factoring channels
  </text>
</svg>
