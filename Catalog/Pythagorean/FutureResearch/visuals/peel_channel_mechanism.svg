<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1e37"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e94560"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" fill="#e94560" font-size="20" font-weight="bold" text-anchor="middle">
    The Peel Channel Mechanism
  </text>

  <!-- Main equation -->
  <rect x="150" y="55" width="500" height="45" fill="#1a2a4a" rx="8" stroke="#58a6ff" stroke-width="1"/>
  <text x="400" y="83" fill="#e0e0ff" font-size="18" text-anchor="middle" font-family="serif">
    x₁² + x₂² + ⋯ + xₖ² = d²    →    (d − xⱼ)(d + xⱼ) = Σᵢ≠ⱼ xᵢ²
  </text>

  <!-- Left box: k-tuple -->
  <rect x="40" y="130" width="220" height="180" fill="#0d1a30" rx="10" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="150" y="155" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">k-Tuple</text>

  <text x="70" y="185" fill="#a0c0e0" font-size="13">(x₁, x₂, ..., xₖ, d)</text>
  <text x="70" y="210" fill="#8090b0" font-size="12">Σ xᵢ² = d²</text>

  <text x="70" y="245" fill="#64b5f6" font-size="12">k = 2: Pythagorean triple</text>
  <text x="70" y="265" fill="#ffd54f" font-size="12">k = 4: quaternion norm</text>
  <text x="70" y="285" fill="#e94560" font-size="12">k = 8: octonion norm</text>

  <!-- Middle: Peel operation -->
  <line x1="270" y1="220" x2="330" y2="220" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="210" fill="#58a6ff" font-size="11" text-anchor="middle">PEEL</text>

  <!-- Center box: Peel factors -->
  <rect x="340" y="130" width="200" height="180" fill="#1a0d30" rx="10" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="440" y="155" fill="#ce93d8" font-size="14" font-weight="bold" text-anchor="middle">Peel Factors</text>

  <text x="360" y="185" fill="#e0c0ff" font-size="13">For each j ∈ {1..k}:</text>
  <text x="370" y="215" fill="#d0b0ff" font-size="14" font-family="serif">d − xⱼ</text>
  <text x="370" y="240" fill="#d0b0ff" font-size="14" font-family="serif">d + xⱼ</text>

  <text x="360" y="275" fill="#ba68c8" font-size="12">k channels per tuple</text>
  <text x="360" y="295" fill="#ba68c8" font-size="12">C(k,2) cross-collision</text>

  <!-- Right: GCD cascade -->
  <line x1="550" y1="220" x2="610" y2="220" stroke="#e94560" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="580" y="210" fill="#e94560" font-size="11" text-anchor="middle">GCD</text>

  <rect x="620" y="130" width="160" height="180" fill="#300d0d" rx="10" stroke="#e94560" stroke-width="1.5"/>
  <text x="700" y="155" fill="#ff6b6b" font-size="14" font-weight="bold" text-anchor="middle">Factor?</text>

  <text x="640" y="190" fill="#ffa0a0" font-size="12">g = gcd(d−xⱼ, N)</text>
  <text x="640" y="220" fill="#ff8080" font-size="12">If 1 &lt; g &lt; N:</text>
  <text x="660" y="245" fill="#4caf50" font-size="14" font-weight="bold">✓ Factor found!</text>
  <text x="660" y="268" fill="#81c784" font-size="12">N = g × (N/g)</text>
  <text x="640" y="295" fill="#ff8080" font-size="12">Else: try next channel</text>

  <!-- Bottom: Example -->
  <rect x="40" y="340" width="720" height="95" fill="#0d1a25" rx="10" stroke="#4a6fa5" stroke-width="1"/>
  <text x="400" y="365" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">
    Example: N = 143 = 11 × 13
  </text>

  <text x="60" y="395" fill="#a0c0e0" font-size="12">
    Triple: (5, 12, 13) with 5² + 12² = 13² = 169
  </text>
  <text x="60" y="415" fill="#a0c0e0" font-size="12">
    Peel x₁=5: gcd(143−5, 143) = gcd(138, 143) = gcd(138, 143) → try 13−5=8, gcd(8,143)=1
  </text>
  <text x="60" y="395" fill="#a0c0e0" font-size="12">
    3-tuple: (2, 3, 6, 7) with 2²+3²+6² = 49 = 7²; Peel x=6: gcd(7-6, N)=gcd(1,143)=1
  </text>
  <text x="60" y="415" fill="#4caf50" font-size="12">
    4-tuple: (1, 2, 3, 11, 143) → gcd(143-11, 143) = gcd(132, 143) = 11 ✓ Factor found!
  </text>
</svg>
