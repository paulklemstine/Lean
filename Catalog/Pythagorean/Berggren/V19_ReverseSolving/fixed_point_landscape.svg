<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect x="0" y="0" width="800" height="500" fill="#1a1a2e" stroke="none" stroke-width="1" rx="0"/>
  <text x="400" y="35" font-size="20" text-anchor="middle" fill="#e0e0ff" font-weight="bold" font-family="sans-serif">Fixed-Point Structure of Berggren Matrices</text>
  <rect x="60" y="80" width="220" height="180" fill="#16213e" stroke="#ff6b6b" stroke-width="2" rx="10"/>
  <text x="170" y="105" font-size="14" text-anchor="middle" fill="#ff6b6b" font-weight="bold" font-family="sans-serif">B₁ (Unipotent)</text>
  <text x="170" y="135" font-size="9" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">Eigenvalues: {1, 1, 1}</text>
  <text x="170" y="155" font-size="9" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">(B₁-I)³ = 0</text>
  <text x="170" y="190" font-size="10" text-anchor="middle" fill="#e0e0e0" font-weight="normal" font-family="sans-serif">All vectors on the</text>
  <text x="170" y="210" font-size="10" text-anchor="middle" fill="#e0e0e0" font-weight="normal" font-family="sans-serif">eigenspace are fixed</text>
  <rect x="290" y="80" width="220" height="180" fill="#16213e" stroke="#4ecdc4" stroke-width="2" rx="10"/>
  <text x="400" y="105" font-size="14" text-anchor="middle" fill="#4ecdc4" font-weight="bold" font-family="sans-serif">B₂ (Hyperbolic)</text>
  <text x="400" y="135" font-size="9" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">Eigenvalues: {3+2√2, 3-2√2, -1}</text>
  <text x="400" y="155" font-size="9" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">Only fixed point: origin</text>
  <text x="400" y="190" font-size="10" text-anchor="middle" fill="#e0e0e0" font-weight="normal" font-family="sans-serif">Fixed points satisfy</text>
  <text x="400" y="210" font-size="10" text-anchor="middle" fill="#e0e0e0" font-weight="normal" font-family="sans-serif">a = b (symmetric matrix)</text>
  <rect x="520" y="80" width="220" height="180" fill="#16213e" stroke="#ffe66d" stroke-width="2" rx="10"/>
  <text x="630" y="105" font-size="14" text-anchor="middle" fill="#ffe66d" font-weight="bold" font-family="sans-serif">B₃ (Unipotent)</text>
  <text x="630" y="135" font-size="9" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">Eigenvalues: {1, 1, 1}</text>
  <text x="630" y="155" font-size="9" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">(B₃-I)³ = 0</text>
  <text x="630" y="190" font-size="10" text-anchor="middle" fill="#e0e0e0" font-weight="normal" font-family="sans-serif">All vectors on the</text>
  <text x="630" y="210" font-size="10" text-anchor="middle" fill="#e0e0e0" font-weight="normal" font-family="sans-serif">eigenspace are fixed</text>
  <text x="400" y="300" font-size="16" text-anchor="middle" fill="#e0e0ff" font-weight="bold" font-family="sans-serif">The Fixed-Point Equation for M^G</text>
  <text x="400" y="325" font-size="11" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">(M - I) · (a, b, c)ᵀ = 0</text>
  <text x="400" y="343" font-size="11" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif"></text>
  <text x="400" y="361" font-size="11" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">For symmetric M: subtracting row₁ from row₂ gives</text>
  <text x="400" y="379" font-size="11" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">(m₂₁ - m₁₂)(a-b) + (m₂₂ - m₁₁)(a-b) = 0</text>
  <text x="400" y="397" font-size="11" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif"></text>
  <text x="400" y="415" font-size="11" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif">When M is symmetric (m₁₂ = m₂₁, m₁₁ = m₂₂): any (a-b) works</text>
  <text x="400" y="433" font-size="11" text-anchor="middle" fill="#ffe66d" font-weight="normal" font-family="sans-serif">When rows differ by factor: (a-b) = 0, so a = b</text>
  <text x="400" y="451" font-size="11" text-anchor="middle" fill="#ccc" font-weight="normal" font-family="sans-serif"></text>
  <text x="400" y="469" font-size="11" text-anchor="middle" fill="#ffe66d" font-weight="normal" font-family="sans-serif">Result: a = b collapses the 3-equation system to 1 equation</text>
</svg>
