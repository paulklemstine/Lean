<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect x="0" y="0" width="900" height="400" fill="white" stroke="none" stroke-width="1" rx="0"/>
  <text x="450" y="30" font-size="18" text-anchor="middle" fill="black" font-weight="bold" font-family="sans-serif">Spectral Trichotomy of Berggren Matrices</text>
  <rect x="30" y="60" width="270" height="280" fill="#ffe0e0" stroke="#333" stroke-width="1" rx="8"/>
  <text x="165" y="85" font-size="14" text-anchor="middle" fill="black" font-weight="bold" font-family="sans-serif">B₁ (A-branch)</text>
  <line x1="40" y1="95" x2="290" y2="95" stroke="#333" stroke-width="1"/>
  <text x="165" y="120" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">det = 1</text>
  <text x="165" y="150" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">eigenvalues: {1, 1, 1}</text>
  <text x="165" y="180" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">(B₁ - I)³ = 0  UNIPOTENT</text>
  <text x="165" y="210" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">tr(B₁ⁿ) = 3  ∀n</text>
  <text x="165" y="240" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">Polynomial growth</text>
  <rect x="320" y="60" width="270" height="280" fill="#e0e0ff" stroke="#333" stroke-width="1" rx="8"/>
  <text x="455" y="85" font-size="14" text-anchor="middle" fill="black" font-weight="bold" font-family="sans-serif">B₂ (B-branch)</text>
  <line x1="330" y1="95" x2="580" y2="95" stroke="#333" stroke-width="1"/>
  <text x="455" y="120" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">det = -1</text>
  <text x="455" y="150" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">eigenvalues: {3+2√2, 3-2√2, -1}</text>
  <text x="455" y="180" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">Diagonalizable</text>
  <text x="455" y="210" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">tr(B₂ⁿ) = 2·pellX(n) + (-1)ⁿ</text>
  <text x="455" y="240" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">Exponential growth</text>
  <rect x="610" y="60" width="270" height="280" fill="#e0ffe0" stroke="#333" stroke-width="1" rx="8"/>
  <text x="745" y="85" font-size="14" text-anchor="middle" fill="black" font-weight="bold" font-family="sans-serif">B₃ (C-branch)</text>
  <line x1="620" y1="95" x2="870" y2="95" stroke="#333" stroke-width="1"/>
  <text x="745" y="120" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">det = 1</text>
  <text x="745" y="150" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">eigenvalues: {1, 1, 1}</text>
  <text x="745" y="180" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">(B₃ - I)³ = 0  UNIPOTENT</text>
  <text x="745" y="210" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">tr(B₃ⁿ) = 3  ∀n</text>
  <text x="745" y="240" font-size="11" text-anchor="middle" fill="black" font-weight="normal" font-family="sans-serif">Polynomial growth</text>
  <text x="450" y="370" font-size="12" text-anchor="middle" fill="#333" font-weight="normal" font-family="sans-serif">★ B₁ and B₃ are spectrally identical (same char. poly: (λ-1)³ = 0)</text>
  <text x="450" y="390" font-size="12" text-anchor="middle" fill="#333" font-weight="normal" font-family="sans-serif">★ Only B₂ has exponential spectral growth (spectral radius = 3+2√2 ≈ 5.83)</text>
</svg>
