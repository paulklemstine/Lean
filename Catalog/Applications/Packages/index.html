<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aristotle Research Packages</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.08), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(56, 189, 248, 0.2);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            text-decoration: none;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #38bdf8, #a855f7);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:visited {
            border-color: #a855f7;
        }

        .card-title {
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.75rem;
            text-transform: capitalize;
        }

        .card-meta {
            margin-top: auto;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .loading {
            text-align: center;
            color: var(--accent);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            opacity: 0.8;
            height: 20px;
            transition: opacity 0.5s ease;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(56,189,248,0.3);
            border-radius: 50%;
            border-top-color: #38bdf8;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">

        { filename: "quantum_pythagorean_trapdoors_via_berggren_tree_st.html", date: "2026-05-10 00:05:48 -0500" }

    function formatTitle(filename) {
        return filename
            .replace('.html', '')
            .replace(/_/g, ' ')
            .replace(/\b\w/g, c => c.toUpperCase());
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const list = document.getElementById('package-list');
        const status = document.getElementById('status');

        const cards = files.map(item => {
            const a = document.createElement('a');
            a.className = 'card';
            a.href = item.filename;
            
            const title = document.createElement('div');
            title.className = 'card-title';
            title.textContent = formatTitle(item.filename);

            const dateObj = new Date(item.date);
            const dateStr = dateObj.toLocaleDateString(undefined, {
                year: 'numeric', month: 'short', day: 'numeric'
            }) + ' ' + dateObj.toLocaleTimeString();
            
            const meta = document.createElement('div');
            meta.className = 'card-meta';
            meta.innerHTML = `<span>HTML Document</span><span class="date">${dateStr}</span>`;
            
            a.appendChild(title);
            a.appendChild(meta);
            return { element: a, date: dateObj.getTime() };
        });

        try {
            const results = cards;
            
            // Sort by newest first
            results.sort((a, b) => b.date - a.date);
            
            // Render sorted
            list.innerHTML = '';
            results.forEach(r => list.appendChild(r.element));
            
            status.innerHTML = '✨ Dynamically sorted by newest';
            setTimeout(() => status.style.opacity = '0', 2500);
            
        } catch (e) {
            status.innerHTML = 'Sorted alphabetically';
            cards.forEach(c => list.appendChild(c.element));
        }
    });
</script>
