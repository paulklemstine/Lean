<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">
    Ultrametric Oracle Capacity: Architecture
  </text>

  <!-- Layer 1: Algebraic Foundation -->
  <rect x="50" y="60" width="200" height="80" rx="8" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
  <text x="150" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">SemiringValuation</text>
  <text x="150" y="102" text-anchor="middle" font-size="10" fill="#555">v : R → ℕ</text>
  <text x="150" y="118" text-anchor="middle" font-size="10" fill="#555">v(a+b) ≤ max(v(a),v(b))</text>
  <text x="150" y="132" text-anchor="middle" font-size="10" fill="#555">v(a·b) ≤ v(a)+v(b)</text>

  <rect x="300" y="60" width="200" height="80" rx="8" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">ValuatedSemiringState</text>
  <text x="400" y="102" text-anchor="middle" font-size="10" fill="#555">weight : σ → α → R</text>
  <text x="400" y="118" text-anchor="middle" font-size="10" fill="#555">step : σ → α → σ</text>
  <text x="400" y="132" text-anchor="middle" font-size="10" fill="#555">init : σ</text>

  <rect x="550" y="60" width="200" height="80" rx="8" fill="#fde8e8" stroke="#e74c3c" stroke-width="2"/>
  <text x="650" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">TimeReversalCong</text>
  <text x="650" y="102" text-anchor="middle" font-size="10" fill="#555">u ~ v ⟺ u=v ∨ u=rev(v)</text>
  <text x="650" y="118" text-anchor="middle" font-size="10" fill="#555">Setoid (List α)</text>
  <text x="650" y="132" text-anchor="middle" font-size="10" fill="#555">refl, symm, trans</text>

  <!-- Arrows Layer 1 → 2 -->
  <line x1="150" y1="140" x2="150" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="140" x2="400" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="140" x2="650" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Trace Operations -->
  <rect x="50" y="175" width="200" height="80" rx="8" fill="#fef3e2" stroke="#e67e22" stroke-width="2"/>
  <text x="150" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#d35400">traceDepth</text>
  <text x="150" y="215" text-anchor="middle" font-size="10" fill="#555">v(∏ weight(sᵢ,aᵢ))</text>
  <text x="150" y="232" text-anchor="middle" font-size="10" fill="#555">depth_cons_bound</text>
  <text x="150" y="248" text-anchor="middle" font-size="10" fill="#555">fixedPoint_trace_bound</text>

  <rect x="300" y="175" width="200" height="80" rx="8" fill="#fef3e2" stroke="#e67e22" stroke-width="2"/>
  <text x="400" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#d35400">traceDist (Ultrametric)</text>
  <text x="400" y="215" text-anchor="middle" font-size="10" fill="#555">max(depth(u), depth(v))</text>
  <text x="400" y="232" text-anchor="middle" font-size="10" fill="#555">d(u,w) ≤ max(d(u,v),d(v,w))</text>
  <text x="400" y="248" text-anchor="middle" font-size="10" fill="#555">Isosceles Principle</text>

  <rect x="550" y="175" width="200" height="80" rx="8" fill="#fef3e2" stroke="#e67e22" stroke-width="2"/>
  <text x="650" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#d35400">OracleContractive</text>
  <text x="650" y="215" text-anchor="middle" font-size="10" fill="#555">d(step(s,a), u, v)</text>
  <text x="650" y="232" text-anchor="middle" font-size="10" fill="#555">≤ d(s, a::u, a::v)</text>
  <text x="650" y="248" text-anchor="middle" font-size="10" fill="#555">Iteration Theorem</text>

  <!-- Arrows Layer 2 → 3 -->
  <line x1="250" y1="215" x2="295" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="255" x2="400" y2="285" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="215" x2="505" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Capacity -->
  <rect x="200" y="290" width="400" height="70" rx="8" fill="url(#grad1)" stroke="#2ecc71" stroke-width="2"/>
  <text x="400" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Oracle Capacity</text>
  <text x="400" y="333" text-anchor="middle" font-size="11" fill="#555">
    quotientCapacity ≤ oracleCapacity ≤ |states.dedup|
  </text>
  <text x="400" y="350" text-anchor="middle" font-size="10" fill="#555">
    recurrentFixedPointsIn → dedup → length
  </text>

  <!-- Layer 4: Applications -->
  <line x1="250" y1="360" x2="150" y2="390" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="360" x2="400" y2="390" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="360" x2="650" y2="390" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="395" width="180" height="70" rx="8" fill="#f0e6ff" stroke="#9b59b6" stroke-width="2"/>
  <text x="140" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#8e44ad">Certified Robustness</text>
  <text x="140" y="435" text-anchor="middle" font-size="9" fill="#555">certifiedReversalMargin</text>
  <text x="140" y="450" text-anchor="middle" font-size="9" fill="#555">quantumTraceEcho</text>

  <rect x="300" y="395" width="200" height="70" rx="8" fill="#f0e6ff" stroke="#9b59b6" stroke-width="2"/>
  <text x="400" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#8e44ad">Post-Quantum Security</text>
  <text x="400" y="435" text-anchor="middle" font-size="9" fill="#555">latticeSecurityGap</text>
  <text x="400" y="450" text-anchor="middle" font-size="9" fill="#555">postQuantumOracleRadius</text>

  <rect x="570" y="395" width="180" height="70" rx="8" fill="#f0e6ff" stroke="#9b59b6" stroke-width="2"/>
  <text x="660" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#8e44ad">Tropical Crypto</text>
  <text x="660" y="435" text-anchor="middle" font-size="9" fill="#555">tropicalHashCollisionScore</text>
  <text x="660" y="450" text-anchor="middle" font-size="9" fill="#555">oracleEntropyProxy</text>

  <!-- Legend -->
  <rect x="30" y="478" width="12" height="12" fill="#e8f4fd" stroke="#3498db" stroke-width="1"/>
  <text x="48" y="489" font-size="9" fill="#555">Algebraic Structure</text>
  <rect x="180" y="478" width="12" height="12" fill="#fef3e2" stroke="#e67e22" stroke-width="1"/>
  <text x="198" y="489" font-size="9" fill="#555">Trace Operations</text>
  <rect x="320" y="478" width="12" height="12" fill="#e8fde8" stroke="#2ecc71" stroke-width="1"/>
  <text x="338" y="489" font-size="9" fill="#555">Capacity Theory</text>
  <rect x="460" y="478" width="12" height="12" fill="#f0e6ff" stroke="#9b59b6" stroke-width="1"/>
  <text x="478" y="489" font-size="9" fill="#555">Applications</text>
  <rect x="600" y="478" width="12" height="12" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
  <text x="618" y="489" font-size="9" fill="#555">Congruence</text>
</svg>
