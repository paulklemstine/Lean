<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>
    text { font-family: sans-serif; font-size: 14px; }
    .node { fill: #4a90d9; stroke: #2c5f9e; stroke-width: 2; }
    .root { fill: #e74c3c; stroke: #c0392b; stroke-width: 3; }
    .edge { stroke: #666; stroke-width: 2; fill: none; }
    .label { font-size: 12px; fill: #333; }
    .title { font-size: 20px; font-weight: bold; fill: #222; }
    .letter { font-size: 16px; font-weight: bold; fill: #e74c3c; }
  </style>
  
  <text x="400" y="30" class="title" text-anchor="middle">Berggren Ternary Tree of Primitive Pythagorean Triples</text>
  
  <!-- Root -->
  <circle cx="400" cy="80" r="30" class="root"/>
  <text x="400" y="85" text-anchor="middle" fill="white" font-weight="bold">(3,4,5)</text>
  
  <!-- Level 1 edges -->
  <line x1="380" y1="105" x2="200" y2="170" class="edge"/>
  <line x1="400" y1="110" x2="400" y2="170" class="edge"/>
  <line x1="420" y1="105" x2="600" y2="170" class="edge"/>
  
  <!-- Level 1 labels -->
  <text x="280" y="135" class="letter">A</text>
  <text x="390" y="145" class="letter">B</text>
  <text x="510" y="135" class="letter">C</text>
  
  <!-- Level 1 nodes -->
  <circle cx="200" cy="200" r="28" class="node"/>
  <text x="200" y="195" text-anchor="middle" fill="white" font-size="11">(5,12,13)</text>
  <text x="200" y="210" text-anchor="middle" fill="white" font-size="10">h=13</text>
  
  <circle cx="400" cy="200" r="28" class="node"/>
  <text x="400" y="195" text-anchor="middle" fill="white" font-size="11">(21,20,29)</text>
  <text x="400" y="210" text-anchor="middle" fill="white" font-size="10">h=29</text>
  
  <circle cx="600" cy="200" r="28" class="node"/>
  <text x="600" y="195" text-anchor="middle" fill="white" font-size="11">(15,8,17)</text>
  <text x="600" y="210" text-anchor="middle" fill="white" font-size="10">h=17</text>
  
  <!-- Level 2 edges from A -->
  <line x1="180" y1="225" x2="100" y2="290" class="edge"/>
  <line x1="200" y1="228" x2="200" y2="290" class="edge"/>
  <line x1="220" y1="225" x2="300" y2="290" class="edge"/>
  
  <!-- Level 2 nodes from A -->
  <circle cx="100" cy="320" r="25" class="node"/>
  <text x="100" y="315" text-anchor="middle" fill="white" font-size="10">(7,24,25)</text>
  <text x="100" y="328" text-anchor="middle" fill="white" font-size="9">AA</text>
  
  <circle cx="200" cy="320" r="25" class="node"/>
  <text x="200" y="315" text-anchor="middle" fill="white" font-size="10">(39,80,89)</text>
  <text x="200" y="328" text-anchor="middle" fill="white" font-size="9">AB</text>
  
  <circle cx="300" cy="320" r="25" class="node"/>
  <text x="300" y="315" text-anchor="middle" fill="white" font-size="10">(33,56,65)</text>
  <text x="300" y="328" text-anchor="middle" fill="white" font-size="9">AC</text>
  
  <!-- Level 2 edges from C -->
  <line x1="580" y1="225" x2="500" y2="290" class="edge"/>
  <line x1="600" y1="228" x2="600" y2="290" class="edge"/>
  <line x1="620" y1="225" x2="700" y2="290" class="edge"/>
  
  <circle cx="500" cy="320" r="25" class="node"/>
  <text x="500" y="315" text-anchor="middle" fill="white" font-size="10">(45,28,53)</text>
  <text x="500" y="328" text-anchor="middle" fill="white" font-size="9">CA</text>
  
  <circle cx="600" cy="320" r="25" class="node"/>
  <text x="600" y="315" text-anchor="middle" fill="white" font-size="10">(77,36,85)</text>
  <text x="600" y="328" text-anchor="middle" fill="white" font-size="9">CB</text>
  
  <circle cx="700" cy="320" r="25" class="node"/>
  <text x="700" y="315" text-anchor="middle" fill="white" font-size="10">(35,12,37)</text>
  <text x="700" y="328" text-anchor="middle" fill-size="9">CC</text>
  
  <!-- Caption -->
  <text x="400" y="400" text-anchor="middle" font-size="13" fill="#555">Each triple has a unique word address in {A,B,C}*</text>
  <text x="400" y="420" text-anchor="middle" font-size="13" fill="#555">Hypotenuse strictly increases at each level: h ≥ 5 + 2n</text>
  <text x="400" y="450" text-anchor="middle" font-size="11" fill="#888">det(A) = 1, det(B) = -1, det(C) = 1 — all unimodular</text>
  <text x="400" y="470" text-anchor="middle" font-size="11" fill="#888">a² + b² = c² preserved at every node</text>
</svg>
