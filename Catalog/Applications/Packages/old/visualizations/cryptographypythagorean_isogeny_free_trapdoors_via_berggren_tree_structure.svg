<text x="50" y="380" font-size="12" font-weight="bold" fill="#333">Minor Profile Injectivity (Collision Resistance):</text>
<text x="50" y="400" font-size="11" fill="#555">For any triple (x,y,z): minorProfile(x,y,z) = (x+y, y+z, z+x, z-x-y)</text>
<text x="50" y="420" font-size="11" fill="#555">Theorem: minorProfile is injective — no two triples share a profile.</text>
<text x="50" y="440" font-size="11" fill="#555">Example: (3,4,5) → (7,9,8,-2) | (5,12,13) → (17,25,18,-4)</text>
<text x="50" y="460" font-size="11" fill="#c44">Secret key = word w | Public key = minorProfile(evalWord(w, root))</text>
