<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8A838;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#E85838;stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">
    Operadic Semiring Semantics: Architecture Minimization Pipeline
  </text>

  <!-- Left box: Architecture Space -->
  <rect x="30" y="60" width="250" height="220" rx="12" fill="url(#grad1)" stroke="#4A90D9" stroke-width="2"/>
  <text x="155" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5F9A">Architecture Space O</text>

  <!-- Equivalence classes -->
  <ellipse cx="100" cy="140" rx="55" ry="25" fill="#C8D8F0" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="100" y="135" text-anchor="middle" font-size="10" fill="#333">A₁  A₂  A₃</text>
  <text x="100" y="150" text-anchor="middle" font-size="9" fill="#666">eval = s₁</text>

  <ellipse cx="210" cy="140" rx="45" ry="25" fill="#C8D8F0" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="210" y="135" text-anchor="middle" font-size="10" fill="#333">B₁  B₂</text>
  <text x="210" y="150" text-anchor="middle" font-size="9" fill="#666">eval = s₂</text>

  <ellipse cx="120" cy="210" rx="60" ry="25" fill="#C8D8F0" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="120" y="205" text-anchor="middle" font-size="10" fill="#333">C₁  C₂  C₃  C₄</text>
  <text x="120" y="220" text-anchor="middle" font-size="9" fill="#666">eval = s₃</text>

  <ellipse cx="220" cy="245" rx="40" ry="20" fill="#C8D8F0" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="220" y="243" text-anchor="middle" font-size="10" fill="#333">D₁</text>
  <text x="220" y="258" text-anchor="middle" font-size="9" fill="#666">eval = s₄</text>

  <!-- Arrow: eval -->
  <line x1="290" y1="170" x2="350" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">eval</text>
  <text x="320" y="185" text-anchor="middle" font-size="9" fill="#666">neuralSemantics</text>

  <!-- Middle box: Semiring S -->
  <rect x="360" y="100" width="150" height="140" rx="12" fill="#F0F0FF" stroke="#7B68EE" stroke-width="2"/>
  <text x="435" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#5B48CE">Semiring S</text>

  <circle cx="400" cy="160" r="12" fill="#B8A8F0" stroke="#7B68EE" stroke-width="1.5"/>
  <text x="400" y="164" text-anchor="middle" font-size="11" fill="#333">s₁</text>

  <circle cx="470" cy="160" r="12" fill="#B8A8F0" stroke="#7B68EE" stroke-width="1.5"/>
  <text x="470" y="164" text-anchor="middle" font-size="11" fill="#333">s₂</text>

  <circle cx="400" cy="210" r="12" fill="#B8A8F0" stroke="#7B68EE" stroke-width="1.5"/>
  <text x="400" y="214" text-anchor="middle" font-size="11" fill="#333">s₃</text>

  <circle cx="470" cy="210" r="12" fill="#B8A8F0" stroke="#7B68EE" stroke-width="1.5"/>
  <text x="470" y="214" text-anchor="middle" font-size="11" fill="#333">s₄</text>

  <!-- Arrow: quotient -->
  <path d="M 155 290 C 155 340, 435 340, 435 250" stroke="#E85838" stroke-width="2" fill="none"
        marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="300" y="340" text-anchor="middle" font-size="11" fill="#E85838">Quot.lift (quotient)</text>

  <!-- Right section: Minimization -->
  <rect x="560" y="60" width="310" height="280" rx="12" fill="url(#grad2)" stroke="#E8A838" stroke-width="2"/>
  <text x="715" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#B87818">Minimization Pipeline</text>

  <!-- Step 1 -->
  <rect x="580" y="100" width="270" height="40" rx="8" fill="#FFF3D8" stroke="#E8A838" stroke-width="1"/>
  <text x="590" y="118" font-size="11" fill="#333">1. Compute fiber: {y ∈ O | eval(y) = eval(x)}</text>
  <text x="590" y="133" font-size="9" fill="#888">Bounded by |O| (Thm: fiber_card_le_universe)</text>

  <!-- Step 2 -->
  <rect x="580" y="150" width="270" height="40" rx="8" fill="#FFF3D8" stroke="#E8A838" stroke-width="1"/>
  <text x="590" y="168" font-size="11" fill="#333">2. Minimize: argmin totalCost(y) over fiber</text>
  <text x="590" y="183" font-size="9" fill="#888">Exists by well-ordering (Thm: minimizer_exists)</text>

  <!-- Step 3 -->
  <rect x="580" y="200" width="270" height="40" rx="8" fill="#FFF3D8" stroke="#E8A838" stroke-width="1"/>
  <text x="590" y="218" font-size="11" fill="#333">3. Transfer certificates: cert(y) = cert(x)</text>
  <text x="590" y="233" font-size="9" fill="#888">Invariance (Thm: certified_bound_transfer)</text>

  <!-- Step 4 -->
  <rect x="580" y="250" width="270" height="40" rx="8" fill="#FFE8D0" stroke="#E85838" stroke-width="1.5"/>
  <text x="590" y="268" font-size="11" font-weight="bold" fill="#C04020">4. Output: minimal certified architecture</text>
  <text x="590" y="283" font-size="9" fill="#888">Main Thm: certified_post_quantum_minimization</text>

  <!-- Arrow from middle to right -->
  <line x1="520" y1="170" x2="570" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom: Bridge diagram -->
  <rect x="30" y="370" width="840" height="200" rx="12" fill="#F8F8F8" stroke="#999" stroke-width="1.5"/>
  <text x="450" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Cross-Domain Bridge</text>

  <!-- Domain boxes -->
  <rect x="50" y="410" width="155" height="65" rx="8" fill="#E8F0FF" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="127" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C5F9A">Universal Algebra</text>
  <text x="127" y="448" text-anchor="middle" font-size="9" fill="#555">Congruences</text>
  <text x="127" y="460" text-anchor="middle" font-size="9" fill="#555">Quotients, Normal forms</text>
  <text x="127" y="472" text-anchor="middle" font-size="9" fill="#555">Canonical representatives</text>

  <rect x="225" y="410" width="155" height="65" rx="8" fill="#FFF0E0" stroke="#E8A838" stroke-width="1.5"/>
  <text x="302" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#B87818">Machine Learning</text>
  <text x="302" y="448" text-anchor="middle" font-size="9" fill="#555">Architecture compression</text>
  <text x="302" y="460" text-anchor="middle" font-size="9" fill="#555">Certified robustness</text>
  <text x="302" y="472" text-anchor="middle" font-size="9" fill="#555">Lipschitz bounds</text>

  <rect x="400" y="410" width="155" height="65" rx="8" fill="#F0FFE0" stroke="#5BAA38" stroke-width="1.5"/>
  <text x="477" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#3A8A18">Post-Quantum Crypto</text>
  <text x="477" y="448" text-anchor="middle" font-size="9" fill="#555">Lattice quotients</text>
  <text x="477" y="460" text-anchor="middle" font-size="9" fill="#555">Shortest vector analogy</text>
  <text x="477" y="472" text-anchor="middle" font-size="9" fill="#555">Collision classes</text>

  <rect x="575" y="410" width="140" height="65" rx="8" fill="#FFF0FF" stroke="#C060C0" stroke-width="1.5"/>
  <text x="645" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#8A3A8A">Tropical / Entropy</text>
  <text x="645" y="448" text-anchor="middle" font-size="9" fill="#555">Fiber entropy</text>
  <text x="645" y="460" text-anchor="middle" font-size="9" fill="#555">Tropical optimization</text>
  <text x="645" y="472" text-anchor="middle" font-size="9" fill="#555">Thermodynamic states</text>

  <rect x="735" y="410" width="120" height="65" rx="8" fill="#FFE8E8" stroke="#D04040" stroke-width="1.5"/>
  <text x="795" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#A02020">Rewriting</text>
  <text x="795" y="448" text-anchor="middle" font-size="9" fill="#555">Term rewriting</text>
  <text x="795" y="460" text-anchor="middle" font-size="9" fill="#555">Confluence</text>
  <text x="795" y="472" text-anchor="middle" font-size="9" fill="#555">Normal forms</text>

  <!-- Connection lines between domains -->
  <line x1="205" y1="440" x2="225" y2="440" stroke="#999" stroke-width="1.5"/>
  <line x1="380" y1="440" x2="400" y2="440" stroke="#999" stroke-width="1.5"/>
  <line x1="555" y1="440" x2="575" y2="440" stroke="#999" stroke-width="1.5"/>
  <line x1="715" y1="440" x2="735" y2="440" stroke="#999" stroke-width="1.5"/>

  <!-- Key theorems -->
  <text x="450" y="510" text-anchor="middle" font-size="12" fill="#333">
    Key: NeuralSemanticEq is a congruence → Quotient exists → Minimizer exists → Certificates preserved
  </text>
  <text x="450" y="530" text-anchor="middle" font-size="11" fill="#666">
    37 theorems | 22 definitions | 0 sorries | 5 domains connected
  </text>
  <text x="450" y="550" text-anchor="middle" font-size="10" font-style="italic" fill="#888">
    ∀ x : O, ∃ y : O, NeuralSemanticEq y x ∧ IsMinimalRepresentative C y ∧ cert y = cert x
  </text>
</svg>
