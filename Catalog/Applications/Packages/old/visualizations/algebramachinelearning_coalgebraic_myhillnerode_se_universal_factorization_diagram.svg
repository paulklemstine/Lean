<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">
    Coalgebraic Myhill–Nerode Neural Compression
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#64748b">
    Universal Factorization Property
  </text>

  <!-- Original System N -->
  <rect x="50" y="100" width="200" height="140" rx="12" fill="#f0f9ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a5f">System N</text>

  <!-- States in N -->
  <circle cx="100" cy="175" r="15" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="180" text-anchor="middle" font-size="11" fill="#1e3a5f">s₁</text>
  <circle cx="150" cy="175" r="15" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="#1e3a5f">s₂</text>
  <circle cx="200" cy="175" r="15" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="180" text-anchor="middle" font-size="11" fill="#1e3a5f">s₃</text>
  <circle cx="125" cy="215" r="15" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="220" text-anchor="middle" font-size="11" fill="#1e3a5f">s₄</text>
  <circle cx="175" cy="215" r="15" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="220" text-anchor="middle" font-size="11" fill="#1e3a5f">s₅</text>

  <!-- Equivalence indicator -->
  <text x="150" y="155" text-anchor="middle" font-size="9" fill="#64748b">s₁ ~ s₂, s₄ ~ s₅</text>

  <!-- Quotient System Q(N) -->
  <rect x="300" y="100" width="200" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Quotient Q(N)</text>
  <text x="400" y="143" text-anchor="middle" font-size="10" fill="#64748b">Minimal Realization</text>

  <!-- States in Q(N) -->
  <circle cx="345" cy="195" r="18" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="345" y="200" text-anchor="middle" font-size="11" fill="#14532d">[s₁]</text>
  <circle cx="400" cy="195" r="18" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="200" text-anchor="middle" font-size="11" fill="#14532d">[s₃]</text>
  <circle cx="455" cy="195" r="18" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="455" y="200" text-anchor="middle" font-size="11" fill="#14532d">[s₄]</text>

  <!-- Target System M -->
  <rect x="550" y="100" width="200" height="140" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="650" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">System M</text>

  <!-- States in M -->
  <circle cx="600" cy="185" r="15" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="190" text-anchor="middle" font-size="11" fill="#78350f">t₁</text>
  <circle cx="650" cy="185" r="15" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="190" text-anchor="middle" font-size="11" fill="#78350f">t₂</text>
  <circle cx="700" cy="185" r="15" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="700" y="190" text-anchor="middle" font-size="11" fill="#78350f">t₃</text>
  <circle cx="650" cy="220" r="15" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="225" text-anchor="middle" font-size="11" fill="#78350f">t₄</text>

  <!-- Arrows -->
  <!-- N → Q(N) projection π -->
  <line x1="250" y1="170" x2="295" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="273" y="163" text-anchor="middle" font-size="12" fill="#2563eb" font-style="italic">π</text>

  <!-- N → M morphism f -->
  <path d="M 250 200 C 380 320, 520 320, 550 200" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="400" y="310" text-anchor="middle" font-size="12" fill="#333" font-style="italic">f</text>

  <!-- Q(N) → M unique factoring g -->
  <line x1="500" y1="170" x2="545" y2="170" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="523" y="163" text-anchor="middle" font-size="12" fill="#16a34a" font-style="italic">∃!g</text>

  <!-- Universal Property Box -->
  <rect x="100" y="360" width="600" height="120" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">
    Neural Myhill–Nerode Universal Property
  </text>
  <text x="400" y="410" text-anchor="middle" font-size="12" fill="#5b21b6">
    f = g ∘ π  (unique factorization)
  </text>
  <text x="400" y="435" text-anchor="middle" font-size="11" fill="#6d28d9">
    ∀ s, w : behavior(Q(N), [s], w) = behavior(N, s, w)
  </text>
  <text x="400" y="455" text-anchor="middle" font-size="11" fill="#6d28d9">
    [s] = [t]  ⟺  ∀ w, behavior(N, s, w) = behavior(N, t, w)
  </text>
  <text x="400" y="470" text-anchor="middle" font-size="10" fill="#7c3aed">
    |Q(N)| ≤ |N|  •  Robustness preserved  •  Cryptographic indistinguishability = behavioral equiv
  </text>

  <!-- Domain labels -->
  <rect x="50" y="80" width="80" height="18" rx="4" fill="#2563eb" opacity="0.1"/>
  <text x="90" y="93" text-anchor="middle" font-size="9" fill="#2563eb">AUTOMATA</text>

  <rect x="350" y="80" width="100" height="18" rx="4" fill="#16a34a" opacity="0.1"/>
  <text x="400" y="93" text-anchor="middle" font-size="9" fill="#16a34a">COALGEBRA</text>

  <rect x="600" y="80" width="100" height="18" rx="4" fill="#d97706" opacity="0.1"/>
  <text x="650" y="93" text-anchor="middle" font-size="9" fill="#d97706">NEURAL / ML</text>
</svg>
