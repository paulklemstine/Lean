<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd"/>
      <stop offset="100%" style="stop-color:#d4e9f7"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde8e8"/>
      <stop offset="100%" style="stop-color:#f7d4d4"/>
    </linearGradient>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8fde8"/>
      <stop offset="100%" style="stop-color:#d4f7d4"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">
    Quotient Orbit Compression: Theorem Architecture
  </text>

  <!-- Ambient space box -->
  <rect x="30" y="60" width="220" height="180" rx="12" fill="url(#bg1)" stroke="#4a90d9" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f8a">Ambient Space α</text>

  <!-- States in ambient space -->
  <circle cx="70" cy="130" r="12" fill="#4a90d9" opacity="0.7"/>
  <circle cx="110" cy="110" r="12" fill="#4a90d9" opacity="0.7"/>
  <circle cx="150" cy="140" r="12" fill="#e74c3c" opacity="0.7"/>
  <circle cx="190" cy="120" r="12" fill="#e74c3c" opacity="0.7"/>
  <circle cx="80" cy="180" r="12" fill="#2ecc71" opacity="0.7"/>
  <circle cx="130" cy="190" r="12" fill="#2ecc71" opacity="0.7"/>
  <circle cx="180" cy="200" r="12" fill="#4a90d9" opacity="0.7"/>
  <circle cx="210" cy="170" r="12" fill="#e74c3c" opacity="0.7"/>

  <text x="140" y="230" text-anchor="middle" font-size="11" fill="#555">|α| = 8 states</text>

  <!-- Arrow: quotient map -->
  <line x1="260" y1="150" x2="330" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="295" y="140" text-anchor="middle" font-size="11" fill="#333">⟦·⟧_ρ</text>

  <!-- Quotient space box -->
  <rect x="340" y="60" width="160" height="180" rx="12" fill="url(#bg2)" stroke="#e74c3c" stroke-width="2"/>
  <text x="420" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2c2c">Quotient α/ρ</text>

  <!-- Equivalence classes -->
  <circle cx="380" cy="130" r="20" fill="#4a90d9" opacity="0.5" stroke="#4a90d9"/>
  <text x="380" y="135" text-anchor="middle" font-size="10" fill="#fff">[blue]</text>
  <circle cx="460" cy="130" r="20" fill="#e74c3c" opacity="0.5" stroke="#e74c3c"/>
  <text x="460" y="135" text-anchor="middle" font-size="10" fill="#fff">[red]</text>
  <circle cx="420" cy="200" r="20" fill="#2ecc71" opacity="0.5" stroke="#2ecc71"/>
  <text x="420" y="205" text-anchor="middle" font-size="10" fill="#fff">[green]</text>

  <text x="420" y="230" text-anchor="middle" font-size="11" fill="#555">|α/ρ| = 3 classes</text>

  <!-- Trajectory -->
  <rect x="30" y="270" width="470" height="100" rx="12" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
  <text x="265" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Observable Trace: i ↦ ⟦f^[i](x)⟧</text>

  <circle cx="70" cy="330" r="15" fill="#4a90d9" opacity="0.6"/>
  <text x="70" y="335" text-anchor="middle" font-size="9" fill="#fff">B</text>
  <text x="70" y="358" text-anchor="middle" font-size="9" fill="#666">i=0</text>

  <circle cx="140" cy="330" r="15" fill="#e74c3c" opacity="0.6"/>
  <text x="140" y="335" text-anchor="middle" font-size="9" fill="#fff">R</text>
  <text x="140" y="358" text-anchor="middle" font-size="9" fill="#666">i=1</text>

  <circle cx="210" cy="330" r="15" fill="#2ecc71" opacity="0.6"/>
  <text x="210" y="335" text-anchor="middle" font-size="9" fill="#fff">G</text>
  <text x="210" y="358" text-anchor="middle" font-size="9" fill="#666">i=2</text>

  <circle cx="280" cy="330" r="15" fill="#4a90d9" opacity="0.6" stroke="#ff6600" stroke-width="3"/>
  <text x="280" y="335" text-anchor="middle" font-size="9" fill="#fff">B</text>
  <text x="280" y="358" text-anchor="middle" font-size="9" fill="#666">i=3</text>

  <!-- Collision arc -->
  <path d="M 70 310 Q 175 275 280 310" fill="none" stroke="#ff6600" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="175" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#ff6600">COLLISION!</text>
  <text x="175" y="260" text-anchor="middle" font-size="10" fill="#ff6600">m=0, n=3 ≤ |α/ρ|=3</text>

  <!-- Arrows between trace elements -->
  <line x1="88" y1="330" x2="122" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="158" y1="330" x2="192" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="228" y1="330" x2="262" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Bridge connections box -->
  <rect x="540" y="60" width="240" height="410" rx="12" fill="url(#bg3)" stroke="#2ecc71" stroke-width="2"/>
  <text x="660" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a7a3a">Cross-Domain Bridges</text>

  <text x="560" y="115" font-size="11" fill="#333" font-weight="bold">🔐 Post-Quantum Security</text>
  <text x="570" y="133" font-size="10" fill="#555">Collision horizon ≤ |α/ρ|</text>
  <text x="570" y="148" font-size="10" fill="#555">→ O(|α/ρ|) attack bound</text>

  <text x="560" y="178" font-size="11" fill="#333" font-weight="bold">🧠 Certified Robustness</text>
  <text x="570" y="196" font-size="10" fill="#555">∀x, ∃m,n: ρ(f^m x, f^n x)</text>
  <text x="570" y="211" font-size="10" fill="#555">→ ML trajectory recurrence</text>

  <text x="560" y="241" font-size="11" fill="#333" font-weight="bold">📊 EML State Compression</text>
  <text x="570" y="259" font-size="10" fill="#555">Observable orbit ≤ |α/ρ|</text>
  <text x="570" y="274" font-size="10" fill="#555">→ Information compression</text>

  <text x="560" y="304" font-size="11" fill="#333" font-weight="bold">⚙️ Semiconjugacy</text>
  <text x="570" y="322" font-size="10" fill="#555">f̄^n(⟦x⟧) = ⟦f^n(x)⟧</text>
  <text x="570" y="337" font-size="10" fill="#555">→ Quotient dynamics</text>

  <text x="560" y="367" font-size="11" fill="#333" font-weight="bold">📐 Saturation Exactness</text>
  <text x="570" y="385" font-size="10" fill="#555">Saturated ⟹ bound is tight</text>
  <text x="570" y="400" font-size="10" fill="#555">→ Sharp complexity bounds</text>

  <text x="560" y="430" font-size="11" fill="#333" font-weight="bold">🔄 First Collision</text>
  <text x="570" y="448" font-size="10" fill="#555">Minimal n₀ via well-ordering</text>
  <text x="570" y="463" font-size="10" fill="#555">→ Orbit structure invariant</text>

  <!-- Key theorem label -->
  <rect x="30" y="390" width="470" height="80" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="265" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">
    Core Theorem: exists_iterate_rel_of_card_quotient
  </text>
  <text x="265" y="435" text-anchor="middle" font-size="11" fill="#555">
    ∀ f : α → α, ∀ x : α, ∃ m n, m &lt; n ∧ n ≤ |α/ρ| ∧ ρ(f^[m](x), f^[n](x))
  </text>
  <text x="265" y="455" text-anchor="middle" font-size="10" fill="#888">
    25 theorems • 15 definitions • 0 sorries • Machine-verified
  </text>
</svg>
