    .edge-label { font-size: 11px; fill: #7d3c98; }
    .info { font-size: 12px; fill: #555; }
  </style>
  <text x="200" y="25" text-anchor="middle" class="title">Čech Nerve of Triangle Cover</text>
  <!-- Edges -->
  <line x1="200.0" y1="60.0"
        x2="303.92304845413264" y2="239.99999999999997"
        stroke="#3498db" stroke-width="3" opacity="0.7"/>
  <line x1="303.92304845413264" y1="239.99999999999997"
        x2="96.07695154586739" y2="240.00000000000006"
        stroke="#3498db" stroke-width="3" opacity="0.7"/>
  <line x1="96.07695154586739" y1="240.00000000000006"
        x2="200.0" y2="60.0"
        stroke="#3498db" stroke-width="3" opacity="0.7"/>
  <!-- Vertices -->
  <circle cx="200.0" cy="60.0" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <circle cx="303.92304845413264" cy="239.99999999999997" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <circle cx="96.07695154586739" cy="240.00000000000006" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <!-- Vertex labels -->
  <text x="200.0" y="40.0" text-anchor="middle" class="vertex-label">U₁</text>
