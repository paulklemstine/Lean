  <rect x="40" y="330" width="100" height="35" rx="5" class="node"/>
  <text x="90" y="353" class="label">(7,24,25)</text>
  <rect x="135" y="330" width="90" height="35" rx="5" class="node"/>
  <text x="180" y="353" class="label">(55,48,73)</text>
