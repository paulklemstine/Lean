<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <rect width="500" height="300" fill="#fafafa" rx="8"/>
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Pythagorean Shell: (3, 4, 5)</text>

  <!-- Triangle -->
  <polygon points="60,240 195,240 60,60" fill="none" stroke="#4a90d9" stroke-width="2.5"/>

  <!-- Side labels -->
  <text x="127" y="260" text-anchor="middle" font-size="14" fill="#4a90d9" font-weight="bold">a = 3</text>
  <text x="35" y="150" text-anchor="middle" font-size="14" fill="#4a90d9" font-weight="bold">b = 4</text>
  <text x="147" y="150" text-anchor="middle" font-size="14" fill="#d94a4a" font-weight="bold">c = 5</text>

  <!-- Right angle marker -->
  <rect x="60" y="225" width="15" height="15" fill="none" stroke="#888" stroke-width="1"/>

  <!-- Equation -->
  <text x="350" y="100" text-anchor="middle" font-size="15" fill="#333">3² + 4² = 5²</text>
  <text x="350" y="125" text-anchor="middle" font-size="14" fill="#555">9 + 16 = 25</text>

  <!-- Product -->
  <text x="350" y="170" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">Balanced Product:</text>
  <text x="350" y="195" text-anchor="middle" font-size="14" fill="#4a90d9">3 × 4 = 12</text>

  <!-- Arrow to lens -->
  <text x="350" y="240" text-anchor="middle" font-size="13" fill="#888">↓ Tropical Lens Encoding ↓</text>
  <text x="350" y="270" text-anchor="middle" font-size="14" fill="#555">2-lens network: mult = [3, 4]</text>
</svg>