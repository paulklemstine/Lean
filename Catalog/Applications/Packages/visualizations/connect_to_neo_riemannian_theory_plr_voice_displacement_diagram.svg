</defs>
<text x="350" y="24" text-anchor="middle" class="dtitle">PLR Voice Displacement on C Major {C, E, G}</text>
<text x="120" y="50" text-anchor="middle" class="dinfo">P: Parallel</text>
<text x="120" y="66" text-anchor="middle" class="dlabel">C → Cm</text>
