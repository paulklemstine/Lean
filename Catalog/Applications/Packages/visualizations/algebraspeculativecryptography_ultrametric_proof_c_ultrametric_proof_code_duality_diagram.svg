<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">
    Ultrametric Proof-Code Duality: The Three-Way Correspondence
  </text>

  <!-- Box 1: Algebra -->
  <rect x="30" y="60" width="220" height="180" rx="12" fill="#e8f4fd" stroke="#2196F3" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Observer Algebra</text>
  <text x="140" y="110" text-anchor="middle" font-size="11" fill="#333">Observer family O : ι → P → S</text>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#333">Level assignment lvl : ι → ℕ</text>
  <text x="140" y="155" text-anchor="middle" font-size="11" fill="#555">Kernel at level k:</text>
  <text x="140" y="175" text-anchor="middle" font-size="10" fill="#555">∀ i, lvl(i) ≤ k → O_i(x) = O_i(y)</text>
  <text x="140" y="200" text-anchor="middle" font-size="10" fill="#1565C0">Equivalence relations</text>
  <text x="140" y="218" text-anchor="middle" font-size="10" fill="#1565C0">Nested filtration</text>

  <!-- Box 2: Geometry -->
  <rect x="290" y="60" width="220" height="180" rx="12" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Ultrametric Geometry</text>
  <text x="400" y="110" text-anchor="middle" font-size="11" fill="#333">Distance d : P → P → ℕ</text>
  <text x="400" y="130" text-anchor="middle" font-size="11" fill="#333">d(x,z) ≤ max(d(x,y), d(y,z))</text>
  <text x="400" y="155" text-anchor="middle" font-size="11" fill="#555">Closed ball B(x,k):</text>
  <text x="400" y="175" text-anchor="middle" font-size="10" fill="#555">{y | d(x,y) ≤ k}</text>
  <text x="400" y="200" text-anchor="middle" font-size="10" fill="#2E7D32">Isosceles triangles</text>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#2E7D32">Laminar ball family</text>

  <!-- Box 3: Coding -->
  <rect x="550" y="60" width="220" height="180" rx="12" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
  <text x="660" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">Hierarchical Decoding</text>
  <text x="660" y="110" text-anchor="middle" font-size="11" fill="#333">Nested partition system</text>
  <text x="660" y="130" text-anchor="middle" font-size="11" fill="#333">Dendrogram / cluster tree</text>
  <text x="660" y="155" text-anchor="middle" font-size="11" fill="#555">Congruence decoder:</text>
  <text x="660" y="175" text-anchor="middle" font-size="10" fill="#555">kernel class membership</text>
  <text x="660" y="200" text-anchor="middle" font-size="10" fill="#E65100">= nearest ball decoder</text>
  <text x="660" y="218" text-anchor="middle" font-size="10" fill="#E65100">Certified reconstruction</text>

  <!-- Arrow 1: Algebra → Geometry -->
  <path d="M250,120 Q270,100 290,120" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M290,180 Q270,200 250,180" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="95" text-anchor="middle" font-size="9" fill="#666">obsDist</text>
  <text x="270" y="210" text-anchor="middle" font-size="9" fill="#666">canonical obs</text>

  <!-- Arrow 2: Geometry → Coding -->
  <path d="M510,120 Q530,100 550,120" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550,180 Q530,200 510,180" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="95" text-anchor="middle" font-size="9" fill="#666">canonicalNPS</text>
  <text x="530" y="210" text-anchor="middle" font-size="9" fill="#666">reconstruction</text>

  <!-- Arrow 3: Algebra ↔ Coding (bottom arc) -->
  <path d="M140,240 Q400,310 660,240" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="400" y="295" text-anchor="middle" font-size="9" fill="#666">Ball-Kernel Duality</text>

  <!-- Dendrogram Example -->
  <text x="400" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
    Example: 4-Point Binary Tree
  </text>

  <!-- Level 2 merge -->
  <line x1="200" y1="380" x2="600" y2="380" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="160" y="383" font-size="10" fill="#999">Level 2</text>
  <line x1="300" y1="380" x2="500" y2="380" stroke="#333" stroke-width="2"/>

  <!-- Level 1 merges -->
  <line x1="200" y1="420" x2="600" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="160" y="423" font-size="10" fill="#999">Level 1</text>
  <line x1="300" y1="380" x2="300" y2="420" stroke="#333" stroke-width="2"/>
  <line x1="500" y1="380" x2="500" y2="420" stroke="#333" stroke-width="2"/>
  <line x1="250" y1="420" x2="350" y2="420" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="420" x2="550" y2="420" stroke="#333" stroke-width="2"/>

  <!-- Leaves -->
  <line x1="250" y1="420" x2="250" y2="460" stroke="#333" stroke-width="2"/>
  <line x1="350" y1="420" x2="350" y2="460" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="420" x2="450" y2="460" stroke="#333" stroke-width="2"/>
  <line x1="550" y1="420" x2="550" y2="460" stroke="#333" stroke-width="2"/>

  <circle cx="250" cy="465" r="15" fill="#2196F3" opacity="0.8"/>
  <circle cx="350" cy="465" r="15" fill="#2196F3" opacity="0.8"/>
  <circle cx="450" cy="465" r="15" fill="#4CAF50" opacity="0.8"/>
  <circle cx="550" cy="465" r="15" fill="#4CAF50" opacity="0.8"/>

  <text x="250" y="469" text-anchor="middle" font-size="12" fill="white" font-weight="bold">0</text>
  <text x="350" y="469" text-anchor="middle" font-size="12" fill="white" font-weight="bold">1</text>
  <text x="450" y="469" text-anchor="middle" font-size="12" fill="white" font-weight="bold">2</text>
  <text x="550" y="469" text-anchor="middle" font-size="12" fill="white" font-weight="bold">3</text>

  <!-- Labels -->
  <text x="300" y="495" text-anchor="middle" font-size="10" fill="#2196F3">d=1</text>
  <text x="500" y="495" text-anchor="middle" font-size="10" fill="#4CAF50">d=1</text>
  <text x="400" y="372" text-anchor="middle" font-size="10" fill="#333">d=2</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
</svg>
