<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
<style>
  .node { fill: #2196F3; stroke: #1565C0; stroke-width: 2; }
  .edge { stroke: #90CAF9; stroke-width: 2; fill: none; }
  .label { font-family: monospace; font-size: 11px; text-anchor: middle; fill: white; }
  .cost { font-family: sans-serif; font-size: 9px; text-anchor: middle; fill: #666; }
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #333; }
  .signal { stroke: #FF5722; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; opacity: 0.6; }
</style>
<text x="300" y="25" class="title">Berggren Tree with Tropical Lens Signals</text>
<line x1="300" y1="50" x2="150" y2="150" class="edge"/>
<text x="235" y="95" class="cost">|5-13|=8</text>
<line x1="300" y1="50" x2="300" y2="150" class="edge"/>
<text x="310" y="95" class="cost">|5-29|=24</text>
<line x1="300" y1="50" x2="450" y2="150" class="edge"/>
<text x="385" y="95" class="cost">|5-17|=12</text>
<line x1="150" y1="150" x2="75" y2="250" class="edge"/>
<text x="122" y="195" class="cost">|13-25|=12</text>
<line x1="150" y1="150" x2="150" y2="250" class="edge"/>
<text x="160" y="195" class="cost">|13-73|=60</text>
<line x1="150" y1="150" x2="225" y2="250" class="edge"/>
<text x="197" y="195" class="cost">|13-53|=40</text>
<path d="M 75 250 Q 150 200 300 50" class="signal"/>
<path d="M 225 250 Q 250 200 300 50" class="signal"/>
<circle cx="300" cy="50" r="20" class="node"/>
<text x="300" y="54" class="label">3,4,5</text>
<circle cx="150" cy="150" r="20" class="node"/>
<text x="150" y="154" class="label">5,12,13</text>
<circle cx="300" cy="150" r="20" class="node"/>
<text x="300" y="154" class="label">21,20,29</text>
<circle cx="450" cy="150" r="20" class="node"/>
<text x="450" y="154" class="label">15,8,17</text>
<circle cx="75" cy="250" r="20" class="node"/>
<text x="75" y="254" class="label">7,24,25</text>
<circle cx="150" cy="250" r="20" class="node"/>
<text x="150" y="254" class="label">55,48,73</text>
<circle cx="225" cy="250" r="20" class="node"/>
<text x="225" y="254" class="label">45,28,53</text>
<text x="50" y="350" class="cost" style="text-anchor:start">Node color: source weight = leg a</text>
<text x="50" y="365" class="cost" style="text-anchor:start">Edge label: |c₁ - c₂| (hypotenuse cost)</text>
<text x="50" y="380" class="cost" style="text-anchor:start">Dashed: tropical signal paths (min-plus geodesics)</text>
</svg>