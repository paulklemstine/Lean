<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350">
  <rect width="500" height="350" fill="#fafafa" rx="8"/>
  <text x="250" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Symmetry Gap Comparison</text>
  <text x="100" y="60" text-anchor="middle" font-size="11" fill="#555">Gap = 0 (uniform)</text>
  <rect x="50" y="215" width="40" height="75" fill="#4a90d9" opacity="0.7" rx="3"/>
  <text x="70" y="210" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="95" y="215" width="40" height="75" fill="#4a90d9" opacity="0.7" rx="3"/>
  <text x="115" y="210" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="140" y="215" width="40" height="75" fill="#4a90d9" opacity="0.7" rx="3"/>
  <text x="160" y="210" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="100" y="325" text-anchor="middle" font-size="11" fill="#333">∏ = 125, gap = 0</text>
  <text x="250" y="60" text-anchor="middle" font-size="11" fill="#555">Gap = 4 (unbalanced)</text>
  <rect x="200" y="245" width="40" height="45" fill="#d9a04a" opacity="0.7" rx="3"/>
  <text x="220" y="240" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="245" y="185" width="40" height="105" fill="#d9a04a" opacity="0.7" rx="3"/>
  <text x="265" y="180" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="250" y="325" text-anchor="middle" font-size="11" fill="#333">∏ = 21, gap = 4</text>
  <text x="400" y="60" text-anchor="middle" font-size="11" fill="#555">Gap = 11 (high gap)</text>
  <rect x="350" y="260" width="40" height="30" fill="#d94a4a" opacity="0.7" rx="3"/>
  <text x="370" y="255" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="395" y="95" width="40" height="195" fill="#d94a4a" opacity="0.7" rx="3"/>
  <text x="415" y="90" text-anchor="middle" font-size="11" fill="#333">13</text>
  <text x="400" y="325" text-anchor="middle" font-size="11" fill="#333">∏ = 26, gap = 11</text>
</svg>