<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 16px; font-weight: bold; fill: #333; }
