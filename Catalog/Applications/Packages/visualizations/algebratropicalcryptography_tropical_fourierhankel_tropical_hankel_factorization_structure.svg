<svg xmlns="http://www.w3.org/2000/svg" width="650" height="350" viewBox="0 0 650 350">
<rect width="650" height="350" fill="white"/>
<text x="325" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Tropical Hankel Factorization Structure</text>
<rect x="30" y="60" width="160" height="160" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2" rx="5"/>
<text x="110" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">H_f(u,v)</text>
<text x="110" y="165" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">= f(u·v)</text>
<text x="110" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">∞ × ∞ matrix</text>
<text x="215" y="145" text-anchor="middle" font-family="Arial" font-size="24">=</text>
<rect x="240" y="60" width="100" height="160" fill="#d5f5e3" stroke="#27ae60" stroke-width="2" rx="5"/>
<text x="290" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">φ(u)</text>
<text x="290" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="#27ae60">∞ × n</text>
<text x="360" y="145" text-anchor="middle" font-family="Arial" font-size="20">⊗</text>
<rect x="385" y="60" width="160" height="100" fill="#d6eaf8" stroke="#2980b9" stroke-width="2" rx="5"/>
<text x="465" y="110" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">ψ(v)</text>
<text x="465" y="130" text-anchor="middle" font-family="Arial" font-size="11" fill="#2980b9">n × ∞</text>
<path d="M 325 230 L 325 270 L 400 270" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/></marker></defs>
<rect x="400" y="255" width="220" height="70" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="5"/>
<text x="510" y="280" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#c0392b">φ(u₁) = φ(u₂)</text>
<text x="510" y="300" text-anchor="middle" font-family="Arial" font-size="11" fill="#c0392b">⟹ f(u₁) = f(u₂)</text>
<text x="510" y="316" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">Certified Collision!</text>
<text x="290" y="265" text-anchor="middle" font-family="Arial" font-size="11" fill="#e74c3c">state collision</text>
</svg>