<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#fafafa" rx="10"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Non-Archimedean Information Duality Pipeline</text>

  <!-- Boxes -->
  <rect x="20" y="60" width="140" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="90" y="85" text-anchor="middle" font-size="12" fill="#1565c0">Closure</text>
  <text x="90" y="102" text-anchor="middle" font-size="12" fill="#1565c0">Operator cl</text>

  <rect x="200" y="60" width="140" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="270" y="85" text-anchor="middle" font-size="12" fill="#2e7d32">Closure</text>
  <text x="270" y="102" text-anchor="middle" font-size="12" fill="#2e7d32">Capacity cap</text>

  <rect x="380" y="60" width="140" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="450" y="85" text-anchor="middle" font-size="12" fill="#e65100">Tropical</text>
  <text x="450" y="102" text-anchor="middle" font-size="12" fill="#e65100">Profile v.cap</text>

  <rect x="560" y="60" width="140" height="60" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="630" y="85" text-anchor="middle" font-size="12" fill="#c62828">Canonical</text>
  <text x="630" y="102" text-anchor="middle" font-size="12" fill="#c62828">Skeleton</text>

  <!-- Arrows -->
  <line x1="160" y1="90" x2="195" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="90" x2="375" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="90" x2="555" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Theorem labels -->
  <text x="400" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Key Theorems (all formally verified)</text>

  <rect x="20" y="170" width="370" height="40" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
  <text x="205" y="195" text-anchor="middle" font-size="11" fill="#4a148c">Thm C: x ∈ cl(X) ⟹ cap({x}) ≤ cap(X) [Dominance]</text>

  <rect x="410" y="170" width="370" height="40" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
  <text x="595" y="195" text-anchor="middle" font-size="11" fill="#4a148c">Thm A: cl(X)=cl(Y) ⟹ cap(X)=cap(Y) [Invariance]</text>

  <rect x="20" y="220" width="370" height="40" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1"/>
  <text x="205" y="245" text-anchor="middle" font-size="11" fill="#006064">Ultrametric: d(s,u) ≤ max(d(s,t), d(t,u))</text>

  <rect x="410" y="220" width="370" height="40" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1"/>
  <text x="595" y="245" text-anchor="middle" font-size="11" fill="#006064">Faithful: ∀s. v.cap(s) = w.cap(s) ⟹ v ≅ w</text>

  <!-- Example -->
  <rect x="100" y="280" width="600" height="100" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#f57f17">Concrete Example: Fin 3</text>
  <text x="400" y="325" text-anchor="middle" font-size="11" fill="#795548">cl({0,1}) = {0,1,2} means 2 depends on {0,1}</text>
  <text x="400" y="345" text-anchor="middle" font-size="11" fill="#795548">cap({2}) = 1 ≤ 1 = cap({0,1}) ✓ Tropical dominance verified</text>
  <text x="400" y="365" text-anchor="middle" font-size="11" fill="#795548">Canonical skeleton = {0,1} — minimal generators, verified by decide</text>
</svg>