<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">
    Berggren–Chronometric Reversible Automata Architecture
  </text>

  <!-- Background regions -->
  <rect x="30" y="50" width="350" height="240" rx="15" fill="url(#grad1)" stroke="#3498db" stroke-width="1.5"/>
  <rect x="420" y="50" width="350" height="240" rx="15" fill="url(#grad2)" stroke="#e74c3c" stroke-width="1.5"/>
  <rect x="30" y="330" width="740" height="240" rx="15" fill="#f5f5f5" stroke="#7f8c8d" stroke-width="1.5"/>

  <!-- Region labels -->
  <text x="205" y="72" text-anchor="middle" font-size="13" fill="#2980b9" font-weight="bold">Number Theory</text>
  <text x="595" y="72" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">Automata &amp; Computation</text>
  <text x="400" y="352" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">Cross-Domain Results</text>

  <!-- Berggren Tree -->
  <rect x="60" y="85" width="140" height="55" rx="8" fill="white" stroke="#2980b9" stroke-width="2"/>
  <text x="130" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Berggren Tree</text>
  <text x="130" y="123" text-anchor="middle" font-size="9" fill="#666">(3,4,5) → A,B,C</text>

  <!-- BerggrenWord -->
  <rect x="60" y="160" width="140" height="55" rx="8" fill="white" stroke="#2980b9" stroke-width="2"/>
  <text x="130" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">BerggrenWord</text>
  <text x="130" y="198" text-anchor="middle" font-size="9" fill="#666">List BerggrenStep</text>

  <!-- PrimitiveTriple -->
  <rect x="220" y="120" width="140" height="55" rx="8" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="290" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">PrimitiveTriple</text>
  <text x="290" y="158" text-anchor="middle" font-size="9" fill="#666">a²+b²=c², gcd=1</text>

  <!-- Chronometric Length -->
  <rect x="220" y="200" width="140" height="55" rx="8" fill="white" stroke="#8e44ad" stroke-width="2"/>
  <text x="290" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Chronometric</text>
  <text x="290" y="233" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Length</text>
  <text x="290" y="248" text-anchor="middle" font-size="9" fill="#666">A→1, B→2, C→2</text>

  <!-- Reversible Automaton -->
  <rect x="450" y="85" width="140" height="55" rx="8" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="520" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Reversible Orbit</text>
  <text x="520" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Automaton</text>
  <text x="520" y="133" text-anchor="middle" font-size="9" fill="#666">step/backstep</text>

  <!-- Causal Congruence -->
  <rect x="450" y="160" width="140" height="55" rx="8" fill="white" stroke="#e67e22" stroke-width="2"/>
  <text x="520" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Causal</text>
  <text x="520" y="193" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Congruence</text>
  <text x="520" y="208" text-anchor="middle" font-size="9" fill="#666">∀ w, eval(u++w)=eval(v++w)</text>

  <!-- Orbit Morphism -->
  <rect x="620" y="120" width="130" height="55" rx="8" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="685" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">OrbitMorphism</text>
  <text x="685" y="158" text-anchor="middle" font-size="9" fill="#666">src → word → tgt</text>

  <!-- Arrows in top section -->
  <line x1="130" y1="140" x2="130" y2="158" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="112" x2="218" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="188" x2="218" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="140" x2="520" y2="158" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="112" x2="618" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cross-domain bridge arrow -->
  <line x1="360" y1="188" x2="448" y2="188" stroke="#9b59b6" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="404" y="180" text-anchor="middle" font-size="8" fill="#9b59b6" font-weight="bold">BRIDGE</text>

  <!-- Bottom section: Results -->
  <!-- Myhill-Nerode -->
  <rect x="50" y="370" width="155" height="50" rx="8" fill="white" stroke="#16a085" stroke-width="2"/>
  <text x="127" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Myhill–Nerode</text>
  <text x="127" y="405" text-anchor="middle" font-size="9" fill="#666">Quot injects → States</text>

  <!-- Entropy -->
  <rect x="225" y="370" width="155" height="50" rx="8" fill="white" stroke="#f39c12" stroke-width="2"/>
  <text x="302" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Entropy Bounds</text>
  <text x="302" y="405" text-anchor="middle" font-size="9" fill="#666">3^n monotone, ≤ 3·2^n</text>

  <!-- Separation -->
  <rect x="400" y="370" width="155" height="50" rx="8" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="477" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Strict Separation</text>
  <text x="477" y="405" text-anchor="middle" font-size="9" fill="#666">Causal ⊊ Irreversible</text>

  <!-- Time Reversal -->
  <rect x="575" y="370" width="175" height="50" rx="8" fill="white" stroke="#8e44ad" stroke-width="2"/>
  <text x="662" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">Time Reversal Inv.</text>
  <text x="662" y="405" text-anchor="middle" font-size="9" fill="#666">cost(w) = cost(rev(w))</text>

  <!-- Applications row -->
  <rect x="50" y="445" width="175" height="50" rx="8" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.5"/>
  <text x="137" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">Post-Quantum</text>
  <text x="137" y="480" text-anchor="middle" font-size="9" fill="#666">Security: 2·chronoLen</text>

  <rect x="245" y="445" width="155" height="50" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/>
  <text x="322" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">Thermodynamic</text>
  <text x="322" y="480" text-anchor="middle" font-size="9" fill="#666">Landauer cost = 0</text>

  <rect x="420" y="445" width="155" height="50" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="497" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="#e74c3c">ML Robustness</text>
  <text x="497" y="480" text-anchor="middle" font-size="9" fill="#666">Lipschitz: Δ≤2·edit</text>

  <rect x="595" y="445" width="175" height="50" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="682" y="465" text-anchor="middle" font-size="10" font-weight="bold" fill="#8e44ad">Lattice Trapdoor</text>
  <text x="682" y="480" text-anchor="middle" font-size="9" fill="#666">cost = chronoLen + depth</text>

  <!-- Stats -->
  <text x="400" y="535" text-anchor="middle" font-size="12" fill="#2c3e50" font-weight="bold">
    52 Theorems · 28 Definitions · 8 Structures · 0 Sorries
  </text>
  <text x="400" y="555" text-anchor="middle" font-size="10" fill="#7f8c8d">
    Machine-verified in Lean 4 with Mathlib
  </text>
</svg>
