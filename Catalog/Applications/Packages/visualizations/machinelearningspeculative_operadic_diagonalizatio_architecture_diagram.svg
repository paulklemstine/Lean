<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">
    Operadic Neural Proof-Semiring Diagonalization
  </text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#777">
    Architecture Minimization via Prime Congruence Spectra
  </text>

  <!-- Neural Architecture Box -->
  <rect x="30" y="80" width="200" height="120" rx="12" fill="url(#grad1)" stroke="#4A90D9" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5F8A">Neural Architectures</text>
  <text x="130" y="125" text-anchor="middle" font-size="11" fill="#555">NeuralArch σ</text>
  <text x="130" y="145" text-anchor="middle" font-size="10" fill="#777">depth · width · genCount</text>
  <text x="130" y="165" text-anchor="middle" font-size="10" fill="#777">operadic composition</text>
  <text x="130" y="185" text-anchor="middle" font-size="9" fill="#999">ML / Architecture Search</text>

  <!-- Prime Congruences Box -->
  <rect x="350" y="80" width="200" height="120" rx="12" fill="url(#grad1)" stroke="#7B68EE" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#4B3D8F">Prime Congruences</text>
  <text x="450" y="125" text-anchor="middle" font-size="11" fill="#555">ProofSemCongruence α</text>
  <text x="450" y="145" text-anchor="middle" font-size="10" fill="#777">IsPrime: ab≈0 → a≈0 ∨ b≈0</text>
  <text x="450" y="165" text-anchor="middle" font-size="10" fill="#777">semiring congruence</text>
  <text x="450" y="185" text-anchor="middle" font-size="9" fill="#999">Algebra / Proof Theory</text>

  <!-- Semantic Theory Box -->
  <rect x="670" y="80" width="200" height="120" rx="12" fill="url(#grad1)" stroke="#E67E22" stroke-width="2"/>
  <text x="770" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#A0522D">Semantic Theory</text>
  <text x="770" y="125" text-anchor="middle" font-size="11" fill="#555">theoryOf C L : Set α</text>
  <text x="770" y="145" text-anchor="middle" font-size="10" fill="#777">vanishing locus semantics</text>
  <text x="770" y="165" text-anchor="middle" font-size="10" fill="#777">proof-trace evaluation</text>
  <text x="770" y="185" text-anchor="middle" font-size="9" fill="#999">Logic / Computation</text>

  <!-- Arrows top row -->
  <line x1="230" y1="140" x2="348" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="133" text-anchor="middle" font-size="9" fill="#555">evaluate</text>

  <line x1="550" y1="140" x2="668" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="133" text-anchor="middle" font-size="9" fill="#555">produce</text>

  <!-- PrimeObsEq Box (center) -->
  <rect x="250" y="240" width="400" height="90" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="450" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Prime Observational Equivalence</text>
  <text x="450" y="285" text-anchor="middle" font-size="11" fill="#555">∀ C prime, theoryOf C L₁ = theoryOf C L₂</text>
  <text x="450" y="305" text-anchor="middle" font-size="10" fill="#777">Reflexive · Symmetric · Transitive · Congruence</text>
  <text x="450" y="320" text-anchor="middle" font-size="9" fill="#999">primeObsSetoid → Quotient NeuralArch / PrimeObsEq</text>

  <!-- Arrows to PrimeObsEq -->
  <line x1="130" y1="200" x2="310" y2="238" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="200" x2="450" y2="238" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom row: four application boxes -->

  <!-- Minimization -->
  <rect x="30" y="380" width="190" height="100" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="125" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Minimization</text>
  <text x="125" y="418" text-anchor="middle" font-size="9" fill="#555">Canonical minimal</text>
  <text x="125" y="432" text-anchor="middle" font-size="9" fill="#555">representative ∃ M ∈ s</text>
  <text x="125" y="446" text-anchor="middle" font-size="9" fill="#555">compressionScore M ≤ all</text>
  <text x="125" y="465" text-anchor="middle" font-size="8" fill="#999">Myhill–Nerode / NAS</text>

  <!-- Separation -->
  <rect x="245" y="380" width="190" height="100" rx="10" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="340" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A1B9A">Prime Separation</text>
  <text x="340" y="418" text-anchor="middle" font-size="9" fill="#555">¬PrimeObsEq → ∃ C prime</text>
  <text x="340" y="432" text-anchor="middle" font-size="9" fill="#555">injective fingerprints</text>
  <text x="340" y="446" text-anchor="middle" font-size="9" fill="#555">counting lower bounds</text>
  <text x="340" y="465" text-anchor="middle" font-size="8" fill="#999">Post-Quantum / Crypto</text>

  <!-- Compression -->
  <rect x="460" y="380" width="190" height="100" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="555" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D47A1">Compression Bounds</text>
  <text x="555" y="418" text-anchor="middle" font-size="9" fill="#555">|ι| ≤ Σ compressionScore</text>
  <text x="555" y="432" text-anchor="middle" font-size="9" fill="#555">gap + depth = score</text>
  <text x="555" y="446" text-anchor="middle" font-size="9" fill="#555">Hamming triangle ineq</text>
  <text x="555" y="465" text-anchor="middle" font-size="8" fill="#999">Info Theory / Physics</text>

  <!-- Robustness -->
  <rect x="675" y="380" width="190" height="100" rx="10" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5"/>
  <text x="770" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#B71C1C">Certified Robustness</text>
  <text x="770" y="418" text-anchor="middle" font-size="9" fill="#555">semanticHammingBound</text>
  <text x="770" y="432" text-anchor="middle" font-size="9" fill="#555">Lipschitz-style stability</text>
  <text x="770" y="446" text-anchor="middle" font-size="9" fill="#555">H(L₁,L₃) ≤ H(L₁,L₂)+H(L₂,L₃)</text>
  <text x="770" y="465" text-anchor="middle" font-size="8" fill="#999">ML Robustness / Adversarial</text>

  <!-- Arrows from PrimeObsEq to bottom row -->
  <line x1="350" y1="330" x2="170" y2="378" stroke="#FF9800" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="400" y1="330" x2="340" y2="378" stroke="#9C27B0" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="500" y1="330" x2="530" y2="378" stroke="#1976D2" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="570" y1="330" x2="720" y2="378" stroke="#E53935" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="450" y="520" text-anchor="middle" font-size="11" fill="#555">
    Key theorem: machineLearning_speculative_operadic_diagonalization_via_neural_proof_semirings
  </text>
  <text x="450" y="540" text-anchor="middle" font-size="10" fill="#888">
    ∃ M ∈ s, PrimeObsEq L M ∧ IsCompressionMinimal M
  </text>
  <text x="450" y="565" text-anchor="middle" font-size="9" fill="#aaa">
    30+ theorems · 15+ definitions · zero sorries · machine-verified
  </text>
</svg>
