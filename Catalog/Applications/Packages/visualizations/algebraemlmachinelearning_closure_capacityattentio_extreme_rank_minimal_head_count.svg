<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 300" width="530" height="300">
  <defs>
    <style>
      text { font-family: 'Georgia', serif; }
    </style>
  </defs>

  <text x="265" y="22" text-anchor="middle" style="font-size:15px; font-weight:bold; fill:#1a1a2e;">Extreme Rank = Minimal Head Count</text>

  <!-- Axis -->
  <line x1="50" y1="230" x2="510" y2="230" stroke="#999" stroke-width="1"/>
  <line x1="50" y1="50" x2="50" y2="230" stroke="#999" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="40" y="234" text-anchor="end" style="font-size:10px; fill:#666;">0</text>
  <text x="40" y="54.0" text-anchor="end" style="font-size:10px; fill:#666;">6</text>

  <rect x="60" y="200.0" width="28" height="30.0" fill="#3498db" opacity="0.8" rx="3"/>
  <rect x="90" y="200.0" width="28" height="30.0" fill="#e67e22" opacity="0.8" rx="3"/>
  <text x="75" y="195.0" text-anchor="middle" style="font-size:11px; fill:#2980b9; font-weight:bold;">1</text>
  <text x="90" y="250" text-anchor="middle" style="font-size:10px; fill:#333;">Trivial</text>
  <text x="90" y="264" text-anchor="middle" style="font-size:10px; fill:#333;">(id closure)</text>
  <rect x="150" y="140.0" width="28" height="90.0" fill="#3498db" opacity="0.8" rx="3"/>
  <rect x="180" y="140.0" width="28" height="90.0" fill="#e67e22" opacity="0.8" rx="3"/>
  <text x="165" y="135.0" text-anchor="middle" style="font-size:11px; fill:#2980b9; font-weight:bold;">3</text>
  <text x="180" y="250" text-anchor="middle" style="font-size:10px; fill:#333;">Partition</text>
  <text x="180" y="264" text-anchor="middle" style="font-size:10px; fill:#333;">{1,2},{3,4}</text>
  <rect x="240" y="80.0" width="28" height="150.0" fill="#3498db" opacity="0.8" rx="3"/>
  <rect x="270" y="80.0" width="28" height="150.0" fill="#e67e22" opacity="0.8" rx="3"/>
  <text x="255" y="75.0" text-anchor="middle" style="font-size:11px; fill:#2980b9; font-weight:bold;">5</text>
  <text x="270" y="250" text-anchor="middle" style="font-size:10px; fill:#333;">U₂,₄</text>
  <text x="270" y="264" text-anchor="middle" style="font-size:10px; fill:#333;">matroid</text>
  <rect x="330" y="50.0" width="28" height="180.0" fill="#3498db" opacity="0.8" rx="3"/>
  <rect x="360" y="50.0" width="28" height="180.0" fill="#e67e22" opacity="0.8" rx="3"/>
  <text x="345" y="45.0" text-anchor="middle" style="font-size:11px; fill:#2980b9; font-weight:bold;">6</text>
  <text x="360" y="250" text-anchor="middle" style="font-size:10px; fill:#333;">Dep: {1,2}→3</text>
  <rect x="420" y="140.0" width="28" height="90.0" fill="#3498db" opacity="0.8" rx="3"/>
  <rect x="450" y="140.0" width="28" height="90.0" fill="#e67e22" opacity="0.8" rx="3"/>
  <text x="435" y="135.0" text-anchor="middle" style="font-size:11px; fill:#2980b9; font-weight:bold;">3</text>
  <text x="450" y="250" text-anchor="middle" style="font-size:10px; fill:#333;">Communities</text>
  <text x="450" y="264" text-anchor="middle" style="font-size:10px; fill:#333;">4 nodes</text>

  <!-- Legend -->
  <rect x="350" y="40" width="12" height="12" fill="#3498db" opacity="0.8" rx="2"/>
  <text x="367" y="51" style="font-size:11px; fill:#333;">Extreme rank</text>
  <rect x="350" y="58" width="12" height="12" fill="#e67e22" opacity="0.8" rx="2"/>
  <text x="367" y="69" style="font-size:11px; fill:#333;">Min. heads</text>
</svg>