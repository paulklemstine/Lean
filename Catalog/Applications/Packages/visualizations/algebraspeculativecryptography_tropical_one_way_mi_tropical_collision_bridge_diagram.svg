<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">
    Tropical Collision Bridge Theorem
  </text>

  <!-- Left box: Tropical Algebra -->
  <rect x="30" y="60" width="220" height="280" rx="15" fill="#e8f4f8" stroke="#2196F3" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Tropical Algebra</text>

  <text x="50" y="120" font-size="11" fill="#333">• Generator matrices M</text>
  <text x="50" y="145" font-size="11" fill="#333">• Word evaluation</text>
  <text x="50" y="170" font-size="11" fill="#333">• Principal minors</text>
  <text x="50" y="195" font-size="11" fill="#333">• Kernel data</text>
  <text x="50" y="220" font-size="11" fill="#333">• Congruence classes</text>

  <rect x="50" y="240" width="180" height="40" rx="8" fill="#BBDEFB" stroke="#1565C0" stroke-width="1"/>
  <text x="140" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">ValCongProfile</text>

  <text x="140" y="310" text-anchor="middle" font-size="10" fill="#666">Profile separation</text>
  <text x="140" y="325" text-anchor="middle" font-size="10" fill="#666">⟹ no witness exists</text>

  <!-- Right box: Cryptography -->
  <rect x="550" y="60" width="220" height="280" rx="15" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
  <text x="660" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2185b">Cryptography</text>

  <text x="570" y="120" font-size="11" fill="#333">• Hash function</text>
  <text x="570" y="145" font-size="11" fill="#333">• Collision resistance</text>
  <text x="570" y="170" font-size="11" fill="#333">• Bounded witnesses</text>
  <text x="570" y="195" font-size="11" fill="#333">• Security certificates</text>
  <text x="570" y="220" font-size="11" fill="#333">• Verifier soundness</text>

  <rect x="570" y="240" width="180" height="40" rx="8" fill="#F8BBD0" stroke="#c2185b" stroke-width="1"/>
  <text x="660" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2185b">Collision-Free</text>

  <text x="660" y="310" text-anchor="middle" font-size="10" fill="#666">∀ w₁ w₂, act(w₁) = act(w₂)</text>
  <text x="660" y="325" text-anchor="middle" font-size="10" fill="#666">⟹ w₁ = w₂</text>

  <!-- Bridge arrows -->
  <line x1="250" y1="160" x2="550" y2="160" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Bridge Theorem</text>

  <line x1="550" y1="260" x2="250" y2="260" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Witness Extraction</text>

  <!-- Center diamond -->
  <polygon points="400,185 430,210 400,235 370,210" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
  <text x="400" y="214" text-anchor="middle" font-size="10" font-weight="bold" fill="#F57F17">IFF</text>

  <!-- Bottom summary -->
  <rect x="200" y="360" width="400" height="30" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1"/>
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#283593">
    Collision ↔ Bounded Congruence Obstruction
  </text>
</svg>