<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">
    Closure Lefschetz Trace Semantics — Architecture
  </text>

  <!-- Layer 1: Closure Operator -->
  <rect x="50" y="60" width="700" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">§1: Finite Closure Operator</text>
  <text x="400" y="105" text-anchor="middle" font-size="11" fill="#333">SetClosureOp α: cl, subset_cl, mono, idem</text>
  <text x="400" y="125" text-anchor="middle" font-size="11" fill="#666">ClosureStratum C = {s : Finset α // cl(s) = s}</text>

  <!-- Arrow down -->
  <path d="M400 140 L400 160" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Layer 2: Nerve / Chains -->
  <rect x="50" y="160" width="340" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="220" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">§2: Closure Nerve</text>
  <text x="220" y="205" text-anchor="middle" font-size="11" fill="#333">ClosureChain C n</text>
  <text x="220" y="225" text-anchor="middle" font-size="11" fill="#666">closureNerveSimplexCount ≤ m^(n+1)</text>

  <rect x="410" y="160" width="340" height="80" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="580" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">§3: Endomorphisms</text>
  <text x="580" y="205" text-anchor="middle" font-size="11" fill="#333">ClosureEndomorphism C</text>
  <text x="580" y="225" text-anchor="middle" font-size="11" fill="#666">closureFixedSimplexCount ≤ nerve count</text>

  <!-- Arrows down -->
  <path d="M220 240 L400 270" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M580 240 L400 270" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Layer 3: Lefschetz Number -->
  <rect x="200" y="270" width="400" height="70" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">§3–5: Lefschetz Number</text>
  <text x="400" y="315" text-anchor="middle" font-size="11" fill="#333">L(C,f) = Σ (-1)ⁿ · |{fixed n-chains}|</text>
  <text x="400" y="330" text-anchor="middle" font-size="10" fill="#c62828">L ≠ 0 ⟹ ∃ fixed stratum (Main Theorem)</text>

  <!-- Arrows down to applications -->
  <path d="M300 340 L150 380" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M400 340 L400 380" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M500 340 L650 380" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Application boxes -->
  <rect x="50" y="380" width="200" height="90" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <text x="150" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527a0">Quantum/Thermo</text>
  <text x="150" y="425" text-anchor="middle" font-size="10" fill="#333">quantum_return_has_</text>
  <text x="150" y="440" text-anchor="middle" font-size="10" fill="#333">certified_recurrence</text>
  <text x="150" y="458" text-anchor="middle" font-size="10" fill="#666">closureTraceDensity</text>

  <rect x="300" y="380" width="200" height="90" rx="8" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#006064">Crypto/Post-Quantum</text>
  <text x="400" y="425" text-anchor="middle" font-size="10" fill="#333">orbit_collision_bound</text>
  <text x="400" y="440" text-anchor="middle" font-size="10" fill="#333">j ≤ closureEntropyBound</text>
  <text x="400" y="458" text-anchor="middle" font-size="10" fill="#666">O(m) collision budget</text>

  <rect x="550" y="380" width="200" height="90" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text x="650" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57f17">ML/Robustness</text>
  <text x="650" y="425" text-anchor="middle" font-size="10" fill="#333">certified_robustness_</text>
  <text x="650" y="440" text-anchor="middle" font-size="10" fill="#333">fixed_chain_witness</text>
  <text x="650" y="458" text-anchor="middle" font-size="10" fill="#666">ClosureMonotoneEnergyKernel</text>

  <!-- Bottom: Periodic Orbit Theory -->
  <rect x="150" y="500" width="500" height="70" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="400" y="525" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a1b9a">§6–10: Periodic Orbit Theory</text>
  <text x="400" y="545" text-anchor="middle" font-size="10" fill="#333">closurePeriodicPointCount ≤ m | closurePrimitivePeriodicCount (Möbius) | P(n) ≤ 2^m</text>
  <text x="400" y="560" text-anchor="middle" font-size="10" fill="#666">48 theorems, 24 definitions, 0 sorry — fully machine-verified</text>

  <path d="M400 470 L400 500" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
</svg>
