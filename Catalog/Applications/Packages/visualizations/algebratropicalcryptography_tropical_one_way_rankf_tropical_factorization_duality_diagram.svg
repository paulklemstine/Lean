<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#f8f9fa" rx="10"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Tropical One-Way Factorization Duality</text>
  
  <!-- Left: Factors -->
  <rect x="30" y="60" width="160" height="80" rx="8" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Factors (A, B)</text>
  <text x="110" y="115" text-anchor="middle" font-size="11" fill="#555">Secret data</text>
  
  <!-- Center: Product -->
  <rect x="310" y="60" width="180" height="80" rx="8" fill="#fef3e2" stroke="#f39c12" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Product C</text>
  <text x="400" y="115" text-anchor="middle" font-size="11" fill="#555">C = min_k(A+B)</text>
  
  <!-- Right: Witness -->
  <rect x="610" y="60" width="160" height="80" rx="8" fill="#e8f8e8" stroke="#27ae60" stroke-width="2"/>
  <text x="690" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Witness ω</text>
  <text x="690" y="115" text-anchor="middle" font-size="11" fill="#555">Trapdoor key</text>
  
  <!-- Arrows -->
  <line x1="190" y1="100" x2="305" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="247" y="90" text-anchor="middle" font-size="11" fill="#333">O(mrn)</text>
  
  <line x1="490" y1="100" x2="605" y2="100" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="547" y="90" text-anchor="middle" font-size="11" fill="#27ae60">extract</text>
  
  <!-- Bottom: Classification -->
  <rect x="200" y="200" width="400" height="100" rx="8" fill="#f0e6ff" stroke="#8e44ad" stroke-width="2"/>
  <text x="400" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Classification Theorem</text>
  <text x="400" y="255" text-anchor="middle" font-size="12" fill="#555">(C, ω) determines (A, B) up to</text>
  <text x="400" y="275" text-anchor="middle" font-size="12" fill="#555">gauge + permutation</text>
  
  <!-- Arrows to classification -->
  <line x1="400" y1="140" x2="400" y2="195" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="140" x2="550" y2="195" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Bottom labels -->
  <text x="400" y="340" text-anchor="middle" font-size="13" fill="#e74c3c" font-weight="bold">Without ω: tropical rank factorization (hard)</text>
  <text x="400" y="365" text-anchor="middle" font-size="13" fill="#27ae60" font-weight="bold">With ω: difference constraints (easy)</text>
</svg>