<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">
    Closure Semimodule System → Myhill–Nerode Quotient
  </text>

  <!-- Original System Box -->
  <rect x="30" y="60" width="340" height="220" rx="12" fill="url(#grad1)" stroke="#4A90D9" stroke-width="2"/>
  <text x="200" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Original System (σ, α, K)</text>

  <!-- States -->
  <circle cx="80" cy="140" r="18" fill="#FFD700" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="145" text-anchor="middle" font-size="12">s₁</text>
  <circle cx="160" cy="140" r="18" fill="#FFD700" stroke="#333" stroke-width="1.5"/>
  <text x="160" y="145" text-anchor="middle" font-size="12">s₂</text>
  <circle cx="240" cy="140" r="18" fill="#90EE90" stroke="#333" stroke-width="1.5"/>
  <text x="240" y="145" text-anchor="middle" font-size="12">s₃</text>
  <circle cx="320" cy="140" r="18" fill="#90EE90" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="145" text-anchor="middle" font-size="12">s₄</text>

  <!-- Closure cloud around s3, s4 -->
  <ellipse cx="280" cy="140" rx="65" ry="30" fill="none" stroke="#FF6347" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#FF6347">closure</text>

  <!-- Transitions -->
  <line x1="98" y1="140" x2="138" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="118" y="133" text-anchor="middle" font-size="9" fill="#666">a</text>
  <line x1="178" y1="140" x2="218" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="198" y="133" text-anchor="middle" font-size="9" fill="#666">a</text>

  <!-- Probes -->
  <text x="200" y="215" text-anchor="middle" font-size="11" fill="#555">Probes: P = {p₁, p₂, ...}</text>
  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#555">Output: K-valued</text>
  <text x="200" y="255" text-anchor="middle" font-size="11" fill="#555">Closure Trace: CT(s, w) ∈ P(K)</text>

  <!-- Arrow to quotient -->
  <line x1="370" y1="170" x2="440" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="405" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">quotient</text>
  <text x="405" y="185" text-anchor="middle" font-size="9" fill="#666">by ≈</text>

  <!-- Quotient System Box -->
  <rect x="450" y="60" width="320" height="220" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="610" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Quotient System (Q)</text>

  <!-- Quotient states -->
  <circle cx="520" cy="140" r="22" fill="#FFD700" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="145" text-anchor="middle" font-size="12">[s₁]</text>
  <circle cx="610" cy="140" r="22" fill="#FFD700" stroke="#333" stroke-width="1.5"/>
  <text x="610" y="145" text-anchor="middle" font-size="12">[s₂]</text>
  <circle cx="700" cy="140" r="22" fill="#90EE90" stroke="#333" stroke-width="1.5"/>
  <text x="700" y="145" text-anchor="middle" font-size="12">[s₃]</text>

  <!-- Quotient transitions -->
  <line x1="542" y1="140" x2="584" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="632" y1="140" x2="674" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <text x="610" y="200" text-anchor="middle" font-size="11" fill="#555">s₃ ≈ s₄ merged!</text>
  <text x="610" y="220" text-anchor="middle" font-size="11" fill="#555">|Q| ≤ |σ| (Theorem)</text>
  <text x="610" y="240" text-anchor="middle" font-size="11" fill="#555">|Q| ≤ |R| (Minimality)</text>

  <!-- Bottom: Three application domains -->
  <rect x="30" y="320" width="230" height="130" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="145" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">🔐 Cryptography</text>
  <text x="145" y="370" text-anchor="middle" font-size="10" fill="#555">Probes = adversary attacks</text>
  <text x="145" y="388" text-anchor="middle" font-size="10" fill="#555">Closure = comp. bounds</text>
  <text x="145" y="406" text-anchor="middle" font-size="10" fill="#555">|Q| = security classes</text>
  <text x="145" y="424" text-anchor="middle" font-size="10" fill="#555">→ post-quantum bounds</text>

  <rect x="285" y="320" width="230" height="130" rx="10" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
  <text x="400" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">⚛️ Quantum</text>
  <text x="400" y="370" text-anchor="middle" font-size="10" fill="#555">Probes = measurements</text>
  <text x="400" y="388" text-anchor="middle" font-size="10" fill="#555">Closure = decoherence</text>
  <text x="400" y="406" text-anchor="middle" font-size="10" fill="#555">|Q| = macrostates</text>
  <text x="400" y="424" text-anchor="middle" font-size="10" fill="#555">→ Koopman spectra</text>

  <rect x="540" y="320" width="230" height="130" rx="10" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="655" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">🧠 ML / Certified</text>
  <text x="655" y="370" text-anchor="middle" font-size="10" fill="#555">Probes = test inputs</text>
  <text x="655" y="388" text-anchor="middle" font-size="10" fill="#555">Closure = robustness ε-ball</text>
  <text x="655" y="406" text-anchor="middle" font-size="10" fill="#555">|Q| = model complexity</text>
  <text x="655" y="424" text-anchor="middle" font-size="10" fill="#555">→ certified extraction</text>

  <!-- Arrows from quotient to applications -->
  <line x1="200" y1="280" x2="145" y2="318" stroke="#FF9800" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="280" x2="400" y2="318" stroke="#2196F3" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="280" x2="655" y2="318" stroke="#9C27B0" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Stabilization note -->
  <rect x="160" y="470" width="480" height="70" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.5"/>
  <text x="400" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#F57F17">
    Finite Reconstruction Theorem
  </text>
  <text x="400" y="515" text-anchor="middle" font-size="11" fill="#555">
    Agreement on words up to depth N ⟹ full agreement (∀ words)
  </text>
  <text x="400" y="530" text-anchor="middle" font-size="10" fill="#888">
    Stabilization guaranteed in ≤ |σ| steps
  </text>

  <!-- Connecting curve -->
  <path d="M 400 540 Q 400 570 300 570 Q 200 570 145 450" fill="none" stroke="#FBC02D" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 400 540 Q 400 560 500 560 Q 600 560 655 450" fill="none" stroke="#FBC02D" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
