<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">
    Tropical Lens Rigidity Duality
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#666">
    Geodesic Semimodule ≅ Weighted Tree (up to boundary permutation)
  </text>

  <!-- Left panel: Star Tree -->
  <rect x="20" y="75" width="340" height="400" rx="10" fill="#f0f8ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="190" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90d9">Weighted Star Tree T</text>
  
  <!-- Center node -->
  <circle cx="190" cy="240" r="12" fill="#4a90d9" stroke="#2c5f8a" stroke-width="2"/>
  <text x="190" y="244" text-anchor="middle" font-size="10" fill="white">C</text>
  
  <!-- Leaf 0 -->
  <line x1="190" y1="228" x2="130" y2="140" stroke="#333" stroke-width="2"/>
  <circle cx="130" cy="140" r="18" fill="#ff6b6b" stroke="#c0392b" stroke-width="2"/>
  <text x="130" y="144" text-anchor="middle" font-size="11" fill="white">0</text>
  <text x="150" y="180" font-size="10" fill="#c0392b" font-weight="bold">w₀=3</text>
  
  <!-- Leaf 1 -->
  <line x1="190" y1="228" x2="270" y2="140" stroke="#333" stroke-width="2"/>
  <circle cx="270" cy="140" r="18" fill="#ff6b6b" stroke="#c0392b" stroke-width="2"/>
  <text x="270" y="144" text-anchor="middle" font-size="11" fill="white">1</text>
  <text x="240" y="180" font-size="10" fill="#c0392b" font-weight="bold">w₁=5</text>
  
  <!-- Leaf 2 -->
  <line x1="178" y1="240" x2="70" y2="280" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="280" r="18" fill="#ff6b6b" stroke="#c0392b" stroke-width="2"/>
  <text x="70" y="284" text-anchor="middle" font-size="11" fill="white">2</text>
  <text x="110" y="270" font-size="10" fill="#c0392b" font-weight="bold">w₂=2</text>
  
  <!-- Leaf 3 -->
  <line x1="190" y1="252" x2="140" y2="370" stroke="#333" stroke-width="2"/>
  <circle cx="140" cy="370" r="18" fill="#ff6b6b" stroke="#c0392b" stroke-width="2"/>
  <text x="140" y="374" text-anchor="middle" font-size="11" fill="white">3</text>
  <text x="155" y="320" font-size="10" fill="#c0392b" font-weight="bold">w₃=7</text>
  
  <!-- Leaf 4 -->
  <line x1="202" y1="240" x2="290" y2="340" stroke="#333" stroke-width="2"/>
  <circle cx="290" cy="340" r="18" fill="#ff6b6b" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="344" text-anchor="middle" font-size="11" fill="white">4</text>
  <text x="260" y="300" font-size="10" fill="#c0392b" font-weight="bold">w₄=4</text>
  
  <!-- Distance examples -->
  <text x="190" y="430" text-anchor="middle" font-size="10" fill="#333">d(0,1) = w₀+w₁ = 8</text>
  <text x="190" y="448" text-anchor="middle" font-size="10" fill="#333">d(0,3) = w₀+w₃ = 10</text>
  <text x="190" y="466" text-anchor="middle" font-size="10" fill="#333">d(2,4) = w₂+w₄ = 6</text>
  
  <!-- Right panel: Geodesic Semimodule -->
  <rect x="440" y="75" width="340" height="400" rx="10" fill="#f0fff0" stroke="#27ae60" stroke-width="2"/>
  <text x="610" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Geodesic Semimodule G(T)</text>
  
  <!-- Distance profile vectors -->
  <text x="460" y="130" font-size="11" fill="#333" font-weight="bold">Distance profiles d(i, ·):</text>
  
  <text x="470" y="155" font-size="11" fill="#333" font-family="monospace">d(0,·) = [0, 8, 5, 10, 7]</text>
  <text x="470" y="175" font-size="11" fill="#333" font-family="monospace">d(1,·) = [8, 0, 7, 12, 9]</text>
  <text x="470" y="195" font-size="11" fill="#333" font-family="monospace">d(2,·) = [5, 7, 0,  9, 6]</text>
  <text x="470" y="215" font-size="11" fill="#333" font-family="monospace">d(3,·) = [10,12,9,  0,11]</text>
  <text x="470" y="235" font-size="11" fill="#333" font-family="monospace">d(4,·) = [7, 9, 6, 11, 0]</text>
  
  <!-- Properties -->
  <text x="460" y="270" font-size="11" fill="#27ae60" font-weight="bold">Properties (proved):</text>
  <text x="470" y="290" font-size="10" fill="#333">✓ Symmetric: d(i,j) = d(j,i)</text>
  <text x="470" y="308" font-size="10" fill="#333">✓ Positive: d(i,j) > 0 for i≠j</text>
  <text x="470" y="326" font-size="10" fill="#333">✓ Four-point condition satisfied</text>
  <text x="470" y="344" font-size="10" fill="#333">✓ Profiles injective (separation)</text>
  <text x="470" y="362" font-size="10" fill="#333">✓ Triangle inequality holds</text>
  
  <!-- Reconstruction -->
  <text x="460" y="395" font-size="11" fill="#e67e22" font-weight="bold">Certified Reconstruction:</text>
  <text x="470" y="415" font-size="10" fill="#333">w(i) = (d(i,j)+d(i,k)−d(j,k))/2</text>
  <text x="470" y="433" font-size="10" fill="#333">Example: w(0) = (8+5−7)/2 = 3 ✓</text>
  <text x="470" y="451" font-size="10" fill="#333">Example: w(3) = (10+12−8)/2 = 7 ✓</text>
  
  <!-- Bidirectional arrow -->
  <line x1="370" y1="260" x2="430" y2="260" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="280" x2="370" y2="280" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#e74c3c">≅</text>
  <text x="400" y="305" text-anchor="middle" font-size="9" fill="#e74c3c">Rigidity</text>
  <text x="400" y="318" text-anchor="middle" font-size="9" fill="#e74c3c">Duality</text>
</svg>
