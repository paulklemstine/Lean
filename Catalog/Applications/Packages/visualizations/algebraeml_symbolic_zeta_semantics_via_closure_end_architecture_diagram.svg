<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">
    Closure Dynamical Zeta Semantics — Architecture
  </text>

  <!-- Core: Closure Dynamics -->
  <rect x="320" y="60" width="260" height="80" rx="12" fill="url(#grad1)" stroke="#4A90D9" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">ClosureDynamics (α, cl, step)</text>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#555">Closure operator + endomorphism</text>
  <text x="450" y="125" text-anchor="middle" font-size="10" fill="#777">cl(step''(S)) ⊆ S for closed S</text>

  <!-- Left: Periodic Points -->
  <rect x="30" y="190" width="200" height="70" rx="10" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="130" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Periodic Points</text>
  <text x="130" y="235" text-anchor="middle" font-size="10" fill="#555">Fix_n = {x : step^[n](x) = x}</text>
  <text x="130" y="248" text-anchor="middle" font-size="10" fill="#555">|Fix_n| ≤ |α|</text>

  <!-- Center: Transition Matrix -->
  <rect x="280" y="190" width="200" height="70" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="380" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Transition Matrix</text>
  <text x="380" y="235" text-anchor="middle" font-size="10" fill="#555">A[i][j] = 𝟙(step(i)=j)</text>
  <text x="380" y="248" text-anchor="middle" font-size="10" fill="#555">tr(A^n) = |Fix_n|</text>

  <!-- Right: Zeta Function -->
  <rect x="530" y="190" width="200" height="70" rx="10" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="630" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Zeta Function</text>
  <text x="630" y="235" text-anchor="middle" font-size="10" fill="#555">ζ(T) = Σ |Fix_n| · T^n</text>
  <text x="630" y="248" text-anchor="middle" font-size="10" fill="#555">Rational (Thm 22)</text>

  <!-- Far Right: Conjugacy -->
  <rect x="770" y="190" width="110" height="70" rx="10" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="825" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A1B9A">Conjugacy</text>
  <text x="825" y="235" text-anchor="middle" font-size="9" fill="#555">h : α ≃ β</text>
  <text x="825" y="248" text-anchor="middle" font-size="9" fill="#555">ζ_C = ζ_D</text>

  <!-- Arrows from core -->
  <line x1="380" y1="140" x2="130" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="140" x2="380" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="140" x2="630" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="130" x2="790" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows between components -->
  <line x1="230" y1="225" x2="280" y2="225" stroke="#666" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4"/>
  <line x1="480" y1="225" x2="530" y2="225" stroke="#666" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4"/>

  <!-- Bottom row: Applications -->
  <text x="450" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Applications</text>

  <!-- Thermodynamics -->
  <rect x="30" y="330" width="160" height="90" rx="8" fill="#FFEBEE" stroke="#F44336" stroke-width="1.5"/>
  <text x="110" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">Thermodynamics</text>
  <text x="110" y="375" text-anchor="middle" font-size="9" fill="#555">Capacity = entropy</text>
  <text x="110" y="390" text-anchor="middle" font-size="9" fill="#555">Partition function</text>
  <text x="110" y="405" text-anchor="middle" font-size="9" fill="#555">Gibbs weights</text>

  <!-- Cryptography -->
  <rect x="220" y="330" width="160" height="90" rx="8" fill="#FFF8E1" stroke="#FFC107" stroke-width="1.5"/>
  <text x="300" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#F57F17">Cryptography</text>
  <text x="300" y="375" text-anchor="middle" font-size="9" fill="#555">Orbit-hash collisions</text>
  <text x="300" y="390" text-anchor="middle" font-size="9" fill="#555">State-space auditing</text>
  <text x="300" y="405" text-anchor="middle" font-size="9" fill="#555">Post-quantum security</text>

  <!-- ML Robustness -->
  <rect x="410" y="330" width="160" height="90" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5"/>
  <text x="490" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#283593">ML Robustness</text>
  <text x="490" y="375" text-anchor="middle" font-size="9" fill="#555">Certified radius</text>
  <text x="490" y="390" text-anchor="middle" font-size="9" fill="#555">Finite-state abstraction</text>
  <text x="490" y="405" text-anchor="middle" font-size="9" fill="#555">Lipschitz bounds</text>

  <!-- Symbolic Dynamics -->
  <rect x="600" y="330" width="160" height="90" rx="8" fill="#E0F2F1" stroke="#009688" stroke-width="1.5"/>
  <text x="680" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#004D40">Symbolic Dynamics</text>
  <text x="680" y="375" text-anchor="middle" font-size="9" fill="#555">Artin–Mazur zeta</text>
  <text x="680" y="390" text-anchor="middle" font-size="9" fill="#555">Transfer operators</text>
  <text x="680" y="405" text-anchor="middle" font-size="9" fill="#555">Subshift of finite type</text>

  <!-- Arrows to applications -->
  <line x1="110" y1="260" x2="110" y2="330" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="250" y1="260" x2="300" y2="330" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="260" x2="490" y2="330" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="630" y1="260" x2="680" y2="330" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Key theorems box -->
  <rect x="100" y="450" width="700" height="130" rx="10" fill="white" stroke="#666" stroke-width="1"/>
  <text x="450" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Key Verified Theorems (27 total, 0 sorry)</text>

  <text x="130" y="500" font-size="10" fill="#444">• closureTrace_eq_periodicCount: tr(A^n) = |Fix_n|</text>
  <text x="130" y="518" font-size="10" fill="#444">• closureZeta_rational: periodic counts eventually periodic</text>
  <text x="130" y="536" font-size="10" fill="#444">• closureZeta_conj_invariant: ζ_C = ζ_D under conjugacy</text>
  <text x="130" y="554" font-size="10" fill="#444">• closurePeriodic_growth_le_capacity: log |Fix_n| ≤ log |α|</text>
  <text x="500" y="500" font-size="10" fill="#444">• closureDynamics_eventually_periodic</text>
  <text x="500" y="518" font-size="10" fill="#444">• closurePeriodicCount_conj_invariant</text>
  <text x="500" y="536" font-size="10" fill="#444">• closureCertifiedRadius_pos / _le_one</text>
  <text x="500" y="554" font-size="10" fill="#444">• closureTransitionMatrix_pow_entry</text>
</svg>
