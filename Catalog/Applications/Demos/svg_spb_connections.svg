<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a1a3e;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6f00;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#e65100;stop-opacity:0.9"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" filter="url(#glow2)">
    The Stereographic Pythagorean Bridge — Connection Map
  </text>
  <text x="450" y="65" text-anchor="middle" fill="#b39ddb" font-size="13">
    28,797 declarations • 1,446 files • 178,634 lines • Machine-verified in Lean 4
  </text>

  <!-- Center node: SPB -->
  <circle cx="450" cy="350" r="60" fill="url(#centerGlow)" stroke="#ffcc80" stroke-width="3" filter="url(#glow2)"/>
  <text x="450" y="340" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">SPB</text>
  <text x="450" y="358" text-anchor="middle" fill="#ffe0b2" font-size="10">(x+y)/(1+xy)</text>
  <text x="450" y="375" text-anchor="middle" fill="#ffe0b2" font-size="9">Formally Verified</text>

  <!-- Surrounding domain nodes -->
  <!-- Node positions (on a circle of radius ~220 around center) -->

  <!-- 1. Number Theory (top) -->
  <g transform="translate(450, 120)">
    <rect x="-80" y="-30" width="160" height="60" rx="12" fill="#1b5e20" stroke="#4caf50" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#c8e6c9" font-size="14" font-weight="bold">Number Theory</text>
    <text x="0" y="10" text-anchor="middle" fill="#a5d6a7" font-size="10">6,038 declarations</text>
    <text x="0" y="24" text-anchor="middle" fill="#81c784" font-size="9">Pythagorean • Berggren • Fibonacci</text>
  </g>

  <!-- 2. Tropical Geometry (top-right) -->
  <g transform="translate(720, 180)">
    <rect x="-80" y="-30" width="160" height="60" rx="12" fill="#4a148c" stroke="#ab47bc" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#e1bee7" font-size="14" font-weight="bold">Tropical Geometry</text>
    <text x="0" y="10" text-anchor="middle" fill="#ce93d8" font-size="10">1,445 declarations</text>
    <text x="0" y="24" text-anchor="middle" fill="#ba68c8" font-size="9">Max-Plus • LSE • Langlands</text>
  </g>

  <!-- 3. Machine Learning (right) -->
  <g transform="translate(750, 380)">
    <rect x="-80" y="-30" width="160" height="60" rx="12" fill="#0d47a1" stroke="#42a5f5" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#bbdefb" font-size="14" font-weight="bold">Machine Learning</text>
    <text x="0" y="10" text-anchor="middle" fill="#90caf9" font-size="10">1,120 declarations</text>
    <text x="0" y="24" text-anchor="middle" fill="#64b5f6" font-size="9">Neural • Lipschitz • Transformers</text>
  </g>

  <!-- 4. Cryptography (bottom-right) -->
  <g transform="translate(680, 550)">
    <rect x="-80" y="-30" width="160" height="60" rx="12" fill="#b71c1c" stroke="#ef5350" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#ffcdd2" font-size="14" font-weight="bold">Cryptography</text>
    <text x="0" y="10" text-anchor="middle" fill="#ef9a9a" font-size="10">741 declarations</text>
    <text x="0" y="24" text-anchor="middle" fill="#e57373" font-size="9">ECDSA • Quantum • ZK Proofs</text>
  </g>

  <!-- 5. Physics (bottom-left) -->
  <g transform="translate(220, 550)">
    <rect x="-80" y="-30" width="160" height="60" rx="12" fill="#e65100" stroke="#ff9800" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#ffe0b2" font-size="14" font-weight="bold">Physics</text>
    <text x="0" y="10" text-anchor="middle" fill="#ffcc80" font-size="10">2,830 declarations</text>
    <text x="0" y="24" text-anchor="middle" fill="#ffb74d" font-size="9">Lorentz • Quantum • Spacetime</text>
  </g>

  <!-- 6. EML Framework (left) -->
  <g transform="translate(150, 380)">
    <rect x="-80" y="-30" width="160" height="60" rx="12" fill="#006064" stroke="#26c6da" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#b2ebf2" font-size="14" font-weight="bold">EML Framework</text>
    <text x="0" y="10" text-anchor="middle" fill="#80deea" font-size="10">4,530 declarations</text>
    <text x="0" y="24" text-anchor="middle" fill="#4dd0e1" font-size="9">eᵃ − ln(b) • Dense Closure</text>
  </g>

  <!-- 7. Computation (top-left) -->
  <g transform="translate(180, 180)">
    <rect x="-80" y="-30" width="160" height="60" rx="12" fill="#1a237e" stroke="#5c6bc0" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#c5cae9" font-size="14" font-weight="bold">Computation</text>
    <text x="0" y="10" text-anchor="middle" fill="#9fa8da" font-size="10">3,079 declarations</text>
    <text x="0" y="24" text-anchor="middle" fill="#7986cb" font-size="9">Oracles • Factoring • Entropy</text>
  </g>

  <!-- Connection lines -->
  <g stroke-width="2" fill="none" marker-end="url(#arrowhead)">
    <!-- SPB → Number Theory -->
    <line x1="450" y1="290" x2="450" y2="155" stroke="#4caf50" stroke-dasharray="5,5" opacity="0.6"/>

    <!-- SPB → Tropical -->
    <line x1="505" y1="310" x2="640" y2="200" stroke="#ab47bc" stroke-dasharray="5,5" opacity="0.6"/>

    <!-- SPB → ML -->
    <line x1="510" y1="350" x2="670" y2="370" stroke="#42a5f5" stroke-dasharray="5,5" opacity="0.6"/>

    <!-- SPB → Crypto -->
    <line x1="490" y1="405" x2="610" y2="530" stroke="#ef5350" stroke-dasharray="5,5" opacity="0.6"/>

    <!-- SPB → Physics -->
    <line x1="400" y1="400" x2="290" y2="530" stroke="#ff9800" stroke-dasharray="5,5" opacity="0.6"/>

    <!-- SPB → EML -->
    <line x1="390" y1="350" x2="230" y2="370" stroke="#26c6da" stroke-dasharray="5,5" opacity="0.6"/>

    <!-- SPB → Computation -->
    <line x1="400" y1="310" x2="260" y2="200" stroke="#5c6bc0" stroke-dasharray="5,5" opacity="0.6"/>
  </g>

  <!-- Cross-domain bridge labels -->
  <g fill="#78909c" font-size="9" font-style="italic">
    <text x="520" y="245" transform="rotate(-40, 520, 245)">tan addition</text>
    <text x="610" y="345" transform="rotate(-5, 610, 345)">tropical neural</text>
    <text x="565" y="475" transform="rotate(40, 565, 475)">quantum attacks</text>
    <text x="335" y="475" transform="rotate(-40, 335, 475)">Lorentz invariance</text>
    <text x="290" y="345" transform="rotate(5, 290, 345)">exp-log bridge</text>
    <text x="300" y="245" transform="rotate(40, 300, 245)">oracle complexity</text>
  </g>

  <!-- Key equations box -->
  <rect x="50" y="630" width="800" height="55" rx="8" fill="#1a1a4e" fill-opacity="0.7" stroke="#3f51b5" stroke-width="1"/>
  <text x="450" y="650" text-anchor="middle" fill="#e8eaf6" font-size="12" font-family="'Courier New', monospace">
    spb(x,y) = (x+y)/(1+xy)  •  EML(a,b) = eᵃ − ln(b)  •  LSE(a,b) = log(eᵃ + eᵇ)
  </text>
  <text x="450" y="672" text-anchor="middle" fill="#9fa8da" font-size="11">
    Three operations unifying seven mathematical domains — all machine-verified
  </text>
</svg>
