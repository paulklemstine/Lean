    <rect x="5" y="142" width="170" height="22" rx="3" fill="#ff9800" opacity="0.7"/>
    <text x="12" y="157" fill="#fff" font-size="9">45. Idempotent DB Index</text>

    <rect x="5" y="168" width="170" height="22" rx="3" fill="#ff9800" opacity="0.7"/>
    <text x="12" y="183" fill="#fff" font-size="9">46. Chip-Firing Load Bal</text>

    <rect x="5" y="194" width="170" height="22" rx="3" fill="#4caf50" opacity="0.7"/>
    <text x="12" y="209" fill="#fff" font-size="9">47. Entropy Pipeline</text>

    <rect x="5" y="220" width="170" height="22" rx="3" fill="#4caf50" opacity="0.7"/>
    <text x="12" y="235" fill="#fff" font-size="9">48. Sauer-Shelah Estim</text>

    <rect x="5" y="246" width="170" height="22" rx="3" fill="#4caf50" opacity="0.7"/>
