    <text x="460" y="17" fill="#ef9a9a" font-size="11">14 algorithms</text>

    <text x="0" y="45" fill="#b0bec5" font-size="11">Prototype (TRL 4-5):</text>
    <rect x="170" y="33" width="380" height="18" rx="3" fill="#ff9800" opacity="0.8"/>
    <text x="560" y="47" fill="#ffcc80" font-size="11">19 algorithms</text>

    <text x="0" y="75" fill="#b0bec5" font-size="11">Deployable (TRL 6-7):</text>
    <rect x="170" y="63" width="340" height="18" rx="3" fill="#4caf50" opacity="0.8"/>
    <text x="520" y="77" fill="#a5d6a7" font-size="11">17 algorithms</text>
