    <rect x="0" y="10" width="12" height="12" rx="2" fill="#e53935"/>
    <text x="18" y="20" fill="#b0bec5" font-size="10">TRL 2-3 (Research)</text>
    <rect x="0" y="28" width="12" height="12" rx="2" fill="#ff9800"/>
