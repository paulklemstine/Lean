    <rect x="5" y="90" width="170" height="22" rx="3" fill="#ff9800" opacity="0.7"/>
    <text x="12" y="105" fill="#fff" font-size="9">3. SPB Diophantine Solver</text>

    <rect x="5" y="116" width="170" height="22" rx="3" fill="#ff9800" opacity="0.7"/>
