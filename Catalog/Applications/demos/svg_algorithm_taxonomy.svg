    <circle cx="15" cy="22" r="5" fill="#4caf50"/>
    <text x="28" y="27" fill="#c8e6c9" font-size="11">Formal verification as a feature (all 50)</text>

    <circle cx="15" cy="44" r="5" fill="#ce93d8"/>
    <text x="28" y="49" fill="#e1bee7" font-size="11">Tropical-classical duality (15 algorithms)</text>

    <circle cx="15" cy="66" r="5" fill="#ff9800"/>
    <text x="28" y="71" fill="#ffe0b2" font-size="11">SPB as universal connector (20 algorithms)</text>

    <circle cx="420" cy="22" r="5" fill="#42a5f5"/>
