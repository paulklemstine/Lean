<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a2640;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">
    50 Novel Algorithm Applications — Taxonomy
  </text>
  <text x="500" y="55" text-anchor="middle" fill="#78909c" font-size="12">
    Grouped by domain, colored by Technology Readiness Level (TRL)
  </text>

  <!-- Legend -->
