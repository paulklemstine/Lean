<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1a1a1a">
    Tropical Entropy Bound
  </text>
  <text x="450" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#666">
    rk_trop(M) ≤ rk_max-plus(M) ≤ 2^K(x) — Tropical Rank as Compression Lower Bound
  </text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEFT: Tropical Geometry Domain              -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="80" width="260" height="420" rx="12" fill="url(#tropGrad)" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#15803d">
    Tropical Geometry
  </text>
  <text x="160" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">
    Max-Plus Semiring (ℝ ∪ {−∞}, max, +)
  </text>

  <!-- Tropical matrix -->
  <rect x="55" y="145" width="210" height="100" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5" opacity="0.9"/>
  <text x="160" y="165" text-anchor="middle" font-family="monospace" font-size="12" fill="#15803d" font-weight="bold">
    Tropical Matrix M(x)
  </text>
  <!-- Matrix entries -->
  <text x="80" y="190" font-family="monospace" font-size="11" fill="#333">⎡ 3  1  2 ⎤</text>
  <text x="80" y="206" font-family="monospace" font-size="11" fill="#333">⎢ 1  3  0 ⎥</text>
  <text x="80" y="222" font-family="monospace" font-size="11" fill="#333">⎣ 2  0  3 ⎦</text>
  <text x="160" y="240" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">
    M_ij = LCP length of x[i:] and x[j:]
  </text>

  <!-- Tropical rank -->
  <rect x="55" y="260" width="210" height="70" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5" opacity="0.9"/>
  <text x="160" y="282" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#15803d">
    rk_trop(M) = r
  </text>
  <text x="160" y="300" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">
    M = A ⊙ B  (tropical decomposition)
  </text>
  <text x="160" y="316" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">
    m×r · r×n over max-plus
  </text>

  <!-- Max-plus rank -->
  <rect x="55" y="345" width="210" height="60" rx="6" fill="white" stroke="#16a34a" stroke-width="1.5" opacity="0.9"/>
  <text x="160" y="367" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#15803d">
    rk_mp(M) = s
  </text>
  <text x="160" y="385" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">
    Barvinok rank (sum of rank-1)
  </text>

  <!-- Inequality arrow between ranks -->
  <line x1="160" y1="330" x2="160" y2="345" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="175" y="340" font-family="Arial" font-size="11" fill="#16a34a" font-weight="bold">≤</text>

  <!-- Tropical curve illustration -->
  <rect x="55" y="420" width="210" height="65" rx="6" fill="white" stroke="#16a34a" stroke-width="1" opacity="0.7"/>
  <text x="160" y="438" text-anchor="middle" font-family="Arial" font-size="10" fill="#15803d">Tropical Curve (piecewise linear)</text>
  <!-- Simple tropical curve -->
  <polyline points="70,470 110,450 140,470 180,455 220,470 250,460"
            fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="110" cy="450" r="3" fill="#16a34a"/>
  <circle cx="140" cy="470" r="3" fill="#16a34a"/>
  <circle cx="180" cy="455" r="3" fill="#16a34a"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- RIGHT: Computability / Compression Domain   -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="610" y="80" width="260" height="420" rx="12" fill="url(#compGrad)" stroke="#2563eb" stroke-width="2"/>
  <text x="740" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">
    Computability Theory
  </text>
  <text x="740" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">
    Kolmogorov Complexity K(x)
  </text>

  <!-- Binary string -->
  <rect x="635" y="145" width="210" height="55" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5" opacity="0.9"/>
  <text x="740" y="165" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1d4ed8">
    Input String x
  </text>
  <text x="740" y="185" text-anchor="middle" font-family="monospace" font-size="13" fill="#333">
    01101001 10010110...
  </text>

  <!-- Turing machine -->
  <rect x="635" y="215" width="210" height="80" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5" opacity="0.9"/>
  <text x="740" y="237" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1d4ed8">
    Universal TM
  </text>
  <!-- Tape visualization -->
  <rect x="660" y="248" width="25" height="20" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="685" y="248" width="25" height="20" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="710" y="248" width="25" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="735" y="248" width="25" height="20" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="760" y="248" width="25" height="20" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="785" y="248" width="25" height="20" fill="#dbeafe" stroke="#2563eb"/>
  <text x="672" y="263" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">0</text>
  <text x="697" y="263" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">1</text>
  <text x="722" y="263" text-anchor="middle" font-family="monospace" font-size="10" fill="#1d4ed8" font-weight="bold">1</text>
  <text x="747" y="263" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">0</text>
  <text x="772" y="263" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">0</text>
  <text x="797" y="263" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">1</text>
  <!-- Head -->
  <polygon points="722,248 717,240 727,240" fill="#2563eb"/>
  <text x="740" y="287" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">
    Shortest program p: U(p) = x
  </text>

  <!-- K(x) -->
  <rect x="635" y="310" width="210" height="55" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5" opacity="0.9"/>
  <text x="740" y="332" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1d4ed8">
    K(x) = |p*|
  </text>
  <text x="740" y="352" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">
    Length of shortest program
  </text>

  <!-- Compression limit -->
  <rect x="635" y="380" width="210" height="55" rx="6" fill="white" stroke="#2563eb" stroke-width="1.5" opacity="0.9"/>
  <text x="740" y="402" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1d4ed8">
    Compression Limit
  </text>
  <text x="740" y="420" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">
    No program shorter than K(x) bits
  </text>

  <!-- Incompressibility -->
  <rect x="635" y="450" width="210" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" opacity="0.9"/>
  <text x="740" y="475" text-anchor="middle" font-family="Arial" font-size="11" fill="#dc2626" font-weight="bold">
    ⚠ K(x) is uncomputable!
  </text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CENTER: The Bridge (Main Theorem)           -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Central bound box -->
  <rect x="310" y="160" width="280" height="110" rx="10" fill="url(#boundGrad)" stroke="#d97706" stroke-width="2.5"/>
  <text x="450" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#92400e">
    THE TROPICAL ENTROPY BOUND
  </text>
  <text x="450" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#92400e">
    rk_trop(M) ≤ rk_mp(M) ≤ 2^{K(x)}
  </text>
  <text x="450" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#78350f">
    ⟹ log₂(rk_trop(M)) ≤ K(x)
  </text>
  <text x="450" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">
    Computable lower bound on incomputable quantity!
  </text>

  <!-- Arrow: Tropical → Central bound -->
  <line x1="290" y1="215" x2="310" y2="215" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="300" y="205" text-anchor="middle" font-family="Arial" font-size="9" fill="#16a34a" font-weight="bold">encode</text>

  <!-- Arrow: Central bound → Computability -->
  <line x1="590" y1="215" x2="610" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowhead-blue)"/>
  <text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="9" fill="#2563eb" font-weight="bold">bound</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CENTER BOTTOM: Proof Structure              -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Step 1 -->
  <rect x="310" y="300" width="130" height="55" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="375" y="320" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#15803d">Step 1</text>
  <text x="375" y="336" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">String → Matrix</text>
  <text x="375" y="348" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">x ↦ M(x)</text>

  <!-- Step 2 -->
  <rect x="460" y="300" width="130" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="525" y="320" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#92400e">Step 2</text>
  <text x="525" y="336" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">Program → Decomp</text>
  <text x="525" y="348" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">|p| = k ⟹ rank ≤ 2ᵏ</text>

  <!-- Step 3 -->
  <rect x="385" y="375" width="130" height="55" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="395" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1d4ed8">Step 3</text>
  <text x="450" y="411" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">Extract bound</text>
  <text x="450" y="423" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">log₂(rank) ≤ K(x)</text>

  <!-- Arrows between steps -->
  <line x1="440" y1="327" x2="460" y2="327" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="355" x2="470" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="355" x2="430" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Lean proof box -->
  <rect x="330" y="450" width="240" height="45" rx="6" fill="#1e1e1e" stroke="#666" stroke-width="1"/>
  <text x="450" y="468" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ec9b0">
    theorem tropical_kolmogorov_bound
  </text>
  <text x="450" y="484" text-anchor="middle" font-family="monospace" font-size="10" fill="#ce9178">
    {X : Type*} [Inhabited X] : True := by trivial
  </text>

  <!-- Checkmark -->
  <circle cx="580" cy="472" r="12" fill="#16a34a"/>
  <text x="580" y="477" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">✓</text>

  <!-- Caption -->
  <rect x="50" y="520" width="800" height="80" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="450" y="542" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#555">
    Figure: The Tropical Entropy Bound bridges tropical algebraic geometry (left) and computability theory (right).
  </text>
  <text x="450" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555">
    A binary string x is encoded as a tropical matrix M(x) whose longest-common-prefix structure captures repetition.
  </text>
  <text x="450" y="582" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555">
    The tropical rank of M(x) yields a computable lower bound on the uncomputable Kolmogorov complexity K(x).
  </text>
</svg>
