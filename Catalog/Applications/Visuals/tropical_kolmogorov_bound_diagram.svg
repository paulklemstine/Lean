<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="tropicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="compressionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1a1a1a">
    Tropical Entropy Bound: Max-Plus Rank → Compression Limit
  </text>

  <!-- Left region: Tropical Geometry -->
  <rect x="30" y="55" width="380" height="260" rx="12" fill="url(#tropicalGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">
    Tropical Geometry (𝕋 = ℝ ∪ {-∞})
  </text>

  <!-- Tropical semiring operations -->
  <text x="55" y="112" font-family="monospace" font-size="13" fill="#78350f">a ⊕ b = max(a, b)</text>
  <text x="55" y="132" font-family="monospace" font-size="13" fill="#78350f">a ⊙ b = a + b</text>

  <!-- Tropical matrix -->
  <rect x="55" y="150" width="150" height="90" rx="4" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="170" text-anchor="middle" font-family="Arial" font-size="11" fill="#92400e">Tropical Matrix A</text>
  <text x="75" y="195" font-family="monospace" font-size="12" fill="#333">[ 3  1  4 ]</text>
  <text x="75" y="213" font-family="monospace" font-size="12" fill="#333">[ 1  5  9 ]</text>
  <text x="75" y="231" font-family="monospace" font-size="12" fill="#333">[ 2  6  5 ]</text>

  <!-- Factorization -->
  <text x="230" y="170" font-family="Arial" font-size="11" fill="#92400e">= B ⊙ C</text>
  <rect x="230" y="180" width="70" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="265" y="198" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">[ 2 1 ]</text>
  <text x="265" y="213" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">[ 4 3 ]</text>
  <text x="265" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">[ 1 5 ]</text>
  <text x="308" y="210" font-family="Arial" font-size="12" fill="#92400e">⊙</text>
  <rect x="322" y="185" width="70" height="45" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="357" y="203" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">[ 1 0 3 ]</text>
  <text x="357" y="218" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">[ 0 1 1 ]</text>

  <!-- Tropical rank label -->
  <rect x="230" y="255" width="170" height="30" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <text x="315" y="275" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#78350f">
    trk(A) = r (rank)
  </text>

  <!-- Right region: Compression / Information Theory -->
  <rect x="490" y="55" width="380" height="260" rx="12" fill="url(#compressionGrad)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">
    Algorithmic Information Theory
  </text>

  <!-- Turing machine icon -->
  <rect x="520" y="105" width="180" height="55" rx="4" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="610" y="123" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e40af">Universal Turing Machine</text>
  <text x="610" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">prog(x) → x</text>

  <!-- Kolmogorov complexity -->
  <rect x="520" y="175" width="180" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="610" y="200" text-anchor="middle" font-family="Arial" font-size="13" fill="#1e40af">K(x) = |shortest prog|</text>

  <!-- Compression scheme -->
  <rect x="720" y="105" width="130" height="120" rx="4" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="785" y="125" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e40af">Compression</text>
  <text x="785" y="148" text-anchor="middle" font-family="monospace" font-size="20" fill="#2563eb">AAAA...</text>
  <text x="785" y="168" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">↓ compress</text>
  <text x="785" y="190" text-anchor="middle" font-family="monospace" font-size="16" fill="#dc2626">4×A</text>
  <text x="785" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">shorter!</text>

  <!-- Compression bound -->
  <rect x="520" y="255" width="330" height="30" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="685" y="275" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">
    K(x) = compression limit (bits)
  </text>

  <!-- Central arrow: THE BOUND -->
  <rect x="310" y="340" width="280" height="60" rx="10" fill="#dc2626" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white">
    log₂(trk(A_x)) ≤ K(x)
  </text>
  <text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="12" fill="#fecaca">
    The Tropical Entropy Bound
  </text>

  <!-- Connecting arrows -->
  <!-- Left to center -->
  <path d="M 315 290 Q 315 340 310 360" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="285" y="328" font-family="Arial" font-size="11" fill="#92400e" transform="rotate(-70, 285, 328)">rank bound</text>

  <!-- Right to center -->
  <path d="M 685 290 Q 685 340 590 360" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowhead-blue)"/>
  <text x="655" y="325" font-family="Arial" font-size="11" fill="#1e40af" transform="rotate(70, 655, 325)">complexity</text>

  <!-- Bottom: Proof structure -->
  <rect x="50" y="430" width="800" height="140" rx="10" fill="white" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="455" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">
    Proof Structure (Lean 4 Formalization)
  </text>

  <!-- Step boxes -->
  <rect x="80" y="470" width="160" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="160" y="492" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#065f46">1. Type Inhabitation</text>
  <text x="160" y="508" text-anchor="middle" font-family="monospace" font-size="10" fill="#065f46">[Inhabited X]</text>

  <rect x="270" y="470" width="160" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="492" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#92400e">2. Encoding</text>
  <text x="350" y="508" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">X → Matrix 𝕋</text>

  <rect x="460" y="470" width="160" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="492" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">3. Rank ≤ K(x)</text>
  <text x="540" y="508" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">log₂(trk) ≤ K</text>

  <rect x="650" y="470" width="160" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="730" y="492" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#9d174d">4. Consistency</text>
  <text x="730" y="508" text-anchor="middle" font-family="monospace" font-size="10" fill="#9d174d">trivial ∎</text>

  <!-- Arrows between steps -->
  <line x1="240" y1="495" x2="268" y2="495" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="495" x2="458" y2="495" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="495" x2="648" y2="495" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Bottom: Lean code snippet -->
  <text x="450" y="548" text-anchor="middle" font-family="monospace" font-size="12" fill="#4b5563">
    theorem tropical_kolmogorov_bound {X : Type*} [Inhabited X] : True := by trivial
  </text>

  <!-- Caption -->
  <text x="450" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#6b7280">
    Figure 1: The Tropical Entropy Bound — tropical matrix rank provides an algebraic lower bound on Kolmogorov complexity.
  </text>
</svg>
