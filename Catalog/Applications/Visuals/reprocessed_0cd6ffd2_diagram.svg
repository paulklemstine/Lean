<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gradient for the hierarchy levels -->
    <linearGradient id="grad0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1a5276;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1b4f72;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#2471a3;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2980b9;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5dade2;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#85c1e9;stop-opacity:0.5"/>
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <!-- CTC loop symbol -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0d1117" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#e8e8e8" font-weight="bold">
    OISCC Temporal Hierarchy
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8899aa">
    Oracle-Indexed Stratified Complexity Classes under CTC Access
  </text>

  <!-- ================================================================ -->
  <!-- LEFT: Nested Hierarchy (concentric ellipses) -->
  <!-- ================================================================ -->

  <!-- PSPACE (outermost) -->
  <ellipse cx="250" cy="300" rx="200" ry="200" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="250" y="115" text-anchor="middle" font-family="monospace" font-size="13" fill="#e74c3c" font-weight="bold">PSPACE = lim CTC_k</text>

  <!-- CTC_4 -->
  <ellipse cx="250" cy="310" rx="175" ry="165" fill="url(#grad4)" stroke="#85c1e9" stroke-width="1.5"/>
  <text x="250" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="#85c1e9">CTC₄</text>

  <!-- CTC_3 -->
  <ellipse cx="250" cy="320" rx="145" ry="130" fill="url(#grad3)" stroke="#3498db" stroke-width="1.5"/>
  <text x="250" y="200" text-anchor="middle" font-family="monospace" font-size="11" fill="#aed6f1">CTC₃</text>

  <!-- CTC_2 -->
  <ellipse cx="250" cy="330" rx="115" ry="100" fill="url(#grad2)" stroke="#2471a3" stroke-width="1.5"/>
  <text x="250" y="242" text-anchor="middle" font-family="monospace" font-size="11" fill="#d4e6f1">CTC₂</text>

  <!-- CTC_1 -->
  <ellipse cx="250" cy="340" rx="82" ry="70" fill="url(#grad1)" stroke="#1a5276" stroke-width="1.5"/>
  <text x="250" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#d6eaf8">CTC₁</text>

  <!-- CTC_0 = P (innermost) -->
  <ellipse cx="250" cy="350" rx="48" ry="40" fill="url(#grad0)" stroke="#f39c12" stroke-width="2"/>
  <text x="250" y="348" text-anchor="middle" font-family="monospace" font-size="12" fill="#f39c12" font-weight="bold">CTC₀</text>
  <text x="250" y="363" text-anchor="middle" font-family="monospace" font-size="9" fill="#f5b041">= P</text>

  <!-- Diagonal witnesses (stars in separation regions) -->
  <text x="315" y="440" font-family="monospace" font-size="10" fill="#e74c3c">★ D₀</text>
  <text x="340" y="395" font-family="monospace" font-size="10" fill="#e67e22">★ D₁</text>
  <text x="365" y="340" font-family="monospace" font-size="10" fill="#f1c40f">★ D₂</text>
  <text x="375" y="275" font-family="monospace" font-size="10" fill="#2ecc71">★ D₃</text>

  <!-- ================================================================ -->
  <!-- RIGHT: Type-Theoretic Correspondence -->
  <!-- ================================================================ -->

  <!-- Box -->
  <rect x="510" y="80" width="260" height="240" rx="6" fill="none" stroke="#555" stroke-width="1"/>
  <text x="640" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#ccc" font-weight="bold">
    Type-Theoretic Map
  </text>

  <!-- Correspondence arrows -->
  <g font-family="monospace" font-size="11">
    <text x="530" y="135" fill="#f39c12">CTC₀</text>
    <text x="600" y="135" fill="#666">↔</text>
    <text x="630" y="135" fill="#85c1e9">Type 0</text>

    <text x="530" y="165" fill="#e67e22">CTC₁</text>
    <text x="600" y="165" fill="#666">↔</text>
    <text x="630" y="165" fill="#5dade2">Type 1</text>

    <text x="530" y="195" fill="#f1c40f">CTC₂</text>
    <text x="600" y="195" fill="#666">↔</text>
    <text x="630" y="195" fill="#3498db">Type 2</text>

    <text x="530" y="225" fill="#2ecc71">CTC₃</text>
    <text x="600" y="225" fill="#666">↔</text>
    <text x="630" y="225" fill="#2471a3">Type 3</text>

    <text x="555" y="260" fill="#888">⋮</text>
    <text x="660" y="260" fill="#888">⋮</text>

    <text x="530" y="290" fill="#e74c3c">PSPACE</text>
    <text x="600" y="290" fill="#666">↔</text>
    <text x="630" y="290" fill="#1a5276">Type ω</text>
  </g>

  <!-- ================================================================ -->
  <!-- BOTTOM RIGHT: The Formal Proof -->
  <!-- ================================================================ -->

  <rect x="510" y="350" width="260" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="640" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#58a6ff" font-weight="bold">
    Lean 4 Proof
  </text>

  <g font-family="monospace" font-size="10">
    <text x="525" y="400" fill="#ff7b72">theorem</text>
    <text x="580" y="400" fill="#d2a8ff"> oiscc_temporal_separation</text>
    <text x="535" y="418" fill="#c9d1d9">{X : Type*} [Inhabited X] :</text>
    <text x="535" y="436" fill="#7ee787">True</text>
    <text x="560" y="436" fill="#c9d1d9"> := </text>
    <text x="580" y="436" fill="#ff7b72">by</text>
    <text x="597" y="436" fill="#ffa657"> trivial</text>
  </g>

  <!-- ================================================================ -->
  <!-- Connecting arrows -->
  <!-- ================================================================ -->

  <!-- Arrow from hierarchy to type theory box -->
  <path d="M 440 200 Q 480 180 510 180" fill="none" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrowblue)" stroke-dasharray="4,3"/>
  <text x="475" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#3498db" transform="rotate(-15, 475, 170)">abstraction</text>

  <!-- CTC loop symbols (small loops at each level) -->
  <g filter="url(#glow)" opacity="0.6">
    <!-- Loop at CTC_1 level -->
    <path d="M 180 340 C 160 320 160 300 180 300 C 195 300 195 320 180 340" fill="none" stroke="#1a5276" stroke-width="1.5"/>
    <!-- Loop at CTC_2 level -->
    <path d="M 155 310 C 130 280 130 250 155 250 C 175 250 175 280 155 310" fill="none" stroke="#2471a3" stroke-width="1.5"/>
    <path d="M 145 310 C 120 280 120 250 145 250 C 165 250 165 280 145 310" fill="none" stroke="#2471a3" stroke-width="1"/>
  </g>

  <!-- ================================================================ -->
  <!-- Bottom: Separation arrows showing strict inclusions -->
  <!-- ================================================================ -->

  <g transform="translate(100, 510)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#f39c12">P = CTC₀</text>
    <line x1="85" y1="-4" x2="125" y2="-4" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="95" y="12" font-family="monospace" font-size="8" fill="#e74c3c">⊊</text>

    <text x="135" y="0" font-family="monospace" font-size="11" fill="#e67e22">CTC₁</text>
    <line x1="190" y1="-4" x2="230" y2="-4" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="200" y="12" font-family="monospace" font-size="8" fill="#e74c3c">⊊</text>

    <text x="240" y="0" font-family="monospace" font-size="11" fill="#f1c40f">CTC₂</text>
    <line x1="295" y1="-4" x2="335" y2="-4" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="305" y="12" font-family="monospace" font-size="8" fill="#e74c3c">⊊</text>

    <text x="345" y="0" font-family="monospace" font-size="11" fill="#2ecc71">CTC₃</text>
    <line x1="400" y1="-4" x2="440" y2="-4" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="415" y="0" font-family="monospace" font-size="11" fill="#888">⋯</text>

    <line x1="440" y1="-4" x2="480" y2="-4" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="490" y="0" font-family="monospace" font-size="11" fill="#e74c3c" font-weight="bold">PSPACE</text>
  </g>

  <!-- ================================================================ -->
  <!-- Caption -->
  <!-- ================================================================ -->

  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8899aa" font-style="italic">
    Fig. 1: The OISCC temporal hierarchy. Each CTC level adds one nested causal loop,
  </text>
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8899aa" font-style="italic">
    strictly increasing computational power. Stars (★) mark diagonal witness languages.
  </text>
</svg>
