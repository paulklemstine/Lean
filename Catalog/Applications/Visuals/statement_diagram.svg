<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="tropicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#148f77;stop-opacity:0.15"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2471a3"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#148f77"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7d3c98"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="#fdfefe" stroke="#d5d8dc" stroke-width="1.5"/>
  <rect x="20" y="20" width="760" height="440" rx="8" fill="url(#tropicalGrad)"/>

  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a5276">
    Tropical Entropy Bound — Structure Diagram
  </text>

  <!-- ============ DATA DOMAIN (left) ============ -->
  <rect x="50" y="90" width="160" height="100" rx="10" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="130" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">Data Space</text>
  <text x="130" y="142" text-anchor="middle" font-size="12" fill="#2c3e50">X : Type*</text>
  <text x="130" y="160" text-anchor="middle" font-size="11" fill="#5d6d7e">[Inhabited X]</text>
  <text x="130" y="178" text-anchor="middle" font-size="11" fill="#5d6d7e">strings, matrices, ...</text>

  <!-- ============ TROPICAL MATRIX (center-top) ============ -->
  <rect x="300" y="80" width="200" height="120" rx="10" fill="#e8f8f5" stroke="#148f77" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#148f77">Max-Plus Matrix</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#1a5276">A ∈ 𝕋^{m×n}</text>
  <text x="400" y="150" text-anchor="middle" font-size="11" fill="#5d6d7e">⊕ = max, ⊗ = +</text>
  <!-- Mini matrix -->
  <text x="355" y="175" font-size="11" fill="#148f77" font-family="monospace">[ 3  1  −∞]</text>
  <text x="355" y="190" font-size="11" fill="#148f77" font-family="monospace">[ 2  4   0]</text>

  <!-- ============ TROPICAL RANK (center-bottom) ============ -->
  <rect x="310" y="250" width="180" height="90" rx="10" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2"/>
  <text x="400" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#b7950b">Tropical Rank</text>
  <text x="400" y="300" text-anchor="middle" font-size="13" fill="#7d6608">rk_T(A) ≤ rk_B(A)</text>
  <text x="400" y="320" text-anchor="middle" font-size="11" fill="#5d6d7e">factorization bound</text>

  <!-- ============ KOLMOGOROV COMPLEXITY (right) ============ -->
  <rect x="580" y="90" width="180" height="100" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="670" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Kolmogorov</text>
  <text x="670" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Complexity</text>
  <text x="670" y="160" text-anchor="middle" font-size="12" fill="#2c3e50">K(x) = min |p|</text>
  <text x="670" y="178" text-anchor="middle" font-size="11" fill="#5d6d7e">U(p) = x</text>

  <!-- ============ COMPRESSION LIMIT (right-bottom) ============ -->
  <rect x="570" y="260" width="200" height="80" rx="10" fill="#f4ecf7" stroke="#7d3c98" stroke-width="2"/>
  <text x="670" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#7d3c98">Compression Limit</text>
  <text x="670" y="310" text-anchor="middle" font-size="12" fill="#5b2c6f">log₂(rk_T(A)) ≤ K(x)+O(1)</text>
  <text x="670" y="328" text-anchor="middle" font-size="11" fill="#5d6d7e">the tropical bound</text>

  <!-- ============ ARROWS ============ -->
  <!-- Data → Tropical Matrix -->
  <line x1="210" y1="140" x2="295" y2="140" stroke="#2471a3" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="252" y="132" text-anchor="middle" font-size="10" fill="#2471a3">encode</text>

  <!-- Data → Kolmogorov -->
  <path d="M 210 120 Q 400 50 575 120" stroke="#c0392b" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="400" y="70" text-anchor="middle" font-size="10" fill="#c0392b">shortest program</text>

  <!-- Tropical Matrix → Tropical Rank -->
  <line x1="400" y1="200" x2="400" y2="245" stroke="#148f77" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="430" y="225" font-size="10" fill="#148f77">compute</text>

  <!-- Tropical Rank → Compression Limit -->
  <line x1="490" y1="295" x2="565" y2="295" stroke="#7d3c98" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="528" y="288" text-anchor="middle" font-size="10" fill="#7d3c98">bound</text>

  <!-- Kolmogorov → Compression Limit -->
  <line x1="670" y1="190" x2="670" y2="255" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="700" y="225" font-size="10" fill="#c0392b">upper limit</text>

  <!-- ============ KEY INEQUALITY (bottom center) ============ -->
  <rect x="200" y="380" width="400" height="55" rx="8" fill="#1a5276" stroke="none"/>
  <text x="400" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">
    log₂( trop_rank(A) )  ≤  K(x) + O(1)
  </text>
  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#aed6f1">
    Tropical rank bounds Kolmogorov complexity from below
  </text>

  <!-- Caption -->
  <text x="400" y="490" text-anchor="middle" font-size="12" fill="#5d6d7e" font-style="italic">
    Figure 1: The tropical entropy bound connects max-plus algebra to algorithmic information theory.
  </text>
  <text x="400" y="508" text-anchor="middle" font-size="11" fill="#85929e">
    Encoding data as a tropical matrix reveals compressibility through algebraic rank.
  </text>
</svg>
