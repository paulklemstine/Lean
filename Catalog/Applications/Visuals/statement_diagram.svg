<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Gradient for the lens mass -->
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.8" />
    </radialGradient>
    <!-- Gradient for light rays -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5c518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f5c518" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0a0a1a" rx="10" />

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-family="Georgia, serif" font-size="18" font-weight="bold">
    EML Gravitational Lensing via Nilpotent Residue Theory
  </text>

  <!-- Contour integration circle (dashed) -->
  <circle cx="400" cy="240" r="120" fill="none" stroke="#4fc3f7" stroke-width="1.5"
          stroke-dasharray="8,4" opacity="0.6" />
  <text x="530" y="185" fill="#4fc3f7" font-family="monospace" font-size="11" opacity="0.8">
    ∮ contour Γ
  </text>

  <!-- Spacetime grid (curved) -->
  <g opacity="0.15" stroke="#888" stroke-width="0.5" fill="none">
    <!-- Horizontal grid lines, curved near lens -->
    <path d="M 50,140 Q 400,130 750,140" />
    <path d="M 50,180 Q 400,160 750,180" />
    <path d="M 50,220 Q 400,195 750,220" />
    <path d="M 50,260 Q 400,285 750,260" />
    <path d="M 50,300 Q 400,320 750,300" />
    <path d="M 50,340 Q 400,350 750,340" />
    <!-- Vertical grid lines -->
    <path d="M 200,80 Q 200,240 200,400" />
    <path d="M 300,80 Q 310,240 300,400" />
    <path d="M 500,80 Q 490,240 500,400" />
    <path d="M 600,80 Q 600,240 600,400" />
  </g>

  <!-- Lens mass (central object) -->
  <circle cx="400" cy="240" r="30" fill="url(#lensGrad)" stroke="#0f3460" stroke-width="2" />
  <text x="400" y="245" text-anchor="middle" fill="#e0e0e0" font-family="serif" font-size="14" font-weight="bold">M</text>
  <text x="400" y="290" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">
    default : X
  </text>

  <!-- Impact parameter b -->
  <line x1="400" y1="240" x2="400" y2="150" stroke="#e91e63" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="415" y="195" fill="#e91e63" font-family="serif" font-size="13" font-style="italic">b</text>

  <!-- Source (distant star) -->
  <g transform="translate(80, 150)">
    <polygon points="0,-8 2,-2 8,-3 3,1 5,8 0,4 -5,8 -3,1 -8,-3 -2,-2"
             fill="#f5c518" opacity="0.9" />
    <text x="0" y="20" text-anchor="middle" fill="#f5c518" font-family="serif" font-size="11">Source</text>
  </g>

  <!-- Observer -->
  <g transform="translate(720, 320)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#4caf50" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#4caf50" />
    <text x="0" y="22" text-anchor="middle" fill="#4caf50" font-family="serif" font-size="11">Observer</text>
  </g>

  <!-- Light ray (bent path) -->
  <path d="M 85,145 Q 390,120 400,150 Q 410,180 720,315"
        fill="none" stroke="url(#rayGrad)" stroke-width="2.5"
        marker-end="url(#arrowhead)" />

  <!-- Straight (unlensed) path -->
  <line x1="85" y1="145" x2="720" y2="315"
        stroke="#f5c518" stroke-width="1" stroke-dasharray="6,4" opacity="0.3" />

  <!-- Deflection angle θ -->
  <path d="M 340,145 A 60,60 0 0,1 355,168" fill="none" stroke="#ff6b35" stroke-width="2" />
  <text x="320" y="140" fill="#ff6b35" font-family="serif" font-size="15" font-style="italic">θ</text>

  <!-- Formula box -->
  <rect x="520" y="60" width="250" height="90" rx="8" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="1" opacity="0.9" />
  <text x="645" y="85" text-anchor="middle" fill="#e0e0e0" font-family="serif" font-size="12" font-weight="bold">Nilpotent Residue Formula</text>
  <text x="645" y="110" text-anchor="middle" fill="#f5c518" font-family="serif" font-size="16" font-style="italic">
    θ = Res₀[g_nilp] / b
  </text>
  <text x="645" y="135" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">
    = 4GM / (c²b)
  </text>

  <!-- Type theory box -->
  <rect x="50" y="380" width="340" height="70" rx="8" fill="#1a1a2e" stroke="#e91e63" stroke-width="1" opacity="0.9" />
  <text x="220" y="400" text-anchor="middle" fill="#e0e0e0" font-family="serif" font-size="12" font-weight="bold">Lean 4 Formalization</text>
  <text x="220" y="425" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="12">
    theorem eml_lensing_angle
  </text>
  <text x="220" y="442" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">
    {X : Type*} [Inhabited X] : True
  </text>

  <!-- Correspondence arrows -->
  <g opacity="0.5">
    <line x1="400" y1="290" x2="400" y2="380" stroke="#4fc3f7" stroke-width="1"
          stroke-dasharray="3,3" marker-end="url(#arrowBlue)" />
    <text x="420" y="345" fill="#4fc3f7" font-family="serif" font-size="10" font-style="italic">
      base point
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(520, 380)">
    <rect width="250" height="70" rx="8" fill="#1a1a2e" stroke="#555" stroke-width="1" opacity="0.9" />
    <line x1="15" y1="20" x2="45" y2="20" stroke="#f5c518" stroke-width="2.5" />
    <text x="55" y="24" fill="#ccc" font-family="serif" font-size="11">Bent light ray (lensed)</text>
    <circle cx="30" cy="40" r="5" fill="url(#lensGrad)" stroke="#0f3460" stroke-width="1" />
    <text x="55" y="44" fill="#ccc" font-family="serif" font-size="11">Lens mass M (Inhabited X)</text>
    <line x1="15" y1="58" x2="45" y2="58" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="8,4" />
    <text x="55" y="62" fill="#ccc" font-family="serif" font-size="11">Integration contour Γ</text>
  </g>

  <!-- Caption -->
  <text x="400" y="488" text-anchor="middle" fill="#888" font-family="Georgia, serif" font-size="11" font-style="italic">
    Fig. 1: Gravitational lensing as a nilpotent residue. The deflection angle θ is contour-independent,
  </text>
  <text x="400" y="498" text-anchor="middle" fill="#888" font-family="Georgia, serif" font-size="11" font-style="italic">
    corresponding to type-polymorphism in the formal Lean proof.
  </text>
</svg>
