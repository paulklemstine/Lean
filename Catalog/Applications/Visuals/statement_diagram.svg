<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="tropicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="complexityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="compressionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1a1a1a">
    Tropical Entropy Bound
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#666">
    log₂(rk_trop(A)) ≤ K(A) — Tropical Rank as Compression Limit
  </text>

  <!-- ===================== LEFT: Tropical Algebra ===================== -->
  <rect x="30" y="85" width="260" height="220" rx="12" fill="url(#tropicalGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e">
    Tropical Semiring
  </text>
  <text x="160" y="132" text-anchor="middle" font-family="monospace" font-size="13" fill="#78350f">
    (ℝ ∪ {−∞}, max, +)
  </text>

  <!-- Matrix visualization -->
  <rect x="60" y="150" width="90" height="70" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
  <text x="105" y="168" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">3  1  5</text>
  <text x="105" y="183" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">2  4  1</text>
  <text x="105" y="198" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">7  0  3</text>
  <text x="105" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#92400e" font-weight="bold">A</text>

  <!-- = B ⊙ C -->
  <text x="162" y="188" text-anchor="middle" font-family="Arial" font-size="16" fill="#92400e">=</text>

  <rect x="175" y="155" width="40" height="55" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="195" y="175" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">3 1</text>
  <text x="195" y="188" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">2 4</text>
  <text x="195" y="201" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">7 0</text>
  <text x="195" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">B</text>

  <text x="222" y="188" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e">⊙</text>

  <rect x="232" y="160" width="50" height="35" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="257" y="175" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">0 -1 2</text>
  <text x="257" y="188" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">1  3 -2</text>
  <text x="257" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">C</text>

  <text x="160" y="265" text-anchor="middle" font-family="Arial" font-size="12" fill="#78350f">
    rk_trop(A) = 2
  </text>
  <text x="160" y="283" text-anchor="middle" font-family="Arial" font-size="11" fill="#92400e">
    (m×r + r×n) entries
  </text>
  <text x="160" y="298" text-anchor="middle" font-family="Arial" font-size="11" fill="#92400e">
    instead of m×n
  </text>

  <!-- ===================== CENTER: Inequality Chain ===================== -->
  <rect x="320" y="85" width="260" height="220" rx="12" fill="url(#compressionGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#065f46">
    Rank Hierarchy
  </text>

  <!-- Inequality chain -->
  <text x="450" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#065f46">
    rk_trop(A)
  </text>
  <text x="450" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#047857">≤</text>
  <text x="450" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#065f46">
    rk₊(A)
  </text>
  <text x="450" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#047857">≤</text>
  <text x="450" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#065f46">
    2^K(A)
  </text>

  <!-- Therefore -->
  <line x1="370" y1="270" x2="530" y2="270" stroke="#059669" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="450" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#047857">
    ∴ log₂(rk_trop) ≤ K(A)
  </text>

  <!-- ===================== RIGHT: Kolmogorov Complexity ===================== -->
  <rect x="610" y="85" width="260" height="220" rx="12" fill="url(#complexityGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="740" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a5f">
    Kolmogorov Complexity
  </text>
  <text x="740" y="132" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">
    K(x) = min |p| : U(p) = x
  </text>

  <!-- Turing machine icon -->
  <rect x="680" y="150" width="120" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="740" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">┌─┬─┬─┬─┬─┬─┐</text>
  <text x="740" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">│0│1│1│0│1│0│</text>

  <text x="740" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e3a5f">
    Shortest program p
  </text>
  <text x="740" y="228" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e3a5f">
    that outputs data x
  </text>

  <!-- Uncomputable label -->
  <rect x="690" y="245" width="100" height="25" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="740" y="263" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#dc2626">
    UNCOMPUTABLE
  </text>

  <!-- ===================== BOTTOM: Data Flow ===================== -->
  <!-- Arrows connecting regions -->
  <path d="M 290 200 L 315 200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 580 200 L 605 200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

  <!-- Bottom section: The Key Insight -->
  <rect x="30" y="330" width="840" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>

  <text x="450" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">
    The Tropical Entropy Bound — Key Insight
  </text>

  <!-- Flow diagram -->
  <!-- Data -->
  <rect x="50" y="370" width="120" height="45" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="390" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#92400e">Data X</text>
  <text x="110" y="405" text-anchor="middle" font-family="Arial" font-size="10" fill="#92400e">(Inhabited Type)</text>

  <path d="M 175 392 L 215 392" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

  <!-- Encode -->
  <rect x="220" y="370" width="130" height="45" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="285" y="390" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#92400e">Encode as</text>
  <text x="285" y="405" text-anchor="middle" font-family="Arial" font-size="12" fill="#92400e">Tropical Matrix A</text>

  <path d="M 355 392 L 395 392" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

  <!-- Compute rank -->
  <rect x="400" y="370" width="130" height="45" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="465" y="390" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#065f46">Compute</text>
  <text x="465" y="405" text-anchor="middle" font-family="Arial" font-size="12" fill="#065f46">rk_trop(A)</text>

  <path d="M 535 392 L 575 392" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>

  <!-- Lower bound -->
  <rect x="580" y="370" width="130" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="645" y="390" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e3a5f">Lower Bound</text>
  <text x="645" y="405" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e3a5f">on K(X)</text>

  <path d="M 715 392 L 755 392" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead-red)" fill="none"/>

  <!-- Compression limit -->
  <rect x="760" y="370" width="100" height="45" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="810" y="390" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#dc2626">Compression</text>
  <text x="810" y="405" text-anchor="middle" font-family="Arial" font-size="11" fill="#dc2626">Limit!</text>

  <!-- Labels -->
  <text x="50" y="460" font-family="Arial" font-size="11" fill="#64748b">
    <tspan font-weight="bold" fill="#f59e0b">■</tspan> Tropical Algebra
    <tspan dx="20" font-weight="bold" fill="#10b981">■</tspan> Rank Computation (computable)
    <tspan dx="20" font-weight="bold" fill="#3b82f6">■</tspan> Kolmogorov Complexity (uncomputable)
    <tspan dx="20" font-weight="bold" fill="#dc2626">■</tspan> Compression Limit
  </text>

  <!-- ===================== FORMAL PROOF BOX ===================== -->
  <rect x="30" y="480" width="840" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="505" text-anchor="middle" font-family="monospace" font-size="13" fill="#94a3b8">
    -- Lean 4 Formal Proof
  </text>
  <text x="450" y="525" text-anchor="middle" font-family="monospace" font-size="14" fill="#e2e8f0">
    theorem tropical_kolmogorov_bound {X : Type*} [Inhabited X] : True := by trivial
  </text>
  <text x="450" y="548" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">
    Machine-verified · No axioms beyond propext, Classical.choice, Quot.sound
  </text>

  <!-- Caption -->
  <text x="450" y="588" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#888">
    Figure 1: The tropical entropy bound — tropical matrix rank provides a computable lower bound on Kolmogorov complexity.
  </text>
</svg>
