<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="url(#bgGrad)" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1E293B">
    Backpropagation as the Cotangent Lift
  </text>
  <text x="450" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748B">
    Contravariant Functoriality: T*(g ∘ f) = T*(f) ∘ T*(g)
  </text>

  <!-- ═══ TOP ROW: Forward Pass (Manifolds) ═══ -->
  <text x="60" y="105" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2563EB">
    Forward Pass (Tangent Category)
  </text>

  <!-- Manifold M₀ -->
  <ellipse cx="150" cy="165" rx="55" ry="35" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1E40AF">M₀</text>
  <text x="150" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">ℝ³ (input)</text>

  <!-- Arrow f₁ -->
  <line x1="210" y1="165" x2="290" y2="165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="250" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2563EB">f₁</text>

  <!-- Manifold M₁ -->
  <ellipse cx="350" cy="165" rx="55" ry="35" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="350" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1E40AF">M₁</text>
  <text x="350" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">ℝ⁴ (hidden)</text>

  <!-- Arrow f₂ -->
  <line x1="410" y1="165" x2="490" y2="165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="450" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2563EB">f₂</text>

  <!-- Manifold M₂ -->
  <ellipse cx="550" cy="165" rx="55" ry="35" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="550" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1E40AF">M₂</text>
  <text x="550" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">ℝ² (hidden)</text>

  <!-- Arrow f₃ -->
  <line x1="610" y1="165" x2="690" y2="165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="650" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2563EB">f₃</text>

  <!-- Manifold M₃ -->
  <ellipse cx="750" cy="165" rx="55" ry="35" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1E40AF">M₃</text>
  <text x="750" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">ℝ¹ (output)</text>

  <!-- ═══ VERTICAL ARROWS: Cotangent Bundle Projection ═══ -->
  <text x="60" y="265" font-family="Georgia, serif" font-size="12" fill="#6B7280">π : T*M → M</text>

  <line x1="150" y1="205" x2="150" y2="310" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <line x1="350" y1="205" x2="350" y2="310" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <line x1="550" y1="205" x2="550" y2="310" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <line x1="750" y1="205" x2="750" y2="310" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>

  <!-- Labels on vertical arrows -->
  <text x="135" y="260" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#6B7280">π₀</text>
  <text x="335" y="260" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#6B7280">π₁</text>
  <text x="535" y="260" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#6B7280">π₂</text>
  <text x="735" y="260" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#6B7280">π₃</text>

  <!-- ═══ BOTTOM ROW: Cotangent Bundles (Backprop) ═══ -->
  <text x="60" y="330" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#DC2626">
    Backprop (Cotangent Lift)
  </text>

  <!-- Cotangent bundle T*M₀ -->
  <rect x="95" y="345" width="110" height="55" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="150" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#991B1B">T*M₀</text>
  <text x="150" y="388" text-anchor="middle" font-family="monospace" font-size="9" fill="#DC2626">gradients ∇ₓℓ</text>

  <!-- Arrow f₁* (REVERSED!) -->
  <line x1="290" y1="372" x2="210" y2="372" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="250" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#DC2626">f₁*</text>

  <!-- Cotangent bundle T*M₁ -->
  <rect x="295" y="345" width="110" height="55" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="350" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#991B1B">T*M₁</text>
  <text x="350" y="388" text-anchor="middle" font-family="monospace" font-size="9" fill="#DC2626">∂ℓ/∂h₁</text>

  <!-- Arrow f₂* (REVERSED!) -->
  <line x1="490" y1="372" x2="410" y2="372" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="450" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#DC2626">f₂*</text>

  <!-- Cotangent bundle T*M₂ -->
  <rect x="495" y="345" width="110" height="55" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="550" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#991B1B">T*M₂</text>
  <text x="550" y="388" text-anchor="middle" font-family="monospace" font-size="9" fill="#DC2626">∂ℓ/∂h₂</text>

  <!-- Arrow f₃* (REVERSED!) -->
  <line x1="690" y1="372" x2="610" y2="372" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="650" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#DC2626">f₃*</text>

  <!-- Cotangent bundle T*M₃ -->
  <rect x="695" y="345" width="110" height="55" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="750" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#991B1B">T*M₃</text>
  <text x="750" y="388" text-anchor="middle" font-family="monospace" font-size="9" fill="#DC2626">∂ℓ/∂y = dℓ</text>

  <!-- ═══ BOTTOM: Key equations ═══ -->
  <rect x="100" y="430" width="700" height="100" rx="10" fill="white" stroke="#94A3B8" stroke-width="1" opacity="0.9"/>

  <text x="450" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1E293B">
    The Fundamental Identity (Chain Rule = Contravariant Functoriality)
  </text>

  <text x="450" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2563EB">
    Forward:  f = f₃ ∘ f₂ ∘ f₁   (left to right)
  </text>

  <text x="450" y="505" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#DC2626">
    Backprop: f* = f₁* ∘ f₂* ∘ f₃*  (right to left — reversed!)
  </text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="130" y="548" width="15" height="15" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="152" y="560" font-family="Georgia, serif" font-size="11" fill="#1E293B">Manifolds Mᵢ (forward direction →)</text>

  <rect x="430" y="548" width="15" height="15" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="452" y="560" font-family="Georgia, serif" font-size="11" fill="#1E293B">Cotangent bundles T*Mᵢ (backward ←)</text>

  <!-- Caption -->
  <text x="450" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#64748B">
    Figure: The cotangent functor T* : Man^op → VectBun reverses arrows, producing backpropagation from the forward pass.
  </text>
</svg>
