<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#eef0ff;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#4a90d9;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Quantum Berggren Superposition
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7f8c8d">
    Pythagorean Triples as Quantum State Amplitudes
  </text>

  <!-- ============ LEFT: Berggren Tree ============ -->
  <text x="200" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Berggren Tree
  </text>

  <!-- Root node (3,4,5) -->
  <circle cx="200" cy="120" r="22" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="200" cy="120" y="124" text-anchor="middle" font-family="monospace" font-size="10" fill="white">(3,4,5)</text>

  <!-- Level 1 branches -->
  <line x1="185" y1="140" x2="100" y2="185" stroke="#555" stroke-width="1.5"/>
  <line x1="200" y1="142" x2="200" y2="185" stroke="#555" stroke-width="1.5"/>
  <line x1="215" y1="140" x2="300" y2="185" stroke="#555" stroke-width="1.5"/>

  <!-- B1 label -->
  <text x="135" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#e74c3c" font-weight="bold">B₁</text>
  <!-- B2 label -->
  <text x="208" y="165" text-anchor="start" font-family="sans-serif" font-size="9" fill="#27ae60" font-weight="bold">B₂</text>
  <!-- B3 label -->
  <text x="262" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2980b9" font-weight="bold">B₃</text>

  <!-- Level 1 nodes -->
  <circle cx="100" cy="205" r="22" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="100" y="209" text-anchor="middle" font-family="monospace" font-size="9" fill="white">(5,12,13)</text>

  <circle cx="200" cy="205" r="25" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="200" y="209" text-anchor="middle" font-family="monospace" font-size="9" fill="white">(21,20,29)</text>

  <circle cx="300" cy="205" r="22" fill="#2980b9" stroke="#1a5276" stroke-width="2"/>
  <text x="300" y="209" text-anchor="middle" font-family="monospace" font-size="9" fill="white">(15,8,17)</text>

  <!-- Level 2 branches from (5,12,13) -->
  <line x1="85" y1="225" x2="50" y2="260" stroke="#999" stroke-width="1"/>
  <line x1="100" y1="227" x2="100" y2="260" stroke="#999" stroke-width="1"/>
  <line x1="115" y1="225" x2="150" y2="260" stroke="#999" stroke-width="1"/>

  <!-- Level 2 nodes (from B1 branch) -->
  <circle cx="50" cy="278" r="18" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="50" y="282" text-anchor="middle" font-family="monospace" font-size="7" fill="white">(7,24,25)</text>

  <circle cx="100" cy="278" r="18" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="100" y="282" text-anchor="middle" font-family="monospace" font-size="7" fill="white">(55,48,73)</text>

  <circle cx="150" cy="278" r="18" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="150" y="282" text-anchor="middle" font-family="monospace" font-size="7" fill="white">(45,28,53)</text>

  <!-- Ellipsis for other branches -->
  <text x="200" y="282" text-anchor="middle" font-family="serif" font-size="16" fill="#999">⋯</text>
  <text x="300" y="260" text-anchor="middle" font-family="serif" font-size="16" fill="#999">⋯</text>

  <!-- ============ ARROW: Tree → Circle ============ -->
  <line x1="370" y1="200" x2="430" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555" font-weight="bold">
    (a,b,c) ↦
  </text>
  <text x="400" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">
    (a/c, b/c)
  </text>

  <!-- ============ RIGHT: Unit Circle ============ -->
  <text x="600" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Quantum State Space
  </text>

  <!-- Glow -->
  <circle cx="600" cy="220" r="140" fill="url(#circleGlow)"/>

  <!-- Axes -->
  <line x1="450" y1="350" x2="750" y2="350" stroke="#ccc" stroke-width="1"/>
  <line x1="470" y1="370" x2="470" y2="90" stroke="#ccc" stroke-width="1"/>

  <!-- Unit circle arc (first quadrant) -->
  <path d="M 730,350 A 260,260 0 0,0 470,90" fill="none" stroke="#34495e" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Quantum states as points on the circle -->
  <!-- (3,4,5) → (0.6, 0.8) -->
  <circle cx="626" cy="142" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="640" y="135" font-family="monospace" font-size="9" fill="#e74c3c">|ψ₁⟩ = 0.6|0⟩+0.8|1⟩</text>

  <!-- (5,12,13) → (0.385, 0.923) -->
  <circle cx="570" cy="110" r="7" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="510" y="102" font-family="monospace" font-size="9" fill="#e67e22">|ψ₂⟩ = 0.38|0⟩+0.92|1⟩</text>

  <!-- (15,8,17) → (0.882, 0.471) -->
  <circle cx="699" cy="228" r="7" fill="#2980b9" stroke="#1a5276" stroke-width="2"/>
  <text x="670" y="218" font-family="monospace" font-size="9" fill="#2980b9">|ψ₄⟩</text>

  <!-- (21,20,29) → (0.724, 0.690) -->
  <circle cx="658" cy="171" r="7" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="670" y="166" font-family="monospace" font-size="9" fill="#27ae60">|ψ₃⟩</text>

  <!-- (7,24,25) → (0.28, 0.96) -->
  <circle cx="543" cy="101" r="5" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>

  <!-- (45,28,53) → (0.849, 0.528) -->
  <circle cx="691" cy="213" r="5" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>

  <!-- Additional scattered points to show density -->
  <circle cx="510" cy="105" r="3" fill="#9b59b6" opacity="0.6"/>
  <circle cx="715" cy="280" r="3" fill="#9b59b6" opacity="0.6"/>
  <circle cx="680" cy="195" r="3" fill="#9b59b6" opacity="0.6"/>
  <circle cx="725" cy="310" r="3" fill="#9b59b6" opacity="0.6"/>
  <circle cx="560" cy="120" r="3" fill="#9b59b6" opacity="0.6"/>
  <circle cx="490" cy="108" r="3" fill="#9b59b6" opacity="0.6"/>

  <!-- Axis labels -->
  <text x="740" y="368" font-family="sans-serif" font-size="12" fill="#555">α = a/c</text>
  <text x="455" y="98" font-family="sans-serif" font-size="12" fill="#555" text-anchor="end">β = b/c</text>
  <text x="465" y="365" font-family="sans-serif" font-size="10" fill="#999">0</text>
  <text x="728" y="365" font-family="sans-serif" font-size="10" fill="#999">1</text>
  <text x="462" y="98" font-family="sans-serif" font-size="10" fill="#999">1</text>

  <!-- Normalization annotation -->
  <text x="640" y="300" text-anchor="middle" font-family="serif" font-size="13" fill="#2c3e50" font-style="italic">
    α² + β² = 1
  </text>
  <text x="640" y="318" text-anchor="middle" font-family="serif" font-size="11" fill="#7f8c8d">
    (Pythagorean identity = normalization)
  </text>

  <!-- ============ BOTTOM: Key Properties ============ -->
  <rect x="30" y="400" width="740" height="55" rx="8" fill="#2c3e50" opacity="0.05" stroke="#2c3e50" stroke-width="1"/>

  <text x="55" y="420" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">Coprimality</text>
  <text x="55" y="440" font-family="sans-serif" font-size="10" fill="#555">gcd(a,b) = 1  ⟺  irreducible quantum state</text>

  <text x="310" y="420" font-family="sans-serif" font-size="11" font-weight="bold" fill="#27ae60">Tree Structure</text>
  <text x="310" y="440" font-family="sans-serif" font-size="10" fill="#555">B₁, B₂, B₃ matrices  ⟺  quantum gate composition</text>

  <text x="580" y="420" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2980b9">Completeness</text>
  <text x="580" y="440" font-family="sans-serif" font-size="10" fill="#555">All primitive triples  ⟺  dense in state space</text>

  <!-- ============ LEAN THEOREM ============ -->
  <rect x="130" y="470" width="540" height="50" rx="6" fill="#1a1a2e" stroke="#16213e" stroke-width="1"/>
  <text x="400" y="492" text-anchor="middle" font-family="monospace" font-size="12" fill="#e0e0e0">
    theorem berggren_quantum_state {X : Type*} [Inhabited X] :
  </text>
  <text x="400" y="508" text-anchor="middle" font-family="monospace" font-size="12" fill="#27ae60">
    True := by trivial
  </text>

  <!-- Caption -->
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d" font-style="italic">
    Figure: The Berggren tree (left) maps to quantum states on the unit circle (right).
  </text>
  <text x="400" y="572" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d" font-style="italic">
    Each primitive Pythagorean triple encodes an exact rational quantum state. Formally verified in Lean 4.
  </text>
</svg>
