<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="700" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">The Stereographic Pythagorean Bridge: Cross-Domain Connections</text>
  <text x="450" y="55" text-anchor="middle" fill="#aaa" font-size="12">28,797 formally verified declarations spanning 13 mathematical domains</text>

  <!-- Central glow -->
  <circle cx="450" cy="350" r="120" fill="url(#centerGlow)"/>

  <!-- Central node: SPB -->
  <g filter="url(#glow2)">
    <circle cx="450" cy="350" r="55" fill="#ff6b6b" opacity="0.9"/>
    <text x="450" y="340" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">SPB</text>
    <text x="450" y="358" text-anchor="middle" fill="#fff" font-size="10">(x+y)/(1+xy)</text>
    <text x="450" y="374" text-anchor="middle" fill="#ffd" font-size="9">28,797 theorems</text>
  </g>

  <!-- Domain nodes positioned around the center -->
  <!-- Pythagorean (top) -->
  <line x1="450" y1="295" x2="450" y2="140" stroke="#4ecdc4" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="450" cy="120" r="42" fill="#1a5c4a" stroke="#4ecdc4" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" fill="#4ecdc4" font-size="11" font-weight="bold">Pythagorean</text>
  <text x="450" y="130" text-anchor="middle" fill="#8ee" font-size="9">5,092 theorems</text>

  <!-- Tropical (top-right) -->
  <line x1="488" y1="305" x2="660" y2="140" stroke="#ffd93d" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="680" cy="125" r="42" fill="#5c4a1a" stroke="#ffd93d" stroke-width="2"/>
  <text x="680" y="120" text-anchor="middle" fill="#ffd93d" font-size="11" font-weight="bold">Tropical</text>
  <text x="680" y="135" text-anchor="middle" fill="#ffe" font-size="9">1,060 theorems</text>

  <!-- Machine Learning (right) -->
  <line x1="505" y1="350" x2="720" y2="280" stroke="#6c5ce7" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="750" cy="270" r="42" fill="#2d1a5c" stroke="#6c5ce7" stroke-width="2"/>
  <text x="750" y="263" text-anchor="middle" fill="#c5b8ff" font-size="10" font-weight="bold">Machine</text>
  <text x="750" y="276" text-anchor="middle" fill="#c5b8ff" font-size="10" font-weight="bold">Learning</text>
  <text x="750" y="291" text-anchor="middle" fill="#a99dff" font-size="9">805 theorems</text>

  <!-- Cryptography (right-bottom) -->
  <line x1="500" y1="380" x2="730" y2="430" stroke="#e17055" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="755" cy="440" r="42" fill="#5c2a1a" stroke="#e17055" stroke-width="2"/>
  <text x="755" y="433" text-anchor="middle" fill="#ffb39e" font-size="10" font-weight="bold">Crypto-</text>
  <text x="755" y="446" text-anchor="middle" fill="#ffb39e" font-size="10" font-weight="bold">graphy</text>
  <text x="755" y="461" text-anchor="middle" fill="#ffa088" font-size="9">452 theorems</text>

  <!-- Physics (bottom-right) -->
  <line x1="475" y1="400" x2="630" y2="560" stroke="#00cec9" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="650" cy="575" r="42" fill="#1a4c4a" stroke="#00cec9" stroke-width="2"/>
  <text x="650" y="570" text-anchor="middle" fill="#00cec9" font-size="11" font-weight="bold">Physics</text>
  <text x="650" y="585" text-anchor="middle" fill="#7ee" font-size="9">2,088 theorems</text>

  <!-- Computation (bottom) -->
  <line x1="450" y1="405" x2="450" y2="560" stroke="#fd79a8" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="450" cy="580" r="42" fill="#4a1a3c" stroke="#fd79a8" stroke-width="2"/>
  <text x="450" y="573" text-anchor="middle" fill="#fd79a8" font-size="10" font-weight="bold">Computation</text>
  <text x="450" y="588" text-anchor="middle" fill="#faa" font-size="9">2,371 theorems</text>

  <!-- Geometry (bottom-left) -->
  <line x1="415" y1="395" x2="250" y2="560" stroke="#55efc4" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="235" cy="575" r="42" fill="#1a4a2a" stroke="#55efc4" stroke-width="2"/>
  <text x="235" y="570" text-anchor="middle" fill="#55efc4" font-size="11" font-weight="bold">Geometry</text>
  <text x="235" y="585" text-anchor="middle" fill="#8fc" font-size="9">805 theorems</text>

  <!-- Algebra (left) -->
  <line x1="395" y1="350" x2="180" y2="280" stroke="#a29bfe" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="155" cy="270" r="42" fill="#2a1a4a" stroke="#a29bfe" stroke-width="2"/>
  <text x="155" y="265" text-anchor="middle" fill="#a29bfe" font-size="11" font-weight="bold">Algebra</text>
  <text x="155" y="280" text-anchor="middle" fill="#c9c3ff" font-size="9">1,143 theorems</text>

  <!-- EML (top-left) -->
  <line x1="405" y1="310" x2="230" y2="140" stroke="#fab1a0" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="215" cy="125" r="42" fill="#4a2a1a" stroke="#fab1a0" stroke-width="2"/>
  <text x="215" y="118" text-anchor="middle" fill="#fab1a0" font-size="11" font-weight="bold">EML</text>
  <text x="215" y="133" text-anchor="middle" fill="#fcc" font-size="9">3,253 theorems</text>

  <!-- Logic (left-bottom) -->
  <line x1="400" y1="380" x2="145" y2="435" stroke="#81ecec" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="125" cy="440" r="42" fill="#1a3a4a" stroke="#81ecec" stroke-width="2"/>
  <text x="125" y="435" text-anchor="middle" fill="#81ecec" font-size="11" font-weight="bold">Logic</text>
  <text x="125" y="450" text-anchor="middle" fill="#aee" font-size="9">968 theorems</text>

  <!-- Cross-links (bridges) -->
  <g stroke-width="1" stroke-dasharray="3,5" opacity="0.3">
    <line x1="450" y1="162" x2="680" y2="167" stroke="#fff" />
    <line x1="680" y1="167" x2="750" y2="228" stroke="#fff" />
    <line x1="215" y1="167" x2="450" y2="162" stroke="#fff" />
    <line x1="155" y1="312" x2="125" y2="398" stroke="#fff" />
    <line x1="235" y1="533" x2="450" y2="538" stroke="#fff" />
    <line x1="650" y1="533" x2="755" y2="398" stroke="#fff" />
  </g>

  <!-- Formula display -->
  <g transform="translate(450, 660)">
    <text x="0" y="0" text-anchor="middle" fill="#888" font-size="11">
      tan(α+β) = spb(tan α, tan β)  ·  v₁⊕v₂ = spb(v₁, v₂)  ·  lim(ε→0) ε·log(e^{a/ε}+e^{b/ε}) = max(a,b)
    </text>
  </g>
</svg>
