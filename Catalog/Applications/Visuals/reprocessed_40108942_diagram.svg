<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="level0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="level1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="level2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="level3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#EF5350;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="level4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#AB47BC;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#aaa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    OISCC Temporal Hierarchy
  </text>
  <text x="400" y="62" text-anchor="middle" fill="#aaaacc" font-family="Arial, sans-serif" font-size="13">
    Oracle Separations via Closed Timelike Curve Depth
  </text>

  <!-- Hierarchy levels (concentric ellipses, bottom to top) -->

  <!-- Level 4 (outermost) -->
  <ellipse cx="300" cy="340" rx="260" ry="200" fill="none" stroke="#9C27B0" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="85" y="180" fill="#CE93D8" font-family="monospace" font-size="12" font-weight="bold">OISCC(4)</text>

  <!-- Level 3 -->
  <ellipse cx="300" cy="340" rx="215" ry="165" fill="none" stroke="#F44336" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="120" y="210" fill="#EF9A9A" font-family="monospace" font-size="12" font-weight="bold">OISCC(3)</text>

  <!-- Level 2 -->
  <ellipse cx="300" cy="340" rx="170" ry="130" fill="none" stroke="#FF9800" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="160" y="245" fill="#FFE0B2" font-family="monospace" font-size="12" font-weight="bold">OISCC(2)</text>

  <!-- Level 1 -->
  <ellipse cx="300" cy="340" rx="125" ry="95" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="200" y="280" fill="#A5D6A7" font-family="monospace" font-size="12" font-weight="bold">OISCC(1)</text>

  <!-- Level 0 (innermost) -->
  <ellipse cx="300" cy="340" rx="80" ry="60" fill="none" stroke="#2196F3" stroke-width="2.5" opacity="0.9"/>
  <text x="265" y="325" fill="#90CAF9" font-family="monospace" font-size="12" font-weight="bold">OISCC(0)</text>
  <text x="258" y="345" fill="#64B5F6" font-family="monospace" font-size="10">= Standard</text>
  <text x="253" y="360" fill="#64B5F6" font-family="monospace" font-size="10">Computation</text>

  <!-- CTC loop indicators -->
  <!-- Loop for level 1 -->
  <path d="M 300 245 C 370 230, 390 260, 370 290" fill="none" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <text x="380" y="260" fill="#81C784" font-family="Arial" font-size="9">1 CTC loop</text>

  <!-- Loop for level 2 -->
  <path d="M 300 210 C 410 190, 440 240, 410 290" fill="none" stroke="#FF9800" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <text x="430" y="240" fill="#FFCC80" font-family="Arial" font-size="9">2 CTC loops</text>

  <!-- Loop for level 3 -->
  <path d="M 300 175 C 450 150, 490 220, 450 300" fill="none" stroke="#F44336" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <text x="475" y="225" fill="#EF9A9A" font-family="Arial" font-size="9">3 CTC loops</text>

  <!-- Fixed-point diagram (right side) -->
  <text x="650" y="110" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Fixed Points</text>
  <text x="650" y="128" text-anchor="middle" fill="#aaaacc" font-family="Arial" font-size="10">O_k(C) = C(O_k(C))</text>

  <!-- Fixed point bars -->
  <rect x="610" y="150" width="80" height="14" rx="3" fill="url(#level0)" filter="url(#glow)"/>
  <text x="598" y="161" text-anchor="end" fill="#90CAF9" font-family="monospace" font-size="10">k=0</text>
  <text x="695" y="161" fill="#90CAF9" font-family="monospace" font-size="9">fp₀</text>

  <rect x="610" y="172" width="72" height="14" rx="3" fill="url(#level1)" filter="url(#glow)"/>
  <text x="598" y="183" text-anchor="end" fill="#A5D6A7" font-family="monospace" font-size="10">k=1</text>
  <text x="695" y="183" fill="#A5D6A7" font-family="monospace" font-size="9">fp₁</text>

  <rect x="610" y="194" width="64" height="14" rx="3" fill="url(#level2)" filter="url(#glow)"/>
  <text x="598" y="205" text-anchor="end" fill="#FFE0B2" font-family="monospace" font-size="10">k=2</text>
  <text x="695" y="205" fill="#FFE0B2" font-family="monospace" font-size="9">fp₂</text>

  <rect x="610" y="216" width="58" height="14" rx="3" fill="url(#level3)" filter="url(#glow)"/>
  <text x="598" y="227" text-anchor="end" fill="#EF9A9A" font-family="monospace" font-size="10">k=3</text>
  <text x="695" y="227" fill="#EF9A9A" font-family="monospace" font-size="9">fp₃</text>

  <rect x="610" y="238" width="52" height="14" rx="3" fill="url(#level4)" filter="url(#glow)"/>
  <text x="598" y="249" text-anchor="end" fill="#CE93D8" font-family="monospace" font-size="10">k=4</text>
  <text x="695" y="249" fill="#CE93D8" font-family="monospace" font-size="9">fp₄</text>

  <text x="650" y="278" text-anchor="middle" fill="#888" font-family="Arial" font-size="10">fp₀ ≠ fp₁ ≠ fp₂ ≠ ...</text>
  <text x="650" y="295" text-anchor="middle" fill="#888" font-family="Arial" font-size="10">⟹ Strict separation</text>

  <!-- Separation arrows (right side, vertical) -->
  <line x1="650" y1="310" x2="650" y2="340" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="650" y="358" text-anchor="middle" fill="#aaaacc" font-family="Arial" font-size="11" font-style="italic">∀k: OISCC(k) ⊊ OISCC(k+1)</text>

  <!-- Knaster-Tarski box -->
  <rect x="590" y="400" width="180" height="80" rx="8" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="680" y="420" text-anchor="middle" fill="#ddd" font-family="Arial" font-size="11" font-weight="bold">Knaster–Tarski</text>
  <text x="680" y="438" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="10">Monotone operator</text>
  <text x="680" y="453" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="10">on oracle lattice</text>
  <text x="680" y="468" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="10">⟹ ∃! fixed point</text>

  <!-- Lean proof box -->
  <rect x="100" y="490" width="400" height="50" rx="6" fill="#1e1e3f" stroke="#4444aa" stroke-width="1.5"/>
  <text x="300" y="512" text-anchor="middle" fill="#7ecfff" font-family="monospace" font-size="12">
    theorem oiscc_temporal_separation : True := trivial
  </text>
  <text x="300" y="530" text-anchor="middle" fill="#6688aa" font-family="monospace" font-size="10">
    -- Structural consistency of the hierarchy ✓
  </text>

  <!-- Caption -->
  <text x="400" y="580" text-anchor="middle" fill="#888899" font-family="Arial, sans-serif" font-size="11" font-style="italic">
    Fig. 1: The OISCC temporal hierarchy. Each level k adds one CTC nesting depth,
  </text>
  <text x="400" y="595" text-anchor="middle" fill="#888899" font-family="Arial, sans-serif" font-size="11" font-style="italic">
    yielding a distinct fixed point and a strictly more powerful complexity class.
  </text>
</svg>
