<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ecf1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Geometric Universal Continuation Algorithm
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d" font-style="italic">
    Universal property: all inhabited types map to the terminal proposition
  </text>

  <!-- === LEFT PANEL: Factorization Hyperbola === -->
  <rect x="20" y="70" width="360" height="300" fill="white" rx="8" filter="url(#shadow)" stroke="#bdc3c7" stroke-width="1"/>
  <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Factorization Geometry: xy = 91
  </text>

  <!-- Axes -->
  <line x1="60" y1="340" x2="360" y2="340" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="60" y1="340" x2="60" y2="100" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="370" y="345" font-family="Arial" font-size="12" fill="#2c3e50">x</text>
  <text x="55" y="95" font-family="Arial" font-size="12" fill="#2c3e50">y</text>

  <!-- Hyperbola curve xy = 91, scaled: x_screen = 60 + x*3, y_screen = 340 - y*2.5 -->
  <path d="M 63,102 C 66,115 72,145 81,180 C 90,210 105,248 120,270 C 140,295 170,315 210,325 C 250,332 300,337 355,339"
        fill="none" stroke="#3498db" stroke-width="2.5" opacity="0.7"/>

  <!-- Factor pairs as points -->
  <!-- (1, 91) → (63, 112.5) -->
  <circle cx="63" cy="113" r="6" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="73" y="110" font-family="Arial" font-size="10" fill="#c0392b">(1, 91)</text>

  <!-- (7, 13) → (81, 307.5) -->
  <circle cx="81" cy="308" r="6" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="91" y="305" font-family="Arial" font-size="10" fill="#c0392b">(7, 13)</text>

  <!-- (13, 7) → (99, 322.5) -->
  <circle cx="99" cy="323" r="6" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="109" y="318" font-family="Arial" font-size="10" fill="#c0392b">(13, 7)</text>

  <!-- (91, 1) → (333, 337.5) -->
  <circle cx="333" cy="338" r="6" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="300" y="330" font-family="Arial" font-size="10" fill="#c0392b">(91, 1)</text>

  <!-- Hyperbola label -->
  <text x="280" y="290" font-family="Arial" font-size="11" fill="#2980b9" font-style="italic">xy = 91</text>

  <!-- Legend -->
  <circle cx="80" cy="360" r="5" fill="#e74c3c"/>
  <text x="90" y="364" font-family="Arial" font-size="10" fill="#555">Lattice points = factor pairs</text>

  <!-- === RIGHT PANEL: Category Diagram === -->
  <rect x="420" y="70" width="360" height="300" fill="white" rx="8" filter="url(#shadow)" stroke="#bdc3c7" stroke-width="1"/>
  <text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Universal Property in Prop
  </text>

  <!-- Terminal Object: True -->
  <circle cx="600" cy="150" r="35" fill="#f1c40f" stroke="#f39c12" stroke-width="2.5"/>
  <text x="600" y="148" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">True</text>
  <text x="600" y="163" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f6c00">terminal object</text>

  <!-- Source: ℕ -->
  <circle cx="480" cy="260" r="28" fill="#aed6f1" stroke="#2980b9" stroke-width="2"/>
  <text x="480" y="263" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1a5276">ℕ</text>

  <!-- Source: X -->
  <circle cx="600" cy="310" r="28" fill="#f5b7b1" stroke="#c0392b" stroke-width="2"/>
  <text x="600" y="313" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#7b241c">X</text>

  <!-- Source: Bool -->
  <circle cx="720" cy="260" r="28" fill="#abebc6" stroke="#27ae60" stroke-width="2"/>
  <text x="720" y="263" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e8449">Bool</text>

  <!-- Arrows to True -->
  <!-- ℕ → True -->
  <line x1="498" y1="238" x2="578" y2="176" stroke="#2980b9" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="525" y="195" font-family="Arial" font-size="9" fill="#2980b9" transform="rotate(-30, 525, 195)">trivial</text>

  <!-- X → True -->
  <line x1="600" y1="282" x2="600" y2="188" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="613" y="240" font-family="Arial" font-size="9" fill="#c0392b">trivial</text>

  <!-- Bool → True -->
  <line x1="702" y1="238" x2="622" y2="176" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="670" y="195" font-family="Arial" font-size="9" fill="#27ae60" transform="rotate(30, 670, 195)">trivial</text>

  <!-- Unique morphism annotation -->
  <text x="600" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d" font-style="italic">
    ∀ Inhabited X, ∃! morphism: X → True
  </text>

  <!-- === BOTTOM PANEL: Connection === -->
  <rect x="20" y="390" width="760" height="170" fill="white" rx="8" filter="url(#shadow)" stroke="#bdc3c7" stroke-width="1"/>

  <!-- Flow diagram -->
  <text x="400" y="415" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">
    The Geometric Universal Continuation Pipeline
  </text>

  <!-- Step boxes -->
  <!-- Inhabited Type -->
  <rect x="40" y="435" width="140" height="55" rx="8" fill="#ebdef0" stroke="#8e44ad" stroke-width="2"/>
  <text x="110" y="458" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#6c3483">Inhabited X</text>
  <text x="110" y="475" text-anchor="middle" font-family="Arial" font-size="9" fill="#7d3c98">default : X</text>

  <!-- Geometric Structure -->
  <rect x="220" y="435" width="140" height="55" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="2"/>
  <text x="290" y="455" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e8449">Geometric</text>
  <text x="290" y="470" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e8449">Structure</text>
  <text x="290" y="483" text-anchor="middle" font-family="Arial" font-size="9" fill="#27ae60">hyperbola, lattice</text>

  <!-- Universal Continuation -->
  <rect x="400" y="435" width="150" height="55" rx="8" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="475" y="455" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a5276">Universal</text>
  <text x="475" y="470" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a5276">Continuation</text>
  <text x="475" y="483" text-anchor="middle" font-family="Arial" font-size="9" fill="#2980b9">Yoneda functor</text>

  <!-- Terminal Prop -->
  <rect x="590" y="435" width="140" height="55" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="660" y="458" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ca6f1e">True : Prop</text>
  <text x="660" y="475" text-anchor="middle" font-family="Arial" font-size="9" fill="#e67e22">terminal object</text>

  <!-- Arrows between steps -->
  <line x1="180" y1="462" x2="218" y2="462" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="462" x2="398" y2="462" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="462" x2="588" y2="462" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Lean proof annotation -->
  <rect x="300" y="505" width="200" height="30" rx="5" fill="#2c3e50"/>
  <text x="400" y="525" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#ecf0f1">
    Lean proof: trivial
  </text>

  <!-- Caption -->
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d" font-style="italic">
    Figure: The geometric universal continuation maps inhabited types through geometric structure
  </text>
  <text x="400" y="572" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d" font-style="italic">
    to the terminal proposition True, verified in Lean 4 with Mathlib v4.28.0.
  </text>
</svg>
