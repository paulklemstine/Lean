<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Gradient for tropical theme -->
    <linearGradient id="tropicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#148f77;stop-opacity:0.15"/>
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2471a3"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#148f77"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7d3c98"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#fdfefe" rx="10"/>
  <rect x="10" y="10" width="880" height="530" fill="url(#tropicalGrad)" rx="8" stroke="#d5dbdb" stroke-width="1"/>
  
  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1a5276" font-weight="bold">
    Tropical Entropy Bound
  </text>
  <text x="450" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5d6d7e">
    trank(A) ≤ mprank(A) ≤ K(x) + O(1)
  </text>
  
  <!-- ============ LEFT: String / Data ============ -->
  <rect x="40" y="110" width="170" height="100" rx="12" fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="125" y="140" text-anchor="middle" font-family="monospace" font-size="13" fill="#2471a3" font-weight="bold">String x</text>
  <text x="125" y="162" text-anchor="middle" font-family="monospace" font-size="11" fill="#5d6d7e">"ababababab..."</text>
  <text x="125" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">K(x) = descriptive</text>
  <text x="125" y="195" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">complexity</text>
  
  <!-- ============ CENTER: Tropical Matrix ============ -->
  <rect x="310" y="95" width="280" height="135" rx="12" fill="#e8f8f5" stroke="#148f77" stroke-width="2"/>
  <text x="450" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#148f77" font-weight="bold">
    Tropical Matrix A(x)
  </text>
  
  <!-- Matrix visualization -->
  <g transform="translate(360, 130)">
    <!-- Matrix brackets -->
    <text x="-5" y="15" font-family="serif" font-size="48" fill="#148f77">[</text>
    <text x="155" y="15" font-family="serif" font-size="48" fill="#148f77">]</text>
    
    <!-- Matrix entries -->
    <text x="25" y="10" font-family="monospace" font-size="12" fill="#1a5276">3</text>
    <text x="65" y="10" font-family="monospace" font-size="12" fill="#1a5276">−∞</text>
    <text x="120" y="10" font-family="monospace" font-size="12" fill="#1a5276">2</text>
    
    <text x="25" y="35" font-family="monospace" font-size="12" fill="#1a5276">1</text>
    <text x="65" y="35" font-family="monospace" font-size="12" fill="#1a5276">5</text>
    <text x="120" y="35" font-family="monospace" font-size="12" fill="#1a5276">−∞</text>
    
    <text x="25" y="60" font-family="monospace" font-size="12" fill="#1a5276">−∞</text>
    <text x="65" y="60" font-family="monospace" font-size="12" fill="#1a5276">4</text>
    <text x="120" y="60" font-family="monospace" font-size="12" fill="#1a5276">6</text>
  </g>
  
  <text x="450" y="218" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">Semiring 𝕋 = (ℝ∪{−∞}, max, +)</text>
  
  <!-- ============ RIGHT: Compression ============ -->
  <rect x="690" y="110" width="170" height="100" rx="12" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="775" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c0392b" font-weight="bold">Compression</text>
  <text x="775" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c0392b" font-weight="bold">Limit</text>
  <text x="775" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">No program shorter</text>
  <text x="775" y="195" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">than K(x) bits</text>
  
  <!-- ============ Arrows: top row ============ -->
  <!-- String → Matrix -->
  <line x1="210" y1="160" x2="305" y2="160" stroke="#2471a3" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="257" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2471a3">encode</text>
  
  <!-- Matrix → Compression -->
  <line x1="590" y1="160" x2="685" y2="160" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="637" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c0392b">bound</text>
  
  <!-- ============ BOTTOM: Three rank boxes ============ -->
  
  <!-- Tropical Rank -->
  <rect x="80" y="310" width="200" height="90" rx="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="180" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e67e22" font-weight="bold">Tropical Rank</text>
  <text x="180" y="365" text-anchor="middle" font-family="serif" font-size="16" fill="#e67e22">trank(A)</text>
  <text x="180" y="388" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">Unique optimal matching</text>
  
  <!-- Max-Plus Rank -->
  <rect x="350" y="310" width="200" height="90" rx="10" fill="#f4ecf7" stroke="#7d3c98" stroke-width="2"/>
  <text x="450" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7d3c98" font-weight="bold">Max-Plus Rank</text>
  <text x="450" y="365" text-anchor="middle" font-family="serif" font-size="16" fill="#7d3c98">mprank(A)</text>
  <text x="450" y="388" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">Min factorization dim</text>
  
  <!-- Kolmogorov Complexity -->
  <rect x="620" y="310" width="200" height="90" rx="10" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="720" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c0392b" font-weight="bold">Kolmogorov</text>
  <text x="720" y="365" text-anchor="middle" font-family="serif" font-size="16" fill="#c0392b">K(x) + O(1)</text>
  <text x="720" y="388" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">Shortest program</text>
  
  <!-- ============ Inequality arrows ============ -->
  <!-- trank ≤ mprank -->
  <line x1="280" y1="355" x2="345" y2="355" stroke="#7d3c98" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="312" y="348" text-anchor="middle" font-family="serif" font-size="18" fill="#7d3c98" font-weight="bold">≤</text>
  
  <!-- mprank ≤ K(x) -->
  <line x1="550" y1="355" x2="615" y2="355" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="582" y="348" text-anchor="middle" font-family="serif" font-size="18" fill="#c0392b" font-weight="bold">≤</text>
  
  <!-- ============ Connecting arrows from matrix to ranks ============ -->
  <path d="M 380 230 Q 280 280 200 305" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <path d="M 450 230 L 450 305" fill="none" stroke="#7d3c98" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <path d="M 520 230 Q 620 280 700 305" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  
  <!-- ============ Bottom labels ============ -->
  <text x="450" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1a5276">
    Develin–Santos–Sturmfels (2005)
  </text>
  <text x="450" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5d6d7e">
    The tropical rank inequality provides an algebraic-geometric route to compression bounds
  </text>
  
  <!-- ============ Legend ============ -->
  <g transform="translate(50, 480)">
    <rect width="12" height="12" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5" rx="2"/>
    <text x="18" y="11" font-family="sans-serif" font-size="10" fill="#5d6d7e">Data / Strings</text>
    
    <rect x="130" width="12" height="12" fill="#e8f8f5" stroke="#148f77" stroke-width="1.5" rx="2"/>
    <text x="148" y="11" font-family="sans-serif" font-size="10" fill="#5d6d7e">Tropical Algebra</text>
    
    <rect x="280" width="12" height="12" fill="#f4ecf7" stroke="#7d3c98" stroke-width="1.5" rx="2"/>
    <text x="298" y="11" font-family="sans-serif" font-size="10" fill="#5d6d7e">Rank Invariants</text>
    
    <rect x="410" width="12" height="12" fill="#fdedec" stroke="#c0392b" stroke-width="1.5" rx="2"/>
    <text x="428" y="11" font-family="sans-serif" font-size="10" fill="#5d6d7e">Complexity Bounds</text>
  </g>
  
  <!-- Caption -->
  <text x="450" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a5276" font-style="italic">
    Figure 1: The tropical entropy bound — from string encoding through tropical matrix rank to compression limits.
  </text>
  <text x="450" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d">
    Arrows indicate mathematical mappings; ≤ signs denote the chain of inequalities in the theorem.
  </text>
</svg>
