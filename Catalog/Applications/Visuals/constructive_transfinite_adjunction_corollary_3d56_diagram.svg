<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Constructive Transfinite Adjunction Corollary
  </text>
  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Collapse of categorical structure to the terminal proposition
  </text>

  <!-- Left: Spacetime Category -->
  <rect x="40" y="100" width="200" height="180" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">
    Cat(X)
  </text>
  <text x="140" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">
    Spacetime Category
  </text>

  <!-- Objects in spacetime category -->
  <circle cx="90" cy="190" r="15" fill="#3b82f6" opacity="0.8"/>
  <text x="90" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₁</text>

  <circle cx="140" cy="210" r="15" fill="#3b82f6" opacity="0.8"/>
  <text x="140" y="215" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₂</text>

  <circle cx="190" cy="190" r="15" fill="#3b82f6" opacity="0.8"/>
  <text x="190" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="white">x₃</text>

  <circle cx="140" cy="250" r="12" fill="#1d4ed8" opacity="0.6"/>
  <text x="140" y="255" text-anchor="middle" font-family="monospace" font-size="9" fill="white">···</text>

  <!-- Identity morphisms (loops) -->
  <path d="M 90 175 C 70 160, 110 160, 90 175" fill="none" stroke="#1e40af" stroke-width="1.5" opacity="0.5"/>
  <path d="M 190 175 C 170 160, 210 160, 190 175" fill="none" stroke="#1e40af" stroke-width="1.5" opacity="0.5"/>

  <!-- Right: Presheaf Category -->
  <rect x="560" y="100" width="200" height="180" rx="10" fill="#fce7f3" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="125" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#991b1b">
    PSh(X)
  </text>
  <text x="660" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e11d48">
    Presheaf Category
  </text>

  <!-- Representable presheaves -->
  <rect x="600" y="170" width="50" height="30" rx="5" fill="#f43f5e" opacity="0.7"/>
  <text x="625" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="white">y(x₁)</text>

  <rect x="660" y="195" width="50" height="30" rx="5" fill="#f43f5e" opacity="0.7"/>
  <text x="685" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="white">y(x₂)</text>

  <rect x="600" y="230" width="50" height="30" rx="5" fill="#f43f5e" opacity="0.7"/>
  <text x="625" y="250" text-anchor="middle" font-family="monospace" font-size="10" fill="white">y(x₃)</text>

  <!-- Yoneda Embedding Arrow (top) -->
  <line x1="245" y1="170" x2="555" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="400" y="163" text-anchor="middle" font-family="monospace" font-size="12" fill="#2563eb" font-weight="bold">
    Yoneda: y
  </text>

  <!-- Adjunction arrows -->
  <path d="M 245 220 C 350 200, 450 200, 555 210" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="400" y="198" text-anchor="middle" font-family="monospace" font-size="11" fill="#16a34a">F (Spacetime)</text>

  <path d="M 555 240 C 450 260, 350 260, 245 240" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-red)"/>
  <text x="400" y="273" text-anchor="middle" font-family="monospace" font-size="11" fill="#dc2626">G (Observable)</text>

  <!-- Adjunction symbol -->
  <text x="400" y="238" text-anchor="middle" font-family="serif" font-size="20" fill="#334155">⊣</text>

  <!-- Center: Transfinite Iteration -->
  <rect x="300" y="310" width="200" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#92400e">
    Transfinite
  </text>
  <text x="400" y="358" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#92400e">
    Iteration
  </text>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">
    F∘G → (F∘G)² → ··· → Id
  </text>

  <!-- Arrow from adjunction to iteration -->
  <line x1="400" y1="280" x2="400" y2="305" stroke="#334155" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Bottom: Collapse to True -->
  <rect x="300" y="430" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="400" y="462" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#166534">
    True
  </text>
  <text x="400" y="485" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">
    Terminal object in Prop
  </text>

  <!-- Arrow from iteration to True -->
  <line x1="400" y1="395" x2="400" y2="425" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="430" y="415" font-family="sans-serif" font-size="10" fill="#16a34a">collapse</text>

  <!-- Inhabited constraint -->
  <rect x="40" y="310" width="160" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="120" y="335" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">[Inhabited X]</text>
  <text x="120" y="350" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4ade80">∃ default : X</text>

  <!-- Arrow from Inhabited to Cat(X) -->
  <line x1="120" y1="310" x2="120" y2="285" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>

  <!-- Type X label -->
  <rect x="600" y="310" width="160" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="680" y="335" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">{X : Type*}</text>
  <text x="680" y="350" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#60a5fa">Universe-polymorphic</text>

  <!-- Arrow from Type to PSh -->
  <line x1="680" y1="310" x2="680" y2="285" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>

  <!-- Proof notation box -->
  <rect x="250" y="520" width="300" height="35" rx="6" fill="#1e293b"/>
  <text x="400" y="543" text-anchor="middle" font-family="monospace" font-size="12" fill="#e2e8f0">
    proof := trivial  — True.intro  ∎
  </text>

  <!-- Caption -->
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
    Fig 1. The transfinite adjunction between spacetime and observable categories collapses to True for discrete carrier types.
  </text>
</svg>
