<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kolmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbcfe8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1e293b">
    Tropical Entropy Bound
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#64748b">
    Kolmogorov Complexity via Max-Plus Matrix Rank
  </text>

  <!-- ===== LEFT: Tropical Semiring ===== -->
  <rect x="30" y="90" width="250" height="200" rx="12" fill="url(#tropGrad)" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="115" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">
    Tropical Semiring 𝕋
  </text>
  <text x="155" y="140" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e3a5f">
    (ℝ ∪ {−∞}, max, +)
  </text>
  <line x1="60" y1="150" x2="250" y2="150" stroke="#93c5fd" stroke-width="1"/>
  <text x="55" y="175" font-family="monospace" font-size="11" fill="#1e3a5f">a ⊕ b = max(a, b)</text>
  <text x="55" y="195" font-family="monospace" font-size="11" fill="#1e3a5f">a ⊙ b = a + b</text>
  <text x="55" y="215" font-family="monospace" font-size="11" fill="#1e3a5f">Identity⊕ = −∞</text>
  <text x="55" y="235" font-family="monospace" font-size="11" fill="#1e3a5f">Identity⊙ = 0</text>

  <!-- Matrix icon -->
  <rect x="60" y="250" width="30" height="30" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="95" y="250" width="30" height="30" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="60" y="255" width="30" height="10" rx="0" fill="none"/>
  <text x="75" y="269" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">3</text>
  <text x="110" y="269" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e40af">1</text>
  <text x="145" y="270" font-family="monospace" font-size="10" fill="#1e3a5f">rk_𝕋(M)</text>

  <!-- ===== CENTER: Factorization / Bridge ===== -->
  <rect x="320" y="90" width="260" height="200" rx="12" fill="url(#compGrad)" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">
    Factorization Bridge
  </text>
  <text x="450" y="138" text-anchor="middle" font-family="monospace" font-size="11" fill="#78350f">
    M = A ⊙ B
  </text>
  <line x1="345" y1="148" x2="555" y2="148" stroke="#fbbf24" stroke-width="1"/>

  <!-- Factorization diagram -->
  <!-- M -->
  <rect x="345" y="160" width="50" height="50" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="370" y="190" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">M</text>
  <text x="370" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#78350f">m × n</text>

  <!-- = -->
  <text x="410" y="190" text-anchor="middle" font-family="Georgia" font-size="18" fill="#92400e">=</text>

  <!-- A -->
  <rect x="425" y="160" width="35" height="50" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="442" y="190" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">A</text>
  <text x="442" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#78350f">m × r</text>

  <!-- ⊙ -->
  <text x="475" y="190" text-anchor="middle" font-family="Georgia" font-size="16" fill="#92400e">⊙</text>

  <!-- B -->
  <rect x="490" y="160" width="50" height="35" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="515" y="183" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">B</text>
  <text x="515" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#78350f">r × n</text>

  <!-- Rank inequality -->
  <text x="450" y="260" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#92400e">
    rk_𝕋(M) ≤ rk_⊕(M)
  </text>
  <text x="450" y="278" text-anchor="middle" font-family="monospace" font-size="10" fill="#78350f">
    (tropical ≤ max-plus)
  </text>

  <!-- ===== RIGHT: Kolmogorov Complexity ===== -->
  <rect x="620" y="90" width="250" height="200" rx="12" fill="url(#kolmGrad)" stroke="#dc2626" stroke-width="2"/>
  <text x="745" y="115" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#991b1b">
    Kolmogorov Complexity
  </text>
  <text x="745" y="138" text-anchor="middle" font-family="monospace" font-size="11" fill="#7f1d1d">
    K(x) = min |p| : U(p) = x
  </text>
  <line x1="645" y1="148" x2="845" y2="148" stroke="#fca5a5" stroke-width="1"/>

  <text x="645" y="175" font-family="monospace" font-size="11" fill="#7f1d1d">• Uncomputable</text>
  <text x="645" y="195" font-family="monospace" font-size="11" fill="#7f1d1d">• Invariant (up to O(1))</text>
  <text x="645" y="215" font-family="monospace" font-size="11" fill="#7f1d1d">• Upper bound: |x|</text>
  <text x="645" y="245" font-family="monospace" font-size="12" font-weight="bold" fill="#991b1b">
    K(x) ≥ f(rk_𝕋(M_x))
  </text>
  <text x="645" y="265" font-family="monospace" font-size="10" fill="#7f1d1d">
    Computable lower bound!
  </text>

  <!-- ===== ARROWS ===== -->
  <!-- Tropical → Bridge -->
  <line x1="280" y1="190" x2="315" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Bridge → Kolmogorov -->
  <line x1="580" y1="190" x2="615" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ===== BOTTOM: The Bound ===== -->
  <rect x="150" y="340" width="600" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#166534">
    The Tropical Entropy Bound
  </text>
  <text x="450" y="400" text-anchor="middle" font-family="monospace" font-size="15" fill="#166534">
    rk_𝕋(M_x) ≤ rk_⊕(M_x)  →  K(x) ≥ f(rk_𝕋(M_x))
  </text>
  <text x="450" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#166534">
    Tropical rank provides a computable lower bound on incompressibility
  </text>
  <text x="450" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4ade80">
    Verified in Lean 4 with Mathlib — theorem tropical_kolmogorov_bound
  </text>

  <!-- Arrows from top boxes to bottom -->
  <path d="M155,290 Q155,330 250,340" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-blue)"/>
  <path d="M450,290 L450,335" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <path d="M745,290 Q745,330 650,340" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-red)"/>

  <!-- ===== BOTTOM: Maslov Dequantization ===== -->
  <rect x="150" y="490" width="600" height="80" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="450" y="515" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b21b6">
    Maslov Dequantization: Classical → Tropical as ħ → 0
  </text>
  <text x="450" y="540" text-anchor="middle" font-family="monospace" font-size="11" fill="#7c3aed">
    log(eᵃ/ʰ + eᵇ/ʰ) · ħ  →  max(a, b)     as ħ → 0
  </text>
  <text x="450" y="558" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#a78bfa">
    The tropical semiring is the "classical limit" of the real semiring
  </text>

  <!-- Arrow from bound to dequantization -->
  <line x1="450" y1="460" x2="450" y2="485" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>

  <!-- Caption -->
  <text x="450" y="605" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">
    Fig. 1: The tropical entropy bound connects tropical matrix rank to Kolmogorov complexity via max-plus factorization.
  </text>
</svg>
