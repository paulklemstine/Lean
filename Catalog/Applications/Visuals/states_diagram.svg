<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1e293b">
    Tropical Entropy Bound
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#64748b">
    trop_rank(A) ≤ max_plus_rank(A) ≤ K(x) + O(1)
  </text>

  <!-- ═══ LEFT: Data x ═══ -->
  <rect x="30" y="100" width="160" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="135" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e40af">Data x</text>
  <text x="110" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">Finite string / object</text>
  <text x="110" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">in Type X</text>

  <!-- Arrow: Data → Encoding -->
  <line x1="190" y1="150" x2="250" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">encode</text>

  <!-- ═══ CENTER: Tropical Matrix A_x ═══ -->
  <rect x="260" y="85" width="200" height="130" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="115" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#92400e">Matrix A_x</text>
  <text x="360" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">in 𝕋^{m×n}</text>

  <!-- Mini matrix illustration -->
  <text x="310" y="165" font-family="monospace" font-size="12" fill="#78350f">⎡ 3  7  2 ⎤</text>
  <text x="310" y="180" font-family="monospace" font-size="12" fill="#78350f">⎢ 5  1  4 ⎥</text>
  <text x="310" y="195" font-family="monospace" font-size="12" fill="#78350f">⎣ 6  3  8 ⎦</text>

  <!-- ═══ BOTTOM CENTER: Tropical Factorization ═══ -->
  <rect x="220" y="280" width="280" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="310" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#166534">Tropical Factorization</text>
  <text x="360" y="335" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">A = B ⊙ C</text>
  <text x="360" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">B ∈ 𝕋^{m×k}, C ∈ 𝕋^{k×n}</text>
  <text x="360" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">inner dim k = tropical rank</text>

  <!-- Arrow: Matrix → Factorization -->
  <line x1="360" y1="215" x2="360" y2="275" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="375" y="250" font-family="sans-serif" font-size="10" fill="#16a34a">factorize</text>

  <!-- ═══ RIGHT TOP: Max-Plus Rank ═══ -->
  <rect x="540" y="90" width="170" height="80" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="120" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#3730a3">rk_mp(A)</text>
  <text x="625" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4338ca">Max-plus rank</text>
  <text x="625" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6366f1">≥ trop_rank(A)</text>

  <!-- ═══ FAR RIGHT: Kolmogorov Complexity ═══ -->
  <rect x="700" y="200" width="170" height="100" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="233" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#9d174d">K(x)</text>
  <text x="785" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#be185d">Kolmogorov</text>
  <text x="785" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#be185d">Complexity</text>

  <!-- Arrow: Matrix → Max-Plus Rank -->
  <line x1="460" y1="130" x2="535" y2="130" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow: Max-Plus Rank → K(x) -->
  <path d="M 710 170 Q 750 190 700 220" stroke="#db2777" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)"/>

  <!-- ═══ Inequality Chain ═══ -->
  <rect x="530" y="320" width="340" height="70" rx="10" fill="#fff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e293b">
    trop_rank(A) ≤ rk_mp(A) ≤ K(x)+O(1)
  </text>
  <text x="700" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">
    The Central Inequality
  </text>

  <!-- Arrow from factorization to inequality -->
  <line x1="500" y1="350" x2="525" y2="350" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══ BOTTOM: Tropical Semiring Box ═══ -->
  <rect x="50" y="440" width="300" height="100" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="200" y="468" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#854d0e">Tropical Semiring 𝕋</text>
  <text x="200" y="492" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a16207">a ⊕ b = max(a, b)</text>
  <text x="200" y="512" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a16207">a ⊙ b = a + b</text>
  <text x="200" y="530" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ca8a04">Identity: ⊕ → −∞,  ⊙ → 0</text>

  <!-- ═══ BOTTOM RIGHT: Application Box ═══ -->
  <rect x="400" y="440" width="300" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="550" y="468" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#5b21b6">AI / Neural Networks</text>
  <text x="550" y="492" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6d28d9">ReLU(x) = max(0, x)</text>
  <text x="550" y="512" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6d28d9">= tropical polynomial</text>
  <text x="550" y="530" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c3aed">→ Network rank bounds compression</text>

  <!-- Connecting dotted lines -->
  <line x1="200" y1="440" x2="300" y2="400" stroke="#ca8a04" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="550" y1="440" x2="500" y2="400" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══ Legend: Color Key ═══ -->
  <rect x="730" y="440" width="150" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="805" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#475569">Legend</text>
  <rect x="745" y="470" width="12" height="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="765" y="481" font-family="sans-serif" font-size="10" fill="#475569">Data domain</text>
  <rect x="745" y="488" width="12" height="12" fill="#fef3c7" stroke="#d97706"/>
  <text x="765" y="499" font-family="sans-serif" font-size="10" fill="#475569">Tropical matrix</text>
  <rect x="745" y="506" width="12" height="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="765" y="517" font-family="sans-serif" font-size="10" fill="#475569">Factorization</text>
  <rect x="745" y="524" width="12" height="12" fill="#fce7f3" stroke="#db2777"/>
  <text x="765" y="535" font-family="sans-serif" font-size="10" fill="#475569">Complexity</text>

  <!-- Caption -->
  <text x="450" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#64748b">
    Figure: The tropical entropy bound relates matrix factorization rank to Kolmogorov complexity,
  </text>
  <text x="450" y="593" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#64748b">
    with applications to understanding compression limits in ReLU neural networks.
  </text>
</svg>
