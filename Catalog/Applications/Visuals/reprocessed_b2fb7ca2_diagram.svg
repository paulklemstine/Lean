<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a237e">
    Neural Tropical Approximation: ReLU Networks as Tropical Maps
  </text>

  <!-- ═══ LEFT: ReLU Network ═══ -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="250" height="240" rx="12" fill="white" stroke="#1565C0" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">ReLU Neural Network</text>

    <!-- Input -->
    <circle cx="50" cy="130" r="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="50" y="135" text-anchor="middle" font-size="12" fill="#1565C0">x</text>

    <!-- Hidden layer neurons -->
    <circle cx="140" cy="70" r="16" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="140" y="75" text-anchor="middle" font-size="10" fill="#0D47A1">σ₁</text>

    <circle cx="140" cy="130" r="16" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="140" y="135" text-anchor="middle" font-size="10" fill="#0D47A1">σ₂</text>

    <circle cx="140" cy="190" r="16" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
    <text x="140" y="195" text-anchor="middle" font-size="10" fill="#0D47A1">σ₃</text>

    <!-- Output -->
    <circle cx="210" cy="130" r="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="210" y="135" text-anchor="middle" font-size="12" fill="#1565C0">f(x)</text>

    <!-- Connections input→hidden -->
    <line x1="68" y1="125" x2="124" y2="73" stroke="#64B5F6" stroke-width="1.5"/>
    <line x1="68" y1="130" x2="124" y2="130" stroke="#64B5F6" stroke-width="1.5"/>
    <line x1="68" y1="135" x2="124" y2="187" stroke="#64B5F6" stroke-width="1.5"/>

    <!-- Connections hidden→output -->
    <line x1="156" y1="75" x2="192" y2="125" stroke="#64B5F6" stroke-width="1.5"/>
    <line x1="156" y1="130" x2="192" y2="130" stroke="#64B5F6" stroke-width="1.5"/>
    <line x1="156" y1="185" x2="192" y2="135" stroke="#64B5F6" stroke-width="1.5"/>

    <!-- ReLU label -->
    <text x="140" y="225" text-anchor="middle" font-size="11" fill="#666">σᵢ(x) = max(wᵢx + bᵢ, 0)</text>
  </g>

  <!-- ═══ CENTER: Equivalence Arrow ═══ -->
  <g transform="translate(320, 140)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="url(#tropGrad)" stroke="#FF6F00" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="80" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Tropicalization</text>
    <text x="80" y="45" text-anchor="middle" font-size="11" fill="#BF360C">max ↔ ⊕_trop</text>
    <text x="80" y="62" text-anchor="middle" font-size="11" fill="#BF360C">  +  ↔ ⊗_trop</text>

    <!-- Arrows -->
    <line x1="-20" y1="40" x2="0" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="160" y1="40" x2="180" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ═══ RIGHT: Tropical Polynomial ═══ -->
  <g transform="translate(520, 60)">
    <rect x="0" y="0" width="330" height="240" rx="12" fill="white" stroke="#E65100" stroke-width="2" filter="url(#shadow)"/>
    <text x="165" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">Tropical Rational Map</text>

    <!-- Piecewise linear graph -->
    <g transform="translate(30, 40)">
      <!-- Axes -->
      <line x1="0" y1="150" x2="270" y2="150" stroke="#999" stroke-width="1"/>
      <line x1="30" y1="10" x2="30" y2="170" stroke="#999" stroke-width="1"/>

      <!-- Piecewise linear function (tropical polynomial) -->
      <polyline points="30,140 80,140 120,110 160,70 200,90 240,60"
                fill="none" stroke="#E65100" stroke-width="3" stroke-linejoin="round"/>

      <!-- Breakpoint markers (tropical vertices) -->
      <circle cx="80" cy="140" r="4" fill="#FF6F00"/>
      <circle cx="120" cy="110" r="4" fill="#FF6F00"/>
      <circle cx="160" cy="70" r="4" fill="#FF6F00"/>
      <circle cx="200" cy="90" r="4" fill="#FF6F00"/>

      <!-- Slope labels -->
      <text x="50" y="155" font-size="9" fill="#E65100">slope=0</text>
      <text x="88" y="118" font-size="9" fill="#E65100">slope=d₁</text>
      <text x="133" y="82" font-size="9" fill="#E65100">slope=d₂</text>
      <text x="175" y="100" font-size="9" fill="#E65100">slope=−d₃</text>

      <!-- Region markers -->
      <text x="50" y="170" font-size="8" fill="#888">R₁</text>
      <text x="95" y="170" font-size="8" fill="#888">R₂</text>
      <text x="135" y="170" font-size="8" fill="#888">R₃</text>
      <text x="175" y="170" font-size="8" fill="#888">R₄</text>
      <text x="215" y="170" font-size="8" fill="#888">R₅</text>
    </g>

    <!-- Formula -->
    <text x="165" y="225" text-anchor="middle" font-size="11" fill="#666">p(x) = max_i(aᵢ + dᵢ·x) = ⊕ᵢ(aᵢ ⊗ x^{⊗dᵢ})</text>
  </g>

  <!-- ═══ BOTTOM: Lipschitz Bound ═══ -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="800" height="100" rx="12" fill="white" stroke="#2E7D32" stroke-width="2" filter="url(#shadow)"/>

    <!-- Green banner -->
    <rect x="0" y="0" width="800" height="30" rx="12" fill="#2E7D32"/>
    <rect x="0" y="15" width="800" height="15" fill="#2E7D32"/>
    <text x="400" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      Main Theorem: Lipschitz ≤ Tropical Degree
    </text>

    <!-- Content -->
    <text x="30" y="55" font-size="13" fill="#1B5E20" font-weight="bold">
      ‖f(x) − f(y)‖ ≤ deg_trop(f) · ‖x − y‖
    </text>
    <text x="30" y="80" font-size="11" fill="#555">
      The Lipschitz constant of a ReLU network = max |slope| across all linear regions = tropical degree of the map.
    </text>

    <text x="550" y="55" font-size="12" fill="#1B5E20" font-weight="bold">
      Lip(f) = max_i |dᵢ| = deg_trop(p)
    </text>
    <text x="550" y="80" font-size="11" fill="#555">
      Verified in Lean 4 + Mathlib ✓
    </text>
  </g>

  <!-- ═══ BOTTOM: Maslov Dequantization ═══ -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="380" height="100" rx="12" fill="white" stroke="#7B1FA2" stroke-width="2" filter="url(#shadow)"/>
    <text x="190" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#7B1FA2">Maslov Dequantization</text>

    <text x="20" y="48" font-size="12" fill="#4A148C">
      lim_{t→0⁺} t · log(e^{a/t} + e^{b/t}) = max(a, b)
    </text>
    <text x="20" y="70" font-size="11" fill="#666">Classical algebra → Tropical algebra</text>
    <text x="20" y="88" font-size="11" fill="#666">(ℝ, +, ×) → (ℝ∪{−∞}, max, +)</text>
  </g>

  <!-- ═══ BOTTOM RIGHT: Region Count ═══ -->
  <g transform="translate(470, 450)">
    <rect x="0" y="0" width="380" height="100" rx="12" fill="white" stroke="#C62828" stroke-width="2" filter="url(#shadow)"/>
    <text x="190" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#C62828">Expressivity via Tropical Degree</text>

    <text x="20" y="48" font-size="12" fill="#B71C1C">
      #Regions ≤ (width + 1)^depth
    </text>
    <text x="20" y="70" font-size="11" fill="#666">Depth amplifies tropical complexity exponentially</text>
    <text x="20" y="88" font-size="11" fill="#666">Width 4, Depth 6 → up to 15,625 linear pieces</text>
  </g>

  <!-- Caption -->
  <text x="450" y="585" text-anchor="middle" font-size="11" fill="#888" font-style="italic">
    Figure: The tropicalization functor maps ReLU networks to piecewise-linear tropical rational maps,
    bounding Lipschitz constants by tropical degree.
  </text>
</svg>
