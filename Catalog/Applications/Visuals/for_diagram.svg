<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    p-Adic Factoring Oracle: Theorem Structure
  </text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEFT SIDE: Original (False) Theorem -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Box for original theorem -->
  <rect x="30" y="60" width="340" height="80" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="200" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">ORIGINAL (FALSE)</text>
  <text x="200" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">∀ n &gt; 1, ∃ a b &gt; 1, a·b = n</text>
  <text x="200" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#c0392b">✗ Fails for primes</text>
  <text x="200" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">pAdic_factoring_oracle</text>

  <!-- Counterexample: n = 2 -->
  <line x1="200" y1="140" x2="200" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowred)"/>

  <rect x="80" y="175" width="240" height="90" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="200" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">Counterexample: n = 2</text>
  <text x="200" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">2 is prime</text>
  <text x="200" y="233" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">a ≥ 2, b ≥ 2 ⟹ a·b ≥ 4 &gt; 2</text>
  <text x="200" y="253" text-anchor="middle" font-family="monospace" font-size="10" fill="#c0392b">Contradiction! ⊥</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- RIGHT SIDE: Corrected Theorem -->
  <!-- ═══════════════════════════════════════════ -->

  <rect x="430" y="60" width="340" height="80" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60" font-weight="bold">CORRECTED (TRUE)</text>
  <text x="600" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">∀ composite n &gt; 1, ∃ a b &gt; 1, a·b = n</text>
  <text x="600" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#27ae60">✓ Proved in Lean 4</text>
  <text x="600" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">pAdic_factoring_oracle_corrected</text>

  <!-- Proof flow -->
  <line x1="600" y1="140" x2="600" y2="170" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowgreen)"/>

  <!-- Step 1: hypothesis -->
  <rect x="460" y="175" width="280" height="45" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="193" text-anchor="middle" font-family="monospace" font-size="10" fill="#333" font-weight="bold">Step 1: Hypotheses</text>
  <text x="600" y="210" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">n &gt; 1 ∧ ¬Prime(n)</text>

  <line x1="600" y1="220" x2="600" y2="240" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <!-- Step 2: extract divisor -->
  <rect x="460" y="245" width="280" height="45" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="263" text-anchor="middle" font-family="monospace" font-size="10" fill="#333" font-weight="bold">Step 2: Extract divisor</text>
  <text x="600" y="280" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">∃ k, k ∣ n ∧ 1 &lt; k &lt; n</text>

  <line x1="600" y1="290" x2="600" y2="310" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <!-- Step 3: construct factorization -->
  <rect x="460" y="315" width="280" height="45" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="333" text-anchor="middle" font-family="monospace" font-size="10" fill="#333" font-weight="bold">Step 3: Construct witness</text>
  <text x="600" y="350" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">a := k, b := n/k</text>

  <line x1="600" y1="360" x2="600" y2="380" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <!-- Step 4: verify -->
  <rect x="460" y="385" width="280" height="55" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="403" text-anchor="middle" font-family="monospace" font-size="10" fill="#333" font-weight="bold">Step 4: Verify ✓</text>
  <text x="600" y="420" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">a·b = k·(n/k) = n</text>
  <text x="600" y="433" text-anchor="middle" font-family="monospace" font-size="10" fill="#27ae60">a &gt; 1 ∧ b &gt; 1 ✓</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- BOTTOM: Number line visualization -->
  <!-- ═══════════════════════════════════════════ -->

  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Natural Numbers: Primes vs Composites
  </text>

  <!-- Number line -->
  <line x1="60" y1="510" x2="740" y2="510" stroke="#333" stroke-width="2"/>

  <!-- Numbers 2-15 on the line -->
  <!-- n=2 (prime, red) -->
  <circle cx="108" cy="510" r="14" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="108" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">2</text>

  <!-- n=3 (prime, red) -->
  <circle cx="156" cy="510" r="14" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="156" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">3</text>

  <!-- n=4 (composite, green) -->
  <rect x="190" y="496" width="28" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="204" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60" font-weight="bold">4</text>
  <text x="204" y="540" text-anchor="middle" font-family="monospace" font-size="8" fill="#27ae60">2×2</text>

  <!-- n=5 (prime, red) -->
  <circle cx="252" cy="510" r="14" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="252" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">5</text>

  <!-- n=6 (composite, green) -->
  <rect x="286" y="496" width="28" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="300" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60" font-weight="bold">6</text>
  <text x="300" y="540" text-anchor="middle" font-family="monospace" font-size="8" fill="#27ae60">2×3</text>

  <!-- n=7 (prime, red) -->
  <circle cx="348" cy="510" r="14" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="348" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">7</text>

  <!-- n=8 (composite, green) -->
  <rect x="382" y="496" width="28" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="396" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60" font-weight="bold">8</text>
  <text x="396" y="540" text-anchor="middle" font-family="monospace" font-size="8" fill="#27ae60">2×4</text>

  <!-- n=9 (composite, green) -->
  <rect x="430" y="496" width="28" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="444" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60" font-weight="bold">9</text>
  <text x="444" y="540" text-anchor="middle" font-family="monospace" font-size="8" fill="#27ae60">3×3</text>

  <!-- n=10 (composite, green) -->
  <rect x="478" y="496" width="28" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="492" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60" font-weight="bold">10</text>
  <text x="492" y="540" text-anchor="middle" font-family="monospace" font-size="8" fill="#27ae60">2×5</text>

  <!-- n=11 (prime, red) -->
  <circle cx="540" cy="510" r="14" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="540" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">11</text>

  <!-- n=12 (composite, green) -->
  <rect x="574" y="496" width="28" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="588" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60" font-weight="bold">12</text>
  <text x="588" y="540" text-anchor="middle" font-family="monospace" font-size="8" fill="#27ae60">2×6</text>

  <!-- n=13 (prime, red) -->
  <circle cx="636" cy="510" r="14" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="636" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">13</text>

  <!-- n=14 (composite, green) -->
  <rect x="670" y="496" width="28" height="28" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="684" y="514" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60" font-weight="bold">14</text>
  <text x="684" y="540" text-anchor="middle" font-family="monospace" font-size="8" fill="#27ae60">2×7</text>

  <!-- Legend -->
  <circle cx="200" cy="570" r="10" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="220" y="574" font-family="Georgia, serif" font-size="11" fill="#333">= Prime (no nontrivial factorization)</text>

  <rect x="480" y="560" width="20" height="20" rx="3" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="510" y="574" font-family="Georgia, serif" font-size="11" fill="#333">= Composite (factorization exists ✓)</text>

  <!-- Caption -->
  <text x="400" y="595" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#7f8c8d" font-style="italic">
    The corrected theorem applies only to composite numbers (green squares). Primes (red circles) are the obstruction.
  </text>
</svg>
