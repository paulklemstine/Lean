<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Georgia, serif">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <!-- Gradient for manifolds -->
    <radialGradient id="manifold1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="manifold2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f9a8d4;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="manifold3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6ee7b7;stop-opacity:1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">
    Backpropagation as the Cotangent Lift
  </text>
  <text x="450" y="55" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">
    Contravariant Functoriality of T* : Man^op → VectBun
  </text>

  <!-- === TOP ROW: Forward Pass (Tangent / Covariant) === -->
  <text x="450" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">
    Forward Pass (Covariant)
  </text>

  <!-- Manifold M1 (Input) -->
  <ellipse cx="130" cy="170" rx="80" ry="50" fill="url(#manifold1)" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">ℝ^d₀</text>
  <text x="130" y="185" text-anchor="middle" font-size="11" fill="#3b82f6">Input</text>

  <!-- Manifold M2 (Hidden) -->
  <ellipse cx="380" cy="170" rx="80" ry="50" fill="url(#manifold2)" stroke="#be185d" stroke-width="2"/>
  <text x="380" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#9d174d">ℝ^d₁</text>
  <text x="380" y="185" text-anchor="middle" font-size="11" fill="#ec4899">Hidden</text>

  <!-- Manifold M3 (Output) -->
  <ellipse cx="630" cy="170" rx="80" ry="50" fill="url(#manifold3)" stroke="#059669" stroke-width="2"/>
  <text x="630" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">ℝ^d₂</text>
  <text x="630" y="185" text-anchor="middle" font-size="11" fill="#10b981">Output</text>

  <!-- Loss -->
  <ellipse cx="820" cy="170" rx="50" ry="35" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="820" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">ℝ</text>
  <text x="820" y="182" text-anchor="middle" font-size="10" fill="#b45309">Loss</text>

  <!-- Forward arrows -->
  <line x1="210" y1="170" x2="295" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="252" y="160" text-anchor="middle" font-size="14" fill="#2563eb" font-style="italic">L₁</text>

  <line x1="460" y1="170" x2="545" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="502" y="160" text-anchor="middle" font-size="14" fill="#2563eb" font-style="italic">L₂</text>

  <line x1="710" y1="170" x2="765" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="737" y="160" text-anchor="middle" font-size="13" fill="#2563eb" font-style="italic">ℓ</text>

  <!-- === Vertical duality arrows === -->
  <text x="60" y="305" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">T*</text>
  <text x="60" y="320" text-anchor="middle" font-size="11" fill="#9ca3af">dualizes</text>

  <!-- Duality arrows on each manifold -->
  <line x1="130" y1="225" x2="130" y2="340" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="380" y1="225" x2="380" y2="340" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="630" y1="225" x2="630" y2="340" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="820" y1="210" x2="820" y2="340" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- === BOTTOM ROW: Backward Pass (Cotangent / Contravariant) === -->
  <text x="450" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">
    Backward Pass (Contravariant) — Backpropagation
  </text>

  <!-- Cotangent bundles -->
  <rect x="65" y="380" width="130" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">T*ℝ^d₀</text>
  <text x="130" y="425" text-anchor="middle" font-size="10" fill="#3b82f6">Input gradient</text>

  <rect x="315" y="380" width="130" height="60" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="380" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d174d">T*ℝ^d₁</text>
  <text x="380" y="425" text-anchor="middle" font-size="10" fill="#ec4899">Hidden gradient</text>

  <rect x="565" y="380" width="130" height="60" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="630" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">T*ℝ^d₂</text>
  <text x="630" y="425" text-anchor="middle" font-size="10" fill="#10b981">Output gradient</text>

  <rect x="780" y="380" width="80" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="820" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">T*ℝ</text>
  <text x="820" y="422" text-anchor="middle" font-size="9" fill="#b45309">∂ℓ/∂y</text>

  <!-- Backward arrows (REVERSED direction!) -->
  <line x1="310" y1="410" x2="200" y2="410" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="255" y="400" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="bold">L₁*</text>

  <line x1="560" y1="410" x2="450" y2="410" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="505" y="400" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="bold">L₂*</text>

  <line x1="775" y1="410" x2="700" y2="410" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="737" y="400" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="bold">ℓ*</text>

  <!-- === Key equation === -->
  <rect x="100" y="470" width="700" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="493" text-anchor="middle" font-size="15" fill="#1e293b">
    Contravariant Functoriality:
  </text>
  <text x="450" y="515" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b" font-style="italic">
    (L₂ ∘ L₁)* = L₁* ∘ L₂*     ⟹     Backprop traverses layers in reverse
  </text>

  <!-- === Legend === -->
  <line x1="120" y1="555" x2="170" y2="555" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="180" y="559" font-size="12" fill="#2563eb">Forward (covariant, tangent map)</text>

  <line x1="430" y1="555" x2="480" y2="555" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="490" y="559" font-size="12" fill="#dc2626">Backward (contravariant, cotangent lift)</text>

  <!-- Caption -->
  <text x="450" y="595" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">
    The reverse order of backpropagation is forced by the contravariance of the cotangent functor T*.
  </text>
  <text x="450" y="612" text-anchor="middle" font-size="11" fill="#94a3b8">
    Each L_i* = Jᵢᵀ is the transposed Jacobian of layer i — exactly what backprop computes.
  </text>
</svg>
