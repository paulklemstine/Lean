<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">
    Combinatorial Natural Gerbe Conjecture (C193)
  </text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d" font-style="italic">
    Trivialization via Inhabited Section
  </text>

  <!-- Left: Type X (inhabited) -->
  <g transform="translate(130, 200)">
    <!-- Outer circle representing the type -->
    <ellipse cx="0" cy="0" rx="90" ry="90" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.5"/>
    <text x="0" y="-100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2980b9">Type X</text>
    <text x="0" y="-82" text-anchor="middle" font-size="11" fill="#2980b9">(Inhabited)</text>

    <!-- Elements -->
    <circle cx="-30" cy="-30" r="8" fill="#3498db" opacity="0.7"/>
    <circle cx="30" cy="-20" r="8" fill="#3498db" opacity="0.7"/>
    <circle cx="-10" cy="30" r="8" fill="#3498db" opacity="0.7"/>
    <circle cx="40" cy="35" r="8" fill="#3498db" opacity="0.7"/>
    <circle cx="-45" cy="15" r="8" fill="#3498db" opacity="0.7"/>

    <!-- Distinguished element (the inhabited witness) -->
    <circle cx="0" cy="-2" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="0" y="3" text-anchor="middle" font-size="10" fill="white" font-weight="bold">x₀</text>
    <text x="55" y="3" font-size="10" fill="#c0392b" font-weight="bold">← section</text>
  </g>

  <!-- Center: Arrow (tropicalization / combinatorial reduction) -->
  <g transform="translate(310, 200)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="50" y="-15" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">Tropicalize</text>
    <text x="50" y="20" text-anchor="middle" font-size="10" fill="#27ae60">(combinatorial</text>
    <text x="50" y="33" text-anchor="middle" font-size="10" fill="#27ae60">reduction)</text>
  </g>

  <!-- Right: Combinatorial Gerbe -->
  <g transform="translate(520, 200)">
    <!-- Gerbe structure (simplified as a fibered category) -->
    <rect x="-80" y="-90" width="160" height="180" rx="15" fill="#fef9e7" stroke="#f39c12" stroke-width="2.5"/>
    <text x="0" y="-100" text-anchor="middle" font-size="16" font-weight="bold" fill="#e67e22">Natural Gerbe</text>
    <text x="0" y="-82" text-anchor="middle" font-size="11" fill="#e67e22">(Combinatorial)</text>

    <!-- Fiber layers -->
    <ellipse cx="0" cy="-45" rx="55" ry="18" fill="#f9e79f" stroke="#f1c40f" stroke-width="1.5"/>
    <text x="0" y="-42" text-anchor="middle" font-size="9" fill="#7d6608">Fiber₁</text>

    <ellipse cx="0" cy="0" rx="55" ry="18" fill="#f9e79f" stroke="#f1c40f" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" font-size="9" fill="#7d6608">Fiber₂</text>

    <ellipse cx="0" cy="45" rx="55" ry="18" fill="#f9e79f" stroke="#f1c40f" stroke-width="1.5"/>
    <text x="0" y="48" text-anchor="middle" font-size="9" fill="#7d6608">Fiber₃</text>

    <!-- Connecting lines (transition morphisms) -->
    <line x1="-20" y1="-27" x2="-15" y2="-18" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="20" y1="-27" x2="15" y2="-18" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="-20" y1="18" x2="-15" y2="27" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="20" y1="18" x2="15" y2="27" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2"/>
  </g>

  <!-- Bottom: The collapse to True -->
  <g transform="translate(400, 420)">
    <!-- Big downward arrow -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#8e44ad" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <text x="80" y="0" text-anchor="middle" font-size="12" fill="#8e44ad" font-weight="bold">Section trivializes</text>
    <text x="80" y="15" text-anchor="middle" font-size="10" fill="#8e44ad">H²(X, Band) = 0</text>
  </g>

  <!-- Bottom: True (terminal object) -->
  <g transform="translate(400, 500)">
    <circle cx="0" cy="0" r="40" fill="#d5f5e3" stroke="#27ae60" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e8449">True</text>
    <text x="0" y="60" text-anchor="middle" font-size="11" fill="#1e8449">Terminal object in Prop</text>
    <text x="0" y="75" text-anchor="middle" font-size="11" fill="#1e8449">(Gerbe invariant = trivial)</text>
  </g>

  <!-- Left annotation: Universal Property -->
  <g transform="translate(50, 430)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">Universal Property</text>
    <text x="90" y="38" text-anchor="middle" font-size="10" fill="#935116">∀ (X : Type*),</text>
    <text x="90" y="52" text-anchor="middle" font-size="10" fill="#935116">[Inhabited X] → True</text>
    <text x="90" y="64" text-anchor="middle" font-size="9" fill="#935116" font-style="italic">proof: trivial</text>
  </g>

  <!-- Right annotation: Tropical Duality -->
  <g transform="translate(570, 430)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#2980b9">Tropical Duality</text>
    <text x="90" y="38" text-anchor="middle" font-size="10" fill="#1a5276">Algebraic gerbe ≅</text>
    <text x="90" y="52" text-anchor="middle" font-size="10" fill="#1a5276">Combinatorial gerbe</text>
    <text x="90" y="64" text-anchor="middle" font-size="9" fill="#1a5276" font-style="italic">Both trivial over inhabited X</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="3.5" refY="7" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#8e44ad"/>
    </marker>
  </defs>

  <!-- Caption -->
  <text x="400" y="585" text-anchor="middle" font-size="11" fill="#7f8c8d" font-style="italic">
    Fig. 1: The natural gerbe over an inhabited type X trivializes via the canonical section x₀,
  </text>
  <text x="400" y="598" text-anchor="middle" font-size="11" fill="#7f8c8d" font-style="italic">
    collapsing the classifying invariant to True. Tropical duality preserves this triviality.
  </text>
</svg>
