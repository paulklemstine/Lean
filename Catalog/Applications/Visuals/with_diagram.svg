<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="grad-m0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-m1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-m2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#86efac;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Backpropagation as the Cotangent Lift
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Contravariant Functoriality: T*(g ∘ f) = T*f ∘ T*g
  </text>

  <!-- ===== TOP ROW: Base Manifolds (Forward Pass) ===== -->
  <text x="450" y="90" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569" font-weight="bold">
    FORWARD PASS (Covariant — Tangent Functor T)
  </text>

  <!-- M₀ -->
  <ellipse cx="150" cy="160" rx="75" ry="45" fill="url(#grad-m0)" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e40af">M₀</text>
  <text x="150" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3b82f6">(input)</text>

  <!-- M₁ -->
  <ellipse cx="450" cy="160" rx="75" ry="45" fill="url(#grad-m1)" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#92400e">M₁</text>
  <text x="450" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#d97706">(hidden)</text>

  <!-- M₂ -->
  <ellipse cx="750" cy="160" rx="75" ry="45" fill="url(#grad-m2)" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#166534">M₂</text>
  <text x="750" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#16a34a">(output)</text>

  <!-- Forward arrows -->
  <line x1="228" y1="150" x2="372" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="300" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2563eb" font-style="italic">f₁</text>

  <line x1="528" y1="150" x2="672" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="600" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2563eb" font-style="italic">f₂</text>

  <!-- Composition arrow (curved, below) -->
  <path d="M 228 175 Q 450 240 672 175" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <text x="450" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6366f1" font-style="italic">f = f₂ ∘ f₁</text>

  <!-- ===== Vertical connection: Bundle projection ===== -->
  <text x="450" y="290" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569" font-weight="bold">
    BUNDLE PROJECTION π : T*M → M
  </text>

  <!-- Vertical dotted lines -->
  <line x1="150" y1="207" x2="150" y2="345" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="450" y1="207" x2="450" y2="345" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="750" y1="207" x2="750" y2="345" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <text x="130" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">π₀</text>
  <text x="430" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">π₁</text>
  <text x="730" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">π₂</text>

  <!-- ===== BOTTOM ROW: Cotangent Bundles (Backprop) ===== -->
  <text x="450" y="335" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569" font-weight="bold">
    BACKPROPAGATION (Contravariant — Cotangent Functor T*)
  </text>

  <!-- T*M₀ -->
  <rect x="75" y="355" width="150" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e40af">T*M₀</text>
  <text x="150" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3b82f6">gradients w.r.t. input</text>

  <!-- T*M₁ -->
  <rect x="375" y="355" width="150" height="70" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#92400e">T*M₁</text>
  <text x="450" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#d97706">hidden gradients</text>

  <!-- T*M₂ -->
  <rect x="675" y="355" width="150" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#166534">T*M₂</text>
  <text x="750" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#16a34a">∇𝓛 (loss gradient)</text>

  <!-- Backward arrows (REVERSED direction — contravariance!) -->
  <line x1="372" y1="380" x2="228" y2="380" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="300" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#dc2626" font-style="italic">f₁*</text>

  <line x1="672" y1="380" x2="528" y2="380" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="600" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#dc2626" font-style="italic">f₂*</text>

  <!-- Backprop composition arrow (curved, below) -->
  <path d="M 672 405 Q 450 475 228 405" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="450" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#dc2626" font-style="italic">f* = f₁* ∘ f₂*</text>

  <!-- ===== Key equation box ===== -->
  <rect x="200" y="490" width="500" height="65" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="450" y="515" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#713f12" font-weight="bold">
    Contravariant Functoriality (= Backpropagation):
  </text>
  <text x="450" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#92400e" font-style="italic">
    (f₂ ∘ f₁)* = f₁* ∘ f₂*    ←  reversed order!
  </text>

  <!-- Legend -->
  <rect x="30" y="495" width="150" height="55" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="515" x2="70" y2="515" stroke="#2563eb" stroke-width="2.5"/>
  <text x="78" y="519" font-family="Georgia, serif" font-size="11" fill="#475569">Forward (covariant)</text>
  <line x1="40" y1="535" x2="70" y2="535" stroke="#dc2626" stroke-width="2.5"/>
  <text x="78" y="539" font-family="Georgia, serif" font-size="11" fill="#475569">Backprop (contravariant)</text>

  <!-- Caption -->
  <text x="450" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Fig. 1: The forward pass composes covariantly (left-to-right); backpropagation reverses direction
  </text>
  <text x="450" y="608" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    via contravariant functoriality of the cotangent bundle T* : Man^op → VectBun.
  </text>
</svg>
