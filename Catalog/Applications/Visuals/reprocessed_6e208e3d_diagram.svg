<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="url(#bg)" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">
    Backpropagation as Cotangent Lift
  </text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">
    Forward pass (tangent) vs. Backward pass (cotangent) in the category of smooth manifolds
  </text>

  <!-- ═══ FORWARD PASS (TOP ROW) ═══ -->
  <text x="450" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">
    Forward Pass: Φ = f₃ ∘ f₂ ∘ f₁
  </text>

  <!-- Manifold nodes -->
  <g>
    <!-- M₀ -->
    <ellipse cx="120" cy="170" rx="55" ry="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">M₀</text>
    <text x="120" y="183" text-anchor="middle" font-size="11" fill="#3b82f6">ℝⁿ⁰ (input)</text>

    <!-- M₁ -->
    <ellipse cx="320" cy="170" rx="55" ry="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="320" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">M₁</text>
    <text x="320" y="183" text-anchor="middle" font-size="11" fill="#3b82f6">ℝⁿ¹</text>

    <!-- M₂ -->
    <ellipse cx="520" cy="170" rx="55" ry="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="520" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">M₂</text>
    <text x="520" y="183" text-anchor="middle" font-size="11" fill="#3b82f6">ℝⁿ²</text>

    <!-- M₃ -->
    <ellipse cx="720" cy="170" rx="55" ry="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="720" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">M₃</text>
    <text x="720" y="183" text-anchor="middle" font-size="11" fill="#3b82f6">ℝⁿ³ (output)</text>
  </g>

  <!-- Forward arrows -->
  <line x1="178" y1="170" x2="260" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="220" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">f₁</text>

  <line x1="378" y1="170" x2="460" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="420" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">f₂</text>

  <line x1="578" y1="170" x2="660" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="620" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">f₃</text>

  <!-- ═══ EQUALS SIGN ═══ -->
  <text x="450" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#64748b">
    ═══════════ T* (cotangent functor) ═══════════
  </text>

  <!-- ═══ COTANGENT BUNDLES (MIDDLE ROW) ═══ -->
  <text x="450" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">
    Backward Pass (Backprop): T*Φ = T*f₁ ∘ T*f₂ ∘ T*f₃
  </text>

  <!-- Cotangent bundle nodes -->
  <g>
    <!-- T*M₀ -->
    <rect x="65" y="310" width="110" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="120" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">T*M₀</text>
    <text x="120" y="355" text-anchor="middle" font-size="10" fill="#dc2626">gradients</text>

    <!-- T*M₁ -->
    <rect x="265" y="310" width="110" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="320" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">T*M₁</text>
    <text x="320" y="355" text-anchor="middle" font-size="10" fill="#dc2626">hidden grads</text>

    <!-- T*M₂ -->
    <rect x="465" y="310" width="110" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="520" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">T*M₂</text>
    <text x="520" y="355" text-anchor="middle" font-size="10" fill="#dc2626">hidden grads</text>

    <!-- T*M₃ -->
    <rect x="665" y="310" width="110" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="720" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">T*M₃</text>
    <text x="720" y="355" text-anchor="middle" font-size="10" fill="#dc2626">∇ℒ (loss grad)</text>
  </g>

  <!-- Backward arrows (REVERSED direction — contravariance!) -->
  <line x1="262" y1="340" x2="180" y2="340" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="220" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">T*f₁</text>
  <text x="220" y="365" text-anchor="middle" font-size="10" fill="#b91c1c">(df₁)ᵀ</text>

  <line x1="462" y1="340" x2="380" y2="340" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="420" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">T*f₂</text>
  <text x="420" y="365" text-anchor="middle" font-size="10" fill="#b91c1c">(df₂)ᵀ</text>

  <line x1="662" y1="340" x2="580" y2="340" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="620" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">T*f₃</text>
  <text x="620" y="365" text-anchor="middle" font-size="10" fill="#b91c1c">(df₃)ᵀ</text>

  <!-- ═══ FUNCTORIALITY BOX ═══ -->
  <rect x="180" y="410" width="540" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3"/>
  
  <text x="450" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">
    Functoriality (Chain Rule as Categorical Law)
  </text>
  <text x="450" y="460" text-anchor="middle" font-size="16" fill="#15803d" font-style="italic">
    T*(g ∘ f) = T*f ∘ T*g
  </text>
  <text x="450" y="483" text-anchor="middle" font-size="12" fill="#22c55e">
    Contravariance reverses composition order → layers traversed backwards
  </text>

  <!-- ═══ VERTICAL CONNECTIONS (T* functor action) ═══ -->
  <line x1="120" y1="208" x2="120" y2="306" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <line x1="320" y1="208" x2="320" y2="306" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <line x1="520" y1="208" x2="520" y2="306" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <line x1="720" y1="208" x2="720" y2="306" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>

  <!-- T* labels on vertical arrows -->
  <text x="100" y="260" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">T*</text>
  <text x="300" y="260" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">T*</text>
  <text x="500" y="260" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">T*</text>
  <text x="700" y="260" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">T*</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="30" y="520" width="840" height="45" rx="8" fill="white" fill-opacity="0.7" stroke="#cbd5e1" stroke-width="1"/>
  
  <circle cx="70" cy="542" r="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="85" y="547" font-size="11" fill="#475569">Forward maps (tangent/pushforward)</text>

  <rect x="295" y="534" width="16" height="16" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="318" y="547" font-size="11" fill="#475569">Cotangent lifts (pullback/backprop)</text>

  <line x1="545" y1="542" x2="575" y2="542" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="582" y="547" font-size="11" fill="#475569">T* functor (dualizes each space)</text>

  <!-- Caption -->
  <text x="450" y="595" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">
    The cotangent functor T* sends each manifold Mᵢ to its cotangent bundle T*Mᵢ,
  </text>
  <text x="450" y="611" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">
    and reverses all arrows — this reversal is why backpropagation runs backwards.
  </text>
</svg>
