<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Homotopical Resolved PROP Principle
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal property via inhabitation and cofibrant replacement
  </text>

  <!-- LEFT: Original PROP P -->
  <rect x="40" y="80" width="220" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#2563eb">PROP P</text>

  <!-- PROP objects (natural numbers) -->
  <circle cx="80" cy="150" r="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e40af">0</text>

  <circle cx="150" cy="150" r="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e40af">1</text>

  <circle cx="220" cy="150" r="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e40af">2</text>

  <!-- Morphisms in P -->
  <path d="M 98 148 L 130 148" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <path d="M 168 148 L 200 148" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <path d="M 92 165 Q 150 220 208 165" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-blue)"/>

  <text x="150" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#2563eb">f: m → n</text>
  <text x="150" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">Morphisms = operations</text>
  <text x="150" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">Ob(P) = ℕ, ⊗ = +</text>

  <!-- RIGHT: Resolved PROP P∞ -->
  <rect x="540" y="80" width="220" height="200" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">P∞ (Resolved)</text>

  <!-- Resolved objects -->
  <circle cx="580" cy="150" r="18" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="580" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="#991b1b">0</text>

  <circle cx="650" cy="150" r="18" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="650" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="#991b1b">1</text>

  <circle cx="720" cy="150" r="18" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="720" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="#991b1b">2</text>

  <!-- Higher morphisms in P∞ -->
  <path d="M 598 148 L 630 148" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <path d="M 668 148 L 700 148" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <path d="M 592 165 Q 650 220 708 165" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-red)"/>

  <!-- Homotopy wiggles -->
  <path d="M 610 180 Q 615 175 620 180 Q 625 185 630 180 Q 635 175 640 180" stroke="#f87171" stroke-width="1" fill="none"/>
  <text x="650" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc2626">+ homotopies</text>
  <text x="650" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">Cofibrant replacement</text>
  <text x="650" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">Higher coherence data</text>

  <!-- Resolution arrow P∞ → P -->
  <path d="M 540 180 L 275 180" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#333">resolution</text>
  <text x="400" y="190" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">≃ weak equivalence</text>

  <!-- CENTER: Type X with inhabitation -->
  <rect x="290" y="310" width="220" height="140" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="400" y="340" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#16a34a">X : Type*</text>
  <text x="400" y="362" text-anchor="middle" font-family="monospace" font-size="12" fill="#15803d">[Inhabited X]</text>

  <!-- Default element star -->
  <polygon points="400,385 404,397 417,397 407,405 410,417 400,410 390,417 393,405 383,397 396,397" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#166534">default : X</text>

  <!-- Arrows from X to both PROPs -->
  <path d="M 310 330 Q 200 300 170 285" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="210" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#16a34a" transform="rotate(-15, 210, 305)">structures on X</text>

  <path d="M 490 330 Q 600 300 630 285" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="585" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#16a34a" transform="rotate(15, 585, 305)">resolved structures</text>

  <!-- Bottom: The theorem statement -->
  <rect x="150" y="490" width="500" height="60" rx="10" fill="#1e293b"/>
  <text x="400" y="517" text-anchor="middle" font-family="monospace" font-size="13" fill="#a5f3fc">
    theorem ... {X : Type*} [Inhabited X] : True
  </text>
  <text x="400" y="538" text-anchor="middle" font-family="monospace" font-size="12" fill="#86efac">
    := by trivial   -- all coherence is automatic ✓
  </text>

  <!-- Coherence annotation -->
  <rect x="560" y="385" width="190" height="65" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="655" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#854d0e">Coherence Space</text>
  <text x="655" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#854d0e">is contractible</text>
  <text x="655" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#854d0e">⇒ unique structure ⇒ True</text>

  <path d="M 510 410 L 558 410" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Caption -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    Fig. 1: The Resolved PROP Principle — inhabitation of X trivializes all homotopical coherence conditions.
  </text>
</svg>
