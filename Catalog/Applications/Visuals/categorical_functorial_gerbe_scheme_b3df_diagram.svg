<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Categorical Functorial Gerbe Scheme
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal Property of the Trivial Gerbe on Inhabited Types
  </text>

  <!-- ===== LEFT: Inhabited Type X ===== -->
  <rect x="40" y="100" width="180" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="130" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">X : Type*</text>
  <text x="130" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">[Inhabited X]</text>
  <!-- Elements inside X -->
  <circle cx="80" cy="190" r="6" fill="#3b82f6" opacity="0.7"/>
  <circle cx="110" cy="195" r="6" fill="#3b82f6" opacity="0.5"/>
  <circle cx="140" cy="188" r="6" fill="#3b82f6" opacity="0.6"/>
  <circle cx="170" cy="192" r="6" fill="#3b82f6" opacity="0.4"/>
  <text x="130" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1e40af">witness: default</text>

  <!-- ===== CENTER: Functorial Gerbe ===== -->
  <ellipse cx="400" cy="160" rx="100" ry="60" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#92400e">Functorial</text>
  <text x="400" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#92400e">Gerbe</text>
  <text x="400" y="185" text-anchor="middle" font-family="monospace" font-size="10" fill="#b45309">Gerbe(X) → Prop</text>

  <!-- ===== RIGHT: True (Terminal Object) ===== -->
  <rect x="580" y="120" width="160" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="660" y="158" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#15803d">True</text>
  <text x="660" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">Terminal Object in Prop</text>

  <!-- Arrow: X → Gerbe -->
  <line x1="220" y1="160" x2="290" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="255" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2563eb">functor</text>

  <!-- Arrow: Gerbe → True -->
  <line x1="500" y1="160" x2="575" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowhead-green)"/>
  <text x="538" y="150" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#16a34a">trivial</text>

  <!-- ===== BOTTOM LEFT: Factoring Monoidal Category ===== -->
  <rect x="40" y="300" width="200" height="130" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="140" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#9d174d">Factoring Category</text>
  <text x="140" y="348" text-anchor="middle" font-family="monospace" font-size="10" fill="#be185d">n = a × b</text>
  <!-- Factorization tree -->
  <circle cx="140" cy="370" r="12" fill="#f9a8d4" stroke="#db2777" stroke-width="1"/>
  <text x="140" y="374" text-anchor="middle" font-family="monospace" font-size="9" fill="#9d174d">12</text>
  <line x1="130" y1="382" x2="100" y2="400" stroke="#db2777" stroke-width="1"/>
  <line x1="150" y1="382" x2="180" y2="400" stroke="#db2777" stroke-width="1"/>
  <circle cx="100" cy="408" r="10" fill="#fbcfe8" stroke="#db2777" stroke-width="1"/>
  <text x="100" y="412" text-anchor="middle" font-family="monospace" font-size="8" fill="#9d174d">1</text>
  <circle cx="180" cy="408" r="10" fill="#fbcfe8" stroke="#db2777" stroke-width="1"/>
  <text x="180" y="412" text-anchor="middle" font-family="monospace" font-size="8" fill="#9d174d">12</text>
  <text x="140" y="435" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#be185d" font-style="italic">trivial factorization = identity</text>

  <!-- ===== BOTTOM CENTER: Tropical Degeneration ===== -->
  <rect x="280" y="300" width="230" height="130" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="395" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#5b21b6">Tropical Semiring</text>
  <text x="395" y="348" text-anchor="middle" font-family="monospace" font-size="10" fill="#7c3aed">(ℝ ∪ {∞}, min, +)</text>
  <!-- Tropical polytope sketch -->
  <polyline points="310,400 350,370 420,390 460,360 490,400" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="310" cy="400" r="3" fill="#7c3aed"/>
  <circle cx="350" cy="370" r="3" fill="#7c3aed"/>
  <circle cx="420" cy="390" r="3" fill="#7c3aed"/>
  <circle cx="460" cy="360" r="3" fill="#7c3aed"/>
  <circle cx="490" cy="400" r="3" fill="#7c3aed"/>
  <text x="395" y="435" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6d28d9" font-style="italic">log(n) = log(a) + log(b)</text>

  <!-- ===== BOTTOM RIGHT: Spectral Sequence ===== -->
  <rect x="550" y="300" width="200" height="130" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="650" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#075985">Spectral Sequence</text>
  <!-- Grid for spectral sequence -->
  <line x1="580" y1="350" x2="580" y2="420" stroke="#0284c7" stroke-width="0.5" opacity="0.5"/>
  <line x1="620" y1="350" x2="620" y2="420" stroke="#0284c7" stroke-width="0.5" opacity="0.5"/>
  <line x1="660" y1="350" x2="660" y2="420" stroke="#0284c7" stroke-width="0.5" opacity="0.5"/>
  <line x1="700" y1="350" x2="700" y2="420" stroke="#0284c7" stroke-width="0.5" opacity="0.5"/>
  <line x1="580" y1="360" x2="720" y2="360" stroke="#0284c7" stroke-width="0.5" opacity="0.5"/>
  <line x1="580" y1="380" x2="720" y2="380" stroke="#0284c7" stroke-width="0.5" opacity="0.5"/>
  <line x1="580" y1="400" x2="720" y2="400" stroke="#0284c7" stroke-width="0.5" opacity="0.5"/>
  <line x1="580" y1="420" x2="720" y2="420" stroke="#0284c7" stroke-width="0.5" opacity="0.5"/>
  <!-- E_0 label -->
  <text x="600" y="372" text-anchor="middle" font-family="monospace" font-size="9" fill="#0369a1">E₀</text>
  <!-- Collapse indicator -->
  <text x="650" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#0284c7">⇒</text>
  <text x="700" y="372" text-anchor="middle" font-family="monospace" font-size="9" fill="#0369a1">E∞</text>
  <text x="650" y="415" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0369a1" font-style="italic">collapses at E₀</text>

  <!-- Connecting arrows from center to bottom -->
  <line x1="350" y1="220" x2="170" y2="295" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="220" x2="395" y2="295" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="220" x2="620" y2="295" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Labels on connecting arrows -->
  <text x="240" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569" transform="rotate(-20,240,258)">monoidal</text>
  <text x="388" y="260" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569">tropicalize</text>
  <text x="555" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569" transform="rotate(20,555,258)">filtration</text>

  <!-- ===== Central theorem box ===== -->
  <rect x="200" y="470" width="400" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="495" text-anchor="middle" font-family="monospace" font-size="11" fill="#f1f5f9">
    theorem ... {X : Type*} [Inhabited X] :
  </text>
  <text x="400" y="515" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#4ade80">
    True := by trivial
  </text>

  <!-- Caption -->
  <text x="400" y="565" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b" font-style="italic">
    The trivial gerbe on inhabited types: universal property, tropical degeneration, and spectral collapse.
  </text>
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#94a3b8">
    Every inhabited type maps canonically to True — the terminal object in Prop.
  </text>
</svg>
