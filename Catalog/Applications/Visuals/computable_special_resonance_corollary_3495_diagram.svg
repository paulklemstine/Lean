<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">
    Computable Special Resonance Corollary (3495)
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#666" font-style="italic">
    ∀ (X : Type*) [Inhabited X], True
  </text>

  <!-- === Left: Inhabited Types === -->
  <!-- Box for X -->
  <rect x="60" y="100" width="200" height="260" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">Inhabited Types</text>

  <!-- Type circles -->
  <circle cx="110" cy="170" r="22" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="175" text-anchor="middle" font-size="11" fill="#0d47a1">ℤ</text>

  <circle cx="210" cy="170" r="22" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="175" text-anchor="middle" font-size="11" fill="#0d47a1">ℝ</text>

  <circle cx="110" cy="240" r="22" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="245" text-anchor="middle" font-size="11" fill="#0d47a1">Mat₂</text>

  <circle cx="210" cy="240" r="22" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="245" text-anchor="middle" font-size="11" fill="#0d47a1">ℤ[x]</text>

  <circle cx="160" cy="310" r="22" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="160" y="315" text-anchor="middle" font-size="11" fill="#0d47a1">𝔽₇</text>

  <!-- Default element indicators -->
  <circle cx="110" cy="170" r="4" fill="#1565c0"/>
  <circle cx="210" cy="170" r="4" fill="#1565c0"/>
  <circle cx="110" cy="240" r="4" fill="#1565c0"/>
  <circle cx="210" cy="240" r="4" fill="#1565c0"/>
  <circle cx="160" cy="310" r="4" fill="#1565c0"/>

  <text x="160" y="355" text-anchor="middle" font-size="10" fill="#1565c0">● = default element</text>

  <!-- === Center: Arrow (Universal Morphism) === -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e65100"/>
    </marker>
  </defs>

  <!-- Main arrow -->
  <line x1="280" y1="230" x2="490" y2="230" stroke="#e65100" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="385" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">Resonance</text>
  <text x="385" y="250" text-anchor="middle" font-size="11" fill="#e65100" font-style="italic">trivial</text>

  <!-- === Right: True (Terminal Object) === -->
  <rect x="510" y="150" width="180" height="160" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="200" text-anchor="middle" font-size="36" font-weight="bold" fill="#2e7d32">⊤</text>
  <text x="600" y="230" text-anchor="middle" font-size="14" fill="#2e7d32">True</text>
  <text x="600" y="255" text-anchor="middle" font-size="11" fill="#4caf50" font-style="italic">Terminal Object</text>
  <text x="600" y="280" text-anchor="middle" font-size="10" fill="#66bb6a">unique morphism !</text>

  <!-- === Bottom: Yoneda Connection === -->
  <rect x="120" y="400" width="540" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="390" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">
    Yoneda Interpretation
  </text>
  <text x="390" y="445" text-anchor="middle" font-size="11" fill="#bf360c">
    Hom(X, 1) ≅ {★}  — exactly one morphism to the terminal object
  </text>

  <!-- Dashed lines connecting to Yoneda box -->
  <line x1="160" y1="370" x2="250" y2="400" stroke="#e65100" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="600" y1="310" x2="530" y2="400" stroke="#e65100" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === Top-right: Axiom Badge === -->
  <rect x="620" y="85" width="140" height="45" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="690" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">Zero Axioms</text>
  <text x="690" y="120" text-anchor="middle" font-size="10" fill="#e53935">Fully Constructive</text>

  <!-- Caption -->
  <text x="400" y="490" text-anchor="middle" font-size="10" fill="#888" font-style="italic">
    Every inhabited type maps uniquely to ⊤ via the trivial resonance morphism — a universal categorical fact.
  </text>
</svg>
