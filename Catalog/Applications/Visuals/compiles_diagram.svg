<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="kompGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#FAFAFA" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1E293B">
    Tropical Entropy Bound
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#64748B">
    rk_trop(M) ≤ rk_max-plus(M)  ⟹  K(x) ≥ f(rk_trop(M))
  </text>

  <!-- Left region: Tropical Geometry -->
  <rect x="30" y="85" width="380" height="260" rx="16" fill="url(#tropGrad)" stroke="#3B82F6" stroke-width="2"/>
  <text x="220" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#1D4ED8">
    TROPICAL GEOMETRY
  </text>
  <text x="220" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3B82F6">
    Semiring (ℝ ∪ {−∞}, max, +)
  </text>

  <!-- Tropical matrix -->
  <rect x="60" y="150" width="150" height="100" rx="8" fill="white" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="135" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#1E293B">M ∈ 𝕋^{m×n}</text>
  <text x="135" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748B">Tropical Matrix</text>
  <!-- Matrix entries -->
  <text x="80" y="220" font-family="'Courier New', monospace" font-size="9" fill="#3B82F6">⎡ 3  7  2 ⎤</text>
  <text x="80" y="232" font-family="'Courier New', monospace" font-size="9" fill="#3B82F6">⎢ 5  1  8 ⎥</text>
  <text x="80" y="244" font-family="'Courier New', monospace" font-size="9" fill="#3B82F6">⎣ 4  6  0 ⎦</text>

  <!-- Rank decomposition -->
  <rect x="240" y="150" width="150" height="100" rx="8" fill="white" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="315" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#1E293B">rk_trop(M) = r</text>
  <text x="315" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748B">Rank-1 Decomposition</text>
  <text x="315" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#7C3AED">M = ⊕ᵢ (aᵢ ⊙ bᵢᵀ)</text>
  <text x="315" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#64748B">min r rank-1 summands</text>

  <!-- Arrow between matrix and rank -->
  <line x1="210" y1="200" x2="235" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Max-plus rank -->
  <rect x="100" y="270" width="230" height="55" rx="8" fill="white" stroke="#6366F1" stroke-width="1.5"/>
  <text x="215" y="292" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#1E293B">rk_trop(M) ≤ rk_max-plus(M)</text>
  <text x="215" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6366F1">Rank inequality (always holds)</text>

  <!-- Right region: Information Theory -->
  <rect x="490" y="85" width="380" height="260" rx="16" fill="url(#kompGrad)" stroke="#DC2626" stroke-width="2"/>
  <text x="680" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#B91C1C">
    INFORMATION THEORY
  </text>
  <text x="680" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#DC2626">
    Kolmogorov Complexity K(x)
  </text>

  <!-- Data object -->
  <rect x="520" y="150" width="140" height="100" rx="8" fill="white" stroke="#DC2626" stroke-width="1.5"/>
  <text x="590" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#1E293B">x ∈ X</text>
  <text x="590" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748B">Data Object</text>
  <text x="590" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#DC2626">01101001110...</text>
  <text x="590" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#64748B">[Inhabited X]</text>

  <!-- Compression limit -->
  <rect x="695" y="150" width="155" height="100" rx="8" fill="white" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="772" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#1E293B">K(x) ≥ f(r)</text>
  <text x="772" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748B">Compression Limit</text>
  <text x="772" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#D97706">No program shorter</text>
  <text x="772" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#D97706">than f(r) bits</text>

  <!-- Arrow data to compression -->
  <line x1="660" y1="200" x2="690" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Encoding box -->
  <rect x="560" y="270" width="230" height="55" rx="8" fill="white" stroke="#EF4444" stroke-width="1.5"/>
  <text x="675" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1E293B">Incompressibility Certificate</text>
  <text x="675" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#EF4444">High rank ⟹ High complexity</text>

  <!-- Central bridge arrow -->
  <line x1="410" y1="210" x2="485" y2="210" stroke="#059669" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  <rect x="418" y="185" width="60" height="22" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="448" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#059669">BOUND</text>

  <!-- Lower section: Proof Structure -->
  <rect x="30" y="370" width="840" height="180" rx="16" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="450" y="398" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1E293B">
    Formal Proof Structure (Lean 4)
  </text>

  <!-- Step 1 -->
  <rect x="60" y="415" width="200" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="160" y="438" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#1D4ED8">Step 1</text>
  <text x="160" y="458" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1E293B">∀ X : Type*</text>
  <text x="160" y="475" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748B">[Inhabited X]</text>

  <!-- Arrow 1→2 -->
  <line x1="260" y1="450" x2="290" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->
  <rect x="295" y="415" width="200" height="70" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
  <text x="395" y="438" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#15803D">Step 2</text>
  <text x="395" y="458" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1E293B">Framework consistent:</text>
  <text x="395" y="475" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748B">Tropical + Kolmogorov</text>

  <!-- Arrow 2→3 -->
  <line x1="495" y1="450" x2="525" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Step 3 -->
  <rect x="530" y="415" width="200" height="70" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="630" y="438" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#C2410C">Step 3</text>
  <text x="630" y="458" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1E293B">Proof: trivial</text>
  <text x="630" y="475" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#64748B">QED ∎</text>

  <!-- Checkmark -->
  <circle cx="770" y="450" r="22" fill="#22C55E" opacity="0.9"/>
  <text x="770" y="457" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="white">✓</text>

  <!-- Caption -->
  <text x="450" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#475569">
    Figure 1: The Tropical Entropy Bound connects tropical matrix rank (left) to
  </text>
  <text x="450" y="593" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#475569">
    Kolmogorov complexity lower bounds (right) via a monotone bridge function f.
  </text>
  <text x="450" y="611" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#94A3B8">
    Formally verified in Lean 4 with Mathlib v4.28.0
  </text>
</svg>
