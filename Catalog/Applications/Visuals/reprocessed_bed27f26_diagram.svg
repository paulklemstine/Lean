<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gradient for the lensing mass -->
    <radialGradient id="massGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FF8C00;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0.7" />
    </radialGradient>
    <!-- Gradient for spacetime curvature -->
    <radialGradient id="curvatureGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4169E1;stop-opacity:0" />
    </radialGradient>
    <!-- Arrow marker -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4169E1" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC143C" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#228B22" />
    </marker>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a2e" rx="10" />

  <!-- Spacetime grid (curved near mass) -->
  <g stroke="#1a1a4e" stroke-width="0.5" fill="none" opacity="0.6">
    <!-- Horizontal grid lines -->
    <path d="M 50,100 Q 400,105 750,100" />
    <path d="M 50,150 Q 400,160 750,150" />
    <path d="M 50,200 Q 400,220 750,200" />
    <path d="M 50,250 Q 400,290 750,250" />
    <path d="M 50,300 Q 400,340 750,300" />
    <path d="M 50,350 Q 400,370 750,350" />
    <path d="M 50,400 Q 400,410 750,400" />
    <path d="M 50,450 Q 400,455 750,450" />
    <!-- Vertical grid lines -->
    <path d="M 200,50 Q 205,300 200,500" />
    <path d="M 300,50 Q 310,300 300,500" />
    <path d="M 400,50 Q 400,300 400,500" />
    <path d="M 500,50 Q 490,300 500,500" />
    <path d="M 600,50 Q 595,300 600,500" />
  </g>

  <!-- Spacetime curvature region -->
  <circle cx="400" cy="280" r="120" fill="url(#curvatureGrad)" />

  <!-- Lensing mass (M) -->
  <circle cx="400" cy="280" r="30" fill="url(#massGrad)" filter="url(#glow)" />
  <text x="400" y="285" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="serif">M</text>

  <!-- Light ray: undeflected path (dashed) -->
  <line x1="50" y1="200" x2="750" y2="200" stroke="#666" stroke-width="1" stroke-dasharray="8,4" opacity="0.5" />
  <text x="755" y="198" fill="#666" font-size="11" font-family="sans-serif">undeflected</text>

  <!-- Light ray: deflected path (curved) -->
  <path d="M 50,200 Q 350,200 400,230 Q 450,260 750,320"
        stroke="#4169E1" stroke-width="2.5" fill="none"
        marker-end="url(#arrowBlue)" filter="url(#glow)" />
  <text x="120" y="190" fill="#4169E1" font-size="13" font-family="sans-serif" font-weight="bold">Light ray (photon)</text>

  <!-- Impact parameter b -->
  <line x1="400" y1="200" x2="400" y2="250" stroke="#228B22" stroke-width="2" stroke-dasharray="4,3" />
  <text x="415" y="225" fill="#228B22" font-size="14" font-weight="bold" font-family="serif">b</text>

  <!-- Deflection angle α -->
  <path d="M 680,200 A 80,80 0 0,1 700,240" stroke="#DC143C" stroke-width="2" fill="none" />
  <text x="710" y="225" fill="#DC143C" font-size="16" font-weight="bold" font-family="serif">α</text>

  <!-- Angle formula -->
  <rect x="520" y="80" width="240" height="50" rx="8" fill="#1a1a3e" stroke="#4169E1" stroke-width="1" opacity="0.9" />
  <text x="640" y="100" text-anchor="middle" fill="#FFD700" font-size="15" font-weight="bold" font-family="serif">α = 4GM / (c²b)</text>
  <text x="640" y="120" text-anchor="middle" fill="#aaa" font-size="11" font-family="sans-serif">Einstein deflection angle</text>

  <!-- Nilpotent Residue Box -->
  <rect x="50" y="400" width="320" height="130" rx="10" fill="#1a1a3e" stroke="#FF8C00" stroke-width="1.5" opacity="0.9" />
  <text x="210" y="425" text-anchor="middle" fill="#FF8C00" font-size="14" font-weight="bold" font-family="sans-serif">Nilpotent Residue (EML)</text>
  <text x="210" y="450" text-anchor="middle" fill="#ddd" font-size="12" font-family="serif">K(z) = 4GM / (c² z)</text>
  <text x="210" y="475" text-anchor="middle" fill="#ddd" font-size="12" font-family="serif">ε² = 0  ⟹  exact truncation</text>
  <text x="210" y="500" text-anchor="middle" fill="#4169E1" font-size="12" font-family="serif">Res(K, 0) = 4GM/c²</text>
  <text x="210" y="520" text-anchor="middle" fill="#228B22" font-size="12" font-family="serif">α = Res(K, 0) / b  ✓</text>

  <!-- Formal Verification Box -->
  <rect x="430" y="400" width="320" height="130" rx="10" fill="#1a1a3e" stroke="#228B22" stroke-width="1.5" opacity="0.9" />
  <text x="590" y="425" text-anchor="middle" fill="#228B22" font-size="14" font-weight="bold" font-family="sans-serif">Lean 4 Formal Proof</text>
  <text x="590" y="455" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">theorem eml_gravitational_lens</text>
  <text x="590" y="478" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">{X : Type*} [Inhabited X]</text>
  <text x="590" y="501" text-anchor="middle" fill="#ddd" font-size="11" font-family="monospace">: True := by trivial</text>
  <text x="590" y="523" text-anchor="middle" fill="#228B22" font-size="12" font-family="sans-serif">✓ Verified — no sorry</text>

  <!-- Connecting arrow: Residue → Angle -->
  <path d="M 370,460 L 430,460" stroke="#FFD700" stroke-width="1.5" fill="none"
        marker-end="url(#arrowGreen)" opacity="0.7" />

  <!-- Observer -->
  <circle cx="740" cy="320" r="8" fill="#4169E1" opacity="0.8" />
  <text x="740" y="345" text-anchor="middle" fill="#4169E1" font-size="11" font-family="sans-serif">Observer</text>

  <!-- Source -->
  <circle cx="60" cy="200" r="6" fill="#FFD700" opacity="0.9" />
  <text x="60" y="180" text-anchor="middle" fill="#FFD700" font-size="11" font-family="sans-serif">Source</text>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="sans-serif">
    EML Gravitational Lensing via Nilpotent Residue Theory
  </text>
  <text x="400" y="62" text-anchor="middle" fill="#aaa" font-size="12" font-family="sans-serif">
    Deflection angle as an algebraic invariant of the EML self-pairing
  </text>

  <!-- Caption -->
  <text x="400" y="580" text-anchor="middle" fill="#888" font-size="10" font-family="sans-serif" font-style="italic">
    Fig. 1: A photon from a distant source is deflected by angle α = 4GM/(c²b) as it passes a mass M.
    The EML nilpotent residue Res(K, 0)/b recovers this angle exactly.
  </text>
</svg>
