<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Arithmetic Natural Restriction Method
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Universal Property via Tropical Duality
  </text>

  <!-- ===== LEFT: Entropy Algebra ===== -->
  <rect x="40" y="90" width="200" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Entropy Algebra</text>
  <text x="140" y="140" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e3a5f">𝒜 = (Dist(X), ⊕, ⊗)</text>
  <text x="140" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">⊕ = mixture</text>
  <text x="140" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">⊗ = independent coupling</text>
  <text x="140" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2563eb">Shannon entropy H(p)</text>

  <!-- ===== RIGHT: Tropical Dual ===== -->
  <rect x="560" y="90" width="200" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Tropical Dual</text>
  <text x="660" y="140" text-anchor="middle" font-family="monospace" font-size="12" fill="#7f1d1d">𝒜ᵗʳᵒᵖ = (X, max, +)</text>
  <text x="660" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">⊕ₜ = max(a, b)</text>
  <text x="660" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">⊗ₜ = a + b</text>
  <text x="660" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#dc2626">Max-plus entropy</text>

  <!-- Arrow: Tropicalization -->
  <line x1="245" y1="130" x2="555" y2="130" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  <text x="400" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">Tropicalization Functor</text>

  <!-- Arrow: Duality (back) -->
  <line x1="555" y1="170" x2="245" y2="170" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  <text x="400" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c3aed">(involutive duality)</text>

  <!-- ===== CENTER: Inhabited Type X ===== -->
  <rect x="300" y="240" width="200" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534">Inhabited Type X</text>
  <text x="400" y="290" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">[Inhabited X]</text>
  <text x="400" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">default : X (= x₀)</text>

  <!-- ===== BOTTOM LEFT: Natural Restriction ===== -->
  <rect x="80" y="380" width="200" height="100" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="180" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#854d0e">Natural Restriction</text>
  <text x="180" y="428" text-anchor="middle" font-family="monospace" font-size="11" fill="#854d0e">ρ : 𝒜 → 𝒜ₓ₀</text>
  <text x="180" y="450" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Fiber over default</text>
  <text x="180" y="468" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">p ↦ p(x₀)</text>

  <!-- ===== BOTTOM RIGHT: Universal Property ===== -->
  <rect x="520" y="380" width="200" height="100" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="620" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6b21a8">Universal Property</text>
  <text x="620" y="430" text-anchor="middle" font-family="monospace" font-size="12" fill="#6b21a8">True</text>
  <text x="620" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Terminal object in Prop</text>
  <text x="620" y="470" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Proof: trivial</text>

  <!-- Arrow: X → Entropy Algebra -->
  <line x1="340" y1="260" x2="240" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Arrow: X → Tropical -->
  <line x1="460" y1="260" x2="560" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Arrow: Entropy → Restriction -->
  <line x1="140" y1="215" x2="170" y2="375" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="120" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2563eb" transform="rotate(-80, 120, 300)">restrict to x₀</text>

  <!-- Arrow: Restriction → Universal Property -->
  <line x1="285" y1="430" x2="515" y2="430" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e">satisfies</text>

  <!-- Arrow: Tropical → Universal Property -->
  <line x1="660" y1="215" x2="630" y2="375" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="680" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#dc2626" transform="rotate(80, 680, 300)">tropical dual</text>

  <!-- ===== BOTTOM CENTER: Complexity Connection ===== -->
  <rect x="280" y="510" width="240" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="533" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Tropical Rank ≈ Kolmogorov Complexity</text>
  <text x="400" y="550" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Compressibility invariant for complexity theory</text>

  <!-- Arrow: Universal Property → Complexity -->
  <line x1="560" y1="480" x2="480" y2="510" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Arrow: Restriction → Complexity -->
  <line x1="240" y1="480" x2="320" y2="510" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Caption -->
  <text x="400" y="588" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#64748b">
    Figure: Categorical structure of the arithmetic natural restriction method connecting entropy algebra to tropical duality.
  </text>
</svg>
