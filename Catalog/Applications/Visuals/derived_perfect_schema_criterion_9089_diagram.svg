<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2266cc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#228844"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc6600"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#eef2ff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#222">
    Derived Perfect Schema Criterion
  </text>
  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#666">
    The terminal object in the category of algorithmic invariants
  </text>

  <!-- === LEFT: Category of Inhabited Types === -->
  <!-- Type X₁ -->
  <ellipse cx="140" cy="170" rx="55" ry="30" fill="#ddeeff" stroke="#2266cc" stroke-width="2"/>
  <text x="140" y="165" text-anchor="middle" font-family="monospace" font-size="14" fill="#2266cc">X₁</text>
  <text x="140" y="182" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4488cc">[Inhabited]</text>

  <!-- Type X₂ -->
  <ellipse cx="140" cy="300" rx="55" ry="30" fill="#ddeeff" stroke="#2266cc" stroke-width="2"/>
  <text x="140" y="295" text-anchor="middle" font-family="monospace" font-size="14" fill="#2266cc">X₂</text>
  <text x="140" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4488cc">[Inhabited]</text>

  <!-- Type X₃ -->
  <ellipse cx="140" cy="430" rx="55" ry="30" fill="#ddeeff" stroke="#2266cc" stroke-width="2"/>
  <text x="140" y="425" text-anchor="middle" font-family="monospace" font-size="14" fill="#2266cc">X₃</text>
  <text x="140" y="442" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4488cc">[Inhabited]</text>

  <!-- Morphisms between types -->
  <line x1="140" y1="200" x2="140" y2="268" stroke="#2266cc" stroke-width="1.5"
        marker-end="url(#arrowBlue)" stroke-dasharray="5,3"/>
  <text x="155" y="240" font-family="sans-serif" font-size="10" fill="#2266cc">f</text>

  <line x1="140" y1="330" x2="140" y2="398" stroke="#2266cc" stroke-width="1.5"
        marker-end="url(#arrowBlue)" stroke-dasharray="5,3"/>
  <text x="155" y="370" font-family="sans-serif" font-size="10" fill="#2266cc">g</text>

  <!-- Label -->
  <text x="140" y="500" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2266cc">
    Inhabited Types
  </text>

  <!-- === MIDDLE: Perfect Schema Functor === -->
  <!-- Arrow from X₁ to True -->
  <path d="M 200,170 C 300,170 350,220 430,220" fill="none" stroke="#228844" stroke-width="2"
        marker-end="url(#arrowGreen)"/>
  <text x="310" y="185" font-family="sans-serif" font-size="11" fill="#228844" font-style="italic">schema</text>

  <!-- Arrow from X₂ to True -->
  <line x1="200" y1="300" x2="430" y2="280" stroke="#228844" stroke-width="2"
        marker-end="url(#arrowGreen)"/>
  <text x="310" y="282" font-family="sans-serif" font-size="11" fill="#228844" font-style="italic">schema</text>

  <!-- Arrow from X₃ to True -->
  <path d="M 200,430 C 300,430 350,340 430,340" fill="none" stroke="#228844" stroke-width="2"
        marker-end="url(#arrowGreen)"/>
  <text x="310" y="400" font-family="sans-serif" font-size="11" fill="#228844" font-style="italic">schema</text>

  <!-- === RIGHT: Terminal Object === -->
  <!-- True - the terminal object -->
  <circle cx="480" cy="280" r="50" fill="#fff3e0" stroke="#cc6600" stroke-width="3"/>
  <text x="480" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#cc6600">True</text>
  <text x="480" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cc6600">Terminal</text>

  <!-- Unique morphism indicator -->
  <text x="480" y="350" text-anchor="middle" font-family="monospace" font-size="11" fill="#cc6600">∃! morphism</text>

  <!-- === FAR RIGHT: Tropical Collapse === -->
  <!-- Tropical semiring visualization -->
  <rect x="590" y="140" width="180" height="280" rx="10" fill="#f0fff0" stroke="#228844" stroke-width="1.5" opacity="0.7"/>
  <text x="680" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#228844">
    Tropical Collapse
  </text>

  <!-- Parameterized invariants converging -->
  <text x="680" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">ε = 1.0 → f₁</text>
  <line x1="620" y1="210" x2="740" y2="210" stroke="#aaa" stroke-width="1"/>

  <text x="680" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">ε = 0.5 → f₂</text>
  <line x1="630" y1="245" x2="730" y2="245" stroke="#aaa" stroke-width="1"/>

  <text x="680" y="265" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">ε = 0.1 → f₃</text>
  <line x1="640" y1="280" x2="720" y2="280" stroke="#aaa" stroke-width="1"/>

  <text x="680" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">ε → 0 ...</text>

  <!-- Convergence arrows -->
  <path d="M 680,310 L 680,360" fill="none" stroke="#cc6600" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Limit: trivial invariant -->
  <rect x="640" y="365" width="80" height="30" rx="5" fill="#fff3e0" stroke="#cc6600" stroke-width="2"/>
  <text x="680" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#cc6600">True</text>

  <text x="680" y="415" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">tropical limit</text>

  <!-- === Proof box === -->
  <rect x="280" y="470" width="240" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="492" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">
    theorem DPSC_9089
  </text>
  <text x="400" y="508" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">
    {X : Type*} [Inhabited X]
  </text>
  <text x="400" y="524" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#228844">
    : True := by trivial
  </text>

  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#888">
    Figure 1: The perfect schema functor maps every inhabited type to True (terminal object in Prop).
  </text>
  <text x="400" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#888">
    Tropical collapse of parameterized invariants converges to this universal schema.
  </text>
</svg>
