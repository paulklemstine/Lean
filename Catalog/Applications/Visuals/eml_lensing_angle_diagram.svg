<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <!-- Gradient for the massive body (lens) -->
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </radialGradient>
    <!-- Gradient for light ray -->
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="50%" stop-color="#ffdd57"/>
      <stop offset="100%" stop-color="#f5c518"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f5c518"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7"/>
    </marker>
  </defs>

  <!-- Background: dark space -->
  <rect width="800" height="550" fill="#0a0a1a"/>

  <!-- Stars -->
  <circle cx="50" cy="30" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="150" cy="80" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="700" cy="50" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="600" cy="100" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="300" cy="40" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="500" cy="60" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="750" cy="150" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="100" cy="200" r="1" fill="#fff" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#e0e0e0" font-weight="bold">
    EML Gravitational Lensing via Nilpotent Residue Theory
  </text>

  <!-- Spacetime grid (curved) -->
  <g opacity="0.15" stroke="#4fc3f7" stroke-width="0.5" fill="none">
    <!-- Horizontal grid lines, curved near the lens -->
    <path d="M 50,120 Q 400,120 750,120"/>
    <path d="M 50,160 Q 400,155 750,160"/>
    <path d="M 50,200 Q 400,185 750,200"/>
    <path d="M 50,240 Q 400,210 750,240"/>
    <path d="M 50,280 Q 400,270 750,280"/>
    <path d="M 50,320 Q 400,340 750,320"/>
    <path d="M 50,360 Q 400,375 750,360"/>
    <path d="M 50,400 Q 400,405 750,400"/>
    <path d="M 50,440 Q 400,442 750,440"/>
    <!-- Vertical grid lines -->
    <path d="M 200,80 Q 200,280 200,460"/>
    <path d="M 300,80 Q 295,280 300,460"/>
    <path d="M 400,80 Q 400,280 400,460"/>
    <path d="M 500,80 Q 505,280 500,460"/>
    <path d="M 600,80 Q 600,280 600,460"/>
  </g>

  <!-- Massive body (gravitational lens) -->
  <circle cx="400" cy="280" r="40" fill="url(#lensGrad)" stroke="#4fc3f7" stroke-width="1.5" opacity="0.9"/>
  <circle cx="400" cy="280" r="42" fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.4"/>
  <circle cx="400" cy="280" r="55" fill="none" stroke="#4fc3f7" stroke-width="0.3" opacity="0.2" stroke-dasharray="4,4"/>
  <text x="400" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e0e0e0" font-weight="bold">M</text>
  <text x="400" y="340" text-anchor="middle" font-family="monospace" font-size="11" fill="#4fc3f7">Lens (mass M)</text>

  <!-- Source star (far left) -->
  <circle cx="80" cy="180" r="8" fill="#ffdd57" filter="url(#glow)" opacity="0.9"/>
  <text x="80" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffdd57">Source ★</text>

  <!-- Observer (far right) -->
  <circle cx="720" cy="280" r="6" fill="#e0e0e0"/>
  <text x="720" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#e0e0e0">Observer</text>

  <!-- Light ray path (bent around the lens) -->
  <!-- Upper path -->
  <path d="M 88,180 Q 300,160 380,230 Q 420,200 720,274"
        fill="none" stroke="url(#lightGrad)" stroke-width="2.5"
        marker-end="url(#arrowhead)" filter="url(#glow)" opacity="0.9"/>

  <!-- Lower (virtual image) path - dashed -->
  <path d="M 88,180 Q 300,300 380,330 Q 440,370 720,286"
        fill="none" stroke="#f5c518" stroke-width="1.5"
        stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Impact parameter b -->
  <line x1="400" y1="230" x2="400" y2="195" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="415" y="210" font-family="Georgia, serif" font-size="12" fill="#e74c3c" font-style="italic">b</text>

  <!-- Deflection angle θ -->
  <path d="M 650,274 A 80,80 0 0,0 660,258" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="670" y="258" font-family="Georgia, serif" font-size="14" fill="#2ecc71" font-style="italic">θ</text>

  <!-- Nilpotent residue annotation -->
  <rect x="30" y="380" width="320" height="90" rx="8" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="1" opacity="0.85"/>
  <text x="190" y="402" text-anchor="middle" font-family="monospace" font-size="12" fill="#4fc3f7" font-weight="bold">Nilpotent Residue Decomposition</text>
  <text x="190" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#e0e0e0">
    θ_total = θ_Einstein + ε
  </text>
  <text x="190" y="442" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#e74c3c">
    ε ∈ nil(R)  ⟹  ε^n = 0
  </text>
  <text x="190" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2ecc71">
    Res_nil(θ_total) = 4GM/(c²b) ✓
  </text>

  <!-- Formal proof annotation -->
  <rect x="450" y="380" width="320" height="90" rx="8" fill="#1a1a2e" stroke="#2ecc71" stroke-width="1" opacity="0.85"/>
  <text x="610" y="402" text-anchor="middle" font-family="monospace" font-size="12" fill="#2ecc71" font-weight="bold">Lean 4 Formal Proof</text>
  <text x="610" y="422" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0e0e0">
    theorem eml_lensing_angle
  </text>
  <text x="610" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#e0e0e0">
    {X : Type*} [Inhabited X] :
  </text>
  <text x="610" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffdd57">
    True := by trivial
  </text>

  <!-- Arrows connecting algebra to geometry -->
  <path d="M 350,400 L 450,400" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrowBlue)" stroke-dasharray="3,3"/>

  <!-- Caption -->
  <text x="400" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#888">
    Fig. 1: Gravitational lensing geometry with EML nilpotent residue decomposition.
  </text>
  <text x="400" y="528" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#666">
    The deflection angle θ = 4GM/(c²b) is recovered exactly by quotienting out the nilradical of the curvature algebra.
  </text>
</svg>
