<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
    <linearGradient id="blochGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4e9f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9e7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdebd0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Quantum Berggren Superposition
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7f8c8d">
    Pythagorean Triples as Quantum State Amplitudes
  </text>

  <!-- ═══ LEFT PANEL: Berggren Tree ═══ -->
  <rect x="20" y="70" width="420" height="420" fill="url(#treeGrad)" rx="8" stroke="#d4a574" stroke-width="1.5"/>
  <text x="230" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8b4513">
    Berggren Tree (State Space)
  </text>

  <!-- Root node: (3,4,5) -->
  <circle cx="230" cy="140" r="22" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="230" y="144" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">(3,4,5)</text>

  <!-- Level 1: Three children -->
  <!-- Matrix A child: (5,12,13) -->
  <line x1="215" y1="160" x2="100" y2="220" stroke="#e74c3c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="235" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="100" y="239" text-anchor="middle" font-family="monospace" font-size="9" fill="white" font-weight="bold">(5,12,13)</text>
  <text x="145" y="195" font-family="Arial" font-size="9" fill="#e74c3c" font-weight="bold">A</text>

  <!-- Matrix B child: (21,20,29) -->
  <line x1="230" y1="162" x2="230" y2="220" stroke="#e74c3c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="230" cy="235" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="230" y="239" text-anchor="middle" font-family="monospace" font-size="8" fill="white" font-weight="bold">(21,20,29)</text>
  <text x="240" y="195" font-family="Arial" font-size="9" fill="#e74c3c" font-weight="bold">B</text>

  <!-- Matrix C child: (15,8,17) -->
  <line x1="245" y1="160" x2="360" y2="220" stroke="#e74c3c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="360" cy="235" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="360" y="239" text-anchor="middle" font-family="monospace" font-size="8" fill="white" font-weight="bold">(15,8,17)</text>
  <text x="315" y="195" font-family="Arial" font-size="9" fill="#e74c3c" font-weight="bold">C</text>

  <!-- Level 2 nodes (children of (5,12,13)) -->
  <line x1="85" y1="253" x2="50" y2="310" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <circle cx="50" cy="322" r="16" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="50" y="326" text-anchor="middle" font-family="monospace" font-size="7" fill="white">(7,24,25)</text>

  <line x1="100" y1="255" x2="100" y2="310" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="322" r="16" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="100" y="326" text-anchor="middle" font-family="monospace" font-size="6" fill="white">(55,48,73)</text>

  <line x1="115" y1="253" x2="150" y2="310" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <circle cx="150" cy="322" r="16" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="150" y="326" text-anchor="middle" font-family="monospace" font-size="6" fill="white">(45,28,53)</text>

  <!-- Children of (21,20,29) — abbreviated -->
  <line x1="218" y1="253" x2="200" y2="310" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="322" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="200" y="326" text-anchor="middle" font-family="monospace" font-size="5" fill="white">···</text>

  <line x1="230" y1="255" x2="240" y2="310" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <circle cx="240" cy="322" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="240" y="326" text-anchor="middle" font-family="monospace" font-size="5" fill="white">···</text>

  <line x1="242" y1="253" x2="280" y2="310" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <circle cx="280" cy="322" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="280" y="326" text-anchor="middle" font-family="monospace" font-size="5" fill="white">···</text>

  <!-- Children of (15,8,17) — abbreviated -->
  <line x1="348" y1="253" x2="320" y2="310" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <circle cx="320" cy="322" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="320" y="326" text-anchor="middle" font-family="monospace" font-size="5" fill="white">···</text>

  <line x1="360" y1="255" x2="360" y2="310" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <circle cx="360" cy="322" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="360" y="326" text-anchor="middle" font-family="monospace" font-size="5" fill="white">···</text>

  <line x1="372" y1="253" x2="400" y2="310" stroke="#3498db" stroke-width="1" opacity="0.4"/>
  <circle cx="400" cy="322" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="400" y="326" text-anchor="middle" font-family="monospace" font-size="5" fill="white">···</text>

  <!-- Tree legend -->
  <circle cx="55" cy="380" r="8" fill="#e74c3c"/>
  <text x="70" y="384" font-family="Arial" font-size="10" fill="#333">Depth 0 (root)</text>
  <circle cx="55" cy="400" r="8" fill="#3498db"/>
  <text x="70" y="404" font-family="Arial" font-size="10" fill="#333">Depth 1</text>
  <circle cx="55" cy="420" r="8" fill="#2ecc71"/>
  <text x="70" y="424" font-family="Arial" font-size="10" fill="#333">Depth 2+</text>

  <!-- Encoding formula -->
  <text x="230" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c3e50">
    (a, b, c) → |ψ⟩ = (a/c)|0⟩ + (b/c)|1⟩
  </text>

  <!-- ═══ ARROW between panels ═══ -->
  <line x1="450" y1="280" x2="475" y2="280" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="462" y="270" text-anchor="middle" font-family="Arial" font-size="10" fill="#555" transform="rotate(-90, 462, 270)">encode</text>

  <!-- ═══ RIGHT PANEL: Unit Circle / Bloch Sphere ═══ -->
  <rect x="480" y="70" width="400" height="420" fill="url(#blochGrad)" rx="8" stroke="#5dade2" stroke-width="1.5"/>
  <text x="680" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a5276">
    Quantum States on Unit Circle
  </text>

  <!-- Unit circle -->
  <circle cx="680" cy="290" r="160" fill="none" stroke="#85c1e9" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <line x1="500" y1="290" x2="860" y2="290" stroke="#aab7b8" stroke-width="0.8"/>
  <line x1="680" y1="110" x2="680" y2="470" stroke="#aab7b8" stroke-width="0.8"/>
  <text x="865" y="294" font-family="Arial" font-size="10" fill="#7f8c8d">α</text>
  <text x="684" y="108" font-family="Arial" font-size="10" fill="#7f8c8d">β</text>

  <!-- Quantum states plotted on the unit circle (first quadrant) -->
  <!-- (3,4,5): α=0.6, β=0.8 → x=680+0.6*160=776, y=290-0.8*160=162 -->
  <circle cx="776" cy="162" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="790" y="158" font-family="monospace" font-size="9" fill="#e74c3c">(3,4,5)</text>
  <line x1="680" y1="290" x2="776" y2="162" stroke="#e74c3c" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- (5,12,13): α=0.385, β=0.923 → x=741, y=142 -->
  <circle cx="741" cy="142" r="7" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="750" y="137" font-family="monospace" font-size="8" fill="#3498db">(5,12,13)</text>
  <line x1="680" y1="290" x2="741" y2="142" stroke="#3498db" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- (21,20,29): α=0.724, β=0.690 → x=796, y=180 -->
  <circle cx="796" cy="180" r="7" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="808" y="178" font-family="monospace" font-size="8" fill="#3498db">(21,20,29)</text>
  <line x1="680" y1="290" x2="796" y2="180" stroke="#3498db" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- (15,8,17): α=0.882, β=0.471 → x=821, y=215 -->
  <circle cx="821" cy="215" r="7" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="833" y="212" font-family="monospace" font-size="8" fill="#3498db">(15,8,17)</text>
  <line x1="680" y1="290" x2="821" y2="215" stroke="#3498db" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- (7,24,25): α=0.28, β=0.96 → x=725, y=137 -->
  <circle cx="725" cy="137" r="6" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="695" y="125" font-family="monospace" font-size="7" fill="#2ecc71">(7,24,25)</text>

  <!-- Additional depth-2 states as small dots -->
  <circle cx="760" cy="132" r="4" fill="#2ecc71" opacity="0.7"/>
  <circle cx="810" cy="150" r="4" fill="#2ecc71" opacity="0.7"/>
  <circle cx="830" cy="190" r="4" fill="#2ecc71" opacity="0.7"/>
  <circle cx="835" cy="240" r="4" fill="#2ecc71" opacity="0.7"/>
  <circle cx="710" cy="138" r="4" fill="#2ecc71" opacity="0.7"/>

  <!-- |0⟩ and |1⟩ basis labels -->
  <text x="845" y="306" font-family="Georgia, serif" font-size="12" fill="#1a5276" font-weight="bold">|0⟩</text>
  <text x="665" y="120" font-family="Georgia, serif" font-size="12" fill="#1a5276" font-weight="bold">|1⟩</text>

  <!-- Normalization annotation -->
  <rect x="510" y="400" width="340" height="45" fill="white" rx="5" stroke="#85c1e9" stroke-width="1"/>
  <text x="680" y="418" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c3e50">
    α² + β² = (a/c)² + (b/c)² = (a² + b²)/c² = 1
  </text>
  <text x="680" y="436" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">
    Pythagorean identity ⟺ quantum normalization
  </text>

  <!-- ═══ BOTTOM: Correspondence Table ═══ -->
  <rect x="20" y="500" width="860" height="110" fill="white" rx="8" stroke="#bdc3c7" stroke-width="1"/>
  <text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
    Number Theory ↔ Quantum Mechanics Correspondence
  </text>

  <!-- Table rows -->
  <line x1="40" y1="535" x2="860" y2="535" stroke="#ecf0f1" stroke-width="1"/>

  <text x="230" y="555" text-anchor="middle" font-family="Arial" font-size="11" fill="#8b4513" font-weight="bold">Number Theory</text>
  <text x="450" y="555" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">↔</text>
  <text x="670" y="555" text-anchor="middle" font-family="Arial" font-size="11" fill="#1a5276" font-weight="bold">Quantum Mechanics</text>

  <text x="230" y="575" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Pythagorean triple (a,b,c)</text>
  <text x="450" y="575" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">↔</text>
  <text x="670" y="575" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Qubit state |ψ⟩</text>

  <text x="230" y="592" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">a² + b² = c²</text>
  <text x="450" y="592" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">↔</text>
  <text x="670" y="592" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">⟨ψ|ψ⟩ = 1 (normalization)</text>

  <text x="230" y="605" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">gcd(a,b) = 1 (coprimality)</text>
  <text x="450" y="605" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">↔</text>
  <text x="670" y="605" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Orthogonality of states</text>

  <!-- Caption -->
  <text x="450" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#95a5a6" font-style="italic">
    Figure 1: The Berggren tree generates all primitive Pythagorean triples, each encoding a normalized quantum state on the unit circle.
  </text>
</svg>
