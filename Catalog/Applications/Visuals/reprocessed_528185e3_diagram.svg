<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="reluGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1a1a1a">ReLU Networks as Tropical Rational Maps</text>

  <!-- ===== LEFT PANEL: ReLU / Neural Network ===== -->
  <rect x="20" y="55" width="280" height="240" fill="url(#reluGrad)" stroke="#FF5722" stroke-width="1.5" rx="8"/>
  <text x="160" y="78" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#D84315">Neural Network (ReLU)</text>

  <!-- ReLU graph -->
  <g transform="translate(50, 95)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#888" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="160" stroke="#888" stroke-width="1"/>
    <text x="205" y="104" font-family="Arial" font-size="11" fill="#666">x</text>
    <text x="104" y="-5" font-family="Arial" font-size="11" fill="#666">y</text>

    <!-- ReLU function: flat at 0 for x<0, slope 1 for x>0 -->
    <polyline points="0,100 100,100 200,0" fill="none" stroke="#FF5722" stroke-width="3"/>

    <!-- Labels -->
    <text x="30" y="90" font-family="Arial" font-size="11" fill="#FF5722">y = 0</text>
    <text x="140" y="35" font-family="Arial" font-size="11" fill="#FF5722">y = x</text>
    <text x="100" y="150" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#D84315">relu(x) = max(x, 0)</text>

    <!-- Breakpoint -->
    <circle cx="100" cy="100" r="4" fill="#FF5722"/>
  </g>

  <!-- ===== CENTER: Correspondence Arrow ===== -->
  <g transform="translate(310, 130)">
    <rect x="0" y="0" width="280" height="80" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="8"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2E7D32">Tropical Correspondence</text>
    <text x="140" y="48" text-anchor="middle" font-family="monospace" font-size="13" fill="#1B5E20">relu(x) = x ⊕ 0</text>
    <text x="140" y="68" text-anchor="middle" font-family="Arial" font-size="11" fill="#388E3C">where ⊕ = max (tropical addition)</text>
  </g>

  <!-- Left arrow -->
  <line x1="300" y1="170" x2="315" y2="170" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Right arrow -->
  <line x1="585" y1="170" x2="600" y2="170" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ===== RIGHT PANEL: Tropical Polynomial ===== -->
  <rect x="600" y="55" width="280" height="240" fill="url(#tropGrad)" stroke="#2196F3" stroke-width="1.5" rx="8"/>
  <text x="740" y="78" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1565C0">Tropical Polynomial</text>

  <!-- Tropical polynomial graph (piecewise linear, convex) -->
  <g transform="translate(630, 95)">
    <!-- Axes -->
    <line x1="0" y1="120" x2="220" y2="120" stroke="#888" stroke-width="1"/>
    <line x1="10" y1="0" x2="10" y2="140" stroke="#888" stroke-width="1"/>

    <!-- Piecewise linear function: 4 pieces -->
    <polyline points="0,100 50,70 110,50 160,30 220,60" fill="none" stroke="#2196F3" stroke-width="3"/>

    <!-- Affine pieces (dashed) -->
    <line x1="0" y1="120" x2="100" y2="40" stroke="#90CAF9" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="30" y1="110" x2="180" y2="15" stroke="#90CAF9" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="80" y1="100" x2="220" y2="50" stroke="#90CAF9" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Breakpoints (region boundaries) -->
    <circle cx="50" cy="70" r="3.5" fill="#1565C0"/>
    <circle cx="110" cy="50" r="3.5" fill="#1565C0"/>
    <circle cx="160" cy="30" r="3.5" fill="#1565C0"/>

    <!-- Region labels -->
    <text x="25" y="135" font-family="Arial" font-size="9" fill="#1565C0">R₁</text>
    <text x="75" y="135" font-family="Arial" font-size="9" fill="#1565C0">R₂</text>
    <text x="130" y="135" font-family="Arial" font-size="9" fill="#1565C0">R₃</text>
    <text x="185" y="135" font-family="Arial" font-size="9" fill="#1565C0">R₄</text>

    <text x="110" y="155" text-anchor="middle" font-family="Arial" font-size="11" fill="#1565C0">max(a₁x+b₁, ..., a₄x+b₄)</text>
  </g>

  <!-- ===== BOTTOM SECTION: Composition and Bounds ===== -->

  <!-- Depth composition diagram -->
  <rect x="20" y="310" width="420" height="200" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5" rx="8"/>
  <text x="230" y="335" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#E65100">Depth Multiplies Tropical Degree</text>

  <!-- Layer boxes -->
  <g transform="translate(40, 350)">
    <!-- Layer 1 -->
    <rect x="0" y="0" width="80" height="50" fill="#FFE0B2" stroke="#F57C00" stroke-width="1" rx="5"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#E65100">Layer 1</text>
    <text x="40" y="38" text-anchor="middle" font-family="monospace" font-size="10" fill="#BF360C">w+1 terms</text>

    <!-- Arrow -->
    <line x1="85" y1="25" x2="115" y2="25" stroke="#F57C00" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="100" y="15" text-anchor="middle" font-family="Arial" font-size="9" fill="#E65100">∘</text>

    <!-- Layer 2 -->
    <rect x="120" y="0" width="80" height="50" fill="#FFE0B2" stroke="#F57C00" stroke-width="1" rx="5"/>
    <text x="160" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#E65100">Layer 2</text>
    <text x="160" y="38" text-anchor="middle" font-family="monospace" font-size="10" fill="#BF360C">w+1 terms</text>

    <!-- Arrow -->
    <line x1="205" y1="25" x2="225" y2="25" stroke="#F57C00" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="215" y="15" text-anchor="middle" font-family="Arial" font-size="9" fill="#E65100">∘</text>

    <!-- Dots -->
    <text x="240" y="30" font-family="Arial" font-size="16" fill="#E65100">···</text>

    <!-- Arrow -->
    <line x1="262" y1="25" x2="280" y2="25" stroke="#F57C00" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Layer L -->
    <rect x="285" y="0" width="80" height="50" fill="#FFE0B2" stroke="#F57C00" stroke-width="1" rx="5"/>
    <text x="325" y="20" text-anchor="middle" font-family="Arial" font-size="11" fill="#E65100">Layer L</text>
    <text x="325" y="38" text-anchor="middle" font-family="monospace" font-size="10" fill="#BF360C">w+1 terms</text>
  </g>

  <!-- Result formula -->
  <g transform="translate(40, 420)">
    <rect x="30" y="0" width="340" height="45" fill="white" stroke="#E65100" stroke-width="1.5" rx="5"/>
    <text x="200" y="18" text-anchor="middle" font-family="monospace" font-size="13" fill="#BF360C">Tropical Degree ≤ (w+1)^L</text>
    <text x="200" y="36" text-anchor="middle" font-family="Arial" font-size="11" fill="#E65100">Lipschitz ≤ max|slope| over all regions</text>
  </g>

  <!-- ===== BOTTOM RIGHT: Maslov Dequantization ===== -->
  <rect x="460" y="310" width="420" height="200" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5" rx="8"/>
  <text x="670" y="335" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A237E">Maslov Dequantization</text>

  <!-- Classical → Tropical diagram -->
  <g transform="translate(490, 355)">
    <!-- Classical box -->
    <rect x="0" y="0" width="150" height="60" fill="#C5CAE9" stroke="#3F51B5" stroke-width="1" rx="5"/>
    <text x="75" y="20" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1A237E">Classical</text>
    <text x="75" y="38" text-anchor="middle" font-family="monospace" font-size="11" fill="#283593">(ℝ₊, +, ×)</text>

    <!-- Arrow down -->
    <line x1="75" y1="65" x2="75" y2="100" stroke="#3F51B5" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="120" y="85" font-family="Arial" font-size="10" fill="#3F51B5">log / t→0</text>

    <!-- Tropical box -->
    <rect x="0" y="105" width="150" height="60" fill="#C5CAE9" stroke="#3F51B5" stroke-width="1" rx="5"/>
    <text x="75" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1A237E">Tropical</text>
    <text x="75" y="143" text-anchor="middle" font-family="monospace" font-size="11" fill="#283593">(ℝ, max, +)</text>

    <!-- Formulas on the right -->
    <text x="175" y="20" font-family="monospace" font-size="10" fill="#283593">× ↦ +</text>
    <text x="175" y="40" font-family="monospace" font-size="10" fill="#283593">+ ↦ max</text>
    <text x="175" y="125" font-family="monospace" font-size="10" fill="#283593">a ⊕ b = max(a,b)</text>
    <text x="175" y="145" font-family="monospace" font-size="10" fill="#283593">a ⊗ b = a + b</text>

    <!-- Key formula -->
    <rect x="160" y="60" width="200" height="35" fill="white" stroke="#3F51B5" stroke-width="1" rx="4"/>
    <text x="260" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#1A237E">a+b = log(eᵃ · eᵇ)</text>
  </g>

  <!-- Caption -->
  <rect x="0" y="525" width="900" height="45" fill="#f0f0f0"/>
  <text x="450" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">
    Figure: The tropical correspondence maps ReLU networks to tropical rational maps. Composition of layers multiplies
  </text>
  <text x="450" y="563" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#333">
    tropical degrees, bounding the Lipschitz constant. Maslov dequantization connects classical and tropical algebra.
  </text>

  <!-- Lean verification badge -->
  <g transform="translate(750, 575)">
    <rect x="0" y="0" width="130" height="28" fill="#4CAF50" rx="14"/>
    <text x="65" y="19" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">✓ Lean 4 Verified</text>
  </g>
</svg>
