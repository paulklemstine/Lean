<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8A838;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D4942E;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#50B86C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3EA55A;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">
    Tropical Degree → Certified Robustness
  </text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#666">
    From algebraic invariant to adversarial safety guarantee
  </text>

  <!-- Stage 1: Tropical Geometry -->
  <rect x="30" y="80" width="220" height="160" rx="12" fill="url(#grad1)" opacity="0.9"/>
  <text x="140" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Stage 1</text>
  <text x="140" y="128" text-anchor="middle" font-size="13" fill="white">Tropical Lipschitz</text>
  <line x1="60" y1="138" x2="220" y2="138" stroke="white" stroke-opacity="0.5"/>
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="white">ReLU network = tropical</text>
  <text x="140" y="178" text-anchor="middle" font-size="11" fill="white">rational function f</text>
  <text x="140" y="200" text-anchor="middle" font-size="13" fill="white" font-style="italic">
    Lip(f) ≤ K · d(f)
  </text>
  <text x="140" y="225" text-anchor="middle" font-size="10" fill="white" opacity="0.8">
    K = ∏ ‖Wℓ‖∞, d = trop. degree
  </text>

  <!-- Arrow 1→2 -->
  <line x1="260" y1="160" x2="290" y2="160" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Margin Analysis -->
  <rect x="300" y="80" width="220" height="160" rx="12" fill="url(#grad2)" opacity="0.9"/>
  <text x="410" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Stage 2</text>
  <text x="410" y="128" text-anchor="middle" font-size="13" fill="white">Margin Preservation</text>
  <line x1="330" y1="138" x2="490" y2="138" stroke="white" stroke-opacity="0.5"/>
  <text x="410" y="160" text-anchor="middle" font-size="11" fill="white">If ‖δ‖∞ &lt; margin / (2L):</text>
  <text x="410" y="180" text-anchor="middle" font-size="11" fill="white">  f_y(x+δ) &gt; max_{j≠y} f_j(x+δ)</text>
  <text x="410" y="205" text-anchor="middle" font-size="13" fill="white" font-style="italic">
    argmax preserved
  </text>
  <text x="410" y="225" text-anchor="middle" font-size="10" fill="white" opacity="0.8">
    Lipschitz bound on each component
  </text>

  <!-- Arrow 2→3 -->
  <line x1="530" y1="160" x2="560" y2="160" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Certified Robustness -->
  <rect x="570" y="80" width="210" height="160" rx="12" fill="url(#grad3)" opacity="0.9"/>
  <text x="675" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Stage 3</text>
  <text x="675" y="128" text-anchor="middle" font-size="13" fill="white">Certified Radius</text>
  <line x1="600" y1="138" x2="750" y2="138" stroke="white" stroke-opacity="0.5"/>
  <text x="675" y="165" text-anchor="middle" font-size="16" fill="white" font-weight="bold">
    r* = m / (2Kd)
  </text>
  <text x="675" y="192" text-anchor="middle" font-size="11" fill="white">m = classification margin</text>
  <text x="675" y="210" text-anchor="middle" font-size="11" fill="white">K = architecture norm</text>
  <text x="675" y="228" text-anchor="middle" font-size="11" fill="white">d = tropical degree</text>

  <!-- Bottom: Visual explanation -->
  <!-- Input space diagram -->
  <rect x="30" y="280" width="350" height="220" rx="8" fill="#f8f8f8" stroke="#ddd"/>
  <text x="205" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Input Space Geometry</text>

  <!-- Decision regions -->
  <rect x="50" y="320" width="150" height="150" rx="4" fill="#E3F2FD" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="125" y="345" text-anchor="middle" font-size="11" fill="#357ABD">Class A region</text>

  <rect x="210" y="320" width="150" height="150" rx="4" fill="#FFF3E0" stroke="#E8A838" stroke-width="1.5"/>
  <text x="285" y="345" text-anchor="middle" font-size="11" fill="#D4942E">Class B region</text>

  <!-- Decision boundary -->
  <line x1="200" y1="320" x2="200" y2="470" stroke="#E74C3C" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="200" y="490" text-anchor="middle" font-size="10" fill="#E74C3C">decision boundary</text>

  <!-- Input point x -->
  <circle cx="125" cy="400" r="6" fill="#2C3E50"/>
  <text x="125" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C3E50">x</text>

  <!-- Robustness ball -->
  <rect x="85" y="370" width="80" height="60" rx="0" fill="none" stroke="#50B86C" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="125" y="445" text-anchor="middle" font-size="10" fill="#3EA55A">L∞ ball, radius r*</text>

  <!-- Margin annotation -->
  <line x1="135" y1="400" x2="200" y2="400" stroke="#666" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="168" y="393" text-anchor="middle" font-size="9" fill="#666">margin</text>

  <!-- Right side: Key insight -->
  <rect x="420" y="280" width="360" height="220" rx="8" fill="#f8f8f8" stroke="#ddd"/>
  <text x="600" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Key Insight</text>

  <text x="440" y="335" font-size="12" fill="#444">• Tropical degree d counts linear pieces</text>
  <text x="440" y="358" font-size="12" fill="#444">• More pieces → more expressive network</text>
  <text x="440" y="381" font-size="12" fill="#444">• But also: larger Lipschitz constant</text>
  <text x="440" y="404" font-size="12" fill="#444">• So: larger d → smaller robustness radius</text>

  <rect x="450" y="420" width="310" height="55" rx="6" fill="#EBF5FB" stroke="#4A90D9"/>
  <text x="605" y="443" text-anchor="middle" font-size="13" fill="#2C3E50" font-weight="bold">
    Expressiveness ↔ Vulnerability
  </text>
  <text x="605" y="463" text-anchor="middle" font-size="11" fill="#555">
    Tropical degree quantifies this tradeoff exactly
  </text>

  <!-- Formally verified badge -->
  <rect x="590" y="485" width="190" height="28" rx="14" fill="#27AE60"/>
  <text x="685" y="504" text-anchor="middle" font-size="12" font-weight="bold" fill="white">✓ Formally Verified in Lean 4</text>
</svg>
