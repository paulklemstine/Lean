<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">
    Tropical Entropy Bound: Compression via Max-Plus Rank
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#64748b">
    trank(M) ≤ barvinok_rank(M) ⟹ K(x) ≥ Ω(log trank(M))
  </text>

  <!-- ====== LEFT: Binary String ====== -->
  <rect x="30" y="100" width="180" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Binary String x</text>
  <text x="120" y="150" text-anchor="middle" font-size="28" font-family="monospace" fill="#1e3a8a">10110010</text>
  <text x="120" y="175" text-anchor="middle" font-size="11" fill="#3b82f6">x ∈ {0,1}*</text>
  <text x="120" y="195" text-anchor="middle" font-size="11" fill="#3b82f6">|x| = n</text>

  <!-- Arrow: String → Tropical Matrix -->
  <line x1="210" y1="160" x2="280" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="245" y="148" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="bold">encode</text>
  <text x="245" y="176" text-anchor="middle" font-size="9" fill="#64748b">φ(x)</text>

  <!-- ====== CENTER: Tropical Matrix ====== -->
  <rect x="290" y="85" width="200" height="155" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Tropical Matrix M(x)</text>
  <text x="390" y="130" text-anchor="middle" font-size="11" fill="#b45309">M ∈ 𝕋^{n×n}</text>

  <!-- Matrix grid -->
  <g transform="translate(330, 140)">
    <rect x="0" y="0" width="120" height="80" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="4"/>
    <!-- Grid lines -->
    <line x1="30" y1="0" x2="30" y2="80" stroke="#fbbf24" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="80" stroke="#fbbf24" stroke-width="0.5"/>
    <line x1="90" y1="0" x2="90" y2="80" stroke="#fbbf24" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="120" y2="20" stroke="#fbbf24" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#fbbf24" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#fbbf24" stroke-width="0.5"/>
    <!-- Entries -->
    <text x="15" y="14" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">2</text>
    <text x="45" y="14" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">1</text>
    <text x="75" y="14" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">2</text>
    <text x="105" y="14" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">1</text>
    <text x="15" y="34" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">1</text>
    <text x="45" y="34" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">0</text>
    <text x="75" y="34" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">1</text>
    <text x="105" y="34" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">0</text>
    <text x="15" y="54" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">2</text>
    <text x="45" y="54" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">1</text>
    <text x="75" y="54" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">2</text>
    <text x="105" y="54" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">1</text>
    <text x="15" y="74" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">1</text>
    <text x="45" y="74" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">0</text>
    <text x="75" y="74" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">1</text>
    <text x="105" y="74" text-anchor="middle" font-size="10" fill="#92400e" font-family="monospace">0</text>
  </g>

  <!-- ====== RIGHT: Rank Hierarchy ====== -->
  <rect x="560" y="85" width="310" height="155" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="715" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Rank Hierarchy</text>

  <!-- Nested boxes for rank inequality -->
  <rect x="580" y="120" width="270" height="100" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="715" y="140" text-anchor="middle" font-size="12" fill="#166534">Barvinok Rank (max-plus rank)</text>

  <rect x="610" y="150" width="210" height="55" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <text x="715" y="172" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">Tropical Rank</text>
  <text x="715" y="195" text-anchor="middle" font-size="16" fill="#15803d" font-weight="bold">trank(M) ≤ barvinok_rank(M)</text>

  <!-- Arrow: Matrix → Rank -->
  <line x1="490" y1="160" x2="555" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="523" y="148" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="bold">compute</text>
  <text x="523" y="176" text-anchor="middle" font-size="9" fill="#64748b">rank</text>

  <!-- ====== BOTTOM CENTER: Kolmogorov Complexity ====== -->
  <rect x="250" y="330" width="400" height="110" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d174d">Kolmogorov Complexity K(x)</text>
  <text x="450" y="385" text-anchor="middle" font-size="18" fill="#be185d" font-weight="bold">K(x) ≥ Ω(log trank(M(x)))</text>
  <text x="450" y="410" text-anchor="middle" font-size="12" fill="#db2777">No program shorter than this can produce x</text>
  <text x="450" y="430" text-anchor="middle" font-size="11" fill="#f472b6">Compression limit from tropical algebraic structure</text>

  <!-- Arrow: Rank → Kolmogorov (curved) -->
  <path d="M 715 240 Q 715 310 650 340" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="720" y="280" font-size="10" fill="#dc2626" font-weight="bold">implies</text>

  <!-- Arrow: String → Kolmogorov (curved) -->
  <path d="M 120 220 Q 120 320 250 370" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="140" y="300" font-size="10" fill="#9333ea" font-weight="bold">lower bound</text>

  <!-- ====== BOTTOM: Tropical Semiring ====== -->
  <rect x="50" y="470" width="350" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">Tropical Semiring 𝕋 = (ℝ ∪ {−∞}, ⊕, ⊙)</text>
  <text x="225" y="518" text-anchor="middle" font-size="12" fill="#6d28d9">a ⊕ b = max(a, b)    (tropical addition)</text>
  <text x="225" y="538" text-anchor="middle" font-size="12" fill="#6d28d9">a ⊙ b = a + b         (tropical multiplication)</text>
  <text x="225" y="558" text-anchor="middle" font-size="11" fill="#8b5cf6">Identity: 0⊕ = −∞,  1⊙ = 0</text>

  <!-- ====== BOTTOM RIGHT: Tropical Variety ====== -->
  <rect x="450" y="470" width="420" height="100" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#9f1239">Geometric Interpretation</text>

  <!-- Tropical line drawing -->
  <g transform="translate(475, 505)">
    <!-- Tropical curve (piecewise linear) -->
    <polyline points="0,50 30,30 60,10 90,10 120,30 150,50" fill="none" stroke="#e11d48" stroke-width="2.5"/>
    <polyline points="60,10 60,55" fill="none" stroke="#e11d48" stroke-width="2.5"/>
    <circle cx="60" cy="10" r="3" fill="#e11d48"/>
    <text x="65" y="7" font-size="9" fill="#9f1239">vertex</text>
  </g>

  <text x="730" y="520" font-size="11" fill="#9f1239">Tropical variety = piecewise</text>
  <text x="730" y="535" font-size="11" fill="#9f1239">linear complex encoding</text>
  <text x="730" y="550" font-size="11" fill="#9f1239">structural complexity</text>

  <!-- Caption -->
  <text x="450" y="605" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">
    Figure: The tropical entropy bound — from binary strings through tropical matrices to Kolmogorov complexity lower bounds.
  </text>
</svg>
