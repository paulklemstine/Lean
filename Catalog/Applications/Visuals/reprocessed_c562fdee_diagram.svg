<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">
    Categorical Completed Potential Conjecture
  </text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">
    Terminal Object Universal Property in the Category of Propositions
  </text>

  <!-- Terminal Object: True (center top) -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="150" r="45" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <text x="400" y="146" text-anchor="middle" font-size="22" font-weight="bold" fill="#92400e">True</text>
  <text x="400" y="166" text-anchor="middle" font-size="11" fill="#a16207">Terminal Object</text>

  <!-- Star decoration for terminal object -->
  <text x="400" y="100" text-anchor="middle" font-size="16" fill="#f59e0b">★</text>

  <!-- Inhabited Type X (left) -->
  <g filter="url(#shadow)">
    <ellipse cx="150" cy="350" rx="70" ry="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="150" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">X</text>
  <text x="150" y="365" text-anchor="middle" font-size="11" fill="#3b82f6">[Inhabited]</text>

  <!-- Default element inside X -->
  <circle cx="140" cy="335" r="4" fill="#2563eb"/>
  <text x="155" y="332" font-size="9" fill="#1e40af">default</text>

  <!-- Type ℕ (center left) -->
  <g filter="url(#shadow)">
    <ellipse cx="300" cy="400" rx="55" ry="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="300" y="395" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">ℕ</text>
  <text x="300" y="415" text-anchor="middle" font-size="11" fill="#16a34a">[Inhabited]</text>

  <!-- Type Bool (center right) -->
  <g filter="url(#shadow)">
    <ellipse cx="500" cy="400" rx="55" ry="35" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  </g>
  <text x="500" y="395" text-anchor="middle" font-size="18" font-weight="bold" fill="#581c87">Bool</text>
  <text x="500" y="415" text-anchor="middle" font-size="11" fill="#9333ea">[Inhabited]</text>

  <!-- Type String (right) -->
  <g filter="url(#shadow)">
    <ellipse cx="650" cy="350" rx="65" ry="40" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  </g>
  <text x="650" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#9d174d">String</text>
  <text x="650" y="365" text-anchor="middle" font-size="11" fill="#db2777">[Inhabited]</text>

  <!-- Arrows: unique morphisms to True -->

  <!-- X → True -->
  <line x1="190" y1="320" x2="365" y2="180" stroke="#2563eb" stroke-width="2"
        marker-end="url(#arrowBlue)" stroke-dasharray="6,3"/>
  <text x="255" y="235" text-anchor="middle" font-size="11" fill="#2563eb" transform="rotate(-35, 255, 235)">
    !X = λ _ ⇒ trivial
  </text>

  <!-- ℕ → True -->
  <line x1="320" y1="370" x2="385" y2="195" stroke="#16a34a" stroke-width="2"
        marker-end="url(#arrowGreen)" stroke-dasharray="6,3"/>
  <text x="335" y="290" text-anchor="middle" font-size="11" fill="#16a34a" transform="rotate(-65, 335, 290)">
    !ℕ
  </text>

  <!-- Bool → True -->
  <line x1="480" y1="370" x2="415" y2="195" stroke="#9333ea" stroke-width="2"
        marker-end="url(#arrowPurple)" stroke-dasharray="6,3"/>
  <text x="465" y="290" text-anchor="middle" font-size="11" fill="#9333ea" transform="rotate(65, 465, 290)">
    !Bool
  </text>

  <!-- String → True -->
  <line x1="615" y1="320" x2="435" y2="180" stroke="#db2777" stroke-width="2"
        marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="545" y="235" text-anchor="middle" font-size="11" fill="#db2777" transform="rotate(35, 545, 235)">
    !String = λ _ ⇒ trivial
  </text>

  <!-- Uniqueness annotation -->
  <text x="400" y="210" text-anchor="middle" font-size="10" fill="#64748b">∃! morphism from each object</text>

  <!-- Information Theory Panel -->
  <rect x="50" y="470" width="300" height="90" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
  <text x="200" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Information Theory</text>
  <text x="70" y="512" font-size="11" fill="#475569">H(True)  = 0 bits   (completed potential)</text>
  <text x="70" y="530" font-size="11" fill="#475569">H(Bool)  = 1 bit    (maximal uncertainty)</text>
  <text x="70" y="548" font-size="11" fill="#475569">K(True)  = O(1)     (minimal complexity)</text>

  <!-- Curry-Howard Panel -->
  <rect x="450" y="470" width="300" height="90" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Curry-Howard-Lambek</text>
  <text x="470" y="512" font-size="11" fill="#475569">True   ↔  Unit type  ↔  Terminal obj</text>
  <text x="470" y="530" font-size="11" fill="#475569">Proof  ↔  Program    ↔  Morphism</text>
  <text x="470" y="548" font-size="11" fill="#475569">trivial ↔  ()         ↔  !_A</text>

  <!-- Caption -->
  <text x="400" y="590" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">
    Fig. 1: The terminal object True receives a unique morphism from every inhabited type — the completed potential.
  </text>
</svg>
