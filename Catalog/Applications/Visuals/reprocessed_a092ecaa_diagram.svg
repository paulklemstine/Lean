<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bde0fe;stop-opacity:0.3" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="700" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Quantum Berggren Superposition
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Pythagorean Triples as Quantum State Amplitudes
  </text>

  <!-- ═══ LEFT: Unit Circle with Pythagorean points ═══ -->
  <g transform="translate(220, 310)">
    <!-- Unit circle background -->
    <circle cx="0" cy="0" r="180" fill="url(#circleGrad)" stroke="#3498db" stroke-width="2"/>

    <!-- Axes -->
    <line x1="-195" y1="0" x2="195" y2="0" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="0" y1="-195" x2="0" y2="195" stroke="#bdc3c7" stroke-width="1"/>
    <text x="200" y="5" font-family="monospace" font-size="11" fill="#7f8c8d">|0⟩</text>
    <text x="5" y="-188" font-family="monospace" font-size="11" fill="#7f8c8d">|1⟩</text>

    <!-- Pythagorean triple points on unit circle -->
    <!-- (3,4,5): angle = atan2(4,3) ≈ 53.13° → (3/5, 4/5) = (0.6, 0.8) -->
    <circle cx="108" cy="-144" r="7" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="118" y="-148" font-family="monospace" font-size="10" fill="#c0392b" font-weight="bold">(3,4,5)</text>
    <line x1="0" y1="0" x2="108" y2="-144" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

    <!-- (5,12,13): (5/13, 12/13) ≈ (0.385, 0.923) -->
    <circle cx="69" cy="-166" r="7" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    <text x="40" y="-172" font-family="monospace" font-size="10" fill="#27ae60" font-weight="bold">(5,12,13)</text>
    <line x1="0" y1="0" x2="69" y2="-166" stroke="#2ecc71" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

    <!-- (8,15,17): (8/17, 15/17) ≈ (0.471, 0.882) -->
    <circle cx="85" cy="-159" r="6" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="92" y="-120" font-family="monospace" font-size="10" fill="#8e44ad">(8,15,17)</text>

    <!-- (7,24,25): (7/25, 24/25) ≈ (0.28, 0.96) -->
    <circle cx="50" cy="-173" r="6" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="-10" y="-148" font-family="monospace" font-size="10" fill="#e67e22">(7,24,25)</text>

    <!-- (20,21,29): (20/29, 21/29) ≈ (0.69, 0.724) -->
    <circle cx="124" cy="-130" r="6" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
    <text x="132" y="-118" font-family="monospace" font-size="10" fill="#16a085">(20,21,29)</text>

    <!-- (9,40,41): (9/41, 40/41) ≈ (0.22, 0.976) -->
    <circle cx="40" cy="-176" r="5" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>

    <!-- (11,60,61): close to |1⟩ axis -->
    <circle cx="32" cy="-177" r="4" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>

    <!-- Label -->
    <text x="0" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2c3e50" font-weight="bold">
      Unit Circle: Quantum States
    </text>
    <text x="0" y="226" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d">
      |ψ⟩ = (a/c)|0⟩ + (b/c)|1⟩
    </text>
  </g>

  <!-- ═══ RIGHT: Berggren Tree ═══ -->
  <g transform="translate(590, 120)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Berggren Tree
    </text>

    <!-- Root -->
    <rect x="-35" y="15" width="70" height="28" rx="6" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="0" y="34" text-anchor="middle" font-family="monospace" font-size="12" fill="white" font-weight="bold">(3,4,5)</text>

    <!-- Level 1 branches -->
    <line x1="-10" y1="43" x2="-80" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="43" x2="0" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="10" y1="43" x2="80" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Matrix labels on branches -->
    <text x="-55" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#e74c3c">A</text>
    <text x="5" y="63" text-anchor="middle" font-family="monospace" font-size="9" fill="#2ecc71">B</text>
    <text x="55" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#9b59b6">C</text>

    <!-- Level 1 nodes -->
    <rect x="-115" y="80" width="70" height="24" rx="5" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
    <text x="-80" y="96" text-anchor="middle" font-family="monospace" font-size="10" fill="white">(5,12,13)</text>

    <rect x="-35" y="80" width="70" height="24" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
    <text x="0" y="96" text-anchor="middle" font-family="monospace" font-size="10" fill="white">(21,20,29)</text>

    <rect x="45" y="80" width="75" height="24" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="1.5"/>
    <text x="82" y="96" text-anchor="middle" font-family="monospace" font-size="10" fill="white">(15,8,17)</text>

    <!-- Level 2 partial (from first child) -->
    <line x1="-90" y1="104" x2="-130" y2="132" stroke="#aaa" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="-80" y1="104" x2="-80" y2="132" stroke="#aaa" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="-70" y1="104" x2="-30" y2="132" stroke="#aaa" stroke-width="1" marker-end="url(#arrowhead)"/>

    <rect x="-160" y="137" width="60" height="20" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <text x="-130" y="151" text-anchor="middle" font-family="monospace" font-size="8" fill="white">(7,24,25)</text>

    <rect x="-110" y="137" width="63" height="20" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <text x="-78" y="151" text-anchor="middle" font-family="monospace" font-size="8" fill="white">(55,48,73)</text>

    <rect x="-55" y="137" width="63" height="20" rx="4" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <text x="-23" y="151" text-anchor="middle" font-family="monospace" font-size="8" fill="white">(45,28,53)</text>

    <!-- Ellipsis -->
    <text x="0" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#95a5a6">⋯ ∞ ⋯</text>
    <text x="0" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d">
      All primitive triples
    </text>
  </g>

  <!-- ═══ CORRESPONDENCE ARROW ═══ -->
  <g transform="translate(400, 480)">
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <line x1="100" y1="0" x2="-100" y2="0" stroke="#2ecc71" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2c3e50" font-weight="bold">
      Bijection
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="monospace" font-size="10" fill="#7f8c8d">
      (a,b,c) ↔ (a/c)|0⟩ + (b/c)|1⟩
    </text>
  </g>

  <!-- ═══ Key equations ═══ -->
  <g transform="translate(400, 560)">
    <rect x="-250" y="-20" width="500" height="70" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>

    <text x="-220" y="2" font-family="monospace" font-size="12" fill="#2c3e50">
      a² + b² = c²  ⟹  (a/c)² + (b/c)² = 1  ⟹  ‖ψ‖² = 1  ✓
    </text>
    <text x="-220" y="24" font-family="monospace" font-size="12" fill="#2c3e50">
      gcd(a,b) = 1  ⟺  |ψ⟩ is irreducible (pure state)     ✓
    </text>
    <text x="-220" y="42" font-family="monospace" font-size="12" fill="#8e44ad">
      Lean 4 proof:  trivial  (well-typedness is definitional)
    </text>
  </g>

  <!-- Caption -->
  <text x="400" y="670" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#95a5a6">
    Fig. 1: The Berggren tree generates rational points on the unit circle, each encoding a normalized quantum state.
  </text>
</svg>
