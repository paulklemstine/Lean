<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#2c3e50" font-weight="bold">
    Non-Archimedean Factoring Oracle
  </text>
  <text x="400" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7f8c8d">
    Corrected Theorem: ∀ n &gt; 1, Prime(n) ∨ ∃ a,b &gt; 1: a·b = n
  </text>

  <!-- Input node -->
  <rect x="320" y="90" width="160" height="50" rx="25" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-family="monospace" font-size="16" fill="white" font-weight="bold">n &gt; 1</text>

  <!-- Decision diamond -->
  <polygon points="400,175 500,235 400,295 300,235" fill="#f39c12" stroke="#e67e22" stroke-width="2" opacity="0.9"/>
  <text x="400" y="232" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">Prime(n)?</text>

  <!-- Arrow from input to diamond -->
  <line x1="400" y1="140" x2="400" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Prime branch (left) -->
  <rect x="80" y="300" width="200" height="80" rx="10" fill="url(#primeGrad)" stroke="#3498db" stroke-width="2"/>
  <text x="180" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2980b9" font-weight="bold">✓ PRIME</text>
  <text x="180" y="348" text-anchor="middle" font-family="monospace" font-size="12" fill="#34495e">Left disjunct:</text>
  <text x="180" y="368" text-anchor="middle" font-family="monospace" font-size="12" fill="#34495e">Nat.Prime n</text>

  <!-- Arrow to prime -->
  <line x1="300" y1="235" x2="280" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="235" x2="180" y2="235" stroke="#3498db" stroke-width="2"/>
  <line x1="180" y1="235" x2="180" y2="300" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="230" y="225" text-anchor="middle" font-family="monospace" font-size="12" fill="#3498db">Yes</text>

  <!-- Composite branch (right) -->
  <rect x="520" y="300" width="220" height="80" rx="10" fill="url(#compGrad)" stroke="#e74c3c" stroke-width="2"/>
  <text x="630" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c0392b" font-weight="bold">✗ COMPOSITE</text>
  <text x="630" y="348" text-anchor="middle" font-family="monospace" font-size="12" fill="#34495e">Right disjunct:</text>
  <text x="630" y="368" text-anchor="middle" font-family="monospace" font-size="12" fill="#34495e">∃ a b &gt; 1, a·b = n</text>

  <!-- Arrow to composite -->
  <line x1="500" y1="235" x2="520" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="520" y1="235" x2="630" y2="235" stroke="#e74c3c" stroke-width="2"/>
  <line x1="630" y1="235" x2="630" y2="300" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="575" y="225" text-anchor="middle" font-family="monospace" font-size="12" fill="#e74c3c">No</text>

  <!-- Factorization detail box -->
  <rect x="460" y="410" width="300" height="120" rx="8" fill="#fff" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="610" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2c3e50" font-weight="bold">Witness Construction</text>
  <text x="610" y="458" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">d ← minFac(n)    // smallest divisor &gt; 1</text>
  <text x="610" y="478" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">a ← d             // a &gt; 1 ✓</text>
  <text x="610" y="498" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">b ← n / d         // b &gt; 1 (since d &lt; n) ✓</text>
  <text x="610" y="518" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">a · b = n         // by Nat.mul_div_cancel'</text>

  <!-- Arrow from composite to detail -->
  <line x1="630" y1="380" x2="610" y2="410" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Examples -->
  <rect x="60" y="410" width="200" height="120" rx="8" fill="#fff" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="160" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2c3e50" font-weight="bold">Examples</text>
  <text x="160" y="458" text-anchor="middle" font-family="monospace" font-size="11" fill="#3498db">2 → Prime ✓</text>
  <text x="160" y="478" text-anchor="middle" font-family="monospace" font-size="11" fill="#3498db">7 → Prime ✓</text>
  <text x="160" y="498" text-anchor="middle" font-family="monospace" font-size="11" fill="#e74c3c">15 → 3 × 5 ✓</text>
  <text x="160" y="518" text-anchor="middle" font-family="monospace" font-size="11" fill="#e74c3c">12 → 2 × 6 ✓</text>

  <!-- Arrow from prime to examples -->
  <line x1="180" y1="380" x2="160" y2="410" stroke="#bdc3c7" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Crossed-out original statement -->
  <rect x="200" y="545" width="400" height="30" rx="5" fill="#ffebee" stroke="#e74c3c" stroke-width="1"/>
  <text x="400" y="565" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" text-decoration="line-through">
    Original: ∀ n &gt; 1, ∃ a,b &gt; 1, a·b = n  ← FALSE
  </text>

  <!-- Caption -->
  <text x="400" y="595" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#95a5a6">
    Figure 1: Decision structure of the corrected factoring oracle. The original statement (crossed out) omits the prime case.
  </text>
</svg>
