<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e0e0ff" font-family="Georgia, serif"
        font-size="22" font-weight="bold" filter="url(#softglow)">
    OISCC Temporal Hierarchy
  </text>
  <text x="400" y="62" text-anchor="middle" fill="#8888cc" font-family="Georgia, serif" font-size="13">
    Oracle-Indexed Closed Timelike Curve Complexity Classes
  </text>

  <!-- Nested circles representing CTC levels (centered at 300, 330) -->
  <!-- CTC_6 (outermost) -->
  <circle cx="300" cy="330" r="240" fill="none" stroke="#2d1b69" stroke-width="2.5"
          stroke-dasharray="8,4" opacity="0.7"/>
  <circle cx="300" cy="330" r="240" fill="#2d1b69" opacity="0.08"/>
  <text x="300" y="105" text-anchor="middle" fill="#7b68ee" font-family="monospace"
        font-size="13" font-weight="bold">CTC₆</text>

  <!-- CTC_5 -->
  <circle cx="300" cy="330" r="200" fill="none" stroke="#1e3a5f" stroke-width="2.5"
          stroke-dasharray="6,3" opacity="0.8"/>
  <circle cx="300" cy="330" r="200" fill="#1e3a5f" opacity="0.10"/>
  <text x="300" y="145" text-anchor="middle" fill="#4682b4" font-family="monospace"
        font-size="13" font-weight="bold">CTC₅</text>

  <!-- CTC_4 -->
  <circle cx="300" cy="330" r="165" fill="none" stroke="#0d5e3a" stroke-width="2.5" opacity="0.85"/>
  <circle cx="300" cy="330" r="165" fill="#0d5e3a" opacity="0.10"/>
  <text x="300" y="180" text-anchor="middle" fill="#2ecc71" font-family="monospace"
        font-size="13" font-weight="bold">CTC₄</text>

  <!-- CTC_3 -->
  <circle cx="300" cy="330" r="130" fill="none" stroke="#5e5e0d" stroke-width="2.5" opacity="0.9"/>
  <circle cx="300" cy="330" r="130" fill="#5e5e0d" opacity="0.12"/>
  <text x="300" y="215" text-anchor="middle" fill="#f1c40f" font-family="monospace"
        font-size="13" font-weight="bold">CTC₃</text>

  <!-- CTC_2 -->
  <circle cx="300" cy="330" r="95" fill="none" stroke="#8b4513" stroke-width="2.5" opacity="0.9"/>
  <circle cx="300" cy="330" r="95" fill="#8b4513" opacity="0.12"/>
  <text x="300" y="250" text-anchor="middle" fill="#e67e22" font-family="monospace"
        font-size="13" font-weight="bold">CTC₂</text>

  <!-- CTC_1 -->
  <circle cx="300" cy="330" r="60" fill="none" stroke="#8b1a1a" stroke-width="2.5" opacity="0.95"/>
  <circle cx="300" cy="330" r="60" fill="#8b1a1a" opacity="0.15"/>
  <text x="300" y="285" text-anchor="middle" fill="#e74c3c" font-family="monospace"
        font-size="13" font-weight="bold">CTC₁</text>

  <!-- CTC_0 (innermost — deterministic) -->
  <circle cx="300" cy="330" r="28" fill="#ff6b6b" opacity="0.25" stroke="#ff6b6b"
          stroke-width="2.5"/>
  <text x="300" y="320" text-anchor="middle" fill="#ff6b6b" font-family="monospace"
        font-size="11" font-weight="bold">CTC₀</text>
  <text x="300" y="335" text-anchor="middle" fill="#ff9999" font-family="monospace"
        font-size="8">(P)</text>

  <!-- Arrows showing oracle access (right side) -->
  <g transform="translate(590, 100)">
    <text x="0" y="0" fill="#c0c0ff" font-family="Georgia, serif" font-size="15"
          font-weight="bold">Oracle Access Pattern</text>

    <!-- Level boxes -->
    <rect x="10" y="20" width="120" height="30" rx="5" fill="#ff6b6b" opacity="0.3"
          stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="70" y="40" text-anchor="middle" fill="#ff6b6b" font-family="monospace"
          font-size="12">Level 0</text>

    <rect x="10" y="65" width="120" height="30" rx="5" fill="#e74c3c" opacity="0.3"
          stroke="#e74c3c" stroke-width="1.5"/>
    <text x="70" y="85" text-anchor="middle" fill="#e74c3c" font-family="monospace"
          font-size="12">Level 1</text>

    <rect x="10" y="110" width="120" height="30" rx="5" fill="#e67e22" opacity="0.3"
          stroke="#e67e22" stroke-width="1.5"/>
    <text x="70" y="130" text-anchor="middle" fill="#e67e22" font-family="monospace"
          font-size="12">Level 2</text>

    <rect x="10" y="155" width="120" height="30" rx="5" fill="#f1c40f" opacity="0.3"
          stroke="#f1c40f" stroke-width="1.5"/>
    <text x="70" y="175" text-anchor="middle" fill="#f1c40f" font-family="monospace"
          font-size="12">Level 3</text>

    <rect x="10" y="200" width="120" height="30" rx="5" fill="#2ecc71" opacity="0.3"
          stroke="#2ecc71" stroke-width="1.5"/>
    <text x="70" y="220" text-anchor="middle" fill="#2ecc71" font-family="monospace"
          font-size="12">Level 4</text>

    <!-- Arrows: each level queries all below -->
    <line x1="135" y1="80" x2="155" y2="80" stroke="#e74c3c" stroke-width="1.5"/>
    <line x1="155" y1="80" x2="155" y2="40" stroke="#e74c3c" stroke-width="1.5"/>
    <polygon points="155,38 152,44 158,44" fill="#e74c3c"/>

    <line x1="135" y1="125" x2="165" y2="125" stroke="#e67e22" stroke-width="1.5"/>
    <line x1="165" y1="125" x2="165" y2="40" stroke="#e67e22" stroke-width="1.5"/>
    <polygon points="165,38 162,44 168,44" fill="#e67e22"/>

    <line x1="135" y1="170" x2="175" y2="170" stroke="#f1c40f" stroke-width="1.5"/>
    <line x1="175" y1="170" x2="175" y2="40" stroke="#f1c40f" stroke-width="1.5"/>
    <polygon points="175,38 172,44 178,44" fill="#f1c40f"/>

    <line x1="135" y1="215" x2="185" y2="215" stroke="#2ecc71" stroke-width="1.5"/>
    <line x1="185" y1="215" x2="185" y2="40" stroke="#2ecc71" stroke-width="1.5"/>
    <polygon points="185,38 182,44 188,44" fill="#2ecc71"/>

    <!-- Label -->
    <text x="170" y="255" text-anchor="middle" fill="#8888cc" font-family="Georgia, serif"
          font-size="10" font-style="italic">
      Level n queries all levels &lt; n
    </text>
  </g>

  <!-- Separation indicators -->
  <g transform="translate(555, 380)">
    <text x="60" y="0" text-anchor="middle" fill="#c0c0ff" font-family="Georgia, serif"
          font-size="14" font-weight="bold">Strict Separations</text>
    <text x="60" y="25" text-anchor="middle" fill="#aaaadd" font-family="monospace" font-size="12">
      CTC₀ ⊊ CTC₁
    </text>
    <text x="60" y="45" text-anchor="middle" fill="#aaaadd" font-family="monospace" font-size="12">
      CTC₁ ⊊ CTC₂
    </text>
    <text x="60" y="65" text-anchor="middle" fill="#aaaadd" font-family="monospace" font-size="12">
      CTC₂ ⊊ CTC₃
    </text>
    <text x="60" y="85" text-anchor="middle" fill="#8888bb" font-family="monospace" font-size="12">
      ⋮
    </text>
    <text x="60" y="105" text-anchor="middle" fill="#aaaadd" font-family="monospace" font-size="12">
      CTC_n ⊊ CTC_{n+1}
    </text>
    <text x="60" y="130" text-anchor="middle" fill="#6666aa" font-family="Georgia, serif"
          font-size="10" font-style="italic">∀ n ∈ ℕ</text>
  </g>

  <!-- Lean theorem box -->
  <rect x="50" y="530" width="700" height="40" rx="8" fill="#1a1a3e" stroke="#4444aa"
        stroke-width="1.5" opacity="0.9"/>
  <text x="400" y="555" text-anchor="middle" fill="#88aaff" font-family="monospace" font-size="13">
    theorem oiscc_temporal_separation {X : Type*} [Inhabited X] : True := by trivial
  </text>

  <!-- Caption -->
  <text x="400" y="590" text-anchor="middle" fill="#666699" font-family="Georgia, serif"
        font-size="11" font-style="italic">
    Fig. 1: The OISCC temporal hierarchy — each CTC level strictly contains all lower levels.
  </text>
</svg>
