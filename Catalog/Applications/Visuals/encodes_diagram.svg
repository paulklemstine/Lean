<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="620" fill="url(#bg-grad)" rx="8"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Backpropagation as the Cotangent Lift
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Contravariant Functoriality of T* : Man^op → VectBun
  </text>
  
  <!-- ═══════════ TOP ROW: FORWARD PASS (Tangent / Manifolds) ═══════════ -->
  <text x="60" y="100" font-family="monospace" font-size="12" fill="#2563eb" font-weight="bold">FORWARD PASS</text>
  <text x="60" y="115" font-family="monospace" font-size="10" fill="#64748b">Covariant: T(g∘f) = Tg ∘ Tf</text>
  
  <!-- Manifold M1 -->
  <ellipse cx="160" cy="180" rx="55" ry="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e40af">ℝ^m</text>
  <text x="160" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">Input</text>
  
  <!-- Arrow f1 -->
  <line x1="220" y1="180" x2="310" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="265" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2563eb" font-style="italic">f₁</text>
  
  <!-- Manifold M2 -->
  <ellipse cx="370" cy="180" rx="55" ry="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e40af">ℝ^h₁</text>
  <text x="370" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">Hidden 1</text>
  
  <!-- Arrow f2 -->
  <line x1="430" y1="180" x2="520" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="475" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2563eb" font-style="italic">f₂</text>
  
  <!-- Manifold M3 -->
  <ellipse cx="580" cy="180" rx="55" ry="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e40af">ℝ^h₂</text>
  <text x="580" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">Hidden 2</text>
  
  <!-- Arrow f3 -->
  <line x1="640" y1="180" x2="730" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="685" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2563eb" font-style="italic">f₃</text>
  
  <!-- Manifold M4 -->
  <ellipse cx="790" cy="180" rx="55" ry="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1e40af">ℝ^n</text>
  <text x="790" y="195" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">Output</text>
  
  <!-- Φ = f₃ ∘ f₂ ∘ f₁ label -->
  <path d="M 160 230 Q 475 290 790 230" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="475" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#16a34a" font-weight="bold">
    Φ = f₃ ∘ f₂ ∘ f₁
  </text>
  
  <!-- ═══════════ VERTICAL ARROWS: Cotangent Bundle Projection ═══════════ -->
  <text x="60" y="320" font-family="monospace" font-size="11" fill="#7c3aed">π: T*M → M</text>
  
  <!-- Vertical dashed lines connecting manifolds to cotangent bundles -->
  <line x1="160" y1="220" x2="160" y2="360" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="145" y="300" font-family="Georgia, serif" font-size="11" fill="#7c3aed">π</text>
  
  <line x1="370" y1="220" x2="370" y2="360" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="355" y="300" font-family="Georgia, serif" font-size="11" fill="#7c3aed">π</text>
  
  <line x1="580" y1="220" x2="580" y2="360" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="565" y="300" font-family="Georgia, serif" font-size="11" fill="#7c3aed">π</text>
  
  <line x1="790" y1="220" x2="790" y2="360" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="775" y="300" font-family="Georgia, serif" font-size="11" fill="#7c3aed">π</text>
  
  <!-- ═══════════ BOTTOM ROW: BACKWARD PASS (Cotangent / Backprop) ═══════════ -->
  <text x="60" y="350" font-family="monospace" font-size="12" fill="#dc2626" font-weight="bold">BACKWARD PASS</text>
  <text x="60" y="365" font-family="monospace" font-size="10" fill="#64748b">Contravariant: (g∘f)* = f*∘g*</text>
  
  <!-- Cotangent T*M1 -->
  <rect x="100" y="385" width="120" height="55" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#991b1b">T*ℝ^m</text>
  <text x="160" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#dc2626">∂L/∂x</text>
  
  <!-- Arrow f1* (REVERSED) -->
  <line x1="310" y1="412" x2="225" y2="412" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="265" y="402" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#dc2626" font-style="italic">f₁*</text>
  <text x="265" y="435" text-anchor="middle" font-family="monospace" font-size="9" fill="#991b1b">= J₁ᵀ·(—)</text>
  
  <!-- Cotangent T*M2 -->
  <rect x="310" y="385" width="120" height="55" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#991b1b">T*ℝ^h₁</text>
  <text x="370" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#dc2626">∂L/∂h₁</text>
  
  <!-- Arrow f2* (REVERSED) -->
  <line x1="520" y1="412" x2="435" y2="412" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="475" y="402" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#dc2626" font-style="italic">f₂*</text>
  <text x="475" y="435" text-anchor="middle" font-family="monospace" font-size="9" fill="#991b1b">= J₂ᵀ·(—)</text>
  
  <!-- Cotangent T*M3 -->
  <rect x="520" y="385" width="120" height="55" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#991b1b">T*ℝ^h₂</text>
  <text x="580" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#dc2626">∂L/∂h₂</text>
  
  <!-- Arrow f3* (REVERSED) -->
  <line x1="730" y1="412" x2="645" y2="412" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="685" y="402" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#dc2626" font-style="italic">f₃*</text>
  <text x="685" y="435" text-anchor="middle" font-family="monospace" font-size="9" fill="#991b1b">= J₃ᵀ·(—)</text>
  
  <!-- Cotangent T*M4 -->
  <rect x="730" y="385" width="120" height="55" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#991b1b">T*ℝ^n</text>
  <text x="790" y="428" text-anchor="middle" font-family="monospace" font-size="9" fill="#dc2626">∂L/∂y = α</text>
  
  <!-- Φ* backward arc -->
  <path d="M 790 455 Q 475 515 160 455" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="475" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#16a34a" font-weight="bold">
    Φ* = f₁* ∘ f₂* ∘ f₃*  (BACKPROP)
  </text>
  
  <!-- ═══════════ EQUATION BOX ═══════════ -->
  <rect x="200" y="535" width="500" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#166534">
    Theorem: (f₃ ∘ f₂ ∘ f₁)* = f₁* ∘ f₂* ∘ f₃*  ⟺  Backprop = Cotangent Lift
  </text>
  <text x="450" y="570" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ade80">
    ∎ Contravariant functoriality of T*
  </text>
  
  <!-- Caption -->
  <text x="450" y="605" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8" font-style="italic">
    The forward pass flows left→right (blue); backpropagation flows right→left (red) — forced by contravariance of T*.
  </text>
</svg>
