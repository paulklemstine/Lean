<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="tropicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="infoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Tropical Entropy Bound: Max-Plus Rank → Compression Limit
  </text>

  <!-- ═══ LEFT PANEL: Tropical Geometry ═══ -->
  <rect x="30" y="55" width="380" height="240" rx="12" fill="url(#tropicalGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#92400e">
    Tropical Semiring 𝕋 = (ℝ ∪ {-∞}, ⊕, ⊙)
  </text>

  <!-- Max-plus operations -->
  <text x="55" y="110" font-family="monospace" font-size="13" fill="#78350f">a ⊕ b = max(a, b)</text>
  <text x="55" y="130" font-family="monospace" font-size="13" fill="#78350f">a ⊙ b = a + b</text>

  <!-- Tropical matrix -->
  <text x="55" y="160" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#92400e">Tropical Matrix A ∈ 𝕋^(m×n):</text>

  <!-- Matrix visualization -->
  <rect x="60" y="170" width="120" height="100" rx="4" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Matrix entries with color coding -->
  <text x="80" y="195" font-family="monospace" font-size="11" fill="#c2410c">3  5  2</text>
  <text x="80" y="215" font-family="monospace" font-size="11" fill="#c2410c">7  1  4</text>
  <text x="80" y="235" font-family="monospace" font-size="11" fill="#c2410c">2  6  8</text>
  <text x="80" y="258" font-family="monospace" font-size="10" fill="#9a3412">-∞ = trop. zero</text>

  <!-- Rank-one decomposition -->
  <text x="210" y="185" font-family="Georgia, serif" font-size="13" fill="#92400e">= B₁ ⊕ B₂ ⊕ ... ⊕ Bᵣ</text>
  <text x="210" y="205" font-family="Georgia, serif" font-size="12" fill="#b45309">where Bᵢ = uᵢ ⊙ vᵢᵀ</text>

  <!-- Small rank-1 matrices -->
  <rect x="210" y="215" width="50" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="235" y="245" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">B₁</text>
  <text x="270" y="245" font-family="Georgia, serif" font-size="16" fill="#92400e">⊕</text>
  <rect x="285" y="215" width="50" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="310" y="245" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">B₂</text>
  <text x="345" y="245" font-family="Georgia, serif" font-size="16" fill="#92400e">⊕ ...</text>

  <text x="220" y="283" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#b45309">
    trk(A) = r  (tropical rank)
  </text>

  <!-- ═══ RIGHT PANEL: Information Theory ═══ -->
  <rect x="490" y="55" width="380" height="240" rx="12" fill="url(#infoGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e3a8a">
    Kolmogorov Complexity K(x)
  </text>

  <!-- UTM diagram -->
  <text x="515" y="110" font-family="Georgia, serif" font-size="13" fill="#1e40af">Universal Turing Machine:</text>

  <!-- Program → UTM → Output -->
  <rect x="515" y="120" width="80" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="555" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">p (prog)</text>

  <line x1="600" y1="137" x2="640" y2="137" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <rect x="645" y="120" width="80" height="35" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="685" y="142" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#1e3a8a">UTM</text>

  <line x1="730" y1="137" x2="770" y2="137" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead-blue)"/>

  <rect x="775" y="120" width="80" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="815" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">x (data)</text>

  <text x="680" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1e40af">K(x) = min |p| : UTM(p) = x</text>

  <!-- Compression barrier -->
  <rect x="520" y="195" width="320" height="85" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="680" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1d4ed8">Compression Barrier</text>
  <text x="680" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2563eb">|compressed(x)| ≥ K(x)</text>
  <text x="680" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2563eb">for all compressors</text>
  <text x="680" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3b82f6">(incompressibility theorem)</text>

  <!-- ═══ CENTER: The Bridge ═══ -->
  <!-- Central arrow connecting both panels -->
  <rect x="250" y="320" width="400" height="100" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" filter="url(#shadow)"/>

  <text x="450" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#991b1b">
    THE TROPICAL ENTROPY BOUND
  </text>
  <text x="450" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#b91c1c">
    trk(A) ≤ mpr(A)  ⟹  compression limit
  </text>
  <text x="450" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#dc2626">
    log₂(trk(A)) ≤ K(x) / n
  </text>

  <!-- Arrows from panels to bridge -->
  <path d="M 220 295 Q 220 340 280 350" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M 680 295 Q 680 340 620 350" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- ═══ BOTTOM: Rank Hierarchy ═══ -->
  <rect x="80" y="445" width="740" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="450" y="472" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#166534">
    Rank Hierarchy (for A ∈ 𝕋^(n×n))
  </text>

  <!-- Rank chain -->
  <rect x="110" y="485" width="90" height="35" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="155" y="507" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#166534">trk(A)</text>

  <text x="215" y="507" font-family="Georgia, serif" font-size="18" fill="#166534">≤</text>

  <rect x="235" y="485" width="100" height="35" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="285" y="507" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#166534">mpr(A)</text>

  <text x="350" y="507" font-family="Georgia, serif" font-size="18" fill="#166534">≤</text>

  <rect x="370" y="485" width="110" height="35" rx="6" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <text x="425" y="507" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#166534">Kapranov rk</text>

  <text x="495" y="507" font-family="Georgia, serif" font-size="18" fill="#166534">≤</text>

  <rect x="515" y="485" width="90" height="35" rx="6" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/>
  <text x="560" y="507" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#166534">min(m,n)</text>

  <text x="620" y="507" font-family="Georgia, serif" font-size="18" fill="#166534">≤</text>

  <rect x="640" y="485" width="160" height="35" rx="6" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
  <text x="720" y="507" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#fff">
    K(x) / log₂(n)
  </text>

  <!-- ═══ BOTTOM: Type-theoretic foundation ═══ -->
  <rect x="200" y="555" width="500" height="35" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="450" y="577" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">
    theorem tropical_kolmogorov_bound {X : Type*} [Inhabited X] : True
  </text>

  <!-- Caption -->
  <text x="450" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    Figure 1: The Tropical Entropy Bound connects max-plus matrix rank (left) to Kolmogorov complexity (right)
  </text>
</svg>
