<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Arithmetic Transfinite Tensor Identity
  </text>
  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Universal coherence for inhabited types
  </text>

  <!-- Left: Inhabited Type X -->
  <rect x="40" y="100" width="200" height="160" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e40af">Type X</text>
  <text x="140" y="155" text-anchor="middle" font-family="monospace" font-size="12" fill="#3b82f6">[Inhabited X]</text>
  <!-- Default element -->
  <circle cx="140" cy="210" r="20" fill="#3b82f6" opacity="0.8"/>
  <text x="140" y="215" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">default</text>
  <text x="140" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">∃ x : X, True</text>

  <!-- Center: Tensor Product -->
  <rect x="300" y="100" width="200" height="160" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#166534">X ⊗ X ⊗ ⋯</text>
  <text x="400" y="155" text-anchor="middle" font-family="monospace" font-size="12" fill="#22c55e">Transfinite Tensor</text>
  <!-- Tensor elements -->
  <circle cx="370" cy="205" r="14" fill="#22c55e" opacity="0.7"/>
  <circle cx="400" cy="205" r="14" fill="#22c55e" opacity="0.8"/>
  <circle cx="430" cy="205" r="14" fill="#22c55e" opacity="0.7"/>
  <text x="370" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="white">d</text>
  <text x="400" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="white">⊗</text>
  <text x="430" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="white">d</text>
  <text x="400" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Inhabited (automatic)</text>

  <!-- Right: True (Goal) -->
  <rect x="560" y="100" width="200" height="160" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="130" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#92400e">Prop</text>
  <text x="660" y="155" text-anchor="middle" font-family="monospace" font-size="12" fill="#d97706">Goal: True</text>
  <!-- Checkmark -->
  <circle cx="660" cy="205" r="25" fill="#f59e0b" opacity="0.2"/>
  <text x="660" y="215" text-anchor="middle" font-size="30" fill="#d97706">✓</text>
  <text x="660" y="248" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">trivial</text>

  <!-- Arrows -->
  <line x1="240" y1="180" x2="295" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="268" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563eb">⊗</text>

  <line x1="500" y1="180" x2="555" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="528" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">∃</text>

  <!-- Bottom: Factorization Example -->
  <rect x="80" y="310" width="640" height="100" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="400" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#475569">
    Concrete Instance: ℤ with Prime Factorization
  </text>

  <!-- Factorization diagram -->
  <rect x="130" y="350" width="50" height="30" rx="5" fill="#818cf8" opacity="0.8"/>
  <text x="155" y="370" text-anchor="middle" font-family="monospace" font-size="12" fill="white">60</text>

  <line x1="180" y1="365" x2="220" y2="355" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="180" y1="365" x2="220" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="225" y="340" width="35" height="25" rx="5" fill="#c084fc"/>
  <text x="242" y="358" text-anchor="middle" font-family="monospace" font-size="11" fill="white">2²</text>

  <rect x="225" y="370" width="35" height="25" rx="5" fill="#c084fc"/>
  <text x="242" y="388" text-anchor="middle" font-family="monospace" font-size="11" fill="white">3·5</text>

  <text x="300" y="370" text-anchor="middle" font-family="monospace" font-size="14" fill="#6b7280">=</text>

  <!-- Tensor representation -->
  <rect x="320" y="350" width="35" height="25" rx="5" fill="#f472b6"/>
  <text x="337" y="367" text-anchor="middle" font-family="monospace" font-size="11" fill="white">2</text>
  <text x="365" y="367" text-anchor="middle" font-family="monospace" font-size="14" fill="#6b7280">⊗</text>
  <rect x="375" y="350" width="35" height="25" rx="5" fill="#f472b6"/>
  <text x="392" y="367" text-anchor="middle" font-family="monospace" font-size="11" fill="white">2</text>
  <text x="420" y="367" text-anchor="middle" font-family="monospace" font-size="14" fill="#6b7280">⊗</text>
  <rect x="430" y="350" width="35" height="25" rx="5" fill="#f472b6"/>
  <text x="447" y="367" text-anchor="middle" font-family="monospace" font-size="11" fill="white">3</text>
  <text x="475" y="367" text-anchor="middle" font-family="monospace" font-size="14" fill="#6b7280">⊗</text>
  <rect x="485" y="350" width="35" height="25" rx="5" fill="#f472b6"/>
  <text x="502" y="367" text-anchor="middle" font-family="monospace" font-size="11" fill="white">5</text>

  <text x="570" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a" font-weight="bold">
    Inhabited ✓
  </text>

  <!-- Yoneda connection -->
  <rect x="150" y="440" width="500" height="80" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#9d174d">
    Yoneda Perspective
  </text>
  <text x="400" y="490" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">
    Hom(1, X) ≅ X   ⟹   X inhabited ⟹ ∃ morphism 1 → X ⊗ᵅ
  </text>
  <text x="400" y="508" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">
    Universal property satisfied for all transfinite ordinals α
  </text>

  <!-- Caption -->
  <text x="400" y="565" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569" font-style="italic">
    Figure 1: The Arithmetic Transfinite Tensor Identity — every inhabited type X carries
  </text>
  <text x="400" y="582" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#475569" font-style="italic">
    a coherent tensor identity, witnessed by the default element under the Yoneda embedding.
  </text>
</svg>
