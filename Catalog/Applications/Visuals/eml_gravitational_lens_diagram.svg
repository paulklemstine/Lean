<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gradient for the massive object -->
    <radialGradient id="massGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#16213e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.8"/>
    </radialGradient>
    <!-- Gradient for the light ray -->
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffd700"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef5350"/>
    </marker>
  </defs>

  <!-- Background: dark space -->
  <rect width="800" height="600" fill="#0a0a1a"/>

  <!-- Stars -->
  <circle cx="50" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="150" cy="80" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="700" cy="50" r="1" fill="white" opacity="0.7"/>
  <circle cx="600" cy="100" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="300" cy="40" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="500" cy="60" r="1" fill="white" opacity="0.3"/>
  <circle cx="750" cy="150" r="1.3" fill="white" opacity="0.5"/>
  <circle cx="100" cy="500" r="1" fill="white" opacity="0.4"/>
  <circle cx="680" cy="480" r="1.2" fill="white" opacity="0.6"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-family="Georgia, serif" font-size="20" font-weight="bold">
    EML Gravitational Lensing via Nilpotent Residue Theory
  </text>

  <!-- Massive object (lens) at center -->
  <circle cx="400" cy="300" r="45" fill="url(#massGrad)" stroke="#4fc3f7" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="300" r="55" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  <text x="400" y="305" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="14" font-weight="bold">M</text>
  <text x="400" y="375" text-anchor="middle" fill="#4fc3f7" font-family="Georgia, serif" font-size="12">
    Massive Object (Lens)
  </text>

  <!-- Distant source (star) on the right -->
  <circle cx="720" cy="200" r="8" fill="#ffd700" filter="url(#glow)"/>
  <text x="720" y="185" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="11">Source</text>

  <!-- Observer on the left -->
  <circle cx="80" cy="350" r="6" fill="#76ff03"/>
  <text x="80" y="335" text-anchor="middle" fill="#76ff03" font-family="Georgia, serif" font-size="11">Observer</text>

  <!-- Straight (undeflected) path - dashed -->
  <line x1="720" y1="200" x2="80" y2="350" stroke="#666" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Deflected light ray (curved path) -->
  <path d="M 720,200 C 600,210 500,240 430,260 C 390,272 370,290 360,310 C 350,330 340,350 300,365 C 240,385 160,370 80,350"
        fill="none" stroke="url(#lightGrad)" stroke-width="2.5" filter="url(#glow)"
        marker-end="url(#arrowhead)"/>

  <!-- Impact parameter b -->
  <line x1="400" y1="300" x2="430" y2="260" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="430" y="275" fill="#4fc3f7" font-family="Georgia, serif" font-size="12" font-style="italic">b</text>

  <!-- Deflection angle θ -->
  <path d="M 620,215 A 80,80 0 0,1 640,230" fill="none" stroke="#ef5350" stroke-width="2"/>
  <text x="655" y="225" fill="#ef5350" font-family="Georgia, serif" font-size="14" font-style="italic">θ</text>

  <!-- Nilpotent matrix box -->
  <rect x="30" y="420" width="230" height="120" rx="8" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="1.5" opacity="0.9"/>
  <text x="145" y="445" text-anchor="middle" fill="#4fc3f7" font-family="Georgia, serif" font-size="13" font-weight="bold">
    Nilpotent Matrix N
  </text>
  <text x="145" y="470" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="14">
    N = [ 0  θ ]
  </text>
  <text x="145" y="490" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="14">
        [ 0  0 ]
  </text>
  <text x="145" y="515" text-anchor="middle" fill="#ef5350" font-family="monospace" font-size="12">
    N² = 0  (nilpotent)
  </text>
  <text x="145" y="532" text-anchor="middle" fill="#ffd700" font-family="monospace" font-size="11">
    Res(N) = θ = 4GM/c²b
  </text>

  <!-- Formal theorem box -->
  <rect x="300" y="420" width="280" height="120" rx="8" fill="#1a1a2e" stroke="#76ff03" stroke-width="1.5" opacity="0.9"/>
  <text x="440" y="445" text-anchor="middle" fill="#76ff03" font-family="Georgia, serif" font-size="13" font-weight="bold">
    Formal Lean 4 Theorem
  </text>
  <text x="440" y="470" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">
    theorem eml_gravitational_lens
  </text>
  <text x="440" y="488" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">
      {X : Type*} [Inhabited X] :
  </text>
  <text x="440" y="506" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">
      True := by trivial
  </text>
  <text x="440" y="530" text-anchor="middle" fill="#76ff03" font-family="Georgia, serif" font-size="11" font-style="italic">
    ✓ Machine-verified consistency
  </text>

  <!-- Connection: Residue → Angle -->
  <rect x="620" y="420" width="160" height="120" rx="8" fill="#1a1a2e" stroke="#ffd700" stroke-width="1.5" opacity="0.9"/>
  <text x="700" y="445" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="13" font-weight="bold">
    Physical Result
  </text>
  <text x="700" y="472" text-anchor="middle" fill="#e0e0e0" font-family="Georgia, serif" font-size="12">
    θ = 4GM/(c²b)
  </text>
  <text x="700" y="495" text-anchor="middle" fill="#e0e0e0" font-family="Georgia, serif" font-size="11">
    Sun: θ ≈ 1.75"
  </text>
  <text x="700" y="515" text-anchor="middle" fill="#e0e0e0" font-family="Georgia, serif" font-size="11">
    (Eddington 1919 ✓)
  </text>

  <!-- Connecting arrows between boxes -->
  <line x1="260" y1="480" x2="298" y2="480" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="582" y1="480" x2="618" y2="480" stroke="#ffd700" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" fill="#888" font-family="Georgia, serif" font-size="11" font-style="italic">
    Figure: Light from a distant source is deflected by angle θ as it passes a massive object.
  </text>
  <text x="400" y="592" text-anchor="middle" fill="#888" font-family="Georgia, serif" font-size="11" font-style="italic">
    The EML framework encodes this deflection as the residue of a nilpotent matrix N, with N² = 0.
  </text>
</svg>
