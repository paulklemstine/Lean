<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Gradient for the massive lens -->
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#16213e;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.6" />
    </radialGradient>
    <!-- Gradient for the sheaf fiber -->
    <linearGradient id="sheafGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:0.8" />
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#66bb6a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0a0a23" rx="10" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#ffffff" font-weight="bold">
    EML Gravitational Lensing via Nilpotent Residue Theory
  </text>

  <!-- ================================================================== -->
  <!-- SPACETIME GRID (curved) -->
  <!-- ================================================================== -->
  <g opacity="0.15" stroke="#4fc3f7" stroke-width="0.5" fill="none">
    <!-- Horizontal grid lines, curved near the lens -->
    <path d="M 50,120 Q 350,120 400,160 Q 450,200 500,160 Q 550,120 850,120" />
    <path d="M 50,160 Q 350,155 400,190 Q 450,230 500,190 Q 550,155 850,160" />
    <path d="M 50,200 Q 350,190 400,230 Q 450,280 500,230 Q 550,190 850,200" />
    <path d="M 50,240 Q 350,235 400,270 Q 450,310 500,270 Q 550,235 850,240" />
    <path d="M 50,280 Q 350,280 400,310 Q 450,340 500,310 Q 550,280 850,280" />
    <path d="M 50,320 Q 350,325 400,340 Q 450,360 500,340 Q 550,325 850,320" />
    <path d="M 50,360 Q 350,365 400,370 Q 450,380 500,370 Q 550,365 850,360" />
    <path d="M 50,400 Q 350,400 400,400 Q 450,400 500,400 Q 550,400 850,400" />
    <!-- Vertical grid lines -->
    <line x1="150" y1="80" x2="150" y2="420" />
    <line x1="250" y1="80" x2="250" y2="420" />
    <line x1="350" y1="80" x2="350" y2="420" />
    <line x1="550" y1="80" x2="550" y2="420" />
    <line x1="650" y1="80" x2="650" y2="420" />
    <line x1="750" y1="80" x2="750" y2="420" />
  </g>

  <!-- ================================================================== -->
  <!-- MASSIVE LENS (center) -->
  <!-- ================================================================== -->
  <circle cx="450" cy="260" r="45" fill="url(#lensGrad)" stroke="#4fc3f7" stroke-width="2" />
  <circle cx="450" cy="260" r="35" fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.4" />
  <circle cx="450" cy="260" r="60" fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.2" stroke-dasharray="4,4" />
  <text x="450" y="265" text-anchor="middle" font-family="monospace" font-size="14" fill="#4fc3f7" font-weight="bold">M</text>
  <text x="450" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4fc3f7" opacity="0.8">Massive Lens</text>

  <!-- ================================================================== -->
  <!-- LIGHT SOURCE (left) -->
  <!-- ================================================================== -->
  <circle cx="80" cy="260" r="12" fill="#ffeb3b" opacity="0.9" />
  <circle cx="80" cy="260" r="18" fill="none" stroke="#ffeb3b" stroke-width="1" opacity="0.4" />
  <text x="80" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffeb3b">Source S</text>

  <!-- ================================================================== -->
  <!-- OBSERVER (right) -->
  <!-- ================================================================== -->
  <circle cx="820" cy="260" r="10" fill="#66bb6a" />
  <circle cx="820" cy="260" r="16" fill="none" stroke="#66bb6a" stroke-width="1" opacity="0.4" />
  <text x="820" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#66bb6a">Observer O</text>

  <!-- ================================================================== -->
  <!-- LIGHT RAYS (bent by lens) -->
  <!-- ================================================================== -->
  <!-- Upper ray -->
  <path d="M 92,255 Q 300,140 450,160 Q 600,180 808,255"
        fill="none" stroke="#ffeb3b" stroke-width="2" opacity="0.8"
        marker-end="url(#arrowGreen)" />
  <!-- Lower ray -->
  <path d="M 92,265 Q 300,380 450,360 Q 600,340 808,265"
        fill="none" stroke="#ffeb3b" stroke-width="2" opacity="0.8"
        marker-end="url(#arrowGreen)" />

  <!-- Straight (unlensed) ray -->
  <line x1="92" y1="260" x2="808" y2="260"
        stroke="#ffffff" stroke-width="1" opacity="0.2" stroke-dasharray="6,4" />

  <!-- ================================================================== -->
  <!-- DEFLECTION ANGLE annotation -->
  <!-- ================================================================== -->
  <!-- Angle arc at observer -->
  <path d="M 790,240 A 30,30 0 0,1 790,280" fill="none" stroke="#e94560" stroke-width="2" />
  <text x="760" y="265" text-anchor="middle" font-family="serif" font-size="16" fill="#e94560" font-style="italic">α</text>
  <text x="760" y="280" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#e94560">= 4GM/c²b</text>

  <!-- Impact parameter -->
  <line x1="450" y1="260" x2="450" y2="160" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3" />
  <text x="465" y="210" font-family="serif" font-size="14" fill="#e94560" font-style="italic">b</text>

  <!-- ================================================================== -->
  <!-- ALGEBRAIC FRAMEWORK (bottom section) -->
  <!-- ================================================================== -->

  <!-- Dividing line -->
  <line x1="50" y1="430" x2="850" y2="430" stroke="#ffffff" stroke-width="0.5" opacity="0.3" />

  <!-- Sheaf over spacetime -->
  <rect x="60" y="450" width="200" height="70" rx="8" fill="none" stroke="url(#sheafGrad)" stroke-width="2" />
  <text x="160" y="475" text-anchor="middle" font-family="monospace" font-size="13" fill="#e94560" font-weight="bold">
    Sheaf F(U)
  </text>
  <text x="160" y="495" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaaaaa">
    Sections over spacetime
  </text>
  <text x="160" y="510" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaaaaa">
    (meromorphic data)
  </text>

  <!-- Arrow: Sheaf → Residue -->
  <line x1="270" y1="485" x2="340" y2="485" stroke="#e94560" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="305" y="478" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#e94560">Res</text>

  <!-- Residue algebra -->
  <rect x="350" y="450" width="200" height="70" rx="8" fill="none" stroke="#bb86fc" stroke-width="2" />
  <text x="450" y="475" text-anchor="middle" font-family="monospace" font-size="13" fill="#bb86fc" font-weight="bold">
    A = A₀ ⊕ N
  </text>
  <text x="450" y="495" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaaaaa">
    Classical ⊕ Nilpotent
  </text>
  <text x="450" y="510" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaaaaa">
    (N² = 0)
  </text>

  <!-- Arrow: Residue → Completion -->
  <line x1="560" y1="485" x2="630" y2="485" stroke="#bb86fc" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="595" y="478" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#bb86fc">A/N</text>

  <!-- Result: True -->
  <rect x="640" y="450" width="200" height="70" rx="8" fill="none" stroke="#66bb6a" stroke-width="2" />
  <text x="740" y="475" text-anchor="middle" font-family="monospace" font-size="13" fill="#66bb6a" font-weight="bold">
    A₀ ≅ Classical
  </text>
  <text x="740" y="495" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaaaaa">
    Nilpotent part killed
  </text>
  <text x="740" y="510" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#66bb6a" font-weight="bold">
    ⟹ True ✓
  </text>

  <!-- ================================================================== -->
  <!-- LABELS: EML Self-Pairing -->
  <!-- ================================================================== -->
  <text x="450" y="545" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff" opacity="0.7">
    EML Self-Pairing: ⟨f, g⟩ = Res(f · g) — nilpotent ideal N is in ker(Res)
  </text>

  <!-- ================================================================== -->
  <!-- Caption -->
  <!-- ================================================================== -->
  <text x="450" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#888888" font-style="italic">
    Figure: Light bending by a massive lens M, with algebraic decomposition via EML nilpotent residue theory.
  </text>
</svg>
