<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="compositeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="oracleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Non-Archimedean Factoring Oracle
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d" font-style="italic">
    Corrected theorem: composite n &gt; 1 ⟹ ∃ a, b &gt; 1 with a · b = n
  </text>

  <!-- The natural numbers > 1 -->
  <rect x="50" y="80" width="700" height="110" rx="12" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    ℕ &gt; 1
  </text>

  <!-- Primes (red region) -->
  <rect x="70" y="110" width="300" height="65" rx="8" fill="url(#primeGrad)" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="220" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c0392b">
    Primes (¬ ∃ a,b &gt; 1, a·b = n)
  </text>
  <!-- Prime numbers -->
  <g font-family="monospace" font-size="16" fill="#e74c3c" font-weight="bold">
    <text x="100" y="160">2</text>
    <text x="140" y="160">3</text>
    <text x="175" y="160">5</text>
    <text x="210" y="160">7</text>
    <text x="245" y="160">11</text>
    <text x="290" y="160">13</text>
    <text x="335" y="160">…</text>
  </g>

  <!-- Composites (green region) -->
  <rect x="400" y="110" width="330" height="65" rx="8" fill="url(#compositeGrad)" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
  <text x="565" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
    Composites (∃ a,b &gt; 1, a·b = n) ✓
  </text>
  <!-- Composite numbers -->
  <g font-family="monospace" font-size="16" fill="#27ae60" font-weight="bold">
    <text x="420" y="160">4</text>
    <text x="455" y="160">6</text>
    <text x="490" y="160">9</text>
    <text x="525" y="160">10</text>
    <text x="565" y="160">12</text>
    <text x="610" y="160">15</text>
    <text x="660" y="160">21</text>
    <text x="705" y="160">…</text>
  </g>

  <!-- Arrow from composites to oracle -->
  <line x1="565" y1="180" x2="400" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555" transform="rotate(-12, 500, 210)">
    input
  </text>

  <!-- The Oracle Box -->
  <rect x="250" y="235" width="300" height="80" rx="12" fill="url(#oracleGrad)" stroke="#2471a3" stroke-width="2"/>
  <text x="400" y="263" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="white">
    Factoring Oracle
  </text>
  <text x="400" y="283" text-anchor="middle" font-family="monospace" font-size="11" fill="#d4e6f1">
    Nat.exists_dvd_of_not_prime2
  </text>
  <text x="400" y="303" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#d4e6f1">
    k | n,  1 &lt; k &lt; n  →  (k, n/k)
  </text>

  <!-- Output arrow -->
  <line x1="400" y1="320" x2="400" y2="365" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="425" y="348" font-family="sans-serif" font-size="11" fill="#555">output</text>

  <!-- Output: the factorization -->
  <rect x="250" y="370" width="300" height="60" rx="10" fill="#f9e79f" stroke="#f39c12" stroke-width="1.5"/>
  <text x="400" y="395" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7d6608">
    (a, b)  with  a · b = n
  </text>
  <text x="400" y="418" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a7d0a">
    a &gt; 1  ∧  b &gt; 1
  </text>

  <!-- Example: n = 21 -->
  <rect x="80" y="370" width="140" height="130" rx="8" fill="#eaf2f8" stroke="#5dade2" stroke-width="1"/>
  <text x="150" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2e86c1">Example: n = 21</text>
  <text x="150" y="415" text-anchor="middle" font-family="monospace" font-size="14" fill="#2c3e50">21 = 3 × 7</text>
  <text x="150" y="440" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5d6d7e">v₃(21) = 1</text>
  <text x="150" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5d6d7e">v₇(21) = 1</text>
  <text x="150" y="485" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#27ae60" font-weight="bold">a=3, b=7 ✓</text>

  <!-- Counterexample: n = 7 -->
  <rect x="580" y="370" width="140" height="130" rx="8" fill="#fdedec" stroke="#e74c3c" stroke-width="1"/>
  <text x="650" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Counterexample</text>
  <text x="650" y="415" text-anchor="middle" font-family="monospace" font-size="14" fill="#2c3e50">n = 7 (prime)</text>
  <text x="650" y="440" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5d6d7e">No a,b &gt; 1</text>
  <text x="650" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5d6d7e">with a·b = 7</text>
  <text x="650" y="485" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e74c3c" font-weight="bold">Original thm FAILS ✗</text>

  <!-- X mark on arrow from primes -->
  <line x1="220" y1="180" x2="350" y2="235" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="265" y="215" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#e74c3c" font-weight="bold">✗</text>

  <!-- Caption -->
  <text x="400" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5d6d7e" font-style="italic">
    The factoring oracle applies only to composite numbers. Primes are irreducible by definition,
  </text>
  <text x="400" y="563" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5d6d7e" font-style="italic">
    making the original (unrestricted) theorem false. The corrected theorem adds ¬ n.Prime.
  </text>
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#95a5a6">
    Verified in Lean 4 / Mathlib v4.28.0 using Nat.exists_dvd_of_not_prime2
  </text>
</svg>
