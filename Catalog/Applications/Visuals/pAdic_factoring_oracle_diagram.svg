<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Non-Archimedean Factoring Oracle
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Nontrivial Factorization of Composite Numbers
  </text>

  <!-- Main set: ℕ > 1 -->
  <ellipse cx="400" cy="280" rx="350" ry="210" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="400" y="95" text-anchor="middle" font-family="monospace" font-size="16" fill="#2c3e50" font-weight="bold">
    ℕ &gt; 1
  </text>

  <!-- Prime region (left) -->
  <ellipse cx="240" cy="280" rx="140" ry="150" fill="url(#primeGrad)" opacity="0.15" stroke="#ee5a24" stroke-width="2"/>
  <text x="240" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#ee5a24">
    Primes
  </text>
  <text x="240" y="168" text-anchor="middle" font-family="monospace" font-size="11" fill="#ee5a24">
    (Nat.Prime n)
  </text>

  <!-- Prime numbers -->
  <g font-family="monospace" font-size="18" fill="#c0392b" font-weight="bold">
    <text x="200" y="210">2</text>
    <text x="260" y="210">3</text>
    <text x="230" y="250">5</text>
    <text x="190" y="290">7</text>
    <text x="260" y="290">11</text>
    <text x="220" y="330">13</text>
    <text x="270" y="340">17</text>
    <text x="200" y="370">19</text>
    <text x="255" y="380">23</text>
  </g>

  <!-- Red X marks on primes -->
  <g stroke="#c0392b" stroke-width="2" opacity="0.6">
    <line x1="195" y1="195" x2="215" y2="215"/>
    <line x1="215" y1="195" x2="195" y2="215"/>
    <text x="190" y="225" font-family="Georgia" font-size="9" fill="#c0392b" stroke="none">no split</text>
  </g>

  <!-- Composite region (right) -->
  <ellipse cx="530" cy="280" rx="170" ry="170" fill="url(#compGrad)" opacity="0.12" stroke="#2ecc71" stroke-width="2"/>
  <text x="530" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#27ae60">
    Composites
  </text>
  <text x="530" y="153" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60">
    (¬ Nat.Prime n)
  </text>

  <!-- Composite numbers with factorizations -->
  <g font-family="monospace" font-size="14" fill="#27ae60">
    <text x="460" y="210">4 = 2×2</text>
    <text x="560" y="210">6 = 2×3</text>
    <text x="470" y="250">8 = 2×4</text>
    <text x="580" y="250">9 = 3×3</text>
    <text x="460" y="290">10 = 2×5</text>
    <text x="580" y="290">12 = 2×6</text>
    <text x="470" y="330">14 = 2×7</text>
    <text x="580" y="330">15 = 3×5</text>
    <text x="490" y="370">16 = 2×8</text>
    <text x="580" y="370">18 = 2×9</text>
  </g>

  <!-- Green checkmarks on composites -->
  <g stroke="#27ae60" stroke-width="2.5" fill="none" opacity="0.7">
    <polyline points="445,203 450,208 460,198"/>
    <polyline points="545,203 550,208 560,198"/>
  </g>

  <!-- Arrow: Factoring Oracle -->
  <path d="M 530 440 L 530 470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Oracle box -->
  <rect x="380" y="475" width="300" height="60" rx="8" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="530" y="498" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2c3e50">
    Factoring Oracle
  </text>
  <text x="530" y="518" text-anchor="middle" font-family="monospace" font-size="11" fill="#2c3e50">
    n ↦ (minFac(n), n / minFac(n))
  </text>

  <!-- Theorem statement box -->
  <rect x="60" y="475" width="280" height="60" rx="8" fill="#9b59b6" opacity="0.12" stroke="#9b59b6" stroke-width="2"/>
  <text x="200" y="498" text-anchor="middle" font-family="monospace" font-size="10" fill="#8e44ad">
    ∃ a b : ℕ, a * b = n
  </text>
  <text x="200" y="518" text-anchor="middle" font-family="monospace" font-size="10" fill="#8e44ad">
    ∧ a &gt; 1 ∧ b &gt; 1
  </text>

  <!-- Connecting arrow from composites to theorem -->
  <path d="M 380 505 L 340 505" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="4,3"/>

  <!-- Caption -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7f8c8d" font-style="italic">
    Every composite n &gt; 1 admits a nontrivial factorization. Primes (red) do not — the original claim was false.
  </text>
</svg>
