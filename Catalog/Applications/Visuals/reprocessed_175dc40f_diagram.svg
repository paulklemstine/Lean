<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3d9f2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Quantum Berggren Superposition
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Pythagorean Triples as Quantum States on the Unit Circle
  </text>

  <!-- ═══════ LEFT: Berggren Tree ═══════ -->
  <text x="200" y="85" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#2980b9">
    Berggren Tree (State Space)
  </text>

  <!-- Depth 0: Seed -->
  <circle cx="200" cy="130" r="22" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="200" y="135" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">(3,4,5)</text>

  <!-- Depth 1: Three children -->
  <!-- Branch A -->
  <line x1="185" y1="150" x2="90" y2="210" stroke="#3498db" stroke-width="2"/>
  <text x="125" y="185" font-family="monospace" font-size="9" fill="#3498db" transform="rotate(-35 125 185)">A</text>
  <circle cx="80" cy="220" r="20" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="80" y="225" text-anchor="middle" font-family="monospace" font-size="8" fill="white" font-weight="bold">(5,12,13)</text>

  <!-- Branch B -->
  <line x1="200" y1="152" x2="200" y2="210" stroke="#2ecc71" stroke-width="2"/>
  <text x="210" y="185" font-family="monospace" font-size="9" fill="#2ecc71">B</text>
  <circle cx="200" cy="220" r="20" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="200" y="225" text-anchor="middle" font-family="monospace" font-size="8" fill="white" font-weight="bold">(21,20,29)</text>

  <!-- Branch C -->
  <line x1="215" y1="150" x2="310" y2="210" stroke="#9b59b6" stroke-width="2"/>
  <text x="275" y="185" font-family="monospace" font-size="9" fill="#9b59b6" transform="rotate(35 275 185)">C</text>
  <circle cx="320" cy="220" r="20" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="320" y="225" text-anchor="middle" font-family="monospace" font-size="8" fill="white" font-weight="bold">(15,8,17)</text>

  <!-- Depth 2 (partial, from first child) -->
  <line x1="65" y1="238" x2="30" y2="280" stroke="#95a5a6" stroke-width="1.5"/>
  <circle cx="25" cy="290" r="14" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="25" y="294" text-anchor="middle" font-family="monospace" font-size="6" fill="white">(7,24,25)</text>

  <line x1="80" y1="240" x2="80" y2="280" stroke="#95a5a6" stroke-width="1.5"/>
  <circle cx="80" cy="290" r="14" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="80" y="294" text-anchor="middle" font-family="monospace" font-size="6" fill="white">(55,48,73)</text>

  <line x1="95" y1="238" x2="135" y2="280" stroke="#95a5a6" stroke-width="1.5"/>
  <circle cx="140" cy="290" r="14" fill="#f39c12" stroke="#e67e22" stroke-width="1.5"/>
  <text x="140" y="294" text-anchor="middle" font-family="monospace" font-size="6" fill="white">(45,28,53)</text>

  <!-- Ellipsis -->
  <text x="200" y="300" text-anchor="middle" font-family="monospace" font-size="18" fill="#bdc3c7">· · ·</text>
  <text x="320" y="300" text-anchor="middle" font-family="monospace" font-size="18" fill="#bdc3c7">· · ·</text>

  <!-- Labels -->
  <text x="200" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d" font-style="italic">
    Each node = primitive triple = quantum state
  </text>
  <text x="200" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7f8c8d" font-style="italic">
    gcd(a,b,c) = 1 ↔ irreducible state
  </text>

  <!-- ═══════ RIGHT: Unit Circle ═══════ -->
  <text x="600" y="85" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#27ae60">
    Unit Circle (Amplitude Space)
  </text>

  <!-- Unit circle -->
  <circle cx="600" cy="240" r="160" fill="url(#circleGrad)" stroke="#2c3e50" stroke-width="1.5" opacity="0.5"/>

  <!-- Quarter circle arc (first quadrant) highlighted -->
  <path d="M 760 240 A 160 160 0 0 0 600 80" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- Axes -->
  <line x1="430" y1="240" x2="775" y2="240" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="600" y1="410" x2="600" y2="70" stroke="#2c3e50" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Axis labels -->
  <text x="770" y="255" font-family="monospace" font-size="11" fill="#2c3e50">α = a/c</text>
  <text x="610" y="78" font-family="monospace" font-size="11" fill="#2c3e50">β = b/c</text>

  <!-- Quantum state points on the circle -->
  <!-- (3,4,5) → (0.6, 0.8) -->
  <circle cx="696" cy="112" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="710" y="105" font-family="monospace" font-size="9" fill="#e74c3c" font-weight="bold">(3/5, 4/5)</text>
  <line x1="600" y1="240" x2="692" y2="116" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- (5,12,13) → (5/13, 12/13) ≈ (0.385, 0.923) -->
  <circle cx="661.5" cy="92.3" r="7" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
  <text x="660" y="82" font-family="monospace" font-size="8" fill="#e67e22">(5/13, 12/13)</text>

  <!-- (21,20,29) → (20/29, 21/29) ≈ (0.690, 0.724) -->
  <circle cx="710.3" cy="124.2" r="7" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
  <text x="725" y="130" font-family="monospace" font-size="8" fill="#e67e22">(20/29, 21/29)</text>

  <!-- (8,15,17) → (8/17, 15/17) ≈ (0.471, 0.882) -->
  <circle cx="675.3" cy="99" r="7" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
  <text x="540" y="96" font-family="monospace" font-size="8" fill="#e67e22">(8/17, 15/17)</text>

  <!-- Additional rational points -->
  <circle cx="740" cy="152" r="5" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <circle cx="644" cy="88" r="5" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <circle cx="725" cy="105" r="5" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <circle cx="655" cy="108" r="5" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>

  <!-- Born rule annotation -->
  <rect x="490" y="355" width="220" height="45" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="600" y="373" text-anchor="middle" font-family="monospace" font-size="11" fill="#2c3e50" font-weight="bold">Born Rule:</text>
  <text x="600" y="393" text-anchor="middle" font-family="monospace" font-size="12" fill="#e74c3c">
    α² + β² = a²/c² + b²/c² = 1
  </text>

  <!-- ═══════ CORRESPONDENCE ARROW ═══════ -->
  <line x1="370" y1="200" x2="450" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555" font-weight="bold">Φ</text>
  <text x="410" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#7f8c8d">(a,b,c) ↦ (a/c, b/c)</text>

  <!-- ═══════ LEGEND ═══════ -->
  <rect x="30" y="410" width="740" height="100" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>

  <text x="400" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#2c3e50">
    Correspondence Dictionary
  </text>

  <!-- Legend entries -->
  <circle cx="70" cy="460" r="6" fill="#e74c3c"/>
  <text x="85" y="464" font-family="monospace" font-size="10" fill="#2c3e50">Seed (3,4,5) = Ground state</text>

  <circle cx="70" cy="485" r="6" fill="#e67e22"/>
  <text x="85" y="489" font-family="monospace" font-size="10" fill="#2c3e50">Depth 1 = First excitations</text>

  <circle cx="350" cy="460" r="6" fill="#f39c12"/>
  <text x="365" y="464" font-family="monospace" font-size="10" fill="#2c3e50">Depth 2+ = Higher states</text>

  <rect x="345" y="479" width="12" height="12" fill="#27ae60" rx="2"/>
  <text x="365" y="490" font-family="monospace" font-size="10" fill="#2c3e50">First-quadrant arc = Physical states</text>

  <text x="610" y="464" font-family="monospace" font-size="10" fill="#2c3e50">Coprime ↔ Irreducible</text>
  <text x="610" y="489" font-family="monospace" font-size="10" fill="#2c3e50">Tree branch ↔ Measurement</text>

  <!-- ═══════ CAPTION ═══════ -->
  <text x="400" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2c3e50" font-style="italic">
    Figure 1: The Berggren tree (left) generates all primitive Pythagorean triples,
  </text>
  <text x="400" y="563" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2c3e50" font-style="italic">
    each mapping via Φ to a rational point on S¹ (right) — a quantum state with exact amplitudes.
  </text>
  <text x="400" y="581" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2c3e50" font-style="italic">
    Coprimality ensures irreducibility; the Born rule α² + β² = 1 follows from a² + b² = c².
  </text>

  <!-- Formal verification badge -->
  <rect x="280" y="600" width="240" height="30" rx="15" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
  <text x="400" y="620" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">
    ✓ Verified in Lean 4 + Mathlib
  </text>
</svg>
