<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">
    Arithmetic Parabolic Interference Classification
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#666">
    Universal property in the category of entropy algebra classifications
  </text>

  <!-- Left: Entropy Algebra Space -->
  <g transform="translate(120, 160)">
    <!-- Parabolic curve -->
    <path d="M -60,80 Q 0,-40 60,80" stroke="#2563eb" stroke-width="2.5" fill="none"/>
    <path d="M -50,70 Q 0,-20 50,70" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M -40,60 Q 0,0 40,60" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.3"/>

    <!-- Points on the parabola -->
    <circle cx="-45" cy="65" r="5" fill="#dc2626"/>
    <text x="-45" y="90" text-anchor="middle" font-size="11" fill="#dc2626">x₁</text>

    <circle cx="0" cy="-30" r="5" fill="#dc2626"/>
    <text x="12" y="-25" font-size="11" fill="#dc2626">x₀ (default)</text>

    <circle cx="45" cy="65" r="5" fill="#dc2626"/>
    <text x="45" y="90" text-anchor="middle" font-size="11" fill="#dc2626">x₂</text>

    <!-- Interference arcs -->
    <path d="M -40,65 Q 0,30 40,65" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
    <text x="0" y="50" text-anchor="middle" font-size="9" fill="#f59e0b">interference</text>

    <!-- Label -->
    <text x="0" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">
      Entropy Algebra Space (X, e)
    </text>
    <text x="0" y="130" text-anchor="middle" font-size="10" fill="#555">
      [Inhabited X] — has default element
    </text>
  </g>

  <!-- Center: Arrow (classification functor) -->
  <g transform="translate(340, 220)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="50" y="-12" text-anchor="middle" font-size="11" fill="#333">classify</text>
    <text x="50" y="18" text-anchor="middle" font-size="10" fill="#888">F : Ent → Class</text>
  </g>

  <!-- Right: Classification Category -->
  <g transform="translate(580, 160)">
    <!-- Objects -->
    <rect x="-70" y="-50" width="140" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="-25" text-anchor="middle" font-size="12" fill="#065f46">Classification C₁</text>

    <rect x="-70" y="10" width="140" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="35" text-anchor="middle" font-size="12" fill="#065f46">Classification C₂</text>

    <rect x="-70" y="70" width="140" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="95" text-anchor="middle" font-size="12" fill="#065f46">Classification C₃</text>

    <!-- Terminal object -->
    <rect x="-80" y="140" width="160" height="45" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="0" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">⊤ (Terminal = True)</text>
    <text x="0" y="175" text-anchor="middle" font-size="10" fill="#92400e">Universal Classification</text>

    <!-- Unique morphisms to terminal -->
    <line x1="70" y1="-30" x2="80" y2="145" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
    <line x1="70" y1="30" x2="80" y2="150" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
    <line x1="70" y1="90" x2="80" y2="155" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>

    <text x="105" y="100" font-size="9" fill="#f59e0b" transform="rotate(50, 105, 100)">∃! morphism</text>
  </g>

  <!-- Bottom: Tropical / Spectral Sequence connection -->
  <g transform="translate(400, 420)">
    <rect x="-350" y="-20" width="700" height="100" rx="10" fill="#f0f4ff" stroke="#6366f1" stroke-width="1"/>

    <!-- Tropical semiring -->
    <g transform="translate(-200, 0)">
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">Tropical Semiring</text>
      <text x="0" y="22" text-anchor="middle" font-size="11" fill="#555">(ℝ ∪ {∞}, min, +)</text>
      <text x="0" y="40" text-anchor="middle" font-size="10" fill="#777">Max-plus entropy proxy</text>
      <text x="0" y="55" text-anchor="middle" font-size="10" fill="#777">for Kolmogorov complexity</text>
    </g>

    <!-- Double arrow -->
    <line x1="-60" y1="15" x2="60" y2="15" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
    <line x1="60" y1="25" x2="-60" y2="25" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
    <text x="0" y="8" text-anchor="middle" font-size="9" fill="#6366f1">spectral sequence</text>

    <!-- Sheaf cohomology -->
    <g transform="translate(200, 0)">
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">Sheaf Cohomology</text>
      <text x="0" y="22" text-anchor="middle" font-size="11" fill="#555">H*(X, ℰ)</text>
      <text x="0" y="40" text-anchor="middle" font-size="10" fill="#777">Information redundancy</text>
      <text x="0" y="55" text-anchor="middle" font-size="10" fill="#777">measured by higher cohomology</text>
    </g>
  </g>

  <!-- Caption -->
  <text x="400" y="560" text-anchor="middle" font-size="11" fill="#444" font-style="italic">
    The parabolic interference classification admits a terminal (universal) object ⊤ ≅ True.
  </text>
  <text x="400" y="578" text-anchor="middle" font-size="10" fill="#888">
    Every classification Cᵢ has a unique morphism to ⊤, establishing the universal property.
  </text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
  </defs>
</svg>
