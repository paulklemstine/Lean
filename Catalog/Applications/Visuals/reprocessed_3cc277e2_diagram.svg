<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed" />
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="10"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Geometric Optimal Hamiltonian Principle — Categorical Diagram
  </text>

  <!-- ═══ LEFT: Spacetime Category ═══ -->
  <rect x="30" y="60" width="250" height="280" rx="12" fill="white" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Spacetime Category</text>
  <text x="155" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Cat(X) — inhabited type X</text>

  <!-- Nodes of the category -->
  <circle cx="90" cy="150" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="155" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₀</text>

  <circle cx="200" cy="140" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₁</text>

  <circle cx="155" cy="220" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="225" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₂</text>

  <circle cx="80" cy="290" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="295" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₃</text>

  <circle cx="220" cy="280" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="285" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₄</text>

  <!-- Morphisms (causal arrows) -->
  <line x1="108" y1="148" x2="180" y2="142" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="95" y1="168" x2="137" y2="205" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="195" y1="158" x2="163" y2="203" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="140" y1="235" x2="95" y2="275" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="170" y1="235" x2="205" y2="265" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Inhabited marker -->
  <circle cx="90" cy="150" r="24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="125" y="130" font-family="Arial, sans-serif" font-size="9" fill="#d97706" font-weight="bold">default</text>

  <!-- ═══ MIDDLE: Hamiltonian Flow ═══ -->
  <rect x="325" y="60" width="250" height="280" rx="12" fill="white" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Hamiltonian Flow</text>
  <text x="450" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">H : T*X → ℝ (phase space)</text>

  <!-- Phase space trajectory (ellipse) -->
  <ellipse cx="450" cy="210" rx="80" ry="100" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Flow arrows along ellipse -->
  <path d="M 530,210 Q 530,150 450,110" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 450,110 Q 370,150 370,210" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 370,210 Q 370,270 450,310" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 450,310 Q 530,270 530,210" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Labels -->
  <text x="540" y="210" font-family="monospace" font-size="11" fill="#166534">q</text>
  <text x="450" y="100" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">p</text>

  <!-- Extremal path highlight -->
  <path d="M 395,300 Q 420,200 470,130" fill="none" stroke="#ef4444" stroke-width="3"/>
  <text x="410" y="190" font-family="Arial, sans-serif" font-size="10" fill="#ef4444" font-weight="bold">optimal</text>
  <text x="415" y="203" font-family="Arial, sans-serif" font-size="10" fill="#ef4444" font-weight="bold">path γ*</text>

  <!-- ═══ RIGHT: Tropical Dual ═══ -->
  <rect x="620" y="60" width="250" height="280" rx="12" fill="white" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Tropical Dual</text>
  <text x="745" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">(ℝ, min, +) — idempotent semiring</text>

  <!-- Tropical curve (piecewise linear) -->
  <polyline points="650,300 690,250 720,250 745,200 770,180 800,180 840,140"
            fill="none" stroke="#7c3aed" stroke-width="2.5"/>

  <!-- Vertices of tropical curve -->
  <circle cx="690" cy="250" r="5" fill="#7c3aed"/>
  <circle cx="720" cy="250" r="5" fill="#7c3aed"/>
  <circle cx="745" cy="200" r="5" fill="#7c3aed"/>
  <circle cx="770" cy="180" r="5" fill="#7c3aed"/>
  <circle cx="800" cy="180" r="5" fill="#7c3aed"/>

  <!-- Labels -->
  <text x="680" y="270" font-family="monospace" font-size="9" fill="#5b21b6">min</text>
  <text x="755" y="170" font-family="monospace" font-size="9" fill="#5b21b6">⊕ = min</text>
  <text x="755" y="320" font-family="monospace" font-size="9" fill="#5b21b6">⊗ = +</text>

  <!-- Grid lines for tropical -->
  <line x1="650" y1="310" x2="850" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="650" y1="280" x2="850" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="650" y1="250" x2="850" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="650" y1="220" x2="850" y2="220" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="650" y1="190" x2="850" y2="190" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="650" y1="160" x2="850" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="650" y1="130" x2="850" y2="130" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ═══ Connecting Arrows ═══ -->
  <!-- Spacetime → Hamiltonian -->
  <path d="M 280,200 L 320,200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">lift</text>

  <!-- Hamiltonian → Tropical -->
  <path d="M 575,200 L 615,200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="595" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">trop</text>

  <!-- ═══ BOTTOM: Universal Property ═══ -->
  <rect x="200" y="380" width="500" height="130" rx="12" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">Universal Property</text>

  <!-- Commutative diagram -->
  <!-- Cat(X) -->
  <text x="280" y="445" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">Cat(X)</text>
  <!-- Trop(H) -->
  <text x="620" y="445" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">Trop(H)</text>
  <!-- True -->
  <text x="450" y="495" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#dc2626">True</text>

  <!-- Arrows in commutative diagram -->
  <line x1="310" y1="440" x2="590" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="450" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">tropical duality</text>

  <line x1="290" y1="455" x2="430" y2="488" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="340" y="480" font-family="Arial, sans-serif" font-size="10" fill="#475569">∃ default</text>

  <line x1="610" y1="455" x2="470" y2="488" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="560" y="480" font-family="Arial, sans-serif" font-size="10" fill="#475569">min ∃</text>

  <!-- Inhabited badge -->
  <rect x="390" y="400" width="120" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e">[Inhabited X]</text>

  <!-- ═══ Proof Tag ═══ -->
  <rect x="340" y="530" width="220" height="35" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="553" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#166534">Proof: trivial ∎</text>

  <!-- Caption -->
  <text x="450" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    Figure 1: The geometric optimal Hamiltonian principle factors through tropical duality,
  </text>
  <text x="450" y="616" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    collapsing to the universal property True for any inhabited type X.
  </text>
</svg>
