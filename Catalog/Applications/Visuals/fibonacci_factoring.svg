<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1b2838"/>
      <stop offset="100%" style="stop-color:#171a21"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="580" fill="url(#bg5)"/>
  
  <text x="450" y="35" text-anchor="middle" fill="#f78166" font-size="22" font-weight="bold" filter="url(#glow5)">
    Fibonacci-Based Factoring
  </text>
  <text x="450" y="55" text-anchor="middle" fill="#8b949e" font-size="12">
    gcd(F_m, F_n) = F_{gcd(m,n)} — The Fibonacci GCD identity as a factoring engine
  </text>

  <!-- Fibonacci spiral visualization (simplified) -->
  <g transform="translate(200, 200)" opacity="0.15">
    <rect x="0" y="0" width="120" height="120" fill="none" stroke="#f78166" stroke-width="1"/>
    <rect x="120" y="0" width="75" height="75" fill="none" stroke="#f78166" stroke-width="1"/>
    <rect x="120" y="75" width="45" height="45" fill="none" stroke="#f78166" stroke-width="1"/>
    <rect x="165" y="75" width="30" height="30" fill="none" stroke="#f78166" stroke-width="1"/>
  </g>

  <!-- GCD Identity Box -->
  <rect x="50" y="80" width="380" height="100" rx="12" fill="#1b2838" stroke="#f78166" stroke-width="2"/>
  <text x="240" y="108" text-anchor="middle" fill="#f78166" font-size="15" font-weight="bold">Core Identity (Verified)</text>
  <text x="240" y="138" text-anchor="middle" fill="white" font-size="18" font-weight="bold">gcd(F_m, F_n) = F_{gcd(m,n)}</text>
  <text x="240" y="165" text-anchor="middle" fill="#8b949e" font-size="11">fib_gcd_identity · Nat.fib_gcd</text>

  <!-- Pisano Period Box -->
  <rect x="470" y="80" width="380" height="100" rx="12" fill="#1b2838" stroke="#58a6ff" stroke-width="2"/>
  <text x="660" y="108" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="bold">Pisano Period (Verified)</text>
  <text x="660" y="138" text-anchor="middle" fill="white" font-size="16" font-weight="bold">π(N) = lcm(π(p), π(q))</text>
  <text x="660" y="165" text-anchor="middle" fill="#8b949e" font-size="11">pisano_coprime_lcm · for N = pq coprime</text>

  <!-- Fibonacci Sieve flow -->
  <rect x="50" y="210" width="800" height="180" rx="12" fill="#21262d" opacity="0.5" stroke="#3fb950" stroke-width="1"/>
  <text x="450" y="240" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="bold">
    Fibonacci Sieve Factoring (Algorithm 35)
  </text>

  <!-- Flow steps -->
  <g transform="translate(100, 270)">
    <rect x="0" y="0" width="150" height="55" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="75" y="20" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Step 1</text>
    <text x="75" y="40" text-anchor="middle" fill="#c9d1d9" font-size="10">M ← lcm(1..B)</text>
  </g>
  
  <path d="M 260 297 L 290 297" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
  </marker>
  
  <g transform="translate(300, 270)">
    <rect x="0" y="0" width="150" height="55" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="75" y="20" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Step 2</text>
    <text x="75" y="40" text-anchor="middle" fill="#c9d1d9" font-size="10">Compute F(M) mod N</text>
  </g>
  
  <path d="M 460 297 L 490 297" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  
  <g transform="translate(500, 270)">
    <rect x="0" y="0" width="150" height="55" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="75" y="20" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">Step 3</text>
    <text x="75" y="40" text-anchor="middle" fill="#c9d1d9" font-size="10">g ← gcd(F(M), N)</text>
  </g>
  
  <path d="M 660 297 L 690 297" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  
  <g transform="translate(700, 270)">
    <rect x="0" y="0" width="120" height="55" rx="10" fill="#0d1117" stroke="#ffd700" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" fill="#ffd700" font-size="11" font-weight="bold">Factor!</text>
    <text x="60" y="40" text-anchor="middle" fill="#c9d1d9" font-size="10">1 &lt; g &lt; N</text>
  </g>

  <text x="450" y="365" text-anchor="middle" fill="#8b949e" font-size="11">
    Why: if α(p) is B-smooth, then p | F(M), so p | gcd(F(M), N). Like Pollard p−1 but for Fibonacci!
  </text>

  <!-- Compositeness test -->
  <rect x="50" y="400" width="380" height="80" rx="12" fill="#1b2838" stroke="#da3633" stroke-width="1.5"/>
  <text x="240" y="425" text-anchor="middle" fill="#da3633" font-size="14" font-weight="bold">Fibonacci Compositeness Test</text>
  <text x="240" y="450" text-anchor="middle" fill="#c9d1d9" font-size="12">If N prime (N≠2,5): F_N² ≡ 1 (mod N)</text>
  <text x="240" y="470" text-anchor="middle" fill="#8b949e" font-size="10">fib_sq_mod_prime → fib_composite_test</text>

  <!-- Primitive divisors -->
  <rect x="470" y="400" width="380" height="80" rx="12" fill="#1b2838" stroke="#bb86fc" stroke-width="1.5"/>
  <text x="660" y="425" text-anchor="middle" fill="#bb86fc" font-size="14" font-weight="bold">Primitive Divisors (Carmichael)</text>
  <text x="660" y="450" text-anchor="middle" fill="#c9d1d9" font-size="12">n ≥ 13 ⟹ F_n has a "new" prime factor</text>
  <text x="660" y="470" text-anchor="middle" fill="#8b949e" font-size="10">fib_primitive_divisor_existence</text>

  <!-- Pisano period examples -->
  <rect x="50" y="500" width="800" height="65" rx="10" fill="#21262d" opacity="0.4"/>
  <text x="450" y="525" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">
    Sample Pisano Periods
  </text>
  <text x="450" y="550" text-anchor="middle" fill="#c9d1d9" font-size="12">
    π(2)=3  ·  π(3)=8  ·  π(5)=20  ·  π(7)=16  ·  π(11)=10  ·  π(13)=7  ·  π(100)=300
  </text>
</svg>
