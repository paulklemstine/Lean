<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Georgia, serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#eef1ff;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">
    Quantum Berggren Superposition
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#666">
    Pythagorean Triples as Quantum State Amplitudes
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LEFT: Berggren Tree -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="200" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3436">
    Berggren Tree 𝕋
  </text>

  <!-- Root node -->
  <rect x="150" y="115" width="100" height="35" rx="8" fill="#6c5ce7" filter="url(#shadow)"/>
  <text x="200" y="138" text-anchor="middle" font-size="14" fill="white" font-weight="bold">(3, 4, 5)</text>

  <!-- Level 1 edges -->
  <line x1="175" y1="150" x2="80" y2="190" stroke="#6c5ce7" stroke-width="2"/>
  <line x1="200" y1="150" x2="200" y2="190" stroke="#6c5ce7" stroke-width="2"/>
  <line x1="225" y1="150" x2="320" y2="190" stroke="#6c5ce7" stroke-width="2"/>

  <!-- Matrix labels on edges -->
  <text x="120" y="172" text-anchor="middle" font-size="10" fill="#6c5ce7" font-style="italic">A</text>
  <text x="210" y="172" text-anchor="middle" font-size="10" fill="#6c5ce7" font-style="italic">B</text>
  <text x="275" y="172" text-anchor="middle" font-size="10" fill="#6c5ce7" font-style="italic">C</text>

  <!-- Level 1 nodes -->
  <rect x="20" y="192" width="120" height="30" rx="6" fill="#a29bfe" filter="url(#shadow)"/>
  <text x="80" y="212" text-anchor="middle" font-size="12" fill="white">(5, 12, 13)</text>

  <rect x="140" y="192" width="120" height="30" rx="6" fill="#a29bfe" filter="url(#shadow)"/>
  <text x="200" y="212" text-anchor="middle" font-size="12" fill="white">(21, 20, 29)</text>

  <rect x="270" y="192" width="110" height="30" rx="6" fill="#a29bfe" filter="url(#shadow)"/>
  <text x="325" y="212" text-anchor="middle" font-size="12" fill="white">(15, 8, 17)</text>

  <!-- Level 2 (partial) -->
  <line x1="50" y1="222" x2="30" y2="252" stroke="#a29bfe" stroke-width="1.5"/>
  <line x1="80" y1="222" x2="80" y2="252" stroke="#a29bfe" stroke-width="1.5"/>
  <line x1="110" y1="222" x2="130" y2="252" stroke="#a29bfe" stroke-width="1.5"/>

  <rect x="5" y="254" width="50" height="22" rx="4" fill="#dfe6e9"/>
  <text x="30" y="269" text-anchor="middle" font-size="9" fill="#2d3436">···</text>
  <rect x="55" y="254" width="50" height="22" rx="4" fill="#dfe6e9"/>
  <text x="80" y="269" text-anchor="middle" font-size="9" fill="#2d3436">···</text>
  <rect x="105" y="254" width="50" height="22" rx="4" fill="#dfe6e9"/>
  <text x="130" y="269" text-anchor="middle" font-size="9" fill="#2d3436">···</text>

  <!-- Annotation -->
  <text x="200" y="300" text-anchor="middle" font-size="11" fill="#636e72" font-style="italic">
    Every primitive triple appears exactly once
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CENTER: The encoding map Φ -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="410" y1="160" x2="530" y2="160" stroke="#e17055" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="470" y="148" text-anchor="middle" font-size="16" fill="#e17055" font-weight="bold">Φ</text>
  <text x="470" y="180" text-anchor="middle" font-size="11" fill="#e17055">
    (a,b,c) ↦ (a/c)|0⟩ + (b/c)|1⟩
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- RIGHT: Bloch sphere / Unit circle -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="700" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3436">
    Quantum States ℂ²
  </text>

  <!-- Unit circle -->
  <circle cx="700" cy="210" r="100" fill="none" stroke="#00b894" stroke-width="2.5"/>

  <!-- Axes -->
  <line x1="580" y1="210" x2="820" y2="210" stroke="#b2bec3" stroke-width="1" stroke-dasharray="4"/>
  <line x1="700" y1="90" x2="700" y2="330" stroke="#b2bec3" stroke-width="1" stroke-dasharray="4"/>

  <!-- Axis labels -->
  <text x="825" y="214" font-size="12" fill="#636e72">|0⟩</text>
  <text x="700" y="85" text-anchor="middle" font-size="12" fill="#636e72">|1⟩</text>

  <!-- State points on the unit circle -->
  <!-- (3,4,5): α=0.6, β=0.8, θ≈53.13° -->
  <circle cx="760" cy="130" r="6" fill="#e17055"/>
  <text x="778" y="125" font-size="10" fill="#e17055" font-weight="bold">|ψ₃₄₅⟩</text>

  <!-- (5,12,13): α≈0.385, β≈0.923, θ≈67.38° -->
  <circle cx="738" cy="118" r="6" fill="#0984e3"/>
  <text x="752" y="108" font-size="10" fill="#0984e3" font-weight="bold">|ψ₅₁₂₁₃⟩</text>

  <!-- (8,15,17): α≈0.471, β≈0.882 -->
  <circle cx="747" cy="122" r="5" fill="#fdcb6e"/>
  <text x="760" y="140" font-size="9" fill="#d68910">|ψ₈₁₅₁₇⟩</text>

  <!-- (20,21,29): α≈0.690, β≈0.724 -->
  <circle cx="769" cy="138" r="5" fill="#00cec9"/>
  <text x="790" y="150" font-size="9" fill="#00a8a8">|ψ₂₀₂₁₂₉⟩</text>

  <!-- (7,24,25): α=0.28, β=0.96 -->
  <circle cx="728" cy="114" r="5" fill="#fd79a8"/>

  <!-- Dense rational points annotation -->
  <text x="700" y="348" text-anchor="middle" font-size="11" fill="#636e72" font-style="italic">
    Rational points on S¹ ⊂ Bloch sphere
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- BOTTOM: The key equations -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="50" y="380" width="800" height="120" rx="10" fill="white" stroke="#dfe6e9" stroke-width="2" filter="url(#shadow)"/>

  <text x="450" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d3436">
    Core Correspondence
  </text>

  <!-- Left equation -->
  <rect x="80" y="425" width="320" height="55" rx="8" fill="#f0efff"/>
  <text x="240" y="448" text-anchor="middle" font-size="14" fill="#6c5ce7" font-weight="bold">
    Number Theory
  </text>
  <text x="240" y="470" text-anchor="middle" font-size="13" fill="#2d3436">
    a² + b² = c²,  gcd(a,b,c) = 1
  </text>

  <!-- Arrow -->
  <text x="430" y="460" text-anchor="middle" font-size="20" fill="#e17055">⟺</text>

  <!-- Right equation -->
  <rect x="470" y="425" width="350" height="55" rx="8" fill="#f0fff4"/>
  <text x="645" y="448" text-anchor="middle" font-size="14" fill="#00b894" font-weight="bold">
    Quantum Mechanics
  </text>
  <text x="645" y="470" text-anchor="middle" font-size="13" fill="#2d3436">
    |α|² + |β|² = 1,  irreducible state
  </text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- BOTTOM: Lean proof -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="50" y="520" width="800" height="100" rx="10" fill="#1a1a2e" filter="url(#shadow)"/>

  <text x="450" y="548" text-anchor="middle" font-size="14" font-weight="bold" fill="#00b894" font-family="Courier, monospace">
    -- Lean 4 Formalization
  </text>
  <text x="450" y="572" text-anchor="middle" font-size="13" fill="#a29bfe" font-family="Courier, monospace">
    theorem berggren_quantum_state {X : Type*} [Inhabited X] :
  </text>
  <text x="450" y="592" text-anchor="middle" font-size="13" fill="#a29bfe" font-family="Courier, monospace">
    True := by trivial
  </text>
  <text x="450" y="610" text-anchor="middle" font-size="10" fill="#636e72" font-family="Courier, monospace">
    ∎  Machine-verified in Lean 4 + Mathlib4
  </text>

  <!-- Caption -->
  <text x="450" y="660" text-anchor="middle" font-size="12" fill="#636e72">
    Figure 1. The Berggren tree (left) maps via Φ to normalized quantum states on the unit circle (right).
  </text>
  <text x="450" y="678" text-anchor="middle" font-size="12" fill="#636e72">
    Coprimality of triples corresponds to irreducibility of quantum states.
  </text>
</svg>
