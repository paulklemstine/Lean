<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <linearGradient id="trueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="typeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="propGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="#FAFAFA" rx="8" />

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#222">
    Proof Structure: Inhabited X → True
  </text>

  <!-- ===== Type Universe (left) ===== -->
  <rect x="40" y="70" width="300" height="200" rx="12" fill="url(#typeGrad)" stroke="#2196F3" stroke-width="2" />
  <text x="190" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1565C0">Type* (Universe of Types)</text>

  <!-- Type X -->
  <ellipse cx="190" cy="170" rx="90" ry="55" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
  <text x="190" y="160" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#0D47A1">X</text>
  <text x="190" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1565C0">(quantum state space)</text>

  <!-- Default element -->
  <circle cx="190" cy="205" r="8" fill="#1976D2" stroke="#0D47A1" stroke-width="1.5" />
  <text x="210" y="210" font-family="monospace" font-size="11" fill="#0D47A1">default</text>

  <!-- Inhabited badge -->
  <rect x="100" y="240" width="180" height="24" rx="12" fill="#1976D2" />
  <text x="190" y="256" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="white">[Inhabited X]  ✓</text>

  <!-- ===== Prop Universe (right) ===== -->
  <rect x="460" y="70" width="300" height="200" rx="12" fill="url(#propGrad)" stroke="#FF9800" stroke-width="2" />
  <text x="610" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#E65100">Prop (Universe of Propositions)</text>

  <!-- True -->
  <ellipse cx="610" cy="170" rx="70" ry="50" fill="url(#trueGrad)" stroke="#4CAF50" stroke-width="3" />
  <text x="610" y="165" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#2E7D32">True</text>
  <text x="610" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#388E3C">terminal object</text>

  <!-- True.intro proof -->
  <circle cx="610" cy="210" r="6" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5" />
  <text x="630" y="215" font-family="monospace" font-size="10" fill="#2E7D32">True.intro</text>

  <!-- Proved badge -->
  <rect x="530" y="240" width="160" height="24" rx="12" fill="#4CAF50" />
  <text x="610" y="256" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="white">trivial  ✓</text>

  <!-- ===== Arrow: proof morphism ===== -->
  <line x1="340" y1="170" x2="530" y2="170" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-dasharray="8,4" />
  <text x="435" y="155" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#555">proof</text>
  <text x="435" y="190" text-anchor="middle" font-family="monospace" font-size="11" fill="#777">(trivial)</text>

  <!-- ===== Lower section: Axiom analysis ===== -->
  <rect x="40" y="310" width="720" height="120" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5" />
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#E65100">Axiom Analysis</text>

  <!-- Axiom boxes -->
  <rect x="70" y="355" width="120" height="30" rx="6" fill="#FFCCBC" stroke="#FF5722" stroke-width="1" />
  <text x="130" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#BF360C">propext</text>
  <line x1="130" y1="355" x2="130" y2="385" stroke="#F44336" stroke-width="2" />
  <text x="130" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#F44336">NOT USED</text>

  <rect x="220" y="355" width="120" height="30" rx="6" fill="#FFCCBC" stroke="#FF5722" stroke-width="1" />
  <text x="280" y="375" text-anchor="middle" font-family="monospace" font-size="9" fill="#BF360C">Classical.choice</text>
  <line x1="280" y1="355" x2="280" y2="385" stroke="#F44336" stroke-width="2" />
  <text x="280" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#F44336">NOT USED</text>

  <rect x="370" y="355" width="120" height="30" rx="6" fill="#FFCCBC" stroke="#FF5722" stroke-width="1" />
  <text x="430" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#BF360C">Quot.sound</text>
  <line x1="430" y1="355" x2="430" y2="385" stroke="#F44336" stroke-width="2" />
  <text x="430" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#F44336">NOT USED</text>

  <rect x="520" y="355" width="120" height="30" rx="6" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2" />
  <text x="580" y="375" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#2E7D32">∅ (none)</text>
  <text x="580" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4CAF50">AXIOM-FREE ✓</text>

  <!-- ===== Category-theoretic view ===== -->
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#555">
    In the category of propositions, True is the terminal object.
  </text>
  <text x="400" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#555">
    Every object (proposition) admits a unique morphism (proof) to True.
  </text>

  <!-- Caption -->
  <rect x="100" y="510" width="600" height="30" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1" />
  <text x="400" y="530" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#283593">
    Figure 1: The proof structure of short_punchy_theorem_name_breakthrough — an axiom-free verification
  </text>
</svg>
