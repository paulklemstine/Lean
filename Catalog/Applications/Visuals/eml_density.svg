<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd93d"/>
      <stop offset="100%" style="stop-color:#e17055"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg5)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">EML Operation: Density from Simplicity</text>
  <text x="450" y="55" text-anchor="middle" fill="#aaa" font-size="12">EML(a,b) = eᵃ − ln(b) generates a dense subset of ℝ from seed {1}</text>

  <!-- Left: EML Tree Diagram -->
  <g transform="translate(30, 80)">
    <rect width="380" height="380" rx="12" fill="#0d1b2a" stroke="#ffd93d" stroke-width="1.5" opacity="0.9"/>
    <text x="190" y="25" text-anchor="middle" fill="#ffd93d" font-size="14" font-weight="bold">EML Computation Tree</text>

    <!-- Tree structure -->
    <!-- Root -->
    <circle cx="190" cy="70" r="15" fill="#e17055"/>
    <text x="190" y="74" text-anchor="middle" fill="#fff" font-size="9">EML</text>

    <!-- Level 1 -->
    <line x1="180" y1="85" x2="120" y2="130" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="200" y1="85" x2="260" y2="130" stroke="#ffd93d" stroke-width="1.5"/>

    <circle cx="120" cy="140" r="15" fill="#e17055"/>
    <text x="120" y="144" text-anchor="middle" fill="#fff" font-size="9">EML</text>
    <circle cx="260" cy="140" r="12" fill="#4ecdc4"/>
    <text x="260" y="144" text-anchor="middle" fill="#fff" font-size="9">1</text>

    <!-- Level 2 -->
    <line x1="110" y1="155" x2="70" y2="200" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="130" y1="155" x2="170" y2="200" stroke="#ffd93d" stroke-width="1.5"/>

    <circle cx="70" cy="210" r="12" fill="#4ecdc4"/>
    <text x="70" y="214" text-anchor="middle" fill="#fff" font-size="9">1</text>
    <circle cx="170" cy="210" r="12" fill="#4ecdc4"/>
    <text x="170" y="214" text-anchor="middle" fill="#fff" font-size="9">1</text>

    <!-- Computation annotations -->
    <text x="70" y="240" text-anchor="middle" fill="#888" font-size="9">seed</text>
    <text x="170" y="240" text-anchor="middle" fill="#888" font-size="9">seed</text>
    <text x="260" y="170" text-anchor="middle" fill="#888" font-size="9">seed</text>

    <!-- Result annotations -->
    <text x="120" y="175" text-anchor="middle" fill="#ffd93d" font-size="10">= e¹ − ln(1) = e</text>
    <text x="190" y="100" text-anchor="middle" fill="#ffd93d" font-size="10">= eᵉ − ln(1) = eᵉ</text>

    <!-- Identities box -->
    <g transform="translate(20, 260)">
      <rect width="340" height="100" rx="8" fill="#1a2a1a" stroke="#4ecdc4" stroke-width="1"/>
      <text x="170" y="18" text-anchor="middle" fill="#4ecdc4" font-size="11" font-weight="bold">Verified Identities</text>
      <text x="15" y="38" fill="#8ee" font-size="10">• EML(1, 1) = e  (irrational! ✓)</text>
      <text x="15" y="55" fill="#8ee" font-size="10">• EML(0, eᴱᴹᴸ⁽⁰'ˣ⁾) = ln(x)</text>
      <text x="15" y="72" fill="#8ee" font-size="10">• EML(0, eᴱᴹᴸ⁽⁰'ᵉˣ⁾) = x  (double neg)</text>
      <text x="15" y="89" fill="#8ee" font-size="10">• VC dim ≤ 2k  (k leaves)</text>
    </g>
  </g>

  <!-- Right: Density visualization -->
  <g transform="translate(450, 80)">
    <rect width="420" height="380" rx="12" fill="#0d1b2a" stroke="#e17055" stroke-width="1.5" opacity="0.9"/>
    <text x="210" y="25" text-anchor="middle" fill="#e17055" font-size="14" font-weight="bold">EML Closure Density Growth</text>

    <!-- Bar chart showing growth -->
    <g transform="translate(40, 45)">
      <!-- Axes -->
      <line x1="0" y1="200" x2="340" y2="200" stroke="#555" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="200" stroke="#555" stroke-width="1"/>

      <!-- Y-axis label -->
      <text x="-15" y="100" text-anchor="middle" fill="#888" font-size="10" transform="rotate(-90, -15, 100)">|S_n| (log scale)</text>
      <text x="170" y="220" text-anchor="middle" fill="#888" font-size="10">Depth n</text>

      <!-- Bars -->
      <rect x="20" y="195" width="35" height="5" fill="url(#barGrad)" rx="2"/>
      <text x="37" y="192" text-anchor="middle" fill="#fff" font-size="9">1</text>
      <text x="37" y="215" text-anchor="middle" fill="#888" font-size="9">0</text>

      <rect x="75" y="185" width="35" height="15" fill="url(#barGrad)" rx="2"/>
      <text x="92" y="182" text-anchor="middle" fill="#fff" font-size="9">2</text>
      <text x="92" y="215" text-anchor="middle" fill="#888" font-size="9">1</text>

      <rect x="130" y="160" width="35" height="40" fill="url(#barGrad)" rx="2"/>
      <text x="147" y="155" text-anchor="middle" fill="#fff" font-size="9">7</text>
      <text x="147" y="215" text-anchor="middle" fill="#888" font-size="9">2</text>

      <rect x="185" y="120" width="35" height="80" fill="url(#barGrad)" rx="2"/>
      <text x="202" y="115" text-anchor="middle" fill="#fff" font-size="9">52</text>
      <text x="202" y="215" text-anchor="middle" fill="#888" font-size="9">3</text>

      <rect x="240" y="60" width="35" height="140" fill="url(#barGrad)" rx="2"/>
      <text x="257" y="55" text-anchor="middle" fill="#fff" font-size="9">~2700</text>
      <text x="257" y="215" text-anchor="middle" fill="#888" font-size="9">4</text>

      <rect x="295" y="10" width="35" height="190" fill="url(#barGrad)" rx="2"/>
      <text x="312" y="8" text-anchor="middle" fill="#fff" font-size="9">→∞</text>
      <text x="312" y="215" text-anchor="middle" fill="#888" font-size="9">5+</text>
    </g>

    <!-- Number line visualization -->
    <g transform="translate(30, 300)">
      <text x="180" y="0" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Values on the Number Line</text>

      <!-- Number line -->
      <line x1="10" y1="30" x2="360" y2="30" stroke="#555" stroke-width="2"/>

      <!-- Tick marks -->
      <line x1="60" y1="25" x2="60" y2="35" stroke="#888" stroke-width="1"/>
      <text x="60" y="48" text-anchor="middle" fill="#888" font-size="9">0</text>

      <line x1="120" y1="25" x2="120" y2="35" stroke="#888" stroke-width="1"/>
      <text x="120" y="48" text-anchor="middle" fill="#888" font-size="9">1</text>

      <line x1="180" y1="25" x2="180" y2="35" stroke="#888" stroke-width="1"/>
      <text x="180" y="48" text-anchor="middle" fill="#888" font-size="9">e</text>

      <line x1="240" y1="25" x2="240" y2="35" stroke="#888" stroke-width="1"/>
      <text x="240" y="48" text-anchor="middle" fill="#888" font-size="9">5</text>

      <line x1="300" y1="25" x2="300" y2="35" stroke="#888" stroke-width="1"/>
      <text x="300" y="48" text-anchor="middle" fill="#888" font-size="9">10</text>

      <!-- Points from EML closure (schematic) -->
      <g fill="#ffd93d">
        <circle cx="120" cy="30" r="3"/>
        <circle cx="180" cy="30" r="3"/>
        <circle cx="88" cy="30" r="2"/>
        <circle cx="135" cy="30" r="2"/>
        <circle cx="155" cy="30" r="2"/>
        <circle cx="200" cy="30" r="2"/>
        <circle cx="220" cy="30" r="2"/>
        <circle cx="250" cy="30" r="2"/>
        <circle cx="270" cy="30" r="2"/>
        <circle cx="290" cy="30" r="2"/>
        <circle cx="310" cy="30" r="2"/>
        <circle cx="330" cy="30" r="2"/>
        <circle cx="105" cy="30" r="1.5"/>
        <circle cx="112" cy="30" r="1.5"/>
        <circle cx="128" cy="30" r="1.5"/>
        <circle cx="142" cy="30" r="1.5"/>
        <circle cx="165" cy="30" r="1.5"/>
        <circle cx="175" cy="30" r="1.5"/>
        <circle cx="185" cy="30" r="1.5"/>
        <circle cx="195" cy="30" r="1.5"/>
        <circle cx="210" cy="30" r="1.5"/>
        <circle cx="230" cy="30" r="1.5"/>
        <circle cx="260" cy="30" r="1.5"/>
        <circle cx="280" cy="30" r="1.5"/>
        <circle cx="340" cy="30" r="1.5"/>
      </g>

      <text x="180" y="65" text-anchor="middle" fill="#ffd93d" font-size="9">Dense in ℝ (formally verified)</text>
    </g>
  </g>
</svg>
