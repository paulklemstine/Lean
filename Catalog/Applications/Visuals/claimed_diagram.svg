<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Non-Archimedean Factoring Oracle
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Composite numbers admit non-trivial factorizations; primes do not
  </text>

  <!-- Left panel: Number classification -->
  <rect x="30" y="75" width="350" height="200" fill="url(#compGrad)" stroke="#2ecc71" stroke-width="2" rx="10"/>
  <text x="205" y="100" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#27ae60">
    ℕ &gt; 1 : Composite Numbers
  </text>
  <text x="205" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#27ae60">
    ¬ Nat.Prime n → ∃ a b &gt; 1, a·b = n
  </text>

  <!-- Composite examples -->
  <g font-family="monospace" font-size="12">
    <circle cx="80" cy="160" r="22" fill="#2ecc71" opacity="0.3" stroke="#27ae60"/>
    <text x="80" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">4</text>
    <text x="80" y="170" text-anchor="middle" fill="#27ae60" font-size="10">2×2</text>

    <circle cx="145" cy="160" r="22" fill="#2ecc71" opacity="0.3" stroke="#27ae60"/>
    <text x="145" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">6</text>
    <text x="145" y="170" text-anchor="middle" fill="#27ae60" font-size="10">2×3</text>

    <circle cx="210" cy="160" r="22" fill="#2ecc71" opacity="0.3" stroke="#27ae60"/>
    <text x="210" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">12</text>
    <text x="210" y="170" text-anchor="middle" fill="#27ae60" font-size="10">2×6</text>

    <circle cx="275" cy="160" r="22" fill="#2ecc71" opacity="0.3" stroke="#27ae60"/>
    <text x="275" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">15</text>
    <text x="275" y="170" text-anchor="middle" fill="#27ae60" font-size="10">3×5</text>

    <circle cx="340" cy="160" r="22" fill="#2ecc71" opacity="0.3" stroke="#27ae60"/>
    <text x="340" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">100</text>
    <text x="340" y="170" text-anchor="middle" fill="#27ae60" font-size="10">2×50</text>
  </g>

  <!-- Checkmark -->
  <text x="205" y="250" text-anchor="middle" font-size="20" fill="#27ae60">✓ Theorem holds</text>

  <!-- Right panel: Primes (counterexamples) -->
  <rect x="420" y="75" width="350" height="200" fill="url(#primeGrad)" stroke="#e74c3c" stroke-width="2" rx="10"/>
  <text x="595" y="100" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#c0392b">
    ℕ &gt; 1 : Prime Numbers
  </text>
  <text x="595" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b">
    Nat.Prime n → NO such a, b exist
  </text>

  <!-- Prime examples -->
  <g font-family="monospace" font-size="12">
    <circle cx="470" cy="160" r="22" fill="#e74c3c" opacity="0.2" stroke="#c0392b"/>
    <text x="470" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">2</text>
    <text x="470" y="170" text-anchor="middle" fill="#c0392b" font-size="10">prime</text>

    <circle cx="535" cy="160" r="22" fill="#e74c3c" opacity="0.2" stroke="#c0392b"/>
    <text x="535" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">3</text>
    <text x="535" y="170" text-anchor="middle" fill="#c0392b" font-size="10">prime</text>

    <circle cx="600" cy="160" r="22" fill="#e74c3c" opacity="0.2" stroke="#c0392b"/>
    <text x="600" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">7</text>
    <text x="600" y="170" text-anchor="middle" fill="#c0392b" font-size="10">prime</text>

    <circle cx="665" cy="160" r="22" fill="#e74c3c" opacity="0.2" stroke="#c0392b"/>
    <text x="665" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">13</text>
    <text x="665" y="170" text-anchor="middle" fill="#c0392b" font-size="10">prime</text>

    <circle cx="730" cy="160" r="22" fill="#e74c3c" opacity="0.2" stroke="#c0392b"/>
    <text x="730" y="155" text-anchor="middle" fill="#2c3e50" font-weight="bold">97</text>
    <text x="730" y="170" text-anchor="middle" fill="#c0392b" font-size="10">prime</text>
  </g>

  <!-- X mark -->
  <text x="595" y="250" text-anchor="middle" font-size="20" fill="#c0392b">✗ Original statement FALSE</text>

  <!-- Middle: Proof flow -->
  <rect x="100" y="310" width="600" height="180" fill="white" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Proof Structure
  </text>

  <!-- Step 1 -->
  <rect x="130" y="360" width="150" height="50" fill="#ecf0f1" stroke="#95a5a6" rx="6"/>
  <text x="205" y="380" text-anchor="middle" font-family="monospace" font-size="10" fill="#2c3e50">n &gt; 1, ¬Prime n</text>
  <text x="205" y="398" text-anchor="middle" font-family="monospace" font-size="9" fill="#7f8c8d">hypotheses</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="385" x2="320" y2="385" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="300" y="378" text-anchor="middle" font-family="monospace" font-size="8" fill="#3498db">exists_dvd</text>

  <!-- Step 2 -->
  <rect x="325" y="360" width="150" height="50" fill="#d5f5e3" stroke="#27ae60" rx="6"/>
  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="10" fill="#2c3e50">∃ k: k∣n, 1&lt;k&lt;n</text>
  <text x="400" y="398" text-anchor="middle" font-family="monospace" font-size="9" fill="#27ae60">non-trivial divisor</text>

  <!-- Arrow 2 -->
  <line x1="475" y1="385" x2="515" y2="385" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="495" y="378" text-anchor="middle" font-family="monospace" font-size="8" fill="#3498db">construct</text>

  <!-- Step 3 -->
  <rect x="520" y="360" width="150" height="50" fill="#d6eaf8" stroke="#3498db" rx="6"/>
  <text x="595" y="380" text-anchor="middle" font-family="monospace" font-size="10" fill="#2c3e50">a=k, b=n/k</text>
  <text x="595" y="398" text-anchor="middle" font-family="monospace" font-size="9" fill="#3498db">a·b=n, a&gt;1, b&gt;1</text>

  <!-- Bottom equation -->
  <text x="400" y="460" text-anchor="middle" font-family="monospace" font-size="12" fill="#8e44ad">
    v_p(n) = v_p(a) + v_p(b)   — p-adic valuation is additive
  </text>

  <!-- Caption -->
  <text x="400" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#95a5a6" font-style="italic">
    Figure: The factoring oracle decomposes composite n into non-trivial factors via divisor extraction.
  </text>
  <text x="400" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#95a5a6" font-style="italic">
    The p-adic valuation provides an additive invariant connecting the factors.
  </text>
</svg>
