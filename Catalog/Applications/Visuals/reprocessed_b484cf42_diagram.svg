<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Arithmetic Projective Sheaf Construction (e2e9)
  </text>

  <!-- ============ LEFT: Projective System (p-adic tower) ============ -->
  <text x="150" y="70" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb" font-weight="bold">
    Projective System (ℤ_p)
  </text>

  <!-- Level 0 -->
  <rect x="90" y="85" width="120" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="110" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">ℤ/pℤ</text>

  <!-- Level 1 -->
  <rect x="90" y="155" width="120" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="180" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">ℤ/p²ℤ</text>

  <!-- Level 2 -->
  <rect x="90" y="225" width="120" height="40" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="250" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e3a8a">ℤ/p³ℤ</text>

  <!-- Level 3 (limit) -->
  <rect x="90" y="310" width="120" height="40" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="335" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">ℤ_p = lim</text>

  <!-- Transition arrows -->
  <line x1="150" y1="125" x2="150" y2="153" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <line x1="150" y1="195" x2="150" y2="223" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>

  <!-- Dots -->
  <text x="150" y="283" text-anchor="middle" font-family="monospace" font-size="16" fill="#2563eb">⋮</text>
  <line x1="150" y1="290" x2="150" y2="308" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)" stroke-dasharray="3,3"/>

  <!-- Arrow labels -->
  <text x="220" y="143" font-family="monospace" font-size="10" fill="#6b7280">π₁₀</text>
  <text x="220" y="213" font-family="monospace" font-size="10" fill="#6b7280">π₂₁</text>

  <!-- ============ CENTER: Sheaf / Functor ============ -->
  <text x="400" y="70" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626" font-weight="bold">
    Projective Sheaf F
  </text>

  <!-- Sheaf sections -->
  <rect x="340" y="85" width="120" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="110" text-anchor="middle" font-family="monospace" font-size="12" fill="#991b1b">F(U₀) = {*}</text>

  <rect x="340" y="155" width="120" height="40" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="180" text-anchor="middle" font-family="monospace" font-size="12" fill="#991b1b">F(U₁) = {*}</text>

  <rect x="340" y="225" width="120" height="40" rx="6" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="250" text-anchor="middle" font-family="monospace" font-size="12" fill="#7f1d1d">F(U₂) = {*}</text>

  <rect x="340" y="310" width="120" height="40" rx="6" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">Γ(F) = {*}</text>

  <!-- Restriction arrows -->
  <line x1="400" y1="125" x2="400" y2="153" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <line x1="400" y1="195" x2="400" y2="223" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <text x="400" y="283" text-anchor="middle" font-family="monospace" font-size="16" fill="#dc2626">⋮</text>
  <line x1="400" y1="290" x2="400" y2="308" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)" stroke-dasharray="3,3"/>

  <!-- Functor arrows (Site → Sections) -->
  <line x1="212" y1="105" x2="338" y2="105" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <line x1="212" y1="175" x2="338" y2="175" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <line x1="212" y1="245" x2="338" y2="245" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="275" y="95" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b7280">F(−)</text>

  <!-- ============ RIGHT: Type-theoretic / Yoneda ============ -->
  <text x="650" y="70" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a" font-weight="bold">
    Type Theory (Lean 4)
  </text>

  <!-- X : Type* -->
  <rect x="590" y="85" width="120" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="110" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">X : Type*</text>

  <!-- [Inhabited X] -->
  <rect x="590" y="155" width="120" height="40" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="175" text-anchor="middle" font-family="monospace" font-size="11" fill="#166534">[Inhabited X]</text>
  <text x="650" y="189" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ade80">∃ x₀ : X</text>

  <!-- Yoneda -->
  <rect x="580" y="235" width="140" height="40" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="257" text-anchor="middle" font-family="monospace" font-size="11" fill="#14532d">Yoneda: Hom(−,1)≅1</text>

  <!-- True -->
  <rect x="590" y="310" width="120" height="40" rx="6" fill="#22c55e" stroke="#15803d" stroke-width="2.5"/>
  <text x="650" y="335" text-anchor="middle" font-family="monospace" font-size="16" fill="white" font-weight="bold">True</text>

  <!-- Arrows: reduction -->
  <line x1="650" y1="125" x2="650" y2="153" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <line x1="650" y1="195" x2="650" y2="233" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <line x1="650" y1="275" x2="650" y2="308" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>

  <!-- Labels on right arrows -->
  <text x="670" y="143" font-family="monospace" font-size="9" fill="#6b7280">inhabit</text>
  <text x="670" y="218" font-family="monospace" font-size="9" fill="#6b7280">Yoneda</text>
  <text x="670" y="298" font-family="monospace" font-size="9" fill="#6b7280">reduce</text>

  <!-- Connection: Sheaf → Type Theory -->
  <path d="M 462 330 Q 520 370 588 330" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <text x="525" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7c3aed" font-style="italic">
    internalize
  </text>

  <!-- ============ BOTTOM: Universal Property Box ============ -->
  <rect x="120" y="400" width="560" height="90" rx="10" fill="white" stroke="#64748b" stroke-width="1.5" opacity="0.9"/>

  <text x="400" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">
    Universal Property
  </text>
  <text x="400" y="448" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">
    ∀ (X : Type*) [Inhabited X], ∃! (f : X → Unit), True
  </text>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b" font-style="italic">
    The terminal object in any topos admits a unique morphism from every object.
  </text>
  <text x="400" y="485" text-anchor="middle" font-family="monospace" font-size="11" fill="#16a34a" font-weight="bold">
    Proof: trivial  ∎
  </text>

  <!-- ============ CAPTION ============ -->
  <text x="400" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    Figure 1: The arithmetic projective sheaf construction reduces the universal property
  </text>
  <text x="400" y="557" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    of the terminal presheaf to the proposition True via Yoneda internalization.
  </text>
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#94a3b8">
    Blue: p-adic projective system · Red: sheaf sections · Green: type-theoretic reduction · Purple: internalization functor
  </text>
</svg>
