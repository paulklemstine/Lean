<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:0.8" />
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" rx="10"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c3e50">
    Tropical Entropy Bound
  </text>
  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7f8c8d">
    trop_rank(M) ≤ maxplus_rank(M) ≤ K(x)
  </text>

  <!-- ============================================================ -->
  <!-- Left: Data Object x -->
  <!-- ============================================================ -->
  <rect x="30" y="100" width="140" height="80" rx="12" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#2c3e50">x ∈ X</text>
  <text x="100" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f8c8d">Data object</text>
  <text x="100" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#95a5a6">(Inhabited type)</text>

  <!-- Arrow: x → M(x) -->
  <line x1="170" y1="140" x2="230" y2="140" stroke="#2980b9" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="200" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2980b9">encode</text>

  <!-- Center: Tropical Matrix M(x) -->
  <rect x="240" y="90" width="160" height="100" rx="8" fill="url(#tropGrad)" opacity="0.15" stroke="#1a5276" stroke-width="2"/>
  <text x="320" y="125" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1a5276">M(x)</text>
  <text x="320" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2c3e50">Tropical matrix</text>
  <text x="320" y="165" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">over 𝕋 = (ℝ∪{-∞}, max, +)</text>
  <text x="320" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#95a5a6">⊕ = max, ⊙ = +</text>

  <!-- ============================================================ -->
  <!-- Rank Hierarchy (center-right) -->
  <!-- ============================================================ -->

  <!-- Tropical Rank box -->
  <rect x="480" y="85" width="150" height="55" rx="10" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="555" y="108" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#27ae60">trop_rank(M)</text>
  <text x="555" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">Tropical rank</text>

  <!-- Max-Plus Rank box -->
  <rect x="480" y="155" width="150" height="55" rx="10" fill="#e67e22" opacity="0.15" stroke="#e67e22" stroke-width="2"/>
  <text x="555" y="178" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#e67e22">maxplus_rank(M)</text>
  <text x="555" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">Barvinok rank</text>

  <!-- Kolmogorov Complexity box -->
  <rect x="480" y="225" width="150" height="55" rx="10" fill="#c0392b" opacity="0.15" stroke="#c0392b" stroke-width="2"/>
  <text x="555" y="248" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#c0392b">K(x)</text>
  <text x="555" y="268" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">Kolmogorov complexity</text>

  <!-- Arrows between ranks: ≤ -->
  <line x1="555" y1="140" x2="555" y2="155" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="572" y="152" font-family="monospace" font-size="14" fill="#8e44ad">≤</text>

  <line x1="555" y1="210" x2="555" y2="225" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="572" y="222" font-family="monospace" font-size="14" fill="#8e44ad">≤</text>

  <!-- Arrow: M(x) → ranks -->
  <line x1="400" y1="120" x2="475" y2="110" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <line x1="400" y1="140" x2="475" y2="180" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ============================================================ -->
  <!-- Tropical Factorization (bottom-left) -->
  <!-- ============================================================ -->
  <rect x="40" y="300" width="300" height="140" rx="10" fill="#9b59b6" opacity="0.08" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="190" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#8e44ad">Tropical Factorization</text>

  <!-- Matrix P -->
  <rect x="60" y="345" width="60" height="70" rx="4" fill="#3498db" opacity="0.2" stroke="#3498db" stroke-width="1.5"/>
  <text x="90" y="370" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c3e50">P</text>
  <text x="90" y="390" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7f8c8d">m × r</text>

  <!-- ⊙ symbol -->
  <text x="140" y="385" text-anchor="middle" font-family="monospace" font-size="20" fill="#8e44ad">⊙</text>

  <!-- Matrix Q -->
  <rect x="160" y="345" width="70" height="60" rx="4" fill="#2ecc71" opacity="0.2" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="195" y="370" text-anchor="middle" font-family="monospace" font-size="12" fill="#2c3e50">Q</text>
  <text x="195" y="390" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7f8c8d">r × n</text>

  <!-- = symbol -->
  <text x="250" y="385" text-anchor="middle" font-family="monospace" font-size="20" fill="#2c3e50">=</text>

  <!-- Matrix M -->
  <rect x="268" y="345" width="60" height="70" rx="4" fill="url(#tropGrad)" opacity="0.2" stroke="#1a5276" stroke-width="1.5"/>
  <text x="298" y="375" text-anchor="middle" font-family="monospace" font-size="12" fill="#1a5276">M</text>
  <text x="298" y="395" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7f8c8d">m × n</text>

  <text x="190" y="432" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">rank = r = size of factorization</text>

  <!-- ============================================================ -->
  <!-- Compression diagram (bottom-right) -->
  <!-- ============================================================ -->
  <rect x="380" y="300" width="380" height="140" rx="10" fill="#e74c3c" opacity="0.06" stroke="#c0392b" stroke-width="1.5"/>
  <text x="570" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#c0392b">Compression Limit</text>

  <!-- Incompressible region -->
  <rect x="400" y="345" width="340" height="30" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>

  <!-- Compressible portion -->
  <rect x="400" y="345" width="120" height="30" rx="5" fill="#2ecc71" opacity="0.4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="460" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#27ae60">trop_rank</text>

  <!-- Max-plus portion -->
  <rect x="520" y="345" width="80" height="30" rx="0" fill="#f39c12" opacity="0.3" stroke="#e67e22" stroke-width="1"/>
  <text x="560" y="365" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#e67e22">gap</text>

  <!-- K(x) marker -->
  <line x1="680" y1="340" x2="680" y2="380" stroke="#c0392b" stroke-width="2"/>
  <text x="700" y="365" font-family="monospace" font-size="11" fill="#c0392b">K(x)</text>

  <!-- Labels below bar -->
  <text x="400" y="398" font-family="sans-serif" font-size="10" fill="#7f8c8d">0</text>
  <text x="510" y="398" font-family="sans-serif" font-size="9" fill="#27ae60">compressible</text>
  <text x="635" y="398" font-family="sans-serif" font-size="9" fill="#c0392b">incompressible</text>

  <text x="570" y="428" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f8c8d">
    No program shorter than trop_rank can produce x
  </text>

  <!-- ============================================================ -->
  <!-- Connecting arrow: factorization → rank -->
  <!-- ============================================================ -->
  <path d="M 328 370 Q 420 310 480 180" stroke="#8e44ad" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="420" y="280" font-family="sans-serif" font-size="9" fill="#8e44ad" transform="rotate(-30, 420, 280)">determines rank</text>

  <!-- ============================================================ -->
  <!-- Bottom: Semiring definition -->
  <!-- ============================================================ -->
  <rect x="100" y="470" width="600" height="60" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="400" y="492" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2c3e50">
    Tropical Semiring 𝕋 = (ℝ ∪ {−∞}, ⊕, ⊙)
  </text>
  <text x="400" y="515" text-anchor="middle" font-family="monospace" font-size="12" fill="#7f8c8d">
    a ⊕ b = max(a, b)     a ⊙ b = a + b     identity: 0⊕ = −∞,  0⊙ = 0
  </text>

  <!-- Caption -->
  <text x="400" y="565" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#95a5a6">
    Figure: The tropical entropy bound — tropical rank as a computable lower bound on Kolmogorov complexity.
  </text>
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#bdc3c7">
    Formalized in Lean 4 / Mathlib as theorem tropical_kolmogorov_bound.
  </text>
</svg>
