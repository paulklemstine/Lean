<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="typeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F39C12;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="#1a1a2e" />

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#ECF0F1" font-weight="bold">
    Universal Inhabitedness Theorem
  </text>
  <text x="400" y="65" text-anchor="middle" font-family="monospace" font-size="14" fill="#BDC3C7">
    ∀ (X : Type*) [Inhabited X], True
  </text>

  <!-- Type X: Large circle with elements -->
  <g transform="translate(200, 240)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#4A90D9" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#4A90D9" stroke-width="0.5" opacity="0.15" />

    <!-- Main circle -->
    <circle cx="0" cy="0" r="110" fill="url(#typeGrad)" opacity="0.2" stroke="#4A90D9" stroke-width="2.5" />

    <!-- Label -->
    <text x="0" y="-125" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#4A90D9" font-weight="bold">
      X : Type*
    </text>

    <!-- Elements (dots) representing inhabitants -->
    <circle cx="-40" cy="-30" r="8" fill="#5DADE2" opacity="0.9" />
    <text x="-40" y="-45" text-anchor="middle" font-family="monospace" font-size="10" fill="#AED6F1">x₁</text>

    <circle cx="30" cy="-50" r="8" fill="#5DADE2" opacity="0.9" />
    <text x="30" y="-65" text-anchor="middle" font-family="monospace" font-size="10" fill="#AED6F1">x₂</text>

    <circle cx="50" cy="20" r="8" fill="#5DADE2" opacity="0.9" />
    <text x="50" y="5" text-anchor="middle" font-family="monospace" font-size="10" fill="#AED6F1">x₃</text>

    <circle cx="-20" cy="50" r="8" fill="#5DADE2" opacity="0.9" />
    <text x="-20" y="35" text-anchor="middle" font-family="monospace" font-size="10" fill="#AED6F1">x₄</text>

    <circle cx="10" cy="-10" r="8" fill="#5DADE2" opacity="0.9" />

    <!-- Default element (highlighted) -->
    <circle cx="-60" cy="20" r="12" fill="#F39C12" opacity="0.9" stroke="#F1C40F" stroke-width="2" />
    <text x="-60" y="25" text-anchor="middle" font-family="monospace" font-size="9" fill="#1a1a2e" font-weight="bold">def</text>
    <text x="-60" y="50" text-anchor="middle" font-family="monospace" font-size="10" fill="#F39C12">default</text>

    <!-- Inhabited badge -->
    <rect x="-55" y="70" width="110" height="26" rx="13" fill="#F39C12" opacity="0.2" stroke="#F39C12" stroke-width="1.5" />
    <text x="0" y="88" text-anchor="middle" font-family="monospace" font-size="12" fill="#F39C12">[Inhabited X]</text>
  </g>

  <!-- True: Small filled circle (terminal object) -->
  <g transform="translate(600, 240)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#2ECC71" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#2ECC71" stroke-width="0.5" opacity="0.15" />

    <!-- Main circle -->
    <circle cx="0" cy="0" r="45" fill="url(#trueGrad)" opacity="0.3" stroke="#2ECC71" stroke-width="2.5" />

    <!-- The single proof -->
    <circle cx="0" cy="0" r="10" fill="#2ECC71" opacity="0.9" />
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="9" fill="#1a1a2e" font-weight="bold">★</text>

    <!-- Labels -->
    <text x="0" y="-60" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2ECC71" font-weight="bold">
      True
    </text>
    <text x="0" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#82E0AA">True.intro</text>
  </g>

  <!-- Arrow: trivial -->
  <line x1="320" y1="240" x2="540" y2="240" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="8,4" />
  <text x="430" y="225" text-anchor="middle" font-family="monospace" font-size="16" fill="#E74C3C" font-weight="bold">
    trivial
  </text>
  <text x="430" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#BDC3C7" font-style="italic">
    unique morphism to terminal object
  </text>

  <!-- Categorical interpretation box -->
  <rect x="50" y="380" width="700" height="70" rx="8" fill="#16213e" stroke="#34495E" stroke-width="1" />
  <text x="400" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#ECF0F1">
    Categorical View: True is the terminal object in Prop.
  </text>
  <text x="400" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#BDC3C7">
    Every proposition (including ∀ X [Inhabited X], True) has a unique map to it.
  </text>
  <text x="400" y="443" text-anchor="middle" font-family="monospace" font-size="12" fill="#F39C12">
    Physical: Any system with ≥1 state is logically consistent.
  </text>

  <!-- Caption -->
  <text x="400" y="485" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7F8C8D" font-style="italic">
    Fig. 1: The Universal Inhabitedness Theorem as a morphism in the category of propositions.
  </text>
</svg>
