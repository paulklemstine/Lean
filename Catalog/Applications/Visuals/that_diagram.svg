<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="url(#bgGrad)" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">Backpropagation as Cotangent Lift</text>
  <text x="450" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">Contravariant Functoriality of T* : Man^op → VectBun</text>

  <!-- ═══ FORWARD PASS (top row) ═══ -->
  <text x="450" y="100" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#2563eb">FORWARD PASS (Tangent / Covariant)</text>

  <!-- Manifold boxes -->
  <rect x="60" y="120" width="120" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e40af">M₀</text>
  <text x="120" y="170" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b82f6">ℝ^d₀ (input)</text>

  <rect x="270" y="120" width="120" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e40af">M₁</text>
  <text x="330" y="170" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b82f6">ℝ^d₁</text>

  <rect x="480" y="120" width="120" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e40af">M₂</text>
  <text x="540" y="170" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b82f6">ℝ^d₂</text>

  <rect x="690" y="120" width="120" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="750" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e40af">M₃</text>
  <text x="750" y="170" text-anchor="middle" font-family="monospace" font-size="11" fill="#3b82f6">ℝ^d₃ (output)</text>

  <!-- Forward arrows -->
  <line x1="180" y1="155" x2="265" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="222" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2563eb">f₁</text>

  <line x1="390" y1="155" x2="475" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="432" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2563eb">f₂</text>

  <line x1="600" y1="155" x2="685" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="642" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2563eb">f₃</text>

  <!-- ═══ TANGENT BUNDLES (middle row) ═══ -->
  <text x="450" y="235" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b">tangent map df : TM → TN (covariant, same direction)</text>

  <!-- ═══ COTANGENT BUNDLES (bottom row) ═══ -->
  <text x="450" y="280" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">BACKWARD PASS (Cotangent / Contravariant)</text>

  <!-- Cotangent bundle boxes -->
  <rect x="60" y="300" width="120" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#991b1b">T*M₀</text>
  <text x="120" y="350" text-anchor="middle" font-family="monospace" font-size="11" fill="#ef4444">gradients</text>

  <rect x="270" y="300" width="120" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="330" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#991b1b">T*M₁</text>
  <text x="330" y="350" text-anchor="middle" font-family="monospace" font-size="11" fill="#ef4444">gradients</text>

  <rect x="480" y="300" width="120" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#991b1b">T*M₂</text>
  <text x="540" y="350" text-anchor="middle" font-family="monospace" font-size="11" fill="#ef4444">gradients</text>

  <rect x="690" y="300" width="120" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="750" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#991b1b">T*M₃</text>
  <text x="750" y="350" text-anchor="middle" font-family="monospace" font-size="11" fill="#ef4444">∂L/∂output</text>

  <!-- Backward arrows (REVERSED direction — contravariant!) -->
  <line x1="265" y1="335" x2="185" y2="335" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="222" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#dc2626">f₁*</text>

  <line x1="475" y1="335" x2="395" y2="335" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="432" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#dc2626">f₂*</text>

  <line x1="685" y1="335" x2="605" y2="335" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="642" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#dc2626">f₃*</text>

  <!-- ═══ Vertical duality arrows ═══ -->
  <line x1="120" y1="190" x2="120" y2="295" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <line x1="330" y1="190" x2="330" y2="295" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <line x1="540" y1="190" x2="540" y2="295" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <line x1="750" y1="190" x2="750" y2="295" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>

  <text x="830" y="248" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#16a34a">T*</text>
  <text x="830" y="262" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#16a34a">functor</text>

  <!-- ═══ Equations box ═══ -->
  <rect x="80" y="400" width="740" height="120" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>

  <text x="450" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#854d0e">The Fundamental Equations</text>

  <text x="140" y="455" font-family="Georgia, serif" font-size="14" fill="#1e293b">
    <tspan font-weight="bold" fill="#2563eb">Forward:</tspan>  F = f₃ ∘ f₂ ∘ f₁   (composition in layer order)
  </text>
  <text x="140" y="480" font-family="Georgia, serif" font-size="14" fill="#1e293b">
    <tspan font-weight="bold" fill="#dc2626">Backward:</tspan>  F* = f₁* ∘ f₂* ∘ f₃*   (reversed — contravariant functoriality!)
  </text>
  <text x="140" y="505" font-family="Georgia, serif" font-size="14" fill="#1e293b">
    <tspan font-weight="bold" fill="#16a34a">Matrix form:</tspan>  f_i*(α) = Jᵢᵀ · α   (transpose Jacobian = backprop step)
  </text>

  <!-- ═══ Functor diagram ═══ -->
  <rect x="80" y="535" width="740" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="450" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#166534">
    T* : Man^op → VectBun    |    Backprop's reverse order is forced by contravariance of T*
  </text>

  <!-- Caption -->
  <text x="450" y="605" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#64748b">
    Figure: The cotangent functor T* reverses morphism direction, making backpropagation a categorical necessity.
  </text>
</svg>
