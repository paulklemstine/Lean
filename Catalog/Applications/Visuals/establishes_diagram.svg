<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">
    Tropical Hyperbolic Sheaf Formula (bf72)
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">
    Neural Network → Tropical Sheaf → Cohomological Invariant
  </text>

  <!-- ============================================================ -->
  <!-- LEFT: Neural Network Graph -->
  <!-- ============================================================ -->
  <rect x="30" y="75" width="260" height="340" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Neural Network</text>

  <!-- Input neurons -->
  <circle cx="80" cy="180" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="185" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₀</text>
  <circle cx="80" cy="280" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="285" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">x₁</text>

  <!-- Hidden neurons -->
  <circle cx="180" cy="155" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">h₀</text>
  <circle cx="180" cy="300" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="180" y="305" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">h₁</text>

  <!-- Output neuron -->
  <circle cx="250" cy="230" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="235" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">y</text>

  <!-- Edges with weights -->
  <line x1="102" y1="175" x2="158" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <text x="125" y="160" font-family="monospace" font-size="9" fill="#2563eb">w=1.0</text>

  <line x1="102" y1="275" x2="158" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <text x="110" y="215" font-family="monospace" font-size="9" fill="#2563eb">w=0.5</text>

  <line x1="102" y1="185" x2="158" y2="295" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <text x="115" y="255" font-family="monospace" font-size="9" fill="#dc2626">w=-0.5</text>

  <line x1="102" y1="285" x2="158" y2="300" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <text x="125" y="305" font-family="monospace" font-size="9" fill="#2563eb">w=2.0</text>

  <line x1="202" y1="165" x2="228" y2="220" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <text x="225" y="190" font-family="monospace" font-size="9" fill="#16a34a">w=1.5</text>

  <line x1="202" y1="290" x2="228" y2="240" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>
  <text x="225" y="275" font-family="monospace" font-size="9" fill="#16a34a">w=0.5</text>

  <!-- ReLU label -->
  <text x="160" y="370" text-anchor="middle" font-family="monospace" font-size="11" fill="#7c3aed">
    ReLU(x) = max(0, x)
  </text>
  <text x="160" y="390" text-anchor="middle" font-family="monospace" font-size="11" fill="#7c3aed">
    = 0 ⊕ x (tropical)
  </text>

  <!-- ============================================================ -->
  <!-- CENTER: Tropical Sheaf Structure -->
  <!-- ============================================================ -->
  <rect x="320" y="75" width="260" height="340" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Tropical Sheaf 𝓕</text>

  <!-- Stalks as rectangles -->
  <rect x="345" y="130" width="70" height="50" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="150" text-anchor="middle" font-family="monospace" font-size="10" fill="#5b21b6">𝓕(x₀)</text>
  <text x="380" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#7c3aed">[1.0]</text>

  <rect x="345" y="230" width="70" height="50" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="250" text-anchor="middle" font-family="monospace" font-size="10" fill="#5b21b6">𝓕(x₁)</text>
  <text x="380" y="270" text-anchor="middle" font-family="monospace" font-size="9" fill="#7c3aed">[2.0]</text>

  <rect x="435" y="130" width="70" height="50" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="150" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">𝓕(h₀)</text>
  <text x="470" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97706">[2.5]</text>

  <rect x="435" y="230" width="70" height="50" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="250" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">𝓕(h₁)</text>
  <text x="470" y="270" text-anchor="middle" font-family="monospace" font-size="9" fill="#d97706">[4.0]</text>

  <rect x="500" y="180" width="70" height="50" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="535" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">𝓕(y)</text>
  <text x="535" y="220" text-anchor="middle" font-family="monospace" font-size="9" fill="#16a34a">[4.5]</text>

  <!-- Restriction maps -->
  <line x1="415" y1="155" x2="435" y2="155" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="4,2"/>
  <line x1="415" y1="255" x2="435" y2="255" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="4,2"/>
  <line x1="505" y1="155" x2="510" y2="180" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="4,2"/>
  <line x1="505" y1="255" x2="510" y2="230" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="4,2"/>

  <!-- Restriction map label -->
  <text x="450" y="310" text-anchor="middle" font-family="monospace" font-size="10" fill="#5b21b6">ρ(x) = w ⊙ x = w + x</text>

  <!-- Sheaf condition -->
  <rect x="340" y="330" width="220" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="450" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">Sheaf Condition ✓</text>
  <text x="450" y="370" text-anchor="middle" font-family="monospace" font-size="9" fill="#6d28d9">a_v = ReLU(⊕ᵤ w_{u→v} ⊙ aᵤ)</text>
  <text x="450" y="388" text-anchor="middle" font-family="monospace" font-size="9" fill="#6d28d9">= 0 ⊕ max_u(w_{uv} + a_u)</text>

  <!-- ============================================================ -->
  <!-- RIGHT: Cohomological Invariant -->
  <!-- ============================================================ -->
  <rect x="610" y="75" width="260" height="340" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Cohomological Invariant</text>

  <!-- Cohomology groups -->
  <rect x="640" y="125" width="200" height="45" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="740" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#991b1b">H⁰_trop(G, 𝓕)</text>
  <text x="740" y="162" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b91c1c">Global sections = consistent activations</text>

  <rect x="640" y="185" width="200" height="45" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="740" y="205" text-anchor="middle" font-family="monospace" font-size="11" fill="#991b1b">H¹_trop(G, 𝓕)</text>
  <text x="740" y="222" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b91c1c">Obstructions to gluing local features</text>

  <!-- Euler characteristic -->
  <rect x="650" y="255" width="180" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="740" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Euler Characteristic</text>
  <text x="740" y="298" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">χ = |V| - |E| = -1</text>

  <!-- Duality -->
  <rect x="640" y="330" width="200" height="70" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="740" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Tropical Duality</text>
  <text x="740" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#b91c1c">Hᵏ(G,𝓕) ≅ Hⁿ⁻ᵏ(G,𝓕ᵛ)</text>
  <text x="740" y="390" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b91c1c">Architecture-invariant quantity</text>

  <!-- ============================================================ -->
  <!-- BOTTOM: Maslov Dequantization Bridge -->
  <!-- ============================================================ -->
  <rect x="150" y="440" width="600" height="100" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="465" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f766e">Maslov Dequantization Bridge</text>

  <!-- Smooth side -->
  <text x="250" y="490" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f766e">Smooth (Hyperbolic)</text>
  <text x="250" y="510" text-anchor="middle" font-family="monospace" font-size="11" fill="#115e59">h·log(eᵃ/ʰ + eᵇ/ʰ)</text>

  <!-- Arrow -->
  <line x1="370" y1="500" x2="520" y2="500" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="450" y="493" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#0f766e">h → 0⁺</text>

  <!-- Tropical side -->
  <text x="630" y="490" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f766e">Tropical (Piecewise-Linear)</text>
  <text x="630" y="510" text-anchor="middle" font-family="monospace" font-size="11" fill="#115e59">max(a, b) = a ⊕ b</text>

  <!-- Caption -->
  <text x="450" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#475569">
    Figure: The tropical hyperbolic sheaf formula connects neural network computations (left)
  </text>
  <text x="450" y="598" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#475569">
    to sheaf-theoretic structures (center) yielding cohomological invariants (right),
  </text>
  <text x="450" y="616" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#475569">
    bridged by the Maslov dequantization from hyperbolic to tropical geometry (bottom).
  </text>
</svg>
