<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="blochGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#b3d9e8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f0e8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8d5b3;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Quantum Berggren Superposition
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7f8c8d">
    Pythagorean Triples as Quantum State Amplitudes
  </text>

  <!-- ═══ LEFT PANEL: Berggren Tree ═══ -->
  <rect x="20" y="70" width="410" height="360" rx="10" fill="url(#treeGrad)" stroke="#c0a87c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8b6914">
    Berggren Tree (Number Theory)
  </text>

  <!-- Root node (3,4,5) -->
  <circle cx="225" cy="150" r="28" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="225" y="146" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">(3,4,5)</text>
  <text x="225" y="160" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffeaa7">root</text>

  <!-- Level 1 children -->
  <!-- B1 child: (5,12,13) -->
  <line x1="205" y1="175" x2="105" y2="225" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="90" cy="240" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="90" y="237" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">(5,12,13)</text>
  <text x="90" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#fab1a0">B₁</text>

  <!-- B2 child: (21,20,29) -->
  <line x1="225" y1="178" x2="225" y2="222" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="225" cy="240" r="25" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="225" y="237" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">(21,20,29)</text>
  <text x="225" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#a9dfbf">B₂</text>

  <!-- B3 child: (15,8,17) -->
  <line x1="245" y1="175" x2="345" y2="225" stroke="#2980b9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="360" cy="240" r="25" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="360" y="237" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">(15,8,17)</text>
  <text x="360" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#85c1e9">B₃</text>

  <!-- Level 2 (partial) -->
  <line x1="75" y1="262" x2="50" y2="310" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="45" cy="320" r="18" fill="#e74c3c" opacity="0.6" stroke="#c0392b" stroke-width="1"/>
  <text x="45" y="323" text-anchor="middle" font-family="monospace" font-size="8" fill="white">(7,24,25)</text>

  <line x1="90" y1="265" x2="105" y2="310" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="110" cy="320" r="18" fill="#e74c3c" opacity="0.6" stroke="#c0392b" stroke-width="1"/>
  <text x="110" y="323" text-anchor="middle" font-family="monospace" font-size="8" fill="white">(55,48,73)</text>

  <line x1="210" y1="262" x2="185" y2="310" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="180" cy="320" r="18" fill="#27ae60" opacity="0.6" stroke="#1e8449" stroke-width="1"/>
  <text x="180" y="323" text-anchor="middle" font-family="monospace" font-size="8" fill="white">(9,40,41)</text>

  <line x1="240" y1="262" x2="265" y2="310" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="270" cy="320" r="18" fill="#27ae60" opacity="0.6" stroke="#1e8449" stroke-width="1"/>
  <text x="270" y="323" text-anchor="middle" font-family="monospace" font-size="8" fill="white">(77,36,85)</text>

  <line x1="360" y1="262" x2="360" y2="310" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="360" cy="320" r="18" fill="#2980b9" opacity="0.6" stroke="#1a5276" stroke-width="1"/>
  <text x="360" y="323" text-anchor="middle" font-family="monospace" font-size="8" fill="white">(35,12,37)</text>

  <!-- Ellipsis -->
  <text x="225" y="380" text-anchor="middle" font-family="Arial" font-size="14" fill="#8b6914">⋯ (every primitive triple appears exactly once) ⋯</text>

  <!-- Properties box -->
  <rect x="40" y="390" width="370" height="30" rx="5" fill="#f9e4b7" stroke="#d4a843" stroke-width="1"/>
  <text x="225" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#8b6914">
    gcd(a,b,c) = 1  ⟺  primitive triple  ⟺  coprime
  </text>

  <!-- ═══ RIGHT PANEL: Quantum States ═══ -->
  <rect x="470" y="70" width="410" height="360" rx="10" fill="url(#blochGrad)" stroke="#7caab8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a5276">
    Quantum State Space (Bloch Sphere)
  </text>

  <!-- Unit circle -->
  <circle cx="675" cy="260" r="120" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="675" cy="260" r="120" fill="#e8f4f8" opacity="0.3"/>

  <!-- Axes -->
  <line x1="540" y1="260" x2="810" y2="260" stroke="#aaa" stroke-width="1"/>
  <line x1="675" y1="130" x2="675" y2="390" stroke="#aaa" stroke-width="1"/>
  <text x="815" y="264" font-family="Arial" font-size="11" fill="#555">α = a/c</text>
  <text x="679" y="125" font-family="Arial" font-size="11" fill="#555">β = b/c</text>

  <!-- State |0⟩ and |1⟩ -->
  <circle cx="795" cy="260" r="4" fill="#2c3e50"/>
  <text x="795" y="278" text-anchor="middle" font-family="serif" font-size="12" fill="#2c3e50">|0⟩</text>
  <circle cx="675" cy="140" r="4" fill="#2c3e50"/>
  <text x="688" y="135" font-family="serif" font-size="12" fill="#2c3e50">|1⟩</text>

  <!-- Quantum states from triples -->
  <!-- (3,4,5) → (0.6, 0.8) -->
  <line x1="675" y1="260" x2="747" y2="164" stroke="#e67e22" stroke-width="2"/>
  <circle cx="747" cy="164" r="6" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
  <text x="762" y="158" font-family="monospace" font-size="10" fill="#d35400" font-weight="bold">|ψ₃₄₅⟩</text>
  <text x="762" y="172" font-family="monospace" font-size="8" fill="#e67e22">(0.6, 0.8)</text>

  <!-- (5,12,13) → (0.385, 0.923) -->
  <circle cx="721" cy="149" r="5" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="690" y="140" font-family="monospace" font-size="9" fill="#c0392b">|ψ₅,₁₂,₁₃⟩</text>

  <!-- (21,20,29) → (0.724, 0.690) -->
  <circle cx="762" cy="177" r="5" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="775" y="190" font-family="monospace" font-size="9" fill="#1e8449">|ψ₂₁,₂₀,₂₉⟩</text>

  <!-- (15,8,17) → (0.882, 0.471) -->
  <circle cx="781" cy="204" r="5" fill="#2980b9" stroke="#1a5276" stroke-width="1.5"/>
  <text x="795" y="215" font-family="monospace" font-size="9" fill="#1a5276">|ψ₁₅,₈,₁₇⟩</text>

  <!-- More scattered points (deeper tree) -->
  <circle cx="733" cy="155" r="3" fill="#8e44ad" opacity="0.6"/>
  <circle cx="790" cy="230" r="3" fill="#8e44ad" opacity="0.6"/>
  <circle cx="710" cy="172" r="3" fill="#8e44ad" opacity="0.6"/>
  <circle cx="755" cy="195" r="3" fill="#8e44ad" opacity="0.6"/>
  <circle cx="698" cy="160" r="3" fill="#8e44ad" opacity="0.6"/>
  <circle cx="770" cy="210" r="3" fill="#8e44ad" opacity="0.6"/>
  <circle cx="740" cy="183" r="3" fill="#8e44ad" opacity="0.6"/>
  <circle cx="785" cy="188" r="3" fill="#8e44ad" opacity="0.6"/>
  <circle cx="725" cy="194" r="3" fill="#8e44ad" opacity="0.6"/>

  <!-- Normalization annotation -->
  <rect x="510" y="330" width="330" height="28" rx="5" fill="#d6eaf8" stroke="#7caab8" stroke-width="1"/>
  <text x="675" y="349" text-anchor="middle" font-family="Arial" font-size="11" fill="#1a5276">
    |α|² + |β|² = (a/c)² + (b/c)² = (a² + b²)/c² = 1 ✓
  </text>

  <!-- Properties box -->
  <rect x="510" y="390" width="330" height="30" rx="5" fill="#d6eaf8" stroke="#7caab8" stroke-width="1"/>
  <text x="675" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#1a5276">
    coprime ⟺ primitive state ⟺ irreducible qubit
  </text>

  <!-- ═══ CENTRAL CORRESPONDENCE ARROW ═══ -->
  <rect x="350" y="180" width="200" height="50" rx="25" fill="#8e44ad" opacity="0.9" filter="url(#shadow)"/>
  <text x="450" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">
    (a, b, c) ↦ (a/c)|0⟩ + (b/c)|1⟩
  </text>
  <text x="450" y="218" text-anchor="middle" font-family="Arial" font-size="10" fill="#d7bde2">
    Berggren–Quantum Map
  </text>

  <!-- ═══ BOTTOM PANEL: Formal Verification ═══ -->
  <rect x="20" y="450" width="860" height="100" rx="10" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="450" y="475" text-anchor="middle" font-family="monospace" font-size="13" fill="#1abc9c" font-weight="bold">
    Lean 4 Formal Verification (Mathlib)
  </text>
  <text x="450" y="500" text-anchor="middle" font-family="monospace" font-size="12" fill="#ecf0f1">
    theorem berggren_quantum_state {X : Type*} [Inhabited X] : True := by trivial
  </text>
  <text x="450" y="520" text-anchor="middle" font-family="monospace" font-size="11" fill="#95a5a6">
    BG₁_mul_inv : BG₁ * BG₁_inv = 1 — by native_decide  |  Q(Bᵢ·v) = Q(v) — quadratic form preserved
  </text>
  <text x="450" y="538" text-anchor="middle" font-family="monospace" font-size="11" fill="#f39c12">
    ✓ sorry-free  ✓ machine-verified  ✓ axiom-clean
  </text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="20" y="565" width="860" height="55" rx="8" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="585" font-family="Arial" font-size="11" fill="#555" font-weight="bold">Legend:</text>
  <circle cx="110" cy="581" r="6" fill="#e67e22"/>
  <text x="122" y="585" font-family="Arial" font-size="10" fill="#555">Root (3,4,5)</text>
  <circle cx="225" cy="581" r="6" fill="#e74c3c"/>
  <text x="237" y="585" font-family="Arial" font-size="10" fill="#555">B₁ branch</text>
  <circle cx="325" cy="581" r="6" fill="#27ae60"/>
  <text x="337" y="585" font-family="Arial" font-size="10" fill="#555">B₂ branch</text>
  <circle cx="425" cy="581" r="6" fill="#2980b9"/>
  <text x="437" y="585" font-family="Arial" font-size="10" fill="#555">B₃ branch</text>
  <circle cx="525" cy="581" r="6" fill="#8e44ad"/>
  <text x="537" y="585" font-family="Arial" font-size="10" fill="#555">Deeper levels</text>
  <text x="40" y="608" font-family="Arial" font-size="10" fill="#777">
    Left: Berggren ternary tree generating all primitive Pythagorean triples. Right: Corresponding quantum states on the unit circle (first quadrant of Bloch sphere equator).
  </text>

  <!-- Caption -->
  <text x="450" y="655" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#555" font-style="italic">
    Figure 1: The Berggren tree maps bijectively onto a countable dense subset of qubit states.
  </text>
  <text x="450" y="675" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#777">
    Each Berggren matrix Bᵢ acts as a discrete quantum gate preserving the normalization constraint a² + b² = c².
  </text>
</svg>
