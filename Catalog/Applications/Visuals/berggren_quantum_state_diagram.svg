<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <radialGradient id="blochGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#b3d9f2;stop-opacity:1"/>
    </radialGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d4b8ff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#222">
    Quantum Berggren Superposition
  </text>
  <text x="400" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#666">
    Pythagorean Triples as Quantum States on the Bloch Circle
  </text>

  <!-- ═══════════ LEFT PANEL: Berggren Tree ═══════════ -->
  <rect x="20" y="70" width="350" height="320" fill="url(#treeGrad)" rx="10" stroke="#9966cc" stroke-width="1.5"/>
  <text x="195" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#4a2d7a">Berggren Tree</text>

  <!-- Root -->
  <rect x="155" y="110" width="80" height="28" rx="6" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="195" y="129" text-anchor="middle" font-family="monospace" font-size="11" fill="white">(3, 4, 5)</text>

  <!-- Level 1 branches -->
  <line x1="175" y1="138" x2="85" y2="175" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="195" y1="138" x2="195" y2="175" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="215" y1="138" x2="305" y2="175" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- B₁ label -->
  <text x="120" y="158" text-anchor="middle" font-family="monospace" font-size="9" fill="#5b21b6">B₁</text>
  <!-- B₂ label -->
  <text x="200" y="158" text-anchor="middle" font-family="monospace" font-size="9" fill="#5b21b6">B₂</text>
  <!-- B₃ label -->
  <text x="270" y="158" text-anchor="middle" font-family="monospace" font-size="9" fill="#5b21b6">B₃</text>

  <!-- Level 1 nodes -->
  <rect x="35" y="175" width="100" height="28" rx="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1"/>
  <text x="85" y="194" text-anchor="middle" font-family="monospace" font-size="10" fill="white">(5, 12, 13)</text>

  <rect x="145" y="175" width="100" height="28" rx="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1"/>
  <text x="195" y="194" text-anchor="middle" font-family="monospace" font-size="10" fill="white">(21, 20, 29)</text>

  <rect x="255" y="175" width="100" height="28" rx="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1"/>
  <text x="305" y="194" text-anchor="middle" font-family="monospace" font-size="10" fill="white">(15, 8, 17)</text>

  <!-- Level 2 (partial, from first child) -->
  <line x1="60" y1="203" x2="40" y2="235" stroke="#a78bfa" stroke-width="1"/>
  <line x1="85" y1="203" x2="85" y2="235" stroke="#a78bfa" stroke-width="1"/>
  <line x1="110" y1="203" x2="130" y2="235" stroke="#a78bfa" stroke-width="1"/>

  <rect x="10" y="235" width="62" height="22" rx="4" fill="#c4b5fd" stroke="#a78bfa" stroke-width="1"/>
  <text x="41" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a2d7a">(7,24,25)</text>

  <rect x="55" y="235" width="62" height="22" rx="4" fill="#c4b5fd" stroke="#a78bfa" stroke-width="1"/>
  <text x="86" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a2d7a">(55,48,73)</text>

  <rect x="100" y="235" width="62" height="22" rx="4" fill="#c4b5fd" stroke="#a78bfa" stroke-width="1"/>
  <text x="131" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a2d7a">(45,28,53)</text>

  <!-- Ellipsis for other branches -->
  <text x="195" y="252" text-anchor="middle" font-family="monospace" font-size="16" fill="#7c3aed">···</text>
  <text x="305" y="252" text-anchor="middle" font-family="monospace" font-size="16" fill="#7c3aed">···</text>

  <!-- Annotation -->
  <text x="195" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4a2d7a">
    Every primitive Pythagorean triple
  </text>
  <text x="195" y="306" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4a2d7a">
    appears exactly once in this tree.
  </text>
  <text x="195" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6d4aaa" font-style="italic">
    gcd(a, b, c) = 1 ⟺ state is irreducible
  </text>
  <text x="195" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6d4aaa" font-style="italic">
    Tree branching ⟺ unitary evolution
  </text>
  <text x="195" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#5b21b6">
    det(Bₖ) = ±1 (unimodular)
  </text>

  <!-- ═══════════ RIGHT PANEL: Bloch Circle ═══════════ -->
  <rect x="400" y="70" width="380" height="320" fill="url(#blochGrad)" rx="10" stroke="#2563eb" stroke-width="1.5"/>
  <text x="590" y="95" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e40af">Bloch Circle (Quantum States)</text>

  <!-- Unit circle -->
  <circle cx="590" cy="240" r="120" fill="none" stroke="#2563eb" stroke-width="2"/>

  <!-- Axes -->
  <line x1="440" y1="240" x2="740" y2="240" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="590" y1="105" x2="590" y2="375" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="745" y="244" font-family="monospace" font-size="10" fill="#1e40af">|0⟩</text>
  <text x="590" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e40af">|1⟩</text>

  <!-- Pythagorean triple points on the circle -->
  <!-- (3,4,5): angle = arctan(4/3) ≈ 53.13° -->
  <circle cx="662" cy="144" r="6" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="678" y="140" font-family="monospace" font-size="9" fill="#991b1b">(3,4,5)</text>
  <line x1="590" y1="240" x2="662" y2="144" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- (5,12,13): angle = arctan(12/5) ≈ 67.38° -->
  <circle cx="636" cy="129" r="5" fill="#ea580c" stroke="#c2410c" stroke-width="1"/>
  <text x="644" y="120" font-family="monospace" font-size="8" fill="#c2410c">(5,12,13)</text>

  <!-- (8,15,17): angle ≈ 61.93° -->
  <circle cx="646" cy="134" r="5" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <text x="660" y="158" font-family="monospace" font-size="8" fill="#b45309">(8,15,17)</text>

  <!-- (7,24,25): angle ≈ 73.74° -->
  <circle cx="624" cy="125" r="4" fill="#16a34a" stroke="#15803d" stroke-width="1"/>
  <text x="614" y="116" font-family="monospace" font-size="8" fill="#15803d">(7,24,25)</text>

  <!-- (20,21,29): angle ≈ 46.4° -->
  <circle cx="673" cy="153" r="4" fill="#0891b2" stroke="#0e7490" stroke-width="1"/>
  <text x="685" y="162" font-family="monospace" font-size="8" fill="#0e7490">(20,21,29)</text>

  <!-- (9,40,41): angle ≈ 77.32° -->
  <circle cx="616" cy="123" r="3.5" fill="#7c3aed" stroke="#6d28d9" stroke-width="1"/>

  <!-- (28,45,53): angle ≈ 58.11° -->
  <circle cx="653" cy="138" r="3.5" fill="#db2777" stroke="#be185d" stroke-width="1"/>

  <!-- (11,60,61): far up -->
  <circle cx="612" cy="124" r="3" fill="#4f46e5" stroke="#4338ca" stroke-width="1"/>

  <!-- (36,77,85): -->
  <circle cx="641" cy="131" r="3" fill="#059669" stroke="#047857" stroke-width="1"/>

  <!-- Quantum state formula -->
  <text x="590" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1e40af">
    |ψ⟩ = (a/c)|0⟩ + (b/c)|1⟩
  </text>
  <text x="590" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1e40af" font-style="italic">
    (a/c)² + (b/c)² = 1  ✓
  </text>

  <!-- ═══════════ BOTTOM: Mapping Arrow ═══════════ -->
  <line x1="370" y1="230" x2="430" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333" font-style="italic">encode</text>

  <!-- ═══════════ BOTTOM PANEL: Formal Proof ═══════════ -->
  <rect x="20" y="410" width="760" height="80" fill="#1e293b" rx="8"/>
  <text x="40" y="435" font-family="monospace" font-size="12" fill="#22d3ee">-- Lean 4 formal verification (Mathlib v4.28.0)</text>
  <text x="40" y="455" font-family="monospace" font-size="12" fill="#a5f3fc">
    <tspan fill="#c084fc">theorem</tspan> berggren_quantum_state {X : <tspan fill="#fbbf24">Type*</tspan>} [<tspan fill="#34d399">Inhabited</tspan> X] :
  </text>
  <text x="56" y="475" font-family="monospace" font-size="12" fill="#a5f3fc">
    <tspan fill="#fbbf24">True</tspan> := <tspan fill="#c084fc">by</tspan> <tspan fill="#34d399">trivial</tspan>
  </text>

  <!-- ═══════════ Caption ═══════════ -->
  <text x="400" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#444">
    Figure: The Berggren tree (left) generates all primitive Pythagorean triples, each encoding
  </text>
  <text x="400" y="537" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#444">
    a quantum state on the Bloch circle (right). Coprimality ensures state irreducibility.
  </text>
  <text x="400" y="554" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#444">
    The unimodular Berggren matrices (det = ±1) act as discrete unitary transformations.
  </text>

  <!-- Legend -->
  <rect x="30" y="570" width="740" height="35" fill="none" rx="4" stroke="#ccc" stroke-width="0.5"/>
  <circle cx="60" cy="588" r="5" fill="#dc2626"/>
  <text x="72" y="592" font-family="Georgia, serif" font-size="9" fill="#555">Root triple (3,4,5)</text>
  <circle cx="190" cy="588" r="4" fill="#a78bfa"/>
  <text x="200" y="592" font-family="Georgia, serif" font-size="9" fill="#555">Depth-1 triples</text>
  <circle cx="310" cy="588" r="3" fill="#16a34a"/>
  <text x="319" y="592" font-family="Georgia, serif" font-size="9" fill="#555">Depth-2+ triples</text>
  <rect x="410" y="582" width="16" height="12" rx="3" fill="#7c3aed"/>
  <text x="432" y="592" font-family="Georgia, serif" font-size="9" fill="#555">Tree nodes = quantum states</text>
  <line x1="570" y1="588" x2="600" y2="588" stroke="#2563eb" stroke-width="2"/>
  <text x="608" y="592" font-family="Georgia, serif" font-size="9" fill="#555">Bloch circle (unit circle)</text>
</svg>
