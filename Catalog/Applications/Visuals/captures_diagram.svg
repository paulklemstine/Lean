<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <marker id="arrow-fwd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrow-bwd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrow-cat" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <linearGradient id="grad-tangent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="grad-cotangent" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FEE2E2;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FCA5A5;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1E293B">Backpropagation as the Cotangent Lift</text>

  <!-- ════════════════ FORWARD PASS (TOP) ════════════════ -->
  <rect x="30" y="50" width="840" height="130" fill="url(#grad-tangent)" rx="8" stroke="#93C5FD" stroke-width="1"/>
  <text x="50" y="75" font-family="monospace" font-size="13" fill="#1E40AF" font-weight="bold">FORWARD PASS (Tangent / Covariant)</text>

  <!-- Manifolds -->
  <ellipse cx="130" cy="125" rx="55" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="130" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1E40AF">ℝ³</text>
  <text x="130" y="138" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">input</text>

  <ellipse cx="330" cy="125" rx="55" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1E40AF">ℝ⁴</text>
  <text x="330" y="138" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">hidden₁</text>

  <ellipse cx="530" cy="125" rx="55" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="530" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1E40AF">ℝ⁴</text>
  <text x="530" y="138" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">hidden₂</text>

  <ellipse cx="730" cy="125" rx="55" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="730" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1E40AF">ℝ²</text>
  <text x="730" y="138" text-anchor="middle" font-family="monospace" font-size="10" fill="#3B82F6">output</text>

  <!-- Forward arrows -->
  <line x1="188" y1="118" x2="272" y2="118" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="230" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2563EB" font-style="italic">f₁</text>

  <line x1="388" y1="118" x2="472" y2="118" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="430" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2563EB" font-style="italic">f₂</text>

  <line x1="588" y1="118" x2="672" y2="118" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="630" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2563EB" font-style="italic">f₃</text>

  <!-- ════════════════ BACKWARD PASS (BOTTOM) ════════════════ -->
  <rect x="30" y="200" width="840" height="130" fill="url(#grad-cotangent)" rx="8" stroke="#FCA5A5" stroke-width="1"/>
  <text x="50" y="225" font-family="monospace" font-size="13" fill="#991B1B" font-weight="bold">BACKWARD PASS (Cotangent / Contravariant)</text>

  <!-- Cotangent spaces -->
  <ellipse cx="130" cy="280" rx="55" ry="30" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/>
  <text x="130" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#991B1B">T*ℝ³</text>
  <text x="130" y="292" text-anchor="middle" font-family="monospace" font-size="10" fill="#EF4444">∇ₓL</text>

  <ellipse cx="330" cy="280" rx="55" ry="30" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/>
  <text x="330" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#991B1B">T*ℝ⁴</text>
  <text x="330" y="292" text-anchor="middle" font-family="monospace" font-size="10" fill="#EF4444">∇₁L</text>

  <ellipse cx="530" cy="280" rx="55" ry="30" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/>
  <text x="530" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#991B1B">T*ℝ⁴</text>
  <text x="530" y="292" text-anchor="middle" font-family="monospace" font-size="10" fill="#EF4444">∇₂L</text>

  <ellipse cx="730" cy="280" rx="55" ry="30" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/>
  <text x="730" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#991B1B">T*ℝ²</text>
  <text x="730" y="292" text-anchor="middle" font-family="monospace" font-size="10" fill="#EF4444">∇ᵧL</text>

  <!-- Backward arrows (reversed!) -->
  <line x1="672" y1="273" x2="588" y2="273" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-bwd)"/>
  <text x="630" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#DC2626" font-style="italic">f₃*</text>

  <line x1="472" y1="273" x2="388" y2="273" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-bwd)"/>
  <text x="430" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#DC2626" font-style="italic">f₂*</text>

  <line x1="272" y1="273" x2="188" y2="273" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-bwd)"/>
  <text x="230" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#DC2626" font-style="italic">f₁*</text>

  <!-- ════════════════ CATEGORICAL DIAGRAM ════════════════ -->
  <rect x="30" y="350" width="840" height="120" fill="#F5F3FF" rx="8" stroke="#C4B5FD" stroke-width="1"/>
  <text x="50" y="375" font-family="monospace" font-size="13" fill="#5B21B6" font-weight="bold">CONTRAVARIANT FUNCTOR T* : Man^{op} → VectBun</text>

  <!-- The key equation -->
  <text x="450" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#5B21B6">
    F = f₃ ∘ f₂ ∘ f₁
  </text>
  <text x="450" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#DC2626" font-weight="bold">
    F* = f₁* ∘ f₂* ∘ f₃*
  </text>
  <text x="450" y="463" text-anchor="middle" font-family="monospace" font-size="11" fill="#7C3AED">
    ↑ composition reversed by contravariance = BACKPROPAGATION
  </text>

  <!-- Caption -->
  <text x="450" y="505" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748B" font-style="italic">
    The forward pass pushes data through layers (blue, covariant). Backpropagation pulls gradients back (red, contravariant).
  </text>
  <text x="450" y="518" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748B" font-style="italic">
    The reversal of composition order is the defining property of a contravariant functor.
  </text>
</svg>
