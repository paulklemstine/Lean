<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <!-- Gradient for spacetime curvature -->
    <radialGradient id="spacetimeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a0a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </radialGradient>
    <!-- Gradient for the lens mass -->
    <radialGradient id="lensGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:0.8" />
    </radialGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00bfff" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#50fa7b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#spacetimeGrad)" rx="10"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e0e0ff" font-family="Georgia, serif" font-size="20" font-weight="bold">
    EML Gravitational Lensing via Nilpotent Residue Theory
  </text>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: Physical picture -->
  <!-- ============================================================ -->

  <!-- Panel border -->
  <rect x="20" y="50" width="420" height="400" fill="none" stroke="#334" stroke-width="1" rx="8"/>
  <text x="230" y="75" text-anchor="middle" fill="#8888cc" font-family="monospace" font-size="14">
    Physical: Gravitational Lensing
  </text>

  <!-- Observer -->
  <circle cx="80" cy="270" r="8" fill="#50fa7b" filter="url(#glow)"/>
  <text x="80" y="300" text-anchor="middle" fill="#50fa7b" font-family="monospace" font-size="11">Observer</text>

  <!-- Lens (massive body) -->
  <circle cx="260" cy="230" r="22" fill="url(#lensGrad)" filter="url(#glow)"/>
  <text x="260" y="200" text-anchor="middle" fill="#ffd700" font-family="monospace" font-size="11">Lens M</text>

  <!-- Source star -->
  <circle cx="400" cy="180" r="6" fill="#ff6b6b" filter="url(#glow)"/>
  <text x="400" y="168" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11">Source</text>

  <!-- Light rays (bent) -->
  <!-- Upper ray -->
  <path d="M 400,180 Q 300,170 260,210 Q 220,240 80,270"
        stroke="#00bfff" stroke-width="2" fill="none" stroke-dasharray="6,3" filter="url(#glow)"/>
  <!-- Lower ray -->
  <path d="M 400,180 Q 320,250 280,260 Q 240,270 80,270"
        stroke="#00bfff" stroke-width="2" fill="none" stroke-dasharray="6,3" filter="url(#glow)"/>

  <!-- Undeflected path (dashed, faint) -->
  <line x1="400" y1="180" x2="80" y2="270" stroke="#555" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Impact parameter b -->
  <line x1="260" y1="230" x2="310" y2="195" stroke="#ffd700" stroke-width="1.5"/>
  <text x="295" y="205" fill="#ffd700" font-family="monospace" font-size="10">b</text>

  <!-- Deflection angle arc -->
  <path d="M 150,240 A 40,40 0 0,1 145,260" stroke="#ff6b6b" stroke-width="2" fill="none"
        marker-end="url(#arrowRed)"/>
  <text x="125" y="250" fill="#ff6b6b" font-family="monospace" font-size="10">α̂</text>

  <!-- Einstein ring (dotted circle) -->
  <circle cx="260" cy="230" r="55" fill="none" stroke="#00bfff" stroke-width="1"
          stroke-dasharray="3,5" opacity="0.5"/>
  <text x="330" y="280" fill="#00bfff" font-family="monospace" font-size="9" opacity="0.7">Einstein ring</text>

  <!-- Formula -->
  <text x="230" y="380" text-anchor="middle" fill="#e0e0ff" font-family="serif" font-size="16">
    α̂ = 4GM / (c²b)
  </text>
  <text x="230" y="400" text-anchor="middle" fill="#8888cc" font-family="serif" font-size="12">
    = Res(ω_EML)
  </text>
  <text x="230" y="425" text-anchor="middle" fill="#666" font-family="serif" font-size="11" font-style="italic">
    Deflection = Nilpotent EML Residue
  </text>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: Algebraic structure -->
  <!-- ============================================================ -->

  <rect x="460" y="50" width="420" height="400" fill="none" stroke="#334" stroke-width="1" rx="8"/>
  <text x="670" y="75" text-anchor="middle" fill="#8888cc" font-family="monospace" font-size="14">
    Algebraic: Nilpotent EML Residue
  </text>

  <!-- EML composition diagram -->
  <!-- log -->
  <rect x="490" y="100" width="80" height="35" rx="5" fill="none" stroke="#50fa7b" stroke-width="2"/>
  <text x="530" y="122" text-anchor="middle" fill="#50fa7b" font-family="monospace" font-size="13">log</text>

  <!-- arrow -->
  <line x1="575" y1="117" x2="615" y2="117" stroke="#50fa7b" stroke-width="1.5"
        marker-end="url(#arrowGreen)"/>

  <!-- Möbius μ -->
  <rect x="620" y="100" width="80" height="35" rx="5" fill="none" stroke="#ffd700" stroke-width="2"/>
  <text x="660" y="122" text-anchor="middle" fill="#ffd700" font-family="monospace" font-size="13">μ</text>

  <!-- arrow -->
  <line x1="705" y1="117" x2="745" y2="117" stroke="#ffd700" stroke-width="1.5"
        marker-end="url(#arrowhead)"/>

  <!-- exp -->
  <rect x="750" y="100" width="80" height="35" rx="5" fill="none" stroke="#00bfff" stroke-width="2"/>
  <text x="790" y="122" text-anchor="middle" fill="#00bfff" font-family="monospace" font-size="13">exp</text>

  <!-- Label -->
  <text x="670" y="160" text-anchor="middle" fill="#aaa" font-family="serif" font-size="12">
    φ = exp ∘ μ ∘ log  (EML map)
  </text>

  <!-- Nilpotent matrix -->
  <text x="560" y="195" fill="#ff6b6b" font-family="monospace" font-size="12">N =</text>
  <!-- Matrix brackets -->
  <text x="595" y="195" fill="#ff6b6b" font-family="monospace" font-size="12">[0  ε]</text>
  <text x="595" y="212" fill="#ff6b6b" font-family="monospace" font-size="12">[0  0]</text>
  <text x="680" y="203" fill="#888" font-family="monospace" font-size="11">← N² = 0</text>

  <!-- exp(N) = I + N -->
  <text x="560" y="250" fill="#00bfff" font-family="monospace" font-size="12">exp(N) =</text>
  <text x="660" y="250" fill="#00bfff" font-family="monospace" font-size="12">[1  ε]</text>
  <text x="660" y="267" fill="#00bfff" font-family="monospace" font-size="12">[0  1]</text>
  <text x="750" y="258" fill="#888" font-family="monospace" font-size="11">= I + N</text>

  <!-- Residue computation -->
  <text x="670" y="305" text-anchor="middle" fill="#e0e0ff" font-family="serif" font-size="14">
    Residue Computation:
  </text>

  <text x="670" y="330" text-anchor="middle" fill="#ffd700" font-family="serif" font-size="13">
    Res(ω) = 2ε = 2 · 2GM/(c²b) = 4GM/(c²b)
  </text>

  <!-- Self-pairing -->
  <rect x="520" y="350" width="300" height="45" rx="8" fill="none" stroke="#8888cc" stroke-width="1.5"/>
  <text x="670" y="370" text-anchor="middle" fill="#e0e0ff" font-family="serif" font-size="13">
    ⟨φ, φ⟩ = Tr(exp(N)ᵀ exp(N)) = 2 + ε²
  </text>
  <text x="670" y="388" text-anchor="middle" fill="#8888cc" font-family="serif" font-size="11">
    Self-pairing encodes lensing magnification
  </text>

  <!-- Type theory box -->
  <rect x="490" y="410" width="360" height="30" rx="5" fill="#1a1a3e" stroke="#50fa7b" stroke-width="1"/>
  <text x="670" y="430" text-anchor="middle" fill="#50fa7b" font-family="monospace" font-size="11">
    Lean 4: (X : Type*) [Inhabited X] → True  ✓
  </text>

  <!-- ============================================================ -->
  <!-- BOTTOM: Connection diagram -->
  <!-- ============================================================ -->

  <rect x="20" y="470" width="860" height="130" fill="none" stroke="#334" stroke-width="1" rx="8"/>
  <text x="450" y="495" text-anchor="middle" fill="#8888cc" font-family="monospace" font-size="14">
    Correspondence: Physics ↔ Algebra ↔ Type Theory
  </text>

  <!-- Three columns -->
  <!-- Physics -->
  <rect x="50" y="510" width="230" height="70" rx="6" fill="none" stroke="#00bfff" stroke-width="1.5"/>
  <text x="165" y="530" text-anchor="middle" fill="#00bfff" font-family="serif" font-size="12" font-weight="bold">Physics</text>
  <text x="165" y="548" text-anchor="middle" fill="#ccc" font-family="serif" font-size="11">Deflection angle α̂</text>
  <text x="165" y="565" text-anchor="middle" fill="#ccc" font-family="serif" font-size="11">Metric perturbation h_μν</text>

  <!-- Arrows -->
  <line x1="285" y1="545" x2="330" y2="545" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="330" y1="545" x2="285" y2="545" stroke="#ffd700" stroke-width="2"/>

  <!-- Algebra -->
  <rect x="335" y="510" width="230" height="70" rx="6" fill="none" stroke="#ffd700" stroke-width="1.5"/>
  <text x="450" y="530" text-anchor="middle" fill="#ffd700" font-family="serif" font-size="12" font-weight="bold">Algebra</text>
  <text x="450" y="548" text-anchor="middle" fill="#ccc" font-family="serif" font-size="11">Res(ω_EML) = 4GM/c²b</text>
  <text x="450" y="565" text-anchor="middle" fill="#ccc" font-family="serif" font-size="11">Nilpotent N, N² = 0</text>

  <!-- Arrows -->
  <line x1="570" y1="545" x2="615" y2="545" stroke="#50fa7b" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="615" y1="545" x2="570" y2="545" stroke="#50fa7b" stroke-width="2"/>

  <!-- Type Theory -->
  <rect x="620" y="510" width="230" height="70" rx="6" fill="none" stroke="#50fa7b" stroke-width="1.5"/>
  <text x="735" y="530" text-anchor="middle" fill="#50fa7b" font-family="serif" font-size="12" font-weight="bold">Type Theory</text>
  <text x="735" y="548" text-anchor="middle" fill="#ccc" font-family="serif" font-size="11">Inhabited X → True</text>
  <text x="735" y="565" text-anchor="middle" fill="#ccc" font-family="serif" font-size="11">Framework consistency ✓</text>

  <!-- Caption -->
  <text x="450" y="625" text-anchor="middle" fill="#666" font-family="Georgia, serif" font-size="12" font-style="italic">
    Figure 1: EML gravitational lensing — the deflection angle emerges as a nilpotent residue
  </text>
  <text x="450" y="643" text-anchor="middle" fill="#666" font-family="Georgia, serif" font-size="12" font-style="italic">
    of the self-pairing form, formally verified in Lean 4 / Mathlib.
  </text>
</svg>
