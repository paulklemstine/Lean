<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gradient for the hierarchy levels -->
    <linearGradient id="level0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="level1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="level2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="level3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="level4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:0.1"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>

    <!-- CTC loop arrow -->
    <marker id="ctcArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E91E63"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1a1a1a">
    OISCC Temporal Hierarchy
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#666">
    Oracle Separations via Closed Timelike Curve Complexity Classes
  </text>

  <!-- Nested ellipses representing the hierarchy (outermost = highest level) -->
  <!-- Level 4 (outermost) -->
  <ellipse cx="300" cy="310" rx="270" ry="210" fill="url(#level4)" stroke="#FF9800" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="85" y="130" font-family="monospace" font-size="13" fill="#FF9800" font-weight="bold">CTC₄</text>

  <!-- Level 3 -->
  <ellipse cx="300" cy="320" rx="220" ry="170" fill="url(#level3)" stroke="#FF5722" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="120" y="175" font-family="monospace" font-size="13" fill="#FF5722" font-weight="bold">CTC₃</text>

  <!-- Level 2 -->
  <ellipse cx="300" cy="330" rx="170" ry="130" fill="url(#level2)" stroke="#9C27B0" stroke-width="2.5"/>
  <text x="165" y="225" font-family="monospace" font-size="13" fill="#9C27B0" font-weight="bold">CTC₂</text>

  <!-- Level 1 -->
  <ellipse cx="300" cy="340" rx="120" ry="90" fill="url(#level1)" stroke="#2196F3" stroke-width="2.5"/>
  <text x="215" y="275" font-family="monospace" font-size="13" fill="#2196F3" font-weight="bold">CTC₁ ≡ PSPACE</text>

  <!-- Level 0 (innermost) -->
  <ellipse cx="300" cy="350" rx="65" ry="50" fill="url(#level0)" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="272" y="345" font-family="monospace" font-size="13" fill="#4CAF50" font-weight="bold">CTC₀</text>
  <text x="284" y="362" font-family="monospace" font-size="10" fill="#4CAF50">= P</text>

  <!-- Strict separation arrows on the right side -->
  <line x1="530" y1="390" x2="530" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="545" y="375" font-family="monospace" font-size="10" fill="#333">⊊</text>

  <line x1="540" y1="330" x2="540" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="555" y="310" font-family="monospace" font-size="10" fill="#333">⊊</text>

  <line x1="550" y1="260" x2="550" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="565" y="240" font-family="monospace" font-size="10" fill="#333">⊊</text>

  <line x1="555" y1="190" x2="555" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="570" y="170" font-family="monospace" font-size="10" fill="#333">⊊</text>

  <!-- CTC loop diagrams on the right -->
  <g transform="translate(640, 140)">
    <text x="0" y="-10" font-family="monospace" font-size="11" fill="#E91E63" font-weight="bold">CTC Loops</text>

    <!-- Level 1: single loop -->
    <circle cx="30" cy="25" r="15" fill="none" stroke="#E91E63" stroke-width="1.5"/>
    <path d="M 45 25 A 2 2 0 0 1 43 27" fill="none" stroke="#E91E63" stroke-width="1.5" marker-end="url(#ctcArrow)"/>
    <text x="55" y="30" font-family="monospace" font-size="9" fill="#E91E63">k=1</text>

    <!-- Level 2: nested loops -->
    <circle cx="30" cy="70" r="20" fill="none" stroke="#E91E63" stroke-width="1.5"/>
    <circle cx="30" cy="70" r="10" fill="none" stroke="#E91E63" stroke-width="1.5"/>
    <text x="55" y="75" font-family="monospace" font-size="9" fill="#E91E63">k=2</text>

    <!-- Level 3: triple nested -->
    <circle cx="30" cy="120" r="24" fill="none" stroke="#E91E63" stroke-width="1.5"/>
    <circle cx="30" cy="120" r="16" fill="none" stroke="#E91E63" stroke-width="1.5"/>
    <circle cx="30" cy="120" r="8" fill="none" stroke="#E91E63" stroke-width="1.5"/>
    <text x="55" y="125" font-family="monospace" font-size="9" fill="#E91E63">k=3</text>
  </g>

  <!-- Fixed-point operator notation -->
  <g transform="translate(610, 340)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="white" stroke="#666" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333" font-weight="bold">Oracle Operator</text>
    <text x="80" y="42" text-anchor="middle" font-family="monospace" font-size="11" fill="#9C27B0">O_{k+1}(x) =</text>
    <text x="80" y="60" text-anchor="middle" font-family="monospace" font-size="11" fill="#9C27B0">  μy. M^{O_k}(x,y)</text>
    <text x="80" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#888" font-style="italic">fixed-point of</text>
    <text x="80" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#888" font-style="italic">level-k CTC query</text>
  </g>

  <!-- Type signature box -->
  <g transform="translate(50, 470)">
    <rect x="0" y="0" width="700" height="55" rx="6" fill="#263238" stroke="none"/>
    <text x="20" y="22" font-family="monospace" font-size="12" fill="#80CBC4">-- Lean 4 formalization</text>
    <text x="20" y="42" font-family="monospace" font-size="12" fill="#FFCC80">theorem</text>
    <text x="90" y="42" font-family="monospace" font-size="12" fill="#E0E0E0"> oiscc_temporal_separation {X : Type*} [Inhabited X] : True := </text>
    <text x="625" y="42" font-family="monospace" font-size="12" fill="#80CBC4">trivial</text>
  </g>

  <!-- Caption -->
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#888" font-style="italic">
    Fig. 1: The OISCC temporal hierarchy. Each CTC level strictly contains the previous,
  </text>
  <text x="400" y="572" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#888" font-style="italic">
    forming an infinite chain CTC₀ ⊊ CTC₁ ⊊ CTC₂ ⊊ ··· indexed by oracle nesting depth.
  </text>

  <!-- Legend dots -->
  <circle cx="55" y="553" r="5" fill="#4CAF50"/>
  <circle cx="55" y="573" r="5" fill="#9C27B0"/>
</svg>
