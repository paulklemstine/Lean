<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gradient for hierarchy levels -->
    <linearGradient id="level0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="level1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="level2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#CE93D8;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="level3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF8A65;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="levelN" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#607D8B;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#90A4AE;stop-opacity:0.8"/>
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FAFAFA" rx="10"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#212121">
    OISCC Temporal Hierarchy
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#666">
    Oracle Levels ↔ Closed Timelike Curve Complexity Classes
  </text>

  <!-- ═══ LEFT SIDE: Nested Oracle Hierarchy ═══ -->
  <text x="200" y="85" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#333">
    Oracle Hierarchy (⊂-chain)
  </text>

  <!-- Level 0 (innermost) -->
  <rect x="145" y="380" width="110" height="40" rx="8" fill="url(#level0)" stroke="#388E3C" stroke-width="2"/>
  <text x="200" y="405" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">CTC(0)</text>

  <!-- Level 1 -->
  <rect x="115" y="310" width="170" height="40" rx="8" fill="url(#level1)" stroke="#1565C0" stroke-width="2"/>
  <text x="200" y="335" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">CTC(1)</text>

  <!-- Level 2 -->
  <rect x="85" y="240" width="230" height="40" rx="8" fill="url(#level2)" stroke="#7B1FA2" stroke-width="2"/>
  <text x="200" y="265" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">CTC(2)</text>

  <!-- Level 3 -->
  <rect x="55" y="170" width="290" height="40" rx="8" fill="url(#level3)" stroke="#D84315" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">CTC(3)</text>

  <!-- Level n (outermost) -->
  <rect x="25" y="100" width="350" height="40" rx="8" fill="url(#levelN)" stroke="#37474F" stroke-width="2"/>
  <text x="200" y="125" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">CTC(n) ⊇ ··· ⊇ CTC(0)</text>

  <!-- Containment arrows (left side) -->
  <line x1="200" y1="140" x2="200" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="210" x2="200" y2="238" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="280" x2="200" y2="308" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="350" x2="200" y2="378" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ⊊ labels -->
  <text x="215" y="158" font-family="monospace" font-size="11" fill="#555">⊊</text>
  <text x="215" y="228" font-family="monospace" font-size="11" fill="#555">⊊</text>
  <text x="215" y="298" font-family="monospace" font-size="11" fill="#555">⊊</text>
  <text x="215" y="368" font-family="monospace" font-size="11" fill="#555">⊊</text>

  <!-- ═══ RIGHT SIDE: Fixed-Point Structure ═══ -->
  <text x="590" y="85" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#333">
    Fixed-Point Nesting
  </text>

  <!-- Level 0: No loop -->
  <rect x="510" y="380" width="160" height="40" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="590" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#2E7D32">f(x) = x</text>
  <text x="590" y="415" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">no temporal loop</text>

  <!-- Level 1: One fixed point -->
  <rect x="510" y="310" width="160" height="40" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="590" y="330" text-anchor="middle" font-family="monospace" font-size="11" fill="#1565C0">Fix(f)</text>
  <text x="590" y="345" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">1 self-consistency</text>

  <!-- Level 2: Nested fixed point -->
  <rect x="510" y="240" width="160" height="40" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="590" y="260" text-anchor="middle" font-family="monospace" font-size="11" fill="#6A1B9A">Fix(Fix(f,·))</text>
  <text x="590" y="275" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">2 nested CTCs</text>

  <!-- Level 3: Triple nested -->
  <rect x="510" y="170" width="160" height="40" rx="8" fill="#FBE9E7" stroke="#FF5722" stroke-width="2"/>
  <text x="590" y="190" text-anchor="middle" font-family="monospace" font-size="11" fill="#BF360C">Fix³(f)</text>
  <text x="590" y="205" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">3 nested CTCs</text>

  <!-- Level n -->
  <rect x="510" y="100" width="160" height="40" rx="8" fill="#ECEFF1" stroke="#607D8B" stroke-width="2"/>
  <text x="590" y="120" text-anchor="middle" font-family="monospace" font-size="11" fill="#37474F">Fixⁿ(f)</text>
  <text x="590" y="135" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">n nested CTCs</text>

  <!-- Correspondence arrows (center) -->
  <line x1="375" y1="120" x2="508" y2="120" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <line x1="345" y1="190" x2="508" y2="190" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <line x1="315" y1="260" x2="508" y2="260" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <line x1="285" y1="330" x2="508" y2="330" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <line x1="255" y1="400" x2="508" y2="400" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>

  <!-- Correspondence label -->
  <text x="420" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1565C0" font-style="italic">
    bijection: oracle level ↔ fixed-point depth
  </text>

  <!-- ═══ BOTTOM: Key Properties ═══ -->
  <rect x="30" y="480" width="740" height="80" rx="8" fill="#FFF8E1" stroke="#FFA000" stroke-width="1.5"/>

  <text x="400" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#E65100">
    Key Properties of the Temporal Hierarchy
  </text>

  <text x="160" y="522" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">
    Well-founded (ℕ-indexed)
  </text>
  <text x="400" y="522" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">
    Strictly separated
  </text>
  <text x="640" y="522" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">
    Fixed points exist (Inhabited X)
  </text>

  <text x="160" y="545" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">
    No infinite descent
  </text>
  <text x="400" y="545" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">
    CTC(n) ⊊ CTC(n+1) ∀n
  </text>
  <text x="640" y="545" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">
    Knaster–Tarski guarantee
  </text>

  <!-- Caption -->
  <text x="400" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999" font-style="italic">
    Fig. 1: The OISCC temporal hierarchy. Left: nested complexity classes. Right: corresponding fixed-point depths.
  </text>
</svg>
