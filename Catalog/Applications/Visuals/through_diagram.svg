<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1e293b">
    Noncommutative Embedded Obstruction Algorithm
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Universal Property via Yoneda Embedding
  </text>

  <!-- ═══ LEFT: Entropy Algebra E(X) ═══ -->
  <rect x="40" y="80" width="200" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#2563eb">E(X)</text>
  <text x="140" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">Entropy Algebra</text>

  <!-- Operations -->
  <text x="60" y="155" font-family="monospace" font-size="12" fill="#1e40af">⊕ : commutative</text>
  <text x="60" y="175" font-family="monospace" font-size="12" fill="#1e40af">⊗ : noncommutative</text>

  <!-- Obstruction indicator -->
  <rect x="60" y="195" width="160" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="215" text-anchor="middle" font-family="monospace" font-size="11" fill="#dc2626">Obs = f⊗g − g⊗f</text>
  <text x="140" y="233" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc2626">∈ H²(Trop(X), E)</text>

  <!-- ═══ CENTER: Tropical Site Trop(X) ═══ -->
  <rect x="300" y="80" width="200" height="180" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="105" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">Trop(X)</text>
  <text x="400" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">Tropical Site</text>

  <!-- Tropical lattice points -->
  <circle cx="340" cy="170" r="6" fill="#22c55e" opacity="0.7"/>
  <circle cx="370" cy="150" r="6" fill="#22c55e" opacity="0.7"/>
  <circle cx="400" cy="190" r="6" fill="#22c55e" opacity="0.7"/>
  <circle cx="430" cy="160" r="6" fill="#22c55e" opacity="0.7"/>
  <circle cx="460" cy="180" r="6" fill="#22c55e" opacity="0.7"/>
  <!-- Piecewise-linear connections -->
  <line x1="340" y1="170" x2="370" y2="150" stroke="#16a34a" stroke-width="1" opacity="0.5"/>
  <line x1="370" y1="150" x2="430" y2="160" stroke="#16a34a" stroke-width="1" opacity="0.5"/>
  <line x1="430" y1="160" x2="460" y2="180" stroke="#16a34a" stroke-width="1" opacity="0.5"/>
  <line x1="340" y1="170" x2="400" y2="190" stroke="#16a34a" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="190" x2="460" y2="180" stroke="#16a34a" stroke-width="1" opacity="0.5"/>

  <text x="400" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#15803d">max-plus semiring</text>
  <text x="400" y="248" text-anchor="middle" font-family="monospace" font-size="10" fill="#15803d">(ℝ∪{−∞}, max, +)</text>

  <!-- ═══ RIGHT: Sheaf Category Sh(Trop(X)) ═══ -->
  <rect x="560" y="80" width="200" height="180" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="105" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#9333ea">Sh(Trop(X))</text>
  <text x="660" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#475569">Sheaf Category</text>

  <!-- Sheaf diagram -->
  <ellipse cx="630" cy="175" rx="30" ry="20" fill="none" stroke="#9333ea" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="690" cy="175" rx="30" ry="20" fill="none" stroke="#9333ea" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="660" cy="210" rx="30" ry="20" fill="none" stroke="#9333ea" stroke-width="1.5" opacity="0.6"/>
  <text x="660" y="248" text-anchor="middle" font-family="monospace" font-size="10" fill="#7e22ce">cohomology target</text>

  <!-- ═══ ARROWS ═══ -->

  <!-- E(X) → Trop(X): tropicalization -->
  <line x1="245" y1="155" x2="295" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="270" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333" font-style="italic">trop</text>

  <!-- Trop(X) → Sh(Trop(X)): Yoneda -->
  <line x1="505" y1="155" x2="555" y2="155" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="530" y="143" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#9333ea">Y</text>
  <text x="530" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#7e22ce">Yoneda</text>

  <!-- ═══ BOTTOM: Universal Property Diagram ═══ -->
  <rect x="120" y="310" width="560" height="220" rx="12" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e293b">Universal Property (Base Case)</text>

  <!-- The commutative diagram -->
  <!-- Node: X (Inhabited) -->
  <rect x="170" y="370" width="120" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="390" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#2563eb">X</text>
  <text x="230" y="407" text-anchor="middle" font-family="monospace" font-size="9" fill="#3b82f6">[Inhabited X]</text>

  <!-- Node: E₀(X) = 0 -->
  <rect x="510" y="370" width="120" height="45" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="390" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#16a34a">E₀(X) = 0</text>
  <text x="570" y="407" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">trivial algebra</text>

  <!-- Node: True -->
  <rect x="340" y="460" width="120" height="45" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="485" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#d97706">True</text>

  <!-- Arrow: X → E₀ -->
  <line x1="293" y1="392" x2="505" y2="392" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="383" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#475569">trivial entropy</text>

  <!-- Arrow: X → True -->
  <line x1="250" y1="418" x2="355" y2="458" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)" stroke-dasharray="5,3"/>
  <text x="280" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#2563eb">∃ x₀</text>

  <!-- Arrow: E₀ → True -->
  <line x1="550" y1="418" x2="445" y2="458" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-dasharray="5,3"/>
  <text x="520" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#16a34a">Obs = 0</text>

  <!-- QED symbol -->
  <rect x="610" y="480" width="20" height="20" fill="#1e293b"/>
  <text x="650" y="496" font-family="Georgia, serif" font-size="12" fill="#1e293b" font-style="italic">Q.E.D.</text>

  <!-- Caption -->
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    Figure 1: The noncommutative obstruction vanishes for the trivial entropy algebra on any inhabited type,
  </text>
  <text x="400" y="587" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#64748b">
    yielding the base case of the universal property via the Yoneda embedding.
  </text>
</svg>
