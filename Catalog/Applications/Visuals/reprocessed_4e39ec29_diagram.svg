<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="tropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="infoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f9a8d4;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="10"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1e293b">Tropical Entropy Bound</text>
  <text x="450" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#64748b">Max-Plus Matrix Rank → Kolmogorov Complexity Lower Bound</text>
  
  <!-- ============================================ -->
  <!-- LEFT: Tropical Geometry Domain -->
  <!-- ============================================ -->
  <rect x="30" y="85" width="260" height="200" rx="12" fill="url(#tropGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e">Tropical Geometry</text>
  
  <!-- Tropical semiring -->
  <text x="50" y="140" font-family="monospace" font-size="13" fill="#78350f">Semiring (ℝ∪{−∞}, ⊕, ⊙)</text>
  <text x="50" y="162" font-family="monospace" font-size="12" fill="#92400e">  a ⊕ b = max(a, b)</text>
  <text x="50" y="180" font-family="monospace" font-size="12" fill="#92400e">  a ⊙ b = a + b</text>
  
  <!-- Matrix -->
  <text x="60" y="210" font-family="Arial, sans-serif" font-size="13" fill="#78350f">Matrix M ∈ (ℝ∪{−∞})^{m×n}</text>
  <rect x="70" y="220" width="80" height="50" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="82" y="240" font-family="monospace" font-size="11" fill="#713f12">3  7  2</text>
  <text x="82" y="255" font-family="monospace" font-size="11" fill="#713f12">5  1  4</text>
  <text x="165" y="250" font-family="Arial, sans-serif" font-size="12" fill="#92400e">trop_rank = k</text>
  
  <!-- ============================================ -->
  <!-- RIGHT: Information Theory Domain -->
  <!-- ============================================ -->
  <rect x="610" y="85" width="260" height="200" rx="12" fill="url(#infoGrad)" stroke="#2563eb" stroke-width="2"/>
  <text x="740" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">Information Theory</text>
  
  <text x="630" y="140" font-family="monospace" font-size="13" fill="#1e3a8a">Kolmogorov Complexity</text>
  <text x="630" y="162" font-family="monospace" font-size="12" fill="#1e40af">  K(x) = min |p|</text>
  <text x="630" y="180" font-family="monospace" font-size="12" fill="#1e40af">  s.t. U(p) = x</text>
  
  <text x="630" y="210" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">Compression Limit:</text>
  <text x="630" y="235" font-family="monospace" font-size="14" fill="#1e40af" font-weight="bold">K(L) ≥ log₂(rank)</text>
  <text x="630" y="258" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">No program shorter than</text>
  <text x="630" y="273" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">this bound can encode L</text>
  
  <!-- ============================================ -->
  <!-- CENTER: The Bridge (Key Inequality) -->
  <!-- ============================================ -->
  <rect x="320" y="100" width="260" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">Core Inequality</text>
  
  <!-- The key chain of inequalities -->
  <text x="450" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="#4c1d95">trop_rank(M)</text>
  <text x="450" y="180" text-anchor="middle" font-family="monospace" font-size="16" fill="#7c3aed" font-weight="bold">≤</text>
  <text x="450" y="205" text-anchor="middle" font-family="monospace" font-size="13" fill="#4c1d95">maxplus_rank(M)</text>
  <text x="450" y="230" text-anchor="middle" font-family="monospace" font-size="16" fill="#7c3aed" font-weight="bold">⇒</text>
  <text x="450" y="258" text-anchor="middle" font-family="monospace" font-size="13" fill="#4c1d95" font-weight="bold">K(L) ≥ log₂(trop_rank)</text>

  <!-- Arrows connecting domains -->
  <line x1="290" y1="185" x2="318" y2="185" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="185" x2="608" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  
  <!-- ============================================ -->
  <!-- BOTTOM: Factorization Diagram -->
  <!-- ============================================ -->
  <rect x="30" y="320" width="840" height="230" rx="12" fill="url(#compGrad)" stroke="#ec4899" stroke-width="2"/>
  <text x="450" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#9d174d">Tropical Factorization & Compression</text>
  
  <!-- M matrix -->
  <rect x="60" y="370" width="90" height="70" rx="6" fill="white" stroke="#be185d" stroke-width="2"/>
  <text x="105" y="395" text-anchor="middle" font-family="monospace" font-size="14" fill="#9d174d" font-weight="bold">M</text>
  <text x="105" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#be185d">m × n</text>
  <text x="105" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9d174d">data matrix</text>
  
  <!-- = sign -->
  <text x="175" y="410" text-anchor="middle" font-family="monospace" font-size="24" fill="#9d174d" font-weight="bold">=</text>
  
  <!-- A matrix -->
  <rect x="200" y="370" width="70" height="70" rx="6" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="235" y="395" text-anchor="middle" font-family="monospace" font-size="14" fill="#065f46" font-weight="bold">A</text>
  <text x="235" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#059669">m × k</text>
  
  <!-- ⊙ sign -->
  <text x="290" y="410" text-anchor="middle" font-family="monospace" font-size="20" fill="#9d174d" font-weight="bold">⊙</text>
  
  <!-- B matrix -->
  <rect x="310" y="370" width="70" height="70" rx="6" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="345" y="395" text-anchor="middle" font-family="monospace" font-size="14" fill="#065f46" font-weight="bold">B</text>
  <text x="345" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#059669">k × n</text>
  
  <!-- Arrow to rank -->
  <line x1="395" y1="405" x2="440" y2="405" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Rank box -->
  <rect x="445" y="375" width="130" height="55" rx="8" fill="#7c3aed" stroke="none"/>
  <text x="510" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="bold">trop_rank = k</text>
  <text x="510" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e9d5ff">minimal such k</text>
  
  <!-- Arrow to bound -->
  <line x1="580" y1="405" x2="620" y2="405" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Compression bound -->
  <rect x="625" y="370" width="220" height="65" rx="8" fill="#dc2626" stroke="none"/>
  <text x="735" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="bold">Compression Limit</text>
  <text x="735" y="418" text-anchor="middle" font-family="monospace" font-size="14" fill="#fecaca" font-weight="bold">K(L) ≥ log₂(k)</text>
  
  <!-- Examples at bottom -->
  <text x="105" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9d174d" font-weight="bold">Examples:</text>
  
  <!-- Low rank example -->
  <rect x="50" y="485" width="160" height="45" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="130" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#065f46" font-weight="bold">Rank 1: M[i,j] = aᵢ + bⱼ</text>
  <text x="130" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#059669">Highly compressible ✓</text>
  
  <!-- Medium rank example -->
  <rect x="230" y="485" width="180" height="45" rx="6" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e" font-weight="bold">Rank k: structured data</text>
  <text x="320" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b45309">Partially compressible ~</text>
  
  <!-- Full rank example -->
  <rect x="430" y="485" width="180" height="45" rx="6" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <text x="520" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991b1b" font-weight="bold">Rank n: random data</text>
  <text x="520" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">Incompressible ✗</text>
  
  <!-- Lean 4 verification badge -->
  <rect x="680" y="485" width="170" height="45" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
  <text x="765" y="505" text-anchor="middle" font-family="monospace" font-size="11" fill="#a5b4fc">✓ Verified in Lean 4</text>
  <text x="765" y="522" text-anchor="middle" font-family="monospace" font-size="10" fill="#7c3aed">tropical_kolmogorov_bound</text>
  
  <!-- Caption -->
  <text x="450" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#475569" font-style="italic">
    Figure: The tropical entropy bound connects max-plus matrix factorization to compression limits.
  </text>
  <text x="450" y="605" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Tropical rank of a data matrix M lower-bounds the Kolmogorov complexity of the encoded language.
  </text>
</svg>
