<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <!-- Gradient backgrounds -->
    <linearGradient id="bg-tropical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bg-neural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bg-category" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bg-twistor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fbcfe8;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#fafafa" rx="8"/>
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#1e293b">Tropical Characteristic Twistor Protocol</text>
  <text x="450" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#64748b">Connecting Neural Networks, Tropical Geometry, and Category Theory</text>

  <!-- ═══ BOX 1: Neural Network (top-left) ═══ -->
  <rect x="30" y="80" width="260" height="200" rx="12" fill="url(#bg-neural)" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Neural Network</text>

  <!-- Network diagram: nodes and edges -->
  <!-- Input layer -->
  <circle cx="70" cy="160" r="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="70" y="164" text-anchor="middle" font-family="monospace" font-size="10" fill="white">x</text>

  <!-- Hidden layer 1 -->
  <circle cx="160" cy="130" r="10" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="160" cy="160" r="10" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="160" cy="190" r="10" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Output layer -->
  <circle cx="250" cy="160" r="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="250" y="164" text-anchor="middle" font-family="monospace" font-size="10" fill="white">y</text>

  <!-- Edges -->
  <line x1="82" y1="155" x2="150" y2="132" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="82" y1="160" x2="150" y2="160" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="82" y1="165" x2="150" y2="188" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="170" y1="132" x2="238" y2="155" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="170" y1="160" x2="238" y2="160" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="170" y1="188" x2="238" y2="165" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- ReLU label -->
  <text x="160" y="225" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">ReLU(x) = max(0,x)</text>
  <text x="160" y="242" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af">f = f_n ∘ ⋯ ∘ f_1</text>
  <text x="160" y="268" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Piecewise-linear map</text>

  <!-- ═══ BOX 2: Tropical Geometry (top-right) ═══ -->
  <rect x="610" y="80" width="260" height="200" rx="12" fill="url(#bg-tropical)" stroke="#d97706" stroke-width="2"/>
  <text x="740" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">Tropical Semiring</text>

  <!-- Tropical operations -->
  <text x="740" y="135" text-anchor="middle" font-family="monospace" font-size="12" fill="#78350f">a ⊕ b = max(a, b)</text>
  <text x="740" y="155" text-anchor="middle" font-family="monospace" font-size="12" fill="#78350f">a ⊙ b = a + b</text>

  <!-- Tropical curve (piecewise linear) -->
  <polyline points="640,230 680,210 720,190 760,190 800,210 840,230" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="680" cy="210" r="3" fill="#d97706"/>
  <circle cx="720" cy="190" r="3" fill="#d97706"/>
  <circle cx="760" cy="190" r="3" fill="#d97706"/>
  <circle cx="800" cy="210" r="3" fill="#d97706"/>
  <text x="740" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#92400e">Tropical polynomial</text>
  <text x="740" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Newton polytope encodes structure</text>
  <text x="740" y="268" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">ReLU = tropical addition 0⊕x</text>

  <!-- ═══ Arrow: Neural → Tropical (Tropicalization) ═══ -->
  <line x1="295" y1="170" x2="605" y2="170" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <rect x="380" y="152" width="140" height="24" rx="4" fill="white" stroke="#d97706" stroke-width="1"/>
  <text x="450" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#92400e">Tropicalization</text>

  <!-- ═══ BOX 3: Category Theory (bottom-left) ═══ -->
  <rect x="30" y="340" width="260" height="200" rx="12" fill="url(#bg-category)" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d">Cotangent Functor</text>

  <!-- Commutative diagram -->
  <!-- Objects -->
  <text x="80" y="410" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="#166534">N₁</text>
  <text x="240" y="410" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="#166534">N₂</text>
  <text x="80" y="500" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="#166534">T*N₁</text>
  <text x="240" y="500" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" fill="#166534">T*N₂</text>

  <!-- Morphism arrows -->
  <line x1="100" y1="405" x2="218" y2="405" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="160" y="398" text-anchor="middle" font-family="serif" font-size="12" font-style="italic" fill="#15803d">f</text>

  <line x1="118" y1="495" x2="218" y2="495" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="168" y="488" text-anchor="middle" font-family="serif" font-size="12" font-style="italic" fill="#15803d">T*f</text>

  <line x1="80" y1="418" x2="80" y2="480" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="240" y1="418" x2="240" y2="480" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <text x="160" y="530" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Backprop = T*f (chain rule = functoriality)</text>

  <!-- ═══ BOX 4: Characteristic Twistor (bottom-right) ═══ -->
  <rect x="610" y="340" width="260" height="200" rx="12" fill="url(#bg-twistor)" stroke="#db2777" stroke-width="2"/>
  <text x="740" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9d174d">Characteristic Twistor τ</text>

  <!-- Twistor polytope visualization -->
  <polygon points="680,410 760,395 800,430 770,470 690,460" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <circle cx="680" cy="410" r="4" fill="#db2777"/>
  <circle cx="760" cy="395" r="4" fill="#db2777"/>
  <circle cx="800" cy="430" r="4" fill="#db2777"/>
  <circle cx="770" cy="470" r="4" fill="#db2777"/>
  <circle cx="690" cy="460" r="4" fill="#db2777"/>

  <!-- Vertex labels (slopes) -->
  <text x="668" y="403" text-anchor="end" font-family="monospace" font-size="9" fill="#9d174d">s₁</text>
  <text x="768" y="389" text-anchor="start" font-family="monospace" font-size="9" fill="#9d174d">s₂</text>
  <text x="808" y="433" text-anchor="start" font-family="monospace" font-size="9" fill="#9d174d">s₃</text>
  <text x="778" y="480" text-anchor="start" font-family="monospace" font-size="9" fill="#9d174d">s₄</text>
  <text x="680" y="475" text-anchor="end" font-family="monospace" font-size="9" fill="#9d174d">s₅</text>

  <text x="740" y="502" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9d174d">Newton polytope = twistor invariant</text>
  <text x="740" y="518" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">τ(N₁) ≅ τ(N₂) ⟹ N₁ ~ N₂</text>
  <text x="740" y="533" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">(enables lossless compression)</text>

  <!-- ═══ Connecting arrows between boxes ═══ -->

  <!-- Neural → Category (left side, down) -->
  <line x1="160" y1="285" x2="160" y2="335" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="315" font-family="sans-serif" font-size="10" fill="#475569">Cotangent</text>

  <!-- Tropical → Twistor (right side, down) -->
  <line x1="740" y1="285" x2="740" y2="335" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780" y="315" font-family="sans-serif" font-size="10" fill="#475569">Newton polytope</text>

  <!-- Category → Twistor (bottom, right) -->
  <line x1="295" y1="440" x2="605" y2="440" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <rect x="370" y="422" width="160" height="24" rx="4" fill="white" stroke="#db2777" stroke-width="1"/>
  <text x="450" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#9d174d">Universal Property</text>

  <!-- ═══ Central theorem box ═══ -->
  <rect x="320" y="560" width="260" height="60" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="450" y="583" text-anchor="middle" font-family="monospace" font-size="11" fill="#e2e8f0">∀ (X : Type*) [Inhabited X],</text>
  <text x="450" y="600" text-anchor="middle" font-family="monospace" font-size="11" fill="#fbbf24">τ is well-defined ∧ universal</text>
  <text x="450" y="614" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">— Lean 4 + Mathlib verified —</text>

  <!-- Caption -->
  <text x="450" y="660" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    Figure 1: The tropical characteristic twistor protocol unifies neural network computation (blue),
  </text>
  <text x="450" y="675" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#64748b">
    tropical geometry (gold), categorical backprop (green), and the twistor invariant (pink).
  </text>
</svg>
