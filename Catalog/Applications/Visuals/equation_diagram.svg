<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow-fwd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrow-back" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#DC2626"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="url(#bg)" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">
    Backpropagation as Cotangent Lift
  </text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#64748B">
    Forward map (tangent) vs. Backward pass (cotangent) in smooth manifolds
  </text>

  <!-- ═══ TOP ROW: Base manifolds (forward pass) ═══ -->
  <text x="60" y="100" font-size="12" font-weight="bold" fill="#2563EB">FORWARD PASS  (tangent direction)</text>

  <!-- Manifold M₀ -->
  <ellipse cx="130" cy="160" rx="55" ry="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="130" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E40AF">M₀</text>
  <text x="130" y="172" text-anchor="middle" font-size="10" fill="#3B82F6">Input ℝⁿ⁰</text>

  <!-- Arrow f₁ -->
  <line x1="188" y1="160" x2="262" y2="160" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="225" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">f₁</text>

  <!-- Manifold M₁ -->
  <ellipse cx="320" cy="160" rx="55" ry="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E40AF">M₁</text>
  <text x="320" y="172" text-anchor="middle" font-size="10" fill="#3B82F6">Hidden ℝⁿ¹</text>

  <!-- Arrow f₂ -->
  <line x1="378" y1="160" x2="452" y2="160" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="415" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">f₂</text>

  <!-- Manifold M₂ -->
  <ellipse cx="510" cy="160" rx="55" ry="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="510" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E40AF">M₂</text>
  <text x="510" y="172" text-anchor="middle" font-size="10" fill="#3B82F6">Hidden ℝⁿ²</text>

  <!-- Arrow f₃ -->
  <line x1="568" y1="160" x2="642" y2="160" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="605" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563EB">f₃</text>

  <!-- Manifold M₃ -->
  <ellipse cx="700" cy="160" rx="55" ry="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="700" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E40AF">M₃</text>
  <text x="700" y="172" text-anchor="middle" font-size="10" fill="#3B82F6">Output ℝⁿ³</text>

  <!-- Composite arrow -->
  <path d="M 130 195 Q 415 240 700 195" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-fwd)"/>
  <text x="415" y="235" text-anchor="middle" font-size="13" font-style="italic" fill="#2563EB">F = f₃ ∘ f₂ ∘ f₁</text>

  <!-- ═══ Vertical arrows: cotangent bundle projection π ═══ -->
  <text x="450" y="280" text-anchor="middle" font-size="13" fill="#7C3AED" font-style="italic">
    π : T*M → M  (cotangent bundle projection)
  </text>

  <!-- Vertical dashed lines -->
  <line x1="130" y1="195" x2="130" y2="330" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="320" y1="195" x2="320" y2="330" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="510" y1="195" x2="510" y2="330" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="195" x2="700" y2="330" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- π labels -->
  <text x="115" y="270" font-size="11" fill="#7C3AED">π₀</text>
  <text x="305" y="270" font-size="11" fill="#7C3AED">π₁</text>
  <text x="495" y="270" font-size="11" fill="#7C3AED">π₂</text>
  <text x="685" y="270" font-size="11" fill="#7C3AED">π₃</text>

  <!-- ═══ BOTTOM ROW: Cotangent bundles (backward pass) ═══ -->
  <text x="60" y="320" font-size="12" font-weight="bold" fill="#DC2626">BACKWARD PASS  (cotangent direction)</text>

  <!-- T*M₀ -->
  <rect x="75" y="340" width="110" height="50" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="130" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#991B1B">T*M₀</text>
  <text x="130" y="380" text-anchor="middle" font-size="9" fill="#DC2626">∇ₓ Loss</text>

  <!-- T*M₁ -->
  <rect x="265" y="340" width="110" height="50" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="320" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#991B1B">T*M₁</text>
  <text x="320" y="380" text-anchor="middle" font-size="9" fill="#DC2626">δ₁ = (Df₂)ᵀδ₂</text>

  <!-- T*M₂ -->
  <rect x="455" y="340" width="110" height="50" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="510" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#991B1B">T*M₂</text>
  <text x="510" y="380" text-anchor="middle" font-size="9" fill="#DC2626">δ₂ = (Df₃)ᵀδ₃</text>

  <!-- T*M₃ -->
  <rect x="645" y="340" width="110" height="50" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="700" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#991B1B">T*M₃</text>
  <text x="700" y="380" text-anchor="middle" font-size="9" fill="#DC2626">δ₃ = ∇ Loss</text>

  <!-- Backward arrows (cotangent lifts) — reversed direction! -->
  <line x1="262" y1="365" x2="188" y2="365" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-back)"/>
  <text x="225" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">f₁*</text>

  <line x1="452" y1="365" x2="378" y2="365" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-back)"/>
  <text x="415" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">f₂*</text>

  <line x1="642" y1="365" x2="568" y2="365" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-back)"/>
  <text x="605" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">f₃*</text>

  <!-- Composite cotangent arrow -->
  <path d="M 700 395 Q 415 440 130 395" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-back)"/>
  <text x="415" y="440" text-anchor="middle" font-size="13" font-style="italic" fill="#DC2626">F* = f₁* ∘ f₂* ∘ f₃*  (backpropagation)</text>

  <!-- ═══ Key equation box ═══ -->
  <rect x="200" y="460" width="500" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="450" y="485" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">
    Theorem:  (g ∘ f)* = f* ∘ g*    ⟹    Backprop = Cotangent Lift
  </text>

  <!-- Caption -->
  <text x="450" y="510" text-anchor="middle" font-size="11" fill="#64748B">
    Blue (top): forward evaluation through layer maps  ·  Red (bottom): gradient flow via cotangent lifts
  </text>
</svg>
