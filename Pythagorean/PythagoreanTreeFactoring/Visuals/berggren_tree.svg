<text x="450" y="505" font-size="14" fill="black" text-anchor="middle" font-weight="normal" font-family="serif">KEY PROPERTY: Each Berggren matrix Bᵢ ∈ O(2,1;ℤ) preserves a² + b² = c²</text>
<text x="450" y="530" font-size="13" fill="#666" text-anchor="middle" font-weight="normal" font-family="serif">The tree structure exists because O(2,1;ℤ) is virtually free</text>
<text x="450" y="555" font-size="13" fill="#C62828" text-anchor="middle" font-weight="normal" font-family="serif">Inverse descent through this tree = Gauss's 2D lattice reduction = Θ(√N) for factoring</text>
