<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500"
     viewBox="0 0 900 500">
  <defs>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  <text x="450" y="35" font-size="20" fill="black" text-anchor="middle" font-weight="bold" font-family="serif">The Lattice-Tree Correspondence Theorem</text>
<rect x="30" y="70" width="380" height="180" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" rx="10" opacity="1"/>
<text x="220" y="100" font-size="16" fill="#1565C0" text-anchor="middle" font-weight="bold" font-family="serif">Berggren Tree Descent</text>
<text x="220" y="130" font-size="14" fill="black" text-anchor="middle" font-weight="normal" font-family="monospace">M₃⁻¹: (m,n) ↦ (m-2n, n)</text>
<text x="220" y="155" font-size="14" fill="black" text-anchor="middle" font-weight="normal" font-family="monospace">M₁⁻¹: (m,n) ↦ (n, 2n-m)</text>
<text x="220" y="185" font-size="13" fill="#666" text-anchor="middle" font-weight="normal" font-family="serif">Subtraction + Swap</text>
<text x="220" y="210" font-size="13" fill="#666" text-anchor="middle" font-weight="normal" font-family="serif">O(log(m/n)) steps</text>
<rect x="490" y="70" width="380" height="180" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" rx="10" opacity="1"/>
<text x="680" y="100" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="bold" font-family="serif">Gauss Lattice Reduction</text>
<text x="680" y="130" font-size="14" fill="black" text-anchor="middle" font-weight="normal" font-family="monospace">v₂ ← v₂ - ⌊μ⌋·v₁</text>
<text x="680" y="155" font-size="14" fill="black" text-anchor="middle" font-weight="normal" font-family="monospace">swap if |v₂| < |v₁|</text>
<text x="680" y="185" font-size="13" fill="#666" text-anchor="middle" font-weight="normal" font-family="serif">Size-reduce + Swap</text>
<text x="680" y="210" font-size="13" fill="#666" text-anchor="middle" font-weight="normal" font-family="serif">O(log(max/min)) steps</text>
<text x="450" y="150" font-size="36" fill="#D32F2F" text-anchor="middle" font-weight="bold" font-family="serif">≡</text>
<line x1="410" y1="140" x2="490" y2="140" stroke="#D32F2F" stroke-width="2"/>
<path d="M490,140 L480.4466351087439,142.9552020666134 L480.4466351087439,137.0447979333866 Z" fill="#D32F2F" stroke="black" stroke-width="1"/>
<line x1="490" y1="170" x2="410" y2="170" stroke="#D32F2F" stroke-width="2"/>
<path d="M410,170 L419.5533648912561,167.0447979333866 L419.5533648912561,172.9552020666134 Z" fill="#D32F2F" stroke="black" stroke-width="1"/>
<rect x="200" y="290" width="500" height="80" fill="#FFF8E1" stroke="#F57F17" stroke-width="2" rx="10" opacity="1"/>
<text x="450" y="320" font-size="16" fill="#F57F17" text-anchor="middle" font-weight="bold" font-family="serif">Euclidean Algorithm / Continued Fractions</text>
<text x="450" y="345" font-size="14" fill="black" text-anchor="middle" font-weight="normal" font-family="monospace">a = q·b + r,  repeat with (b, r)</text>
<line x1="220" y1="250" x2="350" y2="290" stroke="#F57F17" stroke-width="2"/>
<path d="M350,290 L340.0000112660298,290.0150106785012 L341.7381774825226,284.36597047489954 Z" fill="#F57F17" stroke="black" stroke-width="1"/>
<line x1="680" y1="250" x2="550" y2="290" stroke="#F57F17" stroke-width="2"/>
<path d="M550,290 L558.2618225174774,284.36597047489954 L559.9999887339702,290.0150106785012 Z" fill="#F57F17" stroke="black" stroke-width="1"/>
<text x="260" y="275" font-size="24" fill="#F57F17" text-anchor="middle" font-weight="normal" font-family="serif">≡</text>
<text x="640" y="275" font-size="24" fill="#F57F17" text-anchor="middle" font-weight="normal" font-family="serif">≡</text>
<rect x="100" y="400" width="700" height="80" fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="10" opacity="1"/>
<text x="450" y="425" font-size="16" fill="#C62828" text-anchor="middle" font-weight="bold" font-family="serif">CONSEQUENCE: Pythagorean tree factoring is Θ(√N)</text>
<text x="450" y="450" font-size="14" fill="#C62828" text-anchor="middle" font-weight="normal" font-family="serif">for balanced semiprimes N = p·q with p ≈ q ≈ √N</text>
<text x="450" y="470" font-size="12" fill="#666" text-anchor="middle" font-weight="normal" font-family="serif">No 2D method can beat this — Gauss's algorithm is optimal in dimension 2</text>
</svg>