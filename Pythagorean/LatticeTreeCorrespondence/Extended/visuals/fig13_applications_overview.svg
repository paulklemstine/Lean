<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e" />
      <stop offset="100%" style="stop-color:#2a1a4e" />
    </linearGradient>
    <filter id="glow13">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="600" fill="url(#bg13)" rx="12"/>
  
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">Applications of the Dimensional Escape Framework</text>
  
  <!-- Central node -->
  <circle cx="450" cy="280" r="80" fill="#1a1a4e" stroke="#4ecdc4" stroke-width="3" filter="url(#glow13)"/>
  <text x="450" y="270" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="bold">Quadruple</text>
  <text x="450" y="290" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="bold">Lattice L₄(N)</text>
  <text x="450" y="310" text-anchor="middle" fill="#7ee8e0" font-size="10">a²+b²+c² ≡ 0 mod N</text>
  
  <!-- App 1: Cryptanalysis -->
  <line x1="380" y1="220" x2="180" y2="130" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
  <circle cx="140" cy="110" r="55" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="bold">🔐 Crypto</text>
  <text x="140" y="112" text-anchor="middle" fill="#ff8e8e" font-size="10">Key Strength</text>
  <text x="140" y="127" text-anchor="middle" fill="#ff8e8e" font-size="10">Analysis</text>
  
  <!-- App 2: Number Theory -->
  <line x1="520" y1="220" x2="720" y2="130" stroke="#ffaa44" stroke-width="2" opacity="0.6"/>
  <circle cx="760" cy="110" r="55" fill="#2a2a1a" stroke="#ffaa44" stroke-width="2"/>
  <text x="760" y="95" text-anchor="middle" fill="#ffaa44" font-size="12" font-weight="bold">📐 Number</text>
  <text x="760" y="112" text-anchor="middle" fill="#ffcc66" font-size="10">Three-Square</text>
  <text x="760" y="127" text-anchor="middle" fill="#ffcc66" font-size="10">Decomposition</text>
  
  <!-- App 3: Quaternions -->
  <line x1="370" y1="300" x2="120" y2="340" stroke="#9b59b6" stroke-width="2" opacity="0.6"/>
  <circle cx="80" cy="360" r="55" fill="#1a1a2a" stroke="#9b59b6" stroke-width="2"/>
  <text x="80" y="345" text-anchor="middle" fill="#9b59b6" font-size="12" font-weight="bold">🔄 Quaternion</text>
  <text x="80" y="362" text-anchor="middle" fill="#bb79d6" font-size="10">Factorization</text>
  <text x="80" y="377" text-anchor="middle" fill="#bb79d6" font-size="10">&amp; Rotations</text>
  
  <!-- App 4: Coding Theory -->
  <line x1="530" y1="300" x2="780" y2="340" stroke="#3498db" stroke-width="2" opacity="0.6"/>
  <circle cx="820" cy="360" r="55" fill="#1a1a2a" stroke="#3498db" stroke-width="2"/>
  <text x="820" y="345" text-anchor="middle" fill="#3498db" font-size="12" font-weight="bold">📡 Lattice</text>
  <text x="820" y="362" text-anchor="middle" fill="#5dade2" font-size="10">Codes for</text>
  <text x="820" y="377" text-anchor="middle" fill="#5dade2" font-size="10">AWGN Channels</text>
  
  <!-- App 5: Signal Processing -->
  <line x1="400" y1="350" x2="270" y2="490" stroke="#2ecc71" stroke-width="2" opacity="0.6"/>
  <circle cx="240" cy="510" r="55" fill="#1a2a1a" stroke="#2ecc71" stroke-width="2"/>
  <text x="240" y="495" text-anchor="middle" fill="#2ecc71" font-size="12" font-weight="bold">📊 Signal</text>
  <text x="240" y="512" text-anchor="middle" fill="#5dff8e" font-size="10">Integer</text>
  <text x="240" y="527" text-anchor="middle" fill="#5dff8e" font-size="10">Decomposition</text>
  
  <!-- App 6: Zero-Knowledge -->
  <line x1="500" y1="350" x2="630" y2="490" stroke="#e74c3c" stroke-width="2" opacity="0.6"/>
  <circle cx="660" cy="510" r="55" fill="#2a1a1a" stroke="#e74c3c" stroke-width="2"/>
  <text x="660" y="495" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="bold">🔒 Zero</text>
  <text x="660" y="512" text-anchor="middle" fill="#ff6b6b" font-size="10">Knowledge</text>
  <text x="660" y="527" text-anchor="middle" fill="#ff6b6b" font-size="10">Proofs</text>
  
  <!-- Bottom text -->
  <text x="450" y="585" text-anchor="middle" fill="#777799" font-size="11">The sum-of-squares lattice structure unifies cryptanalysis, algebra, coding, and signal processing</text>
</svg>
