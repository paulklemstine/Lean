<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8ecf8"/>
    </linearGradient>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3366cc"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="400" fill="url(#bg4)"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#333333" font-family="Georgia, serif" font-size="20" font-weight="bold">The Quadruple Lattice Factoring Pipeline</text>
  
  <!-- Step 1 -->
  <rect x="30" y="60" width="150" height="90" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="105" y="85" text-anchor="middle" fill="#e65100" font-family="Georgia, serif" font-size="13" font-weight="bold">Step 1</text>
  <text x="105" y="105" text-anchor="middle" fill="#333333" font-size="11">Build L₄(N)</text>
  <text x="105" y="120" text-anchor="middle" fill="#666666" font-size="9">x²+y²+z² ≡ 0</text>
  <text x="105" y="133" text-anchor="middle" fill="#666666" font-size="9">(mod N)</text>
  
  <line x1="180" y1="105" x2="210" y2="105" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow4)"/>
  
  <!-- Step 2 -->
  <rect x="220" y="60" width="150" height="90" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="295" y="85" text-anchor="middle" fill="#2e7d32" font-family="Georgia, serif" font-size="13" font-weight="bold">Step 2</text>
  <text x="295" y="105" text-anchor="middle" fill="#333333" font-size="11">O(3,1;ℤ) Basis</text>
  <text x="295" y="120" text-anchor="middle" fill="#666666" font-size="9">SL(2,ℤ) generators</text>
  <text x="295" y="133" text-anchor="middle" fill="#666666" font-size="9">on (m,n,p,q)</text>
  
  <line x1="370" y1="105" x2="400" y2="105" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow4)"/>
  
  <!-- Step 3 -->
  <rect x="410" y="60" width="150" height="90" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="485" y="85" text-anchor="middle" fill="#1565c0" font-family="Georgia, serif" font-size="13" font-weight="bold">Step 3</text>
  <text x="485" y="105" text-anchor="middle" fill="#333333" font-size="11">BKZ Reduction</text>
  <text x="485" y="120" text-anchor="middle" fill="#666666" font-size="9">Block size β ≥ 3</text>
  <text x="485" y="133" text-anchor="middle" fill="#666666" font-size="9">→ short vectors</text>
  
  <line x1="560" y1="105" x2="590" y2="105" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow4)"/>
  
  <!-- Step 4 -->
  <rect x="600" y="60" width="150" height="90" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="675" y="85" text-anchor="middle" fill="#c2185b" font-family="Georgia, serif" font-size="13" font-weight="bold">Step 4</text>
  <text x="675" y="105" text-anchor="middle" fill="#333333" font-size="11">GCD Extraction</text>
  <text x="675" y="120" text-anchor="middle" fill="#666666" font-size="9">gcd(x²+y², N)</text>
  <text x="675" y="133" text-anchor="middle" fill="#666666" font-size="9">→ factor of N</text>
  
  <!-- Result -->
  <line x1="750" y1="105" x2="780" y2="105" stroke="#3366cc" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="790" y="75" width="80" height="60" fill="#4caf50" rx="8" filter="url(#shadow)"/>
  <text x="830" y="100" text-anchor="middle" fill="white" font-family="Georgia, serif" font-size="13" font-weight="bold">p, q</text>
  <text x="830" y="118" text-anchor="middle" fill="white" font-size="10">N = p·q</text>
  
  <!-- Mathematical details row -->
  <rect x="30" y="180" width="840" height="80" fill="white" stroke="#ccccdd" rx="8" filter="url(#shadow)"/>
  
  <text x="450" y="200" text-anchor="middle" fill="#333333" font-family="Georgia, serif" font-size="14" font-weight="bold">Key Theorems (Lean 4 Verified)</text>
  
  <text x="105" y="225" text-anchor="middle" fill="#e65100" font-size="10">InQuadLat N x y z</text>
  <text x="105" y="240" text-anchor="middle" fill="#e65100" font-size="10">:= N | (x²+y²+z²)</text>
  
  <text x="295" y="225" text-anchor="middle" fill="#2e7d32" font-size="10">parametric_verified:</text>
  <text x="295" y="240" text-anchor="middle" fill="#2e7d32" font-size="10">a²+b²+c² = d² by ring</text>
  
  <text x="485" y="225" text-anchor="middle" fill="#1565c0" font-size="10">lll_approx_factor:</text>
  <text x="485" y="240" text-anchor="middle" fill="#1565c0" font-size="10">2 ≤ 2^{(d-1)/2}</text>
  
  <text x="675" y="225" text-anchor="middle" fill="#c2185b" font-size="10">factor_from_quad:</text>
  <text x="675" y="240" text-anchor="middle" fill="#c2185b" font-size="10">p|N, p|(x²+y²) → p|z²</text>
  
  <!-- Experimental results -->
  <rect x="30" y="280" width="410" height="100" fill="#f5f5f5" stroke="#ccccdd" rx="8" filter="url(#shadow)"/>
  <text x="235" y="305" text-anchor="middle" fill="#333333" font-family="Georgia, serif" font-size="13" font-weight="bold">Experimental Results</text>
  <text x="235" y="325" text-anchor="middle" fill="#666666" font-size="11">53.8% of balanced semiprimes factored</text>
  <text x="235" y="345" text-anchor="middle" fill="#666666" font-size="11">3 GCD candidates per short vector</text>
  <text x="235" y="365" text-anchor="middle" fill="#666666" font-size="11">6 short vectors × 3 = 18 total candidates</text>
  
  <!-- Open question -->
  <rect x="460" y="280" width="410" height="100" fill="#fffde7" stroke="#ffc107" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="665" y="305" text-anchor="middle" fill="#f57f17" font-family="Georgia, serif" font-size="13" font-weight="bold">Open Question</text>
  <text x="665" y="325" text-anchor="middle" fill="#333333" font-size="11">Does the structured basis from O(3,1;ℤ)</text>
  <text x="665" y="345" text-anchor="middle" fill="#333333" font-size="11">give BKZ an advantage over random bases?</text>
  <text x="665" y="365" text-anchor="middle" fill="#e65100" font-size="11" font-weight="bold">→ Sub-√N factoring via quadruple lattice?</text>
</svg>
