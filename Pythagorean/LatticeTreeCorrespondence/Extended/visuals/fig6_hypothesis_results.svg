<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="600" fill="url(#bg6)"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e0e0ff" font-size="22" font-weight="bold">Hypothesis Testing Results: H1–H4</text>
  
  <!-- H1 Box -->
  <rect x="30" y="70" width="410" height="230" rx="12" fill="rgba(0,200,100,0.15)" stroke="#00c864" stroke-width="2"/>
  <text x="235" y="100" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold">H1: Structured Basis Advantage</text>
  <text x="50" y="130" fill="#c0c0ff" font-size="13">Structured basis avg norm: 5.87</text>
  <text x="50" y="155" fill="#c0c0ff" font-size="13">Random basis avg norm: 51.46</text>
  <text x="50" y="180" fill="#c0c0ff" font-size="13">Norm ratio: 0.114 (8.8× shorter)</text>
  <text x="50" y="210" fill="#c0c0ff" font-size="13">Factoring success (struct): 28/47 = 59.6%</text>
  <text x="50" y="235" fill="#c0c0ff" font-size="13">Factoring success (random): 32/47 = 68.1%</text>
  <!-- Bar chart -->
  <rect x="60" y="255" width="117" height="20" rx="3" fill="#00c864" opacity="0.8"/>
  <rect x="60" y="278" width="10" height="20" rx="3" fill="#6464ff" opacity="0.8"/>
  <text x="190" y="270" fill="#a0ffa0" font-size="11">Structured norm (5.87)</text>
  <text x="190" y="293" fill="#a0a0ff" font-size="11">Random norm (51.46)</text>
  <text x="235" y="295" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="bold" opacity="0">SUPPORTED ✓</text>
  
  <!-- H2 Box -->
  <rect x="460" y="70" width="410" height="230" rx="12" fill="rgba(0,200,100,0.15)" stroke="#00c864" stroke-width="2"/>
  <text x="665" y="100" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold">H2: Scaling Law α &lt; 0.5</text>
  <text x="480" y="130" fill="#c0c0ff" font-size="13">Regression: log(λ₁) = 0.175·log(N) + 0.18</text>
  <text x="480" y="155" fill="#c0c0ff" font-size="13">Estimated exponent: α = 0.175</text>
  <text x="480" y="180" fill="#c0c0ff" font-size="13">Prediction: α &lt; 0.5 (sub-√N)</text>
  <text x="480" y="210" fill="#00ff88" font-size="14" font-weight="bold">SUPPORTED ✓</text>
  <!-- Mini scatter plot -->
  <line x1="500" y1="290" x2="840" y2="290" stroke="#555" stroke-width="1"/>
  <line x1="500" y1="230" x2="500" y2="290" stroke="#555" stroke-width="1"/>
  <text x="670" y="298" text-anchor="middle" fill="#888" font-size="10">log N</text>
  <text x="492" y="260" text-anchor="end" fill="#888" font-size="10">log λ₁</text>
  <!-- Data points approximating α=0.175 -->
  <circle cx="520" cy="280" r="3" fill="#00c864"/>
  <circle cx="545" cy="275" r="3" fill="#00c864"/>
  <circle cx="570" cy="268" r="3" fill="#00c864"/>
  <circle cx="600" cy="272" r="3" fill="#00c864"/>
  <circle cx="630" cy="262" r="3" fill="#00c864"/>
  <circle cx="660" cy="258" r="3" fill="#00c864"/>
  <circle cx="700" cy="255" r="3" fill="#00c864"/>
  <circle cx="740" cy="248" r="3" fill="#00c864"/>
  <circle cx="780" cy="242" r="3" fill="#00c864"/>
  <!-- Fit line -->
  <line x1="510" y1="282" x2="800" y2="238" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="810" y="235" fill="#ffaa00" font-size="10">α=0.175</text>
  <!-- Reference line for α=0.5 -->
  <line x1="510" y1="282" x2="800" y2="200" stroke="#ff4444" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
  <text x="810" y="198" fill="#ff4444" font-size="9" opacity="0.6">α=0.5</text>
  
  <!-- H3 Box -->
  <rect x="30" y="320" width="410" height="240" rx="12" fill="rgba(200,200,0,0.12)" stroke="#cccc00" stroke-width="2"/>
  <text x="235" y="350" text-anchor="middle" fill="#ffff44" font-size="16" font-weight="bold">H3: Extraction Rate by Class</text>
  <text x="50" y="380" fill="#c0c0ff" font-size="13">p,q ≡ 1 (mod 4): 50.0% success</text>
  <text x="50" y="405" fill="#c0c0ff" font-size="13">p or q ≡ 3 (mod 4): 61.5% success</text>
  <text x="50" y="435" fill="#c0c0ff" font-size="13">Prediction: &gt; 50% for 1 (mod 4)</text>
  <text x="50" y="465" fill="#ffff44" font-size="14" font-weight="bold">INCONCLUSIVE — small sample</text>
  <!-- Pie-like bars -->
  <rect x="60" y="485" width="200" height="18" rx="3" fill="#333" stroke="#666"/>
  <rect x="60" y="485" width="100" height="18" rx="3" fill="#cccc00" opacity="0.7"/>
  <text x="270" y="499" fill="#aaa" font-size="11">1 mod 4: 50%</text>
  <rect x="60" y="510" width="200" height="18" rx="3" fill="#333" stroke="#666"/>
  <rect x="60" y="510" width="123" height="18" rx="3" fill="#00aaff" opacity="0.7"/>
  <text x="270" y="524" fill="#aaa" font-size="11">3 mod 4: 61.5%</text>
  
  <!-- H4 Box -->
  <rect x="460" y="320" width="410" height="240" rx="12" fill="rgba(0,200,100,0.15)" stroke="#00c864" stroke-width="2"/>
  <text x="665" y="350" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold">H4: Dimensional Hierarchy</text>
  <text x="480" y="380" fill="#c0c0ff" font-size="13">Minkowski exponent 1/d decreases:</text>
  <!-- Dimension bars -->
  <text x="490" y="410" fill="#aaa" font-size="12">d=2:</text>
  <rect x="530" y="398" width="250" height="16" rx="3" fill="#ff4444" opacity="0.7"/>
  <text x="790" y="411" fill="#ff8888" font-size="11">0.500</text>
  
  <text x="490" y="434" fill="#aaa" font-size="12">d=3:</text>
  <rect x="530" y="422" width="167" height="16" rx="3" fill="#ffaa00" opacity="0.7"/>
  <text x="706" y="435" fill="#ffcc44" font-size="11">0.333</text>
  
  <text x="490" y="458" fill="#aaa" font-size="12">d=4:</text>
  <rect x="530" y="446" width="125" height="16" rx="3" fill="#00cc44" opacity="0.7"/>
  <text x="664" y="459" fill="#44ff88" font-size="11">0.250</text>
  
  <text x="490" y="482" fill="#aaa" font-size="12">d=5:</text>
  <rect x="530" y="470" width="100" height="16" rx="3" fill="#0088ff" opacity="0.7"/>
  <text x="639" y="483" fill="#44aaff" font-size="11">0.200</text>
  
  <text x="490" y="506" fill="#aaa" font-size="12">d=6:</text>
  <rect x="530" y="494" width="83" height="16" rx="3" fill="#8844ff" opacity="0.7"/>
  <text x="622" y="507" fill="#aa88ff" font-size="11">0.167</text>
  
  <text x="665" y="540" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="bold">SUPPORTED ✓ (Minkowski's theorem)</text>
</svg>
