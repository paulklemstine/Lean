<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b" />
      <stop offset="100%" style="stop-color:#ff8e8e" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4" />
      <stop offset="100%" style="stop-color:#7ee8e0" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg10)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">H5: Enhanced vs Basic Factor Extraction</text>
  <text x="400" y="60" text-anchor="middle" fill="#aaaacc" font-size="12">Lattice structure enables 80% more successful extractions</text>
  
  <!-- Chart area -->
  <g transform="translate(100, 80)">
    <!-- Axes -->
    <line x1="0" y1="320" x2="600" y2="320" stroke="#555588" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#555588" stroke-width="1"/>
    
    <!-- Y-axis labels -->
    <text x="-10" y="324" text-anchor="end" fill="#aaaacc" font-size="10">0%</text>
    <text x="-10" y="244" text-anchor="end" fill="#aaaacc" font-size="10">25%</text>
    <text x="-10" y="164" text-anchor="end" fill="#aaaacc" font-size="10">50%</text>
    <text x="-10" y="84" text-anchor="end" fill="#aaaacc" font-size="10">75%</text>
    <text x="-10" y="4" text-anchor="end" fill="#aaaacc" font-size="10">100%</text>
    
    <!-- Grid lines -->
    <line x1="0" y1="240" x2="600" y2="240" stroke="#333355" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="0" y1="160" x2="600" y2="160" stroke="#333355" stroke-width="0.5" stroke-dasharray="4"/>
    <line x1="0" y1="80" x2="600" y2="80" stroke="#333355" stroke-width="0.5" stroke-dasharray="4"/>
    
    <!-- 80% target line -->
    <line x1="0" y1="64" x2="600" y2="64" stroke="#ffcc00" stroke-width="1.5" stroke-dasharray="8,4"/>
    <text x="605" y="68" fill="#ffcc00" font-size="10">80% target</text>
    
    <!-- Bar groups -->
    <!-- Basic: 20.8% -->
    <rect x="100" y="253" width="80" height="67" fill="url(#bar1)" rx="4" opacity="0.9"/>
    <text x="140" y="248" text-anchor="middle" fill="#ff8e8e" font-size="14" font-weight="bold">20.8%</text>
    <text x="140" y="350" text-anchor="middle" fill="#aaaacc" font-size="12">Basic</text>
    <text x="140" y="365" text-anchor="middle" fill="#777799" font-size="10">(3 GCDs/vector)</text>
    
    <!-- Enhanced: 37.5% -->
    <rect x="320" y="200" width="80" height="120" fill="url(#bar2)" rx="4" opacity="0.9"/>
    <text x="360" y="195" text-anchor="middle" fill="#7ee8e0" font-size="14" font-weight="bold">37.5%</text>
    <text x="360" y="350" text-anchor="middle" fill="#aaaacc" font-size="12">Enhanced</text>
    <text x="360" y="365" text-anchor="middle" fill="#777799" font-size="10">(lattice combos)</text>
    
    <!-- Arrow showing improvement -->
    <path d="M 220 250 Q 270 200 310 210" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="270" y="195" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">+80%</text>
  </g>
  
  <!-- Legend box -->
  <rect x="480" y="400" width="280" height="80" fill="#1a1a3e" rx="8" stroke="#333366" stroke-width="1"/>
  <text x="500" y="420" fill="#ffffff" font-size="11" font-weight="bold">Method Details:</text>
  <text x="500" y="438" fill="#ff8e8e" font-size="10">● Basic: 3 pairwise GCDs per vector</text>
  <text x="500" y="454" fill="#7ee8e0" font-size="10">● Enhanced: combos + Gram matrix + ±sums</text>
  <text x="500" y="470" fill="#aaaacc" font-size="10">24 semiprimes tested, primes up to 97</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
    </marker>
  </defs>
</svg>
