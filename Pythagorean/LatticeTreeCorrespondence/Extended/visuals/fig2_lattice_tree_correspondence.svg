<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f6f0"/>
      <stop offset="100%" stop-color="#eee8d5"/>
    </linearGradient>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc4444"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4444cc"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#228B22"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="450" fill="url(#bg2)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#333333" font-family="Georgia, serif" font-size="20" font-weight="bold">The Lattice-Tree Correspondence Theorem</text>
  <text x="450" y="55" text-anchor="middle" fill="#666666" font-family="Georgia, serif" font-size="13">Three Mathematical Objects — One Identity</text>
  
  <!-- Box 1: Berggren Tree -->
  <rect x="30" y="80" width="250" height="200" fill="#fff8f0" stroke="#cc4444" stroke-width="2" rx="10"/>
  <text x="155" y="105" text-anchor="middle" fill="#cc4444" font-family="Georgia, serif" font-size="15" font-weight="bold">Berggren Tree</text>
  <text x="155" y="125" text-anchor="middle" fill="#888888" font-size="11">(m,n) parameter space</text>
  
  <!-- Mini tree -->
  <circle cx="155" cy="155" r="8" fill="#cc4444" opacity="0.7"/>
  <text x="155" y="159" text-anchor="middle" fill="white" font-size="9">2,1</text>
  
  <line x1="140" y1="163" x2="105" y2="190" stroke="#cc4444" stroke-width="1.5"/>
  <line x1="155" y1="163" x2="155" y2="190" stroke="#cc4444" stroke-width="1.5"/>
  <line x1="170" y1="163" x2="205" y2="190" stroke="#cc4444" stroke-width="1.5"/>
  
  <circle cx="105" cy="198" r="7" fill="#cc4444" opacity="0.5"/>
  <text x="105" y="201" text-anchor="middle" fill="white" font-size="8">3,2</text>
  
  <circle cx="155" cy="198" r="7" fill="#cc4444" opacity="0.5"/>
  <text x="155" y="201" text-anchor="middle" fill="white" font-size="8">5,2</text>
  
  <circle cx="205" cy="198" r="7" fill="#cc4444" opacity="0.5"/>
  <text x="205" y="201" text-anchor="middle" fill="white" font-size="8">4,1</text>
  
  <!-- Operations -->
  <text x="60" y="240" fill="#cc4444" font-family="monospace" font-size="10">M₃⁻¹: (m,n)→(m-2n,n)</text>
  <text x="60" y="255" fill="#cc4444" font-family="monospace" font-size="10">M₁⁻¹: (m,n)→(n,2n-m)</text>
  <text x="60" y="270" fill="#888888" font-family="monospace" font-size="9">Branch factor = 3</text>
  
  <!-- Arrow 1→2 -->
  <line x1="290" y1="180" x2="320" y2="180" stroke="#228B22" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="305" y="170" text-anchor="middle" fill="#228B22" font-size="20" font-weight="bold">=</text>
  
  <!-- Box 2: Gauss Algorithm -->
  <rect x="330" y="80" width="250" height="200" fill="#f0f0ff" stroke="#4444cc" stroke-width="2" rx="10"/>
  <text x="455" y="105" text-anchor="middle" fill="#4444cc" font-family="Georgia, serif" font-size="15" font-weight="bold">Gauss Reduction</text>
  <text x="455" y="125" text-anchor="middle" fill="#888888" font-size="11">2D lattice algorithm</text>
  
  <!-- Mini lattice -->
  <g transform="translate(455, 195)">
    <g stroke="#4444cc" stroke-width="0.5" opacity="0.3">
      <line x1="-60" y1="-40" x2="60" y2="-40"/>
      <line x1="-60" y1="0" x2="60" y2="0"/>
      <line x1="-60" y1="40" x2="60" y2="40"/>
      <line x1="-40" y1="-50" x2="-40" y2="50"/>
      <line x1="0" y1="-50" x2="0" y2="50"/>
      <line x1="40" y1="-50" x2="40" y2="50"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#4444cc"/>
    <circle cx="40" cy="0" r="3" fill="#4444cc" opacity="0.6"/>
    <circle cx="0" cy="-40" r="3" fill="#4444cc" opacity="0.6"/>
    <line x1="0" y1="0" x2="40" y2="-20" stroke="#cc4444" stroke-width="2"/>
    <line x1="0" y1="0" x2="-20" y2="-40" stroke="#44cc44" stroke-width="2"/>
  </g>
  
  <!-- Operations -->
  <text x="360" y="240" fill="#4444cc" font-family="monospace" font-size="10">Subtract: b₂ ← b₂-⌊μ⌋b₁</text>
  <text x="360" y="255" fill="#4444cc" font-family="monospace" font-size="10">Swap: b₁ ↔ b₂ when needed</text>
  <text x="360" y="270" fill="#888888" font-family="monospace" font-size="9">Optimal in 2D (SVP exact)</text>
  
  <!-- Arrow 2→3 -->
  <line x1="590" y1="180" x2="620" y2="180" stroke="#228B22" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="605" y="170" text-anchor="middle" fill="#228B22" font-size="20" font-weight="bold">=</text>
  
  <!-- Box 3: Euclidean Algorithm -->
  <rect x="630" y="80" width="250" height="200" fill="#f0fff0" stroke="#228B22" stroke-width="2" rx="10"/>
  <text x="755" y="105" text-anchor="middle" fill="#228B22" font-family="Georgia, serif" font-size="15" font-weight="bold">Euclidean Algorithm</text>
  <text x="755" y="125" text-anchor="middle" fill="#888888" font-size="11">Continued fractions</text>
  
  <!-- CF expansion -->
  <text x="660" y="155" fill="#228B22" font-family="monospace" font-size="12">m/n = [a₀; a₁, a₂, ...]</text>
  <text x="660" y="175" fill="#228B22" font-family="monospace" font-size="11">13/5 = [2; 1, 1, 2]</text>
  <text x="660" y="195" fill="#228B22" font-family="monospace" font-size="11">  13 = 2·5 + 3</text>
  <text x="660" y="210" fill="#228B22" font-family="monospace" font-size="11">   5 = 1·3 + 2</text>
  <text x="660" y="225" fill="#228B22" font-family="monospace" font-size="11">   3 = 1·2 + 1</text>
  <text x="660" y="240" fill="#228B22" font-family="monospace" font-size="11">   2 = 2·1 + 0</text>
  
  <text x="660" y="270" fill="#888888" font-family="monospace" font-size="9">O(log N) quotients</text>
  
  <!-- Bottom: Consequence -->
  <rect x="130" y="310" width="650" height="120" fill="#ffffff" stroke="#333333" stroke-width="1.5" rx="10" opacity="0.9"/>
  
  <text x="455" y="340" text-anchor="middle" fill="#333333" font-family="Georgia, serif" font-size="16" font-weight="bold">Consequence: The √N Barrier is Fundamental in 2D</text>
  
  <text x="455" y="365" text-anchor="middle" fill="#666666" font-family="Georgia, serif" font-size="12">For balanced semiprimes N = p·q with p ≈ √N:</text>
  <text x="455" y="385" text-anchor="middle" fill="#cc4444" font-family="monospace" font-size="13">Berggren tree descent = Gauss reduction = Θ(√N) steps</text>
  <text x="455" y="410" text-anchor="middle" fill="#228B22" font-family="Georgia, serif" font-size="12" font-style="italic">No 2D lattice method can improve this bound. The escape requires dimension ≥ 3.</text>
  
  <!-- Verified badge -->
  <rect x="660" y="395" width="110" height="25" fill="#228B22" rx="5"/>
  <text x="715" y="412" text-anchor="middle" fill="white" font-family="monospace" font-size="10" font-weight="bold">✓ LEAN 4 VERIFIED</text>
</svg>
