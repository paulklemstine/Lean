<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a1a3e"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="nodeGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8844"/>
      <stop offset="100%" stop-color="#cc4422"/>
    </radialGradient>
    <radialGradient id="nodeGrad2" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#2244aa"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg3)"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="20" font-weight="bold">Pythagorean Quadruple Tree</text>
  <text x="400" y="50" text-anchor="middle" fill="#aabbcc" font-family="Georgia, serif" font-size="12">Generated by SL(2,ℤ) acting on parameters (m,n,p,q)</text>
  
  <!-- Root node -->
  <circle cx="400" cy="90" r="22" fill="url(#nodeGrad)" filter="url(#glow2)"/>
  <text x="400" y="87" text-anchor="middle" fill="white" font-family="monospace" font-size="9" font-weight="bold">(1,2,2)</text>
  <text x="400" y="100" text-anchor="middle" fill="white" font-family="monospace" font-size="9">d=3</text>
  
  <!-- Level 1 branches -->
  <!-- Permutations give 6 spatial variants -->
  <line x1="380" y1="110" x2="180" y2="170" stroke="#ff8844" stroke-width="1.5" opacity="0.6"/>
  <line x1="390" y1="110" x2="300" y2="170" stroke="#ff8844" stroke-width="1.5" opacity="0.6"/>
  <line x1="400" y1="112" x2="400" y2="170" stroke="#4488ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="410" y1="110" x2="500" y2="170" stroke="#4488ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="420" y1="110" x2="620" y2="170" stroke="#44ff88" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Level 1 labels -->
  <text x="250" y="155" text-anchor="middle" fill="#ff8844" font-size="9" font-style="italic">Permutations</text>
  <text x="450" y="155" text-anchor="middle" fill="#4488ff" font-size="9" font-style="italic">SL(2,ℤ): T</text>
  <text x="620" y="155" text-anchor="middle" fill="#44ff88" font-size="9" font-style="italic">SL(2,ℤ): S</text>
  
  <!-- Level 1 nodes -->
  <circle cx="180" cy="185" r="18" fill="url(#nodeGrad)" filter="url(#glow2)" opacity="0.8"/>
  <text x="180" y="182" text-anchor="middle" fill="white" font-size="8">(2,1,2)</text>
  <text x="180" y="194" text-anchor="middle" fill="white" font-size="8">d=3</text>
  
  <circle cx="300" cy="185" r="18" fill="url(#nodeGrad)" filter="url(#glow2)" opacity="0.8"/>
  <text x="300" y="182" text-anchor="middle" fill="white" font-size="8">(2,2,1)</text>
  <text x="300" y="194" text-anchor="middle" fill="white" font-size="8">d=3</text>
  
  <circle cx="400" cy="185" r="18" fill="url(#nodeGrad2)" filter="url(#glow2)"/>
  <text x="400" y="182" text-anchor="middle" fill="white" font-size="8">(1,4,8)</text>
  <text x="400" y="194" text-anchor="middle" fill="white" font-size="8">d=9</text>
  
  <circle cx="500" cy="185" r="18" fill="url(#nodeGrad2)" filter="url(#glow2)"/>
  <text x="500" y="182" text-anchor="middle" fill="white" font-size="8">(2,3,6)</text>
  <text x="500" y="194" text-anchor="middle" fill="white" font-size="8">d=7</text>
  
  <circle cx="620" cy="185" r="18" fill="#228B22" filter="url(#glow2)" opacity="0.8"/>
  <text x="620" y="182" text-anchor="middle" fill="white" font-size="8">(4,4,7)</text>
  <text x="620" y="194" text-anchor="middle" fill="white" font-size="8">d=9</text>
  
  <!-- Level 2 -->
  <line x1="400" y1="203" x2="320" y2="260" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="203" x2="400" y2="260" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="203" x2="480" y2="260" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
  
  <line x1="500" y1="203" x2="540" y2="260" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
  <line x1="500" y1="203" x2="600" y2="260" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
  <line x1="500" y1="203" x2="660" y2="260" stroke="#4488ff" stroke-width="1" opacity="0.4"/>
  
  <!-- Level 2 nodes -->
  <circle cx="320" cy="275" r="14" fill="url(#nodeGrad2)" opacity="0.6"/>
  <text x="320" y="278" text-anchor="middle" fill="white" font-size="7">(2,6,9)</text>
  
  <circle cx="400" cy="275" r="14" fill="url(#nodeGrad2)" opacity="0.6"/>
  <text x="400" y="278" text-anchor="middle" fill="white" font-size="7">(1,12,12)</text>
  
  <circle cx="480" cy="275" r="14" fill="url(#nodeGrad2)" opacity="0.6"/>
  <text x="480" y="278" text-anchor="middle" fill="white" font-size="7">(8,9,12)</text>
  
  <circle cx="540" cy="275" r="14" fill="url(#nodeGrad2)" opacity="0.6"/>
  <text x="540" y="278" text-anchor="middle" fill="white" font-size="7">(6,6,7)</text>
  
  <circle cx="600" cy="275" r="14" fill="url(#nodeGrad2)" opacity="0.6"/>
  <text x="600" y="278" text-anchor="middle" fill="white" font-size="7">(3,4,12)</text>
  
  <circle cx="660" cy="275" r="14" fill="url(#nodeGrad2)" opacity="0.6"/>
  <text x="660" y="278" text-anchor="middle" fill="white" font-size="7">(6,10,15)</text>
  
  <!-- Dots for continuation -->
  <text x="400" y="330" text-anchor="middle" fill="#555577" font-size="24">···</text>
  
  <!-- Comparison panel -->
  <rect x="50" y="350" width="320" height="130" fill="#1a1a3e" stroke="#444466" rx="8"/>
  <text x="210" y="375" text-anchor="middle" fill="#ff8844" font-family="Georgia, serif" font-size="14" font-weight="bold">Triple Tree (Berggren)</text>
  <text x="210" y="395" fill="#aaaacc" font-size="11" text-anchor="middle">• Branching factor: 3</text>
  <text x="210" y="412" fill="#aaaacc" font-size="11" text-anchor="middle">• Symmetry: O(2,1;ℤ) = SL(2,ℤ)</text>
  <text x="210" y="429" fill="#aaaacc" font-size="11" text-anchor="middle">• SVP: Exact (Gauss algorithm)</text>
  <text x="210" y="446" fill="#ff6644" font-size="11" text-anchor="middle">• Complexity: Θ(√N) — OPTIMAL</text>
  <text x="210" y="470" fill="#ff4444" font-size="12" text-anchor="middle" font-weight="bold">BARRIER</text>
  
  <rect x="430" y="350" width="320" height="130" fill="#0a2a1e" stroke="#226622" rx="8"/>
  <text x="590" y="375" text-anchor="middle" fill="#44ff88" font-family="Georgia, serif" font-size="14" font-weight="bold">Quadruple Tree (New)</text>
  <text x="590" y="395" fill="#aaddcc" font-size="11" text-anchor="middle">• Branching factor: ≥ 6</text>
  <text x="590" y="412" fill="#aaddcc" font-size="11" text-anchor="middle">• Symmetry: O(3,1;ℤ) via SL(2,ℤ)</text>
  <text x="590" y="429" fill="#aaddcc" font-size="11" text-anchor="middle">• SVP: Approximate (LLL/BKZ)</text>
  <text x="590" y="446" fill="#44ff88" font-size="11" text-anchor="middle">• Complexity: O(N^{1/3})? — OPEN</text>
  <text x="590" y="470" fill="#44ff88" font-size="12" text-anchor="middle" font-weight="bold">ESCAPE?</text>
</svg>
