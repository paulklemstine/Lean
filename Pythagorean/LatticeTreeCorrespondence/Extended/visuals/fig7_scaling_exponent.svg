<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg7)"/>
  
  <text x="400" y="35" text-anchor="middle" fill="#e0e0ff" font-size="20" font-weight="bold">Scaling Exponent: Shortest Vector vs N</text>
  <text x="400" y="58" text-anchor="middle" fill="#8888cc" font-size="14">λ₁ ~ N^α : Measured α = 0.175 vs predicted 0.333 (d=3) and 0.500 (d=2)</text>
  
  <!-- Axes -->
  <line x1="100" y1="420" x2="750" y2="420" stroke="#555" stroke-width="2"/>
  <line x1="100" y1="420" x2="100" y2="80" stroke="#555" stroke-width="2"/>
  <text x="425" y="460" text-anchor="middle" fill="#aaa" font-size="14">log₂(N)</text>
  <text x="50" y="250" text-anchor="middle" fill="#aaa" font-size="14" transform="rotate(-90,50,250)">log₂(λ₁)</text>
  
  <!-- Grid -->
  <line x1="100" y1="350" x2="750" y2="350" stroke="#333" stroke-width="0.5"/>
  <line x1="100" y1="280" x2="750" y2="280" stroke="#333" stroke-width="0.5"/>
  <line x1="100" y1="210" x2="750" y2="210" stroke="#333" stroke-width="0.5"/>
  <line x1="100" y1="140" x2="750" y2="140" stroke="#333" stroke-width="0.5"/>
  
  <!-- X axis labels (log2 N) -->
  <text x="140" y="440" text-anchor="middle" fill="#888" font-size="11">4</text>
  <text x="220" y="440" text-anchor="middle" fill="#888" font-size="11">6</text>
  <text x="300" y="440" text-anchor="middle" fill="#888" font-size="11">8</text>
  <text x="380" y="440" text-anchor="middle" fill="#888" font-size="11">10</text>
  <text x="460" y="440" text-anchor="middle" fill="#888" font-size="11">12</text>
  <text x="540" y="440" text-anchor="middle" fill="#888" font-size="11">14</text>
  <text x="620" y="440" text-anchor="middle" fill="#888" font-size="11">16</text>
  
  <!-- Y axis labels (log2 λ) -->
  <text x="90" y="420" text-anchor="end" fill="#888" font-size="11">0</text>
  <text x="90" y="350" text-anchor="end" fill="#888" font-size="11">1</text>
  <text x="90" y="280" text-anchor="end" fill="#888" font-size="11">2</text>
  <text x="90" y="210" text-anchor="end" fill="#888" font-size="11">3</text>
  <text x="90" y="140" text-anchor="end" fill="#888" font-size="11">4</text>
  
  <!-- Reference line: α = 0.5 (d=2 bound) -->
  <line x1="100" y1="420" x2="700" y2="140" stroke="#ff4444" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="710" y="135" fill="#ff6666" font-size="12">α = 0.5 (2D bound)</text>
  
  <!-- Reference line: α = 0.333 (d=3 Minkowski) -->
  <line x1="100" y1="420" x2="700" y2="233" stroke="#ffaa00" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="710" y="228" fill="#ffcc44" font-size="12">α = 1/3 (3D Minkowski)</text>
  
  <!-- Fitted line: α = 0.175 -->
  <line x1="100" y1="420" x2="700" y2="327" stroke="#00ff88" stroke-width="2.5" opacity="0.8"/>
  <text x="710" y="322" fill="#00ff88" font-size="12" font-weight="bold">α = 0.175 (measured)</text>
  
  <!-- Data points (log2(N), log2(λ₁)) -->
  <!-- N=6→(2.6,0.5), N=15→(3.9,0.5), N=35→(5.1,1.5), N=77→(6.3,0.5), N=143→(7.2,1.7) -->
  <!-- N=221→(7.8,0.5), N=323→(8.3,1.5), N=437→(8.8,2.8), N=667→(9.4,3.0) -->
  <!-- N=899→(9.8,2.7), N=1147→(10.2,2.5), N=1517→(10.6,0.5), N=1763→(10.8,3.6) -->
  
  <!-- Scale: x maps log2N 2..16 to pixel 100..700, y maps log2λ 0..5 to pixel 420..80 -->
  <!-- x = 100 + (log2N - 2) * 42.8, y = 420 - log2λ * 68 -->
  
  <circle cx="126" cy="386" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="181" cy="386" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="233" cy="318" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="284" cy="386" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="322" cy="304" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="348" cy="386" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="370" cy="318" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="391" cy="230" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="417" cy="216" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="434" cy="234" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="451" cy="252" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="468" cy="386" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="477" cy="176" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="525" cy="244" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="562" cy="288" r="5" fill="#00bbff" opacity="0.8"/>
  <circle cx="610" cy="190" r="5" fill="#00bbff" opacity="0.8"/>
  
  <!-- Legend box -->
  <rect x="115" y="85" width="280" height="95" rx="8" fill="rgba(0,0,0,0.5)" stroke="#555"/>
  <circle cx="135" cy="110" r="5" fill="#00bbff"/>
  <text x="150" y="115" fill="#ccc" font-size="12">Experimental data points</text>
  <line x1="125" y1="135" x2="155" y2="135" stroke="#00ff88" stroke-width="2.5"/>
  <text x="165" y="140" fill="#ccc" font-size="12">Measured fit: α = 0.175</text>
  <line x1="125" y1="157" x2="155" y2="157" stroke="#ffaa00" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="165" y="162" fill="#ccc" font-size="12">3D Minkowski: α = 0.333</text>
  
  <!-- Annotation -->
  <text x="400" y="490" text-anchor="middle" fill="#88ff88" font-size="13">
    Measured exponent is well below √N (α=0.5) and even below N^{1/3} (α=0.333)
  </text>
</svg>
