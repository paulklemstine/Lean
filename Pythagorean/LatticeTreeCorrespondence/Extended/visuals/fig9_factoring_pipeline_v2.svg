<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <marker id="arrow9" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00bbff"/>
    </marker>
    <marker id="arrow9g" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
  </defs>
  
  <rect width="900" height="500" fill="url(#bg9)"/>
  
  <text x="450" y="35" text-anchor="middle" fill="#e0e0ff" font-size="20" font-weight="bold">Quadruple Lattice Factoring Pipeline</text>
  <text x="450" y="55" text-anchor="middle" fill="#8888cc" font-size="12">From composite N to non-trivial factor — every step formalized in Lean 4</text>
  
  <!-- Step 1: Input N -->
  <rect x="30" y="80" width="150" height="60" rx="10" fill="rgba(255,100,50,0.2)" stroke="#ff6432" stroke-width="2"/>
  <text x="105" y="105" text-anchor="middle" fill="#ff8866" font-size="14" font-weight="bold">INPUT</text>
  <text x="105" y="125" text-anchor="middle" fill="#ffaa88" font-size="16">N = p · q</text>
  
  <!-- Arrow 1 -->
  <line x1="180" y1="110" x2="230" y2="110" stroke="#00bbff" stroke-width="2" marker-end="url(#arrow9)"/>
  
  <!-- Step 2: Build Lattice -->
  <rect x="240" y="75" width="170" height="70" rx="10" fill="rgba(0,100,255,0.15)" stroke="#0066ff" stroke-width="2"/>
  <text x="325" y="100" text-anchor="middle" fill="#4488ff" font-size="13" font-weight="bold">BUILD L₄(N)</text>
  <text x="325" y="118" text-anchor="middle" fill="#88aaff" font-size="11">{(x,y,z) : N | x²+y²+z²}</text>
  <text x="325" y="135" text-anchor="middle" fill="#6688cc" font-size="10">SL(2,ℤ) structured basis</text>
  
  <!-- Arrow 2 -->
  <line x1="410" y1="110" x2="460" y2="110" stroke="#00bbff" stroke-width="2" marker-end="url(#arrow9)"/>
  
  <!-- Step 3: BKZ Reduce -->
  <rect x="470" y="75" width="170" height="70" rx="10" fill="rgba(0,200,100,0.15)" stroke="#00c864" stroke-width="2"/>
  <text x="555" y="100" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="bold">BKZ REDUCE</text>
  <text x="555" y="118" text-anchor="middle" fill="#88ffcc" font-size="11">Find short vectors</text>
  <text x="555" y="135" text-anchor="middle" fill="#66cc88" font-size="10">‖v‖ ~ N^{0.175}</text>
  
  <!-- Arrow 3 -->
  <line x1="640" y1="110" x2="690" y2="110" stroke="#00bbff" stroke-width="2" marker-end="url(#arrow9)"/>
  
  <!-- Step 4: Extract Factor -->
  <rect x="700" y="75" width="170" height="70" rx="10" fill="rgba(255,200,0,0.15)" stroke="#ffcc00" stroke-width="2"/>
  <text x="785" y="100" text-anchor="middle" fill="#ffee44" font-size="13" font-weight="bold">EXTRACT</text>
  <text x="785" y="118" text-anchor="middle" fill="#ffee88" font-size="11">gcd(x²+y², N)</text>
  <text x="785" y="135" text-anchor="middle" fill="#ccaa44" font-size="10">18 GCD candidates</text>
  
  <!-- Formalized proof chain -->
  <text x="450" y="185" text-anchor="middle" fill="#aaaaee" font-size="14" font-weight="bold">Formalized Proof Chain (Lean 4, zero sorry)</text>
  
  <!-- Proof boxes row 1 -->
  <rect x="30" y="205" width="185" height="80" rx="8" fill="rgba(100,50,200,0.15)" stroke="#8844cc" stroke-width="1.5"/>
  <text x="122" y="225" text-anchor="middle" fill="#aa88ff" font-size="11" font-weight="bold">Theorem 3.1</text>
  <text x="122" y="242" text-anchor="middle" fill="#ccaaff" font-size="10">no_nontrivial_boost</text>
  <text x="122" y="258" text-anchor="middle" fill="#9988cc" font-size="9">λ²−μ²=1 ⟹ μ=0</text>
  <text x="122" y="275" text-anchor="middle" fill="#666699" font-size="9">Pell equation obstruction</text>
  
  <rect x="235" y="205" width="185" height="80" rx="8" fill="rgba(100,50,200,0.15)" stroke="#8844cc" stroke-width="1.5"/>
  <text x="327" y="225" text-anchor="middle" fill="#aa88ff" font-size="11" font-weight="bold">Theorem 4.1</text>
  <text x="327" y="242" text-anchor="middle" fill="#ccaaff" font-size="10">parametric_quadruple</text>
  <text x="327" y="258" text-anchor="middle" fill="#9988cc" font-size="9">a²+b²+c² = d² (by ring)</text>
  <text x="327" y="275" text-anchor="middle" fill="#666699" font-size="9">Parametric generation</text>
  
  <rect x="440" y="205" width="185" height="80" rx="8" fill="rgba(100,50,200,0.15)" stroke="#8844cc" stroke-width="1.5"/>
  <text x="532" y="225" text-anchor="middle" fill="#aa88ff" font-size="11" font-weight="bold">Theorem 5.1-5.2</text>
  <text x="532" y="242" text-anchor="middle" fill="#ccaaff" font-size="10">factor_from_quad</text>
  <text x="532" y="258" text-anchor="middle" fill="#9988cc" font-size="9">p|N, N|(x²+y²+z²) ⟹ p|z²</text>
  <text x="532" y="275" text-anchor="middle" fill="#666699" font-size="9">Divisibility cascade</text>
  
  <rect x="645" y="205" width="225" height="80" rx="8" fill="rgba(100,50,200,0.15)" stroke="#8844cc" stroke-width="1.5"/>
  <text x="757" y="225" text-anchor="middle" fill="#aa88ff" font-size="11" font-weight="bold">Theorem (New)</text>
  <text x="757" y="242" text-anchor="middle" fill="#ccaaff" font-size="10">minkowski_exponent_gap</text>
  <text x="757" y="258" text-anchor="middle" fill="#9988cc" font-size="9">d₁ &lt; d₂ ⟹ 1/d₂ &lt; 1/d₁</text>
  <text x="757" y="275" text-anchor="middle" fill="#666699" font-size="9">Dimensional hierarchy</text>
  
  <!-- Results summary -->
  <rect x="30" y="310" width="840" height="170" rx="12" fill="rgba(0,50,100,0.2)" stroke="#004488" stroke-width="1.5"/>
  <text x="450" y="338" text-anchor="middle" fill="#88ccff" font-size="15" font-weight="bold">Experimental Results Summary</text>
  
  <!-- Three columns -->
  <text x="170" y="368" text-anchor="middle" fill="#ffaa44" font-size="13" font-weight="bold">Basis Quality</text>
  <text x="170" y="388" text-anchor="middle" fill="#ccccee" font-size="11">Structured: avg ‖v‖ = 5.87</text>
  <text x="170" y="405" text-anchor="middle" fill="#ccccee" font-size="11">Random: avg ‖v‖ = 51.46</text>
  <text x="170" y="425" text-anchor="middle" fill="#00ff88" font-size="12" font-weight="bold">8.8× improvement</text>
  
  <line x1="320" y1="355" x2="320" y2="460" stroke="#333" stroke-width="1"/>
  
  <text x="450" y="368" text-anchor="middle" fill="#ffaa44" font-size="13" font-weight="bold">Scaling Exponent</text>
  <text x="450" y="388" text-anchor="middle" fill="#ccccee" font-size="11">Measured: α = 0.175</text>
  <text x="450" y="405" text-anchor="middle" fill="#ccccee" font-size="11">2D bound: α = 0.500</text>
  <text x="450" y="425" text-anchor="middle" fill="#ccccee" font-size="11">3D Minkowski: α = 0.333</text>
  <text x="450" y="445" text-anchor="middle" fill="#00ff88" font-size="12" font-weight="bold">Well below √N</text>
  
  <line x1="590" y1="355" x2="590" y2="460" stroke="#333" stroke-width="1"/>
  
  <text x="730" y="368" text-anchor="middle" fill="#ffaa44" font-size="13" font-weight="bold">Factoring Rate</text>
  <text x="730" y="388" text-anchor="middle" fill="#ccccee" font-size="11">Overall: 59.6% structured</text>
  <text x="730" y="405" text-anchor="middle" fill="#ccccee" font-size="11">3 mod 4 primes: 61.5%</text>
  <text x="730" y="425" text-anchor="middle" fill="#ccccee" font-size="11">1 mod 4 primes: 50.0%</text>
  <text x="730" y="445" text-anchor="middle" fill="#ffff44" font-size="12" font-weight="bold">Promising, needs scaling</text>
</svg>
