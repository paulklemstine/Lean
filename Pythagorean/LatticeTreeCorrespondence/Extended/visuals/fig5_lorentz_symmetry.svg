<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
    <radialGradient id="cone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa44" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffaa44" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg5)"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="20" font-weight="bold">Lorentz Symmetry: Einstein Meets Euclid</text>
  <text x="400" y="50" text-anchor="middle" fill="#aabbdd" font-family="Georgia, serif" font-size="12">The same group O(3,1) governs spacetime AND Pythagorean quadruples</text>
  
  <!-- Left: Physics light cone -->
  <text x="200" y="85" text-anchor="middle" fill="#ffaa44" font-family="Georgia, serif" font-size="15" font-weight="bold">Special Relativity</text>
  <text x="200" y="105" text-anchor="middle" fill="#888899" font-size="11">x²+y²+z² − (ct)² = 0</text>
  
  <!-- Light cone -->
  <g transform="translate(200, 280)">
    <!-- Future cone -->
    <polygon points="0,-140 -80,0 80,0" fill="none" stroke="#ffaa44" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,-140 -60,-20 60,-20" fill="#ffaa44" opacity="0.08"/>
    
    <!-- Past cone -->
    <polygon points="0,140 -80,0 80,0" fill="none" stroke="#ffaa44" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,140 -60,20 60,20" fill="#ffaa44" opacity="0.08"/>
    
    <!-- Axes -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#555577" stroke-width="1"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#555577" stroke-width="1"/>
    
    <text x="105" y="5" fill="#888899" font-size="10">space (x)</text>
    <text x="5" y="-145" fill="#888899" font-size="10">time (t)</text>
    
    <!-- Event point -->
    <circle cx="30" cy="-80" r="4" fill="#ffaa44" filter="url(#glow3)"/>
    <text x="45" y="-75" fill="#ffaa44" font-size="9">event</text>
    
    <!-- Lorentz boost arrow -->
    <path d="M 30,-80 C 50,-60 50,-40 35,-30" stroke="#ff6644" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
    <text x="60" y="-50" fill="#ff6644" font-size="9">boost</text>
    
    <text x="0" y="175" text-anchor="middle" fill="#ffaa44" font-size="11">O(3,1;ℝ): Lorentz group</text>
    <text x="0" y="190" text-anchor="middle" fill="#888899" font-size="10">Continuous symmetries</text>
  </g>
  
  <!-- Equals sign -->
  <text x="400" y="260" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="bold">≅</text>
  <text x="400" y="290" text-anchor="middle" fill="#aabbdd" font-size="11">Same group structure!</text>
  
  <!-- Right: Number theory quadruple cone -->
  <text x="600" y="85" text-anchor="middle" fill="#44aaff" font-family="Georgia, serif" font-size="15" font-weight="bold">Number Theory</text>
  <text x="600" y="105" text-anchor="middle" fill="#888899" font-size="11">a²+b²+c² − d² = 0</text>
  
  <!-- Quadruple cone -->
  <g transform="translate(600, 280)">
    <!-- Cone -->
    <polygon points="0,-140 -80,0 80,0" fill="none" stroke="#44aaff" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,-140 -60,-20 60,-20" fill="#44aaff" opacity="0.08"/>
    
    <polygon points="0,140 -80,0 80,0" fill="none" stroke="#44aaff" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,140 -60,20 60,20" fill="#44aaff" opacity="0.08"/>
    
    <!-- Axes -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#555577" stroke-width="1"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#555577" stroke-width="1"/>
    
    <text x="105" y="5" fill="#888899" font-size="10">spatial (a,b,c)</text>
    <text x="5" y="-145" fill="#888899" font-size="10">d</text>
    
    <!-- Quadruple points -->
    <circle cx="20" cy="-60" r="4" fill="#44aaff" filter="url(#glow3)"/>
    <text x="35" y="-55" fill="#44aaff" font-size="8">(1,2,2,3)</text>
    
    <circle cx="-30" cy="-100" r="4" fill="#44aaff" filter="url(#glow3)"/>
    <text x="-75" y="-95" fill="#44aaff" font-size="8">(2,3,6,7)</text>
    
    <circle cx="50" cy="-120" r="4" fill="#44aaff" filter="url(#glow3)"/>
    <text x="65" y="-115" fill="#44aaff" font-size="8">(1,4,8,9)</text>
    
    <text x="0" y="175" text-anchor="middle" fill="#44aaff" font-size="11">O(3,1;ℤ): Integer Lorentz</text>
    <text x="0" y="190" text-anchor="middle" fill="#888899" font-size="10">Discrete symmetries</text>
  </g>
  
  <!-- Bottom panel: Key insight -->
  <rect x="100" y="460" width="600" height="30" fill="#1a1a3e" stroke="#444466" rx="5"/>
  <text x="400" y="480" text-anchor="middle" fill="#ffdd88" font-family="Georgia, serif" font-size="12" font-style="italic">
    "The geometry of spacetime and the arithmetic of integers share the same symmetry group."
  </text>
</svg>
