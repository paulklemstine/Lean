<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg14" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a1a2e" />
      <stop offset="100%" style="stop-color:#2a0a2e" />
    </linearGradient>
    <marker id="arrow14" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ecdc4"/>
    </marker>
  </defs>
  
  <rect width="900" height="400" fill="url(#bg14)" rx="12"/>
  
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Complete Factoring Pipeline: N → p × q</text>
  <text x="450" y="55" text-anchor="middle" fill="#aaaacc" font-size="11">Every step formalized in Lean 4 — zero unverified assumptions</text>
  
  <!-- Pipeline boxes -->
  <!-- Step 1: Input -->
  <rect x="30" y="90" width="120" height="80" fill="#1a2a3e" stroke="#3498db" stroke-width="2" rx="8"/>
  <text x="90" y="115" text-anchor="middle" fill="#3498db" font-size="12" font-weight="bold">INPUT</text>
  <text x="90" y="135" text-anchor="middle" fill="#5dade2" font-size="11">N = p × q</text>
  <text x="90" y="155" text-anchor="middle" fill="#88bbdd" font-size="9">semiprime</text>
  
  <line x1="150" y1="130" x2="180" y2="130" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrow14)"/>
  
  <!-- Step 2: Lattice Construction -->
  <rect x="185" y="80" width="140" height="100" fill="#1a2a2e" stroke="#2ecc71" stroke-width="2" rx="8"/>
  <text x="255" y="105" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="bold">CONSTRUCT</text>
  <text x="255" y="122" text-anchor="middle" fill="#5dff8e" font-size="10">L₄(N) = {(x,y,z):</text>
  <text x="255" y="137" text-anchor="middle" fill="#5dff8e" font-size="10">N | x²+y²+z²}</text>
  <text x="255" y="155" text-anchor="middle" fill="#88ddaa" font-size="9">SL(2,ℤ) parametric</text>
  <text x="255" y="168" text-anchor="middle" fill="#88ddaa" font-size="9">basis generation</text>
  
  <line x1="325" y1="130" x2="355" y2="130" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrow14)"/>
  
  <!-- Step 3: BKZ Reduction -->
  <rect x="360" y="80" width="130" height="100" fill="#2a1a2e" stroke="#9b59b6" stroke-width="2" rx="8"/>
  <text x="425" y="105" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="bold">BKZ REDUCE</text>
  <text x="425" y="125" text-anchor="middle" fill="#bb79d6" font-size="10">Find short</text>
  <text x="425" y="140" text-anchor="middle" fill="#bb79d6" font-size="10">vectors v_i</text>
  <text x="425" y="158" text-anchor="middle" fill="#aa88cc" font-size="9">‖v‖ ≈ N^{α}</text>
  <text x="425" y="171" text-anchor="middle" fill="#aa88cc" font-size="9">α ≈ 0.175 − 0.30</text>
  
  <line x1="490" y1="130" x2="520" y2="130" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrow14)"/>
  
  <!-- Step 4: GCD Extraction -->
  <rect x="525" y="80" width="140" height="100" fill="#2a2a1a" stroke="#f39c12" stroke-width="2" rx="8"/>
  <text x="595" y="105" text-anchor="middle" fill="#f39c12" font-size="11" font-weight="bold">EXTRACT</text>
  <text x="595" y="122" text-anchor="middle" fill="#ffcc44" font-size="10">g = gcd(x²+y², N)</text>
  <text x="595" y="139" text-anchor="middle" fill="#ffcc44" font-size="10">18 candidates</text>
  <text x="595" y="156" text-anchor="middle" fill="#ddaa44" font-size="9">+ enhanced combos</text>
  <text x="595" y="169" text-anchor="middle" fill="#ddaa44" font-size="9">+ Gram matrix GCDs</text>
  
  <line x1="665" y1="130" x2="695" y2="130" stroke="#4ecdc4" stroke-width="2" marker-end="url(#arrow14)"/>
  
  <!-- Step 5: Output -->
  <rect x="700" y="90" width="160" height="80" fill="#1a3a1a" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="780" y="115" text-anchor="middle" fill="#27ae60" font-size="12" font-weight="bold">OUTPUT</text>
  <text x="780" y="135" text-anchor="middle" fill="#5dff8e" font-size="11">N = g × (N/g)</text>
  <text x="780" y="155" text-anchor="middle" fill="#88ddaa" font-size="9">non-trivial factors</text>
  
  <!-- Lean 4 proof chain below -->
  <text x="450" y="220" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Lean 4 Proof Chain</text>
  
  <!-- Proof boxes -->
  <rect x="30" y="240" width="160" height="55" fill="#0a0a2e" stroke="#4ecdc4" stroke-width="1" rx="6"/>
  <text x="110" y="260" text-anchor="middle" fill="#4ecdc4" font-size="9" font-weight="bold">quad_lattice_scalar_closed</text>
  <text x="110" y="278" text-anchor="middle" fill="#7ee8e0" font-size="8">L₄(N) is a ℤ-lattice</text>
  <text x="110" y="290" text-anchor="middle" fill="#44aa88" font-size="8">✓ verified</text>
  
  <rect x="205" y="240" width="160" height="55" fill="#0a0a2e" stroke="#4ecdc4" stroke-width="1" rx="6"/>
  <text x="285" y="260" text-anchor="middle" fill="#4ecdc4" font-size="9" font-weight="bold">parametric_quadruple</text>
  <text x="285" y="278" text-anchor="middle" fill="#7ee8e0" font-size="8">a²+b²+c² = d² by ring</text>
  <text x="285" y="290" text-anchor="middle" fill="#44aa88" font-size="8">✓ verified</text>
  
  <rect x="380" y="240" width="160" height="55" fill="#0a0a2e" stroke="#4ecdc4" stroke-width="1" rx="6"/>
  <text x="460" y="260" text-anchor="middle" fill="#4ecdc4" font-size="9" font-weight="bold">no_nontrivial_boost</text>
  <text x="460" y="278" text-anchor="middle" fill="#7ee8e0" font-size="8">Pell obstacle: μ=0</text>
  <text x="460" y="290" text-anchor="middle" fill="#44aa88" font-size="8">✓ verified</text>
  
  <rect x="555" y="240" width="160" height="55" fill="#0a0a2e" stroke="#4ecdc4" stroke-width="1" rx="6"/>
  <text x="635" y="260" text-anchor="middle" fill="#4ecdc4" font-size="9" font-weight="bold">factor_extraction_sound</text>
  <text x="635" y="278" text-anchor="middle" fill="#7ee8e0" font-size="8">1&lt;g&lt;N → N = g×(N/g)</text>
  <text x="635" y="290" text-anchor="middle" fill="#44aa88" font-size="8">✓ verified</text>
  
  <rect x="730" y="240" width="140" height="55" fill="#0a0a2e" stroke="#4ecdc4" stroke-width="1" rx="6"/>
  <text x="800" y="260" text-anchor="middle" fill="#4ecdc4" font-size="9" font-weight="bold">minkowski_exponent_gap</text>
  <text x="800" y="278" text-anchor="middle" fill="#7ee8e0" font-size="8">1/d₂ &lt; 1/d₁</text>
  <text x="800" y="290" text-anchor="middle" fill="#44aa88" font-size="8">✓ verified</text>
  
  <!-- New theorems -->
  <rect x="30" y="310" width="200" height="55" fill="#0a0a2e" stroke="#ff6b6b" stroke-width="1" rx="6"/>
  <text x="130" y="330" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">NEW: coppersmith_lattice_connection</text>
  <text x="130" y="348" text-anchor="middle" fill="#ff8e8e" font-size="8">Lattice ↔ polynomial roots</text>
  <text x="130" y="360" text-anchor="middle" fill="#44aa88" font-size="8">✓ verified</text>
  
  <rect x="245" y="310" width="200" height="55" fill="#0a0a2e" stroke="#ff6b6b" stroke-width="1" rx="6"/>
  <text x="345" y="330" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">NEW: enhanced_extraction_thm</text>
  <text x="345" y="348" text-anchor="middle" fill="#ff8e8e" font-size="8">Linear combos preserve L₄(N)</text>
  <text x="345" y="360" text-anchor="middle" fill="#44aa88" font-size="8">✓ verified</text>
  
  <rect x="460" y="310" width="200" height="55" fill="#0a0a2e" stroke="#ff6b6b" stroke-width="1" rx="6"/>
  <text x="560" y="330" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">NEW: dim_optimal_bound</text>
  <text x="560" y="348" text-anchor="middle" fill="#ff8e8e" font-size="8">Pairwise GCDs grow as d(d−1)/2</text>
  <text x="560" y="360" text-anchor="middle" fill="#44aa88" font-size="8">✓ verified</text>
  
  <rect x="675" y="310" width="195" height="55" fill="#0a0a2e" stroke="#ff6b6b" stroke-width="1" rx="6"/>
  <text x="773" y="330" text-anchor="middle" fill="#ff6b6b" font-size="9" font-weight="bold">NEW: lagrange_four_sq_lattice</text>
  <text x="773" y="348" text-anchor="middle" fill="#ff8e8e" font-size="8">4-square → quaternion norms</text>
  <text x="773" y="360" text-anchor="middle" fill="#44aa88" font-size="8">✓ verified</text>
  
  <!-- Bottom -->
  <text x="450" y="390" text-anchor="middle" fill="#555577" font-size="10">All theorems verified with propext, Classical.choice, Quot.sound only — no sorry, no axiom</text>
</svg>
