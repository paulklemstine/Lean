<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Status — Research Engine Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --surface2: #1e293b;
            --border: #2d3a52;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent2: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header h1 .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .header-nav { display: flex; gap: 12px; align-items: center; }
        .header-nav a {
            color: var(--accent2);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .header-nav a:hover { background: var(--surface2); border-color: var(--accent); }
        .refresh-info { font-size: 0.75rem; color: var(--text-muted); }
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            overflow: hidden;
        }
        .card.wide { grid-column: span 2; }
        .card h2 {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h2 .icon { font-size: 1rem; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }
        .stat {
            background: var(--surface2);
            border-radius: 8px;
            padding: 12px 14px;
        }
        .stat .value {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Fira Code', monospace;
        }
        .stat .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 2px;
        }
        .domain-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .domain-bar-row .domain-name {
            width: 110px;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: right;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .domain-bar-row .bar-container {
            flex: 1;
            height: 18px;
            background: var(--surface2);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .domain-bar-row .bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            color: white;
            min-width: 24px;
        }
        .domain-bar-row .count {
            width: 30px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: left;
        }
        .job-row {
            display: grid;
            grid-template-columns: 80px 1fr 100px 80px;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            align-items: center;
        }
        .job-row:last-child { border-bottom: none; }
        .job-row .domain {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-align: center;
        }
        .job-row .title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
        }
        .job-row .age {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .job-row .status {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            text-align: center;
        }
        .status-dispatched { background: var(--info); color: white; }
        .status-completed { background: var(--success); color: white; }
        .status-failed { background: var(--error); color: white; }
        .insight-tag {
            display: inline-block;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            margin: 3px;
            font-size: 0.75rem;
        }
        .insight-tag .count {
            font-weight: 700;
            color: var(--accent2);
            margin-right: 4px;
        }
        .barrier-list { font-size: 0.8rem; line-height: 1.6; }
        .barrier-list li { margin-bottom: 4px; color: var(--text); }
        .barrier-list li .theorem { color: var(--accent2); font-weight: 500; }
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        .warning-badge {
            background: var(--warning);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }
        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .card.wide { grid-column: span 1; }
            .job-row { grid-template-columns: 60px 1fr 60px; }
            .job-row .age { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="dot"></span> Aether Status</h1>
        <div class="header-nav">
            <span class="refresh-info" id="refresh-info">Loading...</span>
            <a href="index.html">← Graph View</a>
        </div>
    </header>

    <main id="dashboard">
        <!-- Overview Stats -->
        <div class="card wide">
            <h2><span class="icon">📊</span> Overview</h2>
            <div class="stat-grid" id="overview-stats">
                <div class="stat"><div class="value" id="stat-inflight">—</div><div class="label">Inflight</div></div>
                <div class="stat"><div class="value" id="stat-available">—</div><div class="label">Available</div></div>
                <div class="stat"><div class="value" id="stat-completed">—</div><div class="label">Completed</div></div>
                <div class="stat"><div class="value" id="stat-pruned">—</div><div class="label">Pruned</div></div>
                <div class="stat"><div class="value" id="stat-insights">—</div><div class="label">Insights</div></div>
            </div>
        </div>

        <!-- Domain Distribution -->
        <div class="card">
            <h2><span class="icon">🌐</span> Domain Distribution</h2>
            <div id="domain-bars"></div>
        </div>

        <!-- Inflight Jobs -->
        <div class="card wide">
            <h2><span class="icon">🚀</span> Inflight Jobs <span id="job-count"></span></h2>
            <div id="inflight-jobs"></div>
        </div>

        <!-- Insights -->
        <div class="card">
            <h2><span class="icon">💡</span> Insight Store</h2>
            <div id="insights-content"><div class="empty-state">No insights extracted yet — waiting for first cycle with insight extraction enabled.</div></div>
        </div>

        <!-- Recent Cycles -->
        <div class="card">
            <h2><span class="icon">🔬</span> Recent Cycles</h2>
            <div id="recent-cycles"></div>
        </div>
    </main>

    <script>
    const COLORS = {
        Algebra: '#6366f1', Applications: '#8b5cf6', Bridges: '#a855f7',
        Computation: '#3b82f6', Cryptography: '#06b6d4', EML: '#14b8a6',
        Geometry: '#22c55e', Logic: '#eab308', MachineLearning: '#f97316',
        Novelty: '#ec4899', Physics: '#ef4444', Pythagorean: '#f59e0b',
        Shared: '#94a3b8', Tropical: '#10b981', Speculative: '#6b7280'
    };

    async function loadJSON(url) {
        try {
            const r = await fetch(url, { cache: 'no-store' });
            if (!r.ok) return null;
            return await r.json();
        } catch { return null; }
    }

    function formatAge(dispatchTime) {
        if (!dispatchTime) return '?';
        const mins = Math.floor((Date.now()/1000 - dispatchTime) / 60);
        if (mins < 60) return `${mins}m`;
        const hrs = Math.floor(mins / 60);
        return `${hrs}h${mins%60}m`;
    }

    async function refresh() {
        const now = new Date();
        document.getElementById('refresh-info').textContent = `Updated ${now.toLocaleTimeString()}`;

        // Load data
        const [fd, inflight, insights, research] = await Promise.all([
            loadJSON('future_directions.json'),
            loadJSON('aether_status/inflight_jobs.json'),
            loadJSON('aether_status/insights.json'),
            null, // research memory is JSONL, skip for now
        ]);

        // Direction stats
        const dirs = fd?.directions || fd || [];
        const statuses = {};
        dirs.forEach(d => { statuses[d.status] = (statuses[d.status] || 0) + 1; });
        document.getElementById('stat-available').textContent = statuses.available || 0;
        document.getElementById('stat-completed').textContent = statuses.completed || 0;
        document.getElementById('stat-inflight').textContent = statuses.in_progress || 0;
        document.getElementById('stat-pruned').textContent = statuses.pruned || 0;

        // Insight stats
        if (insights) {
            const total = (insights.barriers?.length || 0) + (insights.strategies?.length || 0) +
                         (insights.cross_domain_bridges?.length || 0) + Object.keys(insights.cost_estimates || {}).length;
            document.getElementById('stat-insights').textContent = total;

            let html = '';
            if (insights.barriers?.length) {
                html += '<div style="margin-bottom:12px"><span class="insight-tag"><span class="count">' +
                    insights.barriers.length + '</span>barriers</span>';
                html += '<div class="barrier-list"><ul>';
                insights.barriers.slice(0, 5).forEach(b => {
                    html += `<li><span class="theorem">${b.theorem || '?'}</span> (${b.domain || '?'}) — ${b.description || ''}</li>`;
                });
                html += '</ul></div></div>';
            }
            if (insights.strategies?.length) {
                html += '<div style="margin-bottom:12px">';
                insights.strategies.slice(0, 4).forEach(s => {
                    html += `<span class="insight-tag"><span class="count">${s.success_rate || '?'}</span>${s.pattern || s.description?.split(' ').slice(0, 4).join(' ')}</span>`;
                });
                html += '</div>';
            }
            if (insights.cost_estimates && Object.keys(insights.cost_estimates).length > 0) {
                html += '<div style="margin-top:8px;font-size:0.75rem;color:var(--text-muted)">Cost estimates: ';
                Object.entries(insights.cost_estimates).slice(0, 6).forEach(([d, c]) => {
                    const score = typeof c === 'object' ? c.cost_score : c;
                    html += `<span class="insight-tag">${d}: ${typeof score === 'number' ? score.toFixed(2) : '?'}</span>`;
                });
                html += '</div>';
            }
            if (insights.tactic_patterns && Object.keys(insights.tactic_patterns).length > 0) {
                html += '<div style="margin-top:8px;font-size:0.75rem;color:var(--text-muted)">Tactic patterns: ';
                Object.entries(insights.tactic_patterns).slice(0, 4).forEach(([d, p]) => {
                    const top = Object.entries(p.tactic_counts || {}).sort((a,b) => b[1]-a[1]).slice(0, 2).map(t => t[0]).join(', ');
                    html += `<span class="insight-tag">${d}: ${top}</span>`;
                });
                html += '</div>';
            }
            if (!html) html = '<div class="empty-state">No insights extracted yet.</div>';
            document.getElementById('insights-content').innerHTML = html;
        } else {
            document.getElementById('stat-insights').textContent = '0';
        }

        // Domain distribution
        const domainCounts = {};
        dirs.forEach(d => {
            (d.domains || []).forEach(dom => { domainCounts[dom] = (domainCounts[dom] || 0) + 1; });
        });
        const maxCount = Math.max(...Object.values(domainCounts), 1);
        const sortedDomains = Object.entries(domainCounts).sort((a, b) => b[1] - a[1]);
        let domainHTML = '';
        sortedDomains.forEach(([domain, count]) => {
            const pct = (count / maxCount * 100).toFixed(1);
            const color = COLORS[domain] || '#6366f1';
            domainHTML += `<div class="domain-bar-row">
                <span class="domain-name">${domain}</span>
                <div class="bar-container"><div class="bar" style="width:${pct}%;background:${color}">${count}</div></div>
                <span class="count">${count}</span>
            </div>`;
        });
        document.getElementById('domain-bars').innerHTML = domainHTML || '<div class="empty-state">No directions</div>';

        // Inflight jobs
        const jobs = inflight ? (Array.isArray(inflight) ? inflight : Object.values(inflight)) : [];
        const activeJobs = jobs.filter(j => j.status === 'dispatched' || j.status === 'running');
        document.getElementById('job-count').textContent = `(${activeJobs.length} active)`;

        // Count inflight domains
        const inflightDomains = {};
        activeJobs.forEach(j => {
            const d = j.concept?.domain || '?';
            inflightDomains[d] = (inflightDomains[d] || 0) + 1;
        });

        let jobsHTML = '';
        if (activeJobs.length === 0) {
            jobsHTML = '<div class="empty-state">No inflight jobs</div>';
        } else {
            // Domain saturation warnings
            let warningHTML = '';
            Object.entries(inflightDomains).forEach(([d, c]) => {
                if (c >= 3) warningHTML += `<span class="warning-badge">⚠ ${d}: ${c} jobs (saturated)</span>`;
            });
            if (warningHTML) jobsHTML += `<div style="margin-bottom:12px">${warningHTML}</div>`;

            activeJobs.forEach(j => {
                const domain = j.concept?.domain || '?';
                const title = j.concept?.title || 'Unknown';
                const age = formatAge(j.dispatch_time);
                const status = j.status || 'dispatched';
                const ageMin = j.dispatch_time ? (Date.now()/1000 - j.dispatch_time) / 60 : 0;
                const staleClass = ageMin > 90 ? 'style="color:var(--warning)"' : '';
                const staleBadge = ageMin > 120 ? '<span class="warning-badge">STALE</span>' : '';
                jobsHTML += `<div class="job-row">
                    <span class="domain" style="background:${COLORS[domain] || 'var(--accent)'}">${domain}</span>
                    <span class="title">${title.slice(0, 60)}${staleBadge}</span>
                    <span class="age" ${staleClass}>${age}</span>
                    <span class="status status-${status}">${status}</span>
                </div>`;
            });
        }
        document.getElementById('inflight-jobs').innerHTML = jobsHTML;

        // Recent cycles (from completed directions)
        const completed = dirs.filter(d => d.status === 'completed')
            .sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''))
            .slice(0, 8);
        let cyclesHTML = '';
        if (completed.length === 0) {
            cyclesHTML = '<div class="empty-state">No completed cycles yet</div>';
        } else {
            completed.forEach(d => {
                const ts = d.timestamp ? new Date(d.timestamp).toLocaleDateString() : '?';
                const domains = (d.domains || []).join(', ');
                cyclesHTML += `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:0.8rem">
                    <span style="color:var(--accent2);font-weight:500">${d.title?.slice(0, 50)}</span>
                    <span style="color:var(--text-muted);margin-left:8px">${domains}</span>
                    <span style="color:var(--text-muted);float:right">${ts}</span>
                </div>`;
            });
        }
        document.getElementById('recent-cycles').innerHTML = cyclesHTML;
    }

    // Initial load + auto-refresh every 60 seconds
    refresh();
    setInterval(refresh, 60000);
    </script>
</body>
</html>
