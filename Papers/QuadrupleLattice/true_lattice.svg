<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" width="750" height="520">
<style>
  text { font-family: 'Georgia', 'Times New Roman', serif; }
  .title { font-size: 18px; font-weight: bold; fill: #1a1a2e; }
  .subtitle { font-size: 13px; fill: #4a4a6a; }
  .label { font-size: 11px; fill: #333; }
  .small { font-size: 9px; fill: #666; }
  .math { font-family: 'Times New Roman', serif; font-style: italic; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
</defs>
<rect width="750" height="520" fill="#fafaf8"/>
<text x="375" y="30" text-anchor="middle" class="title">The Sum-of-Three-Squares Lattice Λ(N, r₁, r₂)</text>
<text x="375" y="52" text-anchor="middle" class="subtitle">A genuine lattice whose short vectors encode divisibility by N</text>
<rect x="30" y="70" width="690" height="120" fill="#f0f8ff" stroke="#4a86c8" rx="8"/>
<text x="375" y="95" text-anchor="middle" class="label" font-weight="bold">Construction</text>
<text x="375" y="115" text-anchor="middle" class="label">Given N and r₁, r₂ with N | (r₁² + r₂² + 1):</text>
<text x="375" y="140" text-anchor="middle" class="label math">Λ(N, r₁, r₂) = { (x, y, z) ∈ ℤ³ : N | (x − r₁z)  and  N | (y − r₂z) }</text>
<text x="375" y="165" text-anchor="middle" class="small">This IS a lattice: closed under +, −, and contains 0</text>
<rect x="30" y="205" width="340" height="140" fill="#f5fff0" stroke="#4ac84a" rx="8"/>
<text x="200" y="230" text-anchor="middle" class="label" font-weight="bold" fill="#2d7d2d">Basis Vectors</text>
<text x="200" y="255" text-anchor="middle" class="label math">b₁ = (N, 0, 0)</text>
<text x="200" y="278" text-anchor="middle" class="label math">b₂ = (0, N, 0)</text>
<text x="200" y="301" text-anchor="middle" class="label math">b₃ = (r₁, r₂, 1)</text>
<text x="200" y="330" text-anchor="middle" class="small" fill="#2d7d2d">det(B) = N² (proven in Lean 4)</text>
<rect x="390" y="205" width="330" height="140" fill="#fff5f0" stroke="#c84a4a" rx="8"/>
<text x="555" y="230" text-anchor="middle" class="label" font-weight="bold" fill="#7d2d2d">Key Properties</text>
<text x="555" y="258" text-anchor="middle" class="label">✓ True lattice (subgroup of ℤ³)</text>
<text x="555" y="281" text-anchor="middle" class="label">✓ N | (x² + y² + z²) for all (x,y,z) ∈ Λ</text>
<text x="555" y="304" text-anchor="middle" class="label">✓ Determinant = N²</text>
<text x="555" y="330" text-anchor="middle" class="small" fill="#7d2d2d">All properties formally verified</text>
<line x1="375" y1="360" x2="375" y2="395" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="375" y="380" text-anchor="start" x="390" class="small">LLL/BKZ reduction</text>
<rect x="100" y="400" width="550" height="100" fill="#fffff0" stroke="#c8a84a" rx="8"/>
<text x="375" y="425" text-anchor="middle" class="label" font-weight="bold" fill="#7d6d2d">Factoring Application</text>
<text x="375" y="450" text-anchor="middle" class="label">Find short vector (x, y, z) with x² + y² + z² = k · N</text>
<text x="375" y="475" text-anchor="middle" class="label">If 1 &lt; gcd(k, N) &lt; N → nontrivial factor!</text>
<text x="375" y="495" text-anchor="middle" class="small" fill="#7d6d2d">Minkowski bound: λ₁ ≤ 1.26 · N^(2/3)  |  Need: λ₁ ≲ √N</text>
</svg>
