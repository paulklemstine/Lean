<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
<style>
  text { font-family: 'Georgia', 'Times New Roman', serif; }
  .title { font-size: 18px; font-weight: bold; fill: #1a1a2e; }
  .subtitle { font-size: 13px; fill: #4a4a6a; }
  .label { font-size: 11px; fill: #333; }
  .small { font-size: 9px; fill: #666; }
  .math { font-family: 'Times New Roman', serif; font-style: italic; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
</defs>
<rect width="700" height="400" fill="#fafaf8"/>
<text x="350" y="30" text-anchor="middle" class="title">L₄(3) is NOT a Lattice: Counterexample</text>
<text x="350" y="50" text-anchor="middle" class="subtitle">The sum-of-squares congruence set fails closure under addition</text>
<rect x="30" y="80" width="190" height="260" fill="white" stroke="#3498db" stroke-width="2" rx="8"/>
<text x="125" y="105" text-anchor="middle" class="label" fill="#3498db" font-weight="bold">v = (2, 1, 2)</text>
<rect x="250" y="80" width="190" height="260" fill="white" stroke="#2ecc71" stroke-width="2" rx="8"/>
<text x="345" y="105" text-anchor="middle" class="label" fill="#2ecc71" font-weight="bold">w = (1, 2, 2)</text>
<rect x="470" y="80" width="190" height="260" fill="white" stroke="#e74c3c" stroke-width="2" rx="8"/>
<text x="565" y="105" text-anchor="middle" class="label" fill="#e74c3c" font-weight="bold">v + w = (3, 3, 4)</text>
<text x="125" y="130" text-anchor="middle" class="label">2² + 1² + 2² = ?</text>
<text x="125" y="155" text-anchor="middle" class="label">4 + 1 + 4 = 9</text>
<text x="125" y="185" text-anchor="middle" class="label" font-weight="bold">9 = 3²  ✓</text>
<text x="125" y="220" text-anchor="middle" class="label" fill="#3498db">3² | 9</text>
<text x="125" y="250" text-anchor="middle" class="label" fill="#3498db">v ∈ L₄(3)  ✓</text>
<circle cx="125" cy="280" r="15" fill="#3498db" opacity="0.2"/>
<text x="125" y="285" text-anchor="middle" class="label" fill="#3498db" font-size="20">✓</text>
<text x="345" y="130" text-anchor="middle" class="label">1² + 2² + 2² = ?</text>
<text x="345" y="155" text-anchor="middle" class="label">1 + 4 + 4 = 9</text>
<text x="345" y="185" text-anchor="middle" class="label" font-weight="bold">9 = 3²  ✓</text>
<text x="345" y="220" text-anchor="middle" class="label" fill="#2ecc71">3² | 9</text>
<text x="345" y="250" text-anchor="middle" class="label" fill="#2ecc71">w ∈ L₄(3)  ✓</text>
<circle cx="345" cy="280" r="15" fill="#2ecc71" opacity="0.2"/>
<text x="345" y="285" text-anchor="middle" class="label" fill="#2ecc71" font-size="20">✓</text>
<text x="565" y="130" text-anchor="middle" class="label">3² + 3² + 4² = ?</text>
<text x="565" y="155" text-anchor="middle" class="label">9 + 9 + 16 = 34</text>
<text x="565" y="185" text-anchor="middle" class="label" font-weight="bold">34 / 9 ≈ 3.78  ✗</text>
<text x="565" y="220" text-anchor="middle" class="label" fill="#e74c3c">3² ∤ 34</text>
<text x="565" y="250" text-anchor="middle" class="label" fill="#e74c3c">v+w ∉ L₄(3)  ✗</text>
<circle cx="565" cy="280" r="15" fill="#e74c3c" opacity="0.2"/>
<text x="565" y="285" text-anchor="middle" class="label" fill="#e74c3c" font-size="20">✗</text>
<text x="235" y="210" text-anchor="middle" class="title" fill="#333" font-size="28">+</text>
<text x="455" y="210" text-anchor="middle" class="title" fill="#333" font-size="28">=</text>
<rect x="100" y="355" width="500" height="35" fill="#ffeaea" stroke="#e74c3c" rx="5"/>
<text x="350" y="377" text-anchor="middle" class="label" fill="#c0392b">Conclusion: L₄(N) = {(x,y,z) : N² | x²+y²+z²} is NOT a sublattice of ℤ³</text>
</svg>
