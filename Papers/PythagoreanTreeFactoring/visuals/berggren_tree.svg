  <line x1="450.0" y1="205" x2="450.0" y2="285" class="edge"/>
  <text x="450.0" y="240.0" class="node-small" text-anchor="middle">B₂</text>
  <line x1="450.0" y1="205" x2="540.0" y2="285" class="edge"/>
