<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"
     viewBox="0 0 800 500" font-family="Georgia, serif">
  <title>The Dimensional Escape</title>
  <defs>
    <style>
      .title { font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-size: 13px; fill: #7f8c8d; }
      .node-text { font-size: 10px; fill: #2c3e50; text-anchor: middle; }
      .node-small { font-size: 8px; fill: #95a5a6; text-anchor: middle; }
      .axis-label { font-size: 11px; fill: #2c3e50; }
      .annotation { font-size: 10px; fill: #e74c3c; font-style: italic; }
      .edge { stroke: #bdc3c7; stroke-width: 1.5; fill: none; }
      .edge-highlight { stroke: #e74c3c; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#7f8c8d"/>
    </marker>
  </defs>
  <text x="400" y="30" class="title" text-anchor="middle">Breaking the √N Barrier: From 2D to 3D</text>
  <text x="400" y="50" class="subtitle" text-anchor="middle">Pythagorean triples (2D) → Pythagorean quadruples (3D)</text>
  <rect x="30" y="80" width="340" height="380" fill="#fadbd8" stroke="#e74c3c" stroke-width="3" rx="5"/>
  <text x="200" y="110" class="axis-label" text-anchor="middle">2D: Pythagorean Triples</text>
  <text x="200" y="135" class="node-text" text-anchor="middle">a² + b² = c²</text>
  <text x="200" y="170" class="node-text" text-anchor="middle">• Berggren ternary tree</text>
  <text x="200" y="195" class="node-text" text-anchor="middle">• Euclid parameters (m, n)</text>
  <text x="200" y="220" class="node-text" text-anchor="middle">• Tree descent = Gauss reduction</text>
  <text x="200" y="245" class="node-text" text-anchor="middle">• Euclidean algorithm on m/n</text>
  <text x="200" y="270" class="node-text" text-anchor="middle"></text>
  <text x="200" y="295" class="node-text" text-anchor="middle">Complexity: Θ(√N)</text>
  <text x="200" y="320" class="node-text" text-anchor="middle"></text>
  <text x="200" y="345" class="annotation" text-anchor="middle">★ OPTIMAL in 2D</text>
  <text x="200" y="370" class="node-text" text-anchor="middle">No 2D method can beat this</text>
  <rect x="430" y="80" width="340" height="380" fill="#d5f5e3" stroke="#27ae60" stroke-width="3" rx="5"/>
  <text x="600" y="110" class="axis-label" text-anchor="middle">3D: Pythagorean Quadruples</text>
  <text x="600" y="135" class="node-text" text-anchor="middle">a² + b² + c² = d²</text>
  <text x="600" y="170" class="node-text" text-anchor="middle">• O(3,1;ℤ) Lorentz group</text>
  <text x="600" y="195" class="node-text" text-anchor="middle">• Lattice L₄ in 3 dimensions</text>
  <text x="600" y="220" class="node-text" text-anchor="middle">• LLL / BKZ reduction</text>
  <text x="600" y="245" class="node-text" text-anchor="middle">• Gauss NO LONGER optimal</text>
  <text x="600" y="270" class="node-text" text-anchor="middle"></text>
  <text x="600" y="295" class="node-text" text-anchor="middle">Target: sub-√N factoring</text>
  <text x="600" y="320" class="node-text" text-anchor="middle"></text>
  <text x="600" y="345" class="annotation" text-anchor="middle">★ OPEN DIRECTION</text>
  <text x="600" y="370" class="node-text" text-anchor="middle">Structured basis may help</text>
  <line x1="370" y1="270" x2="430" y2="270" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="260" class="node-small" text-anchor="middle">escape</text>
</svg>