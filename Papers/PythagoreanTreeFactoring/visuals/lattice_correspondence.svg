<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450"
     viewBox="0 0 900 450" font-family="Georgia, serif">
  <title>Lattice-Tree Correspondence</title>
  <defs>
    <style>
      .title { font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-size: 13px; fill: #7f8c8d; }
      .node-text { font-size: 10px; fill: #2c3e50; text-anchor: middle; }
      .node-small { font-size: 8px; fill: #95a5a6; text-anchor: middle; }
      .axis-label { font-size: 11px; fill: #2c3e50; }
      .annotation { font-size: 10px; fill: #e74c3c; font-style: italic; }
      .edge { stroke: #bdc3c7; stroke-width: 1.5; fill: none; }
      .edge-highlight { stroke: #e74c3c; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#7f8c8d"/>
    </marker>
  </defs>
  <text x="450" y="30" class="title" text-anchor="middle">The Lattice-Tree Correspondence Theorem</text>
  <text x="450" y="50" class="subtitle" text-anchor="middle">Berggren descent ≡ Gauss reduction ≡ Euclidean algorithm</text>
  <rect x="20" y="70" width="400" height="350" fill="#fdf2e9" stroke="#e67e22" stroke-width="1" rx="5"/>
  <text x="220" y="95" class="axis-label" text-anchor="middle">Berggren Tree Descent</text>
  <text x="100" y="125" class="node-text" text-anchor="middle">(7, 4)</text>
  <text x="220" y="125" class="annotation" text-anchor="middle">→ M₃⁻¹ →</text>
  <text x="340" y="125" class="node-text" text-anchor="middle">(5, 4)</text>
  <text x="100" y="180" class="node-text" text-anchor="middle">(5, 4)</text>
  <text x="220" y="180" class="annotation" text-anchor="middle">→ M₁⁻¹ →</text>
  <text x="340" y="180" class="node-text" text-anchor="middle">(4, 3)</text>
  <text x="100" y="235" class="node-text" text-anchor="middle">(4, 3)</text>
  <text x="220" y="235" class="annotation" text-anchor="middle">→ M₃⁻¹ →</text>
  <text x="340" y="235" class="node-text" text-anchor="middle">(2, 3)</text>
  <text x="100" y="290" class="node-text" text-anchor="middle">(2, 3)</text>
  <text x="220" y="290" class="annotation" text-anchor="middle">→ M₁⁻¹ →</text>
  <text x="340" y="290" class="node-text" text-anchor="middle">(3, 1)</text>
  <text x="100" y="345" class="node-text" text-anchor="middle">(3, 1)</text>
  <text x="220" y="345" class="annotation" text-anchor="middle">→ M₃⁻¹ →</text>
  <text x="340" y="345" class="node-text" text-anchor="middle">(1, 1)</text>
  <rect x="460" y="70" width="420" height="350" fill="#eaf2f8" stroke="#2980b9" stroke-width="1" rx="5"/>
  <text x="670" y="95" class="axis-label" text-anchor="middle">Euclidean Algorithm</text>
  <text x="620" y="125" class="node-text" text-anchor="middle">7 = 1·4 + 3</text>
  <text x="820" y="125" class="node-small" text-anchor="middle">q = 1</text>
  <text x="620" y="180" class="node-text" text-anchor="middle">4 = 1·3 + 1</text>
  <text x="820" y="180" class="node-small" text-anchor="middle">q = 1</text>
  <text x="620" y="235" class="node-text" text-anchor="middle">3 = 3·1 + 0</text>
  <text x="820" y="235" class="node-small" text-anchor="middle">q = 3</text>
  <text x="620" y="290" class="node-text" text-anchor="middle">GCD(7,4) = 1</text>
  <text x="820" y="290" class="node-small" text-anchor="middle">done</text>
  <text x="450" y="420" class="annotation" text-anchor="middle">Both compute the continued fraction [1; 1, 3] of 7/4</text>
</svg>